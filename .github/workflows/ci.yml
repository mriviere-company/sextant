# Actions are pinned to a full commit SHA (the comment carries the human version).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, tests, corpus
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sextant
          POSTGRES_PASSWORD: sextant
          POSTGRES_DB: sextant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sextant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable database: the integration tests truncate its tables.
      TEST_DATABASE_URL: postgresql://sextant:sextant@127.0.0.1:5432/sextant_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Tests
        run: make test
      - name: Corpus figures match the snapshot
        run: make check-corpus

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned binary, checksum-verified)
        run: |
          set -e
          cd /tmp
          curl -sL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect (full history)
        run: gitleaks detect --source . --redact -v
