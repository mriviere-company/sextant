# Local PostgreSQL with pgvector for development and benchmarks.
#   docker compose up -d
#   DATABASE_URL=postgresql://sextant:sextant@127.0.0.1:5432/sextant
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sextant
      POSTGRES_PASSWORD: sextant
      POSTGRES_DB: sextant
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sextant"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
