articles:
    moderation_blocking:
        title: "Moderación: denunciar y bloquear"
        category: "beginner"
        order: 12
        tags: "moderacion,denuncia,bloqueo,chat,mensajes,condiciones"
        summary: "Denuncia un mensaje abusivo, bloquea a un jugador indeseable y consulta las reglas de la comunidad que todos aceptan en la primera conexión."
        related: "salon,account_deletion"
        body: |
            <h2 id="condiciones">Condiciones de uso</h2>
            <p>En la primera conexión, cada jugador acepta las <strong>condiciones de uso</strong> y las reglas de la comunidad: respeto a los demás jugadores, ningún contenido ilegal, obsceno o difamatorio, nada de trampas ni multicuentas abusivas. Si las condiciones cambian, deberán aceptarse de nuevo.</p>
            <h2 id="denunciar">Denunciar un mensaje</h2>
            <p>Cada mensaje del salón de chat y cada mensaje privado recibido lleva un icono de <strong>bandera</strong>. Al hacer clic se abre la elección del motivo: insultos o acoso, spam, otro contenido inapropiado. La denuncia llega directamente al equipo de moderación, con una copia del mensaje.</p>
            <p>También se puede denunciar a un jugador globalmente desde su perfil (multicuenta, trampas, insultos, spam). El límite es de tres denuncias al día, y un mismo jugador solo puede denunciarse una vez.</p>
            <h2 id="bloquear">Bloquear a un jugador</h2>
            <p>El botón <strong>Bloquear</strong> del perfil de un jugador oculta inmediatamente todos sus mensajes en los salones de chat e impide cualquier intercambio de mensajes privados, en ambos sentidos.</p>
            <p>La lista de jugadores bloqueados se gestiona en <strong>Mis opciones</strong>: allí se puede desbloquear a cualquiera en todo momento.</p>
    getting_started:
        title: "Primeros pasos"
        category: "beginner"
        order: 1
        tags: "inicio,empezar,nuevo,tutorial,guía"
        summary: "¡Bienvenido! La guía más corta para entender Area Universe y tener éxito en tus primeras horas de juego."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">¿Qué es Area Universe?</h2>
            <p>Area Universe es un juego de <strong>estrategia espacial multijugador</strong>. Diriges un imperio: tus planetas producen recursos, tus naves recorren la galaxia, y tus alianzas sellan el destino de los jugadores.</p>
            <p>Es un juego <strong>que se juega a largo plazo</strong>: tus recursos se acumulan incluso cuando estás desconectado. Unos minutos al día bastan para progresar.</p>

            <h2 id="objectif">Tu objetivo</h2>
            <p>Según el modo de servidor elegido (ver el artículo <em>Modos de juego</em>), el objetivo final varía: aguantar el mayor tiempo posible, dominar la clasificación, ser el último en pie, etc. Pero la receta es siempre la misma:</p>
            <ol>
                <li><strong>Hacer funcionar una economía</strong> (recursos + moneda).</li>
                <li><strong>Construir una flota y una defensa</strong>.</li>
                <li><strong>Aliarte</strong> para tener más peso en grupo.</li>
            </ol>

            <h2 id="premieres-actions">Tus 6 primeras acciones</h2>
            <ol>
                <li><strong>Construye una Mina de Niobio y un Extractor de Agua</strong> en tu planeta inicial.</li>
                <li><strong>Añade una Granja</strong> para alimentar a tus trabajadores.</li>
                <li><strong>Construye una Ciudad</strong> para aumentar el número de trabajadores, tus proveedores de <em>Bitcoins</em> (la moneda del juego).</li>
                <li><strong>Construye un Centro de investigación</strong>, luego un <strong>Astillero espacial</strong> para fabricar tus primeras naves.</li>
                <li><strong>Envía un carguero a vender recursos</strong> a un comerciante: dinero fácil.</li>
                <li><strong>Únete a una alianza</strong>: ganas <strong>+20&nbsp;% de producción</strong> y accedes a las investigaciones de alianza.</li>
            </ol>

            <h2 id="tutoriel">El tutorial integrado</h2>
            <p>Un <strong>tutorial interactivo</strong> te guía paso a paso. Está dividido en <strong>16 etapas</strong> (construcción, flotas, combate…). Cada etapa completada da una recompensa (Bitcoins, Legionarios, naves…).</p>
            <ul>
                <li>Puedes <strong>interrumpirlo</strong> o <strong>retomarlo</strong> en cualquier momento.</li>
                <li>Es accesible desde tus <strong>Preferencias</strong>.</li>
            </ul>

            <h2 id="a-surveiller">A vigilar desde el principio</h2>
            <ul>
                <li><strong>Bitcoins positivos</strong>: cada día a las 18h59 UTC, un balance calcula tus ingresos y costes de mantenimiento. Si pasas a negativo, es el <strong>Game Over económico</strong>.</li>
                <li><strong>Almacenamiento</strong>: si tus almacenes están llenos, la producción se detiene. Construye stocks en consecuencia.</li>
                <li><strong>Misiones diarias</strong>: 3 misiones al día, todas completadas = <strong>+250 Puntos de Guerra</strong>.</li>
            </ul>

            <h2 id="protection-debutant">La protección de los principiantes</h2>
            <p>Durante tus primeros días, estás <strong>protegido</strong>: ningún jugador puede atacarte, saquearte, invadirte ni bombardearte. Así puedes construir tus primeras bases con tranquilidad.</p>
            <p>La protección termina en cuanto se cumple una de estas condiciones:</p>
            <ul>
                <li>Han pasado <strong>7 días</strong> desde la creación de tu comandante.</li>
                <li>Posees un <strong>4.º planeta</strong>.</li>
                <li>Tú mismo envías una <strong>misión ofensiva</strong> (saqueo, invasión o ataque nuclear): renuncias entonces inmediatamente a tu protección.</li>
            </ul>
            <p>Mientras estés protegido, no puedes atacar a los demás sin perder esta protección. Aprovecha para montar una economía y una defensa sólidas antes de lanzarte a la batalla.</p>

    interface_guide:
        title: "Comprender la interfaz"
        category: "beginner"
        order: 2
        tags: "interfaz,pantalla,menú,navegación,botones,planeta activo"
        summary: "Las 3 zonas de la pantalla y cómo navegar sin perderte."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="disposition">Las 3 zonas de la pantalla</h2>
            <ul>
                <li><strong>La barra de recursos, arriba</strong> — tus materias y el nombre de tu <strong>planeta activo</strong>: toca ahí para cambiar de planeta.</li>
                <li><strong>El menú, a la izquierda</strong> — todas las secciones del juego (Imperio, Planetas, Flotas, Alianza, Mensajes…).</li>
                <li><strong>La zona central</strong> — el contenido de la página actual (mapa, lista de flotas, edificios…). Es la única zona que se desplaza.</li>
            </ul>
            <p><em>En el teléfono, el menú de la izquierda se convierte en una barra de iconos pegada al borde izquierdo: los cinco destinos principales quedan visibles en todo momento, y el botón Menú abre el resto en un panel que sube desde abajo.</em></p>

            <h2 id="barre-ressources">La barra de recursos (arriba)</h2>
            <p>Muestra en tiempo real tus 4 recursos principales:</p>
            <ul>
                <li><strong>Niobio</strong> — el mineral básico (edificios, naves).</li>
                <li><strong>Agua</strong> — indispensable para la construcción y las naves.</li>
                <li><strong>Comida</strong> — alimenta a tus trabajadores, Legionarios y Mechas.</li>
                <li><strong>Uranio</strong> — recurso raro, para las bombas nucleares y los desafíos de arena.</li>
            </ul>
            <p>El niobio, el agua, la comida y tus trabajadores avanzan segundo a segundo al ritmo de tu producción, hasta tu límite de almacenamiento. Toca un recurso para ver su producción por hora, bonificaciones incluidas (héroe, campo de esclavos, alianza, embargo).</p>
            <p>Los <strong>Bitcoins</strong> (moneda) y los <strong>Puntos de Guerra (PDG)</strong> también se muestran en la barra de recursos.</p>

            <h2 id="planete-active">Planeta activo: qué significa</h2>
            <p>Cuando tienes varios planetas, solo uno está <strong>activo</strong> a la vez. Todas tus acciones (construir, fabricar una nave, lanzar una flota) se aplican a ese planeta.</p>
            <p>Para cambiarlo: toca el nombre del planeta en la barra de recursos y elige de la lista que sube desde abajo.</p>

            <h2 id="navigation">Orientarse rápidamente</h2>
            <ul>
                <li><strong>Imperio</strong> — visión general (todos tus planetas, investigaciones, economía).</li>
                <li><strong>Planeta</strong> — construcción y gestión del planeta activo.</li>
                <li><strong>Flotas</strong> — crear, enviar y seguir tus naves.</li>
                <li><strong>Mapa</strong> — explorar la galaxia.</li>
                <li><strong>Mensajes / Informes</strong> — todo lo que el juego te señala (combates, llegadas, alianza…).</li>
                <li><strong>Alianza</strong> — tu grupo, la sala de chat, la diplomacia.</li>
            </ul>

    resources_intro:
        title: "Los recursos"
        category: "beginner"
        order: 3
        tags: "recursos,niobio,agua,comida,uranio,producción,almacenamiento,ciclo"
        summary: "Los 4 recursos del juego, cómo se producen y por qué el almacenamiento es crítico."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Los 4 recursos del juego</h2>
            <table>
                <tr><th>Recurso</th><th>Para qué sirve</th><th>Cómo se obtiene</th></tr>
                <tr><td><strong>Niobio</strong></td><td>Construir edificios y naves</td><td>Mina</td></tr>
                <tr><td><strong>Agua</strong></td><td>Construir, fabricar, mantener</td><td>Extractor de agua</td></tr>
                <tr><td><strong>Comida</strong></td><td>Alimentar a tus trabajadores, Legionarios y Mechas</td><td>Granja, luego Granja aeropónica</td></tr>
                <tr><td><strong>Uranio</strong></td><td>Bombas nucleares, desafíos de arena</td><td>Reciclaje de escombros de uranio, victorias contra los Cthulhu</td></tr>
            </table>

            <h2 id="cycle">El ciclo de producción</h2>
            <p>Tus recursos llegan automáticamente, de forma continua. Se habla de <strong>ciclo de producción</strong>: es el ritmo de cálculo interno del juego.</p>
            <ul>
                <li>En un <strong>planeta</strong>: ciclo de <strong>10 minutos</strong>.</li>
                <li>En una <strong>luna</strong>: ciclo de <strong>1 minuto</strong> (mucho más rápido, solo para la comida).</li>
            </ul>
            <p>Cuanto más alto sea el nivel de tu Mina / Extractor / Granja, mayor será la cantidad producida por ciclo.</p>

            <h2 id="bonus">Lo que mejora tu producción</h2>
            <ul>
                <li><strong>Unirse a una alianza</strong>: <strong>+20&nbsp;%</strong> inmediato sobre todos los recursos.</li>
                <li><strong>Investigaciones de alianza</strong>: bonus adicionales desbloqueados por tu alianza.</li>
                <li><strong>Terraformación</strong>: aumenta el espacio disponible para edificios más grandes.</li>
                <li><strong>Héroe de Economía</strong> asignado al planeta: impulso de producción.</li>
            </ul>

            <h2 id="stockage">El almacenamiento (¡no descuidarlo!)</h2>
            <p>Cada planeta tiene una <strong>capacidad máxima</strong> de almacenamiento, por recurso. <strong>Cuando está lleno, la producción se detiene</strong>.</p>
            <p>Para aumentar la capacidad: construye <strong>Stocks de Niobio</strong>, <strong>Stocks de Agua</strong> y <strong>Silos</strong> (comida).</p>
            <p><em>Consejo para principiantes:</em> comprueba tu almacenamiento <strong>antes</strong> de desconectarte por la noche. Nada peor que encontrar tus minas detenidas durante 10 horas.</p>

    bitcoin_economy:
        title: "Bitcoins y mantenimiento"
        category: "beginner"
        order: 4
        tags: "bitcoin,moneda,mantenimiento,coste,economía,game over,informe diario"
        summary: "El Bitcoin es la moneda del juego. Cómo ganarlo, y sobre todo cómo evitar la quiebra."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">¿Qué es el Bitcoin?</h2>
            <p>El <strong>Bitcoin</strong> es la <strong>moneda universal</strong> de Area Universe (nada que ver con la cripto real, es solo un guiño). Sirve para:</p>
            <ul>
                <li>Lanzar <strong>investigaciones</strong>.</li>
                <li>Reclutar <strong>Legionarios</strong> y <strong>científicos</strong>.</li>
                <li>Comprar a través de la <strong>alianza</strong> (tesorería).</li>
                <li>Pagar el <strong>mantenimiento diario</strong> de tus tropas, naves y edificios.</li>
            </ul>

            <h2 id="gagner">¿Cómo ganarlos?</h2>
            <ul>
                <li><strong>Trabajadores</strong> — tu fuente principal. Cada día, te reportan un ingreso proporcional a su número.</li>
                <li><strong>Venta a comerciantes</strong> — envía un carguero con niobio y agua a un comerciante.</li>
                <li><strong>Misiones diarias</strong> — algunas dan Bitcoins.</li>
                <li><strong>Bonus de conexión</strong> — una suma en cada primera conexión del día, multiplicada si encadenas días consecutivos.</li>
                <li><strong>Saqueo</strong> — los raids pueden reportar niobio y agua, que puedes revender.</li>
            </ul>

            <h2 id="entretien">El mantenimiento diario</h2>
            <p>Cada día a las <strong>18h59 UTC</strong>, el juego calcula un balance para ti:</p>
            <ul>
                <li><strong>Ingresos</strong>: lo que tus trabajadores han producido.</li>
                <li><strong>Costes</strong>: el mantenimiento de tus Legionarios, Mechas, naves y edificios.</li>
                <li><strong>Balance</strong>: ingresos − costes, añadido (o restado) a tu saldo.</li>
            </ul>
            <p>Las unidades en misión (flotas en vuelo, naves en combate) <strong>cuestan más caro</strong> que las estacionadas. Un gran ejército en paseo permanente acaba arruinando a los más prudentes.</p>

            <h2 id="faillite">Atención: el Game Over económico</h2>
            <p>Si, después de ese balance diario, tu saldo de Bitcoins cae <strong>en negativo</strong>, es el <strong>Game Over económico</strong>:</p>
            <ul>
                <li>Todas tus flotas en vuelo son <strong>destruidas</strong>.</li>
                <li>Tu saldo se reinicia a <strong>125&nbsp;000 Bitcoins</strong>.</li>
                <li>Algunas investigaciones y progresiones se reducen.</li>
            </ul>
            <p><em>Regla de oro:</em> no reclutes un ejército más caro de lo que tus trabajadores pueden financiar.</p>

    first_buildings:
        title: "Construir tus primeros edificios"
        category: "beginner"
        order: 5
        tags: "edificios,construcción,mina,extractor,granja,principiante,espacio"
        summary: "El orden recomendado de construcción para empezar bien tu planeta inicial."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">El orden aconsejado (los 10 primeros edificios)</h2>
            <ol>
                <li><strong>Mina de Niobio</strong> — tu primera fuente de materia prima.</li>
                <li><strong>Extractor de agua</strong> — indispensable para construir todo lo demás.</li>
                <li><strong>Granja</strong> — alimenta a tus trabajadores y Legionarios.</li>
                <li><strong>Ciudad</strong> — aumenta el número máximo de trabajadores (+25&nbsp;000).</li>
                <li><strong>Mina de Niobio y Extractor de agua nivel 2</strong> — aumenta la producción antes de ir más lejos.</li>
                <li><strong>Centro de investigación</strong> — permite lanzar investigaciones (tecnologías).</li>
                <li><strong>Astillero espacial</strong> — para fabricar tus primeras naves.</li>
                <li><strong>Cuartel</strong> — para reclutar Legionarios de defensa.</li>
                <li><strong>Stocks</strong> (niobio, agua, silos) — evita que la producción sature.</li>
                <li><strong>Metrópolis</strong> — etapa siguiente después de la Ciudad para un verdadero impulso de población (+80&nbsp;000 trabajadores).</li>
            </ol>

            <h2 id="file-attente">Una sola construcción a la vez</h2>
            <p>Cada planeta tiene <strong>una sola cola de construcción</strong>. Mientras un edificio sube de nivel, los demás deben esperar. Planifica en consecuencia.</p>
            <p>Varios planetas = varias colas paralelas: por eso la colonización acelera tu progresión.</p>

            <h2 id="espace">El espacio disponible en un planeta</h2>
            <p>Cada planeta tiene un número limitado de <strong>espacios en suelo</strong> (edificios "terrestres") y de <strong>espacios en cielo</strong> (islas orbitales, defensas).</p>
            <ul>
                <li>Verás los espacios disponibles en la parte superior de la página Planeta.</li>
                <li>La investigación <strong>Terraformación</strong> agranda tus planetas.</li>
                <li>Sin espacio = no más nuevos edificios (pero siempre puedes subir el nivel de los existentes).</li>
            </ul>

    first_fleet:
        title: "Crear tu primera flota"
        category: "beginner"
        order: 6
        tags: "flota,naves,primera,creación,principiante,astillero,carguero,sonda"
        summary: "Fabricar una nave, componer una flota y enviarla a destino: el paso a paso."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Lo que necesitas antes</h2>
            <ul>
                <li>Un <strong>Astillero espacial</strong> construido en tu planeta.</li>
                <li>Suficiente niobio y agua para pagar las naves.</li>
                <li>(Opcional) una <strong>Investigación</strong> que desbloquee la nave (p. ej. investigación <em>Utilitario</em> para los cargueros).</li>
            </ul>

            <h2 id="fabriquer">Paso 1 — Fabricar naves</h2>
            <p>Ve a la página <strong>Espacial</strong> (menú de la izquierda). Verás la lista de naves disponibles. Haz clic en la que quieras, elige una cantidad, lanza la producción.</p>
            <p>La fabricación lleva tiempo: puedes seguir jugando mientras tanto.</p>

            <h2 id="composer">Paso 2 — Componer y enviar una flota</h2>
            <ol>
                <li>Ve a la página <strong>Flotas</strong>.</li>
                <li>Selecciona las naves que embarcar (se muestra el stock disponible).</li>
                <li>Elige un <strong>destino</strong> con el formato <code>Galaxia:Sector:Posición</code> (por ej. <code>1:5:12</code>). También puedes hacer clic directamente desde el Mapa.</li>
                <li>Elige el <strong>tipo de misión</strong> (ver el artículo <em>Tipos de misiones</em>).</li>
                <li>Confirma. El combustible (agua) se deduce automáticamente.</li>
            </ol>

            <h2 id="premiers-vaisseaux">Las naves adecuadas para empezar</h2>
            <ul>
                <li><strong>Carguero I</strong> — transporte de recursos (3&nbsp;000 de capacidad). Indispensable para vender a los comerciantes.</li>
                <li><strong>Sonda</strong> — espía los planetas enemigos. Enviar <em>antes</em> de cualquier ataque.</li>
                <li><strong>Caza</strong> — primera nave de combate, barata.</li>
                <li><strong>Reciclador</strong> — recoge los escombros tras un combate. Muy rentable.</li>
            </ul>

            <h2 id="premiere-cible">Idea de primera misión</h2>
            <p>Envía 1 carguero lleno de niobio/agua en <strong>misión Descarga</strong> hacia un comerciante (posición 15 de un sector). El comerciante te paga en Bitcoins y el carguero regresa solo.</p>

    first_combat:
        title: "Tu primer combate"
        category: "beginner"
        order: 7
        tags: "combate,primero,ataque,informe,principiante,rondas"
        summary: "Cómo desencadenar un combate espacial, lo que sucede durante y lo que hay que hacer después."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Prepararse (¡importante!)</h2>
            <ol>
                <li><strong>Envía una sonda</strong> al objetivo para evaluar sus defensas. Perder 10 cazas a ciegas es desechable; perder 100, duele.</li>
                <li><strong>Compón una flota adaptada</strong>: potencia de fuego suficiente, y piensa en añadir un <strong>reciclador</strong> para recoger los escombros.</li>
                <li><strong>Verifica tu mantenimiento</strong>: una gran flota cuesta cara mientras está en misión.</li>
            </ol>

            <h2 id="enchainement">Lo que sucede paso a paso</h2>
            <ol>
                <li><strong>Lanzas la flota</strong> en misión <em>Normal</em> (ataque) a las coordenadas de un enemigo.</li>
                <li><strong>Viaja</strong> — el tiempo de trayecto se muestra en la página Flotas. Puedes retirarla antes de que llegue.</li>
                <li><strong>Llegada</strong>: si hay flotas enemigas presentes, un combate comienza automáticamente.</li>
                <li><strong>Combate por rondas</strong>: los dos bandos intercambian disparos turno a turno (hasta 100 turnos máx.). Los escudos absorben primero.</li>
                <li><strong>Fin del combate</strong>: un bando es eliminado, o se alcanzan las 100 rondas (en ese caso, <strong>gana el defensor</strong>).</li>
            </ol>

            <h2 id="apres-combat">Después del combate</h2>
            <ul>
                <li>Se te envía un <strong>informe de combate</strong> (página Mensajes / Informes).</li>
                <li>Las naves destruidas dejan <strong>escombros</strong> en el lugar. ¡Envía recicladores!</li>
                <li>El vencedor gana <strong>Puntos de Guerra (PDG)</strong> proporcionales a las pérdidas infligidas.</li>
                <li>Tu flota superviviente vuelve automáticamente a su planeta de origen.</li>
            </ul>

            <h2 id="erreurs">Los errores clásicos a evitar</h2>
            <ul>
                <li>Atacar sin sondear antes.</li>
                <li>Olvidar que las rondas se detienen en 100, a favor del defensor (atacar un objetivo demasiado duro = derrota automática).</li>
                <li>No enviar reciclador: tus adversarios recuperarán <em>tus</em> escombros antes que tú.</li>
            </ul>

    tips:
        title: "Consejos para empezar bien"
        category: "beginner"
        order: 8
        tags: "consejos,trucos,estrategia,principiante"
        summary: "15 consejos que marcan la diferencia en tus primeros días."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Economía</h2>
            <ul>
                <li><strong>Maximiza tus trabajadores</strong>: son tu fuente principal de Bitcoins.</li>
                <li><strong>No construyas demasiado pronto</strong> un gran ejército: te arruinará en mantenimiento.</li>
                <li><strong>Construye Ciudades y luego Metrópolis</strong> para aumentar la población.</li>
                <li><strong>Vigila tu informe diario</strong>: si tus costes superan tus ingresos, reacciona enseguida.</li>
                <li><strong>Vende tus excedentes a los comerciantes</strong> en lugar de dejar que el almacenamiento sature.</li>
            </ul>

            <h2 id="militaire">Militar</h2>
            <ul>
                <li><strong>Siempre una defensa en cada planeta</strong>: Legionarios en cuartel, Mechas, una o dos torretas.</li>
                <li><strong>Personaliza tus naves cada día</strong>: 40 puntos gratuitos para distribuir (armadura, precisión, armas).</li>
                <li><strong>Los recicladores son muy rentables</strong>: después de cada combate, recupera los escombros.</li>
                <li><strong>Sondea antes de atacar</strong>: una sonda cuesta una miseria, una flota perdida cuesta caro.</li>
                <li><strong>Atención al umbral de las 100 rondas</strong>: si no eliminas al defensor en 100 turnos, pierdes.</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Únete a una alianza rápidamente</strong>: +20&nbsp;% de producción, acceso a la diplomacia e investigaciones de alianza.</li>
                <li><strong>Completa tus 3 misiones diarias</strong>: son <strong>+250 PDG</strong>, cada día.</li>
                <li><strong>Habla en la sala de alianza</strong>: coordinar dos ataques vale más que intentar uno solo.</li>
                <li><strong>Conéctate cada día</strong>: el bonus de conexión se dispara con la racha de 7 días consecutivos.</li>
                <li><strong>Activa las notificaciones push</strong>: sabrás en cuanto una flota enemiga se dirija hacia ti.</li>
            </ul>

    resources:
        title: "Recursos en detalle"
        category: "economy"
        order: 1
        tags: "recursos,niobio,agua,comida,uranio,producción,almacenamiento,ciclo,raciones"
        summary: "Todo lo que hay que entender sobre los recursos: producción, bonus, almacenamiento y el caso particular del uranio."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Recordatorio: los 4 recursos</h2>
            <ul>
                <li><strong>Niobio</strong> — construcción.</li>
                <li><strong>Agua</strong> — construcción + combustible de las flotas.</li>
                <li><strong>Comida</strong> — mantenimiento de trabajadores, Legionarios, Mechas.</li>
                <li><strong>Uranio</strong> — arma nuclear, desafíos de arena. Raro y precioso.</li>
            </ul>

            <h2 id="production">Cómo se calcula la producción</h2>
            <p>Cada planeta funciona con un <strong>ciclo de 10 minutos</strong>. En cada ciclo, recibes una cantidad fija que depende:</p>
            <ul>
                <li>del <strong>nivel</strong> de tu edificio productor (Mina, Extractor, Granja);</li>
                <li>del <strong>tamaño</strong> del planeta (terraformación);</li>
                <li>de tus <strong>bonus</strong> (alianza, investigaciones, héroes).</li>
            </ul>
            <p>Las <strong>lunas</strong> producen comida <strong>10 veces más rápido</strong> (ciclo de 1 minuto).</p>
            <p>Incluso <strong>sin edificio productor</strong> —o si lo destruyes hasta el nivel 0— un planeta conserva una <strong>producción base mínima</strong>: <strong>7 Niobio, 6 Agua y 9 Comida</strong> por ciclo. A partir del nivel 1, la producción del edificio (siempre superior) toma el relevo.</p>
            <p>Para la comida, el <strong>Campo agrícola</strong> y la <strong>Granja aeropónica</strong> <strong>se suman</strong>: sus producciones se acumulan.</p>

            <h2 id="bonus">Lo que aumenta tu producción</h2>
            <table>
                <tr><th>Fuente</th><th>Efecto</th></tr>
                <tr><td>Pertenencia a una alianza</td><td>+20&nbsp;% de base</td></tr>
                <tr><td>Investigaciones de alianza de producción</td><td>Bonus adicional creciente con el nivel de investigación</td></tr>
                <tr><td>Terraformación del planeta</td><td>Más espacio = mejores edificios</td></tr>
                <tr><td>Héroe de Economía en el planeta</td><td>Impulso de producción (duplica los otros bonus)</td></tr>
                <tr><td>Eventos especiales</td><td>Impulsos temporales durante un evento de servidor</td></tr>
            </table>

            <h2 id="stockage">El almacenamiento y sus trampas</h2>
            <p>Tu planeta tiene una <strong>capacidad máxima</strong> para cada recurso. Cuando está lleno, la producción se detiene — el recurso sigue siendo "producido" pero se pierde.</p>
            <p>Soluciones: construir <strong>Stocks</strong> (Niobio, Agua, Silos), vender el excedente a los comerciantes, o enviar los excedentes a un aliado.</p>

            <p>La comida se transporta como el niobio y el agua: carga <strong>raciones</strong> en la bodega de una flota (1 espacio por ración) para reabastecer otro planeta. Al descargar, el granero nunca supera su capacidad: el excedente permanece en la bodega.</p>

            <h2 id="uranium">El uranio: el caso particular</h2>
            <p>Ningún edificio produce uranio. Lo obtienes:</p>
            <ul>
                <li><strong>reciclando</strong> escombros de uranio en el mapa (identificados por su icono especial);</li>
                <li><strong>venciendo a los Cthulhu</strong> (misiones PvE);</li>
                <li><strong>ganando desafíos de arena</strong> con apuesta de uranio.</li>
            </ul>
            <p>El uranio sirve para fabricar <strong>bombas nucleares</strong> y para apostar en <strong>arena</strong>.</p>

    buildings:
        title: "Los edificios"
        category: "economy"
        order: 2
        tags: "edificios,construcción,mina,extractor,granja,ciudad,astillero,búnker,torreta"
        summary: "Catálogo completo de los edificios por rol: producción, almacenamiento, población, militar, defensa."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Producción de recursos</h2>
            <table>
                <tr><th>Edificio</th><th>Produce</th><th>Observación</th></tr>
                <tr><td>Mina de Niobio</td><td>Niobio</td><td>El primero a construir.</td></tr>
                <tr><td>Extractor de agua</td><td>Agua</td><td>Indispensable para todo.</td></tr>
                <tr><td>Granja</td><td>Comida</td><td>Para alimentar trabajadores y Legionarios.</td></tr>
                <tr><td>Granja aeropónica</td><td>Comida (avanzada)</td><td>Más eficiente que la Granja. Desbloqueada por investigación.</td></tr>
            </table>

            <h2 id="stockage">Almacenamiento</h2>
            <table>
                <tr><th>Edificio</th><th>Rol</th></tr>
                <tr><td>Stock de Niobio</td><td>Aumenta la capacidad de niobio almacenable.</td></tr>
                <tr><td>Stock de Agua</td><td>Aumenta la capacidad de agua almacenable.</td></tr>
                <tr><td>Silos</td><td>Aumenta la capacidad de comida.</td></tr>
            </table>

            <h2 id="population">Población y ciencia</h2>
            <table>
                <tr><th>Edificio</th><th>Rol</th></tr>
                <tr><td>Ciudad</td><td>+25&nbsp;000 trabajadores máximo por nivel.</td></tr>
                <tr><td>Metrópolis</td><td>+80&nbsp;000 trabajadores máximo por nivel.</td></tr>
                <tr><td>Centro de investigación</td><td>Permite lanzar investigaciones y aumentar la velocidad.</td></tr>
            </table>

            <h2 id="militaire">Militar y producción de naves</h2>
            <table>
                <tr><th>Edificio</th><th>Rol</th></tr>
                <tr><td>Cuartel</td><td>+5&nbsp;000 Legionarios máximo por nivel.</td></tr>
                <tr><td>Búnker</td><td>+15&nbsp;000 Legionarios máx., y <strong>protege una parte de tus recursos</strong> contra los raids (5&nbsp;% por nivel).</td></tr>
                <tr><td>Base nuclear</td><td>Permite fabricar bombas nucleares (uranio requerido).</td></tr>
                <tr><td>Astillero espacial</td><td>Fabrica las naves utilitarias (carguero, sonda, reciclador…) y acelera la producción de todas las naves (+25&nbsp;% por nivel).</td></tr>
                <tr><td>Fábrica ligera</td><td>Fabrica las naves ligeras (cazas, corbetas) y acelera la producción de naves (+40&nbsp;%/nivel) <strong>y de defensas</strong> (+40&nbsp;%/nivel).</td></tr>
                <tr><td>Fábrica pesada</td><td>Fabrica las naves pesadas (fragatas, acorazados, destructores) y acelera la producción de naves (+60&nbsp;%/nivel) <strong>y de defensas</strong> (+60&nbsp;%/nivel).</td></tr>
                <tr><td>Prisión</td><td>Encierra a los héroes capturados.</td></tr>
                <tr><td>Campo de esclavos</td><td>Alternativa a la Prisión. Permite hacer trabajar a los héroes capturados.</td></tr>
            </table>

            <h2 id="orbital">Defensa e instalaciones orbitales (en cielo)</h2>
            <table>
                <tr><th>Edificio / Instalación</th><th>Rol</th></tr>
                <tr><td>Isla orbital</td><td>Añade espacios en cielo para colocar torretas/escudos.</td></tr>
                <tr><td>Base espacial</td><td>Aporta un bonus de armadura a las defensas orbitales.</td></tr>
                <tr><td>Escudo / Gran escudo</td><td>Absorbe los daños antes de que las defensas sean alcanzadas.</td></tr>
                <tr><td>Torretas (misil, láser, Gauss, plasma…)</td><td>Defienden tu planeta contra las flotas en modo ataque.</td></tr>
            </table>

            <h2 id="detection">Detección e interferencia</h2>
            <table>
                <tr><th>Edificio</th><th>Rol</th></tr>
                <tr><td>Radar</td><td>Detecta las flotas que se acercan.</td></tr>
                <tr><td>Sky Radar</td><td>Versión orbital del radar, alcance aumentado.</td></tr>
                <tr><td>Sky Jammer</td><td>Interfiere la detección enemiga: tus movimientos se vuelven invisibles.</td></tr>
            </table>

            <h2 id="file-production">Gestionar la cola de producción</h2>
            <p>Las construcciones de edificios, de naves (Astillero espacial) y de defensas pasan por una <strong>cola de espera</strong> que puedes gestionar:</p>
            <ul>
                <li><strong>Reorganizar</strong> el orden de los elementos en espera (arrastrar y soltar) para priorizar lo que importa.</li>
                <li><strong>Cancelar</strong> un elemento en espera: se te <strong>reembolsa a prorrata</strong> de lo que aún no se ha producido.</li>
                <li>La cola en curso se muestra en la parte superior de cada página de producción, bajo el título.</li>
                <li>La cola está limitada a <strong>15 elementos en espera</strong> (además de la construcción en curso): más allá, un mensaje te indica que debes esperar a que termine una construcción o cancelar una antes de añadir una nueva.</li>
                <li>La <strong>Ciudad flotante</strong> (+10&nbsp;suelo/nivel) y la <strong>Estación orbital</strong> (+5&nbsp;cielo/nivel) están limitadas a <strong>5 unidades por planeta</strong> cada una.</li>
            </ul>

    research:
        title: "Investigación y tecnologías"
        category: "economy"
        order: 3
        tags: "investigación,tecnología,ciencia,bitcoin,desbloqueo,árbol tecnológico"
        summary: "Las tecnologías que desbloquean naves, bonus y nuevas capacidades. Cómo priorizar."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="fonctionnement">Cómo funciona</h2>
            <p>Las investigaciones se lanzan desde el <strong>Centro de investigación</strong>. Cada investigación:</p>
            <ul>
                <li>cuesta <strong>Bitcoins</strong>;</li>
                <li>lleva <strong>tiempo</strong> (de unos minutos a varias horas según el nivel);</li>
                <li>puede tener un <strong>requisito previo</strong> (otra investigación a un cierto nivel).</li>
            </ul>
            <p>Reclutar <strong>científicos</strong> acelera tus investigaciones en curso.</p>

            <h2 id="priorite-debutant">Prioridades para un principiante</h2>
            <ol>
                <li><strong>Utilitario</strong> — desbloquea cargueros, sondas, recicladores.</li>
                <li><strong>Industria</strong> — más producción de recursos.</li>
                <li><strong>Demografía</strong> — más trabajadores (por tanto más Bitcoins).</li>
                <li><strong>Barcaza</strong> y <strong>Reciclador</strong> — indispensables para atacar y reciclar.</li>
                <li><strong>Armamento / Armadura</strong> — antes de cualquier combate real.</li>
            </ol>

            <h2 id="recherches">Lista completa de investigaciones</h2>
            <table>
                <tr><th>Investigación</th><th>Efecto</th><th>Nivel máx.</th></tr>
                <tr><td>Utilitario</td><td>Desbloquea cargueros, sondas, reciclador, etc.</td><td>3</td></tr>
                <tr><td>Terraformación</td><td>Agranda el tamaño construible de los planetas.</td><td>18</td></tr>
                <tr><td>Expansión</td><td>Aumenta el número de planetas que puedes colonizar.</td><td>2</td></tr>
                <tr><td>Industria</td><td>Bonus de producción para los recursos.</td><td>5</td></tr>
                <tr><td>Demografía</td><td>Aumenta la producción de trabajadores.</td><td>5</td></tr>
                <tr><td>Disciplina</td><td>Refuerza los Legionarios en tierra.</td><td>3</td></tr>
                <tr><td>Alambradas</td><td>Bonus de defensa en tierra.</td><td>5</td></tr>
                <tr><td>Unidades blindadas</td><td>Desbloquea los Mechas.</td><td>1</td></tr>
                <tr><td>Armamento</td><td>Aumenta los daños de tus naves.</td><td>5</td></tr>
                <tr><td>Misil</td><td>Facción misil (bonus vs láseres).</td><td>3</td></tr>
                <tr><td>Láser</td><td>Facción láser (bonus vs plasma).</td><td>3</td></tr>
                <tr><td>Plasma</td><td>Facción plasma (bonus vs misiles).</td><td>3</td></tr>
                <tr><td>Hiperespacio</td><td>Permite los viajes intergalácticos.</td><td>1</td></tr>
                <tr><td>Onda</td><td>Mejora radares y comunicaciones. Requisito de otras investigaciones.</td><td>5</td></tr>
                <tr><td>Espionaje</td><td>Mejora el alcance de tus sondas (requisito: Onda nivel 5).</td><td>999</td></tr>
                <tr><td>Carguero</td><td>Aumenta la capacidad de los cargueros.</td><td>5</td></tr>
                <tr><td>Barcaza</td><td>Desbloquea las barcazas (transporte de Legionarios).</td><td>1</td></tr>
                <tr><td>Reciclador</td><td>Desbloquea el reciclador.</td><td>1</td></tr>
                <tr><td>Nave ligera</td><td>Desbloquea/mejora las naves ligeras.</td><td>3</td></tr>
                <tr><td>Nave pesada</td><td>Desbloquea/mejora las naves pesadas.</td><td>3</td></tr>
                <tr><td>Granja aeropónica</td><td>Desbloquea la versión avanzada de la granja.</td><td>1</td></tr>
                <tr><td>Prisión</td><td>Desbloquea la prisión (requisito: Alambradas 5).</td><td>1</td></tr>
            </table>

            <h2 id="modes-speciaux">Modos de servidor con investigaciones máximas</h2>
            <p>En ciertos modos (Battle Royale, Dominación, Search &amp; Destroy), todas tus investigaciones comienzan al <strong>nivel máximo</strong>. El menú Investigación queda oculto.</p>

    workers_scientists:
        title: "Trabajadores y científicos"
        category: "economy"
        order: 4
        tags: "trabajadores,científicos,población,bitcoin,producción,defensa"
        summary: "Las dos poblaciones de tu imperio: los trabajadores que pagan, los científicos que aceleran."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Los trabajadores</h2>
            <p>Los trabajadores son tu <strong>fuente principal de Bitcoins</strong>. Cada día (en el informe diario), te pagan un ingreso proporcional a su número.</p>
            <p>Su <strong>número máximo</strong> depende de las Ciudades y Metrópolis que hayas construido:</p>
            <ul>
                <li><strong>Ciudad</strong>: +25&nbsp;000 trabajadores máx. por nivel.</li>
                <li><strong>Metrópolis</strong>: +80&nbsp;000 trabajadores máx. por nivel.</li>
            </ul>
            <p>Para aumentar su número concreto (no solo el tope), hace falta tener <strong>comida</strong> en reserva — la población crece naturalmente mientras esté alimentada.</p>

            <h2 id="scientifiques">Los científicos</h2>
            <p>Los científicos <strong>aceleran tus investigaciones</strong>. Cuantos más reclutes, más rápido terminan tus tecnologías.</p>
            <p>Atención: cada científico cuesta un pequeño mantenimiento diario. No sobrerrecluttes.</p>

            <h2 id="defense">Rol defensivo</h2>
            <p>Tus <strong>trabajadores participan en la defensa terrestre</strong> — pero únicamente en caso de <strong>invasión</strong> (cuando el enemigo quiere tomar tu planeta). Durante un <strong>raid</strong> clásico (saqueo simple), permanecen ocultos.</p>
            <p>Las investigaciones de alianza de tipo "defensa de los trabajadores" refuerzan aún más su eficacia.</p>

            <h2 id="gerer">Gestionar bien tu población</h2>
            <ul>
                <li>Adapta tu número de trabajadores a tu capacidad de comida.</li>
                <li>No necesitas tener la población máxima al 100&nbsp;% todo el tiempo: apunta a la rentabilidad.</li>
                <li>En caso de hambruna o embargo, tus trabajadores pueden morir — prevé reservas.</li>
            </ul>

            <h2 id="reserve-5000">La reserva intocable de 5&nbsp;000 trabajadores</h2>
            <p>Un planeta no puede <strong>bajar nunca de 5&nbsp;000 trabajadores</strong>. Esta reserva está protegida: toda acción que la dejaría por debajo se bloquea con un mensaje claro. Se ven afectados:</p>
            <ul>
                <li>El <strong>reclutamiento de defensa</strong> (Legionarios, Mechas, científicos) que consume trabajadores.</li>
                <li>La <strong>construcción de naves</strong> en el Astillero espacial.</li>
                <li>La <strong>carga de trabajadores en un carguero</strong> para un traslado.</li>
            </ul>
            <p>El botón «MAX» de las páginas de producción tiene en cuenta esta reserva: nunca te propondrá un máximo que vaciaría tu planeta por debajo del umbral.</p>

    market:
        title: "Mercado y comerciantes"
        category: "economy"
        order: 5
        tags: "mercado,comerciantes,venta,comercio,carguero,bitcoin"
        summary: "Cómo vender tus recursos a los comerciantes PNJ a cambio de Bitcoins."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">¿Quiénes son los comerciantes?</h2>
            <p><strong>Personajes no jugadores</strong> (PNJ) presentes en el mapa. Puedes venderles tu niobio y agua a cambio de Bitcoins.</p>
            <p>Aparecen regularmente en diferentes sectores del universo — su posición es visible en el mapa.</p>

            <h2 id="vendre">Cómo venderles</h2>
            <ol>
                <li>Carga un <strong>carguero</strong> con niobio y/o agua.</li>
                <li>Envíalo al comerciante en misión <strong>Descarga</strong>.</li>
                <li>El carguero llega, la venta se hace, recibes Bitcoins.</li>
                <li>El carguero vuelve automáticamente a casa.</li>
            </ol>

            <h2 id="immunite">Los comerciantes son intocables</h2>
            <p>Los comerciantes son <strong>inmunes a cualquier ataque</strong>. No puedes saquearlos, invadirlos ni combatirlos. Sus flotas nunca participan en un combate, aunque se encuentren en el mismo punto que un enfrentamiento.</p>
            <p>Moraleja: sin malas sorpresas, es un socio comercial seguro.</p>

            <h2 id="gain">¿Cuánto reporta?</h2>
            <p>El precio pagado depende del recurso (el agua reporta más que el niobio, al tipo actual) y de un <strong>bonus comerciante</strong> que aumenta con las investigaciones de alianza dedicadas.</p>
            <p>La interfaz te muestra la ganancia estimada antes de validar la venta. Mira antes de enviar.</p>

            <h2 id="astuce">Truco</h2>
            <p>En lugar de dejar que tus stocks saturen, envía un carguero regularmente. Es Bitcoin gratis para financiar tus investigaciones o tu ejército.</p>

    recycling:
        title: "Reciclaje"
        category: "economy"
        order: 6
        tags: "reciclaje,escombros,cdr,reciclador,asteroide,uranio"
        summary: "Tras cada combate, hay escombros. Recuperarlos es una mina a cielo abierto."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Los escombros: ¿qué son?</h2>
            <p>Cada nave destruida en combate deja una parte de su coste en forma de <strong>escombros</strong> flotantes en el espacio. Se llama un <strong>CDR</strong> (Campo De Recursos).</p>
            <p>Los escombros contienen <strong>niobio</strong>, <strong>agua</strong>, y a veces <strong>uranio</strong> (en escombros especiales que aparecen solos en el mapa).</p>
            <p>En el mapa, los escombros se materializan por un icono específico en la posición del enfrentamiento.</p>

            <h2 id="cuanto">¿Cuántos escombros?</h2>
            <p>Un campo contiene el <strong>40 % del coste de construcción de las naves realmente destruidas</strong>, en ambos bandos. Cada nave devuelve sus propios recursos: un Buque de batalla, caro en agua, deja sobre todo agua. Los supervivientes no dejan nada.</p>
            <p>Tres casos particulares:</p>
            <ul>
                <li>Frente a las hordas de <strong>Cthulhu</strong>, la tasa baja al <strong>20 %</strong>.</li>
                <li>La <strong>carga</strong> de una flota destruida por completo también cae al campo, al 40 %. Un vencedor maltrecho, en cambio, conserva toda su bodega.</li>
                <li>Las <strong>defensas planetarias</strong> arrasadas y las naves pagadas con <strong>puntos de guerra</strong> (Cazador de plasma, Corbeta de combate, Buque de batalla, Carabela) no dejan <strong>ningún</strong> escombro: no cuestan niobio ni agua al construirse.</li>
            </ul>
            <p>Un <strong>combate orbital</strong> (una flota abatida por las torretas de un planeta en modo ataque, o naves perdidas al forzar una órbita defendida) deja un campo según la misma regla.</p>

            <h2 id="comment">Cómo reciclar</h2>
            <ol>
                <li>Desbloquea la investigación <strong>Reciclador</strong>.</li>
                <li>Fabrica <strong>recicladores</strong> en tu Astillero espacial.</li>
                <li>Envía una flota de recicladores en misión <strong>Reciclaje</strong> a las coordenadas del campo de escombros.</li>
                <li>Trabajan por <strong>ciclos de 5 minutos</strong>: en cada ciclo, recogen lo que pueden.</li>
                <li>Una vez llenos (o el campo vacío), la flota vuelve automáticamente.</li>
            </ol>

            <h2 id="capacite">¿Cuánto puede traer un reciclador?</h2>
            <p>Cada reciclador recoge <strong>1&nbsp;000 recursos por ciclo de 5 min</strong>, o sea 12&nbsp;000/hora. Las <strong>investigaciones de alianza</strong> pueden aumentar considerablemente esta capacidad.</p>

            <h2 id="strategie">Estrategia</h2>
            <ul>
                <li>Tras cada combate, envía inmediatamente recicladores: si no, tus adversarios los tendrán.</li>
                <li>Protégelos: un reciclador aislado es un blanco fácil.</li>
                <li>Los escombros de <strong>uranio</strong> aparecen espontáneamente: es tu mejor fuente de uranio fuera de combate.</li>
                <li>El reciclaje es muy rentable — piénsalo como una segunda economía detrás de tus minas.</li>
            </ul>

    daily_report:
        title: "El informe diario"
        category: "economy"
        order: 7
        tags: "informe,diario,cotidiano,balance,ingresos,costes,tasa"
        summary: "Cada día a las 18h59 UTC, el juego hace tu balance: ingresos, costes, tasas. A vigilar de cerca."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Cuándo ocurre</h2>
            <p>Cada día a las <strong>18h59 UTC</strong> (19h59 en hora francesa de invierno, 20h59 en verano). Es una cita fija para todos los jugadores del servidor.</p>
            <p>Recibes un informe detallado en tus Mensajes.</p>

            <h2 id="contenu">Lo que contiene el informe</h2>
            <ul>
                <li><strong>Ingresos</strong> — lo que tus trabajadores han generado.</li>
                <li><strong>Costes de mantenimiento</strong> — Legionarios, Mechas, científicos, naves, edificios. Las unidades en misión cuestan más que las estacionadas.</li>
                <li><strong>Tasa de paz</strong> — si estás en paz con una alianza que exigió una tasa.</li>
                <li><strong>Tasa de alianza</strong> — contribución automática a la tesorería de tu alianza (si está configurada).</li>
                <li><strong>Balance final</strong> — ingresos − costes − tasas, añadido a tu saldo.</li>
            </ul>

            <h2 id="quetes">Las misiones diarias</h2>
            <p>El informe diario <strong>renueva tus 3 misiones</strong> del día. Si completaste las <strong>3 misiones del día anterior</strong>, recibes <strong>+250 PDG</strong> como recompensa bonus.</p>

            <h2 id="danger">El peligro a vigilar</h2>
            <p>Si tu saldo cae <strong>en negativo</strong> tras el informe, es el <strong>Game Over económico</strong>: flotas destruidas, saldo reiniciado a 125&nbsp;000 Bitcoins, investigaciones parcialmente reducidas.</p>
            <p>Verifica tu informe cada día. Si tus costes suben demasiado: ralentiza el reclutamiento, recupera tus flotas en misión, o licencia unidades.</p>

    exchange:
        title: "Intercambios entre jugadores"
        category: "economy"
        order: 8
        tags: "intercambio,alianza,recursos,bitcoin,donación,depósito"
        summary: "Cómo enviar recursos o Bitcoins a un aliado (y los límites del asunto)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Area Universe permite a jugadores de una <strong>misma alianza</strong> ayudarse transfiriéndose recursos o Bitcoins. Es muy útil para:</p>
            <ul>
                <li>Relanzar a un miembro que acaba de ser saqueado.</li>
                <li>Mancomunar un esfuerzo de investigación o construcción costoso.</li>
                <li>Abastecer a un aliado bajo embargo.</li>
            </ul>

            <h2 id="ressources">Enviar recursos físicos</h2>
            <p>Para enviar niobio, agua o comida: cárgalos en un <strong>carguero</strong> y envía el carguero en misión <strong>Descarga</strong> al planeta del destinatario. Los recursos se depositan automáticamente a la llegada, el carguero vuelve solo.</p>

            <h2 id="bitcoins">Enviar Bitcoins</h2>
            <p>Los Bitcoins se transfieren a través de la <strong>tesorería de alianza</strong> (ver artículo dedicado). Depositas en la tesorería, y los oficiales pueden repartir o entregar a un jugador.</p>

            <h2 id="limites">Los límites</h2>
            <ul>
                <li>No se puede <strong>transferir uranio</strong> libremente (recurso estratégico).</li>
                <li>Los intercambios pasan obligatoriamente por una flota: requiere tiempo y combustible.</li>
                <li>Un planeta bajo <strong>embargo</strong> solo puede recibir de ti mismo o de un aliado, no de un extraño.</li>
                <li>No se puede enviar recursos a un enemigo o a un jugador fuera de alianza (salvo vía tesorería, según reglas).</li>
            </ul>

    fleet_creation:
        title: "Crear y enviar una flota"
        category: "fleet"
        order: 1
        tags: "flota,creación,naves,composición,astillero,misión"
        summary: "De la fabricación de la nave hasta su llegada a destino: el recorrido completo."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Lo que necesitas</h2>
            <ul>
                <li>Un <strong>Astillero espacial</strong> en tu planeta activo.</li>
                <li>Los recursos necesarios (niobio y agua).</li>
                <li>Las investigaciones requeridas para la nave deseada (p. ej. <em>Utilitario</em> para los cargueros).</li>
            </ul>

            <h2 id="fabriquer">Paso 1 — Fabricar las naves</h2>
            <p>Desde la página <strong>Espacial</strong>, elige un modelo y una cantidad. La producción lleva tiempo y se hace en segundo plano.</p>

            <h2 id="composer">Paso 2 — Componer la flota</h2>
            <p>Una vez entregadas las naves, ve a la página <strong>Flotas</strong>. Puedes:</p>
            <ul>
                <li>Seleccionar qué naves embarcan.</li>
                <li>Cargar <strong>recursos</strong> (para un transporte).</li>
                <li>Embarcar <strong>Legionarios</strong> (para raid/invasión, con barcazas).</li>
            </ul>

            <h2 id="envoyer">Paso 3 — Enviar la flota</h2>
            <ol>
                <li>Elige el <strong>destino</strong>. Puedes introducirlo con el formato <code>Galaxia:Sector:Posición</code> o hacer clic desde el Mapa.</li>
                <li>Elige un <strong>tipo de misión</strong> (Normal, Descarga, Reciclaje, Raid, Invasión…).</li>
                <li>Verifica el coste en combustible (agua) y la duración del vuelo.</li>
                <li>Confirma.</li>
            </ol>
            <p>La flota aparece en tu lista de flotas en vuelo. Puedes <strong>retirarla</strong> antes de su llegada si es necesario.</p>

            <h2 id="astuces">Trucos</h2>
            <ul>
                <li>Piensa en añadir un <strong>reciclador</strong> a tus flotas de ataque, para recuperar los escombros de inmediato.</li>
                <li>Nunca envíes toda tu defensa de golpe: guarda con qué sostener tu planeta.</li>
                <li>La vuelta de una flota tras misión no cuesta combustible adicional (ya aprovisionado).</li>
            </ul>

    ship_types:
        title: "Tipos de naves"
        category: "fleet"
        order: 2
        tags: "naves,caza,corbeta,fragata,acorazado,crucero,destructor,carguero,sonda"
        summary: "Todas las naves del juego: utilitarias, ligeras, pesadas, especiales — y cómo usarlas."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Naves utilitarias</h2>
            <p>No combaten. Sirven para transportar, explorar, reciclar, colonizar.</p>
            <table>
                <tr><th>Nave</th><th>Rol</th><th>Capacidad</th></tr>
                <tr><td>Sonda</td><td>Espiar un planeta.</td><td>—</td></tr>
                <tr><td>Carguero I</td><td>Transporte ligero.</td><td>3&nbsp;000</td></tr>
                <tr><td>Carguero V</td><td>Transporte medio.</td><td>10&nbsp;000</td></tr>
                <tr><td>Carguero X</td><td>Gran transporte.</td><td>25&nbsp;000</td></tr>
                <tr><td>Carabela</td><td>Carguero premium: el más grande y rápido de los cargueros. Pagado en Puntos de Guerra (25) + 15&nbsp;trabajadores por unidad producida.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonizador</td><td>Fundar un nuevo planeta.</td><td>—</td></tr>
                <tr><td>Reciclador</td><td>Recoger los escombros de combate.</td><td>1&nbsp;000 por ciclo de 5 min</td></tr>
                <tr><td>Barcaza</td><td>Transportar Legionarios para un raid o una invasión.</td><td>1&nbsp;000 Legionarios</td></tr>
                <tr><td>Moon Maker</td><td>Crear una luna en un emplazamiento vacío con suficientes escombros (mín. 2M de niobio y 2M de agua).</td><td>—</td></tr>
                <tr><td>Radar (nave)</td><td>Extender tu detección en un sector.</td><td>—</td></tr>
                <tr><td>Jammer (nave)</td><td>Interferir la detección enemiga.</td><td>—</td></tr>
                <tr><td>Nave nodriza</td><td>Nave insignia de prestigio. Ralentiza la flota.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Naves de combate</h2>
            <p>Están divididas en <strong>clases</strong> (de la más ligera a la más pesada). Cada clase tiene sus fuerzas y debilidades; un combate equilibrado mezcla las clases.</p>
            <table>
                <tr><th>Clase</th><th>Ejemplos</th><th>Perfil</th></tr>
                <tr><td>Ligero</td><td>Caza, Caza pesado, Caza de guerra</td><td>Rápido, barato, numeroso. Bueno contra corbetas.</td></tr>
                <tr><td>Medio</td><td>Corbeta, Corbeta láser, Corbeta de guerra</td><td>Equilibrado. Bueno contra cazas y fragatas.</td></tr>
                <tr><td>Pesado</td><td>Fragata, Fragata plasma</td><td>Grandes daños a larga distancia.</td></tr>
                <tr><td>Muy pesado</td><td>Acorazado</td><td>Resistente, daños sólidos.</td></tr>
                <tr><td>Capital</td><td>Crucero, Blindado, Destructor</td><td>Colosal, muy caro, devastador. Corazón de tu flota.</td></tr>
            </table>

            <h2 id="factions">Las facciones de combate</h2>
            <p>Ciertas naves pertenecen a una <strong>facción</strong>: <em>misil</em>, <em>láser</em> o <em>plasma</em>. Las facciones se contrarrestan (piedra-papel-tijera), con un bonus de +20&nbsp;% de potencia contra su facción objetivo.</p>

            <h2 id="bonus-cargo">Capacidad de transporte</h2>
            <p>La capacidad de los cargueros aumenta con las <strong>investigaciones de alianza</strong> dedicadas al carguero. Útil cuando empiezas a jugar a largas distancias.</p>

    ship_customization:
        title: "Personalizar tus naves"
        category: "fleet"
        order: 3
        tags: "personalización,naves,puntos,armadura,precisión,armas"
        summary: "40 puntos gratuitos cada día para mejorar armadura, precisión y armas de tus naves."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Cada modelo de nave tiene tres características que puedes hacer evolucionar:</p>
            <ul>
                <li><strong>Armadura</strong> — cuánto puede encajar.</li>
                <li><strong>Precisión</strong> — eleva el peor resultado posible de cada salva (ningún disparo falla nunca, pero uno mal ajustado inflige menos daño).</li>
                <li><strong>Armas</strong> — daños infligidos.</li>
            </ul>
            <p>Cada día, el juego te ofrece <strong>40 puntos a repartir libremente</strong>, para todas tus naves. Es gratis, no lo olvides.</p>

            <h2 id="utiliser">Cómo usarlos</h2>
            <p>Ve a la página <strong>Personalización</strong> (menú Espacial). Para cada modelo, ajusta los deslizadores. Tus elecciones se aplican a <strong>todas las naves de ese modelo</strong> (actuales y futuras). Estas tres estadísticas progresan de forma independiente entre sí: invertir puntos en la armadura o las armas de un modelo nunca reduce su precisión.</p>

            <h2 id="lectura">Leer tu puntería en pantalla</h2>
            <p>La pestaña <strong>Estadísticas</strong> del Astillero espacial muestra, modelo por modelo, la puntería que has invertido sobre el crédito de ese modelo (por ejemplo <code>676 / 676</code> para un Destructor) y el <strong>multiplicador de daño</strong> que resulta&nbsp;: <strong>×0,94</strong> con la puntería al máximo, <strong>×0,66</strong> sin ningún punto invertido.</p>
            <p>No es una tasa de acierto&nbsp;: <strong>ningún disparo falla nunca</strong>. Apuntar mejor eleva el mínimo de tu daño, nunca su máximo. Es la misma cifra que en tu página de gestión de flota, en la pestaña Defensas y en tus informes de combate — las cuatro pantallas por fin se comparan directamente. Como referencia, las defensas de un planeta disparan a <strong>×1,06</strong>, mejor que una flota con la puntería al máximo.</p>

            <h2 id="reset">Reinicios</h2>
            <p>Puedes reiniciar tus puntos <strong>una vez cada 96 horas</strong>, sin límite total: si tu estrategia cambia o el motor de combate evoluciona, recupera todos los puntos gastados para redistribuirlos. Tras un reinicio, el botón queda desactivado y una cuenta atrás muestra el tiempo restante hasta el siguiente.</p>

            <h2 id="modes-speciaux">Modos de servidor con investigaciones máximas</h2>
            <p>En ciertos modos (Battle Royale, Dominación, Search &amp; Destroy), <strong>todos tus puntos están desbloqueados desde el primer día</strong> (1&nbsp;375 puntos disponibles de inmediato en lugar de 40/día).</p>

            <h2 id="astuces">Trucos</h2>
            <ul>
                <li>No dispersar tus puntos en demasiados modelos: concéntrate en los que realmente usas en masa.</li>
                <li>Los <strong>recicladores</strong> y <strong>cargueros</strong> ganan con algo de armadura para sobrevivir a emboscadas.</li>
                <li>Los <strong>cazas</strong> se benefician más de precisión y armas que de armadura (mueren rápido).</li>
            </ul>

    fleet_missions:
        title: "Tipos de misiones"
        category: "fleet"
        order: 4
        tags: "misión,ataque,transporte,colonización,reciclaje,espionaje,nuclear,raid,invasión"
        summary: "Cada misión da una orden diferente a tu flota. Aquí te explicamos cómo elegir la buena."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Cuando envías una flota, le das un <strong>tipo de misión</strong>. Es esa misión la que determina lo que pasa a la llegada. Algunos tipos requieren naves específicas.</p>

            <h2 id="missions">Los tipos disponibles</h2>
            <table>
                <tr><th>Misión</th><th>Qué hace</th><th>Naves requeridas</th></tr>
                <tr><td><strong>Normal</strong> (Ataque)</td><td>La flota se dirige al punto objetivo. Si el enemigo está allí, combate automático.</td><td>Cualquier nave</td></tr>
                <tr><td><strong>Descarga</strong></td><td>Deposita recursos en un planeta aliado o en un comerciante, luego vuelve.</td><td>Al menos un carguero</td></tr>
                <tr><td><strong>Colonización</strong></td><td>Funda un nuevo planeta en un emplazamiento vacío.</td><td>Un colonizador</td></tr>
                <tr><td><strong>Raid (Saqueo)</strong></td><td>Combate la defensa terrestre para robar recursos, sin tomar el planeta.</td><td>Barcazas + Legionarios</td></tr>
                <tr><td><strong>Invasión</strong></td><td>Combate la defensa terrestre para <strong>tomar el planeta</strong> al adversario.</td><td>Barcazas + Legionarios</td></tr>
                <tr><td><strong>Espionaje</strong></td><td>Envía una sonda para obtener un informe sobre las defensas enemigas.</td><td>Al menos una sonda</td></tr>
                <tr><td><strong>Luna</strong></td><td>Crea una luna en un emplazamiento vacío con suficientes escombros (mín. 2M de niobio y 2M de agua).</td><td>Un Moon Maker</td></tr>
                <tr><td><strong>Radar</strong></td><td>Despliega un satélite radar en el sitio (detección extendida).</td><td>Una nave radar</td></tr>
                <tr><td><strong>Interferencia</strong></td><td>Despliega un satélite de interferencia (oculta tus movimientos).</td><td>Una nave jammer</td></tr>
                <tr><td><strong>Aterrizar</strong></td><td>Transfiere las naves directamente a la guarnición de uno de tus planetas.</td><td>Planeta tuyo</td></tr>
                <tr><td><strong>Nuclear</strong></td><td>Lanza una bomba nuclear sobre el planeta objetivo.</td><td>Bomba nuclear a bordo</td></tr>
                <tr><td><strong>Reciclaje</strong></td><td>Recoge los escombros de un campo de batalla.</td><td>Al menos un reciclador</td></tr>
            </table>

            <h2 id="choisir">Cómo elegir la misión adecuada</h2>
            <ul>
                <li>¿Quieres <strong>Bitcoin</strong>? → Descarga a un comerciante.</li>
                <li>¿Quieres <strong>información</strong>? → Espionaje.</li>
                <li>¿Quieres <strong>debilitar</strong> a un enemigo? → Raid (saqueo).</li>
                <li>¿Quieres <strong>tomar</strong> su planeta? → Invasión.</li>
                <li>¿Quieres <strong>recuperar escombros</strong>? → Reciclaje.</li>
            </ul>

    fleet_movement:
        title: "Desplazamiento y distancia"
        category: "fleet"
        order: 5
        tags: "desplazamiento,distancia,velocidad,viaje,combustible,coordenadas"
        summary: "Cómo se calcula la duración del vuelo, el combustible consumido y lo que ralentiza tu flota."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Las coordenadas, cómo funcionan</h2>
            <p>Cada posición en el universo se escribe con el formato <strong>Galaxia:Sector:Posición</strong>. Ejemplo: <code>1:5:12</code> = galaxia 1, sector 5, posición 12.</p>
            <ul>
                <li>Una <strong>galaxia</strong> contiene varios sectores (cuadrícula 10×10).</li>
                <li>Un <strong>sector</strong> contiene 25 posiciones (cuadrícula 5×5).</li>
            </ul>

            <h2 id="distance">Cómo se calcula la distancia</h2>
            <ul>
                <li><strong>Mismo sector</strong> — distancia corta, viaje rápido.</li>
                <li><strong>Misma galaxia, sector diferente</strong> — distancia media.</li>
                <li><strong>Galaxia diferente</strong> — distancia larga, fija. Requiere la investigación <strong>Hiperespacio</strong>.</li>
            </ul>
            <p>La interfaz siempre muestra la distancia y la duración estimadas antes de que valides el envío.</p>

            <h2 id="duree">La duración del vuelo</h2>
            <p>Depende de:</p>
            <ul>
                <li>la <strong>distancia</strong>;</li>
                <li>la <strong>velocidad de la nave más lenta</strong> de tu flota (una flota va a la velocidad de la más lenta);</li>
                <li>la <strong>velocidad del servidor</strong> (algunos servidores están acelerados).</li>
            </ul>
            <p>La <strong>Nave nodriza</strong> (mothership) es prestigiosa pero <strong>ralentiza la flota un 10&nbsp;%</strong>. A tener en cuenta. También <strong>reduce un 10&nbsp;% la firma de radar</strong> de la flota (camuflaje) — el resumen del Imperio, en cambio, muestra el total real de sus naves.</p>

            <h2 id="carburant">El combustible</h2>
            <p>El combustible es <strong>agua</strong>. Cuanto más <strong>grande</strong> sea tu flota (masa total), más consume. Cuanto más <strong>largo</strong> sea el trayecto, más consume.</p>
            <p>Una misión <strong>Descarga</strong> consume el doble (el carguero va cargado, vuelve cargado del retorno).</p>
            <p>El combustible estimado se muestra antes de lanzar la flota: verifica que tienes suficiente agua en stock.</p>

            <h2 id="rappel">Retirar una flota en vuelo</h2>
            <p>Puedes <strong>retirar</strong> una flota mientras no haya llegado. Da media vuelta y vuelve a casa. Caso típico: un aliado ataca antes que tú, cancela tu ofensiva.</p>

            <h2 id="night-slowdown">🌙 Ralentización nocturna</h2>
            <p>Una flota ofensiva (naves de combate o tropas terrestres) enviada al planeta de un enemigo tarda <strong>×10 más</strong> si llega durante la <strong>ventana nocturna del defensor</strong> (23:00–06:00 en su huso horario). La duración mostrada ya incluye este multiplicador.</p>
            <p>Un icono 🌙 en el mapa indica los jugadores que están actualmente en su ventana nocturna. Un modal de confirmación aparece al enviar si la llegada cae en la noche del adversario. El huso horario se detecta automáticamente y puede cambiarse como máximo una vez al mes.</p>

    fleet_management:
        title: "Gestión avanzada de flotas"
        category: "fleet"
        order: 6
        tags: "gestión,flota,dividir,fusionar,transferir,reagrupar"
        summary: "Dividir, reagrupar, aterrizar: las maniobras avanzadas para optimizar tus movimientos."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Las operaciones disponibles</h2>
            <ul>
                <li><strong>Dividir</strong> — separar una parte de las naves en una nueva flota.</li>
                <li><strong>Reagrupar</strong> — fusionar varias de tus flotas que se encuentran en el mismo lugar.</li>
                <li><strong>Aterrizar</strong> — transferir las naves de una flota a la guarnición de un planeta. Las tropas y la carga desembarcadas deben caber en las capacidades del planeta; una flota que no transporta ninguna aterriza siempre, incluso en un planeta ya lleno.</li>
                <li><strong>Retirar</strong> — hacer dar media vuelta a una flota en vuelo.</li>
                <li><strong>Transferir al puerto</strong> — poner una flota en "estacionamiento" en un planeta sin fusión.</li>
            </ul>

            <h2 id="en-vol">Lo que no se puede hacer</h2>
            <ul>
                <li>Modificar la composición de una flota <strong>en vuelo</strong> (carga, naves).</li>
                <li>Cambiar la misión de una flota en vuelo (salvo retirar).</li>
                <li>Teletransportar una flota (¡no hay atajo mágico!).</li>
            </ul>

            <h2 id="astuces">Casos de uso</h2>
            <ul>
                <li><strong>Dividir antes de un combate</strong>: guarda parte de tu flota en reserva, envía una vanguardia.</li>
                <li><strong>Reagrupar tras un raid</strong>: fusionar varias vueltas para ganar en legibilidad.</li>
                <li><strong>Aterrizar</strong>: rebalancear una flota a la defensa orbital de un planeta.</li>
            </ul>

    espionage:
        title: "Espionaje y sondas"
        category: "fleet"
        order: 7
        tags: "espionaje,sonda,espía,detección,información,inteligencia"
        summary: "Saber lo que tiene el adversario antes de golpear: el envío de sondas explicado."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Enviar una sonda</h2>
            <ol>
                <li>Fabrica <strong>sondas</strong> en tu Astillero espacial (desbloqueadas por la investigación Utilitario).</li>
                <li>Ve a la página Flotas, añade al menos 1 sonda.</li>
                <li>Elige la misión <strong>Espionaje</strong>, designa el objetivo.</li>
                <li>Envía — la sonda sale a toda velocidad.</li>
            </ol>
            <p>A la llegada, escanea el planeta y te devuelve un informe.</p>

            <h2 id="reussite">¿Qué determina el éxito?</h2>
            <p>Un duelo silencioso opone tu <strong>nivel de Espionaje</strong> al del defensor:</p>
            <ul>
                <li>Si tu nivel es <strong>superior o igual</strong>, el informe es detallado.</li>
                <li>Si tu nivel es más bajo, obtienes información parcial, o nada en absoluto.</li>
            </ul>
            <p>Para subir tu espionaje: investigación <strong>Onda</strong> nivel 5, luego investigación <strong>Espionaje</strong>.</p>

            <h2 id="rapport">Lo que revela un informe exitoso</h2>
            <ul>
                <li>Los <strong>recursos</strong> presentes en el planeta.</li>
                <li>La lista de <strong>edificios</strong> y su nivel.</li>
                <li>Las <strong>flotas</strong> en órbita.</li>
                <li>Las <strong>defensas terrestres y orbitales</strong>.</li>
                <li>Los <strong>Legionarios, Mechas, trabajadores</strong>.</li>
            </ul>
            <p>Exactamente lo que hace falta para decidir: raid, invasión o retirada.</p>

            <h2 id="detection">¿Se puede ser detectado?</h2>
            <p>Sí. Si el defensor tiene un <strong>Radar</strong> suficientemente bueno, recibe una alerta de espionaje (sin necesariamente saber qué se vio).</p>
            <p>A la inversa, un planeta equipado con un <strong>Jammer</strong> puede interferir tu sonda o hacerla poco fiable.</p>

    spatial_combat:
        title: "Combate espacial"
        category: "combat"
        order: 1
        tags: "combate,espacial,flota,batalla,bloque,ronda,escudo,precision,perdidas,dano,pantalla,cazas"
        summary: "El desarrollo completo de un combate entre flotas: poder de los bandos, duelo de escudos, rondas de disparo, final del combate y cálculo exacto de tus pérdidas."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="inicio">Cuándo se desencadena un combate</h2>
            <p>En cuanto una flota marcada <strong>[Ataque]</strong> comparte posición (Galaxia:Sector:Posición) con una flota enemiga, el combate comienza automáticamente. Tus flotas presentes en el mismo lugar se fusionan primero en una sola armada.</p>
            <p>Todas las flotas presentes se reparten en <strong>dos bandos</strong> según la diplomacia: tu alianza y sus pactos por un lado, el enemigo y sus apoyos por el otro. Un bando sin ni una sola arma (cargueros, recicladores, sondas) no combate: es destruido, y el informe lo indica.</p>
            <p><strong>Alianzas en guerra, nadie armado</strong> — dos flotas de alianzas en guerra solo desencadenan un combate si al menos una de ellas porta armas de nave. Dos flotas completamente desarmadas (cargueros, sondas, recicladores) que se cruzan simplemente no combaten: tus flotas no quedan inmovilizadas y nadie recibe un aviso para nada.</p>
            <p><strong>Caso de raids e invasiones</strong> — cuando esta batalla la desencadena un raid o una invasión contra un planeta protegido (ver los artículos <em>Invasión de planeta</em> y <em>Raids (saqueo)</em>), es ese propio desencadenamiento el que coloca la marca <strong>[Ataque]</strong> en tu flota asaltante. Nunca se retira después: una flota de raid o invasión que sobrevive queda marcada como hostil — las torretas en modo ataque podrán atacarla más tarde, y volverá a quedar atrapada en la siguiente detección de combate espacial en cuanto se cruce con un enemigo.</p>

            <h2 id="poder">El poder de un bando</h2>
            <p>El combate enfrenta los <strong>totales</strong> de ambos bandos: el juego suma el blindaje, el escudo, los misiles, los láseres y el plasma de todas las naves implicadas.</p>
            <ul>
                <li><strong>Defensor en casa</strong> — las torretas y el blindaje de las defensas del planeta se unen a su bando; el Escudo planetario añade +50.000 de blindaje, el Gran escudo +600.000. Una flota armada de un aliado de alianza estacionada en tu planeta también se beneficia.</li>
                <li><strong>Precisión</strong> — media de las precisiones de las flotas del bando (construida con la personalización de tus naves).</li>
                <li><strong>Política de alianza</strong> — cada régimen vence a su rival: la Democracia vence al Comunismo, que vence al Fascismo, que vence a la Democracia. Si la política del <strong>atacante</strong> vence a la del defensor, todas sus armas ganan +20&nbsp;%.</li>
                <li><strong>Mejoras de alianza</strong> — hasta +5&nbsp;% por tipo de arma, blindaje y escudo, y hasta +10&nbsp;% para las defensas planetarias.</li>
                <li><strong>Héroes</strong> — bonus de ataque, defensa, escudo y precisión según habilidades y objetos. Un héroe con <strong>Intimidación</strong> debilita las armas enemigas; un <strong>Táctico</strong> refuerza la primera salva de su bando.</li>
            </ul>

            <h2 id="defensas-planeta">Tus torretas combaten en ese mismo combate</h2>
            <p>Cuando las defensas de tu planeta se unen a un bando, ese combate <strong>es</strong> ahora todo el combate de tu planeta: ya no hay un segundo combate orbital aparte para tus torretas. Apuntan con su propia precisión (una escolta poco precisa a su lado ya no degrada su disparo), y ahí sufren <strong>pérdidas reales</strong>: proporcionales al daño que encaja tu bando si gana, <strong>totales</strong> — torretas, escudos, base espacial, modo ataque desactivado — si tu bando cae. Esto se aplica tanto si el modo ataque del planeta está activo como si no: en cuanto disparan, ahora pueden ser destruidas. Un planeta protegido por una de tus flotas, o por una flota <strong>armada</strong> de un aliado de tu alianza, ya no puede ser saqueado ni invadido sin que un combate lo decida antes.</p>

            <h2 id="escudos">El duelo de escudos</h2>
            <p>Cada salva choca primero contra el escudo adversario. Su <strong>poder de perforación</strong> vale:</p>
            <p><code>misiles ÷ 7 + plasma × 4 + láseres × 2</code></p>
            <p>El plasma destaca contra los escudos, los misiles apenas los rascan — y esa ventaja se cumple ahora sea cual sea el tamaño del combate, diez contra diez igual que cien millones contra cien millones. En cada salva, la parte de daño que supera el poder de perforación es absorbida por el escudo adversario hasta agotar su carga; el resto, y todo lo que desborda una vez vacío el escudo, golpea directamente el casco. Un escudo nunca puede bloquear una salva entera&nbsp;: frente a un adversario armado, tu casco siempre encaja algo, desde la primera ronda.</p>
            <p>El escudo de una flota ya no es una reserva que vuelve automáticamente al 100&nbsp;% antes de cada batalla: es una <strong>carga persistente</strong> que se desgasta durante el combate y solo sube un 10&nbsp;% cada 3 horas (30 horas para pasar de cero a lleno), incluso cuando divides, fusionas o disuelves la flota, o transfieres naves entre la flota y el suelo del planeta. El informe de combate muestra esta carga al principio y al final de la batalla; la lista de flotas muestra el porcentaje de cada flota, y la página de gestión de flota indica el escudo realmente llevado al combate, la capacidad total, el porcentaje actual y el tiempo restante hasta la carga completa. Las naves almacenadas en tierra también llevan una carga, que no se recarga: toda flota creada o reforzada desde ese suelo la hereda, y se muestra en la ventana de creación de flota y en la pestaña «Naves» de la gestión de flota. Una excepción: el escudo fijo que aporta una <strong>Nave nodriza</strong> nunca se descarga — su generador aguanta de forma permanente, y la carga solo desgasta el escudo de tus demás naves — por eso la página de gestión muestra también el valor absoluto del escudo, no solo el porcentaje.</p>

            <h2 id="rondas">Las rondas de disparo</h2>
            <p>Un combate dura como máximo <strong>100 rondas</strong>. En cada ronda, una salva inflige:</p>
            <p><code>(misiles + plasma ÷ 2 + láseres × 2) × multiplicador</code></p>
            <p>El multiplicador sale de una tirada de precisión: el juego saca un número entre tu precisión y 100 y lo divide por 80, con un resultado entre <strong>×0,3 y ×1,2</strong>. Una precisión alta no hace tus salvas más fuertes: elimina las malas tiradas. La parte que atraviesa el escudo adversario (ver más arriba) se descuenta del blindaje total de ese bando.</p>

            <h2 id="final">Final del combate</h2>
            <ul>
                <li><strong>El blindaje de un bando cae a 0</strong> — queda vencido; todas sus flotas son destruidas con su carga.</li>
                <li><strong>Se alcanzan las 100 rondas</strong> — gana el bando que conserva más blindaje; en empate perfecto, gana el atacante.</li>
                <li><strong>Red de seguridad del vencedor</strong> — incluso muy castigado, el bando vencedor nunca pierde más del 95&nbsp;% de su blindaje inicial: una victoria nunca es una aniquilación, sea cual sea la diferencia de poder.</li>
            </ul>

            <h2 id="perdidas">Tus pérdidas: lo que realmente encajaste</h2>
            <p>La regla cabe en una frase: <strong>tus pérdidas derivan del daño al casco que realmente encajaste</strong> — nunca de lo que absorbió tu escudo, que no cuesta ni una nave. Ese daño al casco se reparte entre tu <strong>pantalla</strong> (Cazas, Cazas pesados, Cazas de guerra: las únicas naves sin escudo) y tu <strong>línea</strong> (el resto de tipos), en proporción al blindaje de cada grupo: cada tipo pierde la misma fracción de sí mismo. El informe muestra dos contadores: daño al casco y daño al escudo.</p>
            <p>Tu pantalla no protege la línea indefinidamente: desvía hacia sí, como máximo, la <strong>mitad</strong> del daño destinado a la línea, y solo mientras le quede blindaje para encajarlo — un solo caza no puede absorber el daño de toda una flota. Sin pantalla alguna, la línea encaja la totalidad del daño al casco.</p>
            <p>Consecuencias directas: si el enemigo apenas te toca, tus pérdidas son casi nulas; un enemigo diez veces más peligroso te cuesta unas diez veces más — cazas incluidos. El bando vencido lo pierde todo.</p>

            <h2 id="despues">Después del combate</h2>
            <ul>
                <li><strong>Escombros</strong> — el 40&nbsp;% del coste de construcción (niobio y agua) de cada nave destruida, de ambos bandos, cae en órbita (20&nbsp;% cuando hay un Cthulhu o un alien implicado). La carga de las flotas aniquiladas se añade. Un reciclador en la flota vencedora recoge de inmediato.</li>
                <li><strong>Puntos de Guerra</strong> — ambos bandos ganan, en proporción al poder enemigo destruido; el vencedor recibe muchos más, y la consolación del vencido nunca supera una quinta parte de lo que habría ganado el vencedor con esa misma flota.</li>
                <li><strong>Héroes</strong> — un héroe principal a bordo de una flota destruida puede ser capturado por el vencedor (una probabilidad, nunca garantizada). Un <strong>héroe secundario</strong> derrotado sigue una regla distinta y definitiva, sin azar: ver el artículo <em>Héroes secundarios</em>.</li>
                <li><strong>Informes</strong> — cada comandante recibe el detalle: fuerzas, salvas, daño encajado, pérdidas, y el destino de cualquier héroe secundario capturado o ejecutado.</li>
            </ul>

            <h2 id="consejos">Consejos</h2>
            <ul>
                <li>Mantén siempre una <strong>pantalla de cazas</strong>: barata, encaja el daño al casco en lugar de tus naves pesadas.</li>
                <li>Invierte en <strong>escudo</strong>: cuanta más carga tenga, más daño absorbe antes de que llegue a tu casco — pero ningún escudo detiene una salva entera, tu casco siempre encaja una parte.</li>
                <li>Construye <strong>plasma</strong> para perforar rápido los escudos enemigos, <strong>láseres</strong> para el daño al casco.</li>
                <li>Elige la <strong>política de alianza</strong> mirando la de tus objetivos favoritos: +20&nbsp;% de armas al atacar.</li>
            </ul>

    invasion:
        title: "Invasión de planeta"
        category: "combat"
        order: 2
        tags: "invasión,planeta,soldados,tanques,barcazas,conquista,despliegue,táctica"
        summary: "Conquistar un planeta enemigo: barcazas, desembarco, combate terrestre y despliegues tácticos."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Principio</h2>
            <p>La invasión es un ataque para <strong>tomar posesión</strong> de un planeta enemigo. Tu flota desembarca Legionarios (vía barcazas) que se enfrentan a la guarnición en tierra.</p>
            <p>Es diferente de un <strong>raid</strong> (que saquea sin tomar el planeta): una invasión exitosa te da el planeta entero.</p>

            <h2 id="conditions">Lo que hace falta para invadir</h2>
            <ul>
                <li>Estar en una <strong>alianza</strong>.</li>
                <li>Jugar en un servidor en <strong>modo PvP</strong> (p. ej.: Dominación, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Tener <strong>barcazas</strong> y <strong>Legionarios</strong> a bordo de la flota.</li>
                <li>El objetivo debe ser un planeta habitado (no un comerciante, no un aliado, no alguien con quien estés en paz o en pacto).</li>
                <li>No haber ya un combate espacial previsto en el mismo lugar.</li>
            </ul>

            <h2 id="barges">El rol de las barcazas</h2>
            <p>Las barcazas son los vehículos que desembarcan a tus Legionarios en tierra. Cada barcaza transporta <strong>1&nbsp;000 Legionarios</strong> (capacidad aumentada por las investigaciones de alianza).</p>
            <p>Si tienes más Legionarios que plazas, los excedentes <strong>se quedan en órbita y no combaten</strong>. En caso de fracaso, tus barcazas son <strong>capturadas por el defensor</strong>.</p>

            <h2 id="orbital">Fase 1 — Combate en órbita (a veces)</h2>
            <p>Dos situaciones pueden detenerte antes incluso de desembarcar:</p>
            <ul>
                <li>El planeta objetivo ha activado su <strong>modo ataque</strong>: sus torretas y escudos enfrentan primero a tu flota. Si <strong>pierdes</strong>, tu flota es destruida — la invasión se detiene en seco. Si <strong>ganas</strong>, las defensas orbitales son aniquiladas y tu flota continúa (debilitada).</li>
                <li>El planeta objetivo está protegido por una flota <strong>armada</strong> del propietario, o por una flota <strong>armada</strong> de un aliado de su alianza, ya en órbita (una sonda o un carguero solos ya no cuentan): tu llegada desencadena una <strong>batalla</strong> contra ese defensor y las torretas del planeta juntos — incluso si el planeta no está en modo ataque. Esta batalla nunca se desencadena contra un socio de paz, de pacto, un aliado o tu propia alianza, ni en un servidor PvE: sigue las mismas reglas diplomáticas que una invasión normal. Anula tu invasión en curso: si la ganas, debes <strong>relanzar</strong> una invasión para desembarcar de verdad — y si el planeta sigue protegido en ese momento, hacer clic en «Invadir» desde la órbita también es <strong>rechazado</strong>: activa primero el modo ataque de tu propia flota para forzar el combate. Como una invasión siempre lleva Legionarios, esta condición se cumple automáticamente en el lado atacante: la batalla se desencadena tanto si tu flota lleva armas de nave como si no.</li>
            </ul>
            <p><strong>Trampa que debes conocer: una flota de invasión sin naves de combate es aniquilada en esta batalla.</strong> Legionarios y barcazas bastan para lanzar una invasión, pero si tu flota no lleva ningún arma de nave, entra en esta batalla preliminar con potencia de fuego nula — los defensores la aniquilan por completo, barcazas y Legionarios incluidos, antes incluso de desembarcar. <strong>Escolta siempre tus flotas de invasión con naves de combate</strong> — consulta el artículo <em>Raids (saqueo)</em> para la misma trampa en el saqueo.</p>

            <h2 id="combat">Fase 2 — Combate terrestre</h2>
            <p>El combate terrestre se desarrolla en <strong>10 rondas máximo</strong>. En cada ronda, los dos bandos intercambian pérdidas.</p>
            <table>
                <tr><th>Unidad</th><th>Rol</th></tr>
                <tr><td><strong>Legionario</strong></td><td>Ataque y defensa. Potenciados por la investigación Alambradas para la defensa.</td></tr>
                <tr><td><strong>Mecha</strong></td><td>Potente unidad de defensa pesada (máx. 500 por planeta).</td></tr>
                <tr><td><strong>Trabajador</strong></td><td>Defensa pasiva, <strong>únicamente en invasión</strong> (no en raid).</td></tr>
            </table>
            <p><strong>El atacante gana únicamente si</strong> todas las tropas del defensor son eliminadas <strong>y</strong> le queda al menos 1 Legionario vivo. Si no, <strong>gana el defensor por ventaja del terreno</strong>.</p>

            <h2 id="deploiement">Los despliegues tácticos del defensor</h2>
            <p>El defensor puede haber elegido un <strong>despliegue táctico</strong> invisible para ti. Recuérdalo: puede dar la vuelta a una situación que parecía ganada de antemano.</p>
            <table>
                <tr><th>Despliegue</th><th>Efecto</th><th>Contrapartida</th></tr>
                <tr><td><strong>Equilibrado</strong></td><td>Ningún bonus ni malus.</td><td>Neutro.</td></tr>
                <tr><td><strong>Fortificado</strong></td><td>+30&nbsp;% defensa terrestre.</td><td>−20&nbsp;% de contraataque.</td></tr>
                <tr><td><strong>Guerrilla</strong></td><td>Trabajadores +150&nbsp;% en defensa.</td><td>Legionarios al −50&nbsp;%.</td></tr>
                <tr><td><strong>Último Bastión</strong></td><td>+50&nbsp;% si las tropas caen por debajo del 30&nbsp;%.</td><td>Condicional.</td></tr>
                <tr><td><strong>Tierra Quemada</strong></td><td>Ningún bonus activo.</td><td>Si pierdes un raid, el 50&nbsp;% de los recursos no saqueados son destruidos.</td></tr>
            </table>

            <h2 id="victoire">Si ganas la invasión</h2>
            <ul>
                <li><strong>Captura</strong> — el planeta pasa a ser tuyo, con sus edificios. Los trabajadores se reinician a un umbral base (~2&nbsp;000).</li>
                <li><strong>Planeta Cthulhu</strong> — si recuperas un planeta capturado por los Cthulhu, es liberado (edificios reiniciados, recompensa en uranio).</li>
                <li><strong>¿Sin sitio para colonizar?</strong> El planeta conquistado se convierte en una base Cthulhu: no te lo quedas.</li>
            </ul>
            <p>Las <strong>filas de producción</strong> no acompañan al planeta capturado: tanto las naves como las defensas (torretas o tropas) ya pagadas pero aún no entregadas se pierden en la captura — un pedido hecho por el vencido nunca cambia de manos. Lo que se entregó antes del asalto, en cambio, está en tierra y acompaña al planeta.</p>
            <p>Si el planeta capturado alberga un <strong>héroe secundario</strong> enemigo, su destino se decide de inmediato: lo <strong>capturas</strong> si posees una Prisión (nivel 1 o superior), o si no, es <strong>ejecutado</strong>. Un raid, en cambio, nunca toma el planeta y por tanto nunca pone a un héroe en juego. Detalles en el artículo <em>Héroes secundarios</em>.</p>

            <h2 id="gameover">Eliminación del defensor</h2>
            <p>Si el defensor pierde su <strong>último planeta</strong>, es eliminado del servidor. Te quedas con todo: Bitcoins, flotas supervivientes y Puntos de Guerra asociados.</p>

            <h2 id="defaite">Si pierdes la invasión</h2>
            <p>Las <strong>barcazas son capturadas por el defensor</strong>. Los Legionarios desembarcados se pierden. Es una derrota costosa: sondea antes de invadir.</p>

    raid:
        title: "Raids (saqueo)"
        category: "combat"
        order: 3
        tags: "raid,saqueo,robo,recursos,búnker,barcazas"
        summary: "Saquear los recursos de un planeta enemigo sin buscar conquistarlo."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">¿Qué es un raid?</h2>
            <p>Un raid es un ataque terrestre cuyo objetivo es <strong>robar recursos</strong>. No tomas el planeta: te vas con un botín. Consecuencia importante: un raid, incluso exitoso, nunca toma el planeta, así que <strong>ningún héroe secundario es capturado ni ejecutado</strong> ahí, seas atacante o defensor.</p>

            <h2 id="difference">Raid vs Invasión</h2>
            <table>
                <tr><th></th><th>Raid</th><th>Invasión</th></tr>
                <tr><td>Objetivo</td><td>Robar niobio, agua, uranio</td><td>Tomar posesión del planeta</td></tr>
                <tr><td>Defensores</td><td>Legionarios + Mechas</td><td>Legionarios + Mechas + Trabajadores</td></tr>
                <tr><td>Imprevisibilidad</td><td>Baja</td><td>Más fuerte (factor aleatorio de ataque más amplio)</td></tr>
                <tr><td>Pérdida de barcazas si derrota</td><td>No</td><td>Sí (capturadas por el defensor)</td></tr>
            </table>

            <h2 id="combat">Cómo ocurre</h2>
            <p>Mismas etapas que la invasión (combate orbital eventual, luego 10 rondas en tierra), <strong>pero los trabajadores no defienden</strong>. Los Legionarios y Mechas del defensor están solos.</p>
            <p><strong>Planeta protegido por una flota en órbita</strong> — si el objetivo está protegido por una flota <strong>armada</strong> del propietario, o por una flota <strong>armada</strong> de un aliado de su alianza (una sonda o un carguero solos ya no bastan), tu raid desencadena primero una batalla contra ese defensor y las torretas del planeta. Esta batalla nunca se desencadena contra un socio de paz, de pacto, un aliado o tu propia alianza, ni en un servidor PvE. El saqueo no ocurre de inmediato: si ganas esa batalla, debes <strong>relanzar</strong> un raid para saquear de verdad — y si el planeta sigue protegido, hacer clic en «Saquear» desde la órbita también es <strong>rechazado</strong>: activa primero el modo ataque de tu propia flota para forzar el combate. En el lado atacante, esta batalla solo se desencadena si tu propia flota de raid es ofensiva — armas de nave, Legionarios o Mechas a bordo: un carguero puro, sin ningún arma ni tropa, no desencadena nada.</p>

            <h2 id="raid-solo-tropas">Un raid solo de tropas es aniquilado</h2>
            <p>Llevar Legionarios o Mechas basta para desencadenar esta batalla — pero si tu flota de raid no porta <strong>ningún arma de nave</strong>, entra en ese combate con potencia de fuego nula. Los defensores la aniquilan por completo, sin perder ni una sola nave. <strong>Escolta siempre tus transportes de tropas</strong>: es la sorpresa más cara que este sistema puede depararte.</p>

            <h2 id="pillage">El saqueo (en caso de victoria)</h2>
            <p>Recuperas tantos recursos como pueda transportar tu flota. Los recursos se toman en este orden:</p>
            <ol>
                <li><strong>Niobio</strong> primero.</li>
                <li>Luego <strong>Agua</strong>.</li>
                <li>Finalmente <strong>Uranio</strong> (si queda sitio).</li>
            </ol>

            <h2 id="bunker">El búnker protege una parte</h2>
            <p>El búnker del defensor <strong>pone a salvo el 5&nbsp;% del almacenamiento máx. por nivel</strong>. Ejemplos:</p>
            <ul>
                <li>Búnker nivel 5 → 25&nbsp;% del almacenamiento máx. protegido en niobio y agua.</li>
                <li>Búnker nivel 10 → 50&nbsp;% protegido.</li>
            </ul>
            <p>El uranio está protegido de la misma manera: <strong>5&nbsp;% de tu reserva de uranio por nivel de búnker</strong> (el uranio no tiene almacenamiento máximo, así que la protección se aplica a la reserva actual).</p>

            <h2 id="scorched">Atención a la Tierra Quemada</h2>
            <p>Si el defensor ha elegido el <strong>despliegue táctico Tierra Quemada</strong> y pierde, <strong>el 50&nbsp;% de los recursos restantes (no saqueados) son destruidos</strong>. Te vas con tu botín, pero el adversario no puede recuperarlo todo después.</p>

    nuclear:
        title: "Ataque nuclear"
        category: "combat"
        order: 4
        tags: "nuclear,bomba,uranio,destrucción,interceptor"
        summary: "El arma definitiva para destruir los edificios clave de un enemigo — siempre que no tenga defensa antimisil."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Lo que necesitas</h2>
            <ul>
                <li>Un edificio <strong>Base nuclear</strong>.</li>
                <li><strong>Uranio</strong> (muy raro).</li>
                <li>Una <strong>bomba nuclear</strong> fabricada.</li>
                <li>Una flota que parte en <strong>misión Nuclear</strong> hacia el objetivo, con la bomba a bordo.</li>
            </ul>

            <h2 id="degats">¿Qué hace una bomba que acierta?</h2>
            <p>La bomba <strong>destruye un edificio</strong>, prioritariamente los más estratégicos:</p>
            <ol>
                <li><strong>Metrópolis</strong> — pérdida de 1 nivel (−80&nbsp;000 trabajadores máx.).</li>
                <li><strong>Ciudad</strong> — pérdida de 1 nivel (−25&nbsp;000 trabajadores máx.).</li>
                <li><strong>Búnker</strong> — pérdida de 1 nivel (protección reducida).</li>
                <li><strong>Cuartel</strong> — pérdida de 1 nivel (−5&nbsp;000 Legionarios máx.).</li>
            </ol>
            <p>La bomba apunta al primer edificio encontrado en este orden.</p>

            <h2 id="regle">Reglas especiales</h2>
            <ul>
                <li>Una flota en misión Nuclear <strong>no puede ser interceptada</strong> por una flota en órbita. Va directa a su objetivo.</li>
                <li>La única forma de detenerla: el <strong>interceptor nuclear</strong> del defensor.</li>
            </ul>

            <h2 id="anti">La defensa: el interceptor nuclear</h2>
            <p>Si el planeta objetivo posee al menos un <strong>interceptor nuclear</strong>, la bomba es automáticamente neutralizada:</p>
            <ul>
                <li>La flota portadora es <strong>destruida</strong>.</li>
                <li>Se consumen <strong>1 a 3 interceptores</strong>.</li>
                <li>Los dos jugadores reciben un informe.</li>
            </ul>
            <p>Moraleja: una base estratégica vale siempre unos interceptores. Sin ellos, es vulnerable.</p>

    defense:
        title: "Defender tus planetas"
        category: "combat"
        order: 5
        tags: "defensa,soldados,tanques,torreta,escudo,búnker,orbital,táctica,despliegue,estadisticas,potencia"
        summary: "Las 3 capas de defensa: orbital (torretas), táctica (despliegue), terrestre (Legionarios + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Las 3 capas de defensa</h2>
            <ol>
                <li><strong>Defensa orbital</strong> — torretas, escudos, base espacial. Interceptan la flota antes de que desembarque.</li>
                <li><strong>Despliegue táctico</strong> — una elección estratégica que modifica la potencia de tus tropas en tierra.</li>
                <li><strong>Defensa terrestre</strong> — Legionarios, Mechas, trabajadores (para las invasiones).</li>
            </ol>

            <h2 id="mode-attaque">Activar el modo ataque de tu planeta</h2>
            <p>Si tu planeta posee <strong>al menos una torreta</strong>, puedes activar el <strong>modo ataque</strong>. En este modo, en cuanto una flota enemiga en modo ataque llega a órbita, un <strong>combate orbital</strong> comienza automáticamente.</p>
            <ul>
                <li><strong>Victoria</strong>: la flota enemiga es destruida y cobras <strong>puntos de guerra</strong> proporcionales a su firma (mucho menos frente a un Cthulhu).</li>
                <li><strong>Derrota</strong>: todas tus torretas, escudos, tu base espacial y tu fila de producción de defensas en curso son aniquilados; el modo ataque se <strong>desactiva automáticamente</strong> (un planeta sin torreta no puede mantenerlo activo), y la flota continúa hacia el combate terrestre.</li>
            </ul>
            <p>Sin torreta, tus escudos y la base espacial son destruidos <strong>sin siquiera combatir</strong>.</p>
            <p>Dos sitios para activarlo: la página <strong>Defensa</strong> de un planeta, o la página <strong>Planetas</strong>, que muestra el estado de cada planeta (una mira junto a sus defensas, pulsable para alternar) y ofrece <strong>«Activar todo»</strong> / <strong>«Desactivar todo»</strong> en todo tu imperio. El cambio masivo omite los planetas sin torreta o ya metidos en un combate, y te dice cuántos se omitieron.</p>
            <p><strong>Atención</strong>: activar el modo ataque en un planeta sobre el que ya está una flota enemiga desencadena el combate orbital <strong>cinco minutos después</strong>. En masa, pueden empezar varias batallas a la vez — el mensaje te dice cuántas.</p>
            <p><strong>Lo que trae consigo el atacante.</strong> La flota que asalta tus torretas combate ahora con <strong>todas sus bonificaciones</strong>: las bonificaciones de alianza de su comandante (misiles, láseres, plasma, blindaje, escudo, precisión) y las bonificaciones de equipo de su héroe embarcado. Hasta el 10 de septiembre de 2026 solo contaban en el combate espacial: una alianza que hubiera invertido hasta +5&nbsp;% en cada una de esas seis estadísticas no obtenía nada frente a las torretas. Vale en ambos sentidos — tus propias flotas conservan sus bonificaciones cuando eres tú quien asalta un planeta en modo ataque — y las cifras de los informes orbitales están ya en la misma escala que las de los informes espaciales.</p>

            <h2 id="defensas-y-tus-flotas">Tus defensas también disparan sin el modo ataque</h2>
            <p>El modo ataque no es la única forma de hacer disparar tus torretas. En cuanto una de tus flotas —o una flota <strong>armada</strong> de un aliado de tu alianza— está en órbita del planeta cuando estalla un combate espacial ahí, tus defensas se unen automáticamente a ese combate, con el modo ataque activo o no (un planeta sin nada que defender —ninguna torreta, ningún escudo, ninguna base espacial— nunca participa). Eso lo convierte en una <strong>única batalla</strong>: sin segundo combate orbital aparte. En ella, el bonus de blindaje de tu <strong>base espacial</strong> (+20&nbsp;%) beneficia tanto a tus torretas como a tus escudos, y la afinidad militar de tu <strong>héroe estacionado</strong> refuerza el fuego de tus propias torretas y puede portar Intimidación o Táctico para todo tu bando, igual que un héroe de flota. Tus torretas apuntan ahí con su propia precisión (70, por encima de lo que puede alcanzar cualquier flota), y sufren <strong>pérdidas reales</strong> — proporcionales al daño encajado si tu bando gana, <strong>totales</strong> (torretas, escudos, base espacial, fila de producción de defensas en curso, modo ataque desactivado) si tu bando cae. Ganas la parte de <strong>puntos de guerra</strong> de tu planeta cada vez que tu bando gana esta batalla — incluso si no aportaste ninguna flota propia. Consecuencia para tus adversarios: un planeta protegido por una de tus flotas <strong>armada</strong> o por una flota aliada armada (una sonda o un carguero solos ya no cuentan) ya no puede ser saqueado ni invadido sin batalla previa, tanto si el atacante llega de nuevo como si hace clic en «Saquear»/«Invadir» desde la órbita — y ese combate nunca se desencadena contra un socio de paz, de pacto, un aliado, tu propia alianza o en un servidor PvE.</p>
            <p><strong>¿No has aportado ninguna flota propia?</strong> Aun así recibes un informe dedicado que te indica si tus defensas resistieron o fueron destruidas, con el detalle de lo que perdieron tus torretas y tu parte de puntos de guerra si ganaste: nunca te quedas sin saber la suerte de tu planeta.</p>

            <h2 id="combat-orbital">El combate orbital en detalle</h2>
            <p>Las torretas disparan a la flota enemiga al ritmo de las rondas. La <strong>Base espacial</strong> da un bonus de armadura a todas las defensas (+20&nbsp;%). Los escudos (50&nbsp;000 o 600&nbsp;000 pts de armadura) absorben los primeros disparos.</p>
            <p>Tus torretas disparan <strong>desde la primera ronda</strong>, sea cual sea la flota enfrente: la pantalla de una nave nunca retrasa su salva de apertura. Esa pantalla es una reserva que encaja el daño hasta agotarse. Cada salva la atraviesa de entrada según su <strong>poder de perforación</strong> (plasma ×4, láser ×2, misiles ÷ 7); el resto desgasta la pantalla, y lo que la desborda alcanza el casco. Una defensa hecha solo de lanzamisiles sigue en desventaja frente a una flota con gran escudo — pero dispara, causa pérdidas y deja escombros.</p>
            <p>Incluso si la flota enemiga se impone, su pantalla de cazas ya no la protege indefinidamente: tus torretas infligen pérdidas reales también a sus naves más pesadas, en proporción al daño que encaja — como mucho para ella, el 95&nbsp;% de su blindaje inicial. Defenderte, por tanto, siempre le cuesta algo al atacante, incluso si gana.</p>

            <h2 id="deploiement">El despliegue táctico</h2>
            <p>Cada planeta puede elegir un <strong>despliegue táctico</strong>. Es <strong>invisible para el atacante</strong> — es tu carta oculta.</p>
            <table>
                <tr><th>Despliegue</th><th>Efecto</th><th>Contrapartida</th></tr>
                <tr><td><strong>Equilibrado</strong></td><td>Ningún bonus ni malus.</td><td>Neutro.</td></tr>
                <tr><td><strong>Fortificado</strong></td><td>+30&nbsp;% defensa terrestre.</td><td>−20&nbsp;% de contraataque.</td></tr>
                <tr><td><strong>Guerrilla</strong></td><td>Trabajadores +150&nbsp;% en defensa.</td><td>Legionarios al −50&nbsp;%.</td></tr>
                <tr><td><strong>Último Bastión</strong></td><td>+50&nbsp;% si tus tropas caen por debajo del 30&nbsp;%.</td><td>Ningún efecto antes de ese umbral.</td></tr>
                <tr><td><strong>Tierra Quemada</strong></td><td>Ningún bonus activo.</td><td>Si pierdes un raid: el 50&nbsp;% de tus recursos restantes son destruidos.</td></tr>
            </table>

            <h2 id="combat-sol">El combate terrestre</h2>
            <p>Se juega en <strong>10 rondas máximo</strong>. En cada ronda, los dos bandos sufren pérdidas. Si nadie gana en 10 rondas, <strong>el atacante es rechazado</strong> (ventaja del terreno).</p>

            <h2 id="troupes">Las unidades terrestres</h2>
            <table>
                <tr><th>Unidad</th><th>Rol</th><th>Notas</th></tr>
                <tr><td><strong>Legionarios</strong></td><td>Ataque y defensa.</td><td>Fuerte bonus defensivo con la investigación Alambradas.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>Defensa pesada.</td><td>Máx. 500 por planeta. Consumen comida.</td></tr>
                <tr><td><strong>Trabajadores</strong></td><td>Defensa pasiva.</td><td>Únicamente contra invasiones, no raids.</td></tr>
            </table>

            <h2 id="ressources-defense">Recursos utilizados para producir tus defensas</h2>
            <p>Al igual que el Astillero espacial, la producción de defensas recurre primero a los recursos <strong>del planeta</strong>, y luego al <strong>cargo de las flotas estacionadas en órbita</strong>. Así puedes seguir reclutando aunque el stock en tierra sea bajo, mientras haya flotas cargadas presentes sobre el planeta.</p>

            <h2 id="installations">Instalaciones orbitales y defensas</h2>
            <ul>
                <li><strong>Torretas</strong> — lanzamisiles, láser, láser pesado, Gauss, iónica, plasma. Variadas para contrarrestar distintos tipos de flotas.</li>
                <li><strong>Escudo</strong> (50&nbsp;000 pts) y <strong>Gran escudo</strong> (600&nbsp;000 pts) — absorben los primeros disparos.</li>
                <li><strong>Base espacial</strong> — +20&nbsp;% de armadura a todas las defensas orbitales.</li>
            </ul>

            <h2 id="stats-defensives">Leer la potencia de tu planeta</h2>
            <p>La página <strong>Defensa</strong> tiene dos pestañas. La segunda, <strong>Estadísticas defensivas</strong>, resume lo que vale realmente el planeta: el blindaje, los misiles, los láseres y los plasmas acumulados de todas tus torretas, la aportación de cada estructura, el efecto del escudo, del gran escudo y de la base espacial sobre el blindaje que una flota afronta de verdad, y la potencia de tu defensa terrestre. Es la forma más rápida de detectar la estadística rezagada antes de lanzar una nueva tanda de construcciones.</p>
            <p>Un detalle de lectura: el gráfico circular y las barras muestran el blindaje de <strong>las estructuras solamente</strong>. Los importes de escudo aparecen aparte, en los modificadores, porque de lo contrario aplastarían cualquier comparación entre tus armas.</p>

            <h2 id="bunker">El búnker contra el saqueo</h2>
            <p>El búnker protege <strong>5&nbsp;% del almacenamiento máx. por nivel</strong> contra los raids. Un búnker nivel 5 ya pone el 25&nbsp;% de tus reservas a salvo. El uranio está protegido a razón del 5&nbsp;% de su reserva actual por nivel.</p>

            <h2 id="entretien">Atención al coste de mantenimiento</h2>
            <p>Las unidades en <strong>misión</strong> (flotas, barcazas partidas) cuestan <strong>mucho más caro</strong> que las estacionadas. Por ejemplo, un Mecha en guarnición cuesta poco, pero un Mecha embarcado cuesta ~50× más. No dejes un gran ejército en viaje permanente.</p>

    embargo:
        title: "Embargo y hambruna"
        category: "combat"
        order: 6
        tags: "embargo,hambruna,bloqueo,asedio,planeta,comida,abastecimiento,raciones"
        summary: "Hambrear un planeta antes de invadirlo: el bloqueo, la hambruna que se instala y cómo sobrevivir."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Un <strong>embargo</strong> es un asedio planetario. Mantienes una gran flota en órbita de un planeta enemigo; los intercambios se cortan, la comida se agota, la población sufre. Cuando el planeta está debilitado, pasas al asalto.</p>

            <h2 id="consommation">Recordatorio: la comida</h2>
            <p>Tus trabajadores, Legionarios y Mechas consumen comida continuamente. Si tus reservas caen a <strong>0</strong>, es la <strong>hambruna</strong>.</p>

            <p>Las raciones <strong>viajan en la bodega</strong>: cárgalas en un planeta y descárgalas en otro para reabastecer. Mientras una de tus flotas esté <strong>atracada</strong> (ni en vuelo ni en combate) sobre tu planeta, sus raciones completan el granero — y un asedio las consume como el resto: la bodega no es una caja fuerte.</p>

            <h2 id="famine">La hambruna (fuera de embargo)</h2>
            <p>Cuando falta la comida, las pérdidas se encadenan en <strong>3 fases</strong>:</p>
            <ul>
                <li><strong>Fase 1 (0–3h)</strong> — pérdidas moderadas de trabajadores. Tiempo para reaccionar.</li>
                <li><strong>Fase 2 (3–8h)</strong> — pérdidas aceleradas. Legionarios empiezan a desertar.</li>
                <li><strong>Fase 3 (más allá de 8h)</strong> — colapso: trabajadores diezmados, Legionarios huyendo, Mechas abandonados.</li>
            </ul>
            <p>Un suelo de <strong>5&nbsp;000 trabajadores</strong> evita la desaparición total. Sin abastecimiento, un planeta alcanza este suelo en ~27 horas.</p>

            <h2 id="declenchement">Cómo desencadenar un embargo</h2>
            <p>Un embargo se activa automáticamente cuando:</p>
            <ul>
                <li>Al menos una <strong>flota enemiga</strong> (fuera de aliados) está en órbita,</li>
                <li>en <strong>modo ataque</strong>,</li>
                <li>con <strong>suficientes naves pesadas</strong> (equivalente a ~250 acorazados, 37 destructores o 3 naves nodrizas).</li>
            </ul>
            <p>En cuanto la flota enemiga se va o es destruida, el bloqueo se levanta.</p>
            <p>Una flota de raid o invasión marcada como «en ataque» por la batalla fusionada descrita en el artículo <em>Defender tus planetas</em> conserva esa marca si sobrevive: si se queda en órbita, cuenta para esta firma igual que cualquier otra flota hostil.</p>

            <h2 id="effets">Lo que sufre el planeta asediado</h2>
            <ul>
                <li><strong>Drenaje de comida por hora</strong> adicional: la población entra en pánico y consume más.</li>
                <li><strong>Producción de comida</strong> reducida (granjas perturbadas).</li>
                <li><strong>Producción de niobio y agua</strong> reducida.</li>
                <li><strong>Crecimiento de los trabajadores</strong> casi detenido.</li>
                <li><strong>Mercado bloqueado</strong>: no más ventas automáticas a los comerciantes.</li>
                <li><strong>Cargueros extranjeros bloqueados</strong>: solo tus cargueros o los de tus aliados pueden aterrizar (abastecimiento aliado).</li>
            </ul>

            <h2 id="famine-embargo">Hambruna bajo embargo: es peor</h2>
            <p>Si la comida cae a 0 <strong>durante</strong> un embargo, las pérdidas son <strong>más pesadas</strong> e inmediatas: trabajadores, Legionarios y Mechas declinan los tres, continuamente.</p>

            <h2 id="timings">¿Cuánto tiempo se aguanta?</h2>
            <table>
                <tr><th>Perfil de planeta</th><th>Inicio de hambruna</th><th>Colapso</th></tr>
                <tr><td>Pequeño (50 000 trabajadores, 100 000 comida)</td><td>~14 horas</td><td>~1.75 día</td></tr>
                <tr><td>Medio (150 000 trabajadores, 800 000 comida)</td><td>~1.5 día</td><td>~3.25 días</td></tr>
                <tr><td>Fortaleza (200 000 trabajadores, 2 000 000 comida)</td><td>~3 días</td><td>~4.8 días</td></tr>
            </table>

            <h2 id="defense">Cómo resistir un embargo</h2>
            <ul>
                <li><strong>Destruir la flota asediadora</strong> para levantar el bloqueo.</li>
                <li><strong>Traer abastecimiento aliado</strong> — tus cargueros y los de tu alianza siempre pasan.</li>
                <li><strong>Evacuar</strong> — tus flotas <em>salientes</em> no están bloqueadas, puedes vaciar tus recursos de urgencia.</li>
                <li><strong>Construir Silos</strong> y almacenar comida <em>antes</em> de que la cosa se tuerza.</li>
                <li><strong>Pedir ayuda a tu alianza</strong> para romper el asedio entre varios.</li>
            </ul>

            <h2 id="rapports">Los informes durante un embargo</h2>
            <p>Cada hora, tú (y el atacante) recibís un informe: tiempo transcurrido, comida restante, pérdidas sufridas. La página Planeta muestra también una sección <strong>Abastecimiento</strong> muy útil (producción, consumo, autonomía estimada).</p>

    combat_stats:
        title: "Comprender la potencia de las tropas"
        category: "combat"
        order: 7
        tags: "potencia,bonus,combate,política,cálculo,facción"
        summary: "Cómo se compara la potencia de tus unidades y lo que la potencia."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Potencia en tierra</h2>
            <p>En orden de magnitud (sin bonus):</p>
            <table>
                <tr><th>Unidad</th><th>Potencia relativa</th><th>Rol</th></tr>
                <tr><td><strong>Mecha</strong></td><td>Muy alta</td><td>Pilar de defensa. Caro, pero aplasta una pequeña invasión.</td></tr>
                <tr><td><strong>Legionario (defensa)</strong></td><td>Alta si investigación Alambradas subida</td><td>Multiplicador defensa × nivel Alambradas.</td></tr>
                <tr><td><strong>Legionario (ataque)</strong></td><td>Media, con aleatorio</td><td>Variable — un raid es menos imprevisible que una invasión.</td></tr>
                <tr><td><strong>Trabajador (defensa)</strong></td><td>Débil, pero el número cuenta</td><td>Únicamente en invasión. 200 000 trabajadores pesan.</td></tr>
            </table>
            <p>Las <strong>barcazas</strong> no combaten: transportan 1&nbsp;000 Legionarios cada una (más con las investigaciones de alianza).</p>

            <h2 id="bonus">Lo que aumenta tu potencia</h2>
            <ul>
                <li><strong>Investigación Alambradas</strong> — multiplicador masivo en la defensa de Legionarios.</li>
                <li><strong>Investigación Disciplina</strong> — mejora los Legionarios en tierra.</li>
                <li><strong>Investigaciones de alianza</strong> — bonus de ataque Legionario, defensa Mechas, defensa trabajadores, potencia de fuego naves, armadura naves, capacidad barcazas.</li>
                <li><strong>Despliegue táctico</strong> — elección que puede potenciar defensa o contraataque.</li>
                <li><strong>Héroe Militar</strong> — bonus directo de ataque y defensa.</li>
                <li><strong>Items</strong> equipados en el héroe.</li>
            </ul>

            <h2 id="faction">Bonus político (combates espaciales)</h2>
            <p>El bonus de armas del combate espacial viene de la <strong>política de tu alianza</strong>. Cada régimen vence a su rival: la <strong>Democracia</strong> vence al <strong>Comunismo</strong>, que vence al <strong>Fascismo</strong>, que vence a la <strong>Democracia</strong>.</p>
            <p>Cuando la política del <strong>atacante</strong> vence a la del defensor, todas sus armas (misiles, láseres, plasma) ganan <strong>+20&nbsp;%</strong> para ese combate. El bonus solo se aplica al agresor: el defensor cuenta con sus defensas planetarias.</p>

            <h2 id="precision">Precisión y tiradas de combate</h2>
            <p>En combate espacial, cada bando dispara <strong>una salva por ronda</strong>. Una tirada aleatoria, sacada entre la precisión del bando y 100 y dividida por 80, modula el daño de la salva de <strong>×0,3 a ×1,2</strong>. Una precisión alta no hace tus golpes más fuertes: elimina las malas tiradas.</p>
            <p>La puntería de una flota ya no se muestra nunca en porcentaje&nbsp;: en todas partes — Astillero espacial, página de gestión de flota, pestaña Defensas e informes de combate — el juego muestra el <strong>multiplicador de daño</strong> que produce realmente (<strong>×0,66</strong> sin ninguna inversión, <strong>×0,94</strong> con la puntería al máximo). Ese nivel depende de los puntos de <strong>personalización</strong> invertidos en precisión para cada modelo de nave (40 puntos/día) y es propio de ese modelo&nbsp;: gastar tus puntos en otra parte, en la armadura o las armas del mismo modelo, nunca lo hace bajar. Cuando varias flotas combaten juntas, el bando usa la media de sus punterías. Las defensas de un planeta disparan a <strong>×1,06</strong> — mejor que una flota con la puntería al máximo. Frente a un adversario dirigido por la IA (bot), su puntería nunca baja de un suelo fijo y conocido&nbsp;: un bot que realmente invierte lo supera, y un jugador suficientemente invertido puede igualarlo o superarlo.</p>

    reports:
        title: "Los informes del juego"
        category: "beginner"
        order: 9
        tags: "informe,notificación,combate,espionaje,alianza,colonización,mensajes"
        summary: "El juego te envía informes para todo evento importante. Aquí donde encontrarlos y lo que contienen."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">¿Dónde encontrar tus informes?</h2>
            <p>Haz clic en <strong>Mensajes</strong> en el menú de la izquierda. Allí encontrarás todos los informes recibidos, clasificados por tipo. Un punto de color señala los mensajes no leídos.</p>
            <p>También puedes activar las <strong>notificaciones push</strong> para recibir una alerta en tu teléfono o navegador (ver artículo dedicado).</p>

            <h2 id="combat">Informes de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — una de tus flotas se ha cruzado con una flota enemiga.</li>
                <li><strong>Combate orbital</strong> — tus defensas planetarias han repelido (o no) a un atacante.</li>
                <li><strong>Defensas planetarias</strong> — informe dedicado para el propietario de un planeta que no aportó ninguna flota propia en una batalla fusionada: sus defensas resistieron o fueron aniquiladas.</li>
                <li><strong>Raid</strong> — saqueo sufrido o infligido.</li>
                <li><strong>Invasión</strong> — intento de toma de planeta (de un lado o del otro).</li>
                <li><strong>Nuclear</strong> — bomba enviada o recibida.</li>
                <li><strong>Embargo</strong> — punto horario si uno de tus planetas está asediado.</li>
            </ul>

            <h2 id="cthulhu">Informes Cthulhu</h2>
            <ul>
                <li><strong>Ataque Cthulhu</strong> — horda Cthulhu contra tu planeta.</li>
                <li><strong>Tower Defense</strong> — victoria o derrota de tu defensa activa.</li>
                <li><strong>Liberación de planeta</strong> — recuperación de un planeta a los Cthulhu.</li>
            </ul>

            <h2 id="flotte">Informes de flota</h2>
            <ul>
                <li><strong>Llegada de flota</strong> — tu flota ha alcanzado su destino.</li>
                <li><strong>Depósito de recursos</strong> — un aliado te ha enviado algo.</li>
                <li><strong>Reciclaje terminado</strong> — tus recicladores han terminado su trabajo.</li>
                <li><strong>Espionaje</strong> — resultado de una sonda enviada (o sonda detectada en casa).</li>
            </ul>

            <h2 id="alliance">Informes de alianza</h2>
            <ul>
                <li><strong>Diplomacia</strong> — declaración de guerra, propuesta de pacto, paz aceptada, ruptura de un pacto de no agresión o de una alianza defensiva, expiración de un acuerdo de paz.</li>
                <li><strong>Miembros</strong> — llegada, salida, expulsión, Game Over de un compañero.</li>
            </ul>

            <h2 id="divers">Otros informes</h2>
            <ul>
                <li><strong>Informe diario</strong> — tu balance económico cotidiano (18h59 UTC).</li>
                <li><strong>Colonización</strong> — nuevo planeta fundado.</li>
                <li><strong>Venta comerciante</strong> — tus recursos han sido comprados.</li>
                <li><strong>Bonus de conexión</strong> — Bitcoins del día recibidos.</li>
                <li><strong>Prisión</strong> — héroe capturado o liberado.</li>
            </ul>
            <h2 id="compte-valide">Cuenta por validar</h2>
            <p>⚠️ Para <strong>enviar un mensaje o Bitcoins</strong> a otro jugador, tu cuenta debe estar <strong>validada</strong> (identificador creado) y tu <strong>correo confirmado</strong>. Las cuentas de prueba/anónimas no pueden — confirma tu correo desde <strong>Mis opciones</strong>.</p>

    battle_reports:
        title: "Leer un informe de combate"
        category: "combat"
        order: 8
        tags: "informe,combate,victoria,derrota,análisis"
        summary: "Tras cada combate, un informe detallado. Aquí cómo decodificarlo para golpear mejor la próxima vez."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Dónde encontrarlos</h2>
            <p>Todos los informes de combate llegan a tu página <strong>Mensajes</strong>. Están clasificados por tipo (espacial, raid, invasión, orbital, embargo, nuclear).</p>

            <h2 id="types">Tipos de informes de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — dos flotas se han cruzado.</li>
                <li><strong>Combate orbital</strong> — tus defensas planetarias han interceptado una flota.</li>
                <li><strong>Defensas planetarias</strong> — batalla fusionada en la que no aportaste ninguna flota propia: tus torretas, escudos y base espacial resistieron, o fueron destruidos.</li>
                <li><strong>Raid</strong> — intento de saqueo (de tu lado o contra ti).</li>
                <li><strong>Invasión</strong> — intento de toma de planeta.</li>
                <li><strong>Nuclear</strong> — bomba enviada o recibida.</li>
                <li><strong>Embargo</strong> — informe horario durante un asedio.</li>
            </ul>

            <h2 id="contenu">Qué contiene un informe</h2>
            <ul>
                <li><strong>Fuerzas implicadas</strong> — blindaje inicial, escudo y armas de cada bando, y la composición de cada flota. La puntería ya no figura en porcentaje, sino como el <strong>multiplicador de daño</strong> que produce realmente (×0,66 sin ninguna inversión, ×0,94 con la puntería al máximo, ×1,06 para las defensas de un planeta): ningún disparo falla nunca, una mejor puntería eleva el mínimo de su daño.</li>
                <li><strong>Salvas</strong> — cuántas salvas disparó este bando, cuántas fueron contra el escudo enemigo, y si su propio escudo fue perforado o resistió.</li>
                <li><strong>Carga de escudo</strong> — para un bloque de flota, el porcentaje de carga al principio y al final del combate, junto con su capacidad total: tu escudo no vuelve automáticamente al 100&nbsp;% de un combate a otro, se recarga progresivamente (ver el artículo <em>Combate espacial</em>).</li>
                <li><strong>Blindaje restante</strong> — lo que sigue en pie, y su parte del blindaje inicial. Un bando aniquilado muestra en su lugar el <strong>daño excedente</strong> que recibió más allá de su blindaje: ese es su margen de victoria.</li>
                <li><strong>Daño encajado</strong> — dos contadores por bando: <strong>casco</strong> (lo que atravesó el escudo) y <strong>escudo</strong> (lo que el muro bloqueó). Tus pérdidas derivan directamente de ellos.</li>
                <li><strong>Pérdidas</strong> — nave por nave, en ambos lados.</li>
                <li><strong>Defensas planetarias detalladas</strong> — pérdidas de torretas, más tu Escudo, Gran escudo y Base espacial cuando los tienes; la puntuación de defensa y la etiqueta «Ataque» mostradas en una batalla fusionada son ahora las reales.</li>
                <li><strong>Recursos saqueados</strong> (en los raids) y <strong>escombros generados</strong> — ¡a reciclar!</li>
                <li><strong>Puntos de Guerra ganados</strong> y resultado final.</li>
            </ul>

            <h2 id="analyser">Cómo sacar una lección</h2>
            <ul>
                <li>Mira primero el <strong>daño encajado</strong>: la línea «casco» cuenta la exposición de tus naves sin escudo <em>y</em> lo que atravesó un escudo perforado; la línea «escudo», lo que el muro absorbió (tus naves con escudo se desgastan en proporción).</li>
                <li>Compare los dos <strong>multiplicadores de daño</strong>: es la única cifra directamente comparable entre bandos, y ahora la única que muestra el juego — los porcentajes de precisión han desaparecido de todas las pantallas. Luego mire el <strong>blindaje restante</strong> — ganar conservando el 5&nbsp;% de su blindaje y ganar conservando el 70&nbsp;% se leían igual antes. Un excedente grande en el adversario significa que pagó la victoria demasiado cara.</li>
                <li>Las pérdidas entre tus <strong>cazas</strong> son normales incluso cuando el muro aguanta: sin escudo, encajan su parte del fuego de lleno — pero al ser pequeños, solo atraen una parte reducida.</li>
                <li>¿Muchas <strong>salvas gastadas en el escudo enemigo</strong>? Construye plasma (×4 contra escudos) para perforar más rápido.</li>
                <li><strong>100 rondas alcanzadas</strong>: gana el bando que conserva más blindaje — si te pasa atacando, a tu flota le falta potencia o precisión.</li>
                <li><strong>Archiva tus informes importantes</strong>: sirven de pruebas en los debates de alianza.</li>
            </ul>

    combat_simulator:
        title: "Simulador de combate"
        category: "combat"
        order: 9
        tags: "simulador,combate,simulacion,flota,perdidas,estimacion,informe"
        summary: "Estima tus riesgos antes de atacar: reproduce mil veces un combate contra una flota observada en un informe, con el motor real del juego."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="proposito">Para qué sirve</h2>
            <p>La pestaña <strong>Simulador de combate</strong> de la página Flotas estima lo que arriesgas antes de atacar. Reproduce <strong>1.000 veces</strong> un combate entre una de tus flotas y una flota enemiga, con el <strong>motor real del juego</strong>: mismas fórmulas, mismas tiradas aleatorias. Nada se compromete de verdad: ninguna nave se mueve, ninguna muere.</p>

            <h2 id="fuente">La fuente: un informe de combate</h2>
            <p>La flota enemiga proviene de uno de tus <strong>informes de combate recientes</strong> (los que muestran la línea «Daño encajado»): son las únicas fuentes honestas, porque contienen el poder real del bando observado, bonus incluidos. Un informe de espionaje solo da números de naves, sin sus estadísticas reales — la simulación sería engañosa, por eso no se ofrece.</p>
            <p>Elige el informe, el bando a enfrentar (una de las dos armadas del informe) y una de tus flotas armadas. Siempre simulas como <strong>atacante</strong>, con tus bonus reales (héroe, alianza, política).</p>

            <h2 id="leer">Leer el resultado</h2>
            <ul>
                <li><strong>Tasa de victoria</strong> — la parte de las 1.000 tiradas que ganas.</li>
                <li><strong>Horquilla de pérdidas por tipo de nave</strong> (mínimo, mediana, máximo) — solo sobre las tiradas victoriosas: en caso de derrota, tu flota sería destruida por completo.</li>
                <li><strong>Un ejemplo de desarrollo</strong> — una tirada mediana, presentada como un informe y claramente marcada «SIMULACIÓN».</li>
            </ul>

            <h2 id="limites">Límites a tener en cuenta</h2>
            <ul>
                <li>La flota enemiga es la <strong>observada en la fecha del informe</strong>: puede haber sido reconstruida, mejorada o reforzada desde entonces.</li>
                <li>Las bazas circunstanciales del adversario (héroe, defensas planetarias si combate en casa) solo se conocen en el combate real.</li>
                <li>Límite de <strong>20 simulaciones al día</strong>: el simulador ilumina una decisión, no sustituye el riesgo del combate.</li>
            </ul>

    colonization:
        title: "Colonizar un nuevo planeta"
        category: "planet"
        order: 1
        tags: "colonización,planeta,colonizador,expansión"
        summary: "Extender tu imperio fundando nuevos planetas en emplazamientos vacíos."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">¿Por qué colonizar?</h2>
            <ul>
                <li><strong>Más producción</strong> — cada planeta tiene su propia economía.</li>
                <li><strong>Más colas de construcción</strong> paralelas.</li>
                <li><strong>Menos riesgo</strong> — tus huevos ya no están en la misma cesta.</li>
                <li><strong>Posiciones estratégicas</strong> — proximidad a comerciantes, aliados, objetivos.</li>
            </ul>

            <h2 id="etapes">Cómo colonizar</h2>
            <ol>
                <li>Desbloquea la investigación <strong>Expansión</strong> (para tener derecho a más planetas).</li>
                <li>Fabrica un <strong>colonizador</strong> en tu Astillero espacial.</li>
                <li>Cárgalo con algunos recursos iniciales (recomendado: niobio y agua).</li>
                <li>Envíalo en misión <strong>Colonización</strong> a un <strong>emplazamiento vacío</strong> en el mapa.</li>
            </ol>
            <p>A la llegada, el nuevo planeta es fundado. Aparece en tu panel derecho.</p>

            <h2 id="initial">Lo que tiene al arranque</h2>
            <p>Un planeta recién colonizado comienza con una base modesta (unos cientos de niobio y agua, aproximadamente 2&nbsp;500 trabajadores, 20 Legionarios). Todo lo demás está por construir.</p>

            <h2 id="limite">¿Cuántos planetas máx.?</h2>
            <p>El límite depende:</p>
            <ul>
                <li>Del nivel de la investigación <strong>Expansión</strong>.</li>
                <li>De tu <strong>alianza</strong> (algunas investigaciones de alianza desbloquean planetas adicionales).</li>
                <li>De tus <strong>invasiones</strong> exitosas (algunas investigaciones de alianza ofensivas también dan planetas).</li>
            </ul>

            <h2 id="choix">¿Dónde colonizar?</h2>
            <ul>
                <li>Cerca de un <strong>comerciante</strong>: economía fácil con envíos de cargueros.</li>
                <li>Cerca de tus <strong>aliados</strong>: defensa mutua.</li>
                <li>En un <strong>emplazamiento "rico"</strong> (más grande, terraformable): mejor producción.</li>
                <li>Evita aislarte demasiado lejos de todo: flotas más lentas, abastecimiento complicado.</li>
            </ul>

    planet_types:
        title: "Todo lo que hay en el mapa"
        category: "planet"
        order: 2
        tags: "planeta,luna,sol,comerciante,alien,escombros,cthulhu"
        summary: "Los diferentes objetos visibles en el mapa galáctico y qué puedes hacer con ellos."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Los 7 tipos de objetos</h2>
            <table>
                <tr><th>Tipo</th><th>Descripción</th><th>Acciones posibles</th></tr>
                <tr><td><strong>Planeta</strong> (habitado)</td><td>Pertenece a un jugador. Se puede construir en él, colonizarlo (si vacío)…</td><td>Sondear, raidear, invadir, bombardear.</td></tr>
                <tr><td><strong>Luna</strong></td><td>Creada por un Moon Maker. Producción de comida ultra rápida (ciclo de 1 min).</td><td>Sondear, raidear, invadir.</td></tr>
                <tr><td><strong>Sol</strong></td><td>Objeto estelar no colonizable.</td><td>Ninguna.</td></tr>
                <tr><td><strong>Emplazamiento vacío</strong></td><td>Posición libre sin objeto. Ideal para colonizar o crear una luna.</td><td>Colonizar, poner una luna, abastecer a un aliado.</td></tr>
                <tr><td><strong>Comerciante</strong></td><td>PNJ inmune que compra tus recursos a cambio de Bitcoins.</td><td>Vender (misión Descarga).</td></tr>
                <tr><td><strong>Planeta Alien / Cthulhu</strong></td><td>Base de la colmena, defendida por una guarnición permanente.</td><td>Invadir para liberar (uranio + reduce la Amenaza del universo).</td></tr>
                <tr><td><strong>Campo de escombros</strong></td><td>Resto de un combate (niobio, agua) o aparición espontánea (uranio).</td><td>Reciclar.</td></tr>
            </table>

            <h2 id="reperer">Identificarlos en el mapa</h2>
            <p>Cada tipo tiene su icono. Pasa el ratón por encima para ver el nombre del propietario (si habitado), el tamaño estimado y tus opciones posibles.</p>

            <h2 id="lunes">Caso particular: las lunas</h2>
            <p>Las lunas se crean con una nave especial <strong>Moon Maker</strong>, en un emplazamiento vacío con al menos 2M de niobio y 2M de agua en escombros. Una vez colocada, la luna produce <strong>comida 10× más rápido</strong> que un planeta (ciclo de 1 minuto en lugar de 10). Es una mina de comida valiosa para sostener un gran ejército.</p>

    planet_management:
        title: "Gestionar un planeta"
        category: "planet"
        order: 3
        tags: "gestión,planeta,producción,capacidad,especialización"
        summary: "Cómo optimizar la producción, organizar tu espacio y eventualmente especializar un planeta."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Las bases a dominar</h2>
            <ul>
                <li><strong>Niveles de producción</strong> — sube regularmente Mina / Extractor / Granja.</li>
                <li><strong>Almacenamiento</strong> — sin stocks suficientes, la producción satura y se detiene.</li>
                <li><strong>Población</strong> — Ciudades y Metrópolis aumentan tu tope de trabajadores.</li>
                <li><strong>Defensa mínima</strong> — un pequeño búnker, algunos Mechas, es la base.</li>
            </ul>

            <h2 id="optimiser">Optimizar un planeta</h2>
            <ol>
                <li>Construye edificios de producción <strong>por pares</strong> (Mina + Extractor suben juntos a menudo).</li>
                <li>Investiga <strong>Terraformación</strong> para agrandar el planeta y poder construir más.</li>
                <li>Vigila la <strong>autonomía alimentaria</strong>: Granja/Granja aeropónica suficientes para tu población.</li>
                <li>Coloca una <strong>luna</strong> cercana para reforzar la producción de comida.</li>
            </ol>

            <h2 id="specialiser">Especializar tus planetas</h2>
            <p>Varios planetas = posibilidad de especializarlos según su posición y sus edificios:</p>
            <ul>
                <li><strong>Planeta económico</strong> — muchas minas, trabajadores, venta a comerciantes cercanos.</li>
                <li><strong>Planeta militar</strong> — astillero espacial, fábricas pesadas, grandes defensas, para estacionar allí tu flota.</li>
                <li><strong>Planeta de investigación</strong> — Centro de investigación subido alto, muchos científicos.</li>
                <li><strong>Puesto fronterizo</strong> — radar/jammer, sondas, torretas. Sirve para vigilar o contener a un vecino.</li>
            </ul>

            <h2 id="capitale">El planeta capital</h2>
            <p>Tu <strong>primer planeta</strong> juega un papel particular: si tu héroe es destruido en combate, es automáticamente reasignado a este planeta. Mantenlo siempre bien defendido.</p>

    planet_abandon:
        title: "Abandonar un planeta"
        category: "planet"
        order: 4
        tags: "abandono,planeta,eliminación,game over"
        summary: "Cuándo es buena idea, cómo hacerlo y por qué hay que abstenerse en ciertos casos."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">¿Por qué abandonar un planeta?</h2>
            <ul>
                <li>Está <strong>demasiado expuesto</strong> a los ataques y te consume más de lo que reporta.</li>
                <li>Está <strong>mal ubicado</strong> (lejos de todo, difícil de defender).</li>
                <li>Quieres <strong>colonizar uno mejor</strong>, pero estás en el tope de planetas.</li>
            </ul>

            <h2 id="comment">Cómo hacerlo</h2>
            <p>El abandono se hace desde la página <strong>Planeta</strong> → sección Gestión. Se pide una confirmación (es irreversible).</p>
            <p>Antes de soltarlo: <strong>evacúa todos los recursos, los Legionarios, las naves</strong> a otro planeta. Una vez abandonado, todo lo que queda se pierde.</p>

            <h2 id="danger">La trampa a evitar absolutamente</h2>
            <p>Abandonar tu <strong>último planeta</strong> es el <strong>Game Over</strong>:</p>
            <ul>
                <li>Tus flotas son <strong>transferidas a los aliens</strong>.</li>
                <li>Tu comandante es eliminado del servidor.</li>
                <li>La partida ha terminado.</li>
            </ul>
            <p>Nunca abandones sin asegurarte de que tienes al menos otro activo.</p>

    galaxy_navigation:
        title: "Navegar por la galaxia"
        category: "planet"
        order: 5
        tags: "galaxia,sector,navegación,mapa,universo,coordenadas"
        summary: "Cómo está organizado el universo, cómo leer una coordenada y cómo usar el mapa."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Cómo está organizado el universo</h2>
            <p>El universo es una jerarquía:</p>
            <ul>
                <li>El <strong>Universo</strong> contiene varias <strong>Galaxias</strong>.</li>
                <li>Cada <strong>Galaxia</strong> contiene <strong>Sectores</strong> (cuadrícula 10×10).</li>
                <li>Cada <strong>Sector</strong> contiene 25 <strong>Posiciones</strong> (cuadrícula 5×5).</li>
            </ul>
            <p>Cada posición puede contener un planeta, un comerciante, un campo de escombros, una luna, un sol o estar vacía.</p>

            <h2 id="coordonnees">Leer una coordenada</h2>
            <p>Formato: <strong>Galaxia:Sector:Posición</strong>, por ejemplo <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — primera galaxia;</li>
                <li><strong>5</strong> — quinto sector de esa galaxia;</li>
                <li><strong>12</strong> — duodécima posición en ese sector.</li>
            </ul>

            <h2 id="carte">Usar el mapa</h2>
            <p>La página <strong>Mapa</strong> (menú izquierdo) te muestra la vista espacial. Puedes:</p>
            <ul>
                <li>Desplazarte entre galaxias y sectores.</li>
                <li>Hacer clic en una posición para ver lo que hay.</li>
                <li><strong>Enviar directamente una flota</strong> haciendo clic en "Atacar / Enviar" desde la celda.</li>
                <li>Ver las posiciones de aliados, enemigos y comerciantes (según tus relaciones y tu radar).</li>
            </ul>
            <p>Las <strong>flotas en tránsito</strong> aparecen como pequeñas naves animadas que se deslizan en tiempo real entre el planeta de origen y el de destino. El <strong>halo de color</strong> indica el bando: <strong>azul</strong> = tú, <strong>verde</strong> = alianza, <strong>gris</strong> = pacto/paz, <strong>magenta</strong> = mercader, <strong>violeta</strong> = alien, <strong>rojo</strong> = enemigo. El <strong>tamaño</strong> refleja la firma de la flota. Tus flotas y las de tu alianza siempre son visibles; las demás solo aparecen cuando tu <strong>radar</strong> cubre el sector. Para vuelos de larga distancia que cruzan varios sectores, el marcador solo aparece durante la parte final del viaje — la entrada al sector de destino — no durante todo el trayecto.</p>

            <h2 id="hyperespace">Viajes intergalácticos</h2>
            <p>Para ir de una galaxia a otra, necesitas la investigación <strong>Hiperespacio</strong>. Los trayectos intergalácticos son largos y costosos en combustible — planifica.</p>

    radar_jammer:
        title: "Radar e interferencia"
        category: "planet"
        order: 6
        tags: "radar,interferencia,jammer,detección,vigilancia"
        summary: "Ver llegar al enemigo antes de que llegue y ocultar tus propios movimientos."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs Interferencia (Jammer)</h2>
            <ul>
                <li><strong>Radar</strong> — ve las flotas que se acercan. Te da tiempo de reaccionar.</li>
                <li><strong>Interferencia (Jammer)</strong> — oculta tus propios movimientos a los radares enemigos.</li>
            </ul>

            <h2 id="detection">Los radares disponibles</h2>
            <table>
                <tr><th>Tipo</th><th>Dónde</th><th>Rol</th></tr>
                <tr><td><strong>Radar</strong> (edificio)</td><td>En el planeta (suelo)</td><td>Detección local. Alerta sobre las flotas que se acercan a tu planeta.</td></tr>
                <tr><td><strong>Sky Radar</strong> (edificio)</td><td>En cielo (isla orbital)</td><td>Detección extendida. Más alcance, mejor precisión.</td></tr>
                <tr><td><strong>Radar</strong> (nave)</td><td>En flota</td><td>Detección móvil. Útil para explorar o vigilar una zona lejos de casa.</td></tr>
            </table>

            <h2 id="brouillage">Los jammers disponibles</h2>
            <table>
                <tr><th>Tipo</th><th>Dónde</th><th>Rol</th></tr>
                <tr><td><strong>Sky Jammer</strong> (edificio)</td><td>En cielo (isla orbital)</td><td>Interfiere los radares enemigos alrededor de tu planeta.</td></tr>
                <tr><td><strong>Jammer</strong> (nave)</td><td>En flota</td><td>Interfiere los radares alrededor de tu flota en vuelo.</td></tr>
            </table>

            <h2 id="naves-en-tierra">Ver las naves en tierra</h2>
            <p>La <strong>firma en tierra</strong> — las naves estacionadas en un planeta — sigue una regla algo más flexible: una de tus flotas <strong>en órbita</strong> las cuenta a simple vista, incluso sin radar. Pero solo para ese planeta.</p>
            <p>El <strong>radar</strong> sigue siendo lo que te da esa lectura <strong>a distancia</strong>, en todo el sector. Y un <strong>Sky Jammer</strong> en el planeta cierra la observación: sin un radar superior al jammer, la firma en tierra vuelve a ser invisible, incluso con una flota encima.</p>

            <h2 id="strategie">Cómo usarlos</h2>
            <ul>
                <li><strong>Radar</strong> en cada planeta: como mínimo el edificio básico, para no ser sorprendido.</li>
                <li><strong>Jammer</strong> en flota: esencial para un ataque sorpresa a larga distancia.</li>
                <li><strong>Desplegar</strong> un satélite radar (misión dedicada) en un emplazamiento estratégico para vigilar a un vecino.</li>
                <li>La investigación <strong>Onda</strong> mejora el alcance y la precisión de todos los radares.</li>
            </ul>

    moon:
        title: "Las lunas"
        category: "planet"
        order: 7
        tags: "luna,moonmaker,comida,producción"
        summary: "Una luna produce comida 10× más rápido que un planeta. Cómo crear una."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">¿Qué es una luna?</h2>
            <p>Una <strong>luna</strong> es un objeto especial, más pequeño que un planeta, <strong>dedicado únicamente a la producción de comida</strong>. Su ciclo funciona en <strong>1 minuto</strong> en lugar de 10: produce por tanto 10× más rápido que un planeta del mismo tamaño.</p>
            <p>Una luna es un excelente complemento para sostener un ejército que consume mucho (muchos Legionarios, Mechas, naves en misión).</p>

            <h2 id="creation">Cómo crear una luna</h2>
            <p>Una luna nace de un <strong>campo de escombros</strong>: se necesita un <strong>emplazamiento vacío</strong> con al menos <strong>2M de niobio Y 2M de agua</strong> en escombros (dejados por una batalla espacial en ese lugar). La misión Luna solo se ofrece en el mapa si el emplazamiento cumple esta condición.</p>
            <ol>
                <li>Fabrica un <strong>Moon Maker</strong> (nave especial, costosa).</li>
                <li>Envíalo en misión <strong>Luna</strong> hacia un emplazamiento vacío con suficientes escombros.</li>
                <li>A la llegada, la luna se crea y <strong>consume todos los escombros</strong>. Si las condiciones ya no se cumplen (escombros reciclados durante el vuelo, posición colonizada…), un informe explica el fallo.</li>
            </ol>

            <h2 id="tamano">Tamaño de la luna</h2>
            <p>Cuanto más rico es el campo de escombros, más grande es la luna. El nivel lo determina el <strong>menor</strong> de los dos recursos:</p>
            <table>
                <tr><th>Escombros (mín. niobio/agua)</th><th>Terreno</th></tr>
                <tr><td>2M – 8M</td><td>100 – 150</td></tr>
                <tr><td>8M – 15M</td><td>150 – 190</td></tr>
                <tr><td>15M – 25M</td><td>190 – 230</td></tr>
                <tr><td>25M – 50M</td><td>230 – 280</td></tr>
                <tr><td>50M o más</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limitations">Límites</h2>
            <ul>
                <li>Una luna <strong>solo produce comida</strong> (nada de niobio ni agua).</li>
                <li>Puede ser <strong>atacada, saqueada, invadida</strong> como un planeta normal.</li>
                <li>Construir una luna cerca de casa es más seguro (menos expuesta a vecinos hostiles).</li>
            </ul>

            <h2 id="strategie">Cuándo colocar una</h2>
            <ul>
                <li>Te cuesta alimentar a tu ejército → una luna cercana resuelve el problema.</li>
                <li>Una gran batalla dejó un <strong>campo de escombros rico</strong> cerca de tu casa: en lugar de reciclarlo todo, conviértelo en una luna.</li>
                <li>Estás bien establecido, tienes recursos para gastar y buscas consolidar tu economía.</li>
            </ul>

    alliance_basics:
        title: "Crear y unirse a una alianza"
        category: "alliance"
        order: 1
        tags: "alianza,creación,unirse,bonus,régimen,política"
        summary: "Únete a jugadores, gana bonus y elige tu régimen político."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">¿Por qué unirse a una alianza?</h2>
            <ul>
                <li><strong>+20&nbsp;% de producción</strong> inmediato sobre todos los recursos.</li>
                <li>Acceso a <strong>20 investigaciones de alianza</strong> (bonus económico, militar, defensivo).</li>
                <li>Una <strong>tesorería compartida</strong> en Bitcoins.</li>
                <li>La <strong>diplomacia</strong> (guerras, paz, pactos) y una <strong>sala de chat</strong>.</li>
                <li>Poder <strong>invadir</strong> otros planetas (reservado a miembros de alianza en modo PvP).</li>
            </ul>
            <p>En claro: jugar en solitario, es viable al principio. Pero en cuanto el juego se pone serio, una alianza multiplica tus posibilidades de progresar.</p>

            <h2 id="rejoindre">Cómo unirse</h2>
            <ol>
                <li>Página <strong>Alianza</strong> (menú izquierdo).</li>
                <li>Recorre la lista de alianzas abiertas, o busca por nombre.</li>
                <li>Solicita la adhesión. El dirigente (o un oficial) la valida.</li>
            </ol>
            <p>También puedes <strong>crear tu propia alianza</strong> desde la misma página, eligiendo un nombre, una etiqueta y un régimen político.</p>

            <h2 id="invitations">Recibir invitaciones</h2>
            <p>Un líder (o un oficial con permiso de reclutamiento) también puede <strong>invitarte</strong> directamente. Puedes tener <strong>una invitación de cada alianza al mismo tiempo</strong> — que una te solicite no te oculta de las demás —, pero una misma alianza no puede invitarte dos veces mientras no hayas respondido. Las alianzas que te detectan ven que ya estás <strong>solicitado</strong>, sin saber por quién. En cuanto <strong>aceptas</strong> una invitación, todas las demás se retiran automáticamente; y si una alianza se <strong>disuelve</strong>, su invitación desaparece de tu lista.</p>

            <h2 id="delai">Tiempo de espera tras salir de una alianza</h2>
            <p>Tras <strong>salir</strong> de una alianza, ser <strong>expulsado</strong> (kick) o después de la <strong>disolución</strong> de tu alianza, se aplica un <strong>tiempo de espera de 2&nbsp;días</strong>: no puedes <strong>crear</strong> ni <strong>unirte</strong> a una nueva alianza hasta que termine. Esto evita los vaivenes abusivos entre alianzas.</p>

            <h2 id="regimes">Los 3 regímenes políticos</h2>
            <p>En el momento de <strong>crear</strong> una alianza, eliges un <strong>régimen político</strong>. Esta elección determina los bonus accesibles, las investigaciones posibles y ciertas reglas internas. Es <strong>definitiva</strong>.</p>

            <h3 id="democratie">La Balanza de los Mundos (La Balanza de los Mundos)</h3>
            <p><strong>Ventajas:</strong></p>
            <ul>
                <li>Voto para designar al Presidente.</li>
                <li><strong>+20%</strong> de ataque contra las alianzas ofensivas.</li>
                <li>Los jugadores pueden salir de la alianza libremente.</li>
                <li>7 investigaciones económicas:
                    <ul>
                        <li>+35% producción de recursos</li>
                        <li>+50% velocidad de las investigaciones</li>
                        <li>-100% coste de mantenimiento de los científicos</li>
                        <li>+100% tamaño de los cargueros</li>
                        <li>+50% armadura de las naves</li>
                        <li>+25% ganancia en venta a comerciantes</li>
                        <li>+5 planetas colonizables</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvenientes:</strong></p>
            <ul>
                <li>Todos los miembros de la alianza son públicamente conocidos.</li>
                <li>La posición del primer planeta se muestra.</li>
            </ul>

            <h3 id="communisme">El Baluarte Silencioso (La Alianza Ofensiva)</h3>
            <p><strong>Ventajas:</strong></p>
            <ul>
                <li>Un miembro de alianza adicional.</li>
                <li><strong>+20%</strong> de ataque contra las alianzas defensivas.</li>
                <li>7 investigaciones ofensivas:
                    <ul>
                        <li>+100% velocidad de reciclaje</li>
                        <li>+100% defensa de los trabajadores</li>
                        <li>+50% potencia de las naves</li>
                        <li>-50% coste de mantenimiento de los Legionarios</li>
                        <li>-1 Bitcoin por nivel en el reclutamiento de los Legionarios (8 → 3)</li>
                        <li>+5 planetas vía invasiones</li>
                        <li>+50% ganancia de Puntos de Guerra</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvenientes:</strong></p>
            <ul>
                <li>Tasa fijada automáticamente al 50%.</li>
                <li>Todos los miembros tienen estatus de dirigente.</li>
                <li>Imposibilidad de abandonar la alianza.</li>
            </ul>

            <h3 id="fascisme">El Martillo de las Estrellas (La Alianza Defensiva)</h3>
            <p><strong>Ventajas:</strong></p>
            <ul>
                <li>Disminución de la amenaza Cthulhu.</li>
                <li><strong>+20%</strong> de ataque contra las alianzas La Balanza de los Mundos.</li>
                <li>Solo el Dirigente se muestra públicamente.</li>
                <li>7 investigaciones defensivas:
                    <ul>
                        <li>+100% producción de trabajadores</li>
                        <li>+50% potencia de las naves</li>
                        <li>+75% capacidad de las barcazas de invasión</li>
                        <li>+50% fuerza de los Legionarios</li>
                        <li>-100% coste de mantenimiento de los Mechas</li>
                        <li>+50 defensa de los Mechas</li>
                        <li>+5 planetas vía invasiones</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvenientes:</strong></p>
            <ul>
                <li>Si el dirigente es puesto en Game Over, la alianza se disuelve.</li>
                <li>Imposibilidad de abandonar la alianza.</li>
                <li>Imposibilidad de eliminar la alianza.</li>
                <li>Un miembro de alianza menos.</li>
                <li>El Dirigente es el único jefe de la alianza.</li>
            </ul>
            <h2 id="compte-valide">Cuenta por validar</h2>
            <p>⚠️ Para <strong>crear o unirte</strong> a una alianza, tu cuenta debe estar <strong>validada</strong> y tu <strong>correo confirmado</strong>. Las cuentas de prueba/anónimas no pueden unirse a una alianza — confirma tu correo desde <strong>Mis opciones</strong>.</p>
            <h2 id="discord">Tu alianza en Discord</h2>
            <p>Vincula tu cuenta de Discord en <strong>Mis opciones</strong> y marca <strong>Mostrar mis alianzas en Discord</strong>: el juego te da en el <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord de Area Universe</a> el rol de cada una de tus alianzas, y lo retira cuando la abandonas o se disuelve. Nadie puede tomar el rol de una alianza de la que no es miembro. Desmarca la casilla cuando quieras para retirar tus roles.</p>

    alliance_grades:
        title: "Grados y permisos"
        category: "alliance"
        order: 2
        tags: "grados,permisos,roles,jerarquía,oficial,dirigente"
        summary: "Cómo funciona la jerarquía interna de una alianza y quién tiene derecho a hacer qué."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Una alianza está organizada por <strong>grados</strong>, del más alto (dirigente) al más bajo (nuevo recluta). Cada grado tiene un conjunto de <strong>permisos</strong> configurables.</p>

            <h2 id="hierarchie">La jerarquía típica</h2>
            <ul>
                <li><strong>Grado 1 — Dirigente</strong> — fundador de la alianza. Todos los derechos. Uno solo por alianza (salvo en ciertos regímenes).</li>
                <li><strong>Grado 2+ — Oficiales</strong> — pueden tomar decisiones delegadas (diplomacia, tesorería, reclutamiento…).</li>
                <li><strong>Grados intermedios</strong> — veteranos, consejeros. Configurables según las costumbres.</li>
                <li><strong>Grado más bajo</strong> — nuevos reclutas, permisos limitados.</li>
            </ul>

            <h2 id="permissions">Permisos configurables</h2>
            <p>El dirigente puede, para cada grado, activar o no:</p>
            <ul>
                <li><strong>Invitar</strong> nuevos miembros.</li>
                <li><strong>Expulsar</strong> a un miembro.</li>
                <li><strong>Acceder a la tesorería</strong> (depósito, retiro).</li>
                <li><strong>Declarar la guerra</strong> a otra alianza.</li>
                <li><strong>Aceptar la paz</strong>, un pacto o una alianza defensiva.</li>
                <li><strong>Modificar los grados</strong> de los demás miembros.</li>
                <li><strong>Gestionar las investigaciones de alianza</strong>.</li>
            </ul>

            <h2 id="changer">Ascender o degradar</h2>
            <p>Un oficial con el permiso adecuado puede modificar el grado de un miembro. Es una forma de recompensar a los activos y encuadrar a los nuevos.</p>

            <h2 id="regimes">Casos particulares según el régimen</h2>
            <p>Algunos regímenes políticos modifican estas reglas:</p>
            <ul>
                <li><strong>El Baluarte Silencioso</strong> — todos los miembros son dirigentes (sin jerarquía).</li>
                <li><strong>El Martillo de las Estrellas</strong> — un solo dirigente, inamovible; si el dirigente cae, la alianza se disuelve.</li>
                <li><strong>La Balanza de los Mundos</strong> — el Presidente es elegido por voto.</li>
            </ul>

            <h2 id="afk">Reemplazo automático de un dirigente inactivo</h2>
            <p>Si el <strong>dirigente</strong> de una alianza deja de conectarse durante <strong>más de 7 días</strong>, es reemplazado automáticamente para evitar que la alianza quede paralizada:</p>
            <ul>
                <li>El <strong>miembro activo de mayor grado</strong> toma el mando de la alianza. En caso de empate de grado, es quien tiene más <strong>Puntos de Guerra</strong>.</li>
                <li>Los dos grados simplemente se <strong>intercambian</strong>: el antiguo dirigente recupera el grado del reemplazante.</li>
                <li>Si no existe <strong>ningún miembro activo</strong> capaz de tomar el relevo, nada cambia.</li>
            </ul>

    diplomacy:
        title: "La diplomacia"
        category: "alliance"
        order: 3
        tags: "diplomacia,guerra,paz,pacto,aliado,defcon,tratado"
        summary: "Los 4 tipos de relaciones entre alianzas, cómo negociarlas y qué significa el DEFCON."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Tu alianza mantiene <strong>relaciones</strong> con las demás alianzas del servidor. Estas relaciones cambian las reglas del juego entre vuestros respectivos miembros (quién puede atacar a quién).</p>

            <h2 id="types">Los 4 tipos de relaciones</h2>
            <table>
                <tr><th>Tipo</th><th>Efecto</th><th>Uso</th></tr>
                <tr><td><strong>Guerra</strong></td><td>Conflicto abierto. Todo está permitido entre las dos alianzas.</td><td>Declarada por un oficial. Enemigos prioritarios.</td></tr>
                <tr><td><strong>Paz</strong></td><td>Alto el fuego. Ningún ataque posible. Puede incluir una tasa de paz.</td><td>Poner fin a una guerra, o evitar un conflicto costoso.</td></tr>
                <tr><td><strong>Pacto</strong></td><td>No-agresión mutua. Ningún ataque pero sin ayuda obligatoria.</td><td>Relaciones neutras estables.</td></tr>
                <tr><td><strong>Alianza defensiva</strong></td><td>Apoyo militar mutuo. Se comparten datos, se puede defender juntos.</td><td>Para aliados cercanos.</td></tr>
            </table>

            <h2 id="proposer">Cómo proponer un tratado</h2>
            <ol>
                <li>Página <strong>Alianza</strong> → <strong>Diplomacia</strong>.</li>
                <li>Elige la alianza objetivo en la lista.</li>
                <li>Propón un tipo de relación (paz, pacto, alianza).</li>
                <li>El otro bando debe <strong>aceptar</strong>. O acepta, o rechaza, o contra-propone.</li>
            </ol>

            <h2 id="defcon">El DEFCON (nivel de alerta)</h2>
            <p>Tu alianza tiene un <strong>nivel de alerta DEFCON</strong>, una cifra que indica su estado de tensión. <strong>Cuanto más baja la cifra, más peligrosa la situación.</strong> Un DEFCON 1 significa guerra total inminente.</p>
            <p>Es un indicador visual para coordinar: un DEFCON bajo = todos los miembros al pie del cañón.</p>

            <h2 id="logs">El diario diplomático</h2>
            <p>Toda acción diplomática (declaración de guerra, paz aceptada, pacto roto…) se <strong>registra</strong> en el historial de alianza, con el pseudo del autor y la marca temporal. Útil para la transparencia interna y los debates post mortem.</p>

    alliance_treasury:
        title: "Tesorería de alianza"
        category: "alliance"
        order: 4
        tags: "tesorería,bitcoin,depósito,retiro,tasa"
        summary: "El bote común de tu alianza, alimentado por los miembros y las tasas de paz."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Para qué sirve la tesorería</h2>
            <p>La tesorería de alianza es una <strong>cuenta compartida en Bitcoins</strong>. Sirve para:</p>
            <ul>
                <li>Pagar las <strong>investigaciones de alianza</strong>.</li>
                <li>Sacar del apuro a un miembro en dificultad.</li>
                <li>Financiar un esfuerzo colectivo (preparación a una guerra, evento).</li>
            </ul>

            <h2 id="alimenter">Cómo alimentarla</h2>
            <ul>
                <li><strong>Depósitos voluntarios</strong> — cualquier miembro puede depositar Bitcoins.</li>
                <li><strong>Tasa de alianza</strong> — si se activa, un porcentaje de los ingresos de cada miembro se retiene automáticamente en el informe diario.</li>
                <li><strong>Tasas de paz</strong> — si has impuesto una tasa a una alianza con la que haces la paz, cae automáticamente en la tesorería.</li>
            </ul>

            <h2 id="retrait">Los retiros</h2>
            <p>Los retiros están reservados a los grados que tienen el <strong>permiso tesorería</strong> — generalmente, los oficiales y el dirigente. Cada movimiento queda registrado.</p>

            <h2 id="taxes">La tasa de alianza</h2>
            <p>La tasa de alianza es configurable por el dirigente. Retiene un porcentaje de los ingresos de cada miembro, <strong>automáticamente en el informe diario</strong>. Elígela razonable: demasiado alta, los miembros se van.</p>

            <h2 id="transparence">Transparencia</h2>
            <p>Los <strong>logs de tesorería</strong> muestran quién ha depositado/retirado, cuándo, cuánto. Es una herramienta de confianza: todo el mundo puede verificar.</p>

    political_system:
        title: "Los 3 regímenes políticos"
        category: "alliance"
        order: 5
        tags: "política,régimen,bonus,balanza,baluarte,martillo"
        summary: "Los 3 regímenes posibles para una alianza: ventajas, inconvenientes y cómo elegir."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principe">Elegir en la creación</h2>
            <p>Cuando se crea una alianza, el fundador elige un <strong>régimen político</strong>. Este régimen define <strong>reglas internas</strong>, <strong>bonus específicos</strong> y un <strong>árbol de investigaciones de alianza</strong> dedicado. La elección es <strong>irreversible</strong>.</p>

            <h2 id="balance">La Balanza de los Mundos (democrática)</h2>
            <p>Régimen abierto y económico. Los miembros votan para elegir a su Presidente. Enfoque en la <strong>economía</strong>.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra las alianzas ofensivas.</li>
                <li>Miembros visibles públicamente.</li>
                <li>Los miembros pueden salir libremente.</li>
                <li>Investigaciones orientadas a economía (producción, carguero, investigaciones científicas más rápidas, venta comerciante…).</li>
            </ul>

            <h2 id="rempart">El Baluarte Silencioso (ofensivo)</h2>
            <p>Régimen agresivo y colectivo. Todos los miembros son dirigentes. Enfoque en la <strong>ofensiva</strong>.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra las alianzas defensivas.</li>
                <li>Un miembro adicional autorizado.</li>
                <li>Tasa de alianza fijada al 50&nbsp;% automáticamente.</li>
                <li>Imposible salir de la alianza.</li>
                <li>Investigaciones orientadas a combate (potencia naves, coste Legionarios reducido, velocidad de reciclaje, invasiones…).</li>
            </ul>
            <p>Los tres grados de cabeza (<strong>Guía</strong>, <strong>Protector</strong>, <strong>Camarada</strong>) son <strong>equivalentes</strong>: mismos derechos, ninguna jerarquía entre ellos. Pueden atribuirse libremente entre los miembros; solo el grado de recluta (Gulag) es inferior.</p>

            <h2 id="marteau">El Martillo de las Estrellas (defensivo)</h2>
            <p>Régimen discreto y defensivo. Un solo dirigente. Enfoque en la <strong>defensa</strong> y la resistencia.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra las alianzas democráticas.</li>
                <li>Amenaza Cthulhu reducida (muy útil en PvE).</li>
                <li>Solo el dirigente se muestra públicamente.</li>
                <li>Imposible salir de la alianza. Imposible disolverla.</li>
                <li>Si el dirigente es puesto en Game Over, la alianza se disuelve.</li>
                <li>Un miembro menos que los otros regímenes.</li>
                <li>Investigaciones orientadas a defensa (producción workers, fuerza Legionarios, defensa Mechas, capacidad barcazas…).</li>
            </ul>

            <h2 id="combat">Bonus entre regímenes</h2>
            <p>Cada régimen tiene un bonus de +20&nbsp;% de ataque <strong>contra un régimen rival</strong>, en piedra-papel-tijera:</p>
            <ul>
                <li>La Balanza vence al Baluarte.</li>
                <li>El Baluarte vence al Martillo.</li>
                <li>El Martillo vence a la Balanza.</li>
            </ul>

            <h2 id="choisir">¿Cómo elegir?</h2>
            <ul>
                <li><strong>Empiezas y apuntas al crecimiento</strong> → La Balanza de los Mundos (económico, flexible).</li>
                <li><strong>Quieres una alianza unida y agresiva</strong> → El Baluarte Silencioso.</li>
                <li><strong>Quieres protegerte, jugar defensivo</strong> → El Martillo de las Estrellas (atención: en caso de game over del dirigente, todo se desmorona).</li>
            </ul>

    alliance_research:
        title: "Investigaciones de alianza"
        category: "alliance"
        order: 6
        tags: "investigación,alianza,política,mejora,bonus"
        summary: "Bonus colectivos financiados por la tesorería de alianza, que benefician a todos los miembros."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principe">Cómo funciona</h2>
            <p>Tu alianza dispone de un <strong>árbol de investigaciones dedicado</strong> que depende de su <strong>régimen político</strong>. Cada investigación cuesta Bitcoins (retenidos de la tesorería) y se extiende por varios niveles.</p>
            <p>Los bonus <strong>benefician a todos los miembros</strong>. Es una de las razones principales para unirse o permanecer fiel a una alianza.</p>

            <h2 id="liste">Las investigaciones de alianza típicas</h2>
            <table>
                <tr><th>Investigación</th><th>Lo que mejora</th></tr>
                <tr><td><strong>Producción</strong></td><td>Bonus de producción de recursos.</td></tr>
                <tr><td><strong>Trabajadores</strong></td><td>Crecimiento más rápido de la población.</td></tr>
                <tr><td><strong>Defensa de trabajadores</strong></td><td>Los trabajadores resisten mejor en invasión.</td></tr>
                <tr><td><strong>Velocidad de investigación</strong></td><td>Las investigaciones individuales terminan más rápido.</td></tr>
                <tr><td><strong>Armamento</strong></td><td>Daños de las naves en combate.</td></tr>
                <tr><td><strong>Armadura</strong></td><td>Armadura de las naves.</td></tr>
                <tr><td><strong>Coste Legionarios / científicos / Mechas</strong></td><td>Reclutamiento más barato.</td></tr>
                <tr><td><strong>Capacidad de barcazas</strong></td><td>Más Legionarios desembarcados por barcaza.</td></tr>
                <tr><td><strong>Capacidad de cargueros</strong></td><td>Más recursos transportados.</td></tr>
                <tr><td><strong>Capacidad de reciclaje</strong></td><td>Más escombros traídos por ciclo.</td></tr>
                <tr><td><strong>Colonización</strong></td><td>Más planetas colonizables.</td></tr>
                <tr><td><strong>Ataque / Defensa Legionarios</strong></td><td>Fuerza de las tropas en tierra.</td></tr>
                <tr><td><strong>Defensa Mechas</strong></td><td>Mechas más resistentes.</td></tr>
                <tr><td><strong>Precios comerciantes</strong></td><td>Mejores ventas a PNJ.</td></tr>
                <tr><td><strong>Invasión</strong></td><td>Bonus en combates terrestres.</td></tr>
                <tr><td><strong>Puntos de Guerra</strong></td><td>Más PDG ganados en combate.</td></tr>
            </table>

            <h2 id="choisir">¿Qué investigaciones priorizar?</h2>
            <ul>
                <li><strong>Alianza económica</strong> (La Balanza) → Producción, Velocidad investigación, Carguero.</li>
                <li><strong>Alianza ofensiva</strong> (El Baluarte) → Armamento, Invasión, Ataque Legionarios.</li>
                <li><strong>Alianza defensiva</strong> (El Martillo) → Producción workers, Defensa Mechas, Barcazas.</li>
            </ul>
            <p>A discutir en sala de alianza antes de lanzar: es una elección colectiva.</p>

    salon:
        title: "La sala de alianza"
        category: "alliance"
        order: 7
        tags: "sala,chat,discusión,alianza,mensaje"
        summary: "El chat interno de tu alianza: tiempo real, historial y base estratégica."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="fonctionnement">Cómo funciona</h2>
            <p>La <strong>sala de alianza</strong> es un chat en tiempo real reservado a los miembros de tu alianza. Accesible desde la página <strong>Alianza → Sala</strong> (o un botón dedicado en el menú).</p>
            <p>Los mensajes se conservan: puedes remontar el historial para recuperar una información.</p>

            <h2 id="usage">Para qué sirve</h2>
            <ul>
                <li><strong>Coordinar los ataques</strong> — lanzar un raid entre dos vale más que uno solo que es rechazado.</li>
                <li><strong>Alertar</strong> en caso de flota enemiga detectada.</li>
                <li><strong>Compartir coordenadas</strong> (planetas objetivo, campos de escombros interesantes) — escritas en formato <code>galaxia:sector:posición</code> (ej. <code>1:15:25</code>), se vuelven automáticamente clicables, igual que un enlace a una página del juego.</li>
                <li><strong>Discutir la estrategia</strong> de alianza (investigaciones, diplomacia, guerras).</li>
                <li><strong>Presentarse</strong> a los nuevos miembros y tejer lazos.</li>
            </ul>

            <h2 id="bonnes-pratiques">Buenas prácticas</h2>
            <ul>
                <li>Mantén el respeto — insultos y acoso pueden ser sancionados por el admin.</li>
                <li>Evita el spam: deja sitio a las discusiones estratégicas.</li>
                <li>Menciona los pseudos de los miembros implicados cuando quieras su atención.</li>
                <li>Archivado mental: cuando se da un consejo, guárdalo en mente — los mensajes pasan rápido.</li>
            </ul>

            <h2 id="messages-prives">¿Y los mensajes privados?</h2>
            <p>Aparte de la sala, puedes enviar un <strong>mensaje privado</strong> a cualquier jugador del servidor (incluido fuera de alianza). Útil para la diplomacia silenciosa o para responder discretamente a una propuesta. Las coordenadas y los enlaces del juego también se vuelven clicables ahí, igual que en la sala.</p>

    alliance_improvements:
        title: "Mejoras de alianza"
        category: "alliance"
        order: 8
        tags: "mejoras,alianza,bonus,bitcoin,inversion,colectivo,niveles"
        summary: "Invierte Bitcoin para desbloquear 16 bonificaciones colectivas que fortalecen a toda tu alianza — velocidad de investigación, producción, poder de combate y más."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="resumen">Resumen</h2>
            <p>La pestaña <strong>Mejoras</strong> de la página de alianza permite a los miembros invertir Bitcoin para desbloquear y mejorar <strong>16 bonificaciones colectivas</strong>. Estas bonificaciones benefician a <strong>todos los miembros activos</strong> de la alianza. Un jugador que abandona la alianza deja de beneficiarse, pero la alianza conserva sus niveles obtenidos.</p>

            <h2 id="cuota">Cuota de inversión</h2>
            <p>Cada miembro dispone de una cuota de <strong>20 inversiones por ventana deslizante de 3 horas</strong>. Las inversiones no utilizadas se pierden — la cuota no se acumula. Cada inversión cuesta <strong>1.000 Bitcoin</strong> deducidos del saldo personal (un sumidero de dinero permanente).</p>
            <p>En la interfaz, botones rápidos <strong>×1 / ×5 / ×10</strong> bajo cada bonificación permiten invertir varios puntos instantáneamente con un clic.</p>

            <h2 id="niveles">Niveles y umbrales</h2>
            <p>Cada bonificación tiene <strong>5 niveles</strong>. Los umbrales de inversión requeridos para pasar al siguiente nivel son:</p>
            <table>
                <tr><th>Nivel</th><th>Inversiones necesarias</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1.000</td></tr>
            </table>
            <p>⚠️ Las inversiones que superan el umbral de un nivel se <strong>pierden</strong> — no hay traspaso al siguiente nivel.</p>

            <h2 id="bonificaciones">Las 16 bonificaciones y sus efectos</h2>
            <table>
                <tr><th>Bonificación</th><th>Efecto por nivel</th><th>Máximo (nivel 5)</th></tr>
                <tr><td><strong>Velocidad de investigación</strong></td><td>+2 % por nivel</td><td>+10 %</td></tr>
                <tr><td><strong>Coste de investigación</strong></td><td>−1 % por nivel</td><td>−5 %</td></tr>
                <tr><td><strong>Impulso de construcción</strong></td><td>+15 s de reducción por ayudante</td><td>75 s de reducción por ayudante</td></tr>
                <tr><td><strong>Coste de construcción</strong></td><td>−1 % por nivel</td><td>−5 %</td></tr>
                <tr><td><strong>Producción de niobio</strong></td><td>+2 % por nivel</td><td>+10 %</td></tr>
                <tr><td><strong>Producción de agua</strong></td><td>+2 % por nivel</td><td>+10 %</td></tr>
                <tr><td><strong>Producción de raciones</strong></td><td>+2 % por nivel</td><td>+10 %</td></tr>
                <tr><td><strong>Velocidad de flota</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Potencia de misiles</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Potencia láser</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Potencia de plasma</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Precisión</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Blindaje de flota</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Escudo</strong></td><td>+1 % por nivel</td><td>+5 %</td></tr>
                <tr><td><strong>Defensa planetaria</strong></td><td>+2 % por nivel</td><td>+10 %</td></tr>
                <tr><td><strong>Experiencia del héroe</strong></td><td>+2 %/nivel</td><td>+10 %</td></tr>
            </table>
            <p>El <strong>Impulso de construcción</strong> alimenta directamente la función de <a href="/wiki/alliance_construction_help">ayuda de construcción</a>: cuanto mayor sea su nivel, más reduce cada ayuda de un aliado el tiempo de construcción.</p>

    alliance_construction_help:
        title: "Ayuda de construcción"
        category: "alliance"
        order: 9
        tags: "ayuda,construccion,alianza,boost,edificio,aceleracion"
        summary: "Un clic para acelerar todas las construcciones en curso de tus aliados a la vez — y ellos hacen lo mismo por ti."
        related: "alliance_improvements"
        body: |
            <h2 id="resumen">Resumen</h2>
            <p>La <strong>ayuda de construcción</strong> permite a los miembros de una alianza acelerar mutuamente sus obras en curso con un solo clic. Cuando uno o más aliados tienen una construcción activa en su planeta, aparece un <strong>icono de ayuda</strong> (corazón) en la barra de interfaz global. El badge indica el número de construcciones elegibles.</p>
            <p>Al hacer clic en el icono, se acelera automáticamente <strong>todas las construcciones elegibles</strong> de la alianza de una sola vez, sin necesidad de seleccionarlas individualmente.</p>

            <h2 id="ganancia">Ganancia por ayuda</h2>
            <p>Cada acción de ayuda reduce el tiempo de construcción restante en:</p>
            <blockquote><strong>15 segundos × nivel del bonus «Impulso de construcción»</strong></blockquote>
            <p>La ganancia está <strong>limitada a 75 segundos</strong> por ayuda y por miembro (nivel 5 × 15 s = 75 s). Una construcción nunca puede bajar de <strong>30 segundos restantes</strong> mediante ayuda.</p>
            <table>
                <tr><th>Nivel del bonus</th><th>Ganancia por ayuda</th></tr>
                <tr><td>0 (no desbloqueado)</td><td>15 s</td></tr>
                <tr><td>1</td><td>15 s</td></tr>
                <tr><td>2</td><td>30 s</td></tr>
                <tr><td>3</td><td>45 s</td></tr>
                <tr><td>4</td><td>60 s</td></tr>
                <tr><td>5</td><td>75 s</td></tr>
            </table>

            <h2 id="elegibilidad">Elegibilidad de una construcción</h2>
            <p>Para que una construcción sea elegible, deben cumplirse dos condiciones:</p>
            <ul>
                <li><strong>Duración total &gt; 30 segundos</strong> (desde el inicio hasta la finalización prevista).</li>
                <li><strong>Tiempo restante &gt; 30 segundos</strong> en el momento de la ayuda.</li>
            </ul>
            <p>Las construcciones casi terminadas (menos de 30 s restantes) no se benefician de la ayuda.</p>

            <h2 id="deduplicacion">Deduplicación</h2>
            <p>Un mismo miembro solo puede ayudar <strong>cada construcción una vez</strong>. El icono desaparece automáticamente cuando ya no quedan construcciones que no hayas ayudado. Varios miembros pueden ayudar a la misma construcción — las ganancias se acumulan: 3 miembros en nivel 3 aportan 45 s cada uno, 135 s en total.</p>

            <h2 id="enlace">Relación con las mejoras de alianza</h2>
            <p>La ganancia por ayuda depende directamente del nivel del bonus <strong>«Impulso de construcción»</strong> en la pestaña <a href="/wiki/alliance_improvements">Mejoras</a>. Invertir en ese bonus beneficia a todos: cuanto más rápido terminan sus edificios los aliados, más rápido crece el imperio de la alianza.</p>

    leveling:
        title: "Niveles y experiencia"
        category: "progression"
        order: 1
        tags: "nivel,experiencia,progresión,level,puntuación"
        summary: "Tu progresión del nivel 1 al 40, basada en el tamaño de tu imperio."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Lo que cuenta para tu puntuación</h2>
            <p>Tu puntuación (o "puntos de comandante") refleja el <strong>tamaño global de tu imperio</strong>:</p>
            <ul>
                <li>Número de <strong>trabajadores</strong>.</li>
                <li>Número y calidad de las <strong>naves</strong>.</li>
                <li>Número de <strong>tropas</strong> (Legionarios, Mechas).</li>
                <li>Nivel de los <strong>edificios</strong> construidos.</li>
            </ul>
            <p>Las naves cuentan mucho, los edificios cuentan mucho. Perder una flota en combate hace bajar tu puntuación.</p>

            <h2 id="seuils">Los umbrales de nivel</h2>
            <table>
                <tr><th>Nivel</th><th>Experiencia requerida</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100&nbsp;000</td></tr>
                <tr><td>10</td><td>800&nbsp;000</td></tr>
                <tr><td>15</td><td>5&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>18&nbsp;000&nbsp;000</td></tr>
                <tr><td>25</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>30</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>35</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>La progresión es <strong>exponencial</strong>: subir del nivel 1 al 10 es mucho más rápido que del 30 al 40.</p>

            <h2 id="utilite">Para qué sirve tu nivel</h2>
            <ul>
                <li><strong>Clasificación</strong> de servidor — un indicador público de tu potencia.</li>
                <li><strong>Bonus de conexión</strong> — el importe diario ganado depende de tu nivel.</li>
                <li><strong>Reconocimiento</strong> — un nivel alto impresiona a amigos y enemigos.</li>
            </ul>

    war_points:
        title: "Puntos de Guerra (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,puntos,guerra,combate,clasificación"
        summary: "La segunda moneda del juego, ganada en combate. Sirve de medida de tu agresividad."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">¿Qué son los PDG?</h2>
            <p>Los <strong>Puntos de Guerra</strong> (<strong>PDG</strong>) son una segunda "moneda" de progresión, <strong>orientada al combate</strong>. Donde tu nivel refleja tu tamaño, tus PDG reflejan tu actividad militar.</p>

            <h2 id="gagner">Cómo ganarlos</h2>
            <ul>
                <li><strong>Combates espaciales</strong> — los PDG dependen del poder enemigo que destruyes, nunca de tus propias pérdidas. Aniquilar una horda Cthulhu o una flota alien reporta bastante menos que una flota de jugador de la misma potencia (salvaguarda anti-farmeo).</li>
                <li><strong>Perder un combate espacial</strong> — se te paga igualmente una consolación, proporcional a la firma de la flota que has perdido, pero siempre muy por debajo de lo que gana un vencedor con una flota idéntica: una quinta parte de esa ganancia, nunca más.</li>
                <li><strong>Defensa orbital</strong> — cuando tus torretas aniquilan una flota en órbita, con el mismo ratio que una victoria espacial (mucho menos frente a un Cthulhu). Arrasar las defensas de un planeta ajeno, en cambio, todavía no reporta nada al atacante.</li>
                <li><strong>Raids e invasiones</strong> — cada victoria en tierra reporta PDG.</li>
                <li><strong>Misiones diarias</strong> — algunas dan PDG. Las <strong>3 del día completadas = +250 PDG bonus</strong>.</li>
                <li><strong>Arena (duelos de héroes)</strong> — 50 a 200 PDG por victoria.</li>
                <li><strong>Defensa contra los Cthulhu</strong> — victoria en Tower Defense o en invasión Cthulhu.</li>
                <li><strong>Prisión</strong> — ejecutar un héroe capturado (con moderación).</li>
            </ul>

            <h2 id="utilite">Para qué sirven</h2>
            <ul>
                <li><strong>Desbloquear ciertas investigaciones</strong> que piden PDG como requisito previo.</li>
                <li><strong>Clasificación PDG</strong> (militar) — medida de tu agresividad en el servidor.</li>
                <li><strong>Torturar a un prisionero</strong> en prisión (cuesta PDG para revelar la posición de un planeta enemigo).</li>
                <li><strong>Puntuación ponderada</strong> en algunos modos de servidor (como Paid Server).</li>
            </ul>

            <h2 id="strategie">Estrategia</h2>
            <p>Los PDG recompensan a los jugadores <strong>agresivos</strong>. Si quieres escalar la clasificación militar, concéntrate en los combates espaciales e invasiones en lugar de en el puro crecimiento económico.</p>

    quests:
        title: "Misiones diarias"
        category: "progression"
        order: 3
        tags: "misiones,diario,misión,recompensa,pdg"
        summary: "3 pequeñas misiones cada día. Simples, rápidas y un bonus de 250 PDG si las haces todas."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Cada día, a las <strong>18h59 UTC</strong>, el juego te asigna <strong>3 misiones diarias</strong>. Son pequeñas tareas que puedes realizar durante tu sesión de juego normal.</p>

            <h2 id="types">Ejemplos de misiones</h2>
            <ul>
                <li>Espiar un planeta.</li>
                <li>Vender recursos a un comerciante.</li>
                <li>Colonizar un nuevo planeta.</li>
                <li>Construir o subir de nivel una Ciudad / Metrópolis.</li>
                <li>Enviar un mensaje privado a otro jugador.</li>
                <li>Publicar un mensaje en la sala de alianza.</li>
                <li>Ganar un cierto número de PDG en combate.</li>
                <li>Reciclar un campo de escombros.</li>
            </ul>

            <h2 id="recompense">Las recompensas</h2>
            <ul>
                <li>Cada misión terminada da <strong>PDG</strong>: la recompensa es el mayor valor entre la base de la misión y el 5&nbsp;% de la media de puntos de los jugadores del servidor, de modo que siga valiendo la pena aunque tu imperio crezca mucho.</li>
                <li>Si completas <strong>las 3 misiones</strong> antes del próximo informe diario, recibes <strong>+250 PDG bonus</strong> al día siguiente.</li>
            </ul>
            <p>En 30 días, eso son 7&nbsp;500 PDG "gratis" adicionales, solo jugando regularmente.</p>

            <h2 id="consulter">Dónde verlas</h2>
            <p>Tus misiones del día se muestran en la página <strong>Imperio</strong> (o un recuadro dedicado según la versión). Marcadas automáticamente conforme a las acciones.</p>

    ranking:
        title: "Las clasificaciones"
        category: "progression"
        order: 4
        tags: "clasificación,rango,posición,top,leaderboard"
        summary: "Varias clasificaciones para medir tu progresión (y la de tus rivales)."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="types">Las clasificaciones disponibles</h2>
            <table>
                <tr><th>Clasificación</th><th>Basada en</th><th>Recompensa</th></tr>
                <tr><td><strong>Puntos (Imperio)</strong></td><td>Tamaño global de tu imperio (trabajadores, naves, tropas, edificios, defensas).</td><td>Prestigio.</td></tr>
                <tr><td><strong>Puntos de Guerra</strong></td><td>Actividad militar (combates, raids, invasiones).</td><td>Prestigio militar.</td></tr>
                <tr><td><strong>Alianza</strong></td><td>Suma de puntos de todos los miembros de una alianza.</td><td>Corona la alianza más poderosa.</td></tr>
                <tr><td><strong>Arena (héroes)</strong></td><td>Ratio victorias/derrotas en duelos (mínimo 5 combates).</td><td>Recompensas semanales para el top 3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Mejores puntuaciones TD del servidor.</td><td>Prestigio.</td></tr>
            </table>

            <h2 id="consulter">Dónde verlas</h2>
            <p>Página <strong>Clasificación</strong> en el menú izquierdo. Puedes filtrar por tipo, buscar a un jugador o alianza y ver tu propia posición.</p>

            <h2 id="utilite">Por qué cuenta</h2>
            <ul>
                <li><strong>Estratégico</strong> — identifica a los grandes jugadores a evitar o apuntar.</li>
                <li><strong>Social</strong> — vitrina para reclutar en tu alianza.</li>
                <li><strong>Competición</strong> — en algunos modos de servidor (Paid Server, Dominación), la clasificación final determina al vencedor.</li>
            </ul>

    heroes:
        title: "Tu héroe"
        category: "progression"
        order: 5
        tags: "héroe,bonus,planeta,flota,xp,captura,prisión,especialidad"
        summary: "Tu héroe personal: evoluciona, combate, impulsa tu imperio y puede ser capturado."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Cada jugador posee <strong>un solo héroe principal</strong>, creado al inicio de la partida. Este héroe debe <strong>siempre</strong> estar asignado a un planeta o a una flota — nunca libre. Además puedes poseer un número ilimitado de <strong>héroes secundarios</strong> — consulta el artículo dedicado.</p>
            <p>Mientras no tengas héroe principal — al inicio de la partida, o después de su ejecución en prisión —, el juego te lleva de vuelta a su creación: las páginas de juego permanecen cerradas hasta entonces, las de tu cuenta siguen accesibles. Si uno de tus héroes secundarios ocupa el planeta elegido para el nuevo héroe, vuelve a la <strong>reserva</strong>.</p>
            <p>El héroe aporta bonus de combate, inteligencia y velocidad según su especialidad y su nivel.</p>
            <p>Las 4 competencias del héroe son: <strong>Ataque</strong>, <strong>Defensa</strong>, <strong>Inteligencia</strong> y <strong>Velocidad</strong>.</p>
            <p><strong>Inteligencia</strong> confiere un bonus de producción de recursos en los planetas, y una ventaja estratégica en los duelos de arena.</p>
            <p><strong>Velocidad</strong> reduce el tiempo de vuelo de las flotas, y alimenta el Ímpetu en los duelos de arena.</p>

            <h2 id="specialites">Especialidades</h2>
            <p>Cada especialidad otorga un bonus pasivo y desbloquea 3 rasgos en los niveles 5, 10 y 15:</p>
            <ul>
                <li><strong>Militar</strong>: +5&nbsp;% de ataque y defensa, tanto en la flota como en tierra (contra Cthulhu y en PvP), y +5&nbsp;% de poder en los duelos de arena. Rasgos: <strong>Intimidación</strong> (niv. 5, el adversario sufre −5&nbsp;% de poder ofensivo, incluso contra Cthulhu, y −5&nbsp;% de puntuación en duelo), <strong>Táctico</strong> (niv. 10, +10&nbsp;% de poder en la primera ronda de tus combates y +10&nbsp;% en duelo), <strong>Señor de la guerra</strong> (niv. 15, −5&nbsp;% de pérdidas en tus tropas terrestres en combate entre jugadores y +5&nbsp;% de poder en duelo).</li>
                <li><strong>Economía</strong>: duplica los bonus de Inteligencia (producción) y del campo de esclavos. Rasgos: <strong>Eficiente</strong> (niv. 5, −10&nbsp;% del coste de construcción), <strong>Comerciante</strong> (niv. 10, +15&nbsp;% en las ventas al mercader), <strong>Magnate</strong> (niv. 15, +20&nbsp;% de producción).</li>
                <li><strong>Explorador</strong>: +5&nbsp;% de precisión de flota. Rasgos: <strong>Explorador</strong> (niv. 5, +1 de fuerza de radar en el planeta al que está asignado), <strong>Navegante</strong> (niv. 10, +15&nbsp;% de velocidad de flota), <strong>Cartógrafo</strong> (niv. 15, +2 de fuerza de radar en el planeta al que está asignado).</li>
            </ul>

            <p>En el <strong>duelo de arena</strong> se aplican estas mismas reglas: el militar conserva su +5&nbsp;% y sus tres rasgos, la Inteligencia duplicada del economista (más 20&nbsp;% con Magnate) alimenta la Astucia, y la Velocidad duplicada del explorador (más 15&nbsp;% con Navegante) alimenta el Ímpetu. Astucia e Ímpetu cuentan por el 60&nbsp;% de su valor.</p>
            <p>Un resumen detallado de estos bonus se muestra ahora automáticamente al crear tu héroe.</p>

            <h2 id="xp">Ganancia de experiencia</h2>
            <p>La XP se gana de varias formas:</p>
            <ul>
                <li><strong>Combate</strong>: XP fija + proporcional a la potencia enemiga destruida, dividida por el nivel del héroe (escalado natural).</li>
                <li><strong>Duelo en arena</strong>: XP base (30) multiplicada según lo ajustado del combate — un duelo ajustado reporta hasta 3× más XP que una victoria aplastante.</li>
                <li><strong>Pasivo</strong>: +5 XP/hora cuando el héroe está asignado a un planeta (calculado con la producción de recursos).</li>
            </ul>
            <p>Fórmula level up: XP requerida = nivel × 500. En cada nivel, el jugador gana puntos de competencia a asignar.</p>

            <h2 id="assignation">Asignación</h2>
            <p>Asigna tu héroe desde la página <strong>Planetas</strong> o la página de gestión de una <strong>flota</strong>. La asignación se hace en AJAX sin recarga de página.</p>
            <p>Un héroe en una flota en vuelo o en combate no puede ser reasignado. Si la flota es destruida, el héroe se reasigna automáticamente a tu planeta capital.</p>

            <h2 id="capture">Captura</h2>
            <p>Un héroe puede ser capturado en combate:</p>
            <ul>
                <li><strong>Combate espacial</strong> (flota destruida): 20% de probabilidad</li>
                <li><strong>Invasión de planeta</strong> (planeta invadido): 35% de probabilidad</li>
            </ul>
            <p>Una captura exige un <strong>edificio Prisión de nivel 1 o superior</strong>: el héroe queda encerrado en el lugar del combate si ese planeta es tuyo y tiene una Prisión; si no, en tu planeta con la Prisión más alta. Sin ninguna Prisión, no hay captura.</p>
            <p>Tras la liberación, el héroe se beneficia de <strong>24h de inmunidad</strong> contra la recaptura.</p>
            <p>Los Cthulhu y bots no pueden capturar héroes.</p>
            <p>Esta sección describe tu héroe <strong>principal</strong>. Tus <strong>héroes secundarios</strong> siguen una regla de captura totalmente distinta, sin probabilidad alguna — consulta el artículo <em>Héroes secundarios</em>.</p>

    secondary_heroes:
        title: "Héroes secundarios"
        category: "progression"
        order: 6
        tags: "héroe,secundario,cuadra,captura,ejecución,prisión,reciclaje,reserva,botín"
        summary: "Héroes adicionales obtenidos como botín raro: los mismos bonus que tu héroe principal, pero pueden ser capturados o ejecutados definitivamente en combate."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Un héroe secundario aporta <strong>los mismos bonus</strong> que un héroe principal una vez situado en un planeta o una flota. Lo que lo distingue: puede ser <strong>capturado o eliminado definitivamente</strong> en caso de derrota. Puedes acumular varios, además de tu héroe principal.</p>

            <h2 id="obtencion">Cómo se obtienen</h2>
            <p>Un héroe secundario es un <strong>botín raro</strong>, nunca comprable:</p>
            <table>
                <tr><th>Fuente</th><th>Probabilidad</th></tr>
                <tr><td>Victoria en Tower Defense Cthulhu (por partida)</td><td>2&nbsp;%</td></tr>
                <tr><td>Ataque Cthulhu repelido en uno de tus planetas</td><td>1&nbsp;%</td></tr>
                <tr><td>Vencedor de un torneo de arena</td><td>25&nbsp;%</td></tr>
            </table>
            <p>Al obtenerlo, su nombre y especialidad se sortean al azar, y llega directamente a la <strong>reserva</strong> — decides tú dónde colocarlo, o reciclarlo sin colocarlo nunca.</p>

            <p>Cada héroe obtenido se te anuncia con un <strong>informe</strong> que indica de dónde viene. La pantalla final de Tower Defense y el informe de victoria contra los Cthulhu también lo señalan en el momento.</p>

            <h2 id="colocacion">Dónde colocarlos</h2>
            <p>Igual que tu héroe principal: <strong>un planeta</strong> o <strong>una flota</strong>, nunca ambos a la vez. Un secundario no colocado permanece en <strong>reserva</strong>: sin bonus, pero también <strong>sin riesgo</strong> — es una elección normal, no un descuido a corregir. Gestiona todos tus secundarios desde la pestaña <strong>Cuadra</strong> de la página Héroe.</p>

            <h2 id="gestion">Habilidades y equipo</h2>
            <p>Un héroe secundario progresa como el principal: sube de nivel y con ello gana <strong>puntos de habilidad</strong>. El botón <strong>Gestionar</strong> de la Cuadra abre su reparto entre Ataque, Defensa, Inteligencia y Velocidad.</p>
            <p>El mismo panel gestiona su <strong>equipo</strong>: equípalo con un objeto libre de tu inventario, o recupéralo. Los objetos de un héroe enemigo capturado llegan con él: aquí es donde los recuperas.</p>

            <h2 id="riesgo">Qué arriesgas</h2>
            <p>Un héroe secundario colocado puede perderse <strong>definitivamente</strong> durante:</p>
            <ul>
                <li>Un <strong>combate espacial</strong> perdido (su flota es destruida).</li>
                <li>Un <strong>combate utilitario</strong> perdido (una flota totalmente desarmada, aniquilada sin ni siquiera combatir).</li>
                <li>Una <strong>invasión</strong> exitosa del planeta donde está estacionado.</li>
                <li>La destrucción de su flota por las <strong>defensas orbitales</strong> de un planeta en modo ataque.</li>
            </ul>
            <p>En cambio, no arriesga <strong>nada</strong> durante:</p>
            <ul>
                <li>Un <strong>raid</strong> — incluso exitoso, un raid nunca toma el planeta.</li>
                <li>Un combate contra los <strong>Cthulhu</strong> (o cualquier adversario que no sea jugador).</li>
                <li>La <strong>arena</strong> — los duelos y torneos nunca exponen a un héroe a la captura.</li>
            </ul>

            <p>Una <strong>notificación</strong> te avisa en cuanto uno de tus secundarios es capturado o ejecutado: una pérdida definitiva no depende de que abras tu informe.</p>

            <h2 id="prision">La condición de la prisión</h2>
            <p>A diferencia de tu héroe principal (captura <em>probabilística</em>, ver el artículo <em>Prisión y héroes capturados</em>), el destino de un secundario derrotado es <strong>totalmente determinista</strong>, sin ningún azar:</p>
            <ul>
                <li>El vencedor posee un <strong>edificio Prisión</strong> de nivel 1 o superior en al menos uno de sus planetas → <strong>captura</strong> al héroe, con su nivel, experiencia e items intactos.</li>
                <li>El vencedor no tiene <strong>ninguna</strong> Prisión construida → el héroe es <strong>ejecutado</strong>.</li>
            </ul>
            <p>En un combate de bloques (varios aliados combatiendo codo con codo), el héroe pasa al comandante vencedor que <strong>más poder haya comprometido</strong> — si este no tiene Prisión, el héroe es ejecutado aunque un aliado del mismo bando sí tuviera una.</p>
            <p>Un secundario capturado <strong>no</strong> es un prisionero clásico: no hay página de prisión, ni minijuego de evasión, ni rescate. Llega directamente, activo, a la Cuadra de su nuevo propietario, listo para ser colocado de nuevo o reciclado.</p>

            <h2 id="sin-recuperacion">Ninguna recuperación posible</h2>
            <p>Una vez capturado o ejecutado, un héroe secundario se pierde <strong>para siempre</strong>: ni la evasión, ni el rescate, ni la liberación por invasión de su antiguo propietario pueden recuperarlo. La única forma de volver a verlo es reconquistarlo tú mismo en combate — así puede circular indefinidamente entre imperios.</p>

            <h2 id="identidad">Un héroe capturado conserva su identidad</h2>
            <p>Un secundario capturado conserva su <strong>nombre</strong>, su <strong>nivel</strong> y su <strong>experiencia</strong>. En tu Cuadra, muestra su comandante de origen («Capturado de…»).</p>

            <h2 id="reciclaje">El reciclaje</h2>
            <p>Puedes <strong>ejecutar tú mismo</strong> uno de tus héroes secundarios para transferir su experiencia a tu héroe principal, <strong>menos un 10&nbsp;%</strong>. Antes de confirmar se muestra una vista previa numérica (XP transferida, nivel proyectado del principal). <strong>Acción irreversible.</strong></p>

    items:
        title: "Items del héroe"
        category: "progression"
        order: 6
        tags: "items,equipamiento,bonus,rareza,drop,cthulhu,fusión"
        summary: "Equipa a tu héroe con hasta 3 items para acumular bonus. Cómo obtenerlos."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Los items son objetos equipables en tu héroe (máximo <strong>3 items</strong>). Aportan bonus variados que se suman a los bonus naturales del héroe.</p>

            <h2 id="categories">Categorías</h2>
            <ul>
                <li><strong>Ofensivo</strong>: Armas, objetos orientados al ataque</li>
                <li><strong>Defensivo</strong>: Armaduras, escudos, protección</li>
                <li><strong>Poder</strong>: Objetos de estatus, bonus mixtos</li>
            </ul>
            <p>Sin restricción de tipo: puedes equipar 3 ofensivos si lo deseas.</p>

            <h2 id="raretes">Rarezas</h2>
            <ul>
                <li><strong>Común</strong>: 1 bonus (+2-5%)</li>
                <li><strong>Raro</strong>: 1-2 bonus (+5-10%)</li>
                <li><strong>Épico</strong>: 2-3 bonus (+10-15%)</li>
                <li><strong>Legendario</strong>: 3+ bonus (+15-25%)</li>
            </ul>

            <h2 id="bonus">Tipos de bonus</h2>
            <p>16 tipos de bonus posibles: fuerza Legionarios, fuerza Mechas, ataque flota, defensa flota, precisión, escudo, velocidad flota, producción recursos, velocidad construcción, producción workers, producción naves, radar, reciclaje, bonus anti-Cthulhu, bonus duelo, bonus XP.</p>

            <h2 id="obtention">Obtención</h2>
            <p>Existen ahora cuatro formas de obtener items:</p>

            <h3>Combatir a los Cthulhu</h3>
            <p>Los items pueden caer venciendo a Cthulhu, ya sea repeliendo su desembarco en tierra o aniquilando por completo su horda en órbita antes de que aterrice. La tasa de drop es la misma en ambos casos y depende de la dificultad PvE:</p>
            <ul>
                <li><strong>Fácil</strong>: 30% común, 8% raro, 1% épico</li>
                <li><strong>Normal</strong>: 40% común, 15% raro, 5% épico, 0.5% legendario</li>
                <li><strong>Difícil</strong>: 50% común, 25% raro, 10% épico, 2% legendario</li>
            </ul>
            <p>Una horda solo parcialmente destruida en órbita igualmente aterriza: es ese desembarco el que activa entonces el sorteo, nunca los dos a la vez.</p>

            <h3>Victorias en arena</h3>
            <p>Cada victoria en duelo de arena ofrece una posibilidad de drop de item:</p>
            <ul>
                <li><strong>Común</strong>: 15%</li>
                <li><strong>Raro</strong>: 5%</li>
                <li><strong>Épico</strong>: 1%</li>
            </ul>

            <h3>Apuestas en duelo</h3>
            <p>Al lanzar un desafío, puedes apostar un item. Si el adversario acepta, debe apostar un item de la misma rareza. El vencedor se lleva los dos items.</p>

            <h3>Fusionar tres items</h3>
            <p>Tres items de <strong>la misma rareza</strong> se fusionan en un item de la rareza superior, sin coste ni demora. La categoría y los bonus del nuevo item se sortean al azar, igual que en un drop. Los tres items originales se consumen definitivamente, y un item equipado por un héroe debe desequiparse primero. El legendario es la rareza máxima: no se puede fusionar.</p>
            <p>La fusión se lanza desde la página <strong>Comandantes</strong>, pestaña <strong>Fusión</strong>: haz clic en tres tarjetas de items para seleccionarlas (toda la tarjeta es clicable) y confirma con el botón de fusión, disponible tanto arriba como abajo de la lista.</p>

            <h2 id="vol">Robo de items</h2>
            <p>Si tu héroe es capturado, sus items equipados corren el riesgo de ser robados por el vencedor. Probabilidad de robo: Común 80%, Raro 60%, Épico 40%, Legendario 25%.</p>

            <h2 id="inventaire">Inventario</h2>
            <p>Accede a tu inventario desde la página <strong>Comandantes</strong>, pestaña <strong>Inventario</strong>. Desde el inventario, puedes:</p>
            <ul>
                <li><strong>Equipar</strong> un item en tu héroe (si activo y menos de 3 items equipados)</li>
                <li><strong>Desequipar</strong> un item para devolverlo al inventario</li>
                <li><strong>Destruir</strong> un item que ya no necesitas</li>
                <li><strong>Fusionar</strong> 3 items de la misma rareza en un item de la rareza superior, desde la pestaña <strong>Fusión</strong> contigua</li>
            </ul>
            <p>Cada item se muestra como una <strong>tarjeta ilustrada</strong> que presenta su imagen, sus bonus y un borde coloreado según su rareza. Las tarjetas se organizan en una cuadrícula (3 o 4 por fila según el espacio disponible en tu pantalla).</p>

    prison:
        title: "Prisión y héroes capturados"
        category: "progression"
        order: 7
        tags: "prisión,captura,héroe,evasión,tortura,rescate,calabozo,secundario"
        summary: "Cuando un héroe es capturado, ¿qué ocurre? Las opciones del prisionero y del carcelero, y la captura directa de héroes secundarios enemigos."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Captura de un héroe</h2>
            <p>Un héroe es capturado en un combate espacial (20%) o una invasión (35%). El jugador capturado queda encerrado: cualquier página fuera del ámbito permitido lo redirige a la <strong>página prisión</strong>. Aun así conserva acceso al <strong>salón de alianza</strong>, a sus <strong>mensajes privados</strong>, a sus <strong>informes</strong>, a la <strong>consulta</strong> (solo lectura) de su alianza, y a la <strong>gestión de su cuenta</strong>. Todo lo demás — construcción, flotas, mapa, mercado, arena, e incluso la página de héroe — permanece inaccesible hasta que sea liberado.</p>
            <p>Una captura exige un <strong>edificio Prisión de nivel 1 o superior</strong>: el héroe queda encerrado en el lugar del combate si ese planeta es tuyo y tiene una Prisión; si no, en tu planeta con la Prisión más alta. Sin ninguna Prisión, no hay captura.</p>

            <h2 id="prisonnier">Acciones del prisionero</h2>
            <p>Cada <strong>4 horas</strong>, el prisionero puede efectuar una acción:</p>
            <ul>
                <li><strong>Alertar a la alianza</strong> (70% de éxito): envía las coordenadas de la prisión a la sala de alianza. Fracaso = el carcelero es alertado. Sin alianza, la acción no está disponible. Tras un fracaso, la siguiente acción espera 6 horas en lugar de 4.</li>
                <li><strong>Evadirse</strong>: un intento cada 4 horas desde la captura (el primero, 4 horas después). 40% de éxito, +5% por cada tramo de 4 horas de cautiverio. Fracaso = el carcelero es alertado. Este plazo es independiente de las otras dos acciones.</li>
                <li><strong>Escapar gracias a Slash</strong>: en cualquier momento y sin límite. Consulta el artículo <em>Escapar de la prisión</em>.</li>
                <li><strong>Pagar el rescate</strong>: si el carcelero ha pedido uno, puedes pagarlo o rechazarlo desde la página de prisión.</li>
                <li><strong>Rebelarse</strong> (25% + bonus militar): sabotea el 5% de los recursos de la prisión. Fracaso = pérdida de un nivel. En ambos casos, el carcelero recibe un informe.</li>
            </ul>

            <h2 id="geolier">Acciones del carcelero</h2>
            <p>Accesible vía el edificio Prisión o Campo de esclavos:</p>
            <ul>
                <li><strong>Ejecutar</strong>: destruye al héroe definitivamente (+PG proporcionales al nivel). Items recuperados. El dueño del héroe es informado mediante un informe.</li>
                <li><strong>Liberar</strong>: gesto diplomático, el héroe vuelve con su propietario.</li>
                <li><strong>Torturar</strong> (coste: 200 PG): revela la posición de un planeta enemigo.</li>
                <li><strong>Pedir rescate</strong>: pedir recursos a cambio de la liberación (24h para aceptar).</li>
            </ul>

            <h2 id="liberation">Liberación</h2>
            <ul>
                <li><strong>La alianza del prisionero invade</strong>: liberación automática</li>
                <li><strong>Otra alianza invade</strong>: 60% de probabilidad de evasión; si no, el prisionero pasa al invasor si este posee una Prisión, o queda libre</li>
                <li><strong>Cthulhu invade</strong>: todos los prisioneros son liberados</li>
            </ul>

            <h2 id="secondaires">Capturar a un héroe secundario enemigo</h2>
            <p>Todo lo anterior — evasión, tortura, rescate, liberación — concierne al <strong>héroe principal</strong> de un adversario. Un <strong>héroe secundario</strong> (ver el artículo <em>Héroes secundarios</em>) sigue una regla mucho más directa, y ahí es donde tu edificio Prisión adquiere una <strong>utilidad decisiva</strong>: en cuanto posees una Prisión de nivel 1 o superior en uno de tus planetas, cualquier héroe secundario enemigo derrotado frente a ti (combate espacial, combate utilitario o invasión exitosa) se convierte <strong>inmediata y definitivamente</strong> en tuyo — con su nivel, experiencia e items intactos. Sin Prisión, es <strong>ejecutado</strong> en lugar de capturado.</p>
            <p>Un secundario capturado <strong>no</strong> es un prisionero en el sentido de esta página: no hay página de prisión, ni evasión, ni rescate. Llega directamente, activo, a tu <strong>Cuadra</strong> — listo para ser colocado en un planeta o flota, o reciclado.</p>

            <h2 id="prerequis">Requisitos previos</h2>
            <p>Investigación <strong>Prisión</strong> (requiere Alambradas nivel 5), luego edificios <strong>Prisión</strong> y <strong>Campo de esclavos</strong>.</p>

    prison_escape:
        title: "Escapar de la prisión"
        category: "progression"
        order: 8
        tags: "prision,evasion,slash,rescate,heroe,captura"
        summary: "Las tres formas de salir de la prisión por tu cuenta: la fuga instantánea, Slash y el rescate."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Tres salidas</h2>
            <p>Cuando tu héroe es capturado, la página de prisión te ofrece tres formas de salir sin esperar a tus aliados. El minijuego de evasión ha sido retirado.</p>

            <h2 id="instant">Fuga instantánea</h2>
            <ul>
                <li>Un intento cada <strong>4 horas</strong>. El primero se abre 4 horas después de la captura.</li>
                <li><strong>40%</strong> de éxito en el primer intento y luego <strong>+5%</strong> por cada tramo de 4 horas de cautiverio, lo hayas intentado o no.</li>
                <li>La probabilidad del próximo intento aparece en el botón.</li>
                <li>Fracaso: tu héroe sigue en prisión y <strong>el carcelero es alertado</strong>.</li>
            </ul>

            <h2 id="slash">Escapar gracias a Slash</h2>
            <p><strong>Slash</strong> es nuestro otro juego (slash-game.com). Juega con la <strong>misma dirección de correo</strong> que tu cuenta de Area Universe, confirmada en ambos lados.</p>
            <ul>
                <li>Alcanza el <strong>75% de la mejor puntuación de la semana</strong> en una partida jugada <strong>después de tu captura</strong>.</li>
                <li>Mientras la semana en curso (desde el lunes a las 00:00 UTC) tenga menos de 10 jugadores clasificados o su mejor puntuación esté por debajo de 50 puntos, la referencia es la mejor puntuación de la semana anterior.</li>
                <li>Vuelve a la página de prisión y pulsa <strong>Comprobar mi puntuación</strong>: tu héroe queda libre.</li>
                <li>Intentos <strong>ilimitados</strong>, sin espera.</li>
                <li>Una cuenta de invitado o una dirección sin confirmar no puede usar esta salida.</li>
            </ul>

            <h2 id="ransom">Pagar el rescate</h2>
            <p>Si el carcelero pide un rescate, aparece en la página de prisión con su importe y su fecha límite (24 horas). Puedes <strong>pagarlo</strong> o <strong>rechazarlo</strong>. Los recursos se descuentan del conjunto de tus planetas y se entregan al carcelero. Si no tienes recursos suficientes, el pago se rechaza y no se descuenta nada.</p>

            <h2 id="after">Tras la liberación</h2>
            <p>Tu héroe vuelve a uno de tus planetas con los objetos que le quedan y recibe <strong>24 horas de inmunidad</strong> contra una nueva captura.</p>

    arena:
        title: "Arena PvP"
        category: "progression"
        order: 8
        tags: "arena,duelo,torneo,pvp,héroe,desafío,clasificación"
        summary: "Desafía a otros héroes en duelo 1 contra 1. Apuesta uranio o items, gana prestigio."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Sistema de desafíos</h2>
            <p>Desde la página <strong>Arena</strong>, lanza un desafío a otro jugador. El desafiado recibe una notificación y puede <strong>aceptar</strong> o <strong>rechazar</strong> el desafío.</p>
            <ul>
                <li>Un desafío expira automáticamente tras <strong>7 días</strong> sin respuesta. El número de desafíos recibidos pendientes se muestra en la pestaña Arena y en la entrada «Héroe» del menú. El tiempo restante antes de que expire se muestra junto a cada desafío recibido. Una vez expirado, puedes volver a desafiar al mismo jugador.</li>
                <li>Puedes <strong>cancelar</strong> un desafío que hayas enviado mientras siga pendiente.</li>
                <li>Cooldown: <strong>1h</strong> entre dos duelos para el mismo jugador. Se comprueba al enviar el desafío <strong>y</strong> al aceptarlo, para los dos héroes: acumular desafíos pendientes no permite encadenar varios duelos.</li>
                <li>Un héroe capturado no puede desafiar ni ser desafiado. La captura y la pertenencia a la misma alianza se vuelven a comprobar al aceptar.</li>
                <li>El héroe nunca está en peligro (no hay captura en arena).</li>
            </ul>

            <h2 id="combat">Resolución del combate</h2>
            <p>Cuando el desafiado acepta, el combate se resuelve <strong>de inmediato</strong> y el resultado se muestra en pantalla al jugador que aceptó: victoria o derrota, las dos puntuaciones, las recompensas y la apuesta ganada o perdida. Ambos jugadores reciben además un informe. La puntuación se basa en:</p>
            <ul>
                <li><strong>Nivel</strong> del héroe: la base de la puntuación</li>
                <li><strong>Ofensiva</strong>: ataque del héroe, +5&nbsp;% si es militar, y los bonus ofensivos de sus items</li>
                <li><strong>Defensa</strong>: defensa del héroe y los bonus defensivos de sus items</li>
                <li><strong>Astucia</strong> (peso 60&nbsp;%): Inteligencia — duplicada para un economista, +20&nbsp;% con el rasgo Magnate — y los bonus utilitarios de los items (producción, construcción, reciclaje, radar)</li>
                <li><strong>Ímpetu</strong> (peso 60&nbsp;%): Velocidad — duplicada para un explorador, +15&nbsp;% con el rasgo Navegante — y la velocidad de flota de los items</li>
                <li><strong>Rasgos militares</strong>: Táctico +10&nbsp;%, Señor de la guerra +5&nbsp;%, e Intimidación quita 5&nbsp;% de poder al adversario</li>
                <li><strong>Especialidad</strong>: ventaja piedra-papel-tijera (Militar &gt; Explorador &gt; Economía &gt; Militar, +10&nbsp;%)</li>
                <li><strong>Factor aleatorio</strong> de ±15&nbsp;% en cada lado</li>
            </ul>

            <h2 id="mises">Apuestas</h2>
            <p>Al lanzar un desafío, puedes añadir una apuesta opcional:</p>
            <ul>
                <li><strong>Uranio</strong>: cada jugador apuesta la misma cantidad. El vencedor se lleva las dos apuestas.</li>
                <li><strong>Item</strong>: cada jugador apuesta un item de la misma rareza. El vencedor se lleva los dos items. El item debe estar <strong>desequipado</strong> (en ambos lados) y no puede comprometerse en dos desafíos pendientes a la vez.</li>
                <li><strong>Amistoso</strong>: sin apuesta, solo se atribuyen las recompensas base.</li>
            </ul>
            <p>La apuesta está cubierta si al menos uno de tus planetas posee el uranio requerido: se retiene de tu planeta más rico en uranio. Si un jugador ya no tiene suficiente uranio en ningún planeta en el momento de la aceptación, el desafío falla. Si el item apostado por el retador ya no está disponible cuando el desafiado acepta (ya no le pertenece o está equipado), el duelo se rechaza.</p>

            <h2 id="recompenses">Recompensas base</h2>
            <p>El vencedor recibe en cada duelo:</p>
            <ul>
                <li>Uranio: proporcional al nivel medio de los combatientes, con un tope de <strong>20</strong> por duelo</li>
                <li>Puntos de guerra: proporcionales al nivel del vencedor (unos 225 a nivel 15), reducidos cuando la diferencia de nivel es grande</li>
                <li>Probabilidad de item: 15% común, 5% raro, 1% épico</li>
            </ul>
            <p>El perdedor no pierde nada (salvo su apuesta eventual).</p>

            <h2 id="classement">Clasificación</h2>
            <p>Una clasificación por servidor muestra a los mejores duelistas:</p>
            <ul>
                <li>Basada en la ratio victorias/derrotas</li>
                <li>Mínimo <strong>5 combates</strong> para aparecer</li>
                <li>Los <strong>5 primeros</strong> son visibles directamente en la página; un botón permite abrir la clasificación completa con paginación y ordenación</li>
                <li>Las recompensas semanales se pagan automáticamente cada <strong>lunes</strong> por la semana anterior (de lunes a domingo), una sola vez: top 3 según el <strong>número de victorias en duelos</strong> de la semana, con un mínimo de <strong>5 duelos</strong> en la semana. Solo se clasifican jugadores (ni comandantes IA ni cuentas eliminadas). 1º = 3000 uranio + 300 PG, 2º = 2000 + 200 PG, 3º = 1000 + 100 PG. Cada jugador recompensado recibe un informe.</li>
            </ul>

            <h2 id="tournois">Torneos</h2>
            <p>Evento de servidor periódico: un torneo cada <strong>7 días</strong> por servidor.</p>
            <ul>
                <li>La inscripción está abierta durante <strong>24h</strong> desde la página Arena. Un héroe capturado no puede inscribirse y queda excluido si es capturado antes del inicio.</li>
                <li>Después, eliminación directa automática con sorteo aleatorio (un jugador sobrante pasa la primera ronda directamente) y un combate por el tercer puesto entre los dos perdedores de las semifinales.</li>
                <li>Se necesitan al menos <strong>2 participantes</strong>: si no, el torneo se cancela (sin recompensas) y los inscritos son avisados por informe. Con un solo jugador inscrito, el torneo se celebra si un comandante IA puede completar el cuadro.</li>
                <li>En cuanto hay al menos un jugador inscrito, los <strong>comandantes IA</strong> del servidor (héroe principal no capturado) completan el cuadro hasta <strong>8 participantes</strong> en total. Se inscriben progresivamente durante las 24h de inscripción, y el cuadro se completa al cierre si aún faltan.</li>
                <li>Si hay <strong>8 jugadores o más</strong> inscritos, ningún comandante IA participa. Sin ningún jugador inscrito, el torneo no se celebra: los comandantes IA nunca juegan entre ellos.</li>
                <li>Cada combate del torneo también otorga a su vencedor las recompensas habituales de un duelo.</li>
                <li>Los comandantes IA compiten por el podio y reciben las mismas recompensas que los jugadores, salvo la probabilidad de obtener un héroe secundario.</li>
                <li>El campeón conserva un 25 % de probabilidad de obtener un héroe secundario (reservada a los jugadores).</li>
            </ul>
            <p>Recompensas:</p>
            <ul>
                <li>1º = 5000 uranio + 500 PG + 1 item épico (20 % de probabilidad de un item legendario adicional)</li>
                <li>2º = 3000 uranio + 300 PG + 1 item raro (10 % de probabilidad de un item épico adicional)</li>
                <li>3º = 1500 uranio + 150 PG + 1 item raro</li>
                <li>Resto de participantes = 500 uranio + 50 PG (10 % de probabilidad de un item común)</li>
            </ul>
            <p>Cada participante recibe un informe con su clasificación y sus recompensas. La página Arena muestra la cuenta atrás del fin de inscripción, el podio del último torneo y la fecha del siguiente.</p>

    login_bonus:
        title: "Bonus de conexión"
        category: "progression"
        order: 9
        tags: "bonus,conexión,diario,bitcoin,serie,racha"
        summary: "Bitcoins gratis cada día, multiplicados si encadenas varios días consecutivos."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">El principio</h2>
            <p>En tu <strong>primera conexión</strong> de cada día calendario, el juego te ofrece un bonus de Bitcoins. Es gratis, no requiere ninguna acción salvo conectarse.</p>
            <p>El importe es el mayor de los dos cálculos siguientes, multiplicado luego por tu racha:</p>
            <ul>
                <li>Un <strong>mínimo basado en tu nivel</strong>, con un aleatorio diario (×1 a ×5) — garantiza un bonus motivador desde el principio de la partida.</li>
                <li>El <strong>5&nbsp;% de la media de Bitcoins del servidor</strong> — así el bonus sigue siendo relevante a medida que la economía crece.</li>
                <li>El resultado se multiplica por tu <strong>multiplicador de racha</strong> (ver abajo).</li>
            </ul>
            <p>La media del servidor excluye las cuentas extremas (el 5&nbsp;% más rico y el 5&nbsp;% más pobre) y no cuenta ni bots ni cuentas de prueba.</p>
            <p>Ejemplo: un jugador nivel 10 en el día 1 recibe al menos entre 50&nbsp;000 y 250&nbsp;000 Bitcoins — más si el 5&nbsp;% de la media del servidor supera ese mínimo.</p>

            <h2 id="streak">La racha de 7 días consecutivos</h2>
            <p>Conectarte <strong>cada día</strong> hace subir tu multiplicador:</p>
            <table>
                <tr><th>Día consecutivo</th><th>Multiplicador</th></tr>
                <tr><td>Día 1</td><td>×1.0</td></tr>
                <tr><td>Día 2</td><td>×1.2</td></tr>
                <tr><td>Día 3</td><td>×1.5</td></tr>
                <tr><td>Día 4</td><td>×1.8</td></tr>
                <tr><td>Día 5</td><td>×2.0</td></tr>
                <tr><td>Día 6</td><td>×2.5</td></tr>
                <tr><td>Día 7</td><td>×5.0</td></tr>
            </table>
            <p>En el 8º día, el ciclo vuelve al día 1. Si <strong>pierdes un día</strong> (más de 24h sin conectarte), la racha se reinicia.</p>

            <h2 id="items">Los items bonus</h2>
            <p>Ciertos días de la racha ofrecen además un <strong>item para tu héroe</strong>, aleatorio:</p>
            <ul>
                <li><strong>Día 3</strong>: un item común.</li>
                <li><strong>Día 7</strong>: un item raro.</li>
            </ul>

            <h2 id="reclamation">Cómo reclamarlo</h2>
            <p>Una ventana se abre automáticamente en tu conexión. Un clic para recuperar todo. Tu <strong>mejor racha</strong> se archiva como récord personal.</p>

            <h2 id="conseil">Un pequeño consejo</h2>
            <p>Incluso 30 segundos de conexión bastan para validar la racha. No te pierdas el día 7, es cuando más reporta.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminación,quiebra,fin"
        summary: "Las 2 formas de perder la partida, y lo que te queda después."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">Los 2 tipos de Game Over</h2>
            <p>Hay dos formas de ser eliminado de un servidor. Conocerlas es ya protegerse.</p>

            <h2 id="faillite">1. La quiebra económica</h2>
            <p>Si, después del <strong>informe diario de 18h59 UTC</strong>, tu saldo de Bitcoins es <strong>negativo</strong>: <strong>Game Over económico</strong>.</p>
            <ul>
                <li>Todas tus <strong>flotas en vuelo</strong> son destruidas.</li>
                <li>Tu saldo se <strong>reinicia a 125&nbsp;000 Bitcoins</strong>.</li>
                <li>Tus <strong>investigaciones</strong> se reinician.</li>
                <li>Tu <strong>terraformación</strong> se divide por 2.</li>
                <li>Tu <strong>clasificación</strong> se reinicia.</li>
            </ul>
            <p>El comandante sigue vivo (puede seguir jugando), pero reinicia fuertemente debilitado.</p>
            <p><strong>Se te avisa antes:</strong> en cuanto tu saldo cae por debajo del déficit diario proyectado (coste de mantenimiento menos ingresos), un informe de alerta «Bancarrota inminente» te avisa — como máximo uno al día. Si lo recibes, actúa antes del próximo reporte diario.</p>

            <h2 id="planetes">2. La pérdida de todos tus planetas</h2>
            <p>Si pierdes tu <strong>último planeta</strong> (invasión, abandono voluntario, Battle Royale donde tu sector desaparece), la partida está <strong>realmente</strong> terminada:</p>
            <ul>
                <li>Todas tus <strong>flotas</strong> son transferidas a los aliens.</li>
                <li>Tu <strong>comandante es eliminado</strong> del servidor.</li>
                <li>Tus estadísticas son <strong>archivadas</strong> en tu cuenta.</li>
            </ul>

            <h2 id="eviter">Cómo evitar el Game Over</h2>
            <ul>
                <li>Vigila cada día tu <strong>balance</strong> (ingresos − costes). Si se pone en rojo, reacciona.</li>
                <li>No sobrerrecluttes: un ejército en mantenimiento permanente puede arruinar a un economista poco vigilante.</li>
                <li>Guarda siempre <strong>al menos 2 planetas</strong> en estado de defender.</li>
                <li>Vigila las <strong>flotas enemigas en aproximación</strong> (notificaciones, radar).</li>
                <li>En caso de gran peligro, <strong>evacúa</strong> tus tropas y recursos a un planeta seguro.</li>
            </ul>

            <h2 id="apres">¿Qué queda después?</h2>
            <p>Aunque eliminado, conservas tu <strong>cuenta jugador</strong>. Tus <strong>estadísticas</strong> de las partidas anteriores se conservan, y puedes unirte a un nuevo servidor.</p>

    game_modes:
        title: "Los modos de servidor"
        category: "events"
        order: 1
        tags: "modo,battle royale,dominación,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe ofrece 7 modos de servidor diferentes, con reglas y objetivos propios."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Visión general</h2>
            <p>Cada servidor de Area Universe tiene un <strong>modo</strong> preciso, elegido por el admin en la creación. El modo define la duración, la condición de victoria, y si los Cthulhu están presentes.</p>
            <table>
                <tr><th>Modo</th><th>Duración</th><th>Condición de victoria</th><th>¿Cthulhu?</th><th>¿Alianzas?</th><th>Investigaciones</th></tr>
                <tr><td>Cthulhu</td><td>300 días</td><td>Ninguna (scoreboard de supervivencia)</td><td>Sí</td><td>Sí</td><td>Normales</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 días</td><td>El VIP que sobreviva 72h</td><td>No</td><td>Sí (salvo para el VIP)</td><td>Máx desde el inicio</td></tr>
                <tr><td>Dominación</td><td>60 días</td><td>Top-scorer al final</td><td>No</td><td>Sí</td><td>Máx desde el inicio</td></tr>
                <tr><td>Battle Royale</td><td>40 días</td><td>Último superviviente</td><td>No</td><td>No</td><td>Máx desde el inicio</td></tr>
                <tr><td>Paid Server</td><td>60 días</td><td>Mejor puntuación ponderada (combate muy valorado)</td><td>No</td><td>Sí</td><td>Normales</td></tr>
                <tr><td>Long Run</td><td>900 días</td><td>Ninguna (maratón)</td><td>Sí</td><td>Sí</td><td>Normales</td></tr>
                <tr><td>Short Run</td><td>150 días</td><td>Ninguna (sprint)</td><td>Sí</td><td>Sí</td><td>Normales</td></tr>
            </table>

            <h2 id="cthulhu">Modo Cthulhu (PvE clásico)</h2>
            <p>El modo base, perfecto para descubrir el juego. Durante las <strong>72 primeras horas</strong>, ningún ataque Cthulhu: es una <strong>fase de preparación</strong>. Luego, las hordas Cthulhu acosan periódicamente tus planetas.</p>
            <p>Sin condición de victoria: al final (300 días), un scoreboard recompensa a los que mejor han sobrevivido.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (caza al VIP)</h2>
            <p>Se designa un <strong>VIP</strong> al azar al final del alto el fuego de 48h. Su objetivo: <strong>sobrevivir 72 horas</strong>. Si lo consigue, gana. Si es matado por un jugador, <strong>el asesino se convierte en el nuevo VIP</strong>. Si lo elimina una causa no humana (Cthulhu, evento), se sortea otro jugador.</p>
            <p>El VIP está <strong>solo contra todos</strong>: es automáticamente sacado de su alianza en el momento de su nominación, y ya no puede unirse a ninguna mientras lleve el estatus.</p>

            <h2 id="domination">Dominación (planetas estratégicos)</h2>
            <p>Se sortean 5 planetas estratégicos. Cada día, su propietario suma <strong>+5 puntos</strong>. Nuevo sorteo cada 5 días (preaviso de 24h en la sala).</p>
            <p>Al final del servidor (60 días), el jugador con la mejor puntuación gana. Para las alianzas, la puntuación es la suma de las puntuaciones de los miembros.</p>

            <h2 id="battle-royale">Battle Royale (último superviviente)</h2>
            <p>Modo solo: <strong>ninguna alianza autorizada</strong>. Inscripciones cerradas tras 7 días. Una sola galaxia.</p>
            <p>El mapa es una cuadrícula espacial de 100 sistemas que <strong>se encoge en anillos concéntricos</strong>: en cada ronda, <strong>todo el anillo exterior desaparece de golpe</strong> (no sistema por sistema). Los sistemas destruidos permanecen en pantalla como <strong>huecos</strong>: el mapa no se reorganiza, por lo que la zona segura se lee de un vistazo.</p>
            <p><strong>5 rondas, una por semana:</strong></p>
            <ul>
                <li>J+7: 36 sistemas · J+14: 28 · J+21: 20 · J+28: 12 · J+35: los 3 últimos (<strong>solo uno sobrevive</strong>). Los 5 últimos días se juegan en el centro.</li>
                <li><strong>12 h antes</strong> de su destrucción, un anillo pasa a <strong>naranja</strong> (aviso).</li>
                <li><strong>1 h antes</strong>, pasa a <strong>rojo parpadeante</strong> y ninguna flota puede entrar ni salir.</li>
                <li>Un sistema destruido suprime definitivamente sus planetas y flotas.</li>
                <li>Una flota en tránsito a un sistema desaparecido es destruida. Si tu héroe está allí, es la derrota.</li>
            </ul>
            <p><strong>Victoria</strong>: ser el último comandante activo.</p>

            <h2 id="paid-server">Paid Server (competitivo de pago)</h2>
            <p>Servidor de pago (<strong>5&nbsp;€</strong>), 100&nbsp;% PvP, sin Cthulhu. Duración 60 días.</p>
            <p><strong>Victoria</strong>: al final, el jugador con la mejor <strong>puntuación ponderada</strong> gana. Esta puntuación combina tamaño del imperio y actividad militar, siendo el combate muy valorado — es un modo para jugadores competitivos.</p>
            <p>El vencedor recibe una <strong>distinción permanente</strong> en su perfil, conservada de un servidor a otro.</p>

            <h2 id="long-short-run">Long Run / Short Run (con eventos)</h2>
            <p>Dos modos PvE con <strong>eventos recurrentes</strong> programados: ataques Cthulhu, raids de piratas, bonus de producción, reciclaje mejorado, arenas de alianza, guerras totales, enfrentamientos inter-servidores…</p>
            <p>El <strong>Long Run</strong> (900 días) es un maratón tranquilo; el <strong>Short Run</strong> (150 días) es un sprint más intenso. El calendario de eventos es <strong>determinista</strong>: puedes anticiparlos.</p>

            <h2 id="recherches-max">Modos con investigaciones máximas desde el inicio</h2>
            <p>En <strong>Search &amp; Destroy, Dominación y Battle Royale</strong>, todas tus investigaciones empiezan al nivel máximo — el menú Investigación está oculto, para jugar directamente en la parte militar.</p>
            <p>Tu planeta inicial recibe entonces un <strong>kit de inicio</strong>:</p>
            <ul>
                <li><strong>500 uranio</strong> para personalizar rápidamente.</li>
                <li><strong>Todos tus puntos de naves desbloqueados</strong> desde el día 1 (1&nbsp;375 puntos de golpe en lugar de 40/día).</li>
            </ul>
            <p>En <strong>Search &amp; Destroy</strong>, se concede un kit militar más grande para permitir al VIP aguantar sus 72h: 2&nbsp;000 Legionarios, 25 barcazas, 500 destructores, 250 torretas láser pesadas.</p>

            <h2 id="fin-de-serveur">Fin de servidor y archivado</h2>
            <p>Cuando un servidor cierra, tus <strong>estadísticas finales</strong> (puntos, héroes, éxitos de VIP, victorias, etc.) se archivan en tu <strong>cuenta jugador</strong>. Tu comandante (el personaje de esta partida) se elimina, pero tu historial permanece.</p>

    cthulhus:
        title: "La amenaza Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,colmena,horda,guarnición,asedio,amenaza,pve,uranio,tower defense,td"
        summary: "Los Cthulhu ahora concentran hordas reales que viajan a la vista antes de atacar tus planetas. Cómo defenderte, cómo se defienden también sus bases, y el Tower Defense para repeler el asalto."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">¿Qué son los Cthulhu?</h2>
            <p>Los <strong>Cthulhu</strong> (los Poseídos) son las criaturas hostiles controladas por el juego (PvE). Mantienen <strong>bases de la colmena</strong> repartidas por la galaxia, desde las que parten <strong>hordas</strong>: flotas reales, con una composición, potencia y trayecto visibles — no una simple cuenta atrás.</p>
            <p>Cuantos más repeles, más sube la <strong>amenaza global</strong>, y más fuertes son los ataques siguientes.</p>

            <h2 id="menace">El nivel de amenaza</h2>
            <p>En cada victoria contra una invasión Cthulhu, el nivel de amenaza sobre tu imperio aumenta. Las ganancias son mayores en dificultad alta y según tu régimen de alianza:</p>
            <table>
                <tr><th>Dificultad</th><th>Sin alianza</th><th>Alianza Martillo de las Estrellas</th><th>Otra alianza</th></tr>
                <tr><td>Fácil</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Difícil</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p>El <strong>Martillo de las Estrellas</strong> reduce la progresión de amenaza (el régimen defensivo es más tranquilo frente a los Cthulhu).</p>
            <p>La amenaza también <strong>vuelve a subir sola</strong>: +5 con cada informe diario del Imperio, y +1 por hora mientras una horda permanece en órbita de uno de tus planetas antes de desembarcar (con tope en 300, y solo tras tu primer contacto con los Cthulhu). Ganar un Tower Defense la <strong>divide por 2</strong>: un jugador constante la mantiene baja; dejarla crecer invita a hordas cada vez mayores.</p>

            <h2 id="puissance">Potencia de las invasiones</h2>
            <p>La potencia de una invasión Cthulhu depende:</p>
            <ul>
                <li>del <strong>nivel de amenaza</strong> acumulado;</li>
                <li>de la <strong>dificultad</strong> elegida;</li>
                <li>de la <strong>terraformación</strong> del planeta objetivo.</li>
            </ul>
            <p>En <strong>Fácil</strong>, la potencia de ataque se divide por 2. En <strong>Difícil</strong>, se potencia.</p>

            <h2 id="horde">El ataque: una horda muy real</h2>
            <p>Un ataque siempre empieza con una <strong>concentración</strong>: la horda se masa en órbita de una base de la colmena durante <strong>6 horas</strong> (12 horas para una horda Boss) antes de partir.</p>
            <p>Una vez en marcha, vuela a <strong>velocidad de horda</strong> — lenta, muy visible en el <strong>radar</strong> — y hay una <strong>alerta garantizada 1 hora antes de su llegada</strong>, sea cual sea tu cobertura de radar.</p>
            <p>Es una <strong>flota real</strong>: puedes destruirla en cualquier momento — en formación sobre su base, en pleno vuelo, ya llegada a la órbita de tu planeta, o ganando el <strong>Tower Defense</strong> (jugable en cuanto está planificada o ya activa). Destruirla anula el ataque, sea cuando sea.</p>
            <p>A su llegada se juega un <strong>combate orbital</strong> (tus flotas y torretas contra la horda). Los supervivientes desembarcan <strong>2 horas después</strong> para el asalto terrestre. Pueden formarse o volar varias hordas a la vez, con composición aleatoria.</p>
            <p>Única excepción: la <strong>infiltración</strong> (desbloqueada a partir del nivel 200) sigue siendo <strong>instantánea e invisible</strong> — sin concentración ni aviso previo.</p>

            <h3>Si ganan tus defensas</h3>
            <table>
                <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                <tr><td>Pérdidas de Legionarios</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                <tr><td>Pérdidas de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                <tr><td>Pérdidas de trabajadores</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
            </table>
            <p>Ganas <strong>PDG</strong> y una probabilidad de <strong>drop de item</strong>.</p>

            <h3>Si la horda gana en tierra</h3>
            <p>El saqueo y la captura son <strong>proporcionales a lo que quede de la horda</strong> tras el combate orbital: una horda destruida a la mitad saquea la mitad. Por debajo del <strong>90&nbsp;% de supervivencia</strong>, ya no tiene suficientes tropas para capturar el planeta, ni siquiera en dificultad Difícil.</p>
            <table>
                <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                <tr><td>Saqueo de recursos (horda intacta)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planeta capturado (si ≥ 90&nbsp;% de supervivencia)</td></tr>
                <tr><td>Reducción de amenaza tras derrota</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>En <strong>Difícil</strong>, sin suficientes supervivientes para capturar, el saqueo vuelve a la tasa <strong>Normal</strong> (70&nbsp;%), multiplicada por el ratio de supervivencia de la horda. Si el planeta es capturado y era tu último, es el Game Over.</p>

            <h2 id="bases">Las bases de la colmena</h2>
            <p>La colmena mantiene <strong>bases</strong> repartidas por la galaxia: las bases originales de la colmena (hasta 36 por galaxia, de potencia creciente — sus nombres van de «Cthulhu I» para los puestos avanzados hasta el temible «Cthulhu V») y antiguos planetas de jugador convertidos por una expansión o una erupción. Cada una está protegida por una <strong>guarnición permanente</strong> que se reconstituye en <strong>24 horas</strong> si se ve mermada.</p>
            <p>Concentrar una flota de jugador en órbita de una base (signatura acumulada de al menos <strong>10.000</strong>) desencadena un <strong>asedio</strong>: la base asediada deja de enviar hordas (ahora parten de una base más lejana), las <strong>oleadas de defensa</strong> aumentan en potencia (+25&nbsp;% cada 2 horas), y tras <strong>6 horas</strong> las demás bases envían <strong>flotas de socorro</strong> como refuerzo. Una base asediada muestra la insignia <strong>«Base asediada»</strong> en el mapa galáctico. Una vez levantado el asedio, las flotas de socorro regresan a casa y la base recupera una guarnición normal.</p>
            <p>Cuando se levanta el asedio, cada participante recibe pago <strong>a prorrata de la signatura destruida</strong>: 0,02 bitcoin por punto, más puntos de guerra.</p>

            <h2 id="liberation">Liberar una base</h2>
            <p>Invadir con éxito una base de la colmena — incluidas ahora las bases alien «Cthulhu I» a «V» — otorga las recompensas habituales (uranio, probabilidad de drop de item) <strong>y</strong> hace retroceder la <strong>Amenaza del universo</strong> en <strong>50 puntos</strong>, retrasando la próxima profecía de Cthulhu (ver el artículo <em>Las profecías de Cthulhu</em>). Un planeta liberado así queda <strong>protegido 72 horas</strong>: la colmena no puede recolonizarlo ni hacer erupción en él durante ese plazo. Si el planeta liberado era originalmente un planeta de jugador — capturado por la colmena, convertido tras una invasión perdida, abandonado, o nacido de una expansión o una erupción —, sigue siendo colonizable, y tu informe de liberación te da la fecha límite para enviarle un colonizador. Los puestos avanzados originales de la colmena («Cthulhu I» a «V»), en cambio, quedan inutilizables tras ser liberados: el planeta queda libre, pero no puedes enviarle un colonizador, y no se anuncia ninguna fecha límite.</p>
            <p>Por el contrario, perder una invasión contra una base alien ahora también sube tu <strong>amenaza personal en 10 puntos</strong>, igual que contra una base Cthulhu clásica.</p>

            <h2 id="expansion">Expansión y erupción</h2>
            <p>La colmena se expande sola: en cuanto la <strong>Amenaza del universo</strong> alcanza los <strong>300 puntos</strong>, un <strong>enjambre de esporas</strong> parte de una base existente cada <strong>3 días</strong> (cada día si la amenaza supera los <strong>500</strong>) hacia un planeta deshabitado cercano a jugadores — hasta <strong>36 bases por galaxia</strong>. Es una flota como cualquier otra: <strong>interceptable en vuelo</strong>. Si llega, funda una nueva base con su guarnición, y los jugadores a <strong>5 sectores o menos</strong> reciben un informe.</p>
            <p>Erradicar <strong>todas</strong> las bases no elimina la colmena para siempre: tras <strong>48 horas de silencio</strong>, una <strong>erupción</strong> hace resurgir una base en otro lugar, con un informe para los jugadores cercanos. Esta erupción nunca puede caer a <strong>menos de 8 sectores</strong> de un planeta de jugador, ni sobre un planeta todavía bajo su respiro de liberación: la colmena renace en el vacío, no en tus tierras. Si no hay ningún sector suficientemente aislado disponible, la erupción simplemente se pospone a la próxima ventana.</p>

            <h2 id="changement-difficulte">Cambiar de dificultad</h2>
            <p>Puedes modificar la dificultad PvE desde tus <strong>opciones</strong>. Atención: se aplica un <strong>cooldown de 72 h</strong> entre dos cambios — sin ir y venir para esquivar los grandes ataques.</p>

            <h2 id="tower-defense">El Tower Defense (TD)</h2>
            <p>El <strong>Tower Defense</strong> es un minijuego de defensa activa. Se puede jugar en cuanto una horda está <strong>planificada</strong> (formándose en su base) o ya <strong>activa</strong> (en vuelo o en órbita): puedes lanzarlo para aniquilarla antes de que haga daño. Es interactivo: colocas tus defensas en una cuadrícula y te enfrentas a oleadas de monstruos Cthulhu en tiempo real.</p>
            <p>Consejo: para colocar varias defensas seguidas (unidades, muros, alambre de púas), <strong>mantén pulsado y arrastra</strong> — el trazo se bloquea automáticamente en <strong>línea recta</strong> (horizontal o vertical) y todas las casillas atravesadas se rellenan, sin huecos aunque vayas rápido.</p>
            <p>La dificultad del TD es tu nivel de <strong>PvE</strong> (configurable en tus preferencias). El <strong>tutorial</strong> es un entrenamiento: no da nada ni cuesta nada. Una vez lanzada la primera oleada, salir de la partida cuenta como <strong>abandono</strong> (derrota).</p>
            <p>Una <strong>niebla</strong> se desliza sobre la arena, más densa alrededor de las grietas y mientras se acerca un jefe. Pasa por debajo de tus defensas y de los monstruos: no oculta nada. El botón <strong>Niebla</strong> del dock la desactiva si tu dispositivo va justo.</p>

            <h3>Resultado posible</h3>
            <ul>
                <li><strong>Victoria</strong> — la horda activa es destruida, el ataque se anula. Ganas uranio, la amenaza baja (÷2). Cooldown de 6h antes de rehacer un TD.</li>
                <li><strong>Derrota</strong> — recompensas parciales; si la horda ya había desembarcado, el combate terrestre se juega de inmediato.</li>
                <li><strong>TD no jugado</strong> — la horda sigue su curso normal: concentración, vuelo, llegada, desembarco.</li>
            </ul>

            <h3>Informe de fin de partida</h3>
            <p>Al final de cada Tower Defense (victoria o derrota) se archiva un <strong>informe</strong> en la pestaña <strong>Cthulhu</strong> de tus informes: oleadas superadas, puntuación, uranio recolectado, reducción de amenaza, pérdidas por tipo de unidad y enemigos eliminados por tipo. Útil para comparar tus partidas.</p>

            <h3>Cómo se juega</h3>
            <ul>
                <li>Elige una dificultad: Fácil, Normal o Difícil.</li>
                <li>Coloca tus unidades en la cuadrícula. El <strong>cuartel general está en el centro</strong>; los monstruos emergen de <strong>1 a 4 fisuras Cthulhu</strong> abiertas al borde de la plataforma.</li>
                <li>Los monstruos atraviesan la cuadrícula para alcanzar tu QG: atácalos por el camino.</li>
                <li><strong>Muros</strong> (150 en Fácil, 125 en Normal, 75 en Difícil): los monstruos los rodean — cada fisura conserva siempre un camino hacia el QG (un muro que la sellara es rechazado). Las torres no bloquean el camino: un monstruo que choca con una se detiene y la destruye.</li>
                <li><strong>Alambre de espino</strong> (30/20/10 según la dificultad, requiere la investigación Alambre de espino): no bloquea, pero hiere y ralentiza a los monstruos que lo cruzan.</li>
                <li><strong>Colocación memorizada</strong>: tu disposición (torres, muros, alambre) se guarda por servidor y se propone de nuevo al inicio de cada partida.</li>
                <li>Las oleadas grandes llegan <strong>por grupos</strong> (hasta 20 monstruos a la vez): una oleada nunca se extiende más de ~2 minutos.</li>
                <li><strong>Derrota inmediata</strong>: si todos los enemigos de una oleada superan tus defensas y alcanzan el QG, la partida se pierde al instante — imposible ganar sin colocar defensas eficaces (sobre todo en dificultad Fácil).</li>
                <li>Entre oleadas, los trabajadores reparan automáticamente las torretas dañadas.</li>
                <li>Velocidad ajustable de ×1 a ×10, con pausa posible.</li>
                <li><strong>Encadenar oleadas</strong>: una opción de la barra superior inicia automáticamente la siguiente oleada en cuanto termina la actual, sin pasar por la preparación y conservando tu velocidad, hasta la victoria o la derrota. Desactívala durante una oleada para recuperar la pausa de preparación al final de esa oleada. No disponible en el tutorial.</li>
                <li>El combate tiene <strong>20 oleadas máximo</strong>, cada vez más intensas.</li>
                <li><strong>Interfaz</strong>: barra superior a ancho completo (pill CG + barra HP, contador de oleada circular, puntuación, botón «Empezar» e iconos sonido / música / info unidades / cuadrícula / encadenar oleadas a la derecha), panel «Unidades» a la derecha con una cuadrícula de 2 columnas de tarjetas verticales (icono + nombre + stock + estadísticas). Sin menú lateral ni footer durante la partida: toda la anchura de pantalla se dedica al mapa.</li>
            </ul>

            <h3>Tus unidades para el TD</h3>
            <p>Tus unidades de planeta (Legionarios, Mechas, torretas) se convierten en unidades TD según una <strong>ratio de conversión</strong>. Cada tipo de unidad tiene un número máximo colocable, para forzar la diversidad táctica.</p>

            <h3>Los monstruos a los que te enfrentas</h3>
            <ul>
                <li><strong>Profundo</strong> — el monstruo base. Nada excepcional, pero vienen en número.</li>
                <li><strong>Vigilante</strong> — muy rápido pero frágil. A interceptar rápido.</li>
                <li><strong>Shoggoth</strong> — lento, masivo, muy blindado. Difícil de derribar.</li>
                <li><strong>Estrella vampírica</strong> — dispara proyectiles a distancia sobre tus defensas.</li>
                <li><strong>Flagelador mental</strong> — puede <strong>convertir tus Legionarios en monstruos</strong> (efecto visual de conversión), como máximo uno por segundo, y ninguno una vez herido de muerte.</li>
                <li><strong>Boss Cthulhu</strong> — enorme, raro (Normal/Difícil, amenaza alta). Invoca Profundos a su alrededor.</li>
            </ul>

            <h3>Mecánicas útiles a conocer</h3>
            <ul>
                <li>Las unidades y monstruos tienen <strong>tamaños diferentes</strong> en la cuadrícula (Legionario 1×1, Mecha 2×1, torreta 2×2, Boss 2×2).</li>
                <li>La <strong>barra de oleada</strong> muestra el número de enemigos restantes.</li>
                <li>Si refrescas la página, la partida <strong>retoma exactamente donde la dejaste</strong>.</li>
                <li>Una partida guardada debe ser <strong>retomada</strong> antes de empezar una nueva.</li>
            </ul>

            <h3>Recompensas y pérdidas</h3>
            <ul>
                <li><strong>Victoria</strong>: reducción de amenaza + uranio + horda destruida.</li>
                <li><strong>Derrota</strong>: recompensas parciales; si la horda ya había llegado, el desembarco ocurre de inmediato.</li>
                <li><strong>Las pérdidas de unidades son reales</strong> en todos los casos (Legionarios muertos en el TD = muertos de verdad).</li>
            </ul>

            <h3>Clasificación TD</h3>
            <p>Una clasificación por servidor guarda en memoria las <strong>mejores puntuaciones</strong> en Tower Defense. Otro tablero de caza que conquistar.</p>

    events:
        title: "Eventos especiales"
        category: "events"
        order: 3
        tags: "evento,total war,alliance arena,raiders"
        summary: "Eventos puntuales animan la vida del servidor: bonus, desafíos, competiciones inter-alianzas."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Algunos modos de servidor (Long Run, Short Run) desencadenan regularmente <strong>eventos especiales</strong>. Duran unas horas o unos días, y modifican temporalmente las reglas para darle sabor a la partida.</p>
            <p>El calendario es <strong>determinista</strong>: puedes anticipar cada evento, planificar tu estrategia en consecuencia.</p>

            <h2 id="liste">Los eventos con los que puedes encontrarte</h2>
            <table>
                <tr><th>Evento</th><th>Qué ocurre</th></tr>
                <tr><td><strong>Total War</strong></td><td>Guerra total generalizada — todas las alianzas pueden atacarse libremente.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Bonus de producción militar: reclutar y fabricar más rápido.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>Oleadas de enemigos PNJ atacan los servidores. Defiéndete o responde.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Protege a los comerciantes amenazados. Recompensas si salvas a los PNJ.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Invade planetas Cthulhu por recompensas en uranio.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Ataca las flotas Cthulhu para ganar PDG.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Periodo de bonus a la destrucción de flotas enemigas.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Capacidad de reciclaje temporalmente aumentada. Momento ideal para limpiar los escombros.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Competición entre alianzas: combates clasificados y recompensas colectivas.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Enfrentamiento entre servidores diferentes. El mejor servidor se lleva la victoria.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Oleada Cthulhu intensa prevista — prepara tus defensas.</td></tr>
            </table>

            <h2 id="ou">¿Dónde ver el calendario?</h2>
            <p>Página <strong>Eventos</strong> (menú izquierdo en los modos afectados). Verás la lista de eventos próximos, sus fechas y efectos.</p>

            <h2 id="strategie">Cómo sacarles partido</h2>
            <ul>
                <li><strong>Prepárate</strong> con antelación: construye tu ejército antes de un Total War, tus recicladores antes de un bonus Recycling.</li>
                <li><strong>Habla en sala</strong>: un evento es una ocasión de coordinarse con tu alianza.</li>
                <li><strong>Aprovecha los bonus</strong>: no lances una gran producción fuera de un Product Army si puedes esperar.</li>
            </ul>

    alliance_arena:
        title: "Arena Alianza"
        category: "events"
        order: 9
        tags: "alianza,arena,bracket,pvp,evento,torneo,sector,planeta,flota,base,historial,espectador"
        summary: "Evento recurrente cada 3 días: tu alianza se enfrenta a las demás en una batalla de sector — flotas duplicadas, planetas que controlar — para llenar el banco común y embolsarte un bonus personal."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">¿Cuándo empieza?</h2>
            <p>El evento vuelve <strong>cada 3 días</strong> en los servidores afectados. Calendario de un día de arena (horarios Europe/Paris):</p>
            <ul>
                <li><strong>08:00</strong> — anuncio en la sala Universo (todos los idiomas) y <strong>apertura de inscripciones</strong>, con notificación a los miembros de la alianza.</li>
                <li><strong>18:45</strong> — cierre de inscripciones: la composición del cuadro queda fijada.</li>
                <li><strong>19:00</strong> — primera ronda. Las siguientes empiezan a las <strong>19:15</strong> y a las <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — fin de los combates, distribución de recompensas.</li>
            </ul>
            <p>Si menos de <strong>2 alianzas</strong> están inscritas a nivel global a las 19:00, el evento se cancela y un broadcast avisa a todo el mundo.</p>

            <h2 id="inscription">Inscribirse</h2>
            <p>Cuando se abren las inscripciones, una <strong>modal se abre automáticamente</strong> en tu interfaz. También puedes acceder desde la pestaña Arena de tu página Alianza.</p>
            <p>Condiciones:</p>
            <ul>
                <li>Ser miembro de una alianza.</li>
                <li>Tener al menos <strong>1 nave de ataque</strong> (en suelo o en flota) en el momento del spawn (19:00).</li>
            </ul>
            <p>Puedes desinscribirte hasta las 19:00. Si ya no tienes ninguna nave de ataque a las 19:00 (perdidas en combate real entre la inscripción y el spawn), serás declarado automáticamente fuera de combate — tu alianza continúa sin ti.</p>
            <p><strong>Comandantes IA</strong>: los comandantes IA de tu alianza siguen tu inscripción — en cuanto un miembro humano se inscribe, hasta 4 de ellos se unen al bloque a su lado (5 inscritos como máximo por alianza). Las alianzas totalmente IA también se inscriben para completar el cuadro.</p>

            <h2 id="combat">Cómo funciona</h2>
            <p>Cada partida se juega en un <strong>sector creado para la ocasión</strong>, mostrado como el mapa espacial: una cuadrícula de 5 × 5 donde se enfrentan <strong>de 2 a 4 alianzas</strong>. Cada alianza parte de su <strong>base</strong>, en el centro de un borde del sector.</p>
            <p>Tus naves se <strong>duplican</strong> para la arena: nada de lo que posees está en riesgo. Ninguna pérdida real, ningún escombro, ningún héroe capturado.</p>
            <ul>
                <li>Una partida dura <strong>15 minutos</strong> como máximo.</li>
                <li>Gana la primera alianza que llega a <strong>300 puntos</strong>; si no, la mejor puntuación al acabar el tiempo. En caso de empate: más planetas controlados, luego más daño infligido.</li>
                <li>Solo una alianza por sector pasa a la ronda siguiente. Cuadro de eliminación directa en 3 rondas como máximo; el ganador de la última partida es campeón del servidor.</li>
            </ul>

            <h2 id="flotte">Tu flota</h2>
            <p>Empiezas con <strong>una sola flota</strong>, formada por todas tus naves de ataque — las de tierra y las de tus flotas — y tu héroe principal.</p>
            <ul>
                <li><strong>Enviar</strong>: elige tu flota, toca un planeta y confirma. La duración del vuelo se anuncia antes de salir, y un vuelo no se puede cancelar.</li>
                <li><strong>Dividir</strong>: separa parte de tus naves en una nueva flota (4 flotas como máximo). Una flota vuela a la velocidad de su nave más lenta: un escuadrón de cazadores solo va tres veces más rápido que una flota que arrastra acorazados.</li>
                <li><strong>Reagrupar</strong>: dos de tus flotas en órbita del mismo planeta pueden fusionarse.</li>
            </ul>
            <p>Cuando dos alianzas coinciden en el mismo planeta, el combate se resuelve <strong>5 segundos</strong> después — el tiempo de que lleguen refuerzos — con las <strong>mismas reglas que el combate espacial</strong> del juego. Una flota en combate no puede marcharse antes de que termine.</p>
            <p>Una flota destruida no está perdida: <strong>se rehace en tu base</strong>, con todos sus efectivos, a los 45 segundos — 15 más por cada nueva destrucción, 2 minutos como máximo. Cada flota enemiga destruida da <strong>5 puntos</strong> a tu alianza.</p>
            <p><strong>Los comandantes IA combaten de verdad</strong>: van a tomar los planetas libres, evitan los combates perdidos de antemano y vuelven a repararse. Si no abres la pantalla de la partida y no das ninguna orden durante un minuto, el piloto automático también juega por ti — recuperas el control en cuanto vuelves.</p>

            <h2 id="planetes">Planetas y puntos</h2>
            <p>Una alianza <strong>sola</strong> en un planeta que no es suyo lo captura a los <strong>15 segundos</strong>; un enemigo que llega pone el contador a cero. El planeta <strong>sigue siendo de tu alianza</strong> cuando tus flotas se van, hasta que otra lo recupere. Ese es el dilema: repartirse para puntuar o agruparse para ganar los combates.</p>
            <p>Cada <strong>10 segundos</strong>, cada planeta controlado da puntos:</p>
            <table>
                <tr><th>Planeta</th><th>Puntos</th><th>Además</th></tr>
                <tr><td><strong>Mundo</strong> (4 por sector)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Astillero</strong></td><td>1</td><td>Repara tus flotas en órbita: 10&nbsp;% de los efectivos en cada período.</td></tr>
                <tr><td><strong>Nexo</strong> (en el centro)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Cada punto que marca un planeta también ingresa <strong>PDG en el banco de tu alianza</strong> al final de la partida: 3 PDG por punto en la ronda 1, 8 en la ronda 2, 15 en la ronda 3 — ganes o no la partida. Los puntos de flotas destruidas y bases saqueadas no dan PDG.</p>

            <h2 id="bases">Las bases</h2>
            <p>Tu base es tu punto de partida y de reagrupamiento; tus flotas se reparan allí (5&nbsp;% por período). No se captura, pero se <strong>saquea</strong>.</p>
            <p>Una base está defendida por las <strong>defensas planetarias de todos los planetas de los jugadores de la alianza que participan en la partida</strong>, puestas en común: es difícil de tomar. Un ataque rechazado la daña de todos modos, y se repara un 10&nbsp;% por período.</p>
            <p>Si la defensa cae, la base es saqueada: <strong>50 puntos</strong> para el atacante, sus flotas vuelven de oficio a casa y la base queda intocable durante 2 minutos.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Dos tipos de recompensas acumulables.</p>
            <h3 id="banque">Banco alianza</h3>
            <table>
                <tr><th>Ronda alcanzada</th><th>Bitcoin</th><th>PDG</th></tr>
                <tr><td>Perdedores ronda 1</td><td>50 000</td><td>1 000</td></tr>
                <tr><td>Perdedores ronda 2</td><td>150 000</td><td>3 000</td></tr>
                <tr><td>Perdedores ronda 3</td><td>350 000</td><td>8 000</td></tr>
                <tr><td><strong>Campeón</strong></td><td><strong>1 000 000</strong></td><td><strong>25 000</strong></td></tr>
            </table>
            <h3 id="perso">Bonus individual</h3>
            <p>Depositado directo en tu cartera personal, a condición de haber <strong>dado al menos una orden tú mismo</strong> durante la partida: si el piloto automático jugó toda la partida por ti, no hay bonus.</p>
            <table>
                <tr><th>Ronda alcanzada</th><th>Bitcoin personal</th></tr>
                <tr><td>Perdedores ronda 1</td><td>5 000</td></tr>
                <tr><td>Perdedores ronda 2</td><td>15 000</td></tr>
                <tr><td>Perdedores ronda 3</td><td>30 000</td></tr>
                <tr><td><strong>Campeón</strong></td><td><strong>50 000</strong></td></tr>
            </table>
            <p>Acumulas el bonus de todas las rondas alcanzadas. Campeón = 5 000 + 15 000 + 30 000 + 50 000 = <strong>100 000 Bitcoins</strong> en tu cartera, además de los PDG que tus planetas controlados aportaron al banco.</p>

            <h2 id="rapports">Informes de combate</h2>
            <p>Al final de cada partida, cada jugador recibe un <strong>informe</strong> en su página de Informes: resultado, puntuación de tu alianza y de cada adversario, planetas controlados, bases saqueadas, tu daño infligido y recibido, las flotas enemigas destruidas por las tuyas y las que perdiste, tus efectivos restantes, tu puesto en daño entre los pilotos de tu alianza — con el título de <strong>MVP de la partida</strong> para el primero — y los PDG ingresados en el banco.</p>
            <p>Al final del torneo se añade un <strong>resumen personal</strong>: recorrido de tu alianza en el cuadro, balance de partidas, tu contribución total y el detalle de tus ganancias (bonus personal, banco de la alianza, territorios controlados).</p>

            <h2 id="suivi">Seguir el evento desde la pestaña Arena</h2>
            <p>La pestaña <strong>Arena</strong> de tu página Alianza muestra en todo momento el estado real del evento: sin arena en curso, próxima arena a la vista (con cuenta atrás hasta el anuncio), anunciada, inscripciones abiertas o cerradas, arena en curso, o terminada. Una cuenta atrás indica el tiempo restante hasta el próximo paso (cierre de inscripciones, inicio de los combates, ronda siguiente), y un recuadro muestra cuántos miembros de tu alianza ya están inscritos sobre el total.</p>
            <p>Una vez terminada la arena, la pestaña conserva también el <strong>historial de resultados</strong> de tu alianza (arenas jugadas, títulos de campeón, mejor ronda alcanzada, balance victorias/derrotas) y el historial de las diez últimas ediciones jugadas en tu servidor, con el resultado de tu alianza y las recompensas obtenidas en cada una.</p>

            <h2 id="spectateur">Modo espectador</h2>
            <p>¿No estás inscrito en la arena en curso? Aun así puedes seguir en directo las partidas de <strong>tu alianza</strong> desde la pestaña Arena: el sector se muestra exactamente como para un piloto, pero no puedes dar ninguna orden.</p>

            <h2 id="astuces">Consejos</h2>
            <ul>
                <li><strong>Toma el Nexo pronto</strong>: da tanto como tres mundos. Pero todo el mundo lo sabe.</li>
                <li><strong>Separa tus cazadores</strong>: un escuadrón rápido captura los mundos mientras tu flota pesada aguanta el centro.</li>
                <li><strong>Llegad juntos</strong>: las flotas que llegan en los mismos 5 segundos combaten juntas; una flota aislada es destruida y regala 5 puntos.</li>
                <li><strong>Conserva un astillero</strong>: pasar por él repara tus flotas el doble de rápido que en la base.</li>
                <li><strong>No acampes</strong>: un planeta capturado sigue siendo tuyo cuando te vas. Ve a por otro.</li>
                <li><strong>Una base se toma entre varios</strong>: atacar solo una base intacta es regalar puntos. Entre varios aliados, en la misma ventana de 5 segundos, son 50 puntos de golpe.</li>
                <li><strong>Da al menos una orden</strong>: sin una orden tuya, no hay bonus individual.</li>
            </ul>

            <h2 id="mobile">En móvil</h2>
            <p>La arena se juega con el dedo en móvil:</p>
            <ul>
                <li><strong>Orientación horizontal</strong> forzada al entrar en la partida en la aplicación móvil. En un navegador móvil, donde el juego no puede forzar la pantalla, un mensaje te invita a girar el dispositivo.</li>
                <li><strong>Todo el sector cabe en la pantalla</strong>: ni zoom ni cámara que manejar.</li>
                <li><strong>Tres toques para una orden</strong>: tu flota (en la barra inferior, o tocando su planeta), el planeta de destino y el botón «Enviar».</li>
                <li><strong>El marco y la etiqueta</strong> de cada planeta dicen de quién es; las cifras de sus esquinas dan las fuerzas en órbita, las tuyas en verde, las del enemigo en rojo.</li>
                <li><strong>Botón ⓘ</strong>: el detalle del planeta elegido y el registro de combates.</li>
                <li><strong>Push notif</strong>: una alerta al abrirse las inscripciones (08:00), con la hora límite y la hora de los combates.</li>
            </ul>

    ia_bots:
        title: "Comandantes IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,inteligencia artificial,pnj,bot,piloto automático"
        summary: "Algunos servidores incluyen comandantes controlados por IA. Cómo se comportan y por qué."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">¿Por qué IA?</h2>
            <p>En algunos servidores, ciertos comandantes no son jugadores humanos sino <strong>inteligencias artificiales</strong>. Permiten:</p>
            <ul>
                <li><strong>poblar el servidor</strong> cuando hay pocos jugadores activos;</li>
                <li>ofrecer <strong>objetivos interesantes</strong> a los jugadores que buscan combates;</li>
                <li>simular una diplomacia viva con propuestas, traiciones y alianzas creíbles.</li>
            </ul>

            <h2 id="comportement">Cómo se comportan</h2>
            <p>Cada bot tiene:</p>
            <ul>
                <li>una <strong>personalidad</strong> (agresivo, pacífico, oportunista…);</li>
                <li>un <strong>humor</strong> que evoluciona según los eventos;</li>
                <li>un <strong>arquetipo estratégico</strong> (economista, militarista, explorador…).</li>
            </ul>
            <p>Juegan de verdad: construyen, investigan, atacan, forman alianzas, a veces traicionan. Pueden ser tus aliados o tus peores enemigos.</p>
            <p>Crecen <strong>cada día al ritmo de los jugadores activos</strong> del servidor (un poco más rápido que la mediana), sin superar nunca el <strong>90 % del mejor jugador</strong>. Lo que pierden en combate se pierde para siempre: si un jugador destruye su guarnición, no la reconstruyen en ese planeta durante <strong>7 días</strong> y refuerzan en su lugar sus torretas.</p>
            <p><strong>Dónde duerme su flota.</strong> Las IA militaristas y exploradoras mantienen una guarnición en órbita de sus planetas. Las demás, más prudentes, guardan sus naves <strong>en tierra</strong>, como muchos jugadores, y solo las sacan para defenderse: si su radar detecta una flota hostil en camino a la que pueden vencer, ponen su flota en órbita y llaman a las naves de sus planetas cercanos que lleguen a tiempo; ante una flota demasiado fuerte, envían la suya a aterrizar en otro de sus planetas. También se unen a un combate ya iniciado sobre su planeta, o atacan una flota armada estacionada en órbita, cuando pueden ganar. Como un jugador, una IA dormida no reacciona, y una flota oculta por un inhibidor la sorprende. Nunca dejan sus naves en tierra en un planeta sin torretas, donde una invasión las capturaría: las naves van a aterrizar en su planeta mejor defendido, que también es su primer refugio.</p>
            <p><strong>Su comercio.</strong> Venden sus excedentes y la carga de sus recicladores al comerciante más cercano, salvo si está bajo bloqueo o custodiado por una flota hostil en modo ataque, que destruiría su convoy a la llegada: entonces van al siguiente.</p>

            <h2 id="reconnaitre">Cómo reconocerlos</h2>
            <p>Los bots aparecen en la clasificación como jugadores normales. Su comportamiento es coherente pero un ojo avisado detecta a menudo los patrones: respuestas muy rápidas a mensajes de alianza, horarios de conexión atípicos, diplomacia mecánica.</p>

            <h2 id="strategie">Jugar con ellos</h2>
            <ul>
                <li>No subestimes a un bot: algunos son auténticos terrores militares.</li>
                <li>Un bot puede perfectamente invitarte a la alianza, cooperar, luego atacarte si la situación cambia.</li>
                <li>Por inmersión, trátalos como jugadores: hace el servidor más vivo.</li>
            </ul>

            <h2 id="pilote-automatique">Jugadores ausentes: el piloto automático</h2>
            <p>Si un jugador deja de conectarse durante <strong>8 días</strong>, su cuenta pasa a <strong>piloto automático</strong>: un bot <strong>mudo</strong>, que nunca escribe en los salones ni por mensaje privado. Este piloto automático <strong>no juega en su lugar</strong>: la cuenta no lanza ningún ataque, no mueve ni involucra tus flotas en combate y no coloniza. Se limita a continuar tus construcciones e investigaciones y a reforzar lentamente tus torretas. Los demás comandantes IA no lo atacan; los demás jugadores, en cambio, siempre pueden hacerlo. Siempre puedes enviarle un mensaje privado: lo leerá a su regreso. En cuanto el jugador vuelve a conectarse, recupera instantáneamente el control de su cuenta y encuentra sus flotas exactamente donde las dejó.</p>

    cthulhu_prophecies:
        title: "Las profecías de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,profecía,bloqueo,amenaza,evento,alianza,pdg,bitcoin,comerciante,reciclaje,clasificación"
        summary: "Cuando el indicador de amenaza del servidor alcanza su umbral, los Poseídos anuncian una profecía: 48 horas después, sus hordas bloquean el comercio de todo el servidor. Cómo leer el indicador, romper un bloqueo entre varios, y qué cuesta el fracaso."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">¿Qué es una profecía?</h2>
            <p>Un <strong>fondo de amenaza propio del servidor</strong> —distinto de tu nivel de amenaza personal frente a los Cthulhu— sube automáticamente, día tras día. Cuando alcanza su umbral, los <strong>Poseídos</strong> publican una <strong>profecía fechada</strong> en el chat público: un <strong>bloqueo</strong> caerá sobre todo el servidor en las horas siguientes. La profecía también anuncia lo que está en juego si nadie reacciona.</p>

            <h2 id="jauge">Leer el indicador de amenaza del servidor</h2>
            <ul>
                <li>Es visible en la <strong>página Cthulhu</strong> (la del Tower Defense) y avanza independientemente de tus propios combates.</li>
                <li>Sube <strong>100 puntos al día</strong>; el umbral que desencadena una profecía se alcanza en <strong>una semana aproximadamente</strong>.</li>
                <li>Los <strong>Poseídos</strong> publican un <strong>boletín diario</strong> en el chat público con el nivel alcanzado: así puedes verlo venir.</li>
                <li>El primer evento de un servidor no puede ocurrir antes de sus <strong>dos primeras semanas</strong> de existencia.</li>
                <li>Nunca hay dos profecías (ni dos bloqueos) a la vez en el mismo servidor: el indicador solo vuelve a subir cuando termina el evento anterior.</li>
            </ul>

            <h2 id="prophetie">El anuncio</h2>
            <p>Al cruzar el umbral, los Poseídos publican su profecía en el chat: el plazo vence <strong>~48 horas después</strong>. El mensaje anuncia explícitamente lo que está en juego —el bloqueo, el diezmo, la clasificación de alianzas, el destino de los campos de escombros— sin reglas ocultas que descubrir después.</p>

            <h2 id="blocus">El bloqueo</h2>
            <p>Al vencer el plazo, una <strong>horda Cthulhu</strong> se posiciona en órbita de <strong>cada comerciante</strong> y de <strong>cada asteroide</strong> del servidor:</p>
            <ul>
                <li><strong>Venta imposible</strong> en cualquier comerciante bloqueado.</li>
                <li><strong>Reciclaje imposible</strong> en cualquier asteroide bloqueado.</li>
                <li>En el resto del universo, los <strong>campos de escombros siguen siendo reciclables con normalidad</strong>, como después de cualquier otro combate.</li>
                <li>En un objetivo bloqueado, en cambio, los <strong>restos de tus propios asaltos se acumulan en el sitio y quedan fuera de alcance mientras siga viva la horda que lo custodia</strong>. Destrúyela y <strong>ese objetivo se reabre de inmediato</strong>, sin esperar la suerte del bloqueo en el resto del servidor: la venta o el reciclaje se reanudan allí, y tus recicladores ya en órbita vuelven al trabajo solos.</li>
                <li>No tiene nada que ver con el asedio ni el hambre que una flota enemiga puede imponer a un planeta jugador: aquí solo se detienen el comercio y el reciclaje.</li>
                <li>El bloqueo dura como máximo <strong>48 horas</strong>.</li>
            </ul>

            <h2 id="briser">Romper un bloqueo entre varios</h2>
            <p>No todas las hordas son iguales. Las que guardan los <strong>mercaderes</strong> están calibradas muy por encima de la mayor potencia de flota del servidor (jugador o bot): nadie las rompe en solitario. Las guarniciones de los <strong>asteroides</strong>, mucho más ligeras, siguen al alcance de una gran flota aislada, y son ellas las que forman el grueso del recuento. En ambos casos, una <strong>coalición</strong> que golpea la misma horda en asaltos sucesivos acaba con ella.</p>
            <p>El daño que ha sufrido una horda <strong>nunca se regenera</strong> entre combates: cada asalto, incluso perdido, la debilita para el siguiente. Concentra tus golpes en la misma horda en vez de repartirlos entre varias.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Cada punto de daño infligido a una horda se <strong>paga en Bitcoin y Puntos de Guerra</strong> al resolverse el evento —gane o pierda el servidor, ningún asalto es en vano.</p>
            <p>El bloqueo se declara <strong>roto</strong> en cuanto <strong>el 70 % de las hordas del servidor han sido destruidas antes del plazo</strong>, mercaderes y asteroides por igual: la tasa de recompensa se <strong>duplica</strong> entonces para todos los contribuyentes. Un reporte individual detalla tu daño infligido y tu recompensa al final del evento. Mientras el bloqueo está activo, la <strong>página Cthulhu</strong> muestra el progreso en directo: hordas destruidas, objetivo a alcanzar y tiempo restante.</p>

            <h2 id="echec">El precio del fracaso</h2>
            <p>Si el bloqueo <strong>vence sin ser roto</strong>:</p>
            <ul>
                <li><strong>Cada jugador pierde la mitad de su Bitcoin</strong> —los Poseídos cobran su diezmo. Los jugadores bajo <strong>protección de novato</strong> y los jugadores en game over quedan a salvo.</li>
                <li><strong>Todos los campos de escombros de combate del universo son devorados</strong> por los Cthulhu; los <strong>asteroides</strong> quedan intactos.</li>
                <li>La <strong>tesorería de bitcoins de cada alianza</strong> con al menos un jugador humano también pierde la mitad de su contenido: depositar tu Bitcoin en la tesorería antes del plazo no protege de nada. El cobro aparece en el historial de la tesorería.</li>
                <li>Las <strong>3 últimas alianzas de la clasificación</strong> pierden además producción durante 72 horas (ver más abajo).</li>
            </ul>
            <p>Cada jugador afectado recibe un informe con el Bitcoin perdido. Estos riesgos siempre se anuncian en la profecía: ninguna regla oculta.</p>

            <h2 id="classement">La clasificación de alianzas</h2>
            <p>Durante el bloqueo, cada alianza se clasifica según lo que hace contra la colmena. La <strong>página Cthulhu</strong> muestra la clasificación en directo, con lo que tu alianza ganaría o perdería si el bloqueo terminara ahora.</p>
            <ul>
                <li><strong>Puntos</strong>: el daño infligido a una <strong>flota-muro</strong> cuenta doble; el daño infligido a la colmena en otros lugares (asedios de bases, hordas) cuenta simple; cada <strong>victoria en el Tower Defense</strong> vale tanto como destruir un cuarto de muro de asteroide.</li>
                <li><strong>Puntos por miembro</strong>: la puntuación se divide entre el número de miembros activos (conectados en los últimos 7 días, sin protección de novato). El daño de un novato cuenta igualmente: reclutar nunca baja la puntuación.</li>
                <li><strong>Pertenencia congelada</strong> al comienzo del bloqueo: cambiar de alianza durante el evento no mueve ni los puntos, ni la bonificación, ni la penalización.</li>
                <li>Una alianza necesita al menos <strong>2 miembros activos</strong> para clasificarse. Los <strong>jugadores sin alianza</strong> nunca se ven afectados.</li>
            </ul>
            <p><strong>Bloqueo roto</strong>: las 3 primeras alianzas ganan <strong>+15 %, +10 % y +5 % de producción</strong> durante 72 horas, siempre que hayan sumado puntos. Ninguna alianza es penalizada.</p>
            <p><strong>Bloqueo sufrido</strong>: las 3 últimas alianzas pierden <strong>15 %, 10 % y 5 % de producción</strong> durante 72 horas, además del diezmo. Nunca se ve afectada más de la mitad de las alianzas clasificadas, y una alianza que hizo el esfuerzo mínimo (el equivalente a medio muro de asteroide destruido, o dos victorias en el Tower Defense, por miembro activo) queda a salvo, aunque sea la última.</p>
            <p>Cada miembro recibe un informe que explica la bonificación o penalización de su alianza y su fecha de fin. Los Poseídos anuncian el comienzo del bloqueo en el chat, hacen un recordatorio 6 horas antes del plazo y después nombran a las alianzas recompensadas o castigadas.</p>

            <h2 id="conseils">En la práctica</h2>
            <ul>
                <li>Vigila el <strong>boletín diario</strong> de los Poseídos: te da una idea de cuánto tiempo queda antes del umbral.</li>
                <li>En cuanto se anuncie una <strong>profecía</strong>, avisa a tu alianza: tienes <strong>48 horas</strong> para organizarte antes de que caiga el bloqueo.</li>
                <li>Concentra los asaltos en las mismas hordas en vez de dispersarlos: el daño persiste, más vale acabar con una que arañar varias.</li>
                <li>Incluso un asalto perdido paga algo: no esperes a estar seguro de ganar para atacar.</li>
                <li>¿No tienes flota suficiente para atacar un muro? Una <strong>victoria en el Tower Defense</strong> durante el bloqueo también suma puntos para tu alianza.</li>
            </ul>

    notifications:
        title: "Notificaciones push"
        category: "beginner"
        order: 10
        tags: "notificación,push,alerta,móvil,navegador,preferencia"
        summary: "Recibe una alerta en móvil o navegador en cuanto un evento importante ocurra en tu imperio."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">¿Para qué sirve?</h2>
            <p>Area Universe se juega en continuo: flotas enemigas pueden llegar mientras estás en el trabajo. Las <strong>notificaciones push</strong> te alertan en tiempo real en tu teléfono o navegador, para que puedas reaccionar a tiempo.</p>

            <h2 id="evenements">Lo que puedes recibir</h2>
            <ul>
                <li><strong>Investigación terminada</strong> — una tecnología acaba de terminarse.</li>
                <li><strong>Edificio terminado</strong> — tu cola de construcción está vacía.</li>
                <li><strong>Producción terminada</strong> — tus naves o torretas están listas.</li>
                <li><strong>Flota llegada a destino</strong> — tu flota está en el sitio.</li>
                <li><strong>Flota en combate</strong> — un combate espacial va a desencadenarse.</li>
                <li><strong>Flota enemiga en aproximación</strong> — alguien se dirige a uno de tus planetas.</li>
                <li><strong>Planeta bajo ataque</strong> — invasión terrestre en curso.</li>
                <li><strong>Planeta bajo embargo</strong> — uno de tus planetas está asediado.</li>
                <li><strong>Ataque nuclear recibido</strong> — una bomba ha caído sobre ti.</li>
                <li><strong>Alianza en guerra</strong> — declaración de guerra que implica a tu alianza.</li>
                <li><strong>Mensaje privado / de alianza</strong> — nuevo mensaje recibido.</li>
                <li><strong>Héroe capturado / liberado</strong> — evento prisión.</li>
                <li><strong>Ataque Cthulhu</strong> — horda Cthulhu sobre tu planeta.</li>
            </ul>
            <p>Puedes activar cada tipo <strong>individualmente</strong> según lo que te interese.</p>

            <h2 id="activation">Cómo activarlas</h2>
            <ol>
                <li>Abre tus <strong>Preferencias</strong> (menú perfil).</li>
                <li>Pestaña <strong>Notificaciones</strong>.</li>
                <li>Acepta la solicitud de permiso de tu navegador o teléfono.</li>
                <li>Marca los tipos que te interesen.</li>
            </ol>
            <p>Un botón <em>Desactivar todo</em> permite cortar el conjunto con un clic.</p>

            <h2 id="compatibilite">Dónde funciona</h2>
            <ul>
                <li><strong>Aplicación móvil</strong>: Android e iOS nativos.</li>
                <li><strong>Navegador</strong>: Chrome, Firefox, Edge, Safari desktop. Para Safari iOS, añade el sitio a la pantalla de inicio (iOS 16.4+).</li>
                <li><strong>Multi-dispositivo</strong>: si estás conectado en teléfono + PC, los dos suenan.</li>
            </ul>

            <h2 id="solucion-problemas">¿El navegador rechaza la inscripción?</h2>
            <p>En <strong>Brave</strong>, el servicio push de Google está desactivado por defecto. Abre <code>brave://settings/privacy</code>, activa <strong>«Usar servicios de Google para la mensajería push»</strong> y reinicia el navegador por completo. En otros navegadores, comprueba que ningún VPN, antivirus o DNS de filtrado bloquee el servicio de notificaciones.</p>

            <h2 id="movil">En la aplicación móvil</h2>
            <p>En Android e iOS, la página <strong>Notificaciones</strong> incluye una sección «Notificaciones de este dispositivo»: activa o desactiva las notificaciones push del teléfono en cualquier momento. Si están bloqueadas, un botón abre directamente los ajustes del teléfono. Tus preferencias por tipo de notificación se aplican a todos tus dispositivos.</p>

            <h2 id="discord">En Discord</h2>
            <p>Si tu cuenta de Discord está vinculada (<strong>Mis opciones</strong>), la alerta <strong>Flota enemiga acercándose</strong> también te llega por mensaje privado en Discord, con la hora de llegada y un enlace al planeta. Como máximo un mensaje por planeta cada 30 minutos: un ataque con varias flotas no te inunda. Debes ser miembro del <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord de Area Universe</a> y aceptar mensajes privados de sus miembros. La opción está activada por defecto y se desactiva en la sección <strong>Discord</strong> de las preferencias de notificación.</p>

    glossary:
        title: "Glosario"
        category: "beginner"
        order: 11
        tags: "glosario,términos,definiciones,vocabulario,abreviaturas"
        summary: "Todos los términos y abreviaturas del juego, explicados en una frase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Todos los términos del juego</h2>
            <table>
                <tr><th>Término</th><th>Definición</th></tr>
                <tr><td><strong>Barcaza</strong></td><td>Nave de desembarco de Legionarios para raids e invasiones.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Moneda principal del juego. Generada por tus trabajadores.</td></tr>
                <tr><td><strong>Bloque</strong></td><td>Agrupación automática de flotas aliadas durante un combate espacial.</td></tr>
                <tr><td><strong>Búnker</strong></td><td>Edificio defensivo. Aumenta la cap. de Legionarios y protege una parte de tus recursos contra los saqueos.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Campo De Recursos: los escombros dejados tras un combate, reciclables.</td></tr>
                <tr><td><strong>Astillero espacial</strong></td><td>Edificio que permite fabricar naves.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Las criaturas hostiles (ex-"zombies"). Aparecen en modo PvE y en los planetas alien.</td></tr>
                <tr><td><strong>Ciclo</strong></td><td>Ritmo interno de producción. 10 min para un planeta, 1 min para una luna.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Nivel de alerta de alianza. Cuanto más baja la cifra, más tensa la situación.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Asedio de un planeta por una flota enemiga en órbita. Provoca hambruna.</td></tr>
                <tr><td><strong>Mantenimiento</strong></td><td>Coste diario en Bitcoins de tus tropas, naves y edificios.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fin de partida: quiebra económica, o pérdida de todos tus planetas.</td></tr>
                <tr><td><strong>Game Over económico</strong></td><td>Tu saldo de Bitcoins se ha vuelto negativo tras el informe diario.</td></tr>
                <tr><td><strong>Héroe</strong></td><td>Tu personaje único. Evoluciona, combate y puede ser capturado.</td></tr>
                <tr><td><strong>Comerciante</strong></td><td>PNJ en el mapa que compra tus recursos a cambio de Bitcoins.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Nave rara que crea una luna en un campo de escombros (emplazamiento vacío, mín. 2M de niobio y 2M de agua).</td></tr>
                <tr><td><strong>Mothership / Nave nodriza</strong></td><td>Gran nave insignia. Ralentiza ligeramente la flota.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Puntos De Guerra. Ganados en combate, sirven para investigaciones y clasificación.</td></tr>
                <tr><td><strong>Planeta activo</strong></td><td>El planeta actualmente seleccionado. Todas tus acciones se aplican a él.</td></tr>
                <tr><td><strong>PNJ</strong></td><td>Personaje No Jugador: comerciantes, aliens, Cthulhu, bots IA.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Ataque terrestre para saquear los recursos de un planeta (no para conquistarlo).</td></tr>
                <tr><td><strong>Informe diario</strong></td><td>Balance diario calculado a las 18h59 UTC: ingresos, costes y saldo.</td></tr>
                <tr><td><strong>Reciclador</strong></td><td>Nave que recoge los escombros (CDR) tras un combate.</td></tr>
                <tr><td><strong>Ronda</strong></td><td>Turno de combate. Máx 100 en combate espacial, máx 10 en combate terrestre.</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Pequeña nave de espionaje. A enviar antes de cualquier ataque.</td></tr>
                <tr><td><strong>Tamaño de flota</strong></td><td>Indicador global de la masa de tu flota. Cuanto más grande, más combustible consume.</td></tr>
                <tr><td><strong>Terraformación</strong></td><td>Investigación que agranda el tamaño construible de un planeta.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Minijuego de defensa activa contra las hordas Cthulhu.</td></tr>
                <tr><td><strong>Trabajador</strong></td><td>Unidad de población. Produce Bitcoins cada día. Defiende en invasión.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Modo guiado de 16 etapas para aprender el juego, accesible desde las Preferencias.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Jugador designado como objetivo prioritario en modo Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Eliminar mi cuenta y mis datos"
        category: "beginner"
        order: 99
        tags: "eliminación,cuenta,datos,rgpd,privacidad"
        summary: "Cómo solicitar la eliminación definitiva de tu cuenta y de tus datos personales."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Dónde solicitarlo</h2>
            <p>Puedes solicitar en cualquier momento la eliminación de tu cuenta y de tus datos personales desde la página pública <strong>/suppression-donnees</strong>, o desde la parte inferior de tus opciones en el juego.</p>

            <h2 id="irreversible">Un abandono de cuenta definitivo</h2>
            <p><strong>Atención: esto es un abandono definitivo de la cuenta.</strong> Tus datos personales (correo electrónico, identificadores sociales, IP, notificaciones, mensajes privados…) se eliminan o anonimizan de inmediato, y nunca más podrás volver a conectarte con esta cuenta.</p>

            <h2 id="conserve">Qué se conserva, y por qué</h2>
            <p>Para preservar el equilibrio del juego, tus comandantes, planetas y flotas siguen existiendo bajo un apodo de bot anónimo, sin ningún vínculo con tu identidad. Los mensajes públicos escritos en las salas de chat también se conservan, atribuidos ahora a tu apodo de bot anónimo. El historial de pagos se conserva (obligación legal contable), también disociado de tu identidad.</p>

    achievements:
        title: "Logros"
        category: "progression"
        order: 11
        tags: "logros,achievements,trofeos,google play,play juegos,progresion"
        summary: "15 logros de cuenta, de los primeros pasos a las hazañas de carrera, en tu perfil y en Google Play Juegos."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Los <strong>logros</strong> recompensan lo que consigues con tu cuenta, <strong>en todos los servidores</strong>. Un logro desbloqueado lo es para siempre, aunque después pierdas el planeta o dejes la alianza que te lo dio.</p>
            <p>Los encontrarás en tu <strong>perfil multiservidor</strong> (menú «Mi perfil multiservidor»), con tu progreso y la fecha de cada desbloqueo. El perfil de otro jugador muestra los suyos. Los que tu historial ya ha merecido se desbloquean de inmediato.</p>
            <h2 id="liste">Los 15 logros</h2>
            <table>
            <tr><th>Logro</th><th>Condición</th><th>Puntos</th></tr>
            <tr><td>Comandante</td><td>Completar el tutorial</td><td>20</td></tr>
            <tr><td>Constructor</td><td>Terminar una primera construcción</td><td>20</td></tr>
            <tr><td>Sabio</td><td>Terminar una primera investigación</td><td>20</td></tr>
            <tr><td>Colono</td><td>Poseer 2 planetas</td><td>20</td></tr>
            <tr><td>Aliado</td><td>Unirse a una alianza o fundar una</td><td>20</td></tr>
            <tr><td>Veterano I, II, III</td><td>Librar 10, 100 y luego 1000 batallas espaciales</td><td>25, 50, 100</td></tr>
            <tr><td>Conquistador I, II</td><td>Completar 10 y luego 100 invasiones con éxito</td><td>50, 100</td></tr>
            <tr><td>Carcelero</td><td>Capturar a un héroe enemigo</td><td>50</td></tr>
            <tr><td>Cazador de Cthulhu</td><td>Ganar una partida de Tower Defense</td><td>50</td></tr>
            <tr><td>Élite</td><td>Terminar un servidor en el top 10</td><td>100</td></tr>
            <tr><td>Emperador</td><td>Ganar un servidor</td><td>200</td></tr>
            <tr><td>Un logro oculto</td><td>Descúbrelo jugando</td><td>50</td></tr>
            </table>

            <h2 id="progression">El progreso</h2>
            <p>Los logros de batallas e invasiones avanzan por niveles, y tu perfil muestra el contador (por ejemplo 37 / 100). Cuenta cada batalla espacial que libras, ganada o perdida, incluida la destrucción de una flota sin armas (cargueros, recicladores, sondas), para ambos bandos; las invasiones cuentan cuando tienen éxito (las incursiones no cuentan). Élite y Emperador se deciden al final de un servidor.</p>
            <h2 id="google-play">Google Play Juegos (Android)</h2>
            <p>En la aplicación Android, tus logros también aparecen en <strong>Google Play Juegos</strong>, con el aviso «Logro desbloqueado».</p>
            <ul>
            <li><strong>Cuenta de prueba</strong> creada en la aplicación: se vincula automáticamente a tu perfil de Google Play Juegos. Así ya no se elimina tras 7 días sin jugar y se vuelve a abrir sola tras una reinstalación o en un teléfono nuevo.</li>
            <li><strong>Cuenta registrada</strong>: vincúlala desde tu perfil multiservidor (tarjeta «Google Play Juegos»). Después se abrirá sin contraseña con ese perfil de Google Play Juegos: hazlo solo en tu propio dispositivo. Puedes desvincularla en cualquier momento desde la misma tarjeta, en el sitio web o en la aplicación.</li>
            <li>El botón <strong>«Play Jeux»</strong> de la pantalla de inicio de sesión vuelve a abrir la cuenta vinculada. Cerrar sesión desactiva la apertura automática en ese dispositivo: entonces es este botón el que vuelve a abrir la cuenta.</li>
            </ul>
            <p>Un perfil de Google Play Juegos solo se vincula a una cuenta de Area, y una cuenta a un solo perfil. Vincular tu cuenta desde tu perfil le quita el perfil de Google Play Juegos a la otra cuenta a la que estuviera vinculado.</p>

