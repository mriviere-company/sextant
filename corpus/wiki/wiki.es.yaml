articles:
    moderation_blocking:
        title: "Moderación: denunciar y bloquear"
        category: "beginner"
        order: 12
        tags: "moderación,denuncia,bloqueo,sala,mensajes,condiciones,sanción"
        summary: "Denuncia un mensaje abusivo, bloquea a un jugador indeseable, mira lo que hace la moderación y encuentra las reglas que todos aceptan en la primera conexión."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="condiciones">Condiciones de uso</h2>
            <p>En la primera conexión, cada jugador acepta las <strong>condiciones de uso</strong> y las reglas de la comunidad: respeto a los demás jugadores (ni acoso, ni insultos, ni discurso de odio), ningún contenido ilegal, obsceno o difamatorio en las salas, los mensajes y los nombres, nada de trampas, de multicuenta abusiva ni de explotación de bugs. Rechazar te desconecta. Si las condiciones evolucionan, deberán aceptarse de nuevo.</p>

            <h2 id="denunciar">Denunciar un mensaje</h2>
            <p>Cada mensaje de otro jugador en las salas, y cada mensaje privado recibido (salvo los enviados de forma anónima), lleva un icono de <strong>bandera</strong>. Un clic abre la elección del motivo: <strong>Insultos / Acoso</strong>, <strong>Spam</strong> u <strong>Otro contenido inapropiado</strong>. La denuncia llega al equipo de moderación, con una copia del mensaje.</p>
            <p>Un jugador también puede ser denunciado desde su perfil, botón <strong>Denunciar</strong>: Multicuenta, Insultos / Acoso, Trampas, Spam u Otro.</p>
            <p>Límites: <strong>tres denuncias al día</strong> (el contador se reinicia a medianoche, hora de París) y <strong>una sola denuncia por jugador, definitivamente</strong>, ya sea mediante una bandera o desde su perfil. Más allá, el juego muestra «Ya has denunciado a este jugador o alcanzado el límite diario.».</p>

            <h2 id="moderation">Lo que hace la moderación</h2>
            <p>Una denuncia no desencadena ninguna sanción automática: cada una la examina el equipo de moderación, que también ve quién la ha enviado. Multiplicar las denuncias contra un jugador no basta, pues, para que lo sancionen, y una denuncia abusiva no tiene ningún efecto directo sobre la persona señalada.</p>
            <p>Según la gravedad, la moderación puede prohibir a un jugador, durante un tiempo determinado, escribir en las salas y por mensaje privado, o banear su cuenta.</p>

            <h2 id="bloquear">Bloquear a un jugador</h2>
            <p>El botón <strong>Bloquear</strong> del perfil de un jugador oculta de inmediato todos sus mensajes en las salas de chat e impide cualquier intercambio de mensajes privados, en ambos sentidos. El bloqueo se dirige a su cuenta: vale en todos los servidores donde te lo cruces.</p>
            <p>La lista de jugadores bloqueados se gestiona en <strong>Opciones</strong> (sección «Jugadores bloqueados»): cada jugador puede desbloquearse allí en cualquier momento con el botón <strong>Desbloquear</strong>.</p>
    getting_started:
        title: "Primeros pasos"
        category: "beginner"
        order: 1
        tags: "inicio,empezar,nuevo,tutorial,guía"
        summary: "¡Bienvenido! La guía más corta para entender Area Universe y superar con éxito tus primeras horas de juego."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">¿Qué es Area Universe?</h2>
            <p>Area Universe es un juego de <strong>estrategia espacial multijugador</strong>. Diriges un imperio: tus planetas producen recursos, tus naves recorren la galaxia y tus alianzas sellan el destino de los jugadores.</p>
            <p>Es un juego <strong>que se juega a largo plazo</strong>: tus recursos se acumulan incluso cuando estás desconectado. Unos minutos al día bastan para progresar.</p>

            <h2 id="objectif">Tu objetivo</h2>
            <p>Según el modo de servidor elegido (consulta el artículo <em>Modos de juego</em>), el objetivo final varía: resistir el mayor tiempo posible, dominar la clasificación, ser el último en pie, etc. Pero la receta es siempre la misma:</p>
            <ol>
                <li><strong>Hacer funcionar una economía</strong> (recursos + moneda).</li>
                <li><strong>Construir una flota y una defensa</strong>.</li>
                <li><strong>Aliarte</strong> para tener más peso en grupo.</li>
            </ol>

            <h2 id="premieres-actions">Tus 6 primeras acciones</h2>
            <p>Tu planeta inicial no está vacío: ya tiene una Mina de Niobium y un Extractor de agua de nivel 3, un Astillero espacial, un Radar terrestre y una pequeña flota en tierra (10 sondas, 5 cazadores, 2 fragatas y 1 colonizador).</p>
            <ol>
                <li><strong>Sube de nivel tu Mina de Niobium y tu Extractor de agua</strong> (página <em>Infraestructuras</em>).</li>
                <li><strong>Añade un Campo agrícola</strong>: tus trabajadores comen raciones (la comida del juego).</li>
                <li><strong>Investiga Redefinición urbana y luego construye una Gran ciudad</strong>: +25&nbsp;000 trabajadores máximo por nivel. Los trabajadores son tus proveedores de <em>Bitcoins</em> (la moneda del juego).</li>
                <li><strong>Construye un Centro de investigación</strong>: aloja a tus científicos, que aumentan tu velocidad de investigación por tramos (consulta <em>Trabajadores y científicos</em>).</li>
                <li><strong>Envía cargueros a vender tus excedentes</strong> de niobium y agua a un comerciante: en el <em>Mapa espacial</em>, haz clic en el comerciante, luego en <em>Interacción</em>, elige tu flota de cargueros y la misión <em>Descargar y volver</em>. El Cargo I requiere la investigación <em>Gestión de cargas</em>.</li>
                <li><strong>Únete a una alianza</strong>: <strong>+20&nbsp;%</strong> en la producción de niobium, agua y raciones de todos tus planetas, y acceso a las investigaciones de alianza.</li>
            </ol>
            <p>Piensa también en <strong>colonizar un 2.º planeta</strong> con tu colonizador inicial: no hace falta ninguna investigación (consulta el artículo <em>Colonizar un nuevo planeta</em>).</p>

            <h2 id="tutoriel">El tutorial integrado</h2>
            <p>Un <strong>tutorial interactivo</strong> te guía paso a paso, en 5 capítulos: Primeros pasos, Poder militar, Explorar y conquistar, Desarrollar la economía, Diplomacia y comunidad. En tu primera conexión eliges tu ruta:</p>
            <table>
                <thead>
                    <tr><th>Ruta</th><th>Pasos</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Descubrimiento completo</strong></td><td>18</td></tr>
                    <tr><td><strong>Ruta equilibrada</strong></td><td>17 (sin el recordatorio sobre el clic en un planeta)</td></tr>
                    <tr><td><strong>Directo al núcleo</strong></td><td>8 (solo lo que es propio de Area Universe)</td></tr>
                    <tr><td><strong>Lo descubro solo</strong></td><td>ninguno</td></tr>
                </tbody>
            </table>
            <p>Los pasos, capítulo por capítulo (* = pasos del recorrido <em>Directo al núcleo</em>):</p>
            <ol>
                <li><strong>Primeros pasos</strong>: Tus recursos*, Protección para principiantes*, Tu Imperio*.</li>
                <li><strong>Poder militar</strong>: Crear una flota, Producir naves, Mejorar tus naves*, Descubrir la arena*, Organizar flotas en cohortes.</li>
                <li><strong>Explorar y conquistar</strong>: El mapa espacial, Seleccionar un planeta, Interactuar con un planeta, Colonizar un planeta, Defender tus planetas.</li>
                <li><strong>Desarrollar la economía</strong>: Construir edificios, Lanzar una investigación.</li>
                <li><strong>Diplomacia y comunidad</strong>: Unirse a una alianza*, La Wiki*, El Salón*.</li>
            </ol>
            <p>Algunos modos quitan pasos: el de las investigaciones en <em>Search &amp; Destroy</em> y en <em>Dominación</em>, el de las investigaciones y el de la alianza en <em>Battle Royale</em>. El contador «Paso X de N» de la guía indica siempre el total de tu ruta.</p>
            <p>Cada paso superado da una recompensa. Sea cual sea tu ruta, recibes en total <strong>232&nbsp;000 Bitcoins, 150 Legionarios, 100 trabajadores, 500 puntos de guerra y 2 cazadores</strong>: lo que tu ruta se salta se te ingresa como bonus al final (de inmediato con <em>Lo descubro solo</em>).</p>
            <ul>
                <li>Puedes abandonarlo en cualquier momento (<em>Salir del tutorial</em>) y cambiar de ruta sobre la marcha; los pasos ya completados siguen contando.</li>
                <li>Para volver a lanzarlo: página <strong>Preferencias</strong>, sección <em>Tutorial</em>.</li>
            </ul>

            <h2 id="a-surveiller">A vigilar desde el principio</h2>
            <ul>
                <li><strong>Bitcoins positivos</strong>: cada día a las <strong>18h59 (hora de París)</strong>, es decir, las 17h59 UTC en invierno y las 16h59 UTC en verano, un balance calcula tus ingresos y tus costes de mantenimiento. Si tu saldo pasa a negativo, es el <strong>Game Over económico</strong>: pierdes todas tus flotas y todas tus naves, y tu saldo vuelve a 125&nbsp;000 Bitcoins (conservas tus planetas y tus edificios).</li>
                <li><strong>Almacenamiento</strong>: si tus almacenes están llenos, la producción se detiene. Construye almacenes en consecuencia.</li>
                <li><strong>Misiones diarias</strong>: 3 misiones al día (página <em>Objetivos</em>), cada una recompensada con puntos de guerra, más un bono igual a su recompensa media si las completas todas.</li>
            </ul>

            <h2 id="protection-debutant">La protección de los principiantes</h2>
            <p>Durante tus primeros días estás <strong>protegido</strong>: ningún jugador puede enviar una flota a tus planetas. Por tanto, nadie puede atacarte, saquearte, invadirte, bombardearte ni siquiera sondearte; un aliado tampoco puede entregarte recursos. Las flotas que ya van hacia ti son devueltas. Así puedes construir tus primeras bases con tranquilidad.</p>
            <p>La protección termina en cuanto se cumple una de estas condiciones:</p>
            <ul>
                <li>Han pasado <strong>7 días</strong> desde la creación de tu comandante.</li>
                <li>Posees un <strong>4.º planeta</strong> (tus lunas no cuentan).</li>
                <li>Tú mismo envías una <strong>misión ofensiva</strong> (saqueo, invasión o ataque nuclear): renuncias entonces de inmediato a tu protección.</li>
                <li>Activas el <strong>modo ataque</strong> de una de tus flotas.</li>
            </ul>
            <p>En los dos últimos casos, una ventana de confirmación te avisa antes. Aprovecha este periodo para montar una economía y una defensa sólidas antes de lanzarte a la batalla.</p>

    interface_guide:
        title: "Comprender la interfaz"
        category: "beginner"
        order: 2
        tags: "interfaz,pantalla,menú,navegación,botones,planeta activo,barra de recursos,raciones,preferencias,opciones"
        summary: "Las 3 zonas de la pantalla y cómo navegar sin perderte."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="disposition">Las 3 zonas de la pantalla</h2>
            <ul>
                <li><strong>La barra de recursos, arriba</strong> — tus recursos, tus Bitcoins, tus Puntos de Guerra y el nombre de tu <strong>planeta activo</strong>: tócalo para cambiar de planeta.</li>
                <li><strong>El menú</strong> — todas las secciones del juego (Vista general, Héroe, Flotas, Planetas, Infraestructuras, Mapa espacial, Alianza, Informe, Mensajería, Salón…). Su ubicación depende de tu pantalla (ver más abajo).</li>
                <li><strong>La zona central</strong> — el contenido de la página actual (mapa, lista de flotas, edificios…). Es la única zona que se desplaza.</li>
            </ul>
            <p>La ubicación del menú depende de tu pantalla:</p>
            <ul>
                <li><strong>En ordenador</strong>: el menú completo está a la izquierda. Abajo del todo, una fila de iconos abre el aviso de errores, el tutorial (si está en curso), las <strong>Notificaciones</strong>, las <strong>Preferencias</strong>, las <strong>Opciones</strong> de tu cuenta, tu <strong>perfil entre servidores</strong> y la elección del <strong>idioma</strong>.</li>
                <li><strong>En teléfono en horizontal y en la aplicación Android</strong>: una barra de iconos está pegada al borde izquierdo. Mantiene siempre los cinco destinos principales — Vista general, Mapa espacial, Infraestructuras, Astillero espacial y Defensa — y el botón <strong>Menú</strong> (…), que abre todo lo demás en un panel que sube desde abajo.</li>
                <li><strong>En tableta o en teléfono sostenido en vertical</strong> (en un navegador): esos cinco destinos y el botón <strong>Menú</strong> forman una barra en la parte inferior de la pantalla.</li>
            </ul>
            <p>El número que aparece en el botón Menú suma tus nuevos informes, mensajes privados, mensajes de salón y duelos de arena pendientes.</p>

            <h2 id="barre-ressources">La barra de recursos (arriba)</h2>
            <p>Muestra en tiempo real los recursos de tu planeta activo:</p>
            <ul>
                <li><strong>Niobium</strong> — el mineral básico (edificios, naves).</li>
                <li><strong>Agua</strong> — indispensable para la construcción y las naves.</li>
                <li><strong>Raciones</strong> (la comida) — las consumen tus trabajadores: 1 ración por hora por cada 500 trabajadores. Si caen a cero, el hambre mata primero a trabajadores, luego también a Legionarios y por último a Mechas.</li>
                <li><strong>Uranium</strong> — recurso escaso (bombas nucleares, Base nuclear, apuestas de arena). Solo aparece si el planeta lo posee.</li>
            </ul>
            <p>El niobium, el agua, las raciones y tus trabajadores avanzan segundo a segundo al ritmo de tu producción, hasta tu límite de almacenamiento; las raciones también pueden bajar si tus trabajadores comen más de lo que produces. Toca el niobium, el agua o las raciones para ver su producción por hora, bonus incluidos (héroes, campo de esclavos, alianza, lunas, embargo); en el caso de las raciones, es el balance neto, con el consumo ya descontado.</p>
            <p>Los <strong>Bitcoins</strong> (moneda) y los <strong>Puntos de Guerra (PDG)</strong> también se muestran en la barra, así como tus trabajadores, Legionarios, científicos y Mechas, y el espacio ocupado en el suelo (<strong>Terreno</strong>) y en órbita (<strong>Espacio</strong>), en la forma «ocupado/máximo».</p>
            <p><em>En teléfono, la barra está plegada: solo muestra el niobium, el agua, las raciones, el uranium, los Bitcoins y los PDG, más cualquier recurso en alerta (hambre, amenaza en órbita). El botón de flecha al final de la barra, que indica el número de recursos ocultos, la despliega.</em></p>

            <h2 id="planete-active">Planeta activo: qué significa</h2>
            <p>Cuando tienes varios planetas, solo uno está <strong>activo</strong> a la vez. Todas tus acciones (construir, fabricar una nave, lanzar una flota) se aplican a ese planeta.</p>
            <p>Para cambiar de planeta:</p>
            <ul>
                <li>toca el nombre del planeta en la barra de recursos: se abre la lista <strong>Mis planetas</strong> (en un panel que sube desde abajo en teléfono, justo debajo de la barra en ordenador); elige uno;</li>
                <li>o usa las flechas ‹ y › a ambos lados del nombre para pasar al planeta anterior o al siguiente.</li>
            </ul>
            <p>Sigues en la misma página, mostrada para el nuevo planeta. El orden de la lista se ajusta en <strong>Preferencias</strong>, «Orden de planetas»: alfabético, posición, colonización o tamaño.</p>

            <h2 id="navigation">Orientarse rápidamente</h2>
            <ul>
                <li><strong>Vista general</strong> — tu comandante, tus flotas, tus finanzas, la investigación en curso y la actividad de todos tus planetas.</li>
                <li><strong>Infraestructuras</strong> — construir los edificios del planeta activo.</li>
                <li><strong>Astillero espacial</strong> y <strong>Defensa</strong> — producir naves y defensas en el planeta activo.</li>
                <li><strong>Planetas</strong> — la lista de todos tus planetas y el mercado.</li>
                <li><strong>Flotas</strong> — crear, enviar y seguir tus naves.</li>
                <li><strong>Mapa espacial</strong> — explorar la galaxia.</li>
                <li><strong>Informe</strong> — todo lo que el juego te señala (combates, llegadas, alianza…).</li>
                <li><strong>Mensajería</strong> — tus mensajes privados; <strong>Salón</strong> — los salones de chat.</li>
                <li><strong>Alianza</strong> — miembros, banco, diplomacia, arena de alianza.</li>
                <li><strong>Preferencias</strong> — tu seudónimo y tus ajustes en este servidor; <strong>Opciones</strong> — tu cuenta (correo electrónico, contraseña, zona horaria, jugadores bloqueados).</li>
                <li><strong>Servidor</strong> — cambiar de servidor.</li>
            </ul>
            <p>Según el modo del servidor, algunas entradas no aparecen (Investigaciones, Alianza o Cthulhu).</p>

    resources_intro:
        title: "Los recursos"
        category: "beginner"
        order: 3
        tags: "recursos,niobium,agua,comida,raciones,uranium,producción,almacenamiento,ciclo"
        summary: "Los 4 recursos del juego, cómo se producen y por qué el almacenamiento es crítico."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Los 4 recursos del juego</h2>
            <table>
                <thead>
                    <tr><th>Recurso</th><th>Para qué sirve</th><th>Cómo se obtiene</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Niobium</strong></td><td>Construir edificios, naves y defensas</td><td>Mina de Niobium</td></tr>
                    <tr><td><strong>Agua</strong></td><td>Construir edificios, naves y defensas</td><td>Extractor de agua</td></tr>
                    <tr><td><strong>Comida</strong> («Raciones» en el juego)</td><td>Alimentar a tus trabajadores</td><td>Campo agrícola y Granja aeropónica (sus producciones se suman)</td></tr>
                    <tr><td><strong>Uranium</strong></td><td>Base nuclear, bombas nucleares, interceptores, apuestas de arena</td><td>Reciclaje de escombros de uranium, victorias contra los Cthulhu</td></tr>
                </tbody>
            </table>
            <p>Solo los <strong>trabajadores</strong> comen: 1 ración por hora por cada 500 trabajadores. Si faltan raciones, el hambre mata a trabajadores y, si se prolonga, también a Legionarios y a Mechas.</p>
            <p>Además de estos recursos, el <strong>Bitcoin</strong> es la moneda del juego: paga las investigaciones, los reclutamientos, el combustible de las flotas y el mantenimiento diario (consulta <a href="/wiki/bitcoin_economy">Bitcoins y mantenimiento</a>).</p>

            <h2 id="cycle">El ciclo de producción</h2>
            <p>Tus recursos llegan automáticamente, de forma continua. Las cantidades producidas se expresan por <strong>ciclo de producción</strong>, y el juego te las acredita en proporción al tiempo transcurrido:</p>
            <ul>
                <li>En un <strong>planeta</strong>: ciclo de <strong>10 minutos</strong>.</li>
                <li>En una <strong>luna</strong>: ciclo de <strong>1 minuto</strong> (10 veces más rápido, solo para la comida).</li>
            </ul>
            <p>La producción es <strong>proporcional al nivel</strong> del edificio. Por nivel y por ciclo de 10 minutos:</p>
            <ul>
                <li><strong>Mina de Niobium</strong>: 33 niobium;</li>
                <li><strong>Extractor de agua</strong>: 22 agua;</li>
                <li><strong>Campo agrícola</strong>: 27 raciones;</li>
                <li><strong>Granja aeropónica</strong>: 37 raciones.</li>
            </ul>
            <p>Ejemplo: una Mina de Niobium de nivel 10 produce 330 niobium cada 10 minutos, es decir, 1&nbsp;980 por hora, antes de bonus. La barra de recursos muestra tu producción real por hora, bonus incluidos.</p>

            <h2 id="bonus">Lo que mejora tu producción</h2>
            <ul>
                <li><strong>Unirte a una alianza</strong>: <strong>+20&nbsp;%</strong> inmediato en niobium, agua y raciones.</li>
                <li><strong>Investigaciones y mejoras de alianza</strong>: la investigación «Ley Macron» (+7&nbsp;% por nivel, alianzas de la Balanza de los Mundos) y las mejoras «Producción de niobio», «Producción de agua» y «Producción de raciones» (+2&nbsp;% por nivel cada una).</li>
                <li><strong>Héroe destinado en el planeta</strong>: bonus derivado de su Inteligencia, doblado para un héroe de Economía.</li>
                <li><strong>Campo de esclavos</strong>: +2,5&nbsp;% por nivel.</li>
            </ul>
            <p>El tamaño del planeta no cambia lo que produce un nivel: el espacio disponible solo limita el número de niveles que puedes construir.</p>

            <h2 id="stockage">El almacenamiento (¡no lo descuides!)</h2>
            <p>Cada planeta tiene una <strong>capacidad máxima</strong> de almacenamiento, por recurso. <strong>Cuando está lleno, todo lo que se produzca de más se pierde</strong>.</p>
            <p>Al principio, un planeta almacena 200&nbsp;000 niobium, 180&nbsp;000 agua y 150&nbsp;000 raciones. Para aumentar la capacidad:</p>
            <ul>
                <li><strong>Almacén de Niobium</strong>: +1&nbsp;200&nbsp;000 niobium por nivel;</li>
                <li><strong>Depósito de agua</strong>: +800&nbsp;000 agua por nivel;</li>
                <li><strong>Silo agrícola</strong>: +800&nbsp;000 raciones por nivel.</li>
            </ul>
            <p>Se desbloquean con la investigación <strong>Gestión de cargas</strong> nivel 1; el Silo agrícola requiere además la investigación <strong>Aeropónica</strong>. El uranium, en cambio, no tiene límite de almacenamiento.</p>
            <p><em>Consejo para principiantes:</em> comprueba tu almacenamiento <strong>antes</strong> de desconectarte por la noche. No hay nada peor que encontrarte con tus minas paradas durante 10 horas.</p>

    bitcoin_economy:
        title: "Bitcoins y mantenimiento"
        category: "beginner"
        order: 4
        tags: "bitcoin,moneda,mantenimiento,coste,tabla,combustible,economía,game over,informe diario"
        summary: "El Bitcoin es la moneda del juego. Cómo ganarlo y, sobre todo, cómo evitar la bancarrota."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">¿Qué es el Bitcoin?</h2>
            <p>El <strong>Bitcoin</strong> es la <strong>moneda universal</strong> de Area Universe (nada que ver con la criptomoneda real, es solo un guiño). Empiezas con <strong>125&nbsp;000 Bitcoins</strong>. Sirven para:</p>
            <ul>
                <li>Lanzar <strong>investigaciones</strong>.</li>
                <li>Reclutar <strong>Legionarios</strong> (8 Bitcoins cada uno), <strong>Mechas</strong> (60) y <strong>científicos</strong> (25), y fabricar <strong>bombas nucleares</strong> (25&nbsp;000).</li>
                <li>Pagar el <strong>combustible</strong> de cada flota que envías.</li>
                <li>Apoyar a tu <strong>alianza</strong>: depósitos en la tesorería e inversiones en las mejoras de alianza.</li>
                <li>Pagar el <strong>mantenimiento diario</strong> de tus tropas, naves y edificios.</li>
            </ul>

            <h2 id="gagner">¿Cómo ganarlos?</h2>
            <ul>
                <li><strong>Trabajadores</strong> — tu fuente principal. En el informe diario, cada trabajador presente en tus planetas aporta <strong>0,5 Bitcoin</strong>: 10&nbsp;000 trabajadores = 5&nbsp;000 Bitcoins al día, los 50&nbsp;000 trabajadores de tu planeta inicial = 25&nbsp;000 Bitcoins al día, antes de los impuestos de alianza y de paz. Los trabajadores embarcados en una flota no aportan nada.</li>
                <li><strong>Venta a los mercaderes</strong> — entrégales niobium, agua, uranium e incluso trabajadores o tropas, o usa la venta con un clic de la página <strong>Planetas</strong> (consulta <a href="/wiki/market">Mercado y comerciantes</a>).</li>
                <li><strong>Puntos de Guerra</strong> — se ganan, entre otras cosas, con las misiones diarias y se intercambian en la página <strong>Objetivos</strong>: 1 PDG = 1 Bitcoin.</li>
                <li><strong>Bono de conexión</strong> — una suma en cada primera conexión del día, multiplicada si encadenas días consecutivos.</li>
                <li><strong>Saqueo</strong> — los saqueos aportan niobium, agua y uranium, que puedes revender.</li>
            </ul>

            <h2 id="entretien">El mantenimiento diario</h2>
            <p>Cada día a las <strong>18h59 (hora de París)</strong>, es decir, las 17h59 UTC en invierno y las 16h59 UTC en verano, el juego calcula un balance para ti:</p>
            <ul>
                <li><strong>Ingresos</strong>: lo que aportan tus trabajadores.</li>
                <li><strong>Costes</strong>: el mantenimiento de tus Legionarios, Mechas, científicos, naves y edificios.</li>
                <li><strong>Balance</strong>: ingresos − impuestos − costes, que se suma (o se resta) a tu saldo.</li>
            </ul>
            <p>Todo lo que está <strong>en una flota</strong> — en vuelo <em>o</em> estacionada en órbita — cuesta mucho más que lo que está <strong>en tierra</strong> en un planeta: 6 veces más para las naves y los Legionarios, 50 veces más para los Mechas. Una flota que no se usa: ponla en tierra. Un gran ejército de paseo permanente acaba arruinando incluso a los más prudentes.</p>

            <h2 id="bareme">La tabla de mantenimiento</h2>
            <p>Importes en Bitcoins por día.</p>
            <table>
                <thead>
                    <tr><th>Unidad</th><th>En tierra</th><th>En una flota</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionario</td><td>0,1</td><td>0,6</td></tr>
                    <tr><td>Mecha</td><td>2</td><td>100</td></tr>
                    <tr><td>Científico</td><td>3</td><td>2</td></tr>
                    <tr><td>Nave</td><td>firma ÷ 12</td><td>firma ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Ejemplos: 10&nbsp;000 Legionarios cuestan 1&nbsp;000 Bitcoins al día en tierra, 6&nbsp;000 en una flota. 100 Cargo X (firma 50 cada uno) cuestan unos 417 Bitcoins al día en tierra, 2&nbsp;500 en una flota.</p>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Por nivel</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de Niobium, Extractor de agua, Campo agrícola</td><td>1</td></tr>
                    <tr><td>Granja aeropónica</td><td>2</td></tr>
                    <tr><td>Gran ciudad, Radar terrestre</td><td>13</td></tr>
                    <tr><td>Metrópoli</td><td>26</td></tr>
                    <tr><td>Almacén de Niobium, Depósito de agua, Silo agrícola</td><td>30</td></tr>
                    <tr><td>Centro de investigación</td><td>53</td></tr>
                    <tr><td>Cuartel</td><td>66</td></tr>
                    <tr><td>Astillero espacial</td><td>100</td></tr>
                    <tr><td>Radar espacial</td><td>133</td></tr>
                    <tr><td>Fábrica de armamento, Ciudad flotante, Estación orbital</td><td>333</td></tr>
                    <tr><td>Inhibidor de radar</td><td>400</td></tr>
                    <tr><td>Industria pesada</td><td>666</td></tr>
                    <tr><td>Fuerte defensivo</td><td>800</td></tr>
                    <tr><td>Base nuclear</td><td>3&nbsp;333</td></tr>
                    <tr><td>Prisión, Campo de esclavos</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Ejemplo: un Fuerte defensivo de nivel 3 cuesta 2&nbsp;400 Bitcoins al día. Las defensas planetarias (torretas, escudos) y los trabajadores no tienen mantenimiento. Las investigaciones de alianza «Estructura soviética», «Superioridad mecánica» y «Entusiasmo científico» reducen el mantenimiento de los Legionarios, los Mechas y los científicos.</p>

            <h2 id="faillite">Atención: el Game Over económico</h2>
            <p>Si, tras este balance diario, tu saldo de Bitcoins cae <strong>a negativo</strong>, es el <strong>Game Over económico</strong>:</p>
            <ul>
                <li>Todas tus <strong>flotas</strong> se eliminan, en vuelo y en órbita, con su cargamento y las tropas a bordo.</li>
                <li>Todas las <strong>naves en tierra</strong> de tus planetas se pierden.</li>
                <li>Tu saldo se restablece a <strong>125&nbsp;000 Bitcoins</strong>.</li>
            </ul>
            <p>Conservas tus planetas, edificios, defensas, investigaciones y las tropas que se quedaron en tierra. Un informe «¡Bancarrota inminente!» te avisa con antelación (consulta <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Regla de oro:</em> no reclutes un ejército más caro de lo que tus trabajadores pueden financiar.</p>

    first_buildings:
        title: "Construir tus primeros edificios"
        category: "beginner"
        order: 5
        tags: "edificios,construcción,mina,extractor,campo agrícola,gran ciudad,principiante,espacio"
        summary: "El orden de construcción recomendado para arrancar bien tu planeta inicial."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">El orden aconsejado (los 10 primeros edificios)</h2>
            <p>Tu planeta inicial ya tiene una Mina de Niobium y un Extractor de agua de nivel 3, un Astillero espacial y un Radar terrestre de nivel 1, 50&nbsp;000 trabajadores y 125&nbsp;000 raciones de reserva.</p>
            <ol>
                <li><strong>Mina de Niobium</strong> — súbela de nivel: es tu primera fuente de materia prima.</li>
                <li><strong>Extractor de agua</strong> — indispensable para construir todo lo demás.</li>
                <li><strong>Campo agrícola</strong> — produce las raciones que alimentan a tus trabajadores.</li>
                <li><strong>Gran ciudad</strong> — +25&nbsp;000 trabajadores máximo (empiezas en el tope de 50&nbsp;000). Requiere la investigación <strong>Redefinición urbana</strong> nivel 1.</li>
                <li><strong>Mina de Niobium y Extractor de agua</strong> todavía más alto — aumenta la producción antes de seguir adelante.</li>
                <li><strong>Centro de investigación</strong> — aloja a tus científicos (250 por nivel). No es necesario para lanzar una investigación.</li>
                <li><strong>Astillero espacial</strong> — ya tienes uno; cada nivel acelera la producción de naves un 25&nbsp;%. Subirlo de nivel requiere la investigación <strong>Industria</strong> nivel 1.</li>
                <li><strong>Cuartel</strong> — +5&nbsp;000 Legionarios máximo por nivel (2&nbsp;000 sin cuartel). Requiere la investigación <strong>Crecimiento militar</strong> nivel 1.</li>
                <li><strong>Almacén de Niobium</strong>, <strong>Depósito de agua</strong>, <strong>Silo agrícola</strong> — evita que la producción se sature. Requieren la investigación <strong>Gestión de cargas</strong> nivel 1 (y <strong>Aeropónica</strong> para el Silo).</li>
                <li><strong>Metrópoli</strong> — +80&nbsp;000 trabajadores máximo por nivel. Requiere la investigación <strong>Redefinición urbana</strong> nivel 5.</li>
            </ol>
            <p>Costes, duraciones y espacio ocupado de cada edificio: consulta <a href="/wiki/buildings">Los edificios</a>.</p>

            <h2 id="file-attente">Una sola construcción a la vez</h2>
            <p>Cada planeta tiene <strong>una sola cola de construcción</strong>. Mientras un edificio sube de nivel, los demás tienen que esperar. Planifica en consecuencia.</p>
            <p>Varios planetas = varias colas en paralelo: por eso la colonización acelera tu progreso.</p>

            <h2 id="espace">El espacio disponible en un planeta</h2>
            <p>Cada planeta tiene un número limitado de <strong>espacios en el suelo</strong> y de <strong>espacios en el cielo</strong>. <strong>Cada nivel</strong> de edificio ocupa espacios, subida de nivel incluida: una Mina de Niobium ocupa 1 espacio en el suelo por nivel, una Gran ciudad 6, una Metrópoli 6 en el suelo y 6 en el cielo.</p>
            <ul>
                <li>Los espacios usados y disponibles se muestran en la tarjeta de cada planeta (página <strong>Planetas</strong>) y en la página <strong>Infraestructuras</strong>.</li>
                <li>El cielo lo usan la Metrópoli, la Granja aeropónica, el Astillero espacial, el Radar espacial y el Inhibidor de radar. Las defensas (torretas, escudos) no ocupan ningún espacio.</li>
                <li>Para ampliar un planeta: <strong>Ciudad flotante</strong> (+10 espacios en el suelo por nivel) y <strong>Estación orbital</strong> (+5 en el cielo por nivel), 5 de cada como máximo por planeta. Cuestan 2&nbsp;000 Puntos de Guerra × el nivel y se desbloquean con la investigación <strong>Expansión territorial</strong> (nivel 1 y luego 2), accesible tras Terraformación nivel 18.</li>
                <li>Sin espacio libre = ya no puedes construir ni subir de nivel nada en ese planeta.</li>
            </ul>

    first_fleet:
        title: "Crear tu primera flota"
        category: "beginner"
        order: 6
        tags: "flota,naves,primera,creación,principiante,astillero,cargo,sonda"
        summary: "Fabricar una nave, componer una flota y enviarla a su destino: paso a paso."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Lo que necesitas antes</h2>
            <ul>
                <li>Un <strong>Astillero espacial</strong> construido en tu planeta.</li>
                <li>Los recursos de la nave: casi siempre <strong>niobium</strong>, <strong>agua</strong> y <strong>trabajadores</strong> (tu planeta siempre guarda 5&nbsp;000 de reserva, intocables). Algunas naves piden también Puntos de Guerra, Bitcoins o Legionarios (consulta el artículo <em>Tipos de naves</em>).</li>
                <li>La <strong>investigación</strong> que desbloquea la nave. Ejemplo: los cargos requieren <em>Gestión de cargas</em> (nivel 1 para el Cargo I), a la que se accede con <em>Naves utilitarias</em> nivel 2. La Sonda, en cambio, no requiere ninguna investigación.</li>
            </ul>

            <h2 id="fabriquer">Paso 1 — Fabricar naves</h2>
            <p>Ve a la página <strong>Astillero espacial</strong> (menú de la izquierda), pestaña <strong>Construcción de naves</strong>. Elige una nave, indica una cantidad y haz clic en <strong>Construir</strong>. Una nave todavía bloqueada indica la investigación o el edificio que le falta.</p>
            <p>La fabricación lleva tiempo: puedes seguir jugando mientras tanto.</p>

            <h2 id="composer">Paso 2 — Componer y enviar una flota</h2>
            <ol>
                <li>En la página <strong>Flotas</strong>, haz clic en <strong>Crear una nueva flota</strong>, elige las naves que quieres embarcar (se muestra el stock en tierra) y ponle nombre a la flota (12 caracteres como máximo).</li>
                <li>Haz clic en el nombre de la flota para abrir su página. La pestaña <strong>Carga</strong> sirve para cargar recursos cuando la flota se encuentra en uno de tus planetas.</li>
                <li>Envíala:
                    <ul>
                        <li>para un simple desplazamiento (misión <strong>Normal</strong>) o un espionaje, pestaña <strong>Mover la flota</strong>: introduce el destino en los campos galaxia, sistema y planeta (por ej. <code>1:5:12</code>) o elige uno de «Mis planetas», comprueba el coste y la duración estimados y haz clic en <strong>Enviar</strong>;</li>
                        <li>para las demás misiones (Descargar y volver, Colonizar, Saquear, Invadir…), pasa por el <strong>Mapa espacial</strong>: haz clic en la casilla objetivo, luego en <strong>Interacción</strong>, elige la flota y la misión, y haz clic en <strong>Enviar</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>El combustible se paga en <strong>Bitcoins</strong>, en la salida (consulta el artículo <em>Desplazamiento y distancia</em>). Las misiones se detallan en el artículo <em>Tipos de misiones</em>.</p>

            <h2 id="premiers-vaisseaux">Las mejores naves para empezar</h2>
            <ul>
                <li><strong>Cargo I</strong> — transporte de recursos (3&nbsp;000 de capacidad). La nave ideal para vender a los comerciantes.</li>
                <li><strong>Sonda</strong> — espía los planetas rivales. Envíala <em>antes</em> de cualquier ataque.</li>
                <li><strong>Cazador</strong> — primera nave de combate, barata (25 niobium, 5 agua y 1 trabajador).</li>
                <li><strong>Reciclador</strong> — recoge los escombros tras un combate. Muy rentable, pero lento: añadido a una flota de cazadores, triplica su duración de vuelo.</li>
            </ul>

            <h2 id="premiere-cible">Idea de primera misión</h2>
            <p>Llena 1 cargo de niobium o de agua y envíalo desde el <strong>Mapa espacial</strong> en misión <strong>Descargar y volver</strong> hacia un comerciante. Los comerciantes se encuentran en 20 sectores fijos de cada galaxia (las cuatro esquinas 1, 10, 91 y 100, luego 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 y, en el centro, 45, 46, 55 y 56), en una posición que cambia de un sector a otro: localízalos en el mapa.</p>
            <p>El comerciante te paga en Bitcoins y el cargo vuelve solo. La ida cuesta el doble que un trayecto normal y la vuelta se paga en su salida, a tarifa normal: para un solo Cargo I, cuenta de 0 a 2 Bitcoins a la ida y 0 o 1 a la vuelta.</p>

    first_combat:
        title: "Tu primer combate"
        category: "beginner"
        order: 7
        tags: "combate,primero,ataque,informe,principiante,rondas"
        summary: "Cómo desencadenar un combate espacial, qué ocurre durante él y qué hacer después."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Prepararse (¡importante!)</h2>
            <ol>
                <li><strong>Envía una sonda</strong> al objetivo para evaluar sus defensas. Perder 10 cazadores a ciegas es asumible; perder 100 duele.</li>
                <li><strong>Compón una flota adecuada</strong>: suficiente potencia de fuego, y piensa en añadir un <strong>reciclador</strong> para recoger los escombros.</li>
                <li><strong>Comprueba tu mantenimiento</strong>: cada día, una nave cuesta su firma ÷ 2 en Bitcoins mientras esté en una flota (en vuelo o estacionada), frente a su firma ÷ 12 en tierra. Vuelve a poner en tierra lo que no uses.</li>
            </ol>

            <h2 id="enchainement">Lo que ocurre paso a paso</h2>
            <ol>
                <li><strong>Activas el modo ataque</strong> de tu flota (casilla «modo ataque» de la gestión de flota; hacen falta armas de nave) y luego la envías en misión <em>Normal</em> a las coordenadas de un enemigo. El combustible se paga en Bitcoins en la salida.</li>
                <li><strong>Viaja</strong> — el tiempo de trayecto se muestra en la página Flotas. Durante los <strong>2 minutos</strong> siguientes a la salida, el botón «Cancelar» la devuelve enseguida a su planeta de origen (el combustible pagado no se reembolsa); pasado ese plazo, llegará hasta el final.</li>
                <li><strong>Llegada</strong>: si hay flotas enemigas en el lugar, el combate se programa <strong>5 minutos</strong> más tarde. Durante ese plazo, nadie puede cambiar el modo ataque de sus flotas.</li>
                <li><strong>Combate por rondas</strong>: los dos bandos intercambian una salva por ronda, 100 rondas como máximo. Cada salva choca primero con el escudo adversario, pero una parte siempre lo atraviesa.</li>
                <li><strong>Fin del combate</strong>: un bando es eliminado, o se alcanzan las 100 rondas. En ese caso, gana el bando que conserva <strong>más armadura</strong> (en caso de empate perfecto, gana el atacante).</li>
            </ol>

            <h2 id="apres-combat">Después del combate</h2>
            <ul>
                <li>Se te envía un <strong>informe de combate</strong>: menú <strong>Informe</strong>, pestaña <strong>Combates</strong>.</li>
                <li>Las naves destruidas dejan <strong>escombros</strong> en el lugar. ¡Envía recicladores!</li>
                <li>El vencedor gana <strong>Puntos de Guerra (PDG)</strong> según la flota enemiga destruida; el vencido recibe un pequeño consuelo (consulta <em>Combate espacial</em>).</li>
                <li>Tu flota superviviente <strong>se queda en órbita</strong> en el lugar del combate: reenvíala tú mismo. Si cuenta con recicladores con espacio en la bodega, empiezan enseguida a recoger los escombros.</li>
            </ul>

            <h2 id="erreurs">Los errores clásicos que debes evitar</h2>
            <ul>
                <li>Atacar sin sondear primero.</li>
                <li>Olvidar que las rondas se detienen en 100: un objetivo demasiado sólido al que no logras dañar lo suficiente conserva más armadura que tú y gana.</li>
                <li>No enviar un reciclador: tus adversarios recuperarán <em>tus</em> escombros antes que tú.</li>
            </ul>

    tips:
        title: "Consejos para empezar bien"
        category: "beginner"
        order: 8
        tags: "consejos,trucos,estrategia,principiante"
        summary: "15 consejos que marcan la diferencia en tus primeros días."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Economía</h2>
            <ul>
                <li><strong>Maximiza tus trabajadores</strong>: son tu fuente principal de Bitcoins.</li>
                <li><strong>No construyas demasiado pronto</strong> un gran ejército: te arruinará en mantenimiento.</li>
                <li><strong>Investiga Redefinición urbana y luego construye Grandes ciudades y Metrópolis</strong> para aumentar la población.</li>
                <li><strong>Vigila tu informe diario</strong>: si tus costes superan tus ingresos, reacciona de inmediato.</li>
                <li><strong>Vende tus excedentes a los comerciantes</strong> en lugar de dejar que el almacenamiento se sature.</li>
            </ul>

            <h2 id="militaire">Militar</h2>
            <ul>
                <li><strong>Siempre una defensa en cada planeta</strong>: Legionarios en el cuartel, Mechas, una o dos torretas.</li>
                <li><strong>Personaliza tus naves cada día</strong>: puedes gastar hasta 40 puntos de mejora al día (casco, escudo, armas, precisión), tomados del crédito propio de cada tipo de nave.</li>
                <li><strong>Los recicladores son muy rentables</strong>: tras cada combate, recupera los escombros. Añade cargos a la flota: un reciclador solo transporta 1&nbsp;000 recursos.</li>
                <li><strong>Sondea antes de atacar</strong>: una sonda cuesta solo 1&nbsp;000 niobium (tienes 10 al principio), una flota perdida sale cara. Ten en cuenta que el objetivo es avisado del espionaje.</li>
                <li><strong>Cuidado con el tope de 100 rondas</strong>: si ningún bando es destruido al cabo de 100 turnos, gana el que conserva más armadura (el atacante en caso de empate perfecto).</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Únete pronto a una alianza</strong>: +20&nbsp;% de producción de niobium, agua y raciones, acceso a la diplomacia y a las investigaciones de alianza.</li>
                <li><strong>Completa tus misiones diarias</strong> (página <em>Objetivos</em>): cada una aporta puntos de guerra (PDG), y completarlas todas te aporta además su recompensa media en el informe siguiente.</li>
                <li><strong>Conversa en la sala de alianza</strong>: coordinar dos ataques vale más que intentar uno solo.</li>
                <li><strong>Conéctate cada día</strong>: el bono de conexión se dispara con la racha de 7 días consecutivos.</li>
                <li><strong>Activa las notificaciones push</strong>: sabrás en cuanto una flota enemiga se lance sobre ti.</li>
            </ul>

    resources:
        title: "Recursos en detalle"
        category: "economy"
        order: 1
        tags: "recursos,niobium,agua,comida,uranium,producción,almacenamiento,ciclo,raciones"
        summary: "Todo sobre los recursos: producción, bonus, almacenamiento y el caso especial del uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Recordatorio: los 4 recursos</h2>
            <ul>
                <li><strong>Niobium</strong> — construcción (edificios, naves, defensas).</li>
                <li><strong>Agua</strong> — construcción (edificios, naves, defensas). El combustible de las flotas, en cambio, se paga en Bitcoins.</li>
                <li><strong>Comida</strong> («Raciones» en el juego) — la comen tus trabajadores, y solo ellos: 1 ración por hora por cada 500 trabajadores. Una hambruna mata también a Legionarios y Mechas.</li>
                <li><strong>Uranium</strong> — Base nuclear, bombas nucleares, interceptores, apuestas de arena. Escaso y valioso.</li>
            </ul>

            <h2 id="production">Cómo se calcula la producción</h2>
            <p>La producción se expresa por tramos de <strong>10 minutos</strong> (el ciclo de producción de un planeta) y se acredita en proporción al tiempo transcurrido. Depende:</p>
            <ul>
                <li>del <strong>nivel</strong> del edificio productor: por nivel y por 10 minutos, Mina de Niobium 33 niobium, Extractor de agua 22 agua, Campo agrícola 27 raciones, Granja aeropónica 37 raciones;</li>
                <li>de tus <strong>bonus</strong> (alianza, investigación «Ley Macron», mejoras de alianza, héroes, Campo de esclavos).</li>
            </ul>
            <p>Ejemplo: un Extractor de agua de nivel 8 produce 8 × 22 = 176 agua cada 10 minutos, es decir, 1&nbsp;056 por hora; en una alianza (+20&nbsp;%), 1&nbsp;267 por hora. El tamaño del planeta no cambia lo que produce un nivel: solo limita el número de niveles que puedes construir.</p>
            <p>Las <strong>lunas</strong> producen comida <strong>10 veces más rápido</strong> (ciclo de 1 minuto).</p>
            <p>Incluso <strong>sin edificio productor</strong> — o si lo destruyes hasta el nivel 0 — un planeta conserva una <strong>producción base mínima</strong>: <strong>7 niobium, 6 agua y 9 raciones</strong> por ciclo (20 raciones en tu planeta inicial). Desde el nivel 1, la producción del edificio sustituye a ese mínimo: no se suma a él.</p>
            <p>Para la comida, el <strong>Campo agrícola</strong> y la <strong>Granja aeropónica</strong> <strong>se suman</strong>: sus producciones se acumulan.</p>

            <h2 id="bonus">Lo que aumenta tu producción</h2>
            <table>
                <thead>
                    <tr><th>Fuente</th><th>Efecto</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pertenencia a una alianza</td><td>+20&nbsp;% en niobium, agua y raciones</td></tr>
                    <tr><td>Investigación de alianza «Ley Macron» (Balanza de los Mundos)</td><td>+7&nbsp;% por nivel, hasta el nivel 5</td></tr>
                    <tr><td>Mejoras de alianza «Producción de niobio», «Producción de agua», «Producción de raciones»</td><td>+2&nbsp;% por nivel, hasta +10&nbsp;%</td></tr>
                    <tr><td>Héroe destinado en el planeta</td><td>Bonus derivado de su Inteligencia, doblado si es un héroe de Economía; +20&nbsp;% más con el rasgo «Magnate» (héroe de Economía nivel 15)</td></tr>
                    <tr><td>Campo de esclavos</td><td>+2,5&nbsp;% por nivel, más un 1&nbsp;% por nivel de cada prisionero retenido (limitado a un 5&nbsp;% por nivel del campo)</td></tr>
                    <tr><td>Veredicto de un bloqueo Cthulhu</td><td>De +15&nbsp;% a −15&nbsp;% para los miembros de una alianza, durante un tiempo limitado</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">El almacenamiento y sus trampas</h2>
            <p>Tu planeta tiene una <strong>capacidad máxima</strong> para cada recurso. Cuando está lleno, la producción continúa pero lo que sobra se pierde.</p>
            <p>Soluciones: construir <strong>Almacenes de Niobium</strong>, <strong>Depósitos de agua</strong> y <strong>Silos agrícolas</strong>, vender el excedente de niobium y agua a los comerciantes (las raciones, en cambio, no se venden), o enviar los excedentes a otro jugador.</p>

            <p>La comida se transporta como el niobium y el agua: carga <strong>raciones</strong> en la bodega de una flota (1 plaza por ración) para abastecer a otro planeta. Al descargar, el granero nunca supera su capacidad: el excedente se queda en la bodega.</p>

            <h2 id="uranium">El uranium: el caso especial</h2>
            <p>Ningún edificio produce uranium. Lo obtienes:</p>
            <ul>
                <li><strong>reciclando</strong> escombros de uranium en el mapa (identificados por su icono especial);</li>
                <li><strong>derrotando a los Cthulhu</strong> (misiones PvE);</li>
                <li><strong>ganando desafíos de arena</strong> con apuesta de uranium.</li>
            </ul>
            <p>El uranium sirve para construir la <strong>Base nuclear</strong> (500 por nivel), fabricar <strong>bombas nucleares</strong> (500 cada una) e <strong>interceptores</strong> (200 cada uno), y apostar en la <strong>arena</strong>. No tiene límite de almacenamiento, se transporta en la bodega como los demás recursos y se revende a <strong>2&nbsp;000 Bitcoins la unidad</strong> a los comerciantes.</p>

    buildings:
        title: "Los edificios"
        category: "economy"
        order: 2
        tags: "edificios,construcción,coste,mina,extractor,campo agrícola,gran ciudad,metrópoli,astillero,fuerte defensivo,búnker,ciudad flotante,estación orbital"
        summary: "Catálogo completo de los edificios por función, con sus costes, su duración y el espacio que ocupan."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Producción de recursos</h2>
            <p>Los nombres que aparecen a continuación son los que se muestran en la página <strong>Infraestructuras</strong>. Cada nivel ocupa espacios en el suelo o en el cielo (consulta la sección «Coste de los edificios» más abajo), y muchos edificios requieren una investigación previa.</p>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Produce</th><th>Observación</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de Niobium</td><td>Niobium</td><td>33 niobium por nivel y cada 10 minutos.</td></tr>
                    <tr><td>Extractor de agua</td><td>Agua</td><td>22 agua por nivel y cada 10 minutos.</td></tr>
                    <tr><td>Campo agrícola</td><td>Raciones</td><td>27 raciones por nivel y cada 10 minutos. 1 espacio en el suelo por nivel.</td></tr>
                    <tr><td>Granja aeropónica</td><td>Raciones</td><td>37 raciones por nivel y cada 10 minutos, pero 1 espacio <strong>en el cielo</strong> por nivel (ninguno en el suelo). Requiere la investigación Aeropónica. Su producción se suma a la del Campo agrícola.</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Almacenamiento</h2>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td>Almacén de Niobium</td><td>+1&nbsp;200&nbsp;000 niobium almacenables por nivel. Investigación Gestión de cargas 1.</td></tr>
                    <tr><td>Depósito de agua</td><td>+800&nbsp;000 agua almacenable por nivel. Investigación Gestión de cargas 1.</td></tr>
                    <tr><td>Silo agrícola</td><td>+800&nbsp;000 raciones almacenables por nivel. Investigaciones Gestión de cargas 1 y Aeropónica.</td></tr>
                </tbody>
            </table>
            <p>Sin estos edificios, un planeta almacena 200&nbsp;000 niobium, 180&nbsp;000 agua y 150&nbsp;000 raciones.</p>

            <h2 id="population">Población y ciencia</h2>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td>Gran ciudad</td><td>+25&nbsp;000 trabajadores máximo y unos +8&nbsp;000 trabajadores al día, por nivel. Investigación Redefinición urbana 1.</td></tr>
                    <tr><td>Metrópoli</td><td>+80&nbsp;000 trabajadores máximo y unos +12&nbsp;000 trabajadores al día, por nivel. Investigación Redefinición urbana 5.</td></tr>
                    <tr><td>Centro de investigación</td><td>+250 científicos máximo por nivel. Indispensable para reclutar científicos; inútil para lanzar una investigación.</td></tr>
                </tbody>
            </table>

            <h2 id="militaire">Militar y producción de naves</h2>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cuartel</td><td>+5&nbsp;000 Legionarios máximo por nivel (2&nbsp;000 sin cuartel). Investigación Crecimiento militar 1.</td></tr>
                    <tr><td>Fuerte defensivo</td><td>+15&nbsp;000 Legionarios máximo por nivel, y <strong>protege de los saqueos</strong> un 5&nbsp;% de tu capacidad de almacenamiento de niobium y agua (y un 5&nbsp;% de tu uranium) por nivel. Necesario para los Mechas. Investigación Crecimiento militar 3.</td></tr>
                    <tr><td>Base nuclear</td><td>Cada nivel permite almacenar 1 bomba nuclear y 4 interceptores (se requiere la investigación Armamento 5 para fabricarlos). Cuesta 100&nbsp;000 niobium y 500 uranium por nivel.</td></tr>
                    <tr><td>Astillero espacial</td><td>Fabrica las naves utilitarias (cargo, sonda, reciclador…) y acelera la producción de todas las naves (+25&nbsp;% por nivel). Investigación Industria 1.</td></tr>
                    <tr><td>Fábrica de armamento</td><td>Fabrica las naves ligeras (cazadores pesados, corbetas…) y acelera la producción de naves <strong>y de defensas</strong> un 40&nbsp;%. Un solo nivel por planeta. Investigación Naves ligeras 1.</td></tr>
                    <tr><td>Industria pesada</td><td>Fabrica las naves pesadas (fragatas, cruceros, acorazados, destructores) y acelera la producción de naves <strong>y de defensas</strong> un 60&nbsp;%. Un solo nivel por planeta. Investigación Naves pesadas 1.</td></tr>
                    <tr><td>Prisión</td><td>Encierra a los héroes capturados. Investigación Sistema carcelario.</td></tr>
                    <tr><td>Campo de esclavos</td><td>Por nivel: +2,5&nbsp;% de producción de recursos, +2&nbsp;500 trabajadores máximo, −1,5&nbsp;% de duración de construcción; cada prisionero retenido añade un 1&nbsp;% de producción por nivel del prisionero. Investigación Sistema carcelario.</td></tr>
                </tbody>
            </table>

            <h2 id="orbital">Ampliar el planeta y defensas orbitales</h2>
            <table>
                <thead>
                    <tr><th>Edificio / Instalación</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ciudad flotante</td><td>+10 espacios en el suelo por nivel (5 como máximo por planeta). Cuesta 2&nbsp;000 Puntos de Guerra × el nivel. Investigación Expansión territorial 1.</td></tr>
                    <tr><td>Estación orbital</td><td>+5 espacios en el cielo por nivel (5 como máximo por planeta). Cuesta 2&nbsp;000 Puntos de Guerra × el nivel. Investigación Expansión territorial 2.</td></tr>
                    <tr><td>Base espacial</td><td>Aporta un bonus de armadura a las defensas orbitales.</td></tr>
                    <tr><td>Escudo / Gran escudo</td><td>Absorbe los daños antes de que se golpee a las defensas.</td></tr>
                    <tr><td>Torretas (misil, láser, Gauss, plasma…)</td><td>Defienden tu planeta contra las flotas en modo ataque.</td></tr>
                </tbody>
            </table>
            <p>Las defensas (torretas, escudos) no ocupan ningún espacio.</p>

            <h2 id="detection">Detección e interferencia</h2>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar terrestre</td><td>Detecta las flotas que se acercan (+1 de potencia de radar por nivel). Investigación Escáner de sistema 1.</td></tr>
                    <tr><td>Radar espacial</td><td>Mismo aporte que un Radar terrestre (+1 de potencia de radar por nivel), pero ocupa espacios en el cielo en lugar del suelo. Investigación Escáner de sistema 3.</td></tr>
                    <tr><td>Inhibidor de radar</td><td>Interfiere la detección enemiga de tus movimientos. Investigación Escáner de sistema 5.</td></tr>
                </tbody>
            </table>

            <h2 id="couts">Coste de los edificios</h2>
            <p>El coste y la duración de un nivel son <strong>proporcionales al nivel objetivo</strong>: el nivel N cuesta N veces el coste base y dura N veces la duración base. Ejemplo: una Mina de Niobium de nivel 4 cuesta 4 × 45 = 180 niobium y 4 × 20 = 80 agua, en 4 × 3 = 12 minutos. Si ya hay un nivel del mismo edificio en la cola, el siguiente se factura al nivel siguiente.</p>
            <p>Valores base (nivel 1). «Espacio» = espacios ocupados en el suelo / en el cielo por nivel.</p>

            <h3>Recursos y almacenamiento</h3>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Niobium / agua</th><th>Duración</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de Niobium</td><td>45 / 20</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Extractor de agua</td><td>20 / 50</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Campo agrícola</td><td>60 / 90</td><td>5 min</td><td>1 / 0</td></tr>
                    <tr><td>Granja aeropónica</td><td>650 / 100</td><td>5 min 50 s</td><td>0 / 1</td></tr>
                    <tr><td>Almacén de Niobium</td><td>11&nbsp;000 / 6&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Depósito de agua</td><td>8&nbsp;000 / 9&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Silo agrícola</td><td>12&nbsp;000 / 20&nbsp;000</td><td>50 min</td><td>4 / 0</td></tr>
                </tbody>
            </table>

            <h3>Población y ciencia</h3>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Niobium / agua</th><th>Duración</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>Gran ciudad</td><td>1&nbsp;500 / 1&nbsp;100</td><td>12 min</td><td>6 / 0</td></tr>
                    <tr><td>Metrópoli</td><td>7&nbsp;500 / 5&nbsp;500</td><td>46 min 40 s</td><td>6 / 6</td></tr>
                    <tr><td>Centro de investigación</td><td>285 / 360</td><td>15 min</td><td>5 / 0</td></tr>
                </tbody>
            </table>
            <p>Ejemplo: una Metrópoli de nivel 3 cuesta 22&nbsp;500 niobium y 16&nbsp;500 agua, en 2 h 20 min.</p>

            <h3>Militar y naves</h3>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Niobium / agua</th><th>Duración</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cuartel</td><td>1&nbsp;300 / 1&nbsp;900</td><td>35 min</td><td>6 / 0</td></tr>
                    <tr><td>Fuerte defensivo</td><td>20&nbsp;000 / 19&nbsp;000</td><td>1 h 12 min</td><td>10 / 0</td></tr>
                    <tr><td>Base nuclear</td><td>100&nbsp;000 / 0 (+ 500 uranium)</td><td>1 h 12 min</td><td>2 / 0</td></tr>
                    <tr><td>Prisión</td><td>3&nbsp;000 / 3&nbsp;500</td><td>50 min</td><td>5 / 0</td></tr>
                    <tr><td>Campo de esclavos</td><td>2&nbsp;000 / 2&nbsp;500</td><td>40 min</td><td>4 / 0</td></tr>
                    <tr><td>Astillero espacial</td><td>300 / 200</td><td>3 min</td><td>2 / 1</td></tr>
                    <tr><td>Fábrica de armamento (1 nivel)</td><td>700 / 390</td><td>36 min</td><td>6 / 0</td></tr>
                    <tr><td>Industria pesada (1 nivel)</td><td>8&nbsp;300 / 6&nbsp;800</td><td>2 h</td><td>12 / 0</td></tr>
                </tbody>
            </table>

            <h3>Detección y ampliación</h3>
            <table>
                <thead>
                    <tr><th>Edificio</th><th>Coste (niobium / agua)</th><th>Duración</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar terrestre</td><td>120 / 65</td><td>3 min 40 s</td><td>2 / 0</td></tr>
                    <tr><td>Radar espacial</td><td>2&nbsp;000 / 1&nbsp;720</td><td>24 min</td><td>0 / 2</td></tr>
                    <tr><td>Inhibidor de radar</td><td>5&nbsp;100 / 3&nbsp;210</td><td>54 min</td><td>0 / 4</td></tr>
                    <tr><td>Ciudad flotante (5 máx.)</td><td>2&nbsp;000 Puntos de Guerra</td><td>24 min</td><td>añade 10 en el suelo</td></tr>
                    <tr><td>Estación orbital (5 máx.)</td><td>2&nbsp;000 Puntos de Guerra</td><td>24 min</td><td>añade 5 en el cielo</td></tr>
                </tbody>
            </table>
            <p>La mejora de alianza «Coste de construcción» reduce el coste en niobium, agua y uranium (−1&nbsp;% por nivel, hasta −5&nbsp;%), y cada nivel de Campo de esclavos reduce la duración un 1,5&nbsp;%. El mantenimiento diario de cada edificio se detalla en <a href="/wiki/bitcoin_economy#bareme">Bitcoins y mantenimiento</a>.</p>

            <h2 id="file-production">Gestionar la cola de producción</h2>
            <p>Las construcciones de edificios, de naves (Astillero espacial) y de defensas pasan por una <strong>cola de espera</strong> que puedes gestionar:</p>
            <ul>
                <li><strong>Reorganizar</strong> el orden de los elementos en espera (arrastrar y soltar) para priorizar lo que importa.</li>
                <li><strong>Cancelar</strong> un elemento en espera: se te <strong>reembolsa en proporción</strong> a lo que aún no se ha producido (un edificio en espera se reembolsa por completo).</li>
                <li>El coste de un edificio se cobra en cuanto se añade a la cola.</li>
                <li>La cola en curso se muestra en la parte superior de cada página de producción, bajo el título.</li>
                <li>La cola está limitada a <strong>15 elementos en espera</strong> (sin contar la construcción en curso): más allá, un mensaje te indica que esperes a que termine una construcción o que canceles una antes de añadir una nueva.</li>
                <li>La <strong>Ciudad flotante</strong> (+10&nbsp;suelo/nivel) y la <strong>Estación orbital</strong> (+5&nbsp;cielo/nivel) están limitadas a <strong>5 ejemplares por planeta</strong> cada una.</li>
            </ul>

    research:
        title: "Investigación y tecnologías"
        category: "economy"
        order: 3
        tags: "investigación,tecnología,ciencia,bitcoin,desbloqueo,árbol tecnológico,terraformación,coste"
        summary: "Las tecnologías que desbloquean naves, bonus y nuevas capacidades. Cómo priorizar."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="fonctionnement">Cómo funciona</h2>
            <p>Las investigaciones se lanzan desde la página <strong>Investigaciones</strong> (no hace falta ningún edificio). Cada investigación:</p>
            <ul>
                <li>cuesta <strong>Bitcoins</strong> (solo Expansión territorial se paga en Puntos de Guerra): el nivel N cuesta N veces el coste base;</li>
                <li>lleva <strong>tiempo</strong>, también proporcional al nivel: de unos minutos a más de un día;</li>
                <li>puede tener un <strong>requisito previo</strong> (otra investigación a cierto nivel).</li>
            </ul>
            <p>Ejemplo: Terraformación nivel 2 cuesta 2 × 12&nbsp;000 = 24&nbsp;000 Bitcoins y dura 2 × 1 h 10 min = 2 h 20 min a velocidad base. La mejora de alianza «Coste de investigación» reduce el precio un 1&nbsp;% por nivel (hasta −5&nbsp;%).</p>
            <p>Puedes programar varias investigaciones seguidas: el coste se cobra al añadirlas a la cola, y se reembolsa íntegramente si cancelas.</p>
            <p>La duración de una investigación se fija <strong>en el momento en que la lanzas o la pones en cola</strong>: duración base × nivel ÷ tu <strong>velocidad de investigación</strong> (1 al principio). Lo que hace variar esa velocidad (científicos, investigación de alianza «Movilización científica») se explica en <a href="/wiki/workers_scientists">Trabajadores y científicos</a>. La mejora de alianza «Velocidad de investigación» acorta la duración mostrada en la página Investigaciones, pero no la duración real: una vez lanzada, la investigación termina a la hora calculada sin ella.</p>

            <h2 id="priorite-debutant">Prioridades para un principiante</h2>
            <ol>
                <li><strong>Naves utilitarias</strong> — abre Terraformación (nivel 1), Gestión de cargas (nivel 2), Invasión planetaria y Reciclaje orbital (nivel 3).</li>
                <li><strong>Terraformación</strong> — la Nave de colonización y un planeta más por nivel.</li>
                <li><strong>Gestión de cargas</strong> — los cargos y los edificios de almacenamiento.</li>
                <li><strong>Redefinición urbana</strong> — Gran ciudad y luego Metrópoli: más trabajadores, por tanto más Bitcoins.</li>
                <li><strong>Industria</strong> — para ampliar el Astillero espacial y abrir las naves ligeras (nivel 3) y pesadas (nivel 5).</li>
                <li><strong>Invasión planetaria</strong> y <strong>Reciclaje orbital</strong> — indispensables para invadir y reciclar.</li>
                <li><strong>Armamento</strong> y luego <strong>Arma misil</strong> — tus primeras naves de combate (Cazador).</li>
            </ol>

            <h2 id="recherches">Lista completa de investigaciones</h2>
            <p>Las investigaciones están organizadas como en la página Investigaciones. Coste y duración indicados para el nivel 1, a velocidad base: el nivel N cuesta y dura N veces más. El nivel máximo se indica entre paréntesis.</p>

            <h3>Exploración</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Lo que aporta</th><th>Requisitos</th><th>Nivel 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Naves utilitarias (3)</td><td>Niv. 1: Terraformación. Niv. 2: Gestión de cargas. Niv. 3: Invasión planetaria, Reciclaje orbital y Nave nodriza.</td><td>—</td><td>2&nbsp;500; 3 min 20 s</td></tr>
                    <tr><td>Terraformación (18)</td><td><strong>+1 planeta poseíble por nivel</strong> (2 + nivel en total, más los bonus de régimen político). Niv. 1: Nave de colonización. Niv. 15: Lunar.</td><td>Naves utilitarias 1</td><td>12&nbsp;000; 1 h 10 min</td></tr>
                    <tr><td>Gestión de cargas (5)</td><td>Cargo I (niv. 1), Cargo V (niv. 3), Cargo X (niv. 5). Niv. 1: Almacén de Niobium, Depósito de agua, Silo agrícola (con Aeropónica).</td><td>Naves utilitarias 2</td><td>3&nbsp;500; 6 min 40 s</td></tr>
                    <tr><td>Invasión planetaria (1)</td><td>Barcaza de invasión.</td><td>Naves utilitarias 3</td><td>35&nbsp;000; 4 min 40 s</td></tr>
                    <tr><td>Reciclaje orbital (1)</td><td>Reciclador.</td><td>Naves utilitarias 3</td><td>16&nbsp;900; 6 min 40 s</td></tr>
                    <tr><td>Escáner de sistema (5)</td><td>Radar terrestre (niv. 1), Radar espacial y nave radar (niv. 3), Inhibidor de radar y nave inhibidora (niv. 5).</td><td>—</td><td>2&nbsp;300; 5 min</td></tr>
                    <tr><td>Espionaje (999)</td><td>Una sonda solo aporta información si tu nivel de Espionaje es al menos igual al del propietario del planeta sondeado.</td><td>Escáner de sistema 5</td><td>20&nbsp;000; 1 h</td></tr>
                    <tr><td>Tecnología hiperespacial (1)</td><td>Viajar a otras galaxias.</td><td>—</td><td>25&nbsp;000&nbsp;000; 25 h</td></tr>
                </tbody>
            </table>

            <h3>Planetarias</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Lo que aporta</th><th>Requisitos</th><th>Nivel 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Aeropónica (1)</td><td>Granja aeropónica; Silo agrícola (con Gestión de cargas 1).</td><td>—</td><td>16&nbsp;000; 8 min</td></tr>
                    <tr><td>Redefinición urbana (5)</td><td>Gran ciudad (niv. 1), Metrópoli (niv. 5).</td><td>—</td><td>8&nbsp;000; 8 min</td></tr>
                    <tr><td>Crecimiento militar (3)</td><td>Cuartel (niv. 1), Fuerte defensivo (niv. 3).</td><td>Redefinición urbana 1</td><td>11&nbsp;700; 15 min 30 s</td></tr>
                    <tr><td>Alambradas (5)</td><td>+5&nbsp;% de potencia de tus Legionarios en defensa terrestre, por nivel.</td><td>Crecimiento militar 3</td><td>200&nbsp;000; 20 min</td></tr>
                    <tr><td>Sistema carcelario (1)</td><td>Prisión y Campo de esclavos.</td><td>Alambradas 5</td><td>350&nbsp;000; 1 h</td></tr>
                    <tr><td>Unidades blindadas (1)</td><td>Mechas.</td><td>Crecimiento militar 3</td><td>40&nbsp;000; 33 min 20 s</td></tr>
                    <tr><td>Expansión territorial (2)</td><td>Ciudad flotante (niv. 1), Estación orbital (niv. 2): más espacio en tus planetas.</td><td>Terraformación 18</td><td>75&nbsp;000 Puntos de Guerra; 1 h 40 min</td></tr>
                </tbody>
            </table>

            <h3>Armas</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Lo que aporta</th><th>Requisitos</th><th>Nivel 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Armamento (5)</td><td>Arma misil (niv. 1), Arma láser (niv. 3), Arma de plasma (niv. 5). El nivel 5 también es necesario para las bombas nucleares y los interceptores.</td><td>—</td><td>2&nbsp;000; 6 min 10 s</td></tr>
                    <tr><td>Arma misil (3)</td><td>Cazador (niv. 1), Cazador pesado (niv. 2); el nivel 3 lo exigen todas las naves de combate más grandes.</td><td>Armamento 1</td><td>2&nbsp;600; 7 min 30 s</td></tr>
                    <tr><td>Arma láser (3)</td><td>Fragata y Corbeta láser (niv. 1); los niveles superiores los exigen los cruceros, acorazados y destructores.</td><td>Armamento 3</td><td>13&nbsp;000; 30 min</td></tr>
                    <tr><td>Arma de plasma (3)</td><td>Fragata de plasma (niv. 1), Crucero (niv. 2), Acorazado y Destructor (niv. 3).</td><td>Armamento 5</td><td>29&nbsp;000; 1 h 18 min</td></tr>
                </tbody>
            </table>

            <h3>Investigaciones espaciales</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Lo que aporta</th><th>Requisitos</th><th>Nivel 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Industria (5)</td><td>Astillero espacial y Cazador (niv. 1), Naves ligeras (niv. 3), Naves pesadas (niv. 5).</td><td>—</td><td>1&nbsp;500; 2 min 30 s</td></tr>
                    <tr><td>Naves ligeras (3)</td><td>Fábrica de armamento (niv. 1), Corbeta (niv. 2), Corbeta láser (niv. 3).</td><td>Industria 3</td><td>9&nbsp;000; 14 min 20 s</td></tr>
                    <tr><td>Naves pesadas (3)</td><td>Industria pesada (niv. 1), Acorazado (niv. 2), Destructor (niv. 3).</td><td>Industria 5</td><td>42&nbsp;000; 20 min</td></tr>
                </tbody>
            </table>
            <p>Las naves también requieren su edificio (Astillero espacial, Fábrica de armamento o Industria pesada): consulta <a href="/wiki/ship_types">Tipos de naves</a>.</p>

            <h3>Políticas</h3>
            <p>Como miembro de una alianza, accedes también a 7 <strong>investigaciones políticas</strong> que dependen del régimen de tu alianza y de su nivel — por ejemplo «Ley Macron» (producción) o «Movilización científica» (velocidad de investigación) para la Balanza de los Mundos. Se pagan con tus propios Bitcoins: consulta <a href="/wiki/alliance_research">Investigaciones de alianza</a>.</p>

            <h2 id="modes-speciaux">Modos de servidor con investigaciones máximas</h2>
            <p>En algunos modos (Battle Royale, Dominación, Search &amp; Destroy), todas tus investigaciones individuales empiezan en el <strong>nivel máximo</strong> y tu planeta inicial recibe 500 uranium. Solo te queda entonces hacer las investigaciones políticas de tu alianza.</p>

    workers_scientists:
        title: "Trabajadores y científicos"
        category: "economy"
        order: 4
        tags: "trabajadores,científicos,población,bitcoin,ingresos,hambruna,defensa,velocidad de investigación"
        summary: "Las dos poblaciones de tu imperio: los trabajadores que aportan los Bitcoins y los científicos que aumentan la velocidad de investigación."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Los trabajadores</h2>
            <p>Los trabajadores son tu <strong>fuente principal de Bitcoins</strong>. En el informe diario, cada trabajador presente en tus planetas aporta <strong>0,5 Bitcoin</strong>: 10&nbsp;000 trabajadores = 5&nbsp;000 Bitcoins al día, antes de los impuestos de alianza y de paz. Los trabajadores embarcados en una flota no aportan nada. No cuestan ningún mantenimiento en Bitcoins, solo comida.</p>
            <p>Su <strong>número máximo</strong> depende de tus edificios:</p>
            <ul>
                <li><strong>Gran ciudad</strong>: +25&nbsp;000 trabajadores máx. y unos +8&nbsp;000 trabajadores al día, por nivel.</li>
                <li><strong>Metrópoli</strong>: +80&nbsp;000 trabajadores máx. y unos +12&nbsp;000 trabajadores al día, por nivel.</li>
                <li><strong>Campo de esclavos</strong>: +2&nbsp;500 trabajadores máx. por nivel.</li>
            </ul>
            <p>Tu planeta inicial empieza en el tope (50&nbsp;000 trabajadores de 50&nbsp;000 máximo): construye una Gran ciudad para seguir creciendo.</p>
            <p>La población <strong>crece sola</strong> hasta el tope, al ritmo que dan tus Grandes ciudades y Metrópolis (+20&nbsp;% por nivel de la investigación de alianza «Política familiar», dos veces más lento bajo embargo). La comida no la hace crecer, pero si tus raciones caen a cero, el hambre mata a una parte de tus trabajadores.</p>

            <h2 id="scientifiques">Los científicos</h2>
            <p>Para reclutar científicos (página <strong>Defensa</strong>), hace falta un <strong>Centro de investigación</strong> en el planeta: cada nivel aloja a 250 científicos. Cada uno cuesta <strong>25 Bitcoins y 10 trabajadores</strong> al reclutarlo, y luego <strong>3 Bitcoins al día</strong> de mantenimiento (30 veces un Legionario en tierra). La investigación de alianza «Entusiasmo científico» reduce ese mantenimiento.</p>
            <p>Los científicos sirven para aumentar tu <strong>velocidad de investigación</strong>. Vale 1 al principio, y la duración de una investigación se divide por esa velocidad (velocidad 2 = investigaciones el doble de rápidas). Cómo evoluciona:</p>
            <ul>
                <li>Progresa por <strong>tramos enteros</strong>. Los científicos llegan a medida que se forman, y una llegada solo hace ganar un tramo si cuenta con <strong>al menos 5&nbsp;000 científicos a la vez</strong>. Las llegadas más pequeñas no cambian la velocidad: en la práctica, reclutar unos cientos de científicos no acorta tus investigaciones.</li>
                <li>La investigación de alianza «Movilización científica» (Balanza de los Mundos) añade 0,1 de velocidad por nivel; pero la próxima llegada de científicos redondea la velocidad al entero más cercano.</li>
                <li>La duración de una investigación se fija al lanzarla: una ganancia de velocidad solo beneficia a las investigaciones lanzadas después.</li>
            </ul>

            <h2 id="defense">Papel defensivo</h2>
            <p>Tus <strong>trabajadores participan en la defensa terrestre</strong> — pero únicamente durante una <strong>invasión</strong> (cuando el enemigo quiere tomar tu planeta). Durante un <strong>saqueo</strong> clásico (saqueo simple), se quedan escondidos.</p>
            <p>La investigación de alianza «Refuerzo ideológico» (Baluarte Silencioso) aumenta su defensa un 20&nbsp;% por nivel.</p>

            <h2 id="gerer">Gestionar bien tu población</h2>
            <ul>
                <li>Tus trabajadores comen <strong>1 ración por hora por cada 500 trabajadores</strong> (50&nbsp;000 trabajadores = 100 raciones por hora; un Campo agrícola de nivel 1 produce 162).</li>
                <li>Si el granero está vacío, las raciones cargadas en tus propias flotas en órbita del planeta se consumen automáticamente.</li>
                <li>Después, llega la hambruna: tus trabajadores mueren (un 0,5&nbsp;% por ciclo de 10 minutos al principio, hasta un 2&nbsp;% si dura más de 8 horas), y luego tus Legionarios y tus Mechas. La hambruna nunca hace bajar un planeta de 5&nbsp;000 trabajadores.</li>
                <li>Mantén llenos tus Silos agrícolas, sobre todo ante un embargo (consulta <a href="/wiki/embargo">Embargo y hambruna</a>).</li>
            </ul>

            <h2 id="reserve-5000">La reserva intocable de 5 000 trabajadores</h2>
            <p>Tus propias acciones <strong>nunca pueden hacer bajar un planeta de 5 000 trabajadores</strong>: toda acción que lo haría pasar por debajo queda bloqueada con un mensaje claro. La hambruna también se detiene en ese umbral; solo una invasión enemiga puede matar trabajadores más allá. Afecta a:</p>
            <ul>
                <li>El <strong>reclutamiento de defensa</strong> (Legionarios, Mechas, científicos) que consume trabajadores.</li>
                <li>La <strong>construcción de naves</strong> en el Astillero espacial.</li>
                <li>La <strong>carga de trabajadores en un cargo</strong> con vistas a una transferencia.</li>
            </ul>
            <p>El botón «MÁX» de las páginas de producción tiene en cuenta esta reserva: nunca te propondrá un máximo que dejaría tu planeta por debajo del umbral.</p>
            <p>Atención: una nueva colonia empieza con 2&nbsp;500 trabajadores. Solo podrás gastar trabajadores en ella una vez superados los 5&nbsp;000.</p>

    market:
        title: "Mercado y comerciantes"
        category: "economy"
        order: 5
        tags: "mercado,comerciantes,venta,comercio,cargo,bitcoin,precio,puntos de guerra"
        summary: "Vende recursos y tropas a los comerciantes a cambio de Bitcoins, entregándolos tú mismo o con un clic, e intercambia tus Puntos de Guerra."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">¿Quiénes son los comerciantes?</h2>
            <p><strong>Personajes no jugadores</strong> (PNJ) instalados en planetas comerciales fijos: 20 por galaxia, en los mismos sectores de cada galaxia (las cuatro esquinas, el centro y posiciones intermedias). Su posición es visible en el mapa.</p>
            <p>Te compran a cambio de Bitcoins tu <strong>niobium</strong>, tu <strong>agua</strong> y tu <strong>uranium</strong>, pero también <strong>trabajadores</strong>, <strong>Legionarios</strong>, <strong>científicos</strong> y <strong>Mechas</strong>. No compran las raciones.</p>

            <h2 id="vendre">Cómo venderles</h2>
            <ol>
                <li>Carga una flota (un <strong>cargo</strong>, preferiblemente) con lo que quieras vender.</li>
                <li>Envíala al comerciante en misión <strong>«Descargar y volver»</strong>. El combustible se paga en Bitcoins: esta misión cuesta el doble a la ida, y luego la vuelta se factura a tarifa normal cuando la flota vuelve a salir.</li>
                <li>A la llegada, se vende toda la carga vendible: recibes Bitcoins y algunos Puntos de Guerra. Las raciones se quedan a bordo.</li>
                <li>La flota regresa automáticamente a tu planeta.</li>
            </ol>
            <p>Si una horda de Cthulhu bloquea a un comerciante, este rechaza cualquier venta mientras dure el bloqueo.</p>

            <h2 id="vente-clic">Vender con un clic, sin flota</h2>
            <p>Página <strong>Planetas</strong>, pestaña <strong>Venta a los mercaderes</strong>: añade a la lista los planetas que quieras (menú «Añadir») y luego haz clic en <strong>Vender a los mercaderes</strong>. Todo el niobium y toda el agua de esos planetas se venden al instante, sin cargo ni combustible, pero <strong>un 20&nbsp;% más barato</strong> que entregándolo tú mismo (0,10 Bitcoin por niobium, 0,25 por agua) y sin Puntos de Guerra. Un planeta atacado o bajo embargo se ignora.</p>

            <h2 id="immunite">Los comerciantes son intocables</h2>
            <p>Los comerciantes están <strong>inmunizados contra cualquier ataque</strong>. No puedes saquearlos, invadirlos ni combatirlos. Sus flotas nunca participan en un combate, ni siquiera si se encuentran en el mismo punto que un enfrentamiento.</p>
            <p>Atención, sin embargo: en los servidores con PvE, una <strong>horda alien en modo ataque</strong> puede estacionarse en órbita de un comerciante (cada comerciante recibe una al crearse la galaxia, más potente hacia el centro). Un cargo sin armas que llega a esa órbita es atacado y destruido sin vender nada. Antes de enviar tus cargos, asegúrate de que ninguna horda vigila a ese comerciante, o usa la venta con un clic.</p>

            <h2 id="gain">¿Cuánto aporta?</h2>
            <p>Precio base por unidad, entregándolo tú mismo:</p>
            <table>
                <thead>
                    <tr><th>Mercancía</th><th>Bitcoins por unidad</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium</td><td>0,125 (1&nbsp;000 niobium = 125)</td></tr>
                    <tr><td>Agua</td><td>0,3125 (1&nbsp;000 agua = 312)</td></tr>
                    <tr><td>Uranium</td><td>2&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>Las tropas y los trabajadores embarcados también se compran; el importe de cada venta figura en el informe «Venta a los mercaderes». El agua aporta 2,5 veces más que el niobium. La investigación de alianza «Acuerdos mercantiles» (Balanza de los Mundos) añade un 5&nbsp;% por nivel, hasta +25&nbsp;%, y un héroe de Economía de nivel 10 (rasgo «Comerciante») añade un 15&nbsp;% a las ventas que acompaña: las de su flota, o las de su planeta en la venta con un clic. La pestaña Venta a los mercaderes de la página Planetas muestra tus precios reales.</p>

            <h2 id="astuce">Consejo</h2>
            <p>En lugar de dejar que tus stocks se saturen, vende con regularidad: envía un cargo bien lleno (el combustible se paga en Bitcoins, mejor una carga grande que varias pequeñas) o usa la venta con un clic para financiar tus investigaciones o tu ejército.</p>

            <h2 id="points-de-guerre">Intercambiar tus Puntos de Guerra</h2>
            <p>La página <strong>Objetivos</strong>, que lista tus misiones del día, permite también gastar tus Puntos de Guerra: <strong>1 PDG = 1 Bitcoin</strong>, <strong>2 Legionarios</strong> o <strong>10 trabajadores</strong>, entregados en el planeta que elijas dentro del límite de sus topes.</p>

    recycling:
        title: "Reciclaje"
        category: "economy"
        order: 6
        tags: "reciclaje,escombros,cdr,reciclador,asteroide,uranium"
        summary: "Tras cada combate quedan escombros por ahí. Recuperarlos es una mina a cielo abierto."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Los escombros: ¿qué son?</h2>
            <p>Cada nave destruida en combate deja una parte de su coste en forma de <strong>escombros</strong> flotando en el espacio. Eso se llama un <strong>CDR</strong> (Campo De Recursos).</p>
            <p>Un campo dejado por un combate contiene <strong>niobium</strong> y <strong>agua</strong>, nunca uranium. Permanece en la posición del enfrentamiento, sea cual sea (planeta, emplazamiento vacío…), donde un icono lo señala en el mapa.</p>
            <p>También existen <strong>campos de asteroides</strong> que aparecen solos en el mapa. Hay tres tipos: niobium, agua o <strong>uranium</strong>. Se recargan cada 7 a 40 horas y a veces cambian de sitio:</p>
            <ul>
                <li>niobium: 40&nbsp;000 a 800&nbsp;000 por recarga;</li>
                <li>agua: 30&nbsp;000 a 500&nbsp;000 por recarga;</li>
                <li>uranium: 50 a 180 por recarga.</li>
            </ul>
            <p>A menudo están vigilados por una flota alien que ataca a todo el que llega.</p>

            <h2 id="cuanto">¿Cuántos escombros?</h2>
            <p>Un campo contiene el <strong>40&nbsp;% del coste de construcción de las naves realmente destruidas</strong>, en los dos bandos. Cada nave devuelve sus propios recursos: un Destructor (2&nbsp;100 niobium, 6&nbsp;000 agua) deja sobre todo agua. Los supervivientes no dejan nada.</p>
            <p>Tres casos particulares:</p>
            <ul>
                <li>Frente a las hordas de <strong>Cthulhu</strong>, la tasa baja al <strong>20&nbsp;%</strong>.</li>
                <li>La <strong>carga</strong> (niobium y agua) de una flota completamente destruida también se vuelca en el campo, al 40&nbsp;%. Un vencedor maltrecho, en cambio, conserva toda su bodega.</li>
                <li>Las naves pagadas en <strong>puntos de guerra</strong> (Cazador de plasma, Corbeta de combate, Nave de batalla, Carabela) no dejan <strong>ningún</strong> escombro, porque no cuestan ni niobium ni agua. Las <strong>defensas planetarias</strong> arrasadas tampoco dejan nunca.</li>
            </ul>
            <p>Un <strong>combate orbital</strong> (flota derribada por las torretas de un planeta en modo ataque, o naves perdidas al forzar una órbita defendida) deja un campo según la misma regla.</p>

            <h2 id="comment">Cómo reciclar</h2>
            <ol>
                <li>Investiga <strong>Reciclaje orbital</strong> (página <em>Investigaciones</em>, requiere <em>Naves utilitarias</em> nivel 3).</li>
                <li>Fabrica <strong>recicladores</strong> en tu Astillero espacial (2&nbsp;200 niobium, 1&nbsp;000 agua y 10 trabajadores cada uno).</li>
                <li>Crea una flota con tus recicladores, y cargos para la bodega (ver más abajo).</li>
                <li>Envíala a las coordenadas del campo en misión <strong>Normal</strong>. En el <em>Mapa espacial</em>: haz clic en la posición, luego <em>Interacción</em>, elige la flota y la misión <em>Normal</em>, y después <em>Enviar</em>. No hay ninguna misión especial de reciclaje.</li>
                <li>En cuanto llega, el reciclaje arranca solo: una primera recogida de inmediato, y luego una cada <strong>5 minutos</strong>.</li>
                <li>Cuando la bodega está llena o el campo vacío, el reciclaje se detiene y recibes el informe «Tu flota ha dejado de reciclar!». <strong>La flota se queda en el lugar</strong>: te toca a ti traerla de vuelta. El botón <em>Reciclar</em> de la flota relanza el reciclaje si todavía le queda espacio.</li>
            </ol>
            <p>Una flota que espera en un campo de asteroides retoma el reciclaje sola en cada recarga del campo, mientras le quede espacio.</p>

            <h2 id="capacite">¿Cuánto puede traer un reciclador?</h2>
            <p>En cada pasada, cada reciclador recoge <strong>1&nbsp;000 recursos</strong>, repartidos a partes iguales entre los recursos presentes en el campo (niobium, agua, uranium).</p>
            <p><strong>Atención: un reciclador solo tiene 1&nbsp;000 de bodega.</strong> Solo, está lleno desde la primera pasada. Para vaciar un campo grande, añade cargos a la flota: su bodega se llena al ritmo de tus recicladores.</p>
            <table>
                <thead>
                    <tr><th>Nave</th><th>Bodega</th></tr>
                </thead>
                <tbody>
                    <tr><td>Reciclador</td><td>1&nbsp;000</td></tr>
                    <tr><td>Cargo I</td><td>3&nbsp;000</td></tr>
                    <tr><td>Cargo V</td><td>10&nbsp;000</td></tr>
                    <tr><td>Cargo X</td><td>25&nbsp;000</td></tr>
                    <tr><td>Carabela</td><td>40&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>La investigación de alianza <strong>Cargos mejorados</strong> agranda la bodega de los cargos y de la Carabela.</p>
            <p>Ejemplos:</p>
            <ul>
                <li>5 recicladores solos: 5&nbsp;000 recursos recogidos desde la llegada, y luego la flota está llena.</li>
                <li>1 reciclador + 2 Cargos I (7&nbsp;000 de bodega): 1&nbsp;000 por pasada, es decir, 5&nbsp;000 recursos en 20 minutos (a la llegada, y luego a los 5, 10, 15 y 20 minutos).</li>
                <li>10 recicladores + 5 Cargos V (60&nbsp;000 de bodega): 10&nbsp;000 por pasada, flota llena en la 6.ª pasada, es decir, en unos 25 minutos.</li>
            </ul>
            <p>La investigación de alianza <strong>Optimización de reciclaje</strong> (régimen <em>El Baluarte Silencioso</em>) añade 400 recursos por reciclador y por pasada en cada nivel, hasta 3&nbsp;000 en el nivel 5. No agranda la bodega de los recicladores: prevé cargos para aprovecharla.</p>

            <h2 id="strategie">Estrategia</h2>
            <ul>
                <li>Tras cada combate, envía de inmediato recicladores: si no, tus adversarios se los llevarán.</li>
                <li>Protégelos: un reciclador aislado es un blanco fácil, y los campos de asteroides suelen estar vigilados.</li>
                <li>Los combates nunca dejan uranium: recicla los <strong>campos de asteroides de uranium</strong> (50 a 180 unidades por recarga), o libera bases alien.</li>
                <li>El reciclaje es muy rentable: piénsalo como una segunda economía detrás de tus minas.</li>
            </ul>

    daily_report:
        title: "El informe diario"
        category: "economy"
        order: 7
        tags: "informe,diario,cotidiano,balance,ingresos,costes,impuesto"
        summary: "Cada día a las 18h59 (hora de París), el juego hace tu balance: ingresos, costes, impuestos. Hay que vigilarlo de cerca."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Cuándo llega</h2>
            <p>Cada día a las <strong>18h59 (hora de París)</strong>, es decir, las 17h59 UTC en invierno y las 16h59 UTC en verano. Es una cita fija para todos los jugadores del servidor.</p>
            <p>Recibes un «Reporte del imperio» en la página <strong>Informe</strong>, pestaña <strong>Económicos</strong>.</p>

            <h2 id="contenu">Lo que contiene el informe</h2>
            <ul>
                <li><strong>Ingresos</strong> — 0,5 Bitcoin por trabajador presente en tus planetas en el momento del informe.</li>
                <li><strong>Costes de mantenimiento</strong> — Legionarios, Mechas, científicos, naves, edificios. Todo lo que está en una flota, incluso estacionada en órbita, cuesta mucho más que lo que está en tierra (tabla en <a href="/wiki/bitcoin_economy#bareme">Bitcoins y mantenimiento</a>).</li>
                <li><strong>Impuesto de paz</strong> — si tu alianza ha firmado una paz en la que debe pagar un impuesto a la otra alianza: ese porcentaje se descuenta del ingreso de tus trabajadores.</li>
                <li><strong>Impuesto de alianza</strong> — descontado del ingreso de tus trabajadores e ingresado en la tesorería de tu alianza. Con una tasa de t&nbsp;%, la parte descontada vale ingreso × t ÷ (100 + t): una tasa del 10&nbsp;% toma aproximadamente un 9&nbsp;% de tu ingreso.</li>
                <li><strong>Balance final</strong> — ingresos − impuestos − costes, que se suma a tu saldo.</li>
                <li><strong>Amenaza Cthulhu</strong> — si los Cthulhu están activos para ti, la amenaza que pesa sobre tu imperio sube 5 puntos (300 como máximo).</li>
            </ul>

            <h2 id="quetes">Las misiones diarias</h2>
            <p>El informe diario <strong>renueva tus 3 misiones</strong> del día: las de la víspera que no hayas terminado desaparecen. Si las habías completado todas, también te paga un bono igual a su recompensa media. Encuéntralas en la página <strong>Objetivos</strong> (consulta <a href="/wiki/quests">Misiones diarias</a>).</p>

            <h2 id="danger">El peligro que debes vigilar</h2>
            <p>Si tu saldo cae <strong>a negativo</strong> tras el informe, es el <strong>Game Over económico</strong>: todas tus flotas y todas las naves en tierra de tus planetas se pierden, y tu saldo se restablece a 125&nbsp;000 Bitcoins (tus planetas, edificios e investigaciones no cambian). Un informe «¡Bancarrota inminente!» te avisa con antelación, como máximo una vez al día.</p>
            <p>Comprueba tu informe cada día. Si tus costes suben demasiado: pon en tierra las flotas que no uses (su mantenimiento se divide entre 6), frena el reclutamiento, vende tropas o recursos a los comerciantes.</p>

    exchange:
        title: "Intercambios entre jugadores"
        category: "economy"
        order: 8
        tags: "intercambio,alianza,recursos,bitcoin,donación,depósito,uranium,descarga"
        summary: "Cómo enviar recursos a otro jugador o Bitcoins a un aliado, y los límites de la operación."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Area Universe permite enviar recursos a <strong>cualquier jugador</strong> por flota, y Bitcoins a los miembros de tu alianza a través de la tesorería. Es muy útil para:</p>
            <ul>
                <li>Reanimar a un aliado que acaba de ser saqueado.</li>
                <li>Mancomunar un esfuerzo de construcción costoso.</li>
                <li>Abastecer a un miembro de tu alianza bajo embargo.</li>
            </ul>

            <h2 id="ressources">Enviar recursos físicos</h2>
            <p>Carga lo que quieras entregar en la bodega de una flota: niobium, agua, raciones, uranium, pero también trabajadores, Legionarios, científicos o Mechas. Envíala luego en misión <strong>«Descargar y volver»</strong> hacia el planeta del destinatario.</p>
            <p>A la llegada, todo se deposita dentro del límite de las capacidades del planeta (almacenamiento, topes de Legionarios, de trabajadores y de científicos, 500 Mechas como máximo); el excedente se queda a bordo. La flota regresa sola y el destinatario recibe un informe de depósito.</p>

            <h2 id="bitcoins">Enviar Bitcoins</h2>
            <p>Los Bitcoins se transfieren a través de la <strong>tesorería de alianza</strong> (consulta <a href="/wiki/alliance_treasury">Tesorería de alianza</a>): depositas allí y luego el miembro al que quieres ayudar solicita un retiro a su nombre. El retiro es inmediato para un miembro que tenga el permiso «Modificar» (y para todos en una alianza del Baluarte Silencioso); si no, espera la validación de un miembro que tenga ese permiso.</p>

            <h2 id="limites">Los límites</h2>
            <ul>
                <li>No hay <strong>ningún límite diario</strong> ni tope de envío: solo cuentan la capacidad de bodega de tus flotas (Cargo I: 3&nbsp;000 plazas, Cargo V: 10&nbsp;000, Cargo X: 25&nbsp;000, 1 plaza por unidad y 500 por Mecha) y la capacidad de almacenamiento del planeta de llegada.</li>
                <li>Los recursos viajan obligatoriamente por flota: hace falta tiempo y combustible, pagado en Bitcoins. Una misión «Descargar y volver» cuesta el doble a la ida, y luego la vuelta se factura a tarifa normal cuando la flota vuelve a salir.</li>
                <li>Un planeta bajo <strong>embargo</strong> solo puede recibir una entrega de su propietario o de un miembro de la misma alianza.</li>
                <li>El uranium se transporta como el resto, y el planeta que lo recibe no tiene límite de almacenamiento de uranium.</li>
            </ul>

    fleet_creation:
        title: "Crear y enviar una flota"
        category: "fleet"
        order: 1
        tags: "flota,creación,naves,composición,astillero,misión"
        summary: "De la fabricación de la nave hasta su llegada al destino: el recorrido completo."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Lo que necesitas</h2>
            <ul>
                <li>Un <strong>Astillero espacial</strong> en tu planeta activo.</li>
                <li>Los recursos de la nave: niobium, agua y trabajadores casi siempre, a veces Puntos de Guerra, Bitcoins o Legionarios (tabla en <em>Tipos de naves</em>).</li>
                <li>Las investigaciones requeridas para la nave deseada (por ej. <em>Gestión de cargas</em> para los cargos).</li>
            </ul>

            <h2 id="fabriquer">Paso 1 — Fabricar las naves</h2>
            <p>Desde la página <strong>Astillero espacial</strong> (pestaña <strong>Construcción de naves</strong>), elige un modelo y una cantidad, y haz clic en <strong>Construir</strong>. La producción se hace en segundo plano; cada nave tiene una duración base, acortada por la producción espacial del planeta.</p>

            <h2 id="composer">Paso 2 — Componer la flota</h2>
            <p>Una vez entregadas las naves, ve a la página <strong>Flotas</strong> y haz clic en <strong>Crear una nueva flota</strong>: elige las naves que embarcan y un nombre (12 caracteres como máximo). Abre luego la flota (clic en su nombre) para:</p>
            <ul>
                <li>Añadir o quitar naves (pestaña <strong>Naves</strong>, botón <strong>Gestionar</strong>), cuando la flota está en uno de tus planetas.</li>
                <li>Cargar <strong>recursos</strong> (pestaña <strong>Carga</strong>), cuando la flota está en uno de tus planetas.</li>
                <li>Embarcar <strong>Legionarios</strong> o Mechas (pestaña <strong>Carga</strong>) para un saqueo o una invasión: cada Legionario ocupa 1 plaza de bodega, cada Mecha 500, y son las barcazas las que los desembarcan.</li>
            </ul>

            <h2 id="envoyer">Paso 3 — Enviar la flota</h2>
            <ol>
                <li>Elige el <strong>destino</strong>: en la pestaña <strong>Mover la flota</strong> (campos galaxia, sistema y planeta, en formato <code>Galaxia:Sector:Posición</code>, o lista «Mis planetas»), o haciendo clic en la casilla desde el <strong>Mapa espacial</strong> y luego en <strong>Interacción</strong>.</li>
                <li>Elige un <strong>tipo de misión</strong> (Normal, Descargar y volver, Sonda, Colonizar, Saquear, Invadir… consulta <em>Tipos de misiones</em>). La pestaña <strong>Mover la flota</strong> sirve para los desplazamientos simples (Normal) y el espionaje; las demás misiones se envían desde el Mapa espacial.</li>
                <li>En la pestaña <strong>Mover la flota</strong>, comprueba el coste del combustible (en <strong>Bitcoins</strong>) y la duración estimados.</li>
                <li>Haz clic en <strong>Enviar</strong>.</li>
            </ol>
            <p>La flota aparece en tu lista de flotas en vuelo. Durante los <strong>2 primeros minutos</strong>, un botón ✕ con cuenta atrás (o la línea <strong>Cancelar</strong> de su página) permite <strong>cancelar el envío</strong>: la flota vuelve enseguida a su planeta de salida, pero el combustible pagado no se reembolsa. Pasado ese plazo, llega hasta el final.</p>

            <h2 id="astuces">Consejos</h2>
            <ul>
                <li>Un <strong>reciclador</strong> en una flota de ataque recoge los escombros en cuanto termina el combate, pero la ralentiza: la flota avanza a su velocidad, tres veces más lenta que la de un cazador. Para un ataque rápido, envía los recicladores aparte, una vez terminado el combate.</li>
                <li>Nunca envíes toda tu defensa de golpe: guarda lo necesario para mantener tu planeta.</li>
                <li>Solo la misión <strong>Descargar y volver</strong> trae la flota de vuelta sola, y ese regreso se paga en Bitcoins como un trayecto normal. Tras cualquier otra misión, la flota se queda en órbita de su destino: hacerla volver es un nuevo envío, con su propio combustible.</li>
            </ul>

    ship_types:
        title: "Tipos de naves"
        category: "fleet"
        order: 2
        tags: "naves,cazador,corbeta,fragata,acorazado,crucero,destructor,cargo,sonda,lunar,carabela,reciclador,coste,velocidad,requisitos"
        summary: "Todas las naves del juego: función, coste, velocidad, bodega, requisitos y características de combate."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Naves utilitarias</h2>
            <p>No tienen armas. Sirven para transportar, explorar, reciclar, colonizar.</p>
            <table>
                <tr><th>Nave</th><th>Función</th><th>Capacidad</th></tr>
                <tr><td>Sonda</td><td>Espiar un planeta.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Transporte ligero.</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>Transporte medio.</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>Gran transporte.</td><td>25&nbsp;000</td></tr>
                <tr><td>Carabela</td><td>Cargo premium: el más grande y el más rápido de los cargos. Pagado en Puntos de Guerra (25) + 15&nbsp;trabajadores por unidad producida.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonizador</td><td>Fundar una colonia en un planeta deshabitado.</td><td>—</td></tr>
                <tr><td>Reciclador</td><td>Recoger los escombros de combate: 1&nbsp;000 por ciclo de 5 min (más con la investigación de alianza <em>Optimización de reciclaje</em>). Su propia bodega solo contiene 1&nbsp;000: añade cargos a la flota para recoger más.</td><td>1&nbsp;000</td></tr>
                <tr><td>Barcaza de invasión</td><td>Transportar Legionarios para un saqueo o una invasión.</td><td>1&nbsp;000 Legionarios</td></tr>
                <tr><td>Lunar (a veces llamado Moon Maker)</td><td>Crear una luna en una casilla vacía que lleve suficientes escombros (al menos 2M de niobium y 2M de agua).</td><td>—</td></tr>
                <tr><td>Nave radar</td><td>Se despliega en una casilla vacía e instala allí un radar (potencia 1) durante 2&nbsp;h: ves entonces ese sector.</td><td>—</td></tr>
                <tr><td>Nave inhibidora</td><td>Se despliega en una casilla vacía e instala allí un inhibidor (potencia 1) durante 1&nbsp;h.</td><td>—</td></tr>
                <tr><td>Nave nodriza</td><td>Nave insignia, una sola por comandante. En combate, aporta a su flota 20&nbsp;000 de casco y 5&nbsp;000 de escudo, y luego +5&nbsp;% de casco y de escudo y +10&nbsp;% de precisión. Acorta un 10&nbsp;% la duración de vuelo de su flota y reduce su firma un 10&nbsp;%, pero ella misma vuela a 250 lumens, más despacio que un cazador.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Naves de combate</h2>
            <p>Las naves de combate se distinguen por su casco, su escudo y sus armas (misil, láser, plasma). En combate, la potencia de toda tu flota se suma: no hay ni alcance, ni bonus de un tipo de nave contra otro. Dos reglas cuentan:</p>
            <ul>
                <li>los tres cazadores <strong>no tienen escudo</strong> y reciben los daños primero: protegen a las naves grandes;</li>
                <li>el <strong>láser</strong> y sobre todo el <strong>plasma</strong> atraviesan mejor los escudos enemigos que el misil.</li>
            </ul>
            <p>Valores base por nave, antes de tus mejoras (artículo <em>Personalizar tus naves</em>). La columna «Armas» da misil / láser / plasma; «—»: la nave no tiene esa característica.</p>
            <h3>Cazadores y corbetas</h3>
            <table>
                <tr><th>Nave</th><th>Casco</th><th>Escudo</th><th>Armas</th><th>Puntos</th></tr>
                <tr><td>Cazador</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Cazador pesado</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Cazador de plasma</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Corbeta</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Corbeta láser</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Corbeta de combate</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Fragatas y naves pesadas</h3>
            <table>
                <tr><th>Nave</th><th>Casco</th><th>Escudo</th><th>Armas</th><th>Puntos</th></tr>
                <tr><td>Fragata</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Fragata de plasma</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Nave de batalla</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Crucero</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Acorazado</td><td>1&nbsp;250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Destructor</td><td>2&nbsp;600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>«Puntos»: el crédito de puntos de mejora del modelo. El <strong>Cazador de plasma</strong> y la <strong>Nave de batalla</strong> no tienen <strong>ningún arma</strong> al principio: sus armas provienen por completo de los puntos que les asignas.</p>

            <h2 id="factions">El bonus de +20&nbsp;%: la política de alianza</h2>
            <p>No existe ninguna «facción» de nave. El único bonus de +20&nbsp;% del combate espacial proviene de la <strong>política de tu alianza</strong>: la Balanza de los Mundos vence al Baluarte Silencioso, que vence al Martillo de las Estrellas, que vence a la Balanza de los Mundos.</p>
            <p>Cuando la política del <strong>atacante</strong> vence a la del defensor, todas sus armas (misil, láser, plasma) ganan +20&nbsp;% durante ese combate; el defensor nunca se beneficia. Un jugador sin alianza no tiene ni bonus ni penalización.</p>

            <h2 id="bonus-cargo">Capacidad de transporte</h2>
            <p>La capacidad de los cargos (Cargo I, V, X y Carabela) aumenta un <strong>+20&nbsp;% por nivel</strong> de la investigación de alianza <strong>Cargos mejorados</strong> (5 niveles, alianza de nivel 3 como mínimo). En el nivel 5, un Cargo I lleva 6&nbsp;000 en lugar de 3&nbsp;000. Las bodegas de las demás naves no cambian.</p>

            <h2 id="reference">Tabla de referencia</h2>
            <h3>Coste y producción</h3>
            <p>Coste de una nave. La duración es la duración base de producción de una unidad, acortada por la producción espacial de tu planeta.</p>
            <table>
                <tr><th>Nave</th><th>Coste</th><th>Duración</th></tr>
                <tr><td>Sonda</td><td>1&nbsp;000 niobium</td><td>20 s</td></tr>
                <tr><td>Cargo I</td><td>800 niobium, 650 agua, 10 trabajadores</td><td>30 s</td></tr>
                <tr><td>Cargo V</td><td>2&nbsp;200 niobium, 1&nbsp;500 agua, 20 trabajadores</td><td>1 min</td></tr>
                <tr><td>Cargo X</td><td>4&nbsp;500 niobium, 3&nbsp;800 agua, 25 trabajadores</td><td>1 min 30 s</td></tr>
                <tr><td>Carabela</td><td>25 Puntos de Guerra, 15 trabajadores</td><td>2 min</td></tr>
                <tr><td>Reciclador</td><td>2&nbsp;200 niobium, 1&nbsp;000 agua, 10 trabajadores</td><td>1 min</td></tr>
                <tr><td>Colonizador</td><td>5&nbsp;500 niobium, 7&nbsp;000 agua, 2&nbsp;000 trabajadores, 5 Legionarios</td><td>1 h</td></tr>
                <tr><td>Barcaza de invasión</td><td>5&nbsp;000 niobium, 3&nbsp;500 agua, 10 trabajadores</td><td>1 min</td></tr>
                <tr><td>Nave radar</td><td>500 niobium, 600 agua, 2&nbsp;500 Bitcoins</td><td>5 min</td></tr>
                <tr><td>Nave inhibidora</td><td>1&nbsp;100 niobium, 1&nbsp;300 agua, 5&nbsp;500 Bitcoins</td><td>10 min</td></tr>
                <tr><td>Lunar</td><td>50&nbsp;000 niobium, 23&nbsp;000 agua, 20&nbsp;000 trabajadores, 200&nbsp;000 Bitcoins</td><td>5 h</td></tr>
                <tr><td>Nave nodriza</td><td>17&nbsp;500 niobium, 9&nbsp;500 agua, 2&nbsp;000 trabajadores, 25&nbsp;000 Puntos de Guerra</td><td>3 h 53 min</td></tr>
                <tr><td>Cazador</td><td>25 niobium, 5 agua, 1 trabajador</td><td>1 s</td></tr>
                <tr><td>Cazador pesado</td><td>35 niobium, 13 agua, 2 trabajadores</td><td>3,2 s</td></tr>
                <tr><td>Cazador de plasma</td><td>1 Punto de Guerra, 1 trabajador</td><td>8 s</td></tr>
                <tr><td>Corbeta</td><td>100 niobium, 60 agua, 3 trabajadores</td><td>6 s</td></tr>
                <tr><td>Corbeta láser</td><td>100 niobium, 200 agua, 5 trabajadores</td><td>10 s</td></tr>
                <tr><td>Corbeta de combate</td><td>3 Puntos de Guerra, 3 trabajadores</td><td>19 s</td></tr>
                <tr><td>Fragata</td><td>400 niobium, 200 agua, 12 trabajadores</td><td>20 s</td></tr>
                <tr><td>Fragata de plasma</td><td>300 niobium, 600 agua, 14 trabajadores</td><td>30 s</td></tr>
                <tr><td>Nave de batalla</td><td>8 Puntos de Guerra, 12 trabajadores</td><td>40 s</td></tr>
                <tr><td>Crucero</td><td>1&nbsp;000 niobium, 680 agua, 30 trabajadores</td><td>56 s</td></tr>
                <tr><td>Acorazado</td><td>1&nbsp;000 niobium, 920 agua, 40 trabajadores</td><td>1 min 4 s</td></tr>
                <tr><td>Destructor</td><td>2&nbsp;100 niobium, 6&nbsp;000 agua, 60 trabajadores</td><td>4 min 30 s</td></tr>
            </table>

            <h3>Velocidad, firma y bodega</h3>
            <p>La velocidad se mide en lumens, como en la ficha de la nave (cuanto más alta, más rápida). La columna «Vuelo» da el tiempo de vuelo por unidad de distancia en un servidor de velocidad ×1 (un servidor acelerado acorta esas duraciones); una flota vuela al ritmo de su nave más lenta. La firma cuenta para el combustible y para lo que ven los radares enemigos.</p>
            <table>
                <tr><th>Nave</th><th>Velocidad</th><th>Vuelo</th><th>Firma</th><th>Bodega</th></tr>
                <tr><td>Sonda</td><td>299</td><td>1 s</td><td>1</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>280</td><td>40 s</td><td>10</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>275</td><td>50 s</td><td>24</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>270</td><td>60 s</td><td>50</td><td>25&nbsp;000</td></tr>
                <tr><td>Carabela</td><td>285</td><td>30 s</td><td>60</td><td>40&nbsp;000</td></tr>
                <tr><td>Reciclador</td><td>225</td><td>150 s</td><td>16</td><td>1&nbsp;000</td></tr>
                <tr><td>Colonizador</td><td>200</td><td>200 s</td><td>40</td><td>—</td></tr>
                <tr><td>Barcaza de invasión</td><td>150</td><td>300 s</td><td>10</td><td>1&nbsp;000</td></tr>
                <tr><td>Nave radar</td><td>299</td><td>1 s</td><td>100</td><td>—</td></tr>
                <tr><td>Nave inhibidora</td><td>299</td><td>1 s</td><td>200</td><td>—</td></tr>
                <tr><td>Lunar</td><td>50</td><td>500 s</td><td>10&nbsp;000</td><td>—</td></tr>
                <tr><td>Nave nodriza</td><td>250</td><td>100 s</td><td>4&nbsp;000</td><td>—</td></tr>
                <tr><td>Cazador</td><td>275</td><td>50 s</td><td>1</td><td>—</td></tr>
                <tr><td>Cazador pesado</td><td>275</td><td>50 s</td><td>2</td><td>4</td></tr>
                <tr><td>Cazador de plasma</td><td>275</td><td>50 s</td><td>5</td><td>—</td></tr>
                <tr><td>Corbeta</td><td>265</td><td>70 s</td><td>7</td><td>—</td></tr>
                <tr><td>Corbeta láser</td><td>250</td><td>100 s</td><td>10</td><td>—</td></tr>
                <tr><td>Corbeta de combate</td><td>265</td><td>70 s</td><td>12</td><td>—</td></tr>
                <tr><td>Fragata</td><td>245</td><td>110 s</td><td>20</td><td>25</td></tr>
                <tr><td>Fragata de plasma</td><td>240</td><td>120 s</td><td>30</td><td>—</td></tr>
                <tr><td>Nave de batalla</td><td>250</td><td>100 s</td><td>40</td><td>—</td></tr>
                <tr><td>Crucero</td><td>235</td><td>130 s</td><td>56</td><td>—</td></tr>
                <tr><td>Acorazado</td><td>225</td><td>150 s</td><td>64</td><td>—</td></tr>
                <tr><td>Destructor</td><td>230</td><td>140 s</td><td>270</td><td>—</td></tr>
            </table>
            <p>Ejemplo: el Lunar es muy lento y su firma de 10&nbsp;000 encarece su trayecto. Hacia un sector vecino, tarda 25 minutos y cuesta unos 50 Bitcoins de combustible; hacia otra galaxia, 2 h 30 y 1&nbsp;250 Bitcoins.</p>

            <h3>Requisitos</h3>
            <p>Investigaciones que hay que obtener, y edificio que hay que construir en el planeta que produce:</p>
            <ul>
                <li>Ninguna investigación: Sonda, Carabela, Cazador de plasma, Corbeta de combate, Nave de batalla.</li>
                <li>Cargo I / V / X: Gestión de cargas nivel 1 / 3 / 5.</li>
                <li>Colonizador: Terraformación nivel 1. Lunar: Terraformación nivel 15 + Industria pesada.</li>
                <li>Reciclador: Reciclaje orbital. Barcaza de invasión: Invasión planetaria.</li>
                <li>Nave radar: Escáner de sistema nivel 3 + Fábrica de armamento. Nave inhibidora: Escáner de sistema nivel 5 + Fábrica de armamento.</li>
                <li>Nave nodriza: Naves utilitarias nivel 3 + Industria pesada (una sola por comandante).</li>
                <li>Cazador: Industria nivel 1 + Arma misil nivel 1. Cazador pesado: Arma misil nivel 2 + Fábrica de armamento.</li>
                <li>Corbeta: Arma misil nivel 3 + Naves ligeras nivel 2 + Fábrica de armamento. Corbeta láser: Arma misil 3 + Arma láser 1 + Naves ligeras 3 + Fábrica de armamento.</li>
                <li>Fragata: Arma misil 3 + Arma láser 1 + Industria pesada. Fragata de plasma: lo mismo + Arma de plasma 1.</li>
                <li>Crucero: Arma misil 3 + Arma láser 2 + Arma de plasma 2 + Industria pesada.</li>
                <li>Acorazado: las tres armas en nivel 3 + Naves pesadas 2 + Industria pesada. Destructor: las tres armas en nivel 3 + Naves pesadas 3 + Industria pesada.</li>
            </ul>

    ship_customization:
        title: "Personalizar tus naves"
        category: "fleet"
        order: 3
        tags: "personalización,naves,puntos,casco,escudo,precisión,armas,mejora"
        summary: "Hasta 40 puntos al día para reforzar el casco, el escudo, las armas y la precisión de tus naves de combate."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Cada una de las 12 naves de combate dispone de un <strong>crédito de puntos de mejora</strong> propio: 3 para el Cazador, 676 para el Destructor, 1&nbsp;465 para el conjunto de los modelos. Los gastas en sus características:</p>
            <ul>
                <li><strong>Casco</strong> — cuánto puede encajar (+5 por punto).</li>
                <li><strong>Escudo</strong> — absorbe una parte de los disparos (+1 por punto; los cazadores no tienen).</li>
                <li><strong>Misil</strong>, <strong>Láser</strong>, <strong>Plasma</strong> — sus armas (+3, +2 y +1 por punto), según las que posea la nave.</li>
                <li><strong>Precisión</strong> — sube el peor resultado posible de cada salva (+1 por punto; ningún disparo falla nunca, pero un disparo mal ajustado causa menos daño).</li>
            </ul>
            <p>Puedes gastar <strong>como máximo 40 puntos al día</strong>, todas las naves juntas. En cuanto has gastado esos 40 puntos, arranca una cuenta atrás de 24&nbsp;h; al terminar, recuperas 40. Los puntos no gastados no se acumulan más allá de 40: acuérdate de pasar cada día.</p>
            <p>Solo las naves de combate se mejoran: cargos, recicladores, sondas y demás naves utilitarias no tienen puntos.</p>

            <h2 id="utiliser">Cómo usarlos</h2>
            <p>Ve a la página <strong>Astillero espacial</strong>, pestaña <strong>¡Mejore sus naves!</strong> (la entrada del menú se enciende en verde cuando tienes puntos por gastar). Para cada modelo, introduce el número de puntos que quieres colocar en cada característica (la ganancia se muestra al lado) y haz clic en <strong>Aplicar</strong>. Tus elecciones se aplican a <strong>todas las naves de ese modelo</strong> (actuales y futuras). Estas estadísticas progresan de forma independiente unas de otras: poner puntos en el casco o en las armas de un modelo nunca reduce su precisión.</p>

            <h2 id="lectura">Leer tu puntería en pantalla</h2>
            <p>La pestaña <strong>Estadísticas</strong> del Astillero espacial muestra, modelo por modelo, la puntería que has invertido sobre el crédito de ese modelo (por ejemplo <code>676 / 676</code> para un Destructor) y el <strong>multiplicador de daños</strong> que de ahí se deriva&nbsp;: <strong>×0,94</strong> con puntería completa, <strong>×0,66</strong> sin un solo punto invertido.</p>
            <p>No es una tasa de acierto&nbsp;: <strong>ningún disparo falla nunca</strong>. Apuntar mejor sube el suelo de tus daños, nunca su techo. Es la misma cifra que en tu página de gestión de flota, en la pestaña Defensas y en tus informes de combate — por fin las cuatro pantallas se comparan directamente. Como referencia, las defensas de un planeta disparan a <strong>×1,06</strong>, es decir, mejor que una flota con puntería completa.</p>

            <h2 id="maximum">¿Cuántos puntos para maximizar?</h2>
            <p>La <strong>precisión</strong> alcanza su máximo cuando colocas en ella <strong>todo el crédito del modelo</strong>: 3 puntos para el Cazador, 5 para el Cazador pesado, 21 para el Cazador de plasma y la Corbeta láser, 23 para la Corbeta, 34 para la Corbeta de combate, 61 para la Fragata de plasma, 64 para la Fragata, 118 para el Crucero, 160 para la Nave de batalla, 279 para el Acorazado y 676 para el Destructor. Es una elección: todo en la puntería, o todo en los cañones y el casco.</p>
            <p>Las demás características no tienen máximo, solo el límite del crédito. Ejemplo: los 676 puntos de un Destructor colocados en el casco le añaden 3&nbsp;380 puntos de casco (de 2&nbsp;600 a 5&nbsp;980). A 40 puntos al día, hacen falta 17 días para gastar el crédito de un Destructor, y 37 días para los 1&nbsp;465 puntos de todos los modelos.</p>

            <h2 id="reset">Puestas a cero</h2>
            <p>Puedes reiniciar tus puntos <strong>una vez cada 96 horas</strong>, sin límite de número: si tu estrategia cambia o el motor de combate evoluciona, todos tus puntos gastados vuelven al crédito de cada modelo. Tras un reinicio, el botón queda atenuado y una cuenta atrás muestra el tiempo restante antes del siguiente.</p>
            <p>Justo después de la puesta a cero, la línea «Todavía puede gastar … puntos hoy» indica tus puntos gastados menos 90, más lo que te quedaba por gastar ese día, con un mínimo de 40. El resto vuelve después al ritmo habitual de 40 por día. Ejemplos: si habías gastado los 1&nbsp;465 puntos y nada hoy, puedes volver a colocar 1&nbsp;375 de inmediato; si habías gastado 300, puedes volver a colocar 210.</p>

            <h2 id="modes-speciaux">Modos de servidor con investigaciones máximas</h2>
            <p>En algunos modos (Battle Royale, Dominación, Search &amp; Destroy), <strong>todos tus puntos están desbloqueados desde el primer día</strong>: los 1&nbsp;465 puntos están disponibles de inmediato, en lugar de 40 al día.</p>

            <h2 id="astuces">Consejos</h2>
            <ul>
                <li>No disperses tus puntos en demasiados modelos: concéntrate en los que usas realmente en masa.</li>
                <li>El <strong>Cazador de plasma</strong> y la <strong>Nave de batalla</strong> no tienen ningún arma de origen: sin puntos en sus armas, no disparan.</li>
                <li>El <strong>Cazador</strong> solo tiene 3 puntos: bastan para llevar su precisión al máximo.</li>
                <li>Los cargos y los recicladores no se pueden mejorar: para protegerlos, haz que los escolte una flota armada.</li>
            </ul>

    fleet_missions:
        title: "Tipos de misiones"
        category: "fleet"
        order: 4
        tags: "misión,ataque,transporte,colonización,reciclaje,espionaje,nuclear,saqueo,invasión"
        summary: "Cada misión da una orden distinta a tu flota. Así se elige la adecuada."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Cuando envías una flota, le das un <strong>tipo de misión</strong>. Esa misión determina lo que ocurre a la llegada. Algunos tipos exigen naves específicas.</p>
            <p>Todas las misiones se envían desde el <strong>Mapa espacial</strong>: haz clic en la casilla objetivo, luego en <strong>Interacción</strong>, elige la flota y la misión, y haz clic en <strong>Enviar</strong>. La lista solo propone las misiones posibles en esa casilla. La pestaña <strong>Mover la flota</strong> de la página de una flota sirve para los desplazamientos simples (Normal) y el espionaje.</p>

            <h2 id="missions">Los tipos disponibles</h2>
            <table>
                <tr><th>Misión (nombre en el juego)</th><th>Qué hace</th><th>Naves requeridas</th></tr>
                <tr><td><strong>Normal</strong></td><td>La flota se dirige al punto objetivo y se queda allí en órbita. Un combate estalla 5 minutos después de la llegada si una flota en modo ataque (la tuya o una flota ya presente) se enfrenta a un adversario, si vuestras alianzas están en guerra, o si el planeta objetivo está en modo ataque (sus defensas disparan). Detalles en <em>Combate espacial</em>.</td><td>Cualesquiera</td></tr>
                <tr><td><strong>Descargar y volver</strong></td><td>Deposita la carga en un planeta (dentro del límite de sus almacenes: el excedente se va con la flota) o la vende a un comerciante a cambio de Bitcoins, y luego regresa sola. El combustible se duplica a la ida, y la vuelta se paga a tarifa normal en su salida.</td><td>Naves con bodega (cargos, en la práctica)</td></tr>
                <tr><td><strong>Colonizar</strong></td><td>Funda una colonia en un <strong>planeta deshabitado</strong> (no en una casilla vacía).</td><td>Un colonizador</td></tr>
                <tr><td><strong>Saquear</strong></td><td>Combate la defensa terrestre para robar recursos, sin tomar el planeta.</td><td>Barcazas + Legionarios</td></tr>
                <tr><td><strong>Invadir</strong></td><td>Combate la defensa terrestre para <strong>tomar el planeta</strong> al adversario.</td><td>Barcazas + Legionarios</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Espía el planeta y te envía un informe.</td><td>Al menos una sonda</td></tr>
                <tr><td><strong>Crear una luna</strong></td><td>Crea una luna en una casilla vacía que lleve al menos 2M de niobium y 2M de agua en escombros.</td><td>Un Lunar</td></tr>
                <tr><td><strong>Desplegar radar</strong></td><td>Instala un radar de potencia 1 en una casilla vacía durante 2&nbsp;h.</td><td>Una nave radar</td></tr>
                <tr><td><strong>Desplegar inhibidor</strong></td><td>Instala un inhibidor de potencia 1 en una casilla vacía durante 1&nbsp;h.</td><td>Una nave inhibidora</td></tr>
            </table>
            <p>Una flota que ya está en órbita de su objetivo también puede actuar directamente desde su página, apartado <strong>Interacción</strong>: Invadir, Saquear, Colonizar, Espiar o desplegar.</p>

            <h3>No son misiones</h3>
            <ul>
                <li><strong>Reciclaje</strong>: automático. Una flota que cuenta con al menos un reciclador y espacio en la bodega se pone a reciclar en cuanto llega a un campo de escombros, sea cual sea su misión (Normal, en general). El botón <strong>Reciclar</strong> de la flota relanza el trabajo.</li>
                <li><strong>Poner en tierra</strong>: en uno de tus planetas, la flota se une al stock de naves en tierra (consulta <em>Gestión avanzada de flotas</em>).</li>
                <li><strong>Misil nuclear</strong>: desde el Mapa espacial, «Enviar un misil nuclear» a un planeta enemigo. El misil sale de uno de tus planetas que posea uno, vuela 30 minutos y no se puede cancelar.</li>
            </ul>

            <h2 id="choisir">Cómo elegir la misión adecuada</h2>
            <ul>
                <li>¿Quieres <strong>Bitcoins</strong>? → Descargar y volver, hacia un comerciante.</li>
                <li>¿Quieres <strong>información</strong>? → Sonda.</li>
                <li>¿Quieres <strong>debilitar</strong> a un enemigo? → Saquear.</li>
                <li>¿Quieres <strong>tomar</strong> su planeta? → Invadir.</li>
                <li>¿Quieres <strong>recuperar escombros</strong>? → Envía recicladores (misión Normal): reciclan solos a la llegada.</li>
            </ul>

    fleet_movement:
        title: "Desplazamiento y distancia"
        category: "fleet"
        order: 5
        tags: "desplazamiento,distancia,velocidad,viaje,combustible,coordenadas,bitcoin,cancelar,noche"
        summary: "Cómo se calcula la duración del vuelo, el combustible consumido y qué ralentiza tu flota."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Las coordenadas, cómo funcionan</h2>
            <p>Cada posición en el universo se escribe en el formato <strong>Galaxia:Sector:Posición</strong>. Ejemplo: <code>1:5:12</code> = galaxia 1, sector 5, posición 12.</p>
            <ul>
                <li>Una <strong>galaxia</strong> contiene 100 sectores (cuadrícula 10×10, numerados del 1 al 100 fila por fila: del 1 al 10 en la primera fila, del 91 al 100 en la última). El Mapa espacial los llama «sistemas».</li>
                <li>Un <strong>sector</strong> contiene 25 posiciones (cuadrícula 5×5); la posición 13, en el centro, es siempre un sol.</li>
            </ul>

            <h2 id="distance">Cómo se calcula la distancia</h2>
            <ul>
                <li><strong>Dentro de tu sector</strong>: aproximadamente 1 por casilla de diferencia (1 entre dos casillas vecinas, 6,25 como máximo de una esquina a otra).</li>
                <li><strong>Hacia otro sector de la misma galaxia</strong>: aproximadamente 3 por sector de diferencia, en línea recta sobre la cuadrícula 10×10; la posición dentro del sector ya no cuenta. De 3 para un sector vecino a unos 40 de una esquina de la galaxia a la otra.</li>
                <li><strong>Hacia otra galaxia</strong>: siempre 18, sea cual sea el sector objetivo. Hace falta la investigación <strong>Tecnología hiperespacial</strong>.</li>
            </ul>
            <p>La pestaña <strong>Mover la flota</strong> de la página de una flota muestra una estimación del coste y de la duración antes del envío. Esa estimación no tiene en cuenta ni los bonus de velocidad, ni la duplicación de «Descargar y volver», ni la velocidad del servidor. Desde el Mapa espacial, el envío sale sin vista previa.</p>

            <h2 id="duree">La duración del vuelo</h2>
            <p>La duración se calcula así: <strong>distancia × tiempo por unidad de la nave más lenta × velocidad del servidor</strong>. Una flota va siempre a la velocidad de su nave más lenta. Tiempo por unidad de distancia, en un servidor de velocidad ×1 (algunos servidores están acelerados):</p>
            <table>
                <tr><th>Tiempo por unidad</th><th>Naves</th></tr>
                <tr><td>1 s</td><td>Sonda, Nave radar, Nave inhibidora</td></tr>
                <tr><td>30 s</td><td>Carabela</td></tr>
                <tr><td>40 s</td><td>Cargo I</td></tr>
                <tr><td>50 s</td><td>Cargo V, Cazador, Cazador pesado, Cazador de plasma</td></tr>
                <tr><td>60 s</td><td>Cargo X</td></tr>
                <tr><td>70 s</td><td>Corbeta, Corbeta de combate</td></tr>
                <tr><td>100 s</td><td>Corbeta láser, Nave de batalla, Nave nodriza</td></tr>
                <tr><td>110 s</td><td>Fragata</td></tr>
                <tr><td>120 s</td><td>Fragata de plasma</td></tr>
                <tr><td>130 s</td><td>Crucero</td></tr>
                <tr><td>140 s</td><td>Destructor</td></tr>
                <tr><td>150 s</td><td>Acorazado, Reciclador</td></tr>
                <tr><td>200 s</td><td>Colonizador</td></tr>
                <tr><td>300 s</td><td>Barcaza de invasión</td></tr>
                <tr><td>500 s</td><td>Lunar</td></tr>
            </table>
            <p>Ejemplos, en un servidor de velocidad ×1:</p>
            <ul>
                <li>Cazadores hacia un sector vecino: 2 min 30 s (3 × 50 s).</li>
                <li>Un Cargo I que entrega a un aliado: unos 2 minutos hacia un sector vecino, 10 minutos hacia un sector situado 5 sectores más lejos, 12 minutos hacia otra galaxia (Cargo X: 3, 15 y 18 minutos). Con «Descargar y volver», cuenta otro tanto para la vuelta.</li>
                <li>Un colonizador: unos 10 minutos hacia un sector vecino, 50 minutos a 5 sectores, 1 hora hacia otra galaxia.</li>
            </ul>
            <p>Lo que modifica la duración:</p>
            <ul>
                <li>La <strong>Nave nodriza</strong> reduce un 10&nbsp;% la duración de vuelo de su flota. Atención: ella misma vuela a 100 s por unidad, así que una flota de cazadores que la lleva pasa de 50 a 90 s por unidad. También <strong>reduce un 10&nbsp;% la firma de radar</strong> de la flota (camuflaje) — la Vista general muestra, en cambio, el total bruto de tus naves.</li>
                <li>Un <strong>héroe</strong> a bordo que da un bonus de velocidad (consulta el artículo <em>Tu héroe</em>) y el bonus de alianza de velocidad de flota acortan el trayecto. Juntos, los bonus del héroe no pueden reducir la duración más de un 90&nbsp;%.</li>
                <li>La <strong>ralentización nocturna</strong> puede multiplicar la duración (ver más abajo).</li>
            </ul>

            <h2 id="carburant">El combustible</h2>
            <p>El combustible se paga en <strong>Bitcoins</strong>, en la salida. Depende de la <strong>firma</strong> de la flota (la suma de las firmas de sus naves; la carga no cuenta) y de la distancia:</p>
            <ul>
                <li>dentro de la misma galaxia: <strong>firma × distancia ÷ 600</strong>, redondeado;</li>
                <li>hacia otra galaxia: <strong>firma ÷ 8</strong>, redondeado, sea cual sea el destino.</li>
            </ul>
            <p>La misión <strong>Descargar y volver</strong> cuesta el <strong>doble</strong> a la ida, y su vuelta se paga después como un trayecto normal, en el momento en que la flota vuelve a salir. Una Nave nodriza reduce la firma de la flota, y por tanto su combustible, un 10&nbsp;% (pero su propia firma es de 4&nbsp;000).</p>
            <p>Ejemplos: 1 Cargo I (firma 10) hacia un sector vecino: 0 Bitcoin. 100 Cargo X (firma 5&nbsp;000) hacia un comerciante situado 5 sectores más lejos: 252 Bitcoins a la ida, 126 a la vuelta. 1&nbsp;000 cazadores hacia otra galaxia: 125 Bitcoins. Si no tienes suficientes Bitcoins, el envío se rechaza.</p>

            <h2 id="rappel">Llamar de vuelta a una flota en vuelo</h2>
            <p>Durante los <strong>2 primeros minutos</strong> del vuelo, aparece un botón ✕ con cuenta atrás en la flota (página Flotas), y una línea <strong>Cancelar</strong> en su página: <strong>cancela el envío</strong>. La flota vuelve enseguida a su planeta de salida, pero el combustible pagado no se reembolsa. Esto vale también para un colonizador.</p>
            <p>Pasado ese plazo, la flota ya no puede detenerse: una vez llegada, reenvíala (nuevo trayecto, nuevo combustible). Un misil nuclear no se cancela nunca.</p>

            <h2 id="night-slowdown">🌙 Ralentización nocturna</h2>
            <p>Esta ralentización afecta a una flota que transporte al menos una nave de combate, Legionarios o Mechas, enviada hacia el planeta de otro jugador o de un comandante IA que no sea de tu alianza, ni aliado, ni esté en pacto o en paz contigo. Si esa flota debiera llegar durante la <strong>noche del defensor</strong> (23h–06h en su zona horaria), <strong>toda su duración de vuelo se multiplica</strong>, por 10 por defecto (cada servidor puede ajustar este multiplicador).</p>
            <p>Ejemplo: un vuelo de 1&nbsp;h que llegaría a las 23h30 dura 10&nbsp;h y llega a las 9h30. Una flota de cargos, sondas o colonizadores sin tropas a bordo nunca se ralentiza. La duración mostrada en la pestaña <strong>Mover la flota</strong> ya integra este multiplicador.</p>
            <p>Un icono 🌙 en el mapa indica los jugadores que están en ventana nocturna. En la pestaña <strong>Mover la flota</strong>, aparece una ventana de confirmación al enviar si la llegada cae en la noche adversaria; desde el Mapa espacial, la flota sale sin esta advertencia. La zona horaria se detecta automáticamente y se puede modificar como máximo una vez al mes (y 6 veces al año).</p>

    fleet_management:
        title: "Gestión avanzada de flotas"
        category: "fleet"
        order: 6
        tags: "gestión,flota,dividir,fusionar,transferir,reagrupar,poner en tierra,reagrupamiento,cohorte,abandonar"
        summary: "Dividir, fusionar, poner en tierra, cancelar un envío: las manipulaciones avanzadas de tus flotas."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Las operaciones disponibles</h2>
            <p>Se hacen desde la página de una flota (clic en su nombre, página <strong>Flotas</strong>):</p>
            <ul>
                <li><strong>Dividir</strong> (pestaña <strong>Naves</strong>) — separar una parte de las naves y de la carga en una nueva flota. Imposible en vuelo o en combate; 100 flotas como máximo.</li>
                <li><strong>Fusionar</strong> (lista «Flotas en órbita») — reunir otra de tus flotas, o todas (<strong>Fusión</strong>), estacionadas en el mismo planeta.</li>
                <li><strong>Gestionar</strong> las naves (pestaña <strong>Naves</strong>) y la <strong>Carga</strong> — en uno de tus planetas, pasar naves o carga entre la flota y el suelo.</li>
                <li><strong>Poner en tierra</strong> — en uno de tus planetas, verter toda la flota (naves, tropas, carga) en el stock del planeta; la flota desaparece. Las tropas y la carga desembarcadas deben caber en las capacidades del planeta&nbsp;; una flota que no transporta nada se posa siempre, incluso en un planeta ya lleno.</li>
                <li><strong>Cancelar el envío</strong> (botón ✕ en la flota en vuelo, o línea <strong>Cancelar</strong> en su página) — solo durante los 2 primeros minutos del vuelo: la flota vuelve enseguida a su punto de salida, combustible perdido.</li>
                <li><strong>Abandonar</strong> — pierdes la flota: en un servidor donde Cthulhu está presente, pasa a él (y puede volverse contra ti); en otros casos, se destruye.</li>
            </ul>
            <p>En la propia página <strong>Flotas</strong>:</p>
            <ul>
                <li><strong>Reagrupamiento de flotas</strong> — envía todas tus flotas paradas hacia ese planeta, donde se posan a la llegada.</li>
                <li><strong>Reagrupamiento de naves</strong> — reúne las naves en tierra de tus otros planetas en flotas que vuelan hacia este y se posan allí.</li>
                <li><strong>Cohortes</strong> — organiza tus flotas en listas con nombre (10 como máximo) para encontrarlas fácilmente. Sin efecto en combate.</li>
            </ul>
            <p>Dividir, fusionar, transferir y poner en tierra no cuestan ningún recurso. Solo los desplazamientos, reagrupamientos incluidos, se pagan, en Bitcoins de combustible.</p>

            <h2 id="en-vol">Lo que no se puede hacer</h2>
            <ul>
                <li>Modificar la composición de una flota <strong>en vuelo</strong> (carga, naves).</li>
                <li>Cambiar la misión o el destino de una flota en vuelo. Solo es posible la cancelación, y únicamente durante los 2 primeros minutos.</li>
                <li>Teletransportar una flota (¡no hay atajos mágicos!).</li>
            </ul>

            <h2 id="astuces">Casos de uso</h2>
            <ul>
                <li><strong>Dividir antes de un combate</strong>: guarda una parte de tu flota en reserva, envía una vanguardia.</li>
                <li><strong>Fusionar tras un saqueo</strong>: reúne varios regresos para ganar en legibilidad.</li>
                <li><strong>Poner en tierra</strong>: las naves en tierra cuestan seis veces menos de mantenimiento que en flota (un doceavo de su firma en Bitcoins cada día, en el balance de las 18h59, hora de París, frente a la mitad en flota), pero <strong>no combaten</strong>. Para defender un planeta, mantén una flota armada en órbita, en modo ataque.</li>
            </ul>

    espionage:
        title: "Espionaje y sondas"
        category: "fleet"
        order: 7
        tags: "espionaje,sonda,espía,detección,información,inteligencia"
        summary: "Saber lo que tiene el adversario antes de golpear: el envío de sondas explicado."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Enviar una sonda</h2>
            <ol>
                <li>Fabrica <strong>sondas</strong> en el Astillero espacial (no requiere ninguna investigación; 1&nbsp;000 niobium la unidad).</li>
                <li>En el <strong>Mapa espacial</strong>, haz clic en el planeta objetivo, luego en <strong>Interacción</strong> → <strong>Sondear el planeta</strong>: una sonda almacenada en tierra en uno de tus planetas sale de inmediato. También puedes crear una flota de sondas y enviarla en misión <strong>Sonda</strong>.</li>
                <li>Sola, una sonda es casi instantánea: 1 segundo por unidad de distancia (18 segundos hacia otra galaxia). Mezclada con otras naves, vuela a su velocidad.</li>
            </ol>
            <p>El botón <strong>Interacción</strong> del mapa solo aparece si al menos una de tus flotas está parada. Solo se pueden escanear los planetas habitados por otro comandante: una sonda enviada a una luna llega sin producir informe.</p>
            <p>A la llegada, la sonda escanea el planeta y te envía un informe, y luego se queda en órbita del objetivo. Desde su página (botón <strong>Espiar</strong>), puede repetir un informe más tarde; si el planeta pasa a modo ataque, sus defensas pueden destruirla. Desde el Mapa o el botón Espiar, un mismo planeta solo se puede sondear una vez por hora.</p>

            <h2 id="reussite">¿Qué determina el éxito?</h2>
            <p>Un duelo silencioso enfrenta tu <strong>nivel de Espionaje</strong> al del defensor:</p>
            <ul>
                <li>Si tu nivel es <strong>superior o igual</strong>, el informe es completo.</li>
                <li>Si tu nivel es más bajo, el espionaje fracasa: el informe no contiene nada más que el nombre del planeta. No hay resultado parcial.</li>
            </ul>
            <p>Para subir tu espionaje: investigación <strong>Escáner de sistema</strong> hasta el nivel 5, y luego la investigación <strong>Espionaje</strong>, sin nivel máximo.</p>

            <h2 id="rapport">Lo que revela un informe logrado</h2>
            <ul>
                <li>Los <strong>recursos</strong>: niobium, agua, raciones, uranium, trabajadores y científicos.</li>
                <li>Los <strong>edificios</strong> y su nivel.</li>
                <li>Las <strong>defensas</strong>: torretas, interceptores nucleares, escudo, <strong>Legionarios</strong> y <strong>Mechas</strong>.</li>
                <li>Las <strong>naves en tierra</strong> del planeta (misiles nucleares incluidos). Las flotas en órbita no aparecen: míralas en el Mapa espacial.</li>
                <li>Los <strong>prisioneros</strong> (héroes) retenidos en el planeta.</li>
            </ul>
            <p>Exactamente lo necesario para decidir: saqueo, invasión o retirada.</p>

            <h2 id="detection">¿Te pueden detectar?</h2>
            <p>Siempre. En cada sondeo, el defensor recibe un informe «Espionaje detectado» que da <strong>tu nombre</strong> y precisa si el intento ha tenido éxito o ha fracasado, además de una notificación. El radar no cambia nada.</p>
            <p>El Inhibidor de radar tampoco: oculta un planeta en el mapa, pero no impide que una sonda lo escanee. Solo un nivel de Espionaje superior al tuyo protege al defensor.</p>

    spatial_combat:
        title: "Combate espacial"
        category: "combat"
        order: 1
        tags: "combate,espacial,flota,batalla,bloque,ronda,escudo,precisión,pérdidas,daños,pantalla,cazadores"
        summary: "El desarrollo completo de un combate entre flotas: poder de los bandos, duelo de escudos, rondas de disparo, fin del combate y cálculo exacto de tus pérdidas."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="inicio">Cuándo se desencadena un combate</h2>
            <p>En cuanto una flota marcada <strong>[Ataque]</strong> comparte su posición (Galaxia:Sector:Posición) con una flota enemiga, el combate se programa para <strong>5 minutos</strong> más tarde; hasta entonces, nadie puede cambiar el modo ataque de sus flotas. Tus flotas presentes en el mismo lugar se fusionan primero en una sola armada.</p>
            <p>Todas las flotas presentes se reparten en <strong>dos bandos</strong> según la diplomacia: tu alianza y las alianzas vinculadas a ella por una Alianza defensiva de un lado, el enemigo y las suyas del otro; una alianza vinculada por un Pacto de no agresión al bando contrario se mantiene al margen. Un bando sin ni una sola arma de nave (cargos, recicladores, sondas, tropas solas) no libra batalla: es destruido, y el informe lo menciona.</p>
            <p><strong>Alianzas en guerra, nadie armado</strong> — dos flotas de alianzas en guerra que se cruzan en órbita solo desencadenan un combate si al menos una de las dos lleva armas de nave. Dos flotas totalmente desarmadas (cargos, sondas, recicladores) que se cruzan simplemente no combaten&nbsp;: tus flotas no quedan inmovilizadas y nadie recibe un aviso en balde.</p>
            <p><strong>Caso de los saqueos e invasiones</strong> — cuando esta batalla la desencadena un saqueo o una invasión contra un planeta custodiado (consulta los artículos <em>Invasión de planeta</em> y <em>Raids (saqueo)</em>), es ese propio desencadenamiento el que coloca el marcador <strong>[Ataque]</strong> en tu flota asaltante. Nunca se retira después&nbsp;: una flota de saqueo o de invasión que sobrevive sigue por tanto marcada como hostil — las torretas en modo ataque podrán enfrentarse a ella más tarde, y se incluirá en la detección del próximo combate espacial en cuanto se cruce con un enemigo.</p>

            <h2 id="poder">El poder de un bando</h2>
            <p>El combate enfrenta los <strong>totales</strong> de los dos bandos: el juego suma la armadura, el escudo, los misiles, los láseres y el plasma de todas las naves comprometidas.</p>
            <ul>
                <li><strong>Defensor en su casa</strong> — las torretas y la armadura de las defensas del planeta se unen a su bando; el Escudo añade +50&nbsp;000 de armadura, el Gran escudo +600&nbsp;000 (+20&nbsp;% cada uno con una Base espacial). Una flota armada de un miembro de su alianza estacionada en el planeta también se beneficia.</li>
                <li><strong>Precisión</strong> — media de las precisiones de las flotas del bando (procedente de la personalización de tus naves). Consulta <em>Comprender la potencia de las tropas</em>.</li>
                <li><strong>Política de alianza</strong> — cada régimen vence a su rival: <strong>La Balanza de los Mundos</strong> vence a <strong>El Baluarte Silencioso</strong>, que vence a <strong>El Martillo de las Estrellas</strong>, que vence a La Balanza de los Mundos. Si la política del <strong>atacante</strong> vence a la del defensor, sus misiles, láseres y plasma ganan +20&nbsp;% durante ese combate.</li>
                <li><strong>Mejoras de alianza</strong> — hasta +5&nbsp;% por tipo de arma, de armadura, de escudo y de precisión, y hasta +10&nbsp;% para las defensas planetarias. Este último bonus actúa cuando tus defensas combaten junto a una flota, no en el combate orbital del modo ataque.</li>
                <li><strong>Héroes</strong> — bonus de ataque, de defensa, de escudo y de precisión según habilidades y objetos. Un héroe dotado de <strong>Intimidación</strong> reduce las armas adversarias; un <strong>Táctico</strong> refuerza la primera salva de su bando.</li>
            </ul>

            <h2 id="defensas-planeta">Tus torretas combaten en este mismo combate</h2>
            <p>Cuando las defensas de tu planeta se unen a un bando, este combate <strong>es</strong> todo el combate de tu planeta&nbsp;: no hay un segundo combate orbital separado después para tus torretas. Apuntan con su propia precisión (una escolta poco precisa estacionada a su lado no degrada su disparo), y sufren en él <strong>pérdidas reales</strong>, esté o no activo el modo ataque del planeta:</p>
            <ul>
                <li><strong>si tu bando gana</strong>, tus torretas pierden la misma fracción que la armadura perdida por tu bando (como máximo el 95&nbsp;%); los escudos y la Base espacial quedan intactos;</li>
                <li><strong>si tu bando se derrumba</strong>, todas las torretas, el Escudo, el Gran escudo y la Base espacial son destruidos, la cola de producción de la página Defensa se pierde (torretas, Legionarios, Mechas, bombas o interceptores aún no entregados incluidos) y el modo ataque se corta. Los Legionarios, Mechas y trabajadores ya en tierra, los edificios y las bombas o interceptores en stock no se ven afectados.</li>
            </ul>
            <p>Un planeta custodiado por una flota <strong>armada</strong> (armas de nave) — la tuya o la de un miembro de tu alianza — no puede por tanto ser saqueado ni invadido sin que una batalla decida antes; una sonda o un cargo solos no bastan.</p>

            <h2 id="escudos">El duelo de escudos</h2>
            <p>Cada salva choca primero con el escudo adversario. Su <strong>potencia de perforación</strong> vale&nbsp;:</p>
            <p><code>misiles ÷ 7 + plasma × 4 + láseres × 2</code></p>
            <p>El plasma sobresale contra los escudos, los misiles los perforan mal — sea cual sea el tamaño del combate, diez contra diez como cien millones contra cien millones. En cada salva, la parte de daños que supera la potencia de perforación la absorbe el escudo adversario hasta agotar su carga&nbsp;; el resto, y todo lo que desborda una vez vacío el escudo, golpea directamente el casco. Un escudo nunca puede por tanto bloquear una salva entera&nbsp;: frente a un adversario armado, tu casco siempre encaja algo, desde la primera ronda.</p>
            <p>Ejemplo: una salva disparada por 700 misiles, 200 plasma y 300 láseres perfora hasta 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1&nbsp;500</strong> puntos; solo lo que supere esos 1&nbsp;500 puntos puede ser absorbido por el escudo adversario.</p>
            <p>El escudo de una flota no es una reserva que vuelve automáticamente al 100&nbsp;% antes de cada batalla&nbsp;: es una <strong>carga persistente</strong> que se gasta durante el combate y solo sube un 10&nbsp;% cada 3 horas, de forma continua (30 horas para pasar de cero a lleno), incluso cuando divides, fusionas o disuelves la flota, o transfieres naves entre la flota y el suelo del planeta. El informe de combate muestra esta carga al inicio y al final de la batalla&nbsp;; la lista de flotas muestra el porcentaje de cada flota, y la página de gestión de flota indica el escudo realmente llevado al combate, la capacidad total, el porcentaje actual y el tiempo restante hasta la carga completa. El stock de naves en tierra también lleva una carga, que no se recarga&nbsp;: toda flota creada o completada desde ese suelo la hereda, y se muestra en la ventana de creación de flota y en la pestaña «&nbsp;Naves&nbsp;» de la gestión de flota.</p>
            <p>Una excepción: el escudo fijo aportado por una <strong>Nave nodriza</strong> (5&nbsp;250 puntos por flota, una sola vez incluso con varias Naves nodriza) nunca se descarga de una batalla a otra — absorbe golpes durante el combate y luego vuelve lleno en el siguiente; la carga solo gasta el escudo de tus demás naves. Por eso la página de gestión muestra también el valor absoluto del escudo, no solo el porcentaje.</p>

            <h2 id="rondas">Las rondas de disparo</h2>
            <p>El combate dura como máximo <strong>100 rondas</strong>. En cada ronda, cada bando dispara una salva que inflige&nbsp;:</p>
            <p><code>(misiles + plasma ÷ 2 + láseres × 2) × multiplicador</code></p>
            <p>El multiplicador proviene de una tirada de precisión: el juego saca un número entre la precisión del bando y 100 y lo divide entre 80, para un resultado entre <strong>×0,3 y ×1,2</strong>. Ninguna salva falla. Una precisión alta no hace más fuertes tus mejores salvas, elimina las malas tiradas. La parte que atraviesa el escudo adversario (ver más arriba) se imputa a la armadura total de ese bando.</p>

            <h2 id="final">Fin del combate</h2>
            <ul>
                <li><strong>La armadura de un bando cae a 0</strong> — queda vencido, todas sus flotas son destruidas con su carga.</li>
                <li><strong>100 rondas alcanzadas</strong> — gana el bando que conserva más armadura; en caso de empate perfecto, gana el atacante.</li>
                <li><strong>Red del vencedor</strong> — incluso muy maltrecho, el bando vencedor nunca pierde más del 95&nbsp;% de su armadura de partida: una victoria nunca es un aniquilamiento, sea cual sea la diferencia de poder.</li>
            </ul>

            <h2 id="perdidas">Tus pérdidas: lo que has encajado</h2>
            <p>La regla cabe en una frase: <strong>tus pérdidas se derivan de los daños de casco que has encajado realmente</strong> — nunca de los que ha absorbido tu escudo, que no cuesta ninguna nave. Esos daños de casco se reparten entre tu <strong>pantalla</strong> (Cazadores, Cazadores pesados, Cazadores de plasma: las únicas naves sin escudo) y tu <strong>línea</strong> (las demás naves de combate, de las Corbetas a los Destructores), en proporción a la armadura de cada grupo&nbsp;: cada tipo pierde la misma fracción de sí mismo. El informe muestra dos contadores: daños de casco y daños de escudo.</p>
            <p>Tu pantalla no protege tu línea indefinidamente&nbsp;: desvía hacia sí misma como máximo la <strong>mitad</strong> de los daños que iban dirigidos a la línea, y solo mientras le quede armadura para encajarlos — un solo cazador no puede absorber los daños de toda una flota. Sin pantalla alguna, la línea encaja la totalidad de los daños de casco.</p>
            <p>Tus naves utilitarias (cargos, recicladores, barcazas, sondas, colonizadores, Nave nodriza) no sufren ninguna pérdida mientras tu bando gane: solo las naves de combate encajan.</p>
            <p>Consecuencias directas: si el enemigo apenas te toca, tus pérdidas son casi nulas; un enemigo diez veces más peligroso te cuesta aproximadamente diez veces más — cazadores incluidos. El bando vencido, en cambio, lo pierde todo.</p>

            <h2 id="despues">Después del combate</h2>
            <ul>
                <li><strong>Escombros</strong> — el 40&nbsp;% del coste de construcción (niobium y agua) de cada nave destruida, de los dos bandos, cae a la órbita (20&nbsp;% cuando interviene un Cthulhu o un alien). Las naves pagadas en Puntos de Guerra no dejan escombros. La carga de las flotas aniquiladas se añade. Un reciclador en la flota victoriosa empieza enseguida a recoger, si tiene espacio en la bodega.</li>
                <li><strong>Puntos de Guerra</strong> — la ganancia se calcula sobre la firma del bando vencido: firma total ÷ número de flotas de ese bando ÷ 100 (÷ 500 frente a un Cthulhu o un alien), redondeado al entero. Cada flota del bando vencedor recibe esa cantidad, y el propietario del planeta cobra otro tanto si sus defensas estaban del lado ganador. El bando vencido recibe exactamente una quinta parte de ese baremo, calculado sobre sus propias flotas. La investigación política «Puntos de Guerra» añade un 10&nbsp;% por nivel. Ejemplo: una flota de 100 Cazadores (firma 1 cada uno) destruida aporta 1 PDG; un Destructor (firma 270), unos 3. Destruir una flota sin armas (cargos, sondas, recicladores) no aporta nada.</li>
                <li><strong>Héroes</strong> — un héroe principal a bordo de una flota destruida puede ser capturado por el vencedor (probabilidad, nunca garantizado). Un <strong>héroe secundario</strong> vencido sigue una regla distinta y definitiva, sin azar: consulta el artículo <em>Héroes secundarios</em>.</li>
                <li><strong>Informes</strong> — cada comandante recibe el detalle (menú <strong>Informe</strong>, pestaña <strong>Combates</strong>): fuerzas, salvas, daños encajados, pérdidas, y la suerte de todo héroe secundario capturado o ejecutado.</li>
                <li><strong>Y después</strong> — las flotas supervivientes se quedan en el lugar: nada las devuelve automáticamente a casa.</li>
            </ul>

            <h2 id="consejos">Consejos</h2>
            <ul>
                <li>Mantén siempre una <strong>pantalla de cazadores</strong>: barata, encaja una parte de los daños de casco en lugar de tus naves pesadas.</li>
                <li>Invierte en el <strong>escudo</strong>: cuanto más cargado está, más daños absorbe antes de que alcancen tu casco — pero ningún escudo detiene una salva entera, tu casco siempre encaja una parte. Déjalo recargarse entre dos batallas.</li>
                <li>Sube el <strong>plasma</strong> para perforar rápido los escudos adversarios, los <strong>láseres</strong> para los daños de casco.</li>
                <li>Elige la <strong>política de alianza</strong> mirando la de tus objetivos favoritos: +20&nbsp;% de armas en ataque.</li>
            </ul>

    invasion:
        title: "Invasión de planeta"
        category: "combat"
        order: 2
        tags: "invasión,planeta,soldados,tanques,barcazas,conquista,despliegue,táctica,cancelar"
        summary: "Conquistar un planeta enemigo: barcazas, desembarco, combate en tierra y despliegues tácticos."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Principio</h2>
            <p>La invasión es un ataque para <strong>tomar posesión</strong> de un planeta enemigo. Tu flota desembarca Legionarios (mediante barcazas) que se enfrentan a la guarnición en tierra.</p>
            <p>Es distinto de un <strong>saqueo</strong> (que saquea sin tomar el planeta): una invasión lograda te da el planeta entero.</p>
            <p>Dos formas de lanzarla: enviar la flota en misión «Invadir» hacia el planeta, o hacer clic en «Invadir» cuando tu flota ya está en órbita del objetivo (el asalto tiene entonces lugar de inmediato).</p>

            <h2 id="conditions">Lo que hace falta para invadir</h2>
            <ul>
                <li>Jugar en un servidor en <strong>modo PvP</strong> (p. ej.: Dominación, Battle Royale, Search &amp; Destroy, Servidor de pago).</li>
                <li>Tener <strong>barcazas</strong> y <strong>Legionarios</strong> a bordo de la flota.</li>
                <li>El objetivo debe ser un planeta habitado de otro jugador: no un comerciante, no un miembro de tu alianza, ni una alianza con la que tengas una Alianza defensiva, un Pacto de no agresión o un Acuerdo de paz.</li>
                <li>El objetivo no debe estar protegido por el estatus de principiante. Lanzar una invasión durante tu propia protección te la hace perder (el juego pide confirmación).</li>
                <li>Tu flota no debe estar ya metida en un combate programado.</li>
            </ul>
            <p>No es necesario pertenecer a una alianza.</p>

            <h2 id="barges">El papel de las barcazas</h2>
            <p>Las barcazas son los vehículos que desembarcan tus Legionarios en tierra. Cada barcaza transporta <strong>1&nbsp;000 Legionarios</strong>, +25&nbsp;% por nivel de la investigación política «Invasiones planificadas» (1&nbsp;250 en el nivel 1, 1&nbsp;500 en el nivel 2…).</p>
            <p>Si tienes más Legionarios que plazas, los excedentes <strong>se quedan en órbita y no combaten</strong>. Los Mechas embarcados no participan en el asalto: solo los Legionarios atacan en tierra. En caso de fracaso, tus barcazas son <strong>capturadas por el defensor</strong>.</p>

            <h2 id="annuler">Cancelar una invasión</h2>
            <p>Una flota enviada a invadir puede ser llamada de vuelta durante los <strong>2 minutos</strong> siguientes a su salida (botón «Cancelar»): vuelve enseguida a su punto de partida, pero el combustible pagado se pierde. Pasado ese plazo, la invasión tendrá lugar a la llegada. Una invasión lanzada desde la órbita («Invadir») se resuelve de inmediato y no se cancela.</p>

            <h2 id="orbital">Fase 1 — Combate en órbita (a veces)</h2>
            <p>Dos situaciones pueden detenerte incluso antes del desembarco:</p>
            <ul>
                <li>El planeta objetivo ha activado su <strong>modo ataque</strong>: desde tu llegada, sus torretas y escudos se enfrentan a tu flota. Si <strong>pierdes</strong>, tu flota es destruida — la invasión se detiene en seco. Si <strong>ganas</strong>, las defensas orbitales son aniquiladas y tu flota continúa (debilitada). Un planeta sin torretas pierde sus escudos y su base espacial sin combatir en cuanto llega tu saqueo o tu invasión.</li>
                <li>El planeta objetivo está custodiado por una flota <strong>armada</strong> (armas de nave) del propietario, o de un miembro de su alianza, ya en órbita (una sonda o un cargo solos no cuentan): tu llegada desencadena una <strong>batalla</strong> contra ese defensor y sus torretas reunidos, 5 minutos más tarde — aunque el planeta no esté en modo ataque. Esta batalla nunca se desencadena contra un socio de paz, de pacto, una alianza defensiva o tu propia alianza, ni en un servidor PvE: respeta las mismas reglas diplomáticas que una invasión normal. Anula tu invasión en curso&nbsp;: si la ganas, tienes que <strong>relanzar</strong> una invasión para desembarcar realmente — y si el planeta sigue custodiado en ese momento, hacer clic en «&nbsp;Invadir&nbsp;» desde la órbita se <strong>rechaza</strong> de la misma forma&nbsp;: activa primero el modo ataque de tu propia flota para forzar el combate. Como una invasión lleva siempre Legionarios, esta condición de batalla se cumple automáticamente por el lado atacante&nbsp;: la batalla se desencadena por tanto lleve o no tu flota armas de nave.</li>
            </ul>
            <p><strong>Trampa que hay que conocer&nbsp;: una flota de invasión sin nave de combate es aniquilada en esta batalla.</strong> Legionarios y barcazas bastan para que una invasión despegue, pero si tu flota no lleva ningún arma de nave, entra en esta batalla preliminar con una potencia de fuego nula&nbsp;: los defensores la aniquilan por completo, barcazas y Legionarios incluidos, antes incluso del desembarco. Lo mismo ocurre frente a un planeta en modo ataque: sus torretas destruyen de oficio una flota sin arma de nave. <strong>Escolta siempre tus flotas de invasión con naves de combate</strong> — consulta el artículo <em>Raids (saqueo)</em> para la misma trampa por el lado del saqueo.</p>

            <h2 id="combat">Fase 2 — Combate en tierra</h2>
            <p>El combate en tierra se desarrolla en <strong>10 rondas como máximo</strong>. En cada ronda, el asaltante inflige la décima parte de su potencia de ataque a la guarnición, que responde con la décima parte de su potencia de defensa.</p>
            <table>
                <thead>
                    <tr><th>Unidad</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionario</strong></td><td>Ataque (5 a 7 por ronda en invasión) y defensa (6, +5&nbsp;% por nivel de Alambradas).</td></tr>
                    <tr><td><strong>Mecha</strong></td><td>Defensa pesada (2&nbsp;200), máx. 500 por planeta. No participa en el asalto.</td></tr>
                    <tr><td><strong>Trabajador</strong></td><td>Defensa pasiva (1 cada uno), <strong>únicamente en invasión</strong> (no en saqueo).</td></tr>
                </tbody>
            </table>
            <p><strong>El atacante gana únicamente si</strong> todas las tropas del defensor son eliminadas <strong>y</strong> le queda al menos 1 Legionario vivo. Si no, <strong>el defensor gana por ventaja del terreno</strong>. Detalle de las potencias: artículo <em>Comprender la potencia de las tropas</em>.</p>

            <h2 id="deploiement">Los despliegues tácticos del defensor</h2>
            <p>El defensor puede haber elegido un <strong>despliegue táctico</strong> invisible para ti (solo su propio informe lo indica). Hay que tenerlo presente: puede dar la vuelta a una situación que parecía ganada de antemano.</p>
            <table>
                <thead>
                    <tr><th>Despliegue</th><th>Efecto</th><th>Orden de las pérdidas de la guarnición</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Equilibrado</strong></td><td>Ningún bonus ni penalización.</td><td>Legionarios, luego Mechas, luego trabajadores.</td></tr>
                    <tr><td><strong>Fortificado</strong></td><td>La respuesta de la guarnición gana un 30&nbsp;% y luego pierde un 20&nbsp;%: en total <strong>+4&nbsp;%</strong> de daños infligidos al asaltante. Las unidades no se vuelven más duras de matar.</td><td>Como Equilibrado.</td></tr>
                    <tr><td><strong>Guerrilla</strong></td><td>En la respuesta, cada trabajador cuenta 2,5 veces (+150&nbsp;%) y cada Legionario la mitad (−50&nbsp;%).</td><td>Trabajadores primero, luego Legionarios, luego Mechas.</td></tr>
                    <tr><td><strong>Ultimo bastion</strong></td><td>+50&nbsp;% de respuesta en cuanto la guarnición cae por debajo del 30&nbsp;% de su efectivo de partida (en número de unidades), hasta el final del combate.</td><td>Legionarios, luego trabajadores, luego Mechas.</td></tr>
                    <tr><td><strong>Tierra quemada</strong></td><td>Ningún bonus en combate. Si el asaltante gana, en saqueo como en invasión, el 50&nbsp;% del niobium, del agua y del uranium que quedan en el planeta se destruye.</td><td>Como Equilibrado.</td></tr>
                </tbody>
            </table>
            <p>Los trabajadores solo combaten en invasión. El defensor puede cambiar de despliegue libremente, en cualquier momento, en la página <strong>Defensa</strong>.</p>

            <h2 id="victoire">Si ganas la invasión</h2>
            <ul>
                <li><strong>Captura</strong> — el planeta pasa a ti, con sus edificios. Los trabajadores se reducen a <strong>2&nbsp;000</strong>. Si el defensor había elegido Tierra quemada, la mitad de su niobium, de su agua y de su uranium se destruye antes de la captura.</li>
                <li><strong>Planeta Cthulhu</strong> — si recuperas un planeta capturado por los Cthulhu, queda liberado (edificios reiniciados, recompensa en uranium).</li>
                <li><strong>¿Sin espacio para colonizar?</strong> Tus planetas colonizados deben mantenerse por debajo de Terraformación + 2, más el nivel de la investigación política «Imperio sin fronteras». Más allá, el planeta conquistado se convierte en una base Cthulhu — o vuelve a quedar deshabitado en un servidor sin Cthulhu: no te lo quedas, pero cobras tus puntos de guerra.</li>
            </ul>
            <p>Las <strong>colas de producción</strong> no siguen al planeta capturado&nbsp;: las naves y las defensas (torretas o tropas) ya pagadas pero aún no entregadas se pierden en la captura — un pedido hecho por el vencido nunca cambia de manos. Lo que se entregó antes del asalto, en cambio, está en tierra y sigue al planeta.</p>
            <p>Si el planeta capturado alberga a un <strong>héroe secundario</strong> adversario, su suerte se decide de inmediato: lo <strong>capturas</strong> si posees una Prisión (nivel 1 o más), si no es <strong>ejecutado</strong>. Un saqueo, en cambio, nunca toma el planeta y por tanto nunca pone en juego a un héroe. Detalles en el artículo <em>Héroes secundarios</em>.</p>

            <h2 id="gameover">Eliminación del defensor</h2>
            <p>Si el defensor pierde su <strong>último planeta</strong>, queda eliminado del servidor. Te quedas con todo: sus Bitcoins, sus flotas supervivientes y sus Puntos de Guerra.</p>

            <h2 id="defaite">Si pierdes la invasión</h2>
            <p>Las <strong>barcazas son capturadas por el defensor</strong>. Los Legionarios muertos en tierra se pierden; los que han aguantado hasta la 10.ª ronda, y los que se quedaron en órbita por falta de plazas, vuelven a tu flota — sin barcazas para volver a desembarcarlos. Es una derrota costosa: sondea antes de invadir.</p>

    raid:
        title: "Raids (saqueo)"
        category: "combat"
        order: 3
        tags: "raid,saqueo,robo,recursos,búnker,fuerte defensivo,barcazas,tierra quemada"
        summary: "Saquear los recursos de un planeta enemigo sin intentar conquistarlo."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">¿Qué es un saqueo?</h2>
            <p>Un saqueo es un ataque terrestre cuyo objetivo es <strong>robar recursos</strong>. No tomas el planeta: te vas con el botín. Consecuencia importante: un saqueo, aunque tenga éxito, nunca toma el planeta, por lo que <strong>ningún héroe secundario es nunca capturado ni ejecutado en él</strong>, seas atacante o defensor.</p>
            <p>Hacen falta los mismos medios que una invasión: <strong>barcazas</strong> y <strong>Legionarios</strong> a bordo, contra el planeta de otro jugador que no esté en tu alianza ni vinculado a ella por una Alianza defensiva, un Pacto de no agresión o un Acuerdo de paz (consulta <em>Invasión de planeta</em>). Envía la flota en misión «Saquear», o haz clic en «Saquear» cuando ya esté en órbita. Una base Cthulhu no se saquea.</p>

            <h2 id="difference">Saqueo vs Invasión</h2>
            <table>
                <thead>
                    <tr><th></th><th>Saqueo</th><th>Invasión</th></tr>
                </thead>
                <tbody>
                    <tr><td>Objetivo</td><td>Robar niobium, agua, uranium</td><td>Tomar posesión del planeta</td></tr>
                    <tr><td>Defensores</td><td>Legionarios + Mechas</td><td>Legionarios + Mechas + Trabajadores</td></tr>
                    <tr><td>Ataque de un Legionario</td><td>5 a 6 por ronda (menos imprevisible)</td><td>5 a 7 por ronda (más imprevisible)</td></tr>
                    <tr><td>Pérdida de las barcazas si hay derrota</td><td>No</td><td>Sí (capturadas por el defensor)</td></tr>
                </tbody>
            </table>

            <h2 id="combat">Cómo se desarrolla</h2>
            <p>Mismos pasos que la invasión (combate orbital eventual y luego 10 rondas en tierra), <strong>pero los trabajadores no defienden</strong>. Los Legionarios y Mechas del defensor están solos.</p>
            <p><strong>Planeta custodiado por una flota en órbita</strong> — si el objetivo está protegido por una flota <strong>armada</strong> (armas de nave) del propietario, o de un miembro de su alianza (una sonda o un cargo solos no bastan), tu saqueo desencadena primero una batalla contra ese defensor y las torretas del planeta, 5 minutos después de tu llegada. Esta batalla nunca se desencadena contra un socio de paz, de pacto, una alianza defensiva o tu propia alianza, ni en un servidor PvE. El saqueo no tiene lugar a continuación&nbsp;: si ganas esa batalla, tienes que <strong>relanzar</strong> un saqueo para saquear realmente — y si el planeta sigue custodiado, hacer clic en «&nbsp;Saquear&nbsp;» desde la órbita también se <strong>rechaza</strong>&nbsp;: activa primero el modo ataque de tu propia flota para forzar el combate. Por el lado atacante, esta batalla solo se desencadena si tu flota de saqueo es ella misma ofensiva — armas de nave, Legionarios o Mechas a bordo.</p>

            <h2 id="raid-solo-tropas">Un saqueo solo de tropas es aniquilado</h2>
            <p>Llevar Legionarios o Mechas basta para desencadenar esta batalla — pero si tu flota de saqueo no lleva <strong>ningún arma de nave</strong>, entra en ella con una potencia de fuego nula. Los defensores la aniquilan por completo, sin perder ni una sola nave en el otro bando. Frente a un planeta en modo ataque, es igual: sus torretas destruyen de oficio una flota sin arma de nave. <strong>Escolta siempre tus transportes de tropas</strong>&nbsp;: es la sorpresa más costosa que este sistema puede depararte.</p>

            <h2 id="pillage">El pillaje (en caso de victoria)</h2>
            <p>Recuperas tantos recursos como espacio quede en tus bodegas tras el combate: cada Legionario superviviente ocupa una plaza, cada Mecha 500 (una barcaza ofrece 1&nbsp;000 plazas). Lleva cargos para irte con un botín de verdad. Los recursos se toman en este orden:</p>
            <ol>
                <li><strong>Niobium</strong> primero.</li>
                <li>Luego <strong>Agua</strong>.</li>
                <li>Por último <strong>Uranium</strong> (si queda espacio).</li>
            </ol>

            <h2 id="bunker">El Fuerte defensivo protege una parte</h2>
            <p>El <strong>Fuerte defensivo</strong> (búnker) del defensor <strong>pone a salvo el 5&nbsp;% del almacenamiento máx. por nivel</strong>. Ejemplos:</p>
            <ul>
                <li>Fuerte defensivo nivel 5 → 25&nbsp;% del almacenamiento máx. protegido en niobium y agua.</li>
                <li>Fuerte defensivo nivel 10 → 50&nbsp;% protegido.</li>
            </ul>
            <p>El uranium se protege de la misma forma: <strong>un 5&nbsp;% de tu stock de uranium por nivel de Fuerte defensivo</strong> (como el uranium no tiene almacenamiento máx., la protección se aplica al stock del momento).</p>

            <h2 id="scorched">Cuidado con la Tierra quemada</h2>
            <p>Si el defensor ha elegido el <strong>despliegue táctico Tierra quemada</strong> y pierde, <strong>la mitad de todo lo que queda</strong> en el planeta (niobium, agua, uranium) se destruye, incluida la parte que el Fuerte defensivo había puesto a salvo. Te vas con tu botín, pero el adversario no puede recuperarlo todo después.</p>

    nuclear:
        title: "Ataque nuclear"
        category: "combat"
        order: 4
        tags: "nuclear,bomba,uranium,destrucción,interceptor"
        summary: "El arma definitiva para destruir los edificios clave de un enemigo — siempre que no tenga defensa antimisiles."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Lo que necesitas</h2>
            <ul>
                <li>La investigación <strong>Armamento</strong> en el nivel 5 y un edificio <strong>Base nuclear</strong>.</li>
                <li><strong>Uranium</strong> (muy escaso).</li>
                <li>Una <strong>bomba nuclear</strong>, fabricada en la página <strong>Defensa</strong>: 500 uranium y 25&nbsp;000 Bitcoins, 6 horas por bomba (aceleradas por la Fábrica de armamento y la Industria pesada). Un planeta almacena como máximo tantas bombas como el nivel de su Base nuclear.</li>
            </ul>
            <p><strong>Lanzar el ataque</strong> — desde el <strong>mapa espacial</strong>, selecciona el planeta enemigo y luego «Enviar un misil nuclear». El juego toma una bomba de uno de tus planetas; llega en <strong>30 minutos</strong>, sea cual sea la distancia, y no se puede cancelar. Apuntar a otra galaxia requiere la Tecnología hiperespacial. Un planeta protegido por el estatus de principiante no puede ser objetivo, y lanzar un ataque durante tu propia protección te la hace perder (el juego pide confirmación).</p>

            <h2 id="degats">¿Qué hace una bomba que impacta?</h2>
            <p>La bomba <strong>destruye un nivel de edificio</strong>, empezando por los más estratégicos:</p>
            <ol>
                <li><strong>Metrópoli</strong> — pérdida de 1 nivel: −80&nbsp;000 trabajadores de capacidad (los que superan la nueva capacidad desaparecen) y producción de trabajadores reducida.</li>
                <li><strong>Gran ciudad</strong> — pérdida de 1 nivel: −25&nbsp;000 trabajadores de capacidad, misma regla.</li>
                <li><strong>Fuerte defensivo</strong> (búnker) — pérdida de 1 nivel: protección contra el saqueo reducida y −15&nbsp;000 Legionarios de capacidad.</li>
                <li><strong>Cuartel</strong> — pérdida de 1 nivel: −5&nbsp;000 Legionarios de capacidad.</li>
                <li><strong>Campo de esclavos</strong> — pérdida de 1 nivel.</li>
            </ol>
            <p>La bomba golpea el primer edificio presente en ese orden; si el planeta no tiene ninguno, no hace ningún daño. Los Legionarios por encima de la nueva capacidad también desaparecen. En todos los casos, la bomba se consume.</p>

            <h2 id="regle">Reglas especiales</h2>
            <ul>
                <li>Una bomba en vuelo <strong>no puede ser interceptada</strong> por una flota en órbita. Va derecha a su objetivo.</li>
                <li>La única forma de detenerla: el <strong>misil interceptor</strong> del defensor.</li>
            </ul>

            <h2 id="anti">La defensa: el misil interceptor</h2>
            <p>Si el planeta objetivo posee al menos un <strong>misil interceptor</strong>, la bomba es neutralizada automáticamente:</p>
            <ul>
                <li>La bomba es <strong>destruida</strong>.</li>
                <li>Se consumen <strong>1 a 3 interceptores</strong> (nunca más que el stock).</li>
                <li>Los dos jugadores reciben un informe.</li>
            </ul>
            <p>Los misiles interceptores se fabrican en la página <strong>Defensa</strong>: 10&nbsp;000 niobium y 200 uranium, 3 horas cada uno (investigación Armamento nivel 5 y Base nuclear). Un planeta almacena como máximo 4 por nivel de Base nuclear.</p>
            <p>Moraleja: una base estratégica siempre vale unos cuantos interceptores. Sin ellos, es vulnerable.</p>

    defense:
        title: "Defender tus planetas"
        category: "combat"
        order: 5
        tags: "defensa,soldados,tanques,mechas,torreta,escudo,gran escudo,búnker,fuerte defensivo,orbital,táctica,despliegue,estadísticas,potencia,tiempo,coste"
        summary: "Las 3 capas de defensa: orbital (torretas), táctica (despliegue), terrestre (Legionarios + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Las 3 capas de defensa</h2>
            <ol>
                <li><strong>Defensa orbital</strong> — torretas, escudos, base espacial. Interceptan la flota antes de que desembarque.</li>
                <li><strong>Despliegue táctico</strong> — una elección estratégica que modifica la respuesta de tus tropas en tierra.</li>
                <li><strong>Defensa terrestre</strong> — Legionarios, Mechas, trabajadores (para las invasiones).</li>
            </ol>

            <h2 id="mode-attaque">Activar el modo ataque de tu planeta</h2>
            <p>Si tu planeta posee <strong>al menos una torreta</strong>, puedes activar el <strong>modo ataque</strong>. En este modo, toda flota extranjera que se estacione en órbita — salvo comerciantes, miembros de tu alianza y alianzas vinculadas a la tuya por una Alianza defensiva — es atacada en un <strong>combate orbital</strong> 5 minutos después de su llegada, esté ella misma en modo ataque o no. Un saqueo o una invasión se enfrenta desde su llegada.</p>
            <ul>
                <li><strong>Victoria</strong>: la flota enemiga es destruida, tus torretas pierden la misma fracción que la armadura que has perdido, y cobras <strong>puntos de guerra</strong> iguales a su firma ÷ 100 (÷ 500 frente a un Cthulhu).</li>
                <li><strong>Derrota</strong>: todas tus torretas, escudos, tu base espacial y toda tu cola de producción de la página Defensa (Legionarios, Mechas, bombas o interceptores aún no entregados incluidos) son aniquilados — las tropas ya en tierra y tus stocks de bombas y de interceptores quedan intactos; el modo ataque se <strong>desactiva automáticamente</strong> (un planeta sin torreta no puede mantenerlo activo), y la flota continúa hacia el combate en tierra si se trata de un saqueo o una invasión. El asaltante no gana ningún punto de guerra por arrasar tus defensas.</li>
            </ul>
            <p>Sin torreta, tus escudos y la base espacial son destruidos <strong>sin siquiera combatir</strong> en cuanto llega un saqueo o una invasión enemiga.</p>
            <p>Dos lugares para activarlo: la página <strong>Defensa</strong> de un planeta, o la página <strong>Planetas</strong>, que muestra el estado de cada planeta (una mira junto a sus defensas, en la que se puede hacer clic para alternar) y ofrece <strong>«Activar todo»</strong> / <strong>«Desactivar todo»</strong> sobre todo el imperio. La alternancia en grupo se salta los planetas sin torreta o ya metidos en un combate, y te dice cuántos se han ignorado.</p>
            <p><strong>Atención</strong>: activar el modo ataque en un planeta que una flota enemiga ya sobrevuela desencadena el combate orbital <strong>cinco minutos más tarde</strong>. En alternancia en grupo, pueden salir varias batallas de golpe — el mensaje te indica cuántas.</p>
            <p><strong>Lo que el asaltante trae consigo.</strong> La flota que ataca tus torretas combate con <strong>todos sus bonus</strong>&nbsp;: los bonus de alianza de su comandante (misiles, láseres, plasma, blindaje, escudo, precisión) y los bonus de equipamiento de su héroe embarcado. Esto vale en los dos sentidos: tus propias flotas conservan sus bonus cuando eres tú quien asalta un planeta en modo ataque, y las cifras de los informes orbitales están a la misma escala que las de los informes espaciales.</p>

            <h2 id="defensas-y-tus-flotas">Tus defensas disparan también sin el modo ataque</h2>
            <p>El modo ataque no es la única forma de hacer disparar tus torretas. En cuanto una de tus flotas — o una flota <strong>armada</strong> de un miembro de tu alianza — está en órbita del planeta en el momento en que se desencadena allí un combate espacial, tus defensas se unen automáticamente a ese combate, con el modo ataque activo o no (un planeta que no tiene nada que defender — ninguna torreta, ningún escudo, ninguna base espacial — nunca participa). Es entonces una <strong>sola batalla</strong>: ningún segundo combate orbital separado después. En esta batalla, el bonus de armadura de tu <strong>base espacial</strong> (+20&nbsp;%) beneficia a la vez a tus torretas y a tus escudos, y la afinidad militar de tu <strong>héroe destinado</strong> refuerza el disparo de tus propias torretas y puede aportar Intimidación o Táctico a todo tu bando, exactamente como un héroe de flota. Tus torretas apuntan en ella con su propia precisión (multiplicador medio ×1,06, por encima de lo que una flota puede alcanzar), y sufren <strong>pérdidas reales</strong> — proporcionales a los daños encajados si tu bando gana, <strong>totales</strong> (torretas, escudos, base espacial, cola de producción de la página Defensa, modo ataque cortado) si tu bando cae. Cobras la parte de <strong>puntos de guerra</strong> de tu planeta cada vez que tu bando gana esta batalla — incluso si no has comprometido ninguna flota propia.</p>
            <p>Consecuencia para tus adversarios&nbsp;: un planeta custodiado por una de tus flotas <strong>armada</strong> (armas de nave) o una flota armada de un miembro de tu alianza (una sonda o un cargo solos no cuentan) no puede ser saqueado ni invadido sin batalla previa, ya sea que el asaltante llegue recién o haga clic en «&nbsp;Saquear&nbsp;»/«&nbsp;Invadir&nbsp;» desde la órbita — y esta batalla nunca arranca contra un socio de paz, de pacto, una alianza defensiva, tu propia alianza ni en un servidor PvE.</p>
            <p>Sin ninguna flota en órbita y sin modo ataque, tus torretas no disparan: un saqueo o una invasión pasa directamente al combate en tierra.</p>
            <p><strong>¿No has comprometido ninguna flota propia&nbsp;?</strong> Recibes de todos modos un informe dedicado que te indica si tus defensas han resistido o han sido aniquiladas, con las pérdidas de torretas detalladas, y tu parte de puntos de guerra si has ganado&nbsp;: nunca te quedas sin saber la suerte de tu planeta.</p>

            <h2 id="combat-orbital">El combate orbital en detalle</h2>
            <p>Las torretas disparan a la flota enemiga al ritmo de las rondas (100 como máximo). La <strong>Base espacial</strong> añade +20&nbsp;% a la armadura de todas las defensas. Los escudos añaden 50&nbsp;000 (Escudo) o 600&nbsp;000 (Gran escudo) puntos a la armadura del planeta: cuanto mayor es tu armadura total, más pequeña es la parte perdida — y por tanto la parte de torretas destruidas.</p>
            <p>Tus torretas disparan <strong>desde la primera ronda</strong>, sea cual sea la flota de enfrente: el escudo de una nave nunca repele su salva de apertura. Ese escudo es una reserva que encaja daños hasta agotarse. Cada salva lo atraviesa de entrada hasta su <strong>potencia de perforación</strong> (plasma ×4, láser ×2, misiles ÷ 7)&nbsp;; el resto desgasta el escudo, y lo que lo desborda golpea el casco. Una defensa compuesta únicamente de lanzamisiles queda por tanto en desventaja frente a una flota con gran escudo — pero dispara, causa pérdidas y deja escombros.</p>
            <p>Incluso si la flota enemiga gana, su pantalla de cazadores no la protege indefinidamente&nbsp;: tus torretas infligen pérdidas reales también a sus naves más pesadas, en proporción a los daños que encaja — en el peor de los casos para ella, el 95&nbsp;% de su armadura de partida. Defenderse siempre le cuesta algo al atacante, aunque gane. Al cabo de 100 rondas, el bando que conserva más armadura gana (el asaltante en caso de empate).</p>
            <p>En este combate orbital, ni el +20&nbsp;% de política de alianza ni el bonus de alianza «defensa planetaria» se aplican: solo actúan en las batallas en que tus defensas combaten junto a una flota.</p>

            <h2 id="deploiement">El despliegue táctico</h2>
            <p>Cada planeta puede elegir un <strong>despliegue táctico</strong>, en la página <strong>Defensa</strong>, y cambiarlo libremente en cualquier momento. Es <strong>invisible para el atacante</strong> — es tu carta oculta.</p>
            <table>
                <thead>
                    <tr><th>Despliegue</th><th>Efecto</th><th>Orden de las pérdidas de tu guarnición</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Equilibrado</strong></td><td>Ningún bonus ni penalización.</td><td>Legionarios, luego Mechas, luego trabajadores.</td></tr>
                    <tr><td><strong>Fortificado</strong></td><td>La respuesta de tu guarnición gana un 30&nbsp;% y luego pierde un 20&nbsp;%: en total <strong>+4&nbsp;%</strong> de daños infligidos al asaltante. Tus unidades no se vuelven más duras de matar.</td><td>Como Equilibrado.</td></tr>
                    <tr><td><strong>Guerrilla</strong></td><td>En la respuesta, cada trabajador cuenta 2,5 veces (+150&nbsp;%) y cada Legionario la mitad (−50&nbsp;%).</td><td>Trabajadores primero, luego Legionarios, luego Mechas.</td></tr>
                    <tr><td><strong>Ultimo bastion</strong></td><td>+50&nbsp;% de respuesta en cuanto tus tropas caen por debajo del 30&nbsp;% de su efectivo de partida (en número de unidades), hasta el final del combate.</td><td>Legionarios, luego trabajadores, luego Mechas.</td></tr>
                    <tr><td><strong>Tierra quemada</strong></td><td>Ningún bonus en combate. Si pierdes, saqueo o invasión, el 50&nbsp;% de tu niobium, de tu agua y de tu uranium restantes se destruye, incluida la parte protegida por el Fuerte defensivo.</td><td>Como Equilibrado.</td></tr>
                </tbody>
            </table>
            <p>Los trabajadores solo combaten en invasión.</p>

            <h2 id="combat-sol">El combate en tierra</h2>
            <p>Se juega en <strong>10 rondas como máximo</strong>. En cada ronda, el asaltante inflige la décima parte de su potencia de ataque a tu guarnición, que responde con la décima parte de su potencia de defensa. El asaltante solo gana si elimina toda tu guarnición conservando al menos un Legionario. Si nadie gana en 10 rondas, <strong>el atacante es rechazado</strong> (ventaja del terreno).</p>

            <h2 id="troupes">Las unidades terrestres</h2>
            <table>
                <thead>
                    <tr><th>Unidad</th><th>Función</th><th>Notas</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionarios</strong></td><td>Ataque y defensa (potencia 6 en defensa).</td><td>+5&nbsp;% de defensa por nivel de Alambradas (hasta +25&nbsp;%).</td></tr>
                    <tr><td><strong>Mechas</strong></td><td>Defensa pesada (potencia 2&nbsp;200).</td><td>Máx. 500 por planeta. Mantenimiento de 2 Bitcoins al día en tierra, 100 embarcados.</td></tr>
                    <tr><td><strong>Trabajadores</strong></td><td>Defensa pasiva (potencia 1).</td><td>Únicamente contra las invasiones, no contra los saqueos.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Recursos utilizados para producir tus defensas</h2>
            <p>Como el Astillero espacial, la producción de defensas toma primero de los recursos <strong>del planeta</strong>, y luego de la <strong>carga de las flotas estacionadas en órbita</strong>. Puedes por tanto seguir reclutando aunque el stock en tierra sea bajo, mientras haya flotas cargadas sobre el planeta.</p>

            <h2 id="installations">Instalaciones orbitales y defensas</h2>
            <ul>
                <li><strong>Torretas</strong> — Lanzamisiles, Torreta láser, Torreta láser pesada, Cañón de Gauss, Artillería de iones, Lanzador de plasma. Variadas para contrarrestar distintos tipos de flotas (consulta la tabla de abajo).</li>
                <li><strong>Escudo</strong> — +50&nbsp;000 de armadura, permanente (5&nbsp;000 niobium y 5&nbsp;000 agua, 5 horas de construcción).</li>
                <li><strong>Gran escudo</strong> — +600&nbsp;000 de armadura durante <strong>12 horas</strong> a partir de su activación (150&nbsp;000 niobium y 150&nbsp;000 agua en cada activación).</li>
                <li><strong>Base espacial</strong> — +20&nbsp;% de armadura a las torretas y a los escudos (50&nbsp;000 niobium y 50&nbsp;000 agua, 1 hora).</li>
            </ul>

            <h2 id="temps">Costes y tiempos de construcción</h2>
            <table>
                <thead>
                    <tr><th>Defensa</th><th>Coste</th><th>Tiempo por unidad</th><th>Blindaje</th><th>Armas</th><th>Requisitos</th></tr>
                </thead>
                <tbody>
                    <tr><td>Lanzamisiles</td><td>12 niobium, 9 agua</td><td>2 s</td><td>10</td><td>9 misil</td><td>Arma misil niv. 1</td></tr>
                    <tr><td>Torreta láser</td><td>13 niobium, 12 agua</td><td>2,4 s</td><td>15</td><td>6 láser</td><td>Arma láser niv. 1</td></tr>
                    <tr><td>Torreta láser pesada</td><td>23 niobium, 23 agua</td><td>4,4 s</td><td>25</td><td>12 láser</td><td>Arma láser niv. 3, Fábrica de armamento</td></tr>
                    <tr><td>Cañón de Gauss</td><td>50 niobium, 25 agua</td><td>7,2 s</td><td>50</td><td>24 misil</td><td>Arma misil niv. 3, Fábrica de armamento</td></tr>
                    <tr><td>Artillería de iones</td><td>30 niobium, 45 agua</td><td>7,2 s</td><td>50</td><td>8 láser, 4 plasma</td><td>Arma misil niv. 3, Arma láser niv. 3, Industria pesada</td></tr>
                    <tr><td>Lanzador de plasma</td><td>15 niobium, 60 agua</td><td>7,2 s</td><td>50</td><td>8 plasma</td><td>Arma de plasma niv. 1, Industria pesada</td></tr>
                </tbody>
            </table>
            <p>Estos tiempos se dividen entre la velocidad de producción de defensas del planeta: ×1, +0,4 por nivel de <strong>Fábrica de armamento</strong> y +0,6 por nivel de <strong>Industria pesada</strong>. Ejemplo: 1&nbsp;000 Lanzamisiles tardan 33 minutos sin fábrica, menos de 10 minutos con una Fábrica de armamento de nivel 3 y una Industria pesada de nivel 2 (×3,4). La velocidad del servidor no cambia estos tiempos. La producción se hace una línea tras otra y las unidades llegan sobre la marcha.</p>
            <p>Misma aceleración para las tropas y lo nuclear: Legionario 1 s, Mecha 100 s, misil interceptor 3 h, bomba nuclear 6 h. El Escudo (5 h) y la Base espacial (1 h) tienen un tiempo fijo; el Gran escudo está activo desde su activación, durante 12 horas.</p>

            <h2 id="stats-defensives">Leer la potencia de tu planeta</h2>
            <p>La página <strong>Defensa</strong> tiene dos pestañas. La segunda, <strong>Estadísticas defensivas</strong>, resume lo que vale realmente el planeta: el blindaje, los misiles, los láseres y los plasmas acumulados de todas tus torretas, el aporte de cada estructura, el efecto del escudo, del gran escudo y de la base espacial sobre el blindaje realmente opuesto a una flota, y la potencia de tu defensa en tierra. Es la forma más rápida de detectar la estadística rezagada antes de lanzar una nueva serie de construcciones.</p>
            <p>Un detalle de lectura: el gráfico circular y las barras se refieren al blindaje <strong>de las estructuras solas</strong>. Los valores fijos de escudo aparecen aparte, en los modificadores, porque de otro modo aplastarían cualquier comparación entre tus armas.</p>

            <h2 id="bunker">El Fuerte defensivo contra el saqueo</h2>
            <p>El <strong>Fuerte defensivo</strong> (búnker) protege el <strong>5&nbsp;% del almacenamiento máx. por nivel</strong> contra los saqueos. Un Fuerte defensivo de nivel 5 ya pone a salvo el 25&nbsp;% de tus reservas de niobium y agua. El uranium está protegido en un 5&nbsp;% de su stock por nivel. Atención: con el despliegue Tierra quemada, la mitad de lo que queda se destruye si pierdes, parte protegida incluida.</p>

            <h2 id="entretien">Atención al coste de mantenimiento</h2>
            <p>Todo lo que está <strong>en una flota</strong> — en vuelo o estacionado — cuesta mucho más que en tierra: un Mecha pasa de 2 a 100 Bitcoins al día (×50), un Legionario de 0,1 a 0,6, una nave de su firma ÷ 12 a su firma ÷ 2. Pon en tierra lo que no tenga misión.</p>

    embargo:
        title: "Embargo y hambruna"
        category: "combat"
        order: 6
        tags: "embargo,hambruna,bloqueo,asedio,planeta,comida,raciones,abastecimiento,firma,umbral"
        summary: "Matar de hambre a un planeta antes de invadirlo: el bloqueo, la hambruna que se instala y cómo sobrevivir."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Un <strong>embargo</strong> es un asedio planetario. Mantienes una gran flota en modo ataque en órbita de un planeta enemigo; las entregas se cortan, las raciones se agotan, la población sufre. Cuando el planeta está debilitado, pasas al asalto.</p>

            <h2 id="consommation">Recordatorio: la comida</h2>
            <p>Solo tus <strong>trabajadores</strong> consumen raciones: 1 ración por hora por cada 500 trabajadores (150&nbsp;000 trabajadores = 300 raciones por hora). Los Legionarios y los Mechas no comen, pero también mueren cuando se instala el hambre. Si tus reservas caen a <strong>0</strong>, es la <strong>hambruna</strong>.</p>
            <p>Las raciones se <strong>transportan en bodega</strong>: cárgalas en un planeta, descárgalas en otro para abastecer. Mientras una de tus flotas esté <strong>atracada</strong> (ni en vuelo ni en combate) sobre tu planeta, sus raciones completan el granero — y un asedio las sangra como el resto: la bodega no es una caja fuerte.</p>

            <h2 id="famine">La hambruna (sin embargo)</h2>
            <p>Cuando faltan raciones, las pérdidas se encadenan en <strong>3 fases</strong>:</p>
            <ul>
                <li><strong>Fase 1 (0–3 h)</strong> — aproximadamente un 3&nbsp;% de los trabajadores por hora. El tiempo de reaccionar.</li>
                <li><strong>Fase 2 (3–8 h)</strong> — aproximadamente un 6&nbsp;% de los trabajadores y un 2&nbsp;% de los Legionarios por hora: los Legionarios empiezan a desertar.</li>
                <li><strong>Fase 3 (más allá de 8 h)</strong> — derrumbe: aproximadamente un 11&nbsp;% de los trabajadores, un 5&nbsp;% de los Legionarios y un 2&nbsp;% de los Mechas por hora.</li>
            </ul>
            <p>Un suelo de <strong>5&nbsp;000 trabajadores</strong> evita la desaparición total. Sin abastecimiento, un planeta lo alcanza en unas 24 horas con 50&nbsp;000 trabajadores, 30 horas con 100&nbsp;000, 33 horas con 150&nbsp;000. En cuanto vuelve una ración al granero, la hambruna se detiene y las fases vuelven a empezar de cero. Un informe te avisa en cada nueva fase.</p>

            <h2 id="declenchement">Cómo desencadenar un embargo</h2>
            <p>Un embargo se activa automáticamente (el juego comprueba cada minuto) cuando:</p>
            <ul>
                <li>el planeta objetivo pertenece a un jugador (los planetas de las IA y las bases Cthulhu nunca están sometidos a él);</li>
                <li>hay flotas enemigas <strong>atracadas en órbita</strong> — ni en vuelo ni ya metidas en un combate programado — y en <strong>modo ataque</strong> (lo que supone armas de nave);</li>
                <li>la <strong>firma térmica acumulada</strong> de esas flotas alcanza al menos <strong>10&nbsp;000</strong>.</li>
            </ul>
            <p>Todas las flotas enemigas presentes se suman, incluso si pertenecen a jugadores distintos. Solo se excluyen las flotas de la alianza del propietario y de las alianzas vinculadas a ella por una <strong>Alianza defensiva</strong> (un Pacto de no agresión o un Acuerdo de paz no protege), así como los comerciantes. Cada nave de esas flotas cuenta, cargos y sondas incluidos; la firma de cada nave se indica en el Astillero espacial.</p>
            <table>
                <thead>
                    <tr><th>Nave</th><th>Firma</th><th>Número para 10&nbsp;000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cazador</td><td>1</td><td>10&nbsp;000</td></tr>
                    <tr><td>Corbeta</td><td>7</td><td>1&nbsp;429</td></tr>
                    <tr><td>Fragata</td><td>20</td><td>500</td></tr>
                    <tr><td>Nave de batalla</td><td>40</td><td>250</td></tr>
                    <tr><td>Crucero</td><td>56</td><td>179</td></tr>
                    <tr><td>Acorazado</td><td>64</td><td>157</td></tr>
                    <tr><td>Destructor</td><td>270</td><td>38</td></tr>
                    <tr><td>Nave nodriza</td><td>4&nbsp;000 (−10&nbsp;% para toda su flota)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>Una Nave nodriza reduce un 10&nbsp;% la firma de toda la flota que la lleva: 3 Naves nodriza solas hacen 12&nbsp;000 − 10&nbsp;% = 10&nbsp;800, suficiente para el umbral, pero 2 no bastan (7&nbsp;200). Los números de la tabla valen para una flota sin Nave nodriza; se pueden mezclar los tipos, por supuesto.</p>
            <p>En cuanto la firma de las flotas sitiadoras vuelve a bajar de 10&nbsp;000 (salida, destrucción o modo ataque cortado), el bloqueo se levanta.</p>
            <p>Una flota de saqueo o de invasión marcada «&nbsp;en ataque&nbsp;» por la batalla fusionada descrita en el artículo <em>Defender tus planetas</em> conserva ese marcador si sobrevive&nbsp;: si se queda en órbita, cuenta en esa firma igual que cualquier flota hostil.</p>

            <h2 id="effets">Lo que sufre el planeta asediado</h2>
            <ul>
                <li><strong>Drenaje de raciones</strong> adicional cada hora: tus trabajadores ÷ 7 (150&nbsp;000 trabajadores = 21&nbsp;429 raciones por hora), tomado del granero y luego de las bodegas de tus flotas atracadas.</li>
                <li><strong>Producción de raciones</strong> reducida un 30&nbsp;%.</li>
                <li><strong>Producción de niobium y de agua</strong> reducida un 20&nbsp;%.</li>
                <li><strong>Nacimientos de trabajadores</strong> divididos por dos.</li>
                <li><strong>Mercado bloqueado</strong>: no más ventas automáticas a los comerciantes.</li>
                <li><strong>Entregas bloqueadas</strong>: solo tus flotas y las de los miembros de tu alianza pueden descargar en el planeta; las demás se van con su carga.</li>
                <li><strong>Héroes bloqueados</strong>: imposible destinar un héroe al planeta o retirarlo de él.</li>
            </ul>

            <h2 id="famine-embargo">Hambruna bajo embargo: es peor</h2>
            <p>Si las raciones caen a 0 <strong>durante</strong> un embargo, ya no hay fases: desde la primera hora, el planeta pierde cada hora un <strong>8&nbsp;%</strong> de sus trabajadores, un <strong>3&nbsp;%</strong> de sus Legionarios y un <strong>3&nbsp;%</strong> de sus Mechas, y el drenaje del embargo sigue vaciando cualquier abastecimiento que llegue. El suelo de 5&nbsp;000 trabajadores se sigue aplicando.</p>

            <h2 id="timings">¿Cuánto tiempo se aguanta?</h2>
            <p>Bajo embargo, sin producción ni abastecimiento:</p>
            <table>
                <thead>
                    <tr><th>Perfil de planeta</th><th>Inicio de la hambruna</th><th>Suelo de 5&nbsp;000 trabajadores alcanzado</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pequeño (50&nbsp;000 trabajadores, 100&nbsp;000 raciones)</td><td>~14 horas</td><td>~1,7 días</td></tr>
                    <tr><td>Mediano (150&nbsp;000 trabajadores, 800&nbsp;000 raciones)</td><td>~1,5 días</td><td>~3,2 días</td></tr>
                    <tr><td>Fortaleza (200&nbsp;000 trabajadores, 2&nbsp;000&nbsp;000 raciones)</td><td>~2,9 días</td><td>~4,7 días</td></tr>
                </tbody>
            </table>

            <h2 id="defense">Cómo resistir un embargo</h2>
            <ul>
                <li><strong>Destruir la flota sitiadora</strong> para levantar el bloqueo.</li>
                <li><strong>Hacer llegar abastecimiento</strong> — tus flotas y las de los miembros de tu alianza siempre pueden descargar (misión «Descargar y volver»).</li>
                <li><strong>Evacuar</strong> — tus flotas <em>salientes</em> no están bloqueadas, puedes vaciar tus recursos en una emergencia.</li>
                <li><strong>Construir Silos agrícolas</strong> y almacenar raciones <em>antes</em> de que la cosa se ponga fea.</li>
                <li><strong>Pedir ayuda a tu alianza</strong> para romper el asedio entre varios.</li>
            </ul>

            <h2 id="rapports">Los informes durante un embargo</h2>
            <p>Cada hora, tú (y cada jugador cuya flota asedia el planeta) recibes un informe en el menú <strong>Informe</strong>, pestaña <strong>Combates</strong>: tiempo transcurrido, raciones restantes, pérdidas sufridas. Un último informe te anuncia el levantamiento del bloqueo. En la página <strong>Planetas</strong>, la tarjeta de cada planeta muestra también su Producción, su Consumo, el Drenaje embargo, el Balance y la Autonomía estimada.</p>

    combat_stats:
        title: "Comprender la potencia de las tropas"
        category: "combat"
        order: 7
        tags: "potencia,bonus,combate,política,cálculo,alambradas,precisión,mechas"
        summary: "Cómo se compara la potencia de tus unidades y qué la potencia."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Potencia en tierra</h2>
            <p>Valores exactos, sin bonus:</p>
            <table>
                <thead>
                    <tr><th>Unidad</th><th>Potencia</th><th>Función</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mecha</strong></td><td>2&nbsp;200 en defensa</td><td>Pilar de defensa: un Mecha vale unos 367 Legionarios. Máximo 500 por planeta. Solo combate en defensa: embarcado en una flota, no participa en el asalto.</td></tr>
                    <tr><td><strong>Legionario (defensa)</strong></td><td>6, +5&nbsp;% por nivel de Alambradas</td><td>El corazón de la guarnición.</td></tr>
                    <tr><td><strong>Legionario (ataque)</strong></td><td>5 a 7 por ronda en invasión, 5 a 6 en saqueo (sorteado en cada ronda)</td><td>Única unidad que ataca en tierra: un saqueo es algo menos imprevisible que una invasión.</td></tr>
                    <tr><td><strong>Trabajador (defensa)</strong></td><td>1</td><td>Únicamente en invasión. 200&nbsp;000 trabajadores pesan tanto como unos 91 Mechas.</td></tr>
                </tbody>
            </table>
            <p>En cada ronda (10 como máximo), el asaltante inflige la décima parte de su potencia de ataque a la guarnición, que responde con la décima parte de su potencia de defensa. Los daños matan unidades según su potencia: hacen falta 6 puntos para un Legionario defensor sin bonus, 2&nbsp;200 para un Mecha, 1 para un trabajador. Ejemplo: 10&nbsp;000 Legionarios en invasión (tirada media de 6) infligen unos 6&nbsp;000 puntos por ronda, suficiente para matar a 1&nbsp;000 Legionarios sin bonus, o a menos de 3 Mechas.</p>
            <p>Las <strong>barcazas</strong> no combaten: transportan 1&nbsp;000 Legionarios cada una (+25&nbsp;% por nivel de la investigación política «Invasiones planificadas»).</p>

            <h2 id="bonus">Lo que aumenta tu potencia</h2>
            <ul>
                <li><strong>Investigación Alambradas</strong> — +5&nbsp;% de defensa por nivel para tus Legionarios (5 niveles, es decir, +25&nbsp;% como máximo).</li>
                <li><strong>Investigaciones políticas</strong> (pestaña «Políticas» de la página Investigaciones) — Potencia militar (+10&nbsp;% por nivel en el ataque y la defensa de los Legionarios), Blindaje de mechas (+10&nbsp;% por nivel en la defensa de los Mechas), Refuerzo ideológico (+20&nbsp;% por nivel en la defensa de los trabajadores), Invasiones planificadas (+25&nbsp;% de capacidad por barcaza y por nivel), Armamento mejorado (+10&nbsp;% por nivel en los misiles y láseres de las naves), Blindaje de naves (+10&nbsp;% de armadura de las naves por nivel).</li>
                <li><strong>Mejoras de alianza</strong> — en combate espacial, hasta +5&nbsp;% por tipo de arma, de armadura, de escudo y de precisión de las naves, y hasta +10&nbsp;% para las defensas planetarias.</li>
                <li><strong>Despliegue táctico</strong> — elección del defensor que modifica la respuesta de su guarnición y el orden de sus pérdidas (consulta <em>Invasión de planeta</em>).</li>
                <li><strong>Héroe Militar</strong> — bonus directo de ataque y de defensa, tanto para el héroe de la flota asaltante como para el destinado en el planeta.</li>
                <li><strong>Items</strong> equipados en el héroe.</li>
            </ul>
            <p>La investigación <strong>Crecimiento militar</strong> no da ningún bonus de combate: desbloquea el Cuartel (nivel 1), el Fuerte defensivo (nivel 3), y luego las investigaciones Alambradas y Unidades blindadas (Mechas).</p>

            <h2 id="faction">Bonus político (combates espaciales)</h2>
            <p>El bonus de armas del combate espacial proviene de la <strong>política de tu alianza</strong>. Cada régimen vence a su rival: <strong>La Balanza de los Mundos</strong> vence a <strong>El Baluarte Silencioso</strong>, que vence a <strong>El Martillo de las Estrellas</strong>, que vence a <strong>La Balanza de los Mundos</strong>.</p>
            <p>Cuando la política del <strong>atacante</strong> vence a la del defensor, todas sus armas (misiles, láseres, plasma) ganan <strong>+20&nbsp;%</strong> durante ese combate. El bonus solo se aplica al asaltante: el defensor cuenta con sus defensas planetarias. Vale en combate entre flotas solamente, no contra torretas solas (combate orbital del modo ataque) ni en tierra.</p>

            <h2 id="precision">Precisión y tiradas de combate</h2>
            <p>En combate espacial, cada bando dispara <strong>una salva por ronda</strong>. Una tirada aleatoria, sacada entre la precisión del bando y 100 y luego dividida entre 80, modula los daños de la salva de <strong>×0,3 a ×1,2</strong>. Ninguna salva falla: una precisión alta no hace más fuertes tus mejores golpes, elimina las malas tiradas.</p>
            <p>La puntería de una flota nunca se muestra en porcentaje&nbsp;: en todas partes — Astillero espacial, página de gestión de flota, pestaña Estadísticas defensivas de la página Defensa e informes de combate — el juego muestra el <strong>multiplicador de daños medio</strong> que produce:</p>
            <ul>
                <li><strong>×0,66</strong> sin la menor inversión: cada salva cae entre ×0,3 y ×1,2;</li>
                <li><strong>×0,94</strong> con puntería completa: cada salva cae entre ×0,63 y ×1,2;</li>
                <li><strong>×1,06</strong> para las defensas de un planeta: cada salva cae entre ×0,88 y ×1,2 — mejor que una flota con puntería completa.</li>
            </ul>
            <p>Este nivel depende de los puntos de <strong>personalización</strong> invertidos en precisión para cada modelo de nave (40 puntos/día) y le es propio&nbsp;: gastar tus puntos en otro sitio, en la armadura o las armas del mismo modelo, nunca lo hace bajar. Los bonus de precisión de alianza y de héroe se suman, sin superar nunca la puntería completa. Cuando varias flotas combaten juntas, el bando usa la media de sus punterías.</p>
            <p>Frente a un adversario dirigido por la IA (bot), su puntería nunca baja de un suelo fijo (multiplicador medio ×0,81)&nbsp;: un bot que ha invertido realmente lo supera, y un jugador suficientemente invertido puede igualarlo o superarlo. Las hordas Cthulhu apuntan siempre a ×0,94.</p>

    reports:
        title: "Los informes del juego"
        category: "beginner"
        order: 9
        tags: "informe,notificación,combate,espionaje,alianza,colonización,pestañas,eliminar,compartir"
        summary: "El juego te envía informes por cada evento importante. Aquí tienes dónde encontrarlos, qué contienen y cómo gestionarlos."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">¿Dónde encontrar tus informes?</h2>
            <p>Abre <strong>Informe</strong> en el menú (en teléfono: botón <strong>Menú</strong> y luego <strong>Informe</strong>). El número de nuevos informes se muestra en esa entrada.</p>
            <p>La página se abre en la pestaña <strong>Todos</strong> (tus 300 informes más recientes). Las demás pestañas clasifican por categoría: <strong>Otro</strong>, <strong>Alianza</strong>, <strong>Cthulhu</strong>, <strong>Combates</strong>, <strong>Invasiones</strong>, <strong>Económicos</strong> y <strong>Flotas</strong>. Una pestaña solo aparece si contiene al menos un informe, y muestra su número de no leídos. Cada informe no leído lleva la indicación «No leído»: toca su fila para abrirlo.</p>
            <p>Los mensajes de los demás jugadores no están aquí: están en <strong>Mensajería</strong>.</p>
            <p>También puedes activar las <strong>notificaciones push</strong> para recibir alertas en tu teléfono o en tu navegador (consulta el artículo dedicado).</p>

            <h2 id="gerer">Leer, compartir, eliminar</h2>
            <ul>
                <li><strong>Marcar leído</strong>: botón de un informe abierto (basta también con abrirlo). <strong>Marcar todo como leído</strong>, en la parte superior de la página, procesa todos tus informes de una vez.</li>
                <li><strong>Generar enlace para compartir</strong>: crea un enlace público a este informe; el botón <strong>Enlace</strong> lo copia. Cualquier persona que tenga este enlace puede leer el informe, incluso sin cuenta.</li>
                <li><strong>Eliminar</strong>: borra el informe al instante, sin confirmación ni papelera.</li>
            </ul>
            <p>La eliminación se hace informe por informe: no existe ni archivado ni eliminación en bloque. Tus informes no se borran solos con el tiempo.</p>

            <h2 id="combat">Informes de combate y de invasión</h2>
            <p>Pestaña <strong>Combates</strong>:</p>
            <ul>
                <li><strong>Reporte de combate: Victoria / Derrota</strong> — una de tus flotas se ha enfrentado a una flota enemiga (combate espacial).</li>
                <li><strong>Defensa orbital: Victoria / Derrota</strong> — las defensas de tu planeta se han enfrentado a una flota enemiga; el atacante recibe por su parte <strong>Ataque orbital: Victoria / Derrota</strong>.</li>
                <li><strong>Defensas planetarias: Resistieron / Destruidas</strong> — informe dedicado al propietario que no ha comprometido ninguna flota propia en una batalla fusionada: sus defensas han resistido o han sido aniquiladas.</li>
                <li><strong>Misil nuclear</strong> — tu misil ha alcanzado su objetivo o ha sido interceptado; un misil te ha golpeado o ha sido interceptado en tu planeta.</li>
                <li><strong>Tu planeta esta bajo embargo!</strong> — un informe cada hora mientras uno de tus planetas esté asediado, y luego un último informe cuando se levanta el embargo. Los sitiadores reciben también el suyo.</li>
                <li><strong>¡Hambruna en tu planeta!</strong> — tus raciones se han agotado y el hambre causa víctimas.</li>
            </ul>
            <p>Pestaña <strong>Invasiones</strong>:</p>
            <ul>
                <li><strong>Reporte de saqueo</strong> — saqueo sufrido o infligido (victoria o derrota, en ataque o en defensa).</li>
                <li><strong>Reporte de invasion</strong> — intento de toma de planeta, por un lado o por el otro.</li>
            </ul>

            <h2 id="cthulhu">Informes Cthulhu</h2>
            <ul>
                <li><strong>Alerta: horda en camino</strong> — una horda Cthulhu se dirige hacia uno de tus planetas.</li>
                <li><strong>Reporte de poseidos: Victoria defensiva / Ataque recibido</strong> — el resultado del ataque de una horda contra tu planeta. En dificultad PvE Difícil, el título pasa a ser <strong>Reporte de ataque de poseidos: Victoria / Derrota</strong>.</li>
                <li><strong>Tower Defense Cthulhu: Victoria / Derrota</strong> — el resultado de tu defensa activa.</li>
                <li><strong>Reporte de contraataque: Victoria / Derrota</strong> — tu invasión de un planeta tomado por los Cthulhu. Una victoria libera el planeta: vuelve a ser libre, y la colmena no puede recuperarlo durante 72 horas.</li>
                <li><strong>Bloqueo de Cthulhu</strong>, <strong>La colmena se expande</strong>, <strong>Erupción de la colmena</strong> — los eventos Cthulhu de tu sector y sus consecuencias.</li>
            </ul>

            <h2 id="flotte">Informes de flota</h2>
            <p>Pestaña <strong>Flotas</strong>:</p>
            <ul>
                <li><strong>Tu flota ha llegado</strong> — tu flota ha alcanzado su destino.</li>
                <li><strong>Deposito de recursos</strong> — otro jugador ha descargado recursos en uno de tus planetas.</li>
                <li><strong>Tu flota ha dejado de reciclar!</strong> — tus recicladores han terminado su trabajo.</li>
            </ul>
            <p>El espionaje se clasifica en la pestaña <strong>Otro</strong>: <strong>Analisis del planeta</strong> (el resultado de tu sonda) y <strong>Espionaje detectado</strong> (alguien ha intentado espiar uno de tus planetas).</p>

            <h2 id="alliance">Informes de alianza</h2>
            <ul>
                <li><strong>Diplomacia</strong> — Guerra declarada (por tu alianza) o Guerra recibida, alianza defensiva concluida o rota, pacto de no agresión concluido o roto, acuerdo de paz concluido o expirado.</li>
                <li><strong>Miembros</strong> — Nuevo miembro, Miembro partido, Miembro expulsado, Miembro Game Over.</li>
            </ul>

            <h2 id="divers">Otros informes</h2>
            <p>Pestaña <strong>Económicos</strong>:</p>
            <ul>
                <li><strong>Reporte del imperio</strong> — tu balance económico diario, cada día a las 18h59 (hora de París).</li>
                <li><strong>⚠ ¡Bancarrota inminente!</strong> — tus gastos diarios superan tus ganancias y tus Bitcoins ya no cubren un día de déficit (como máximo una alerta cada 24 horas).</li>
                <li><strong>Venta a los mercaderes</strong> — tu flota ha vendido su cargamento a un comerciante.</li>
                <li><strong>Bono de conexion</strong> — los Bitcoins del día y, algunos días, un objeto.</li>
            </ul>
            <p>Pestaña <strong>Otro</strong>:</p>
            <ul>
                <li><strong>Colonizacion de planeta</strong> — nuevo planeta fundado.</li>
                <li><strong>Analisis del planeta</strong> y <strong>Espionaje detectado</strong> — ver más arriba.</li>
                <li><strong>Colas terminadas</strong> (Edificios, Naves, Defensa, Investigación) — la cola está vacía: puedes volver a lanzar.</li>
                <li><strong>Héroes y prisión</strong> — héroe capturado, escapado, liberado o ejecutado, alerta de prisión, posición revelada, objeto robado o encontrado, nuevo héroe, demandas de rescate.</li>
                <li><strong>Arena</strong> — desafío recibido, resultado de duelo, torneo, recompensa semanal, arena de alianza.</li>
                <li><strong>Varios</strong> — fin de tu protección de novato, flota rechazada, misión lunar fallida.</li>
            </ul>

            <h2 id="compte-valide">Cuenta por validar</h2>
            <p>⚠️ Para <strong>enviar un mensaje o Bitcoins</strong> a otro jugador, y para crear o unirte a una alianza, tu cuenta debe estar <strong>validada</strong> y tu <strong>correo electrónico confirmado</strong>.</p>
            <p>Una cuenta de prueba (creada con «Probar sin email») se valida desde la entrada <strong>Validar cuenta</strong> del menú: ahí eliges un seudónimo, una contraseña y tu dirección de correo electrónico. Entonces sale un correo de confirmación: haz clic en su enlace. ¿No lo has recibido? Abre <strong>Opciones</strong> (abajo del menú en ordenador, en el panel Menú en teléfono): la sección <strong>Confirmar mi dirección de correo electrónico</strong> permite <strong>reenviarlo</strong> (tres veces por hora como máximo).</p>

    battle_reports:
        title: "Leer un informe de combate"
        category: "combat"
        order: 8
        tags: "informe,combate,victoria,derrota,análisis"
        summary: "Tras cada combate, un informe detallado. Así se descifra para golpear mejor la próxima vez."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Dónde encontrarlos</h2>
            <p>Todos los informes de combate llegan al menú <strong>Informe</strong>. La pestaña <strong>Combates</strong> agrupa los combates espaciales y orbitales, las defensas planetarias, lo nuclear, el embargo y la hambruna; la pestaña <strong>Invasiones</strong> agrupa los saqueos y las invasiones; los combates contra los Cthulhu tienen su propia pestaña <strong>Cthulhu</strong>.</p>

            <h2 id="types">Tipos de informes de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — dos flotas se han cruzado.</li>
                <li><strong>Combate orbital</strong> — tus defensas planetarias han interceptado una flota.</li>
                <li><strong>Defensas planetarias</strong> — batalla fusionada en la que no has comprometido ninguna flota propia: tus torretas, escudos y base espacial han resistido, o han sido destruidos.</li>
                <li><strong>Flota desarmada destruida</strong> — un bando sin arma de nave (cargos, sondas, recicladores) ha sido destruido sin combate.</li>
                <li><strong>Saqueo</strong> — intento de pillaje (por tu parte o contra ti).</li>
                <li><strong>Invasión</strong> — intento de toma de planeta.</li>
                <li><strong>Nuclear</strong> — bomba enviada o recibida, o interceptada.</li>
                <li><strong>Embargo</strong> — informe cada hora durante un asedio, y uno último cuando se levanta.</li>
                <li><strong>Hambruna</strong> — enviado en cada nueva fase de hambruna (sin embargo).</li>
            </ul>

            <h2 id="contenu">Lo que contiene un informe</h2>
            <ul>
                <li><strong>Fuerzas comprometidas</strong> — armadura de partida, escudo, armas de cada bando, y la composición de cada flota. La puntería no figura en porcentaje, sino en forma de <strong>multiplicador de daños medio</strong> que produce (×0,66 sin ninguna inversión, ×0,94 con puntería completa, ×1,06 para las defensas de un planeta): ningún disparo falla nunca, una mejor puntería sube el suelo de tus daños.</li>
                <li><strong>Salvas</strong> — el número de salvas disparadas por ese bando, las que pasaron por el escudo adversario, y si su propio escudo fue perforado o aguantó.</li>
                <li><strong>Carga de escudo</strong> — para un bloque de flota, el porcentaje de carga al inicio y al final del combate, con su capacidad total: tu escudo no vuelve sistemáticamente al 100&nbsp;% de un combate a otro, se recarga progresivamente (consulta el artículo <em>Combate espacial</em>).</li>
                <li><strong>Armadura restante</strong> — lo que queda en pie, y su parte de la armadura de partida. Un bando aniquilado muestra en su lugar el <strong>excedente de daños</strong> encajado más allá de su armadura: es tu margen de victoria.</li>
                <li><strong>Daños encajados</strong> — dos contadores por bando: <strong>casco</strong> (lo que no ha detenido el escudo) y <strong>escudo</strong> (lo que ha absorbido el escudo). Tus pérdidas se derivan únicamente del casco.</li>
                <li><strong>Pérdidas</strong> — nave por nave, de cada lado.</li>
                <li><strong>Defensas planetarias detalladas</strong> — pérdidas de torretas, más tu Escudo, Gran escudo y Base espacial cuando los posees, con la puntuación de defensa y la etiqueta «&nbsp;Ataque&nbsp;» del planeta para una batalla fusionada.</li>
                <li><strong>Recursos saqueados</strong> (para los saqueos) y <strong>escombros generados</strong> — ¡a reciclar!</li>
                <li><strong>Puntos de Guerra ganados</strong> y resultado final.</li>
            </ul>

            <h2 id="analyser">Cómo sacar una lección</h2>
            <ul>
                <li>Mira primero los <strong>daños encajados</strong>: la línea «casco» cuenta todo lo que no ha detenido tu escudo (la parte que lo perfora, y luego todo una vez vacío); la línea «escudo», lo que ha absorbido tu escudo — eso no cuesta ninguna nave, solo carga, que sube un 10&nbsp;% cada 3 horas.</li>
                <li>Compara los dos <strong>multiplicadores de daños</strong>: es la única cifra directamente comparable de un bando a otro. Luego mira la <strong>armadura restante</strong> — ganar conservando el 5&nbsp;% de tu armadura y ganar conservando el 70&nbsp;% no se equivalen. Un gran excedente en el adversario significa que has pagado de más la victoria.</li>
                <li>Las pérdidas en tus <strong>cazadores</strong> son normales incluso cuando tu escudo aguanta: sin escudo, encajan su parte del casco en proporción a su armadura, más hasta la mitad de los golpes destinados a tus naves pesadas — es su papel de pantalla.</li>
                <li>¿Muchas <strong>salvas pasadas por el escudo adversario</strong>? Sube plasma (×4 contra los escudos) para perforar más rápido.</li>
                <li><strong>100 rondas alcanzadas</strong>: el bando que conserva más armadura gana (el atacante en caso de empate) — si te pasa en ataque, a tu flota le falta potencia o precisión.</li>
                <li><strong>Conserva tus informes importantes</strong> (no los elimines) y usa «Generar enlace para compartir» para mostrárselos a tu alianza: sirven de pruebas en los debates.</li>
            </ul>

    combat_simulator:
        title: "Simulador de combate"
        category: "combat"
        order: 9
        tags: "simulador,combate,simulación,flota,pérdidas,estimación,informe"
        summary: "Estima tus riesgos antes de atacar: repite mil veces un combate contra una flota observada en un informe, con el motor real del juego."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="proposito">Para qué sirve</h2>
            <p>La pestaña <strong>Simulador de combate</strong> de la página Flotas estima lo que arriesgas antes de atacar. Repite <strong>1&nbsp;000 veces</strong> un combate entre una de tus flotas y una flota adversaria, con el <strong>motor real del juego</strong> — mismas fórmulas, mismas tiradas aleatorias. No se compromete nada realmente: ninguna nave se mueve, ninguna muere.</p>

            <h2 id="fuente">La fuente: un informe de combate</h2>
            <p>La flota adversaria proviene de uno de tus <strong>informes de combate espacial recientes</strong> (los que muestran la línea «&nbsp;Daños encajados&nbsp;»): son las únicas fuentes honestas, porque contienen la potencia real del bando observado, bonus incluidos. El simulador te propone los 30 más recientes; los informes orbitales, de saqueo o de invasión no sirven de fuente. Un informe de espionaje solo da números de naves, sin sus estadísticas reales — la simulación sería engañosa, por eso no se propone.</p>
            <p>Elige el informe, el bando al que enfrentarte (una de las dos armadas del informe) y luego una de tus flotas armadas, esté donde esté. Simulas siempre en posición de <strong>atacante</strong>, fuera de tu casa: sin tus torretas ni tus escudos planetarios, con tus bonus reales (héroe, alianza, política comparada con la de la alianza actual del adversario) y el escudo que tu flota tiene <strong>en este momento</strong> — una flota desgastada se simula desgastada.</p>

            <h2 id="leer">Leer el resultado</h2>
            <ul>
                <li><strong>Tasa de victoria</strong> — la parte de las 1&nbsp;000 tiradas en que ganas.</li>
                <li><strong>Horquilla de pérdidas por nave</strong> (mínimo, mediana, máximo) — solo sobre las tiradas victoriosas: en caso de derrota, tu flota sería destruida por completo.</li>
                <li><strong>Un ejemplo de desarrollo</strong> — una tirada victoriosa mediana, presentada como un informe y claramente marcada «&nbsp;SIMULACIÓN&nbsp;».</li>
            </ul>

            <h2 id="limites">Los límites que debes tener presentes</h2>
            <ul>
                <li>La flota adversaria es la <strong>observada en la fecha del informe</strong>: ha podido ser reconstruida, mejorada o reforzada desde entonces.</li>
                <li>Los talentos activos del héroe adversario (Intimidación, Táctico) no se repiten; sus bonus pasivos ya están incluidos en las cifras del informe. Sus defensas planetarias solo cuentan si el informe fuente era un combate en su casa (tal como estaban ese día): si lo atacas en su casa a partir de un informe obtenido en otro lugar, sus torretas no están.</li>
                <li><strong>Sin simulación como defensor</strong>: tu flota es siempre el atacante, fuera de casa. Para evaluar una amenaza, simula tu flota contra la flota enemiga de tu informe: tus torretas y escudos planetarios no se cuentan (un combate real en tu casa será más favorable), pero el enemigo tampoco recibe el +20&nbsp;% que tendría en ataque si su régimen vence al tuyo.</li>
                <li>Límite de <strong>20 simulaciones al día</strong> (puesta a cero a medianoche, hora de París; se muestra el contador restante): el simulador ilumina una decisión, no sustituye el riesgo del combate.</li>
            </ul>

    colonization:
        title: "Colonizar un nuevo planeta"
        category: "planet"
        order: 1
        tags: "colonización,planeta,colonizador,terraformación,deshabitado,tope"
        summary: "Ampliar tu imperio colonizando planetas deshabitados: cómo hacerlo, tope de planetas fijado por la Terraformación, tamaños disponibles."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">¿Por qué colonizar?</h2>
            <ul>
                <li><strong>Más producción</strong>: cada planeta tiene su propia economía.</li>
                <li><strong>Más colas de construcción</strong> en paralelo.</li>
                <li><strong>Menos riesgo</strong>: ya no tienes todos los huevos en la misma cesta.</li>
                <li><strong>Posiciones estratégicas</strong>: cercanía de comerciantes, de aliados, de objetivos.</li>
            </ul>

            <h2 id="etapes">Cómo colonizar</h2>
            <p>Se coloniza un <strong>planeta deshabitado</strong>: en el mapa, lleva el nombre «Deshabitado». Un emplazamiento «Vacío» (sin planeta) no se coloniza.</p>
            <ol>
                <li>Comprueba que te queda un hueco: puedes tener <strong>2 planetas + 1 por nivel de Terraformación</strong> (ver más abajo). Empiezas con <strong>un colonizador</strong> en tierra en tu planeta: tu 2.º planeta no requiere por tanto ninguna investigación.</li>
                <li>Para fabricar más colonizadores, investiga <strong>Terraformación</strong> nivel 1. Se construyen en el Astillero espacial: 5&nbsp;500 niobium, 7&nbsp;000 agua, 2&nbsp;000 trabajadores y 5 Legionarios cada uno.</li>
                <li>Crea una flota que contenga el colonizador (página <em>Flotas</em>, o botón <em>Crear flota</em> del mapa).</li>
                <li>En el <em>Mapa espacial</em>, haz clic en el planeta deshabitado y luego en <em>Interacción</em>. Elige la flota, la misión <strong>Colonizar</strong> y luego <em>Enviar</em>. El vuelo se paga en Bitcoins.</li>
            </ol>
            <p>Si tu flota ya está en órbita de un planeta deshabitado, el botón <em>Colonizar</em> aparece directamente en su ficha.</p>
            <p>El colonizador no lleva recursos. Para ayudar a la colonia, une cargos cargados a la flota y descárgalos una vez llegados (<em>Descargar todo</em>).</p>
            <p>A la llegada, se consume un colonizador y el planeta se funda con el nombre «Colonia». Recibes un informe, y el planeta aparece en el selector de planetas de la barra superior. Renómbralo desde la página <strong>Planetas</strong>.</p>

            <h2 id="initial">Lo que tiene al empezar</h2>
            <p>Un planeta recién colonizado empieza con <strong>200 niobium, 150 agua, 2&nbsp;500 trabajadores y 20 Legionarios</strong>. Todo lo demás está por construir: un planeta que nunca ha estado habitado no tiene ningún edificio, ni siquiera un Astillero espacial.</p>

            <h2 id="limite">¿Cuántos planetas como máximo?</h2>
            <p>Puedes poseer <strong>2 planetas + 1 por nivel de Terraformación</strong> (18 niveles como máximo). Tus lunas no cuentan.</p>
            <table>
                <thead>
                    <tr><th>Terraformación</th><th>Planetas máx.</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>En una alianza de régimen <em>La Balanza de los Mundos</em>, la investigación de alianza <strong>Aporte de la Democracia</strong> añade 1 planeta colonizable por nivel (5 niveles, es decir, hasta 25 planetas).</li>
                <li>Para las <strong>invasiones</strong>, el tope es 2 + Terraformación + el nivel de <strong>Imperio sin fronteras</strong> (investigación de alianza de los regímenes <em>El Martillo de las Estrellas</em> y <em>El Baluarte Silencioso</em>, 5 niveles). Si invades más allá, el planeta conquistado se convierte en una base Cthulhu en lugar de pasar a ti.</li>
                <li>En los modos <em>Search &amp; Destroy</em>, <em>Dominación</em> y <em>Battle Royale</em>, todas las investigaciones están al máximo desde el principio: 20 planetas de entrada.</li>
            </ul>

            <h2 id="choix">¿Dónde colonizar?</h2>
            <ul>
                <li>Cerca de un <strong>comerciante</strong>: economía fácil con el envío de cargos.</li>
                <li>Cerca de tus <strong>aliados</strong>: defensa mutua.</li>
                <li>En un planeta con <strong>mucho terreno</strong>: el tamaño no cambia la producción, pero da más espacio para construir. En el mapa, cuanto más grande es el icono de un planeta, más terreno tiene.</li>
                <li>Evita aislarte demasiado lejos de todo: trayectos más largos, abastecimiento complicado.</li>
            </ul>
            <p>No hay <strong>ningún límite de tamaño</strong>: cualquier planeta deshabitado se puede colonizar, pequeño o grande, mientras te quede un hueco. Tamaños de origen de los planetas libres:</p>
            <table>
                <thead>
                    <tr><th>Dónde</th><th>Terreno</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>Sistemas del borde de la galaxia (1 a 9, 92 a 99, y los que acaban en 0 o 1)</td><td>80 – 95 (algunos de 25)</td><td>2 – 21 (5 para los de 25)</td></tr>
                    <tr><td>Sistemas 45, 46, 55 y 56 (centro)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>Todos los demás sistemas</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>Los más grandes, en el centro, están custodiados por una horda alien masiva: un colonizador enviado solo sería destruido allí. Una vez que el planeta es tuyo, la Ciudad flotante añade hasta 50 de terreno y la Estación orbital hasta 25 de espacio (investigación <em>Expansión territorial</em>, consulta <em>Gestionar un planeta</em>).</p>

    planet_types:
        title: "Todo lo que hay en el mapa"
        category: "planet"
        order: 2
        tags: "planeta,deshabitado,luna,sol,comerciante,alien,escombros,asteroide,cthulhu,colonización"
        summary: "Los distintos objetos visibles en el mapa galáctico y lo que se puede hacer con ellos."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Los 8 tipos de objetos</h2>
            <table>
                <thead>
                    <tr><th>Tipo</th><th>Descripción</th><th>Acciones posibles</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Planeta habitado</strong></td><td>Pertenece a un jugador (o a un bot), que construye, produce y estaciona allí sus tropas.</td><td>Sondear, saquear, invadir, ataque nuclear, atacar las flotas en órbita.</td></tr>
                    <tr><td><strong>Planeta deshabitado</strong></td><td>Planeta libre, llamado «Deshabitado» en el mapa. Cuanto más grande es su icono, más terreno tiene.</td><td><strong>Colonizar.</strong></td></tr>
                    <tr><td><strong>Luna</strong></td><td>Creada por un Lunar en un emplazamiento vacío rico en escombros. Produce 20 raciones por minuto.</td><td>Saquear o invadir con una flota en órbita, ataque nuclear, atacar las flotas en órbita. Una luna no se puede sondear.</td></tr>
                    <tr><td><strong>Sol</strong></td><td>Siempre en la posición 13 de cada sistema. No colonizable.</td><td>Ninguna.</td></tr>
                    <tr><td><strong>Emplazamiento vacío</strong></td><td>Posición «Vacío», sin planeta. No colonizable.</td><td>Crear una luna (si lleva al menos 2M de niobium y 2M de agua en escombros), desplegar un radar, desplegar un inhibidor.</td></tr>
                    <tr><td><strong>Comerciante</strong></td><td>PNJ al que no se puede ni saquear ni invadir. Compra tus recursos a cambio de Bitcoins.</td><td>Vender (misión <em>Descargar y volver</em>).</td></tr>
                    <tr><td><strong>Base alien / Cthulhu</strong></td><td>Base de la colmena, defendida por una guarnición permanente.</td><td>Invadir para liberarla (uranium, puntos de guerra y retroceso de la Amenaza del universo).</td></tr>
                    <tr><td><strong>Campo de asteroides</strong></td><td>Aparece solo: niobium, agua o uranium. Se recarga cada 7 a 40 horas y a menudo está vigilado por aliens.</td><td>Reciclar.</td></tr>
                </tbody>
            </table>
            <p>Tras un combate, también pueden flotar <strong>escombros</strong> (niobium y agua) en cualquier posición, planeta incluido: un icono lo señala. Consulta el artículo <em>Reciclaje</em>.</p>

            <h2 id="reperer">Localizarlos en el mapa</h2>
            <p>Cada tipo tiene su icono, y el tamaño de un planeta en el mapa refleja su terreno. Haz clic (o toca) un objeto para abrir su ficha: propietario, terreno y espacio exactos (si la posición está dentro del alcance de tus radares), escombros eventuales. El botón <em>Interacción</em> de la ficha da acceso a las acciones y al envío de una flota; aparece en cuanto tienes al menos una flota parada.</p>

            <h2 id="lunes">Caso especial: las lunas</h2>
            <p>Las lunas se crean con una nave especial, el <strong>Lunar</strong> (a veces llamado Moon Maker), en un emplazamiento vacío que lleve al menos 2M de niobium y 2M de agua en escombros. Una luna produce una cantidad fija de <strong>20 raciones por minuto</strong> (1&nbsp;200 por hora antes de bonus): tanto como un Campo agrícola de nivel 7 a 8 en un planeta. Sus raciones se quedan en la luna: transpórtalas en cargo hacia los planetas que las necesiten. Consulta el artículo <em>Las lunas</em>.</p>

    planet_management:
        title: "Gestionar un planeta"
        category: "planet"
        order: 3
        tags: "gestión,planeta,producción,capacidad,especialización,terreno,ciudad flotante,estación orbital,héroe"
        summary: "Cómo optimizar la producción, organizar tu espacio y, eventualmente, especializar un planeta."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Las bases que hay que dominar</h2>
            <ul>
                <li><strong>Niveles de producción</strong>: sube con regularidad la Mina de Niobium, el Extractor de agua y el Campo agrícola.</li>
                <li><strong>Almacenamiento</strong>: sin stocks suficientes (Almacén de Niobium, Depósito de agua, Silo agrícola), la producción se satura y se detiene.</li>
                <li><strong>Población</strong>: la Gran ciudad (+25&nbsp;000 trabajadores máximo por nivel) y la Metrópoli (+80&nbsp;000) aumentan tu tope de trabajadores y su velocidad de llegada; el Campo de esclavos añade 2&nbsp;500 plazas por nivel.</li>
                <li><strong>Defensa mínima</strong>: un Fuerte defensivo y unos cuantos Mechas, es la base.</li>
            </ul>

            <h2 id="optimiser">Optimizar un planeta</h2>
            <ol>
                <li>Construye edificios de producción <strong>por parejas</strong> (Mina y Extractor suelen subir juntos).</li>
                <li>¿Falta de espacio? Investiga <strong>Expansión territorial</strong> (disponible tras Terraformación nivel 18) y luego construye:
                    <ul>
                        <li>la <strong>Ciudad flotante</strong> (nivel 1 de Expansión territorial): +10 de terreno por nivel;</li>
                        <li>la <strong>Estación orbital</strong> (nivel 2): +5 de espacio por nivel.</li>
                    </ul>
                    Cada una sube hasta el nivel 5 y se paga en puntos de guerra: 2&nbsp;000 × el nivel objetivo (30&nbsp;000 puntos de guerra por los 5 niveles). Si no, destruye un edificio que haya dejado de ser útil.</li>
                <li>Vigila la <strong>autonomía alimentaria</strong>. Solo los trabajadores comen, a razón de 1 ración por hora por cada 500 trabajadores. Un nivel de Campo agrícola alimenta a 81&nbsp;000, un nivel de Granja aeropónica a 111&nbsp;000.</li>
                <li>Una <strong>luna</strong> produce 1&nbsp;200 raciones por hora. Transpórtalas en cargo a tus planetas, o deja una flota cargada de raciones en órbita: el planeta toma de ella cuando su granero está vacío.</li>
            </ol>

            <h2 id="specialiser">Especializar tus planetas</h2>
            <p>Varios planetas = posibilidad de especializarlos según su posición y sus edificios:</p>
            <ul>
                <li><strong>Planeta económico</strong>: muchas minas, trabajadores, venta a los comerciantes cercanos.</li>
                <li><strong>Planeta militar</strong>: Astillero espacial, Fábrica de armamento, Industria pesada, grandes defensas, para estacionar allí tu flota.</li>
                <li><strong>Planeta de investigación</strong>: Centro de investigación subido alto para alojar a muchos científicos (consulta <em>Trabajadores y científicos</em> para su efecto real sobre la velocidad de investigación).</li>
                <li><strong>Puesto avanzado fronterizo</strong>: Radar espacial, Inhibidor de radar, sondas, torretas. Sirve para vigilar o contener a un vecino.</li>
            </ul>

            <h2 id="capitale">¿Adónde va tu héroe si pierde su puesto?</h2>
            <p>No hay planeta capital. Un héroe nunca se destruye. Si su flota es aniquilada o su planeta perdido, puede ser <strong>capturado</strong> por un jugador que posea una Prisión: un 20&nbsp;% de riesgo en combate espacial, un 35&nbsp;% en una invasión.</p>
            <p>Si no, se une automáticamente al <strong>más antiguo de tus planetas o lunas que no tenga ya un héroe</strong>. Si no hay ninguno, tu héroe principal envía a un héroe secundario en reserva para ocupar su lugar.</p>

    planet_abandon:
        title: "Abandonar un planeta"
        category: "planet"
        order: 4
        tags: "abandono,planeta,eliminación,game over"
        summary: "Cuándo es buena idea, cómo hacerlo y por qué conviene abstenerse en ciertos casos."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">¿Por qué abandonar un planeta?</h2>
            <ul>
                <li>Está <strong>demasiado expuesto</strong> a los ataques y te cuesta más de lo que te aporta.</li>
                <li>Está <strong>mal ubicado</strong> (lejos de todo, difícil de defender).</li>
                <li>Quieres <strong>colonizar uno mejor</strong>, pero has alcanzado el límite de planetas.</li>
            </ul>

            <h2 id="comment">Cómo hacerlo</h2>
            <p>Ve a la página <strong>Planetas</strong>: el enlace <strong>Abandonar</strong> está junto a las coordenadas del planeta. El juego te pregunta «¿Desea abandonar el planeta?»; una vez confirmado <em>Abandonar</em>, el abandono es <strong>inmediato y definitivo</strong>.</p>
            <p>El enlace solo aparece si el abandono es posible:</p>
            <ul>
                <li>te queda al menos otro planeta (las lunas no cuentan);</li>
                <li>no es una luna: una luna no se abandona nunca;</li>
                <li>ninguna flota extranjera en modo ataque va de camino hacia él ni está estacionada en órbita.</li>
            </ul>
            <p>Antes de soltarlo, <strong>evacúa recursos, Legionarios, Mechas y naves en tierra</strong> hacia otro planeta: todo lo que quede se pierde. Un héroe destinado en el planeta se traslada automáticamente a otro de tus planetas o lunas que aún no tenga héroe.</p>
            <p>En qué se convierte el planeta:</p>
            <ul>
                <li>en un servidor sin colmena de Cthulhu, vuelve a ser un planeta deshabitado y arrasado: solo le quedan un Astillero espacial y un Radar terrestre de nivel 1;</li>
                <li>en un servidor con la colmena, un planeta pequeño que ha conservado su tamaño original (25 de terreno, 5 de espacio) simplemente queda libre, edificios incluidos; cualquier otro planeta se convierte en una <strong>base alien</strong>.</li>
            </ul>
            <p><strong>¿Se puede cancelar?</strong> No: no hay plazo ni vuelta atrás. Para recuperar el planeta, hay que reconquistarlo. Si ha vuelto a quedar libre, vuelve a colonizarlo (necesitas un colonizador y un hueco libre). Si se ha convertido en una base alien, invádela para liberarla y luego vuelve a colonizarla.</p>

            <h2 id="danger">¿Y mi último planeta?</h2>
            <p>No puedes abandonarlo: mientras solo te quede un planeta, el juego lo rechaza (tus lunas no cuentan). En cambio, <strong>perder</strong> tu último planeta, por ejemplo tras una invasión, provoca el <strong>Game Over</strong>: consulta el artículo <em>Game Over</em>.</p>

    galaxy_navigation:
        title: "Navegar por la galaxia"
        category: "planet"
        order: 5
        tags: "galaxia,sector,navegación,mapa,universo,coordenadas,sistema,comerciante,hiperespacio"
        summary: "Cómo está organizado el universo, cómo leer una coordenada y cómo usar el mapa."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Cómo está organizado el universo</h2>
            <p>El universo es una jerarquía:</p>
            <ul>
                <li>El <strong>Universo</strong> de un servidor contiene una o varias <strong>Galaxias</strong>: se añade una galaxia nueva automáticamente cuando escasean los planetas de inicio libres, hasta un máximo de 32. La pestaña <strong>Universo</strong> del Mapa espacial muestra cuántas hay. En Battle Royale solo hay una.</li>
                <li>Cada <strong>Galaxia</strong> contiene 100 <strong>Sectores</strong> (cuadrícula de 10×10, numerados del 1 al 100 fila por fila). El Mapa espacial los llama «sistemas».</li>
                <li>Cada <strong>Sector</strong> contiene 25 <strong>Posiciones</strong> (cuadrícula de 5×5).</li>
            </ul>
            <p>Cada posición puede contener un planeta (habitado o no), un comerciante, una base alien, un campo de escombros, una luna, o estar vacía. La posición 13, en el centro del sector, es siempre un sol. Los comerciantes se encuentran en 20 sectores fijos de cada galaxia: 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 y 56.</p>

            <h2 id="coordonnees">Leer una coordenada</h2>
            <p>Formato: <strong>Galaxia:Sector:Posición</strong>, por ejemplo <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — primera galaxia;</li>
                <li><strong>5</strong> — quinto sector de esa galaxia (en la primera fila de la cuadrícula);</li>
                <li><strong>12</strong> — duodécima posición de ese sector.</li>
            </ul>

            <h2 id="carte">Usar el mapa</h2>
            <p>La página <strong>Mapa espacial</strong> (menú de la izquierda) te muestra la vista espacial. Puedes:</p>
            <ul>
                <li>Desplazarte entre galaxias y sectores.</li>
                <li>Hacer clic en una posición para ver qué hay.</li>
                <li><strong>Enviar directamente una flota</strong>: haz clic en la casilla y luego en <strong>Interacción</strong> (el botón aparece en cuanto al menos una de tus flotas está detenida), elige la flota y la misión, y haz clic en <strong>Enviar</strong>. El mismo panel ofrece acciones rápidas según la casilla: <em>Sondear el planeta</em>, <em>Colonizar el planeta</em>, <em>Desplegar radar</em> o <em>Desplegar inhibidor</em>, <em>Enviar un misil nuclear</em>.</li>
                <li>Ver las posiciones de aliados, enemigos y comerciantes (según tus relaciones y tu radar).</li>
            </ul>
            <p>Las <strong>flotas en tránsito</strong> aparecen como pequeñas naves animadas que se deslizan en tiempo real entre el planeta de origen y el destino. El <strong>halo de color</strong> indica el bando: <strong>azul</strong> = tú, <strong>verde</strong> = alianza y aliados, <strong>gris</strong> = pacto/paz, <strong>magenta</strong> = comerciante, <strong>violeta</strong> = alien, <strong>rojo</strong> = enemigo. El <strong>tamaño</strong> refleja la firma de la flota. Tus flotas y las de tu alianza siempre son visibles; las demás solo aparecen si tu <strong>radar</strong> cubre el sector. En un vuelo de larga distancia que atraviesa varios sectores, la nave pequeña solo aparece durante la última fracción del trayecto —la entrada en el sector de destino—, no durante todo el viaje.</p>

            <h2 id="hyperespace">Viajes entre galaxias</h2>
            <p>Para ir de una galaxia a otra, necesitas la investigación <strong>Tecnología hiperespacial</strong>. La distancia es siempre de 18 (aproximadamente 6 sectores: menos que cruzar una galaxia), pero el combustible es caro: la firma de la flota dividida entre 8, en Bitcoins (125 Bitcoins por 1&nbsp;000 cazas). Detalles en <em>Desplazamiento y distancia</em>.</p>

    radar_jammer:
        title: "Radar e interferencia"
        category: "planet"
        order: 6
        tags: "radar,inhibidor,interferencia,jammer,detección,vigilancia,escáner"
        summary: "Ver qué se mueve en un sector y ocultar tus planetas a los radares enemigos."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs Inhibidor</h2>
            <ul>
                <li><strong>Radar</strong> — te muestra el sector donde se encuentra: los planetas y las flotas en movimiento, antes de su llegada.</li>
                <li><strong>Inhibidor</strong> — oculta <strong>un planeta</strong> a los radares enemigos que no sean más potentes que él: su información, la firma de las flotas que se dirigen a él, y el origen o el destino de las flotas que salen de él o van hacia él.</li>
            </ul>

            <h2 id="detection">Los radares disponibles</h2>
            <table>
                <tr><th>Tipo</th><th>Dónde</th><th>Función</th></tr>
                <tr><td><strong>Radar terrestre</strong> (edificio)</td><td>En el planeta (espacio en tierra)</td><td>+1 de potencia de radar por nivel. Requisito: Escáner de sistema nivel 1.</td></tr>
                <tr><td><strong>Radar espacial</strong> (edificio)</td><td>En el planeta (espacio en el cielo)</td><td>Mismo efecto, +1 por nivel: útil cuando te falta sitio en tierra. Requisito: Escáner de sistema nivel 3.</td></tr>
                <tr><td><strong>Nave radar</strong></td><td>Desplegada en una casilla vacía</td><td>Instala un radar de potencia 1 durante 2&nbsp;h: práctico para vigilar un sector donde no tienes ningún planeta.</td></tr>
            </table>
            <p>Un radar cubre todo el sector donde se encuentra, y solo ese. Los niveles de los dos edificios de un mismo planeta se suman; en un sector, cuenta el mejor planeta (el tuyo, el de un miembro de tu alianza o el de un aliado). Un héroe Explorador destinado en el planeta refuerza su radar: +1 desde el nivel 5 (rasgo Explorador), +3 en total desde el nivel 15 (con el rasgo Cartógrafo además).</p>
            <p>El juego te avisa con una notificación cuando una flota enemiga se dirige a tu planeta, tengas radar o no; el radar sirve para <em>ver</em> las flotas y los planetas del sector.</p>

            <h2 id="brouillage">Los inhibidores disponibles</h2>
            <table>
                <tr><th>Tipo</th><th>Dónde</th><th>Función</th></tr>
                <tr><td><strong>Inhibidor de radar</strong> (edificio)</td><td>En el planeta (espacio en el cielo)</td><td>+1 de potencia de interferencia por nivel. Mientras iguale o supere el radar enemigo del sector, el planeta queda oculto a ese enemigo. Requisito: Escáner de sistema nivel 5.</td></tr>
                <tr><td><strong>Nave inhibidora</strong></td><td>Desplegada en una casilla vacía</td><td>Instala un inhibidor de potencia 1 durante 1&nbsp;h en esa casilla. No protege a una flota en vuelo.</td></tr>
            </table>
            <p>Ejemplo: tu planeta tiene un Inhibidor de radar de nivel 3. Un enemigo cuyo mejor radar del sector es de nivel 3 no lo ve; con un radar de nivel 4, sí lo ve.</p>

            <h2 id="naves-en-tierra">Ver las naves en tierra</h2>
            <p>La <strong>firma en tierra</strong> —las naves estacionadas en un planeta— sigue una regla algo más flexible: una de tus flotas <strong>en órbita</strong> las cuenta a simple vista, incluso sin radar. Pero solo para ese planeta.</p>
            <p>El <strong>radar</strong> sigue siendo lo que te da esa lectura <strong>a distancia</strong>, en todo el sector. Y un <strong>Inhibidor de radar</strong> en el planeta cierra la observación: sin un radar superior al inhibidor, la firma en tierra vuelve a ser invisible, incluso con una flota encima.</p>

            <h2 id="strategie">Cómo usarlos</h2>
            <ul>
                <li><strong>Radar</strong> en cada planeta: como mínimo el Radar terrestre, para ver qué se mueve en tu sector.</li>
                <li><strong>Inhibidor de radar</strong> en tus planetas expuestos: con un nivel igual o superior al radar adversario, se vuelven ilegibles para él.</li>
                <li><strong>Despliega</strong> una nave radar en una casilla vacía del sector de tu vecino (acción «Desplegar radar» del Mapa espacial, o misión «Nave radar»): ves ese sector durante 2&nbsp;h.</li>
                <li>La investigación <strong>Escáner de sistema</strong> desbloquea los radares (nivel 1: Radar terrestre; nivel 3: Radar espacial y Nave radar; nivel 5: Inhibidor de radar y Nave inhibidora). No aumenta su potencia.</li>
            </ul>

    moon:
        title: "Las lunas"
        category: "planet"
        order: 7
        tags: "luna,lunar,moonmaker,comida,raciones,producción"
        summary: "Una luna produce 1 200 raciones por hora sin ocupar terreno. Cómo crear una con un Lunar, su tamaño y sus límites."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">¿Qué es una luna?</h2>
            <p>Una <strong>luna</strong> es un astro especial creado por una nave <strong>Lunar</strong> (a veces llamada Moon Maker). No produce niobio ni agua, sino una cantidad fija de <strong>20 raciones por minuto</strong>, es decir, 1&nbsp;200 por hora antes de bonus (1&nbsp;440 en alianza). Es tanto como un Campo agrícola de nivel 7 a 8 en un planeta, sin ocupar nada de terreno. Esta producción no se puede aumentar: no se construyen granjas en una luna.</p>
            <p>Una luna también acoge <strong>trabajadores</strong> (20&nbsp;000 desde su creación, hasta 200&nbsp;000), que aportan Bitcoins como en cualquier otro sitio. Puedes construir en ella la mayoría de los edificios (Gran ciudad, Centro de investigación, almacenes, Cuartel, Astillero espacial…), pero no minas, extractores ni granjas.</p>
            <p>Solo los trabajadores consumen raciones, a razón de 1 por hora por cada 500 trabajadores: las 1&nbsp;200 raciones de una luna alimentan, pues, a 600&nbsp;000 trabajadores. Esas raciones se quedan en la luna: transpórtalas en Cargos a tus planetas, o deja en órbita de un planeta una flota cargada de raciones, que las usará cuando su granero esté vacío.</p>

            <h2 id="creation">Cómo crear una luna</h2>
            <p>Una luna nace de un <strong>campo de escombros</strong>: hace falta una <strong>posición vacía</strong> con al menos <strong>2M de niobio Y 2M de agua</strong> en escombros (dejados por una batalla espacial en ese lugar). La misión <em>Crear una luna</em> solo se ofrece en el mapa si la posición cumple esa condición.</p>
            <ol>
                <li>Fabrica un <strong>Lunar</strong> en el Astillero espacial. Hace falta la investigación Terraformación nivel 15 y una Industria pesada en el planeta. Cuesta 50&nbsp;000 de niobio, 23&nbsp;000 de agua, 20&nbsp;000 trabajadores y 200&nbsp;000 Bitcoins, con 5&nbsp;h de construcción base.</li>
                <li>Envíalo a la posición vacía con la misión <strong>Crear una luna</strong>: en el <em>Mapa espacial</em>, haz clic en la posición, luego en <em>Interacción</em>, elige la flota y la misión, y después <em>Enviar</em>. Si la flota ya está allí, el botón <em>Crear una luna</em> aparece en su ficha.</li>
                <li>Al llegar, se consume un Lunar, se crea la luna y <strong>se consumen todos los escombros</strong>. Si ya no se cumplen las condiciones (escombros reciclados durante el vuelo, posición ocupada…), un informe te explica el fallo.</li>
            </ol>
            <p>El Lunar es la nave más lenta del juego, y su mantenimiento es pesado: 5&nbsp;000 Bitcoins al día mientras está en una flota, 833 cuando se queda en tierra. Ponlo en flota solo en el último momento.</p>

            <h2 id="tamano">Tamaño de la luna</h2>
            <p>Cuanto más rico es el campo de escombros, más grande es la luna. El escalón lo fija el <strong>menor</strong> de los dos recursos:</p>
            <table>
                <thead>
                    <tr><th>Escombros (mín. niobio/agua)</th><th>Terreno</th><th>Espacio</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M o más</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Los valores se sortean al azar dentro del intervalo. Ejemplo: un campo de 12M de niobio y 6M de agua da una luna de 100 a 150 de terreno, porque es el agua (6M) la que fija el escalón. Una luna suele ser más grande que un planeta, cuyo terreno de origen va de 25 a 190.</p>

            <h2 id="limitations">Límites</h2>
            <ul>
                <li>Una luna no produce niobio ni agua: solo raciones y trabajadores.</li>
                <li>Puede ser atacada, saqueada e invadida (por una flota en órbita), pero no se puede sondear.</li>
                <li>No cuenta para tu límite de planetas, ni para el límite de 4 planetas de la protección de principiantes.</li>
                <li>Una luna no se puede abandonar nunca.</li>
                <li>Construir una luna cerca de tu casa es más seguro (menos expuesta a los vecinos hostiles).</li>
            </ul>

            <h2 id="strategie">Cuándo crear una</h2>
            <ul>
                <li>Tus planetas muy poblados andan escasos de raciones: una luna cercana te aporta 1&nbsp;200 por hora, para transportar en Cargos o dejar a bordo de una flota en órbita del planeta.</li>
                <li>Una gran batalla ha dejado un <strong>campo de escombros rico</strong> en una posición vacía cerca de tu casa: en lugar de reciclarlo todo, transfórmalo en una luna.</li>
                <li>Estás bien establecido, tienes recursos que gastar y buscas consolidar tu economía.</li>
            </ul>

    alliance_basics:
        title: "Crear y unirse a una alianza"
        category: "alliance"
        order: 1
        tags: "alianza,creación,unirse,invitación,bonus,régimen,política,nivel,miembros"
        summary: "Unirte a una alianza por invitación o crear la tuya, elegir su régimen político y subir de nivel para acoger a más miembros."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">¿Por qué unirse a una alianza?</h2>
            <ul>
                <li><strong>+20&nbsp;% de producción</strong> de niobio, agua y raciones, desde que entras en la alianza.</li>
                <li>Las <strong>7 investigaciones políticas</strong> del régimen de tu alianza (bonus económicos, militares o defensivos), que lanzas tú mismo en la página <strong>Investigaciones</strong>.</li>
                <li>Las <strong>mejoras de alianza</strong> (16 bonus colectivos) y la <strong>ayuda de construcción</strong>.</li>
                <li>Una <strong>tesorería compartida</strong> en Bitcoins y en Puntos de Guerra.</li>
                <li>La <strong>diplomacia</strong> (guerras, paz, pactos, alianzas defensivas), una <strong>sala</strong> reservada a los miembros y la <strong>Arena Alianza</strong>.</li>
            </ul>
            <p>En resumen: jugar en solitario es viable al principio. Pero en cuanto el juego se pone serio, una alianza multiplica tus posibilidades de progresar.</p>

            <h2 id="rejoindre">Cómo unirte</h2>
            <ol>
                <li>Localiza una alianza: la clasificación de alianzas («Clasificación de Alianzas»), la ficha de una alianza, la sala Universo.</li>
                <li>Contacta con uno de sus miembros (mensaje privado, sala). En el juego no existen las solicitudes de ingreso: <strong>es la alianza la que te invita</strong>.</li>
                <li>Un miembro que tenga el permiso <strong>Reclutar</strong> te envía una invitación desde la pestaña <strong>Añadir un miembro</strong> de su página Alianza. Ahí ve a los jugadores sin alianza que se han conectado en los últimos 2 meses.</li>
                <li>Abre tu página <strong>Alianza</strong> (menú): la invitación aparece bajo «Propuesta(s) de reclutamiento». Haz clic en <strong>Aceptar</strong>.</li>
            </ol>
            <p>Una alianza solo puede invitar si tiene una plaza libre: cada invitación pendiente cuenta como un miembro hasta que respondas.</p>
            <p>También puedes <strong>crear tu propia alianza</strong> desde la misma página. Eliges:</p>
            <ul>
                <li>un <strong>nombre</strong> (20 caracteres como máximo, único en el servidor) y un <strong>tag</strong> (5 caracteres como máximo, único);</li>
                <li>un grito de guerra (30 caracteres) y una descripción (1&nbsp;500 caracteres), que podrás modificar después;</li>
                <li>el <strong>impuesto de alianza</strong>, del 5 al 50&nbsp;%, que <strong>ya no se podrá modificar</strong>;</li>
                <li>el <strong>régimen político</strong>, definitivo.</li>
            </ul>
            <p>Te conviertes en el dirigente de la alianza. Su tesorería empieza vacía.</p>

            <h2 id="invitations">Recibir invitaciones</h2>
            <p>Un miembro que tenga el permiso <strong>Reclutar</strong> puede <strong>invitarte</strong> directamente. Puedes recibir <strong>una invitación de cada alianza a la vez</strong>: que te solicite una no te hace invisible para las demás. En cambio, una misma alianza no puede invitarte dos veces mientras no hayas respondido. Las alianzas que te localizan ven que ya estás <strong>solicitado</strong>, sin saber por quién. En cuanto <strong>aceptas</strong> una invitación, todas las demás se retiran automáticamente. Si una alianza se <strong>disuelve</strong>, su invitación desaparece de tu lista.</p>

            <h2 id="delai">Plazo tras abandonar una alianza</h2>
            <p>Después de <strong>abandonar</strong> una alianza, de ser <strong>expulsado</strong> o tras su <strong>disolución</strong> por su dirigente, se aplica un <strong>plazo de 2&nbsp;días</strong>: no puedes <strong>crear</strong> ni <strong>unirte a</strong> una alianza antes de que termine la cuenta atrás, que se muestra en la página Alianza. Si la alianza desaparece por sí sola (Game Over del dirigente de El Martillo de las Estrellas, o del último miembro), este plazo es de <strong>12&nbsp;horas</strong>. Este plazo evita las idas y venidas abusivas entre alianzas.</p>
            <p><strong>Abandonar</strong> solo es posible en <strong>La Balanza de los Mundos</strong>, y con cuatro condiciones: no ser el Presidente, no ser el último miembro, que la alianza no esté en guerra y que ninguna de tus flotas esté en combate. Una <strong>expulsión</strong> tampoco es posible durante una guerra, ni si una flota del miembro afectado está en combate.</p>
            <p>Al irte, pierdes el bonus de producción y las mejoras de alianza, y <strong>tus investigaciones políticas vuelven a cero</strong>.</p>

            <h2 id="regimes">Los 3 regímenes políticos</h2>
            <p>Al <strong>crear</strong> una alianza, eliges su <strong>régimen político</strong>. Esta elección es <strong>definitiva</strong>: fija el número de miembros iniciales, las 7 investigaciones políticas accesibles y varias reglas internas. Todo el detalle: <a href="/wiki/political_system">Los 3 regímenes políticos</a>.</p>

            <h3 id="democratie">La Balanza de los Mundos</h3>
            <ul>
                <li>3 miembros al inicio; un Presidente elegido por el voto de los miembros.</li>
                <li>Los miembros pueden abandonar la alianza (salvo el Presidente, y nunca en tiempo de guerra).</li>
                <li>Investigaciones económicas: producción, velocidad de las investigaciones, mantenimiento de los científicos, Cargos, blindaje de las naves, ventas a los comerciantes, colonización.</li>
                <li>Todos los miembros son visibles públicamente, así como la posición de su primer planeta.</li>
                <li>+20&nbsp;% de armas en ataque contra El Baluarte Silencioso.</li>
            </ul>

            <h3 id="communisme">El Baluarte Silencioso</h3>
            <ul>
                <li>4 miembros al inicio; todos los miembros son dirigentes.</li>
                <li>Impuesto de alianza fijado en el 50&nbsp;%; imposible abandonar la alianza.</li>
                <li>Investigaciones ofensivas: reciclaje, defensa de los trabajadores, potencia de las naves, mantenimiento y reclutamiento de los Legionarios, invasiones, Puntos de Guerra.</li>
                <li>+20&nbsp;% de armas en ataque contra El Martillo de las Estrellas.</li>
            </ul>

            <h3 id="fascisme">El Martillo de las Estrellas</h3>
            <ul>
                <li>2 miembros al inicio; un único dirigente, el Primaris.</li>
                <li>Imposible abandonar o disolver la alianza; si el Primaris cae en Game Over, la alianza se disuelve.</li>
                <li>Investigaciones defensivas: trabajadores, potencia de las naves, barcazas, Legionarios, mantenimiento y defensa de los Mechas, invasiones. La amenaza Cthulhu sube más despacio.</li>
                <li>Solo se muestra públicamente al dirigente.</li>
                <li>+20&nbsp;% de armas en ataque contra La Balanza de los Mundos.</li>
            </ul>

            <h2 id="niveau">Nivel de alianza y número de miembros</h2>
            <p>Una alianza empieza con <strong>3 plazas</strong> (La Balanza de los Mundos), <strong>4</strong> (El Baluarte Silencioso) o <strong>2</strong> (El Martillo de las Estrellas). Para acoger a más gente, un miembro que tenga el permiso <strong>Modificar</strong> sube su <strong>nivel</strong> con el botón «Subir nivel de la alianza» de la pestaña <strong>Banco</strong>. El coste lo paga la <strong>tesorería</strong>. Cada nivel desbloquea además una investigación política más (consulta <a href="/wiki/alliance_research">Investigaciones de alianza</a>).</p>
            <table>
                <thead>
                    <tr><th>Paso</th><th>Coste (tesorería)</th><th>Plazas adicionales</th><th>Plazas totales Balanza / Baluarte / Martillo</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125&nbsp;000 Bitcoins</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225&nbsp;000 Bitcoins + 2&nbsp;500 PDG</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600&nbsp;000 Bitcoins + 10&nbsp;000 PDG</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1&nbsp;000&nbsp;000 Bitcoins + 25&nbsp;000 PDG</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50&nbsp;000 PDG</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10&nbsp;000&nbsp;000 Bitcoins</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15&nbsp;000&nbsp;000 Bitcoins + 125&nbsp;000 PDG</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35&nbsp;000&nbsp;000 Bitcoins + 300&nbsp;000 PDG</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50&nbsp;000&nbsp;000 Bitcoins + 500&nbsp;000 PDG</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100&nbsp;000&nbsp;000 Bitcoins + 1&nbsp;000&nbsp;000 PDG</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>El nivel 10 es el máximo.</p>

            <h2 id="compte-valide">Cuenta por validar</h2>
            <p>⚠️ Para <strong>crear o unirte a</strong> una alianza, tu cuenta debe estar <strong>validada</strong> y tu <strong>correo confirmado</strong>. Las cuentas de prueba o anónimas no pueden unirse a una alianza: confirma tu correo desde <strong>Mis opciones</strong>.</p>
            <p>Otros casos en los que es imposible: durante el plazo que sigue a una salida o una expulsión (ver más arriba), mientras una de tus flotas esté metida en un combate, en un servidor <strong>Battle Royale</strong>, y para el VIP de un servidor <strong>Search &amp; Destroy</strong>. Sin correo confirmado, tampoco puedes depositar ni retirar de la tesorería, invertir en las mejoras ni ayudar con las construcciones.</p>

    alliance_grades:
        title: "Grados y permisos"
        category: "alliance"
        order: 2
        tags: "grados,permisos,roles,jerarquía,oficial,dirigente,voto,inactivo"
        summary: "Cómo funciona la jerarquía interna de una alianza y quién tiene derecho a hacer qué."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Una alianza se organiza por <strong>grados</strong>, del más alto (el dirigente, rango&nbsp;1) al más bajo (rango&nbsp;5). Cada grado lleva una lista de <strong>permisos</strong> que indica lo que sus miembros pueden hacer.</p>

            <h2 id="hierarchie">Los grados iniciales</h2>
            <p>Cada alianza empieza con 4 grados, según su régimen:</p>
            <table>
                <thead>
                    <tr><th>Régimen</th><th>Dirigente (rango 1, todos los permisos)</th><th>Rango 2</th><th>Rango 3</th><th>Nuevos miembros</th></tr>
                </thead>
                <tbody>
                    <tr><td>La Balanza de los Mundos</td><td>Presidente</td><td>Ministro (Reclutar, Ver)</td><td>Ciudadano (Ver)</td><td>Minero (rango 5, ningún permiso)</td></tr>
                    <tr><td>El Martillo de las Estrellas</td><td>Primaris</td><td>Capitán (Reclutar, Ver)</td><td>Soldado (Ver)</td><td>Aspirante (rango 5, ningún permiso)</td></tr>
                    <tr><td>El Baluarte Silencioso</td><td>Guía, Protector, Camarada (todos rango 1)</td><td>Gulag (ningún permiso)</td><td>—</td><td>Camarada (todos los permisos)</td></tr>
                </tbody>
            </table>
            <p>Un miembro que tenga el permiso <strong>Modificar</strong> puede crear otros grados en la pestaña <strong>Administración</strong>: les da un nombre, un «tipo de grado» de 2 a 5 (el rango) y permisos. El rango&nbsp;1 está reservado a los dirigentes.</p>

            <h2 id="permissions">Los permisos</h2>
            <p>Los permisos de un grado se eligen al <strong>crearlo</strong>:</p>
            <ul>
                <li><strong>Reclutar</strong>: invitar a jugadores.</li>
                <li><strong>Expulsar</strong>: expulsar a un miembro (imposible en tiempo de guerra).</li>
                <li><strong>Pacto</strong>: proponer, aceptar, rechazar o romper un pacto de no agresión o una alianza defensiva. También es necesario para la guerra y la paz.</li>
                <li><strong>Guerra</strong>: declarar la guerra y negociar la paz (también hace falta el permiso Pacto).</li>
                <li><strong>Modificar</strong>: gestionar los grados y su asignación, el DEFCON, la imagen, el grito de guerra y la descripción, validar las solicitudes de retirada de la tesorería, subir el nivel de la alianza, disolverla. Las retiradas solicitadas por este grado son inmediatas.</li>
                <li><strong>Flotas</strong>: retirar del reparto las flotas que otros miembros han compartido con la alianza.</li>
                <li><strong>Ver</strong>: ver en el mapa espacial las flotas de todos los miembros y de las alianzas defensivas aliadas. Sin él, solo ves las tuyas.</li>
            </ul>
            <p>Los permisos de un grado existente no se modifican: crea un grado nuevo, asígnalo y luego elimina el antiguo (sus miembros bajan al grado más bajo). Solo puedes dar a un grado permisos que tú mismo tengas. Siempre debe quedar al menos un grado de cada uno de los rangos 1, 2, 3 y 5, y no puedes eliminar tu propio grado.</p>

            <h2 id="changer">Ascender o degradar</h2>
            <p>Un miembro que tenga el permiso <strong>Modificar</strong> cambia el grado de otro haciendo clic en su <strong>rango</strong> en la lista de miembros. Es una forma de recompensar a los activos y de guiar a los nuevos.</p>
            <p>Límites:</p>
            <ul>
                <li>no se puede dar un grado que tenga más permisos que el propio;</li>
                <li>nadie puede degradar al último dirigente, y un dirigente no puede cambiar su propio grado;</li>
                <li>el grado de <strong>Presidente</strong> (Balanza) o de <strong>Primaris</strong> (Martillo) no se asigna nunca a mano: el Presidente cambia por votación, el Primaris solo por la sustitución automática de un jefe inactivo (ver más abajo);</li>
                <li>en El Baluarte Silencioso, Guía, Protector y Camarada se intercambian libremente.</li>
            </ul>

            <h2 id="regimes">Casos particulares según el régimen</h2>
            <ul>
                <li><strong>El Baluarte Silencioso</strong>: todos los miembros son dirigentes, con todos los derechos, y los recién llegados entran como Camaradas. El único grado inferior es el <strong>Gulag</strong>, sin ningún permiso, que se asigna para apartar a un miembro.</li>
                <li><strong>El Martillo de las Estrellas</strong>: un único dirigente, el Primaris, que no se puede elegir ni nombrar. Solo se le sustituye si permanece inactivo más de 7 días (ver más abajo). Si cae en <strong>Game Over</strong>, la alianza se disuelve.</li>
                <li><strong>La Balanza de los Mundos</strong>: cada miembro tiene un voto, que puede cambiar en cualquier momento, desde la pestaña de los miembros («Votar por su presidente»). En cuanto un miembro tiene más votos que el Presidente, se convierte en Presidente y el anterior toma su grado.</li>
            </ul>

            <h2 id="afk">Sustitución automática de un jefe inactivo</h2>
            <p>Si un <strong>dirigente</strong> deja de conectarse durante <strong>más de 7 días</strong>, se le sustituye automáticamente para evitar que la alianza quede paralizada:</p>
            <ul>
                <li>El <strong>miembro de grado más alto</strong> entre los que no son dirigentes y se han conectado en los últimos 7 días toma el mando de la alianza. A igualdad de grado, es el que tiene más <strong>puntos en la clasificación</strong>.</li>
                <li>Los dos grados simplemente se <strong>intercambian</strong>: el antiguo jefe recupera el grado del sustituto. El cambio queda anotado en el historial de la alianza.</li>
                <li>La regla vale para los tres regímenes. En El Baluarte Silencioso, donde todos son dirigentes, solo un miembro con el grado Gulag puede ocupar el lugar de un dirigente inactivo.</li>
                <li>Si <strong>no hay ningún candidato activo</strong>, no cambia nada.</li>
            </ul>

    diplomacy:
        title: "La diplomacia"
        category: "alliance"
        order: 3
        tags: "diplomacia,guerra,paz,pacto,aliado,alianza defensiva,defcon,tratado,impuesto de paz"
        summary: "Los 4 tipos de relaciones entre alianzas, cómo negociarlas y qué significa el DEFCON."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Tu alianza mantiene <strong>relaciones</strong> con las demás alianzas del servidor. Estas relaciones cambian las reglas entre vuestros miembros respectivos: quién puede saquear o invadir a quién, y quién combate junto a quién. La diplomacia se gestiona en la pestaña <strong>Pactos</strong> de la página Alianza.</p>

            <h2 id="types">Los 4 tipos de relaciones</h2>
            <table>
                <thead>
                    <tr><th>Tipo</th><th>Efecto</th><th>Puesta en marcha y fin</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ninguna relación</strong></td><td>Situación por defecto: los raids, las invasiones y los combates son posibles.</td><td>—</td></tr>
                    <tr><td><strong>Guerra</strong></td><td>Las flotas <strong>armadas</strong> de las dos alianzas que coinciden en un planeta se enfrentan automáticamente, incluso sin modo ataque. Durante la guerra, es imposible expulsar a un miembro, abandonar o disolver la alianza. El juego cuenta las invasiones y los PDG ganados y perdidos de cada bando.</td><td>Se declara <strong>de inmediato</strong>, sin aceptación (permisos Guerra y Pacto). Las dos alianzas pasan a DEFCON 5 y sus miembros reciben una alerta. Solo termina con una <strong>paz</strong> aceptada.</td></tr>
                    <tr><td><strong>Paz</strong></td><td>Ningún raid ni invasión entre vosotros. El vencido paga el <strong>impuesto de paz</strong> acordado: una parte de sus ingresos diarios y una parte de los PDG que gana en combate, ingresadas en la tesorería del vencedor.</td><td>Se propone desde una guerra en curso, con el botón «Hacer la paz». Dura <strong>4 días</strong>, tras los cuales las dos alianzas vuelven a ser neutrales.</td></tr>
                    <tr><td><strong>Pacto de no agresión</strong></td><td>Ningún raid ni invasión entre vosotros. En una batalla, una alianza que tiene un pacto con el bando contrario no combate.</td><td>Se propone y luego lo acepta el otro bando. Se rompe <strong>de inmediato</strong>.</td></tr>
                    <tr><td><strong>Alianza defensiva</strong></td><td>Ningún raid ni invasión entre vosotros. Vuestras flotas combaten <strong>en el mismo bando</strong>. Radar y flotas compartidos en el mapa (con el permiso Ver). Una <strong>sala común</strong> a las dos alianzas.</td><td>Se propone y luego se acepta. La ruptura surte efecto <strong>12 horas</strong> después; la sala común y sus mensajes se eliminan entonces.</td></tr>
                </tbody>
            </table>
            <p>No se puede declarar la guerra a una alianza con la que se tiene un pacto, una alianza defensiva o una paz en curso: rompe primero el pacto o la alianza defensiva. Una paz, en cambio, no se rompe: hay que esperar a que expire.</p>

            <h2 id="proposer">Cómo proponer un tratado</h2>
            <ol>
                <li>Página <strong>Alianza</strong>, pestaña <strong>Pactos</strong> («Diplomacia de la alianza»).</li>
                <li>En «Proponer», introduce el <strong>tag</strong> de la alianza elegida y escoge <strong>Alianza defensiva</strong>, <strong>Pacto de no agresión</strong> o <strong>Declarar guerra</strong>.</li>
                <li>La otra alianza ve tu solicitud en «Solicitudes recibidas»: puede <strong>aceptarla</strong> o <strong>rechazarla</strong>. No hay contrapropuesta: para cambiar los términos, rechaza y haz tu propia propuesta. Solo puede haber una propuesta pendiente entre dos alianzas.</li>
            </ol>
            <p>Un pacto puede convertirse en una alianza defensiva, y una paz puede convertirse en un pacto o en una alianza defensiva: la aceptación sustituye a la relación anterior (una paz y su impuesto terminan entonces).</p>

            <h2 id="paix">Negociar la paz</h2>
            <p>En la lista «Guerras en curso», haz clic en <strong>Hacer la paz</strong> junto a la guerra correspondiente y rellena los términos:</p>
            <ul>
                <li><strong>Tipo</strong>: <strong>Proponer</strong> (ofreces los términos, y será tu alianza la que pague) o <strong>Reclamar</strong> (exiges que el adversario pague).</li>
                <li><strong>Bitcoin revertidos por día</strong>: 0 o del 10 al 25&nbsp;% de los ingresos diarios de cada miembro de la alianza vencida, descontados en el informe diario (18:59, hora de París). Ejemplo: al 20&nbsp;%, un miembro que cobra 10&nbsp;000 Bitcoins al día revierte 2&nbsp;000.</li>
                <li><strong>Porcentaje de pdg</strong>: 0 o del 25 al 50&nbsp;% de los PDG que los miembros vencidos ganan en combate.</li>
                <li><strong>Número de planetas</strong>: este campo (0 a 5) se guarda en los términos, pero no se transfiere ningún planeta.</li>
            </ul>
            <p>Haz clic en <strong>Firmar</strong>. El adversario ve tu propuesta en esa misma pantalla y puede aceptar los términos o rechazarlos; puedes cancelar la tuya mientras no haya respondido. Una vez aceptada, la paz dura 4 días.</p>

            <h2 id="defcon">El DEFCON (nivel de alerta)</h2>
            <p>Tu alianza tiene un <strong>nivel de alerta DEFCON</strong>, de <strong>0 a 5</strong>: <strong>cuanto más alta es la cifra, más tensa es la situación</strong>. 0 = ninguna alerta, 5 = alerta máxima. Un miembro que tenga el permiso <strong>Modificar</strong> lo ajusta en la pestaña <strong>Administración</strong> («Nivel de defensa»). Una <strong>declaración de guerra</strong> pone automáticamente a las dos alianzas en <strong>DEFCON 5</strong>.</p>
            <p>El nivel se muestra como un banner en la <strong>Vista general</strong> de todos los miembros (verde en 1, naranja en 2, rojo de 3 a 5, nada en 0), con la lista de las alianzas con las que estás en guerra. Es una señal de coordinación, sin efecto en los combates.</p>

            <h2 id="logs">El registro diplomático</h2>
            <p>Toda acción diplomática (declaración de guerra, propuesta, paz aceptada, pacto roto, propuesta rechazada…) se <strong>registra</strong> en el <strong>Historial</strong> de la alianza (pestaña de los miembros), con el apodo del autor, la fecha y la hora. Las llegadas, salidas, expulsiones y cambios de dirigente también figuran ahí. Útil para la transparencia interna y los debates a posteriori.</p>

    alliance_treasury:
        title: "Tesorería de alianza"
        category: "alliance"
        order: 4
        tags: "tesorería,banco,bitcoin,pdg,depósito,retirada,impuesto,nivel"
        summary: "La cuenta común de tu alianza en Bitcoins y en PDG: depósitos, impuesto de alianza, impuestos de paz, retiradas y subida de nivel."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Para qué sirve la tesorería</h2>
            <p>La tesorería de alianza (pestaña <strong>Banco</strong> de la página Alianza) es una cuenta común en <strong>Bitcoins</strong> y en <strong>Puntos de Guerra (PDG)</strong>. Sirve para:</p>
            <ul>
                <li><strong>Subir el nivel de la alianza</strong>, para acoger a más miembros y desbloquear las siguientes investigaciones políticas (consulta <a href="/wiki/alliance_basics#niveau">Nivel de alianza</a>).</li>
                <li><strong>Redistribuir</strong> Bitcoins o PDG a un miembro: echar una mano a un jugador en apuros, financiar una preparación para la guerra.</li>
            </ul>
            <p>Las investigaciones políticas <strong>no</strong> las paga la tesorería: cada jugador paga las suyas (consulta <a href="/wiki/alliance_research">Investigaciones de alianza</a>). Un bloqueo Cthulhu sufrido también puede descontar de ella un «Diezmo de los Poseídos».</p>

            <h2 id="alimenter">Cómo alimentarla</h2>
            <ul>
                <li><strong>Depósitos voluntarios</strong>: cualquier miembro puede ingresar Bitcoins o PDG (pestaña Banco, «Dar»), con un motivo si lo desea. Se requiere cuenta validada y correo confirmado.</li>
                <li><strong>Impuesto de alianza</strong>: siempre activo, se descuenta automáticamente a cada miembro en el informe diario (ver más abajo).</li>
                <li><strong>Impuestos de paz</strong>: cuando una alianza vencida te paga una paz, su impuesto diario en Bitcoins y su parte de los PDG ganados en combate caen en tu tesorería (consulta <a href="/wiki/diplomacy#paix">Negociar la paz</a>).</li>
                <li><strong>Arena Alianza</strong>: las recompensas de la alianza (Bitcoins y PDG) se ingresan en el banco.</li>
            </ul>

            <h2 id="retrait">Las retiradas</h2>
            <p>Cualquier miembro puede solicitar una <strong>retirada</strong> (pestaña Banco, «Retirar»), en Bitcoins o en PDG.</p>
            <ul>
                <li>Si tienes el permiso <strong>Modificar</strong>, o si tu alianza es un <strong>Baluarte Silencioso</strong>, la retirada es inmediata.</li>
                <li>Si no, la solicitud queda <strong>En espera</strong> hasta que un miembro que tenga el permiso Modificar la acepte («Sí»: los fondos se te ingresan) o la rechace («No»: la solicitud se elimina).</li>
                <li>La aceptación falla si la tesorería ya no tiene la suma, o si el solicitante ha abandonado la alianza entretanto.</li>
            </ul>
            <p>Cada movimiento queda anotado en el historial del banco.</p>

            <h2 id="taxes">El impuesto de alianza</h2>
            <p>El <strong>impuesto de alianza</strong> se elige <strong>al crear</strong> la alianza, del 5 al 50&nbsp;%. <strong>Después ya no se puede modificar</strong>. En El Baluarte Silencioso, está fijado en el 50&nbsp;%.</p>
            <p>Se descuenta automáticamente en el <strong>informe diario</strong> (18:59, hora de París), del ingreso en Bitcoins que te aportan tus trabajadores, y se ingresa en la tesorería (línea «Impuesto diario»).</p>
            <p>Cálculo: el descuento vale ingreso − ingreso ÷ (1 + tasa). Un impuesto del 10&nbsp;% retira, pues, alrededor del 9,1&nbsp;% del ingreso, y un impuesto del 50&nbsp;% retira un tercio. Ejemplo: sobre 10&nbsp;000 Bitcoins de ingreso diario, el 10&nbsp;% descuenta 909 Bitcoins, el 50&nbsp;% descuenta 3&nbsp;333.</p>
            <p>Elígelo razonable: si es demasiado alto, los miembros se van.</p>

            <h2 id="transparence">Transparencia</h2>
            <p>La pestaña <strong>Banco</strong> muestra a <strong>todos los miembros</strong> el historial de los 200 últimos movimientos: miembro, tipo (Bitcoins o PDG), importe, motivo, fecha y estado (Aceptada o En espera). Los impuestos diarios y los impuestos de paz también figuran ahí. Así, cada uno puede comprobar adónde va el dinero.</p>

    political_system:
        title: "Los 3 regímenes políticos"
        category: "alliance"
        order: 5
        tags: "política,régimen,bonus,balanza,baluarte,martillo"
        summary: "Los 3 regímenes posibles para una alianza: ventajas, inconvenientes y cómo elegir."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principe">Elegir al crear</h2>
            <p>Cuando se crea una alianza, el fundador elige un <strong>régimen político</strong>. Este régimen define <strong>reglas internas</strong>, <strong>bonus específicos</strong> y las <strong>7 investigaciones políticas</strong> que sus miembros pueden lanzar. La elección es <strong>irreversible</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>La Balanza de los Mundos</th><th>El Baluarte Silencioso</th><th>El Martillo de las Estrellas</th></tr>
                </thead>
                <tbody>
                    <tr><td>Miembros al inicio</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Dirigentes</td><td>Un Presidente, elegido por votación</td><td>Todos los miembros</td><td>Uno solo, el Primaris</td></tr>
                    <tr><td>Abandonar la alianza</td><td>Sí (salvo el Presidente)</td><td>No</td><td>No</td></tr>
                    <tr><td>Disolver la alianza</td><td>Sí</td><td>Sí</td><td>No</td></tr>
                    <tr><td>Impuesto de alianza</td><td>Elegido al crear (5 a 50&nbsp;%)</td><td>50&nbsp;%</td><td>Elegido al crear (5 a 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% de armas en ataque contra</td><td>El Baluarte Silencioso</td><td>El Martillo de las Estrellas</td><td>La Balanza de los Mundos</td></tr>
                </tbody>
            </table>
            <p>El número de miembros aumenta después con el <a href="/wiki/alliance_basics#niveau">nivel de la alianza</a>. Disolver una alianza es siempre imposible en tiempo de guerra.</p>

            <h2 id="balance">La Balanza de los Mundos (democrático)</h2>
            <p>Régimen abierto y económico. Los miembros votan para elegir a su Presidente. Centrado en la <strong>economía</strong>.</p>
            <ul>
                <li>3 miembros al inicio.</li>
                <li>Cada miembro tiene un voto, que puede cambiar en cualquier momento (pestaña de los miembros, «Votar por su presidente»). En cuanto un miembro tiene más votos que el Presidente, ocupa su lugar.</li>
                <li>+20&nbsp;% de armas en ataque contra El Baluarte Silencioso.</li>
                <li>Los miembros pueden abandonar la alianza (salvo el Presidente, y nunca en tiempo de guerra).</li>
                <li>Miembros visibles públicamente, así como la posición de su primer planeta.</li>
                <li>Investigaciones orientadas a la economía: producción, velocidad de las investigaciones, mantenimiento de los científicos, Cargos, blindaje de las naves, ventas a los comerciantes, colonización (detalle en <a href="/wiki/alliance_research">Investigaciones de alianza</a>).</li>
            </ul>

            <h2 id="rempart">El Baluarte Silencioso (ofensivo)</h2>
            <p>Régimen agresivo y colectivo. Todos los miembros son dirigentes. Centrado en la <strong>ofensiva</strong>.</p>
            <ul>
                <li>4 miembros al inicio (uno más que La Balanza de los Mundos).</li>
                <li>+20&nbsp;% de armas en ataque contra El Martillo de las Estrellas.</li>
                <li>Impuesto de alianza fijado automáticamente en el 50&nbsp;%.</li>
                <li>Las retiradas de la tesorería son inmediatas para todos los miembros.</li>
                <li>Imposible abandonar la alianza.</li>
                <li>Investigaciones orientadas al combate: reciclaje, defensa de los trabajadores, potencia de las naves, mantenimiento y reclutamiento de los Legionarios, invasiones, Puntos de Guerra.</li>
            </ul>
            <p>Los tres grados superiores (<strong>Guía</strong>, <strong>Protector</strong>, <strong>Camarada</strong>) son <strong>equivalentes</strong>: mismos derechos, ninguna jerarquía entre ellos. Se pueden asignar libremente entre miembros, y los recién llegados entran como Camaradas, con todos los derechos. El único grado inferior es el <strong>Gulag</strong>, sin ningún permiso, que se asigna para apartar a un miembro.</p>

            <h2 id="marteau">El Martillo de las Estrellas (defensivo)</h2>
            <p>Régimen discreto y defensivo. Un único dirigente, el Primaris, que solo se sustituye si permanece inactivo más de 7 días (consulta <a href="/wiki/alliance_grades#afk">Grados y permisos</a>). Centrado en la <strong>defensa</strong> y la resistencia.</p>
            <ul>
                <li>2 miembros al inicio (uno menos que La Balanza de los Mundos, dos menos que El Baluarte Silencioso).</li>
                <li>+20&nbsp;% de armas en ataque contra La Balanza de los Mundos.</li>
                <li>Amenaza Cthulhu que sube un 25&nbsp;% más despacio que en los otros dos regímenes: +150 en lugar de +200 por victoria contra los Cthulhu en dificultad normal (consulta <a href="/wiki/cthulhus#menace">La amenaza Cthulhu</a>). Muy útil en PvE.</li>
                <li>Solo se muestra públicamente al dirigente.</li>
                <li>Imposible abandonar la alianza. Imposible disolverla.</li>
                <li>Si el dirigente cae en Game Over, la alianza se disuelve.</li>
                <li>Investigaciones orientadas a la defensa: producción de trabajadores, potencia de las naves, capacidad de las barcazas, fuerza de los Legionarios, mantenimiento y defensa de los Mechas, invasiones.</li>
            </ul>

            <h2 id="combat">Bonus entre regímenes</h2>
            <p>Cada régimen domina a otro, como en piedra, papel o tijera:</p>
            <ul>
                <li>La Balanza de los Mundos vence a El Baluarte Silencioso.</li>
                <li>El Baluarte Silencioso vence a El Martillo de las Estrellas.</li>
                <li>El Martillo de las Estrellas vence a La Balanza de los Mundos.</li>
            </ul>
            <p>Cuando tu bando <strong>ataca</strong> en un combate espacial (o en la Arena Alianza) y tu régimen domina al del defensor, tus <strong>misiles, láseres y plasma</strong> ganan <strong>+20&nbsp;%</strong>. En defensa, o frente al mismo régimen, no hay bonus. Los combates terrestres no se ven afectados.</p>

            <h2 id="visibilite">Lo que los demás ven de ti</h2>
            <ul>
                <li><strong>La Balanza de los Mundos</strong>: todos los miembros aparecen en la ficha de la alianza, con su número de planetas, y la ficha de cada miembro indica la posición de su primer planeta.</li>
                <li><strong>El Baluarte Silencioso</strong>: los miembros aparecen en la ficha de la alianza, pero las clasificaciones ocultan el número de miembros y de planetas.</li>
                <li><strong>El Martillo de las Estrellas</strong>: solo el dirigente aparece en la ficha de la alianza, la lista de planetas de los miembros está oculta en su ficha, y las clasificaciones ocultan el número de miembros y de planetas.</li>
            </ul>

            <h2 id="choisir">¿Cómo elegir?</h2>
            <ul>
                <li><strong>Empiezas y buscas crecer</strong> → La Balanza de los Mundos (económica, y la única que se puede abandonar).</li>
                <li><strong>Quieres una alianza unida y agresiva</strong> → El Baluarte Silencioso.</li>
                <li><strong>Quieres protegerte, jugar a la defensiva</strong> → El Martillo de las Estrellas (cuidado: si el dirigente cae en Game Over, todo se derrumba).</li>
            </ul>

    alliance_research:
        title: "Investigaciones de alianza"
        category: "alliance"
        order: 6
        tags: "investigación,alianza,política,políticas,régimen,bonus"
        summary: "Las 7 investigaciones políticas de tu régimen: investigaciones personales, pagadas con tus propios Bitcoins y desbloqueadas por el nivel de la alianza."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principe">Cómo funciona</h2>
            <p>Las investigaciones de alianza, llamadas <strong>investigaciones políticas</strong>, se lanzan en la página <strong>Investigaciones</strong>, categoría <strong>Políticas</strong>. Cada régimen tiene <strong>7 investigaciones</strong> de <strong>5 niveles</strong>. Se desbloquean una a una con el <strong>nivel de la alianza</strong>: la primera desde el nivel 0, la segunda en el nivel 1… hasta la séptima en el nivel 6 (consulta <a href="/wiki/alliance_basics#niveau">Nivel de alianza</a>). Sin alianza, la categoría muestra «Requisito: Unirse a una alianza».</p>
            <p>Son investigaciones <strong>personales</strong>: cada miembro las lanza para sí mismo, en su propia cola de investigaciones, con <strong>sus propios Bitcoins</strong>, y el bonus se aplica <strong>solo a él</strong>. El coste de un nivel es el coste base × el nivel buscado, reducido por la mejora de alianza «Coste de investigación». La duración depende de tus científicos, como en cualquier investigación.</p>
            <p><strong>Atención</strong>: si abandonas la alianza, te expulsan o se disuelve, todos tus niveles de investigaciones políticas vuelven a cero. Una investigación política que termina cuando ya no tienes alianza no aporta nada.</p>
            <p>No las confundas con las <a href="/wiki/alliance_improvements">mejoras de alianza</a>, colectivas y financiadas con las inversiones de los miembros. Ambas se acumulan.</p>

            <h2 id="liste">Las investigaciones de cada régimen</h2>
            <p>Efecto por nivel, y después efecto en el nivel 5. Coste del nivel N = coste base × N, en Bitcoins: los 5 niveles cuestan 15 veces el coste base (por ejemplo 375&nbsp;000 Bitcoins para una investigación de 25&nbsp;000). El nivel de alianza requerido se indica entre paréntesis.</p>

            <h3>La Balanza de los Mundos</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Efecto</th><th>Coste base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ley Macron</strong> (niv. 0)</td><td>+7,1&nbsp;% de producción de niobio, agua y raciones por nivel, además del +20&nbsp;% de alianza (×1,56 en total en el nivel 5, frente a ×1,2 sin la investigación)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Movilización científica</strong> (niv. 1)</td><td>+0,1 de velocidad de investigación por nivel (+0,5 en el nivel 5), hasta la próxima llegada de científicos, que redondea la velocidad al entero más cercano (consulta <em>Trabajadores y científicos</em>)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Entusiasmo científico</strong> (niv. 2)</td><td>Mantenimiento de los científicos reducido: −17&nbsp;% en el nivel 1, −50&nbsp;% en el nivel 5</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Cargos mejorados</strong> (niv. 3)</td><td>+20&nbsp;% de capacidad de los Cargos por nivel (+100&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Blindaje de naves</strong> (niv. 4)</td><td>+10&nbsp;% de armadura de las naves por nivel (+50&nbsp;%)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Acuerdos mercantiles</strong> (niv. 5)</td><td>+5&nbsp;% de ganancias de venta a los comerciantes por nivel (+25&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Aporte de la Democracia</strong> (niv. 6)</td><td>+1 planeta colonizable por nivel (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>El Baluarte Silencioso</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Efecto</th><th>Coste base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Optimización de reciclaje</strong> (niv. 0)</td><td>Cada reciclador trae 1&nbsp;000 + 400 × nivel de recursos por ciclo de 5 minutos (1&nbsp;400 en el nivel 1, 3&nbsp;000 en el nivel 5, es decir, el triple)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Refuerzo ideológico</strong> (niv. 1)</td><td>+20&nbsp;% de defensa de los trabajadores por nivel (+100&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Armamento mejorado</strong> (niv. 2)</td><td>+10&nbsp;% de potencia de las naves por nivel (+50&nbsp;%)</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Estructura soviética</strong> (niv. 3)</td><td>Mantenimiento de los Legionarios reducido: −9&nbsp;% en el nivel 1, −33&nbsp;% en el nivel 5</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Reclutamiento voluntario</strong> (niv. 4)</td><td>−1 Bitcoin por nivel en el precio de reclutamiento de un Legionario (8 → 3 Bitcoins)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Imperio sin fronteras</strong> (niv. 5)</td><td>+1 planeta conquistado por invasión por nivel (+5)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Puntos de Guerra</strong> (niv. 6)</td><td>+10&nbsp;% de PDG ganados por nivel (+50&nbsp;%)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>El Martillo de las Estrellas</h3>
            <table>
                <thead>
                    <tr><th>Investigación</th><th>Efecto</th><th>Coste base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Política familiar</strong> (niv. 0)</td><td>+20&nbsp;% de producción de trabajadores por nivel (+100&nbsp;%)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Armamento mejorado</strong> (niv. 1)</td><td>+10&nbsp;% de potencia de las naves por nivel (+50&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Invasiones planificadas</strong> (niv. 2)</td><td>+25&nbsp;% de capacidad de las barcazas por nivel: 1&nbsp;250 Legionarios por barcaza en el nivel 1, 2&nbsp;250 en el nivel 5</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Potencia militar</strong> (niv. 3)</td><td>+10&nbsp;% de fuerza de los Legionarios, tanto en ataque como en defensa, por nivel (+50&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Superioridad mecánica</strong> (niv. 4)</td><td>Mantenimiento de los Mechas reducido: −17&nbsp;% en el nivel 1, −50&nbsp;% en el nivel 5</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Blindaje de Mechas</strong> (niv. 5)</td><td>+10&nbsp;% de defensa de los Mechas por nivel (+50&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Imperio sin fronteras</strong> (niv. 6)</td><td>+1 planeta conquistado por invasión por nivel (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h2 id="choisir">¿Qué investigaciones priorizar?</h2>
            <ul>
                <li><strong>La Balanza de los Mundos</strong> → Ley Macron, Movilización científica, Cargos mejorados.</li>
                <li><strong>El Baluarte Silencioso</strong> → Armamento mejorado, Imperio sin fronteras, Puntos de Guerra.</li>
                <li><strong>El Martillo de las Estrellas</strong> → Política familiar, Invasiones planificadas, Potencia militar, Blindaje de Mechas.</li>
            </ul>
            <p>Cada uno elige sus propias investigaciones, pero las últimas solo se abren al subir el nivel de la alianza: conviene organizarse juntos en la sala, con la tesorería.</p>

    salon:
        title: "La sala de alianza"
        category: "alliance"
        order: 7
        tags: "sala,chat,discusión,alianza,mensaje"
        summary: "El chat de tu alianza: en directo, con historial, coordenadas clicables y salas comunes con tus aliados."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="fonctionnement">Cómo funciona</h2>
            <p>La <strong>sala de alianza</strong> es un chat en directo reservado a los miembros de tu alianza. Abre <strong>Salón</strong> en el menú: la sala de tu alianza es la pestaña que lleva su nombre.</p>
            <p>También encontrarás la sala <strong>Universo</strong> (todo el servidor), una sala por cada galaxia donde tengas un planeta y, por cada <strong>alianza defensiva</strong> firmada, una sala común a las dos alianzas (se elimina con sus mensajes cuando termina la alianza defensiva).</p>
            <p>Los mensajes se conservan: puedes volver atrás en el historial para encontrar una información.</p>

            <h2 id="usage">Para qué sirve</h2>
            <ul>
                <li><strong>Coordinar los ataques</strong>: lanzar un raid entre dos vale más que uno solo que sea rechazado.</li>
                <li><strong>Alertar</strong> cuando se detecte una flota enemiga.</li>
                <li><strong>Compartir coordenadas</strong> (planetas objetivo, campos de escombros interesantes): escritas con el formato <code>galaxia:sector:posición</code> (p. ej. <code>1:15:25</code>), se convierten en un enlace que abre ese sector en el mapa espacial (la galaxia debe existir, el sector ir de 1 a 100 y la posición de 1 a 25). Los enlaces a una página del juego también se vuelven clicables.</li>
                <li><strong>Debatir la estrategia</strong> de la alianza (investigaciones, diplomacia, guerras).</li>
                <li><strong>Presentarte</strong> a los nuevos miembros y tejer lazos.</li>
            </ul>

            <h2 id="bonnes-pratiques">Buenas prácticas</h2>
            <ul>
                <li>Mantén el respeto: los insultos y el acoso pueden ser sancionados. Un mensaje abusivo se denuncia desde el propio mensaje (consulta <a href="/wiki/moderation_blocking">Moderación</a>).</li>
                <li>Evita el spam: deja espacio a las discusiones estratégicas. Un mensaje tiene como máximo <strong>200 caracteres</strong>, y se pueden enviar 20 por minuto.</li>
                <li>Para dirigirte a alguien, haz clic en su apodo: «Apodo &gt;» se añade a tu mensaje. Un mensaje que contiene tu apodo, o el tag de tu alianza entre corchetes (p. ej. <code>[TAG]</code>), se resalta para ti.</li>
                <li>Cuando se da un consejo, anótalo: los mensajes pasan rápido.</li>
            </ul>

            <h2 id="messages-prives">¿Y los mensajes privados?</h2>
            <p>Aparte de la sala, puedes enviar un <strong>mensaje privado</strong> a cualquier jugador del servidor, incluso fuera de tu alianza. Útil para la diplomacia discreta, para responder a una propuesta o para pedir a una alianza que te invite. Las coordenadas y los enlaces del juego se vuelven clicables en ellos exactamente igual que en la sala.</p>

    alliance_improvements:
        title: "Mejoras de alianza"
        category: "alliance"
        order: 8
        tags: "mejoras,alianza,bonus,bitcoin,inversión,colectivo,niveles"
        summary: "Invierte Bitcoins para desbloquear 16 bonus colectivos que refuerzan a toda tu alianza: velocidad de investigación, producción, potencia de combate y más."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="resumen">Principio</h2>
            <p>La pestaña <strong>Mejoras</strong> de la página de alianza permite a los miembros invertir Bitcoins para desbloquear y mejorar <strong>16 bonus colectivos</strong>. Estos bonus benefician a <strong>todos los miembros</strong> de la alianza, estén conectados o no. Un jugador que abandona la alianza deja de beneficiarse de ellos, pero la alianza conserva sus niveles adquiridos.</p>

            <h2 id="cuota">Cupo de inversión</h2>
            <p>Cada miembro dispone de <strong>20 inversiones por periodo de 3 horas</strong>. El periodo empieza con tu primera inversión; pasadas 3 horas, el cupo vuelve a 20. Las inversiones no utilizadas se pierden: el cupo no se acumula. La pestaña muestra tus «Inversiones disponibles» y, cuando el cupo se agota, el tiempo restante antes de la «Próxima ventana en».</p>
            <p>Cada inversión cuesta <strong>1&nbsp;000 Bitcoins</strong> tomados de tu saldo personal. Es un gasto definitivo, sin reembolso. Hace falta una cuenta validada y un correo confirmado para invertir.</p>
            <p>Bajo cada bonus, unos botones rápidos <strong>×1 / ×5 / ×10</strong> permiten invertir varios puntos con un clic.</p>

            <h2 id="niveles">Niveles y umbrales</h2>
            <p>Cada bonus tiene <strong>5 niveles</strong>. Los umbrales de inversiones necesarios para pasar al nivel siguiente son:</p>
            <table>
                <thead>
                    <tr><th>Nivel</th><th>Inversiones necesarias</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Las inversiones excedentes por encima del umbral de un nivel se <strong>pierden</strong>: no hay traspaso al nivel siguiente.</p>
            <p>Para llevar un bonus al nivel 5, hacen falta <strong>3&nbsp;360 inversiones</strong> en total, es decir, 3&nbsp;360&nbsp;000 Bitcoins. Es un proyecto colectivo: a 20 inversiones por periodo de 3 horas, un jugador solo tardaría 168 periodos.</p>

            <h2 id="bonificaciones">Los 16 bonus y sus efectos</h2>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Efecto por nivel</th><th>Máximo (nivel 5)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Velocidad de investigación</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Coste de investigación</strong></td><td>−1&nbsp;% por nivel</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Impulso de construcción</strong></td><td>+15 s de reducción por ayuda</td><td>75 s de reducción por ayuda</td></tr>
                    <tr><td><strong>Coste de construcción</strong></td><td>−1&nbsp;% por nivel</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Producción de niobio</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Producción de agua</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Producción de raciones</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Velocidad de flota</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potencia de misiles</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potencia láser</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potencia de plasma</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Precisión</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Blindaje de flota</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Escudo</strong></td><td>+1&nbsp;% por nivel</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Defensa planetaria</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Experiencia del héroe</strong></td><td>+2&nbsp;% por nivel</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>El <strong>Impulso de construcción</strong> alimenta directamente la <a href="/wiki/alliance_construction_help">ayuda de construcción</a>: cuanto más alto es su nivel, más reduce cada ayuda de un aliado la duración de la obra.</p>
            <p>No confundas la mejora «Velocidad de investigación» con la investigación política «Movilización científica» de La Balanza de los Mundos (para quien la investiga, consulta <a href="/wiki/alliance_research">Investigaciones de alianza</a>). La mejora «Velocidad de investigación» acorta la duración mostrada en la página Investigaciones, pero no la duración real: una investigación lanzada termina a la hora calculada sin ella.</p>

            <h2 id="absence">¿Y si un miembro se ausenta?</h2>
            <p>No existe el modo vacaciones. Un miembro ausente <strong>conserva todos sus bonus de alianza</strong> (producción, mejoras, investigaciones políticas) mientras siga en la alianza, y su impuesto de alianza se sigue descontando cada día. Tras <strong>7 días</strong> sin conectarse, un dirigente inactivo es sustituido automáticamente (consulta <a href="/wiki/alliance_grades#afk">Grados y permisos</a>). Tras <strong>8 días</strong>, la cuenta pasa a piloto automático, pero sigue siendo miembro de la alianza.</p>

    alliance_construction_help:
        title: "Ayuda de construcción"
        category: "alliance"
        order: 9
        tags: "ayuda,construcción,alianza,impulso,edificio,aceleración"
        summary: "Un clic para acelerar las obras de todos tus aliados a la vez, y ellos hacen lo mismo por ti."
        related: "alliance_improvements"
        body: |
            <h2 id="resumen">Principio</h2>
            <p>La <strong>ayuda de construcción</strong> permite a los miembros de una alianza acelerarse mutuamente las obras en curso con un simple clic. Cuando uno o varios aliados tienen una construcción en curso en su planeta, aparece un <strong>icono de ayuda</strong> (una mano que sostiene un corazón) en la barra global de la interfaz. La insignia indica el número de construcciones elegibles. Hace falta una cuenta validada y un correo confirmado para ayudar.</p>
            <p>Un clic en ese icono desencadena automáticamente la ayuda en <strong>todas las construcciones elegibles</strong> de la alianza a la vez: no hace falta seleccionarlas una por una.</p>

            <h2 id="ganancia">Ganancia por ayuda</h2>
            <p>Cada ayuda prestada acelera la construcción en:</p>
            <blockquote><strong>15 segundos × nivel del bonus «Impulso de construcción»</strong></blockquote>
            <p>La ganancia está <strong>limitada a 75 segundos</strong> por ayuda y por miembro (nivel 5 × 15 s = 75 s). Ese nivel es el de <strong>tu alianza</strong>: todos sus miembros aportan la misma ganancia por ayuda. Una construcción no puede bajar de <strong>30 segundos restantes</strong> gracias a la ayuda.</p>
            <table>
                <thead>
                    <tr><th>Nivel del bonus</th><th>Ganancia por ayuda</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (no desbloqueado)</td><td>15 s</td></tr>
                    <tr><td>1</td><td>15 s</td></tr>
                    <tr><td>2</td><td>30 s</td></tr>
                    <tr><td>3</td><td>45 s</td></tr>
                    <tr><td>4</td><td>60 s</td></tr>
                    <tr><td>5</td><td>75 s</td></tr>
                </tbody>
            </table>

            <h2 id="elegibilidad">Elegibilidad de una construcción</h2>
            <p>Para que una construcción reciba ayuda, deben cumplirse dos condiciones:</p>
            <ul>
                <li><strong>Duración total &gt; 30 segundos</strong> (entre el inicio y el final previsto).</li>
                <li><strong>Tiempo restante &gt; 30 segundos</strong> en el momento en que se presta la ayuda.</li>
            </ul>
            <p>Las obras casi terminadas (30 s restantes o menos) no se benefician de la ayuda.</p>

            <h2 id="deduplicacion">Una ayuda por construcción</h2>
            <p>Un mismo miembro solo puede ayudar <strong>a cada construcción una sola vez</strong>. El icono desaparece automáticamente cuando ya no queda ninguna construcción que no hayas ayudado. Varios miembros pueden ayudar a la misma construcción, y las ganancias se acumulan: 3 miembros de una alianza de nivel 3 aportan cada uno 45 s, es decir, 135 s en total.</p>

            <h2 id="enlace">Relación con las mejoras de alianza</h2>
            <p>La ganancia por ayuda depende directamente del nivel del bonus <strong>«Impulso de construcción»</strong> en la pestaña <a href="/wiki/alliance_improvements">Mejoras</a>. Invertir en este bonus beneficia a todos: cuanto antes terminen tus aliados sus edificios, antes crece el imperio de la alianza.</p>

    leveling:
        title: "Niveles y experiencia"
        category: "progression"
        order: 1
        tags: "nivel,experiencia,progresión,level,puntuación"
        summary: "Tu progresión del nivel 2 al nivel 40, alimentada por el crecimiento de tu puntuación."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Lo que cuenta para tu puntuación</h2>
            <p>Tu puntuación (tus <strong>puntos</strong>, los de la clasificación) mide el <strong>tamaño de tu imperio</strong>. Se recalcula una vez al día, en el informe diario de las 18:59 (hora de París), y suma:</p>
            <table>
                <tr><th>Elemento</th><th>Lo que vale 1 punto</th></tr>
                <tr><td><strong>Trabajadores</strong></td><td>100 trabajadores.</td></tr>
                <tr><td><strong>Naves en el hangar</strong> (y en producción)</td><td>120 de firma térmica (por ejemplo 6 fragatas, de firma 20 cada una).</td></tr>
                <tr><td><strong>Naves en flota</strong></td><td>20 de firma (por ejemplo 1 fragata). Una nave en flota cuenta <strong>seis veces más</strong> que en el hangar.</td></tr>
                <tr><td><strong>Legionarios</strong></td><td>500 en un planeta, alrededor de 83 embarcados en una flota.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>25 en un planeta; embarcado en una flota, cada Mecha vale 2 puntos.</td></tr>
                <tr><td><strong>Científicos</strong></td><td>Alrededor de 17 en un planeta, 25 en una flota.</td></tr>
                <tr><td><strong>Torretas</strong></td><td>Cada torreta vale: lanzamisiles 0,9; torreta láser 0,6; torreta láser pesada 1,2; láser iónico 1,2; artillería de plasma 0,8; cañón Gauss 2,4.</td></tr>
                <tr><td><strong>Edificios</strong> (por nivel)</td><td>Mina de Niobium, Extractor de agua, Campo agrícola: 15 · Radar terrestre: 20 · Cuartel: 25 · Granja aeropónica, Centro de investigación, Astillero espacial: 30 · Almacén de Niobium, Depósito de agua, Silo agrícola: 45 · Fábrica de armamento: 50 · Radar espacial: 60 · Gran ciudad: 65 · Inhibidor de radar: 100 · Metrópoli: 120 · Fuerte defensivo: 130 · Industria pesada: 150 · Base nuclear: 300 · Ciudad flotante, Estación orbital: 2&nbsp;000. La Prisión y el Campo de esclavos no aportan puntos.</td></tr>
            </table>
            <p>Los valores de las tropas son los básicos: las investigaciones de régimen que reducen el mantenimiento de los Legionarios, de los Mechas o de los científicos reducen también los puntos que aportan. Los Puntos de Guerra no cuentan en la puntuación.</p>
            <p>Perder naves en combate, demoler un edificio o ver morir tropas hace, pues, bajar tu puntuación en el siguiente informe.</p>

            <h2 id="experience">Puntuación, experiencia y nivel</h2>
            <p>Tu nivel depende de tu <strong>experiencia</strong>, que solo crece con tu puntuación. En cada informe diario, si tu nueva puntuación supera la de anteayer, la diferencia se suma a tu experiencia.</p>
            <p>Ejemplo: tu puntuación valía 10&nbsp;000 anteayer, 11&nbsp;000 ayer y 12&nbsp;000 hoy: ganas 2&nbsp;000 puntos de experiencia en el informe del día.</p>
            <p>Si tu puntuación baja, ese día no ganas experiencia, pero nunca la pierdes: <strong>tu nivel nunca baja</strong>. El total de experiencia no se muestra en el juego; solo se muestra el nivel.</p>

            <h2 id="seuils">Los escalones de nivel</h2>
            <p>Todo comandante empieza en el <strong>nivel 2</strong>, con 0 puntos de experiencia. Experiencia que hay que alcanzar para cada nivel:</p>
            <table>
                <tr><th>Nivel</th><th>Experiencia</th><th>Nivel</th><th>Experiencia</th></tr>
                <tr><td>2</td><td>0</td><td>22</td><td>24&nbsp;000&nbsp;000</td></tr>
                <tr><td>3</td><td>2&nbsp;000</td><td>23</td><td>30&nbsp;000&nbsp;000</td></tr>
                <tr><td>4</td><td>10&nbsp;000</td><td>24</td><td>50&nbsp;000&nbsp;000</td></tr>
                <tr><td>5</td><td>40&nbsp;000</td><td>25</td><td>80&nbsp;000&nbsp;000</td></tr>
                <tr><td>6</td><td>100&nbsp;000</td><td>26</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>7</td><td>150&nbsp;000</td><td>27</td><td>200&nbsp;000&nbsp;000</td></tr>
                <tr><td>8</td><td>200&nbsp;000</td><td>28</td><td>250&nbsp;000&nbsp;000</td></tr>
                <tr><td>9</td><td>280&nbsp;000</td><td>29</td><td>500&nbsp;000&nbsp;000</td></tr>
                <tr><td>10</td><td>450&nbsp;000</td><td>30</td><td>800&nbsp;000&nbsp;000</td></tr>
                <tr><td>11</td><td>800&nbsp;000</td><td>31</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>12</td><td>1&nbsp;000&nbsp;000</td><td>32</td><td>2&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>13</td><td>1&nbsp;300&nbsp;000</td><td>33</td><td>3&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>14</td><td>2&nbsp;000&nbsp;000</td><td>34</td><td>6&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>15</td><td>3&nbsp;000&nbsp;000</td><td>35</td><td>12&nbsp;500&nbsp;000&nbsp;000</td></tr>
                <tr><td>16</td><td>5&nbsp;000&nbsp;000</td><td>36</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>17</td><td>7&nbsp;000&nbsp;000</td><td>37</td><td>50&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>18</td><td>9&nbsp;000&nbsp;000</td><td>38</td><td>80&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>19</td><td>12&nbsp;000&nbsp;000</td><td>39</td><td>100&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>15&nbsp;000&nbsp;000</td><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>21</td><td>18&nbsp;000&nbsp;000</td><td></td><td></td></tr>
            </table>
            <p>El nivel 40 es el máximo. La progresión es <strong>exponencial</strong>: subir del nivel 2 al nivel 10 va mucho más rápido que del 30 al 40.</p>

            <h2 id="utilite">Para qué sirve tu nivel</h2>
            <ul>
                <li><strong>Bono de conexión</strong> — el suelo del bono diario vale tu nivel × 5&nbsp;000 Bitcoins, multiplicado por un sorteo de ×1 a ×5 (consulta <em>Bonus de conexión</em>).</li>
                <li><strong>Escaparate</strong> — tu nivel se muestra en la tarjeta del comandante (página Vista general) y en tu perfil. La clasificación, en cambio, se hace por puntos, no por nivel.</li>
            </ul>

    war_points:
        title: "Puntos de Guerra (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,puntos,guerra,combate,clasificación"
        summary: "La segunda moneda del juego, que se gana sobre todo en combate, para gastar en Bitcoins, tropas, naves de élite y edificios."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">¿Qué son los PDG?</h2>
            <p>Los <strong>Puntos de Guerra</strong> (<strong>PDG</strong>) son una segunda «moneda» de progresión, <strong>orientada al combate</strong>. Mientras que tu nivel refleja el crecimiento de tu imperio, tus PDG reflejan tu actividad militar. Se muestran en la barra de recursos y son propios de cada servidor: en un servidor nuevo, empiezas de cero.</p>

            <h2 id="gagner">Cómo ganarlos</h2>
            <ul>
                <li><strong>Combates espaciales</strong> — el vencedor gana PDG proporcionales a la firma de la flota enemiga destruida (1 PDG por cada 100 de firma en un combate de una flota contra una flota), nunca según sus propias pérdidas. Una horda Cthulhu o una flota alien aporta 5 veces menos que una flota de jugador de la misma firma (salvaguarda anti-granjeo).</li>
                <li><strong>Perder un combate espacial</strong> — aun así se te ingresa un consuelo: 1 PDG por cada 500 de firma perdida, es decir, una quinta parte de lo que cobraría un vencedor con la misma flota.</li>
                <li><strong>Defensa orbital</strong> — cuando tus torretas aniquilan una flota en órbita: 1 PDG por cada 100 de firma destruida (5 veces menos frente a un Cthulhu o un alien). Arrasar las defensas de un planeta adversario, en cambio, no aporta nada al atacante.</li>
                <li><strong>Raids</strong> — el atacante victorioso gana 1 PDG por cada 100 Legionarios y Mechas defensores muertos.</li>
                <li><strong>Invasiones</strong> — una invasión lograda aporta muy poco: 1 PDG por cada 60&nbsp;000 Legionarios defensores muertos (un trabajador muerto cuenta como una décima parte de un Legionario).</li>
                <li><strong>Rechazar un raid o una invasión</strong> — el defensor gana alrededor de 7,5 PDG por cada 100 Legionarios asaltantes muertos.</li>
                <li><strong>Eliminar a un jugador</strong> — si tu invasión le quita su último planeta, te quedas con todos sus PDG y todos sus Bitcoins.</li>
                <li><strong>Cthulhu</strong> — rechazar una horda que ataca tu planeta aporta PDG según la fuerza de la horda, y romper un bloqueo Cthulhu aporta una recompensa en Bitcoins y en PDG, repartida según el daño de cada uno. El Tower Defense, por su parte, aporta uranio, no PDG.</li>
                <li><strong>Objetivos diarios</strong> — cada objetivo cumplido aporta PDG, y cumplirlos todos aporta en el informe diario un bono igual a su recompensa media (consulta <em>Misiones diarias</em>).</li>
                <li><strong>Arena (duelos de héroes)</strong> — cada duelo ganado aporta 15 PDG por nivel de tu héroe, reducidos hasta la mitad si los dos héroes tienen niveles muy distintos (en un sentido o en otro). Ejemplos: héroe nivel 10 contra nivel 10 = 150 PDG; nivel 10 contra nivel 4 = 75 PDG. El podio de la clasificación semanal de la arena (300 / 200 / 100 PDG) y el de los torneos (500 / 300 / 150 PDG, y 50 PDG para cada participante) también aportan.</li>
                <li><strong>Prisión</strong> — ejecutar a un héroe capturado aporta 100 PDG por nivel del héroe.</li>
                <li><strong>Venta a los comerciantes</strong> — cada venta aporta unos pocos PDG además de los Bitcoins.</li>
                <li><strong>Tutorial</strong> — 500 PDG forman parte de sus recompensas.</li>
                <li><strong>Banco de alianza</strong> — una retirada del banco de tu alianza puede ingresarte PDG.</li>
            </ul>
            <p>La investigación de alianza <strong>Puntos de Guerra</strong> (alianza de nivel 6 como mínimo) aumenta un 10&nbsp;% por nivel, hasta +50&nbsp;%, los PDG ganados en combate espacial, en defensa orbital, en raid, en invasión y en la venta a los comerciantes.</p>

            <h2 id="utilite">Para qué sirven</h2>
            <ul>
                <li><strong>Tienda de la página Objetivos</strong> — cambia tus PDG por Bitcoins (1 PDG = 1 Bitcoin), Legionarios (1 PDG = 2 Legionarios) o trabajadores (1 PDG = 10 trabajadores), entregados en el planeta que elijas dentro del límite de su capacidad.</li>
                <li><strong>Naves de élite</strong> — algunas naves se pagan con PDG (y con trabajadores): Cazador de plasma (1 PDG), Corbeta de combate (3), Nave de batalla (8), Carabela (25), Nave nodriza (25&nbsp;000), por unidad.</li>
                <li><strong>Edificios</strong> — la Ciudad flotante y la Estación orbital cuestan 2&nbsp;000 PDG por nivel buscado (2&nbsp;000 para el nivel 1, 4&nbsp;000 para el nivel 2…).</li>
                <li><strong>Investigación Expansión territorial</strong> — 75&nbsp;000 PDG para el nivel 1, 150&nbsp;000 para el nivel 2.</li>
                <li><strong>Torturar a un prisionero</strong> — 200 PDG para revelar la posición de un planeta enemigo.</li>
                <li><strong>Banco de alianza</strong> — puedes depositar PDG en él.</li>
                <li><strong>Clasificación</strong> — la columna «Pdg» de la Clasificación de Comandantes permite comparar la actividad militar de los jugadores.</li>
                <li><strong>Paid Server</strong> — el vencedor es el jugador que tiene el total «puntos + 2 × PDG» más alto al final del servidor.</li>
            </ul>

            <h2 id="perdre">¿Se pueden perder?</h2>
            <ul>
                <li><strong>Gastándolos</strong> — tienda de la página Objetivos, naves de élite, Ciudad flotante, Estación orbital, investigación Expansión territorial, tortura de un prisionero, depósito en el banco de alianza. Cancelar una producción de naves, una construcción o una investigación te devuelve los PDG gastados.</li>
                <li><strong>Siendo eliminado</strong> — si un jugador invade tu último planeta, caes en Game Over y se queda con <strong>todos</strong> tus PDG y tus Bitcoins.</li>
                <li><strong>Impuesto de paz</strong> — si tu alianza ha aceptado una paz que paga un tributo en PDG, una parte de los PDG que ganas en combate va a la alianza ganadora.</li>
            </ul>
            <p>Perder un combate no te quita ningún PDG (incluso cobras un pequeño consuelo), y una quiebra económica no los afecta.</p>

            <h2 id="strategie">Estrategia</h2>
            <p>Los PDG recompensan a los jugadores <strong>agresivos</strong>. Si quieres escalar en la columna «Pdg» de la clasificación, céntrate en los combates espaciales, la defensa de tus planetas, los raids y la arena más que en el puro crecimiento económico.</p>

    quests:
        title: "Misiones diarias"
        category: "progression"
        order: 3
        tags: "misiones,objetivos,diario,misión,recompensa,pdg"
        summary: "3 objetivos cada día, para cumplir antes del siguiente informe, pagados en Puntos de Guerra."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Cada día, en el informe diario de las <strong>18:59 (hora de París)</strong>, el juego te asigna <strong>3 misiones diarias</strong>, llamadas «Objetivos» en el menú. Son pequeñas tareas que puedes cumplir durante tu sesión de juego normal.</p>
            <p>Tienes hasta el siguiente informe para cumplirlas: las que quedan entonces se eliminan y se sustituyen por 3 nuevas.</p>
            <p>Cuando llegas a un servidor, tus primeras misiones son siempre las mismas: escribir un mensaje en la sala, sondear el planeta de un jugador y unirte a una alianza o crear una (salvo en Battle Royale).</p>
            <p>El juego solo te da misiones realizables en el día: nada de construir sin la investigación o el espacio necesarios, nada de atacar mientras estés bajo protección de principiante, ni raid ni invasión sin barcaza, nada de «Colonizar un planeta» si ya posees 20 planetas colonizados, etc.</p>

            <h2 id="types">Las misiones posibles</h2>
            <p>Las 3 misiones del día se sortean al azar de esta lista (recompensa base en PDG):</p>
            <table>
                <tr><th>Misión</th><th>Recompensa base</th></tr>
                <tr><td>Enviar un mensaje privado</td><td>250</td></tr>
                <tr><td>Escribir un mensaje en la sala (cualquier sala a la que tengas acceso)</td><td>250</td></tr>
                <tr><td>Gastar Puntos de Guerra (en la tienda de la página Objetivos)</td><td>250</td></tr>
                <tr><td>Sondear el planeta de un jugador</td><td>250</td></tr>
                <tr><td>Cambiar tu avatar (si no tienes uno)</td><td>250</td></tr>
                <tr><td>Vender recursos a los comerciantes</td><td>500</td></tr>
                <tr><td>Crear una nueva Cohorte</td><td>500</td></tr>
                <tr><td>Entrenar Legionarios</td><td>500</td></tr>
                <tr><td>Mejorar tus naves</td><td>500</td></tr>
                <tr><td>Construir defensas (tropas o torretas)</td><td>500</td></tr>
                <tr><td>Construir naves</td><td>500</td></tr>
                <tr><td>Construir un escudo</td><td>750</td></tr>
                <tr><td>Colonizar un planeta</td><td>1&nbsp;000</td></tr>
                <tr><td>Reciclar recursos</td><td>1&nbsp;000</td></tr>
                <tr><td>Construir el edificio Gran ciudad</td><td>1&nbsp;000</td></tr>
                <tr><td>Terminar una investigación</td><td>1&nbsp;000</td></tr>
                <tr><td>Entrenar científicos</td><td>1&nbsp;000</td></tr>
                <tr><td>Destruir una flota adversaria (no utilitaria)</td><td>1&nbsp;000</td></tr>
                <tr><td>Construir una base espacial</td><td>1&nbsp;000</td></tr>
                <tr><td>Construir un gran escudo</td><td>1&nbsp;750</td></tr>
                <tr><td>Construir el edificio Metrópoli</td><td>2&nbsp;000</td></tr>
                <tr><td>Unirte a una alianza o crear una (si no tienes ninguna)</td><td>2&nbsp;000</td></tr>
                <tr><td>Construir el edificio Industria pesada</td><td>4&nbsp;000</td></tr>
                <tr><td>Invadir el planeta de un jugador</td><td>4&nbsp;000</td></tr>
                <tr><td>Saquear el planeta de un jugador</td><td>4&nbsp;000</td></tr>
                <tr><td>Lanzar un ataque nuclear sobre el planeta de un jugador</td><td>5&nbsp;000</td></tr>
            </table>
            <p>En el caso de los edificios, cuenta cualquier construcción terminada, sea cual sea su nivel. «Terminar una investigación» no existe en los servidores donde todas las investigaciones están desbloqueadas desde el principio.</p>

            <h2 id="recompense">Las recompensas</h2>
            <ul>
                <li>Cada misión terminada aporta <strong>PDG</strong>, acreditados al instante: la ganancia es la <strong>mayor</strong> entre la recompensa base de la misión y el <strong>5&nbsp;% de la media de puntos de los jugadores del servidor</strong> (recalculada en cada informe diario), para seguir siendo interesante incluso cuando los imperios se vuelven enormes.</li>
                <li>La recompensa que se muestra en la página Objetivos es la que cobrarás.</li>
                <li><strong>Bono</strong>: si cumples <strong>todos tus objetivos del día</strong> antes del informe siguiente, el informe diario te paga además la <strong>recompensa media de esos objetivos</strong>, como un objetivo más.</li>
            </ul>
            <p>Ejemplo: si la media del servidor es de 30&nbsp;000 puntos, «Enviar un mensaje privado» aporta 1&nbsp;500 PDG en lugar de 250, mientras que «Invadir el planeta de un jugador» se queda en 4&nbsp;000. Si ese día tus tres objetivos te aportan 15&nbsp;000, 15&nbsp;000 y 12&nbsp;000 PDG y los cumples todos, el informe siguiente te paga un bono de 14&nbsp;000 PDG.</p>

            <h2 id="consulter">Dónde verlas</h2>
            <p>Tus misiones del día están en la página <strong>Objetivos</strong> (menú, icono de diana); una insignia indica cuántas te quedan (por ejemplo 2/3). Cada misión aparece allí con su recompensa en PDG y su rareza (de 1 a 5 estrellas).</p>
            <p>Se validan automáticamente: en cuanto realizas la acción, la misión desaparece de la lista y un mensaje «Objetivo completado» muestra tu ganancia. Esa misma página te permite gastar tus PDG (Bitcoins, Legionarios, trabajadores).</p>

    ranking:
        title: "Las clasificaciones"
        category: "progression"
        order: 4
        tags: "clasificación,rango,posición,top,leaderboard"
        summary: "Varias clasificaciones para medir tu progresión (y la de tus rivales)."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="types">Las clasificaciones disponibles</h2>
            <table>
                <tr><th>Clasificación</th><th>Basada en</th><th>Recompensa</th></tr>
                <tr><td><strong>Clasificación de Comandantes</strong></td><td>Tus <strong>puntos</strong>: trabajadores, naves, tropas, torretas y edificios (consulta <em>Niveles y experiencia</em>). Las columnas Posición, Apodo, Planetas, Puntos y <strong>Pdg</strong> (Puntos de Guerra) se ordenan con un clic.</td><td>Ninguna recompensa directa. Al cierre del servidor, terminar en el top 10 desbloquea el logro <em>Élite</em>, y el vencedor obtiene <em>Emperador</em>.</td></tr>
                <tr><td><strong>Clasificación de Alianzas</strong></td><td>Suma de los puntos de los miembros (las 100 primeras alianzas del servidor).</td><td>Ninguna recompensa directa.</td></tr>
                <tr><td><strong>Clasificación de duelos</strong> (arena)</td><td>Tasa de victorias de tu héroe principal en duelos (victorias ÷ duelos disputados), a partir de 5 duelos.</td><td>Cada lunes, los 3 héroes que han ganado más duelos durante la semana transcurrida (5 duelos mínimo en la semana) reciben 300 / 200 / 100 PDG y 3&nbsp;000 / 2&nbsp;000 / 1&nbsp;000 de uranio.</td></tr>
                <tr><td><strong>Clasificación de las alianzas durante un bloqueo Cthulhu</strong></td><td>Lo que hace cada alianza contra la colmena durante el bloqueo.</td><td>Bonus o penalización de producción durante 72&nbsp;horas (consulta <em>Las profecías de Cthulhu</em>).</td></tr>
            </table>
            <p>Los puntos y las posiciones de la Clasificación de Comandantes se recalculan una vez al día, en el informe diario (18:59, hora de París); junto a cada jugador, una flecha y una cifra muestran la evolución desde el informe anterior. Los Puntos de Guerra, en cambio, están siempre al día.</p>

            <h2 id="consulter">Dónde verlas</h2>
            <p>Abre la página <strong>Vista general</strong>: en la tarjeta de tu comandante, el enlace <strong>«Rango: N»</strong> abre la Clasificación de Comandantes, y el nombre de tu alianza abre la Clasificación de Alianzas. Tu rango es, pues, siempre visible en esa tarjeta.</p>
            <p>En la Clasificación de Comandantes, puedes buscar a un jugador por su apodo o por el tag de su alianza, y ordenar cada columna. Tu fila aparece resaltada, igual que las de tus aliados y tus enemigos. En la primera página, un gráfico compara la evolución de tus puntos y de tus PDG con la media del servidor.</p>
            <p>La Clasificación de duelos se encuentra en la página <strong>Héroe</strong>, pestaña <strong>Arena</strong>. La clasificación de un bloqueo se muestra en la página <strong>Cthulhu</strong> durante el evento.</p>

            <h2 id="utilite">Por qué importa</h2>
            <ul>
                <li><strong>Estratégico</strong> — identifica a los grandes jugadores que evitar o a los que apuntar.</li>
                <li><strong>Social</strong> — escaparate para reclutar en tu alianza.</li>
                <li><strong>Competición</strong> — en <strong>Paid Server</strong>, el vencedor es el jugador que tiene el total «puntos + 2 × Puntos de Guerra» más alto al final del servidor. En todos los servidores, tu rango final cuenta para tus logros (top 10 = <em>Élite</em>).</li>
            </ul>

    heroes:
        title: "Tu héroe"
        category: "progression"
        order: 5
        tags: "héroe,bonus,planeta,flota,xp,captura,prisión,especialidad"
        summary: "Tu héroe personal: evoluciona, combate, potencia tu imperio y puede ser capturado."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Cada jugador posee <strong>un único héroe principal</strong>, creado al inicio de la partida. Este héroe debe estar <strong>siempre</strong> asignado a un planeta o a una flota, nunca libre. Además, puedes poseer <strong>héroes secundarios</strong> en número ilimitado: consulta el artículo dedicado.</p>
            <p>Mientras no tengas héroe principal —al inicio de la partida, o tras su ejecución en prisión—, el juego te devuelve a su creación&nbsp;: las páginas de juego permanecen cerradas hasta entonces, las de tu cuenta siguen accesibles. Si uno de tus héroes secundarios ocupa el planeta elegido para el nuevo héroe, pasa a la <strong>reserva</strong>.</p>
            <p>El héroe aporta bonus según sus competencias, su especialidad, su nivel y sus items. Sus 4 competencias son: <strong>Ataque</strong>, <strong>Defensa</strong>, <strong>Inteligencia</strong> y <strong>Velocidad</strong>. Cada punto invertido vale <strong>+1&nbsp;%</strong>:</p>
            <ul>
                <li><strong>Ataque</strong>: potencia de fuego de la flota a la que acompaña.</li>
                <li><strong>Defensa</strong>: blindaje de la flota a la que acompaña; en un planeta, defensa en tierra contra los desembarcos Cthulhu.</li>
                <li><strong>Inteligencia</strong>: producción de niobio, agua y comida del planeta donde está destinado (y solo de ese).</li>
                <li><strong>Velocidad</strong>: tiempo de vuelo de la flota a la que acompaña (−1&nbsp;% por punto, reducción total limitada al 90&nbsp;%).</li>
            </ul>
            <p>Ataque y Defensa no intervienen en los combates terrestres entre jugadores (raid, invasión): allí solo cuentan la especialidad Militar y sus rasgos. En los duelos de arena, las cuatro competencias entran en la puntuación: la Inteligencia alimenta la Astucia y la Velocidad alimenta el Ímpetu (consulta el artículo <em>Arena PvP</em>).</p>

            <h2 id="specialites">Especialidades</h2>
            <p>Cada especialidad confiere un bonus pasivo, sube el límite de una o dos competencias y desbloquea 3 rasgos en los niveles 5, 10 y 15:</p>
            <ul>
                <li><strong>Militar</strong>: +5&nbsp;% de potencia de fuego para la flota a la que acompaña; en un planeta, +5&nbsp;% al disparo de las torretas y a la defensa en tierra; en tierra entre jugadores, +5&nbsp;% a la potencia de su bando (en ataque y en defensa); +5&nbsp;% en duelo de arena. Límite de Ataque y de Defensa elevado al 50&nbsp;%. Rasgos: <strong>Intimidación</strong> (niv. 5, el adversario sufre −5&nbsp;% de potencia ofensiva, incluso contra el Cthulhu, y −5&nbsp;% de puntuación en duelo), <strong>Táctico</strong> (niv. 10, +10&nbsp;% de potencia en la primera ronda de tus combates, y +10&nbsp;% en duelo), <strong>Señor de la guerra</strong> (niv. 15, −5&nbsp;% de bajas de tus tropas en tierra en combate entre jugadores, y +5&nbsp;% de potencia en duelo).</li>
                <li><strong>Economía</strong>: duplica los bonus de Inteligencia (producción, items de producción incluidos) y del campo de esclavos del planeta donde está destinado. Límite de Inteligencia elevado al 50&nbsp;%. Rasgos: <strong>Eficiente</strong> (niv. 5: se muestra en la ficha del héroe como −10&nbsp;% de construcción, este rasgo no tiene efecto en las construcciones), <strong>Comerciante</strong> (niv. 10, +15&nbsp;% en las ventas al comerciante hechas por su flota o desde su planeta), <strong>Magnate</strong> (niv. 15, +20&nbsp;% de producción en su planeta).</li>
                <li><strong>Explorador</strong>: +5&nbsp;% de precisión para la flota a la que acompaña, y duplica su bonus de Velocidad (items incluidos) para el tiempo de vuelo. Límite de Velocidad elevado al 50&nbsp;%. Rasgos: <strong>Explorador</strong> (niv. 5, +1 de fuerza de radar en el planeta donde está destinado), <strong>Navegante</strong> (niv. 10, −15&nbsp;% de tiempo de vuelo adicional para su flota), <strong>Cartógrafo</strong> (niv. 15, +2 de fuerza de radar más, es decir, +3 en total con el rasgo Explorador).</li>
            </ul>

            <p>En <strong>duelo de arena</strong>, se aplican estas mismas reglas: el militar conserva sus +5&nbsp;% y sus tres rasgos, el economista ve su Inteligencia duplicada (más el 20&nbsp;% con Magnate) alimentar la Astucia, y el explorador su Velocidad duplicada (más el 15&nbsp;% con Navegante) alimentar el Ímpetu. Astucia e Ímpetu cuentan por el 60&nbsp;% de su valor.</p>
            <p>Un resumen detallado de estos bonus se muestra automáticamente al crear el héroe.</p>

            <h2 id="xp">Ganancia de experiencia</h2>
            <p>La XP se gana de varias maneras:</p>
            <ul>
                <li><strong>Combate</strong>: una parte fija (victoria en combate espacial 150 XP, raid ganado 100, invasión lograda 200, derrota 25), más una parte ligada a la fuerza del enemigo: su firma ÷ 150, dividida por el nivel del héroe. Ejemplo: un héroe de nivel 5 que destruye una flota de 30&nbsp;000 de firma gana 150 + 40 = 190 XP.</li>
                <li><strong>Duelo en la arena</strong> (y cada combate de torneo): solo el vencedor gana XP, de 30 XP por una victoria aplastante a 90 XP por un duelo muy reñido. El perdedor no gana nada.</li>
                <li><strong>Pasivo</strong>: un héroe destinado a un planeta (no en una flota) gana 5 XP por hora de ausencia, acreditados a tu regreso (40 XP tras 8 horas de ausencia). Las conexiones seguidas separadas por menos de 12 minutos no aportan nada.</li>
            </ul>
            <p>Toda la XP ganada se incrementa con el bonus de XP de tu alianza y, si el héroe está destinado a un planeta dotado de un Campo de esclavos, con un +5&nbsp;% por prisionero retenido allí (+25&nbsp;% como máximo). Un héroe capturado no gana XP.</p>
            <p>Para pasar del nivel N al nivel N+1, hacen falta N × 500 XP: 500 XP para llegar al nivel 2, 5&nbsp;000 XP para pasar del nivel 10 al nivel 11, y 22&nbsp;500 XP en total para llegar al nivel 10. Cada nivel ganado da <strong>2 puntos de competencia</strong>, que se reparten desde la página Héroe. Cada punto vale +1&nbsp;% en la competencia elegida, hasta un 30&nbsp;% por competencia (50&nbsp;% para la o las competencias de tu especialidad). Los bonus de items se suman por encima de estos límites.</p>

            <h2 id="assignation">Asignación</h2>
            <p>Asigna a tu héroe desde la página <strong>Héroe</strong> (botón «Reasignar héroe»), desde la página <strong>Planetas</strong> (botón «Asignar héroe» de un planeta) o desde la página de gestión de una <strong>flota</strong> (botón «Asignar»). El cambio es inmediato, sin tiempo de trayecto.</p>
            <p>Un planeta o una flota solo puede acoger a un héroe. Un planeta bajo embargo no puede recibir un héroe, y un héroe destinado en un planeta bajo embargo no puede unirse a una flota. Un héroe en una flota en vuelo o en combate no se puede reasignar.</p>
            <p>Si su flota es destruida y no es capturado, el héroe desembarca en el planeta del combate si te pertenece y no tiene héroe; si no, en tu planeta más antiguo sin héroe. Si todos tus planetas ya tienen un héroe, tu héroe principal ocupa el lugar de uno de tus héroes secundarios, que pasa a la reserva.</p>

            <h2 id="capture">Captura</h2>
            <p>Tu héroe principal puede ser capturado durante un combate:</p>
            <ul>
                <li><strong>Combate espacial contra flotas</strong> (tu flota es destruida): 20&nbsp;% de probabilidad. La destrucción de tu flota solo por las defensas de un planeta, o de una flota sin armas, no captura a tu héroe principal.</li>
                <li><strong>Invasión</strong> del planeta donde está destinado: 35&nbsp;% de probabilidad. El héroe a bordo de la flota de invasión no corre nunca riesgo de captura, incluso si la invasión fracasa, y un raid nunca captura.</li>
            </ul>
            <p>Una captura exige un <strong>edificio Prisión de nivel 1 o más</strong>: el héroe queda encerrado en el lugar del combate si pertenece al vencedor y tiene una Prisión; si no, en el planeta del vencedor con la Prisión más alta. Sin ninguna Prisión, no hay captura.</p>
            <p>Tras su liberación, el héroe goza de <strong>24h de inmunidad</strong> contra la recaptura.</p>
            <p>Solo un jugador puede capturar a tu héroe principal: ni los Cthulhu ni los comandantes IA lo hacen. Ojo: los comandantes IA sí pueden capturar o ejecutar a tus héroes secundarios.</p>
            <p>Esta sección describe a tu héroe <strong>principal</strong>. Tus <strong>héroes secundarios</strong> siguen una regla de captura totalmente distinta, sin probabilidad: consulta el artículo <em>Héroes secundarios</em>.</p>

    secondary_heroes:
        title: "Héroes secundarios"
        category: "progression"
        order: 6
        tags: "héroe,secundario,cuadra,captura,ejecución,prisión,reciclaje,reserva,botín"
        summary: "Héroes adicionales obtenidos como botín raro: los mismos bonus que tu héroe principal, pero capturables o ejecutables definitivamente en combate."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Un héroe secundario aporta <strong>los mismos bonus</strong> que un héroe principal una vez colocado en un planeta o una flota. Lo que lo distingue: puede ser <strong>capturado o muerto definitivamente</strong> en caso de derrota. Puedes acumular varios, además de tu héroe principal.</p>

            <h2 id="obtencion">Cómo se obtienen</h2>
            <p>Un héroe secundario es un <strong>botín raro</strong>, nunca comprable:</p>
            <table>
                <thead>
                    <tr><th>Fuente</th><th>Probabilidad</th></tr>
                </thead>
                <tbody>
                    <tr><td>Victoria en Tower Defense Cthulhu (por run)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Ataque Cthulhu rechazado en uno de tus planetas (desembarco rechazado u horda aniquilada en órbita)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Vencedor de un torneo de arena</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Al obtenerlo, es de nivel 1, su nombre y su especialidad se sortean al azar, y llega directamente a la <strong>reserva</strong>: te toca a ti decidir dónde colocarlo, o reciclarlo sin colocarlo nunca.</p>

            <p>Cada héroe obtenido se te anuncia con un <strong>informe</strong> que precisa de dónde viene. La pantalla de fin de Tower Defense y el informe de victoria contra los Cthulhu también lo señalan en el momento.</p>

            <h2 id="colocacion">Dónde colocarlos</h2>
            <p>Como tu héroe principal: <strong>un planeta</strong> o <strong>una flota</strong>, nunca los dos a la vez. Un secundario no colocado se queda en la <strong>reserva</strong>: ningún bonus, pero tampoco <strong>ningún riesgo</strong>; es una elección normal, no un descuido que corregir. Gestiona todos tus secundarios desde la pestaña <strong>Cuadra</strong> de la página Héroe: botón «Asignar» para colocarlo, «Retirar a la reserva» para quitarlo.</p>

            <h2 id="gestion">Competencias y equipamiento</h2>
            <p>Un héroe secundario progresa como el principal: gana niveles, y con ellos <strong>puntos de competencia</strong>. El botón <strong>Gestionar</strong> de la Cuadra abre su reparto entre Ataque, Defensa, Inteligencia y Velocidad.</p>
            <p>El mismo panel gestiona su <strong>equipamiento</strong>: ponle un item libre de tu inventario, o recupéralo. Los items de un héroe enemigo capturado te llegan con él: así es como los recuperas.</p>

            <h2 id="riesgo">Lo que arriesgas</h2>
            <p>Un héroe secundario colocado puede perderse <strong>definitivamente</strong> en:</p>
            <ul>
                <li>Un <strong>combate espacial</strong> perdido (su flota es destruida).</li>
                <li>Un <strong>combate utilitario</strong> perdido (flota sin una sola arma, aniquilada sin siquiera librar batalla).</li>
                <li>Una <strong>invasión</strong> lograda contra el planeta donde está estacionado.</li>
                <li>La destrucción de su flota por las <strong>defensas orbitales</strong> de un planeta pasado a modo ataque.</li>
            </ul>
            <p>En cambio, <strong>no</strong> arriesga nada en:</p>
            <ul>
                <li>El <strong>combate terrestre de un raid</strong>: incluso logrado, un raid nunca toma el planeta. En cambio, si la flota que lo transporta es destruida en órbita, queda expuesto como en cualquier flota destruida.</li>
                <li>Un combate contra los <strong>Cthulhu</strong> (o contra el Comerciante). Ojo: los <strong>comandantes IA</strong> siguen la misma regla que los jugadores y pueden capturar o ejecutar a tus héroes secundarios.</li>
                <li>La <strong>arena</strong>: los duelos y los torneos no exponen a ningún héroe a la captura.</li>
            </ul>

            <p>Una <strong>notificación</strong> te avisa en cuanto uno de tus secundarios es capturado o ejecutado: una pérdida definitiva no depende de que abras tu informe.</p>

            <h2 id="prision">La condición prisión</h2>
            <p>A diferencia de tu héroe principal (captura <em>probabilista</em>, consulta el artículo <em>Prisión y héroes capturados</em>), la suerte de un secundario vencido es <strong>totalmente determinista</strong>, sin el menor azar:</p>
            <ul>
                <li>El vencedor posee un <strong>edificio Prisión</strong> de nivel 1 o más en al menos uno de sus planetas → <strong>captura</strong> al héroe, con su nivel, su experiencia y sus items intactos.</li>
                <li>El vencedor no tiene <strong>ninguna</strong> Prisión construida → el héroe es <strong>ejecutado</strong>, y sus items pasan al inventario del vencedor.</li>
            </ul>
            <p>En combate de bloques (varios aliados codo con codo), el héroe pasa al comandante vencedor que <strong>más potencia ha aportado</strong> al combate; si no tiene Prisión, el héroe es ejecutado aunque un aliado del mismo bando la tuviera.</p>
            <p>Un secundario capturado <strong>no</strong> es un prisionero clásico: ni página de prisión, ni evasión, ni rescate. Llega directamente, activo, a la Cuadra de su nuevo propietario, en reserva, listo para ser colocado o reciclado.</p>

            <h2 id="sin-recuperacion">Ninguna recuperación posible</h2>
            <p>Una vez capturado o ejecutado, un héroe secundario se pierde <strong>para siempre</strong>: ni evasión, ni rescate, ni liberación por invasión de su antiguo propietario pueden recuperarlo. La única forma de volver a verlo algún día es recuperarlo tú mismo en combate; así puede recircular indefinidamente de imperio en imperio.</p>

            <h2 id="identidad">Un héroe capturado conserva su identidad</h2>
            <p>Un secundario capturado conserva su <strong>nombre</strong>, su <strong>nivel</strong> y su <strong>experiencia</strong>. En tu Cuadra, muestra a su comandante de origen («Capturado de …»).</p>

            <h2 id="reciclaje">El reciclaje</h2>
            <p>Puedes <strong>reciclar</strong> a uno de tus héroes secundarios (botón «Reciclar» de la Cuadra): queda destruido y tu héroe principal recibe el <strong>90&nbsp;%</strong> de toda la experiencia que ese secundario ha acumulado desde el nivel 1 (los bonus de XP de alianza no se aplican). Sus items vuelven a tu inventario.</p>
            <p>Ejemplo: un secundario de nivel 10 aporta 20&nbsp;250 XP, suficiente para que un principal pase del nivel 10 al nivel 13.</p>
            <p>Antes de confirmar se muestra una vista previa con cifras (XP transferida, nivel proyectado del principal). El reciclaje es imposible mientras su flota esté en vuelo o en combate. <strong>Acción irreversible.</strong></p>

    items:
        title: "Items del héroe"
        category: "progression"
        order: 6
        tags: "items,equipamiento,bonus,rareza,drop,cthulhu,fusión"
        summary: "Equipa a tu héroe con hasta 3 items para acumular bonus. Cómo conseguirlos."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principe">Principio</h2>
            <p>Los items son objetos que se pueden equipar a tus héroes (máximo <strong>3 items</strong> por héroe). Sus bonus se suman a los del héroe, por encima de los límites de competencias. Lo que aportan depende de sus tipos de bonus, detallados más abajo.</p>

            <h2 id="categories">Categorías</h2>
            <ul>
                <li><strong>Ofensivo</strong> (armas), <strong>Defensivo</strong> (armaduras, escudos) y <strong>Poder</strong> (objetos de estatus).</li>
            </ul>
            <p>La categoría solo cambia el nombre y el aspecto del item: sus bonus se sortean al azar entre todos los tipos, sea cual sea su categoría. Mira, pues, los bonus mostrados en la carta, no la categoría. No hay ninguna restricción de tipo: puedes equipar 3 ofensivos si lo deseas.</p>

            <h2 id="raretes">Rarezas</h2>
            <ul>
                <li><strong>Común</strong>: 1 bonus (+2 a 5&nbsp;%)</li>
                <li><strong>Raro</strong>: 1 o 2 bonus (+5 a 10&nbsp;% cada uno)</li>
                <li><strong>Épico</strong>: 2 o 3 bonus (+10 a 15&nbsp;% cada uno)</li>
                <li><strong>Legendario</strong>: 3 o 4 bonus (+15 a 25&nbsp;% cada uno)</li>
            </ul>
            <p>Cada bonus se sortea al azar dentro del intervalo de su rareza al crear el item, y después ya no cambia.</p>
            <p>El nivel del héroe no cambia los bonus de un item: se suman tal cual, sea el héroe de nivel 1 o de nivel 20. Solo cuenta la especialidad: un héroe de Economía duplica los bonus de Producción y un Explorador duplica los bonus de Velocidad flota. En duelo, como la puntuación es proporcional al nivel, un mismo item aporta más puntos a un héroe de nivel alto, por la misma parte de su puntuación.</p>

            <h2 id="bonus">Tipos de bonus</h2>
            <p>Existen 16 tipos de bonus. Aquí está dónde actúa cada uno (los nombres son los que se muestran en las cartas):</p>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Efecto</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ataque flota, Defensa flota, Precisión flota, Escudo flota</td><td>Combates de la flota a la que acompaña el héroe.</td></tr>
                    <tr><td>Velocidad flota</td><td>Tiempo de vuelo de la flota a la que acompaña el héroe.</td></tr>
                    <tr><td>Producción</td><td>Producción de niobio, agua y comida del planeta donde está destinado el héroe.</td></tr>
                    <tr><td>Fuerza Legionarios</td><td>Defensa en tierra del planeta donde está destinado el héroe, solo contra los desembarcos Cthulhu.</td></tr>
                    <tr><td>Poder duelo</td><td>Puntuación en duelo de arena.</td></tr>
                    <tr><td>Fuerza Mechas, Velocidad construcción, Producción trabajadores, Producción naves, Alcance radar, Velocidad reciclaje, Daño Cthulhu, Ganancia XP</td><td>Estos bonus solo se aplican en duelo de arena.</td></tr>
                </tbody>
            </table>
            <p>En duelo de arena, los 16 tipos cuentan todos, con un peso que depende del tipo (consulta el artículo <em>Arena PvP</em>). Un bonus de flota llevado por un héroe destinado a un planeta solo actúa en duelo.</p>

            <h2 id="obtention">Obtención</h2>
            <p>Estas son todas las formas de obtener items:</p>

            <h3>Combatir a los Cthulhu</h3>
            <p>Puede caer un item cuando derrotas a los Cthulhu, ya sea que rechaces su desembarco en tierra o que aniquiles por completo su horda en órbita antes de que aterrice. Las probabilidades son idénticas en los dos casos y dependen de tu dificultad PvE:</p>
            <ul>
                <li><strong>Fácil</strong>: 30&nbsp;% de probabilidad de obtener un item (22&nbsp;% común, 7&nbsp;% raro, 1&nbsp;% épico)</li>
                <li><strong>Normal</strong>: 40&nbsp;% de probabilidad (25&nbsp;% común, 10&nbsp;% raro, 4,5&nbsp;% épico, 0,5&nbsp;% legendario)</li>
                <li><strong>Difícil</strong>: 50&nbsp;% de probabilidad (25&nbsp;% común, 15&nbsp;% raro, 8&nbsp;% épico, 2&nbsp;% legendario)</li>
            </ul>
            <p>Una horda solo parcialmente destruida en órbita desembarca de todos modos: entonces es ese desembarco el que desencadena el sorteo, nunca los dos a la vez.</p>

            <h3>Victorias en la arena</h3>
            <p>Cada victoria en duelo de arena, combates de torneo incluidos, ofrece una probabilidad de item:</p>
            <ul>
                <li><strong>Común</strong>: 10&nbsp;%</li>
                <li><strong>Raro</strong>: 4&nbsp;%</li>
                <li><strong>Épico</strong>: 1&nbsp;%</li>
            </ul>
            <p>Es decir, alrededor de un 15&nbsp;% de probabilidad de obtener un item en cada victoria.</p>

            <h3>Apuestas en duelo</h3>
            <p>Al lanzar un desafío, puedes apostar un item. Si el adversario acepta, debe apostar un item de la misma rareza. El vencedor se lleva los dos items.</p>

            <h3>Otras fuentes</h3>
            <ul>
                <li><strong>Tower Defense Cthulhu</strong>: cada victoria da derecho a un sorteo según las probabilidades de tu dificultad indicadas arriba (dos sorteos en Difícil).</li>
                <li><strong>Torneos de arena</strong>: item épico garantizado para el 1.º, raro para el 2.º y el 3.º, 10&nbsp;% de probabilidad de un común para los demás participantes (consulta el artículo <em>Arena PvP</em>).</li>
                <li><strong>Bonus de conexión</strong>: un item común el 3.er día de tu racha, un item raro el 7.º.</li>
            </ul>

            <h3>Fusionar tres items</h3>
            <p>Tres items de la <strong>misma rareza</strong> se fusionan en un item de la rareza superior, sin coste ni plazo. La categoría y los bonus del nuevo item se sortean al azar, como en un item encontrado en combate. Los tres items de origen se consumen definitivamente, y un item llevado por un héroe debe desequiparse primero. El legendario es la rareza máxima: no se fusiona.</p>
            <p>La fusión se lanza desde la página <strong>Héroe</strong>, pestaña <strong>Fusión</strong>: haz clic en tres cartas de items para seleccionarlas (toda la carta es clicable), y después valida con el botón de fusión, disponible tanto arriba como abajo de la lista.</p>

            <h2 id="vol">Robo de items</h2>
            <p>Si tu héroe principal es capturado, cada uno de sus items equipados puede ser robado por el vencedor. Probabilidad de robo: Común 80&nbsp;%, Raro 60&nbsp;%, Épico 40&nbsp;%, Legendario 25&nbsp;%.</p>
            <p>Los items no robados se quedan en tu héroe durante su cautiverio: los conserva si es liberado, pero el carcelero los recupera todos si lo ejecuta. Un héroe secundario capturado se lleva todos sus items a casa de su nuevo propietario.</p>

            <h2 id="inventaire">Inventario</h2>
            <p>Accede a tu inventario desde la página <strong>Héroe</strong>, pestaña <strong>Inventario</strong>. Desde el inventario, puedes:</p>
            <ul>
                <li><strong>Equipar</strong> un item a tu héroe principal (si no está capturado, lleva menos de 3 items y no está a bordo de una flota en vuelo o en combate). Los héroes secundarios se equipan desde la pestaña <strong>Cuadra</strong> (botón «Gestionar»).</li>
                <li><strong>Desequipar</strong> un item para devolverlo al inventario (imposible mientras su flota esté en vuelo o en combate).</li>
                <li><strong>Destruir</strong> un item que ya no necesites.</li>
                <li><strong>Fusionar</strong> 3 items de la misma rareza en un item de la rareza superior, desde la vecina pestaña <strong>Fusión</strong>.</li>
            </ul>
            <p>Cada item se presenta como una <strong>carta ilustrada</strong> que muestra su imagen, sus bonus y un borde de color según su rareza. Las cartas se organizan en una cuadrícula (3 a 4 por fila según el espacio disponible en tu pantalla).</p>

    prison:
        title: "Prisión y héroes capturados"
        category: "progression"
        order: 7
        tags: "prisión,captura,héroe,evasión,tortura,rescate,carcelero,secundario"
        summary: "Cuando un héroe es capturado, ¿qué ocurre? Las opciones del prisionero y del carcelero, y la captura directa de los héroes secundarios adversarios."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Captura de un héroe</h2>
            <p>Un héroe principal es capturado durante un combate espacial contra flotas (20&nbsp;%) o en la invasión del planeta donde está destinado (35&nbsp;%): detalles en el artículo <em>Tu héroe</em>. El jugador capturado queda encerrado: cualquier página fuera del perímetro autorizado lo devuelve a la <strong>página de prisión</strong>. Sin embargo, conserva el acceso a la <strong>sala de alianza</strong>, a sus <strong>mensajes privados</strong>, a sus <strong>informes</strong>, a la <strong>consulta</strong> (solo lectura) de su alianza, a la <strong>gestión de su cuenta</strong> y al <strong>cambio de servidor</strong>. Todo lo demás —construcción, flotas, mapa, mercado, arena, e incluso la página Héroe— sigue inaccesible mientras no sea liberado.</p>
            <p>Una captura exige un <strong>edificio Prisión de nivel 1 o más</strong>: el héroe queda encerrado en el lugar del combate si pertenece al vencedor y tiene una Prisión; si no, en el planeta del vencedor con la Prisión más alta. Sin ninguna Prisión, no hay captura.</p>

            <h2 id="prisonnier">Acciones del prisionero</h2>
            <p>El prisionero dispone de varias acciones. <strong>Alertar alianza</strong> y <strong>Rebelarse</strong> comparten un mismo plazo: una de las dos es posible desde la captura, y luego una cada <strong>4 horas</strong>.</p>
            <ul>
                <li><strong>Alertar alianza</strong> (70&nbsp;% + 2&nbsp;% por nivel del héroe, 90&nbsp;% como máximo; 80&nbsp;% en el nivel 5): envía las coordenadas de la prisión a la sala de alianza. Fallo = se alerta al carcelero. Sin alianza, la acción no está disponible. Tras un fallo, la siguiente acción espera 6 horas en lugar de 4.</li>
                <li><strong>Rebelarse</strong> (25&nbsp;% + 1,5&nbsp;% por nivel, +10&nbsp;% para un Militar; 50&nbsp;% para un Militar de nivel 10): destruye el 5&nbsp;% del niobio, del agua y de la comida del planeta-prisión. Fallo = pérdida de un nivel. En ambos casos, el carcelero recibe un informe.</li>
                <li><strong>Escapar</strong>: un intento cada 4 horas a partir de la captura (el primero 4 horas después). 40&nbsp;% de éxito, +5&nbsp;% por cada tramo de 4 horas de cautiverio, hasta el 100&nbsp;% a las 52 horas. Fallo = se alerta al carcelero. Este plazo es independiente de las dos acciones anteriores.</li>
                <li><strong>Escapar gracias a Slash</strong>: en cualquier momento y sin límite. Consulta el artículo <em>Escapar de la prisión</em>.</li>
                <li><strong>Pagar el rescate</strong>: si el carcelero ha pedido uno, puedes pagarlo o rechazarlo desde la página de prisión.</li>
            </ul>

            <h2 id="geolier">Acciones del carcelero</h2>
            <p>Tus prisioneros se gestionan desde la página <strong>Héroe</strong>, pestaña <strong>Prisioneros detenidos</strong>:</p>
            <ul>
                <li><strong>Ejecutar</strong>: destruye al héroe definitivamente y te aporta 100 PDG por nivel del héroe (1&nbsp;200 PDG para un nivel 12). Te quedas con todos sus items restantes. Su propietario lo sabe por un informe.</li>
                <li><strong>Liberar</strong>: gesto diplomático, el héroe vuelve con su propietario.</li>
                <li><strong>Torturar</strong> (200 PDG): revela las coordenadas de un planeta del propietario del prisionero, elegido al azar (puede que ya se conozca), y hace perder 50 XP al prisionero. Repetible sin plazo.</li>
                <li><strong>Pedir rescate</strong>: reclamar niobio, agua y/o uranio a cambio de su liberación. El prisionero tiene 24 horas para pagar o rechazar; solo una solicitud a la vez, pero puedes hacer otra nueva tras un rechazo o una expiración.</li>
            </ul>

            <h2 id="liberation">Liberación</h2>
            <ul>
                <li><strong>La alianza del prisionero invade</strong> el planeta-prisión: liberación automática.</li>
                <li><strong>Otro jugador invade</strong> el planeta-prisión: 60&nbsp;% de probabilidad de que el prisionero se escape en el caos; si no, sigue encerrado y el invasor, nuevo propietario del planeta, pasa a ser su carcelero.</li>
                <li><strong>Los Cthulhu se apoderan del planeta-prisión</strong>: los prisioneros no son liberados. Siguen encerrados en la base Cthulhu y deben escapar por sí mismos (consulta <em>Escapar de la prisión</em>). Si el planeta vuelve a quedar deshabitado, son liberados.</li>
                <li><strong>El carcelero abandona el planeta-prisión</strong> (o abandona la partida): el prisionero es liberado automáticamente.</li>
            </ul>

            <h2 id="secondaires">Capturar a un héroe secundario adversario</h2>
            <p>Todo lo anterior —evasión, tortura, rescate, liberación— se refiere al <strong>héroe principal</strong> de un adversario. Un <strong>héroe secundario</strong> (consulta el artículo <em>Héroes secundarios</em>) obedece a una regla mucho más directa, y ahí tu edificio Prisión cobra una <strong>utilidad decisiva</strong>: en cuanto posees una Prisión de nivel 1 o más en uno de tus planetas, todo héroe secundario adversario vencido frente a ti (combate espacial, combate utilitario, destrucción de su flota por tus defensas orbitales o invasión lograda) pasa a ser <strong>inmediata y definitivamente</strong> tuyo, con su nivel, su experiencia y sus items intactos. Sin Prisión, es <strong>ejecutado</strong> en lugar de capturado, y sus items pasan a tu inventario.</p>
            <p>Un secundario capturado <strong>no</strong> es un prisionero en el sentido de esta página: no hay página de prisión, ni evasión, ni rescate posible. Llega directamente, activo, a tu <strong>Cuadra</strong>, listo para ser colocado en un planeta o una flota, o reciclado.</p>

            <h2 id="prerequis">Requisitos</h2>
            <p>Investigación <strong>Sistema carcelario</strong> (requiere Alambradas nivel 5), y después los edificios <strong>Prisión</strong> y <strong>Campo de esclavos</strong>.</p>

    prison_escape:
        title: "Escapar de la prisión"
        category: "progression"
        order: 8
        tags: "prisión,evasión,slash,rescate,héroe,captura"
        summary: "Las tres formas de salir de la prisión por ti mismo: la evasión instantánea, Slash y el rescate."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Tres salidas</h2>
            <p>Cuando tu héroe es capturado, la página de prisión te ofrece tres formas de salir sin esperar a tus aliados: la evasión instantánea, la evasión gracias a Slash y el pago de un rescate.</p>

            <h2 id="instant">Evasión instantánea</h2>
            <ul>
                <li>Un intento cada <strong>4 horas</strong>. El primero se abre 4 horas después de la captura.</li>
                <li><strong>40&nbsp;%</strong> de éxito en el primer intento, y después <strong>+5&nbsp;%</strong> por cada tramo de 4 horas de cautiverio, hayas probado suerte o no.</li>
                <li>La probabilidad sube hasta el <strong>100&nbsp;%</strong>: 65&nbsp;% tras 24 horas de cautiverio, 95&nbsp;% tras 48 horas, y éxito garantizado a partir de las <strong>52 horas</strong>. El nivel del héroe no influye.</li>
                <li>La probabilidad del próximo intento se muestra en el botón.</li>
                <li>Fallo: tu héroe sigue en prisión y <strong>se alerta al carcelero</strong>.</li>
            </ul>

            <h2 id="slash">Escapar gracias a Slash</h2>
            <p><strong>Slash</strong> es nuestro otro juego (slash-game.com). Juega en él con el <strong>mismo correo electrónico</strong> que tu cuenta de Area Universe, confirmado en ambos lados.</p>
            <ul>
                <li>Alcanza el <strong>75&nbsp;% de la mejor puntuación de la semana</strong> en una partida jugada <strong>después de tu captura</strong>.</li>
                <li>Mientras la semana en curso (desde el lunes 00:00 UTC) cuente con menos de 10 jugadores clasificados o su mejor puntuación esté por debajo de 50 puntos, se usa como referencia la mejor puntuación de la semana anterior.</li>
                <li>Vuelve a la página de prisión y haz clic en <strong>Comprobar mi puntuación</strong>: tu héroe es liberado.</li>
                <li>Intentos <strong>ilimitados</strong>, sin plazo, y no se alerta al carcelero.</li>
                <li>Una cuenta de invitado o un correo no confirmado no puede usar esta salida.</li>
            </ul>

            <h2 id="ransom">Pagar el rescate</h2>
            <p>Si el carcelero pide un rescate (niobio, agua y/o uranio), te avisa un informe y aparece en la página de prisión con su importe y su fecha límite (24 horas). Puedes <strong>pagarlo</strong> o <strong>rechazarlo</strong>.</p>
            <p>Rechazar no libera a tu héroe: el carcelero solo queda informado y puede proponerte un nuevo rescate. El pago se descuenta del conjunto de tus planetas y se ingresa en el planeta-prisión. Si no tienes recursos suficientes, el pago se rechaza y no se descuenta nada.</p>

            <h2 id="sans-rancon">¿Y sin rescate?</h2>
            <p>El carcelero nunca está obligado a pedir un rescate, y tu cautiverio no tiene una duración fija. Sin rescate, tu héroe sale de prisión si:</p>
            <ul>
                <li>logras una <strong>evasión instantánea</strong>: la probabilidad aumenta un 5&nbsp;% cada 4 horas y llega al 100&nbsp;% a las <strong>52 horas</strong> de cautiverio;</li>
                <li>alcanzas la puntuación pedida en <strong>Slash</strong>;</li>
                <li>tu alianza <strong>invade</strong> el planeta-prisión (liberación asegurada), o lo invade otro jugador (60&nbsp;% de probabilidad de evasión);</li>
                <li>el carcelero te <strong>libera</strong>, o abandona el planeta-prisión.</li>
            </ul>
            <p>Mientras estés cautivo, el carcelero también puede torturar a tu héroe (50 XP perdidos cada vez) o ejecutarlo. Más vale, pues, intentar la evasión cuanto antes.</p>

            <h2 id="after">Tras la liberación</h2>
            <p>Tu héroe vuelve a tu planeta más antiguo sin héroe, con sus items restantes, y goza de <strong>24 horas de inmunidad</strong> contra una nueva captura.</p>

    arena:
        title: "Arena PvP"
        category: "progression"
        order: 8
        tags: "arena,duelo,torneo,pvp,héroe,desafío,clasificación"
        summary: "Desafía a otros héroes en duelo 1 contra 1. Apuesta uranio o items, gana prestigio."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Sistema de desafíos</h2>
            <p>Desde la página <strong>Héroe</strong>, pestaña <strong>Arena</strong> (formulario «Lanzar un desafío»), o desde el botón «Desafiar a duelo» del perfil de un jugador, lanza un desafío a otro jugador. No puedes desafiar a un miembro de tu alianza. El desafiado recibe un informe y puede <strong>aceptar</strong> o <strong>rechazar</strong> el desafío.</p>
            <ul>
                <li>Un desafío expira automáticamente a los <strong>7 días</strong> sin respuesta. El número de desafíos recibidos en espera se muestra en la pestaña Arena y en la entrada «Héroe» del menú. El tiempo restante antes de la expiración se muestra junto a cada desafío recibido. Una vez expirado, puedes volver a desafiar al mismo jugador.</li>
                <li>Puedes <strong>cancelar</strong> un desafío que has enviado mientras esté en espera.</li>
                <li>Plazo de recuperación: cada héroe debe esperar <strong>1 hora</strong> tras su último duelo, sea cual sea el adversario. Este plazo se comprueba al enviar el desafío <strong>y</strong> al aceptarlo, para los dos héroes: acumular desafíos en espera no permite, pues, encadenar varios duelos.</li>
                <li>Un héroe capturado no puede desafiar ni ser desafiado. La captura y la pertenencia a la misma alianza se vuelven a comprobar al aceptar.</li>
                <li>El héroe nunca corre peligro (no hay captura en la arena).</li>
            </ul>

            <h2 id="combat">Resolución del combate</h2>
            <p>Cuando el desafiado acepta, el combate se resuelve <strong>inmediatamente</strong> y el resultado se muestra en la pantalla del jugador que ha aceptado: victoria o derrota, las dos puntuaciones, las recompensas y la apuesta ganada o perdida. Los dos jugadores también reciben un informe. La puntuación se basa en:</p>
            <ul>
                <li><strong>Nivel</strong> del héroe: la base de la puntuación</li>
                <li><strong>Ofensa</strong>: ataque del héroe, +5&nbsp;% si es militar, y los bonus ofensivos de sus items</li>
                <li><strong>Defensa</strong>: defensa del héroe y los bonus defensivos de sus items</li>
                <li><strong>Astucia</strong> (peso 60&nbsp;%): Inteligencia —duplicada para un economista, +20&nbsp;% con el rasgo Magnate— y los bonus utilitarios de los items</li>
                <li><strong>Ímpetu</strong> (peso 60&nbsp;%): Velocidad —duplicada para un explorador, +15&nbsp;% con el rasgo Navegante— y la velocidad de flota de los items</li>
                <li><strong>Rasgos militares</strong>: Táctico +10&nbsp;%, Señor de la guerra +5&nbsp;%, e Intimidación resta un 5&nbsp;% a la puntuación del adversario</li>
                <li><strong>Especialidad</strong>: ventaja piedra-papel-tijera (Militar &gt; Explorador &gt; Economía &gt; Militar, +10&nbsp;%)</li>
                <li><strong>Factor aleatorio</strong> de ±15&nbsp;% en cada lado</li>
            </ul>
            <p>En la práctica: puntuación = nivel × 10 × (1 + Ofensa + Defensa + 0,6 × Astucia + 0,6 × Ímpetu + rasgos), donde cada bonus cuenta por su valor (10&nbsp;% = 0,10). El resultado se multiplica después por 1,10 en caso de ventaja de especialidad y por 0,95 si el adversario tiene Intimidación, y luego se aplica el azar. Ejemplo: un Militar de nivel 10 con 10&nbsp;% de Ataque, 8&nbsp;% de Defensa, sin item, y el rasgo Táctico obtiene 10 × 10 × (1 + 0,15 + 0,08 + 0,10) = 133. El nivel pesa, pues, más que todo lo demás.</p>
            <p>En duelo, todos los bonus de items cuentan, con un peso según su tipo (no los duplica la especialidad):</p>
            <ul>
                <li><strong>Ofensa</strong>: Poder duelo (×1,5); Fuerza Legionarios y Ataque flota (×1); Fuerza Mechas, Precisión flota y Daño Cthulhu (×0,5).</li>
                <li><strong>Defensa</strong>: Defensa flota y Escudo flota (×1).</li>
                <li><strong>Astucia</strong>: Producción (×1); Producción trabajadores, Producción naves, Velocidad construcción, Velocidad reciclaje y Alcance radar (×0,5); Ganancia XP (×0,25).</li>
                <li><strong>Ímpetu</strong>: Velocidad flota (×1).</li>
            </ul>

            <h2 id="mises">Apuestas</h2>
            <p>Al lanzar un desafío, puedes añadir una apuesta opcional:</p>
            <ul>
                <li><strong>Uranio</strong>: cada jugador apuesta la misma cantidad. El vencedor se lleva las dos apuestas.</li>
                <li><strong>Item</strong>: cada jugador apuesta un item de la misma rareza. El vencedor se lleva los dos items. El item debe estar <strong>desequipado</strong> (por ambos lados) y no puede estar comprometido en dos desafíos en espera a la vez.</li>
                <li><strong>Amistoso</strong>: sin apuesta, solo se conceden las recompensas base.</li>
            </ul>
            <p>La apuesta queda cubierta si al menos uno de tus planetas posee el uranio requerido: se descuenta de tu planeta más rico en uranio. Si un jugador ya no tiene suficiente uranio en ningún planeta en el momento de la aceptación, el desafío fracasa. Si el item apostado por el retador ya no está disponible cuando el desafiado acepta (ya no le pertenece o está equipado), el duelo se rechaza.</p>

            <h2 id="recompenses">Recompensas base</h2>
            <p>El vencedor recibe en cada duelo:</p>
            <ul>
                <li>Uranio: entre 5 y 15, multiplicado por el nivel medio de los dos héroes ÷ 10, limitado a <strong>20</strong> por duelo (5 a 15 entre dos niveles 10). Se ingresa en tu planeta más pequeño, igual que el uranio de las apuestas ganadas.</li>
                <li>Puntos de guerra: 15 × el nivel del vencedor, multiplicados por la relación entre el menor y el mayor de los dos niveles (nunca menos de la mitad). Dos héroes de nivel 15: 225 PDG; un nivel 15 que vence a un nivel 10: 150 PDG.</li>
                <li>XP: de 30 a 90 según lo reñido del duelo (consulta el artículo <em>Tu héroe</em>).</li>
                <li>Probabilidad de item: alrededor del 15&nbsp;% en total (10&nbsp;% común, 4&nbsp;% raro, 1&nbsp;% épico)</li>
            </ul>
            <p>El perdedor no pierde nada (salvo su apuesta eventual), pero no gana ni XP ni recompensa.</p>

            <h2 id="classement">Clasificación</h2>
            <p>Una clasificación por servidor muestra a los mejores duelistas:</p>
            <ul>
                <li>Ordenada por porcentaje de victorias en duelo (los combates de torneo no cuentan), y después por número de victorias</li>
                <li>Mínimo <strong>5 combates</strong> para aparecer</li>
                <li>Los <strong>5 primeros</strong> son visibles directamente en la página; un botón permite abrir la clasificación completa con paginación y ordenación</li>
                <li>Recompensas semanales ingresadas automáticamente cada <strong>lunes</strong> por la semana anterior (del lunes 0h al domingo 24h, hora de París), una sola vez: top 3 según el <strong>número de victorias en duelo</strong> de la semana, con un mínimo de <strong>5 duelos</strong> en la semana. Solo se tiene en cuenta a los jugadores (ni los comandantes IA, ni las cuentas eliminadas). 1.º = 3000 de uranio + 300 PDG, 2.º = 2000 + 200 PDG, 3.º = 1000 + 100 PDG. Cada jugador recompensado recibe un informe.</li>
            </ul>

            <h2 id="tournois">Torneos</h2>
            <p>Evento de servidor periódico: un torneo cada <strong>7 días</strong> por servidor.</p>
            <ul>
                <li>Inscripción abierta durante <strong>24h</strong> desde la pestaña Arena de la página Héroe. Un héroe capturado no puede inscribirse, y queda excluido si es capturado antes del cierre de las inscripciones.</li>
                <li>Al cierre de las inscripciones, todo el cuadro se juega de golpe: eliminación directa tras un sorteo (cuando el número de clasificados es impar, uno de ellos pasa la ronda de oficio, en cualquier ronda), y después un partido por el 3.er puesto entre los dos perdedores de las semifinales.</li>
                <li>Hacen falta al menos <strong>2 participantes</strong>: si no, el torneo se cancela (ninguna recompensa) y los inscritos son avisados por informe. Con un solo jugador inscrito, el torneo se celebra si un comandante IA puede completar el cuadro.</li>
                <li>En cuanto hay al menos un jugador inscrito, los <strong>comandantes IA</strong> del servidor (héroe principal no capturado) completan el cuadro hasta <strong>8 participantes</strong> en total. Se inscriben progresivamente durante las 24h de inscripción, y el cuadro se completa al cierre si aún faltan.</li>
                <li>Si hay <strong>8 jugadores o más</strong> inscritos, ningún comandante IA participa. Sin ningún jugador inscrito, el torneo no se celebra: los comandantes IA nunca juegan entre sí.</li>
                <li>Cada combate del torneo aporta también a su vencedor las recompensas habituales de un duelo.</li>
                <li>Los comandantes IA compiten por el podio y reciben las mismas recompensas que los jugadores, salvo la probabilidad de obtener un héroe secundario.</li>
                <li>El campeón conserva un 25&nbsp;% de probabilidad de obtener un héroe secundario (reservada a los jugadores).</li>
            </ul>
            <p>Recompensas:</p>
            <ul>
                <li>1.º = 5000 de uranio + 500 PDG + 1 item épico (20&nbsp;% de probabilidad de un item legendario además)</li>
                <li>2.º = 3000 de uranio + 300 PDG + 1 item raro (10&nbsp;% de probabilidad de un item épico además)</li>
                <li>3.º = 1500 de uranio + 150 PDG + 1 item raro</li>
                <li>Otros participantes = 500 de uranio + 50 PDG (10&nbsp;% de probabilidad de un item común)</li>
            </ul>
            <p>Cada participante recibe un informe con su clasificación y sus recompensas. La página Arena muestra la cuenta atrás del fin de inscripción, el podio del último torneo y la fecha del próximo.</p>

    login_bonus:
        title: "Bonus de conexión"
        category: "progression"
        order: 9
        tags: "bonus,conexión,diario,bitcoin,serie,racha"
        summary: "Bitcoins gratis cada día, multiplicados si encadenas varios días consecutivos."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Cada <strong>día natural</strong> (el día cambia a medianoche, hora de París), el juego te ofrece un bonus de Bitcoins, en cada uno de los servidores donde juegas. Se abre una ventana cuando entras en el juego: haz clic en <strong>«Reclamar»</strong> para recibirlo. El juego también puede avisarte con una notificación cuando el bonus del día está disponible.</p>
            <p>El importe corresponde al <strong>más ventajoso</strong> de los dos cálculos siguientes, y después se multiplica por tu racha:</p>
            <ul>
                <li>Un <strong>suelo ligado a tu nivel</strong>: <strong>nivel × 5&nbsp;000 Bitcoins</strong>, multiplicado cada día por un sorteo al azar de ×1, ×2, ×3, ×4 o ×5. Garantiza un bonus motivador al inicio de la partida.</li>
                <li><strong>5&nbsp;% de la media de Bitcoins del servidor</strong>: así el bonus sigue siendo interesante a medida que crece la economía del servidor.</li>
                <li>El resultado se multiplica después por tu <strong>multiplicador de racha</strong> (ver más abajo).</li>
            </ul>
            <p>Esta media solo cuenta a los jugadores (ni bots ni cuentas de prueba); a partir de 20 jugadores, descarta al 5&nbsp;% más rico y al 5&nbsp;% más pobre. Se recalcula una vez al día.</p>
            <p>Suelo según el nivel (antes del multiplicador de racha; todo comandante empieza en el nivel 2):</p>
            <table>
                <tr><th>Nivel</th><th>Suelo posible</th><th>En el día 7 (×5)</th></tr>
                <tr><td>2</td><td>10&nbsp;000 a 50&nbsp;000</td><td>50&nbsp;000 a 250&nbsp;000</td></tr>
                <tr><td>5</td><td>25&nbsp;000 a 125&nbsp;000</td><td>125&nbsp;000 a 625&nbsp;000</td></tr>
                <tr><td>10</td><td>50&nbsp;000 a 250&nbsp;000</td><td>250&nbsp;000 a 1&nbsp;250&nbsp;000</td></tr>
                <tr><td>15</td><td>75&nbsp;000 a 375&nbsp;000</td><td>375&nbsp;000 a 1&nbsp;875&nbsp;000</td></tr>
                <tr><td>20</td><td>100&nbsp;000 a 500&nbsp;000</td><td>500&nbsp;000 a 2&nbsp;500&nbsp;000</td></tr>
                <tr><td>30</td><td>150&nbsp;000 a 750&nbsp;000</td><td>750&nbsp;000 a 3&nbsp;750&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000 a 1&nbsp;000&nbsp;000</td><td>1&nbsp;000&nbsp;000 a 5&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>Para otro nivel, multiplícalo por 5&nbsp;000 (sorteo ×1) y por 25&nbsp;000 (sorteo ×5).</p>
            <p>Ejemplo: en el nivel 10, el sorteo del día da ×2, es decir, un suelo de 100&nbsp;000 Bitcoins. Si la media del servidor es de 3&nbsp;000&nbsp;000 Bitcoins, el 5&nbsp;% son 150&nbsp;000: ese es el importe que se aplica. En el 3.<sup>er</sup> día de racha (×1,5), recibes 225&nbsp;000 Bitcoins.</p>

            <h2 id="streak">La racha de 7 días consecutivos</h2>
            <p>Reclamar tu bonus <strong>cada día</strong> hace subir tu multiplicador:</p>
            <table>
                <tr><th>Día consecutivo</th><th>Multiplicador</th></tr>
                <tr><td>Día 1</td><td>×1,0</td></tr>
                <tr><td>Día 2</td><td>×1,2</td></tr>
                <tr><td>Día 3</td><td>×1,5</td></tr>
                <tr><td>Día 4</td><td>×1,8</td></tr>
                <tr><td>Día 5</td><td>×2,0</td></tr>
                <tr><td>Día 6</td><td>×2,5</td></tr>
                <tr><td>Día 7</td><td>×5,0</td></tr>
            </table>
            <p>En el 8.<sup>o</sup> día, el ciclo vuelve al día 1. Hay que reclamar el bonus <strong>cada día del calendario</strong> (de medianoche a medianoche, hora de París): si pasa un día sin reclamar, la racha vuelve al día 1. El número de horas entre dos conexiones no cuenta, solo cuenta el día. Reclamar el lunes a las 0:05 y después el martes a las 23:55 mantiene la racha; reclamar el lunes a las 23:59 y después el miércoles a las 0:01 la rompe.</p>

            <h2 id="items">Los items bonus</h2>
            <p>Algunos días de la racha ofrecen además un <strong>item para tu héroe</strong>, aleatorio:</p>
            <ul>
                <li><strong>Día 3</strong>: un item común.</li>
                <li><strong>Día 7</strong>: un item raro.</li>
            </ul>

            <h2 id="reclamation">Cómo reclamarlo</h2>
            <p>La ventana «Bono de conexión» se abre automáticamente cuando entras en el juego: un clic en <strong>«Reclamar»</strong> acredita los Bitcoins (y el item del día 3 o 7). También muestra tu récord personal de días seguidos, que no puede superar 7, ya que la racha vuelve al día 1 después del día 7.</p>

            <h2 id="conseil">Un pequeño consejo</h2>
            <p>Bastan incluso 30 segundos: abre el juego y haz clic en «Reclamar». No te pierdas el día 7, que es cuando más rinde.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminación,quiebra,fin"
        summary: "Las 2 formas de perder la partida, y lo que te queda después."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">Los 2 tipos de Game Over</h2>
            <p>Hay dos formas de perderlo todo en un servidor: la quiebra, que te deja tus planetas pero no tus naves, y la pérdida de todos tus planetas, que deja a tu comandante a cero. Conocerlas ya es protegerse de ellas.</p>

            <h2 id="faillite">1. La quiebra económica</h2>
            <p>Si, después del <strong>informe diario de las 18:59 (hora de París)</strong>, tu saldo de Bitcoins es <strong>negativo</strong>: <strong>Game Over económico</strong>.</p>
            <ul>
                <li>Todas tus <strong>flotas</strong> se eliminan, en vuelo o en órbita, con su cargamento y sus tropas.</li>
                <li>Todas las <strong>naves en tierra</strong> de tus planetas se pierden.</li>
                <li>Tu saldo se <strong>restablece a 125&nbsp;000 Bitcoins</strong>.</li>
            </ul>
            <p>Conservas tus planetas, edificios, defensas, investigaciones, tropas en tierra y tu clasificación: sigues jugando, pero sin ninguna nave.</p>
            <p><strong>Se te avisa antes:</strong> en cuanto tu saldo cae por debajo del déficit diario proyectado (coste de mantenimiento menos ingresos del último informe), un informe de alerta «¡Bancarrota inminente!» te avisa, como máximo uno al día. Si lo recibes, actúa antes del siguiente informe diario.</p>

            <h2 id="planetes">2. La pérdida de todos tus planetas</h2>
            <p>Si pierdes tu <strong>último planeta</strong> —invadido por un jugador o por los Cthulhu, o, en Battle Royale, cuando desaparece tu sector—, tu comandante queda eliminado. No puedes abandonar voluntariamente tu último planeta.</p>
            <ul>
                <li>Si es un jugador quien invade tu último planeta, <strong>se queda con todos tus Bitcoins y todos tus Puntos de Guerra</strong>.</li>
                <li>Tus <strong>flotas</strong> se eliminan (si son los Cthulhu quienes toman tu último planeta, pasan a su control).</li>
                <li>Tu comandante se <strong>restablece a cero</strong>: 125&nbsp;000 Bitcoins, investigaciones e investigaciones políticas a cero, terraformación dividida entre 2, clasificación reiniciada, héroe e informes eliminados.</li>
                <li>Abandonas tu alianza (se disuelve si eras su único miembro, o el Dirigente de una alianza de El Martillo de las Estrellas).</li>
                <li>Tu trayectoria en este servidor queda <strong>registrada</strong> en el perfil de tu cuenta.</li>
            </ul>

            <h2 id="eviter">Cómo evitar el Game Over</h2>
            <ul>
                <li>Vigila cada día tu <strong>balance</strong> (ingresos − costes). Si se pone en rojo, reacciona.</li>
                <li>Pon en tierra las flotas que no sirven: su mantenimiento se divide entre 6.</li>
                <li>No reclutes en exceso: un ejército en mantenimiento permanente puede arruinar a un economista poco vigilante.</li>
                <li>Mantén siempre <strong>al menos 2 planetas</strong> en condiciones de defender.</li>
                <li>Vigila las <strong>flotas enemigas que se acercan</strong> (notificaciones, radar).</li>
                <li>En caso de gran peligro, <strong>evacúa</strong> tus tropas y recursos a un planeta seguro.</li>
            </ul>

            <h2 id="apres">¿Qué queda después?</h2>
            <p>Incluso eliminado, conservas tu <strong>cuenta de jugador</strong> y tus <strong>estadísticas</strong> de las partidas anteriores. Puedes unirte a otro servidor, o volver a inscribirte en el mismo desde la página de selección de servidores (menú «Servidor») mientras sus inscripciones estén abiertas: entonces empiezas de nuevo con un planeta de inicio nuevo.</p>

    game_modes:
        title: "Los modos de servidor"
        category: "events"
        order: 1
        tags: "modo,battle royale,dominación,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe ofrece 7 modos de servidor distintos, con reglas y objetivos propios."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Visión general</h2>
            <p>Cada servidor de Area Universe tiene un <strong>modo</strong>, elegido por el admin al crearlo. El modo fija la duración, la condición de victoria y la presencia de los Cthulhu.</p>
            <table>
                <thead>
                    <tr><th>Modo</th><th>Duración</th><th>Condición de victoria</th><th>¿Cthulhu?</th><th>¿Alianzas?</th><th>Investigaciones</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu</td><td>300 días</td><td>Ninguna</td><td>Sí</td><td>Sí</td><td>Normales</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>30 días como máximo</td><td>El VIP que sobrevive 72&nbsp;h</td><td>No</td><td>Sí (salvo para el VIP)</td><td>Máx. desde el inicio</td></tr>
                    <tr><td>Domination</td><td>60 días</td><td>Mejor puntuación individual al final</td><td>No</td><td>Sí</td><td>Máx. desde el inicio</td></tr>
                    <tr><td>Battle Royale</td><td>40 días como máximo</td><td>Último superviviente</td><td>No</td><td>No</td><td>Máx. desde el inicio</td></tr>
                    <tr><td>Paid Server</td><td>60 días</td><td>Mejor puntuación ponderada (puntos + 2 × PDG)</td><td>No</td><td>Sí</td><td>Normales</td></tr>
                    <tr><td>Long Run</td><td>900 días</td><td>Ninguna (maratón)</td><td>Durante los eventos «Ataque Cthulhu»</td><td>Sí</td><td>Normales</td></tr>
                    <tr><td>Short Run</td><td>150 días</td><td>Ninguna (sprint)</td><td>Durante los eventos «Ataque Cthulhu»</td><td>Sí</td><td>Normales</td></tr>
                </tbody>
            </table>
            <p>Una partida que designa un vencedor (Search &amp; Destroy, Battle Royale) se detiene en cuanto se conoce ese vencedor, y el servidor cierra: la duración indicada es entonces un máximo.</p>
            <p>En la lista de servidores, algunos modos llevan otro nombre: <strong>Search &amp; Destroy</strong> se muestra como «Búsqueda y Destrucción» (y «Busca y Destruye» en el menú del juego), <strong>Long Run</strong> como «Largo plazo», <strong>Short Run</strong> como «Corto plazo» y <strong>Paid Server</strong> como «Servidor de pago».</p>

            <h2 id="cthulhu">Modo Cthulhu (PvE clásico)</h2>
            <p>El modo básico, perfecto para descubrir el juego. Durante las <strong>primeras 72 horas</strong> del servidor, ningún ataque Cthulhu: es la <strong>fase de preparación</strong>. Durante esta fase, el servidor lleva la insignia «Bloqueado» en la lista de servidores y rechaza a los nuevos comandantes (mensaje «Este servidor está bloqueado (preparación o inscripciones cerradas).»).</p>
            <p>Después, las hordas Cthulhu te atacan con regularidad. La primera se lanza <strong>5 días después de tu inscripción</strong>, y luego sale una nueva horda cada <strong>18 a 30 horas</strong> en Fácil, <strong>12 a 24 horas</strong> en Normal y <strong>8 a 16 horas</strong> en Difícil. También puedes desactivar por completo el PvE en tus <strong>Preferencias</strong> (consulta el artículo <em>La amenaza Cthulhu</em>).</p>
            <p>No hay condición de victoria ni vencedor: al final de los 300 días, el servidor cierra y tu resultado (clasificación, puntos…) queda en tu perfil de trayectoria. El logro <strong>Élite</strong> recompensa un puesto en el top 10 de un servidor.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (caza del VIP)</h2>
            <p>Las <strong>primeras 48 horas</strong> del servidor sirven de puesta en marcha: aún no se designa ningún VIP. Como en el modo Cthulhu, el servidor lleva entonces la insignia «Bloqueado» y rechaza a los nuevos comandantes.</p>
            <p>Después, se sortea un <strong>VIP</strong> entre los jugadores que siguen en juego, y la sala pública anuncia «Nuevo VIP: …». Su objetivo: <strong>sobrevivir 72 horas</strong>. Si lo consigue, gana y la partida se detiene enseguida.</p>
            <ul>
                <li>Si es eliminado (game over) por un jugador, <strong>el asesino pasa a ser el nuevo VIP</strong> («El VIP fue eliminado por …») y la cuenta atrás de 72 horas vuelve a cero.</li>
                <li>Si es eliminado de otra forma (por un comandante IA, por ejemplo), se sortea un nuevo VIP.</li>
            </ul>
            <p>El VIP está <strong>solo contra todos</strong>: sale automáticamente de su alianza en el momento de su nombramiento. Si era su jefe, el miembro de mayor rango ocupa su lugar; si era el único miembro, la alianza se disuelve. Mientras lleva el estatus, no puede crear ni unirse a una alianza, y sigue teniéndolo prohibido durante <strong>3 días</strong> después de perderlo.</p>
            <p>La <strong>protección de principiantes</strong> también se aplica al VIP: mientras dure (menos de 7 días desde su inscripción, menos de 4 planetas, ninguna misión ofensiva lanzada), ningún jugador puede enviar una flota a sus planetas.</p>

            <h2 id="domination">Domination (planetas estratégicos)</h2>
            <p>Al empezar, se sortean <strong>5 planetas estratégicos</strong> entre todos los planetas del servidor, tanto planetas de jugadores como planetas deshabitados.</p>
            <ul>
                <li>Una vez al día, en el cambio de fecha (medianoche, hora de París), cada planeta estratégico aporta <strong>+5 puntos</strong> al jugador que lo posee en ese instante. Tener dos aporta, pues, +10 al día.</li>
                <li>Los comandantes IA no puntúan.</li>
                <li>Cada <strong>5 días</strong>, un nuevo sorteo sustituye a los planetas estratégicos. La sala pública anuncia «Los planetas estratégicos acaban de cambiar.» en el momento en que ocurre, sin previo aviso.</li>
            </ul>
            <p>Al final del servidor (60 días), gana el jugador que tiene más puntos. La clasificación es <strong>individual</strong>: en Domination no hay puntuación ni victoria de alianza.</p>

            <h2 id="battle-royale">Battle Royale (último superviviente)</h2>
            <p>Modo en solitario: <strong>no se permite ninguna alianza</strong>. Una sola galaxia. Las inscripciones cierran <strong>7 días</strong> después de la apertura: el servidor lleva entonces la insignia «Bloqueado», y solo los jugadores ya inscritos pueden volver a él.</p>
            <p>El mapa es una cuadrícula espacial de 10 × 10, es decir, 100 sistemas, que <strong>se encoge por anillos concéntricos</strong>: en cada turno, <strong>todo el anillo exterior desaparece de golpe</strong> (no sistema por sistema). Los sistemas destruidos siguen mostrándose como <strong>agujeros</strong>: el mapa no se reorganiza, lo que hace legible la zona segura de un vistazo.</p>
            <p><strong>5 turnos, uno por semana:</strong></p>
            <table>
                <thead>
                    <tr><th>Día</th><th>Sistemas destruidos</th><th>Sistemas restantes</th></tr>
                </thead>
                <tbody>
                    <tr><td>D+7</td><td>36 (el borde de la cuadrícula)</td><td>64</td></tr>
                    <tr><td>D+14</td><td>28</td><td>36</td></tr>
                    <tr><td>D+21</td><td>20</td><td>16</td></tr>
                    <tr><td>D+28</td><td>12</td><td>4</td></tr>
                    <tr><td>D+35</td><td>3 de los 4 últimos</td><td><strong>1 solo</strong>, sorteado</td></tr>
                </tbody>
            </table>
            <p>Los 5 últimos días se juegan en ese último sistema.</p>
            <ul>
                <li><strong>12&nbsp;h antes</strong> de su destrucción, un anillo pasa a <strong>naranja</strong> (advertencia).</li>
                <li><strong>1&nbsp;h antes</strong>, pasa a <strong>rojo parpadeante</strong>: ya no puede salir ninguna flota hacia sus sistemas ni desde ellos.</li>
                <li>Un sistema destruido elimina definitivamente sus planetas y sus flotas. Si tu <strong>héroe principal</strong> estaba allí (en un planeta o en una flota), quedas eliminado; un héroe secundario vuelve simplemente a la reserva. También quedas eliminado si ya no tienes ningún planeta.</li>
                <li>Una flota en camino hacia un sistema desaparecido (o salida de un sistema desaparecido) es destruida a la llegada; si tu héroe principal va a bordo, quedas eliminado.</li>
            </ul>
            <p><strong>Victoria</strong>: ser el último jugador que sigue en juego. La partida se detiene en cuanto solo queda un superviviente. Si varios jugadores siguen en juego el día 40, el servidor termina sin vencedor.</p>

            <h2 id="paid-server">Paid Server (competitivo de pago)</h2>
            <p>Servidor de pago: la inscripción cuesta <strong>5&nbsp;€</strong>, pagados una sola vez mediante Stripe para ese servidor concreto (otro servidor de pago se paga aparte). Hace falta una cuenta completa, no una cuenta de invitado. En la lista de servidores, lleva la insignia «💳 De pago 5 €». 100&nbsp;% PvP, ningún Cthulhu. Duración 60 días.</p>
            <p><strong>Victoria</strong>: al final, gana el jugador que sigue en juego y tiene la mejor <strong>puntuación ponderada</strong>.</p>
            <ul>
                <li>Puntuación ponderada = puntos de la clasificación + 2 × puntos de guerra (PDG).</li>
                <li>Ejemplo: 300&nbsp;000 puntos y 50&nbsp;000 PDG dan una puntuación de 400&nbsp;000.</li>
            </ul>
            <p>El combate cuenta, pues, doble: es un modo para jugadores competitivos.</p>
            <p>Como en todos los modos que designan un vencedor, el ganador recibe la insignia <strong>Ganador</strong> en su perfil de trayectoria, conservada de un servidor a otro, y el logro <strong>Emperador</strong>.</p>

            <h2 id="long-short-run">Long Run / Short Run (con eventos)</h2>
            <p>Dos modos PvE con reglas idénticas: solo cambia la duración. El <strong>Long Run</strong> dura 900 días, el <strong>Short Run</strong> 150 días.</p>
            <p>Los Cthulhu no atacan en ellos de forma permanente: sus hordas solo salen durante los eventos <strong>Ataque Cthulhu</strong>. Estos eventos duran 72 horas: el primero empieza 7 días después de la apertura del servidor, y después vuelven cada 21 días.</p>
            <p>La <strong>Arena de alianza</strong> vuelve en ellos cada 3 días, y las profecías de Cthulhu también se desencadenan. El calendario es fijo, calculado desde la apertura del servidor: consulta el artículo <em>Eventos especiales</em>.</p>

            <h2 id="recherches-max">Modos con investigaciones máximas desde el inicio</h2>
            <p>En <strong>Search &amp; Destroy, Domination y Battle Royale</strong>, todas tus investigaciones empiezan en el nivel máximo: el menú Investigación está oculto, para jugar directamente la parte militar.</p>
            <p>Tu planeta de inicio recibe entonces un <strong>kit de inicio</strong>:</p>
            <ul>
                <li><strong>500 de uranio</strong> para personalizar rápidamente.</li>
                <li><strong>Toda tu reserva de puntos de mejora de naves</strong> desde el día 1, en lugar del límite habitual de 40 puntos al día.</li>
            </ul>
            <p>En <strong>Search &amp; Destroy</strong>, cada jugador recibe además, al inscribirse, un kit militar en su planeta de inicio (todos pueden llegar a ser VIP): 2&nbsp;000 Legionarios, 25 barcazas, 500 destructores y 250 torretas láser pesadas.</p>

            <h2 id="fin-de-serveur">Fin de servidor y archivo</h2>
            <p>Cuando un servidor cierra, tus <strong>estadísticas finales</strong> (puntos, héroes, logros de VIP, victorias, etc.) se archivan en tu <strong>cuenta de jugador</strong>. Tu comandante (el personaje de esa partida) se elimina, pero tu historial se conserva.</p>

    cthulhus:
        title: "La amenaza Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,colmena,horda,guarnición,asedio,amenaza,pve,uranio,tower defense,td"
        summary: "Los Cthulhu concentran verdaderas hordas que viajan a cielo abierto antes de atacar tus planetas. Cómo defenderte de ellas, cómo se defienden también sus bases y el Tower Defense para rechazar el asalto."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">¿Qué son los Cthulhu?</h2>
            <p>Los <strong>Cthulhu</strong> (los Poseídos) son las criaturas hostiles controladas por el juego (PvE). Tienen <strong>bases de la colmena</strong> repartidas por la galaxia, de donde salen <strong>hordas</strong>: verdaderas flotas, con una composición, una potencia y un trayecto visibles, no una simple cuenta atrás.</p>
            <p>Los Cthulhu solo existen en los servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> y <strong>Short Run</strong>. En Long Run y Short Run, sus hordas solo salen durante los eventos <strong>Ataque Cthulhu</strong> (consulta <em>Eventos especiales</em>).</p>
            <p>Dos indicadores que no hay que confundir:</p>
            <ul>
                <li>tu <strong>amenaza personal</strong>, que regula la fuerza de las hordas lanzadas contra ti (este artículo);</li>
                <li>la <strong>Amenaza del universo</strong>, común al servidor, que desencadena las profecías (consulta <em>Las profecías de Cthulhu</em>).</li>
            </ul>

            <h2 id="menace">El nivel de amenaza</h2>
            <p>Tu amenaza personal se muestra en la página <strong>Cthulhu</strong>, en el bloque «Amenaza Cthulhu» (Planeta amenazado, Nivel de amenaza, Tiempo restante). Cuanto más alta es, más fuertes son los ataques siguientes.</p>
            <p>Cada vez que tus defensas rechazan un <strong>desembarco</strong> Cthulhu en tierra, tu amenaza aumenta. Destruir la horda antes de que desembarque (sobre su base, en vuelo o en órbita de tu planeta) no la hace subir. La ganancia depende de la dificultad y del régimen de tu alianza:</p>
            <table>
                <thead>
                    <tr><th>Dificultad</th><th>Sin alianza</th><th>Alianza El Martillo de las Estrellas</th><th>Otra alianza</th></tr>
                </thead>
                <tbody>
                    <tr><td>Fácil</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Difícil</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>El régimen <strong>El Martillo de las Estrellas</strong> reduce, pues, la progresión de la amenaza.</p>
            <p>La amenaza <strong>también sube sola</strong>, mientras tu PvE esté activo:</p>
            <ul>
                <li>+5 en cada informe diario (18:59, hora de París);</li>
                <li>+1 por hora mientras una horda permanezca en órbita de uno de tus planetas antes de desembarcar.</li>
            </ul>
            <p>Esta subida automática se detiene en 300. Para hacer bajar la amenaza:</p>
            <ul>
                <li>ganar un <strong>Tower Defense</strong> la divide entre 2;</li>
                <li><strong>liberar una base</strong> de la colmena la divide entre 10 (ver más abajo);</li>
                <li>una derrota en tierra también la divide (consulta la tabla «Si la horda gana en tierra»).</li>
            </ul>
            <p>Un jugador constante la mantiene, pues, baja; un jugador que la deja crecer se expone a hordas cada vez más grandes.</p>

            <h2 id="puissance">Potencia de las invasiones</h2>
            <p>Un ataque se juega en dos tiempos, y la dificultad pesa en ambos:</p>
            <ul>
                <li><strong>La horda (combate orbital)</strong>: su flota se calcula a partir de la <strong>potencia de tu propia flota</strong>. Cuanto más fuerte es tu flota respecto a tu nivel de amenaza, más lo es también la horda (de 0,7 a 1,5 veces tu potencia). Después se aplica la dificultad: ×0,5 en Fácil, ×1 en Normal, ×1,5 en Difícil. Una de cada cinco hordas se refuerza (+25&nbsp;%). La horda que sigue al paso de tu amenaza por encima de 100, 250 y después 500 es una <strong>horda Jefe</strong>, el doble de grande.</li>
                <li><strong>El desembarco (combate terrestre)</strong>: su fuerza depende de tu <strong>nivel de amenaza</strong> y de tu nivel de investigación <strong>Terraformación</strong>, y después de la parte de la horda que ha sobrevivido al combate orbital. En Fácil, se divide entre 2.</li>
            </ul>

            <h2 id="horde">El ataque: una horda muy real</h2>
            <p>La primera horda se lanza <strong>5 días después de tu inscripción</strong>. Después, sale una nueva horda cada <strong>18 a 30 horas</strong> en Fácil, <strong>12 a 24 horas</strong> en Normal y <strong>8 a 16 horas</strong> en Difícil. El temporizador de la entrada «Cthulhu» del menú indica el próximo lanzamiento.</p>
            <p>Un ataque siempre empieza con una <strong>concentración</strong>: la horda se agrupa en órbita de una base de la colmena durante <strong>6 horas</strong> (12 horas para una horda Jefe) antes de lanzarse.</p>
            <p>Una vez en camino, vuela a <strong>velocidad de horda</strong> (lenta, ampliamente visible en el <strong>radar</strong>) y se <strong>garantiza una alerta 1 hora antes de su llegada</strong>, sea cual sea tu cobertura de radar.</p>
            <p>Es una <strong>flota de verdad</strong>: puedes destruirla en cualquier momento, en formación sobre su base, en pleno vuelo, una vez llegada a la órbita de tu planeta, o ganando el <strong>Tower Defense</strong>. Destruirla anula el ataque, sea cual sea el momento.</p>
            <p>A la llegada, se juega un <strong>combate orbital</strong> (tus flotas y tus torretas contra la horda). Los supervivientes desembarcan <strong>2 horas más tarde</strong> para el asalto en tierra. Varias hordas pueden estar en formación o en vuelo a la vez.</p>
            <p>Única excepción: la <strong>infiltración</strong>. A partir de una <strong>amenaza de 200</strong>, cada ataque tiene un 15&nbsp;% de probabilidad de serlo: es <strong>instantáneo e invisible</strong> (sin concentración, sin previo aviso) y su desembarco es un 30&nbsp;% más potente.</p>

            <h3>Si tus defensas ganan</h3>
            <table>
                <thead>
                    <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                </thead>
                <tbody>
                    <tr><td>Bajas de Legionarios</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Bajas de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Bajas de trabajadores</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Ganas <strong>PDG</strong>, una probabilidad de <strong>botín de item</strong> y un 1&nbsp;% de probabilidad de reclutar a un <strong>héroe secundario</strong>. Aniquilar por completo la horda antes de su desembarco da la misma probabilidad de objeto y de héroe.</p>

            <h3>Si la horda gana en tierra</h3>
            <p>El saqueo y la captura son <strong>proporcionales a lo que queda de la horda</strong> tras el combate orbital: una horda a medio destruir saquea la mitad. Por debajo del <strong>90&nbsp;% de supervivencia</strong>, ya no tiene tropas suficientes para capturar el planeta, incluso en dificultad Difícil.</p>
            <table>
                <thead>
                    <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                </thead>
                <tbody>
                    <tr><td>Saqueo de recursos (horda intacta)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planeta capturado (si ≥ 90&nbsp;% de supervivencia)</td></tr>
                    <tr><td>Reducción de amenaza tras la derrota</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>En <strong>Difícil</strong>, sin suficientes supervivientes para capturar, el saqueo vuelve a la tasa <strong>Normal</strong> (70&nbsp;%), multiplicada por la proporción de supervivencia de la horda. Si el planeta es capturado y era tu último, es el Game Over.</p>

            <h2 id="bases">Las bases de la colmena</h2>
            <p>La colmena tiene <strong>bases</strong> repartidas por la galaxia: las bases de origen de la colmena (hasta 36 por galaxia, de potencia creciente; sus nombres van de «Cthulhu I» para los puestos avanzados a los temibles «Cthulhu V») y antiguos planetas convertidos por una expansión o una erupción.</p>
            <p>Cada una está protegida por una <strong>guarnición permanente</strong> de aproximadamente 0,8 veces la mayor flota del servidor. Una guarnición dañada no se repara; una guarnición destruida se sustituye por una nueva <strong>24 horas</strong> después.</p>
            <p>Estacionar en órbita de una base una o varias flotas <strong>en modo ataque</strong> (las tuyas y las de otros jugadores) cuya firma acumulada alcance al menos <strong>10&nbsp;000</strong> desencadena un <strong>asedio</strong>:</p>
            <ul>
                <li>la base sitiada ya no envía hordas: salen de una base más lejana;</li>
                <li>unas <strong>oleadas de defensa</strong> ganan potencia (+25&nbsp;% cada 2 horas);</li>
                <li>pasadas <strong>6 horas</strong>, las demás bases envían <strong>flotas de socorro</strong> como refuerzo;</li>
                <li>la base lleva la insignia <strong>«Base sitiada»</strong> en el mapa galáctico.</li>
            </ul>
            <p>Una vez levantado el asedio, los refuerzos regresan a casa y la base recupera una guarnición normal. Cada participante cobra entonces <strong>a prorrata de la firma destruida</strong>: 0,02 bitcoins por punto, más 1 punto de guerra por cada tramo de 5&nbsp;000 bitcoins ganados.</p>

            <h2 id="liberation">Liberar una base</h2>
            <p>Invadir con éxito una base de la colmena, incluidas las bases alien «Cthulhu I» a «V», aporta PDG y <strong>uranio</strong>, cargado en la flota victoriosa (prevé espacio en la bodega). La victoria tiene además dos efectos:</p>
            <ul>
                <li>tu <strong>amenaza personal se divide entre 10</strong>: es la forma más radical de hacerla bajar;</li>
                <li>la <strong>Amenaza del universo</strong> retrocede <strong>50 puntos</strong>, lo que retrasa la próxima profecía de Cthulhu (consulta el artículo <em>Las profecías de Cthulhu</em>).</li>
            </ul>
            <p>Un planeta así liberado queda <strong>protegido 72 horas</strong>: la colmena no puede ni recolonizarlo ni hacer erupción en él durante ese plazo.</p>
            <ul>
                <li>Si el planeta liberado era originalmente un planeta de jugador (capturado por la colmena, convertido tras una invasión perdida, abandonado, o nacido de una expansión o de una erupción), sigue siendo colonizable, y tu informe de liberación te da la fecha límite para enviar un colonizador.</li>
                <li>Los puestos avanzados de origen de la colmena («Cthulhu I» a «V»), en cambio, siguen siendo inexplotables una vez liberados: el planeta queda libre, pero no puedes enviar un colonizador, y no se anuncia ninguna fecha límite.</li>
            </ul>
            <p>A la inversa, perder una invasión contra una base de la colmena hace subir tu <strong>amenaza personal en 10 puntos</strong>.</p>

            <h2 id="expansion">Expansión y erupción</h2>
            <p>La colmena se extiende sola: cuando la <strong>Amenaza del universo</strong> alcanza <strong>300 puntos</strong>, una <strong>nube de esporas</strong> sale de una base existente cada <strong>3 días</strong> (cada día a partir de <strong>500</strong>) hacia un planeta deshabitado cercano a jugadores, hasta <strong>36 bases por galaxia</strong>. Es una flota como cualquier otra: <strong>interceptable en vuelo</strong>. Si llega, funda una nueva base con su guarnición, y los jugadores a <strong>5 sectores o menos</strong> reciben un informe.</p>
            <p>Erradicar <strong>todas</strong> las bases no la elimina para siempre: tras <strong>48 horas de silencio</strong>, una <strong>erupción</strong> hace resurgir una base en otro lugar, con un informe a los jugadores cercanos. Esta erupción nunca puede caer a <strong>menos de 8 sectores</strong> de un planeta de jugador, ni en un planeta que siga bajo su respiro de liberación: la colmena renace en el vacío, no en tus tierras. Si no hay ningún sector lo bastante aislado, la erupción se aplaza simplemente a la siguiente franja.</p>

            <h2 id="changement-difficulte">Cambiar de dificultad</h2>
            <p>Ajustas tu dificultad PvE en tus <strong>Preferencias</strong> (campo «Dificultad PvE»): <strong>Desactivado</strong>, Fácil, Normal o Difícil.</p>
            <ul>
                <li>En <strong>Desactivado</strong>, los Cthulhu ya no te atacan y el Tower Defense no está disponible.</li>
                <li>Si reactivas el PvE, el primer ataque llega 4 días después.</li>
                <li>Se aplica un <strong>plazo de 72&nbsp;h</strong> entre dos cambios: nada de idas y venidas para esquivar los grandes ataques.</li>
            </ul>

            <h2 id="tower-defense">El Tower Defense (TD)</h2>
            <p>El <strong>Tower Defense</strong> es un minijuego de defensa activa, en la página <strong>Cthulhu</strong>. Se puede jugar en cuanto hay un ataque programado contra ti o una horda ya en camino: puedes lanzarlo para aniquilarla antes de que cause daños. Es interactivo: colocas tus defensas en una cuadrícula y te enfrentas a oleadas de monstruos Cthulhu en tiempo real.</p>
            <p>Truco: para colocar varias defensas seguidas (unidades, muros, alambre de espino), <strong>mantén pulsado y arrastra</strong>. El trazo se bloquea automáticamente en <strong>línea recta</strong> (horizontal o vertical) y todas las casillas atravesadas se rellenan, sin huecos aunque vayas rápido.</p>
            <p>La partida se juega en tu dificultad <strong>PvE</strong> (ajustada en tus Preferencias). El <strong>tutorial</strong> es un entrenamiento: no aporta nada y no cuesta nada. Una vez lanzada la primera oleada, abandonar la partida cuenta como un <strong>abandono</strong> (derrota).</p>
            <p>Una <strong>niebla</strong> se desplaza por la arena, más densa alrededor de las grietas y cuando se acerca un jefe. Pasa por debajo de tus defensas y de los monstruos: no oculta nada. El botón <strong>Niebla</strong> del dock la corta si tu dispositivo va justo.</p>

            <h3>Resultado posible</h3>
            <ul>
                <li><strong>Victoria</strong>: la horda activa es destruida y el ataque anulado (si aún no había salido ninguna horda, la siguiente se retrasa 8 horas). Tu amenaza se divide entre 2. Ganas uranio, un sorteo de objeto (dos en Difícil) y un 2&nbsp;% de probabilidad de reclutar a un héroe secundario. Plazo de 6 horas antes de volver a hacer un TD.</li>
                <li><strong>Derrota</strong>: tu amenaza baja en proporción a las oleadas rechazadas (la mitad de las oleadas = amenaza dividida entre 2) y cobras un poco de uranio. Si la horda ya está en órbita de tu planeta, desembarca enseguida; si no, la colmena lanza inmediatamente su siguiente ataque. Sin plazo de espera antes de volver a jugar.</li>
                <li><strong>TD no jugado</strong>: la horda sigue su curso normal (concentración, vuelo, llegada, desembarco).</li>
            </ul>
            <p>Uranio ganado en caso de victoria: número de oleadas × (50 + amenaza ÷ 2), multiplicado por 0,4 en Fácil y por 3 en Difícil. En caso de derrota: oleadas rechazadas × (20 + amenaza ÷ 5), con los mismos multiplicadores. Ejemplo, con 100 de amenaza: victoria en Normal (13 oleadas) = 1&nbsp;300 de uranio; en Fácil (11 oleadas) = 440; en Difícil (15 oleadas) = 4&nbsp;500.</p>

            <h3>Informe de fin de partida</h3>
            <p>Al final de cada Tower Defense (victoria o derrota), se archiva un <strong>informe</strong> en la pestaña <strong>Cthulhu</strong> de tus informes: oleadas superadas, puntuación, uranio recolectado, reducción de amenaza, bajas por tipo de unidad y enemigos muertos por tipo. Práctico para comparar tus partidas.</p>

            <h3>Cómo se juega</h3>
            <ul>
                <li>La partida se juega en tu dificultad PvE (Fácil, Normal o Difícil): el botón «Jugar en …» te la recuerda. Solo el tutorial permite probar otra dificultad.</li>
                <li>Coloca tus unidades en la cuadrícula. El <strong>CG está en el centro</strong>; los monstruos emergen de <strong>1 a 4 grietas Cthulhu</strong> abiertas en el borde de la plataforma.</li>
                <li>Los monstruos atraviesan la cuadrícula para llegar a tu CG: atácalos por el camino.</li>
                <li><strong>Muros</strong> (150 en Fácil, 125 en Normal, 75 en Difícil): los monstruos los rodean. Cada grieta conserva siempre un camino hacia el CG (se rechaza un muro que la sellara). Las torres, en cambio, no bloquean el camino: un monstruo que tropieza con ellas se detiene y las destruye.</li>
                <li><strong>Alambre de espino</strong> (30 / 20 / 10 según la dificultad, investigación Alambre de espino requerida): no bloquea, pero hiere y ralentiza a los monstruos que lo atraviesan.</li>
                <li><strong>Colocación memorizada</strong>: tu disposición (torres, muros, alambre de espino) se guarda para cada servidor y se vuelve a proponer al inicio de cada partida.</li>
                <li>Las grandes oleadas llegan <strong>en grupos</strong> (hasta 20 monstruos simultáneos): una oleada termina de aparecer en unos 2 minutos.</li>
                <li><strong>Derrota inmediata</strong>: si todos los enemigos de una oleada atraviesan tus defensas y llegan al CG, la partida se pierde en el acto. Es imposible ganar sin colocar defensas eficaces.</li>
                <li>Entre oleadas, los trabajadores reparan automáticamente las torretas dañadas.</li>
                <li>Velocidad ajustable de ×1 a ×10, con pausa posible.</li>
                <li><strong>Encadenar oleadas</strong>: una opción de la barra superior lanza automáticamente la oleada siguiente en cuanto termina cada oleada, sin pasar por la preparación y conservando tu velocidad, hasta la victoria o la derrota. Desactívala durante una oleada para recuperar la pausa de preparación al final de esta. No disponible en el tutorial.</li>
                <li>El número de oleadas depende de tu amenaza: amenaza ÷ 10 (redondeado a la baja) + 3, con 2 oleadas menos en Fácil (2 como mínimo) y 2 más en Difícil, <strong>20 como máximo</strong>. Ejemplo: con 100 de amenaza, 13 oleadas en Normal. Las oleadas son cada vez más intensas.</li>
                <li><strong>Interfaz</strong>: una barra arriba, a todo lo ancho (puntos de vida del CG, contador de oleadas, puntuación, botón «Empezar», y a la derecha los iconos de sonido, música, info unidades, cuadrícula y encadenado de oleadas), y un panel «Unidades» a la derecha que presenta cada unidad (icono, nombre, existencias, características). Durante la partida, ni menú lateral ni pie de página: todo el ancho de la pantalla está dedicado al mapa.</li>
            </ul>

            <h3>Tus unidades para el TD</h3>
            <p>Tus defensas de planeta se convierten en unidades TD: cada unidad TD representa un paquete de unidades reales, y cada tipo tiene un máximo colocable para forzar la diversidad táctica.</p>
            <table>
                <thead>
                    <tr><th>Unidad de planeta</th><th>Unidades reales por 1 unidad TD</th><th>Máximo en la cuadrícula</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionario</td><td>20</td><td>200</td></tr>
                    <tr><td>Mecha</td><td>10</td><td>20</td></tr>
                    <tr><td>Lanzamisiles</td><td>1&nbsp;750</td><td>150</td></tr>
                    <tr><td>Torreta láser</td><td>1&nbsp;500</td><td>100</td></tr>
                    <tr><td>Torreta láser pesada</td><td>1&nbsp;250</td><td>75</td></tr>
                    <tr><td>Cañón de Gauss</td><td>1&nbsp;000</td><td>60</td></tr>
                    <tr><td>Artillería de iones</td><td>750</td><td>50</td></tr>
                    <tr><td>Lanzador de plasma</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Ejemplo: 2&nbsp;000 Legionarios dan 100 Legionarios TD. Además, el TD te presta <strong>defensas gratuitas</strong>: 8 de cada tipo en Fácil, 5 en Normal, ninguna en Difícil.</p>

            <h3>Los monstruos a los que te enfrentas</h3>
            <ul>
                <li><strong>Profundo</strong>: el monstruo básico. Nada excepcional, pero llegan en gran número.</li>
                <li><strong>Vigía</strong>: muy rápido pero frágil. Hay que interceptarlo pronto.</li>
                <li><strong>Shoggoth</strong>: lento, masivo, muy blindado. Difícil de abatir.</li>
                <li><strong>Estrella vampírica</strong>: dispara proyectiles a distancia contra tus defensas.</li>
                <li><strong>Flagelador mental</strong>: puede <strong>convertir a tus Legionarios en monstruos</strong> (efecto visual de conversión), como máximo uno por segundo, y ninguno más una vez herido de muerte.</li>
                <li><strong>Jefe Cthulhu</strong>: enorme, solo llega en la última oleada, en Normal si tu amenaza alcanza 40, en Difícil desde 20, nunca en Fácil. Invoca Profundos a su alrededor.</li>
            </ul>

            <h3>Mecánicas útiles que conviene conocer</h3>
            <ul>
                <li>Las unidades y los monstruos tienen <strong>tamaños distintos</strong> en la cuadrícula (Legionario 1×1, Mecha 2×1, torreta 2×2, Jefe 2×2).</li>
                <li>La <strong>barra de oleada</strong> muestra el número de enemigos restantes.</li>
                <li>Si actualizas la página, la partida <strong>se reanuda exactamente donde la dejaste</strong>.</li>
                <li>Una partida guardada debe <strong>reanudarse</strong> antes de empezar una nueva.</li>
            </ul>

            <h3>Recompensas y bajas</h3>
            <ul>
                <li><strong>Victoria</strong>: amenaza dividida entre 2, uranio, objetos y horda destruida.</li>
                <li><strong>Derrota</strong>: amenaza reducida según las oleadas rechazadas y un poco de uranio; si la horda ya está en órbita, desembarca enseguida.</li>
                <li><strong>Las bajas de unidades son reales</strong> más allá de las defensas gratuitas: una unidad TD destruida retira de tu planeta todas las unidades que representa (1 Legionario TD perdido = 20 Legionarios muertos de verdad).</li>
            </ul>

            <h3>Clasificación TD</h3>
            <p>Una clasificación por servidor guarda en memoria las <strong>mejores puntuaciones</strong> en el Tower Defense. Otro cuadro de caza por conquistar.</p>

    events:
        title: "Eventos especiales"
        category: "events"
        order: 3
        tags: "evento,calendario,ataque cthulhu,arena,alliance arena,long run,short run"
        summary: "En los servidores Long Run y Short Run, el Ataque Cthulhu y la Arena de alianza vuelven en fechas fijas: cuándo caen, qué cambian y cómo prepararse."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principe">Principio</h2>
            <p>En los servidores <strong>Long Run</strong> y <strong>Short Run</strong>, dos eventos vuelven en fechas fijas: el <strong>Ataque Cthulhu</strong> y la <strong>Arena de alianza</strong>. Su calendario se calcula de una vez por todas al abrir el servidor, sin azar: conociendo la fecha de apertura de tu servidor, puedes prever cada uno de ellos.</p>
            <p>No hay eventos de temporada (fiestas, estaciones del año).</p>
            <p>En los servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> y <strong>Short Run</strong>, la colmena también desencadena sus <strong>profecías</strong> y sus bloqueos. Esos no siguen un calendario fijo sino un indicador de amenaza: consulta el artículo <em>Las profecías de Cthulhu</em>.</p>

            <h2 id="liste">Los eventos del calendario</h2>
            <table>
                <thead>
                    <tr><th>Evento</th><th>Cuándo</th><th>Qué ocurre</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ataque Cthulhu</strong></td><td>72 horas, la primera vez 7 días después de la apertura del servidor, y después cada 21 días (días 7, 28, 49, 70…)</td><td>Único periodo en que los Cthulhu lanzan sus hordas contra tus planetas.</td></tr>
                    <tr><td><strong>Arena de alianza</strong></td><td>Cada 3 días a partir del día siguiente a la apertura: inscripciones a las 08:00, combates a las 19:00 (hora de París)</td><td>Torneo entre alianzas, sin ninguna pérdida real.</td></tr>
                </tbody>
            </table>

            <h3>Ataque Cthulhu</h3>
            <p>En un servidor Long Run o Short Run, los Cthulhu no lanzan ninguna horda fuera de estas ventanas de 72 horas. Durante la ventana, atacan como en un servidor Cthulhu, al ritmo de tu dificultad PvE:</p>
            <ul>
                <li>desde la apertura de la ventana, sale una horda contra ti si ha transcurrido tu plazo de ataque (5 días después de tu inscripción para la primerísima);</li>
                <li>la siguiente horda sale <strong>18 a 30 horas</strong> después en Fácil, <strong>12 a 24 horas</strong> en Normal, <strong>8 a 16 horas</strong> en Difícil;</li>
                <li>una horda lanzada durante la ventana llega hasta el final (6 horas de concentración, y luego el vuelo), incluso si llega después del fin del evento.</li>
            </ul>
            <p>En Normal, cuenta, pues, de 3 a 6 hordas por ventana. Mientras tanto, el <strong>Tower Defense</strong> de la página <strong>Cthulhu</strong> permite rechazar cada horda. Si tu PvE está desactivado en tus Preferencias, no te atacan. El funcionamiento de las hordas se detalla en el artículo <em>La amenaza Cthulhu</em>.</p>

            <h3>Arena de alianza</h3>
            <p>Una jornada de arena transcurre así (horas de París):</p>
            <ul>
                <li><strong>08:00</strong>: anuncio y apertura de las inscripciones.</li>
                <li><strong>18:45</strong>: cierre de las inscripciones.</li>
                <li><strong>19:00</strong>: primera ronda, y luego las siguientes a las 19:15 y 19:30; fin de los combates hacia las 19:45.</li>
            </ul>
            <p>Hay que ser miembro de una alianza y poseer al menos una nave de ataque. Tus naves se <strong>duplican</strong> para la arena: no arriesgas nada de lo que posees.</p>
            <p>Cada ronda alcanzada llena el <strong>banco de alianza</strong>: 50&nbsp;000 Bitcoins y 1&nbsp;000 PDG por una eliminación en la primera ronda, hasta 1&nbsp;000&nbsp;000 Bitcoins y 25&nbsp;000 PDG para la alianza campeona. Cada jugador que ha dado al menos una orden cobra además un bonus personal, de 5&nbsp;000 a 50&nbsp;000 Bitcoins por ronda alcanzada. Todo el detalle (inscripción, combate, puntos, recompensas) está en el artículo <em>Arena Alianza</em>.</p>

            <h2 id="ou">¿Dónde seguir los próximos eventos?</h2>
            <p>En el juego no hay una página de calendario. Para saber qué viene:</p>
            <ul>
                <li><strong>Arena de alianza</strong>: la pestaña <strong>Arena</strong> de tu página Alianza muestra la próxima arena con una cuenta atrás.</li>
                <li><strong>Ataque Cthulhu</strong>: cuenta desde la apertura del servidor (día 7, y después cada 21 días). La lista de servidores muestra el tiempo restante antes del final de cada servidor: en un Long Run (900 días), un servidor al que le quedan 880 días abrió hace 20 días, y su próximo Ataque Cthulhu empieza el día 28.</li>
                <li><strong>Profecías</strong>: el indicador «Amenaza del universo» de la página <strong>Cthulhu</strong>.</li>
            </ul>

            <h2 id="strategie">Cómo aprovecharlos</h2>
            <ul>
                <li><strong>Antes de cada Ataque Cthulhu</strong>, refuerza torretas, Legionarios y flota: es el único periodo en que las hordas golpean.</li>
                <li><strong>Durante la ventana</strong>, juega el Tower Defense: una victoria destruye la horda en curso y divide tu amenaza entre 2.</li>
                <li><strong>Inscríbete en la Arena de alianza</strong> con al menos una nave de ataque, y da al menos una orden durante el partido: no arriesgas nada y ganas un bonus personal.</li>
                <li><strong>Habla en la sala</strong>: un evento es una ocasión para coordinarte con tu alianza.</li>
            </ul>

    alliance_arena:
        title: "Arena Alianza"
        category: "events"
        order: 9
        tags: "alianza,arena,bracket,pvp,evento,torneo,sector,planeta,flota,base,historial,espectador"
        summary: "Evento recurrente cada 3 días: tu alianza se enfrenta a las demás en una batalla de sector (flotas duplicadas, planetas que mantener) para llenar el banco común y cobrar un bonus personal."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Cuándo empieza</h2>
            <p>El evento vuelve <strong>cada 3 días</strong> en los servidores afectados. Calendario de una jornada de arena (horas de París; la pestaña Arena las muestra en tu zona horaria):</p>
            <ul>
                <li><strong>08:00</strong>: anuncio en la sala Universo (en todos los idiomas) y <strong>apertura de las inscripciones</strong>, con una notificación a los miembros de alianza.</li>
                <li><strong>18:45</strong>: cierre de las inscripciones. La composición del cuadro queda fijada.</li>
                <li><strong>19:00</strong>: primera ronda. Las siguientes rondas salen a las <strong>19:15</strong> y a las <strong>19:30</strong>.</li>
                <li><strong>Hacia las 19:45</strong>: fin de los combates y reparto de las recompensas.</li>
            </ul>
            <p>Si hay menos de <strong>2 alianzas</strong> inscritas en todo el servidor a las 19:00, el evento se cancela y un mensaje en la sala Universo avisa a todo el mundo.</p>

            <h2 id="inscription">Inscribirse</h2>
            <p>Cuando se abren las inscripciones, se <strong>abre automáticamente una ventana</strong> en tu interfaz (botón «Inscribirme en la arena»). También puedes inscribirte desde la pestaña <strong>Arena</strong> de tu página Alianza.</p>
            <p>Condiciones:</p>
            <ul>
                <li>Ser miembro de una alianza.</li>
                <li>Tener al menos <strong>1 nave de ataque</strong> (en tierra o en flota) en el momento de la inscripción, y después al inicio de cada partido (19:00, 19:15, 19:30).</li>
                <li>La inscripción es <strong>gratuita</strong>: no cuesta ningún recurso, y nada de lo que posees se pone en juego.</li>
            </ul>
            <p>Puedes darte de baja («Darme de baja») hasta el cierre de las inscripciones, a las 18:45. Si ya no tienes ninguna nave de ataque al inicio de un partido (perdidas entretanto en combate real), quedas automáticamente declarado en forfait para ese partido: tu alianza continúa sin ti.</p>
            <p><strong>Comandantes IA</strong>: en cuanto hay un miembro humano inscrito, los comandantes IA de tu alianza también se inscriben, hasta que cuente con 5 inscritos, humanos incluidos. Los miembros humanos, en cambio, pueden inscribirse todos. Las alianzas enteramente IA también se inscriben para completar el cuadro.</p>

            <h2 id="combat">Cómo transcurre</h2>
            <p>Cada partido se juega en un <strong>sector creado para la ocasión</strong>, mostrado como el mapa espacial: una cuadrícula de 5 × 5 donde se enfrentan de <strong>2 a 4 alianzas</strong>. Cada alianza parte de su <strong>base</strong>, en medio de un borde del sector.</p>
            <p>Tus naves se <strong>duplican</strong> para la arena: nada de lo que posees corre riesgo. Ninguna baja real, ningún escombro, ningún héroe capturado.</p>
            <ul>
                <li>Un partido dura <strong>15 minutos</strong> como máximo.</li>
                <li>La primera alianza que llega a <strong>300 puntos</strong> gana; si no, gana la mejor puntuación al final del tiempo. En caso de empate: más planetas mantenidos, luego más daño infligido, y después un sorteo. Si nadie ha puntuado ni disparado, el partido es nulo y nadie pasa.</li>
                <li>Solo una alianza por sector pasa a la ronda siguiente. El cuadro es de eliminación directa, en 3 rondas como máximo; el vencedor del último partido es campeón del servidor.</li>
            </ul>

            <h2 id="flotte">Tu flota</h2>
            <p>Empiezas con <strong>una sola flota</strong>, formada por todas tus naves de ataque (las que están en tierra y las de tus flotas) y por tu héroe principal.</p>
            <ul>
                <li><strong>Enviar</strong>: elige tu flota, toca un planeta y después valida. La duración del vuelo se anuncia antes de la salida, y un vuelo no se cancela.</li>
                <li><strong>Dividir</strong>: separa una parte de tus naves en una flota nueva (4 flotas como máximo). Una flota vuela a la velocidad de su nave más lenta: una escuadra de cazas sola va tres veces más rápido que una flota que arrastra acorazados.</li>
                <li><strong>Reagrupar</strong>: dos de tus flotas en órbita del mismo planeta pueden fusionarse.</li>
            </ul>
            <p>Tu <strong>héroe principal</strong> presta sus bonus (incluidos los rasgos como Táctico) a tu flota de partida. Una flota separada parte sin él; si la reagrupas con la flota del héroe, este se queda con el conjunto. El héroe no arriesga nada: ni herida ni captura, incluso en caso de forfait.</p>
            <p>Cuando dos alianzas coinciden en el mismo planeta, el combate se resuelve <strong>5 segundos</strong> después (el tiempo de que lleguen refuerzos), con las <strong>mismas reglas que el combate espacial</strong> del juego. Una flota que ha entrado en combate ya no puede salir antes de que termine.</p>
            <p>Una flota destruida no se pierde: <strong>se reforma en tu base</strong>, con efectivo completo, tras 45 segundos, y luego 15 segundos más en cada nueva destrucción, 2 minutos como máximo. Cada flota enemiga destruida aporta <strong>5 puntos</strong> a tu alianza.</p>
            <p><strong>Los comandantes IA luchan de verdad</strong>: van a tomar los planetas libres, evitan los combates perdidos de antemano y vuelven a repararse. Si no abres la pantalla del partido y no das ninguna orden durante un minuto, el piloto automático juega también por ti; recuperas el control en cuanto vuelves.</p>

            <h2 id="planetes">Planetas y puntos</h2>
            <p>Una alianza <strong>sola</strong> en un planeta que no es suyo lo captura tras <strong>15 segundos</strong>; un enemigo que llega pone el contador a cero. El planeta <strong>sigue siendo de tu alianza</strong> cuando tus flotas se van, hasta que otra lo recupere. Ese es todo el dilema: desplegarse para puntuar, o agruparse para ganar los combates.</p>
            <p>Cada <strong>10 segundos</strong>, cada planeta mantenido aporta puntos:</p>
            <table>
                <thead>
                    <tr><th>Planeta</th><th>Puntos</th><th>Además</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mundo</strong> (4 por sector)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Astillero</strong></td><td>1</td><td>Repara tus flotas en órbita: 10&nbsp;% del efectivo en cada periodo.</td></tr>
                    <tr><td><strong>Nexo</strong> (en el centro)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Cada punto marcado por un planeta aporta también <strong>PDG al banco de tu alianza</strong> al final del partido: 3 PDG por punto en la ronda 1, 8 en la ronda 2, 15 en la ronda 3, ganes el partido o no. Los puntos de las flotas destruidas y de las bases saqueadas no aportan PDG.</p>

            <h2 id="bases">Las bases</h2>
            <p>Tu base es tu punto de partida y de reformación; tus flotas se reparan en ella (5&nbsp;% por periodo). No se captura, pero <strong>se saquea</strong>.</p>
            <p>Una base está defendida por las <strong>defensas planetarias de todos los planetas de los jugadores de la alianza implicados en el partido</strong>, puestas en común: es difícil de tomar. Un ataque rechazado igualmente la daña, y se repara un 10&nbsp;% por periodo.</p>
            <p>Si su defensa cae, la base es saqueada: <strong>50 puntos</strong> para el atacante, sus flotas vuelven de oficio a casa, y la base queda intocable durante 2 minutos.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Dos tipos de recompensas acumulables.</p>
            <h3 id="banque">Banco de alianza</h3>
            <table>
                <thead>
                    <tr><th>Ronda alcanzada</th><th>Bitcoins</th><th>PDG</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdedores ronda 1</td><td>50&nbsp;000</td><td>1&nbsp;000</td></tr>
                    <tr><td>Perdedores ronda 2</td><td>150&nbsp;000</td><td>3&nbsp;000</td></tr>
                    <tr><td>Perdedores ronda 3</td><td>350&nbsp;000</td><td>8&nbsp;000</td></tr>
                    <tr><td><strong>Campeón</strong></td><td><strong>1&nbsp;000&nbsp;000</strong></td><td><strong>25&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>El banco recibe una sola de estas recompensas, la de la ronda alcanzada, más los PDG de los planetas mantenidos durante los partidos.</p>
            <h3 id="perso">Bonus individual</h3>
            <p>Se ingresa directamente en tu cartera personal, siempre que hayas <strong>dado al menos una orden tú mismo</strong> durante uno de los partidos de la tarde: si el piloto automático lo ha jugado todo en tu lugar, no hay bonus.</p>
            <table>
                <thead>
                    <tr><th>Ronda alcanzada</th><th>Bitcoins personales</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdedores ronda 1</td><td>5&nbsp;000</td></tr>
                    <tr><td>Perdedores ronda 2</td><td>15&nbsp;000</td></tr>
                    <tr><td>Perdedores ronda 3</td><td>30&nbsp;000</td></tr>
                    <tr><td><strong>Campeón</strong></td><td><strong>50&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>Cobras <strong>un solo</strong> bonus por arena, el de la ronda más alta alcanzada por tu alianza: <strong>50&nbsp;000 Bitcoins</strong> para un campeón.</p>

            <h2 id="rapports">Informes de combate</h2>
            <p>Al final de cada partido, cada jugador recibe un <strong>informe</strong> en su página Informes: resultado, puntuación de tu alianza y de cada adversario, planetas mantenidos, bases saqueadas, tu daño infligido y recibido, las flotas enemigas destruidas por las tuyas y las que has perdido, tu efectivo restante, tu rango en daño entre los pilotos de tu alianza (con el título de <strong>«MVP del combate»</strong> para el primero) y los PDG ingresados en el banco.</p>
            <p>Al final del torneo, se añade un <strong>resumen personal</strong>: recorrido de tu alianza en el cuadro, balance de los partidos, tu contribución total y el detalle de tus ganancias (bonus personal, banco de alianza, planetas mantenidos).</p>

            <h2 id="suivi">Seguir el evento desde la pestaña Arena</h2>
            <p>La pestaña <strong>Arena</strong> de tu página Alianza muestra permanentemente el estado real del evento: ninguna arena en curso, próxima arena por venir (con una cuenta atrás hasta el anuncio), anunciada, inscripciones abiertas o cerradas, arena en curso, o terminada. Una cuenta atrás indica el tiempo restante antes de la siguiente etapa (cierre de las inscripciones, inicio de los combates, ronda siguiente), y un recuadro muestra cuántos miembros de tu alianza ya están inscritos sobre el efectivo total.</p>
            <p>Una vez terminada la arena, la pestaña conserva también el <strong>palmarés</strong> de tu alianza (número de arenas jugadas, títulos de campeón, mejor ronda alcanzada, balance de victorias/derrotas) y el historial de las diez últimas ediciones jugadas en tu servidor, con el resultado de tu alianza y las recompensas obtenidas en cada una.</p>

            <h2 id="spectateur">Modo espectador</h2>
            <p>¿No estás inscrito en la arena en curso? Aun así puedes seguir en directo los partidos de <strong>tu alianza</strong> desde la pestaña Arena: el sector se muestra exactamente como para un piloto, pero no puedes dar ninguna orden.</p>

            <h2 id="astuces">Consejos</h2>
            <ul>
                <li><strong>Toma el Nexo pronto</strong>: aporta tanto como tres mundos. Pero todo el mundo lo sabe.</li>
                <li><strong>Separa tus cazas</strong>: una escuadra rápida captura los mundos mientras tu flota pesada mantiene el centro.</li>
                <li><strong>Llegad agrupados</strong>: las flotas que llegan en los mismos 5 segundos combaten juntas; una flota aislada es destruida y regala 5 puntos.</li>
                <li><strong>Mantén un astillero</strong>: pasar por él repara tus flotas dos veces más rápido que en la base.</li>
                <li><strong>No acampes</strong>: un planeta capturado sigue siendo tuyo cuando te vas. Ve a tomar otro.</li>
                <li><strong>Una base se toma entre varios</strong>: atacar solo una base intacta es regalar puntos. Entre varios aliados, en la misma ventana de 5 segundos, son 50 puntos de golpe.</li>
                <li><strong>Da al menos una orden</strong>: sin una orden de tu mano, no hay bonus individual.</li>
            </ul>

            <h2 id="mobile">En móvil</h2>
            <p>La arena se juega con el dedo en móvil:</p>
            <ul>
                <li><strong>Orientación horizontal</strong> forzada al entrar en el partido en la aplicación móvil. En un navegador móvil, donde el juego no puede forzar la pantalla, un mensaje te invita a girar el dispositivo.</li>
                <li><strong>Todo el sector cabe en la pantalla</strong>: ni zoom ni cámara que gestionar.</li>
                <li><strong>Tres toques para una orden</strong>: tu flota (en la barra de abajo, o tocando su planeta), el planeta de destino y después el botón «Enviar».</li>
                <li><strong>El marco y el tag</strong> de cada planeta dicen de quién es; las cifras en sus esquinas dan las fuerzas en órbita, las tuyas en verde, las del enemigo en rojo.</li>
                <li><strong>Botón ⓘ</strong>: el detalle del planeta elegido y el registro de los combates.</li>
                <li><strong>Notificación</strong>: una alerta a la apertura de las inscripciones (08:00), con la hora límite y la hora de los combates.</li>
            </ul>

    ia_bots:
        title: "Comandantes IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,inteligencia artificial,pnj,piloto automático"
        summary: "Algunos servidores incluyen comandantes controlados por IA. Cómo se comportan, y por qué."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">¿Por qué IA?</h2>
            <p>En algunos servidores, unos cuantos comandantes no son jugadores humanos sino <strong>inteligencias artificiales</strong>. Permiten:</p>
            <ul>
                <li><strong>poblar el servidor</strong> cuando hay pocos jugadores activos;</li>
                <li>ofrecer <strong>objetivos interesantes</strong> a los jugadores que buscan combates;</li>
                <li>simular una diplomacia viva, con propuestas, traiciones y alianzas creíbles.</li>
            </ul>
            <p>No hay un número máximo fijado por las reglas: el equipo del juego elige cuántos comandantes IA coloca en cada servidor, y las cuentas de jugadores pasadas a piloto automático (ver más abajo) se suman a ellos. Ese número no se muestra en ningún sitio.</p>

            <h2 id="comportement">Cómo se comportan</h2>
            <p>Cada bot tiene:</p>
            <ul>
                <li>una <strong>personalidad</strong> (hablador, diplomático, agresivo, troll, veterano, silencioso…);</li>
                <li>un <strong>humor</strong> que evoluciona según los eventos (contento, desconfiado, frustrado, enfadado…);</li>
                <li>un <strong>arquetipo estratégico</strong> entre cinco: economista, equilibrado, conquistador, expansionista o defensivo.</li>
            </ul>
            <p>Juegan de verdad: construyen, investigan, atacan, forman alianzas, traicionan a veces. Pueden ser tus aliados o tus peores enemigos.</p>
            <p>Crecen <strong>cada día al ritmo de los jugadores activos</strong> del servidor (algo más rápido que la mediana), sin superar nunca el <strong>90&nbsp;% del mejor jugador</strong>. Lo que pierden en combate se pierde de verdad: si un jugador destruye su guarnición, no la reconstruyen en ese planeta durante <strong>7 días</strong> y refuerzan más bien sus torretas.</p>
            <p><strong>Dónde duerme su flota.</strong> Las IA conquistadoras y expansionistas mantienen una guarnición en órbita de sus planetas. Las demás (economistas, equilibradas y defensivas), más prudentes, mantienen sus naves <strong>en tierra</strong>, como muchos jugadores, y solo las sacan para defenderse&nbsp;: si su radar detecta una flota hostil que se acerca y pueden vencerla, ponen su flota en órbita y hacen venir las naves de sus planetas vecinos que llegan a tiempo&nbsp;; ante una flota demasiado fuerte, envían la suya a posarse en otro de sus planetas. También se unen a un combate ya iniciado sobre su planeta, o atacan a una flota armada estacionada en órbita, cuando pueden ganar. Como un jugador, una IA dormida no reacciona, y una flota enmascarada por un inhibidor la sorprende. Nunca dejan sus naves en tierra en un planeta sin torretas, que una invasión se llevaría con ellas&nbsp;: van a posarse en su planeta mejor defendido, que es también su primer refugio.</p>
            <p><strong>Su comercio.</strong> Venden sus excedentes y la carga de sus recicladores al comerciante más cercano, salvo si está bajo bloqueo o custodiado por una flota hostil en modo ataque, que destruiría su convoy a la llegada&nbsp;: entonces van al siguiente.</p>

            <h2 id="reconnaitre">¿Se les puede reconocer?</h2>
            <p>No con certeza. Los comandantes IA aparecen en la clasificación y en el mapa como jugadores, y nada en la interfaz los señala. El juego está diseñado para que no puedas saber con seguridad si un comandante es una IA.</p>

            <h2 id="strategie">Jugar con ellos</h2>
            <ul>
                <li>No subestimes a un bot: algunos son verdaderos terrores militares.</li>
                <li>Un bot puede perfectamente invitarte a una alianza, cooperar y luego atacarte si la situación cambia.</li>
                <li>En cuanto a la inmersión, trátalos como jugadores: hace el servidor más vivo.</li>
            </ul>

            <h2 id="pilote-automatique">Jugadores ausentes: el piloto automático</h2>
            <p>Si un jugador <strong>inscrito</strong> deja de conectarse durante <strong>8 días</strong>, su cuenta pasa a <strong>piloto automático</strong> (recibe un correo de recordatorio tras 7 días de ausencia; las cuentas de prueba no se ven afectadas): un bot <strong>mudo</strong>, que nunca escribe en las salas ni por mensaje privado. Este piloto automático <strong>no juega en su lugar</strong>: la cuenta no lanza ningún ataque, no mueve ni compromete tus flotas y no coloniza. Se limita a continuar tus construcciones e investigaciones y a reforzar lentamente tus torretas. Los demás comandantes IA no lo atacan; los demás jugadores, en cambio, siempre pueden. Siempre puedes escribirle un mensaje privado: lo leerá a su regreso. En cuanto el jugador vuelve a conectarse, recupera instantáneamente el control de su cuenta, y encuentra sus flotas donde las había dejado.</p>

    cthulhu_prophecies:
        title: "Las profecías de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,profecía,bloqueo,amenaza,evento,alianza,pdg,bitcoin,comerciante,reciclaje,clasificación"
        summary: "Cuando la amenaza del servidor alcanza su umbral, los Poseídos anuncian una profecía: 48 horas después, sus hordas bloquean el comercio de todo el servidor. Cómo leer el indicador, romper un bloqueo entre varios y lo que cuesta el fracaso."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">¿Qué es una profecía?</h2>
            <p>En los servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> y <strong>Short Run</strong>, un <strong>pool de amenaza</strong> propio del servidor, la «Amenaza del universo», sube automáticamente, día tras día. Es distinto de tu amenaza personal contra los Cthulhu.</p>
            <p>Cuando alcanza su umbral, los <strong>Poseídos</strong> publican una <strong>profecía</strong> en la sala pública: un <strong>bloqueo</strong> va a abatirse sobre todo el servidor <strong>48 horas</strong> más tarde.</p>

            <h2 id="jauge">Leer el indicador de amenaza del servidor</h2>
            <ul>
                <li>Es visible en la página <strong>Cthulhu</strong> (la del Tower Defense), en el bloque <strong>«Amenaza del universo»</strong>: una barra que va de 0 a <strong>700</strong>, el umbral que desencadena una profecía. Progresa independientemente de tus combates personales.</li>
                <li>Sube <strong>100 puntos por día</strong>, en el cambio de fecha (medianoche, hora de París). Partiendo de cero, alcanza el umbral en <strong>7 días</strong>. Para estimar el tiempo restante: (700 − nivel actual) ÷ 100 días. Ejemplo: con 400, la profecía cae dentro de 3 días.</li>
                <li>Cada base de la colmena liberada la hace retroceder <strong>50 puntos</strong>, es decir, medio día de respiro.</li>
                <li>El primer evento de un servidor no puede producirse antes de sus <strong>dos primeras semanas</strong> de existencia.</li>
                <li>Nunca dos profecías (ni dos bloqueos) a la vez en un mismo servidor. Durante el evento, el indicador puede seguir mostrando su progresión, pero se pone a cero al final: el ciclo siguiente parte de 0. Cuenta unos 11 días entre dos profecías (7 días de subida, 48 horas de espera, 48 horas de bloqueo como máximo).</li>
            </ul>

            <h2 id="prophetie">El anuncio</h2>
            <p>Al cruzar el umbral, los Poseídos publican su profecía en la sala pública: el bloqueo cae <strong>48 horas más tarde</strong>, y la página Cthulhu muestra la cuenta atrás. El mensaje, con la voz de los Poseídos, evoca lo que está en juego: el bloqueo del comercio, el diezmo sobre los Bitcoins, los restos devorados.</p>
            <p>Después, los Poseídos publican sin falta otros tres mensajes en la sala pública:</p>
            <ul>
                <li>al <strong>inicio del bloqueo</strong>: el número de hordas, el objetivo que destruir y el tiempo restante, recordando que las alianzas se clasifican;</li>
                <li><strong>6 horas antes del plazo</strong>: un recordatorio del tiempo restante y del número de hordas ya caídas sobre el objetivo;</li>
                <li>al <strong>desenlace</strong>: bloqueo roto o bloqueo mantenido, con el nombre de las alianzas recompensadas o castigadas.</li>
            </ul>
            <p>El Discord del juego también anuncia la profecía (con la fecha del bloqueo, en hora UTC), el inicio del bloqueo y su desenlace.</p>
            <p>Aparte de estos anuncios, los Poseídos comentan de vez en cuando la vida del servidor en la sala pública, pero esos mensajes no están garantizados: para seguir la amenaza, fíate del indicador.</p>

            <h2 id="blocus">El bloqueo</h2>
            <p>Al vencer el plazo, una <strong>horda Cthulhu</strong> (llamada «flota-muro» en la página Cthulhu) se coloca en órbita de <strong>cada comerciante</strong> y de <strong>cada asteroide</strong> del servidor:</p>
            <ul>
                <li><strong>Venta imposible</strong> a cualquier comerciante bloqueado.</li>
                <li><strong>Reciclaje imposible</strong> en cualquier asteroide bloqueado.</li>
                <li>En el resto del universo, los <strong>campos de ruinas siguen siendo reciclables con normalidad</strong>, como tras cualquier otro combate.</li>
                <li>En un objetivo bloqueado, en cambio, los <strong>restos de tus propios asaltos se acumulan allí y quedan fuera de alcance mientras la horda que lo guarda siga viva</strong>. Destrúyela y <strong>ese objetivo reabre al instante</strong>, sin esperar la suerte del bloqueo en el resto del servidor: la venta o el reciclaje se reanudan allí, y tus recicladores ya en órbita se ponen a ello solos.</li>
                <li>Nada que ver con el embargo o la hambruna que una flota enemiga impone a un planeta de jugador: aquí solo se detienen el comercio y el reciclaje.</li>
                <li>El bloqueo dura como máximo <strong>48 horas</strong>, menos si se rompe antes.</li>
            </ul>

            <h2 id="briser">Romper un bloqueo entre varios</h2>
            <p>No todas las hordas valen lo mismo:</p>
            <ul>
                <li>Las que guardan a los <strong>comerciantes</strong> valen <strong>1,8 veces</strong> la mayor flota del servidor (jugador o comandante IA). Nadie las rompe solo: hay que ponerse entre dos o tres.</li>
                <li>Las de los <strong>asteroides</strong> solo valen <strong>la mitad</strong> de esa mayor flota: una gran flota aislada puede vencerlas. Como los asteroides son mucho más numerosos que los comerciantes, ellas son las que hacen el grueso del contador.</li>
            </ul>
            <p>En cualquier caso, una <strong>coalición</strong> que golpea a la misma horda en asaltos sucesivos acaba con ella. Los daños que ha sufrido una horda <strong>no se regeneran nunca</strong> entre dos combates: cada asalto, incluso perdido, la debilita para el siguiente. Concentra tus golpes en el mismo objetivo en lugar de arañar varias hordas a la vez.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Cada punto de daño infligido a una horda se <strong>paga en Bitcoin y en Puntos de Guerra</strong> al final del evento, se rompa o no el bloqueo: ningún asalto se pierde en balde. Recibes 1 punto de guerra por cada tramo de 5&nbsp;000 Bitcoins ganados.</p>
            <p>El bloqueo se declara <strong>roto</strong> en cuanto <strong>el 70&nbsp;% de las hordas del servidor han sido destruidas antes del plazo</strong> (redondeado al alza), comerciantes y asteroides juntos. Ejemplo: de 160 hordas, hay que destruir 112.</p>
            <p>El bloqueo <strong>termina entonces de inmediato</strong>: las hordas restantes desaparecen, todos los comerciantes y asteroides reabren, y la tasa de recompensa se <strong>duplica</strong> para todos los contribuyentes.</p>
            <p>Un informe individual detalla tus daños infligidos y tu recompensa al final del evento. Durante el bloqueo, la <strong>página Cthulhu</strong> muestra la progresión en directo: hordas destruidas, objetivo por alcanzar y tiempo restante.</p>

            <h2 id="echec">El precio del fracaso</h2>
            <p>Si el bloqueo <strong>expira sin ser roto</strong>:</p>
            <ul>
                <li><strong>Cada jugador pierde la mitad de su Bitcoin</strong>: los Poseídos cobran su diezmo, incluso a los jugadores que han desactivado el PvE. Solo se libran los jugadores bajo <strong>protección de principiante</strong> y los jugadores en game over.</li>
                <li><strong>Todos los campos de ruinas de batalla del universo son devorados</strong> por los Cthulhu; los <strong>asteroides</strong>, en cambio, quedan intactos.</li>
                <li>El <strong>cofre de bitcoin de cada alianza</strong> que cuente con al menos un jugador humano también pierde la mitad de su contenido: depositar tu Bitcoin en el cofre antes del plazo no protege de nada. El descuento aparece en el historial del cofre.</li>
                <li>Las <strong>3 últimas alianzas de la clasificación</strong> pierden además producción durante 72 horas (ver más abajo).</li>
            </ul>
            <p>El diezmo se descuenta antes del pago de las recompensas: lo que ganas combatiendo a las hordas no se recorta. Cada jugador afectado recibe un informe que detalla el Bitcoin perdido.</p>

            <h2 id="classement">La clasificación de las alianzas</h2>
            <p>Durante el bloqueo, cada alianza se clasifica según lo que hace contra la colmena. La <strong>página Cthulhu</strong> muestra la clasificación en directo, con lo que tu alianza ganaría o perdería si el bloqueo terminara ahora.</p>
            <ul>
                <li><strong>Puntos</strong>: los daños infligidos a una <strong>flota-muro</strong> del bloqueo cuentan doble; los daños infligidos a la colmena en otros lugares (asedios de bases, hordas) cuentan simple; cada <strong>victoria en el Tower Defense</strong> vale tanto como destruir un cuarto de flota-muro de asteroide.</li>
                <li><strong>Puntos por miembro</strong>: la puntuación se divide entre el número de miembros activos (conectados en los últimos 7 días, sin contar protección de principiante). Los daños de un principiante cuentan igualmente: reclutar nunca hace bajar la puntuación.</li>
                <li><strong>Pertenencia fijada</strong> al inicio del bloqueo: cambiar de alianza durante el evento no desplaza ni los puntos, ni el bonus, ni la penalización.</li>
                <li>Hacen falta al menos <strong>2 miembros activos</strong> para ser clasificada. Los <strong>jugadores sin alianza</strong> nunca se ven afectados.</li>
            </ul>
            <p><strong>Bloqueo roto</strong>: las 3 primeras alianzas ganan <strong>+15&nbsp;%, +10&nbsp;% y +5&nbsp;% de producción</strong> durante 72 horas, siempre que hayan marcado puntos. Ninguna alianza es penalizada.</p>
            <p><strong>Bloqueo sufrido</strong>: las 3 últimas alianzas pierden <strong>15&nbsp;%, 10&nbsp;% y 5&nbsp;% de producción</strong> durante 72 horas, además del diezmo. Nunca se ve afectada más de la mitad de las alianzas clasificadas. Una alianza que ha hecho el esfuerzo mínimo se libra, incluso siendo la última: el equivalente a media flota-muro de asteroide destruida, o a dos victorias en el Tower Defense, por miembro activo.</p>
            <p>Cada miembro recibe un informe que explica el bonus o la penalización de su alianza y su fecha de fin.</p>

            <h2 id="conseils">En la práctica</h2>
            <ul>
                <li>Vigila el indicador <strong>«Amenaza del universo»</strong> de la página Cthulhu: a 100 puntos por día, te dice cuántos días quedan hasta el umbral de 700.</li>
                <li>En cuanto se anuncie una <strong>profecía</strong>, avisa a tu alianza: tienes <strong>48 horas</strong> para organizarte antes de que caiga el bloqueo.</li>
                <li>Concentra los asaltos en las mismas hordas en lugar de dispersarlos: los daños persisten, más vale acabar con una que arañar varias.</li>
                <li>Incluso un asalto perdido aporta algo: no esperes a estar seguro de ganar para atacar.</li>
                <li>¿No tienes flota suficiente para atacar una horda? Una <strong>victoria en el Tower Defense</strong> durante el bloqueo también aporta puntos a tu alianza.</li>
            </ul>

    notifications:
        title: "Notificaciones push"
        category: "beginner"
        order: 10
        tags: "notificación,push,alerta,móvil,android,navegador,preferencia,campana"
        summary: "Recibe una alerta en la aplicación Android o en tu navegador en cuanto ocurra un evento importante en tu imperio."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">¿Para qué sirve?</h2>
            <p>Area Universe se juega de forma continua: pueden llegar flotas enemigas mientras estás en el trabajo. Las <strong>notificaciones push</strong> te avisan en tiempo real en tu teléfono o en tu navegador, para que puedas reaccionar a tiempo.</p>

            <h2 id="evenements">Lo que puedes recibir</h2>
            <p>En la página Notificaciones, los tipos están organizados en cinco grupos:</p>
            <ul>
                <li><strong>Producción e Investigación</strong> — Investigación completada; Edificio completado (tu cola de construcción está vacía); Producción completada (tu cola de naves o de defensas está vacía).</li>
                <li><strong>Flotas</strong> — Flota llegada al destino; Flota en combate (una de tus flotas está metida en un combate); Flota enemiga aproximándose (se acaba de lanzar una flota hostil hacia uno de tus planetas).</li>
                <li><strong>Planetas</strong> — Planeta bajo ataque (llega una flota para saquear o invadir); Planeta bajo embargo; Ataque nuclear recibido; Ataque de Cthulhu; Espionaje detectado.</li>
                <li><strong>Alianza</strong> — Alianza en guerra; Mensaje de alianza.</li>
                <li><strong>Personal</strong> — Nuevo mensaje privado; Héroe capturado; Héroe liberado.</li>
            </ul>
            <p>Cada tipo se activa o se corta <strong>individualmente</strong>. Dos alertas no tienen interruptor propio: <strong>Planeta capturado</strong> se envía siempre, y el recordatorio <strong>Bonus de conexión disponible</strong> (una vez al día como máximo) solo se corta con <em>Desactivar todo</em>.</p>
            <p>«Flota enemiga aproximándose» ignora las flotas de tu alianza y las de una alianza con la que tengas una alianza defensiva, un pacto de no agresión o un acuerdo de paz.</p>

            <h2 id="activation">Cómo activarlas</h2>
            <ol>
                <li>Abre la página <strong>Notificaciones</strong>: icono de campana abajo del menú en ordenador; botón <strong>Menú</strong> y luego <strong>Notificaciones</strong> en teléfono.</li>
                <li>En un navegador, haz clic en <strong>Activar notificaciones</strong> (recuadro «Notificaciones del navegador»); en la aplicación Android, en <strong>Activar las notificaciones</strong> de la sección «Notificaciones de este dispositivo».</li>
                <li>Acepta la solicitud de autorización del navegador o del teléfono.</li>
                <li>Más abajo, desmarca los tipos que no quieras recibir: todos están activados al principio.</li>
            </ol>
            <p>Un botón <em>Desactivar todo</em> corta el conjunto con un clic. Tus elecciones por tipo valen para el servidor en el que juegas, en todos tus dispositivos.</p>
            <p>En un navegador, la opción <strong>Sonido de notificación</strong> reproduce además un sonido cuando llega algo nuevo mientras la pestaña está en segundo plano. Un banner también puede proponerte activar las notificaciones: <strong>Activar</strong> o <strong>No, gracias</strong>.</p>

            <h2 id="compatibilite">Dónde funciona</h2>
            <ul>
                <li><strong>Aplicación Android</strong> (Google Play): es la única aplicación; no existe para iPhone ni iPad.</li>
                <li><strong>Navegador en ordenador</strong>: Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone e iPad</strong>: el juego se juega en el navegador.</li>
                <li><strong>Varios dispositivos</strong>: cada dispositivo en el que hayas activado las notificaciones las recibe; si las has activado en tu teléfono y en tu ordenador, suenan los dos.</li>
            </ul>

            <h2 id="solucion-problemas">¿El navegador rechaza la inscripción?</h2>
            <p>Si tu navegador bloquea el servicio de notificaciones, la propia página Notificaciones muestra los pasos a seguir y un botón <strong>Reintentar</strong>.</p>
            <p>En <strong>Brave</strong>, el servicio push de Google está desactivado por defecto. Abre <code>brave://settings/privacy</code>, activa <strong>«Usar servicios de Google para la mensajería push»</strong> y reinicia por completo el navegador. En los demás navegadores, comprueba que una VPN, un antivirus o un DNS con filtrado no bloquee el servicio de notificaciones.</p>

            <h2 id="movil">En la aplicación móvil</h2>
            <p>En la aplicación Android, la página <strong>Notificaciones</strong> incluye una sección «Notificaciones de este dispositivo»: activa o desactiva en cualquier momento las notificaciones push del teléfono. Si están bloqueadas, el botón <strong>Abrir los ajustes</strong> te lleva directamente a los ajustes del teléfono. Tus elecciones por tipo de notificación valen para todos tus dispositivos, en el servidor en el que juegas.</p>

    glossary:
        title: "Glosario"
        category: "beginner"
        order: 11
        tags: "glosario,términos,definiciones,vocabulario,abreviaturas"
        summary: "Todos los términos y abreviaturas del juego, explicados en una frase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Todos los términos del juego</h2>
            <table>
                <tr><th>Término</th><th>Definición</th></tr>
                <tr><td><strong>Alianza</strong></td><td>Grupo de jugadores. Formar parte de una aumenta un 20&nbsp;% la producción de niobium, agua y raciones de tus planetas.</td></tr>
                <tr><td><strong>Barcaza</strong></td><td>Nave de desembarco de Legionarios para los saqueos e invasiones.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Moneda principal del juego. Generada por tus trabajadores.</td></tr>
                <tr><td><strong>Bloque</strong></td><td>Agrupación automática de flotas aliadas durante un combate espacial.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Campo De Recursos: los escombros dejados tras un combate, reciclables.</td></tr>
                <tr><td><strong>Astillero espacial</strong></td><td>Edificio que permite fabricar naves.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Las criaturas hostiles (antes "zombis"). Aparecen en modo PvE y en los planetas alien.</td></tr>
                <tr><td><strong>Ciclo</strong></td><td>Ritmo interno de producción. 10 min para un planeta, 1 min para una luna.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Nivel de alerta de alianza, de 0 (sin alerta) a 5 (alerta máxima): cuanto más alto es el número, más tensa es la situación.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Asedio de un planeta por una flota enemiga en órbita. Provoca una hambruna.</td></tr>
                <tr><td><strong>Mantenimiento</strong></td><td>Coste diario en Bitcoins de tus tropas, naves y edificios.</td></tr>
                <tr><td><strong>Fuerte defensivo</strong> (Búnker)</td><td>Edificio defensivo: aumenta la capacidad de Legionarios, permite construir Mechas y pone a salvo de los saqueos, por nivel, un 5&nbsp;% de tu capacidad de almacenamiento de niobium y agua (y un 5&nbsp;% de tu uranium).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fin de partida: bancarrota económica o pérdida de todos tus planetas.</td></tr>
                <tr><td><strong>Game Over económico</strong></td><td>Tu saldo de Bitcoins se ha vuelto negativo tras el informe diario.</td></tr>
                <tr><td><strong>Héroe</strong></td><td>Tu personaje principal (también puedes tener héroes secundarios). Evoluciona, combate y puede ser capturado.</td></tr>
                <tr><td><strong>Lunar</strong> (a veces llamado Moon Maker)</td><td>Nave que crea una luna en un emplazamiento vacío que contenga al menos 2 millones de niobium y 2 millones de agua en escombros.</td></tr>
                <tr><td><strong>Comerciante</strong></td><td>PNJ en el mapa que compra tus recursos a cambio de Bitcoins (y algunos Puntos de Guerra).</td></tr>
                <tr><td><strong>Nivel</strong></td><td>De 2 a 40, sube con tu experiencia, que crece con tu puntuación; nunca baja. Fija el mínimo del bono de conexión.</td></tr>
                <tr><td><strong>Objetivos</strong></td><td>Las 3 misiones diarias, renovadas con cada informe diario y pagadas en PDG; cumplirlas todas aporta además su recompensa media. Página del mismo nombre en el menú.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Puntos De Guerra. Se ganan sobre todo en combate (y con los objetivos diarios, la arena, la prisión, la venta a los comerciantes). Se gastan en la página Objetivos (Bitcoins, Legionarios, trabajadores), en naves de élite, la Ciudad flotante, la Estación orbital y la investigación Expansión territorial.</td></tr>
                <tr><td><strong>Piloto automático</strong></td><td>Modo silencioso que toma el relevo de una cuenta registrada ausente desde hace 8 días: continúa construcciones e investigaciones, no mueve ninguna flota y te devuelve el control en cuanto vuelves.</td></tr>
                <tr><td><strong>Planeta activo</strong></td><td>El planeta seleccionado en ese momento. Todas tus acciones se aplican a él.</td></tr>
                <tr><td><strong>PNJ</strong></td><td>Personaje No Jugador: comerciantes, aliens, Cthulhu, bots IA.</td></tr>
                <tr><td><strong>Saqueo (raid)</strong></td><td>Ataque terrestre para saquear los recursos de un planeta (no para conquistarlo).</td></tr>
                <tr><td><strong>Informe diario</strong></td><td>Balance diario calculado a las 18h59 (hora de París): ingresos, costes, saldo, actualización de los puntos y de la clasificación, nuevos objetivos del día.</td></tr>
                <tr><td><strong>Reciclador</strong></td><td>Nave que recoge los escombros (CDR): el reciclaje arranca solo cuando una flota con recicladores llega a un campo de escombros.</td></tr>
                <tr><td><strong>Ronda</strong></td><td>Turno de combate. Máx. 100 en combate espacial, máx. 10 en combate terrestre.</td></tr>
                <tr><td><strong>Firma</strong> (térmica)</td><td>Orden de magnitud de la masa de una flota, sin revelar su composición. Cuanto más grande es, más combustible cuesta un vuelo (pagado en Bitcoins); también sirve para calcular tus puntos y los Puntos de Guerra ganados en combate.</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Pequeña nave de espionaje. Envíala antes de cualquier ataque.</td></tr>
                <tr><td><strong>Terraformación</strong></td><td>Investigación que fija el número máximo de planetas que puedes poseer: su nivel + 2 (más los bonus de régimen de tu alianza), hasta el nivel 18. El nivel 1 desbloquea el colonizador, el nivel 15 el Lunar. Para ampliar un planeta, construye una Ciudad flotante o una Estación orbital (investigación Expansión territorial).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Minijuego de defensa activa contra las hordas Cthulhu.</td></tr>
                <tr><td><strong>Trabajador</strong></td><td>Unidad de población. Produce Bitcoins cada día. Defiende en invasión.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Recorrido guiado y recompensado (hasta 18 pasos en 5 capítulos, según la ruta elegida). Se lanza o se retoma desde la página Preferencias, sección Tutorial.</td></tr>
                <tr><td><strong>Nave nodriza</strong></td><td>Nave insignia pagada sobre todo en PDG: aporta a su flota 20&nbsp;000 de casco y 5&nbsp;000 de escudo, +5&nbsp;% de casco y de escudo, +10&nbsp;% de precisión y −10&nbsp;% de firma. Tan lenta como una nave de batalla, ralentiza una flota de cazadores o de corbetas.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Jugador designado como objetivo prioritario en modo Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Eliminar mi cuenta y mis datos"
        category: "beginner"
        order: 99
        tags: "eliminación,cuenta,datos,rgpd,privacidad,eliminar"
        summary: "Cómo eliminar definitivamente tu cuenta y tus datos personales, y qué conserva el juego."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Dónde hacer la solicitud</h2>
            <p>En el juego, abre <strong>Preferencias</strong>: abajo del todo, la <strong>Zona peligrosa</strong> ofrece el botón <strong>Eliminar mi cuenta</strong>.</p>
            <p>También puedes usar la página pública <strong>/suppression-donnees</strong> (enlace «Eliminación de cuenta y datos» del Reglamento). Resume lo que se elimina y lo que se conserva; después hay que iniciar sesión para hacer la solicitud.</p>
            <p>Para confirmar, escribe exactamente la palabra <strong>ELIMINAR</strong>, y después toca <strong>Eliminar definitivamente mi cuenta</strong>. La eliminación es <strong>inmediata</strong> y vale para tu cuenta en <strong>todos los servidores</strong>.</p>

            <h2 id="irreversible">Un abandono de cuenta definitivo</h2>
            <p><strong>Atención: es un abandono definitivo de la cuenta.</strong> Tus datos personales se eliminan o se anonimizan de inmediato:</p>
            <ul>
                <li>correo, contraseña y apodo;</li>
                <li>identificadores de Google, Discord o LinkedIn, vinculación con Google Play Juegos y dirección de cartera;</li>
                <li>dirección IP, huella técnica y zona horaria;</li>
                <li>sesiones, tokens de conexión y tokens de notificación;</li>
                <li>mensajes privados, enviados y recibidos;</li>
                <li>suscripciones al boletín y a las notificaciones.</li>
            </ul>
            <p>Tus logros se borran. Nunca más podrás volver a conectarte con esta cuenta, y ninguna función del juego permite recuperarla: para volver a jugar, tendrás que crear una cuenta nueva y empezar de cero.</p>
            <p>No se reembolsa ninguna compra en curso.</p>

            <h2 id="conserve">Lo que se conserva, y por qué</h2>
            <p>Para preservar el equilibrio del juego, tus comandantes, planetas y flotas siguen existiendo, confiados a un bot mudo. Tus comandantes, tus héroes y tus planetas se renombran «Bot-» seguido de un número, sin ningún vínculo con tu identidad; ese nombre sustituye también al tuyo en las clasificaciones y en los archivos de los servidores terminados.</p>
            <p>Los mensajes públicos escritos en las salas se conservan y aparecen a partir de ahora con ese nombre «Bot-…».</p>
            <p>El historial de pagos se conserva (obligación legal contable), también disociado de tu identidad.</p>

    achievements:
        title: "Logros"
        category: "progression"
        order: 11
        tags: "logros,achievements,trofeos,google play,play juegos,progresión"
        summary: "15 logros de cuenta, desde los primeros pasos hasta las hazañas de trayectoria, en tu perfil y en Google Play Juegos."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">El principio</h2>
            <p>Los <strong>logros</strong> recompensan lo que consigues con tu cuenta, <strong>en todos los servidores</strong>. Una vez desbloqueado, un logro lo es para siempre, aunque después pierdas el planeta o abandones la alianza que te lo valió.</p>
            <p>Encuéntralos en tu <strong>perfil entre servidores</strong> (menú «Mi perfil entre servidores»), con tu progresión y la fecha de cada desbloqueo. El perfil de otro jugador muestra los suyos. Los que tu historial ya ha merecido se desbloquean de oficio.</p>
            <h2 id="liste">Los 15 logros</h2>
            <table>
            <tr><th>Logro</th><th>Condición</th><th>Puntos</th></tr>
            <tr><td>Comandante</td><td>Terminar el tutorial siguiéndolo (saltarlo con «Lo descubro solo» no cuenta)</td><td>20</td></tr>
            <tr><td>Constructor</td><td>Terminar una primera construcción</td><td>20</td></tr>
            <tr><td>Sabio</td><td>Terminar una primera investigación</td><td>20</td></tr>
            <tr><td>Colono</td><td>Poseer 2 planetas</td><td>20</td></tr>
            <tr><td>Aliado</td><td>Unirte a una alianza o fundar una</td><td>20</td></tr>
            <tr><td>Veterano I, II, III</td><td>Librar 10, 100 y después 1 000 batallas espaciales</td><td>25, 50, 100</td></tr>
            <tr><td>Conquistador I, II</td><td>Lograr 10 y después 100 invasiones</td><td>50, 100</td></tr>
            <tr><td>Carcelero</td><td>Capturar a un héroe enemigo</td><td>50</td></tr>
            <tr><td>Cazador de Cthulhu</td><td>Ganar una partida de Tower Defense</td><td>50</td></tr>
            <tr><td>Élite</td><td>Terminar en el top 10 de un servidor</td><td>100</td></tr>
            <tr><td>Emperador</td><td>Ganar un servidor</td><td>200</td></tr>
            <tr><td>Un logro oculto</td><td>Por descubrir jugando</td><td>50</td></tr>
            </table>
            <p>«Sabio» no se puede ganar en los servidores donde todas las investigaciones están desbloqueadas desde el principio. Una luna cuenta como un planeta para «Colono».</p>

            <h2 id="progression">La progresión</h2>
            <p>Los logros de batallas y de invasiones avanzan por escalones, y tu perfil muestra el contador (por ejemplo 37 / 100). Cuentan todas las batallas espaciales libradas, ganadas o perdidas, incluida la destrucción de una flota sin armas (Cargos, recicladores, sondas), para los dos bandos; las invasiones cuentan cuando se logran (los raids no cuentan). Élite y Emperador se deciden al final de un servidor.</p>
            <h2 id="google-play">Google Play Juegos (Android)</h2>
            <p>En la aplicación Android, tus logros también aparecen en <strong>Google Play Juegos</strong>, con el banner «Logro desbloqueado».</p>
            <ul>
            <li><strong>Cuenta de prueba</strong> creada en la aplicación: se vincula automáticamente a tu perfil de Google Play Juegos. Entonces ya no se elimina tras 7 días sin jugar, y se reabre sola tras una reinstalación o en un teléfono nuevo.</li>
            <li><strong>Cuenta registrada</strong>: en la aplicación Android, abre tu perfil entre servidores (menú «Mi perfil entre servidores») y toca «Vincular esta cuenta» en la tarjeta «Google Play Juegos». A partir de entonces se abrirá sin contraseña con ese perfil de Google Play Juegos: hazlo solo en tu propio dispositivo. Puedes desvincularla en cualquier momento desde la misma tarjeta, tanto en el sitio web como en la aplicación.</li>
            <li>El botón <strong>«Play Juegos»</strong> de la pantalla de conexión reabre la cuenta vinculada. Cerrar sesión corta la apertura automática en ese dispositivo: entonces es ese botón el que reabre la cuenta.</li>
            </ul>
            <p>Un perfil de Google Play Juegos solo se vincula a una cuenta de Area, y una cuenta solo a un perfil. Vincular tu cuenta desde tu perfil le quita el perfil de Google Play Juegos a la otra cuenta a la que estuviera vinculado, si la había.</p>
    faq:
        title: "Preguntas frecuentes: cuenta, dispositivos y ayuda"
        category: "beginner"
        order: 13
        tags: "faq,cuenta,varios servidores,multicuenta,sin conexión,android,iphone,consola,idioma,español,apodo,contacto,soporte,bug,compra,reembolso,eliminación,informes"
        summary: "Varios servidores, juego sin conexión, dispositivos, idiomas, apodo, contacto, bugs, compras: las respuestas a las preguntas prácticas."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Jugar en varios servidores</h2>
            <p>Sí. Tu cuenta te sigue en todos los servidores. En cada servidor al que te unes, tienes un <strong>comandante distinto</strong>, con su propio apodo, sus planetas, sus héroes, sus Bitcoins, su alianza y su clasificación: nada pasa de un servidor a otro.</p>
            <p>Puedes jugar en varios servidores a la vez y pasar de uno a otro con la entrada <strong>Servidor</strong> del menú: los servidores en los que ya juegas se abren directamente.</p>
            <p>Lo que es común a todos tus servidores: tu <strong>perfil entre servidores</strong> (menú «Mi perfil entre servidores»), que acumula tu trayectoria y tus logros, tu idioma y tu lista de jugadores bloqueados.</p>
            <p>Varias cuentas en un mismo servidor: el Reglamento (sección «Cuentas múltiples») las autoriza siempre que las declares por correo a <strong>support@areauniverse.com</strong>. Estas cuentas no deben interactuar directamente entre sí, ni por medio de un tercero. Compartir tus credenciales de conexión con otra persona está prohibido.</p>

            <h2 id="hors-ligne">Jugar sin conexión</h2>
            <p>No: Area Universe se juega en línea y requiere una conexión a Internet, tanto en la aplicación como en el navegador. Si se corta la conexión, el juego muestra «Reconectando…» y se reanuda en cuanto vuelve.</p>
            <p>En cambio, la partida continúa sin ti: tus planetas producen hasta su límite de almacenamiento, tus construcciones, investigaciones y flotas avanzan… y tus adversarios pueden atacarte. Activa las <a href="/wiki/notifications">notificaciones push</a> para que te avisen.</p>
            <ul>
                <li>Tras <strong>8 días</strong> sin conectarte, tu comandante pasa a <a href="/wiki/ia_bots">piloto automático</a>.</li>
                <li>Una <strong>cuenta de prueba</strong> (creada con «Probar sin email») se elimina tras <strong>7 días</strong> sin jugar, salvo si está vinculada a Google Play Juegos en la aplicación Android. Para conservarla, valídala desde la entrada <strong>Validar cuenta</strong> del menú.</li>
            </ul>

            <h2 id="plateformes">¿En qué dispositivos jugar?</h2>
            <ul>
                <li><strong>Ordenador</strong>: en un navegador reciente (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong>: en la aplicación Area Universe de Google Play. Un navegador Android es redirigido a Google Play cuando quiere entrar en el juego. La aplicación se juega en horizontal.</li>
                <li><strong>iPhone e iPad</strong>: no existe aplicación; juega en el navegador.</li>
                <li><strong>Consolas</strong> (PlayStation, Xbox, Switch…): no existe ninguna versión para consola.</li>
            </ul>
            <p>Tu cuenta es la misma en todas partes: conéctate con las mismas credenciales para recuperar tu partida en otro dispositivo.</p>

            <h2 id="langues">Idiomas disponibles</h2>
            <p>El juego existe en <strong>seis idiomas</strong>: francés, inglés, alemán, español, portugués y ruso. Este wiki también.</p>
            <p>Para cambiar de idioma: en ordenador, toca la bandera de la parte inferior del menú; en teléfono, abre el botón <strong>Menú</strong> y luego elige una bandera en la línea <strong>Idioma</strong>. Tu elección se guarda en tu cuenta: tus notificaciones push también llegan en ese idioma.</p>

            <h2 id="pseudo">Cambiar de apodo</h2>
            <p>Tu apodo es el de tu comandante: es <strong>propio de cada servidor</strong>. Para cambiarlo, abre <strong>Preferencias</strong>, sección <strong>Identidad</strong>, campo <strong>Pseudónimo</strong> (3 a 15 caracteres; la primera letra se pone en mayúscula), y después <strong>Guardar</strong>. El cambio es inmediato y posible en cualquier momento, siempre que ese apodo no esté ya cogido en el servidor. Hay que haber creado tu héroe para poder guardar.</p>
            <p>Tu identificador de conexión, en cambio, es tu dirección de correo. Se cambia en <strong>Opciones</strong> (página «Mis opciones», Cambiar el email): se envía un enlace de confirmación a la nueva dirección, y la antigua sigue activa mientras no hayas hecho clic en él. La contraseña se cambia en el mismo sitio.</p>

            <h2 id="contact">Contactar con el equipo</h2>
            <ul>
                <li><strong>Por correo</strong>: <strong>support@areauniverse.com</strong>, para una pregunta de cuenta, de pago o de datos personales.</li>
                <li><strong>En Discord</strong>: el servidor comunitario de Area Universe (discord.gg/bpwWyS8), cuyo enlace figura al pie de las páginas del sitio, junto a Facebook, Telegram y LinkedIn.</li>
                <li><strong>Para un bug</strong>: usa de preferencia el botón <strong>Error</strong> del juego (ver más abajo); tu informe llega directamente al equipo, con la página en la que estabas.</li>
            </ul>

            <h2 id="bug">Informar de un bug</h2>
            <p>Toca el botón <strong>Error</strong> (icono de insecto): en la parte inferior del menú en ordenador; en teléfono, botón <strong>Menú</strong> y luego <strong>Error</strong>. En la ventana <strong>Informar de un error</strong>:</p>
            <ol>
                <li>describe lo que ha pasado y lo que estabas haciendo (2&nbsp;000 caracteres como máximo);</li>
                <li>adjunta si es posible una imagen (JPEG, PNG o WebP, 5&nbsp;MB como máximo); en la aplicación, el botón <strong>Capturar pantalla</strong> lo hace por ti;</li>
                <li>toca <strong>Enviar</strong>.</li>
            </ol>
            <p>La página en la que estabas y el tipo de dispositivo se adjuntan automáticamente. Puedes enviar hasta 10 informes al día. Para un jugador que hace trampas o insulta, usa más bien la <a href="/wiki/moderation_blocking">denuncia</a>.</p>

            <h2 id="achats">Compras y reembolsos</h2>
            <p>El juego es gratuito. La única compra que se ofrece hoy es el acceso a un <strong>Paid Server</strong> (servidor competitivo de pago): <strong>5&nbsp;€</strong>, pagados una sola vez por servidor, con tarjeta bancaria, antes de entrar en él; hace falta una cuenta validada. Los <strong>Bitcoins</strong> del juego no se compran con dinero real: solo se ganan jugando. Las notificaciones push son gratuitas.</p>
            <p>Para un problema de pago (pago cobrado pero acceso no desbloqueado, solicitud de reembolso), escribe a <strong>support@areauniverse.com</strong> indicando el correo de tu cuenta, el servidor afectado y la fecha del pago. Las condiciones de uso prevén que no se concede ningún reembolso una vez usado el servicio de pago, salvo derecho de desistimiento o caso excepcional examinado por el soporte. Eliminar tu cuenta no reembolsa ninguna compra en curso.</p>

            <h2 id="compte-supprime">Recuperar una cuenta eliminada</h2>
            <p>Ninguna función del juego permite recuperar una cuenta eliminada: la <a href="/wiki/account_deletion">eliminación de cuenta</a> es definitiva y tus datos personales se borran en el acto. Para volver a jugar, crea una cuenta nueva. Si crees que ha habido un error, escribe a <strong>support@areauniverse.com</strong>.</p>
            <p>Una cuenta de prueba eliminada por no haber jugado durante 7 días tampoco se puede recuperar.</p>
            <p>¿Solo has olvidado tu contraseña? En la pantalla de conexión, toca el icono de llave (<strong>Contraseña olvidada</strong>) e introduce tu correo: se te envía un enlace de restablecimiento.</p>

            <h2 id="rapports">Eliminar o archivar informes</h2>
            <p>En la página <strong>Informe</strong>, abre un informe y toca <strong>Eliminar</strong>: desaparece al instante, sin confirmación ni papelera. La eliminación se hace de un informe en un informe; no hay ni archivo ni eliminación en bloque. Para limpiar los no leídos, <strong>Marcar todo como leído</strong> trata todos tus informes de golpe. Los informes no se borran solos con el tiempo.</p>
            <p>Los mensajes privados de la <strong>Mensajería</strong>, en cambio, no se pueden eliminar.</p>

