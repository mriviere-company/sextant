                <tbody>
                    <tr><td>Утилитарные корабли (3)</td><td>Ур. 1: Терраформирование. Ур. 2: Управление грузами. Ур. 3: Планетарное вторжение, Орбитальная переработка и Материнский корабль.</td><td>—</td><td>2&nbsp;500; 3 мин 20 с</td></tr>
                    <tr><td>Терраформирование (18)</td><td><strong>+1 планета, которой можно владеть, за уровень</strong> (всего 2 + уровень, плюс бонусы политического строя). Ур. 1: Колонизационный корабль. Ур. 15: Лунар.</td><td>Утилитарные корабли 1</td><td>12&nbsp;000; 1 ч 10 мин</td></tr>
                    <tr><td>Управление грузами (5)</td><td>Карго I (ур. 1), Карго V (ур. 3), Карго X (ур. 5). Ур. 1: Склад Niobium, Резервуар воды, Сельскохозяйственный силос (с Аэропоникой).</td><td>Утилитарные корабли 2</td><td>3&nbsp;500; 6 мин 40 с</td></tr>
                    <tr><td>Планетарное вторжение (1)</td><td>Десантная баржа.</td><td>Утилитарные корабли 3</td><td>35&nbsp;000; 4 мин 40 с</td></tr>
                    <tr><td>Орбитальная переработка (1)</td><td>Переработчик.</td><td>Утилитарные корабли 3</td><td>16&nbsp;900; 6 мин 40 с</td></tr>
                    <tr><td>Сканер системы (5)</td><td>Наземный радар (ур. 1), Космический радар и радарный корабль (ур. 3), Глушитель радара и корабль-глушитель (ур. 5).</td><td>—</td><td>2&nbsp;300; 5 мин</td></tr>
                    <tr><td>Шпионаж (999)</td><td>Зонд приносит сведения, только если Ваш уровень Шпионажа не меньше уровня владельца зондируемой планеты.</td><td>Сканер системы 5</td><td>20&nbsp;000; 1 ч</td></tr>
                    <tr><td>Технология гиперпространства (1)</td><td>Путешествовать в другие галактики.</td><td>—</td><td>25&nbsp;000&nbsp;000; 25 ч</td></tr>
                </tbody>
            </table>

            <h3>Планетарные</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Что даёт</th><th>Требования</th><th>Уровень 1</th></tr>
