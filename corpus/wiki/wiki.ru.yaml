            <p>Улучшение альянса «Стоимость строительства» снижает стоимость в ниобии, воде и уране (−1&nbsp;% за уровень, до −5&nbsp;%), а каждый уровень Лагеря рабов сокращает длительность на 1,5&nbsp;%. Ежедневное содержание каждого здания подробно описано в статье <a href="/wiki/bitcoin_economy#bareme">Биткойны и содержание</a>.</p>

            <h2 id="file-production">Управление очередью производства</h2>
            <p>Строительство зданий, кораблей (Космическая верфь) и обороны проходит через <strong>очередь ожидания</strong>, которой Вы можете управлять:</p>
            <ul>
                <li><strong>Переупорядочивать</strong> элементы в ожидании (перетаскиванием), чтобы расставить приоритеты.</li>
                <li><strong>Отменять</strong> элемент в ожидании: Вам <strong>возвращается пропорциональная доля</strong> того, что ещё не произведено (здание в ожидании возвращается целиком).</li>
                <li>Стоимость здания списывается сразу при добавлении в очередь.</li>
                <li>Текущая очередь отображается вверху каждой страницы производства, под заголовком.</li>
                <li>Очередь ограничена <strong>15 элементами в ожидании</strong> (не считая текущего строительства): сверх этого сообщение предложит дождаться окончания одной постройки или отменить одну, прежде чем добавлять новую.</li>
                <li><strong>Плавучий город</strong> (+10&nbsp;земли/уровень) и <strong>Орбитальная станция</strong> (+5&nbsp;неба/уровень) ограничены <strong>5 экземплярами на планету</strong> каждый.</li>
            </ul>

