            <h3>Скорость, сигнатура и трюм</h3>
            <p>Скорость указана в люменах, как в карточке корабля (чем выше, тем быстрее). Столбец «Полёт» даёт время полёта на единицу расстояния на сервере со скоростью ×1 (ускоренный сервер сокращает эти значения); флот летит в темпе самого медленного корабля. Сигнатура влияет на топливо и на то, что видят вражеские радары.</p>
