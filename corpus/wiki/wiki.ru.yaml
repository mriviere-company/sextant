articles:
    moderation_blocking:
        title: "Модерация: жалобы и блокировка"
        category: "beginner"
        order: 12
        tags: "модерация,жалоба,блокировка,салон,сообщения,условия,санкция"
        summary: "Пожалуйтесь на оскорбительное сообщение, заблокируйте нежелательного игрока, узнайте, что делает модерация, и найдите правила, которые каждый принимает при первом входе."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="usloviya">Условия использования</h2>
            <p>При первом входе каждый игрок принимает <strong>условия использования</strong> и правила сообщества: уважение к другим игрокам (никакой травли, оскорблений и разжигания ненависти), никакого незаконного, непристойного или клеветнического содержимого в салонах, сообщениях и именах, никакого читерства, злоупотребления мультиаккаунтами и использования багов. Отказ приводит к выходу из аккаунта. Если условия изменятся, их придётся принять заново.</p>

            <h2 id="zhaloba">Пожаловаться на сообщение</h2>
            <p>Каждое сообщение другого игрока в салонах и каждое полученное личное сообщение (кроме отправленных анонимно) имеет значок <strong>флажка</strong>. Щелчок открывает выбор причины: <strong>Оскорбления / Преследование</strong>, <strong>Спам</strong> или <strong>Другой неприемлемый контент</strong>. Жалоба уходит команде модерации вместе с копией сообщения.</p>
            <p>На игрока можно также пожаловаться из его профиля, кнопка <strong>Пожаловаться</strong>: Мульти-аккаунт, Оскорбления / Преследование, Читерство, Спам или Другое.</p>
            <p>Ограничения: <strong>три жалобы в день</strong> (счётчик обнуляется в полночь по времени Парижа) и <strong>только одна жалоба на игрока, раз и навсегда</strong>, будь то через флажок или через профиль. Сверх этого игра показывает «Вы уже пожаловались на этого игрока или достигли дневного лимита».</p>

            <h2 id="moderation">Что делает модерация</h2>
            <p>Жалоба не вызывает никаких автоматических санкций: каждую рассматривает команда модерации, которая видит и то, кто её отправил. Поэтому множество жалоб на игрока ещё не означает, что его накажут, а ложная жалоба не оказывает прямого действия на того, на кого она направлена.</p>
            <p>В зависимости от тяжести модерация может запретить игроку на определённый срок писать в салонах и в личных сообщениях либо заблокировать его аккаунт.</p>

            <h2 id="blokirovka">Заблокировать игрока</h2>
            <p>Кнопка <strong>Заблокировать</strong> в профиле игрока мгновенно скрывает все его сообщения в чатах и исключает любой обмен личными сообщениями в обе стороны. Блокировка направлена на его аккаунт: она действует на всех серверах, где Вы с ним пересекаетесь.</p>
            <p>Список заблокированных игроков ведётся в разделе <strong>Настройки</strong> (раздел «Заблокированные игроки»): каждого игрока там можно в любой момент разблокировать кнопкой <strong>Разблокировать</strong>.</p>
    getting_started:
        title: "Первые шаги"
        category: "beginner"
        order: 1
        tags: "начало,старт,новичок,обучение,руководство,гайд"
        summary: "Добро пожаловать! Самое краткое руководство, чтобы понять Area Universe и успешно провести первые часы игры."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">Что такое Area Universe?</h2>
            <p>Area Universe — это <strong>многопользовательская космическая стратегия</strong>. Вы управляете империей: Ваши планеты производят ресурсы, Ваши корабли бороздят галактику, а альянсы решают судьбы игроков.</p>
            <p>Это игра, <strong>рассчитанная на длительный срок</strong>: Ваши ресурсы накапливаются, даже когда Вы не в сети. Нескольких минут в день достаточно, чтобы прогрессировать.</p>

            <h2 id="objectif">Ваша цель</h2>
            <p>В зависимости от выбранного режима сервера (см. статью <em>Режимы игры</em>) конечная цель меняется: продержаться дольше всех, занять первое место в рейтинге, остаться последним выжившим и т. д. Но рецепт всегда один и тот же:</p>
            <ol>
                <li><strong>Наладить экономику</strong> (ресурсы + валюта).</li>
                <li><strong>Построить флот и оборону</strong>.</li>
                <li><strong>Объединиться в союз</strong>, чтобы обрести вес сообща.</li>
            </ol>

            <h2 id="premieres-actions">Ваши 6 первых действий</h2>
            <p>Ваша стартовая планета не пуста: на ней уже есть Шахта Niobium и Экстрактор воды 3-го уровня, Космическая верфь, Наземный радар и небольшой флот на земле (10 зондов, 5 истребителей, 2 фрегата и 1 колонизатор).</p>
            <ol>
                <li><strong>Улучшайте Шахту Niobium и Экстрактор воды</strong> (страница <em>Инфраструктура</em>).</li>
                <li><strong>Добавьте Сельскохозяйственное поле</strong>: Ваши рабочие едят рационы (еда в игре).</li>
                <li><strong>Исследуйте Городскую перестройку, затем постройте Большой город</strong>: +25&nbsp;000 рабочих максимум за уровень. Рабочие — Ваши поставщики <em>Биткойнов</em> (валюты игры).</li>
                <li><strong>Постройте Исследовательский центр</strong>: в нём живут Ваши учёные, которые ступенчато повышают скорость Ваших исследований (см. <em>Рабочие и учёные</em>).</li>
                <li><strong>Отправьте грузовые корабли продать излишки</strong> ниобия и воды торговцу: на <em>Космической карте</em> нажмите на торговца, затем <em>Взаимодействие</em>, выберите свой флот грузовых кораблей и миссию <em>Разгрузить и вернуться</em>. Для Карго I нужно исследование <em>Управление грузами</em>.</li>
                <li><strong>Вступите в альянс</strong>: <strong>+20&nbsp;%</strong> к производству ниобия, воды и рационов на всех Ваших планетах и доступ к исследованиям альянса.</li>
            </ol>
            <p>Не забудьте также <strong>колонизировать 2-ю планету</strong> стартовым колонизатором: для этого не нужно никаких исследований (см. статью <em>Колонизировать новую планету</em>).</p>

            <h2 id="tutoriel">Встроенное обучение</h2>
            <p><strong>Интерактивное обучение</strong> проведёт Вас шаг за шагом и состоит из 5 глав: Первые шаги, Военная мощь, Исследовать и покорять, Развитие экономики, Дипломатия и сообщество. При первом входе в игру Вы выбираете свой путь:</p>
            <table>
                <thead>
                    <tr><th>Путь</th><th>Шаги</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Полное открытие</strong></td><td>18</td></tr>
                    <tr><td><strong>Сбалансированный путь</strong></td><td>17 (без напоминания о клике по планете)</td></tr>
                    <tr><td><strong>Прямо к сути</strong></td><td>8 (только то, что свойственно Area Universe)</td></tr>
                    <tr><td><strong>Разберусь сам</strong></td><td>нет</td></tr>
                </tbody>
            </table>
            <p>Этапы по главам (* = этапы пути <em>Прямо к сути</em>):</p>
            <ol>
                <li><strong>Первые шаги</strong>: Ваши ресурсы*, Защита новичка*, Ваша Империя*.</li>
                <li><strong>Военная мощь</strong>: Создайте флот, Производство кораблей, Улучшайте корабли*, Откройте арену*, Организуйте флоты в когорты.</li>
                <li><strong>Исследовать и покорять</strong>: Космическая карта, Выберите планету, Взаимодействие с планетой, Колонизируйте планету, Защищайте планеты.</li>
                <li><strong>Развитие экономики</strong>: Стройте здания, Запускайте исследования.</li>
                <li><strong>Дипломатия и сообщество</strong>: Вступайте в альянс*, Вики*, Салон*.</li>
            </ol>
            <p>Некоторые режимы убирают часть шагов: шаг об исследованиях — в режимах <em>Найти и уничтожить</em> и <em>Доминирование</em>, шаги об исследованиях и об альянсе — в <em>Battle Royale</em>. Счётчик «Шаг X из N» в руководстве всегда показывает общее число шагов Вашего пути.</p>
            <p>За каждый пройденный шаг полагается награда. Каким бы ни был Ваш путь, в сумме Вы получаете <strong>232&nbsp;000 Биткойнов, 150 Легионеров, 100 рабочих, 500 Очков войны и 2 истребителя</strong>: то, что Ваш путь пропускает, выплачивается Вам бонусом в конце (сразу при выборе <em>Разберусь сам</em>).</p>
            <ul>
                <li>Вы можете выйти из обучения в любой момент (<em>Покинуть обучение</em>) и сменить путь по ходу дела; уже пройденные шаги остаются засчитанными.</li>
                <li>Чтобы запустить его снова: страница <strong>Предпочтения</strong>, раздел <em>Обучение</em>.</li>
            </ul>

            <h2 id="a-surveiller">За чем следить с самого начала</h2>
            <ul>
                <li><strong>Положительный баланс Биткойнов</strong>: каждый день в <strong>18:59 (по парижскому времени)</strong>, то есть в 17:59 UTC зимой и в 16:59 UTC летом, подводится итог: рассчитываются Ваши доходы и расходы на содержание. Если Ваш баланс уходит в минус, наступает <strong>экономический Game Over</strong>: Вы теряете все флоты и все корабли, а баланс возвращается к 125&nbsp;000 Биткойнов (планеты и здания остаются).</li>
                <li><strong>Хранение</strong>: если Ваши склады заполнены, производство останавливается. Стройте склады соответственно.</li>
                <li><strong>Ежедневные задания</strong>: 3 задания в день (страница <em>Цели</em>), за каждое — награда в Очках войны.</li>
            </ul>

            <h2 id="protection-debutant">Защита новичков</h2>
            <p>В первые дни Вы <strong>защищены</strong>: ни один игрок не может отправить флот к Вашим планетам. Поэтому никто не может ни атаковать Вас, ни грабить, ни вторгаться, ни бомбардировать, ни даже отправить зонд; союзник тоже не может доставить Вам ресурсы. Флоты, уже летящие к Вам, возвращаются обратно. Достаточно времени, чтобы спокойно заложить первые базы.</p>
            <p>Защита прекращается, как только выполняется одно из этих условий:</p>
            <ul>
                <li>С момента создания Вашего командира прошло <strong>7 дней</strong>.</li>
                <li>Вы владеете <strong>4-й планетой</strong> (Ваши луны не считаются).</li>
                <li>Вы сами отправляете <strong>наступательную миссию</strong> (грабёж, вторжение или ядерный удар): тогда Вы немедленно отказываетесь от своей защиты.</li>
                <li>Вы включаете <strong>режим атаки</strong> одного из своих флотов.</li>
            </ul>
            <p>В двух последних случаях перед этим Вас предупреждает окно подтверждения. Используйте этот период, чтобы выстроить прочную экономику и оборону, прежде чем вступать в бой.</p>

    interface_guide:
        title: "Знакомство с интерфейсом"
        category: "beginner"
        order: 2
        tags: "интерфейс,экран,меню,навигация,кнопки,активная планета,панель ресурсов,рационы,предпочтения,настройки"
        summary: "Три зоны экрана и как перемещаться по игре, не теряясь."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="disposition">3 зоны экрана</h2>
            <ul>
                <li><strong>Панель ресурсов, вверху</strong> — Ваши ресурсы, Ваши Биткойны, Ваши Очки Войны и название Вашей <strong>активной планеты</strong>: коснитесь его, чтобы сменить планету.</li>
                <li><strong>Меню</strong> — все разделы игры (Обзор, Командиры, Флоты, Планеты, Инфраструктура, Космическая карта, Альянс, Отчёт, Сообщения, Салон…). Его расположение зависит от Вашего экрана (см. ниже).</li>
                <li><strong>Центральная зона</strong> — содержимое текущей страницы (карта, список флотов, здания…). Это единственная зона, которая прокручивается.</li>
            </ul>
            <p>Расположение меню зависит от Вашего экрана:</p>
            <ul>
                <li><strong>На компьютере</strong>: полное меню находится слева. В самом низу ряд значков открывает сообщение об ошибке, обучение (если оно идёт), <strong>Уведомления</strong>, <strong>Предпочтения</strong>, <strong>Настройки</strong> Вашего аккаунта, Ваш <strong>профиль на всех серверах</strong> и выбор <strong>языка</strong>.</li>
                <li><strong>На телефоне в горизонтальном положении и в приложении Android</strong>: у левого края закреплена колонка значков. В ней всегда находятся пять главных разделов — Обзор, Космическая карта, Инфраструктура, Космическая верфь и Оборона — и кнопка <strong>Меню</strong> (…), которая открывает всё остальное в панели, выезжающей снизу.</li>
                <li><strong>На планшете или на телефоне в вертикальном положении</strong> (в браузере): эти пять разделов и кнопка <strong>Меню</strong> образуют панель внизу экрана.</li>
            </ul>
            <p>Число на кнопке «Меню» суммирует Ваши новые отчёты, личные сообщения, сообщения салона и ожидающие дуэли на арене.</p>

            <h2 id="barre-ressources">Панель ресурсов (вверху)</h2>
            <p>Она в реальном времени показывает ресурсы Вашей активной планеты:</p>
            <ul>
                <li><strong>Ниобий</strong> — базовая руда (здания, корабли).</li>
                <li><strong>Вода</strong> — необходима для строительства и кораблей.</li>
                <li><strong>Рационы</strong> (еда) — их потребляют Ваши рабочие: 1 рацион в час на 500 рабочих. Если они упадут до нуля, голод сначала убивает рабочих, затем также Легионеров, и наконец Мехов.</li>
                <li><strong>Уран</strong> — редкий ресурс (ядерные бомбы, Ядерная база, ставки на арене). Он появляется, только если он есть на планете.</li>
            </ul>
            <p>Ниобий, вода, рационы и Ваши рабочие меняются секунда за секундой в темпе Вашего производства, вплоть до предела Вашего хранилища; рационы могут и уменьшаться, если Ваши рабочие едят больше, чем Вы производите. Коснитесь ниобия, воды или рационов, чтобы увидеть их почасовое производство с учётом бонусов (герой, лагерь рабов, альянс, луны, эмбарго); для рационов это чистый баланс за вычетом потребления.</p>
            <p><strong>Биткойны</strong> (валюта) и <strong>Очки Войны (ОВ)</strong> тоже отображаются на панели, как и Ваши рабочие, Легионеры, учёные и Мехи, а также занятое место на земле (<strong>Территория</strong>) и на орбите (<strong>Космос</strong>) в виде «занято/максимум».</p>
            <p><em>На телефоне панель свёрнута: она показывает только ниобий, воду, рационы, уран, Биткойны и ОВ, а также любой ресурс, по которому есть тревога (голод, угроза на орбите). Кнопка-стрелка в конце панели, на которой указано число скрытых ресурсов, разворачивает её.</em></p>

            <h2 id="planete-active">Активная планета: что это значит</h2>
            <p>Когда у Вас несколько планет, <strong>активной</strong> бывает только одна за раз. Все Ваши действия (строить, производить корабль, запускать флот) относятся к этой планете.</p>
            <p>Чтобы её сменить:</p>
            <ul>
                <li>коснитесь названия планеты на панели ресурсов: откроется список <strong>Мои планеты</strong> (в панели, выезжающей снизу, на телефоне; прямо под панелью на компьютере); выберите одну из них;</li>
                <li>или используйте стрелки ‹ и › по обе стороны от названия, чтобы перейти к предыдущей или следующей планете.</li>
            </ul>
            <p>Вы остаётесь на той же странице, показанной уже для новой планеты. Порядок списка настраивается в <strong>Предпочтениях</strong>, «Сортировка планет»: по алфавиту, по положению, по колонизации или по размеру.</p>

            <h2 id="navigation">Быстрая ориентация</h2>
            <ul>
                <li><strong>Обзор</strong> — Ваш командир, Ваши флоты, Ваши финансы, текущее исследование и активность всех Ваших планет.</li>
                <li><strong>Инфраструктура</strong> — строительство зданий активной планеты.</li>
                <li><strong>Космическая верфь</strong> и <strong>Оборона</strong> — производство кораблей и обороны на активной планете.</li>
                <li><strong>Планеты</strong> — список всех Ваших планет и рынок.</li>
                <li><strong>Флоты</strong> — создание, отправка и отслеживание Ваших кораблей.</li>
                <li><strong>Космическая карта</strong> — исследование галактики.</li>
                <li><strong>Отчёт</strong> — всё, о чём сообщает Вам игра (бои, прибытия, альянс…).</li>
                <li><strong>Сообщения</strong> — Ваши личные сообщения; <strong>Салон</strong> — чаты для обсуждений.</li>
                <li><strong>Альянс</strong> — участники, банк, дипломатия, арена альянса.</li>
                <li><strong>Предпочтения</strong> — Ваш псевдоним и настройки на этом сервере; <strong>Настройки</strong> — Ваш аккаунт (e-mail, пароль, часовой пояс, заблокированные игроки).</li>
                <li><strong>Сервер</strong> — смена сервера.</li>
            </ul>
            <p>В зависимости от режима сервера некоторые пункты не отображаются (Исследования, Альянс или Cthulhu).</p>

    resources_intro:
        title: "Ресурсы"
        category: "beginner"
        order: 3
        tags: "ресурсы,ниобий,вода,пища,рационы,уран,производство,хранение,цикл"
        summary: "4 ресурса игры, как их производят и почему хранение критически важно."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">4 ресурса игры</h2>
            <table>
                <thead>
                    <tr><th>Ресурс</th><th>Для чего нужен</th><th>Как его получить</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ниобий</strong></td><td>Строительство зданий, кораблей и обороны</td><td>Шахта Niobium</td></tr>
                    <tr><td><strong>Вода</strong></td><td>Строительство зданий, кораблей и обороны</td><td>Экстрактор воды</td></tr>
                    <tr><td><strong>Еда</strong> («Рационы» в игре)</td><td>Кормить Ваших рабочих</td><td>Сельскохозяйственное поле и Аэропонная ферма (их производство суммируется)</td></tr>
                    <tr><td><strong>Уран</strong></td><td>Ядерная база, ядерные бомбы, перехватчики, ставки на арене</td><td>Переработка урановых обломков, победы над Ктулху</td></tr>
                </tbody>
            </table>
            <p>Едят только <strong>рабочие</strong>: 1 рацион в час на 500 рабочих. Если рационов не хватает, голод убивает рабочих, а при долгом голоде — Легионеров и Мехов.</p>
            <p>Помимо этих ресурсов, <strong>Биткойн</strong> — это валюта игры: им оплачиваются исследования, наём, топливо флотов и ежедневное содержание (см. <a href="/wiki/bitcoin_economy">Биткойны и содержание</a>).</p>

            <h2 id="cycle">Цикл производства</h2>
            <p>Ваши ресурсы поступают автоматически и непрерывно. Объёмы производства выражаются на <strong>цикл производства</strong>, а игра начисляет Вам их пропорционально прошедшему времени:</p>
            <ul>
                <li>На <strong>планете</strong>: цикл в <strong>10 минут</strong>.</li>
                <li>На <strong>луне</strong>: цикл в <strong>1 минуту</strong> (в 10 раз быстрее, только для еды).</li>
            </ul>
            <p>Производство <strong>пропорционально уровню</strong> здания. На уровень и на цикл в 10 минут:</p>
            <ul>
                <li><strong>Шахта Niobium</strong>: 33 ниобия;</li>
                <li><strong>Экстрактор воды</strong>: 22 воды;</li>
                <li><strong>Сельскохозяйственное поле</strong>: 27 рационов;</li>
                <li><strong>Аэропонная ферма</strong>: 37 рационов.</li>
            </ul>
            <p>Пример: Шахта Niobium 10-го уровня производит 330 ниобия каждые 10 минут, то есть 1&nbsp;980 в час, без учёта бонусов. Панель ресурсов показывает Ваше реальное почасовое производство с учётом бонусов.</p>

            <h2 id="bonus">Что повышает Ваше производство</h2>
            <ul>
                <li><strong>Вступление в альянс</strong>: сразу <strong>+20&nbsp;%</strong> к ниобию, воде и рационам.</li>
                <li><strong>Исследования и улучшения альянса</strong>: исследование «Закон Макрона» (+7&nbsp;% за уровень, альянсы Весов Миров) и улучшения «Добыча ниобия», «Производство воды» и «Производство рационов» (+2&nbsp;% за уровень каждое).</li>
                <li><strong>Герой, размещённый на планете</strong>: бонус, зависящий от его Интеллекта, удваивается у героя Экономики.</li>
                <li><strong>Лагерь рабов</strong>: +2,5&nbsp;% за уровень.</li>
            </ul>
            <p>Размер планеты не меняет того, что производит один уровень: доступное место лишь ограничивает число уровней, которые Вы можете построить.</p>

            <h2 id="stockage">Хранение (не пренебрегайте!)</h2>
            <p>У каждой планеты есть <strong>максимальная вместимость</strong> хранилища по каждому ресурсу. <strong>Когда оно заполнено, всё, что производится сверх этого, теряется</strong>.</p>
            <p>На старте планета вмещает 200&nbsp;000 ниобия, 180&nbsp;000 воды и 150&nbsp;000 рационов. Чтобы увеличить вместимость:</p>
            <ul>
                <li><strong>Склад Niobium</strong>: +1&nbsp;200&nbsp;000 ниобия за уровень;</li>
                <li><strong>Резервуар воды</strong>: +800&nbsp;000 воды за уровень;</li>
                <li><strong>Сельскохозяйственный силос</strong>: +800&nbsp;000 рационов за уровень.</li>
            </ul>
            <p>Они открываются с исследованием <strong>Управление грузами</strong> 1-го уровня; для Сельскохозяйственного силоса нужно также исследование <strong>Аэропоника</strong>. А вот у урана предела хранения нет.</p>
            <p><em>Совет новичку:</em> проверяйте свои хранилища <strong>перед</strong> тем, как выйти из игры на ночь. Нет ничего хуже, чем обнаружить, что Ваши шахты простояли 10 часов.</p>

    bitcoin_economy:
        title: "Биткойны и содержание"
        category: "beginner"
        order: 4
        tags: "биткойн,валюта,содержание,расходы,стоимость,тарифы,топливо,экономика,game over,ежедневный отчёт"
        summary: "Биткойн — валюта игры. Как его зарабатывать и, главное, как избежать банкротства."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Что такое Биткойн?</h2>
            <p><strong>Биткойн</strong> — это <strong>универсальная валюта</strong> Area Universe (к настоящей криптовалюте он отношения не имеет, это просто отсылка). Вы начинаете с <strong>125&nbsp;000 Биткойнов</strong>. Они нужны, чтобы:</p>
            <ul>
                <li>Запускать <strong>исследования</strong>.</li>
                <li>Нанимать <strong>Легионеров</strong> (по 8 Биткойнов каждый), <strong>Мехов</strong> (60) и <strong>учёных</strong> (25) и изготавливать <strong>ядерные бомбы</strong> (25&nbsp;000).</li>
                <li>Оплачивать <strong>топливо</strong> каждого отправляемого флота.</li>
                <li>Поддерживать свой <strong>альянс</strong>: взносы в казну и вложения в улучшения альянса.</li>
                <li>Оплачивать <strong>ежедневное содержание</strong> Ваших войск, кораблей и зданий.</li>
            </ul>

            <h2 id="gagner">Как их зарабатывать?</h2>
            <ul>
                <li><strong>Рабочие</strong> — Ваш главный источник. В ежедневном отчёте каждый рабочий, находящийся на Ваших планетах, приносит <strong>0,5 Биткойна</strong>: 10&nbsp;000 рабочих = 5&nbsp;000 Биткойнов в день, 50&nbsp;000 рабочих Вашей стартовой планеты = 25&nbsp;000 Биткойнов в день, до вычета налогов альянса и мира. Рабочие, погруженные во флот, ничего не приносят.</li>
                <li><strong>Продажа торговцам</strong> — доставляйте им ниобий, воду, уран и даже рабочих или войска либо пользуйтесь продажей в один клик на странице <strong>Планеты</strong> (см. <a href="/wiki/market">Рынок и торговцы</a>).</li>
                <li><strong>Очки Войны</strong> — зарабатываются, в частности, ежедневными заданиями и обмениваются на странице <strong>Цели</strong>: 1 ОВ = 1 Биткойн.</li>
                <li><strong>Бонус за вход</strong> — сумма при первом входе за день, умножающаяся, если Вы заходите несколько дней подряд.</li>
                <li><strong>Грабёж</strong> — рейды приносят ниобий, воду и уран, которые можно перепродать.</li>
            </ul>

            <h2 id="entretien">Ежедневное содержание</h2>
            <p>Каждый день в <strong>18:59 (по парижскому времени)</strong>, то есть в 17:59 UTC зимой и в 16:59 UTC летом, игра рассчитывает для Вас итог:</p>
            <ul>
                <li><strong>Доходы</strong>: то, что приносят Ваши рабочие.</li>
                <li><strong>Расходы</strong>: содержание Ваших Легионеров, Мехов, учёных, кораблей и зданий.</li>
                <li><strong>Итог</strong>: доходы − налоги − расходы прибавляются к Вашему балансу (или вычитаются из него).</li>
            </ul>
            <p>Всё, что <strong>находится во флоте</strong> — в полёте <em>или</em> на стоянке на орбите, — обходится гораздо дороже, чем то, что <strong>на земле</strong> на планете: в 6 раз дороже для кораблей и Легионеров, в 50 раз дороже для Мехов. Флот, который не используется, держите на земле. Большая армия, постоянно болтающаяся в пути, в конце концов разорит даже самых осторожных.</p>

            <h2 id="bareme">Тарифы содержания</h2>
            <p>Суммы в Биткойнах в день.</p>
            <table>
                <thead>
                    <tr><th>Единица</th><th>На земле</th><th>Во флоте</th></tr>
                </thead>
                <tbody>
                    <tr><td>Легионер</td><td>0,1</td><td>0,6</td></tr>
                    <tr><td>Мех</td><td>2</td><td>100</td></tr>
                    <tr><td>Учёный</td><td>3</td><td>2</td></tr>
                    <tr><td>Корабль</td><td>сигнатура ÷ 12</td><td>сигнатура ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Примеры: 10&nbsp;000 Легионеров стоят 1&nbsp;000 Биткойнов в день на земле и 6&nbsp;000 во флоте. 100 Карго X (сигнатура по 50 у каждого) стоят около 417 Биткойнов в день на земле и 2&nbsp;500 во флоте.</p>
            <table>
                <thead>
                    <tr><th>Здание</th><th>За уровень</th></tr>
                </thead>
                <tbody>
                    <tr><td>Шахта Niobium, Экстрактор воды, Сельскохозяйственное поле</td><td>1</td></tr>
                    <tr><td>Аэропонная ферма</td><td>2</td></tr>
                    <tr><td>Большой город, Наземный радар</td><td>13</td></tr>
                    <tr><td>Мегаполис</td><td>26</td></tr>
                    <tr><td>Склад Niobium, Резервуар воды, Сельскохозяйственный силос</td><td>30</td></tr>
                    <tr><td>Исследовательский центр</td><td>53</td></tr>
                    <tr><td>Казарма</td><td>66</td></tr>
                    <tr><td>Космическая верфь</td><td>100</td></tr>
                    <tr><td>Космический радар</td><td>133</td></tr>
                    <tr><td>Оружейный завод, Плавучий город, Орбитальная станция</td><td>333</td></tr>
                    <tr><td>Глушитель радара</td><td>400</td></tr>
                    <tr><td>Тяжёлая промышленность</td><td>666</td></tr>
                    <tr><td>Оборонительный форт</td><td>800</td></tr>
                    <tr><td>Ядерная база</td><td>3&nbsp;333</td></tr>
                    <tr><td>Тюрьма, Лагерь рабов</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Пример: Оборонительный форт 3-го уровня стоит 2&nbsp;400 Биткойнов в день. У планетарной обороны (турели, щиты) и у рабочих содержания нет. Исследования альянса «Советская структура», «Механическое превосходство» и «Научный энтузиазм» снижают содержание Легионеров, Мехов и учёных.</p>

            <h2 id="faillite">Внимание: экономический Game Over</h2>
            <p>Если после этого ежедневного итога Ваш баланс Биткойнов становится <strong>отрицательным</strong>, наступает <strong>экономический Game Over</strong>:</p>
            <ul>
                <li>Все Ваши <strong>флоты</strong> уничтожаются, как в полёте, так и на орбите, вместе с грузом и находящимися на борту войсками.</li>
                <li>Все <strong>корабли на земле</strong> на Ваших планетах теряются.</li>
                <li>Ваш баланс сбрасывается до <strong>125&nbsp;000 Биткойнов</strong>.</li>
            </ul>
            <p>Вы сохраняете планеты, здания, оборону, исследования и войска, оставшиеся на земле. Отчёт «Надвигающееся банкротство» предупреждает Вас заранее (см. <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Золотое правило:</em> не нанимайте армию дороже, чем могут оплатить Ваши рабочие.</p>

    first_buildings:
        title: "Строим первые здания"
        category: "beginner"
        order: 5
        tags: "здания,строительство,шахта,экстрактор,сельскохозяйственное поле,большой город,новичок,место"
        summary: "Рекомендуемый порядок строительства, чтобы хорошо развить Вашу стартовую планету."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">Рекомендуемый порядок (первые 10 зданий)</h2>
            <p>На Вашей стартовой планете уже есть Шахта Niobium и Экстрактор воды 3-го уровня, Космическая верфь и Наземный радар 1-го уровня, 50&nbsp;000 рабочих и 125&nbsp;000 рационов в запасе.</p>
            <ol>
                <li><strong>Шахта Niobium</strong> — улучшайте её: это Ваш первый источник сырья.</li>
                <li><strong>Экстрактор воды</strong> — необходим, чтобы потом строить всё остальное.</li>
                <li><strong>Сельскохозяйственное поле</strong> — производит рационы, которые кормят Ваших рабочих.</li>
                <li><strong>Большой город</strong> — +25&nbsp;000 рабочих максимум (Вы начинаете на пределе в 50&nbsp;000). Требует исследования <strong>Городская перестройка</strong> 1-го уровня.</li>
                <li><strong>Шахта Niobium и Экстрактор воды</strong> ещё выше — повышайте производство, прежде чем идти дальше.</li>
                <li><strong>Исследовательский центр</strong> — в нём живут Ваши учёные (250 на уровень). Для запуска исследования он не нужен.</li>
                <li><strong>Космическая верфь</strong> — она у Вас уже есть; каждый уровень ускоряет производство кораблей на 25&nbsp;%. Для повышения уровня нужно исследование <strong>Промышленность</strong> 1-го уровня.</li>
                <li><strong>Казарма</strong> — +5&nbsp;000 Легионеров максимум за уровень (2&nbsp;000 без казармы). Требует исследования <strong>Военное усиление</strong> 1-го уровня.</li>
                <li><strong>Склад Niobium</strong>, <strong>Резервуар воды</strong>, <strong>Сельскохозяйственный силос</strong> — не дают производству упираться в потолок. Требуют исследования <strong>Управление грузами</strong> 1-го уровня (и <strong>Аэропоника</strong> для Силоса).</li>
                <li><strong>Мегаполис</strong> — +80&nbsp;000 рабочих максимум за уровень. Требует исследования <strong>Городская перестройка</strong> 5-го уровня.</li>
            </ol>
            <p>Стоимость, длительность и занимаемое место каждого здания: см. <a href="/wiki/buildings">Здания</a>.</p>

            <h2 id="file-attente">Только одно строительство за раз</h2>
            <p>У каждой планеты <strong>одна очередь строительства</strong>. Пока одно здание повышает уровень, остальные должны ждать. Планируйте соответственно.</p>
            <p>Несколько планет = несколько параллельных очередей: именно поэтому колонизация ускоряет Ваш прогресс.</p>

            <h2 id="espace">Свободное место на планете</h2>
            <p>На каждой планете ограниченное число <strong>мест на земле</strong> и <strong>мест в небе</strong>. <strong>Каждый уровень</strong> здания занимает места, включая повышение уровня: Шахта Niobium занимает 1 место на земле за уровень, Большой город — 6, Мегаполис — 6 на земле и 6 в небе.</p>
            <ul>
                <li>Занятые и свободные места отображаются на карточке каждой планеты (страница <strong>Планеты</strong>) и на странице <strong>Инфраструктура</strong>.</li>
                <li>Небо нужно для Мегаполиса, Аэропонной фермы, Космической верфи, Космического радара и Глушителя радара. Оборона (турели, щиты) не занимает никаких мест.</li>
                <li>Чтобы увеличить планету: <strong>Плавучий город</strong> (+10 мест на земле за уровень) и <strong>Орбитальная станция</strong> (+5 в небе за уровень), не более 5 каждого на планету. Они стоят 2&nbsp;000 Очков Войны × уровень и открываются исследованием <strong>Территориальное расширение</strong> (1-й, затем 2-й уровень), доступным после Терраформирования 18-го уровня.</li>
                <li>Нет свободного места — больше никаких построек и повышений уровня на этой планете.</li>
            </ul>

    first_fleet:
        title: "Создание первого флота"
        category: "beginner"
        order: 6
        tags: "флот,корабли,первый,создание,новичок,верфь,грузовой,зонд"
        summary: "Изготовить корабль, составить флот и отправить его к месту назначения: пошаговое руководство."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Что нужно заранее</h2>
            <ul>
                <li><strong>Космическая верфь</strong>, построенная на Вашей планете.</li>
                <li>Ресурсы для корабля: чаще всего это <strong>ниобий</strong>, <strong>вода</strong> и <strong>рабочие</strong> (на Вашей планете всегда остаётся в резерве 5&nbsp;000 рабочих, их тронуть нельзя). Некоторым кораблям нужны ещё Очки Войны, Биткойны или Легионеры (см. статью <em>Типы кораблей</em>).</li>
                <li><strong>Исследование</strong>, открывающее корабль. Пример: для грузовых кораблей нужно <em>Управление грузами</em> (1-й уровень для Карго I), которое само открывается с <em>Утилитарные корабли</em> 2-го уровня. Для Зонда никакого исследования не нужно.</li>
            </ul>

            <h2 id="fabriquer">Шаг 1 — Изготовить корабли</h2>
            <p>Перейдите на страницу <strong>Космическая верфь</strong> (меню слева), вкладка <strong>Строительство кораблей</strong>. Выберите корабль, укажите количество и нажмите <strong>Построить</strong>. У ещё заблокированного корабля указано, какого исследования или здания не хватает.</p>
            <p>Изготовление занимает время: всё это время Вы можете продолжать играть.</p>

            <h2 id="composer">Шаг 2 — Составить и отправить флот</h2>
            <ol>
                <li>На странице <strong>Флоты</strong> нажмите <strong>Создать новый флот</strong>, выберите корабли для погрузки (отображается запас на земле) и дайте флоту название (не более 12 символов).</li>
                <li>Нажмите на название флота, чтобы открыть его страницу. Вкладка <strong>Груз</strong> нужна, чтобы загружать ресурсы, когда флот находится на одной из Ваших планет.</li>
                <li>Отправьте его:
                    <ul>
                        <li>для простого перемещения (миссия <strong>Обычный</strong>) или шпионажа — вкладка <strong>Переместить флот</strong>: введите пункт назначения в полях галактики, системы и планеты (напр. <code>1:5:12</code>) или выберите одну из «Мои планеты», проверьте предполагаемые стоимость и длительность, затем нажмите <strong>Отправить</strong>;</li>
                        <li>для остальных миссий (Разгрузить и вернуться, Колонизировать, Грабить, Вторгнуться…) используйте <strong>Космическую карту</strong>: нажмите на нужную клетку, затем <strong>Взаимодействие</strong>, выберите флот и миссию и нажмите <strong>Отправить</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>Топливо оплачивается в <strong>Биткойнах</strong> при отправлении (см. статью <em>Перемещение и расстояние</em>). Миссии подробно описаны в статье <em>Типы миссий</em>.</p>

            <h2 id="premiers-vaisseaux">Подходящие корабли для начала</h2>
            <ul>
                <li><strong>Карго I</strong> — перевозка ресурсов (грузоподъёмность 3&nbsp;000). Идеальный корабль для продажи торговцам.</li>
                <li><strong>Зонд</strong> — шпионит за чужими планетами. Отправляйте его <em>перед</em> любой атакой.</li>
                <li><strong>Истребитель</strong> — первый боевой корабль, недорогой (25 ниобия, 5 воды и 1 рабочий).</li>
                <li><strong>Переработчик</strong> — собирает обломки после боя. Очень выгоден, но медлителен: если добавить его к флоту истребителей, время полёта утроится.</li>
            </ul>

            <h2 id="premiere-cible">Идея для первой миссии</h2>
            <p>Загрузите в 1 грузовой корабль ниобий или воду, затем отправьте его с <strong>Космической карты</strong> с миссией <strong>Разгрузить и вернуться</strong> к торговцу. Торговцы находятся в 20 фиксированных секторах каждой галактики (четыре угла 1, 10, 91 и 100, затем 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 и, в центре, 45, 46, 55 и 56), в позиции, которая меняется от сектора к сектору: найдите их на карте.</p>
            <p>Торговец платит Вам Биткойнами, а грузовой корабль возвращается сам. Путь туда стоит вдвое больше обычного перелёта, а обратный оплачивается при его отправлении по обычному тарифу: для одного Карго I рассчитывайте на 0–2 Биткойна туда и 0 или 1 обратно.</p>

    first_combat:
        title: "Ваш первый бой"
        category: "beginner"
        order: 7
        tags: "бой,атака,первый,новичок,подготовка,раунды,отчёт"
        summary: "Подготовка, ход боя и разбор: первая атака шаг за шагом."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Подготовьтесь (важно!)</h2>
            <ol>
                <li><strong>Отправьте зонд</strong> на цель, чтобы оценить её оборону. Потерять 10 истребителей вслепую — не страшно; потерять 100 — обидно.</li>
                <li><strong>Составьте подходящий флот</strong>: достаточно огневой мощи, и не забудьте добавить <strong>переработчик</strong> для сбора обломков.</li>
                <li><strong>Проверьте своё содержание</strong>: каждый день корабль стоит его сигнатура ÷ 2 в Биткойнах, пока он находится во флоте (в полёте или на стоянке), против сигнатуры ÷ 12 на земле. Верните на землю то, что не используется.</li>
            </ol>

            <h2 id="enchainement">Что происходит шаг за шагом</h2>
            <ol>
                <li><strong>Вы включаете режим атаки</strong> своего флота (флажок «режим атаки» в управлении флотом; нужно корабельное вооружение), затем отправляете его с миссией <em>Обычный</em> на координаты врага. Топливо оплачивается Биткойнами при отправлении.</li>
                <li><strong>Он летит</strong> — время в пути показано на странице Флоты. В течение <strong>2 минут</strong> после отправления кнопка «Отмена» тут же возвращает его на планету отправления (оплаченное топливо не возвращается); по истечении этого срока он долетит до конца.</li>
                <li><strong>Прибытие</strong>: если на месте есть вражеские флоты, бой назначается через <strong>5 минут</strong>. В течение этого времени никто больше не может менять режим атаки своих флотов.</li>
                <li><strong>Бой по раундам</strong>: обе стороны обмениваются залпом в каждом раунде, максимум 100 раундов. Каждый залп сначала встречает щит противника, но часть урона всегда проходит.</li>
                <li><strong>Конец боя</strong>: одна из сторон уничтожена либо достигнуто 100 раундов. В этом случае побеждает сторона, сохранившая <strong>больше брони</strong> (при полном равенстве побеждает атакующий).</li>
            </ol>

            <h2 id="apres-combat">После боя</h2>
            <ul>
                <li>Вам отправляется <strong>отчёт о бое</strong>: меню <strong>Отчёт</strong>, вкладка <strong>Бои</strong>.</li>
                <li>Уничтоженные корабли оставляют на месте <strong>обломки</strong>. Отправляйте переработчики!</li>
                <li>Победитель получает <strong>Очки Войны (ОВ)</strong> в зависимости от уничтоженного вражеского флота; проигравший получает небольшое утешение (см. <em>Космический бой</em>).</li>
                <li>Ваш уцелевший флот <strong>остаётся на орбите</strong> в месте боя: верните его сами. Если в нём есть переработчики со свободным местом в трюме, они сразу же начинают собирать обломки.</li>
            </ul>

            <h2 id="erreurs">Классические ошибки, которых стоит избегать</h2>
            <ul>
                <li>Атаковать, не просканировав цель зондом.</li>
                <li>Забывать, что раунды заканчиваются на 100-м: слишком прочная цель, которую Вы недостаточно потрепали, сохраняет больше брони, чем Вы, и выигрывает.</li>
                <li>Не отправить переработчик: Ваши противники заберут <em>Ваши</em> обломки раньше Вас.</li>
            </ul>

    tips:
        title: "Советы для успешного старта"
        category: "beginner"
        order: 8
        tags: "советы,рекомендации,стратегия,новичок"
        summary: "15 советов, которые решают всё в Ваши первые дни."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Экономика</h2>
            <ul>
                <li><strong>Максимизируйте число рабочих</strong>: это Ваш главный источник Биткойнов.</li>
                <li><strong>Не стройте слишком рано</strong> большую армию: она разорит Вас на содержании.</li>
                <li><strong>Исследуйте Городскую перестройку, затем стройте Большие города и Мегаполисы</strong>, чтобы увеличить население.</li>
                <li><strong>Следите за ежедневным отчётом</strong>: если расходы превышают доходы, реагируйте немедленно.</li>
                <li><strong>Продавайте излишки торговцам</strong>, вместо того чтобы позволять хранилищу переполниться.</li>
            </ul>

            <h2 id="militaire">Военное дело</h2>
            <ul>
                <li><strong>Всегда держите оборону на каждой планете</strong>: Легионеры в казарме, Мехи, одна-две турели.</li>
                <li><strong>Настраивайте свои корабли каждый день</strong>: Вы можете тратить до 40 очков улучшения в день (корпус, щит, оружие, точность), которые берутся из кредита, свойственного каждому типу кораблей.</li>
                <li><strong>Переработчики очень выгодны</strong>: после каждого боя собирайте обломки. Добавляйте к флоту грузовые корабли: один переработчик перевозит всего 1&nbsp;000 ресурсов.</li>
                <li><strong>Зондируйте перед атакой</strong>: зонд стоит всего 1&nbsp;000 ниобия (в начале у Вас их 10), а потерянный флот обходится дорого. Знайте, что цель получает уведомление о шпионаже.</li>
                <li><strong>Остерегайтесь предела в 100 раундов</strong>: если за 100 ходов ни одна из сторон не уничтожена, побеждает та, у которой осталось больше брони (атакующий — при полном равенстве).</li>
            </ul>

            <h2 id="social">Общение</h2>
            <ul>
                <li><strong>Быстрее вступайте в альянс</strong>: +20&nbsp;% к производству ниобия, воды и рационов, доступ к дипломатии и исследованиям альянса.</li>
                <li><strong>Выполняйте ежедневные задания</strong> (страница <em>Цели</em>): каждое приносит очки войны (ОВ).</li>
                <li><strong>Общайтесь в салоне альянса</strong>: скоординировать две атаки лучше, чем пытаться провести одну.</li>
                <li><strong>Заходите в игру каждый день</strong>: бонус за вход стремительно растёт при серии из 7 дней подряд.</li>
                <li><strong>Включите пуш-уведомления</strong>: Вы узнаете сразу, как только вражеский флот устремится к Вам.</li>
            </ul>

    resources:
        title: "Ресурсы подробно"
        category: "economy"
        order: 1
        tags: "ресурсы,ниобий,вода,пища,рационы,уран,производство,хранение,цикл"
        summary: "Всё о ресурсах: производство, бонусы, хранение и особый случай урана."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Напоминание: 4 ресурса</h2>
            <ul>
                <li><strong>Ниобий</strong> — строительство (здания, корабли, оборона).</li>
                <li><strong>Вода</strong> — строительство (здания, корабли, оборона). Топливо флотов же оплачивается Биткойнами.</li>
                <li><strong>Еда</strong> («Рационы» в игре) — её едят Ваши рабочие, и только они: 1 рацион в час на 500 рабочих. Голод убивает также Легионеров и Мехов.</li>
                <li><strong>Уран</strong> — Ядерная база, ядерные бомбы, перехватчики, ставки на арене. Редкий и ценный.</li>
            </ul>

            <h2 id="production">Как рассчитывается производство</h2>
            <p>Производство выражается за промежуток в <strong>10 минут</strong> (цикл производства планеты) и начисляется пропорционально прошедшему времени. Оно зависит от:</p>
            <ul>
                <li><strong>уровня</strong> производящего здания: за уровень и за 10 минут Шахта Niobium даёт 33 ниобия, Экстрактор воды — 22 воды, Сельскохозяйственное поле — 27 рационов, Аэропонная ферма — 37 рационов;</li>
                <li>Ваших <strong>бонусов</strong> (альянс, исследование «Закон Макрона», улучшения альянса, герой, Лагерь рабов).</li>
            </ul>
            <p>Пример: Экстрактор воды 8-го уровня производит 8 × 22 = 176 воды за 10 минут, то есть 1&nbsp;056 в час; в альянсе (+20&nbsp;%) — 1&nbsp;267 в час. Размер планеты не меняет того, что производит один уровень: он лишь ограничивает число уровней, которые Вы можете построить.</p>
            <p><strong>Луны</strong> производят еду <strong>в 10 раз быстрее</strong> (цикл в 1 минуту).</p>
            <p>Даже <strong>без производящего здания</strong> — или если Вы разрушите его до 0-го уровня — планета сохраняет <strong>минимальное базовое производство</strong>: <strong>7 ниобия, 6 воды и 9 рационов</strong> за цикл (20 рационов на Вашей стартовой планете). Начиная с 1-го уровня производство здания заменяет этот минимум: оно к нему не прибавляется.</p>
            <p>Что касается еды, <strong>Сельскохозяйственное поле</strong> и <strong>Аэропонная ферма</strong> <strong>суммируются</strong>: их производство складывается.</p>

            <h2 id="bonus">Что повышает Ваше производство</h2>
            <table>
                <thead>
                    <tr><th>Источник</th><th>Эффект</th></tr>
                </thead>
                <tbody>
                    <tr><td>Членство в альянсе</td><td>+20&nbsp;% к ниобию, воде и рационам</td></tr>
                    <tr><td>Исследование альянса «Закон Макрона» (Весы Миров)</td><td>+7&nbsp;% за уровень, до 5-го уровня</td></tr>
                    <tr><td>Улучшения альянса «Добыча ниобия», «Производство воды», «Производство рационов»</td><td>+2&nbsp;% за уровень, до +10&nbsp;%</td></tr>
                    <tr><td>Герой, размещённый на планете</td><td>Бонус, зависящий от его Интеллекта, удваивается, если это герой Экономики; ещё +20&nbsp;% с чертой «Магнат» (герой Экономики 15-го уровня)</td></tr>
                    <tr><td>Лагерь рабов</td><td>+2,5&nbsp;% за уровень плюс 1&nbsp;% за уровень каждого удерживаемого пленника (не более 5&nbsp;% за уровень лагеря)</td></tr>
                    <tr><td>Вердикт блокады Ктулху</td><td>От +15&nbsp;% до −15&nbsp;% для членов альянса на ограниченное время</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Хранение и его подводные камни</h2>
            <p>У Вашей планеты есть <strong>максимальная вместимость</strong> для каждого ресурса. Когда она заполнена, производство продолжается, но излишек теряется.</p>
            <p>Решения: строить <strong>Склады Niobium</strong>, <strong>Резервуары воды</strong> и <strong>Сельскохозяйственные силосы</strong>, продавать излишек ниобия и воды торговцам (рационы же не продаются) или отправлять излишки другому игроку.</p>

            <p>Еда перевозится так же, как ниобий и вода: загрузите <strong>рационы</strong> в трюм флота (1 место на рацион), чтобы снабдить другую планету. При разгрузке амбар никогда не превышает свою вместимость: излишек остаётся в трюме.</p>

            <h2 id="uranium">Уран: особый случай</h2>
            <p>Ни одно здание не производит уран. Его можно получить:</p>
            <ul>
                <li>при <strong>переработке</strong> урановых обломков на карте (их видно по особому значку);</li>
                <li>при <strong>победах над Ктулху</strong> (миссии PvE);</li>
                <li>при <strong>победах в вызовах на арене</strong> со ставкой урана.</li>
            </ul>
            <p>Уран нужен для постройки <strong>Ядерной базы</strong> (500 за уровень), для изготовления <strong>ядерных бомб</strong> (по 500) и <strong>перехватчиков</strong> (по 200), а также для ставок на <strong>арене</strong>. У него нет предела хранения, он перевозится в трюме, как другие ресурсы, и перепродаётся торговцам по <strong>2&nbsp;000 Биткойнов за единицу</strong>.</p>

    buildings:
        title: "Здания"
        category: "economy"
        order: 2
        tags: "здания,строительство,стоимость,шахта,экстрактор,сельскохозяйственное поле,большой город,мегаполис,верфь,оборонительный форт,бункер,плавучий город,орбитальная станция,турель"
        summary: "Полный каталог зданий по назначению, с их стоимостью, длительностью и занимаемым местом."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Производство ресурсов</h2>
            <p>Названия ниже — те, что отображаются на странице <strong>Инфраструктура</strong>. Каждый уровень занимает места на земле или в небе (см. раздел «Стоимость зданий» ниже), и многим зданиям требуется предварительное исследование.</p>
            <table>
                <thead>
                    <tr><th>Здание</th><th>Производит</th><th>Примечание</th></tr>
                </thead>
                <tbody>
                    <tr><td>Шахта Niobium</td><td>Ниобий</td><td>33 ниобия за уровень и за 10 минут.</td></tr>
                    <tr><td>Экстрактор воды</td><td>Вода</td><td>22 воды за уровень и за 10 минут.</td></tr>
                    <tr><td>Сельскохозяйственное поле</td><td>Рационы</td><td>27 рационов за уровень и за 10 минут. 1 место на земле за уровень.</td></tr>
                    <tr><td>Аэропонная ферма</td><td>Рационы</td><td>37 рационов за уровень и за 10 минут, но 1 место <strong>в небе</strong> за уровень (на земле ни одного). Требуется исследование Аэропоника. Её производство прибавляется к производству Сельскохозяйственного поля.</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Хранение</h2>
            <table>
                <thead>
                    <tr><th>Здание</th><th>Назначение</th></tr>
                </thead>
                <tbody>
                    <tr><td>Склад Niobium</td><td>+1&nbsp;200&nbsp;000 ниобия хранится за уровень. Исследование Управление грузами 1.</td></tr>
                    <tr><td>Резервуар воды</td><td>+800&nbsp;000 воды хранится за уровень. Исследование Управление грузами 1.</td></tr>
