articles:
    moderation_blocking:
        title: "Модерация: жалобы и блокировка"
        category: "beginner"
        order: 12
        tags: "модерация,жалоба,блокировка,чат,сообщения,условия"
        summary: "Пожалуйтесь на оскорбительное сообщение, заблокируйте нежелательного игрока и ознакомьтесь с правилами сообщества, которые каждый принимает при первом входе."
        related: "salon,account_deletion"
        body: |
            <h2 id="usloviya">Условия использования</h2>
            <p>При первом входе каждый игрок принимает <strong>условия использования</strong> и правила сообщества: уважение к другим игрокам, запрет незаконного, непристойного или клеветнического контента, запрет читерства и злоупотребления мультиаккаунтами. Если условия изменятся, их нужно будет принять заново.</p>
            <h2 id="zhaloba">Пожаловаться на сообщение</h2>
            <p>Каждое сообщение в чате и каждое полученное личное сообщение снабжено значком <strong>флажка</strong>. Клик открывает выбор причины: оскорбления или преследование, спам, другой неприемлемый контент. Жалоба уходит прямо команде модерации вместе с копией сообщения.</p>
            <p>На игрока также можно пожаловаться глобально из его профиля (мультиаккаунт, читерство, оскорбления, спам). Лимит — три жалобы в день, и на одного игрока можно пожаловаться только один раз.</p>
            <h2 id="blokirovka">Заблокировать игрока</h2>
            <p>Кнопка <strong>Заблокировать</strong> в профиле игрока немедленно скрывает все его сообщения в чатах и запрещает обмен личными сообщениями в обе стороны.</p>
            <p>Список заблокированных игроков находится в разделе <strong>Мои настройки</strong>: там любого можно разблокировать в любой момент.</p>
    getting_started:
        title: "Первые шаги"
        category: "beginner"
        order: 1
        tags: "начало,старт,новичок,обучение,руководство"
        summary: "Добро пожаловать! Самое краткое руководство, чтобы понять Area Universe и успешно провести первые часы игры."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">Что такое Area Universe?</h2>
            <p>Area Universe — это <strong>многопользовательская космическая стратегия</strong>. Вы управляете империей: Ваши планеты производят ресурсы, Ваши корабли бороздят галактику, а Ваши альянсы решают судьбы игроков.</p>
            <p>Это игра, <strong>рассчитанная на длительный период</strong>: Ваши ресурсы накапливаются, даже когда Вы не в сети. Нескольких минут в день достаточно, чтобы прогрессировать.</p>

            <h2 id="objectif">Ваша цель</h2>
            <p>В зависимости от выбранного режима сервера (см. статью <em>Режимы игры</em>) конечная цель меняется: продержаться дольше всех, доминировать в рейтинге, остаться последним и т. д. Но рецепт всегда один и тот же:</p>
            <ol>
                <li><strong>Наладить экономику</strong> (ресурсы + валюта).</li>
                <li><strong>Построить флот и оборону</strong>.</li>
                <li><strong>Заключить союз</strong>, чтобы обрести вес сообща.</li>
            </ol>

            <h2 id="premieres-actions">Ваши 6 первых действий</h2>
            <ol>
                <li><strong>Постройте Шахту ниобия и Водозаборник</strong> на Вашей стартовой планете.</li>
                <li><strong>Добавьте Ферму</strong>, чтобы кормить Ваших рабочих.</li>
                <li><strong>Постройте Город</strong>, чтобы увеличить число рабочих, Ваших поставщиков <em>Биткойнов</em> (валюты игры).</li>
                <li><strong>Постройте Исследовательский центр</strong>, затем <strong>Космическую верфь</strong>, чтобы производить Ваши первые корабли.</li>
                <li><strong>Отправьте грузовой корабль продать ресурсы</strong> торговцу: лёгкие деньги.</li>
                <li><strong>Вступите в альянс</strong>: Вы получаете <strong>+20&nbsp;% к производству</strong> и доступ к исследованиям альянса.</li>
            </ol>

            <h2 id="tutoriel">Встроенное обучение</h2>
            <p><strong>Интерактивное обучение</strong> проведёт Вас шаг за шагом. Оно разбито на <strong>16 этапов</strong> (строительство, флоты, бой и т. д.). Каждый завершённый этап даёт награду (Биткойны, Легионеры, корабли…).</p>
            <ul>
                <li>Вы можете <strong>прервать</strong> его или <strong>возобновить</strong> в любой момент.</li>
                <li>Оно доступно из Ваших <strong>Настроек</strong>.</li>
            </ul>

            <h2 id="a-surveiller">За чем следить с самого начала</h2>
            <ul>
                <li><strong>Положительный баланс Биткойнов</strong>: каждый день в 18:59 UTC подводится итог Ваших доходов и расходов на содержание. Если Вы уходите в минус — это <strong>экономический Game Over</strong>.</li>
                <li><strong>Хранение</strong>: если Ваши склады переполнены, производство останавливается. Стройте склады соответственно.</li>
                <li><strong>Ежедневные задания</strong>: 3 задания в день, все выполненные = <strong>+250 Очков войны</strong>.</li>
            </ul>

            <h2 id="protection-debutant">Защита новичков</h2>
            <p>В течение первых дней Вы <strong>защищены</strong>: ни один игрок не может Вас атаковать, грабить, вторгаться к Вам или бомбардировать Вас. Достаточно времени, чтобы спокойно заложить свои первые базы.</p>
            <p>Защита прекращается, как только выполняется одно из этих условий:</p>
            <ul>
                <li>С момента создания Вашего командира прошло <strong>7 дней</strong>.</li>
                <li>Вы владеете <strong>4-й планетой</strong>.</li>
                <li>Вы сами отправляете <strong>наступательную миссию</strong> (грабёж, вторжение или ядерную атаку): тогда Вы немедленно отказываетесь от своей защиты.</li>
            </ul>
            <p>Пока Вы защищены, Вы не можете атаковать других, не потеряв эту защиту. Воспользуйтесь этим, чтобы выстроить прочную экономику и оборону, прежде чем бросаться в бой.</p>

    interface_guide:
        title: "Знакомство с интерфейсом"
        category: "beginner"
        order: 2
        tags: "интерфейс,экран,меню,навигация,кнопки,активная планета"
        summary: "Три зоны экрана и как ориентироваться, не заблудившись."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="disposition">Три зоны экрана</h2>
            <ul>
                <li><strong>Панель ресурсов, сверху</strong> — Ваши материалы и название Вашей <strong>активной планеты</strong>: нажмите на него, чтобы сменить планету.</li>
                <li><strong>Меню, слева</strong> — все разделы игры (Империя, Планеты, Флоты, Альянс, Сообщения…).</li>
                <li><strong>Центральная зона</strong> — содержимое текущей страницы (карта, список флотов, здания…). Это единственная зона, которая прокручивается.</li>
            </ul>
            <p><em>На телефоне меню слева превращается в полосу значков у левого края: пять основных разделов остаются видны всё время, а кнопка «Меню» открывает остальное в панели, которая поднимается снизу.</em></p>

            <h2 id="barre-ressources">Панель ресурсов (сверху)</h2>
            <p>Она отображает в реальном времени Ваши 4 основных ресурса:</p>
            <ul>
                <li><strong>Ниобий</strong> — базовый минерал (здания, корабли).</li>
                <li><strong>Вода</strong> — необходима для строительства и кораблей.</li>
                <li><strong>Пища</strong> — кормит Ваших рабочих, Легионеров и Меха.</li>
                <li><strong>Уран</strong> — редкий ресурс, для ядерных бомб и испытаний на арене.</li>
            </ul>
            <p>Ниобий, вода, пища и Ваши рабочие растут секунда за секундой в темпе Вашего производства, до предела хранилища. Коснитесь ресурса, чтобы увидеть его производство в час с учётом бонусов (герой, лагерь рабов, альянс, эмбарго).</p>
            <p><strong>Биткойны</strong> (валюта) и <strong>Очки войны (ОВ)</strong> также отображаются на панели ресурсов.</p>

            <h2 id="planete-active">Активная планета: что это означает</h2>
            <p>Когда у Вас несколько планет, только одна является <strong>активной</strong> в данный момент. Все Ваши действия (строительство, производство корабля, запуск флота) применяются к этой планете.</p>
            <p>Чтобы сменить её: нажмите на название планеты на панели ресурсов, затем выберите из списка, который поднимается снизу.</p>

            <h2 id="navigation">Быстрая ориентация</h2>
            <ul>
                <li><strong>Империя</strong> — общий обзор (все Ваши планеты, исследования, экономика).</li>
                <li><strong>Планета</strong> — строительство и управление активной планетой.</li>
                <li><strong>Флоты</strong> — создание, отправка и отслеживание Ваших кораблей.</li>
                <li><strong>Карта</strong> — исследование галактики.</li>
                <li><strong>Сообщения / Отчёты</strong> — всё, о чём игра Вам сообщает (бои, прибытия, альянс…).</li>
                <li><strong>Альянс</strong> — Ваша группа, чат-салон, дипломатия.</li>
            </ul>

    resources_intro:
        title: "Ресурсы"
        category: "beginner"
        order: 3
        tags: "ресурсы,ниобий,вода,пища,уран,производство,хранение,цикл"
        summary: "4 ресурса игры, как их производят и почему хранение критически важно."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">4 ресурса игры</h2>
            <table>
                <tr><th>Ресурс</th><th>Для чего он нужен</th><th>Как его получить</th></tr>
                <tr><td><strong>Ниобий</strong></td><td>Строить здания и корабли</td><td>Шахта</td></tr>
                <tr><td><strong>Вода</strong></td><td>Строить, производить, содержать</td><td>Водозаборник</td></tr>
                <tr><td><strong>Пища</strong></td><td>Кормить Ваших рабочих, Легионеров и Меха</td><td>Ферма, затем Аэропонная ферма</td></tr>
                <tr><td><strong>Уран</strong></td><td>Ядерные бомбы, испытания на арене</td><td>Переработка урановых обломков, победы над Ктулху</td></tr>
            </table>

            <h2 id="cycle">Цикл производства</h2>
            <p>Ваши ресурсы поступают автоматически, непрерывно. Это называется <strong>циклом производства</strong>: внутренний ритм расчётов игры.</p>
            <ul>
                <li>На <strong>планете</strong>: цикл <strong>10 минут</strong>.</li>
                <li>На <strong>луне</strong>: цикл <strong>1 минута</strong> (намного быстрее, только для пищи).</li>
            </ul>
            <p>Чем выше уровень Вашей Шахты / Водозаборника / Фермы, тем больше объём, производимый за цикл.</p>

            <h2 id="bonus">Что улучшает Ваше производство</h2>
            <ul>
                <li><strong>Вступление в альянс</strong>: <strong>+20&nbsp;%</strong> мгновенно ко всем ресурсам.</li>
                <li><strong>Исследования альянса</strong>: дополнительные бонусы, разблокируемые Вашим альянсом.</li>
                <li><strong>Терраформирование</strong>: увеличивает доступное пространство для более крупных зданий.</li>
                <li><strong>Герой Экономики</strong>, назначенный на планету: буст производства.</li>
            </ul>

            <h2 id="stockage">Хранение (не пренебрегайте им!)</h2>
            <p>У каждой планеты есть <strong>максимальная вместимость</strong> хранения по каждому ресурсу. <strong>Когда всё заполнено, производство останавливается</strong>.</p>
            <p>Чтобы увеличить вместимость: стройте <strong>Склады ниобия</strong>, <strong>Склады воды</strong> и <strong>Силосы</strong> (пища).</p>
            <p><em>Совет новичку:</em> проверяйте Ваше хранение <strong>перед</strong> отключением на ночь. Нет ничего хуже, чем обнаружить остановленные на 10 часов шахты.</p>

    bitcoin_economy:
        title: "Биткойны и содержание"
        category: "beginner"
        order: 4
        tags: "биткойн,валюта,содержание,расходы,экономика,game over,ежедневный отчёт"
        summary: "Биткойн — валюта игры. Как его зарабатывать и, главное, как избежать банкротства."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Что такое Биткойн?</h2>
            <p><strong>Биткойн</strong> — это <strong>универсальная валюта</strong> Area Universe (никакого отношения к настоящей криптовалюте, просто отсылка). Он нужен для того, чтобы:</p>
            <ul>
                <li>Запускать <strong>исследования</strong>.</li>
                <li>Нанимать <strong>Легионеров</strong> и <strong>учёных</strong>.</li>
                <li>Покупать через <strong>альянс</strong> (казна).</li>
                <li>Оплачивать <strong>ежедневное содержание</strong> Ваших войск, кораблей и зданий.</li>
            </ul>

            <h2 id="gagner">Как их зарабатывать?</h2>
            <ul>
                <li><strong>Рабочие</strong> — Ваш основной источник. Каждый день они приносят Вам доход, пропорциональный их числу.</li>
                <li><strong>Продажа торговцам</strong> — отправьте грузовой корабль с ниобием и водой к торговцу.</li>
                <li><strong>Ежедневные задания</strong> — некоторые приносят Биткойны.</li>
                <li><strong>Бонус за вход</strong> — сумма при первом входе в день, умножаемая, если Вы заходите несколько дней подряд.</li>
                <li><strong>Грабёж</strong> — рейды могут приносить ниобий и воду, которые Вы можете перепродать.</li>
            </ul>

            <h2 id="entretien">Ежедневное содержание</h2>
            <p>Каждый день в <strong>18:59 UTC</strong> игра подводит для Вас итог:</p>
            <ul>
                <li><strong>Доходы</strong>: то, что принесли Ваши рабочие.</li>
                <li><strong>Расходы</strong>: содержание Ваших Легионеров, Мехов, кораблей и зданий.</li>
                <li><strong>Итог</strong>: доходы − расходы, добавляется (или вычитается) к Вашему балансу.</li>
            </ul>
            <p>Юниты на заданиях (флоты в полёте, корабли в бою) <strong>стоят дороже</strong>, чем стоящие на базе. Большая армия в постоянных разъездах в итоге разорит даже самых осторожных.</p>

            <h2 id="faillite">Внимание: экономический Game Over</h2>
            <p>Если после этого ежедневного итога Ваш баланс Биткойнов уходит <strong>в минус</strong> — это <strong>экономический Game Over</strong>:</p>
            <ul>
                <li>Все Ваши флоты в полёте <strong>уничтожаются</strong>.</li>
                <li>Ваш баланс сбрасывается до <strong>125 000 Биткойнов</strong>.</li>
                <li>Некоторые исследования и прогресс снижаются.</li>
            </ul>
            <p><em>Золотое правило:</em> не нанимайте армию дороже, чем могут профинансировать Ваши рабочие.</p>

    first_buildings:
        title: "Строим первые здания"
        category: "beginner"
        order: 5
        tags: "здания,строительство,шахта,водозаборник,ферма,новичок,место"
        summary: "Рекомендуемый порядок строительства, чтобы удачно стартовать на Вашей начальной планете."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">Рекомендуемый порядок (первые 10 зданий)</h2>
            <ol>
                <li><strong>Шахта ниобия</strong> — Ваш первый источник сырья.</li>
                <li><strong>Водозаборник</strong> — необходим для всех последующих построек.</li>
                <li><strong>Ферма</strong> — кормит Ваших рабочих и Легионеров.</li>
                <li><strong>Город</strong> — увеличивает максимальное число рабочих (+25&nbsp;000).</li>
                <li><strong>Шахта ниобия и Водозаборник уровень 2</strong> — увеличьте производство, прежде чем идти дальше.</li>
                <li><strong>Исследовательский центр</strong> — позволяет запускать исследования (технологии).</li>
                <li><strong>Космическая верфь</strong> — для производства Ваших первых кораблей.</li>
                <li><strong>Казарма</strong> — для найма Легионеров обороны.</li>
                <li><strong>Склады</strong> (ниобий, вода, силосы) — избегайте насыщения производства.</li>
                <li><strong>Мегаполис</strong> — следующий этап после Города для настоящего буста населения (+80&nbsp;000 рабочих).</li>
            </ol>

            <h2 id="file-attente">Только одно строительство одновременно</h2>
            <p>У каждой планеты <strong>одна очередь строительства</strong>. Пока одно здание повышает уровень, остальные должны ждать. Планируйте соответственно.</p>
            <p>Несколько планет = несколько параллельных очередей: именно поэтому колонизация ускоряет Ваш прогресс.</p>

            <h2 id="espace">Доступное пространство на планете</h2>
            <p>У каждой планеты ограниченное число <strong>наземных мест</strong> (здания на поверхности) и <strong>небесных мест</strong> (орбитальные острова, оборона).</p>
            <ul>
                <li>Вы видите доступные места вверху страницы Планеты.</li>
                <li>Исследование <strong>Терраформирование</strong> расширяет Ваши планеты.</li>
                <li>Нет места = нет новых зданий (но Вы всегда можете повышать уровень существующих).</li>
            </ul>

    first_fleet:
        title: "Создание первого флота"
        category: "beginner"
        order: 6
        tags: "флот,корабли,первый,создание,новичок,верфь,грузовой корабль,зонд"
        summary: "Построить корабль, собрать флот и отправить его к цели: шаг за шагом."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Что Вам нужно заранее</h2>
            <ul>
                <li><strong>Космическая верфь</strong>, построенная на Вашей планете.</li>
                <li>Достаточно ниобия и воды, чтобы оплатить корабли.</li>
                <li>(Необязательно) <strong>Исследование</strong>, разблокирующее корабль (например, исследование <em>Утилитарное</em> для грузовых кораблей).</li>
            </ul>

            <h2 id="fabriquer">Этап 1 — Постройка кораблей</h2>
            <p>Перейдите на страницу <strong>Космос</strong> (меню слева). Там Вы видите список доступных кораблей. Нажмите на нужный, выберите количество, запустите производство.</p>
            <p>Производство занимает время: Вы можете продолжать играть, пока оно идёт.</p>

            <h2 id="composer">Этап 2 — Сбор и отправка флота</h2>
            <ol>
                <li>Перейдите на страницу <strong>Флоты</strong>.</li>
                <li>Выберите корабли для погрузки (доступный запас отображён).</li>
                <li>Выберите <strong>пункт назначения</strong> в формате <code>Галактика:Сектор:Позиция</code> (например, <code>1:5:12</code>). Вы также можете кликнуть прямо с Карты.</li>
                <li>Выберите <strong>тип миссии</strong> (см. статью <em>Типы миссий</em>).</li>
                <li>Подтвердите. Топливо (вода) списывается автоматически.</li>
            </ol>

            <h2 id="premiers-vaisseaux">Подходящие корабли для старта</h2>
            <ul>
                <li><strong>Грузовой корабль I</strong> — транспорт ресурсов (3&nbsp;000 вместимости). Необходим для продажи торговцам.</li>
                <li><strong>Зонд</strong> — шпионит за планетами противника. Отправляйте <em>перед</em> любой атакой.</li>
                <li><strong>Истребитель</strong> — первый боевой корабль, дешёвый.</li>
                <li><strong>Переработчик</strong> — собирает обломки после боя. Очень рентабелен.</li>
            </ul>

            <h2 id="premiere-cible">Идея для первой миссии</h2>
            <p>Отправьте 1 грузовой корабль, наполненный ниобием/водой, в <strong>миссию Выгрузка</strong> к торговцу (позиция 15 сектора). Торговец платит Вам Биткойнами, и грузовой корабль возвращается сам.</p>

    first_combat:
        title: "Ваш первый бой"
        category: "beginner"
        order: 7
        tags: "бой,первый,атака,отчёт,новичок,раунды"
        summary: "Как начать космический бой, что происходит во время него и что нужно делать после."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Подготовка (важно!)</h2>
            <ol>
                <li><strong>Отправьте зонд</strong> к цели, чтобы оценить её оборону. Потерять 10 истребителей вслепую — пустяк; потерять 100 — уже больно.</li>
                <li><strong>Соберите подходящий флот</strong>: достаточно огневой мощи и не забудьте добавить <strong>переработчика</strong> для сбора обломков.</li>
                <li><strong>Проверьте Ваше содержание</strong>: большой флот дорого стоит, пока он на задании.</li>
            </ol>

            <h2 id="enchainement">Что происходит шаг за шагом</h2>
            <ol>
                <li><strong>Вы отправляете флот</strong> с миссией <em>Обычная</em> (атака) на координаты противника.</li>
                <li><strong>Он летит</strong> — время полёта отображается на странице Флоты. Вы можете отозвать его до прибытия.</li>
                <li><strong>Прибытие</strong>: если на месте есть вражеские флоты, автоматически начинается бой.</li>
                <li><strong>Бой по раундам</strong>: обе стороны обмениваются выстрелами раунд за раундом (до 100 раундов максимум). Щиты поглощают удары первыми.</li>
                <li><strong>Конец боя</strong>: одна сторона уничтожена или достигнуты 100 раундов (в этом случае <strong>побеждает защитник</strong>).</li>
            </ol>

            <h2 id="apres-combat">После боя</h2>
            <ul>
                <li>Вам приходит <strong>боевой отчёт</strong> (страница Сообщения / Отчёты).</li>
                <li>Уничтоженные корабли оставляют <strong>обломки</strong> на месте. Отправляйте переработчиков!</li>
                <li>Победитель получает <strong>Очки войны (ОВ)</strong>, пропорциональные нанесённым потерям.</li>
                <li>Ваш уцелевший флот автоматически возвращается на стартовую планету.</li>
            </ul>

            <h2 id="erreurs">Классические ошибки, которых следует избегать</h2>
            <ul>
                <li>Атаковать, не послав предварительно зонд.</li>
                <li>Забыть, что раунды останавливаются на 100 в пользу защитника (атака на слишком крепкую цель = автоматическое поражение).</li>
                <li>Не отправить переработчика: Ваши противники соберут <em>Ваши</em> обломки раньше Вас.</li>
            </ul>

    tips:
        title: "Советы для успешного старта"
        category: "beginner"
        order: 8
        tags: "советы,подсказки,стратегия,новичок"
        summary: "15 советов, которые меняют всё в Ваши первые дни."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Экономика</h2>
            <ul>
                <li><strong>Максимизируйте Ваших рабочих</strong>: это Ваш основной источник Биткойнов.</li>
                <li><strong>Не стройте слишком рано</strong> большую армию: она разорит Вас на содержании.</li>
                <li><strong>Стройте Города, затем Мегаполисы</strong>, чтобы увеличить население.</li>
                <li><strong>Следите за Вашим ежедневным отчётом</strong>: если расходы превышают доходы, реагируйте немедленно.</li>
                <li><strong>Продавайте излишки торговцам</strong>, а не позволяйте хранилищу переполниться.</li>
            </ul>

            <h2 id="militaire">Военное дело</h2>
            <ul>
                <li><strong>Всегда оборона на каждой планете</strong>: Легионеры в казарме, Меха, одна-две турели.</li>
                <li><strong>Настраивайте Ваши корабли каждый день</strong>: 40 бесплатных очков для распределения (броня, точность, оружие).</li>
                <li><strong>Переработчики очень рентабельны</strong>: после каждого боя собирайте обломки.</li>
                <li><strong>Зондируйте перед атакой</strong>: зонд стоит копейки, потерянный флот обходится дорого.</li>
                <li><strong>Внимание к порогу в 100 раундов</strong>: если Вы не уничтожите защитника за 100 раундов, Вы проигрываете.</li>
            </ul>

            <h2 id="social">Социальное</h2>
            <ul>
                <li><strong>Вступайте в альянс быстро</strong>: +20&nbsp;% к производству, доступ к дипломатии и исследованиям альянса.</li>
                <li><strong>Выполняйте 3 ежедневных задания</strong>: это <strong>+250 ОВ</strong> в день.</li>
                <li><strong>Общайтесь в чате альянса</strong>: скоординировать две атаки лучше, чем пытаться атаковать в одиночку.</li>
                <li><strong>Заходите каждый день</strong>: бонус за вход резко растёт при серии из 7 дней подряд.</li>
                <li><strong>Включите push-уведомления</strong>: Вы узнаете, как только вражеский флот направится к Вам.</li>
            </ul>

    resources:
        title: "Ресурсы подробно"
        category: "economy"
        order: 1
        tags: "ресурсы,ниобий,вода,пища,уран,производство,хранение,цикл,рационы"
        summary: "Всё о ресурсах: производство, бонусы, хранение и особый случай урана."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Напоминание: 4 ресурса</h2>
            <ul>
                <li><strong>Ниобий</strong> — строительство.</li>
                <li><strong>Вода</strong> — строительство + топливо для флотов.</li>
                <li><strong>Пища</strong> — содержание рабочих, Легионеров, Мехов.</li>
                <li><strong>Уран</strong> — ядерное оружие, вызовы арены. Редкий и ценный.</li>
            </ul>

            <h2 id="production">Как рассчитывается производство</h2>
            <p>Каждая планета работает по <strong>циклу в 10 минут</strong>. В каждом цикле Вы получаете фиксированное количество, зависящее от:</p>
            <ul>
                <li><strong>уровня</strong> Вашего производящего здания (Шахта, Экстрактор, Ферма);</li>
                <li><strong>размера</strong> планеты (терраформирование);</li>
                <li>Ваших <strong>бонусов</strong> (альянс, исследования, герои).</li>
            </ul>
            <p><strong>Луны</strong> производят пищу <strong>в 10 раз быстрее</strong> (цикл в 1 минуту).</p>
            <p>Даже <strong>без производящего здания</strong> — или если Вы снесёте его до уровня 0 — планета сохраняет <strong>минимальное базовое производство</strong>: <strong>7 Ниобия, 6 Воды и 9 Пищи</strong> за цикл. С уровня 1 производство здания (всегда выше) берёт верх.</p>
            <p>Для пищи <strong>Сельскохозяйственное поле</strong> и <strong>Аэропонная ферма</strong> <strong>складываются</strong>: их производства суммируются.</p>

            <h2 id="bonus">Что увеличивает Ваше производство</h2>
            <table>
                <tr><th>Источник</th><th>Эффект</th></tr>
                <tr><td>Членство в альянсе</td><td>+20&nbsp;% базового</td></tr>
                <tr><td>Альянсовые исследования производства</td><td>Дополнительный бонус, растущий с уровнем исследования</td></tr>
                <tr><td>Терраформирование планеты</td><td>Больше места = лучшие здания</td></tr>
                <tr><td>Герой Экономики на планете</td><td>Буст производства (удваивает прочие бонусы)</td></tr>
                <tr><td>Специальные события</td><td>Временные бусты во время серверного события</td></tr>
            </table>

            <h2 id="stockage">Хранение и его ловушки</h2>
            <p>Ваша планета имеет <strong>максимальную вместимость</strong> для каждого ресурса. Когда склад заполнен, производство останавливается — ресурс продолжает «производиться», но теряется.</p>
            <p>Решения: строить <strong>склады</strong> (Ниобий, Вода, Силосы), продавать излишки торговцам или отправлять излишки союзнику.</p>

            <p>Продовольствие перевозится так же, как ниобий и вода: загрузите <strong>рационы</strong> в трюм флота (1 место на рацион), чтобы снабдить другую планету. При разгрузке хранилище не превышает свою ёмкость: излишек остаётся в трюме.</p>

            <h2 id="uranium">Уран: особый случай</h2>
            <p>Ни одно здание не производит уран. Вы получаете его:</p>
            <ul>
                <li><strong>перерабатывая</strong> обломки урана на карте (помечены специальной иконкой);</li>
                <li><strong>побеждая Ктулху</strong> (PvE-миссии);</li>
                <li><strong>выигрывая вызовы арены</strong> со ставкой урана.</li>
            </ul>
            <p>Уран нужен для производства <strong>ядерных бомб</strong> и ставок на <strong>арене</strong>.</p>

    buildings:
        title: "Здания"
        category: "economy"
        order: 2
        tags: "здания,строительство,шахта,экстрактор,ферма,город,верфь,бункер,турель"
        summary: "Полный каталог зданий по ролям: производство, хранение, население, военные, оборона."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Производство ресурсов</h2>
            <table>
                <tr><th>Здание</th><th>Производит</th><th>Замечание</th></tr>
                <tr><td>Шахта Ниобия</td><td>Ниобий</td><td>Первое, что нужно построить.</td></tr>
                <tr><td>Экстрактор воды</td><td>Вода</td><td>Необходима для всего.</td></tr>
                <tr><td>Ферма</td><td>Пища</td><td>Для кормления рабочих и Легионеров.</td></tr>
                <tr><td>Аэропонная ферма</td><td>Пища (продвинутая)</td><td>Эффективнее Фермы. Разблокируется исследованием.</td></tr>
            </table>

            <h2 id="stockage">Хранение</h2>
            <table>
                <tr><th>Здание</th><th>Роль</th></tr>
                <tr><td>Склад Ниобия</td><td>Увеличивает вместимость хранимого ниобия.</td></tr>
                <tr><td>Склад Воды</td><td>Увеличивает вместимость хранимой воды.</td></tr>
                <tr><td>Силосы</td><td>Увеличивают вместимость пищи.</td></tr>
            </table>

            <h2 id="population">Население и наука</h2>
            <table>
                <tr><th>Здание</th><th>Роль</th></tr>
                <tr><td>Город</td><td>+25&nbsp;000 максимум рабочих за уровень.</td></tr>
                <tr><td>Мегаполис</td><td>+80&nbsp;000 максимум рабочих за уровень.</td></tr>
                <tr><td>Исследовательский центр</td><td>Позволяет запускать исследования и увеличивать скорость.</td></tr>
            </table>

            <h2 id="militaire">Военные здания и производство кораблей</h2>
            <table>
                <tr><th>Здание</th><th>Роль</th></tr>
                <tr><td>Казарма</td><td>+5&nbsp;000 максимум Легионеров за уровень.</td></tr>
                <tr><td>Бункер</td><td>+15&nbsp;000 максимум Легионеров и <strong>защищает часть Ваших ресурсов</strong> от набегов (5&nbsp;% за уровень).</td></tr>
                <tr><td>Ядерная база</td><td>Позволяет производить ядерные бомбы (требуется уран).</td></tr>
                <tr><td>Космическая верфь</td><td>Производит утилитарные корабли (грузовые, зонды, переработчики…) и ускоряет производство всех кораблей (+25&nbsp;% за уровень).</td></tr>
                <tr><td>Лёгкий завод</td><td>Производит лёгкие корабли (истребители, корветы) и ускоряет производство кораблей (+40&nbsp;%/уровень) <strong>и обороны</strong> (+40&nbsp;%/уровень).</td></tr>
                <tr><td>Тяжёлый завод</td><td>Производит тяжёлые корабли (фрегаты, линкоры, эсминцы) и ускоряет производство кораблей (+60&nbsp;%/уровень) <strong>и обороны</strong> (+60&nbsp;%/уровень).</td></tr>
                <tr><td>Тюрьма</td><td>Содержит захваченных героев.</td></tr>
                <tr><td>Лагерь рабов</td><td>Альтернатива Тюрьме. Позволяет заставлять захваченных героев работать.</td></tr>
            </table>

            <h2 id="orbital">Оборона и орбитальные установки (в небе)</h2>
            <table>
                <tr><th>Здание / Установка</th><th>Роль</th></tr>
                <tr><td>Орбитальный остров</td><td>Добавляет слоты в небе для размещения турелей/щитов.</td></tr>
                <tr><td>Космическая база</td><td>Даёт бонус брони орбитальным обороне.</td></tr>
                <tr><td>Щит / Большой щит</td><td>Поглощает урон, прежде чем он достигнет оборонительных сооружений.</td></tr>
                <tr><td>Турели (ракетная, лазерная, Гаусса, плазменная…)</td><td>Защищают Вашу планету от флотов в режиме атаки.</td></tr>
            </table>

            <h2 id="detection">Обнаружение и глушение</h2>
            <table>
                <tr><th>Здание</th><th>Роль</th></tr>
                <tr><td>Радар</td><td>Обнаруживает приближающиеся флоты.</td></tr>
                <tr><td>Небесный радар</td><td>Орбитальная версия радара, с увеличенной дальностью.</td></tr>
                <tr><td>Небесный глушитель</td><td>Глушит вражеское обнаружение: Ваши перемещения становятся невидимыми.</td></tr>
            </table>

            <h2 id="file-production">Управление очередью производства</h2>
            <p>Строительство зданий, кораблей (Космическая верфь) и обороны проходит через <strong>очередь</strong>, которой Вы можете управлять:</p>
            <ul>
                <li><strong>Менять порядок</strong> ожидающих элементов (перетаскиванием), чтобы расставить приоритеты.</li>
                <li><strong>Отменять</strong> ожидающий элемент: Вам возвращается <strong>пропорциональный возврат</strong> за то, что ещё не было произведено.</li>
                <li>Текущая очередь отображается вверху каждой страницы производства, под заголовком.</li>
                <li>Очередь ограничена <strong>15 ожидающими элементами</strong> (сверх текущей стройки): при превышении лимита сообщение уведомит Вас о необходимости подождать завершения стройки или отменить одну из них перед добавлением новой.</li>
                <li><strong>Плавучий город</strong> (+10&nbsp;земли/уровень) и <strong>Орбитальная станция</strong> (+5&nbsp;неба/уровень) ограничены <strong>5 экземплярами на планету</strong> каждая.</li>
            </ul>

