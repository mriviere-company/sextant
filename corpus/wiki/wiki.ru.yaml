                    <tr><td>Аэропоника (1)</td><td>Аэропонная ферма; Сельскохозяйственный силос (с Управлением грузами 1).</td><td>—</td><td>16&nbsp;000; 8 мин</td></tr>
                    <tr><td>Городская перестройка (5)</td><td>Большой город (ур. 1), Мегаполис (ур. 5).</td><td>—</td><td>8&nbsp;000; 8 мин</td></tr>
                    <tr><td>Военное усиление (3)</td><td>Казарма (ур. 1), Оборонительный форт (ур. 3).</td><td>Городская перестройка 1</td><td>11&nbsp;700; 15 мин 30 с</td></tr>
                    <tr><td>Колючая проволока (5)</td><td>+5&nbsp;% к силе Ваших Легионеров в наземной обороне за уровень.</td><td>Военное усиление 3</td><td>200&nbsp;000; 20 мин</td></tr>
                    <tr><td>Тюремная система (1)</td><td>Тюрьма и Лагерь рабов.</td><td>Колючая проволока 5</td><td>350&nbsp;000; 1 ч</td></tr>
                    <tr><td>Бронированные единицы (1)</td><td>Мехи.</td><td>Военное усиление 3</td><td>40&nbsp;000; 33 мин 20 с</td></tr>
                    <tr><td>Территориальное расширение (2)</td><td>Плавучий город (ур. 1), Орбитальная станция (ур. 2): больше места на Ваших планетах.</td><td>Терраформирование 18</td><td>75&nbsp;000 Очков Войны; 1 ч 40 мин</td></tr>
                </tbody>
            </table>

            <h3>Оружие</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Что даёт</th><th>Требования</th><th>Уровень 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Вооружение (5)</td><td>Ракетное оружие (ур. 1), Лазерное оружие (ур. 3), Плазменное оружие (ур. 5). 5-й уровень нужен также для ядерных бомб и перехватчиков.</td><td>—</td><td>2&nbsp;000; 6 мин 10 с</td></tr>
                    <tr><td>Ракетное оружие (3)</td><td>Истребитель (ур. 1), Тяжёлый истребитель (ур. 2); 3-й уровень требуется для всех более крупных боевых кораблей.</td><td>Вооружение 1</td><td>2&nbsp;600; 7 мин 30 с</td></tr>
                    <tr><td>Лазерное оружие (3)</td><td>Фрегат и Лазерный корвет (ур. 1); более высокие уровни требуются для крейсеров, броненосцев и эсминцев.</td><td>Вооружение 3</td><td>13&nbsp;000; 30 мин</td></tr>
                    <tr><td>Плазменное оружие (3)</td><td>Плазменный фрегат (ур. 1), Крейсер (ур. 2), Броненосец и Эсминец (ур. 3).</td><td>Вооружение 5</td><td>29&nbsp;000; 1 ч 18 мин</td></tr>
                </tbody>
            </table>

            <h3>Космические</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Что даёт</th><th>Требования</th><th>Уровень 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Промышленность (5)</td><td>Космическая верфь и Истребитель (ур. 1), Лёгкие корабли (ур. 3), Тяжёлые корабли (ур. 5).</td><td>—</td><td>1&nbsp;500; 2 мин 30 с</td></tr>
                    <tr><td>Лёгкие корабли (3)</td><td>Оружейный завод (ур. 1), Корвет (ур. 2), Лазерный корвет (ур. 3).</td><td>Промышленность 3</td><td>9&nbsp;000; 14 мин 20 с</td></tr>
                    <tr><td>Тяжёлые корабли (3)</td><td>Тяжёлая промышленность (ур. 1), Броненосец (ур. 2), Эсминец (ур. 3).</td><td>Промышленность 5</td><td>42&nbsp;000; 20 мин</td></tr>
                </tbody>
            </table>
            <p>Кораблям нужно и своё здание (Космическая верфь, Оружейный завод или Тяжёлая промышленность): см. <a href="/wiki/ship_types">Типы кораблей</a>.</p>

            <h3>Политические</h3>
            <p>Будучи членом альянса, Вы получаете доступ ещё к 7 <strong>политическим исследованиям</strong>, которые зависят от строя Вашего альянса и его уровня — например, «Закон Макрона» (производство) или «Научная мобилизация» (скорость исследований) для Весов Миров. Они оплачиваются Вашими собственными Биткойнами: см. <a href="/wiki/alliance_research">Исследования альянса</a>.</p>

            <h2 id="modes-speciaux">Режимы сервера с максимальными исследованиями</h2>
            <p>В некоторых режимах (Battle Royale, Доминирование, Найти и уничтожить) все Ваши индивидуальные исследования начинаются с <strong>максимального уровня</strong>, а Ваша стартовая планета получает 500 урана. Остаётся только пройти политические исследования Вашего альянса.</p>

    workers_scientists:
        title: "Рабочие и учёные"
        category: "economy"
        order: 4
        tags: "рабочие,учёные,население,биткойн,доход,голод,оборона,скорость исследований"
        summary: "Два населения Вашей империи: рабочие, приносящие Биткойны, и учёные, повышающие скорость исследований."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Рабочие</h2>
            <p>Рабочие — Ваш <strong>главный источник Биткойнов</strong>. В ежедневном отчёте каждый рабочий, находящийся на Ваших планетах, приносит <strong>0,5 Биткойна</strong>: 10&nbsp;000 рабочих = 5&nbsp;000 Биткойнов в день, до вычета налогов альянса и мира. Рабочие, погруженные во флот, ничего не приносят. Содержания в Биткойнах они не требуют, только еду.</p>
            <p>Их <strong>максимальное число</strong> зависит от Ваших зданий:</p>
            <ul>
                <li><strong>Большой город</strong>: +25&nbsp;000 рабочих макс. и около +8&nbsp;000 рабочих в день за уровень.</li>
                <li><strong>Мегаполис</strong>: +80&nbsp;000 рабочих макс. и около +12&nbsp;000 рабочих в день за уровень.</li>
                <li><strong>Лагерь рабов</strong>: +2&nbsp;500 рабочих макс. за уровень.</li>
            </ul>
            <p>Ваша стартовая планета начинает на пределе (50&nbsp;000 рабочих при максимуме 50&nbsp;000): постройте Большой город, чтобы расти дальше.</p>
            <p>Население <strong>растёт само</strong> вплоть до предела в темпе, который задают Ваши Большие города и Мегаполисы (+20&nbsp;% за уровень исследования альянса «Семейная политика», вдвое медленнее под эмбарго). Еда рост не ускоряет, но если Ваши рационы падают до нуля, голод убивает часть Ваших рабочих.</p>

            <h2 id="scientifiques">Учёные</h2>
            <p>Чтобы нанимать учёных (страница <strong>Оборона</strong>), на планете нужен <strong>Исследовательский центр</strong>: каждый уровень вмещает 250 учёных. Каждый стоит при найме <strong>25 Биткойнов и 10 рабочих</strong>, затем <strong>3 Биткойна в день</strong> содержания (в 30 раз больше, чем Легионер на земле). Исследование альянса «Научный энтузиазм» снижает это содержание.</p>
            <p>Учёные нужны, чтобы повышать Вашу <strong>скорость исследований</strong>. В начале она равна 1, и длительность исследования делится на эту скорость (скорость 2 = исследования вдвое быстрее). Как она меняется:</p>
            <ul>
                <li>Она растёт <strong>целыми ступенями</strong>. Учёные прибывают по мере обучения, и прибытие даёт ступень, только если в нём <strong>не менее 5&nbsp;000 учёных одновременно</strong>. Меньшие прибытия скорость не меняют: на практике наём нескольких сотен учёных не сокращает Ваши исследования.</li>
                <li>Исследование альянса «Научная мобилизация» (Весы Миров) добавляет 0,1 скорости за уровень; но при следующем прибытии учёных скорость округляется до ближайшего целого.</li>
                <li>Длительность исследования фиксируется при его запуске: прирост скорости идёт на пользу только исследованиям, запущенным после него.</li>
            </ul>

            <h2 id="defense">Оборонительная роль</h2>
            <p>Ваши <strong>рабочие участвуют в наземной обороне</strong> — но только при <strong>вторжении</strong> (когда враг хочет захватить Вашу планету). Во время обычного <strong>рейда</strong> (простого грабежа) они остаются в укрытии.</p>
            <p>Исследование альянса «Идеологическое укрепление» (Безмолвный Оплот) повышает их оборону на 20&nbsp;% за уровень.</p>

            <h2 id="gerer">Как управлять населением</h2>
            <ul>
                <li>Ваши рабочие едят <strong>1 рацион в час на 500 рабочих</strong> (50&nbsp;000 рабочих = 100 рационов в час; Сельскохозяйственное поле 1-го уровня производит 162).</li>
                <li>Если амбар пуст, рационы, загруженные в Ваши собственные флоты на орбите планеты, расходуются автоматически.</li>
                <li>Затем наступает голод: Ваши рабочие умирают (сначала 0,5&nbsp;% за цикл в 10 минут, до 2&nbsp;%, если он длится более 8 часов), затем Ваши Легионеры и Мехи. Голод никогда не опускает планету ниже 5&nbsp;000 рабочих.</li>
                <li>Держите Сельскохозяйственные силосы полными, особенно перед лицом эмбарго (см. <a href="/wiki/embargo">Эмбарго и голод</a>).</li>
            </ul>

            <h2 id="reserve-5000">Неприкосновенный резерв в 5 000 рабочих</h2>
            <p>Ваши собственные действия <strong>никогда не могут опустить планету ниже 5 000 рабочих</strong>: любое действие, которое опустило бы её ниже, блокируется с понятным сообщением. Голод тоже останавливается на этом пороге; лишь вражеское вторжение может убить рабочих сверх него. Это касается:</p>
            <ul>
                <li><strong>Найма обороны</strong> (Легионеры, Мехи, учёные), расходующего рабочих.</li>
                <li><strong>Постройки кораблей</strong> на Космической верфи.</li>
                <li><strong>Загрузки рабочих в грузовой корабль</strong> для переброски.</li>
            </ul>
            <p>Кнопка «Макс» на страницах производства учитывает этот резерв: она никогда не предложит максимум, который опустил бы Вашу планету ниже порога.</p>
            <p>Внимание: новая колония начинает с 2&nbsp;500 рабочих. Тратить там рабочих Вы сможете, только когда будет превышено 5&nbsp;000.</p>

    market:
        title: "Рынок и торговцы"
        category: "economy"
        order: 5
        tags: "рынок,торговцы,продажа,торговля,карго,грузовой,биткойн,цены,очки войны"
        summary: "Продавайте ресурсы и войска торговцам за Биткойны, доставляя самостоятельно или в один клик, и обменивайте Очки Войны."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Кто такие торговцы?</h2>
            <p><strong>Неигровые персонажи</strong> (NPC), расположенные на фиксированных торговых планетах: по 20 в каждой галактике, в одних и тех же секторах в каждой галактике (четыре угла, центр и промежуточные позиции). Их положение видно на карте.</p>
            <p>Они покупают у Вас за Биткойны Ваш <strong>ниобий</strong>, Вашу <strong>воду</strong> и Ваш <strong>уран</strong>, а также <strong>рабочих</strong>, <strong>Легионеров</strong>, <strong>учёных</strong> и <strong>Мехов</strong>. Рационы они не покупают.</p>

            <h2 id="vendre">Как им продавать</h2>
            <ol>
                <li>Загрузите во флот (лучше всего в <strong>грузовой корабль</strong>) то, что хотите продать.</li>
                <li>Отправьте его к торговцу с миссией <strong>«Разгрузить и вернуться»</strong>. Топливо оплачивается Биткойнами: эта миссия стоит вдвое больше туда, а обратный путь оплачивается по обычному тарифу, когда флот отправляется назад.</li>
                <li>По прибытии весь продаваемый груз продаётся: Вы получаете Биткойны и немного Очков Войны. Рационы остаются на борту.</li>
                <li>Флот автоматически возвращается к Вам.</li>
            </ol>
            <p>Если орда Ктулху блокирует торговца, он отказывается от любых продаж, пока держится блокада.</p>

            <h2 id="vente-clic">Продажа в один клик, без флота</h2>
            <p>Страница <strong>Планеты</strong>, вкладка <strong>Продажа торговцам</strong>: добавьте в список нужные планеты (меню «Добавить»), затем нажмите <strong>Продать торговцам</strong>. Весь ниобий и вся вода этих планет продаются сразу, без грузовых кораблей и топлива, но <strong>на 20&nbsp;% дешевле</strong>, чем при самостоятельной доставке (0,10 Биткойна за ниобий, 0,25 за воду), и без Очков Войны. Планета, находящаяся под атакой или эмбарго, пропускается.</p>

            <h2 id="immunite">Торговцы неприкосновенны</h2>
            <p>Торговцы <strong>защищены от любых атак</strong>. Вы не можете ни совершать на них рейды, ни вторгаться к ним, ни сражаться с ними. Их флоты никогда не участвуют в бою, даже если находятся в той же точке, что и сражение.</p>
            <p>Но будьте осторожны: на серверах с PvE <strong>орда пришельцев в режиме атаки</strong> может стоять на орбите торговца (каждый торговец получает такую при создании галактики, мощнее к центру). Безоружный грузовой корабль, прибывший на эту орбиту, подвергается нападению и уничтожается, ничего не продав. Прежде чем отправлять грузовые корабли, убедитесь, что этого торговца не охраняет орда, или воспользуйтесь продажей в один клик.</p>

            <h2 id="gain">Сколько это приносит?</h2>
            <p>Базовые цены за единицу при самостоятельной доставке:</p>
            <table>
                <thead>
                    <tr><th>Товар</th><th>Биткойнов за единицу</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ниобий</td><td>0,125 (1&nbsp;000 ниобия = 125)</td></tr>
                    <tr><td>Вода</td><td>0,3125 (1&nbsp;000 воды = 312)</td></tr>
                    <tr><td>Уран</td><td>2&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>Погруженные войска и рабочие тоже покупаются; сумма каждой продажи указана в отчёте «Продажа торговцам». Вода приносит в 2,5 раза больше, чем ниобий. Исследование альянса «Торговые соглашения» (Весы Миров) добавляет 5&nbsp;% за уровень, до +25&nbsp;%, а герой Экономики 10-го уровня (черта «Торговец») добавляет 15&nbsp;% к продажам, которые он сопровождает: к продажам своего флота или своей планеты при продаже в один клик. Вкладка «Продажа торговцам» страницы «Планеты» показывает Ваши реальные цены.</p>

            <h2 id="astuce">Совет</h2>
            <p>Вместо того чтобы позволять запасам переполняться, продавайте регулярно: отправляйте хорошо загруженный грузовой корабль (топливо оплачивается Биткойнами, один большой груз лучше нескольких маленьких) или пользуйтесь продажей в один клик, чтобы финансировать исследования или армию.</p>

            <h2 id="points-de-guerre">Обмен Очков Войны</h2>
            <p>Страница <strong>Цели</strong>, где перечислены Ваши задания на сегодня, позволяет также тратить Очки Войны: <strong>1 ОВ = 1 Биткойн</strong>, <strong>2 Легионера</strong> или <strong>10 рабочих</strong>, доставляемые на выбранную Вами планету в пределах её лимитов.</p>

    recycling:
        title: "Переработка"
        category: "economy"
        order: 6
        tags: "переработка,обломки,пр,переработчик,астероид,уран"
        summary: "После каждого боя остаются обломки. Собирать их — всё равно что открытая шахта."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Обломки: что это?</h2>
            <p>Каждый корабль, уничтоженный в бою, оставляет часть своей стоимости в виде <strong>обломков</strong>, плавающих в космосе. Это называется <strong>ПР</strong> (поле ресурсов).</p>
            <p>Поле, оставшееся после боя, содержит <strong>ниобий</strong> и <strong>воду</strong>, но никогда не уран. Оно остаётся на месте схватки, каким бы оно ни было (планета, пустая позиция…), и на карте его отмечает значок.</p>
            <p>Существуют также <strong>астероидные поля</strong>, которые появляются на карте сами. Их три вида: ниобий, вода или <strong>уран</strong>. Они пополняются каждые 7–40 часов и иногда меняют место:</p>
            <ul>
                <li>ниобий: от 40&nbsp;000 до 800&nbsp;000 за пополнение;</li>
                <li>вода: от 30&nbsp;000 до 500&nbsp;000 за пополнение;</li>
                <li>уран: от 50 до 180 за пополнение.</li>
            </ul>
            <p>Их часто охраняет флот пришельцев, нападающий на любого прибывшего.</p>

            <h2 id="skolko">Сколько обломков?</h2>
            <p>Поле содержит <strong>40&nbsp;% стоимости постройки по-настоящему уничтоженных кораблей</strong> обеих сторон. Каждый корабль возвращает свои собственные ресурсы: Эсминец (2&nbsp;100 ниобия, 6&nbsp;000 воды) оставляет в основном воду. Уцелевшие ничего не оставляют.</p>
            <p>Три особых случая:</p>
            <ul>
                <li>Против орд <strong>Ктулху</strong> доля падает до <strong>20&nbsp;%</strong>.</li>
                <li><strong>Груз</strong> (ниобий и вода) полностью уничтоженного флота тоже высыпается в поле, из расчёта 40&nbsp;%. Потрёпанный победитель же сохраняет весь свой трюм.</li>
                <li>Корабли, оплачиваемые <strong>очками войны</strong> (Плазменный истребитель, Боевой корвет, Боевой корабль, Каравелла), не оставляют <strong>никаких</strong> обломков, так как не стоят ни ниобия, ни воды. Разрушенная <strong>планетарная оборона</strong> их тоже никогда не оставляет.</li>
            </ul>
            <p><strong>Орбитальный бой</strong> (флот, сбитый турелями планеты в режиме атаки, или корабли, потерянные при прорыве защищённой орбиты) оставляет поле по тому же правилу.</p>

            <h2 id="comment">Как перерабатывать</h2>
            <ol>
                <li>Исследуйте <strong>Орбитальную переработку</strong> (страница <em>Исследования</em>, требует <em>Утилитарные корабли</em> 3-го уровня).</li>
                <li>Изготовьте <strong>переработчики</strong> на Вашей Космической верфи (по 2&nbsp;200 ниобия, 1&nbsp;000 воды и 10 рабочих каждый).</li>
                <li>Создайте флот из переработчиков и добавьте грузовые корабли для трюма (см. ниже).</li>
                <li>Отправьте его на координаты поля с миссией <strong>Обычный</strong>. На <em>Космической карте</em>: нажмите на позицию, затем <em>Взаимодействие</em>, выберите флот и миссию <em>Обычный</em>, затем <em>Отправить</em>. Специальной миссии переработки нет.</li>
                <li>По прибытии переработка начинается сама: первый сбор сразу, затем один каждые <strong>5 минут</strong>.</li>
                <li>Когда трюм заполнен или поле пусто, переработка прекращается, и Вы получаете отчёт «Ваш флот завершил переработку!». <strong>Флот остаётся на месте</strong>: возвращать его нужно Вам. Кнопка <em>Переработать</em> у флота возобновляет переработку, если в нём осталось место.</li>
            </ol>
            <p>Флот, ожидающий на астероидном поле, возобновляет переработку сам при каждом пополнении поля, пока в нём есть место.</p>

            <h2 id="capacite">Сколько может увезти переработчик?</h2>
            <p>При каждом проходе каждый переработчик собирает <strong>1&nbsp;000 ресурсов</strong>, поровну распределённых между ресурсами, имеющимися в поле (ниобий, вода, уран).</p>
            <p><strong>Внимание: у переработчика трюм всего на 1&nbsp;000.</strong> Поэтому в одиночку он заполняется уже при первом проходе. Чтобы опустошить большое поле, добавьте к флоту грузовые корабли: их трюм заполняется в темпе Ваших переработчиков.</p>
            <table>
                <thead>
                    <tr><th>Корабль</th><th>Трюм</th></tr>
                </thead>
                <tbody>
                    <tr><td>Переработчик</td><td>1&nbsp;000</td></tr>
                    <tr><td>Карго I</td><td>3&nbsp;000</td></tr>
                    <tr><td>Карго V</td><td>10&nbsp;000</td></tr>
                    <tr><td>Карго X</td><td>25&nbsp;000</td></tr>
                    <tr><td>Каравелла</td><td>40&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>Исследование альянса <strong>Улучшенные карго</strong> увеличивает трюм грузовых кораблей и Каравеллы.</p>
            <p>Примеры:</p>
            <ul>
                <li>5 переработчиков в одиночку: 5&nbsp;000 ресурсов собрано сразу по прибытии, затем флот полон.</li>
                <li>1 переработчик + 2 Карго I (трюм 7&nbsp;000): 1&nbsp;000 за проход, то есть 5&nbsp;000 ресурсов за 20 минут (по прибытии, затем на 5-й, 10-й, 15-й и 20-й минутах).</li>
                <li>10 переработчиков + 5 Карго V (трюм 60&nbsp;000): 10&nbsp;000 за проход, флот полон на 6-м проходе, то есть примерно за 25 минут.</li>
            </ul>
            <p>Исследование альянса <strong>Оптимизация переработки</strong> (строй <em>Безмолвный Оплот</em>) добавляет 400 ресурсов на переработчик за проход на каждом уровне, до 3&nbsp;000 на 5-м уровне. Оно не увеличивает трюм переработчиков: предусмотрите грузовые корабли, чтобы воспользоваться им.</p>

            <h2 id="strategie">Стратегия</h2>
            <ul>
                <li>После каждого боя немедленно отправляйте переработчики: иначе их получат Ваши противники.</li>
                <li>Защищайте их: одинокий переработчик — лёгкая цель, а астероидные поля часто охраняются.</li>
                <li>Бои никогда не оставляют уран: перерабатывайте <strong>астероидные поля урана</strong> (от 50 до 180 единиц за пополнение) или освобождайте базы пришельцев.</li>
                <li>Переработка очень выгодна: думайте о ней как о второй экономике за Вашими шахтами.</li>
            </ul>

    daily_report:
        title: "Ежедневный отчёт"
        category: "economy"
        order: 7
        tags: "отчёт,ежедневный,дневной,итог,баланс,доходы,расходы,налог"
        summary: "Каждый день в 18:59 (по парижскому времени) игра подводит Ваш итог: доходы, расходы, налоги. За этим нужно внимательно следить."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Когда это происходит</h2>
            <p>Каждый день в <strong>18:59 (по парижскому времени)</strong>, то есть в 17:59 UTC зимой и в 16:59 UTC летом. Это фиксированное время для всех игроков сервера.</p>
            <p>Вы получаете «Рапорт империи» на странице <strong>Отчёт</strong>, вкладка <strong>Экономические</strong>.</p>

            <h2 id="contenu">Что содержит отчёт</h2>
            <ul>
                <li><strong>Доходы</strong> — 0,5 Биткойна за каждого рабочего, находящегося на Ваших планетах в момент отчёта.</li>
                <li><strong>Расходы на содержание</strong> — Легионеры, Мехи, учёные, корабли, здания. Всё, что находится во флоте, даже на стоянке на орбите, стоит гораздо дороже, чем то, что на земле (тарифы в <a href="/wiki/bitcoin_economy#bareme">Биткойны и содержание</a>).</li>
                <li><strong>Налог мира</strong> — если Ваш альянс подписал мир, по которому должен платить налог другому альянсу: этот процент удерживается с дохода Ваших рабочих.</li>
                <li><strong>Налог альянса</strong> — удерживается с дохода Ваших рабочих и перечисляется в казну Вашего альянса. При ставке t&nbsp;% удерживаемая доля равна доход × t ÷ (100 + t): ставка 10&nbsp;% забирает около 9&nbsp;% Вашего дохода.</li>
                <li><strong>Итоговый баланс</strong> — доходы − налоги − расходы, прибавляется к Вашему балансу.</li>
                <li><strong>Угроза Ктулху</strong> — если Ктулху активны для Вас, угроза, нависшая над Вашей империей, возрастает на 5 пунктов (максимум 300).</li>
            </ul>

            <h2 id="quetes">Ежедневные задания</h2>
            <p>Ежедневный отчёт <strong>обновляет Ваши 3 задания</strong> на день: вчерашние, которые Вы не завершили, исчезают. Найти их можно на странице <strong>Цели</strong> (см. <a href="/wiki/quests">Ежедневные задания</a>).</p>

            <h2 id="danger">Опасность, за которой нужно следить</h2>
            <p>Если после отчёта Ваш баланс становится <strong>отрицательным</strong>, наступает <strong>экономический Game Over</strong>: все Ваши флоты и все корабли на земле на Ваших планетах теряются, а баланс сбрасывается до 125&nbsp;000 Биткойнов (Ваши планеты, здания и исследования не затрагиваются). Отчёт «Надвигающееся банкротство» предупреждает Вас заранее, не чаще раза в день.</p>
            <p>Проверяйте свой отчёт каждый день. Если Ваши расходы растут слишком сильно: опустите на землю флоты, которые не используются (их содержание делится на 6), замедлите наём, продайте торговцам войска или ресурсы.</p>

    exchange:
        title: "Обмен между игроками"
        category: "economy"
        order: 8
        tags: "обмен,альянс,ресурсы,биткойн,дар,передача,доставка,уран,разгрузка"
        summary: "Как отправлять ресурсы другому игроку или Биткойны союзнику и каковы ограничения."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Area Universe позволяет отправлять ресурсы <strong>любому игроку</strong> флотом, а Биткойны — членам Вашего альянса через казну. Это очень полезно, чтобы:</p>
            <ul>
                <li>Поднять на ноги союзника, которого только что ограбили.</li>
                <li>Объединить усилия на дорогом строительстве.</li>
                <li>Снабдить члена Вашего альянса, находящегося под эмбарго.</li>
            </ul>

            <h2 id="ressources">Отправка физических ресурсов</h2>
            <p>Загрузите то, что хотите доставить, в трюм флота: ниобий, воду, рационы, уран, а также рабочих, Легионеров, учёных или Мехов. Затем отправьте его с миссией <strong>«Разгрузить и вернуться»</strong> на планету получателя.</p>
            <p>По прибытии всё выгружается в пределах возможностей планеты (хранилище, лимиты Легионеров, рабочих и учёных, не более 500 Мехов); излишек остаётся на борту. Флот возвращается сам, а получатель получает отчёт о доставке.</p>

            <h2 id="bitcoins">Отправка Биткойнов</h2>
            <p>Биткойны переводятся через <strong>казну альянса</strong> (см. <a href="/wiki/alliance_treasury">Казна альянса</a>): Вы вносите туда, затем член, которому нужно помочь, запрашивает вывод на своё имя. Вывод мгновенный для члена с разрешением «Изменить» (и для всех в альянсе Безмолвного Оплота); иначе он ждёт одобрения члена, у которого есть это разрешение.</p>

            <h2 id="limites">Ограничения</h2>
            <ul>
                <li><strong>Никакого ежедневного лимита</strong> и потолка отправки нет: значение имеют только вместимость трюма Ваших флотов (Карго I: 3&nbsp;000 мест, Карго V: 10&nbsp;000, Карго X: 25&nbsp;000, 1 место на единицу и 500 на Меха) и вместимость хранилища планеты прибытия.</li>
                <li>Ресурсы обязательно путешествуют флотом: нужны время и топливо, оплачиваемое Биткойнами. Миссия «Разгрузить и вернуться» стоит вдвое больше туда, а обратный путь оплачивается по обычному тарифу, когда флот отправляется назад.</li>
                <li>Планета под <strong>эмбарго</strong> может получать доставки только от своего владельца или от члена того же альянса.</li>
                <li>Уран перевозится как всё остальное, и у принимающей его планеты нет предела хранения урана.</li>
            </ul>

    fleet_creation:
        title: "Создать и отправить флот"
        category: "fleet"
        order: 1
        tags: "флот,создание,корабли,состав,верфь,миссия"
        summary: "От изготовления корабля до его прибытия в пункт назначения: весь путь."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Что Вам нужно</h2>
            <ul>
                <li><strong>Космическая верфь</strong> на Вашей активной планете.</li>
                <li>Ресурсы для корабля: чаще всего ниобий, вода и рабочие, иногда Очки Войны, Биткойны или Легионеры (таблица в статье <em>Типы кораблей</em>).</li>
                <li>Исследования, необходимые для нужного корабля (например, <em>Управление грузами</em> для грузовых кораблей).</li>
            </ul>

            <h2 id="fabriquer">Шаг 1 — Изготовить корабли</h2>
            <p>На странице <strong>Космическая верфь</strong> (вкладка <strong>Строительство кораблей</strong>) выберите модель и количество, затем нажмите <strong>Построить</strong>. Производство идёт в фоновом режиме; у каждого корабля есть базовая длительность, сокращаемая космическим производством планеты.</p>

            <h2 id="composer">Шаг 2 — Составить флот</h2>
            <p>Когда корабли доставлены, перейдите на страницу <strong>Флоты</strong> и нажмите <strong>Создать новый флот</strong>: выберите корабли для погрузки и название (не более 12 символов). Затем откройте флот (нажатие на его название), чтобы:</p>
            <ul>
                <li>Добавлять или убирать корабли (вкладка <strong>Корабли</strong>, кнопка <strong>Управление</strong>), когда флот находится на одной из Ваших планет.</li>
                <li>Загружать <strong>ресурсы</strong> (вкладка <strong>Груз</strong>), когда флот находится на одной из Ваших планет.</li>
                <li>Брать на борт <strong>Легионеров</strong> или Мехов (вкладка <strong>Груз</strong>) для рейда или вторжения: каждый Легионер занимает 1 место в трюме, каждый Мех — 500, а высаживают их баржи.</li>
            </ul>

            <h2 id="envoyer">Шаг 3 — Отправить флот</h2>
            <ol>
                <li>Выберите <strong>пункт назначения</strong>: во вкладке <strong>Переместить флот</strong> (поля галактики, системы и планеты в формате <code>Галактика:Сектор:Позиция</code> или список «Мои планеты») либо нажав на клетку на <strong>Космической карте</strong>, затем <strong>Взаимодействие</strong>.</li>
                <li>Выберите <strong>тип миссии</strong> (Обычный, Разгрузить и вернуться, Зонд, Колонизировать, Грабить, Вторгнуться… см. <em>Типы миссий</em>). Вкладка <strong>Переместить флот</strong> нужна для простых перемещений (Обычный) и шпионажа; остальные миссии отправляются с Космической карты.</li>
                <li>Во вкладке <strong>Переместить флот</strong> проверьте предполагаемые стоимость топлива (в <strong>Биткойнах</strong>) и длительность.</li>
                <li>Нажмите <strong>Отправить</strong>.</li>
            </ol>
            <p>Флот появляется в Вашем списке флотов в полёте. В течение <strong>первых 2 минут</strong> кнопка ✕ с обратным отсчётом (или строка <strong>Отмена</strong> на его странице) позволяет <strong>отменить отправку</strong>: флот тут же возвращается на планету отправления, но оплаченное топливо не возвращается. По истечении этого срока он долетит до конца.</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li><strong>Переработчик</strong> в атакующем флоте собирает обломки сразу по окончании боя, но замедляет флот: флот идёт со скоростью переработчика, втрое медленнее истребителя. Для быстрого удара отправляйте переработчики отдельно, после окончания боя.</li>
                <li>Никогда не отправляйте всю свою оборону сразу: оставьте достаточно, чтобы удержать свою планету.</li>
                <li>Только миссия <strong>Разгрузить и вернуться</strong> возвращает флот сама, и это возвращение оплачивается Биткойнами, как обычный перелёт. После любой другой миссии флот остаётся на орбите пункта назначения: чтобы вернуть его, нужна новая отправка с собственным топливом.</li>
            </ul>

    ship_types:
        title: "Типы кораблей"
        category: "fleet"
        order: 2
        tags: "корабли,истребитель,корвет,фрегат,броненосец,крейсер,эсминец,грузовой,карго,зонд,лунар,каравелла,переработчик,стоимость,скорость,требования"
        summary: "Все корабли игры: роль, стоимость, скорость, трюм, требования и боевые характеристики."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Утилитарные корабли</h2>
            <p>У них нет оружия. Они нужны для перевозки, разведки, переработки, колонизации.</p>
            <table>
                <tr><th>Корабль</th><th>Роль</th><th>Вместимость</th></tr>
                <tr><td>Зонд</td><td>Шпионить за планетой.</td><td>—</td></tr>
                <tr><td>Карго I</td><td>Лёгкая перевозка.</td><td>3&nbsp;000</td></tr>
                <tr><td>Карго V</td><td>Средняя перевозка.</td><td>10&nbsp;000</td></tr>
                <tr><td>Карго X</td><td>Крупная перевозка.</td><td>25&nbsp;000</td></tr>
                <tr><td>Каравелла</td><td>Премиальный грузовой корабль: самый большой и самый быстрый из грузовых. Оплачивается Очками Войны (25) + 15&nbsp;рабочими за единицу.</td><td>40&nbsp;000</td></tr>
                <tr><td>Колонизатор</td><td>Основать колонию на необитаемой планете.</td><td>—</td></tr>
                <tr><td>Переработчик</td><td>Собирать боевые обломки: 1&nbsp;000 за цикл в 5 мин (больше с исследованием альянса <em>Оптимизация переработки</em>). Его собственный трюм вмещает лишь 1&nbsp;000: добавьте к флоту грузовые корабли, чтобы собирать больше.</td><td>1&nbsp;000</td></tr>
                <tr><td>Десантная баржа</td><td>Перевозить Легионеров для рейда или вторжения.</td><td>1&nbsp;000 Легионеров</td></tr>
                <tr><td>Лунар (иногда называется Moon Maker)</td><td>Создать луну на пустой клетке с достаточным количеством обломков (не менее 2 млн ниобия и 2 млн воды).</td><td>—</td></tr>
                <tr><td>Радарный корабль</td><td>Разворачивается на пустой клетке и устанавливает там радар (мощность 1) на 2&nbsp;ч: тогда Вы видите этот сектор.</td><td>—</td></tr>
                <tr><td>Корабль-глушитель</td><td>Разворачивается на пустой клетке и устанавливает там глушитель (мощность 1) на 1&nbsp;ч.</td><td>—</td></tr>
                <tr><td>Материнский корабль</td><td>Флагман, один на командира. В бою он даёт своему флоту 20&nbsp;000 корпуса и 5&nbsp;000 щита, затем +5&nbsp;% корпуса и щита и +10&nbsp;% точности. Он сокращает на 10&nbsp;% время полёта своего флота и снижает его сигнатуру на 10&nbsp;%, но сам летит со скоростью 250 люменов, медленнее истребителя.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Боевые корабли</h2>
            <p>Боевые корабли различаются корпусом, щитом и оружием (ракетным, лазерным, плазменным). В бою мощь всего Вашего флота суммируется: ни дальности, ни бонуса одного типа корабля против другого нет. Важны два правила:</p>
            <ul>
                <li>три истребителя <strong>не имеют щита</strong> и принимают урон первыми: они защищают крупные корабли;</li>
                <li><strong>лазер</strong>, а особенно <strong>плазма</strong>, лучше пробивают вражеские щиты, чем ракета.</li>
            </ul>
            <p>Базовые значения по каждому кораблю, до Ваших улучшений (статья <em>Настройка Ваших кораблей</em>). Столбец «Оружие» даёт ракета / лазер / плазма; «—»: у корабля нет этой характеристики.</p>
            <h3>Истребители и корветы</h3>
            <table>
                <tr><th>Корабль</th><th>Корпус</th><th>Щит</th><th>Оружие</th><th>Очки</th></tr>
                <tr><td>Истребитель</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Тяжёлый истребитель</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Плазменный истребитель</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Корвет</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Лазерный корвет</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Боевой корвет</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Фрегаты и тяжёлые корабли</h3>
            <table>
                <tr><th>Корабль</th><th>Корпус</th><th>Щит</th><th>Оружие</th><th>Очки</th></tr>
                <tr><td>Фрегат</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Плазменный фрегат</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Боевой корабль</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Крейсер</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Броненосец</td><td>1&nbsp;250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Эсминец</td><td>2&nbsp;600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>«Очки»: кредит очков улучшения модели. У <strong>Плазменного истребителя</strong> и <strong>Боевого корабля</strong> в начале <strong>нет никакого оружия</strong>: оно целиком берётся из очков, которые Вы им назначаете.</p>

            <h2 id="factions">Бонус +20&nbsp;%: политика альянса</h2>
            <p>«Фракции» кораблей не существует. Единственный бонус +20&nbsp;% в космическом бою идёт от <strong>политики Вашего альянса</strong>: Весы Миров побеждают Безмолвный Оплот, который побеждает Молот Звёзд, который побеждает Весы Миров.</p>
            <p>Когда политика <strong>атакующего</strong> побеждает политику защитника, всё его оружие (ракетное, лазерное, плазменное) получает +20&nbsp;% на этот бой; защитник никогда этим не пользуется. У игрока без альянса нет ни бонуса, ни штрафа.</p>

            <h2 id="bonus-cargo">Грузоподъёмность</h2>
            <p>Вместимость грузовых кораблей (Карго I, V, X и Каравеллы) растёт на <strong>+20&nbsp;% за уровень</strong> исследования альянса <strong>Улучшенные карго</strong> (5 уровней, альянс не ниже 3-го уровня). На 5-м уровне Карго I перевозит 6&nbsp;000 вместо 3&nbsp;000. Трюмы остальных кораблей не меняются.</p>

            <h2 id="reference">Справочная таблица</h2>
            <h3>Стоимость и производство</h3>
            <p>Стоимость корабля. Длительность — это базовая длительность производства одной единицы, сокращаемая космическим производством Вашей планеты.</p>
