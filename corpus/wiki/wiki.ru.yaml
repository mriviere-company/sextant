                <tr><td>Лунар</td><td>50&nbsp;000 ниобия, 23&nbsp;000 воды, 20&nbsp;000 рабочих, 200&nbsp;000 Биткойнов</td><td>5 ч</td></tr>
                <tr><td>Материнский корабль</td><td>17&nbsp;500 ниобия, 9&nbsp;500 воды, 2&nbsp;000 рабочих, 25&nbsp;000 Очков Войны</td><td>3 ч 53 мин</td></tr>
