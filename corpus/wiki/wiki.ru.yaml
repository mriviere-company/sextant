            <h2 id="couts">Стоимость зданий</h2>
            <p>Стоимость и длительность уровня <strong>пропорциональны целевому уровню</strong>: уровень N стоит N раз по базовой стоимости и длится N раз по базовой длительности. Пример: Шахта Niobium 4-го уровня стоит 4 × 45 = 180 ниобия и 4 × 20 = 80 воды за 4 × 3 = 12 минут. Если уровень того же здания уже в очереди, следующий оплачивается по уровню выше.</p>
            <p>Базовые значения (уровень 1). «Место» = места, занимаемые на земле / в небе за уровень.</p>

