            <p>Пример: Лунар очень медлителен, а его сигнатура 10&nbsp;000 делает его перелёт дорогим. До соседнего сектора он летит 25 минут и стоит около 50 Биткойнов топлива; до другой галактики — 2 ч 30 мин и 1&nbsp;250 Биткойнов.</p>

            <h3>Требования</h3>
            <p>Исследования, которые нужно получить, и здание, которое нужно построить на производящей планете:</p>
            <ul>
                <li>Без исследований: Зонд, Каравелла, Плазменный истребитель, Боевой корвет, Боевой корабль.</li>
                <li>Карго I / V / X: Управление грузами 1-го / 3-го / 5-го уровня.</li>
                <li>Колонизатор: Терраформирование 1-го уровня. Лунар: Терраформирование 15-го уровня + Тяжёлая промышленность.</li>
                <li>Переработчик: Орбитальная переработка. Десантная баржа: Планетарное вторжение.</li>
                <li>Радарный корабль: Сканер системы 3-го уровня + Оружейный завод. Корабль-глушитель: Сканер системы 5-го уровня + Оружейный завод.</li>
                <li>Материнский корабль: Утилитарные корабли 3-го уровня + Тяжёлая промышленность (один на командира).</li>
                <li>Истребитель: Промышленность 1-го уровня + Ракетное оружие 1-го уровня. Тяжёлый истребитель: Ракетное оружие 2-го уровня + Оружейный завод.</li>
                <li>Корвет: Ракетное оружие 3-го уровня + Лёгкие корабли 2-го уровня + Оружейный завод. Лазерный корвет: Ракетное оружие 3 + Лазерное оружие 1 + Лёгкие корабли 3 + Оружейный завод.</li>
                <li>Фрегат: Ракетное оружие 3 + Лазерное оружие 1 + Тяжёлая промышленность. Плазменный фрегат: то же + Плазменное оружие 1.</li>
                <li>Крейсер: Ракетное оружие 3 + Лазерное оружие 2 + Плазменное оружие 2 + Тяжёлая промышленность.</li>
                <li>Броненосец: все три вида оружия 3-го уровня + Тяжёлые корабли 2 + Тяжёлая промышленность. Эсминец: все три вида оружия 3-го уровня + Тяжёлые корабли 3 + Тяжёлая промышленность.</li>
            </ul>

    ship_customization:
        title: "Настройка Ваших кораблей"
        category: "fleet"
        order: 3
        tags: "настройка,улучшение,корабли,очки,корпус,щит,точность,оружие"
        summary: "До 40 очков в день, чтобы усилить корпус, щит, оружие и точность Ваших боевых кораблей."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>У каждого из 12 боевых кораблей есть свой <strong>кредит очков улучшения</strong>: 3 у Истребителя, 676 у Эсминца, 1&nbsp;465 на все модели вместе. Вы тратите их на его характеристики:</p>
            <ul>
                <li><strong>Корпус</strong> — сколько он может выдержать (+5 за очко).</li>
                <li><strong>Щит</strong> — поглощает часть выстрелов (+1 за очко; у истребителей его нет).</li>
                <li><strong>Ракета</strong>, <strong>Лазер</strong>, <strong>Плазма</strong> — его оружие (+3, +2 и +1 за очко) в зависимости от того, что есть у корабля.</li>
                <li><strong>Точность</strong> — повышает худший возможный результат каждого залпа (+1 за очко; ни один выстрел никогда не промахивается, но плохо наведённый выстрел наносит меньше урона).</li>
            </ul>
            <p>Вы можете тратить <strong>не более 40 очков в день</strong> на все корабли вместе. Как только Вы потратили эти 40 очков, запускается обратный отсчёт в 24&nbsp;ч; по его окончании Вы снова получаете 40. Нетраченные очки не копятся сверх 40: не забывайте заходить каждый день.</p>
            <p>Улучшаются только боевые корабли: у грузовых кораблей, переработчиков, зондов и других утилитарных кораблей очков нет.</p>

            <h2 id="utiliser">Как ими пользоваться</h2>
            <p>Перейдите на страницу <strong>Космическая верфь</strong>, вкладка <strong>Улучшите свои корабли!</strong> (пункт меню загорается зелёным, когда у Вас есть очки для траты). Для каждой модели введите число очков, которое нужно вложить в каждую характеристику (прирост отображается рядом), затем нажмите <strong>Применить</strong>. Ваш выбор применяется ко <strong>всем кораблям этой модели</strong> (нынешним и будущим). Эти характеристики растут независимо друг от друга: очки, вложенные в корпус или оружие модели, никогда не снижают её точность.</p>

            <h2 id="chtenie">Как читать свою точность стрельбы на экране</h2>
            <p>Вкладка <strong>Статистика</strong> Космической верфи показывает, модель за моделью, вложенную Вами точность стрельбы из кредита этой модели (например, <code>676 / 676</code> для Эсминца) и вытекающий из неё <strong>множитель урона</strong>&nbsp;: <strong>×0,94</strong> при полной точности, <strong>×0,66</strong> без единого вложенного очка.</p>
            <p>Это не вероятность попадания&nbsp;: <strong>ни один выстрел никогда не промахивается</strong>. Лучшая точность повышает нижнюю границу Вашего урона, но никогда не верхнюю. Это то же число, что на Вашей странице управления флотом, во вкладке «Оборона» и в Ваших боевых рапортах — четыре экрана наконец можно сравнивать напрямую. Для ориентира: оборона планеты стреляет с <strong>×1,06</strong>, то есть лучше, чем флот с полной точностью.</p>

            <h2 id="maximum">Сколько очков нужно для максимума?</h2>
            <p><strong>Точность</strong> достигает максимума, когда Вы вкладываете в неё <strong>весь кредит модели</strong>: 3 очка для Истребителя, 5 для Тяжёлого истребителя, 21 для Плазменного истребителя и Лазерного корвета, 23 для Корвета, 34 для Боевого корвета, 61 для Плазменного фрегата, 64 для Фрегата, 118 для Крейсера, 160 для Боевого корабля, 279 для Броненосца и 676 для Эсминца. Это выбор: всё в точность или всё в орудия и корпус.</p>
            <p>У остальных характеристик максимума нет, только предел кредита. Пример: 676 очков Эсминца, вложенные в корпус, добавляют ему 3&nbsp;380 очков корпуса (с 2&nbsp;600 до 5&nbsp;980). При 40 очках в день на то, чтобы потратить кредит Эсминца, уйдёт 17 дней, а на 1&nbsp;465 очков всех моделей — 37 дней.</p>

            <h2 id="reset">Сбросы</h2>
            <p>Вы можете сбрасывать свои очки <strong>раз в 96 часов</strong>, без ограничения по числу раз: если Ваша стратегия изменится или боевой движок обновится, все потраченные очки возвращаются в кредит каждой модели. После сброса кнопка остаётся серой, а обратный отсчёт показывает время до следующего.</p>
            <p>Сразу после сброса строка «Вы можете потратить ещё … очков сегодня» показывает Ваши потраченные очки минус 90, плюс то, что Вам оставалось потратить в этот день, но не менее 40. Остальное возвращается затем в обычном темпе по 40 в день. Примеры: если Вы потратили все 1&nbsp;465 очков и сегодня больше ничего, Вы можете сразу вложить заново 1&nbsp;375; если Вы потратили 300, можете вложить заново 210.</p>

            <h2 id="modes-speciaux">Режимы сервера с максимальными исследованиями</h2>
            <p>В некоторых режимах (Battle Royale, Доминирование, Найти и уничтожить) <strong>все Ваши очки разблокированы с первого дня</strong>: все 1&nbsp;465 очков доступны сразу, а не по 40 в день.</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li>Не распыляйте очки на слишком много моделей: сосредоточьтесь на тех, которые Вы действительно используете массово.</li>
                <li>У <strong>Плазменного истребителя</strong> и <strong>Боевого корабля</strong> изначально нет никакого оружия: без очков в оружии они не стреляют.</li>
                <li>У <strong>Истребителя</strong> всего 3 очка: их хватает, чтобы довести его точность до максимума.</li>
                <li>Грузовые корабли и переработчики улучшить нельзя: чтобы защитить их, отправляйте с ними вооружённый эскорт.</li>
            </ul>

    fleet_missions:
        title: "Типы миссий"
        category: "fleet"
        order: 4
        tags: "миссия,атака,перевозка,колонизация,переработка,шпионаж,ядерная,рейд,вторжение"
        summary: "Каждая миссия отдаёт Вашему флоту свой приказ. Вот как выбрать подходящую."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Когда Вы отправляете флот, Вы задаёте ему <strong>тип миссии</strong>. Именно миссия определяет, что произойдёт по прибытии. Некоторым типам нужны определённые корабли.</p>
            <p>Все миссии отправляются с <strong>Космической карты</strong>: нажмите на нужную клетку, затем <strong>Взаимодействие</strong>, выберите флот и миссию и нажмите <strong>Отправить</strong>. В списке предлагаются только миссии, возможные на этой клетке. Вкладка <strong>Переместить флот</strong> на странице флота нужна для простых перемещений (Обычный) и шпионажа.</p>

            <h2 id="missions">Доступные типы</h2>
            <table>
                <tr><th>Миссия (название в игре)</th><th>Что она делает</th><th>Требуемые корабли</th></tr>
                <tr><td><strong>Обычный</strong></td><td>Флот отправляется в заданную точку и остаётся там на орбите. Бой начинается через 5 минут после прибытия, если флот в режиме атаки (Ваш или уже находящийся там) сталкивается с противником, если Ваши альянсы воюют или если заданная планета находится в режиме атаки (её оборона стреляет). Подробности в <em>Космический бой</em>.</td><td>Любые</td></tr>
                <tr><td><strong>Разгрузить и вернуться</strong></td><td>Выгружает груз на планету (в пределах её складов: излишек улетает обратно с флотом) или продаёт его торговцу за Биткойны, затем возвращается сам. Топливо удваивается туда, а возвращение оплачивается по обычному тарифу при отправлении.</td><td>Корабли с трюмом (на практике грузовые)</td></tr>
                <tr><td><strong>Колонизировать</strong></td><td>Основывает колонию на <strong>необитаемой планете</strong> (не на пустой клетке).</td><td>Колонизатор</td></tr>
                <tr><td><strong>Грабить</strong></td><td>Сражается с наземной обороной, чтобы украсть ресурсы, не захватывая планету.</td><td>Баржи + Легионеры</td></tr>
                <tr><td><strong>Вторгнуться</strong></td><td>Сражается с наземной обороной, чтобы <strong>отнять планету</strong> у противника.</td><td>Баржи + Легионеры</td></tr>
                <tr><td><strong>Зондировать планету</strong></td><td>Шпионит за планетой и присылает Вам отчёт.</td><td>Хотя бы один зонд</td></tr>
                <tr><td><strong>Создать луну</strong></td><td>Создаёт луну на пустой клетке, где есть не менее 2 млн ниобия и 2 млн воды в обломках.</td><td>Лунар</td></tr>
                <tr><td><strong>Развернуть радар</strong></td><td>Устанавливает радар мощностью 1 на пустой клетке на 2&nbsp;ч.</td><td>Радарный корабль</td></tr>
                <tr><td><strong>Развернуть глушитель</strong></td><td>Устанавливает глушитель мощностью 1 на пустой клетке на 1&nbsp;ч.</td><td>Корабль-глушитель</td></tr>
            </table>
            <p>Флот, уже находящийся на орбите своей цели, может также действовать прямо со своей страницы, в разделе <strong>Взаимодействие</strong>: Вторгнуться, Грабить, Колонизировать, Шпионить или развернуть.</p>

            <h3>Это не миссии</h3>
            <ul>
                <li><strong>Переработка</strong>: автоматическая. Флот, в котором есть хотя бы один переработчик и место в трюме, начинает перерабатывать, как только прибывает на поле обломков, независимо от миссии (обычно Обычный). Кнопка <strong>Переработать</strong> у флота возобновляет работу.</li>
                <li><strong>Посадить на землю</strong>: на одной из Ваших планет флот присоединяется к запасу кораблей на земле (см. <em>Продвинутое управление флотами</em>).</li>
                <li><strong>Ядерная ракета</strong>: с Космической карты, «Отправить ядерную ракету» на вражескую планету. Ракета стартует с одной из Ваших планет, где она есть, летит 30 минут и не может быть отменена.</li>
            </ul>

            <h2 id="choisir">Как выбрать подходящую миссию</h2>
            <ul>
                <li>Хотите <strong>Биткойны</strong>? → Разгрузить и вернуться, к торговцу.</li>
                <li>Хотите <strong>разведданные</strong>? → Зондировать планету.</li>
                <li>Хотите <strong>ослабить</strong> врага? → Грабить.</li>
                <li>Хотите <strong>захватить</strong> его планету? → Вторгнуться.</li>
                <li>Хотите <strong>собрать обломки</strong>? → Отправьте переработчики (миссия Обычный): по прибытии они перерабатывают сами.</li>
            </ul>

    fleet_movement:
        title: "Перемещение и расстояние"
        category: "fleet"
        order: 5
        tags: "перемещение,расстояние,скорость,полёт,путешествие,топливо,координаты,биткойн,отмена,ночь"
        summary: "Как рассчитываются время полёта и расход топлива и что замедляет Ваш флот."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Как работают координаты</h2>
            <p>Каждая позиция во вселенной записывается в формате <strong>Галактика:Сектор:Позиция</strong>. Пример: <code>1:5:12</code> = галактика 1, сектор 5, позиция 12.</p>
            <ul>
                <li>В <strong>галактике</strong> 100 секторов (сетка 10×10, пронумерованная от 1 до 100 строка за строкой: с 1 по 10 в первой строке, с 91 по 100 в последней). Космическая карта называет их «системами».</li>
                <li>В <strong>секторе</strong> 25 позиций (сетка 5×5); позиция 13 в центре — всегда солнце.</li>
            </ul>

            <h2 id="distance">Как рассчитывается расстояние</h2>
            <ul>
                <li><strong>В пределах Вашего сектора</strong>: примерно 1 на клетку разницы (1 между двумя соседними клетками, не более 6,25 из угла в угол).</li>
                <li><strong>В другой сектор той же галактики</strong>: примерно 3 на сектор разницы по прямой на сетке 10×10; позиция внутри сектора уже не учитывается. От 3 для соседнего сектора до примерно 40 из одного угла галактики в другой.</li>
                <li><strong>В другую галактику</strong>: всегда 18, каким бы ни был заданный сектор. Нужно исследование <strong>Технология гиперпространства</strong>.</li>
            </ul>
            <p>Вкладка <strong>Переместить флот</strong> на странице флота показывает оценку стоимости и длительности перед отправкой. Эта оценка не учитывает ни бонусы скорости, ни удвоение «Разгрузить и вернуться», ни скорость сервера. С Космической карты отправка идёт без предварительного просмотра.</p>

            <h2 id="duree">Время полёта</h2>
            <p>Длительность рассчитывается так: <strong>расстояние × время на единицу самого медленного корабля × скорость сервера</strong>. Флот всегда летит со скоростью своего самого медленного корабля. Время на единицу расстояния на сервере со скоростью ×1 (некоторые серверы ускорены):</p>
            <table>
                <tr><th>Время на единицу</th><th>Корабли</th></tr>
                <tr><td>1 с</td><td>Зонд, Радарный корабль, Корабль-глушитель</td></tr>
                <tr><td>30 с</td><td>Каравелла</td></tr>
                <tr><td>40 с</td><td>Карго I</td></tr>
                <tr><td>50 с</td><td>Карго V, Истребитель, Тяжёлый истребитель, Плазменный истребитель</td></tr>
                <tr><td>60 с</td><td>Карго X</td></tr>
                <tr><td>70 с</td><td>Корвет, Боевой корвет</td></tr>
                <tr><td>100 с</td><td>Лазерный корвет, Боевой корабль, Материнский корабль</td></tr>
                <tr><td>110 с</td><td>Фрегат</td></tr>
                <tr><td>120 с</td><td>Плазменный фрегат</td></tr>
                <tr><td>130 с</td><td>Крейсер</td></tr>
                <tr><td>140 с</td><td>Эсминец</td></tr>
                <tr><td>150 с</td><td>Броненосец, Переработчик</td></tr>
                <tr><td>200 с</td><td>Колонизатор</td></tr>
                <tr><td>300 с</td><td>Десантная баржа</td></tr>
                <tr><td>500 с</td><td>Лунар</td></tr>
            </table>
            <p>Примеры на сервере со скоростью ×1:</p>
            <ul>
                <li>Истребители в соседний сектор: 2 мин 30 с (3 × 50 с).</li>
                <li>Карго I, доставляющий груз союзнику: около 2 минут в соседний сектор, 10 минут в сектор, находящийся на 5 секторов дальше, 12 минут в другую галактику (Карго X: 3, 15 и 18 минут). С «Разгрузить и вернуться» на возвращение рассчитывайте столько же.</li>
                <li>Колонизатор: около 10 минут в соседний сектор, 50 минут на 5 секторов, 1 час в другую галактику.</li>
            </ul>
            <p>Что меняет длительность:</p>
            <ul>
                <li><strong>Материнский корабль</strong> сокращает на 10&nbsp;% время полёта своего флота. Внимание: сам он летит со скоростью 100 с на единицу, поэтому флот истребителей, который его берёт с собой, переходит с 50 на 90 с на единицу. Он <strong>также снижает на 10&nbsp;% радарную сигнатуру</strong> флота (маскировка) — Обзор же показывает общую необработанную сумму Ваших кораблей.</li>
                <li><strong>Герой</strong> на борту, дающий бонус скорости (см. статью <em>Герои</em>), и бонус альянса к скорости флота сокращают путь. Бонусы героя вместе не могут сократить длительность более чем на 90&nbsp;%.</li>
                <li><strong>Ночное замедление</strong> может умножить длительность (см. ниже).</li>
            </ul>

            <h2 id="carburant">Топливо</h2>
            <p>Топливо оплачивается <strong>Биткойнами</strong> при отправлении. Оно зависит от <strong>сигнатуры</strong> флота (суммы сигнатур его кораблей; груз не учитывается) и от расстояния:</p>
            <ul>
                <li>в пределах одной галактики: <strong>сигнатура × расстояние ÷ 600</strong>, с округлением;</li>
                <li>в другую галактику: <strong>сигнатура ÷ 8</strong>, с округлением, каким бы ни был пункт назначения.</li>
            </ul>
            <p>Миссия <strong>Разгрузить и вернуться</strong> стоит <strong>вдвое больше</strong> туда, а её возвращение затем оплачивается как обычный перелёт в момент, когда флот отправляется назад. Материнский корабль снижает сигнатуру флота, а значит, и его топливо на 10&nbsp;% (но его собственная сигнатура равна 4&nbsp;000).</p>
            <p>Примеры: 1 Карго I (сигнатура 10) в соседний сектор: 0 Биткойнов. 100 Карго X (сигнатура 5&nbsp;000) к торговцу, находящемуся на 5 секторов дальше: 252 Биткойна туда, 126 обратно. 1&nbsp;000 истребителей в другую галактику: 125 Биткойнов. Если у Вас не хватает Биткойнов, отправка отклоняется.</p>

            <h2 id="rappel">Отзыв флота в полёте</h2>
            <p>В течение <strong>первых 2 минут</strong> полёта на флоте (страница «Флоты») появляется кнопка ✕ с обратным отсчётом, а на его странице — строка <strong>Отмена</strong>: она <strong>отменяет отправку</strong>. Флот тут же возвращается на планету отправления, но оплаченное топливо не возмещается. Это верно и для колонизатора.</p>
            <p>По истечении этого срока флот остановить нельзя: после прибытия отправьте его обратно (новый перелёт, новое топливо). Ядерная ракета не отменяется никогда.</p>

            <h2 id="night-slowdown">🌙 Ночное замедление</h2>
            <p>Это замедление касается флота, который везёт хотя бы один боевой корабль, Легионеров или Мехов и отправлен на планету другого игрока или командира ИИ, не входящего в Ваш альянс, не союзного, не состоящего с Вами в пакте или мире. Если этот флот должен был прибыть в <strong>ночь защитника</strong> (с 23 до 06 ч в его часовом поясе), <strong>вся длительность его полёта умножается</strong>, по умолчанию на 10 (каждый сервер может настраивать этот множитель).</p>
            <p>Пример: полёт в 1&nbsp;ч, который прибыл бы в 23:30, длится 10&nbsp;ч и прибывает в 9:30. Флот из грузовых кораблей, зондов или колонизаторов без войск на борту никогда не замедляется. Длительность, показанная во вкладке <strong>Переместить флот</strong>, уже включает этот множитель.</p>
            <p>Значок 🌙 на карте указывает игроков, находящихся сейчас в ночном окне. Во вкладке <strong>Переместить флот</strong> при отправке показывается окно подтверждения, если прибытие приходится на ночь противника; с Космической карты флот отправляется без этого предупреждения. Часовой пояс определяется автоматически и может изменяться не чаще раза в месяц (и 6 раз в год).</p>

    fleet_management:
        title: "Продвинутое управление флотами"
        category: "fleet"
        order: 6
        tags: "управление,флот,разделить,объединить,передать,перегруппировать,посадить на землю,сбор,когорта,покинуть"
        summary: "Разделить, объединить, посадить на землю, отменить отправку: продвинутые операции с Вашими флотами."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Доступные операции</h2>
            <p>Они выполняются со страницы флота (нажатие на его название, страница <strong>Флоты</strong>):</p>
            <ul>
                <li><strong>Разделить</strong> (вкладка <strong>Корабли</strong>) — выделить часть кораблей и груза в новый флот. Невозможно в полёте или в бою; не более 100 флотов.</li>
                <li><strong>Объединить</strong> (список «Флоты на орбите») — присоединить другой из Ваших флотов или все (<strong>Объединение</strong>), находящиеся на той же планете.</li>
                <li><strong>Управление</strong> кораблями (вкладка <strong>Корабли</strong>) и <strong>Груз</strong> — на одной из Ваших планет перемещать корабли или груз между флотом и землёй.</li>
                <li><strong>Посадить на землю</strong> — на одной из Ваших планет влить весь флот (корабли, войска, груз) в запас планеты; флот исчезает. Высаживаемые войска и груз должны уместиться в лимиты планеты&nbsp;; флот, который их не везёт, садится всегда, даже на уже заполненную планету.</li>
                <li><strong>Отменить отправку</strong> (кнопка ✕ на флоте в полёте или строка <strong>Отмена</strong> на его странице) — только в первые 2 минуты полёта: флот тут же возвращается в точку отправления, топливо потеряно.</li>
                <li><strong>Покинуть</strong> — Вы теряете флот: на сервере, где присутствует Ктулху, он достаётся ему (и может обратиться против Вас); в остальных случаях он уничтожается.</li>
            </ul>
            <p>На самой странице <strong>Флоты</strong>:</p>
            <ul>
                <li><strong>Сбор флотов</strong> — отправляет все Ваши стоящие флоты к этой планете, где они садятся по прибытии.</li>
                <li><strong>Сбор кораблей</strong> — собирает корабли на земле Ваших других планет во флоты, которые летят к этой планете и садятся на неё.</li>
                <li><strong>Когорты</strong> — раскладывайте свои флоты по именованным спискам (не более 10), чтобы легко их находить. В бою никакого эффекта.</li>
            </ul>
            <p>Разделение, объединение, передача и посадка на землю не стоят никаких ресурсов. Оплачиваются только перемещения, включая сборы, — Биткойнами топлива.</p>

            <h2 id="en-vol">Чего сделать нельзя</h2>
            <ul>
                <li>Менять состав флота <strong>в полёте</strong> (груз, корабли).</li>
                <li>Менять миссию или пункт назначения флота в полёте. Возможна только отмена, и лишь в первые 2 минуты.</li>
                <li>Телепортировать флот (никаких волшебных сокращений!).</li>
            </ul>

            <h2 id="astuces">Случаи применения</h2>
            <ul>
                <li><strong>Разделить перед боем</strong>: оставьте часть флота в резерве, отправьте авангард.</li>
                <li><strong>Объединить после рейда</strong>: соберите несколько вернувшихся флотов вместе для наглядности.</li>
                <li><strong>Посадить на землю</strong>: корабли на земле стоят в шесть раз дешевле в содержании, чем во флоте (одна двенадцатая их сигнатуры в Биткойнах каждый день, в итоге в 18:59 по парижскому времени, против половины во флоте), но они <strong>не сражаются</strong>. Чтобы защищать планету, держите на орбите вооружённый флот в режиме атаки.</li>
            </ul>

    espionage:
        title: "Шпионаж и зонды"
        category: "fleet"
        order: 7
        tags: "шпионаж,зонд,шпион,обнаружение,информация,разведка,сканирование"
        summary: "Узнать, что есть у противника, прежде чем ударить: отправка зондов."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Отправка зонда</h2>
            <ol>
                <li>Изготовьте <strong>зонды</strong> на Космической верфи (исследований не требуется; 1&nbsp;000 ниобия за штуку).</li>
                <li>На <strong>Космической карте</strong> нажмите на нужную планету, затем <strong>Взаимодействие</strong> → <strong>Зондировать планету</strong>: зонд, хранящийся на земле на одной из Ваших планет, тут же стартует. Вы также можете создать флот из зондов и отправить его с миссией <strong>Зондировать планету</strong>.</li>
                <li>В одиночку зонд летит почти мгновенно: 1 секунда на единицу расстояния (18 секунд в другую галактику). В смеси с другими кораблями он летит с их скоростью.</li>
            </ol>
            <p>Кнопка <strong>Взаимодействие</strong> на карте появляется, только если хотя бы один из Ваших флотов стоит на месте. Сканировать можно только планеты, населённые другим командиром: зонд, отправленный к луне, прибывает, не создавая отчёта.</p>
            <p>По прибытии зонд сканирует планету и присылает Вам отчёт, затем остаётся на орбите цели. Со своей страницы (кнопка <strong>Шпионить</strong>) он может позже сделать новый отчёт; если планета переходит в режим атаки, её оборона может его уничтожить. С Карты или кнопкой «Шпионить» одну и ту же планету можно зондировать только раз в час.</p>

            <h2 id="reussite">Что определяет успех?</h2>
            <p>Безмолвная дуэль сводит Ваш <strong>уровень Шпионажа</strong> с уровнем защитника:</p>
            <ul>
                <li>Если Ваш уровень <strong>больше или равен</strong>, отчёт полный.</li>
                <li>Если Ваш уровень ниже, шпионаж проваливается: отчёт не содержит ничего, кроме названия планеты. Частичного результата не бывает.</li>
            </ul>
            <p>Чтобы повысить свой шпионаж: исследование <strong>Сканер системы</strong> до 5-го уровня, затем исследование <strong>Шпионаж</strong>, не имеющее максимального уровня.</p>

            <h2 id="rapport">Что раскрывает успешный отчёт</h2>
            <ul>
                <li><strong>Ресурсы</strong>: ниобий, вода, рационы, уран, рабочие и учёные.</li>
                <li><strong>Здания</strong> и их уровень.</li>
                <li><strong>Оборона</strong>: турели, ядерные перехватчики, щит, <strong>Легионеры</strong> и <strong>Мехи</strong>.</li>
                <li><strong>Корабли на земле</strong> планеты (включая ядерные ракеты). Флотов на орбите в нём нет: смотрите их на Космической карте.</li>
                <li><strong>Пленники</strong> (герои), удерживаемые на планете.</li>
            </ul>
            <p>Именно то, что нужно для решения: рейд, вторжение или отступление.</p>

            <h2 id="detection">Могут ли Вас заметить?</h2>
            <p>Всегда. При каждом зондировании защитник получает отчёт «Обнаружен шпионаж», в котором указано <strong>Ваше имя</strong> и сообщается, удалась ли попытка или провалилась, а также уведомление. Радар на это не влияет.</p>
            <p>Глушитель радара тоже: он скрывает планету на карте, но не мешает зонду её сканировать. Защитника защищает только уровень Шпионажа, превышающий Ваш.</p>

    spatial_combat:
        title: "Космический бой"
        category: "combat"
        order: 1
        tags: "бой,космос,флот,сражение,блок,раунд,щит,точность,потери,урон,заслон,истребители"
        summary: "Полный ход боя между флотами: мощь сторон, дуэль щитов, раунды стрельбы, конец боя и точный расчёт Ваших потерь."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="start">Когда начинается бой</h2>
            <p>Как только флот с пометкой <strong>[Атака]</strong> оказывается в той же позиции (Галактика:Сектор:Позиция), что и вражеский флот, бой назначается через <strong>5 минут</strong>; до этого момента никто больше не может менять режим атаки своих флотов. Ваши флоты, находящиеся в одном месте, сначала сливаются в одну армаду.</p>
            <p>Все флоты на месте делятся на <strong>две стороны</strong> по дипломатии: Ваш альянс и связанные с ним Оборонительным союзом альянсы — с одной стороны, враг и его альянсы — с другой; альянс, связанный Пактом о ненападении с противоположной стороной, остаётся в стороне. Сторона без единого корабельного оружия (грузовые корабли, переработчики, зонды, одни только войска) в бой не вступает: она уничтожается, о чём сообщается в отчёте.</p>
            <p><strong>Альянсы в состоянии войны, но никто не вооружён</strong> — два флота воюющих альянсов, встретившиеся на орбите, начинают бой, только если хотя бы один из них несёт корабельное оружие. Два полностью безоружных флота (грузовые корабли, зонды, переработчики), встретившиеся на орбите, попросту не сражаются&nbsp;: Ваши флоты не задерживаются, и никого зря не предупреждают.</p>
            <p><strong>Случай рейдов и вторжений</strong> — когда это сражение вызвано рейдом или вторжением на охраняемую планету (см. статьи <em>Вторжение на планету</em> и <em>Рейды (грабёж)</em>), именно этот запуск ставит маркер <strong>[Атака]</strong> на Ваш атакующий флот. Потом его никогда не снимают&nbsp;: уцелевший флот рейда или вторжения остаётся помеченным как враждебный — турели в режиме атаки смогут вступить с ним в бой позже, и он попадёт в обнаружение следующего космического боя, как только встретит врага.</p>

            <h2 id="sila">Мощь стороны</h2>
            <p>Бой сводит <strong>суммы</strong> двух сторон: игра складывает броню, щит, ракеты, лазеры и плазму всех участвующих кораблей.</p>
            <ul>
                <li><strong>Защитник у себя дома</strong> — турели и броня обороны планеты присоединяются к его стороне; Щит добавляет +50&nbsp;000 брони, Большой щит +600&nbsp;000 (+20&nbsp;% каждый с Космической базой). Вооружённый флот члена его альянса, стоящий на планете, тоже получает выгоду.</li>
                <li><strong>Точность</strong> — среднее точностей флотов стороны (результат настройки Ваших кораблей). См. <em>Понимание мощности войск</em>.</li>
                <li><strong>Политика альянса</strong> — каждый строй побеждает соперника: <strong>Весы Миров</strong> побеждают <strong>Безмолвный Оплот</strong>, который побеждает <strong>Молот Звёзд</strong>, который побеждает Весы Миров. Если политика <strong>атакующего</strong> побеждает политику защитника, его ракеты, лазеры и плазма получают +20&nbsp;% на этот бой.</li>
                <li><strong>Улучшения альянса</strong> — до +5&nbsp;% на каждый тип оружия, брони, щита и точности и до +10&nbsp;% для планетарной обороны. Этот последний бонус действует, когда Ваша оборона сражается бок о бок с флотом, но не в орбитальном бою режима атаки.</li>
                <li><strong>Герои</strong> — бонусы к атаке, защите, щиту и точности в зависимости от навыков и предметов. Герой с чертой <strong>Устрашение</strong> ослабляет оружие противника; <strong>Тактик</strong> усиливает первый залп своей стороны.</li>
            </ul>

            <h2 id="oborona-planety">Ваши турели сражаются в этом же бою</h2>
            <p>Когда оборона Вашей планеты присоединяется к одной из сторон, этот бой <strong>и есть</strong> весь бой Вашей планеты&nbsp;: отдельного второго орбитального боя для Ваших турелей позади него нет. Они целятся со своей собственной точностью (малоточный эскорт, стоящий рядом с ними, не ухудшает их стрельбу) и несут в нём <strong>настоящие потери</strong>, независимо от того, включён ли режим атаки планеты:</p>
            <ul>
                <li><strong>если Ваша сторона побеждает</strong>, Ваши турели теряют ту же долю, что и броня, потерянная Вашей стороной (не более 95&nbsp;%); щиты и Космическая база остаются нетронутыми;</li>
                <li><strong>если Ваша сторона рушится</strong>, все турели, Щит, Большой щит и Космическая база уничтожаются, очередь производства на странице «Оборона» теряется (включая ещё не поставленные турели, Легионеров, Мехов, бомбы или перехватчики), а режим атаки отключается. Легионеры, Мехи и рабочие, уже находящиеся на земле, здания и бомбы или перехватчики в запасе не затрагиваются.</li>
            </ul>
            <p>Поэтому планету, охраняемую <strong>вооружённым</strong> флотом (с корабельным оружием) — Вашим или члена Вашего альянса — нельзя ограбить или захватить, пока сражение не решит дело; одного зонда или грузового корабля недостаточно.</p>

            <h2 id="shchity">Дуэль щитов</h2>
            <p>Каждый залп сначала встречает щит противника. Его <strong>пробивная мощность</strong> равна&nbsp;:</p>
            <p><code>ракеты ÷ 7 + плазма × 4 + лазеры × 2</code></p>
            <p>Плазма превосходно действует против щитов, ракеты пробивают их плохо — каким бы ни был масштаб боя, десять против десяти или сто миллионов против ста миллионов. С каждым залпом доля урона, превышающая пробивную мощность, поглощается щитом противника до исчерпания его заряда&nbsp;; остальное и всё, что переливается через край после опустошения щита, бьёт прямо по корпусу. Поэтому щит никогда не может заблокировать залп целиком&nbsp;: против вооружённого противника Ваш корпус всегда что-то принимает, уже с первого раунда.</p>
            <p>Пример: залп, выпущенный 700 ракетами, 200 плазмы и 300 лазеров, пробивает на 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1&nbsp;500</strong> очков; щитом противника может быть поглощено только то, что превышает эти 1&nbsp;500 очков.</p>
            <p>Щит флота — это не резерв, который автоматически возвращается к 100&nbsp;% перед каждой битвой&nbsp;: это <strong>устойчивый заряд</strong>, который расходуется во время боя и восстанавливается лишь на 10&nbsp;% каждые 3 часа, непрерывно (30 часов, чтобы вернуться от нуля до полного), даже когда Вы разделяете, объединяете или распускаете флот или переносите корабли между флотом и землёй планеты. Боевой отчёт показывает этот заряд в начале и в конце битвы&nbsp;; список флотов показывает процент каждого флота, а страница управления флотом указывает щит, реально взятый в бой, общую ёмкость, текущий процент и время до полной зарядки. Запас кораблей на земле тоже несёт заряд, который не восстанавливается&nbsp;: любой флот, созданный или пополненный с этой земли, наследует его, и он показан в окне создания флота, как и во вкладке «Корабли» управления флотом.</p>
            <p>Одно исключение: паушальный щит, который даёт <strong>Материнский корабль</strong> (5&nbsp;250 очков на флот, лишь один раз даже при нескольких Материнских кораблях), никогда не разряжается от битвы к битве — он поглощает удары во время боя, затем к следующему снова полон; заряд расходует только щит Ваших остальных кораблей. Поэтому страница управления показывает и абсолютное значение щита, а не только процент.</p>

            <h2 id="raundy">Раунды стрельбы</h2>
            <p>Бой длится не более <strong>100 раундов</strong>. В каждом раунде каждая сторона делает залп, наносящий&nbsp;:</p>
            <p><code>(ракеты + плазма ÷ 2 + лазеры × 2) × множитель</code></p>
            <p>Множитель берётся из броска точности: игра вытягивает число между точностью стороны и 100 и делит его на 80, получая результат от <strong>×0,3 до ×1,2</strong>. Ни один залп не промахивается. Высокая точность не делает Ваши лучшие залпы сильнее, она устраняет плохие броски. Доля, проходящая через щит противника (см. выше), вычитается из общей брони этой стороны.</p>

            <h2 id="konec">Конец боя</h2>
            <ul>
                <li><strong>Броня стороны падает до 0</strong> — она побеждена, все её флоты уничтожены вместе с грузом.</li>
                <li><strong>Достигнуто 100 раундов</strong> — побеждает сторона, сохранившая больше брони; при полном равенстве побеждает атакующий.</li>
                <li><strong>Страховка победителя</strong> — даже сильно потрёпанная, победившая сторона никогда не теряет более 95&nbsp;% своей начальной брони: победа никогда не бывает полным уничтожением, каким бы ни был разрыв в мощи.</li>
            </ul>

            <h2 id="poteri">Ваши потери: то, что Вы приняли на себя</h2>
            <p>Правило умещается в одну фразу: <strong>Ваши потери вытекают из урона корпусу, который Вы действительно приняли</strong> — никогда из того, что поглотил Ваш щит, который не стоит ни одного корабля. Этот урон корпусу распределяется между Вашим <strong>заслоном</strong> (Истребители, Тяжёлые истребители, Плазменные истребители: единственные корабли без щита) и Вашей <strong>линией</strong> (остальные боевые корабли, от Корветов до Эсминцев) пропорционально броне каждой группы&nbsp;: каждый тип теряет ту же долю самого себя. Отчёт показывает два счётчика: урон корпусу и урон щиту.</p>
            <p>Ваш заслон защищает Вашу линию не бесконечно&nbsp;: он отводит на себя не более <strong>половины</strong> урона, предназначавшегося линии, и лишь пока у него остаётся броня, чтобы его принять — один истребитель не может впитать урон целого флота. Совсем без заслона линия принимает весь урон корпусу.</p>
            <p>Ваши утилитарные корабли (грузовые корабли, переработчики, баржи, зонды, колонизаторы, Материнский корабль) не несут никаких потерь, пока Ваша сторона выигрывает: принимают удар только боевые корабли.</p>
            <p>Прямые следствия: если противник едва Вас задевает, Ваши потери почти нулевые; враг в десять раз опаснее обходится Вам примерно в десять раз дороже — включая истребители. Побеждённая сторона теряет всё.</p>

            <h2 id="posle">После боя</h2>
            <ul>
                <li><strong>Обломки</strong> — 40&nbsp;% стоимости постройки (ниобий и вода) каждого уничтоженного корабля обеих сторон падает на орбиту (20&nbsp;%, когда участвует Ктулху или пришелец). Корабли, оплаченные Очками Войны, обломков не оставляют. К ним добавляется груз уничтоженных флотов. Переработчик в победившем флоте сразу начинает собирать, если у него есть место в трюме.</li>
                <li><strong>Очки Войны</strong> — прирост рассчитывается по сигнатуре побеждённой стороны: общая сигнатура ÷ число флотов этой стороны ÷ 100 (÷ 500 против Ктулху или пришельца), с округлением до целого. Каждый флот победившей стороны получает эту сумму, а владелец планеты получает столько же, если его оборона была на выигравшей стороне. Побеждённая сторона получает ровно одну пятую этой шкалы, рассчитанной по её собственным флотам. Политическое исследование «Очки Войны» добавляет 10&nbsp;% за уровень. Пример: уничтоженный флот из 100 Истребителей (сигнатура по 1) приносит 1 ОВ; Эсминец (сигнатура 270) — около 3. Уничтожение безоружного флота (грузовые корабли, зонды, переработчики) ничего не приносит.</li>
                <li><strong>Герои</strong> — главный герой на борту уничтоженного флота может быть захвачен победителем (шанс, никогда не гарантировано). <strong>Второстепенный герой</strong>, потерпевший поражение, подчиняется другому, окончательному правилу, без случайности: см. статью <em>Второстепенные герои</em>.</li>
                <li><strong>Отчёты</strong> — каждый командир получает подробности (меню <strong>Отчёт</strong>, вкладка <strong>Бои</strong>): силы, залпы, принятый урон, потери и судьба любого захваченного или казнённого второстепенного героя.</li>
                <li><strong>Что дальше</strong> — уцелевшие флоты остаются на месте: ничто автоматически не отправляет их домой.</li>
            </ul>

            <h2 id="sovety">Советы</h2>
            <ul>
                <li>Всегда держите <strong>заслон из истребителей</strong>: он недорог и принимает часть урона корпусу вместо Ваших тяжёлых кораблей.</li>
                <li>Вкладывайтесь в <strong>щит</strong>: чем он заряженнее, тем больше урона поглощает, прежде чем он достанет до Вашего корпуса, — но никакой щит не останавливает залп целиком, Ваш корпус всегда принимает часть. Давайте ему перезаряжаться между битвами.</li>
                <li>Наращивайте <strong>плазму</strong>, чтобы быстро пробивать вражеские щиты, и <strong>лазеры</strong> для урона корпусу.</li>
                <li>Выбирайте <strong>политику альянса</strong>, глядя на политику Ваших излюбленных целей: +20&nbsp;% к оружию в атаке.</li>
            </ul>

    invasion:
        title: "Вторжение на планету"
        category: "combat"
        order: 2
        tags: "вторжение,планета,солдаты,мехи,легионеры,баржи,захват,развёртывание,тактика,отмена"
        summary: "Завоевать вражескую планету: баржи, высадка, наземный бой и тактические развёртывания."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Вторжение — это атака, чтобы <strong>завладеть</strong> вражеской планетой. Ваш флот высаживает Легионеров (через баржи), которые сражаются с гарнизоном на земле.</p>
            <p>Это отличается от <strong>рейда</strong> (который грабит, не захватывая планету): успешное вторжение даёт Вам планету целиком.</p>
            <p>Запустить его можно двумя способами: отправить флот с миссией «Вторгнуться» к планете или нажать «Вторгнуться», когда Ваш флот уже на орбите цели (тогда штурм происходит немедленно).</p>

            <h2 id="conditions">Что нужно для вторжения</h2>
            <ul>
                <li>Играть на сервере в <strong>режиме PvP</strong> (напр.: Доминирование, Battle Royale, Найти и уничтожить, Платный сервер).</li>
                <li>Иметь <strong>баржи</strong> и <strong>Легионеров</strong> на борту флота.</li>
                <li>Цель должна быть населённой планетой другого игрока: не торговец, не член Вашего альянса и не альянс, с которым у Вас Оборонительный союз, Пакт о ненападении или Мирное соглашение.</li>
                <li>Цель не должна быть защищена статусом новичка. Запуск вторжения во время Вашей собственной защиты лишает Вас её (игра просит подтверждения).</li>
                <li>Ваш флот не должен уже участвовать в запланированном бою.</li>
            </ul>
            <p>Состоять в альянсе не обязательно.</p>

            <h2 id="barges">Роль барж</h2>
            <p>Баржи — это транспорт, высаживающий Ваших Легионеров на землю. Каждая баржа перевозит <strong>1&nbsp;000 Легионеров</strong>, +25&nbsp;% за уровень политического исследования «Спланированные вторжения» (1&nbsp;250 на 1-м уровне, 1&nbsp;500 на 2-м…).</p>
            <p>Если у Вас Легионеров больше, чем мест, лишние <strong>остаются на орбите и не сражаются</strong>. Мехи на борту в штурме не участвуют: на земле атакуют только Легионеры. В случае неудачи Ваши баржи <strong>захватываются защитником</strong>.</p>

            <h2 id="annuler">Отмена вторжения</h2>
            <p>Флот, отправленный на вторжение, можно отозвать в течение <strong>2 минут</strong> после его отправления (кнопка «Отмена»): он тут же возвращается в точку отправления, но оплаченное топливо теряется. По истечении этого срока вторжение состоится по прибытии. Вторжение, запущенное с орбиты («Вторгнуться»), разрешается немедленно и не отменяется.</p>

            <h2 id="orbital">Фаза 1 — Орбитальный бой (иногда)</h2>
            <p>Две ситуации могут остановить Вас ещё до высадки:</p>
            <ul>
                <li>Планета-цель включила <strong>режим атаки</strong>: как только Вы прибываете, её турели и щиты вступают в бой с Вашим флотом. Если <strong>Вы проигрываете</strong>, Ваш флот уничтожен — вторжение резко прекращается. Если <strong>Вы побеждаете</strong>, орбитальная оборона уничтожена, и Ваш флот продолжает путь (ослабленный). Планета без турелей теряет свои щиты и космическую базу без боя, как только прибывает Ваш рейд или вторжение.</li>
                <li>Планета-цель охраняется <strong>вооружённым</strong> (с корабельным оружием) флотом владельца или члена его альянса, уже находящимся на орбите (одни зонд или грузовой корабль не считаются): Ваше прибытие запускает <strong>битву</strong> против этого защитника и его турелей вместе через 5 минут — даже если планета не в режиме атаки. Эта битва никогда не запускается против партнёра по миру, пакту, оборонительного союзника или Вашего собственного альянса, а также на сервере PvE: она подчиняется тем же дипломатическим правилам, что и обычное вторжение. Она отменяет Ваше текущее вторжение&nbsp;: если Вы её выиграете, Вам нужно <strong>запустить</strong> вторжение заново, чтобы действительно высадиться — а если планета в этот момент всё ещё охраняется, нажатие «Вторгнуться» с орбиты точно так же <strong>отклоняется</strong>&nbsp;: сначала включите режим атаки своего собственного флота, чтобы форсировать бой. Поскольку вторжение всегда везёт Легионеров, это условие битвы автоматически выполняется со стороны атакующего&nbsp;: битва запускается независимо от того, несёт ли Ваш флот корабельное оружие.</li>
            </ul>
            <p><strong>Ловушка, о которой нужно знать&nbsp;: флот вторжения без боевого корабля уничтожается в этой битве.</strong> Легионеров и барж достаточно, чтобы вторжение стартовало, но если Ваш флот не несёт никакого корабельного оружия, он входит в эту предварительную битву с нулевой огневой мощью&nbsp;: защитники полностью уничтожают его, включая баржи и Легионеров, ещё до высадки. То же самое против планеты в режиме атаки: её турели сразу уничтожают флот без корабельного оружия. <strong>Всегда сопровождайте свои флоты вторжения боевыми кораблями</strong> — см. статью <em>Рейды (грабёж)</em> про ту же ловушку со стороны грабежа.</p>

            <h2 id="combat">Фаза 2 — Наземный бой</h2>
            <p>Наземный бой длится <strong>не более 10 раундов</strong>. В каждом раунде штурмующий наносит гарнизону десятую часть своей мощи атаки, а тот отвечает десятой частью своей мощи защиты.</p>
            <table>
                <thead>
                    <tr><th>Единица</th><th>Роль</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Легионер</strong></td><td>Атака (от 5 до 7 за раунд при вторжении) и защита (6, +5&nbsp;% за уровень Колючей проволоки).</td></tr>
                    <tr><td><strong>Мех</strong></td><td>Тяжёлая защита (2&nbsp;200), максимум 500 на планету. В штурме не участвует.</td></tr>
                    <tr><td><strong>Рабочий</strong></td><td>Пассивная защита (по 1), <strong>только при вторжении</strong> (не при рейде).</td></tr>
                </tbody>
            </table>
            <p><strong>Атакующий побеждает, только если</strong> все войска защитника уничтожены <strong>и</strong> у него остаётся хотя бы 1 живой Легионер. В остальных случаях <strong>защитник побеждает за счёт преимущества местности</strong>. Подробности о мощи: статья <em>Понимание мощности войск</em>.</p>

            <h2 id="deploiement">Тактические развёртывания защитника</h2>
            <p>Защитник мог выбрать <strong>тактическое развёртывание</strong>, невидимое для Вас (на него указывает только его собственный отчёт). Помните: оно может перевернуть ситуацию, казавшуюся заведомо выигранной.</p>
            <table>
                <thead>
                    <tr><th>Развёртывание</th><th>Эффект</th><th>Порядок потерь гарнизона</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Сбалансированное</strong></td><td>Ни бонуса, ни штрафа.</td><td>Легионеры, затем Мехи, затем рабочие.</td></tr>
                    <tr><td><strong>Укреплённое</strong></td><td>Ответный удар гарнизона сначала получает 30&nbsp;%, затем теряет 20&nbsp;%: в сумме <strong>+4&nbsp;%</strong> к урону, наносимому штурмующему. Единицы не становятся труднее для уничтожения.</td><td>Как Сбалансированное.</td></tr>
                    <tr><td><strong>Партизанское</strong></td><td>В ответном ударе каждый рабочий считается 2,5 раза (+150&nbsp;%), а каждый Легионер вдвое меньше (−50&nbsp;%).</td><td>Сначала рабочие, затем Легионеры, затем Мехи.</td></tr>
                    <tr><td><strong>Последний бастион</strong></td><td>+50&nbsp;% к ответному удару, как только гарнизон опускается ниже 30&nbsp;% от начального состава (по числу единиц), до конца боя.</td><td>Легионеры, затем рабочие, затем Мехи.</td></tr>
                    <tr><td><strong>Выжженная земля</strong></td><td>Бонусов в бою нет. Если штурмующий побеждает, при рейде, как и при вторжении, 50&nbsp;% оставшегося на планете ниобия, воды и урана уничтожается.</td><td>Как Сбалансированное.</td></tr>
                </tbody>
            </table>
            <p>Рабочие сражаются только при вторжении. Защитник может свободно менять развёртывание в любой момент на странице <strong>Оборона</strong>.</p>

            <h2 id="victoire">Если Вы выиграли вторжение</h2>
            <ul>
                <li><strong>Захват</strong> — планета переходит к Вам вместе со зданиями. Число рабочих сводится к <strong>2&nbsp;000</strong>. Если защитник выбрал Выжженную землю, половина его ниобия, воды и урана уничтожается до захвата.</li>
                <li><strong>Планета Ктулху</strong> — если Вы отбиваете планету, захваченную Ктулху, она освобождается (здания обнуляются, награда в уране).</li>
                <li><strong>Нет места для колонизации?</strong> Число Ваших колонизированных планет должно оставаться ниже Терраформирование + 2, плюс уровень политического исследования «Империя без границ». Сверх этого завоёванная планета становится базой Ктулху — или снова необитаемой на сервере без Ктулху: Вы её не сохраняете, но получаете свои очки войны.</li>
            </ul>
            <p><strong>Очереди производства</strong> за захваченной планетой не следуют&nbsp;: корабли и оборона (турели или войска), уже оплаченные, но ещё не поставленные, при захвате теряются — заказ, сделанный побеждённым, никогда не переходит из рук в руки. А то, что было поставлено до штурма, находится на земле и остаётся с планетой.</p>
            <p>Если на захваченной планете находится <strong>второстепенный герой</strong> противника, его судьба решается сразу: Вы его <strong>захватываете</strong>, если у Вас есть Тюрьма (уровня 1 или выше), иначе он <strong>казнён</strong>. Рейд же никогда не захватывает планету и потому никогда не ставит героя на кон. Подробности в статье <em>Второстепенные герои</em>.</p>

            <h2 id="gameover">Уничтожение защитника</h2>
            <p>Если защитник теряет свою <strong>последнюю планету</strong>, он исключается с сервера. Вы получаете всё: его Биткойны, его уцелевшие флоты и его Очки Войны.</p>

            <h2 id="defaite">Если Вы проиграли вторжение</h2>
            <p><strong>Баржи захватываются защитником</strong>. Легионеры, погибшие на земле, потеряны; те, кто продержался до 10-го раунда, и те, кто остался на орбите из-за нехватки мест, возвращаются в Ваш флот — без барж, чтобы высадить их снова. Это дорогое поражение: зондируйте перед вторжением.</p>

    raid:
        title: "Рейды (грабёж)"
        category: "combat"
        order: 3
        tags: "рейд,грабёж,воровство,ресурсы,оборонительный форт,бункер,баржи,выжженная земля"
        summary: "Грабить ресурсы вражеской планеты, не стремясь её завоевать."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Что такое рейд?</h2>
            <p>Рейд — это наземная атака, цель которой — <strong>украсть ресурсы</strong>. Вы не захватываете планету: Вы уходите с добычей. Важное следствие: рейд, даже успешный, никогда не захватывает планету, поэтому <strong>никакой второстепенный герой там никогда не захватывается и не казнится</strong>, будь Вы атакующим или защитником.</p>
            <p>Нужны те же средства, что и для вторжения: <strong>баржи</strong> и <strong>Легионеры</strong> на борту — против планеты другого игрока, который не входит в Ваш альянс и не связан с ним Оборонительным союзом, Пактом о ненападении или Мирным соглашением (см. <em>Вторжение на планету</em>). Отправьте флот с миссией «Грабить» или нажмите «Грабить», когда он уже на орбите. База Ктулху не грабится.</p>

            <h2 id="difference">Рейд и вторжение</h2>
            <table>
                <thead>
                    <tr><th></th><th>Рейд</th><th>Вторжение</th></tr>
                </thead>
                <tbody>
                    <tr><td>Цель</td><td>Украсть ниобий, воду, уран</td><td>Завладеть планетой</td></tr>
                    <tr><td>Защитники</td><td>Легионеры + Мехи</td><td>Легионеры + Мехи + Рабочие</td></tr>
                    <tr><td>Атака Легионера</td><td>От 5 до 6 за раунд (менее непредсказуема)</td><td>От 5 до 7 за раунд (более непредсказуема)</td></tr>
                    <tr><td>Потеря барж при поражении</td><td>Нет</td><td>Да (захватываются защитником)</td></tr>
                </tbody>
            </table>

            <h2 id="combat">Как это проходит</h2>
            <p>Те же этапы, что и при вторжении (возможный орбитальный бой, затем 10 раундов на земле), <strong>но рабочие не защищаются</strong>. Легионеры и Мехи защитника остаются одни.</p>
            <p><strong>Планета, охраняемая флотом на орбите</strong> — если цель защищена <strong>вооружённым</strong> (с корабельным оружием) флотом владельца или члена его альянса (одни зонд или грузовой корабль не в счёт), Ваш рейд сначала запускает битву против этого защитника и турелей планеты через 5 минут после Вашего прибытия. Эта битва никогда не запускается против партнёра по миру, пакту, оборонительного союзника или Вашего собственного альянса, а также на сервере PvE. Грабёж не происходит сразу следом&nbsp;: если Вы выиграете эту битву, Вам нужно <strong>запустить</strong> рейд заново, чтобы действительно грабить — а если планета всё ещё охраняется, нажатие «Грабить» с орбиты тоже <strong>отклоняется</strong>&nbsp;: сначала включите режим атаки своего собственного флота, чтобы форсировать бой. Со стороны атакующего эта битва запускается, только если Ваш флот рейда сам наступательный — с корабельным оружием, Легионерами или Мехами на борту.</p>

            <h2 id="tolko-voyska">Рейд из одних войск уничтожается</h2>
            <p>Взять с собой Легионеров или Мехов достаточно, чтобы запустить эту битву — но если Ваш флот рейда не несёт <strong>никакого корабельного оружия</strong>, он входит в неё с нулевой огневой мощью. Защитники полностью уничтожают его, не потеряв напротив ни одного корабля. Против планеты в режиме атаки то же самое: её турели сразу уничтожают флот без корабельного оружия. <strong>Всегда сопровождайте свои транспорты с войсками</strong>&nbsp;: это самый дорогой сюрприз, который может преподнести Вам эта система.</p>

            <h2 id="pillage">Грабёж (в случае победы)</h2>
            <p>Вы забираете столько ресурсов, сколько осталось места в Ваших трюмах после боя: каждый выживший Легионер занимает одно место, каждый Мех — 500 (одна баржа даёт 1&nbsp;000 мест). Берите грузовые корабли, чтобы уйти с настоящей добычей. Ресурсы берутся в таком порядке:</p>
            <ol>
                <li>Сначала <strong>ниобий</strong>.</li>
                <li>Затем <strong>вода</strong>.</li>
                <li>Наконец <strong>уран</strong> (если осталось место).</li>
            </ol>

            <h2 id="bunker">Оборонительный форт защищает часть</h2>
            <p><strong>Оборонительный форт</strong> (бункер) защитника <strong>укрывает 5&nbsp;% максимального хранилища за уровень</strong>. Примеры:</p>
            <ul>
                <li>Оборонительный форт 5-го уровня → защищено 25&nbsp;% максимального хранилища ниобия и воды.</li>
                <li>Оборонительный форт 10-го уровня → защищено 50&nbsp;%.</li>
            </ul>
            <p>Уран защищается так же: <strong>5&nbsp;% Вашего запаса урана за уровень Оборонительного форта</strong> (так как у урана нет максимального хранилища, защита применяется к запасу на данный момент).</p>

            <h2 id="scorched">Остерегайтесь Выжженной земли</h2>
            <p>Если защитник выбрал <strong>тактическое развёртывание Выжженная земля</strong> и проигрывает, <strong>половина всего, что осталось</strong> на планете (ниобий, вода, уран), уничтожается, включая долю, которую укрывал Оборонительный форт. Вы уходите со своей добычей, но противник не может вернуть себе всё обратно.</p>

    nuclear:
        title: "Ядерная атака"
        category: "combat"
        order: 4
        tags: "ядерное,бомба,уран,разрушение,перехватчик,ракета"
        summary: "Абсолютное оружие для уничтожения ключевых зданий врага — при условии, что у него нет противоракетной обороны."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Что Вам нужно</h2>
            <ul>
                <li>Исследование <strong>Вооружение</strong> 5-го уровня и здание <strong>Ядерная база</strong>.</li>
                <li><strong>Уран</strong> (очень редкий).</li>
                <li><strong>Ядерная бомба</strong>, изготавливаемая на странице <strong>Оборона</strong>: 500 урана и 25&nbsp;000 Биткойнов, 6 часов на бомбу (ускоряется Оружейным заводом и Тяжёлой промышленностью). Планета хранит не более стольких бомб, каков уровень её Ядерной базы.</li>
            </ul>
            <p><strong>Запуск удара</strong> — на <strong>космической карте</strong> выберите вражескую планету, затем «Отправить ядерную ракету». Игра берёт бомбу с одной из Ваших планет; она прибывает за <strong>30 минут</strong>, каким бы ни было расстояние, и отмене не подлежит. Для удара по другой галактике нужна Технология гиперпространства. Планету, защищённую статусом новичка, нельзя выбрать целью, а запуск удара во время Вашей собственной защиты лишает Вас её (игра просит подтверждения).</p>

            <h2 id="degats">Что делает попавшая бомба?</h2>
            <p>Бомба <strong>разрушает один уровень здания</strong>, в первую очередь самых стратегических:</p>
            <ol>
                <li><strong>Мегаполис</strong> — потеря 1 уровня: −80&nbsp;000 рабочих вместимости (те, кто превышает новую вместимость, исчезают), а производство рабочих снижается.</li>
                <li><strong>Большой город</strong> — потеря 1 уровня: −25&nbsp;000 рабочих вместимости, то же правило.</li>
                <li><strong>Оборонительный форт</strong> (бункер) — потеря 1 уровня: защита от грабежа снижается и −15&nbsp;000 Легионеров вместимости.</li>
                <li><strong>Казарма</strong> — потеря 1 уровня: −5&nbsp;000 Легионеров вместимости.</li>
                <li><strong>Лагерь рабов</strong> — потеря 1 уровня.</li>
            </ol>
            <p>Бомба бьёт по первому зданию, имеющемуся в этом порядке; если на планете нет ни одного, урона нет. Легионеры сверх новой вместимости тоже исчезают. В любом случае бомба расходуется.</p>

            <h2 id="regle">Особые правила</h2>
            <ul>
                <li>Бомбу в полёте <strong>нельзя перехватить</strong> флотом на орбите. Она летит прямо к цели.</li>
                <li>Единственный способ её остановить — <strong>ракета-перехватчик</strong> защитника.</li>
            </ul>

            <h2 id="anti">Защита: ракета-перехватчик</h2>
            <p>Если на планете-цели есть хотя бы одна <strong>ракета-перехватчик</strong>, бомба автоматически нейтрализуется:</p>
            <ul>
                <li>Бомба <strong>уничтожается</strong>.</li>
                <li>Расходуется <strong>от 1 до 3 перехватчиков</strong> (не больше, чем есть в запасе).</li>
                <li>Оба игрока получают отчёт.</li>
            </ul>
            <p>Ракеты-перехватчики изготавливаются на странице <strong>Оборона</strong>: 10&nbsp;000 ниобия и 200 урана, по 3 часа каждая (исследование Вооружение 5-го уровня и Ядерная база). Планета хранит не более 4 на уровень Ядерной базы.</p>
            <p>Мораль: стратегическая база всегда стоит нескольких перехватчиков. Без них она уязвима.</p>

    defense:
        title: "Защита планет"
        category: "combat"
        order: 5
        tags: "оборона,солдаты,легионеры,мехи,турель,щит,большой щит,бункер,оборонительный форт,орбитальный,тактика,развёртывание,статистика,мощь,время,стоимость"
        summary: "3 слоя обороны: орбитальный (турели), тактический (развёртывание), наземный (Легионеры + Мехи)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">3 слоя обороны</h2>
            <ol>
                <li><strong>Орбитальная оборона</strong> — турели, щиты, космическая база. Перехватывают флот до высадки.</li>
                <li><strong>Тактическое развёртывание</strong> — стратегический выбор, меняющий ответный удар Ваших войск на земле.</li>
                <li><strong>Наземная оборона</strong> — Легионеры, Мехи, рабочие (при вторжениях).</li>
            </ol>

            <h2 id="mode-attaque">Включение режима атаки Вашей планеты</h2>
            <p>Если на Вашей планете есть <strong>хотя бы одна турель</strong>, Вы можете включить <strong>режим атаки</strong>. В этом режиме любой чужой флот, стоящий на орбите, — кроме торговцев, членов Вашего альянса и альянсов, связанных с Вашим Оборонительным союзом, — вступает в <strong>орбитальный бой</strong> через 5 минут после прибытия, независимо от того, находится ли он сам в режиме атаки. Рейд или вторжение вступают в бой сразу по прибытии.</p>
            <ul>
                <li><strong>Победа</strong>: вражеский флот уничтожен, Ваши турели теряют ту же долю, что и потерянная Вами броня, и Вы получаете <strong>очки войны</strong>, равные его сигнатуре ÷ 100 (÷ 500 против Ктулху).</li>
                <li><strong>Поражение</strong>: все Ваши турели, щиты, Ваша космическая база и вся Ваша очередь производства на странице «Оборона» (включая ещё не поставленных Легионеров, Мехов, бомбы или перехватчики) уничтожаются — войска, уже находящиеся на земле, и Ваши запасы бомб и перехватчиков остаются нетронутыми; режим атаки <strong>отключается автоматически</strong> (планета без турелей не может держать его включённым), а флот продолжает путь к наземному бою, если это рейд или вторжение. Нападающий не получает очков войны за разрушение Вашей обороны.</li>
            </ul>
            <p>Без турелей Ваши щиты и космическая база уничтожаются <strong>даже без боя</strong>, как только прибывает вражеский рейд или вторжение.</p>
            <p>Включить его можно в двух местах: на странице <strong>Оборона</strong> планеты или на странице <strong>Планеты</strong>, которая показывает состояние каждой планеты (прицел рядом с её обороной, нажатием переключается) и предлагает <strong>«Включить все»</strong> / <strong>«Выключить все»</strong> для всей империи. Групповое переключение пропускает планеты без турелей или уже втянутые в бой и сообщает Вам, сколько было пропущено.</p>
            <p><strong>Внимание</strong>: включение режима атаки на планете, над которой уже завис вражеский флот, запускает орбитальный бой <strong>через пять минут</strong>. При групповом переключении сразу может начаться несколько сражений — сообщение укажет, сколько.</p>
            <p><strong>Что нападающий приносит с собой.</strong> Флот, атакующий Ваши турели, сражается со <strong>всеми своими бонусами</strong>&nbsp;: бонусы альянса его командира (ракеты, лазеры, плазма, броня, щит, точность) и бонусы снаряжения его героя на борту. Это действует в обе стороны: Ваши собственные флоты сохраняют свои бонусы, когда это Вы штурмуете планету в режиме атаки, а цифры орбитальных отчётов имеют тот же масштаб, что и в космических отчётах.</p>

            <h2 id="oborona-i-vashi-floty">Ваша оборона стреляет и без режима атаки</h2>
            <p>Режим атаки — не единственный способ заставить Ваши турели стрелять. Как только один из Ваших флотов — или <strong>вооружённый</strong> флот члена Вашего альянса — находится на орбите планеты в момент, когда там начинается космический бой, Ваша оборона автоматически присоединяется к этому бою, независимо от того, включён ли режим атаки (планета, которой нечего защищать — ни турелей, ни щита, ни космической базы, — в нём никогда не участвует). Тогда это <strong>одна битва</strong>: никакого отдельного второго орбитального боя позади нет. В этой битве бонус брони Вашей <strong>космической базы</strong> (+20&nbsp;%) идёт на пользу и Вашим турелям, и Вашим щитам, а военная склонность Вашего <strong>размещённого героя</strong> усиливает стрельбу Ваших собственных турелей и может дать Устрашение или Тактика всей Вашей стороне — точно так же, как у героя флота. Ваши турели целятся там со своей собственной точностью (средний множитель ×1,06, выше того, чего может достичь флот) и несут там <strong>настоящие потери</strong> — пропорциональные принятому урону, если Ваша сторона побеждает, и <strong>полные</strong> (турели, щиты, космическая база, очередь производства страницы «Оборона», отключённый режим атаки), если Ваша сторона падает. Вы получаете долю <strong>очков войны</strong> своей планеты каждый раз, когда Ваша сторона выигрывает эту битву — даже если Вы не выставили ни одного собственного флота.</p>
            <p>Следствие для Ваших противников&nbsp;: планету, охраняемую одним из Ваших <strong>вооружённых</strong> (с корабельным оружием) флотов или вооружённым флотом члена Вашего альянса (одни зонд или грузовой корабль не считаются), нельзя ограбить или захватить без предварительной битвы, прибывает ли нападающий заново или нажимает «Грабить»/«Вторгнуться» с орбиты — и эта битва никогда не начинается против партнёра по миру, пакту, оборонительного союзника, Вашего собственного альянса или на сервере PvE.</p>
            <p>Без единого флота на орбите и без режима атаки Ваши турели не стреляют: рейд или вторжение сразу переходит к наземному бою.</p>
            <p><strong>Вы не выставили ни одного собственного флота&nbsp;?</strong> Вы всё равно получаете отдельный отчёт, который сообщает, устояла Ваша оборона или была уничтожена, с подробными потерями турелей и Вашей долей очков войны, если Вы победили&nbsp;: Вы никогда не остаётесь в неведении о судьбе своей планеты.</p>

            <h2 id="combat-orbital">Орбитальный бой подробно</h2>
            <p>Турели стреляют по вражескому флоту в ритме раундов (не более 100). <strong>Космическая база</strong> добавляет +20&nbsp;% к броне всей обороны. Щиты добавляют 50&nbsp;000 (Щит) или 600&nbsp;000 (Большой щит) очков к броне планеты: чем больше Ваша общая броня, тем меньше потерянная доля — а значит, и доля уничтоженных турелей.</p>
            <p>Ваши турели стреляют <strong>с первого раунда</strong>, какой бы флот ни был напротив: щит корабля никогда не отражает их начальный залп. Этот щит — резерв, принимающий урон до исчерпания. Каждый залп сразу проходит сквозь него на величину своей <strong>пробивной мощности</strong> (плазма ×4, лазер ×2, ракеты ÷ 7)&nbsp;; остальное изнашивает щит, а то, что переливается через него, бьёт по корпусу. Оборона, состоящая только из ракетных установок, остаётся в невыгодном положении перед флотом с мощным щитом — но она стреляет, наносит потери и оставляет обломки.</p>
            <p>Даже если вражеский флот побеждает, его заслон из истребителей не защищает его бесконечно&nbsp;: Ваши турели наносят настоящие потери и его более тяжёлым кораблям, пропорционально принимаемому им урону — в худшем для него случае 95&nbsp;% его начальной брони. Оборона всегда что-то стоит нападающему, даже если он побеждает. По прошествии 100 раундов побеждает сторона, сохранившая больше брони (нападающий — при равенстве).</p>
            <p>В этом орбитальном бою не применяются ни +20&nbsp;% политики альянса, ни бонус альянса «планетарная оборона»: они действуют только в битвах, где Ваша оборона сражается бок о бок с флотом.</p>

            <h2 id="deploiement">Тактическое развёртывание</h2>
            <p>Каждая планета может выбрать <strong>тактическое развёртывание</strong> на странице <strong>Оборона</strong> и свободно менять его в любой момент. Оно <strong>невидимо для нападающего</strong> — это Ваша скрытая карта.</p>
            <table>
                <thead>
                    <tr><th>Развёртывание</th><th>Эффект</th><th>Порядок потерь Вашего гарнизона</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Сбалансированное</strong></td><td>Ни бонуса, ни штрафа.</td><td>Легионеры, затем Мехи, затем рабочие.</td></tr>
                    <tr><td><strong>Укреплённое</strong></td><td>Ответный удар Вашего гарнизона сначала получает 30&nbsp;%, затем теряет 20&nbsp;%: в сумме <strong>+4&nbsp;%</strong> к урону, наносимому штурмующему. Ваши единицы не становятся труднее для уничтожения.</td><td>Как Сбалансированное.</td></tr>
                    <tr><td><strong>Партизанское</strong></td><td>В ответном ударе каждый рабочий считается 2,5 раза (+150&nbsp;%), а каждый Легионер вдвое меньше (−50&nbsp;%).</td><td>Сначала рабочие, затем Легионеры, затем Мехи.</td></tr>
                    <tr><td><strong>Последний бастион</strong></td><td>+50&nbsp;% к ответному удару, как только Ваши войска опускаются ниже 30&nbsp;% от начального состава (по числу единиц), до конца боя.</td><td>Легионеры, затем рабочие, затем Мехи.</td></tr>
                    <tr><td><strong>Выжженная земля</strong></td><td>Бонусов в бою нет. Если Вы проигрываете, при рейде, как и при вторжении, 50&nbsp;% оставшихся у Вас ниобия, воды и урана уничтожается, включая долю, защищённую Оборонительным фортом.</td><td>Как Сбалансированное.</td></tr>
                </tbody>
            </table>
            <p>Рабочие сражаются только при вторжении.</p>

            <h2 id="combat-sol">Наземный бой</h2>
            <p>Он идёт <strong>не более 10 раундов</strong>. В каждом раунде нападающий наносит Вашему гарнизону десятую часть своей мощи атаки, а тот отвечает десятой частью своей мощи защиты. Нападающий побеждает, только если уничтожит весь Ваш гарнизон, сохранив хотя бы одного Легионера. Если за 10 раундов никто не побеждает, <strong>нападающий отброшен</strong> (преимущество местности).</p>

            <h2 id="troupes">Наземные единицы</h2>
            <table>
                <thead>
                    <tr><th>Единица</th><th>Роль</th><th>Примечания</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Легионеры</strong></td><td>Атака и защита (мощь 6 в защите).</td><td>+5&nbsp;% к защите за уровень Колючей проволоки (до +25&nbsp;%).</td></tr>
                    <tr><td><strong>Мехи</strong></td><td>Тяжёлая защита (мощь 2&nbsp;200).</td><td>Максимум 500 на планету. Содержание 2 Биткойна в день на земле, 100 на борту.</td></tr>
                    <tr><td><strong>Рабочие</strong></td><td>Пассивная защита (мощь 1).</td><td>Только против вторжений, не против рейдов.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Ресурсы, используемые для производства обороны</h2>
            <p>Как и Космическая верфь, производство обороны сначала берёт ресурсы <strong>планеты</strong>, затем <strong>груз флотов, стоящих на орбите</strong>. Поэтому Вы можете продолжать нанимать, даже если запас на земле невелик, пока над планетой находятся гружёные флоты.</p>

            <h2 id="installations">Орбитальные сооружения и оборона</h2>
            <ul>
                <li><strong>Турели</strong> — Ракетная установка, Лазерная турель, Тяжёлая лазерная турель, Пушка Гаусса, Ионная артиллерия, Плазменная установка. Разнообразны, чтобы противостоять разным типам флотов (см. таблицу ниже).</li>
                <li><strong>Щит</strong> — +50&nbsp;000 брони, постоянно (5&nbsp;000 ниобия и 5&nbsp;000 воды, 5 часов строительства).</li>
                <li><strong>Большой щит</strong> — +600&nbsp;000 брони в течение <strong>12 часов</strong> с момента активации (150&nbsp;000 ниобия и 150&nbsp;000 воды при каждой активации).</li>
                <li><strong>Космическая база</strong> — +20&nbsp;% брони турелям и щитам (50&nbsp;000 ниобия и 50&nbsp;000 воды, 1 час).</li>
            </ul>

            <h2 id="temps">Стоимость и время постройки</h2>
            <table>
                <thead>
                    <tr><th>Оборона</th><th>Стоимость</th><th>Время на единицу</th><th>Броня</th><th>Оружие</th><th>Требования</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Ракетная установка</td><td>12 ниобия, 9 воды</td><td>2 с</td><td>10</td><td>9 ракета</td><td>Ракетное оружие ур. 1</td></tr>
                    <tr><td>Лазерная турель</td><td>13 ниобия, 12 воды</td><td>2,4 с</td><td>15</td><td>6 лазер</td><td>Лазерное оружие ур. 1</td></tr>
                    <tr><td>Тяжёлая лазерная турель</td><td>23 ниобия, 23 воды</td><td>4,4 с</td><td>25</td><td>12 лазер</td><td>Лазерное оружие ур. 3, Оружейный завод</td></tr>
                    <tr><td>Пушка Гаусса</td><td>50 ниобия, 25 воды</td><td>7,2 с</td><td>50</td><td>24 ракета</td><td>Ракетное оружие ур. 3, Оружейный завод</td></tr>
                    <tr><td>Ионная артиллерия</td><td>30 ниобия, 45 воды</td><td>7,2 с</td><td>50</td><td>8 лазер, 4 плазма</td><td>Ракетное оружие ур. 3, Лазерное оружие ур. 3, Тяжёлая промышленность</td></tr>
                    <tr><td>Плазменная установка</td><td>15 ниобия, 60 воды</td><td>7,2 с</td><td>50</td><td>8 плазма</td><td>Плазменное оружие ур. 1, Тяжёлая промышленность</td></tr>
                </tbody>
            </table>
            <p>Это время делится на скорость производства обороны планеты: ×1, +0,4 за уровень <strong>Оружейного завода</strong> и +0,6 за уровень <strong>Тяжёлой промышленности</strong>. Пример: 1&nbsp;000 Ракетных установок занимают 33 минуты без завода, менее 10 минут с Оружейным заводом 3-го уровня и Тяжёлой промышленностью 2-го уровня (×3,4). Скорость сервера эти времена не меняет. Производство идёт строка за строкой, а единицы поступают по мере готовности.</p>
            <p>То же ускорение действует для войск и ядерного оружия: Легионер 1 с, Мех 100 с, ракета-перехватчик 3 ч, ядерная бомба 6 ч. У Щита (5 ч) и Космической базы (1 ч) время фиксированное; Большой щит активен с момента активации на 12 часов.</p>

            <h2 id="stats-defensives">Как читать мощь Вашей планеты</h2>
            <p>На странице <strong>Оборона</strong> две вкладки. Вторая, <strong>Статистика обороны</strong>, подводит итог того, чего на самом деле стоит планета: суммарные броня, ракеты, лазеры и плазма всех Ваших турелей, вклад каждого сооружения, влияние щита, большого щита и космической базы на броню, реально противопоставляемую флоту, и мощь Вашей наземной обороны. Это самый быстрый способ заметить отстающую характеристику, прежде чем запускать новую серию построек.</p>
            <p>Одна деталь чтения: круговая диаграмма и столбцы относятся к броне <strong>одних лишь сооружений</strong>. Паушальные значения щитов показаны отдельно, в модификаторах, потому что иначе они подавили бы любое сравнение между Вашим оружием.</p>

            <h2 id="bunker">Оборонительный форт против грабежа</h2>
            <p><strong>Оборонительный форт</strong> (бункер) защищает от рейдов <strong>5&nbsp;% максимального хранилища за уровень</strong>. Оборонительный форт 5-го уровня уже укрывает 25&nbsp;% Ваших запасов ниобия и воды. Уран защищён в размере 5&nbsp;% его запаса за уровень. Внимание: при развёртывании Выжженная земля половина оставшегося уничтожается, если Вы проиграете, включая защищённую долю.</p>

            <h2 id="entretien">Остерегайтесь расходов на содержание</h2>
            <p>Всё, что <strong>находится во флоте</strong> — в полёте или на стоянке, — стоит гораздо дороже, чем на земле: Мех переходит с 2 до 100 Биткойнов в день (×50), Легионер — с 0,1 до 0,6, корабль — с сигнатуры ÷ 12 до сигнатуры ÷ 2. Верните на землю то, у чего нет задачи.</p>

    embargo:
        title: "Эмбарго и голод"
        category: "combat"
        order: 6
        tags: "эмбарго,голод,блокада,осада,планета,пища,рационы,снабжение,сигнатура,порог"
        summary: "Заморить планету голодом перед вторжением: блокада, наступающий голод и как его пережить."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Принцип</h2>
            <p><strong>Эмбарго</strong> — это планетарная осада. Вы держите крупный флот в режиме атаки на орбите вражеской планеты; поставки прекращаются, рационы иссякают, население страдает. Когда планета ослаблена, Вы идёте на штурм.</p>

            <h2 id="consommation">Напоминание: еда</h2>
            <p>Рационы потребляют только Ваши <strong>рабочие</strong>: 1 рацион в час на 500 рабочих (150&nbsp;000 рабочих = 300 рационов в час). Легионеры и Мехи не едят, но тоже гибнут, когда наступает голод. Если Ваши запасы падают до <strong>0</strong>, наступает <strong>голод</strong>.</p>
            <p>Рационы <strong>перевозятся в трюме</strong>: загрузите их на одной планете, выгрузите на другой, чтобы снабдить её. Пока один из Ваших флотов <strong>стоит у причала</strong> (не в полёте и не в бою) над Вашей планетой, его рационы пополняют амбар — и осада вычерпывает их, как и всё остальное: трюм — не сейф.</p>

            <h2 id="famine">Голод (без эмбарго)</h2>
            <p>Когда рационов не хватает, потери нарастают в <strong>3 фазы</strong>:</p>
            <ul>
                <li><strong>Фаза 1 (0–3 ч)</strong> — около 3&nbsp;% рабочих в час. Время успеть отреагировать.</li>
                <li><strong>Фаза 2 (3–8 ч)</strong> — около 6&nbsp;% рабочих и 2&nbsp;% Легионеров в час: Легионеры начинают дезертировать.</li>
                <li><strong>Фаза 3 (свыше 8 ч)</strong> — крах: около 11&nbsp;% рабочих, 5&nbsp;% Легионеров и 2&nbsp;% Мехов в час.</li>
            </ul>
            <p>Нижний предел в <strong>5&nbsp;000 рабочих</strong> предотвращает полное исчезновение. Без снабжения планета достигает его примерно за 24 часа при 50&nbsp;000 рабочих, за 30 часов при 100&nbsp;000, за 33 часа при 150&nbsp;000. Как только в амбар возвращается хоть один рацион, голод прекращается, а фазы начинаются с нуля. Отчёт предупреждает Вас о каждой новой фазе.</p>

            <h2 id="declenchement">Как запустить эмбарго</h2>
            <p>Эмбарго включается автоматически (игра проверяет каждую минуту), когда:</p>
            <ul>
                <li>планета-цель принадлежит игроку (планеты ИИ и базы Ктулху ему никогда не подвергаются);</li>
                <li>вражеские флоты <strong>стоят у причала на орбите</strong> — не в полёте и не втянуты в запланированный бой — и находятся в <strong>режиме атаки</strong> (что предполагает корабельное оружие);</li>
                <li><strong>суммарная тепловая сигнатура</strong> этих флотов достигает не менее <strong>10&nbsp;000</strong>.</li>
            </ul>
            <p>Все присутствующие вражеские флоты суммируются, даже если принадлежат разным игрокам. Исключаются только флоты альянса владельца и альянсов, связанных с ним <strong>Оборонительным союзом</strong> (Пакт о ненападении или Мирное соглашение не защищают), а также торговцы. Каждый корабль этих флотов учитывается, включая грузовые и зонды; сигнатура каждого корабля указана на Космической верфи.</p>
            <table>
                <thead>
                    <tr><th>Корабль</th><th>Сигнатура</th><th>Количество для 10&nbsp;000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Истребитель</td><td>1</td><td>10&nbsp;000</td></tr>
                    <tr><td>Корвет</td><td>7</td><td>1&nbsp;429</td></tr>
                    <tr><td>Фрегат</td><td>20</td><td>500</td></tr>
                    <tr><td>Боевой корабль</td><td>40</td><td>250</td></tr>
                    <tr><td>Крейсер</td><td>56</td><td>179</td></tr>
                    <tr><td>Броненосец</td><td>64</td><td>157</td></tr>
                    <tr><td>Эсминец</td><td>270</td><td>38</td></tr>
                    <tr><td>Материнский корабль</td><td>4&nbsp;000 (−10&nbsp;% для всего его флота)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>Материнский корабль снижает на 10&nbsp;% сигнатуру всего флота, который его несёт: 3 Материнских корабля сами по себе дают 12&nbsp;000 − 10&nbsp;% = 10&nbsp;800, достаточно для порога, но 2 не хватает (7&nbsp;200). Числа в таблице верны для флота без Материнского корабля; типы, разумеется, можно смешивать.</p>
            <p>Как только сигнатура осаждающих флотов снова опускается ниже 10&nbsp;000 (отбытие, уничтожение или отключённый режим атаки), блокада снимается.</p>
            <p>Флот рейда или вторжения, помеченный «в атаке» объединённой битвой, описанной в статье <em>Защита планет</em>, сохраняет этот маркер, если уцелел&nbsp;: если он остаётся на орбите, он учитывается в этой сигнатуре наравне с любым враждебным флотом.</p>

            <h2 id="effets">Что терпит осаждённая планета</h2>
            <ul>
                <li><strong>Дополнительная утечка рационов</strong> каждый час: Ваши рабочие ÷ 7 (150&nbsp;000 рабочих = 21&nbsp;429 рационов в час), берётся из амбара, затем из трюмов Ваших флотов у причала.</li>
                <li><strong>Производство рационов</strong> снижено на 30&nbsp;%.</li>
                <li><strong>Производство ниобия и воды</strong> снижено на 20&nbsp;%.</li>
                <li><strong>Рождаемость рабочих</strong> делится пополам.</li>
                <li><strong>Рынок заблокирован</strong>: никаких автоматических продаж торговцам.</li>
                <li><strong>Поставки заблокированы</strong>: разгружаться на планете могут только Ваши флоты и флоты членов Вашего альянса; остальные улетают со своим грузом.</li>
                <li><strong>Герои заблокированы</strong>: нельзя назначить героя на планету или снять его с неё.</li>
            </ul>

            <h2 id="famine-embargo">Голод под эмбарго: это хуже</h2>
            <p>Если рационы падают до 0 <strong>во время</strong> эмбарго, никаких фаз больше нет: с первого же часа планета теряет каждый час <strong>8&nbsp;%</strong> рабочих, <strong>3&nbsp;%</strong> Легионеров и <strong>3&nbsp;%</strong> Мехов, а утечка эмбарго продолжает вычерпывать любое прибывающее снабжение. Нижний предел в 5&nbsp;000 рабочих по-прежнему действует.</p>

            <h2 id="timings">Сколько можно продержаться?</h2>
            <p>Под эмбарго, без производства и снабжения:</p>
            <table>
                <thead>
                    <tr><th>Профиль планеты</th><th>Начало голода</th><th>Достижение нижнего предела в 5&nbsp;000 рабочих</th></tr>
                </thead>
                <tbody>
                    <tr><td>Маленькая (50&nbsp;000 рабочих, 100&nbsp;000 рационов)</td><td>~14 часов</td><td>~1,7 дня</td></tr>
                    <tr><td>Средняя (150&nbsp;000 рабочих, 800&nbsp;000 рационов)</td><td>~1,5 дня</td><td>~3,2 дня</td></tr>
                    <tr><td>Крепость (200&nbsp;000 рабочих, 2&nbsp;000&nbsp;000 рационов)</td><td>~2,9 дня</td><td>~4,7 дня</td></tr>
                </tbody>
            </table>

            <h2 id="defense">Как противостоять эмбарго</h2>
            <ul>
                <li><strong>Уничтожить осаждающий флот</strong>, чтобы снять блокаду.</li>
                <li><strong>Доставить снабжение</strong> — Ваши флоты и флоты членов Вашего альянса всегда могут разгружаться (миссия «Разгрузить и вернуться»).</li>
                <li><strong>Эвакуироваться</strong> — Ваши <em>исходящие</em> флоты не блокируются, Вы можете срочно вывезти свои ресурсы.</li>
                <li><strong>Строить Сельскохозяйственные силосы</strong> и запасать рационы <em>до того</em>, как всё пойдёт плохо.</li>
                <li><strong>Просить помощи у Вашего альянса</strong>, чтобы прорвать осаду вместе.</li>
            </ul>

            <h2 id="rapports">Отчёты во время эмбарго</h2>
            <p>Каждый час Вы (и каждый игрок, чей флот осаждает планету) получаете отчёт в меню <strong>Отчёт</strong>, вкладка <strong>Бои</strong>: прошедшее время, оставшиеся рационы, понесённые потери. Последний отчёт сообщает о снятии блокады. На странице <strong>Планеты</strong> карточка каждой планеты показывает также её Производство, Потребление, Утечку эмбарго, Баланс и расчётную Автономию.</p>

    combat_stats:
        title: "Понимание мощности войск"
        category: "combat"
        order: 7
        tags: "мощность,бонус,бой,политика,расчёт,колючая проволока,точность,мехи,фракция"
        summary: "Как сравнивается мощь Ваших единиц и что её повышает."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Наземная мощь</h2>
            <p>Точные значения, без бонусов:</p>
            <table>
                <thead>
                    <tr><th>Единица</th><th>Мощь</th><th>Роль</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Мех</strong></td><td>2&nbsp;200 в защите</td><td>Опора обороны: один Мех стоит примерно 367 Легионеров. Максимум 500 на планету. Он сражается только в защите: на борту флота он в штурме не участвует.</td></tr>
                    <tr><td><strong>Легионер (защита)</strong></td><td>6, +5&nbsp;% за уровень Колючей проволоки</td><td>Ядро гарнизона.</td></tr>
                    <tr><td><strong>Легионер (атака)</strong></td><td>от 5 до 7 за раунд при вторжении, от 5 до 6 при рейде (случайно в каждом раунде)</td><td>Единственная единица, атакующая на земле: рейд немного менее непредсказуем, чем вторжение.</td></tr>
                    <tr><td><strong>Рабочий (защита)</strong></td><td>1</td><td>Только при вторжении. 200&nbsp;000 рабочих весят столько же, сколько примерно 91 Мех.</td></tr>
                </tbody>
            </table>
            <p>В каждом раунде (не более 10) штурмующий наносит гарнизону десятую часть своей мощи атаки, а тот отвечает десятой частью своей мощи защиты. Урон убивает единицы в соответствии с их мощью: нужно 6 очков для защищающегося Легионера без бонусов, 2&nbsp;200 для Меха, 1 для рабочего. Пример: 10&nbsp;000 Легионеров при вторжении (средний бросок 6) наносят около 6&nbsp;000 очков за раунд — этого хватит, чтобы убить 1&nbsp;000 Легионеров без бонусов или менее 3 Мехов.</p>
            <p><strong>Баржи</strong> не сражаются: каждая перевозит 1&nbsp;000 Легионеров (+25&nbsp;% за уровень политического исследования «Спланированные вторжения»).</p>

            <h2 id="bonus">Что повышает Вашу мощь</h2>
            <ul>
                <li><strong>Исследование Колючая проволока</strong> — +5&nbsp;% к защите Ваших Легионеров за уровень (5 уровней, то есть максимум +25&nbsp;%).</li>
                <li><strong>Политические исследования</strong> (вкладка «Политики» страницы «Исследования») — Военная мощь (+10&nbsp;% за уровень к атаке и защите Легионеров), Бронирование Мехов (+10&nbsp;% за уровень к защите Мехов), Идеологическое укрепление (+20&nbsp;% за уровень к защите рабочих), Спланированные вторжения (+25&nbsp;% вместимости на баржу за уровень), Улучшенное вооружение (+10&nbsp;% за уровень к ракетам и лазерам кораблей), Бронирование кораблей (+10&nbsp;% брони кораблей за уровень).</li>
                <li><strong>Улучшения альянса</strong> — в космическом бою до +5&nbsp;% на каждый тип оружия, брони, щита и точности кораблей и до +10&nbsp;% для планетарной обороны.</li>
                <li><strong>Тактическое развёртывание</strong> — выбор защитника, меняющий ответный удар его гарнизона и порядок его потерь (см. <em>Вторжение на планету</em>).</li>
                <li><strong>Военный герой</strong> — прямой бонус к атаке и защите, как для героя атакующего флота, так и для героя, размещённого на планете.</li>
                <li><strong>Предметы</strong>, экипированные на героя.</li>
            </ul>
            <p>Исследование <strong>Военное усиление</strong> не даёт никаких боевых бонусов: оно открывает Казарму (уровень 1), Оборонительный форт (уровень 3), затем исследования Колючая проволока и Бронированные единицы (Мехи).</p>

            <h2 id="faction">Политический бонус (космические бои)</h2>
            <p>Бонус оружия в космическом бою идёт от <strong>политики Вашего альянса</strong>. Каждый строй побеждает соперника: <strong>Весы Миров</strong> побеждают <strong>Безмолвный Оплот</strong>, который побеждает <strong>Молот Звёзд</strong>, который побеждает <strong>Весы Миров</strong>.</p>
            <p>Когда политика <strong>атакующего</strong> побеждает политику защитника, всё его оружие (ракеты, лазеры, плазма) получает <strong>+20&nbsp;%</strong> на этот бой. Бонус применяется только к штурмующему: защитник рассчитывает на свою планетарную оборону. Он действует только в бою между флотами, а не против одних турелей (орбитальный бой режима атаки) и не на земле.</p>

            <h2 id="precision">Точность и боевые броски</h2>
            <p>В космическом бою каждая сторона делает <strong>один залп за раунд</strong>. Случайный бросок, выбираемый между точностью стороны и 100, затем делённый на 80, изменяет урон залпа от <strong>×0,3 до ×1,2</strong>. Ни один залп не промахивается: высокая точность не делает Ваши лучшие удары сильнее, она устраняет плохие броски.</p>
            <p>Точность стрельбы флота никогда не отображается в процентах&nbsp;: везде — Космическая верфь, страница управления флотом, вкладка «Статистика обороны» страницы «Оборона» и боевые отчёты — игра показывает <strong>средний множитель урона</strong>, который она даёт:</p>
            <ul>
                <li><strong>×0,66</strong> без единого вложения: каждый залп попадает между ×0,3 и ×1,2;</li>
                <li><strong>×0,94</strong> при полной точности: каждый залп попадает между ×0,63 и ×1,2;</li>
                <li><strong>×1,06</strong> для обороны планеты: каждый залп попадает между ×0,88 и ×1,2 — лучше, чем флот с полной точностью.</li>
            </ul>
            <p>Этот уровень зависит от очков <strong>настройки</strong>, вложенных в точность для каждой модели корабля (40 очков в день), и принадлежит именно ей&nbsp;: трата очков в другое место, на броню или оружие той же модели, никогда не снижает его. Бонусы точности альянса и героя прибавляются, никогда не превышая полную точность. Когда вместе сражаются несколько флотов, сторона использует среднее их точностей.</p>
            <p>Против противника, управляемого ИИ (бота), его точность никогда не опускается ниже фиксированной планки (средний множитель ×0,81)&nbsp;: бот, действительно вложившийся, её превосходит, а достаточно вложившийся игрок может сравняться с ним или превзойти его. Орды Ктулху всегда стреляют с ×0,94.</p>

    reports:
        title: "Игровые отчёты"
        category: "beginner"
        order: 9
        tags: "отчёт,рапорт,уведомление,бой,шпионаж,альянс,колонизация,вкладки,удалить,поделиться"
        summary: "Игра присылает Вам отчёты о каждом важном событии. Где их найти, что в них содержится и как с ними работать."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Где найти свои отчёты?</h2>
            <p>Откройте <strong>Отчёт</strong> в меню (на телефоне: кнопка <strong>Меню</strong>, затем <strong>Отчёт</strong>). Число новых отчётов отображается на этом пункте.</p>
            <p>Страница открывается на вкладке <strong>Все</strong> (Ваши 300 самых недавних отчётов). Остальные вкладки сортируют по категориям: <strong>Другое</strong>, <strong>Альянс</strong>, <strong>Cthulhu</strong>, <strong>Бои</strong>, <strong>Вторжения</strong>, <strong>Экономические</strong> и <strong>Флоты</strong>. Вкладка появляется, только если в ней есть хотя бы один отчёт, и показывает число непрочитанных. Каждый непрочитанный отчёт помечен надписью «Не прочитано»: коснитесь его строки, чтобы открыть.</p>
            <p>Сообщения других игроков находятся не здесь: они в разделе <strong>Сообщения</strong>.</p>
            <p>Вы также можете включить <strong>пуш-уведомления</strong>, чтобы получать оповещения на телефоне или в браузере (см. отдельную статью).</p>

            <h2 id="gerer">Читать, делиться, удалять</h2>
            <ul>
                <li><strong>Отметить прочитанным</strong>: кнопка открытого отчёта (достаточно и просто открыть его). <strong>Отметить всё как прочитанное</strong> вверху страницы обрабатывает все Ваши отчёты разом.</li>
                <li><strong>Создать ссылку для отправки</strong>: создаёт публичную ссылку на этот отчёт; кнопка <strong>Ссылка</strong> копирует её. Любой, у кого есть эта ссылка, может прочитать отчёт, даже без аккаунта.</li>
                <li><strong>Удалить</strong>: стирает отчёт сразу, без подтверждения и без корзины.</li>
            </ul>
            <p>Удаление выполняется отчёт за отчётом: ни архивации, ни группового удаления нет. Ваши отчёты сами с течением времени не стираются.</p>

            <h2 id="combat">Отчёты о боях и вторжениях</h2>
            <p>Вкладка <strong>Бои</strong>:</p>
            <ul>
                <li><strong>Боевой рапорт: Победа / Поражение</strong> — один из Ваших флотов сразился с вражеским флотом (космический бой).</li>
                <li><strong>Орбитальная оборона: Победа / Поражение</strong> — оборона Вашей планеты сразилась с вражеским флотом; атакующий получает со своей стороны <strong>Орбитальная атака: Победа / Поражение</strong>.</li>
                <li><strong>Планетарная оборона: Устояла / Уничтожена</strong> — отдельный отчёт для владельца, не выставившего ни одного собственного флота в объединённом сражении: его оборона устояла или была уничтожена.</li>
                <li><strong>Ядерная ракета</strong> — Ваша ракета поразила цель или была перехвачена; по Вам нанесена ракета или перехвачена у Вас.</li>
                <li><strong>Ваша планета под эмбарго!</strong> — по одному отчёту каждый час, пока одна из Ваших планет осаждена, затем последний отчёт, когда эмбарго снято. Осаждающие тоже получают свой.</li>
                <li><strong>Голод на вашей планете!</strong> — Ваши рационы закончились, и голод приносит потери.</li>
            </ul>
            <p>Вкладка <strong>Вторжения</strong>:</p>
            <ul>
                <li><strong>Рапорт о набеге</strong> — рейд, которому Вы подверглись или который устроили Вы (победа или поражение, в атаке или в обороне).</li>
                <li><strong>Рапорт о вторжении</strong> — попытка захвата планеты, с той или с другой стороны.</li>
            </ul>

            <h2 id="cthulhu">Отчёты Ктулху</h2>
            <ul>
                <li><strong>Тревога: орда приближается</strong> — орда Ктулху направляется к одной из Ваших планет.</li>
                <li><strong>Рапорт по одержимым: Оборона успешна / Атака отражена не полностью</strong> — результат нападения орды на Вашу планету. На сложности PvE «Сложно» заголовок становится <strong>Рапорт об атаке одержимых: Победа / Поражение</strong>.</li>
                <li><strong>Tower Defense Ктулху: Победа / Поражение</strong> — результат Вашей активной обороны.</li>
                <li><strong>Рапорт о контратаке: Победа / Поражение</strong> — Ваше вторжение на планету, удерживаемую Ктулху. Победа освобождает планету: она снова становится свободной, и улей не может отбить её в течение 72 часов.</li>
                <li><strong>Блокада Ктулху</strong>, <strong>Улей разрастается</strong>, <strong>Извержение улья</strong> — события Ктулху в Вашем секторе и их последствия.</li>
            </ul>

            <h2 id="flotte">Отчёты о флотах</h2>
            <p>Вкладка <strong>Флоты</strong>:</p>
            <ul>
                <li><strong>Ваш флот прибыл</strong> — Ваш флот достиг пункта назначения.</li>
                <li><strong>Доставка ресурсов</strong> — другой игрок разгрузил ресурсы на одной из Ваших планет.</li>
                <li><strong>Ваш флот завершил переработку!</strong> — Ваши переработчики закончили работу.</li>
            </ul>
            <p>Шпионаж отнесён во вкладку <strong>Другое</strong>: <strong>Анализ планеты</strong> (результат Вашего зонда) и <strong>Обнаружен шпионаж</strong> (кто-то попытался шпионить за одной из Ваших планет).</p>

            <h2 id="alliance">Отчёты альянса</h2>
            <ul>
                <li><strong>Дипломатия</strong> — Война объявлена (Вашим альянсом) или Война получена, оборонительный союз заключён или расторгнут, пакт о ненападении заключён или расторгнут, мирное соглашение заключено или истекло.</li>
                <li><strong>Участники</strong> — Новый участник, Участник ушёл, Участник исключён, Участник Game Over.</li>
            </ul>

            <h2 id="divers">Прочие отчёты</h2>
            <p>Вкладка <strong>Экономические</strong>:</p>
            <ul>
                <li><strong>Рапорт империи</strong> — Ваш ежедневный экономический итог, каждый день в 18:59 (по парижскому времени).</li>
                <li><strong>⚠ Надвигающееся банкротство!</strong> — Ваши ежедневные расходы превышают доходы, а Ваших Биткойнов не хватает на один день дефицита (не чаще одного предупреждения в 24 часа).</li>
                <li><strong>Продажа торговцам</strong> — Ваш флот продал свой груз торговцу.</li>
                <li><strong>Бонус за вход</strong> — Биткойны дня и, в некоторые дни, предмет.</li>
            </ul>
            <p>Вкладка <strong>Другое</strong>:</p>
            <ul>
                <li><strong>Колонизация планеты</strong> — основана новая планета.</li>
                <li><strong>Анализ планеты</strong> и <strong>Обнаружен шпионаж</strong> — см. выше.</li>
                <li><strong>Завершённые очереди</strong> (Здания, Корабли, Оборона, Исследования) — очередь пуста: можно запускать заново.</li>
                <li><strong>Герои и тюрьма</strong> — герой захвачен, сбежал, освобождён или казнён, тюремная тревога, позиция раскрыта, предмет украден или найден, новый герой, требования выкупа.</li>
                <li><strong>Арена</strong> — полученный вызов, результат дуэли, турнир, еженедельная награда, арена альянса.</li>
                <li><strong>Разное</strong> — окончание Вашей защиты новичка, флот отправлен назад, лунная миссия провалилась.</li>
            </ul>

            <h2 id="compte-valide">Аккаунт, который нужно подтвердить</h2>
            <p>⚠️ Чтобы <strong>отправлять сообщения или Биткойны</strong> другому игроку, а также создавать альянс или вступать в него, Ваш аккаунт должен быть <strong>подтверждён</strong>, а <strong>e-mail подтверждён</strong>.</p>
            <p>Пробный аккаунт (созданный через «Тест без email») подтверждается через пункт <strong>Подтвердить аккаунт</strong> в меню: там Вы выбираете псевдоним, пароль и указываете адрес e-mail. После этого отправляется письмо с подтверждением: перейдите по ссылке из него. Не получили его? Откройте <strong>Настройки</strong> (внизу меню на компьютере, в панели «Меню» на телефоне): раздел <strong>Подтвердить адрес электронной почты</strong> позволяет <strong>отправить его повторно</strong> (не более трёх раз в час).</p>

    battle_reports:
        title: "Читаем отчёт о бое"
        category: "combat"
        order: 8
        tags: "отчёт,рапорт,бой,победа,поражение,анализ"
        summary: "После каждого боя приходит подробный отчёт. Вот как его расшифровать, чтобы лучше бить в следующий раз."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="gde">Где их найти</h2>
            <p>Все боевые отчёты приходят в меню <strong>Отчёт</strong>. Вкладка <strong>Бои</strong> объединяет космические и орбитальные бои, планетарную оборону, ядерные удары, эмбарго и голод; вкладка <strong>Вторжения</strong> объединяет рейды и вторжения; бои против Ктулху имеют свою вкладку <strong>Cthulhu</strong>.</p>

            <h2 id="tipy">Типы боевых отчётов</h2>
            <ul>
                <li><strong>Космический бой</strong> — два флота встретились.</li>
                <li><strong>Орбитальный бой</strong> — Ваша планетарная оборона перехватила флот.</li>
                <li><strong>Планетарная оборона</strong> — объединённая битва, в которой Вы не выставили ни одного собственного флота: Ваши турели, щиты и космическая база устояли или были уничтожены.</li>
                <li><strong>Безоружный флот уничтожен</strong> — сторона без корабельного оружия (грузовые корабли, зонды, переработчики) уничтожена без боя.</li>
                <li><strong>Рейд</strong> — попытка грабежа (с Вашей стороны или против Вас).</li>
                <li><strong>Вторжение</strong> — попытка захвата планеты.</li>
                <li><strong>Ядерный удар</strong> — бомба отправлена, получена или перехвачена.</li>
                <li><strong>Эмбарго</strong> — почасовой отчёт во время осады и последний, когда она снимается.</li>
                <li><strong>Голод</strong> — отправляется при каждой новой фазе голода (без эмбарго).</li>
            </ul>

            <h2 id="soderzhanie">Что содержит отчёт</h2>
            <ul>
                <li><strong>Задействованные силы</strong> — начальная броня, щит, оружие каждой стороны и состав каждого флота. Точность стрельбы указана там не в процентах, а в виде <strong>среднего множителя урона</strong>, который она даёт (×0,66 без каких-либо вложений, ×0,94 при полной точности, ×1,06 для обороны планеты): ни один выстрел никогда не промахивается, лучшая точность повышает нижнюю границу Вашего урона.</li>
                <li><strong>Залпы</strong> — число залпов, выпущенных этой стороной, прошедших через щит противника, и был ли её собственный щит пробит или выстоял.</li>
                <li><strong>Заряд щита</strong> — для блока флота процент заряда в начале и в конце боя с его общей ёмкостью: Ваш щит не возвращается автоматически к 100&nbsp;% от боя к бою, он заряжается постепенно (см. статью <em>Космический бой</em>).</li>
                <li><strong>Оставшаяся броня</strong> — что осталось стоять и его доля от начальной брони. Уничтоженная сторона вместо этого показывает <strong>излишек урона</strong>, принятого сверх её брони: это Ваш запас победы.</li>
                <li><strong>Принятый урон</strong> — два счётчика на сторону: <strong>корпус</strong> (то, что не остановил щит) и <strong>щит</strong> (то, что поглотил щит). Ваши потери вытекают только из корпуса.</li>
                <li><strong>Потери</strong> — корабль за кораблём, с каждой стороны.</li>
                <li><strong>Подробности планетарной обороны</strong> — потери турелей, а также Ваш Щит, Большой щит и Космическая база, если они у Вас есть, с показателем обороны и тегом «Атака» планеты для объединённой битвы.</li>
                <li><strong>Награбленные ресурсы</strong> (для рейдов) и <strong>образовавшиеся обломки</strong> — на переработку!</li>
                <li><strong>Полученные Очки Войны</strong> и итоговый результат.</li>
            </ul>

            <h2 id="analiz">Как извлечь урок</h2>
            <ul>
                <li>Сначала посмотрите на <strong>принятый урон</strong>: строка «корпус» считает всё, что не остановил Ваш щит (долю, которая его пробивает, затем всё, когда он пуст); строка «щит» — то, что поглотил Ваш щит: это не стоит ни одного корабля, только заряда, который восстанавливается на 10&nbsp;% каждые 3 часа.</li>
                <li>Сравните два <strong>множителя урона</strong>: это единственное число, напрямую сравнимое между сторонами. Затем посмотрите на <strong>оставшуюся броню</strong> — победить, сохранив 5&nbsp;% своей брони, и победить, сохранив 70&nbsp;%, — не одно и то же. Большой излишек у противника означает, что Вы переплатили за победу.</li>
                <li>Потери среди Ваших <strong>истребителей</strong> нормальны, даже когда Ваш щит держится: без щита они принимают свою долю корпуса пропорционально броне, плюс до половины ударов, предназначенных Вашим тяжёлым кораблям, — в этом их роль заслона.</li>
                <li>Много <strong>залпов, прошедших через щит противника</strong>? Наращивайте плазму (×4 против щитов), чтобы пробивать быстрее.</li>
                <li><strong>Достигнуто 100 раундов</strong>: побеждает сторона, сохранившая больше брони (атакующий — при равенстве) — если это случается с Вами в атаке, Вашему флоту не хватает мощи или точности.</li>
                <li><strong>Сохраняйте важные отчёты</strong> (не удаляйте их) и используйте «Создать ссылку для отправки», чтобы показывать их Вашему альянсу: они служат доказательствами в спорах.</li>
            </ul>

    combat_simulator:
        title: "Симулятор боя"
        category: "combat"
        order: 9
        tags: "симулятор,бой,симуляция,флот,потери,оценка,отчёт"
        summary: "Оцените риски перед атакой: прогоните тысячу раз бой против флота, замеченного в отчёте, на настоящем движке игры."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="zachem">Для чего это нужно</h2>
            <p>Вкладка <strong>Симулятор боя</strong> страницы «Флоты» оценивает, чем Вы рискуете перед атакой. Она <strong>1&nbsp;000 раз</strong> проигрывает бой между одним из Ваших флотов и флотом противника на <strong>настоящем движке игры</strong> — те же формулы, те же случайные броски. Ничего реально не задействуется: ни один корабль не двигается, ни один не погибает.</p>

            <h2 id="istochnik">Источник: боевой отчёт</h2>
            <p>Флот противника берётся из одного из Ваших <strong>недавних отчётов о космическом бое</strong> (тех, где есть строка «Принятый урон»): это единственные честные источники, так как в них содержится реальная мощь наблюдавшейся стороны, с учётом бонусов. Симулятор предлагает 30 самых недавних; орбитальные отчёты, отчёты о рейдах или вторжениях источником не служат. Шпионский отчёт даёт только количество кораблей без их реальных характеристик — симуляция была бы лживой, поэтому он не предлагается.</p>
            <p>Выберите отчёт, сторону, с которой сражаться (одну из двух армад отчёта), затем один из Ваших вооружённых флотов, где бы он ни находился. Вы всегда симулируете как <strong>атакующий</strong>, не у себя дома: без Ваших турелей и планетарных щитов, с Вашими реальными бонусами (герой, альянс, политика в сравнении с политикой нынешнего альянса противника) и тем щитом, который у Вашего флота <strong>сейчас</strong> — изношенный флот симулируется изношенным.</p>

            <h2 id="chtenie">Как читать результат</h2>
            <ul>
                <li><strong>Доля побед</strong> — доля из 1&nbsp;000 розыгрышей, в которых Вы побеждаете.</li>
                <li><strong>Диапазон потерь по кораблям</strong> (минимум, медиана, максимум) — только по победным розыгрышам: в случае поражения Ваш флот был бы уничтожен полностью.</li>
                <li><strong>Пример хода боя</strong> — медианный победный розыгрыш, оформленный как отчёт и чётко помеченный «СИМУЛЯЦИЯ».</li>
            </ul>

            <h2 id="granicy">Ограничения, о которых нужно помнить</h2>
            <ul>
                <li>Флот противника — тот, что <strong>наблюдался на дату отчёта</strong>: с тех пор он мог быть перестроен, улучшен или усилен.</li>
                <li>Активные таланты героя противника (Устрашение, Тактик) не проигрываются; его пассивные бонусы уже включены в цифры отчёта. Его планетарная оборона учитывается, только если исходным отчётом был бой у него дома (какой она была в тот день): если Вы атакуете его дома по отчёту, полученному в другом месте, его турелей там нет.</li>
                <li><strong>Симуляции в роли защитника нет</strong>: Ваш флот всегда атакующий, не у себя дома. Чтобы оценить угрозу, симулируйте свой флот против вражеского флота из Вашего отчёта: Ваши турели и планетарные щиты там не учитываются (настоящий бой у Вас дома будет выгоднее), но и враг не получает там +20&nbsp;%, которые имел бы в атаке, если его строй побеждает Ваш.</li>
                <li>Лимит <strong>20 симуляций в день</strong> (обнуляется в полночь по парижскому времени; оставшийся счётчик отображается): симулятор помогает принять решение, но не заменяет риск боя.</li>
            </ul>

    colonization:
        title: "Колонизировать новую планету"
        category: "planet"
        order: 1
        tags: "колонизация,планета,колонизатор,терраформирование,необитаемая,предел,расширение"
        summary: "Расширьте свою империю, колонизируя необитаемые планеты: как это сделать, предел числа планет, заданный Терраформированием, доступные размеры."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Зачем колонизировать?</h2>
            <ul>
                <li><strong>Больше производства</strong>: у каждой планеты своя экономика.</li>
                <li><strong>Больше параллельных очередей строительства</strong>.</li>
                <li><strong>Меньше риска</strong>: Ваши яйца больше не лежат в одной корзине.</li>
                <li><strong>Стратегические позиции</strong>: близость к торговцам, союзникам, целям.</li>
            </ul>

            <h2 id="etapes">Как колонизировать</h2>
            <p>Колонизируется <strong>необитаемая планета</strong>: на карте она называется «Необитаемая». Позиция «Пусто» (без планеты) не колонизируется.</p>
            <ol>
                <li>Убедитесь, что у Вас осталось место: у Вас может быть <strong>2 планеты + 1 за уровень Терраформирования</strong> (см. ниже). Вы начинаете с <strong>одним колонизатором</strong> на земле на Вашей планете: поэтому для 2-й планеты никаких исследований не нужно.</li>
                <li>Чтобы изготавливать другие колонизаторы, исследуйте <strong>Терраформирование</strong> 1-го уровня. Они строятся на Космической верфи: по 5&nbsp;500 ниобия, 7&nbsp;000 воды, 2&nbsp;000 рабочих и 5 Легионеров каждый.</li>
                <li>Создайте флот, содержащий колонизатор (страница <em>Флоты</em> или кнопка <em>Создать флот</em> на карте).</li>
                <li>На <em>Космической карте</em> нажмите на необитаемую планету, затем <em>Взаимодействие</em>. Выберите флот, миссию <strong>Колонизировать</strong>, затем <em>Отправить</em>. Полёт оплачивается Биткойнами.</li>
            </ol>
            <p>Если Ваш флот уже находится на орбите необитаемой планеты, кнопка <em>Колонизировать</em> появляется прямо на её карточке.</p>
            <p>Колонизатор не везёт ресурсов. Чтобы помочь колонии, добавьте к флоту гружёные грузовые корабли, а затем выгрузите их по прибытии (<em>Разгрузить всё</em>).</p>
            <p>По прибытии колонизатор расходуется, а планета основывается под названием «Колония». Вы получаете отчёт, и планета появляется в селекторе планет верхней панели. Переименуйте её на странице <strong>Планеты</strong>.</p>

            <h2 id="initial">Что у неё есть на старте</h2>
            <p>Только что колонизированная планета начинает с <strong>200 ниобия, 150 воды, 2&nbsp;500 рабочих и 20 Легионеров</strong>. Всё остальное нужно строить: на планете, в которой никогда не жили, нет ни одного здания, даже Космической верфи.</p>

            <h2 id="limite">Сколько планет максимум?</h2>
            <p>Вы можете владеть <strong>2 планетами + 1 за уровень Терраформирования</strong> (максимум 18 уровней). Ваши луны не считаются.</p>
            <table>
                <thead>
                    <tr><th>Терраформирование</th><th>Планет максимум</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>В альянсе со строем <em>Весы Миров</em> исследование альянса <strong>Внедрение Весы Миров</strong> добавляет 1 колонизируемую планету за уровень (5 уровней, то есть до 25 планет).</li>
                <li>Для <strong>вторжений</strong> предел равен 2 + Терраформирование + уровень <strong>Империи без границ</strong> (исследование альянса строев <em>Молот Звёзд</em> и <em>Безмолвный Оплот</em>, 5 уровней). Если Вы вторгаетесь сверх этого, завоёванная планета становится базой Ктулху, а не переходит к Вам.</li>
                <li>В режимах <em>Найти и уничтожить</em>, <em>Доминирование</em> и <em>Battle Royale</em> все исследования с самого начала на максимуме: сразу 20 планет.</li>
            </ul>

            <h2 id="choix">Где колонизировать?</h2>
            <ul>
                <li>Рядом с <strong>торговцем</strong>: лёгкая экономика на отправке грузовых кораблей.</li>
                <li>Рядом с Вашими <strong>союзниками</strong>: взаимная защита.</li>
                <li>На планете с <strong>большой территорией</strong>: размер не меняет производство, но даёт больше места для строительства. На карте чем крупнее значок планеты, тем больше на ней территории.</li>
                <li>Избегайте слишком далёкого уединения: пути длиннее, снабжение сложнее.</li>
            </ul>
            <p><strong>Ограничений по размеру нет</strong>: любую необитаемую планету, малую или большую, можно колонизировать, пока у Вас есть место. Исходные размеры свободных планет:</p>
            <table>
                <thead>
                    <tr><th>Где</th><th>Территория</th><th>Космос</th></tr>
                </thead>
                <tbody>
                    <tr><td>Системы на краю галактики (с 1 по 9, с 92 по 99 и те, что оканчиваются на 0 или 1)</td><td>80 – 95 (несколько по 25)</td><td>2 – 21 (5 у тех, что по 25)</td></tr>
                    <tr><td>Системы 45, 46, 55 и 56 (центр)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>Все остальные системы</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>Самые большие, в центре, охраняются массивной ордой пришельцев: отправленный в одиночку колонизатор там будет уничтожен. Когда планета Ваша, Плавучий город добавляет до 50 территорий, а Орбитальная станция до 25 мест в космосе (исследование <em>Территориальное расширение</em>, см. <em>Управление планетой</em>).</p>

    planet_types:
        title: "Всё, что можно найти на карте"
        category: "planet"
        order: 2
        tags: "планета,необитаемая,луна,солнце,торговец,пришелец,обломки,астероид,ктулху,колонизация"
        summary: "Различные объекты, видимые на галактической карте, и что с ними можно делать."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">8 типов объектов</h2>
            <table>
                <thead>
                    <tr><th>Тип</th><th>Описание</th><th>Возможные действия</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Населённая планета</strong></td><td>Принадлежит игроку (или боту), который на ней строит, производит и размещает свои войска.</td><td>Зондировать, грабить, вторгаться, ядерный удар, атаковать флоты на орбите.</td></tr>
                    <tr><td><strong>Необитаемая планета</strong></td><td>Свободная планета, названная на карте «Необитаемая». Чем крупнее её значок, тем больше на ней территории.</td><td><strong>Колонизировать.</strong></td></tr>
                    <tr><td><strong>Луна</strong></td><td>Создаётся Лунаром на пустой позиции, богатой обломками. Производит 20 рационов в минуту.</td><td>Грабить или вторгаться флотом на орбите, ядерный удар, атаковать флоты на орбите. Луну нельзя зондировать.</td></tr>
                    <tr><td><strong>Солнце</strong></td><td>Всегда в позиции 13 каждой системы. Не колонизируется.</td><td>Никаких.</td></tr>
                    <tr><td><strong>Пустая позиция</strong></td><td>Позиция «Пусто», без планеты. Не колонизируется.</td><td>Создать луну (если на ней есть не менее 2 млн ниобия и 2 млн воды в обломках), развернуть радар, развернуть глушитель.</td></tr>
                    <tr><td><strong>Торговец</strong></td><td>NPC, которого нельзя ни грабить, ни захватить. Он покупает Ваши ресурсы за Биткойны.</td><td>Продавать (миссия <em>Разгрузить и вернуться</em>).</td></tr>
                    <tr><td><strong>База пришельцев / Ктулху</strong></td><td>База улья, защищаемая постоянным гарнизоном.</td><td>Вторгнуться, чтобы освободить её (уран, очки войны и снижение Угрозы вселенной).</td></tr>
                    <tr><td><strong>Астероидное поле</strong></td><td>Появляется само: ниобий, вода или уран. Пополняется каждые 7–40 часов и часто охраняется пришельцами.</td><td>Перерабатывать.</td></tr>
                </tbody>
            </table>
            <p>После боя <strong>обломки</strong> (ниобий и вода) могут также плавать в любой позиции, включая планету: их отмечает значок. См. статью <em>Переработка</em>.</p>

            <h2 id="reperer">Как найти их на карте</h2>
            <p>У каждого типа свой значок, а размер планеты на карте отражает её территорию. Нажмите (или коснитесь) объекта, чтобы открыть его карточку: владелец, точные территория и космос (если позиция в зоне действия Ваших радаров), возможные обломки. Кнопка <em>Взаимодействие</em> на карточке открывает доступ к действиям и отправке флота; она появляется, как только у Вас есть хотя бы один флот на месте.</p>

            <h2 id="lunes">Особый случай: луны</h2>
            <p>Луны создаются специальным кораблём, <strong>Лунаром</strong> (иногда называемым Moon Maker), на пустой позиции, где есть не менее 2 млн ниобия и 2 млн воды в обломках. Луна производит фиксированное количество — <strong>20 рационов в минуту</strong> (1&nbsp;200 в час до бонусов): столько же, сколько Сельскохозяйственное поле 7–8-го уровня на планете. Её рационы остаются на луне: перевозите их грузовыми кораблями на планеты, которым их не хватает. См. статью <em>Луны</em>.</p>

    planet_management:
        title: "Управление планетой"
        category: "planet"
        order: 3
        tags: "управление,планета,производство,вместимость,специализация,территория,плавучий город,орбитальная станция,герой"
        summary: "Как оптимизировать производство, организовать пространство и при желании специализировать планету."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Основы, которые нужно освоить</h2>
            <ul>
                <li><strong>Уровни производства</strong>: регулярно повышайте Шахту Niobium, Экстрактор воды и Сельскохозяйственное поле.</li>
                <li><strong>Хранение</strong>: без достаточных запасов (Склад Niobium, Резервуар воды, Сельскохозяйственный силос) производство упирается в потолок и останавливается.</li>
                <li><strong>Население</strong>: Большой город (+25&nbsp;000 рабочих максимум за уровень) и Мегаполис (+80&nbsp;000) повышают Ваш предел рабочих и скорость их прибытия; Лагерь рабов добавляет 2&nbsp;500 мест за уровень.</li>
                <li><strong>Минимальная оборона</strong>: Оборонительный форт и несколько Мехов — это основа.</li>
            </ul>

            <h2 id="optimiser">Оптимизация планеты</h2>
            <ol>
                <li>Стройте производящие здания <strong>парами</strong> (Шахта и Экстрактор часто растут вместе).</li>
                <li>Не хватает места? Исследуйте <strong>Территориальное расширение</strong> (доступно после Терраформирования 18-го уровня), затем стройте:
                    <ul>
                        <li><strong>Плавучий город</strong> (1-й уровень Территориального расширения): +10 территории за уровень;</li>
                        <li><strong>Орбитальную станцию</strong> (2-й уровень): +5 космоса за уровень.</li>
                    </ul>
                    Каждое растёт до 5-го уровня и оплачивается очками войны: 2&nbsp;000 × целевой уровень (30&nbsp;000 очков войны за все 5 уровней). Иначе разрушьте ставшее ненужным здание.</li>
                <li>Следите за <strong>продовольственной автономией</strong>. Едят только рабочие, из расчёта 1 рацион в час на 500 рабочих. Один уровень Сельскохозяйственного поля кормит 81&nbsp;000, один уровень Аэропонной фермы — 111&nbsp;000.</li>
                <li><strong>Луна</strong> производит 1&nbsp;200 рационов в час. Перевозите их грузовыми кораблями на свои планеты или оставьте на орбите флот, гружёный рационами: планета берёт из него, когда её амбар пуст.</li>
            </ol>

            <h2 id="specialiser">Специализация планет</h2>
            <p>Несколько планет — возможность специализировать их в зависимости от положения и зданий:</p>
            <ul>
                <li><strong>Экономическая планета</strong>: много шахт, рабочих, продажа ближайшим торговцам.</li>
                <li><strong>Военная планета</strong>: Космическая верфь, Оружейный завод, Тяжёлая промышленность, мощная оборона, чтобы размещать там Ваш флот.</li>
                <li><strong>Планета исследований</strong>: высоко поднятый Исследовательский центр, чтобы разместить много учёных (их реальное влияние на скорость исследований см. в <em>Рабочие и учёные</em>).</li>
                <li><strong>Пограничный форпост</strong>: Космический радар, Глушитель радара, зонды, турели. Служит для наблюдения за соседом или его сдерживания.</li>
            </ul>

            <h2 id="capitale">Куда отправляется Ваш герой, если теряет место?</h2>
            <p>Планеты-столицы нет. Герой никогда не уничтожается. Если его флот уничтожен или его планета потеряна, он может быть <strong>захвачен</strong> игроком, у которого есть Тюрьма: риск 20&nbsp;% в космическом бою, 35&nbsp;% при вторжении.</p>
            <p>В противном случае он автоматически присоединяется к <strong>самой старой из Ваших планет или лун, на которой ещё нет героя</strong>. Если таких нет, Ваш главный герой отправляет второстепенного героя из резерва, чтобы тот занял его место.</p>

    planet_abandon:
        title: "Покинуть планету"
        category: "planet"
        order: 4
        tags: "покинуть,планета,удаление,game over"
        summary: "Когда это хорошая идея, как это сделать и почему в некоторых случаях стоит воздержаться."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Зачем покидать планету?</h2>
            <ul>
                <li>Она <strong>слишком уязвима</strong> для атак и обходится Вам дороже, чем приносит.</li>
                <li>Она <strong>неудачно расположена</strong> (далеко от всего, трудно защищать).</li>
                <li>Вы хотите <strong>колонизировать более удачную планету</strong>, но достигли предела по числу планет.</li>
            </ul>

            <h2 id="comment">Как это сделать</h2>
            <p>Откройте страницу <strong>Планеты</strong>: ссылка <strong>Покинуть</strong> находится рядом с координатами планеты. Игра спросит: «Вы хотите покинуть планету?»; после подтверждения кнопкой <em>Покинуть</em> отказ от планеты происходит <strong>мгновенно и бесповоротно</strong>.</p>
            <p>Ссылка появляется только в том случае, если покинуть планету возможно:</p>
            <ul>
                <li>у Вас остаётся хотя бы одна другая планета (луны не в счёт);</li>
                <li>это не луна: луну покинуть нельзя никогда;</li>
                <li>ни один чужой флот в режиме атаки не направляется к ней и не стоит на её орбите.</li>
            </ul>
            <p>Прежде чем бросить планету, <strong>эвакуируйте ресурсы, Легионеров, Мехов и корабли на поверхности</strong> на другую планету: всё, что останется, будет потеряно. Герой, находящийся на планете, автоматически переносится на другую Вашу планету или луну, где ещё нет героя.</p>
            <p>Что станет с планетой:</p>
            <ul>
                <li>на сервере без улья Ктулху она снова становится необитаемой, разрушенной планетой: от неё остаются только Космическая верфь и Наземный радар 1-го уровня;</li>
                <li>на сервере с ульем маленькая планета, сохранившая исходный размер (25 территории, 5 космоса), просто освобождается вместе со зданиями; любая другая планета становится <strong>базой пришельцев</strong>.</li>
            </ul>
            <p><strong>Можно ли отменить?</strong> Нет: нет ни отсрочки, ни возврата. Чтобы вернуть планету, её нужно отвоевать. Если она снова стала свободной, колонизируйте её заново (нужны колонизатор и свободное место). Если она стала базой пришельцев, захватите её, чтобы освободить, а затем колонизируйте заново.</p>

            <h2 id="danger">А как же моя последняя планета?</h2>
            <p>Покинуть её нельзя: пока у Вас остаётся только одна планета, игра откажет (луны не в счёт). Зато <strong>потеря</strong> последней планеты, например в результате вторжения, приводит к <strong>Game Over</strong>: см. статью <em>Game Over</em>.</p>

    galaxy_navigation:
        title: "Навигация по галактике"
        category: "planet"
        order: 5
        tags: "галактика,сектор,навигация,карта,вселенная,координаты,система,торговец,гиперпространство"
        summary: "Как устроена вселенная, как читать координаты и как пользоваться картой."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Как устроена вселенная</h2>
            <p>Вселенная — это иерархия:</p>
            <ul>
                <li><strong>Вселенная</strong> сервера содержит одну или несколько <strong>Галактик</strong>: новая галактика добавляется автоматически, когда свободных стартовых планет становится мало, — до 32. Вкладка <strong>Вселенная</strong> Космической карты показывает, сколько их. В Battle Royale галактика только одна.</li>
                <li>Каждая <strong>Галактика</strong> содержит 100 <strong>Секторов</strong> (сетка 10×10, нумерация от 1 до 100 по строкам). Космическая карта называет их «системами».</li>
                <li>Каждый <strong>Сектор</strong> содержит 25 <strong>Позиций</strong> (сетка 5×5).</li>
            </ul>
            <p>На каждой позиции может находиться планета (обитаемая или нет), торговец, база пришельцев, поле обломков, луна, либо она может быть пустой. Позиция 13, в центре сектора, — всегда солнце. Торговцы находятся в 20 фиксированных секторах каждой галактики: 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 и 56.</p>

            <h2 id="coordonnees">Как читать координаты</h2>
            <p>Формат: <strong>Галактика:Сектор:Позиция</strong>, например <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — первая галактика;</li>
                <li><strong>5</strong> — пятый сектор этой галактики (в первой строке сетки);</li>
                <li><strong>12</strong> — двенадцатая позиция в этом секторе.</li>
            </ul>

            <h2 id="carte">Как пользоваться картой</h2>
            <p>Страница <strong>Космическая карта</strong> (меню слева) показывает космический вид. Вы можете:</p>
            <ul>
                <li>Перемещаться между галактиками и секторами.</li>
                <li>Нажимать на позицию, чтобы увидеть, что на ней находится.</li>
                <li><strong>Отправить флот напрямую</strong>: нажмите на клетку, затем на <strong>Взаимодействие</strong> (кнопка появляется, как только хотя бы один из Ваших флотов стоит на месте), выберите флот и миссию и нажмите <strong>Отправить</strong>. В той же панели предлагаются быстрые действия в зависимости от клетки: <em>Зондировать планету</em>, <em>Колонизировать планету</em>, <em>Развернуть радар</em> или <em>Развернуть глушитель</em>, <em>Отправить ядерную ракету</em>.</li>
                <li>Видеть позиции союзников, врагов и торговцев (в зависимости от Ваших отношений и радара).</li>
            </ul>
            <p><strong>Флоты в пути</strong> отображаются как маленькие анимированные корабли, которые в реальном времени скользят между планетой отправления и пунктом назначения. <strong>Цветной ореол</strong> показывает принадлежность: <strong>синий</strong> = Вы, <strong>зелёный</strong> = альянс и союзники, <strong>серый</strong> = пакт/мир, <strong>пурпурный</strong> = торговец, <strong>фиолетовый</strong> = пришельцы, <strong>красный</strong> = враг. <strong>Размер</strong> отражает сигнатуру флота. Ваши флоты и флоты Вашего альянса видны всегда; остальные появляются только в том случае, если Ваш <strong>радар</strong> покрывает сектор. При дальнем перелёте через несколько секторов маленький корабль появляется лишь на последней части пути — при входе в сектор назначения, — а не на протяжении всего путешествия.</p>

            <h2 id="hyperespace">Путешествия между галактиками</h2>
            <p>Чтобы попасть из одной галактики в другую, нужно исследование <strong>Технология гиперпространства</strong>. Расстояние всегда равно 18 (примерно 6 секторов: меньше, чем пересечение галактики), но топливо стоит дорого: сигнатура флота, делённая на 8, в Bitcoin (125 Bitcoin на 1&nbsp;000 истребителей). Подробности — в статье <em>Перемещение и расстояние</em>.</p>

    radar_jammer:
        title: "Радар и глушение"
        category: "planet"
        order: 6
        tags: "радар,глушитель,jammer,обнаружение,наблюдение,сканер"
        summary: "Видеть, что движется в секторе, и скрывать свои планеты от вражеских радаров."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Радар и глушитель</h2>
            <ul>
                <li><strong>Радар</strong> — показывает сектор, в котором он находится: планеты и перемещающиеся флоты ещё до их прибытия.</li>
                <li><strong>Глушитель</strong> — скрывает <strong>одну планету</strong> от вражеских радаров, которые не мощнее его: информацию о ней, сигнатуру флотов, направляющихся к ней, а также пункт отправления или назначения флотов, которые вылетают с неё или летят к ней.</li>
            </ul>

            <h2 id="detection">Доступные радары</h2>
            <table>
                <tr><th>Тип</th><th>Где</th><th>Роль</th></tr>
                <tr><td><strong>Наземный радар</strong> (здание)</td><td>На планете (наземный слот)</td><td>+1 к мощности радара за уровень. Требуется: Сканер системы 1-го уровня.</td></tr>
                <tr><td><strong>Космический радар</strong> (здание)</td><td>На планете (космический слот)</td><td>Тот же эффект, +1 за уровень: полезен, когда на поверхности не хватает места. Требуется: Сканер системы 3-го уровня.</td></tr>
                <tr><td><strong>Радарный корабль</strong></td><td>Разворачивается на пустой клетке</td><td>Устанавливает радар мощности 1 на 2&nbsp;ч: удобно для наблюдения за сектором, где у Вас нет планеты.</td></tr>
            </table>
            <p>Радар покрывает весь сектор, в котором находится, и только его. Уровни двух зданий одной планеты суммируются; в секторе учитывается лучшая планета (Ваша, планета члена Вашего альянса или планета союзника). Герой-Исследователь, находящийся на планете, усиливает её радар: +1 начиная с 5-го уровня (черта Разведчик), в сумме +3 начиная с 15-го уровня (дополнительно черта Картограф).</p>
            <p>Игра предупреждает Вас уведомлением, когда вражеский флот направляется к Вашей планете, есть у Вас радар или нет; радар служит для того, чтобы <em>видеть</em> флоты и планеты сектора.</p>

            <h2 id="brouillage">Доступные глушители</h2>
            <table>
                <tr><th>Тип</th><th>Где</th><th>Роль</th></tr>
                <tr><td><strong>Глушитель радара</strong> (здание)</td><td>На планете (космический слот)</td><td>+1 к мощности глушения за уровень. Пока она равна или превышает вражеский радар в секторе, планета скрыта от этого врага. Требуется: Сканер системы 5-го уровня.</td></tr>
                <tr><td><strong>Корабль-глушитель</strong></td><td>Разворачивается на пустой клетке</td><td>Устанавливает глушитель мощности 1 на 1&nbsp;ч на этой клетке. Он не защищает флот в полёте.</td></tr>
            </table>
            <p>Пример: на Вашей планете Глушитель радара 3-го уровня. Враг, чей лучший радар в секторе имеет 3-й уровень, её не видит; с радаром 4-го уровня — видит.</p>

            <h2 id="korabli-na-zemle">Как увидеть корабли на поверхности</h2>
            <p><strong>Наземная сигнатура</strong> — корабли, стоящие на планете, — подчиняется чуть более мягкому правилу: один из Ваших флотов <strong>на орбите</strong> видит её сразу, даже без радара. Но только для этой планеты.</p>
            <p><strong>Радар</strong> по-прежнему даёт такое наблюдение <strong>на расстоянии</strong>, по всему сектору. А <strong>Глушитель радара</strong> на планете закрывает наблюдение: без радара, превосходящего глушитель, наземная сигнатура снова становится невидимой, даже если над планетой находится флот.</p>

            <h2 id="strategie">Как ими пользоваться</h2>
            <ul>
                <li><strong>Радар</strong> на каждой планете: как минимум Наземный радар, чтобы видеть, что движется в Вашем секторе.</li>
                <li><strong>Глушитель радара</strong> на уязвимых планетах: при уровне, равном или выше радара противника, они становятся для него нечитаемыми.</li>
                <li><strong>Разверните</strong> радарный корабль на пустой клетке в секторе Вашего соседа (действие «Развернуть радар» на Космической карте или миссия «Радарный корабль»): Вы будете видеть этот сектор 2&nbsp;ч.</li>
                <li>Исследование <strong>Сканер системы</strong> открывает радары (уровень 1: Наземный радар; уровень 3: Космический радар и Радарный корабль; уровень 5: Глушитель радара и Корабль-глушитель). Оно не увеличивает их мощность.</li>
            </ul>

    moon:
        title: "Луны"
        category: "planet"
        order: 7
        tags: "луна,лунар,moonmaker,пища,рационы,производство"
        summary: "Луна производит 1 200 рационов в час, не занимая территории. Как создать её с помощью Лунара, её размер и ограничения."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Что такое луна?</h2>
            <p><strong>Луна</strong> — особое небесное тело, создаваемое кораблём <strong>Лунар</strong> (иногда его называют Moon Maker). Она не производит ни ниобий, ни воду, а лишь фиксированное количество — <strong>20 рационов в минуту</strong>, то есть 1&nbsp;200 в час до бонусов (1&nbsp;440 в альянсе). Это столько же, сколько даёт Сельскохозяйственное поле 7–8-го уровня на планете, причём без занятой территории. Это производство нельзя увеличить: на луне ферм не строят.</p>
            <p>Луна также принимает <strong>рабочих</strong> (20&nbsp;000 сразу после создания, максимум 200&nbsp;000), которые приносят Bitcoin, как и везде. Вы можете построить на ней большинство зданий (Большой город, Исследовательский центр, склады, Казарму, Космическую верфь…), но не шахту, не экстрактор и не ферму.</p>
            <p>Рационы потребляют только рабочие: 1 в час на 500 рабочих, поэтому 1&nbsp;200 рационов луны кормят 600&nbsp;000 рабочих. Эти рационы остаются на луне: перевозите их на карго на свои планеты или оставьте на орбите планеты флот, нагруженный рационами, — он будет брать их оттуда, когда амбар опустеет.</p>

            <h2 id="creation">Как создать луну</h2>
            <p>Луна рождается из <strong>поля обломков</strong>: нужна <strong>пустая клетка</strong>, на которой лежит как минимум <strong>2M ниобия И 2M воды</strong> в виде обломков (оставленных там космическим боем). Миссия <em>Создать луну</em> предлагается на карте, только если клетка удовлетворяет этому условию.</p>
            <ol>
                <li>Постройте <strong>Лунар</strong> на Космической верфи. Нужны исследование Терраформирование 15-го уровня и Тяжёлая промышленность на планете. Он стоит 50&nbsp;000 ниобия, 23&nbsp;000 воды, 20&nbsp;000 рабочих и 200&nbsp;000 Bitcoin, базовое время постройки — 5&nbsp;ч.</li>
                <li>Отправьте его на пустую клетку с миссией <strong>Создать луну</strong>: на <em>Космической карте</em> нажмите на клетку, затем <em>Взаимодействие</em>, выберите флот и миссию, затем <em>Отправить</em>. Если флот уже на месте, на его карточке появляется кнопка <em>Создать луну</em>.</li>
                <li>По прибытии один Лунар расходуется, луна создаётся, а <strong>все обломки расходуются</strong>. Если условия больше не выполняются (обломки переработаны во время полёта, позиция занята…), отчёт объяснит причину неудачи.</li>
            </ol>
            <p>Лунар — самый медленный корабль в игре, и его содержание обходится дорого: 5&nbsp;000 Bitcoin в день, пока он в составе флота, и 833, пока он остаётся на поверхности. Включайте его во флот только в последний момент.</p>

            <h2 id="razmer">Размер луны</h2>
            <p>Чем богаче поле обломков, тем больше луна. Ступень определяется <strong>меньшим</strong> из двух ресурсов:</p>
            <table>
                <thead>
                    <tr><th>Обломки (мин. ниобий/вода)</th><th>Территория</th><th>Космос</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M и больше</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Значения выбираются случайно в пределах диапазона. Пример: поле из 12M ниобия и 6M воды даёт луну со 100–150 территории, потому что ступень определяет вода (6M). Луна часто больше планеты, исходная территория которой составляет от 25 до 190.</p>

            <h2 id="limitations">Ограничения</h2>
            <ul>
                <li>Луна не производит ни ниобий, ни воду: только рационы и рабочих.</li>
                <li>Её можно атаковать, грабить и захватывать (флотом на орбите), но её нельзя зондировать.</li>
                <li>Она не учитывается ни в Вашем пределе числа планет, ни в ограничении в 4 планеты для защиты новичков.</li>
                <li>Луну нельзя покинуть никогда.</li>
                <li>Строить луну рядом с собой безопаснее (меньше риск от враждебных соседей).</li>
            </ul>

            <h2 id="strategie">Когда её создавать</h2>
            <ul>
                <li>Вашим густонаселённым планетам не хватает рационов: ближайшая луна даёт Вам 1&nbsp;200 в час, которые можно перевозить на карго или оставлять на борту флота на орбите планеты.</li>
                <li>Большой бой оставил <strong>богатое поле обломков</strong> на пустой клетке рядом с Вами: вместо того чтобы всё перерабатывать, превратите его в луну.</li>
                <li>Вы прочно обосновались, у Вас есть ресурсы, которые можно потратить, и Вы стремитесь укрепить свою экономику.</li>
            </ul>

    alliance_basics:
        title: "Создать и вступить в альянс"
        category: "alliance"
        order: 1
        tags: "альянс,создание,вступить,приглашение,бонус,режим,политика,уровень,участники"
        summary: "Вступить в альянс по приглашению или создать свой, выбрать политический режим и повышать уровень, чтобы принимать больше участников."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Зачем вступать в альянс?</h2>
            <ul>
                <li><strong>+20&nbsp;% к производству</strong> ниобия, воды и рационов — с момента вступления в альянс.</li>
                <li><strong>7 политических исследований</strong> режима Вашего альянса (экономические, военные или оборонительные бонусы), которые Вы запускаете сами на странице <strong>Исследования</strong>.</li>
                <li><strong>Улучшения альянса</strong> (16 коллективных бонусов) и <strong>помощь в строительстве</strong>.</li>
                <li><strong>Общая казна</strong> в Bitcoin и Очках Войны.</li>
                <li><strong>Дипломатия</strong> (войны, мир, пакты, оборонительные союзы), <strong>салон</strong>, закрытый для посторонних, и <strong>Арена альянсов</strong>.</li>
            </ul>
            <p>Проще говоря: играть в одиночку в начале вполне можно. Но как только игра становится серьёзной, альянс многократно повышает Ваши шансы на прогресс.</p>

            <h2 id="rejoindre">Как вступить</h2>
            <ol>
                <li>Найдите альянс: рейтинг альянсов («Рейтинг альянсов»), карточка альянса, салон «Вселенная».</li>
                <li>Свяжитесь с одним из его участников (личное сообщение, салон). В игре нет заявок: <strong>приглашает Вас сам альянс</strong>.</li>
                <li>Участник с разрешением <strong>Рекрутировать</strong> отправляет Вам приглашение на вкладке <strong>Добавить участника</strong> своей страницы Альянса. Там он видит игроков без альянса, заходивших в игру за последние 2 месяца.</li>
                <li>Откройте свою страницу <strong>Альянс</strong> (меню): приглашение появится в разделе «Предложение(я) о рекрутировании». Нажмите <strong>Принять</strong>.</li>
            </ol>
            <p>Альянс может приглашать, только если у него есть свободное место: каждое ожидающее приглашение считается как участник до Вашего ответа.</p>
            <p>Вы также можете <strong>создать собственный альянс</strong> на той же странице. Вы выбираете:</p>
            <ul>
                <li><strong>название</strong> (не более 20 символов, уникальное на сервере) и <strong>тег</strong> (не более 5 символов, уникальный);</li>
                <li>боевой клич (30 символов) и описание (1&nbsp;500 символов), которые потом можно изменить;</li>
                <li><strong>налог альянса</strong> от 5 до 50&nbsp;%, который <strong>больше нельзя будет изменить</strong>;</li>
                <li><strong>политический режим</strong> — окончательно.</li>
            </ul>
            <p>Вы становитесь лидером альянса. Его казна начинает с нуля.</p>

            <h2 id="invitations">Получение приглашений</h2>
            <p>Участник с разрешением <strong>Рекрутировать</strong> может <strong>пригласить</strong> Вас напрямую. Вы можете получить <strong>по одному приглашению от каждого альянса одновременно</strong>: если Вас пригласил один альянс, Вы не становитесь невидимым для остальных. Зато один и тот же альянс не может пригласить Вас дважды, пока Вы не ответили. Альянсы, которые Вас присмотрели, видят, что Вас <strong>уже пригласили</strong>, но не знают, кто. Как только Вы <strong>принимаете</strong> приглашение, все остальные автоматически отзываются. Если альянс <strong>распущен</strong>, его приглашение исчезает из Вашего списка.</p>

            <h2 id="delai">Задержка после выхода из альянса</h2>
            <p>После того как Вы <strong>вышли</strong> из альянса, были из него <strong>исключены</strong> или он был <strong>распущен</strong> своим лидером, действует <strong>задержка в 2&nbsp;дня</strong>: до окончания отсчёта, который отображается на странице Альянса, нельзя ни <strong>создать</strong> альянс, ни <strong>вступить</strong> в него. Если альянс исчезает сам (Game Over лидера Молота Звёзд или последнего участника), эта задержка составляет <strong>12&nbsp;часов</strong>. Эта задержка не позволяет злоупотреблять переходами из альянса в альянс.</p>
            <p><strong>Выйти</strong> можно только в <strong>Весах Миров</strong> и при четырёх условиях: не быть Президентом, не быть последним участником, чтобы альянс не находился в состоянии войны и чтобы ни один из Ваших флотов не участвовал в бою. <strong>Исключение</strong> тоже невозможно во время войны или если флот исключаемого участника находится в бою.</p>
            <p>Уходя, Вы теряете бонус к производству и улучшения альянса, а <strong>Ваши политические исследования обнуляются</strong>.</p>

            <h2 id="regimes">3 политических режима</h2>
            <p>При <strong>создании</strong> альянса Вы выбираете его <strong>политический режим</strong>. Этот выбор <strong>окончателен</strong>: он определяет начальное число участников, 7 доступных политических исследований и несколько внутренних правил. Все подробности: <a href="/wiki/political_system">3 политических режима</a>.</p>

            <h3 id="democratie">Весы Миров</h3>
            <ul>
                <li>3 участника на старте; Президент избирается голосованием участников.</li>
                <li>Участники могут покинуть альянс (кроме Президента, и никогда — во время войны).</li>
                <li>Экономические исследования: производство, скорость исследований, содержание учёных, карго, броня кораблей, продажи торговцам, колонизация.</li>
                <li>Все участники видны публично, как и позиция их первой планеты.</li>
                <li>+20&nbsp;% к вооружению при атаке на Безмолвный Оплот.</li>
            </ul>

            <h3 id="communisme">Безмолвный Оплот</h3>
            <ul>
                <li>4 участника на старте; все участники — лидеры.</li>
                <li>Налог альянса зафиксирован на 50&nbsp;%; покинуть альянс невозможно.</li>
                <li>Наступательные исследования: переработка, защита рабочих, мощь кораблей, содержание и набор Легионеров, вторжения, Очки Войны.</li>
                <li>+20&nbsp;% к вооружению при атаке на Молот Звёзд.</li>
            </ul>

            <h3 id="fascisme">Молот Звёзд</h3>
            <ul>
                <li>2 участника на старте; единственный лидер — Примарис.</li>
                <li>Покинуть или распустить альянс невозможно; если у Примариса наступает Game Over, альянс распускается.</li>
                <li>Оборонительные исследования: рабочие, мощь кораблей, баржи, Легионеры, содержание и защита Мехов, вторжения. Угроза Ктулху растёт медленнее.</li>
                <li>Публично отображается только лидер.</li>
                <li>+20&nbsp;% к вооружению при атаке на Весы Миров.</li>
            </ul>

            <h2 id="niveau">Уровень альянса и число участников</h2>
            <p>Альянс начинает с <strong>3 мест</strong> (Весы Миров), <strong>4</strong> (Безмолвный Оплот) или <strong>2</strong> (Молот Звёзд). Чтобы принять больше людей, участник с разрешением <strong>Изменить</strong> повышает его <strong>уровень</strong> кнопкой «Повысить уровень альянса» на вкладке <strong>Банк</strong>. Стоимость оплачивается из <strong>казны</strong>. Каждый уровень также открывает ещё одно политическое исследование (см. <a href="/wiki/alliance_research">Исследования альянса</a>).</p>
            <table>
                <thead>
                    <tr><th>Переход</th><th>Стоимость (казна)</th><th>Дополнительные места</th><th>Всего мест Весы / Оплот / Молот</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125&nbsp;000 Bitcoin</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225&nbsp;000 Bitcoin + 2&nbsp;500 ОВ</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600&nbsp;000 Bitcoin + 10&nbsp;000 ОВ</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1&nbsp;000&nbsp;000 Bitcoin + 25&nbsp;000 ОВ</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50&nbsp;000 ОВ</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10&nbsp;000&nbsp;000 Bitcoin</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15&nbsp;000&nbsp;000 Bitcoin + 125&nbsp;000 ОВ</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35&nbsp;000&nbsp;000 Bitcoin + 300&nbsp;000 ОВ</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50&nbsp;000&nbsp;000 Bitcoin + 500&nbsp;000 ОВ</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100&nbsp;000&nbsp;000 Bitcoin + 1&nbsp;000&nbsp;000 ОВ</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>Уровень 10 — максимальный.</p>

            <h2 id="compte-valide">Аккаунт должен быть подтверждён</h2>
            <p>⚠️ Чтобы <strong>создать альянс или вступить</strong> в него, Ваш аккаунт должен быть <strong>валидным</strong>, а <strong>e-mail — подтверждённым</strong>. Тестовые и анонимные аккаунты не могут вступать в альянсы: подтвердите e-mail в разделе <strong>Мои настройки</strong>.</p>
            <p>Другие случаи, когда это невозможно: в период задержки после выхода или исключения (см. выше), пока один из Ваших флотов участвует в бою, на сервере <strong>Battle Royale</strong> и для VIP сервера <strong>Search &amp; Destroy</strong>. Без подтверждённого e-mail Вы также не можете вносить в казну и снимать с неё, инвестировать в улучшения или помогать в строительстве.</p>

    alliance_grades:
        title: "Ранги и разрешения"
        category: "alliance"
        order: 2
        tags: "звания,ранги,разрешения,роли,иерархия,офицер,лидер,голосование,неактивность"
        summary: "Как работает внутренняя иерархия альянса и кто имеет право что делать."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Альянс организован по <strong>званиям</strong> — от высшего (лидер, ранг&nbsp;1) до низшего (ранг&nbsp;5). Каждое звание несёт список <strong>разрешений</strong>, определяющий, что могут делать его обладатели.</p>

            <h2 id="hierarchie">Начальные звания</h2>
            <p>Каждый альянс стартует с 4 званиями в зависимости от режима:</p>
            <table>
                <thead>
                    <tr><th>Режим</th><th>Лидер (ранг 1, все разрешения)</th><th>Ранг 2</th><th>Ранг 3</th><th>Новые участники</th></tr>
                </thead>
                <tbody>
                    <tr><td>Весы Миров</td><td>Президент</td><td>Министр (Рекрутировать, Просмотр)</td><td>Гражданин (Просмотр)</td><td>Шахтёр (ранг 5, без разрешений)</td></tr>
                    <tr><td>Молот Звёзд</td><td>Примарис</td><td>Капитан (Рекрутировать, Просмотр)</td><td>Солдат (Просмотр)</td><td>Аспирант (ранг 5, без разрешений)</td></tr>
                    <tr><td>Безмолвный Оплот</td><td>Вождь, Защитник, Товарищ (все ранга 1)</td><td>Гулаг (без разрешений)</td><td>—</td><td>Товарищ (все разрешения)</td></tr>
                </tbody>
            </table>
            <p>Участник с разрешением <strong>Изменить</strong> может создавать другие звания на вкладке <strong>Администрирование</strong>: он даёт им название, «тип звания» от 2 до 5 (ранг) и разрешения. Ранг&nbsp;1 зарезервирован за лидерами.</p>

            <h2 id="permissions">Разрешения</h2>
            <p>Разрешения звания выбираются при его <strong>создании</strong>:</p>
            <ul>
                <li><strong>Рекрутировать</strong>: приглашать игроков.</li>
                <li><strong>Исключить</strong>: исключать участника (невозможно во время войны).</li>
                <li><strong>Пакт</strong>: предлагать, принимать, отклонять или разрывать пакт о ненападении или оборонительный союз. Она также необходима для войны и мира.</li>
                <li><strong>Война</strong>: объявлять войну и вести переговоры о мире (нужно также разрешение Пакт).</li>
                <li><strong>Изменить</strong>: управлять званиями и их назначением, DEFCON, изображением, боевым кличем и описанием, подтверждать запросы на снятие средств из казны, повышать уровень альянса, распускать его. Снятия, запрошенные этим званием, выполняются сразу.</li>
                <li><strong>Флоты</strong>: убирать из общего доступа флоты, которыми другие участники поделились с альянсом.</li>
                <li><strong>Просмотр</strong>: видеть на космической карте флоты всех участников и союзных оборонительных альянсов. Без него Вы видите только свои.</li>
            </ul>
            <p>Разрешения существующего звания изменить нельзя: создайте новое звание, назначьте его, затем удалите старое (его обладатели переходят на самое низкое звание). Вы можете дать званию только те разрешения, которые есть у Вас самих. Всегда должно оставаться хотя бы одно звание каждого из рангов 1, 2, 3 и 5, и Вы не можете удалить собственное звание.</p>

            <h2 id="changer">Повышение и понижение</h2>
            <p>Участник с разрешением <strong>Изменить</strong> меняет звание другого, нажимая на его <strong>ранг</strong> в списке участников. Это способ вознаградить активных и направлять новичков.</p>
            <p>Ограничения:</p>
            <ul>
                <li>нельзя дать звание, у которого больше разрешений, чем у Вашего;</li>
                <li>никто не может понизить последнего лидера, а лидер не может изменить собственное звание;</li>
                <li>звание <strong>Президента</strong> (Весы) или <strong>Примариса</strong> (Молот) никогда не назначается вручную: Президент меняется голосованием, Примарис — только автоматической заменой неактивного главы (см. ниже);</li>
                <li>в Безмолвном Оплоте Вождь, Защитник и Товарищ меняются свободно.</li>
            </ul>

            <h2 id="regimes">Особые случаи по режимам</h2>
            <ul>
                <li><strong>Безмолвный Оплот</strong>: все участники — лидеры со всеми правами, а новички приходят Товарищами. Единственное низшее звание — <strong>Гулаг</strong>, без каких-либо разрешений, которое присваивают, чтобы отстранить участника.</li>
                <li><strong>Молот Звёзд</strong>: единственный лидер — Примарис, которого нельзя ни избрать, ни назначить. Его заменяют, только если он неактивен более 7 дней (см. ниже). Если у него наступает <strong>Game Over</strong>, альянс распускается.</li>
                <li><strong>Весы Миров</strong>: у каждого участника один голос, который он может изменить в любой момент на вкладке участников («Голосовать за вашего президента»). Как только у участника становится больше голосов, чем у Президента, он становится Президентом, а прежний занимает его звание.</li>
            </ul>

            <h2 id="afk">Автоматическая замена неактивного главы</h2>
            <p>Если <strong>лидер</strong> не заходит в игру <strong>более 7 дней</strong>, он автоматически заменяется, чтобы альянс не оказался парализован:</p>
            <ul>
                <li>Во главе альянса становится <strong>участник с самым высоким званием</strong> среди тех, кто не является лидером и заходил в игру в последние 7 дней. При равенстве званий — тот, у кого больше <strong>очков в рейтинге</strong>.</li>
                <li>Два звания просто <strong>меняются местами</strong>: прежний глава получает звание заместителя. Изменение записывается в историю альянса.</li>
                <li>Правило действует для всех трёх режимов. В Безмолвном Оплоте, где все — лидеры, занять место неактивного лидера может только участник со званием Гулаг.</li>
                <li>Если <strong>активных кандидатов нет</strong>, ничего не меняется.</li>
            </ul>

    diplomacy:
        title: "Дипломатия"
        category: "alliance"
        order: 3
        tags: "дипломатия,война,мир,пакт,союзник,оборонительный союз,defcon,договор,налог мира"
        summary: "4 типа отношений между альянсами, как их вести и что означает DEFCON."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Ваш альянс поддерживает <strong>отношения</strong> с другими альянсами сервера. Эти отношения меняют правила между Вашими участниками: кто может грабить или захватывать кого и кто сражается на чьей стороне. Дипломатия ведётся на вкладке <strong>Пакты</strong> страницы Альянса.</p>

            <h2 id="types">4 типа отношений</h2>
            <table>
                <thead>
                    <tr><th>Тип</th><th>Эффект</th><th>Установление и окончание</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Нет отношений</strong></td><td>Положение по умолчанию: рейды, вторжения и бои возможны.</td><td>—</td></tr>
                    <tr><td><strong>Война</strong></td><td><strong>Вооружённые</strong> флоты двух альянсов, встретившиеся на планете, автоматически вступают в бой, даже без режима атаки. Во время войны нельзя исключить участника, выйти из альянса или распустить его. Игра считает вторжения и очки войны, полученные и потерянные каждой стороной.</td><td>Объявляется <strong>немедленно</strong>, без принятия (разрешения Война и Пакт). Оба альянса переходят на DEFCON 5, а их участники получают оповещение. Заканчивается только принятым <strong>миром</strong>.</td></tr>
                    <tr><td><strong>Мир</strong></td><td>Никаких рейдов и вторжений между Вами. Побеждённый платит согласованный <strong>налог мира</strong>: часть своего ежедневного дохода и часть очков войны, которые он получает в бою, — в казну победителя.</td><td>Предлагается в ходе текущей войны кнопкой «Заключить мир». Длится <strong>4 дня</strong>, затем оба альянса снова становятся нейтральными.</td></tr>
                    <tr><td><strong>Пакт о ненападении</strong></td><td>Никаких рейдов и вторжений между Вами. В сражении альянс, у которого есть пакт со стороной противника, не воюет.</td><td>Предлагается, затем принимается другой стороной. Разрывается <strong>немедленно</strong>.</td></tr>
                    <tr><td><strong>Оборонительный союз</strong></td><td>Никаких рейдов и вторжений между Вами. Ваши флоты сражаются <strong>на одной стороне</strong>. Радар и флоты общие на карте (при наличии разрешения Просмотр). <strong>Общий салон</strong> для двух альянсов.</td><td>Предлагается, затем принимается. Разрыв вступает в силу через <strong>12 часов</strong>; общий салон и его сообщения при этом удаляются.</td></tr>
                </tbody>
            </table>
            <p>Нельзя объявить войну альянсу, с которым у Вас есть пакт, оборонительный союз или действующий мир: сначала разорвите пакт или оборонительный союз. Мир же не разрывается: нужно дождаться, пока он истечёт.</p>

            <h2 id="proposer">Как предложить договор</h2>
            <ol>
                <li>Страница <strong>Альянс</strong>, вкладка <strong>Пакты</strong> («Дипломатия альянса»).</li>
                <li>В разделе «Предложить» введите <strong>тег</strong> нужного альянса и выберите <strong>Оборонительный союз</strong>, <strong>Пакт о ненападении</strong> или <strong>Объявить войну</strong>.</li>
                <li>Другой альянс видит Ваш запрос в разделе «Полученные запросы»: он может его <strong>принять</strong> или <strong>отклонить</strong>. Встречных предложений нет: чтобы изменить условия, отклоните и сделайте собственное предложение. Между двумя альянсами может ожидать только одно предложение.</li>
            </ol>
            <p>Пакт может стать оборонительным союзом, а мир — пактом или оборонительным союзом: принятие заменяет прежние отношения (мир и его налог при этом прекращаются).</p>

            <h2 id="paix">Переговоры о мире</h2>
            <p>В списке «Текущие войны» нажмите <strong>Заключить мир</strong> рядом с нужной войной, затем заполните условия:</p>
            <ul>
                <li><strong>Тип</strong>: <strong>Предложить</strong> (Вы предлагаете условия, и платить будет Ваш альянс) или <strong>Потребовать</strong> (Вы требуете, чтобы платил противник).</li>
                <li><strong>Bitcoin перечисляемых в день</strong>: 0 или от 10 до 25&nbsp;% ежедневного дохода каждого участника побеждённого альянса, снимаемые при ежедневном отчёте (18:59, по времени Парижа). Пример: при 20&nbsp;% участник, получающий 10&nbsp;000 Bitcoin в день, перечисляет 2&nbsp;000.</li>
                <li><strong>Процент от очков войны</strong>: 0 или от 25 до 50&nbsp;% очков войны, которые побеждённые участники получают в бою.</li>
                <li><strong>Количество планет</strong>: это поле (от 0 до 5) записывается в условия, но никакие планеты не передаются.</li>
            </ul>
            <p>Нажмите <strong>Подписать</strong>. Противник видит Ваше предложение на этом же экране и может принять условия или отклонить их; Вы можете отменить своё, пока он не ответил. После принятия мир длится 4 дня.</p>

            <h2 id="defcon">DEFCON (уровень тревоги)</h2>
            <p>У Вашего альянса есть <strong>уровень тревоги DEFCON</strong> от <strong>0 до 5</strong>: <strong>чем выше число, тем напряжённее обстановка</strong>. 0 = тревоги нет, 5 = максимальная тревога. Участник с разрешением <strong>Изменить</strong> устанавливает его на вкладке <strong>Администрирование</strong> («Уровень обороны»). <strong>Объявление войны</strong> автоматически переводит оба альянса на <strong>DEFCON 5</strong>.</p>
            <p>Уровень отображается баннером на <strong>Обзоре</strong> всех участников (зелёный при 1, оранжевый при 2, красный от 3 до 5, ничего при 0) вместе со списком альянсов, с которыми Вы воюете. Это сигнал для координации, не влияющий на бои.</p>

            <h2 id="logs">Дипломатический журнал</h2>
            <p>Каждое дипломатическое действие (объявление войны, предложение, принятый мир, разорванный пакт, отклонённое предложение…) <strong>записывается</strong> в <strong>Историю</strong> альянса (вкладка участников) с ником автора, датой и временем. Там же отражаются вступления, выходы, исключения и смены лидера. Полезно для внутренней прозрачности и обсуждений постфактум.</p>

    alliance_treasury:
        title: "Казна альянса"
        category: "alliance"
        order: 4
        tags: "казна,банк,bitcoin,биткойн,ов,взнос,снятие,налог,уровень"
        summary: "Общий счёт Вашего альянса в Bitcoin и ОВ: взносы, налог альянса, налоги мира, снятие средств и повышение уровня."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Для чего нужна казна</h2>
            <p>Казна альянса (вкладка <strong>Банк</strong> страницы Альянса) — это общий счёт в <strong>Bitcoin</strong> и <strong>Очках Войны (ОВ)</strong>. Она служит для того, чтобы:</p>
            <ul>
                <li><strong>Повышать уровень альянса</strong>, чтобы принимать больше участников и открывать следующие политические исследования (см. <a href="/wiki/alliance_basics#niveau">Уровень альянса</a>).</li>
                <li><strong>Перераспределять</strong> Bitcoin или ОВ участнику: выручить игрока в трудном положении, финансировать подготовку к войне.</li>
            </ul>
            <p>Политические исследования казной <strong>не</strong> оплачиваются: каждый игрок платит за свои (см. <a href="/wiki/alliance_research">Исследования альянса</a>). Перенесённая блокада Ктулху также может изымать из неё «Дань Одержимых».</p>

            <h2 id="alimenter">Как её пополнять</h2>
            <ul>
                <li><strong>Добровольные взносы</strong>: любой участник может внести Bitcoin или ОВ (вкладка Банк, «Дать»), указав при желании причину. Требуются валидный аккаунт и подтверждённый e-mail.</li>
                <li><strong>Налог альянса</strong>: он действует всегда и автоматически снимается с каждого участника при ежедневном отчёте (см. ниже).</li>
                <li><strong>Налоги мира</strong>: когда побеждённый альянс платит Вам за мир, его ежедневный налог в Bitcoin и его доля очков войны, полученных в бою, поступают в Вашу казну (см. <a href="/wiki/diplomacy#paix">Переговоры о мире</a>).</li>
                <li><strong>Арена альянсов</strong>: награды альянса (Bitcoin и ОВ) зачисляются в банк.</li>
            </ul>

            <h2 id="retrait">Снятие средств</h2>
            <p>Любой участник может запросить <strong>снятие</strong> (вкладка Банк, «Забрать») в Bitcoin или в ОВ.</p>
            <ul>
                <li>Если у Вас есть разрешение <strong>Изменить</strong> или Ваш альянс — <strong>Безмолвный Оплот</strong>, снятие выполняется сразу.</li>
                <li>Иначе запрос остаётся <strong>В ожидании</strong>, пока участник с разрешением Изменить не примет его («Да»: средства перечисляются Вам) или не отклонит («Нет»: запрос удаляется).</li>
                <li>Принятие не удаётся, если в казне больше нет нужной суммы или если запросивший тем временем покинул альянс.</li>
            </ul>
            <p>Каждое движение записывается в историю банка.</p>

            <h2 id="taxes">Налог альянса</h2>
            <p><strong>Налог альянса</strong> выбирается <strong>при создании</strong> альянса, от 5 до 50&nbsp;%. Затем его <strong>больше нельзя изменить</strong>. В Безмолвном Оплоте он зафиксирован на 50&nbsp;%.</p>
            <p>Он автоматически снимается при <strong>ежедневном отчёте</strong> (18:59, по времени Парижа) с дохода в Bitcoin, который Вам приносят рабочие, и зачисляется в казну (строка «Ежедневный налог»).</p>
            <p>Расчёт: удержание равно доход − доход ÷ (1 + ставка). Налог в 10&nbsp;% снимает примерно 9,1&nbsp;% дохода, налог в 50&nbsp;% — треть. Пример: с 10&nbsp;000 Bitcoin дневного дохода 10&nbsp;% удерживают 909 Bitcoin, 50&nbsp;% — 3&nbsp;333.</p>
            <p>Выбирайте разумную ставку: если она слишком высока, участники уходят.</p>

            <h2 id="transparence">Прозрачность</h2>
            <p>Вкладка <strong>Банк</strong> показывает <strong>всем участникам</strong> историю последних 200 движений: участник, тип (Bitcoin или ОВ), сумма, причина, дата и статус (Принята или В ожидании). Ежедневные налоги и налоги мира там тоже отображаются. Так каждый может проверить, куда уходят деньги.</p>

    political_system:
        title: "3 политических режима"
        category: "alliance"
        order: 5
        tags: "политика,режим,бонус,весы,оплот,молот"
        summary: "3 возможных режима для альянса: преимущества, недостатки и как выбрать."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principe">Выбор при создании</h2>
            <p>Когда создаётся альянс, основатель выбирает <strong>политический режим</strong>. Этот режим определяет <strong>внутренние правила</strong>, <strong>особые бонусы</strong> и <strong>7 политических исследований</strong>, которые могут запускать его участники. Выбор <strong>необратим</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>Весы Миров</th><th>Безмолвный Оплот</th><th>Молот Звёзд</th></tr>
                </thead>
                <tbody>
                    <tr><td>Участников на старте</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Лидеры</td><td>Президент, избираемый голосованием</td><td>Все участники</td><td>Один, Примарис</td></tr>
                    <tr><td>Выход из альянса</td><td>Да (кроме Президента)</td><td>Нет</td><td>Нет</td></tr>
                    <tr><td>Роспуск альянса</td><td>Да</td><td>Да</td><td>Нет</td></tr>
                    <tr><td>Налог альянса</td><td>Выбирается при создании (от 5 до 50&nbsp;%)</td><td>50&nbsp;%</td><td>Выбирается при создании (от 5 до 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% к вооружению при атаке на</td><td>Безмолвный Оплот</td><td>Молот Звёзд</td><td>Весы Миров</td></tr>
                </tbody>
            </table>
            <p>Затем число участников растёт с <a href="/wiki/alliance_basics#niveau">уровнем альянса</a>. Распустить альянс во время войны невозможно всегда.</p>

            <h2 id="balance">Весы Миров (демократия)</h2>
            <p>Открытый, экономический режим. Участники голосуют за своего Президента. Упор на <strong>экономику</strong>.</p>
            <ul>
                <li>3 участника на старте.</li>
                <li>У каждого участника один голос, который он может изменить в любой момент (вкладка участников, «Голосовать за вашего президента»). Как только у участника становится больше голосов, чем у Президента, он занимает его место.</li>
                <li>+20&nbsp;% к вооружению при атаке на Безмолвный Оплот.</li>
                <li>Участники могут покинуть альянс (кроме Президента, и никогда — во время войны).</li>
                <li>Участники видны публично, как и позиция их первой планеты.</li>
                <li>Исследования, ориентированные на экономику: производство, скорость исследований, содержание учёных, карго, броня кораблей, продажи торговцам, колонизация (подробности в <a href="/wiki/alliance_research">Исследованиях альянса</a>).</li>
            </ul>

            <h2 id="rempart">Безмолвный Оплот (наступательный)</h2>
            <p>Агрессивный коллективный режим. Все участники — лидеры. Упор на <strong>наступление</strong>.</p>
            <ul>
                <li>4 участника на старте (на одного больше, чем у Весов Миров).</li>
                <li>+20&nbsp;% к вооружению при атаке на Молот Звёзд.</li>
                <li>Налог альянса автоматически зафиксирован на 50&nbsp;%.</li>
                <li>Снятия из казны выполняются сразу для всех участников.</li>
                <li>Покинуть альянс невозможно.</li>
                <li>Исследования, ориентированные на бой: переработка, защита рабочих, мощь кораблей, содержание и набор Легионеров, вторжения, Очки Войны.</li>
            </ul>
            <p>Три высших звания (<strong>Вождь</strong>, <strong>Защитник</strong>, <strong>Товарищ</strong>) <strong>равнозначны</strong>: одинаковые права, никакой иерархии между ними. Их можно свободно присваивать друг другу, а новички приходят Товарищами со всеми правами. Единственное низшее звание — <strong>Гулаг</strong>, без каких-либо разрешений, которое присваивают, чтобы отстранить участника.</p>

            <h2 id="marteau">Молот Звёзд (оборонительный)</h2>
            <p>Скрытный оборонительный режим. Единственный лидер — Примарис, которого заменяют, только если он неактивен более 7 дней (см. <a href="/wiki/alliance_grades#afk">Ранги и разрешения</a>). Упор на <strong>защиту</strong> и стойкость.</p>
            <ul>
                <li>2 участника на старте (на одного меньше, чем у Весов Миров, на двух меньше, чем у Безмолвного Оплота).</li>
                <li>+20&nbsp;% к вооружению при атаке на Весы Миров.</li>
                <li>Угроза Ктулху растёт на 25&nbsp;% медленнее, чем в двух других режимах: +150 вместо +200 за победу над Ктулху на нормальной сложности (см. <a href="/wiki/cthulhus#menace">Угроза Ктулху</a>). Очень полезно в PvE.</li>
                <li>Публично отображается только лидер.</li>
                <li>Покинуть альянс невозможно. Распустить его невозможно.</li>
                <li>Если у лидера наступает Game Over, альянс распускается.</li>
                <li>Исследования, ориентированные на оборону: производство рабочих, мощь кораблей, вместимость барж, сила Легионеров, содержание и защита Мехов, вторжения.</li>
            </ul>

            <h2 id="combat">Бонусы между режимами</h2>
            <p>Каждый режим превосходит другой, по принципу «камень-ножницы-бумага»:</p>
            <ul>
                <li>Весы Миров побеждают Безмолвный Оплот.</li>
                <li>Безмолвный Оплот побеждает Молот Звёзд.</li>
                <li>Молот Звёзд побеждает Весы Миров.</li>
            </ul>
            <p>Когда Ваша сторона <strong>атакует</strong> в космическом бою (или на Арене альянсов) и Ваш режим превосходит режим защитника, Ваши <strong>ракеты, лазеры и плазма</strong> получают <strong>+20&nbsp;%</strong>. В обороне или против такого же режима бонуса нет. Наземных боёв это не касается.</p>

            <h2 id="visibilite">Что о Вас видят другие</h2>
            <ul>
                <li><strong>Весы Миров</strong>: все участники отображаются на карточке альянса вместе с числом его планет, а карточка каждого участника указывает позицию его первой планеты.</li>
                <li><strong>Безмолвный Оплот</strong>: участники отображаются на карточке альянса, но рейтинги скрывают число участников и планет.</li>
                <li><strong>Молот Звёзд</strong>: на карточке альянса отображается только лидер, список планет участников скрыт на их карточках, а рейтинги скрывают число участников и планет.</li>
            </ul>

            <h2 id="choisir">Как выбрать?</h2>
            <ul>
                <li><strong>Вы новичок и стремитесь к росту</strong> → Весы Миров (экономический, и единственный, из которого можно выйти).</li>
                <li><strong>Вам нужен сплочённый и агрессивный альянс</strong> → Безмолвный Оплот.</li>
                <li><strong>Вы хотите защититься, играть оборонительно</strong> → Молот Звёзд (внимание: если у лидера наступит Game Over, всё рухнет).</li>
            </ul>

    alliance_research:
        title: "Исследования альянса"
        category: "alliance"
        order: 6
        tags: "исследование,альянс,политика,политические,режим,бонус"
        summary: "7 политических исследований Вашего режима: личные исследования, оплачиваемые Вашими собственными Bitcoin и открываемые уровнем альянса."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principe">Как это работает</h2>
            <p>Исследования альянса, называемые <strong>политическими исследованиями</strong>, запускаются на странице <strong>Исследования</strong>, в категории <strong>Политические</strong>. В каждом режиме <strong>7 исследований</strong> по <strong>5 уровней</strong>. Они открываются по одному с <strong>уровнем альянса</strong>: первое — с 0-го уровня, второе — с 1-го… вплоть до седьмого на 6-м уровне (см. <a href="/wiki/alliance_basics#niveau">Уровень альянса</a>). Без альянса категория показывает «Требуется: Вступить в альянс».</p>
            <p>Это <strong>личные</strong> исследования: каждый участник запускает их для себя, в собственной очереди исследований, на <strong>собственные Bitcoin</strong>, и бонус действует <strong>только на него</strong>. Стоимость уровня равна базовой стоимости × целевой уровень, уменьшенной улучшением альянса «Стоимость исследований». Длительность зависит от Ваших учёных, как у любого исследования.</p>
            <p><strong>Внимание</strong>: если Вы покидаете альянс, Вас исключили из него или он распущен, все Ваши уровни политических исследований обнуляются. Политическое исследование, завершившееся, когда у Вас уже нет альянса, ничего не даёт.</p>
            <p>Не путайте с <a href="/wiki/alliance_improvements">улучшениями альянса</a>, которые коллективны и финансируются инвестициями участников. Те и другие суммируются.</p>

            <h2 id="liste">Исследования каждого режима</h2>
            <p>Эффект за уровень, затем эффект на 5-м уровне. Стоимость уровня N = базовая стоимость × N, в Bitcoin: 5 уровней стоят в 15 раз больше базовой стоимости (например, 375&nbsp;000 Bitcoin для исследования с базовой стоимостью 25&nbsp;000). Требуемый уровень альянса указан в скобках.</p>

            <h3>Весы Миров</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Эффект</th><th>Базовая стоимость</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Закон Макрона</strong> (ур. 0)</td><td>+7,1&nbsp;% к производству ниобия, воды и рационов за уровень, в дополнение к +20&nbsp;% от альянса (×1,56 в сумме на 5-м уровне, против ×1,2 без исследования)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Научная мобилизация</strong> (ур. 1)</td><td>+0,1 к скорости исследований за уровень (+0,5 на 5-м уровне) — до следующего прибытия учёных, которое округляет скорость до ближайшего целого (см. <em>Рабочие и учёные</em>)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Научный энтузиазм</strong> (ур. 2)</td><td>Снижение содержания учёных: −17&nbsp;% на 1-м уровне, −50&nbsp;% на 5-м</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Улучшенные карго</strong> (ур. 3)</td><td>+20&nbsp;% к вместимости карго за уровень (+100&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Бронирование кораблей</strong> (ур. 4)</td><td>+10&nbsp;% к броне кораблей за уровень (+50&nbsp;%)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Торговые соглашения</strong> (ур. 5)</td><td>+5&nbsp;% к выручке от продаж торговцам за уровень (+25&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Внедрение Весы Миров</strong> (ур. 6)</td><td>+1 колонизируемая планета за уровень (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>Безмолвный Оплот</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Эффект</th><th>Базовая стоимость</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Оптимизация переработки</strong> (ур. 0)</td><td>Каждый переработчик приносит 1&nbsp;000 + 400 × уровень ресурсов за 5-минутный цикл (1&nbsp;400 на 1-м уровне, 3&nbsp;000 на 5-м, то есть втрое больше)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Идеологическое укрепление</strong> (ур. 1)</td><td>+20&nbsp;% к защите рабочих за уровень (+100&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Улучшенное вооружение</strong> (ур. 2)</td><td>+10&nbsp;% к мощи кораблей за уровень (+50&nbsp;%)</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Советская структура</strong> (ур. 3)</td><td>Снижение содержания Легионеров: −9&nbsp;% на 1-м уровне, −33&nbsp;% на 5-м</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Набор добровольцев</strong> (ур. 4)</td><td>−1 Bitcoin за уровень от цены найма Легионера (с 8 до 3 Bitcoin)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Империя без границ</strong> (ур. 5)</td><td>+1 планета, завоёвываемая вторжением, за уровень (+5)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Очки Войны</strong> (ур. 6)</td><td>+10&nbsp;% к получаемым ОВ за уровень (+50&nbsp;%)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>Молот Звёзд</h3>
            <table>
                <thead>
                    <tr><th>Исследование</th><th>Эффект</th><th>Базовая стоимость</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Семейная политика</strong> (ур. 0)</td><td>+20&nbsp;% к производству рабочих за уровень (+100&nbsp;%)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Улучшенное вооружение</strong> (ур. 1)</td><td>+10&nbsp;% к мощи кораблей за уровень (+50&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Спланированные вторжения</strong> (ур. 2)</td><td>+25&nbsp;% к вместимости барж за уровень: 1&nbsp;250 Легионеров на баржу на 1-м уровне, 2&nbsp;250 на 5-м</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Военная мощь</strong> (ур. 3)</td><td>+10&nbsp;% к силе Легионеров, как в атаке, так и в обороне, за уровень (+50&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Механическое превосходство</strong> (ур. 4)</td><td>Снижение содержания Мехов: −17&nbsp;% на 1-м уровне, −50&nbsp;% на 5-м</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Бронирование Мехов</strong> (ур. 5)</td><td>+10&nbsp;% к защите Мехов за уровень (+50&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Империя без границ</strong> (ур. 6)</td><td>+1 планета, завоёвываемая вторжением, за уровень (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h2 id="choisir">Какие исследования приоритетны?</h2>
            <ul>
                <li><strong>Весы Миров</strong> → Закон Макрона, Научная мобилизация, Улучшенные карго.</li>
                <li><strong>Безмолвный Оплот</strong> → Улучшенное вооружение, Империя без границ, Очки Войны.</li>
                <li><strong>Молот Звёзд</strong> → Семейная политика, Спланированные вторжения, Военная мощь, Бронирование Мехов.</li>
            </ul>
            <p>Каждый выбирает собственные исследования, но последние открываются только с повышением уровня альянса: согласовывайте это вместе в салоне, с учётом казны.</p>

    salon:
        title: "Чат альянса"
        category: "alliance"
        order: 7
        tags: "салон,чат,обсуждение,альянс,сообщение"
        summary: "Чат Вашего альянса: в реальном времени, с историей, кликабельными координатами и общими салонами с Вашими союзниками."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="fonctionnement">Как это работает</h2>
            <p><strong>Салон альянса</strong> — это чат в реальном времени, закрытый для всех, кроме участников Вашего альянса. Откройте <strong>Салон</strong> в меню: салон Вашего альянса — это вкладка с его названием.</p>
            <p>Там же Вы найдёте салон <strong>Вселенная</strong> (весь сервер), салон для каждой галактики, где у Вас есть планета, и для каждого заключённого <strong>оборонительного союза</strong> — общий салон двух альянсов (удаляется вместе с сообщениями, когда оборонительный союз прекращается).</p>
            <p>Сообщения сохраняются: Вы можете прокрутить историю назад, чтобы найти нужную информацию.</p>

            <h2 id="usage">Для чего это нужно</h2>
            <ul>
                <li><strong>Координировать атаки</strong>: рейд вдвоём лучше, чем рейд в одиночку, который будет отбит.</li>
                <li><strong>Предупреждать</strong> о замеченном вражеском флоте.</li>
                <li><strong>Делиться координатами</strong> (планеты-цели, интересные поля обломков): записанные в формате <code>галактика:сектор:позиция</code> (например, <code>1:15:25</code>), они становятся ссылкой, открывающей этот сектор на космической карте (галактика должна существовать, сектор — от 1 до 100, позиция — от 1 до 25). Ссылки на страницы игры тоже становятся кликабельными.</li>
                <li><strong>Обсуждать стратегию</strong> альянса (исследования, дипломатия, войны).</li>
                <li><strong>Представляться</strong> новым участникам и налаживать связи.</li>
            </ul>

            <h2 id="bonnes-pratiques">Хорошие практики</h2>
            <ul>
                <li>Будьте уважительны: оскорбления и травля могут караться санкциями. На оскорбительное сообщение можно пожаловаться прямо из самого сообщения (см. <a href="/wiki/moderation_blocking">Модерация</a>).</li>
                <li>Не спамьте: оставьте место для стратегических обсуждений. Сообщение содержит не более <strong>200 символов</strong>, и отправлять можно 20 сообщений в минуту.</li>
                <li>Чтобы обратиться к кому-то, нажмите на его ник: «Ник &gt;» добавится к Вашему сообщению. Сообщение, содержащее Ваш ник или тег Вашего альянса в квадратных скобках (например, <code>[TAG]</code>), выделяется для Вас.</li>
                <li>Если дан совет, запишите его: сообщения прокручиваются быстро.</li>
            </ul>

            <h2 id="messages-prives">А личные сообщения?</h2>
            <p>Помимо салона, Вы можете отправить <strong>личное сообщение</strong> любому игроку сервера, в том числе вне Вашего альянса. Это удобно для скрытой дипломатии, для ответа на предложение или чтобы попросить альянс пригласить Вас. Координаты и ссылки игры в них становятся кликабельными точно так же, как в салоне.</p>

    alliance_improvements:
        title: "Улучшения альянса"
        category: "alliance"
        order: 8
        tags: "улучшения,альянс,бонус,bitcoin,биткоин,инвестиции,коллектив,уровни"
        summary: "Инвестируйте Bitcoin, чтобы открыть 16 коллективных бонусов, усиливающих весь Ваш альянс: скорость исследований, производство, боевую мощь и многое другое."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="obzor">Принцип</h2>
            <p>Вкладка <strong>Улучшения</strong> страницы альянса позволяет участникам инвестировать Bitcoin, чтобы открывать и улучшать <strong>16 коллективных бонусов</strong>. Эти бонусы идут на пользу <strong>всем участникам</strong> альянса, в сети они или нет. Игрок, покинувший альянс, перестаёт ими пользоваться, но альянс сохраняет достигнутые уровни.</p>

            <h2 id="kvota">Квота инвестиций</h2>
            <p>У каждого участника есть <strong>20 инвестиций на период в 3 часа</strong>. Период начинается с Вашей первой инвестиции; через 3 часа квота возвращается к 20. Неиспользованные инвестиции пропадают: квота не накапливается. Вкладка показывает Ваши «Доступные инвестиции», а когда квота исчерпана — время, оставшееся до «Следующего окна».</p>
            <p>Каждая инвестиция стоит <strong>1&nbsp;000 Bitcoin</strong>, списываемых с Вашего личного баланса. Это окончательная трата, без возврата. Чтобы инвестировать, нужны валидный аккаунт и подтверждённый e-mail.</p>
            <p>Под каждым бонусом быстрые кнопки <strong>×1 / ×5 / ×10</strong> позволяют вложить несколько очков одним щелчком.</p>

            <h2 id="urovni">Уровни и пороги</h2>
            <p>У каждого бонуса <strong>5 уровней</strong>. Пороги инвестиций, необходимые для перехода на следующий уровень:</p>
            <table>
                <thead>
                    <tr><th>Уровень</th><th>Необходимые инвестиции</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Инвестиции сверх порога уровня <strong>пропадают</strong>: переноса на следующий уровень нет.</p>
            <p>Чтобы довести бонус до 5-го уровня, нужно в сумме <strong>3&nbsp;360 инвестиций</strong>, то есть 3&nbsp;360&nbsp;000 Bitcoin. Это коллективный проект: при 20 инвестициях за период в 3 часа одному игроку на это потребовалось бы 168 периодов.</p>

            <h2 id="bonusy">16 бонусов и их эффекты</h2>
            <table>
                <thead>
                    <tr><th>Бонус</th><th>Эффект за уровень</th><th>Максимум (5-й уровень)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Скорость исследований</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Стоимость исследований</strong></td><td>−1&nbsp;% за уровень</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Ускорение строительства</strong></td><td>+15 с сокращения за помощь</td><td>75 с сокращения за помощь</td></tr>
                    <tr><td><strong>Стоимость строительства</strong></td><td>−1&nbsp;% за уровень</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Добыча ниобия</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Производство воды</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Производство рационов</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Скорость флота</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Сила ракет</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Сила лазеров</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Сила плазмы</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Точность</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Броня флота</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Щит</strong></td><td>+1&nbsp;% за уровень</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Планетарная защита</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Опыт героя</strong></td><td>+2&nbsp;% за уровень</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p><strong>Ускорение строительства</strong> напрямую питает <a href="/wiki/alliance_construction_help">помощь в строительстве</a>: чем выше его уровень, тем сильнее каждая помощь союзника сокращает время стройки.</p>
            <p>Не путайте улучшение «Скорость исследований» с политическим исследованием «Научная мобилизация» Весов Миров (для того, кто его изучает, см. <a href="/wiki/alliance_research">Исследования альянса</a>). Улучшение «Скорость исследований» сокращает длительность, показываемую на странице Исследования, но не реальную: запущенное исследование завершается в срок, рассчитанный без него.</p>

            <h2 id="absence">А если участник отсутствует?</h2>
            <p>Режима отпуска нет. Отсутствующий участник <strong>сохраняет все свои бонусы альянса</strong> (производство, улучшения, политические исследования), пока остаётся в альянсе, а его налог альянса продолжает взиматься каждый день. После <strong>7 дней</strong> без захода неактивный лидер автоматически заменяется (см. <a href="/wiki/alliance_grades#afk">Ранги и разрешения</a>). После <strong>8 дней</strong> аккаунт переходит на автопилот, но остаётся участником альянса.</p>

    alliance_construction_help:
        title: "Помощь в строительстве"
        category: "alliance"
        order: 9
        tags: "помощь,строительство,альянс,ускорение,здание"
        summary: "Один щелчок, чтобы ускорить стройки всех Ваших союзников одновременно, а они делают то же для Вас."
        related: "alliance_improvements"
        body: |
            <h2 id="obzor">Принцип</h2>
            <p><strong>Помощь в строительстве</strong> позволяет участникам альянса взаимно ускорять текущие стройки одним щелчком. Когда у одного или нескольких союзников на планете идёт строительство, в глобальной панели интерфейса появляется <strong>значок помощи</strong> (рука, держащая сердце). Значок показывает число подходящих построек. Чтобы помогать, нужны валидный аккаунт и подтверждённый e-mail.</p>
            <p>Один щелчок по этому значку автоматически запускает помощь <strong>на всех подходящих постройках</strong> альянса сразу: выбирать их по одной не нужно.</p>

            <h2 id="vyigrysh">Выигрыш за помощь</h2>
            <p>Каждая оказанная помощь ускоряет строительство на:</p>
            <blockquote><strong>15 секунд × уровень бонуса «Ускорение строительства»</strong></blockquote>
            <p>Выигрыш <strong>ограничен 75 секундами</strong> за помощь и за участника (5-й уровень × 15 с = 75 с). Этот уровень — уровень <strong>Вашего альянса</strong>: все его участники приносят одинаковый выигрыш за помощь. Строительство не может опуститься ниже <strong>30 секунд остатка</strong> благодаря помощи.</p>
            <table>
                <thead>
                    <tr><th>Уровень бонуса</th><th>Выигрыш за помощь</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (не открыт)</td><td>15 с</td></tr>
                    <tr><td>1</td><td>15 с</td></tr>
                    <tr><td>2</td><td>30 с</td></tr>
                    <tr><td>3</td><td>45 с</td></tr>
                    <tr><td>4</td><td>60 с</td></tr>
                    <tr><td>5</td><td>75 с</td></tr>
                </tbody>
            </table>

            <h2 id="usloviya">Условия для постройки</h2>
            <p>Чтобы постройке можно было помочь, нужно выполнить два условия:</p>
            <ul>
                <li><strong>Общая длительность &gt; 30 секунд</strong> (между началом и ожидаемым окончанием).</li>
                <li><strong>Оставшееся время &gt; 30 секунд</strong> в момент оказания помощи.</li>
            </ul>
            <p>Почти завершённые стройки (осталось 30 с или меньше) помощью не пользуются.</p>

            <h2 id="dedupl">Одна помощь на постройку</h2>
            <p>Один и тот же участник может помочь <strong>каждой постройке только один раз</strong>. Значок автоматически исчезает, когда не остаётся построек, которым Вы ещё не помогли. Одной постройке могут помочь несколько участников, и выигрыши суммируются: 3 участника альянса 3-го уровня приносят по 45 с, то есть 135 с в сумме.</p>

            <h2 id="svyaz">Связь с улучшениями альянса</h2>
            <p>Выигрыш за помощь напрямую зависит от уровня бонуса <strong>«Ускорение строительства»</strong> на вкладке <a href="/wiki/alliance_improvements">Улучшения</a>. Инвестиции в этот бонус идут на пользу всем: чем быстрее Ваши союзники заканчивают здания, тем быстрее растёт империя альянса.</p>

    leveling:
        title: "Уровни и опыт"
        category: "progression"
        order: 1
        tags: "уровень,опыт,прогресс,level,счёт,очки"
        summary: "Ваш прогресс со 2-го по 40-й уровень, питаемый ростом Вашего счёта."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Что учитывается в Вашем счёте</h2>
            <p>Ваш счёт (Ваши <strong>очки</strong>, те, что идут в рейтинг) измеряет <strong>размер Вашей империи</strong>. Он пересчитывается раз в день, при ежедневном отчёте в 18:59 (по времени Парижа), и складывается из:</p>
            <table>
                <tr><th>Элемент</th><th>Что стоит 1 очко</th></tr>
                <tr><td><strong>Рабочие</strong></td><td>100 рабочих.</td></tr>
                <tr><td><strong>Корабли в ангаре</strong> (и в производстве)</td><td>120 тепловой сигнатуры (например, 6 фрегатов с сигнатурой 20 у каждого).</td></tr>
                <tr><td><strong>Корабли во флоте</strong></td><td>20 сигнатуры (например, 1 фрегат). Корабль во флоте считается <strong>в шесть раз выше</strong>, чем в ангаре.</td></tr>
                <tr><td><strong>Легионеры</strong></td><td>500 на планете, около 83 на борту флота.</td></tr>
                <tr><td><strong>Мехи</strong></td><td>25 на планете; на борту флота каждый Мех стоит 2 очка.</td></tr>
                <tr><td><strong>Учёные</strong></td><td>Около 17 на планете, 25 на флоте.</td></tr>
                <tr><td><strong>Турели</strong></td><td>Каждая турель стоит: ракетная установка 0,9; лазерная турель 0,6; тяжёлая лазерная турель 1,2; ионный лазер 1,2; плазменная артиллерия 0,8; пушка Гаусса 2,4.</td></tr>
                <tr><td><strong>Здания</strong> (за уровень)</td><td>Шахта Niobium, Экстрактор воды, Сельскохозяйственное поле: 15 · Наземный радар: 20 · Казарма: 25 · Аэропонная ферма, Исследовательский центр, Космическая верфь: 30 · Склад Niobium, Резервуар воды, Сельскохозяйственный силос: 45 · Оружейный завод: 50 · Космический радар: 60 · Большой город: 65 · Глушитель радара: 100 · Мегаполис: 120 · Оборонительный форт: 130 · Тяжёлая промышленность: 150 · Ядерная база: 300 · Плавучий город, Орбитальная станция: 2&nbsp;000. Тюрьма и Лагерь рабов очков не приносят.</td></tr>
            </table>
            <p>Значения войск — базовые: политические исследования режима, снижающие содержание Легионеров, Мехов или учёных, снижают и очки, которые они приносят. Очки Войны в счёт не входят.</p>
            <p>Поэтому потеря кораблей в бою, снос здания или гибель войск снижают Ваш счёт в следующем отчёте.</p>

            <h2 id="experience">Счёт, опыт и уровень</h2>
            <p>Ваш уровень зависит от Вашего <strong>опыта</strong>, который растёт только вместе с Вашим счётом. При каждом ежедневном отчёте, если Ваш новый счёт превышает счёт позавчерашнего дня, разница прибавляется к Вашему опыту.</p>
            <p>Пример: позавчера Ваш счёт был 10&nbsp;000, вчера 11&nbsp;000, а сегодня 12&nbsp;000: в сегодняшнем отчёте Вы получаете 2&nbsp;000 очков опыта.</p>
            <p>Если Ваш счёт падает, в этот день Вы не получаете опыт, но никогда его не теряете: <strong>Ваш уровень никогда не понижается</strong>. Общий опыт в игре не отображается; отображается только уровень.</p>

            <h2 id="seuils">Пороги уровней</h2>
            <p>Каждый командир начинает с <strong>2-го уровня</strong>, с 0 очков опыта. Опыт, который нужно набрать для каждого уровня:</p>
            <table>
                <tr><th>Уровень</th><th>Опыт</th><th>Уровень</th><th>Опыт</th></tr>
