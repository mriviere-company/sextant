            </table>
            <p>40-й уровень — максимальный. Прогрессия <strong>экспоненциальная</strong>: подняться со 2-го уровня на 10-й гораздо быстрее, чем с 30-го на 40-й.</p>

            <h2 id="utilite">Зачем нужен Ваш уровень</h2>
            <ul>
                <li><strong>Бонус за вход</strong> — нижняя граница ежедневного бонуса равна Вашему уровню × 5&nbsp;000 Bitcoin, умноженному на случайный множитель от ×1 до ×5 (см. <em>Бонус за вход</em>).</li>
                <li><strong>Витрина</strong> — Ваш уровень отображается на карточке командира (страница Обзор) и в Вашем профиле. Рейтинг же строится по очкам, а не по уровню.</li>
            </ul>

    war_points:
        title: "Очки войны (ОВ)"
        category: "progression"
        order: 2
        tags: "ов,очки,война,бой,рейтинг,pdg"
        summary: "Вторая валюта игры, зарабатываемая в основном в бою, которую можно потратить на Bitcoin, войска, элитные корабли и здания."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Что такое ОВ?</h2>
            <p><strong>Очки Войны</strong> (<strong>ОВ</strong>) — вторая «валюта» прогресса, <strong>ориентированная на бой</strong>. Если Ваш уровень отражает рост Вашей империи, то Ваши ОВ отражают Вашу военную активность. Они отображаются в панели ресурсов и свои на каждом сервере: на новом сервере Вы начинаете с нуля.</p>

            <h2 id="gagner">Как их получать</h2>
            <ul>
                <li><strong>Космические бои</strong> — победитель получает ОВ, пропорциональные сигнатуре уничтоженного вражеского флота (1 ОВ за 100 сигнатуры в бою одного флота против одного флота), но никогда не в зависимости от собственных потерь. Орда Ктулху или флот пришельцев приносят в 5 раз меньше, чем флот игрока той же сигнатуры (защита от фарма).</li>
                <li><strong>Проигрыш космического боя</strong> — Вам всё же выплачивается утешение: 1 ОВ за 500 потерянной сигнатуры, то есть пятая часть того, что получил бы победитель за тот же флот.</li>
                <li><strong>Орбитальная оборона</strong> — когда Ваши турели уничтожают флот на орбите: 1 ОВ за 100 уничтоженной сигнатуры (в 5 раз меньше против Ктулху или пришельцев). А вот разрушение обороны вражеской планеты ничего не приносит атакующему.</li>
                <li><strong>Рейды</strong> — победивший атакующий получает 1 ОВ за 100 убитых Легионеров и Мехов защитника.</li>
                <li><strong>Вторжения</strong> — успешное вторжение приносит очень мало: 1 ОВ за 60&nbsp;000 убитых Легионеров защитника (убитый рабочий считается за одну десятую Легионера).</li>
                <li><strong>Отражение рейда или вторжения</strong> — защитник получает около 7,5 ОВ за 100 убитых Легионеров нападавших.</li>
                <li><strong>Уничтожение игрока</strong> — если Ваше вторжение отнимает у него последнюю планету, Вы забираете все его ОВ и все его Bitcoin.</li>
                <li><strong>Ктулху</strong> — отражение орды, атакующей Вашу планету, приносит ОВ в зависимости от силы орды, а прорыв блокады Ктулху приносит награду в Bitcoin и ОВ, делящуюся по нанесённому каждым урону. Tower Defense же приносит уран, а не ОВ.</li>
                <li><strong>Ежедневные цели</strong> — каждая выполненная цель приносит ОВ (см. <em>Ежедневные задания</em>).</li>
                <li><strong>Арена (дуэли героев)</strong> — каждая выигранная дуэль приносит 15 ОВ за уровень Вашего героя, сокращаемые вдвое, если у двух героев сильно различаются уровни (в ту или иную сторону). Примеры: герой 10-го уровня против 10-го = 150 ОВ; 10-го против 4-го = 75 ОВ. Пьедестал еженедельного рейтинга арены (300 / 200 / 100 ОВ) и турниров (500 / 300 / 150 ОВ и 50 ОВ каждому участнику) тоже приносит их.</li>
                <li><strong>Тюрьма</strong> — казнь захваченного героя приносит 100 ОВ за уровень героя.</li>
                <li><strong>Продажа торговцам</strong> — каждая продажа приносит немного ОВ в дополнение к Bitcoin.</li>
                <li><strong>Обучение</strong> — 500 ОВ входят в его награды.</li>
                <li><strong>Банк альянса</strong> — снятие из банка Вашего альянса может выплатить Вам ОВ.</li>
            </ul>
            <p>Исследование альянса <strong>Очки Войны</strong> (альянс не ниже 6-го уровня) увеличивает на 10&nbsp;% за уровень, до +50&nbsp;%, ОВ, получаемые в космическом бою, в орбитальной обороне, в рейде, во вторжении и при продаже торговцам.</p>

            <h2 id="utilite">Для чего они нужны</h2>
            <ul>
                <li><strong>Магазин на странице Цели</strong> — обменивайте ОВ на Bitcoin (1 ОВ = 1 Bitcoin), Легионеров (1 ОВ = 2 Легионера) или рабочих (1 ОВ = 10 рабочих), доставляемых на выбранную Вами планету в пределах её вместимости.</li>
                <li><strong>Элитные корабли</strong> — некоторые корабли оплачиваются ОВ (и рабочими): Плазменный истребитель (1 ОВ), Боевой корвет (3), Боевой корабль (8), Каравелла (25), Материнский корабль (25&nbsp;000), за единицу.</li>
                <li><strong>Здания</strong> — Плавучий город и Орбитальная станция стоят 2&nbsp;000 ОВ за целевой уровень (2&nbsp;000 за 1-й уровень, 4&nbsp;000 за 2-й…).</li>
                <li><strong>Исследование Территориальное расширение</strong> — 75&nbsp;000 ОВ за 1-й уровень, 150&nbsp;000 за 2-й.</li>
                <li><strong>Пытать пленника</strong> — 200 ОВ, чтобы раскрыть позицию вражеской планеты.</li>
                <li><strong>Банк альянса</strong> — Вы можете вносить в него ОВ.</li>
                <li><strong>Рейтинг</strong> — столбец «Pdg» в Рейтинге командиров позволяет сравнивать военную активность игроков.</li>
                <li><strong>Paid Server</strong> — победитель — игрок с наибольшей суммой «очки + 2 × ОВ» в конце сервера.</li>
            </ul>

            <h2 id="perdre">Можно ли их потерять?</h2>
            <ul>
                <li><strong>Потратив их</strong> — магазин на странице Цели, элитные корабли, Плавучий город, Орбитальная станция, исследование Территориальное расширение, пытка пленника, взнос в банк альянса. Отмена производства кораблей, строительства или исследования возвращает потраченные ОВ.</li>
                <li><strong>Будучи уничтоженным</strong> — если игрок захватывает Вашу последнюю планету, у Вас наступает Game Over, и он забирает <strong>все</strong> Ваши ОВ и Bitcoin.</li>
                <li><strong>Налог мира</strong> — если Ваш альянс принял мир с данью в ОВ, часть ОВ, которые Вы получаете в бою, уходит победившему альянсу.</li>
            </ul>
            <p>Проигрыш боя не отнимает у Вас никаких ОВ (Вы даже получаете небольшое утешение), а экономическое банкротство их не затрагивает.</p>

            <h2 id="strategie">Стратегия</h2>
            <p>ОВ награждают <strong>агрессивных</strong> игроков. Если Вы хотите подняться в столбце «Pdg» рейтинга, сосредоточьтесь на космических боях, защите своих планет, рейдах и арене, а не на чистом экономическом росте.</p>

    quests:
        title: "Ежедневные задания"
        category: "progression"
        order: 3
        tags: "задания,цели,ежедневные,миссия,награда,ов"
        summary: "3 цели каждый день, которые нужно выполнить до следующего отчёта, с оплатой в Очках Войны."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Каждый день при ежедневном отчёте в <strong>18:59 (по времени Парижа)</strong> игра назначает Вам <strong>3 ежедневных задания</strong>, называемых в меню «Цели». Это небольшие задачи, которые Вы можете выполнить во время обычной игровой сессии.</p>
            <p>У Вас есть время до следующего отчёта: невыполненные задания тогда удаляются и заменяются 3 новыми.</p>
            <p>Когда Вы приходите на сервер, Ваши первые задания всегда одни и те же: написать сообщение в салоне, зондировать планету игрока и вступить в альянс или создать его (кроме Battle Royale).</p>
            <p>Игра даёт Вам только такие задания, которые выполнимы за день: никакого строительства без нужного исследования или места, никакой атаки, пока Вы под защитой новичка, никаких рейдов и вторжений без баржи, никакого «Колонизировать планету», если у Вас уже 20 колонизированных планет, и т.&nbsp;д.</p>

            <h2 id="types">Возможные задания</h2>
            <p>3 задания дня выбираются случайно из этого списка (базовая награда в ОВ):</p>
            <table>
                <tr><th>Задание</th><th>Базовая награда</th></tr>
                <tr><td>Отправить личное сообщение</td><td>250</td></tr>
                <tr><td>Написать сообщение в салон (в любой доступный Вам салон)</td><td>250</td></tr>
                <tr><td>Потратить Очки Войны (в магазине на странице Цели)</td><td>250</td></tr>
                <tr><td>Зондировать планету игрока</td><td>250</td></tr>
                <tr><td>Измените свой аватар (если у Вас его нет)</td><td>250</td></tr>
                <tr><td>Продать ресурсы торговцам</td><td>500</td></tr>
                <tr><td>Создать новую Когорту</td><td>500</td></tr>
                <tr><td>Обучить Легионеров</td><td>500</td></tr>
                <tr><td>Улучшите свои корабли</td><td>500</td></tr>
                <tr><td>Построить оборону (войска или турели)</td><td>500</td></tr>
                <tr><td>Построить корабли</td><td>500</td></tr>
                <tr><td>Построить щит</td><td>750</td></tr>
                <tr><td>Колонизировать планету</td><td>1&nbsp;000</td></tr>
                <tr><td>Переработать ресурсы</td><td>1&nbsp;000</td></tr>
                <tr><td>Построить здание Большой город</td><td>1&nbsp;000</td></tr>
                <tr><td>Завершить исследование</td><td>1&nbsp;000</td></tr>
                <tr><td>Обучить учёных</td><td>1&nbsp;000</td></tr>
                <tr><td>Уничтожить вражеский флот (не утилитарный)</td><td>1&nbsp;000</td></tr>
                <tr><td>Построить космическую базу</td><td>1&nbsp;000</td></tr>
                <tr><td>Построить большой щит</td><td>1&nbsp;750</td></tr>
                <tr><td>Построить здание Мегаполис</td><td>2&nbsp;000</td></tr>
                <tr><td>Вступить в альянс или создать его (если у Вас его нет)</td><td>2&nbsp;000</td></tr>
                <tr><td>Построить здание Тяжёлая промышленность</td><td>4&nbsp;000</td></tr>
                <tr><td>Вторгнуться на планету игрока</td><td>4&nbsp;000</td></tr>
                <tr><td>Разграбить планету игрока</td><td>4&nbsp;000</td></tr>
                <tr><td>Нанести ядерный удар по планете игрока</td><td>5&nbsp;000</td></tr>
            </table>
            <p>Для зданий засчитывается любое завершённое строительство, независимо от его уровня. «Завершить исследование» отсутствует на серверах, где все исследования открыты с самого начала.</p>

            <h2 id="recompense">Награды</h2>
            <ul>
                <li>Каждое выполненное задание приносит <strong>ОВ</strong>, зачисляемые сразу: выигрыш равен <strong>большему</strong> из двух значений — базовой награды задания и <strong>5&nbsp;% от среднего числа очков игроков сервера</strong> (пересчитывается при каждом ежедневном отчёте), чтобы награда оставалась интересной, даже когда империи становятся огромными.</li>
                <li>Награда, отображаемая на странице Цели, — это та, которую Вы получите.</li>
            </ul>
            <p>Пример: если среднее по серверу составляет 30&nbsp;000 очков, «Отправить личное сообщение» приносит 1&nbsp;500 ОВ вместо 250, тогда как «Вторгнуться на планету игрока» остаётся на 4&nbsp;000.</p>

            <h2 id="consulter">Где их увидеть</h2>
            <p>Ваши задания дня находятся на странице <strong>Цели</strong> (меню, значок мишени); значок показывает, сколько их у Вас осталось (например, 2/3). Каждое задание указано там с наградой в ОВ и редкостью (от 1 до 5 звёзд).</p>
            <p>Они засчитываются автоматически: как только Вы совершаете действие, задание исчезает из списка, а сообщение «Цель выполнена» показывает Ваш выигрыш. На этой же странице Вы можете потратить свои ОВ (Bitcoin, Легионеры, рабочие).</p>

    ranking:
        title: "Рейтинги"
        category: "progression"
        order: 4
        tags: "рейтинг,ранг,позиция,топ,таблица лидеров"
        summary: "Несколько рейтингов для оценки Вашего прогресса (и прогресса Ваших соперников)."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="types">Доступные рейтинги</h2>
            <table>
                <tr><th>Рейтинг</th><th>Основан на</th><th>Награда</th></tr>
                <tr><td><strong>Рейтинг командиров</strong></td><td>Ваших <strong>очках</strong>: рабочие, корабли, войска, турели и здания (см. <em>Уровни и опыт</em>). Столбцы Позиция, Ник, Планеты, Очки и <strong>Pdg</strong> (Очки Войны) сортируются щелчком.</td><td>Прямой награды нет. При закрытии сервера попадание в топ-10 открывает достижение <em>Элита</em>, а победитель получает <em>Император</em>.</td></tr>
                <tr><td><strong>Рейтинг альянсов</strong></td><td>Сумма очков участников (100 лучших альянсов сервера).</td><td>Прямой награды нет.</td></tr>
                <tr><td><strong>Рейтинг дуэлей</strong> (арена)</td><td>Процент побед Вашего главного героя в дуэлях (победы ÷ проведённые дуэли), начиная с 5 дуэлей.</td><td>Каждый понедельник 3 героя, выигравшие больше всего дуэлей за прошедшую неделю (минимум 5 дуэлей за неделю), получают 300 / 200 / 100 ОВ и 3&nbsp;000 / 2&nbsp;000 / 1&nbsp;000 урана.</td></tr>
                <tr><td><strong>Рейтинг альянсов во время блокады Ктулху</strong></td><td>Что делает каждый альянс против улья во время блокады.</td><td>Бонус или штраф к производству на 72&nbsp;часа (см. <em>Пророчества Ктулху</em>).</td></tr>
            </table>
            <p>Очки и позиции в Рейтинге командиров пересчитываются раз в день, при ежедневном отчёте (18:59, по времени Парижа); рядом с каждым игроком стрелка и число показывают изменение с предыдущего отчёта. Очки Войны же обновляются постоянно.</p>

            <h2 id="consulter">Где их увидеть</h2>
            <p>Откройте страницу <strong>Обзор</strong>: на карточке Вашего командира ссылка <strong>«Ранг: N»</strong> открывает Рейтинг командиров, а название Вашего альянса открывает Рейтинг альянсов. Таким образом, Ваш ранг всегда виден на этой карточке.</p>
            <p>В Рейтинге командиров Вы можете искать игрока по нику или по тегу его альянса и сортировать каждый столбец. Ваша строка выделена, как и строки Ваших союзников и врагов. На первой странице график сравнивает динамику Ваших очков и ОВ со средним по серверу.</p>
            <p>Рейтинг дуэлей находится на странице <strong>Герой</strong>, вкладка <strong>Арена</strong>. Рейтинг блокады отображается на странице <strong>Ктулху</strong> во время события.</p>

            <h2 id="utilite">Почему это важно</h2>
            <ul>
                <li><strong>Стратегия</strong> — определите крупных игроков, которых стоит избегать или выбирать целью.</li>
                <li><strong>Общение</strong> — витрина для набора в Ваш альянс.</li>
                <li><strong>Соревнование</strong> — на <strong>Paid Server</strong> победитель — игрок с наибольшей суммой «очки + 2 × Очки Войны» в конце сервера. На всех серверах Ваш итоговый ранг учитывается в достижениях (топ-10 = <em>Элита</em>).</li>
            </ul>

    heroes:
        title: "Ваш герой"
        category: "progression"
        order: 5
        tags: "герой,бонус,планета,флот,опыт,захват,тюрьма,специализация"
        summary: "Ваш личный герой: он развивается, сражается, усиливает Вашу империю и может быть захвачен."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>У каждого игрока есть <strong>один главный герой</strong>, создаваемый в начале игры. Этот герой должен <strong>всегда</strong> быть назначен либо на планету, либо на флот — никогда не свободным. Кроме того, Вы можете иметь <strong>второстепенных героев</strong> в неограниченном количестве — см. отдельную статью.</p>
            <p>Пока у Вас нет главного героя — в начале игры или после его казни в тюрьме, — игра возвращает Вас к его созданию: игровые страницы до тех пор закрыты, страницы Вашего аккаунта остаются доступны. Если один из Ваших второстепенных героев занимает планету, выбранную для нового героя, он возвращается в <strong>резерв</strong>.</p>
            <p>Герой даёт бонусы в зависимости от его навыков, специализации, уровня и предметов. Его 4 навыка: <strong>Атака</strong>, <strong>Защита</strong>, <strong>Интеллект</strong> и <strong>Скорость</strong>. Каждое вложенное очко даёт <strong>+1&nbsp;%</strong>:</p>
            <ul>
                <li><strong>Атака</strong>: огневая мощь флота, который он сопровождает.</li>
                <li><strong>Защита</strong>: броня флота, который он сопровождает; на планете — наземная защита от высадок Ктулху.</li>
                <li><strong>Интеллект</strong>: производство ниобия, воды и пищи на планете, на которую он назначен (и только на ней).</li>
                <li><strong>Скорость</strong>: время полёта флота, который он сопровождает (−1&nbsp;% за очко, общее сокращение ограничено 90&nbsp;%).</li>
            </ul>
            <p>Атака и Защита не участвуют в наземных боях между игроками (рейд, вторжение): там учитываются только специализация Военный и её черты. В дуэли на арене все четыре навыка входят в счёт: Интеллект питает Хитрость, а Скорость питает Порыв (см. статью <em>PvP Арена</em>).</p>

            <h2 id="specialites">Специализации</h2>
            <p>Каждая специализация даёт пассивный бонус, поднимает предел одного или двух навыков и открывает 3 черты на уровнях 5, 10 и 15:</p>
            <ul>
                <li><strong>Военный</strong>: +5&nbsp;% к огневой мощи флота, который он сопровождает; на планете +5&nbsp;% к стрельбе турелей и наземной защите; на земле между игроками +5&nbsp;% к мощи его стороны (как в атаке, так и в обороне); +5&nbsp;% в дуэли на арене. Предел Атаки и Защиты повышен до 50&nbsp;%. Черты: <strong>Устрашение</strong> (ур. 5, противник получает −5&nbsp;% наступательной мощи, в том числе против Ктулху, и −5&nbsp;% к счёту в дуэли), <strong>Тактик</strong> (ур. 10, +10&nbsp;% к мощи в первом раунде Ваших боёв и +10&nbsp;% в дуэли), <strong>Военачальник</strong> (ур. 15, −5&nbsp;% потерь Ваших наземных войск в бою между игроками и +5&nbsp;% к мощи в дуэли).</li>
                <li><strong>Экономика</strong>: удваивает бонусы Интеллекта (производство, включая предметы производства) и лагеря рабов на планете, на которую он назначен. Предел Интеллекта повышен до 50&nbsp;%. Черты: <strong>Эффективный</strong> (ур. 5: отображается в карточке героя как −10&nbsp;% к строительству, на самом деле эта черта не влияет на строительство), <strong>Торговец</strong> (ур. 10, +15&nbsp;% к продажам торговцу, совершаемым его флотом или с его планеты), <strong>Магнат</strong> (ур. 15, +20&nbsp;% к производству на его планете).</li>
                <li><strong>Исследователь</strong>: +5&nbsp;% к точности флота, который он сопровождает, и удваивает его бонус Скорости (включая предметы) для времени полёта. Предел Скорости повышен до 50&nbsp;%. Черты: <strong>Разведчик</strong> (ур. 5, +1 к силе радара на планете, на которую он назначен), <strong>Навигатор</strong> (ур. 10, ещё −15&nbsp;% ко времени полёта его флота), <strong>Картограф</strong> (ур. 15, ещё +2 к силе радара, то есть +3 в сумме с Разведчиком).</li>
            </ul>

            <p>В <strong>дуэли на арене</strong> действуют те же правила: военный сохраняет свои +5&nbsp;% и три черты, у экономиста удвоенный Интеллект (плюс 20&nbsp;% с Магнатом) питает Хитрость, а у исследователя удвоенная Скорость (плюс 15&nbsp;% с Навигатором) питает Порыв. Хитрость и Порыв учитываются на 60&nbsp;% своего значения.</p>
            <p>Подробная сводка этих бонусов автоматически отображается при создании героя.</p>

            <h2 id="xp">Получение опыта</h2>
            <p>Опыт зарабатывается несколькими способами:</p>
            <ul>
                <li><strong>Бой</strong>: фиксированная часть (победа в космическом бою 150 опыта, выигранный рейд 100, успешное вторжение 200, поражение 25) плюс часть, зависящая от силы врага: его сигнатура ÷ 150, делённая на уровень героя. Пример: герой 5-го уровня, уничтоживший флот сигнатурой 30&nbsp;000, получает 150 + 40 = 190 опыта.</li>
                <li><strong>Дуэль на арене</strong> (и каждый бой турнира): опыт получает только победитель — от 30 опыта за уверенную победу до 90 опыта за очень упорную дуэль. Проигравший его не получает.</li>
                <li><strong>Пассивный</strong>: герой, назначенный на планету (не на флот), получает 5 опыта за каждый час отсутствия, зачисляемые при Вашем возвращении (40 опыта после 8 часов отсутствия). Частые заходы с интервалом менее 12 минут опыта не приносят.</li>
            </ul>
            <p>Весь получаемый опыт увеличивается на бонус опыта Вашего альянса и, если герой назначен на планету с Лагерем рабов, на +5&nbsp;% за каждого содержащегося там пленника (максимум +25&nbsp;%). Захваченный герой опыт не получает.</p>
            <p>Чтобы перейти с уровня N на уровень N+1, нужно N × 500 опыта: 500 опыта для достижения 2-го уровня, 5&nbsp;000 опыта для перехода с 10-го уровня на 11-й и 22&nbsp;500 опыта в сумме для достижения 10-го уровня. Каждый полученный уровень даёт <strong>2 очка навыков</strong>, которые распределяются на странице Герой. Каждое очко даёт +1&nbsp;% в выбранном навыке, до 30&nbsp;% на навык (50&nbsp;% для навыка или навыков Вашей специализации). Бонусы предметов добавляются сверх этих пределов.</p>

            <h2 id="assignation">Назначение</h2>
            <p>Назначьте героя на странице <strong>Герой</strong> (кнопка «Переназначить героя»), на странице <strong>Планеты</strong> (кнопка «Назначить героя» у планеты) или на странице управления <strong>флотом</strong> (кнопка «Назначить»). Изменение происходит мгновенно, без времени в пути.</p>
            <p>Планета или флот может принять только одного героя. Планета под эмбарго не может принять героя, а герой, находящийся на планете под эмбарго, не может присоединиться к флоту. Героя на флоте, находящемся в полёте или в бою, переназначить нельзя.</p>
            <p>Если его флот уничтожен, а он не захвачен, герой высаживается на планету боя, если она принадлежит Вам и на ней нет героя; иначе — на Вашу самую старую планету без героя. Если на всех Ваших планетах уже есть герои, Ваш главный герой занимает место одного из Ваших второстепенных героев, который возвращается в резерв.</p>

            <h2 id="capture">Захват</h2>
            <p>Ваш главный герой может быть захвачен во время боя:</p>
            <ul>
                <li><strong>Космический бой против флотов</strong> (Ваш флот уничтожен): 20&nbsp;% шанс. Уничтожение Вашего флота одной лишь обороной планеты или безоружным флотом не приводит к захвату Вашего главного героя.</li>
                <li><strong>Вторжение</strong> на планету, на которую он назначен: 35&nbsp;% шанс. Герою на борту флота вторжения захват не грозит никогда, даже если вторжение провалилось, а рейд не захватывает никогда.</li>
            </ul>
            <p>Для захвата нужно <strong>здание Тюрьма 1-го уровня или выше</strong>: героя заключают на месте боя, если оно принадлежит победителю и на нём есть Тюрьма, иначе — на планете победителя с самой высокой Тюрьмой. Без Тюрьмы захвата нет.</p>
            <p>После освобождения герой получает <strong>24 ч иммунитета</strong> от повторного захвата.</p>
            <p>Захватить Вашего главного героя может только игрок: ни Ктулху, ни ИИ-командиры этого не делают. Внимание: ИИ-командиры, напротив, могут захватить или казнить Ваших второстепенных героев.</p>
            <p>Этот раздел описывает Вашего <strong>главного</strong> героя. У Ваших <strong>второстепенных героев</strong> совершенно другое правило захвата, без вероятности — см. статью <em>Второстепенные герои</em>.</p>

    secondary_heroes:
        title: "Второстепенные герои"
        category: "progression"
        order: 6
        tags: "герой,второстепенный,конюшня,захват,казнь,тюрьма,переработка,резерв,добыча"
        summary: "Дополнительные герои, получаемые как редкая добыча: те же бонусы, что у главного героя, но их можно окончательно захватить или казнить в бою."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Второстепенный герой даёт <strong>те же бонусы</strong>, что и главный, когда размещён на планете или флоте. Его отличие: в случае поражения он может быть <strong>захвачен или убит окончательно</strong>. Вы можете накопить нескольких, в дополнение к главному герою.</p>

            <h2 id="obtention">Как их получают</h2>
            <p>Второстепенный герой — это <strong>редкая добыча</strong>, купить его нельзя никогда:</p>
            <table>
                <thead>
                    <tr><th>Источник</th><th>Шанс</th></tr>
                </thead>
                <tbody>
                    <tr><td>Победа в Tower Defense Ктулху (за прохождение)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Отражённая атака Ктулху на одну из Ваших планет (отражённая высадка или уничтоженная на орбите орда)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Победитель турнира арены</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>При получении у него 1-й уровень, имя и специализация выбираются случайно, и он сразу попадает в <strong>резерв</strong> — Вам решать, куда его поставить, или переработать, так и не поставив.</p>

            <p>О каждом полученном герое Вам сообщает <strong>рапорт</strong>, в котором указано, откуда он. Экран окончания Tower Defense и рапорт о победе над Ктулху также сообщают об этом сразу.</p>

            <h2 id="placement">Куда их ставить</h2>
            <p>Как и главного героя: на <strong>планету</strong> или на <strong>флот</strong>, но не на то и другое сразу. Неразмещённый второстепенный герой остаётся в <strong>резерве</strong>: никаких бонусов, но и <strong>никакого риска</strong> — это нормальный выбор, а не недосмотр, который нужно исправлять. Управляйте всеми своими второстепенными героями на вкладке <strong>Конюшня</strong> страницы Герой: кнопка «Назначить», чтобы поставить, «Вернуть в резерв», чтобы снять.</p>

            <h2 id="gestion">Навыки и снаряжение</h2>
            <p>Второстепенный герой развивается как главный: он получает уровни, а с ними — <strong>очки навыков</strong>. Кнопка <strong>Управление</strong> в Конюшне открывает их распределение между Атакой, Защитой, Интеллектом и Скоростью.</p>
            <p>Та же панель управляет его <strong>снаряжением</strong>: наденьте на него свободный предмет из Вашего инвентаря или заберите обратно. Предметы захваченного вражеского героя достаются Вам вместе с ним — именно так Вы их получаете.</p>

            <h2 id="risque">Чем Вы рискуете</h2>
            <p>Размещённый второстепенный герой может быть потерян <strong>окончательно</strong> при:</p>
            <ul>
                <li>Проигранном <strong>космическом бою</strong> (его флот уничтожен).</li>
                <li>Проигранном <strong>утилитарном бою</strong> (флот без какого-либо оружия, уничтоженный даже без сражения).</li>
                <li>Успешном <strong>вторжении</strong> на планету, где он расквартирован.</li>
                <li>Уничтожении его флота <strong>орбитальной обороной</strong> планеты, переведённой в режим атаки.</li>
            </ul>
            <p>Зато он <strong>ничем не рискует</strong> при:</p>
            <ul>
                <li><strong>Наземном бою рейда</strong> — даже успешный рейд никогда не захватывает планету. Однако если перевозящий его флот уничтожен на орбите, он подвергается риску, как при любом уничтоженном флоте.</li>
                <li>Бое против <strong>Ктулху</strong> (или против Торговца). Внимание: <strong>ИИ-командиры</strong> подчиняются тому же правилу, что и игроки, и могут захватить или казнить Ваших второстепенных героев.</li>
                <li><strong>Арене</strong> — дуэли и турниры не подвергают ни одного героя захвату.</li>
            </ul>

            <p><strong>Уведомление</strong> предупредит Вас, как только один из Ваших второстепенных героев будет захвачен или казнён: окончательная потеря не зависит от того, откроете ли Вы свой рапорт.</p>

            <h2 id="prison">Условие: тюрьма</h2>
            <p>В отличие от Вашего главного героя (захват <em>вероятностный</em>, см. статью <em>Тюрьма и захваченные герои</em>), судьба побеждённого второстепенного героя <strong>полностью детерминирована</strong>, без малейшей случайности:</p>
            <ul>
                <li>У победителя есть <strong>здание Тюрьма</strong> 1-го уровня или выше хотя бы на одной из его планет → он <strong>захватывает</strong> героя с нетронутыми уровнем, опытом и предметами.</li>
                <li>У победителя <strong>нет никакой</strong> построенной Тюрьмы → герой <strong>казнён</strong>, а его предметы попадают в инвентарь победителя.</li>
            </ul>
            <p>В бою блоков (несколько союзников бок о бок) герой достаётся победившему командиру, который <strong>вложил в бой больше всего мощи</strong> — если у него нет Тюрьмы, герой казнён, даже если она была у союзника из той же стороны.</p>
            <p>Захваченный второстепенный герой — <strong>не</strong> обычный пленник: нет страницы тюрьмы, нет побега, нет выкупа. Он сразу, активным, попадает в Конюшню своего нового владельца, в резерв, готовый к размещению или переработке.</p>

            <h2 id="no-recovery">Вернуть невозможно</h2>
            <p>Однажды захваченный или казнённый второстепенный герой потерян <strong>навсегда</strong>: ни побег, ни выкуп, ни освобождение вторжением его прежнего владельца не позволят его вернуть. Единственный способ когда-нибудь увидеть его снова — самому отбить его в бою, и так он может бесконечно переходить из империи в империю.</p>

            <h2 id="identite">Захваченный герой сохраняет личность</h2>
            <p>Захваченный второстепенный герой сохраняет своё <strong>имя</strong>, <strong>уровень</strong> и <strong>опыт</strong>. В Вашей Конюшне он показывает своего исходного командира («Захвачен у …»).</p>

            <h2 id="recyclage">Переработка</h2>
            <p>Вы можете <strong>переработать</strong> одного из Ваших второстепенных героев (кнопка «Переработать» в Конюшне): он уничтожается, а Ваш главный герой получает <strong>90&nbsp;%</strong> всего опыта, накопленного этим второстепенным героем с 1-го уровня (бонусы опыта альянса на это не действуют). Его предметы возвращаются в Ваш инвентарь.</p>
            <p>Пример: второстепенный герой 10-го уровня приносит 20&nbsp;250 опыта — достаточно, чтобы главный герой перешёл с 10-го уровня на 13-й.</p>
            <p>Перед подтверждением показывается расчётный предварительный итог (передаваемый опыт, прогнозируемый уровень главного героя). Переработка невозможна, пока его флот в полёте или в бою. <strong>Необратимое действие.</strong></p>

    items:
        title: "Предметы героя"
        category: "progression"
        order: 6
        tags: "предметы,снаряжение,бонус,редкость,дроп,cthulhu,слияние,ктулху"
        summary: "Экипируйте героя до 3 предметов, чтобы накапливать бонусы. Как их получить."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Предметы — это объекты, которые можно надеть на Ваших героев (максимум <strong>3 предмета</strong> на героя). Их бонусы добавляются к бонусам героя сверх пределов навыков. Что именно они дают, зависит от типов их бонусов, описанных ниже.</p>

            <h2 id="categories">Категории</h2>
            <ul>
                <li><strong>Наступательный</strong> (оружие), <strong>Оборонительный</strong> (броня, щиты) и <strong>Сила</strong> (предметы статуса).</li>
            </ul>
            <p>Категория меняет только название и внешний вид предмета: его бонусы выбираются случайно из всех типов, независимо от категории. Поэтому смотрите на бонусы, показанные на карточке, а не на категорию. Ограничений по типу нет: Вы можете надеть 3 наступательных, если захотите.</p>

            <h2 id="raretes">Редкость</h2>
            <ul>
                <li><strong>Обычный</strong>: 1 бонус (+2–5&nbsp;%)</li>
                <li><strong>Редкий</strong>: 1 или 2 бонуса (по +5–10&nbsp;% каждый)</li>
                <li><strong>Эпический</strong>: 2 или 3 бонуса (по +10–15&nbsp;% каждый)</li>
                <li><strong>Легендарный</strong>: 3 или 4 бонуса (по +15–25&nbsp;% каждый)</li>
            </ul>
            <p>Каждый бонус выбирается случайно в диапазоне его редкости при создании предмета, а затем больше не меняется.</p>
            <p>Уровень героя не меняет бонусы предмета: они добавляются как есть, будь герой 1-го или 20-го уровня. Значение имеет только специализация: герой Экономики удваивает бонусы Производства, а Исследователь удваивает бонусы Скорости флота. В дуэли, поскольку счёт пропорционален уровню, один и тот же предмет приносит больше очков герою высокого уровня при той же доле его счёта.</p>

            <h2 id="bonus">Типы бонусов</h2>
            <p>Существует 16 типов бонусов. Вот где действует каждый (названия — те, что отображаются на карточках):</p>
            <table>
                <thead>
                    <tr><th>Бонус</th><th>Эффект</th></tr>
                </thead>
                <tbody>
                    <tr><td>Атака флота, Защита флота, Точность флота, Щит флота</td><td>Бои флота, который сопровождает герой.</td></tr>
                    <tr><td>Скорость флота</td><td>Время полёта флота, который сопровождает герой.</td></tr>
                    <tr><td>Производство</td><td>Производство ниобия, воды и пищи на планете, на которую назначен герой.</td></tr>
                    <tr><td>Сила Легионеров</td><td>Наземная защита планеты, на которую назначен герой, только против высадок Ктулху.</td></tr>
                    <tr><td>Сила дуэли</td><td>Счёт в дуэли на арене.</td></tr>
                    <tr><td>Сила Мехов, Скорость строительства, Производство рабочих, Производство кораблей, Дальность радара, Скорость переработки, Урон Ктулху, Получение опыта</td><td>Эти бонусы действуют только в дуэли на арене.</td></tr>
                </tbody>
            </table>
            <p>В дуэли на арене учитываются все 16 типов, с весом, зависящим от типа (см. статью <em>PvP Арена</em>). Бонус флота у героя, назначенного на планету, действует только в дуэли.</p>

            <h2 id="obtention">Получение</h2>
            <p>Вот все способы получить предметы:</p>

            <h3>Бои с Ктулху</h3>
            <p>Предмет может выпасть, когда Вы побеждаете Ктулху — отражаете ли их наземную высадку или полностью уничтожаете их орду на орбите до приземления. Шансы одинаковы в обоих случаях и зависят от Вашей сложности PvE:</p>
            <ul>
                <li><strong>Легко</strong>: 30&nbsp;% шанс получить предмет (22&nbsp;% обычный, 7&nbsp;% редкий, 1&nbsp;% эпический)</li>
                <li><strong>Нормально</strong>: 40&nbsp;% шанс (25&nbsp;% обычный, 10&nbsp;% редкий, 4,5&nbsp;% эпический, 0,5&nbsp;% легендарный)</li>
                <li><strong>Сложно</strong>: 50&nbsp;% шанс (25&nbsp;% обычный, 15&nbsp;% редкий, 8&nbsp;% эпический, 2&nbsp;% легендарный)</li>
            </ul>
            <p>Орда, лишь частично уничтоженная на орбите, всё равно высаживается: тогда розыгрыш запускает именно эта высадка, но никогда обе сразу.</p>

            <h3>Победы на арене</h3>
            <p>Каждая победа в дуэли на арене, включая бои турнира, даёт шанс на предмет:</p>
            <ul>
                <li><strong>Обычный</strong>: 10&nbsp;%</li>
                <li><strong>Редкий</strong>: 4&nbsp;%</li>
                <li><strong>Эпический</strong>: 1&nbsp;%</li>
            </ul>
            <p>Это примерно 15&nbsp;% шанс получить предмет за каждую победу.</p>

            <h3>Ставки в дуэлях</h3>
            <p>Бросая вызов, Вы можете поставить предмет. Если соперник принимает, он должен поставить предмет той же редкости. Победитель забирает оба предмета.</p>

            <h3>Другие источники</h3>
            <ul>
                <li><strong>Tower Defense Ктулху</strong>: каждая победа даёт право на розыгрыш по шансам Вашей сложности, указанным выше (два розыгрыша на Сложно).</li>
                <li><strong>Турниры арены</strong>: гарантированный эпический предмет за 1-е место, редкий за 2-е и 3-е, 10&nbsp;% шанс обычного для остальных участников (см. статью <em>PvP Арена</em>).</li>
                <li><strong>Бонус за вход</strong>: обычный предмет на 3-й день Вашей серии, редкий — на 7-й.</li>
            </ul>

            <h3>Слияние трёх предметов</h3>
            <p>Три предмета <strong>одной редкости</strong> сливаются в предмет следующей по порядку редкости, без затрат и ожидания. Категория и бонусы нового предмета выбираются случайно, как у предмета, найденного в бою. Три исходных предмета расходуются окончательно, а предмет, надетый на героя, нужно сначала снять. Легендарная — максимальная редкость: такие предметы не сливаются.</p>
            <p>Слияние запускается со страницы <strong>Герой</strong>, вкладка <strong>Слияние</strong>: нажмите на три карточки предметов, чтобы выбрать их (кликабельна вся карточка), затем подтвердите кнопкой слияния, доступной как сверху, так и снизу списка.</p>

            <h2 id="vol">Кража предметов</h2>
            <p>Если Ваш главный герой захвачен, каждый из его надетых предметов может быть украден победителем. Вероятность кражи: Обычный 80&nbsp;%, Редкий 60&nbsp;%, Эпический 40&nbsp;%, Легендарный 25&nbsp;%.</p>
            <p>Неукраденные предметы остаются на Вашем герое на время плена: он сохраняет их, если его освободят, но тюремщик забирает их все, если казнит его. Захваченный второстепенный герой уносит все свои предметы к новому владельцу.</p>

            <h2 id="inventaire">Инвентарь</h2>
            <p>Откройте свой инвентарь на странице <strong>Герой</strong>, вкладка <strong>Инвентарь</strong>. В инвентаре Вы можете:</p>
            <ul>
                <li><strong>Экипировать</strong> предмет на главного героя (если он не захвачен, несёт менее 3 предметов и не находится на борту флота в полёте или в бою). Второстепенные герои экипируются на вкладке <strong>Конюшня</strong> (кнопка «Управление»).</li>
                <li><strong>Снять</strong> предмет, вернув его в инвентарь (невозможно, пока его флот в полёте или в бою).</li>
                <li><strong>Уничтожить</strong> предмет, который Вам больше не нужен.</li>
                <li><strong>Слить</strong> 3 предмета одной редкости в предмет следующей редкости, на соседней вкладке <strong>Слияние</strong>.</li>
            </ul>
            <p>Каждый предмет представлен в виде <strong>иллюстрированной карточки</strong>, показывающей его изображение, бонусы и цветную рамку по редкости. Карточки выстраиваются сеткой (по 3–4 в ряд в зависимости от места на Вашем экране).</p>

    prison:
        title: "Тюрьма и захваченные герои"
        category: "progression"
        order: 7
        tags: "тюрьма,захват,герой,побег,пытка,выкуп,тюремщик,второстепенный"
        summary: "Что происходит, когда герой захвачен? Действия заключённого и тюремщика, а также прямой захват вражеских второстепенных героев."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Захват героя</h2>
            <p>Главный герой захватывается в космическом бою против флотов (20&nbsp;%) или при вторжении на планету, на которую он назначен (35&nbsp;%) — подробности в статье <em>Ваш герой</em>. Захваченный игрок заключается под стражу: любая страница за пределами разрешённого перенаправляет его на <strong>страницу тюрьмы</strong>. При этом у него остаётся доступ к <strong>салону альянса</strong>, к <strong>личным сообщениям</strong>, к <strong>рапортам</strong>, к <strong>просмотру</strong> (только чтение) своего альянса, к <strong>управлению аккаунтом</strong> и к <strong>смене сервера</strong>. Всё остальное — строительство, флоты, карта, рынок, арена и даже страница Герой — остаётся недоступным, пока его не освободят.</p>
            <p>Для захвата нужно <strong>здание Тюрьма 1-го уровня или выше</strong>: героя заключают на месте боя, если оно принадлежит победителю и на нём есть Тюрьма, иначе — на планете победителя с самой высокой Тюрьмой. Без Тюрьмы захвата нет.</p>

            <h2 id="prisonnier">Действия заключённого</h2>
            <p>У заключённого есть несколько действий. <strong>Предупредить альянс</strong> и <strong>Восстать</strong> делят одну задержку: одно из двух возможно сразу после захвата, затем — одно раз в <strong>4 часа</strong>.</p>
            <ul>
                <li><strong>Предупредить альянс</strong> (70&nbsp;% + 2&nbsp;% за уровень героя, максимум 90&nbsp;%; 80&nbsp;% на 5-м уровне): отправляет координаты тюрьмы в салон альянса. Неудача = тюремщик получает предупреждение. Без альянса действие недоступно. После неудачи следующее действие ждёт 6 часов вместо 4.</li>
                <li><strong>Восстать</strong> (25&nbsp;% + 1,5&nbsp;% за уровень, +10&nbsp;% для Военного; 50&nbsp;% для Военного 10-го уровня): уничтожает 5&nbsp;% ниобия, воды и пищи на планете-тюрьме. Неудача = потеря уровня. В обоих случаях тюремщик получает рапорт.</li>
                <li><strong>Сбежать</strong>: одна попытка раз в 4 часа с момента захвата (первая — через 4 часа). 40&nbsp;% успеха, +5&nbsp;% за каждые 4 часа плена, вплоть до 100&nbsp;% через 52 часа. Неудача = тюремщик получает предупреждение. Эта задержка не зависит от двух предыдущих действий.</li>
                <li><strong>Побег через Slash</strong>: в любой момент и без ограничений. См. статью <em>Побег из тюрьмы</em>.</li>
                <li><strong>Заплатить выкуп</strong>: если тюремщик потребовал выкуп, Вы можете заплатить его или отказаться на странице тюрьмы.</li>
            </ul>

            <h2 id="geolier">Действия тюремщика</h2>
            <p>Своими заключёнными Вы управляете на странице <strong>Герой</strong>, вкладка <strong>Заключённые</strong>:</p>
            <ul>
                <li><strong>Казнить</strong>: окончательно уничтожает героя и приносит Вам 100 ОВ за уровень героя (1&nbsp;200 ОВ за 12-й уровень). Вы забираете все его оставшиеся предметы. Его владелец узнаёт об этом из рапорта.</li>
                <li><strong>Освободить</strong>: дипломатический жест, герой возвращается к своему владельцу.</li>
                <li><strong>Пытать</strong> (200 ОВ): раскрывает координаты случайно выбранной планеты владельца заключённого (она может уже быть известна) и отнимает у заключённого 50 опыта. Можно повторять без задержки.</li>
                <li><strong>Потребовать выкуп</strong>: потребовать ниобий, воду и/или уран в обмен на освобождение. У заключённого есть 24 часа, чтобы заплатить или отказаться; одновременно возможно только одно требование, но после отказа или истечения срока Вы можете выдвинуть новое.</li>
            </ul>

            <h2 id="liberation">Освобождение</h2>
            <ul>
                <li><strong>Альянс заключённого захватывает</strong> планету-тюрьму: автоматическое освобождение.</li>
                <li><strong>Другой игрок захватывает</strong> планету-тюрьму: 60&nbsp;% шанс, что заключённый сбежит в суматохе; иначе он остаётся под стражей, а захватчик, новый владелец планеты, становится его тюремщиком.</li>
                <li><strong>Ктулху захватывают планету-тюрьму</strong>: заключённые не освобождаются. Они остаются под замком в базе Ктулху и должны бежать сами (см. <em>Побег из тюрьмы</em>). Если планета снова становится необитаемой, они освобождаются.</li>
                <li><strong>Тюремщик покидает планету-тюрьму</strong> (или выходит из игры): заключённый освобождается автоматически.</li>
            </ul>

            <h2 id="secondaires">Захват вражеского второстепенного героя</h2>
            <p>Всё вышесказанное — побег, пытки, выкуп, освобождение — относится к <strong>главному герою</strong> противника. <strong>Второстепенный герой</strong> (см. статью <em>Второстепенные герои</em>) подчиняется куда более прямому правилу, и именно здесь Ваше здание Тюрьма приобретает <strong>решающее значение</strong>: как только у Вас есть Тюрьма 1-го уровня или выше на одной из планет, любой побеждённый Вами вражеский второстепенный герой (космический бой, утилитарный бой, уничтожение его флота Вашей орбитальной обороной или успешное вторжение) становится <strong>немедленно и окончательно</strong> Вашим — с нетронутыми уровнем, опытом и предметами. Без Тюрьмы он <strong>казнён</strong> вместо захвата, а его предметы попадают в Ваш инвентарь.</p>
            <p>Захваченный второстепенный герой — <strong>не</strong> заключённый в смысле этой страницы: нет страницы тюрьмы, нет побега, нет выкупа. Он сразу, активным, попадает в Вашу <strong>Конюшню</strong> — готовый к размещению на планете или флоте, либо к переработке.</p>

            <h2 id="prerequis">Предварительные условия</h2>
            <p>Исследование <strong>Тюремная система</strong> (требует Колючую проволоку 5-го уровня), затем здания <strong>Тюрьма</strong> и <strong>Лагерь рабов</strong>.</p>

    prison_escape:
        title: "Побег из тюрьмы"
        category: "progression"
        order: 8
        tags: "тюрьма,побег,slash,выкуп,герой,захват"
        summary: "Три способа выйти из тюрьмы своими силами: мгновенный побег, Slash и выкуп."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Три выхода</h2>
            <p>Когда Ваш герой захвачен, страница тюрьмы предлагает три способа выйти, не дожидаясь союзников: мгновенный побег, побег через Slash и уплата выкупа.</p>

            <h2 id="instant">Мгновенный побег</h2>
            <ul>
                <li>Одна попытка раз в <strong>4 часа</strong>. Первая открывается через 4 часа после захвата.</li>
                <li><strong>40&nbsp;%</strong> успеха при первой попытке, затем <strong>+5&nbsp;%</strong> за каждые 4 часа плена, пробовали Вы свои силы или нет.</li>
                <li>Шанс растёт вплоть до <strong>100&nbsp;%</strong>: 65&nbsp;% после 24 часов плена, 95&nbsp;% после 48 часов, а гарантированный успех — начиная с <strong>52 часов</strong>. Уровень героя на это не влияет.</li>
                <li>Шанс следующей попытки отображается на кнопке.</li>
                <li>Неудача: Ваш герой остаётся в тюрьме, а <strong>тюремщик получает предупреждение</strong>.</li>
            </ul>

            <h2 id="slash">Побег через Slash</h2>
            <p><strong>Slash</strong> — наша другая игра (slash-game.com). Играйте в неё с <strong>тем же адресом e-mail</strong>, что и в Вашем аккаунте Area Universe, подтверждённым с обеих сторон.</p>
            <ul>
                <li>Наберите <strong>75&nbsp;% лучшего результата недели</strong> в партии, сыгранной <strong>после Вашего захвата</strong>.</li>
                <li>Пока в текущей неделе (с понедельника 00:00 UTC) меньше 10 игроков в рейтинге или её лучший результат ниже 50 очков, ориентиром служит лучший результат предыдущей недели.</li>
                <li>Вернитесь на страницу тюрьмы и нажмите <strong>Проверить мой результат</strong>: Ваш герой освобождён.</li>
                <li><strong>Неограниченное</strong> число попыток, без задержки, а тюремщик не получает предупреждения.</li>
                <li>Гостевой аккаунт или неподтверждённый адрес не может воспользоваться этим выходом.</li>
            </ul>

            <h2 id="ransom">Уплата выкупа</h2>
            <p>Если тюремщик требует выкуп (ниобий, воду и/или уран), Вас предупредит рапорт, а на странице тюрьмы он появится с суммой и крайним сроком (24 часа). Вы можете его <strong>заплатить</strong> или <strong>отклонить</strong>.</p>
            <p>Отказ не освобождает Вашего героя: тюремщик просто получает уведомление и может предложить Вам новый выкуп. Платёж списывается со всех Ваших планет и зачисляется на планету-тюрьму. Если ресурсов не хватает, платёж отклоняется и ничего не списывается.</p>

            <h2 id="sans-rancon">А без выкупа?</h2>
            <p>Тюремщик никогда не обязан требовать выкуп, а срок Вашего плена не фиксирован. Без выкупа Ваш герой выходит из тюрьмы, если:</p>
            <ul>
                <li>Вам удаётся <strong>мгновенный побег</strong>: шанс растёт на 5&nbsp;% каждые 4 часа и достигает 100&nbsp;% через <strong>52 часа</strong> плена;</li>
                <li>Вы набираете нужный результат в <strong>Slash</strong>;</li>
                <li>Ваш альянс <strong>захватывает</strong> планету-тюрьму (освобождение обеспечено) или её захватывает другой игрок (60&nbsp;% шанс побега);</li>
                <li>тюремщик <strong>освобождает</strong> Вас или покидает планету-тюрьму.</li>
            </ul>
            <p>Пока Вы в плену, тюремщик может также пытать Вашего героя (каждый раз −50 опыта) или казнить его. Поэтому лучше пытаться бежать как можно скорее.</p>

            <h2 id="after">После освобождения</h2>
            <p>Ваш герой возвращается на Вашу самую старую планету без героя, с оставшимися предметами, и получает <strong>24 часа иммунитета</strong> от нового захвата.</p>

    arena:
        title: "PvP Арена"
        category: "progression"
        order: 8
        tags: "арена,дуэль,турнир,pvp,герой,вызов,рейтинг"
        summary: "Бросайте вызов другим героям в дуэли 1 на 1. Ставьте уран или предметы, получайте престиж."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Система вызовов</h2>
            <p>На странице <strong>Герой</strong>, вкладка <strong>Арена</strong> (форма «Бросить вызов»), или кнопкой «Вызвать на дуэль» в профиле игрока бросьте вызов другому игроку. Нельзя бросить вызов члену своего альянса. Вызванный получает рапорт и может <strong>принять</strong> или <strong>отклонить</strong> вызов.</p>
            <ul>
                <li>Вызов автоматически истекает через <strong>7 дней</strong> без ответа. Число ожидающих полученных вызовов отображается на вкладке Арена и на пункте «Герой» меню. Оставшееся до истечения время отображается рядом с каждым полученным вызовом. После истечения Вы можете снова вызвать того же игрока.</li>
                <li>Вы можете <strong>отменить</strong> отправленный Вами вызов, пока он ожидает ответа.</li>
                <li>Время восстановления: каждый герой должен ждать <strong>1 час</strong> после своей последней дуэли, независимо от соперника. Эта задержка проверяется при отправке вызова <strong>и</strong> при его принятии, для обоих героев: накопление ожидающих вызовов не позволяет проводить несколько дуэлей подряд.</li>
                <li>Захваченный герой не может ни вызывать, ни быть вызванным. Захват и принадлежность к одному альянсу перепроверяются при принятии.</li>
                <li>Герой никогда не в опасности (на арене нет захвата).</li>
            </ul>

            <h2 id="combat">Разрешение боя</h2>
            <p>Когда вызванный принимает вызов, бой разрешается <strong>немедленно</strong>, а результат отображается на экране игрока, принявшего вызов: победа или поражение, оба счёта, награды и выигранная или проигранная ставка. Оба игрока также получают рапорт. Счёт основан на:</p>
            <ul>
                <li><strong>Уровне</strong> героя: основа счёта</li>
                <li><strong>Атаке</strong>: атака героя, +5&nbsp;%, если он военный, и наступательные бонусы его предметов</li>
                <li><strong>Защите</strong>: защита героя и оборонительные бонусы его предметов</li>
                <li><strong>Хитрости</strong> (вес 60&nbsp;%): Интеллект — удвоенный у экономиста, +20&nbsp;% с чертой Магнат — и вспомогательные бонусы предметов</li>
                <li><strong>Порыве</strong> (вес 60&nbsp;%): Скорость — удвоенная у исследователя, +15&nbsp;% с чертой Навигатор — и скорость флота от предметов</li>
                <li><strong>Военных чертах</strong>: Тактик +10&nbsp;%, Военачальник +5&nbsp;%, а Устрашение отнимает 5&nbsp;% у счёта соперника</li>
                <li><strong>Специализации</strong>: преимущество по принципу «камень-ножницы-бумага» (Военный &gt; Исследователь &gt; Экономика &gt; Военный, +10&nbsp;%)</li>
                <li><strong>Случайном факторе</strong> ±15&nbsp;% с каждой стороны</li>
            </ul>
            <p>На практике: счёт = уровень × 10 × (1 + Атака + Защита + 0,6 × Хитрость + 0,6 × Порыв + черты), где каждый бонус учитывается своим значением (10&nbsp;% = 0,10). Затем результат умножается на 1,10 при преимуществе специализации и на 0,95, если у соперника есть Устрашение, после чего применяется случайность. Пример: Военный 10-го уровня с 10&nbsp;% Атаки, 8&nbsp;% Защиты, без предметов, с чертой Тактик получает 10 × 10 × (1 + 0,15 + 0,08 + 0,10) = 133. Таким образом, уровень весит больше всего остального.</p>
            <p>В дуэли учитываются все бонусы предметов, с весом по их типу (специализация их не удваивает):</p>
            <ul>
                <li><strong>Атака</strong>: Сила дуэли (×1,5); Сила Легионеров и Атака флота (×1); Сила Мехов, Точность флота и Урон Ктулху (×0,5).</li>
                <li><strong>Защита</strong>: Защита флота и Щит флота (×1).</li>
                <li><strong>Хитрость</strong>: Производство (×1); Производство рабочих, Производство кораблей, Скорость строительства, Скорость переработки и Дальность радара (×0,5); Получение опыта (×0,25).</li>
                <li><strong>Порыв</strong>: Скорость флота (×1).</li>
            </ul>

            <h2 id="mises">Ставки</h2>
            <p>Бросая вызов, Вы можете добавить необязательную ставку:</p>
            <ul>
                <li><strong>Уран</strong>: каждый игрок ставит одинаковое количество. Победитель забирает обе ставки.</li>
                <li><strong>Предмет</strong>: каждый игрок ставит предмет одной редкости. Победитель забирает оба предмета. Предмет должен быть <strong>снят</strong> (с обеих сторон) и не может участвовать одновременно в двух ожидающих вызовах.</li>
                <li><strong>Дружеский</strong>: без ставки, назначаются только базовые награды.</li>
            </ul>
            <p>Ставка покрыта, если хотя бы на одной из Ваших планет есть нужное количество урана: оно списывается с Вашей самой богатой ураном планеты. Если на момент принятия у игрока не хватает урана ни на одной планете, вызов не удаётся. Если предмет, поставленный вызывающим, больше недоступен, когда вызванный принимает вызов (он ему больше не принадлежит или надет), дуэль отклоняется.</p>

            <h2 id="recompenses">Базовые награды</h2>
            <p>Победитель получает за каждую дуэль:</p>
            <ul>
                <li>Уран: от 5 до 15, умноженные на средний уровень двух героев ÷ 10, с ограничением в <strong>20</strong> за дуэль (от 5 до 15 между двумя героями 10-го уровня). Он зачисляется на Вашу самую маленькую планету, как и уран выигранных ставок.</li>
                <li>Очки войны: 15 × уровень победителя, умноженные на отношение меньшего уровня к большему из двух (но не менее половины). Два героя 15-го уровня: 225 ОВ; герой 15-го уровня, победивший героя 10-го, — 150 ОВ.</li>
                <li>Опыт: от 30 до 90 в зависимости от упорства дуэли (см. статью <em>Ваш герой</em>).</li>
                <li>Шанс на предмет: около 15&nbsp;% в сумме (10&nbsp;% обычный, 4&nbsp;% редкий, 1&nbsp;% эпический)</li>
            </ul>
            <p>Проигравший ничего не теряет (кроме возможной ставки), но не получает ни опыта, ни награды.</p>

            <h2 id="classement">Рейтинг</h2>
            <p>Рейтинг по серверу показывает лучших дуэлянтов:</p>
            <ul>
                <li>Сортировка по проценту побед в дуэлях (бои турниров не учитываются), затем по числу побед</li>
                <li>Минимум <strong>5 боёв</strong>, чтобы попасть в список</li>
                <li><strong>Первые 5</strong> видны прямо на странице; кнопка открывает полный рейтинг с постраничной разбивкой и сортировкой</li>
                <li>Еженедельные награды выплачиваются автоматически каждый <strong>понедельник</strong> за предыдущую неделю (с понедельника, 0 ч, до воскресенья, 24 ч, по времени Парижа), один раз: топ-3 по <strong>числу побед в дуэлях</strong> за неделю, минимум <strong>5 дуэлей</strong> за неделю. Это касается только игроков (ни ИИ-командиров, ни удалённых аккаунтов). 1-е место = 3&nbsp;000 урана + 300 ОВ, 2-е = 2&nbsp;000 + 200 ОВ, 3-е = 1&nbsp;000 + 100 ОВ. Каждый награждённый игрок получает рапорт.</li>
            </ul>

            <h2 id="tournois">Турниры</h2>
            <p>Периодическое событие сервера: один турнир каждые <strong>7 дней</strong> на сервер.</p>
            <ul>
                <li>Регистрация открыта в течение <strong>24 ч</strong> на вкладке Арена страницы Герой. Захваченный герой не может зарегистрироваться и исключается, если его захватят до закрытия регистрации.</li>
                <li>По закрытии регистрации вся сетка разыгрывается за один раз: плей-офф после жеребьёвки (когда число прошедших нечётно, один из них автоматически проходит дальше, в любом туре), затем матч за 3-е место между двумя проигравшими полуфиналистами.</li>
                <li>Нужно как минимум <strong>2 участника</strong>: иначе турнир отменяется (без наград), а зарегистрированных предупреждает рапорт. Если зарегистрирован один игрок, турнир проводится, если ИИ-командир может дополнить сетку.</li>
                <li>Как только зарегистрирован хотя бы один игрок, <strong>ИИ-командиры</strong> сервера (с незахваченным главным героем) дополняют сетку до <strong>8 участников</strong> в сумме. Они регистрируются постепенно в течение 24 часов регистрации, а сетка дополняется при закрытии, если кого-то всё ещё не хватает.</li>
                <li>Если зарегистрировано <strong>8 игроков или больше</strong>, ни один ИИ-командир не участвует. Без зарегистрированных игроков турнир не проводится: ИИ-командиры никогда не играют друг с другом.</li>
                <li>Каждый бой турнира также приносит его победителю обычные награды дуэли.</li>
                <li>ИИ-командиры борются за пьедестал и получают те же награды, что и игроки, кроме шанса получить второстепенного героя.</li>
                <li>Чемпион сохраняет 25&nbsp;% шанс получить второстепенного героя (зарезервировано за игроками).</li>
            </ul>
            <p>Награды:</p>
            <ul>
                <li>1-е место = 5&nbsp;000 урана + 500 ОВ + 1 эпический предмет (20&nbsp;% шанс дополнительно получить легендарный предмет)</li>
                <li>2-е место = 3&nbsp;000 урана + 300 ОВ + 1 редкий предмет (10&nbsp;% шанс дополнительно получить эпический предмет)</li>
                <li>3-е место = 1&nbsp;500 урана + 150 ОВ + 1 редкий предмет</li>
                <li>Остальные участники = 500 урана + 50 ОВ (10&nbsp;% шанс получить обычный предмет)</li>
            </ul>
            <p>Каждый участник получает рапорт со своим местом и наградами. Страница Арена показывает обратный отсчёт до конца регистрации, пьедестал последнего турнира и дату следующего.</p>

    login_bonus:
        title: "Бонус за вход"
        category: "progression"
        order: 9
        tags: "бонус,вход,ежедневный,bitcoin,биткойн,серия,streak"
        summary: "Бесплатные Bitcoin каждый день, умножаемые, если Вы заходите несколько дней подряд."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Каждый <strong>календарный день</strong> (день меняется в полночь по времени Парижа) игра дарит Вам бонус в Bitcoin на каждом сервере, где Вы играете. При заходе в игру открывается окно: нажмите <strong>«Забрать»</strong>, чтобы получить его. Игра также может предупредить Вас уведомлением, когда бонус дня доступен.</p>
            <p>Сумма соответствует <strong>более выгодному</strong> из двух расчётов ниже, а затем умножается на Вашу серию:</p>
            <ul>
                <li><strong>Нижняя граница, привязанная к Вашему уровню</strong>: <strong>уровень × 5&nbsp;000 Bitcoin</strong>, умноженный каждый день на случайный множитель ×1, ×2, ×3, ×4 или ×5. Она гарантирует мотивирующий бонус в начале игры.</li>
                <li><strong>5&nbsp;% от среднего количества Bitcoin на сервере</strong> — так бонус остаётся интересным по мере роста экономики сервера.</li>
                <li>Затем результат умножается на Ваш <strong>множитель серии</strong> (см. ниже).</li>
            </ul>
            <p>В это среднее входят только игроки (ни боты, ни тестовые аккаунты); начиная с 20 игроков из него исключаются 5&nbsp;% самых богатых и 5&nbsp;% самых бедных. Оно пересчитывается раз в день.</p>
            <p>Нижняя граница по уровню (до множителя серии; каждый командир начинает со 2-го уровня):</p>
            <table>
                <tr><th>Уровень</th><th>Возможная нижняя граница</th><th>На 7-й день (×5)</th></tr>
                <tr><td>2</td><td>10&nbsp;000–50&nbsp;000</td><td>50&nbsp;000–250&nbsp;000</td></tr>
                <tr><td>5</td><td>25&nbsp;000–125&nbsp;000</td><td>125&nbsp;000–625&nbsp;000</td></tr>
                <tr><td>10</td><td>50&nbsp;000–250&nbsp;000</td><td>250&nbsp;000–1&nbsp;250&nbsp;000</td></tr>
                <tr><td>15</td><td>75&nbsp;000–375&nbsp;000</td><td>375&nbsp;000–1&nbsp;875&nbsp;000</td></tr>
                <tr><td>20</td><td>100&nbsp;000–500&nbsp;000</td><td>500&nbsp;000–2&nbsp;500&nbsp;000</td></tr>
                <tr><td>30</td><td>150&nbsp;000–750&nbsp;000</td><td>750&nbsp;000–3&nbsp;750&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000–1&nbsp;000&nbsp;000</td><td>1&nbsp;000&nbsp;000–5&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>Для другого уровня умножьте его на 5&nbsp;000 (множитель ×1) и на 25&nbsp;000 (множитель ×5).</p>
            <p>Пример: на 10-м уровне множитель дня равен ×2, то есть нижняя граница — 100&nbsp;000 Bitcoin. Если среднее по серверу составляет 3&nbsp;000&nbsp;000 Bitcoin, 5&nbsp;% — это 150&nbsp;000: берётся именно эта сумма. На 3-й день серии (×1,5) Вы получаете 225&nbsp;000 Bitcoin.</p>

            <h2 id="streak">Серия из 7 дней подряд</h2>
            <p>Если забирать бонус <strong>каждый день</strong>, Ваш множитель растёт:</p>
            <table>
                <tr><th>День подряд</th><th>Множитель</th></tr>
                <tr><td>День 1</td><td>×1,0</td></tr>
                <tr><td>День 2</td><td>×1,2</td></tr>
                <tr><td>День 3</td><td>×1,5</td></tr>
                <tr><td>День 4</td><td>×1,8</td></tr>
                <tr><td>День 5</td><td>×2,0</td></tr>
                <tr><td>День 6</td><td>×2,5</td></tr>
                <tr><td>День 7</td><td>×5,0</td></tr>
            </table>
            <p>На 8-й день цикл начинается заново с дня 1. Бонус нужно забирать <strong>в каждый календарный день</strong> (с полуночи до полуночи по времени Парижа): если день прошёл без получения, серия начинается заново с дня 1. Количество часов между двумя заходами не имеет значения, важен только день. Забрать бонус в понедельник в 0:05, а затем во вторник в 23:55 — серия сохраняется; забрать в понедельник в 23:59, а затем в среду в 0:01 — серия прервана.</p>

            <h2 id="items">Бонусные предметы</h2>
            <p>В некоторые дни серии в придачу даётся случайный <strong>предмет для Вашего героя</strong>:</p>
            <ul>
                <li><strong>День 3</strong>: обычный предмет.</li>
                <li><strong>День 7</strong>: редкий предмет.</li>
            </ul>

            <h2 id="reclamation">Как его забрать</h2>
            <p>Окно «Бонус за вход» открывается автоматически при заходе в игру: один щелчок по <strong>«Забрать»</strong> зачисляет Bitcoin (и предмет 3-го или 7-го дня). Оно также показывает Ваш личный рекорд дней подряд, который не может превышать 7, поскольку после дня 7 серия начинается заново с дня 1.</p>

            <h2 id="conseil">Небольшой совет</h2>
            <p>Достаточно и 30 секунд: откройте игру и нажмите «Забрать». Не пропускайте день 7 — именно тогда это приносит больше всего.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,уничтожение,банкротство,конец"
        summary: "2 способа проиграть партию и что остаётся после этого."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">2 вида Game Over</h2>
            <p>Потерять всё на сервере можно двумя способами: банкротство, при котором у Вас остаются планеты, но не корабли, и потеря всех планет, обнуляющая Вашего командира. Знать их — уже значит защититься от них.</p>

            <h2 id="faillite">1. Экономическое банкротство</h2>
            <p>Если после <strong>ежедневного отчёта в 18:59 (по времени Парижа)</strong> Ваш баланс Bitcoin <strong>отрицателен</strong>: <strong>экономический Game Over</strong>.</p>
            <ul>
                <li>Все Ваши <strong>флоты</strong> удаляются — и в полёте, и на орбите — вместе с грузом и войсками.</li>
                <li>Все <strong>корабли на земле</strong> Ваших планет теряются.</li>
                <li>Ваш баланс <strong>сбрасывается до 125&nbsp;000 Bitcoin</strong>.</li>
            </ul>
            <p>Вы сохраняете планеты, здания, оборону, исследования, наземные войска и свой рейтинг: Вы продолжаете играть, но совсем без кораблей.</p>
            <p><strong>Вас предупреждают заранее:</strong> как только Ваш баланс опускается ниже прогнозируемого суточного дефицита (расходы на содержание минус доходы по последнему отчёту), рапорт-предупреждение «Надвигающееся банкротство!» предупреждает Вас — не более одного в день. Если Вы его получили, действуйте до следующего ежедневного отчёта.</p>

            <h2 id="planetes">2. Потеря всех Ваших планет</h2>
            <p>Если Вы теряете свою <strong>последнюю планету</strong> — захваченную игроком или Ктулху, а в Battle Royale — когда исчезает Ваш сектор, — Ваш командир уничтожен. Добровольно покинуть последнюю планету нельзя.</p>
            <ul>
                <li>Если Вашу последнюю планету захватывает игрок, он <strong>забирает все Ваши Bitcoin и все Ваши Очки Войны</strong>.</li>
                <li>Ваши <strong>флоты</strong> удаляются (если Вашу последнюю планету берут Ктулху, они переходят под их контроль).</li>
                <li>Ваш командир <strong>обнуляется</strong>: 125&nbsp;000 Bitcoin, исследования и политические исследования обнуляются, терраформирование делится на 2, рейтинг сбрасывается, герои и рапорты удаляются.</li>
                <li>Вы покидаете свой альянс (он распускается, если Вы были его единственным участником или Лидером альянса Молота Звёзд).</li>
                <li>Ваша карьера на этом сервере <strong>записывается</strong> в профиль Вашего аккаунта.</li>
            </ul>

            <h2 id="eviter">Как избежать Game Over</h2>
            <ul>
                <li>Ежедневно следите за своим <strong>балансом</strong> (доходы − расходы). Если всё уходит в красное, реагируйте.</li>
                <li>Ставьте на землю флоты, которые не нужны: их содержание делится на 6.</li>
                <li>Не набирайте слишком много: армия на постоянном содержании может разорить неосмотрительного экономиста.</li>
                <li>Всегда держите <strong>как минимум 2 планеты</strong> в состоянии обороны.</li>
                <li>Следите за <strong>приближающимися вражескими флотами</strong> (уведомления, радар).</li>
                <li>При серьёзной опасности <strong>эвакуируйте</strong> войска и ресурсы на безопасную планету.</li>
            </ul>

            <h2 id="apres">Что остаётся после?</h2>
            <p>Даже будучи уничтоженным, Вы сохраняете свой <strong>игровой аккаунт</strong> и <strong>статистику</strong> предыдущих партий. Вы можете присоединиться к другому серверу или снова зарегистрироваться на том же на странице выбора серверов (меню «Сервер»), пока его регистрация открыта: тогда Вы начнёте с новой стартовой планеты.</p>

    game_modes:
        title: "Режимы сервера"
        category: "events"
        order: 1
        tags: "режим,battle royale,доминирование,long run,short run,cthulhu,ктулху,search and destroy,paid"
        summary: "Area Universe предлагает 7 различных режимов сервера со своими правилами и целями."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Общий обзор</h2>
            <p>У каждого сервера Area Universe есть <strong>режим</strong>, выбираемый админом при создании. Режим определяет длительность, условие победы и наличие Ктулху.</p>
            <table>
                <thead>
                    <tr><th>Режим</th><th>Длительность</th><th>Условие победы</th><th>Ктулху?</th><th>Альянсы?</th><th>Исследования</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ктулху</td><td>300 дней</td><td>Нет</td><td>Да</td><td>Да</td><td>Обычные</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>Не более 30 дней</td><td>VIP, переживший 72&nbsp;ч</td><td>Нет</td><td>Да (кроме VIP)</td><td>Максимальные с самого начала</td></tr>
                    <tr><td>Доминирование</td><td>60 дней</td><td>Лучший личный счёт в конце</td><td>Нет</td><td>Да</td><td>Максимальные с самого начала</td></tr>
                    <tr><td>Battle Royale</td><td>Не более 40 дней</td><td>Последний выживший</td><td>Нет</td><td>Нет</td><td>Максимальные с самого начала</td></tr>
                    <tr><td>Paid Server</td><td>60 дней</td><td>Лучший взвешенный счёт (очки + 2 × ОВ)</td><td>Нет</td><td>Да</td><td>Обычные</td></tr>
                    <tr><td>Long Run</td><td>900 дней</td><td>Нет (марафон)</td><td>Во время событий «Атака Ктулху»</td><td>Да</td><td>Обычные</td></tr>
                    <tr><td>Short Run</td><td>150 дней</td><td>Нет (спринт)</td><td>Во время событий «Атака Ктулху»</td><td>Да</td><td>Обычные</td></tr>
                </tbody>
            </table>
            <p>Партия, определяющая победителя (Search &amp; Destroy, Battle Royale), прекращается, как только победитель известен, и сервер закрывается: указанная длительность тогда является максимумом.</p>
            <p>В списке серверов некоторые режимы называются иначе: <strong>Search &amp; Destroy</strong> отображается как «Поиск и Уничтожение» (и «Найти и уничтожить» в меню игры), <strong>Long Run</strong> — «Долгосрочный», <strong>Short Run</strong> — «Краткосрочный», а <strong>Paid Server</strong> — «Платный сервер».</p>

            <h2 id="cthulhu">Режим Ктулху (классический PvE)</h2>
            <p>Базовый режим, идеальный для знакомства с игрой. В течение <strong>первых 72 часов</strong> сервера атак Ктулху нет: это <strong>фаза подготовки</strong>. В течение этой фазы сервер имеет значок «Заблокирован» в списке серверов и не принимает новых командиров (сообщение «Этот сервер заблокирован (подготовка или регистрация закрыта).»).</p>
            <p>Затем орды Ктулху регулярно атакуют Вас. Первая запускается <strong>через 5 дней после Вашей регистрации</strong>, а затем новая орда отправляется каждые <strong>18–30 часов</strong> на Легко, <strong>12–24 часа</strong> на Нормально и <strong>8–16 часов</strong> на Сложно. Вы также можете полностью отключить PvE в своих <strong>Предпочтениях</strong> (см. статью <em>Угроза Ктулху</em>).</p>
            <p>Ни условия победы, ни победителя нет: по истечении 300 дней сервер закрывается, а Ваш результат (рейтинг, очки…) остаётся в Вашем карьерном профиле. Достижение <strong>Элита</strong> награждает место в топ-10 сервера.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (охота на VIP)</h2>
            <p><strong>Первые 48 часов</strong> сервера отводятся на подготовку: VIP ещё не назначен. Как и в режиме Ктулху, сервер в это время имеет значок «Заблокирован» и не принимает новых командиров.</p>
            <p>Затем <strong>VIP</strong> выбирается жребием среди игроков, всё ещё находящихся в игре, а публичный салон объявляет «Новый VIP: …». Его цель: <strong>продержаться 72 часа</strong>. Если ему это удаётся, он побеждает, и партия тут же прекращается.</p>
            <ul>
                <li>Если его устраняет (game over) игрок, <strong>убийца становится новым VIP</strong> («VIP был устранён игроком …»), а обратный отсчёт в 72 часа начинается с нуля.</li>
                <li>Если его устраняют иначе (например, ИИ-командир), новый VIP выбирается жребием.</li>
            </ul>
            <p>VIP <strong>один против всех</strong>: в момент назначения он автоматически выводится из своего альянса. Если он был его главой, его место занимает участник с самым высоким званием; если он был единственным участником, альянс распускается. Пока у него этот статус, он не может ни создавать альянс, ни вступать в него, и это запрещено ему ещё <strong>3 дня</strong> после того, как он его потерял.</p>
            <p><strong>Защита новичков</strong> действует и для VIP: пока она длится (менее 7 дней с его регистрации, менее 4 планет, ни одной запущенной наступательной миссии), ни один игрок не может отправить флот на его планеты.</p>

            <h2 id="domination">Доминирование (стратегические планеты)</h2>
            <p>На старте <strong>5 стратегических планет</strong> выбираются жребием среди всех планет сервера — как игровых, так и необитаемых.</p>
            <ul>
                <li>Раз в день, при смене даты (полночь по времени Парижа), каждая стратегическая планета приносит <strong>+5 очков</strong> игроку, которому она принадлежит в этот момент. Удержание двух приносит +10 в день.</li>
                <li>ИИ-командиры очков не набирают.</li>
                <li>Каждые <strong>5 дней</strong> новый розыгрыш заменяет стратегические планеты. Публичный салон объявляет «Стратегические планеты только что изменились.» в момент, когда это происходит, без предупреждения.</li>
            </ul>
            <p>В конце сервера (60 дней) побеждает игрок с наибольшим числом очков. Рейтинг <strong>личный</strong>: в Доминировании нет ни счёта, ни победы альянса.</p>

            <h2 id="battle-royale">Battle Royale (последний выживший)</h2>
            <p>Одиночный режим: <strong>альянсы не разрешены</strong>. Одна галактика. Регистрация закрывается <strong>через 7 дней</strong> после открытия: тогда сервер получает значок «Заблокирован», и вернуться на него могут только уже зарегистрированные игроки.</p>
            <p>Карта — космическая сетка 10 × 10, то есть 100 систем, которая <strong>сжимается концентрическими кольцами</strong>: с каждым ходом <strong>всё внешнее кольцо исчезает разом</strong> (а не система за системой). Уничтоженные системы остаются на экране в виде <strong>дыр</strong>: карта не перестраивается, поэтому безопасная зона читается с первого взгляда.</p>
            <p><strong>5 ходов, по одному в неделю:</strong></p>
            <table>
                <thead>
                    <tr><th>День</th><th>Уничтожено систем</th><th>Осталось систем</th></tr>
                </thead>
                <tbody>
                    <tr><td>Д+7</td><td>36 (край сетки)</td><td>64</td></tr>
                    <tr><td>Д+14</td><td>28</td><td>36</td></tr>
                    <tr><td>Д+21</td><td>20</td><td>16</td></tr>
                    <tr><td>Д+28</td><td>12</td><td>4</td></tr>
                    <tr><td>Д+35</td><td>3 из последних 4</td><td><strong>Только 1</strong>, выбранная жребием</td></tr>
                </tbody>
            </table>
            <p>Последние 5 дней проходят в этой последней системе.</p>
            <ul>
                <li>За <strong>12&nbsp;ч до</strong> уничтожения кольцо становится <strong>оранжевым</strong> (предупреждение).</li>
                <li>За <strong>1&nbsp;ч до</strong> уничтожения оно становится <strong>мигающим красным</strong>: ни один флот больше не может ни вылететь в его системы, ни покинуть их.</li>
                <li>Уничтоженная система навсегда удаляет свои планеты и флоты. Если Ваш <strong>главный герой</strong> находился там (на планете или во флоте), Вы уничтожены; второстепенный герой просто возвращается в резерв. Вы также уничтожены, если у Вас не осталось ни одной планеты.</li>
                <li>Флот, летящий в исчезнувшую систему (или вылетевший из исчезнувшей системы), уничтожается по прибытии; если на борту Ваш главный герой, Вы уничтожены.</li>
            </ul>
            <p><strong>Победа</strong>: быть последним игроком, всё ещё находящимся в игре. Партия прекращается, как только остаётся один выживший. Если на 40-й день в игре остаётся несколько игроков, сервер завершается без победителя.</p>

            <h2 id="paid-server">Paid Server (платный соревновательный)</h2>
            <p>Платный сервер: регистрация стоит <strong>5&nbsp;€</strong>, оплачиваемых один раз через Stripe именно за этот сервер (другой платный сервер оплачивается отдельно). Нужен полноценный аккаунт, а не гостевой. В списке серверов он имеет значок «💳 Платно 5 €». 100&nbsp;% PvP, никаких Ктулху. Длительность 60 дней.</p>
            <p><strong>Победа</strong>: в конце побеждает игрок, всё ещё находящийся в игре, с лучшим <strong>взвешенным счётом</strong>.</p>
            <ul>
                <li>Взвешенный счёт = очки рейтинга + 2 × очки войны (ОВ).</li>
                <li>Пример: 300&nbsp;000 очков и 50&nbsp;000 ОВ дают счёт 400&nbsp;000.</li>
            </ul>
            <p>Таким образом, бой считается вдвое: это режим для соревновательных игроков.</p>
            <p>Как и во всех режимах, определяющих победителя, победитель получает значок <strong>Победитель</strong> в своём карьерном профиле, сохраняемый от сервера к серверу, и достижение <strong>Император</strong>.</p>

            <h2 id="long-short-run">Long Run / Short Run (с событиями)</h2>
            <p>Два режима PvE с одинаковыми правилами: меняется только длительность. <strong>Long Run</strong> длится 900 дней, <strong>Short Run</strong> — 150 дней.</p>
            <p>Ктулху не атакуют там постоянно: их орды отправляются только во время событий <strong>Атака Ктулху</strong>. Эти события длятся 72 часа: первое начинается через 7 дней после открытия сервера, затем они повторяются каждые 21 день.</p>
            <p><strong>Арена альянса</strong> возвращается там каждые 3 дня, и пророчества Ктулху там тоже запускаются. Расписание фиксировано, рассчитывается от открытия сервера: см. статью <em>Специальные события</em>.</p>

            <h2 id="recherches-max">Режимы с максимальными исследованиями с самого начала</h2>
            <p>В <strong>Search &amp; Destroy, Доминировании и Battle Royale</strong> все Ваши исследования стартуют с максимального уровня: меню Исследование скрыто, чтобы играть сразу в военную часть.</p>
            <p>Ваша стартовая планета тогда получает <strong>стартовый набор</strong>:</p>
            <ul>
                <li><strong>500 урана</strong> для быстрой настройки.</li>
                <li><strong>Весь Ваш запас очков улучшения кораблей</strong> с дня 1 вместо обычного предела в 40 очков в день.</li>
            </ul>
            <p>В <strong>Search &amp; Destroy</strong> каждый игрок дополнительно получает при регистрации военный набор на своей стартовой планете (каждый может стать VIP): 2&nbsp;000 Легионеров, 25 барж, 500 эсминцев и 250 тяжёлых лазерных турелей.</p>

            <h2 id="fin-de-serveur">Конец сервера и архивирование</h2>
            <p>Когда сервер закрывается, Ваша <strong>итоговая статистика</strong> (очки, герои, достижения VIP, победы и т.&nbsp;д.) архивируется в Вашем <strong>игровом аккаунте</strong>. Ваш командир (персонаж этой партии) удаляется, но Ваша история остаётся.</p>

    cthulhus:
        title: "Угроза Ктулху"
        category: "events"
        order: 2
        tags: "cthulhu,ктулху,улей,орда,гарнизон,осада,угроза,pve,уран,tower defense,td"
        summary: "Ктулху собирают настоящие орды, которые открыто летят к цели, прежде чем атаковать Ваши планеты. Как от них защищаться, как обороняются их базы и Tower Defense для отражения натиска."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">Что такое Ктулху?</h2>
            <p><strong>Ктулху</strong> (Одержимые) — это враждебные существа, управляемые игрой (PvE). Они удерживают <strong>базы улья</strong>, разбросанные по галактике, откуда отправляются <strong>орды</strong>: настоящие флоты с видимым составом, мощью и маршрутом, а не простой обратный отсчёт.</p>
            <p>Ктулху существуют только на серверах <strong>Ктулху</strong>, <strong>Long Run</strong> и <strong>Short Run</strong>. В Long Run и Short Run их орды отправляются только во время событий <strong>Атака Ктулху</strong> (см. <em>Специальные события</em>).</p>
            <p>Две шкалы, которые не следует путать:</p>
            <ul>
                <li>Ваша <strong>личная угроза</strong>, определяющая силу орд, запускаемых против Вас (эта статья);</li>
                <li><strong>Угроза вселенной</strong>, общая для сервера, которая запускает пророчества (см. <em>Пророчества Ктулху</em>).</li>
            </ul>

            <h2 id="menace">Уровень угрозы</h2>
            <p>Ваша личная угроза отображается на странице <strong>Ктулху</strong>, в блоке «Угроза Ктулху» (Угрожаемая планета, Уровень угрозы, Оставшееся время). Чем она выше, тем сильнее следующие атаки.</p>
            <p>Каждый раз, когда Ваша оборона отражает наземную <strong>высадку</strong> Ктулху, Ваша угроза растёт. Уничтожение орды до высадки (над её базой, в полёте или на орбите Вашей планеты) её не повышает. Прирост зависит от сложности и режима Вашего альянса:</p>
            <table>
                <thead>
                    <tr><th>Сложность</th><th>Без альянса</th><th>Альянс Молот Звёзд</th><th>Другой альянс</th></tr>
                </thead>
                <tbody>
                    <tr><td>Легко</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Нормально</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Сложно</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>Режим <strong>Молот Звёзд</strong>, таким образом, замедляет рост угрозы.</p>
            <p>Угроза также <strong>растёт сама по себе</strong>, пока Ваш PvE активен:</p>
            <ul>
                <li>+5 при каждом ежедневном отчёте (18:59, по времени Парижа);</li>
                <li>+1 в час, пока орда остаётся на орбите одной из Ваших планет до высадки.</li>
            </ul>
            <p>Этот автоматический рост останавливается на 300. Чтобы снизить угрозу:</p>
            <ul>
                <li>победа в <strong>Tower Defense</strong> делит её на 2;</li>
                <li><strong>освобождение базы</strong> улья делит её на 10 (см. ниже);</li>
                <li>поражение на земле тоже делит её (см. таблицу «Если орда побеждает на земле»).</li>
            </ul>
            <p>Усердный игрок поэтому держит её на низком уровне; игрок, который позволяет ей расти, подвергается всё более крупным ордам.</p>

            <h2 id="puissance">Сила вторжений</h2>
            <p>Атака разыгрывается в два этапа, и сложность влияет на оба:</p>
            <ul>
                <li><strong>Орда (орбитальный бой)</strong>: её флот рассчитывается исходя из <strong>мощи Вашего собственного флота</strong>. Чем сильнее Ваш флот относительно Вашего уровня угрозы, тем сильнее и орда (от 0,7 до 1,5 Вашей мощи). Затем применяется сложность: ×0,5 на Легко, ×1 на Нормально, ×1,5 на Сложно. Каждая пятая орда усилена (+25&nbsp;%). Орда, следующая за превышением Вашей угрозой 100, 250, а затем 500, — это <strong>орда Босса</strong>, вдвое крупнее.</li>
                <li><strong>Высадка (наземный бой)</strong>: её сила зависит от Вашего <strong>уровня угрозы</strong> и Вашего уровня исследования <strong>Терраформирование</strong>, а затем от доли орды, пережившей орбитальный бой. На Легко она делится на 2.</li>
            </ul>

            <h2 id="horde">Атака: вполне реальная орда</h2>
            <p>Первая орда запускается <strong>через 5 дней после Вашей регистрации</strong>. Затем новая орда отправляется каждые <strong>18–30 часов</strong> на Легко, <strong>12–24 часа</strong> на Нормально и <strong>8–16 часов</strong> на Сложно. Таймер пункта «Ктулху» в меню показывает следующий запуск.</p>
            <p>Атака всегда начинается со <strong>сбора</strong>: орда собирается на орбите базы улья в течение <strong>6 часов</strong> (12 часов для орды Босса), прежде чем рвануться вперёд.</p>
            <p>Отправившись в путь, она летит со <strong>скоростью орды</strong> (медленной, хорошо заметной на <strong>радаре</strong>), и <strong>оповещение гарантировано за 1 час до её прибытия</strong>, независимо от Вашего радарного покрытия.</p>
            <p>Это <strong>настоящий флот</strong>: Вы можете уничтожить его в любой момент — в строю над его базой, в полёте, по прибытии на орбиту Вашей планеты или выиграв <strong>Tower Defense</strong>. Его уничтожение отменяет атаку независимо от момента.</p>
            <p>По прибытии разыгрывается <strong>орбитальный бой</strong> (Ваши флоты и турели против орды). Выжившие высаживаются <strong>через 2 часа</strong> для наземного штурма. Несколько орд могут одновременно формироваться или находиться в полёте.</p>
            <p>Единственное исключение — <strong>проникновение</strong>. Начиная с <strong>угрозы 200</strong>, у каждой атаки 15&nbsp;% шанс оказаться таковой: она <strong>мгновенна и невидима</strong> (ни сбора, ни предупреждения), а её высадка на 30&nbsp;% мощнее.</p>

            <h3>Если Ваша оборона побеждает</h3>
            <table>
                <thead>
                    <tr><th></th><th>Легко</th><th>Нормально</th><th>Сложно</th></tr>
                </thead>
                <tbody>
                    <tr><td>Потери Легионеров</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Потери Мехов</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Потери рабочих</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Вы получаете <strong>ОВ</strong>, шанс <strong>выпадения предмета</strong> и 1&nbsp;% шанс завербовать <strong>второстепенного героя</strong>. Полное уничтожение орды до её высадки даёт тот же шанс на предмет и героя.</p>

            <h3>Если орда побеждает на земле</h3>
            <p>Грабёж и захват <strong>пропорциональны тому, что осталось от орды</strong> после орбитального боя: наполовину уничтоженная орда грабит вдвое меньше. При <strong>выживаемости ниже 90&nbsp;%</strong> у неё уже недостаточно войск, чтобы захватить планету, даже на сложности Сложно.</p>
            <table>
                <thead>
                    <tr><th></th><th>Легко</th><th>Нормально</th><th>Сложно</th></tr>
                </thead>
                <tbody>
                    <tr><td>Грабёж ресурсов (орда цела)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Планета захвачена (если выживаемость ≥ 90&nbsp;%)</td></tr>
                    <tr><td>Снижение угрозы после поражения</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>На <strong>Сложно</strong>, если выживших недостаточно для захвата, грабёж опускается до ставки <strong>Нормально</strong> (70&nbsp;%), умноженной на коэффициент выживаемости орды. Если планета захвачена и она была Вашей последней, наступает Game Over.</p>

            <h2 id="bases">Базы улья</h2>
            <p>Улей удерживает <strong>базы</strong>, разбросанные по галактике: исходные базы улья (до 36 на галактику, возрастающей мощи; их названия — от «Cthulhu I» для аванпостов до грозных «Cthulhu V») и бывшие планеты, преобразованные расширением или извержением.</p>
            <p>Каждая защищена <strong>постоянным гарнизоном</strong> примерно в 0,8 от крупнейшего флота сервера. Повреждённый гарнизон не восстанавливается; уничтоженный гарнизон заменяется новым <strong>через 24 часа</strong>.</p>
            <p>Если на орбите базы стоят один или несколько флотов <strong>в режиме атаки</strong> (Ваши и других игроков), совокупная сигнатура которых составляет не менее <strong>10&nbsp;000</strong>, начинается <strong>осада</strong>:</p>
            <ul>
                <li>осаждённая база больше не отправляет орды: они вылетают с более дальней базы;</li>
                <li><strong>волны обороны</strong> набирают силу (+25&nbsp;% каждые 2 часа);</li>
                <li>через <strong>6 часов</strong> остальные базы отправляют на подмогу <strong>спасательные флоты</strong>;</li>
                <li>база получает значок <strong>«Осаждённая база»</strong> на галактической карте.</li>
            </ul>
            <p>Когда осада снята, подкрепления возвращаются домой, а база вновь получает обычный гарнизон. Каждому участнику затем выплачивается <strong>пропорционально уничтоженной сигнатуре</strong>: 0,02 Bitcoin за очко плюс 1 очко войны за каждые 5&nbsp;000 заработанных Bitcoin.</p>

            <h2 id="liberation">Освобождение базы</h2>
            <p>Успешное вторжение на базу улья, включая базы пришельцев «Cthulhu I»–«V», приносит ОВ и <strong>уран</strong>, загружаемый во флот-победитель (предусмотрите место в трюме). У победы есть также два эффекта:</p>
            <ul>
                <li>Ваша <strong>личная угроза делится на 10</strong>: это самый радикальный способ её снизить;</li>
                <li><strong>Угроза вселенной</strong> снижается на <strong>50 очков</strong>, что откладывает следующее пророчество Ктулху (см. статью <em>Пророчества Ктулху</em>).</li>
            </ul>
            <p>Освобождённая таким образом планета <strong>защищена 72 часа</strong>: улей не может ни заново колонизировать её, ни вызвать на ней извержение в течение этого срока.</p>
            <ul>
                <li>Если освобождённая планета изначально была планетой игрока (захваченной ульем, преобразованной после проигранного вторжения, покинутой или возникшей из расширения или извержения), она остаётся колонизируемой, а Ваш рапорт об освобождении сообщает крайний срок отправки туда колонизатора.</li>
                <li>Исходные аванпосты улья («Cthulhu I»–«V») после освобождения остаются непригодными для освоения: планета остаётся свободной, но отправить туда колонизатор нельзя, и никакой крайний срок не объявляется.</li>
            </ul>
            <p>И наоборот, проигрыш вторжения на базу улья повышает Вашу <strong>личную угрозу на 10 очков</strong>.</p>

            <h2 id="expansion">Расширение и извержение</h2>
            <p>Улей расширяется сам: когда <strong>Угроза вселенной</strong> достигает <strong>300 очков</strong>, <strong>рой спор</strong> отправляется с существующей базы каждые <strong>3 дня</strong> (каждый день начиная с <strong>500</strong>) к необитаемой планете рядом с игроками, вплоть до <strong>36 баз на галактику</strong>. Это такой же флот, как и любой другой: его можно <strong>перехватить в полёте</strong>. Если он прибывает, он основывает новую базу с гарнизоном, а игроки на расстоянии <strong>5 секторов или менее</strong> получают рапорт.</p>
            <p>Уничтожение <strong>всех</strong> баз не устраняет его навсегда: после <strong>48 часов тишины</strong> <strong>извержение</strong> заставляет базу возникнуть в другом месте, а ближайшие игроки получают рапорт. Это извержение никогда не может произойти <strong>ближе 8 секторов</strong> от планеты игрока или на планете, всё ещё находящейся под отсрочкой освобождения: улей возрождается в пустоте, а не на Ваших землях. Если достаточно удалённого сектора нет, извержение просто откладывается до следующего окна.</p>

            <h2 id="changement-difficulte">Смена сложности</h2>
            <p>Вы настраиваете сложность PvE в своих <strong>Предпочтениях</strong> (поле «Сложность PvE»): <strong>Отключено</strong>, Легко, Нормально или Сложно.</p>
            <ul>
                <li>В режиме <strong>Отключено</strong> Ктулху больше не атакуют Вас, а Tower Defense недоступен.</li>
                <li>Если Вы снова включите PvE, первая атака придёт через 4 дня.</li>
                <li>Между двумя изменениями действует <strong>задержка в 72&nbsp;ч</strong>: никаких метаний туда-сюда, чтобы уклониться от крупных атак.</li>
            </ul>

            <h2 id="tower-defense">Tower Defense (TD)</h2>
            <p><strong>Tower Defense</strong> — это мини-игра активной обороны на странице <strong>Ктулху</strong>. В неё можно играть, как только против Вас запланирована атака или орда уже в пути: Вы можете запустить её, чтобы уничтожить орду до того, как она нанесёт урон. Она интерактивна: Вы размещаете свою оборону на сетке и в реальном времени сражаетесь с волнами монстров Ктулху.</p>
            <p>Совет: чтобы поставить несколько элементов обороны подряд (юниты, стены, колючую проволоку), <strong>зажмите и проведите</strong>. Линия автоматически фиксируется <strong>по прямой</strong> (горизонтальной или вертикальной), и все пройденные клетки заполняются, без пропусков, даже при быстром движении.</p>
            <p>Партия играется на Вашей сложности <strong>PvE</strong> (настраивается в Ваших Предпочтениях). <strong>Обучение</strong> — это тренировка: оно ничего не приносит и ничего не стоит. После запуска первой волны выход из партии считается <strong>сдачей</strong> (поражением).</p>
            <p>Над ареной дрейфует <strong>туман</strong>, более плотный вокруг разломов и при приближении босса. Он проходит под Вашей обороной и монстрами: он ничего не скрывает. Кнопка <strong>Туман</strong> на панели отключает его, если Ваше устройство не справляется.</p>

            <h3>Возможный результат</h3>
            <ul>
                <li><strong>Победа</strong>: активная орда уничтожена, а атака отменена (если ни одна орда ещё не вылетела, следующая откладывается на 8 часов). Ваша угроза делится на 2. Вы получаете уран, розыгрыш предмета (два на Сложно) и 2&nbsp;% шанс завербовать второстепенного героя. Задержка в 6 часов перед новым TD.</li>
                <li><strong>Поражение</strong>: Ваша угроза снижается пропорционально отражённым волнам (половина волн = угроза, поделённая на 2), и Вы получаете немного урана. Если орда уже на орбите Вашей планеты, она сразу высаживается; иначе улей немедленно запускает следующую атаку. Ожидания перед повторной игрой нет.</li>
                <li><strong>TD не сыгран</strong>: орда идёт своим чередом (сбор, полёт, прибытие, высадка).</li>
            </ul>
            <p>Уран, получаемый за победу: число волн × (50 + угроза ÷ 2), умноженное на 0,4 на Легко и на 3 на Сложно. За поражение: отражённые волны × (20 + угроза ÷ 5) с теми же множителями. Пример при угрозе 100: победа на Нормально (13 волн) = 1&nbsp;300 урана; на Легко (11 волн) = 440; на Сложно (15 волн) = 4&nbsp;500.</p>

            <h3>Рапорт об окончании партии</h3>
            <p>По окончании каждого Tower Defense (победа или поражение) в архив вкладки <strong>Ктулху</strong> Ваших рапортов добавляется <strong>рапорт</strong>: пережитые волны, счёт, собранный уран, снижение угрозы, потери по типам юнитов и убитые враги по типам. Удобно для сравнения Ваших партий.</p>

            <h3>Как в это играть</h3>
            <ul>
                <li>Партия играется на Вашей сложности PvE (Легко, Нормально или Сложно): кнопка «Играть на …» напоминает её. Только обучение позволяет попробовать другую сложность.</li>
                <li>Размещайте свои юниты на сетке. <strong>Штаб в центре</strong>; монстры появляются из <strong>1–4 разломов Ктулху</strong>, открытых по краю платформы.</li>
                <li>Монстры пересекают сетку, чтобы добраться до Вашего штаба: атакуйте их по пути.</li>
                <li><strong>Стены</strong> (150 на Легко, 125 на Нормально, 75 на Сложно): монстры их обходят. У каждого разлома всегда остаётся путь к штабу (стена, запечатывающая его, отклоняется). Башни же путь не блокируют: монстр, упёршийся в них, останавливается и разрушает их.</li>
                <li><strong>Колючая проволока</strong> (30 / 20 / 10 в зависимости от сложности, требуется исследование «Колючая проволока»): не блокирует, но ранит и замедляет проходящих через неё монстров.</li>
                <li><strong>Запоминание расстановки</strong>: Ваша расстановка (башни, стены, колючая проволока) сохраняется для каждого сервера и предлагается заново в начале каждой партии.</li>
                <li>Крупные волны приходят <strong>группами</strong> (до 20 монстров одновременно): волна заканчивает появляться примерно за 2 минуты.</li>
                <li><strong>Немедленное поражение</strong>: если все враги волны преодолевают Вашу оборону и достигают штаба, партия проиграна на месте. Выиграть без эффективной обороны невозможно.</li>
                <li>Между волнами рабочие автоматически ремонтируют повреждённые турели.</li>
                <li>Скорость регулируется от ×1 до ×10, возможна пауза.</li>
                <li><strong>Волны без пауз</strong>: опция верхней панели автоматически запускает следующую волну по окончании каждой, не возвращаясь к подготовке и сохраняя Вашу скорость, вплоть до победы или поражения. Отключите её посреди волны, чтобы по окончании этой волны вернуть паузу на подготовку. Недоступно в обучении.</li>
                <li>Число волн зависит от Вашей угрозы: угроза ÷ 10 (с округлением вниз) + 3, на 2 волны меньше на Легко (минимум 2) и на 2 больше на Сложно, <strong>максимум 20</strong>. Пример: при угрозе 100 — 13 волн на Нормально. Волны становятся всё интенсивнее.</li>
                <li><strong>Интерфейс</strong>: панель сверху на всю ширину (очки здоровья штаба, счётчик волн, счёт, кнопка «Старт», а справа значки звука, музыки, информации о юнитах, сетки и волн без пауз) и панель «Юниты» справа, представляющая каждый юнит (значок, название, запас, характеристики). Во время партии нет ни бокового меню, ни нижней части страницы: вся ширина экрана отдана карте.</li>
            </ul>

            <h3>Ваши юниты для TD</h3>
            <p>Ваша оборона планеты преобразуется в юниты TD: каждый юнит TD представляет пачку реальных единиц, а у каждого типа есть максимум, который можно разместить, чтобы вынудить к тактическому разнообразию.</p>
            <table>
                <thead>
                    <tr><th>Юнит планеты</th><th>Реальных единиц на 1 юнит TD</th><th>Максимум на сетке</th></tr>
                </thead>
                <tbody>
                    <tr><td>Легионер</td><td>20</td><td>200</td></tr>
                    <tr><td>Мех</td><td>10</td><td>20</td></tr>
                    <tr><td>Ракетная установка</td><td>1&nbsp;750</td><td>150</td></tr>
                    <tr><td>Лазерная турель</td><td>1&nbsp;500</td><td>100</td></tr>
                    <tr><td>Тяжёлый лазер</td><td>1&nbsp;250</td><td>75</td></tr>
                    <tr><td>Пушка Гаусса</td><td>1&nbsp;000</td><td>60</td></tr>
                    <tr><td>Ионный лазер</td><td>750</td><td>50</td></tr>
                    <tr><td>Плазменная артиллерия</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Пример: 2&nbsp;000 Легионеров дают 100 Легионеров TD. Кроме того, TD одалживает Вам <strong>бесплатную оборону</strong>: по 8 каждого типа на Легко, по 5 на Нормально, ничего на Сложно.</p>

            <h3>Монстры, с которыми Вы сражаетесь</h3>
            <ul>
                <li><strong>Глубоководный</strong>: базовый монстр. Ничего особенного, но они приходят в большом числе.</li>
                <li><strong>Наблюдатель</strong>: очень быстрый, но хрупкий. Его нужно быстро перехватывать.</li>
                <li><strong>Шоггот</strong>: медленный, массивный, тяжело бронированный. Трудно убить.</li>
                <li><strong>Звезда-вампир</strong>: стреляет снарядами издалека по Вашей обороне.</li>
                <li><strong>Ментальный бичеватель</strong>: может <strong>превращать Ваших Легионеров в монстров</strong> (визуальный эффект превращения) — не более одного в секунду, и ни одного после смертельного ранения.</li>
                <li><strong>Босс Ктулху</strong>: огромный, он появляется только в последней волне — на Нормально, если Ваша угроза достигла 40, на Сложно — начиная с 20, на Легко — никогда. Он призывает вокруг себя Глубоководных.</li>
            </ul>

            <h3>Полезные механики</h3>
            <ul>
                <li>У юнитов и монстров <strong>разные размеры</strong> на сетке (Легионер 1×1, Мех 2×1, турель 2×2, Босс 2×2).</li>
                <li><strong>Полоса волны</strong> показывает число оставшихся врагов.</li>
                <li>Если Вы обновите страницу, партия <strong>продолжится ровно с того места, где Вы её оставили</strong>.</li>
                <li>Сохранённую партию нужно <strong>продолжить</strong>, прежде чем начинать новую.</li>
            </ul>

            <h3>Награды и потери</h3>
            <ul>
                <li><strong>Победа</strong>: угроза делится на 2, уран, предметы и уничтоженная орда.</li>
                <li><strong>Поражение</strong>: угроза снижается в зависимости от отражённых волн и немного урана; если орда уже на орбите, она сразу высаживается.</li>
                <li><strong>Потери юнитов реальны</strong> сверх бесплатной обороны: уничтоженный юнит TD убирает с Вашей планеты все единицы, которые он представляет (1 потерянный Легионер TD = 20 реально погибших Легионеров).</li>
            </ul>

            <h3>Рейтинг TD</h3>
            <p>Рейтинг по серверу хранит <strong>лучшие результаты</strong> в Tower Defense. Ещё одна таблица охотничьих трофеев, которую нужно покорить.</p>

    events:
        title: "Специальные события"
        category: "events"
        order: 3
        tags: "событие,календарь,атака ктулху,арена,арена альянса,long run,short run"
        summary: "На серверах Long Run и Short Run Атака Ктулху и Арена альянса повторяются в фиксированные даты: когда они наступают, что меняют и как к ним подготовиться."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>На серверах <strong>Long Run</strong> и <strong>Short Run</strong> два события повторяются в фиксированные даты: <strong>Атака Ктулху</strong> и <strong>Арена альянса</strong>. Их расписание рассчитывается раз и навсегда при открытии сервера, без случайности: зная дату открытия Вашего сервера, Вы можете предвидеть каждое из них.</p>
            <p>Сезонных событий (праздники, времена года) нет.</p>
            <p>На серверах <strong>Ктулху</strong>, <strong>Long Run</strong> и <strong>Short Run</strong> улей также запускает свои <strong>пророчества</strong> и блокады. Они следуют не фиксированному расписанию, а шкале угрозы: см. статью <em>Пророчества Ктулху</em>.</p>

            <h2 id="liste">События расписания</h2>
            <table>
                <thead>
                    <tr><th>Событие</th><th>Когда</th><th>Что происходит</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Атака Ктулху</strong></td><td>72 часа, первый раз через 7 дней после открытия сервера, затем каждые 21 день (дни 7, 28, 49, 70…)</td><td>Единственный период, когда Ктулху запускают свои орды против Ваших планет.</td></tr>
                    <tr><td><strong>Арена альянса</strong></td><td>Каждые 3 дня, начиная со следующего дня после открытия: регистрация в 08:00, бои в 19:00 (по времени Парижа)</td><td>Турнир между альянсами, без каких-либо реальных потерь.</td></tr>
                </tbody>
            </table>

            <h3>Атака Ктулху</h3>
            <p>На сервере Long Run или Short Run Ктулху не запускают ни одной орды вне этих 72-часовых окон. В течение окна они атакуют так же, как на сервере Ктулху, в темпе Вашей сложности PvE:</p>
            <ul>
                <li>с открытием окна против Вас вылетает орда, если Ваша задержка перед атакой истекла (5 дней после Вашей регистрации для самой первой);</li>
                <li>следующая орда вылетает через <strong>18–30 часов</strong> на Легко, <strong>12–24 часа</strong> на Нормально, <strong>8–16 часов</strong> на Сложно;</li>
                <li>орда, запущенная в течение окна, доходит до конца (6 часов сбора, затем полёт), даже если прибывает после окончания события.</li>
            </ul>
            <p>На Нормально рассчитывайте, таким образом, на 3–6 орд за окно. Всё это время <strong>Tower Defense</strong> на странице <strong>Ктулху</strong> позволяет отражать каждую орду. Если Ваш PvE отключён в Ваших Предпочтениях, Вас не атакуют. Работа орд подробно описана в статье <em>Угроза Ктулху</em>.</p>

            <h3>Арена альянса</h3>
            <p>День арены проходит так (по времени Парижа):</p>
            <ul>
                <li><strong>08:00</strong>: объявление и открытие регистрации.</li>
                <li><strong>18:45</strong>: закрытие регистрации.</li>
                <li><strong>19:00</strong>: первый раунд, затем следующие раунды в 19:15 и 19:30; окончание боёв около 19:45.</li>
            </ul>
            <p>Нужно быть участником альянса и иметь хотя бы один атакующий корабль. Ваши корабли для арены <strong>дублируются</strong>: Вы ничем из того, чем владеете, не рискуете.</p>
            <p>Каждый достигнутый раунд пополняет <strong>банк альянса</strong>: 50&nbsp;000 Bitcoin и 1&nbsp;000 ОВ за вылет в первом раунде, вплоть до 1&nbsp;000&nbsp;000 Bitcoin и 25&nbsp;000 ОВ для альянса-чемпиона. Каждый игрок, отдавший хотя бы один приказ, также получает личный бонус от 5&nbsp;000 до 50&nbsp;000 Bitcoin за каждый достигнутый раунд. Все подробности (регистрация, бой, очки, награды) — в статье <em>Альянсовая арена</em>.</p>

            <h2 id="ou">Где следить за ближайшими событиями?</h2>
            <p>Страницы календаря в игре нет. Чтобы узнать, что предстоит:</p>
            <ul>
                <li><strong>Арена альянса</strong>: вкладка <strong>Арена</strong> Вашей страницы Альянса показывает ближайшую арену с обратным отсчётом.</li>
                <li><strong>Атака Ктулху</strong>: считайте от открытия сервера (день 7, затем каждые 21 день). Список серверов показывает время, оставшееся до конца каждого сервера: на Long Run (900 дней) сервер, у которого осталось 880 дней, открылся 20 дней назад, а его следующая Атака Ктулху начнётся в день 28.</li>
                <li><strong>Пророчества</strong>: шкала «Угроза вселенной» на странице <strong>Ктулху</strong>.</li>
            </ul>

            <h2 id="strategie">Как извлечь из этого пользу</h2>
            <ul>
                <li><strong>Перед каждой Атакой Ктулху</strong> усильте турели, Легионеров и флот: это единственный период, когда орды наносят удар.</li>
                <li><strong>В течение окна</strong> играйте в Tower Defense: победа уничтожает текущую орду и делит Вашу угрозу на 2.</li>
                <li><strong>Регистрируйтесь на Арену альянса</strong> хотя бы с одним атакующим кораблём и отдайте хотя бы один приказ во время матча: Вы ничем не рискуете и получаете личный бонус.</li>
                <li><strong>Общайтесь в салоне</strong>: событие — повод для координации с Вашим альянсом.</li>
            </ul>

    alliance_arena:
        title: "Альянсовая арена"
        category: "events"
        order: 9
        tags: "альянс,арена,сетка,pvp,событие,турнир,сектор,планета,флот,база,история,зритель"
        summary: "Повторяющееся событие каждые 3 дня: Ваш альянс сражается с другими в битве за сектор (копии флотов, планеты, которые нужно удерживать), чтобы пополнить общий банк и получить личный бонус."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Когда это начинается</h2>
            <p>Событие повторяется <strong>каждые 3 дня</strong> на соответствующих серверах. Расписание одного дня арены (по времени Парижа; вкладка Арена показывает его в Вашем часовом поясе):</p>
            <ul>
                <li><strong>08:00</strong>: объявление в салоне «Вселенная» (на всех языках) и <strong>открытие регистрации</strong> с уведомлением участникам альянса.</li>
                <li><strong>18:45</strong>: закрытие регистрации. Состав сетки фиксируется.</li>
                <li><strong>19:00</strong>: первый раунд. Следующие раунды стартуют в <strong>19:15</strong> и <strong>19:30</strong>.</li>
                <li><strong>Около 19:45</strong>: окончание боёв и выдача наград.</li>
            </ul>
            <p>Если в 19:00 на всём сервере зарегистрировано менее <strong>2 альянсов</strong>, событие отменяется, а сообщение в салоне «Вселенная» предупреждает всех.</p>

            <h2 id="inscription">Как зарегистрироваться</h2>
            <p>Когда открывается регистрация, в Вашем интерфейсе <strong>автоматически открывается окно</strong> (кнопка «Зарегистрироваться на арене»). Зарегистрироваться можно и на вкладке <strong>Арена</strong> Вашей страницы Альянса.</p>
            <p>Условия:</p>
            <ul>
                <li>Быть участником альянса.</li>
                <li>Иметь как минимум <strong>1 атакующий корабль</strong> (на земле или во флоте) в момент регистрации, а затем в начале каждого матча (19:00, 19:15, 19:30).</li>
                <li>Регистрация <strong>бесплатна</strong>: она не стоит никаких ресурсов, и ничто из того, чем Вы владеете, не ставится на кон.</li>
            </ul>
            <p>Вы можете отменить регистрацию («Отменить регистрацию») до её закрытия в 18:45. Если в начале матча у Вас больше нет ни одного атакующего корабля (потеряны тем временем в настоящем бою), Вам автоматически засчитывается неявка на этот матч: Ваш альянс продолжает без Вас.</p>
            <p><strong>ИИ-командиры</strong>: как только зарегистрирован хотя бы один живой участник, ИИ-командиры Вашего альянса тоже регистрируются, пока в нём не наберётся 5 зарегистрированных, считая людей. Все живые участники при этом могут зарегистрироваться. Полностью ИИ-альянсы также регистрируются, чтобы дополнить сетку.</p>

            <h2 id="combat">Как проходит бой</h2>
            <p>Каждый матч играется в <strong>специально созданном секторе</strong>, отображаемом как космическая карта: сетка 5 × 5, на которой сражаются <strong>2–4 альянса</strong>. Каждый альянс стартует со своей <strong>базы</strong>, посреди одного из краёв сектора.</p>
            <p>Ваши корабли для арены <strong>дублируются</strong>: ничем из того, чем Вы владеете, не рискуют. Никаких реальных потерь, никаких обломков, ни одного захваченного героя.</p>
            <ul>
                <li>Матч длится <strong>не более 15 минут</strong>.</li>
                <li>Побеждает первый альянс, набравший <strong>300 очков</strong>; иначе — лучший счёт по истечении времени. При равенстве: больше удерживаемых планет, затем больше нанесённого урона, затем жребий. Если никто не набрал очков и не стрелял, матч признаётся ничьей, и никто не проходит дальше.</li>
                <li>В следующий раунд проходит один альянс на сектор. Сетка — с прямым выбыванием, не более чем на 3 раунда; победитель последнего матча становится чемпионом сервера.</li>
            </ul>

            <h2 id="flotte">Ваш флот</h2>
            <p>Вы стартуете с <strong>единственным флотом</strong>, составленным из всех Ваших атакующих кораблей (как стоящих на земле, так и из Ваших флотов) и Вашего главного героя.</p>
            <ul>
                <li><strong>Отправить</strong>: выберите свой флот, коснитесь планеты, затем подтвердите. Длительность полёта объявляется до вылета, а полёт не отменяется.</li>
                <li><strong>Разделить</strong>: отделите часть своих кораблей в новый флот (не более 4 флотов). Флот летит со скоростью своего самого медленного корабля: одна эскадра истребителей летит втрое быстрее флота, тащащего за собой линкоры.</li>
                <li><strong>Объединить</strong>: два Ваших флота на орбите одной и той же планеты можно слить.</li>
            </ul>
            <p>Ваш <strong>главный герой</strong> одалживает свои бонусы (в том числе черты вроде Тактика) Вашему стартовому флоту. Отделённый флот уходит без него; если Вы объедините его с флотом героя, герой остаётся со всей группой. Герой ничем не рискует: ни ранений, ни плена, даже при неявке.</p>
            <p>Когда два альянса оказываются на одной планете, бой разрешается через <strong>5 секунд</strong> (время, чтобы подоспело подкрепление) по <strong>тем же правилам, что и космический бой</strong> игры. Вступивший в бой флот не может уйти до его окончания.</p>
            <p>Уничтоженный флот не потерян: он <strong>воссоздаётся на Вашей базе</strong> в полном составе через 45 секунд, затем с каждым новым уничтожением ещё на 15 секунд дольше, но не более 2 минут. Каждый уничтоженный вражеский флот приносит Вашему альянсу <strong>5 очков</strong>.</p>
            <p><strong>ИИ-командиры сражаются по-настоящему</strong>: они идут захватывать свободные планеты, избегают заведомо проигранных боёв и возвращаются на ремонт. Если Вы не открываете экран матча и не отдаёте приказов в течение минуты, автопилот играет и за Вас; управление возвращается к Вам, как только Вы вернётесь.</p>

            <h2 id="planetes">Планеты и очки</h2>
            <p>Альянс, <strong>одинокий</strong> на чужой планете, захватывает её через <strong>15 секунд</strong>; прибывший враг обнуляет счётчик. Планета <strong>остаётся за Вашим альянсом</strong>, когда Ваши флоты уходят, пока её не отобьёт другой. В этом весь выбор: растянуться, чтобы набирать очки, или сгруппироваться, чтобы выигрывать бои.</p>
            <p>Каждые <strong>10 секунд</strong> каждая удерживаемая планета приносит очки:</p>
            <table>
                <thead>
                    <tr><th>Планета</th><th>Очки</th><th>Дополнительно</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Мир</strong> (4 на сектор)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Верфь</strong></td><td>1</td><td>Ремонтирует Ваши флоты на орбите: 10&nbsp;% состава за каждый период.</td></tr>
                    <tr><td><strong>Нексус</strong> (в центре)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Каждое очко, набранное планетой, также приносит <strong>ОВ в банк Вашего альянса</strong> в конце матча: 3 ОВ за очко в раунде 1, 8 в раунде 2, 15 в раунде 3, независимо от того, выиграли Вы матч или нет. Очки за уничтоженные флоты и разорённые базы ОВ не приносят.</p>

            <h2 id="bases">Базы</h2>
            <p>Ваша база — это Ваша точка старта и воссоздания; Ваши флоты чинятся на ней (5&nbsp;% за период). Её нельзя захватить, но её можно <strong>разорить</strong>.</p>
            <p>База защищена <strong>планетарной обороной всех планет игроков альянса, участвующих в матче</strong>, объединённой воедино: взять её трудно. Отражённая атака всё же её повреждает, и она восстанавливается на 10&nbsp;% за период.</p>
            <p>Если её оборона падает, база разорена: <strong>50 очков</strong> атакующему, его флоты автоматически возвращаются домой, а база становится неприкосновенной на 2 минуты.</p>

            <h2 id="recompenses">Награды</h2>
            <p>Два вида наград, которые суммируются.</p>
            <h3 id="banque">Банк альянса</h3>
            <table>
                <thead>
                    <tr><th>Достигнутый раунд</th><th>Bitcoin</th><th>ОВ</th></tr>
                </thead>
                <tbody>
                    <tr><td>Проигравшие раунда 1</td><td>50&nbsp;000</td><td>1&nbsp;000</td></tr>
                    <tr><td>Проигравшие раунда 2</td><td>150&nbsp;000</td><td>3&nbsp;000</td></tr>
                    <tr><td>Проигравшие раунда 3</td><td>350&nbsp;000</td><td>8&nbsp;000</td></tr>
                    <tr><td><strong>Чемпион</strong></td><td><strong>1&nbsp;000&nbsp;000</strong></td><td><strong>25&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>Банк получает только одну из этих наград — за достигнутый раунд, плюс ОВ за планеты, удерживаемые во время матчей.</p>
            <h3 id="perso">Личный бонус</h3>
            <p>Зачисляется прямо в Ваш личный кошелёк при условии, что Вы <strong>сами отдали хотя бы один приказ</strong> в одном из матчей вечера: если автопилот сыграл всё за Вас, бонуса нет.</p>
            <table>
                <thead>
                    <tr><th>Достигнутый раунд</th><th>Личные Bitcoin</th></tr>
                </thead>
                <tbody>
                    <tr><td>Проигравшие раунда 1</td><td>5&nbsp;000</td></tr>
                    <tr><td>Проигравшие раунда 2</td><td>15&nbsp;000</td></tr>
                    <tr><td>Проигравшие раунда 3</td><td>30&nbsp;000</td></tr>
                    <tr><td><strong>Чемпион</strong></td><td><strong>50&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>Вы получаете <strong>только один</strong> бонус за арену — за самый высокий раунд, достигнутый Вашим альянсом: <strong>50&nbsp;000 Bitcoin</strong> для чемпиона.</p>

            <h2 id="rapports">Боевые рапорты</h2>
            <p>По окончании каждого матча каждый игрок получает <strong>рапорт</strong> на своей странице Рапорты: результат, счёт Вашего альянса и каждого соперника, удерживаемые планеты, разорённые базы, нанесённый и полученный Вами урон, вражеские флоты, уничтоженные Вашими, и те, что потеряли Вы, Ваш оставшийся состав, Ваше место по урону среди пилотов Вашего альянса (с титулом <strong>«MVP матча»</strong> для первого) и ОВ, зачисленные в банк.</p>
            <p>По окончании турнира добавляется <strong>личная сводка</strong>: путь Вашего альянса по сетке, итоги матчей, Ваш общий вклад и подробности Ваших выигрышей (личный бонус, банк альянса, удерживаемые планеты).</p>

            <h2 id="suivi">Следить за событием на вкладке Арена</h2>
            <p>Вкладка <strong>Арена</strong> Вашей страницы Альянса постоянно показывает реальное состояние события: арены нет, ближайшая арена впереди (с обратным отсчётом до объявления), объявлена, регистрация открыта или закрыта, арена идёт или завершена. Обратный отсчёт показывает время до следующего этапа (закрытие регистрации, начало боёв, следующий раунд), а рамка показывает, сколько участников Вашего альянса уже зарегистрировано из общего числа.</p>
            <p>После окончания арены вкладка также хранит <strong>зал славы</strong> Вашего альянса (число сыгранных арен, титулы чемпиона, лучший достигнутый раунд, итоги побед/поражений) и историю последних десяти сыгранных на Вашем сервере выпусков с результатом Вашего альянса и наградами, полученными в каждом.</p>

            <h2 id="spectateur">Режим зрителя</h2>
            <p>Вы не зарегистрированы на текущую арену? Вы всё равно можете следить в прямом эфире за матчами <strong>Вашего альянса</strong> на вкладке Арена: сектор отображается точно так же, как для пилота, но отдавать приказы Вы не можете.</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li><strong>Займите Нексус пораньше</strong>: он приносит столько же, сколько три мира. Но все это знают.</li>
                <li><strong>Отделяйте истребители</strong>: быстрая эскадра захватывает миры, пока Ваш тяжёлый флот удерживает центр.</li>
                <li><strong>Прибывайте группой</strong>: флоты, прибывшие в одни и те же 5 секунд, сражаются вместе; одинокий флот уничтожают, подарив 5 очков.</li>
                <li><strong>Держите верфь</strong>: заход на неё чинит Ваши флоты вдвое быстрее, чем на базе.</li>
                <li><strong>Не окапывайтесь</strong>: захваченная планета остаётся за Вами, когда Вы уходите. Идите брать другую.</li>
                <li><strong>Базу берут вместе</strong>: атаковать нетронутую базу в одиночку — значит дарить очки. Несколькими союзниками, в одном и том же окне в 5 секунд, — это сразу 50 очков.</li>
                <li><strong>Отдайте хотя бы один приказ</strong>: без приказа Вашей рукой личного бонуса нет.</li>
            </ul>

            <h2 id="mobile">На мобильном</h2>
            <p>На мобильном арена играется касаниями:</p>
            <ul>
                <li><strong>Альбомная ориентация</strong> принудительно включается при входе в матч в мобильном приложении. В мобильном браузере, где игра не может принудительно задать экран, сообщение предлагает повернуть устройство.</li>
                <li><strong>Весь сектор помещается на экране</strong>: ни масштаба, ни камеры управлять не нужно.</li>
                <li><strong>Три касания для приказа</strong>: Ваш флот (на нижней панели или касанием его планеты), планета назначения, затем кнопка «Отправить».</li>
                <li><strong>Рамка и тег</strong> каждой планеты показывают, кому она принадлежит; цифры в её углах дают силы на орбите, Ваши — зелёным, вражеские — красным.</li>
                <li><strong>Кнопка ⓘ</strong>: подробности выбранной планеты и журнал боёв.</li>
                <li><strong>Уведомление</strong>: оповещение при открытии регистрации (08:00) с крайним сроком и временем боёв.</li>
            </ul>

    ia_bots:
        title: "ИИ-командиры (боты)"
        category: "events"
        order: 4
        tags: "ии,бот,искусственный интеллект,npc,автопилот"
        summary: "Некоторые серверы включают командиров, управляемых ИИ. Как они себя ведут и зачем."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Зачем нужен ИИ?</h2>
            <p>На некоторых серверах несколько командиров — не живые игроки, а <strong>искусственный интеллект</strong>. Они позволяют:</p>
            <ul>
                <li><strong>населить сервер</strong>, когда активных игроков мало;</li>
                <li>предложить <strong>интересные цели</strong> игрокам, ищущим боёв;</li>
                <li>имитировать живую дипломатию с предложениями, предательствами и правдоподобными альянсами.</li>
            </ul>
            <p>Правилами фиксированного максимального числа не установлено: команда игры сама выбирает, сколько ИИ-командиров разместить на каждом сервере, а аккаунты игроков, переведённые на автопилот (см. ниже), добавляются к ним. Это число нигде не отображается.</p>

            <h2 id="comportement">Как они себя ведут</h2>
            <p>У каждого бота есть:</p>
            <ul>
                <li><strong>личность</strong> (болтун, дипломат, агрессор, тролль, ветеран, молчун…);</li>
                <li><strong>настроение</strong>, меняющееся в зависимости от событий (довольный, недоверчивый, раздосадованный, разозлённый…);</li>
                <li><strong>стратегический архетип</strong> из пяти: экономист, сбалансированный, завоеватель, экспансионист или оборонительный.</li>
            </ul>
            <p>Они играют по-настоящему: строят, исследуют, атакуют, создают альянсы, порой предают. Они могут быть Вашими союзниками, а могут — злейшими врагами.</p>
            <p>Они растут <strong>каждый день в темпе активных игроков</strong> сервера (чуть быстрее медианы), никогда не превышая <strong>90&nbsp;% лучшего игрока</strong>. То, что они теряют в бою, потеряно по-настоящему: если игрок уничтожает их гарнизон, они не восстанавливают его на этой планете в течение <strong>7 дней</strong> и вместо этого усиливают свои турели.</p>
            <p><strong>Где спит их флот.</strong> ИИ-завоеватели и экспансионисты держат гарнизон на орбите своих планет. Остальные (экономисты, сбалансированные и оборонительные), более осторожные, держат свои корабли <strong>на земле</strong>, как многие игроки, и выводят их только для обороны&nbsp;: если их радар замечает приближающийся враждебный флот, который они могут победить, они выводят свой флот на орбиту и вызывают корабли с соседних планет, которые успевают вовремя&nbsp;; перед слишком сильным флотом они отправляют свой садиться на другую свою планету. Они также присоединяются к уже идущему бою над своей планетой или атакуют вооружённый флот, стоящий на орбите, когда могут победить. Как и игрок, спящий ИИ не реагирует, а флот, скрытый глушителем, застаёт его врасплох. Они никогда не оставляют свои корабли на земле планеты без турелей, которую вторжение захватило бы вместе с ними&nbsp;: те садятся на их лучше всего защищённую планету, которая также является их первым убежищем.</p>
            <p><strong>Их торговля.</strong> Они продают свои излишки и груз своих переработчиков ближайшему торговцу, если только он не под блокадой и не охраняется враждебным флотом в режиме атаки, который уничтожил бы их конвой по прибытии&nbsp;: тогда они идут к следующему.</p>

            <h2 id="reconnaitre">Можно ли их распознать?</h2>
            <p>Не наверняка. ИИ-командиры отображаются в рейтинге и на карте как игроки, и ничто в интерфейсе их не выделяет. Игра устроена так, чтобы Вы не могли знать наверняка, ИИ ли командир.</p>

            <h2 id="strategie">Как играть с ними</h2>
            <ul>
                <li>Не недооценивайте бота: некоторые из них — настоящие военные грозы.</li>
                <li>Бот вполне может пригласить Вас в альянс, сотрудничать, а затем напасть на Вас, если ситуация изменится.</li>
                <li>Ради погружения относитесь к ним как к игрокам: так сервер становится живее.</li>
            </ul>

            <h2 id="pilote-automatique">Отсутствующие игроки: автопилот</h2>
            <p>Если <strong>зарегистрированный</strong> игрок не заходит в игру <strong>8 дней</strong>, его аккаунт переходит на <strong>автопилот</strong> (после 7 дней отсутствия он получает напоминающее письмо; пробные аккаунты не затрагиваются): <strong>немой</strong> бот, который никогда не пишет ни в салоны, ни в личные сообщения. Этот автопилот <strong>не играет вместо Вас</strong>: аккаунт не запускает атак, не перемещает и не вводит в бой Ваши флоты и не колонизирует. Он лишь продолжает Ваши постройки и исследования и медленно усиливает Ваши турели. Другие ИИ-командиры его не атакуют; другие игроки же по-прежнему могут. Вы всё равно можете написать ему личное сообщение: он прочтёт его по возвращении. Как только игрок снова заходит, он мгновенно возвращает себе управление аккаунтом и находит свои флоты там, где их оставил.</p>

    cthulhu_prophecies:
        title: "Пророчества Ктулху"
        category: "events"
        order: 5
        tags: "ктулху,cthulhu,пророчество,блокада,угроза,событие,альянс,ов,bitcoin,торговец,переработка,рейтинг"
        summary: "Когда шкала угрозы сервера достигает порога, Одержимые объявляют пророчество: через 48 часов их орды блокируют торговлю по всему серверу. Как читать шкалу, как сообща прорвать блокаду и чем платят за провал."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Что такое пророчество?</h2>
            <p>На серверах <strong>Ктулху</strong>, <strong>Long Run</strong> и <strong>Short Run</strong> собственный для сервера <strong>запас угрозы</strong>, «Угроза вселенной», автоматически растёт день за днём. Он отличается от Вашей личной угрозы против Ктулху.</p>
            <p>Когда он достигает порога, <strong>Одержимые</strong> публикуют в публичном салоне <strong>пророчество</strong>: через <strong>48 часов</strong> на весь сервер обрушится <strong>блокада</strong>.</p>

            <h2 id="jauge">Как читать шкалу угрозы сервера</h2>
            <ul>
                <li>Она видна на странице <strong>Ктулху</strong> (той, где Tower Defense), в блоке <strong>«Угроза вселенной»</strong>: полоса от 0 до <strong>700</strong> — порога, запускающего пророчество. Она растёт независимо от Ваших личных боёв.</li>
                <li>Она растёт на <strong>100 очков в день</strong>, при смене даты (полночь по времени Парижа). Начав с нуля, она достигает порога за <strong>7 дней</strong>. Чтобы оценить оставшееся время: (700 − текущий уровень) ÷ 100 дней. Пример: при 400 пророчество наступит через 3 дня.</li>
                <li>Каждая освобождённая база улья отодвигает её на <strong>50 очков</strong>, то есть на полдня передышки.</li>
                <li>Первое событие сервера не может наступить раньше, чем через <strong>две первые недели</strong> его существования.</li>
                <li>Никогда не бывает двух пророчеств (или двух блокад) одновременно на одном сервере. Во время события шкала может продолжать показывать свой рост, но по его окончании она обнуляется: следующий цикл начинается с 0. Рассчитывайте примерно на 11 дней между двумя пророчествами (7 дней роста, 48 часов ожидания, до 48 часов блокады).</li>
            </ul>

            <h2 id="prophetie">Объявление</h2>
            <p>При пересечении порога Одержимые публикуют своё пророчество в публичном салоне: блокада наступает <strong>через 48 часов</strong>, а страница Ктулху показывает обратный отсчёт. Сообщение, голосом Одержимых, говорит о том, что поставлено на кон: блокада торговли, десятина с Bitcoin, пожранные обломки.</p>
            <p>Затем Одержимые обязательно публикуют в публичном салоне ещё три сообщения:</p>
            <ul>
                <li>в <strong>начале блокады</strong>: число орд, цель для уничтожения и оставшееся время, с напоминанием, что альянсы ранжируются;</li>
                <li>за <strong>6 часов до срока</strong>: напоминание об оставшемся времени и о числе орд, уже павших на цели;</li>
                <li>по <strong>итогам</strong>: блокада прорвана или блокада удержана, с названиями альянсов, которые награждены или наказаны.</li>
            </ul>
            <p>Discord игры также объявляет пророчество (с датой блокады по UTC), начало блокады и её исход.</p>
            <p>Помимо этих объявлений Одержимые время от времени комментируют жизнь сервера в публичном салоне, но эти сообщения не гарантированы: чтобы следить за угрозой, полагайтесь на шкалу.</p>

            <h2 id="blocus">Блокада</h2>
            <p>К сроку <strong>орда Ктулху</strong> (называемая «флот-стена» на странице Ктулху) занимает позицию на орбите <strong>каждого торговца</strong> и <strong>каждого астероида</strong> сервера:</p>
            <ul>
                <li><strong>Продажа невозможна</strong> у любого заблокированного торговца.</li>
                <li><strong>Переработка невозможна</strong> на любом заблокированном астероиде.</li>
                <li>В остальной вселенной <strong>поля обломков перерабатываются как обычно</strong>, как после любого другого боя.</li>
                <li>Зато на заблокированной цели <strong>обломки Ваших собственных штурмов копятся на месте и остаются недоступными, пока жива охраняющая её орда</strong>. Уничтожьте её, и <strong>эта цель сразу же вновь открывается</strong>, не дожидаясь судьбы блокады на остальном сервере: продажа или переработка там возобновляются, а Ваши переработчики, уже находящиеся на орбите, сами принимаются за дело.</li>
                <li>Это не имеет ничего общего с эмбарго или голодом, которые вражеский флот налагает на планету игрока: здесь останавливаются только торговля и переработка.</li>
                <li>Блокада длится не более <strong>48 часов</strong>, меньше — если её прорвут раньше.</li>
            </ul>

            <h2 id="briser">Как прорвать блокаду сообща</h2>
            <p>Не все орды равны:</p>
            <ul>
                <li>Те, что охраняют <strong>торговцев</strong>, стоят <strong>в 1,8 раза</strong> больше крупнейшего флота сервера (игрока или ИИ-командира). В одиночку их не прорвёт никто: нужно взяться вдвоём или втроём.</li>
                <li>Орды <strong>астероидов</strong> стоят лишь <strong>половину</strong> этого крупнейшего флота: крупный одинокий флот может их победить. Поскольку астероидов гораздо больше, чем торговцев, именно они составляют основную часть счётчика.</li>
            </ul>
            <p>В любом случае <strong>коалиция</strong>, бьющая по одной и той же орде последовательными штурмами, в конце концов её одолеет. Урон, полученный ордой, <strong>никогда не восстанавливается</strong> между боями: каждый штурм, даже проигранный, ослабляет её для следующего. Концентрируйте удары на одной цели, а не царапайте сразу несколько орд.</p>

            <h2 id="recompenses">Награды</h2>
            <p>Каждое очко урона, нанесённого орде, <strong>оплачивается в Bitcoin и Очках Войны</strong> по окончании события, прорвана блокада или нет: ни один штурм не пропадает зря. Вы получаете 1 очко войны за каждые 5&nbsp;000 заработанных Bitcoin.</p>
            <p>Блокада объявляется <strong>прорванной</strong>, как только <strong>70&nbsp;% орд сервера уничтожены до срока</strong> (с округлением вверх), торговцев и астероидов вместе. Пример: из 160 орд нужно уничтожить 112.</p>
            <p>Блокада тогда <strong>заканчивается немедленно</strong>: оставшиеся орды исчезают, все торговцы и астероиды вновь открываются, а ставка награды <strong>удваивается</strong> для всех участников.</p>
            <p>Индивидуальный рапорт по окончании события подробно описывает Ваш нанесённый урон и Вашу награду. Во время блокады <strong>страница Ктулху</strong> показывает прогресс в прямом эфире: уничтоженные орды, цель и оставшееся время.</p>

            <h2 id="echec">Цена провала</h2>
            <p>Если блокада <strong>истекает непрорванной</strong>:</p>
            <ul>
                <li><strong>Каждый игрок теряет половину своих Bitcoin</strong>: Одержимые взимают свою десятину, в том числе с игроков, отключивших PvE. Не затрагиваются лишь игроки под <strong>защитой новичка</strong> и игроки, у которых наступил game over.</li>
                <li><strong>Все поля обломков боёв во вселенной пожираются</strong> Ктулху; <strong>астероиды</strong>, напротив, остаются нетронутыми.</li>
                <li><strong>Сейф Bitcoin каждого альянса</strong>, в котором есть хотя бы один живой игрок, тоже теряет половину содержимого: внести свои Bitcoin в сейф до срока ни от чего не защищает. Списание отображается в истории сейфа.</li>
                <li><strong>3 последних альянса рейтинга</strong> дополнительно теряют в производстве на 72 часа (см. ниже).</li>
            </ul>
            <p>Десятина взимается до выплаты наград: то, что Вы зарабатываете, сражаясь с ордами, не урезается. Каждый затронутый игрок получает рапорт с подробностями потерянных Bitcoin.</p>

            <h2 id="classement">Рейтинг альянсов</h2>
            <p>Во время блокады каждый альянс ранжируется по тому, что он делает против улья. <strong>Страница Ктулху</strong> показывает рейтинг в прямом эфире с тем, что выиграл бы или потерял Ваш альянс, если бы блокада закончилась сейчас.</p>
            <ul>
                <li><strong>Очки</strong>: урон, нанесённый <strong>флоту-стене</strong> блокады, считается вдвойне; урон, нанесённый улью в других местах (осады баз, орды), — одинарно; каждая <strong>победа в Tower Defense</strong> стоит столько же, сколько уничтожение четверти флота-стены астероида.</li>
                <li><strong>Очки на участника</strong>: счёт делится на число активных участников (заходивших в последние 7 дней, исключая защиту новичка). Урон новичка всё равно засчитывается: набор людей никогда не снижает счёт.</li>
                <li><strong>Состав фиксируется</strong> в начале блокады: смена альянса во время события не перемещает ни очки, ни бонус, ни штраф.</li>
                <li>Чтобы попасть в рейтинг, нужно как минимум <strong>2 активных участника</strong>. <strong>Игроки без альянса</strong> не затрагиваются никогда.</li>
            </ul>
            <p><strong>Блокада прорвана</strong>: 3 первых альянса получают <strong>+15&nbsp;%, +10&nbsp;% и +5&nbsp;% к производству</strong> на 72 часа при условии, что набрали очки. Ни один альянс не наказывается.</p>
            <p><strong>Блокада перенесена</strong>: 3 последних альянса теряют <strong>15&nbsp;%, 10&nbsp;% и 5&nbsp;% производства</strong> на 72 часа в дополнение к десятине. Затронуто не более половины ранжированных альянсов. Альянс, приложивший минимальное усилие, избавлен от этого, даже будучи последним: эквивалент половины уничтоженного флота-стены астероида или двух побед в Tower Defense на активного участника.</p>
            <p>Каждый участник получает рапорт, объясняющий бонус или штраф его альянса и дату его окончания.</p>

            <h2 id="conseils">На практике</h2>
            <ul>
                <li>Следите за шкалой <strong>«Угроза вселенной»</strong> на странице Ктулху: при 100 очках в день она подсказывает, сколько дней осталось до порога в 700.</li>
                <li>Как только <strong>пророчество</strong> объявлено, предупредите свой альянс: у Вас есть <strong>48 часов</strong>, чтобы организоваться, прежде чем наступит блокада.</li>
                <li>Концентрируйте штурмы на одних и тех же ордах, а не распыляйте их: урон сохраняется, лучше добить одну, чем поцарапать несколько.</li>
                <li>Даже проигранный штурм что-то приносит: не ждите уверенности в победе, чтобы атаковать.</li>
                <li>Не хватает флота для атаки на орду? <strong>Победа в Tower Defense</strong> во время блокады тоже приносит очки Вашему альянсу.</li>
            </ul>

    notifications:
        title: "Пуш-уведомления"
        category: "beginner"
        order: 10
        tags: "уведомление,пуш,push,оповещение,мобильный,android,браузер,предпочтения,колокольчик"
        summary: "Получайте оповещения в приложении Android или в браузере, как только в Вашей империи происходит важное событие."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">Для чего это нужно?</h2>
            <p>В Area Universe играют непрерывно: вражеские флоты могут прибыть, пока Вы на работе. <strong>Пуш-уведомления</strong> оповещают Вас в реальном времени на телефоне или в браузере, чтобы Вы успели отреагировать.</p>

            <h2 id="evenements">Что Вы можете получать</h2>
            <p>На странице «Уведомления» типы разложены по пяти группам:</p>
            <ul>
                <li><strong>Производство и исследования</strong> — Исследование завершено; Строительство завершено (Ваша очередь строительства пуста); Производство завершено (Ваша очередь кораблей или обороны пуста).</li>
                <li><strong>Флоты</strong> — Флот прибыл в пункт назначения; Флот в бою (один из Ваших флотов вступил в бой); Приближается вражеский флот (враждебный флот только что отправлен к одной из Ваших планет).</li>
                <li><strong>Планеты</strong> — Планета под атакой (флот прибывает грабить или вторгаться); Планета под эмбарго; Получен ядерный удар; Атака Ктулху; Обнаружен шпионаж.</li>
                <li><strong>Альянс</strong> — Альянс в состоянии войны; Сообщение альянса.</li>
                <li><strong>Личное</strong> — Новое личное сообщение; Герой захвачен; Герой освобождён.</li>
            </ul>
            <p>Каждый тип включается или отключается <strong>по отдельности</strong>. У двух оповещений собственного переключателя нет: <strong>Планета захвачена</strong> отправляется всегда, а напоминание <strong>Бонус за вход доступен</strong> (не чаще раза в день) отключается только через <em>Отключить все</em>.</p>
            <p>«Приближается вражеский флот» игнорирует флоты Вашего альянса и флоты альянса, с которым у Вас оборонительный союз, пакт о ненападении или мирное соглашение.</p>

            <h2 id="activation">Как их включить</h2>
            <ol>
                <li>Откройте страницу <strong>Уведомления</strong>: значок колокольчика внизу меню на компьютере; кнопка <strong>Меню</strong>, затем <strong>Уведомления</strong> на телефоне.</li>
                <li>В браузере нажмите <strong>Включить уведомления</strong> (блок «Уведомления браузера»); в приложении Android — <strong>Включить уведомления</strong> в разделе «Уведомления на этом устройстве».</li>
                <li>Примите запрос на разрешение от браузера или телефона.</li>
                <li>Ниже снимите флажки с типов, которые Вы не хотите получать: в начале все они включены.</li>
            </ol>
            <p>Кнопка <em>Отключить все</em> отключает всё одним щелчком. Ваш выбор по типам действует для сервера, на котором Вы играете, на всех Ваших устройствах.</p>
            <p>В браузере опция <strong>Звук уведомления</strong> дополнительно проигрывает звук, когда приходит что-то новое, а вкладка находится в фоне. Баннер тоже может предложить Вам включить уведомления: <strong>Включить</strong> или <strong>Нет, спасибо</strong>.</p>

            <h2 id="compatibilite">Где это работает</h2>
            <ul>
                <li><strong>Приложение Android</strong> (Google Play): это единственное приложение; для iPhone и iPad его нет.</li>
                <li><strong>Браузер на компьютере</strong>: Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone и iPad</strong>: в игру играют в браузере.</li>
                <li><strong>Несколько устройств</strong>: уведомления получает каждое устройство, на котором Вы их включили; если Вы включили их на телефоне и на компьютере, зазвонят оба.</li>
            </ul>

            <h2 id="ustranenie-problem">Браузер отказывается от регистрации?</h2>
            <p>Если Ваш браузер блокирует службу уведомлений, сама страница «Уведомления» показывает, что делать, и кнопку <strong>Повторить</strong>.</p>
            <p>В <strong>Brave</strong> push-служба Google по умолчанию отключена. Откройте <code>brave://settings/privacy</code>, включите <strong>«Использовать сервисы Google для push-сообщений»</strong>, затем полностью перезапустите браузер. В других браузерах проверьте, что VPN, антивирус или фильтрующий DNS не блокируют службу уведомлений.</p>

            <h2 id="mobilnoe">В мобильном приложении</h2>
            <p>В приложении Android на странице <strong>Уведомления</strong> есть раздел «Уведомления на этом устройстве»: включайте или отключайте пуш-уведомления телефона в любой момент. Если они заблокированы, кнопка <strong>Открыть настройки</strong> ведёт прямо в настройки телефона. Ваш выбор по типам уведомлений действует для всех Ваших устройств на сервере, где Вы играете.</p>

    glossary:
        title: "Глоссарий"
        category: "beginner"
        order: 11
        tags: "глоссарий,термины,определения,словарь,сокращения"
        summary: "Все термины и сокращения игры, объяснённые одной фразой."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Все термины игры</h2>
            <table>
                <tr><th>Термин</th><th>Определение</th></tr>
                <tr><td><strong>Альянс</strong></td><td>Группа игроков. Членство в нём повышает на 20&nbsp;% производство ниобия, воды и рационов на Ваших планетах.</td></tr>
                <tr><td><strong>Баржа</strong></td><td>Десантный корабль для высадки Легионеров при рейдах и вторжениях.</td></tr>
                <tr><td><strong>Биткойн</strong></td><td>Основная валюта игры. Производится Вашими рабочими.</td></tr>
                <tr><td><strong>Блок</strong></td><td>Автоматическое объединение союзных флотов во время космического боя.</td></tr>
                <tr><td><strong>ПР</strong></td><td>Поле ресурсов: обломки, оставшиеся после боя, пригодные для переработки.</td></tr>
                <tr><td><strong>Космическая верфь</strong></td><td>Здание, позволяющее изготавливать корабли.</td></tr>
                <tr><td><strong>Ктулху</strong></td><td>Враждебные существа (бывшие «зомби»). Появляются в режиме PvE и на планетах пришельцев.</td></tr>
                <tr><td><strong>Цикл</strong></td><td>Внутренний ритм производства. 10 мин для планеты, 1 мин для луны.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Уровень тревоги альянса. Чем меньше число, тем напряжённее обстановка.</td></tr>
                <tr><td><strong>Эмбарго</strong></td><td>Осада планеты вражеским флотом на орбите. Вызывает голод.</td></tr>
                <tr><td><strong>Содержание</strong></td><td>Ежедневные расходы в Биткойнах на Ваши войска, корабли и здания.</td></tr>
                <tr><td><strong>Оборонительный форт</strong> (Бункер)</td><td>Оборонительное здание: увеличивает вместимость Легионеров, позволяет строить Мехов и укрывает от грабежа за каждый уровень 5&nbsp;% Вашей вместимости хранилища ниобия и воды (и 5&nbsp;% Вашего урана).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Конец партии: экономическое банкротство или потеря всех Ваших планет.</td></tr>
                <tr><td><strong>Экономический Game Over</strong></td><td>Ваш баланс Биткойнов стал отрицательным после ежедневного отчёта.</td></tr>
                <tr><td><strong>Герой</strong></td><td>Ваш главный персонаж (у Вас могут быть и второстепенные герои). Он развивается, сражается и может быть захвачен.</td></tr>
                <tr><td><strong>Лунар</strong> (иногда называется Moon Maker)</td><td>Корабль, создающий луну на пустой позиции, где в обломках не меньше 2 миллионов ниобия и 2 миллионов воды.</td></tr>
                <tr><td><strong>Торговец</strong></td><td>NPC на карте, который покупает Ваши ресурсы за Биткойны (и немного Очков Войны).</td></tr>
                <tr><td><strong>Уровень</strong></td><td>От 2 до 40, растёт с Вашим опытом, а он растёт с Вашим счётом; никогда не понижается. Задаёт нижнюю границу бонуса за вход.</td></tr>
                <tr><td><strong>Цели</strong></td><td>3 ежедневных задания, обновляемых с каждым ежедневным отчётом и оплачиваемых в ОВ. Одноимённая страница в меню.</td></tr>
                <tr><td><strong>ОВ</strong></td><td>Очки Войны. Зарабатываются главным образом в бою (а также ежедневными целями, ареной, тюрьмой, продажей торговцам). Тратятся на странице «Цели» (Биткойны, Легионеры, рабочие), на элитные корабли, Плавучий город, Орбитальную станцию и исследование Территориальное расширение.</td></tr>
                <tr><td><strong>Автопилот</strong></td><td>Тихий режим, который берёт на себя аккаунт зарегистрированного игрока, отсутствующего 8 дней: он продолжает строительство и исследования, не двигает ни одного флота и возвращает Вам управление, как только Вы вернётесь.</td></tr>
                <tr><td><strong>Активная планета</strong></td><td>Планета, выбранная в данный момент. Все Ваши действия относятся к ней.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Неигровой персонаж: торговцы, пришельцы, Ктулху, боты ИИ.</td></tr>
                <tr><td><strong>Рейд</strong></td><td>Наземная атака, чтобы ограбить ресурсы планеты (а не завоевать её).</td></tr>
                <tr><td><strong>Ежедневный отчёт</strong></td><td>Ежедневный итог, рассчитываемый в 18:59 (по парижскому времени): доходы, расходы, баланс, обновление очков и рейтинга, новые цели дня.</td></tr>
                <tr><td><strong>Переработчик</strong></td><td>Корабль, собирающий обломки (ПР): переработка начинается сама, когда флот с переработчиками прибывает на поле обломков.</td></tr>
                <tr><td><strong>Раунд</strong></td><td>Ход боя. Максимум 100 в космическом бою, максимум 10 в наземном.</td></tr>
                <tr><td><strong>Сигнатура</strong> (тепловая)</td><td>Порядок величины массы флота без раскрытия его состава. Чем она больше, тем больше топлива (оплачиваемого в Биткойнах) стоит полёт; по ней же считаются Ваши очки и Очки Войны, зарабатываемые в бою.</td></tr>
                <tr><td><strong>Зонд</strong></td><td>Небольшой шпионский корабль. Отправляйте его перед любой атакой.</td></tr>
                <tr><td><strong>Терраформирование</strong></td><td>Исследование, задающее максимальное число планет, которыми Вы можете владеть: его уровень + 2 (плюс бонусы строя Вашего альянса), вплоть до 18-го уровня. 1-й уровень открывает колонизатор, 15-й — Лунар. Чтобы увеличить планету, постройте Плавучий город или Орбитальную станцию (исследование Территориальное расширение).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Мини-игра активной обороны против орд Ктулху.</td></tr>
                <tr><td><strong>Рабочий</strong></td><td>Единица населения. Ежедневно производит Биткойны. Защищает при вторжении.</td></tr>
                <tr><td><strong>Обучение</strong></td><td>Пошаговый путь с наградами (до 18 шагов в 5 главах, в зависимости от выбранного пути). Запускается или возобновляется на странице «Предпочтения», раздел «Обучение».</td></tr>
                <tr><td><strong>Материнский корабль</strong></td><td>Флагман, оплачиваемый в том числе в ОВ: даёт своему флоту 20&nbsp;000 корпуса и 5&nbsp;000 щита, +5&nbsp;% корпуса и щита, +10&nbsp;% точности и −10&nbsp;% сигнатуры. Он так же медлителен, как боевой корабль, и замедляет флот истребителей или корветов.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Игрок, назначенный приоритетной целью в режиме Найти и уничтожить.</td></tr>
            </table>

    account_deletion:
        title: "Удалить мой аккаунт и данные"
        category: "beginner"
        order: 99
        tags: "удаление,аккаунт,данные,gdpr,конфиденциальность,удалить"
        summary: "Как окончательно удалить Ваш аккаунт и персональные данные и что игра сохраняет."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Где подать запрос</h2>
            <p>В игре откройте <strong>Предпочтения</strong>: в самом низу <strong>Опасная зона</strong> предлагает кнопку <strong>Удалить мой аккаунт</strong>.</p>
            <p>Можно также зайти на публичную страницу <strong>/suppression-donnees</strong> (ссылка «Удаление аккаунта и данных» в Правилах). Она кратко описывает, что удаляется, а что сохраняется; затем нужно войти в аккаунт, чтобы подать запрос.</p>
            <p>Для подтверждения введите ровно слово <strong>УДАЛИТЬ</strong>, затем нажмите <strong>Окончательно удалить мой аккаунт</strong>. Удаление происходит <strong>немедленно</strong> и действует для Вашего аккаунта на <strong>всех серверах</strong>.</p>

            <h2 id="irreversible">Окончательный отказ от аккаунта</h2>
            <p><strong>Внимание: это окончательный отказ от аккаунта.</strong> Ваши персональные данные удаляются или обезличиваются немедленно:</p>
            <ul>
                <li>e-mail, пароль и ник;</li>
                <li>идентификаторы Google, Discord или LinkedIn, привязка Google Play Игр и адрес кошелька;</li>
                <li>IP-адрес, технический отпечаток и часовой пояс;</li>
                <li>сессии, токены входа и токены уведомлений;</li>
                <li>личные сообщения, отправленные и полученные;</li>
                <li>подписки на рассылку и уведомления.</li>
            </ul>
            <p>Ваши достижения стираются. Вы больше никогда не сможете войти с этим аккаунтом, и никакая функция игры не позволяет его восстановить: чтобы играть снова, нужно создать новый аккаунт и начать с нуля.</p>
            <p>Никакие текущие покупки не возмещаются.</p>

            <h2 id="conserve">Что сохраняется и почему</h2>
            <p>Чтобы сохранить баланс игры, Ваши командиры, планеты и флоты продолжают существовать, переданные немому боту. Ваши командиры, герои и планеты переименовываются в «Bot-» с номером, без какой-либо связи с Вашей личностью; это имя также заменяет Ваше в рейтингах и архивах завершённых серверов.</p>
            <p>Публичные сообщения, написанные в салонах, сохраняются и теперь отображаются под этим именем «Bot-…».</p>
            <p>История платежей сохраняется (бухгалтерская правовая обязанность), также будучи отделённой от Вашей личности.</p>

    achievements:
        title: "Достижения"
        category: "progression"
        order: 11
        tags: "достижения,achievements,трофеи,google play,play игры,прогресс"
        summary: "15 достижений аккаунта, от первых шагов до карьерных подвигов, в Вашем профиле и в Google Play Играх."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Принцип</h2>
            <p><strong>Достижения</strong> награждают то, чего Вы добиваетесь со своим аккаунтом, <strong>на всех серверах вместе</strong>. Раз открытое достижение остаётся открытым навсегда, даже если Вы потом потеряете планету или покинете альянс, благодаря которым его получили.</p>
            <p>Найдите их в своём <strong>профиле на всех серверах</strong> (меню «Мой профиль на всех серверах») с Вашим прогрессом и датой каждого открытия. В профиле другого игрока показаны его достижения. Те, которых Ваша история уже заслужила, открываются автоматически.</p>
            <h2 id="liste">15 достижений</h2>
            <table>
            <tr><th>Достижение</th><th>Условие</th><th>Очки</th></tr>
            <tr><td>Командир</td><td>Пройти обучение, следуя ему (пропуск через «Разберусь сам» не засчитывается)</td><td>20</td></tr>
            <tr><td>Строитель</td><td>Завершить первую постройку</td><td>20</td></tr>
            <tr><td>Учёный</td><td>Завершить первое исследование</td><td>20</td></tr>
            <tr><td>Колонист</td><td>Владеть 2 планетами</td><td>20</td></tr>
            <tr><td>Союзник</td><td>Вступить в альянс или основать его</td><td>20</td></tr>
            <tr><td>Ветеран I, II, III</td><td>Провести 10, 100, затем 1&nbsp;000 космических сражений</td><td>25, 50, 100</td></tr>
            <tr><td>Завоеватель I, II</td><td>Успешно провести 10, затем 100 вторжений</td><td>50, 100</td></tr>
            <tr><td>Тюремщик</td><td>Взять в плен вражеского героя</td><td>50</td></tr>
            <tr><td>Охотник на Ктулху</td><td>Выиграть партию в Tower Defense</td><td>50</td></tr>
            <tr><td>Элита</td><td>Завершить сервер в топ-10</td><td>100</td></tr>
            <tr><td>Император</td><td>Выиграть сервер</td><td>200</td></tr>
            <tr><td>Скрытое достижение</td><td>Узнать в игре</td><td>50</td></tr>
            </table>
            <p>«Учёный» нельзя получить на серверах, где все исследования открыты с самого начала. Луна считается планетой для «Колониста».</p>

            <h2 id="progression">Прогресс</h2>
            <p>Достижения за сражения и вторжения продвигаются по ступеням, а Ваш профиль показывает счётчик (например, 37 / 100). Засчитываются все проведённые космические сражения, выигранные или проигранные, включая уничтожение безоружного флота (карго, переработчики, зонды), для обеих сторон; вторжения засчитываются, когда они успешны (рейды не учитываются). Элита и Император определяются в конце сервера.</p>
            <h2 id="google-play">Google Play Игры (Android)</h2>
            <p>В приложении для Android Ваши достижения отображаются и в <strong>Google Play Играх</strong> с баннером «Достижение открыто».</p>
            <ul>
            <li><strong>Пробный аккаунт</strong>, созданный в приложении: он автоматически привязывается к Вашему профилю Google Play Игр. После этого он больше не удаляется после 7 дней без игры и открывается сам после переустановки или на новом телефоне.</li>
            <li><strong>Зарегистрированный аккаунт</strong>: в приложении для Android откройте свой профиль на всех серверах (меню «Мой профиль на всех серверах») и нажмите «Привязать аккаунт» на карточке «Google Play Игры». После этого он будет открываться без пароля с этим профилем Google Play Игр: делайте это только на собственном устройстве. Отвязать его можно в любой момент с той же карточки, как на сайте, так и в приложении.</li>
            <li>Кнопка <strong>«Play Игры»</strong> на экране входа снова открывает привязанный аккаунт. Выход из аккаунта отключает автоматическое открытие на этом устройстве: тогда аккаунт открывает именно эта кнопка.</li>
            </ul>
            <p>Профиль Google Play Игр привязывается только к одному аккаунту Area, а аккаунт — только к одному профилю. Привязка Вашего аккаунта из Вашего профиля забирает профиль Google Play Игр у другого аккаунта, к которому он был привязан, если такой был.</p>
    faq:
        title: "Частые вопросы: аккаунт, устройства и помощь"
        category: "beginner"
        order: 13
        tags: "faq,вопросы,аккаунт,несколько серверов,мульти-аккаунт,офлайн,android,iphone,консоль,язык,испанский,ник,контакт,поддержка,баг,покупка,возврат,удаление,рапорты"
        summary: "Несколько серверов, игра без подключения, устройства, языки, ник, контакты, баги, покупки: ответы на практические вопросы."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Игра на нескольких серверах</h2>
            <p>Да. Ваш аккаунт следует за Вами на все серверы. На каждом сервере, к которому Вы присоединяетесь, у Вас <strong>отдельный командир</strong> со своим ником, планетами, героями, Bitcoin, альянсом и рейтингом: ничто не переходит с сервера на сервер.</p>
            <p>Вы можете играть на нескольких серверах одновременно и переключаться между ними через пункт <strong>Сервер</strong> меню: серверы, на которых Вы уже играете, открываются сразу.</p>
            <p>Что общее для всех Ваших серверов: Ваш <strong>профиль на всех серверах</strong> (меню «Мой профиль на всех серверах»), накапливающий Вашу карьеру и достижения, Ваш язык и Ваш список заблокированных игроков.</p>
            <p>Несколько аккаунтов на одном сервере: Правила (раздел «Множественные аккаунты») разрешают их при условии, что Вы заявите о них по e-mail на <strong>support@areauniverse.com</strong>. Эти аккаунты не должны взаимодействовать напрямую друг с другом, ни через третье лицо. Делиться своими данными для входа с кем-либо ещё запрещено.</p>

            <h2 id="hors-ligne">Игра без подключения</h2>
            <p>Нет: Area Universe — онлайн-игра, и ей нужно подключение к Интернету, как в приложении, так и в браузере. Если соединение обрывается, игра показывает «Переподключение…» и возобновляется, как только оно возвращается.</p>
            <p>Зато партия продолжается без Вас: Ваши планеты производят до предела хранилищ, Ваши постройки, исследования и флоты продвигаются… а соперники могут напасть на Вас. Включите <a href="/wiki/notifications">пуш-уведомления</a>, чтобы быть в курсе.</p>
            <ul>
                <li>После <strong>8 дней</strong> без захода Ваш командир переходит на <a href="/wiki/ia_bots">автопилот</a>.</li>
                <li><strong>Пробный аккаунт</strong> (созданный через «Тест без email») удаляется после <strong>7 дней</strong> без игры, если только он не привязан к Google Play Играм в приложении для Android. Чтобы сохранить его, подтвердите его через пункт <strong>Подтвердить аккаунт</strong> меню.</li>
            </ul>

            <h2 id="plateformes">На каких устройствах играть?</h2>
            <ul>
                <li><strong>Компьютер</strong>: в современном браузере (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong>: в приложении Area Universe из Google Play. Браузер Android, пытающийся войти в игру, перенаправляется в Google Play. В приложении играют в альбомной ориентации.</li>
                <li><strong>iPhone и iPad</strong>: приложения нет; играйте в браузере.</li>
                <li><strong>Консоли</strong> (PlayStation, Xbox, Switch…): консольной версии не существует.</li>
            </ul>
            <p>Ваш аккаунт везде один и тот же: войдите с теми же данными, чтобы найти свою партию на другом устройстве.</p>

            <h2 id="langues">Доступные языки</h2>
            <p>Игра существует на <strong>шести языках</strong>: французском, английском, немецком, испанском, португальском и русском. Эта вики тоже.</p>
            <p>Чтобы сменить язык: на компьютере коснитесь флага внизу меню; на телефоне откройте кнопку <strong>Меню</strong>, затем выберите флаг в строке <strong>Язык</strong>. Ваш выбор сохраняется в Вашем аккаунте: Ваши пуш-уведомления тоже приходят на этом языке.</p>

            <h2 id="pseudo">Смена ника</h2>
            <p>Ваш ник — это ник Вашего командира: он <strong>свой на каждом сервере</strong>. Чтобы его сменить, откройте <strong>Предпочтения</strong>, раздел <strong>Личность</strong>, поле <strong>Псевдоним</strong> (от 3 до 15 символов; первая буква становится заглавной), затем <strong>Сохранить</strong>. Изменение происходит сразу и возможно в любой момент при условии, что этот ник ещё не занят на сервере. Чтобы сохранить, нужно создать своего героя.</p>
            <p>Ваш логин для входа — это Ваш адрес e-mail. Он меняется в разделе <strong>Настройки</strong> (страница «Мои настройки», Изменить email): ссылка для подтверждения уходит на новый адрес, а старый остаётся активным, пока Вы не перейдёте по ней. Пароль меняется там же.</p>

            <h2 id="contact">Связаться с командой</h2>
            <ul>
                <li><strong>По e-mail</strong>: <strong>support@areauniverse.com</strong>, по вопросу об аккаунте, платеже или персональных данных.</li>
                <li><strong>В Discord</strong>: сервер сообщества Area Universe (discord.gg/bpwWyS8), ссылка на который находится внизу страниц сайта, рядом с Facebook, Telegram и LinkedIn.</li>
                <li><strong>О баге</strong>: лучше пользуйтесь кнопкой <strong>Ошибка</strong> в игре (см. ниже); Ваш рапорт попадает прямо к команде вместе со страницей, на которой Вы были.</li>
            </ul>

            <h2 id="bug">Сообщить о баге</h2>
            <p>Нажмите кнопку <strong>Ошибка</strong> (значок жука): внизу меню на компьютере; на телефоне — кнопка <strong>Меню</strong>, затем <strong>Ошибка</strong>. В окне <strong>Сообщить об ошибке</strong>:</p>
            <ol>
                <li>опишите, что произошло и что Вы делали (не более 2&nbsp;000 символов);</li>
                <li>по возможности приложите изображение (JPEG, PNG или WebP, не более 5&nbsp;МБ); в приложении кнопка <strong>Снимок экрана</strong> сделает это за Вас;</li>
                <li>нажмите <strong>Отправить</strong>.</li>
            </ol>
            <p>Страница, на которой Вы были, и тип устройства прикладываются автоматически. Вы можете отправлять до 10 рапортов в день. На игрока, который читерит или оскорбляет, лучше пожаловаться через <a href="/wiki/moderation_blocking">жалобу</a>.</p>

            <h2 id="achats">Покупки и возвраты</h2>
            <p>Игра бесплатна. Единственная предлагаемая сегодня покупка — доступ к <strong>Paid Server</strong> (платному соревновательному серверу): <strong>5&nbsp;€</strong>, оплачиваемых один раз за сервер банковской картой перед входом; нужен валидный аккаунт. <strong>Bitcoin</strong> игры не покупаются за реальные деньги: они зарабатываются только игрой. Пуш-уведомления бесплатны.</p>
            <p>При проблеме с платежом (платёж списан, но доступ не открыт, запрос на возврат) напишите на <strong>support@areauniverse.com</strong>, указав адрес e-mail Вашего аккаунта, нужный сервер и дату платежа. Условия использования предусматривают, что возврат не производится после использования платной услуги, кроме права на отказ или исключительного случая, рассматриваемого поддержкой. Удаление аккаунта не возмещает никакие текущие покупки.</p>

            <h2 id="compte-supprime">Восстановить удалённый аккаунт</h2>
            <p>Ни одна функция игры не позволяет восстановить удалённый аккаунт: <a href="/wiki/account_deletion">удаление аккаунта</a> окончательно, а Ваши персональные данные стираются на месте. Чтобы играть снова, создайте новый аккаунт. Если Вы считаете, что произошла ошибка, напишите на <strong>support@areauniverse.com</strong>.</p>
            <p>Пробный аккаунт, удалённый из-за 7 дней без игры, тоже не восстанавливается.</p>
            <p>Вы просто забыли пароль? На экране входа нажмите значок ключа (<strong>Забыли пароль</strong>) и введите свой адрес e-mail: Вам будет отправлена ссылка для сброса.</p>

            <h2 id="rapports">Удаление или архивирование рапортов</h2>
            <p>На странице <strong>Рапорт</strong> откройте рапорт и нажмите <strong>Удалить</strong>: он тут же исчезает, без подтверждения и корзины. Удаление выполняется по одному рапорту; ни архивирования, ни группового удаления нет. Чтобы навести порядок среди непрочитанных, <strong>Отметить всё как прочитанное</strong> обрабатывает все Ваши рапорты сразу. Рапорты сами со временем не стираются.</p>
            <p>Личные сообщения в <strong>Сообщениях</strong>, напротив, удалить нельзя.</p>

