        tags: "исследования,технология,наука,биткойн,разблокировка,технологическое дерево"
        summary: "Технологии, разблокирующие корабли, бонусы и новые возможности. Как расставить приоритеты."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="fonctionnement">Как это работает</h2>
            <p>Исследования запускаются из <strong>Исследовательского центра</strong>. Каждое исследование:</p>
            <ul>
                <li>стоит <strong>Биткойнов</strong>;</li>
                <li>занимает <strong>время</strong> (от нескольких минут до нескольких часов в зависимости от уровня);</li>
                <li>может иметь <strong>предварительные требования</strong> (другое исследование на определённом уровне).</li>
            </ul>
            <p>Найм <strong>учёных</strong> ускоряет Ваши текущие исследования.</p>

            <h2 id="priorite-debutant">Приоритеты для новичка</h2>
            <ol>
                <li><strong>Утилитарное</strong> — разблокирует грузовые корабли, зонды, переработчиков.</li>
                <li><strong>Индустрия</strong> — больше производства ресурсов.</li>
                <li><strong>Демография</strong> — больше рабочих (а значит, больше Биткойнов).</li>
                <li><strong>Баржа</strong> и <strong>Переработчик</strong> — необходимы для атак и переработки.</li>
                <li><strong>Вооружение / Броня</strong> — до первого настоящего боя.</li>
            </ol>

            <h2 id="recherches">Полный список исследований</h2>
            <table>
                <tr><th>Исследование</th><th>Эффект</th><th>Макс. уровень</th></tr>
                <tr><td>Утилитарное</td><td>Разблокирует грузовые корабли, зонды, переработчика и т. д.</td><td>3</td></tr>
                <tr><td>Терраформирование</td><td>Увеличивает застраиваемую площадь планет.</td><td>18</td></tr>
                <tr><td>Экспансия</td><td>Увеличивает число планет, которые можно колонизировать.</td><td>2</td></tr>
                <tr><td>Индустрия</td><td>Бонус производства ресурсов.</td><td>5</td></tr>
                <tr><td>Демография</td><td>Увеличивает прирост рабочих.</td><td>5</td></tr>
                <tr><td>Дисциплина</td><td>Усиливает наземных Легионеров.</td><td>3</td></tr>
                <tr><td>Колючая проволока</td><td>Бонус наземной обороны.</td><td>5</td></tr>
                <tr><td>Бронированные единицы</td><td>Разблокирует Меха.</td><td>1</td></tr>
                <tr><td>Вооружение</td><td>Увеличивает урон Ваших кораблей.</td><td>5</td></tr>
                <tr><td>Ракета</td><td>Ракетная фракция (бонус против лазеров).</td><td>3</td></tr>
                <tr><td>Лазер</td><td>Лазерная фракция (бонус против плазмы).</td><td>3</td></tr>
                <tr><td>Плазма</td><td>Плазменная фракция (бонус против ракет).</td><td>3</td></tr>
                <tr><td>Гиперпространство</td><td>Позволяет межгалактические путешествия.</td><td>1</td></tr>
                <tr><td>Волна</td><td>Улучшает радары и связь. Предварительное требование других исследований.</td><td>5</td></tr>
                <tr><td>Шпионаж</td><td>Увеличивает дальность Ваших зондов (требуется: Волна уровень 5).</td><td>999</td></tr>
                <tr><td>Карго</td><td>Увеличивает вместимость грузовых кораблей.</td><td>5</td></tr>
                <tr><td>Баржа</td><td>Разблокирует баржи (перевозка Легионеров).</td><td>1</td></tr>
                <tr><td>Переработчик</td><td>Разблокирует переработчика.</td><td>1</td></tr>
                <tr><td>Лёгкий корабль</td><td>Разблокирует/улучшает лёгкие корабли.</td><td>3</td></tr>
                <tr><td>Тяжёлый корабль</td><td>Разблокирует/улучшает тяжёлые корабли.</td><td>3</td></tr>
                <tr><td>Аэропонная ферма</td><td>Разблокирует продвинутую версию фермы.</td><td>1</td></tr>
                <tr><td>Тюрьма</td><td>Разблокирует тюрьму (требуется: Колючая проволока 5).</td><td>1</td></tr>
            </table>

            <h2 id="modes-speciaux">Режимы сервера с максимальными исследованиями</h2>
            <p>В некоторых режимах (Battle Royale, Доминирование, Search &amp; Destroy) все Ваши исследования стартуют на <strong>максимальном уровне</strong>. Меню Исследований при этом скрыто.</p>

    workers_scientists:
        title: "Рабочие и учёные"
        category: "economy"
        order: 4
        tags: "рабочие,учёные,население,биткойн,производство,оборона"
        summary: "Два населения Вашей империи: рабочие, которые платят, и учёные, которые ускоряют."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Рабочие</h2>
            <p>Рабочие — Ваш <strong>главный источник Биткойнов</strong>. Ежедневно (при ежедневном отчёте) они приносят Вам доход, пропорциональный их количеству.</p>
            <p>Их <strong>максимальное количество</strong> зависит от построенных Городов и Мегаполисов:</p>
            <ul>
                <li><strong>Город</strong>: +25&nbsp;000 максимум рабочих за уровень.</li>
                <li><strong>Мегаполис</strong>: +80&nbsp;000 максимум рабочих за уровень.</li>
            </ul>
            <p>Чтобы увеличить их фактическое количество (а не только потолок), нужна <strong>пища</strong> в запасе — население растёт естественным образом, пока оно накормлено.</p>

            <h2 id="scientifiques">Учёные</h2>
            <p>Учёные <strong>ускоряют Ваши исследования</strong>. Чем больше Вы их нанимаете, тем быстрее завершаются Ваши технологии.</p>
            <p>Внимание: каждый учёный требует небольшого ежедневного содержания. Не нанимайте с избытком.</p>

            <h2 id="defense">Оборонительная роль</h2>
            <p>Ваши <strong>рабочие участвуют в наземной обороне</strong> — но только при <strong>вторжении</strong> (когда враг хочет захватить Вашу планету). Во время обычного <strong>набега</strong> (простое разграбление) они остаются в укрытии.</p>
            <p>Альянсовые исследования типа «оборона рабочих» ещё больше усиливают их эффективность.</p>

            <h2 id="gerer">Грамотное управление населением</h2>
            <ul>
                <li>Подстраивайте количество рабочих под Вашу вместимость пищи.</li>
                <li>Не обязательно держать максимум населения на 100&nbsp;% постоянно: цельтесь в рентабельность.</li>
                <li>При голоде или эмбарго Ваши рабочие могут погибнуть — делайте запасы.</li>
            </ul>

            <h2 id="reserve-5000">Неприкосновенный резерв в 5 000 рабочих</h2>
            <p>Количество рабочих на планете <strong>никогда не может опуститься ниже 5 000</strong>. Этот резерв защищён: любое действие, которое опустило бы его ниже порога, блокируется с понятным сообщением. Это касается:</p>
            <ul>
                <li><strong>Найма обороны</strong> (Легионеры, Меха, учёные), который расходует рабочих.</li>
                <li><strong>Постройки кораблей</strong> на Космической верфи.</li>
                <li><strong>Погрузки рабочих в грузовой корабль</strong> для переброски.</li>
            </ul>
            <p>Кнопка «МАКС» на страницах производства учитывает этот резерв: она никогда не предложит Вам максимум, который опустошил бы Вашу планету ниже порога.</p>

    market:
        title: "Рынок и торговцы"
        category: "economy"
        order: 5
        tags: "рынок,торговцы,продажа,торговля,карго,биткойн"
        summary: "Как продавать Ваши ресурсы NPC-торговцам за Биткойны."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Кто такие торговцы?</h2>
            <p>Это <strong>неигровые персонажи</strong> (NPC), присутствующие на карте. Вы можете продавать им свой ниобий и свою воду в обмен на Биткойны.</p>
            <p>Они регулярно появляются в разных секторах вселенной — их положение видно на карте.</p>

            <h2 id="vendre">Как им продавать</h2>
            <ol>
                <li>Загрузите <strong>грузовой корабль</strong> ниобием и/или водой.</li>
                <li>Отправьте его к торговцу с миссией <strong>Разгрузка</strong>.</li>
                <li>Грузовой корабль прибывает, продажа совершается, Вы получаете Биткойны.</li>
                <li>Грузовой корабль возвращается к Вам автоматически.</li>
            </ol>

            <h2 id="immunite">Торговцы неприкосновенны</h2>
            <p>Торговцы <strong>неуязвимы для любых атак</strong>. Вы не можете ни совершить на них набег, ни вторгнуться, ни сражаться с ними. Их флоты никогда не участвуют в бою, даже если они находятся в той же точке, что и столкновение.</p>
            <p>Вывод: никаких неприятных сюрпризов, это надёжный торговый партнёр.</p>

            <h2 id="gain">Сколько это приносит?</h2>
            <p>Выплачиваемая цена зависит от ресурса (вода по текущему курсу приносит больше, чем ниобий) и от <strong>бонуса торговца</strong>, растущего с альянсовыми исследованиями, посвящёнными торговле.</p>
            <p>Интерфейс показывает Вам оценку дохода до подтверждения продажи. Проверяйте перед отправкой.</p>

            <h2 id="astuce">Совет</h2>
            <p>Вместо того чтобы позволять Вашим складам переполняться, отправляйте грузовой корабль регулярно. Это бесплатные Биткойны для финансирования Ваших исследований или Вашей армии.</p>

    recycling:
        title: "Переработка"
        category: "economy"
        order: 6
        tags: "переработка,обломки,cdr,переработчик,астероид,уран"
        summary: "После каждого боя остаются обломки. Собирать их — открытое месторождение."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Обломки: что это?</h2>
            <p>Каждый уничтоженный в бою корабль оставляет часть своей стоимости в виде <strong>обломков</strong>, парящих в космосе. Это называется <strong>CDR</strong> (Поле Ресурсов).</p>
            <p>Обломки содержат <strong>ниобий</strong>, <strong>воду</strong> и иногда <strong>уран</strong> (на специальных обломках, появляющихся самостоятельно на карте).</p>
            <p>На карте обломки обозначаются особой иконкой в точке столкновения.</p>

            <h2 id="skolko">Сколько обломков?</h2>
            <p>Поле содержит <strong>40 % стоимости постройки реально уничтоженных кораблей</strong> с обеих сторон. Каждый корабль возвращает свои собственные ресурсы: боевой корабль, дорогой по воде, оставляет прежде всего воду. Уцелевшие не оставляют ничего.</p>
            <p>Три особых случая:</p>
            <ul>
                <li>Против орд <strong>Ктулху</strong> ставка падает до <strong>20 %</strong>.</li>
                <li><strong>Груз</strong> полностью уничтоженного флота тоже попадает в поле, на 40 %. А потрёпанный победитель сохраняет весь свой трюм.</li>
                <li>Уничтоженная <strong>планетарная оборона</strong> и корабли, оплаченные <strong>очками войны</strong> (плазменный истребитель, боевой корвет, боевой корабль, каравелла), не оставляют <strong>никаких</strong> обломков: их постройка не стоит ни ниобия, ни воды.</li>
            </ul>
            <p><strong>Орбитальный бой</strong> (флот, сбитый турелями планеты в режиме атаки, или корабли, потерянные при прорыве защищённой орбиты) оставляет поле по тому же правилу.</p>

            <h2 id="comment">Как перерабатывать</h2>
            <ol>
                <li>Разблокируйте исследование <strong>Переработчик</strong>.</li>
                <li>Постройте <strong>переработчиков</strong> на Вашей Космической верфи.</li>
                <li>Отправьте флот переработчиков с миссией <strong>Переработка</strong> на координаты поля обломков.</li>
                <li>Они работают <strong>циклами по 5 минут</strong>: в каждом цикле собирают то, что могут.</li>
                <li>Заполнившись (или исчерпав поле), флот возвращается автоматически.</li>
            </ol>

            <h2 id="capacite">Сколько может принести один переработчик?</h2>
            <p>Каждый переработчик собирает <strong>1&nbsp;000 ресурсов за цикл в 5 минут</strong>, то есть 12&nbsp;000/час. <strong>Альянсовые исследования</strong> могут значительно увеличить эту вместимость.</p>

            <h2 id="strategie">Стратегия</h2>
            <ul>
                <li>После каждого боя немедленно отправляйте переработчиков: иначе их заберут Ваши противники.</li>
                <li>Защищайте их: одинокий переработчик — лёгкая цель.</li>
                <li>Обломки <strong>урана</strong> появляются спонтанно: это Ваш лучший источник урана вне боёв.</li>
                <li>Переработка очень выгодна — рассматривайте её как вторую экономику за Вашими шахтами.</li>
            </ul>

    daily_report:
        title: "Ежедневный отчёт"
        category: "economy"
        order: 7
        tags: "отчёт,ежедневный,дневной,баланс,доходы,расходы,налог"
        summary: "Каждый день в 18:59 UTC игра подводит Ваш итог: доходы, расходы, налоги. Следите внимательно."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Когда он приходит</h2>
            <p>Каждый день в <strong>18:59 UTC</strong> (19:59 по французскому зимнему времени, 20:59 — по летнему). Это фиксированная встреча для всех игроков сервера.</p>
            <p>Вы получаете подробный отчёт в свои Сообщения.</p>

            <h2 id="contenu">Что содержит отчёт</h2>
            <ul>
                <li><strong>Доходы</strong> — то, что сгенерировали Ваши рабочие.</li>
                <li><strong>Расходы на содержание</strong> — Легионеры, Меха, учёные, корабли, здания. Юниты в миссии обходятся дороже, чем размещённые на базе.</li>
                <li><strong>Налог мира</strong> — если Вы в мире с альянсом, потребовавшим налог.</li>
                <li><strong>Альянсовый налог</strong> — автоматический взнос в казну Вашего альянса (если настроен).</li>
                <li><strong>Итоговый баланс</strong> — доходы − расходы − налоги, добавляется к Вашему балансу.</li>
            </ul>

            <h2 id="quetes">Ежедневные квесты</h2>
            <p>Ежедневный отчёт <strong>обновляет Ваши 3 квеста</strong> дня. Если Вы выполнили <strong>все 3 квеста предыдущего дня</strong>, Вы получаете <strong>+250 ОВ</strong> в качестве бонусной награды.</p>

            <h2 id="danger">Опасность, которую нужно отслеживать</h2>
            <p>Если Ваш баланс уходит <strong>в минус</strong> после отчёта, наступает <strong>экономический Game Over</strong>: флоты уничтожены, баланс сброшен до 125&nbsp;000 Биткойнов, исследования частично понижены.</p>
            <p>Проверяйте отчёт каждый день. Если Ваши расходы слишком растут: замедлите набор, отзовите флоты из миссий или распустите юнитов.</p>

    exchange:
        title: "Обмен между игроками"
        category: "economy"
        order: 8
        tags: "обмен,альянс,ресурсы,биткойн,дар,передача"
        summary: "Как отправлять ресурсы или Биткойны союзнику (и ограничения этого)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Area Universe позволяет игрокам <strong>одного альянса</strong> помогать друг другу, передавая ресурсы или Биткойны. Это очень полезно для:</p>
            <ul>
                <li>Поднять члена, которого только что разграбили.</li>
                <li>Объединить усилия для дорогостоящего исследования или строительства.</li>
                <li>Снабдить союзника под эмбарго.</li>
            </ul>

            <h2 id="ressources">Отправка физических ресурсов</h2>
            <p>Чтобы отправить ниобий, воду или пищу: загрузите их в <strong>грузовой корабль</strong> и отправьте его с миссией <strong>Разгрузка</strong> на планету получателя. Ресурсы выгружаются автоматически по прибытии, грузовой корабль возвращается сам.</p>

            <h2 id="bitcoins">Отправка Биткойнов</h2>
            <p>Биткойны передаются через <strong>казну альянса</strong> (см. отдельную статью). Вы вносите в казну, а офицеры могут распределить или выплатить игроку.</p>

            <h2 id="limites">Ограничения</h2>
            <ul>
                <li><strong>Уран нельзя передавать</strong> свободно (стратегический ресурс).</li>
                <li>Обмены обязательно проходят через флот: нужны время и топливо.</li>
                <li>Планета под <strong>эмбарго</strong> может получать только от Вас самих или от союзника, не от постороннего.</li>
                <li>Нельзя отправлять ресурсы врагу или игроку вне альянса (кроме как через казну, по правилам).</li>
            </ul>

    fleet_creation:
        title: "Создать и отправить флот"
        category: "fleet"
        order: 1
        tags: "флот,создание,корабли,состав,верфь,миссия"
        summary: "От производства корабля до его прибытия в пункт назначения: полный путь."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Что Вам нужно</h2>
            <ul>
                <li><strong>Космическая верфь</strong> на Вашей активной планете.</li>
                <li>Необходимые ресурсы (ниобий и вода).</li>
                <li>Исследования, требуемые для желаемого корабля (например, <em>Утилитарные</em> для грузовых кораблей).</li>
            </ul>

            <h2 id="fabriquer">Этап 1 — Производство кораблей</h2>
            <p>На странице <strong>Космос</strong> выберите модель и количество. Производство занимает время и идёт в фоновом режиме.</p>

            <h2 id="composer">Этап 2 — Составить флот</h2>
            <p>После того как корабли будут готовы, перейдите на страницу <strong>Флоты</strong>. Вы можете:</p>
            <ul>
                <li>Выбрать, какие корабли будут задействованы.</li>
                <li>Загрузить <strong>ресурсы</strong> (для перевозки).</li>
                <li>Взять на борт <strong>Легионеров</strong> (для рейда/вторжения, с баржами).</li>
            </ul>

            <h2 id="envoyer">Этап 3 — Отправить флот</h2>
            <ol>
                <li>Выберите <strong>место назначения</strong>. Вы можете ввести его в формате <code>Галактика:Сектор:Позиция</code> или кликнуть на Карте.</li>
                <li>Выберите <strong>тип миссии</strong> (Обычная, Разгрузка, Переработка, Рейд, Вторжение…).</li>
                <li>Проверьте стоимость топлива (вода) и продолжительность полёта.</li>
                <li>Подтвердите.</li>
            </ol>
            <p>Флот появится в Вашем списке летящих флотов. При необходимости Вы можете <strong>отозвать</strong> его до прибытия.</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li>Не забудьте добавить <strong>переработчик</strong> к Вашим атакующим флотам, чтобы сразу собрать обломки.</li>
                <li>Никогда не отправляйте всю Вашу оборону сразу: оставьте достаточно, чтобы удержать планету.</li>
                <li>Возврат флота после миссии не стоит дополнительного топлива (уже учтено заранее).</li>
            </ul>

    ship_types:
        title: "Типы кораблей"
        category: "fleet"
        order: 2
        tags: "корабли,истребитель,корвет,фрегат,линкор,крейсер,эсминец,грузовой,зонд"
        summary: "Все корабли игры: утилитарные, лёгкие, тяжёлые, специальные — и как их использовать."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Утилитарные корабли</h2>
            <p>Они не сражаются. Они служат для транспортировки, разведки, переработки, колонизации.</p>
            <table>
                <tr><th>Корабль</th><th>Роль</th><th>Вместимость</th></tr>
                <tr><td>Зонд</td><td>Шпионаж за планетой.</td><td>—</td></tr>
                <tr><td>Грузовой корабль I</td><td>Лёгкая перевозка.</td><td>3&nbsp;000</td></tr>
                <tr><td>Грузовой корабль V</td><td>Средняя перевозка.</td><td>10&nbsp;000</td></tr>
                <tr><td>Грузовой корабль X</td><td>Большая перевозка.</td><td>25&nbsp;000</td></tr>
                <tr><td>Каравелла</td><td>Премиум-грузовик: самый большой и быстрый из грузовых кораблей. Оплачивается Очками войны (25) + 15&nbsp;рабочих за произведённую единицу.</td><td>40&nbsp;000</td></tr>
                <tr><td>Колонизатор</td><td>Основать новую планету.</td><td>—</td></tr>
                <tr><td>Переработчик</td><td>Собирает обломки после боя.</td><td>1&nbsp;000 за цикл в 5 мин</td></tr>
                <tr><td>Баржа</td><td>Перевозка Легионеров для рейда или вторжения.</td><td>1&nbsp;000 Легионеров</td></tr>
                <tr><td>Moon Maker</td><td>Создать луну на пустой позиции с достаточным количеством обломков (мин. 2 млн ниобия и 2 млн воды).</td><td>—</td></tr>
                <tr><td>Радар (корабль)</td><td>Расширить Ваше обнаружение в секторе.</td><td>—</td></tr>
                <tr><td>Глушитель (корабль)</td><td>Глушить вражеское обнаружение.</td><td>—</td></tr>
                <tr><td>Корабль-носитель</td><td>Престижный флагманский корабль. Замедляет флот.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Боевые корабли</h2>
            <p>Они разделены на <strong>классы</strong> (от самого лёгкого до самого тяжёлого). У каждого класса свои сильные и слабые стороны; сбалансированный бой смешивает классы.</p>
            <table>
                <tr><th>Класс</th><th>Примеры</th><th>Профиль</th></tr>
                <tr><td>Лёгкий</td><td>Истребитель, Тяжёлый истребитель, Боевой истребитель</td><td>Быстрый, недорогой, многочисленный. Хорош против корветов.</td></tr>
                <tr><td>Средний</td><td>Корвет, Лазерный корвет, Боевой корвет</td><td>Сбалансированный. Хорош против истребителей и фрегатов.</td></tr>
                <tr><td>Тяжёлый</td><td>Фрегат, Плазменный фрегат</td><td>Большой урон на дальней дистанции.</td></tr>
                <tr><td>Очень тяжёлый</td><td>Линкор</td><td>Стойкий, прочный урон.</td></tr>
                <tr><td>Капитальный</td><td>Крейсер, Броненосец, Эсминец</td><td>Колоссальный, очень дорогой, опустошительный. Ядро Вашего флота.</td></tr>
            </table>

            <h2 id="factions">Боевые фракции</h2>
            <p>Некоторые корабли принадлежат к <strong>фракции</strong>: <em>ракета</em>, <em>лазер</em> или <em>плазма</em>. Фракции контрят друг друга (камень-ножницы-бумага), с бонусом +20&nbsp;% мощности против целевой фракции.</p>

            <h2 id="bonus-cargo">Вместимость перевозок</h2>
            <p>Вместимость грузовых кораблей увеличивается с <strong>альянсовыми исследованиями</strong>, посвящёнными грузовым кораблям. Полезно, когда Вы начинаете играть на больших расстояниях.</p>

    ship_customization:
        title: "Настройка Ваших кораблей"
        category: "fleet"
        order: 3
        tags: "настройка,корабли,очки,броня,точность,оружие"
        summary: "40 бесплатных очков каждый день для улучшения брони, точности и оружия Ваших кораблей."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>У каждой модели корабля есть три характеристики, которые Вы можете развивать:</p>
            <ul>
                <li><strong>Броня</strong> — сколько он может выдержать.</li>
                <li><strong>Точность</strong> — поднимает наихудший возможный результат каждого залпа (ни один выстрел никогда не промахивается, но плохо нацеленный залп наносит меньше урона).</li>
                <li><strong>Оружие</strong> — наносимый урон.</li>
            </ul>
            <p>Каждый день игра предоставляет Вам <strong>40 очков для свободного распределения</strong> между всеми Вашими кораблями. Это бесплатно, не забывайте.</p>

            <h2 id="utiliser">Как их использовать</h2>
            <p>Перейдите на страницу <strong>Настройка</strong> (меню Космос). Для каждой модели отрегулируйте ползунки. Ваш выбор применяется ко <strong>всем кораблям этой модели</strong> (текущим и будущим). Эти три характеристики развиваются независимо друг от друга: вложение очков в броню или оружие модели никогда не снижает её точность.</p>

            <h2 id="chtenie">Как читать наведение на экране</h2>
            <p>Вкладка <strong>Статистика</strong> Космической верфи показывает по каждой модели, сколько наведения Вы вложили относительно кредита этой модели (например <code>676 / 676</code> для Эсминца), и вытекающий из этого <strong>множитель урона</strong>&nbsp;: <strong>×0,94</strong> при полном наведении, <strong>×0,66</strong> без единого вложенного очка.</p>
            <p>Это не шанс попадания&nbsp;: <strong>ни один выстрел никогда не промахивается</strong>. Лучшее наведение поднимает нижнюю границу Вашего урона, но не верхнюю. Это то же число, что на странице управления флотом, во вкладке «Оборона» и в боевых отчётах — четыре экрана наконец сравниваются напрямую. Для ориентира&nbsp;: оборона планеты стреляет с <strong>×1,06</strong>, то есть лучше, чем флот с полным наведением.</p>

            <h2 id="reset">Сбросы</h2>
            <p>Вы можете сбрасывать очки <strong>один раз в 96 часов</strong>, без ограничения общего числа: если Ваша стратегия меняется или боевая система развивается, верните все потраченные очки и перераспределите их. После сброса кнопка остаётся неактивной, а обратный отсчёт показывает время до следующего сброса.</p>

            <h2 id="modes-speciaux">Режимы серверов с максимальными исследованиями</h2>
            <p>В некоторых режимах (Battle Royale, Доминирование, Search &amp; Destroy) <strong>все Ваши очки разблокированы с первого дня</strong> (1&nbsp;375 очков доступно сразу вместо 40/день).</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li>Не распыляйте Ваши очки на слишком много моделей: сосредоточьтесь на тех, которые Вы действительно массово используете.</li>
                <li><strong>Переработчикам</strong> и <strong>грузовым кораблям</strong> полезно иметь немного брони, чтобы пережить засады.</li>
                <li><strong>Истребители</strong> больше выигрывают от точности и оружия, чем от брони (они умирают быстро).</li>
            </ul>

    fleet_missions:
        title: "Типы миссий"
        category: "fleet"
        order: 4
        tags: "миссия,атака,транспорт,колонизация,переработка,шпионаж,ядерная,рейд,вторжение"
        summary: "Каждая миссия отдаёт свой приказ Вашему флоту. Вот как выбрать правильную."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Когда Вы отправляете флот, Вы задаёте ему <strong>тип миссии</strong>. Именно миссия определяет, что произойдёт по прибытии. Некоторые типы требуют специфических кораблей.</p>

            <h2 id="missions">Доступные типы</h2>
            <table>
                <tr><th>Миссия</th><th>Что она делает</th><th>Требуемые корабли</th></tr>
                <tr><td><strong>Обычная</strong> (Атака)</td><td>Флот направляется в целевую точку. Если там враг — автоматический бой.</td><td>Любые корабли</td></tr>
                <tr><td><strong>Разгрузка</strong></td><td>Доставляет ресурсы на союзную планету или торговцу, затем возвращается.</td><td>Минимум один грузовой корабль</td></tr>
                <tr><td><strong>Колонизация</strong></td><td>Основывает новую планету на пустом месте.</td><td>Колонизатор</td></tr>
                <tr><td><strong>Рейд (Грабёж)</strong></td><td>Сражается с наземной обороной, чтобы украсть ресурсы, не захватывая планету.</td><td>Баржи + Легионеры</td></tr>
                <tr><td><strong>Вторжение</strong></td><td>Сражается с наземной обороной, чтобы <strong>захватить планету</strong> у противника.</td><td>Баржи + Легионеры</td></tr>
                <tr><td><strong>Шпионаж</strong></td><td>Отправляет зонд, чтобы получить отчёт о вражеской обороне.</td><td>Минимум один зонд</td></tr>
                <tr><td><strong>Луна</strong></td><td>Создаёт луну на пустой позиции с достаточным количеством обломков (мин. 2 млн ниобия и 2 млн воды).</td><td>Moon Maker</td></tr>
                <tr><td><strong>Радар</strong></td><td>Разворачивает радарный спутник на месте (расширенное обнаружение).</td><td>Корабль-радар</td></tr>
                <tr><td><strong>Глушитель</strong></td><td>Разворачивает спутник-глушитель (скрывает Ваши передвижения).</td><td>Корабль-глушитель</td></tr>
                <tr><td><strong>Посадка</strong></td><td>Переносит корабли напрямую в гарнизон одной из Ваших планет.</td><td>Ваша собственная планета</td></tr>
                <tr><td><strong>Ядерная</strong></td><td>Сбрасывает ядерную бомбу на целевую планету.</td><td>Ядерная бомба на борту</td></tr>
                <tr><td><strong>Переработка</strong></td><td>Собирает обломки с поля боя.</td><td>Минимум один переработчик</td></tr>
            </table>

            <h2 id="choisir">Как выбрать правильную миссию</h2>
            <ul>
                <li>Хотите <strong>биткойнов</strong>? → Разгрузка у торговца.</li>
                <li>Хотите <strong>разведданных</strong>? → Шпионаж.</li>
                <li>Хотите <strong>ослабить</strong> врага? → Рейд (грабёж).</li>
                <li>Хотите <strong>захватить</strong> его планету? → Вторжение.</li>
                <li>Хотите <strong>собрать обломки</strong>? → Переработка.</li>
            </ul>

    fleet_movement:
        title: "Перемещение и расстояние"
        category: "fleet"
        order: 5
        tags: "перемещение,расстояние,скорость,полёт,топливо,координаты"
        summary: "Как рассчитывается продолжительность полёта, расход топлива и что замедляет Ваш флот."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Как работают координаты</h2>
            <p>Каждая позиция во вселенной записывается в формате <strong>Галактика:Сектор:Позиция</strong>. Пример: <code>1:5:12</code> = галактика 1, сектор 5, позиция 12.</p>
            <ul>
                <li><strong>Галактика</strong> содержит несколько секторов (сетка 10×10).</li>
                <li><strong>Сектор</strong> содержит 25 позиций (сетка 5×5).</li>
            </ul>

            <h2 id="distance">Как рассчитывается расстояние</h2>
            <ul>
                <li><strong>Тот же сектор</strong> — короткое расстояние, быстрый полёт.</li>
                <li><strong>Та же галактика, другой сектор</strong> — среднее расстояние.</li>
                <li><strong>Другая галактика</strong> — большое фиксированное расстояние. Требует исследование <strong>Гиперпространство</strong>.</li>
            </ul>
            <p>Интерфейс всегда показывает расчётное расстояние и продолжительность до того, как Вы подтвердите отправку.</p>

            <h2 id="duree">Продолжительность полёта</h2>
            <p>Она зависит от:</p>
            <ul>
                <li><strong>расстояния</strong>;</li>
                <li><strong>скорости самого медленного корабля</strong> Вашего флота (флот движется со скоростью самого медленного);</li>
                <li><strong>скорости сервера</strong> (некоторые сервера ускорены).</li>
            </ul>
            <p><strong>Корабль-носитель</strong> (mothership) престижен, но <strong>замедляет флот на 10&nbsp;%</strong>. Стоит учитывать. Он также <strong>снижает радарную сигнатуру флота на 10&nbsp;%</strong> (маскировка) — обзор Империи же показывает реальное общее число ваших кораблей.</p>

            <h2 id="carburant">Топливо</h2>
            <p>Топливо — это <strong>вода</strong>. Чем <strong>больше</strong> Ваш флот (общая масса), тем больше он расходует. Чем <strong>длиннее</strong> маршрут, тем больше он расходует.</p>
            <p>Миссия <strong>Разгрузка</strong> потребляет в два раза больше (грузовой корабль идёт гружёным и возвращается гружёным).</p>
            <p>Расчётное топливо отображается перед запуском флота: проверьте, что у Вас достаточно воды на складе.</p>

            <h2 id="rappel">Отозвать летящий флот</h2>
            <p>Вы можете <strong>отозвать</strong> флот, пока он не прибыл. Он разворачивается и возвращается домой. Типичный случай: союзник атакует раньше Вас — Вы отменяете своё наступление.</p>

            <h2 id="night-slowdown">🌙 Ночное замедление</h2>
            <p>Наступательный флот (боевые корабли или наземные войска), направленный к планете врага, летит <strong>в ×10 дольше</strong>, если прибывает в <strong>ночное окно защитника</strong> (23:00–06:00 по его часовому поясу). Отображаемая продолжительность уже включает этот множитель.</p>
            <p>Иконка 🌙 на карте указывает на игроков, находящихся в ночном окне. При отправке флота отображается модальное окно подтверждения, если прибытие попадает в ночь противника. Часовой пояс определяется автоматически и может быть изменён не чаще одного раза в месяц.</p>

    fleet_management:
        title: "Продвинутое управление флотами"
        category: "fleet"
        order: 6
        tags: "управление,флот,разделить,объединить,передать,перегруппировать"
        summary: "Разделить, перегруппировать, высадить: продвинутые манипуляции для оптимизации Ваших перемещений."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Доступные операции</h2>
            <ul>
                <li><strong>Разделить</strong> — отделить часть кораблей в новый флот.</li>
                <li><strong>Перегруппировать</strong> — объединить несколько Ваших флотов, находящихся в одном месте.</li>
                <li><strong>Посадка</strong> — передать корабли флота в гарнизон планеты. Высаживаемые войска и груз должны умещаться в пределах вместимости планеты; флот без войск и груза садится всегда, даже на уже заполненную планету.</li>
                <li><strong>Отозвать</strong> — развернуть летящий флот.</li>
                <li><strong>Передать в порт</strong> — поставить флот на «стоянку» на планете без слияния.</li>
            </ul>

            <h2 id="en-vol">Что нельзя делать</h2>
            <ul>
                <li>Изменять состав флота <strong>в полёте</strong> (груз, корабли).</li>
                <li>Менять миссию летящего флота (кроме отзыва).</li>
                <li>Телепортировать флот (магических сокращений нет!).</li>
            </ul>

            <h2 id="astuces">Случаи использования</h2>
            <ul>
                <li><strong>Разделить перед боем</strong>: оставьте часть флота в резерве, отправьте авангард.</li>
                <li><strong>Перегруппировать после рейда</strong>: объедините несколько возвратов для большей наглядности.</li>
                <li><strong>Посадка</strong>: перевести флот в орбитальную защиту планеты.</li>
            </ul>

    espionage:
        title: "Шпионаж и зонды"
        category: "fleet"
        order: 7
        tags: "шпионаж,зонд,шпион,обнаружение,информация,разведка"
        summary: "Знать, что имеет противник, до того как ударить: отправка зондов, объяснение."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Отправить зонд</h2>
            <ol>
                <li>Произведите <strong>зонды</strong> на Вашей Космической верфи (разблокируются исследованием Утилитарные).</li>
                <li>Перейдите на страницу Флоты, добавьте минимум 1 зонд.</li>
                <li>Выберите миссию <strong>Шпионаж</strong>, укажите цель.</li>
                <li>Отправьте — зонд летит на полной скорости.</li>
            </ol>
            <p>По прибытии он сканирует планету и возвращает Вам отчёт.</p>

            <h2 id="reussite">Что определяет успех?</h2>
            <p>Молчаливая дуэль противопоставляет Ваш <strong>уровень Шпионажа</strong> уровню защитника:</p>
            <ul>
                <li>Если Ваш уровень <strong>больше или равен</strong>, отчёт подробный.</li>
                <li>Если Ваш уровень ниже, Вы получаете либо частичную информацию, либо ничего.</li>
            </ul>
            <p>Чтобы повысить Ваш шпионаж: исследование <strong>Волна</strong> уровня 5, затем исследование <strong>Шпионаж</strong>.</p>

            <h2 id="rapport">Что раскрывает успешный отчёт</h2>
            <ul>
                <li><strong>Ресурсы</strong>, присутствующие на планете.</li>
                <li>Список <strong>зданий</strong> и их уровень.</li>
                <li><strong>Флоты</strong> на орбите.</li>
                <li><strong>Наземную и орбитальную оборону</strong>.</li>
                <li><strong>Легионеров, Мехов, рабочих</strong>.</li>
            </ul>
            <p>Ровно то, что нужно, чтобы решить: рейд, вторжение или отступление.</p>

            <h2 id="detection">Могут ли Вас обнаружить?</h2>
            <p>Да. Если у защитника достаточно хороший <strong>Радар</strong>, он получает оповещение о шпионаже (не обязательно зная, что именно было увидено).</p>
            <p>И наоборот, планета, оснащённая <strong>Глушителем</strong>, может заглушить Ваш зонд или сделать его ненадёжным.</p>

    spatial_combat:
        title: "Космический бой"
        category: "combat"
        order: 1
        tags: "бой,космос,флот,сражение,блок,раунд,щит,точность,потери,урон,заслон,истребители"
        summary: "Полный ход боя между флотами: сила сторон, дуэль щитов, раунды огня, завершение боя и точный расчёт ваших потерь."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="start">Когда начинается бой</h2>
            <p>Как только флот с меткой <strong>[Атака]</strong> оказывается в одной точке (Галактика:Сектор:Позиция) с вражеским флотом, бой начинается автоматически. Ваши флоты в той же точке сначала сливаются в одну армаду.</p>
            <p>Все присутствующие флоты делятся на <strong>две стороны</strong> по дипломатии: ваш альянс и его пакты с одной стороны, враг и его союзники с другой. Сторона без единого орудия (грузовые корабли, переработчики, зонды) не сражается: она уничтожается, и отчёт это отмечает.</p>
            <p><strong>Альянсы в состоянии войны, никто не вооружён</strong> — два флота альянсов, находящихся в состоянии войны, начинают бой, только если хотя бы один из них несёт корабельное оружие. Два полностью безоружных флота (грузовые корабли, разведчики, переработчики), пересекающиеся друг с другом, просто не вступают в бой: Ваши флоты не блокируются, и никого не уведомляют зря.</p>
            <p><strong>Случай рейдов и вторжений</strong> — когда этот бой вызван рейдом или вторжением против охраняемой планеты (см. статьи <em>Вторжение на планету</em> и <em>Рейды (грабёж)</em>), именно это событие ставит метку <strong>[Атака]</strong> на Ваш атакующий флот. Она никогда не снимается впоследствии: выживший флот рейда или вторжения остаётся помеченным как враждебный — турели в режиме атаки смогут атаковать его позже, и он снова будет захвачен при следующем обнаружении космического боя, как только столкнётся с врагом.</p>

            <h2 id="sila">Сила стороны</h2>
            <p>Бой сводит <strong>суммарные показатели</strong> двух сторон: игра складывает броню, щит, ракеты, лазеры и плазму всех задействованных кораблей.</p>
            <ul>
                <li><strong>Защитник у себя дома</strong> — турели и броня обороны планеты присоединяются к его стороне; планетарный Щит даёт +50&nbsp;000 брони, Большой щит +600&nbsp;000. Вооружённый флот соальянсника, стоящий на вашей планете, тоже получает эту поддержку.</li>
                <li><strong>Точность</strong> — среднее точностей флотов стороны (набирается кастомизацией кораблей).</li>
                <li><strong>Политика альянса</strong> — каждый режим бьёт своего соперника: Демократия бьёт Коммунизм, тот бьёт Фашизм, а тот — Демократию. Если политика <strong>атакующего</strong> бьёт политику защитника, все его орудия получают +20&nbsp;%.</li>
                <li><strong>Улучшения альянса</strong> — до +5&nbsp;% на каждый тип оружия, броню и щит, и до +10&nbsp;% на планетарную оборону.</li>
                <li><strong>Герои</strong> — бонусы к атаке, защите, щиту и точности от навыков и предметов. Герой с <strong>Устрашением</strong> ослабляет оружие противника; <strong>Тактик</strong> усиливает первый залп своей стороны.</li>
            </ul>

            <h2 id="oborona-planety">Ваши турели сражаются в этом же бою</h2>
            <p>Когда оборона Вашей планеты присоединяется к стороне, этот бой <strong>и есть</strong> теперь весь бой Вашей планеты: отдельного орбитального боя для Ваших турелей после него больше не будет. Они целятся со своей собственной точностью (эскорт с низкой точностью рядом с ними больше не портит их стрельбу), и в этом бою они несут <strong>реальные потери</strong>: пропорциональные урону, который получает Ваша сторона в случае победы, и <strong>полные</strong> — турели, щиты, космическая база, режим атаки отключён — в случае поражения Вашей стороны. Это верно независимо от того, включён ли режим атаки планеты: как только турели открывают огонь, их теперь можно уничтожить. Планету, которую охраняет один из Ваших флотов или <strong>вооружённый</strong> флот союзника по альянсу, больше нельзя ограбить или захватить без боя.</p>

            <h2 id="shchity">Дуэль щитов</h2>
            <p>Каждый залп сначала бьёт по щиту противника. Его <strong>пробивная мощь</strong> равна:</p>
            <p><code>ракеты ÷ 7 + плазма × 4 + лазеры × 2</code></p>
            <p>Плазма превосходна против щитов, ракеты им почти не страшны — и это преимущество теперь сохраняется при любом масштабе боя, что десять на десять, что сто миллионов на сто миллионов. В каждом залпе часть урона, превышающая пробивную мощь, поглощается щитом противника до полного исчерпания его заряда; остаток — и всё, что переполняет уже опустевший щит, — бьёт прямо по корпусу. Поэтому щит никогда не может заблокировать весь залп целиком: против вооружённого противника ваш корпус всегда что-то получает, начиная с первого раунда.</p>
            <p>Щит флота больше не резерв, автоматически восстанавливающийся до 100&nbsp;% перед каждой битвой: это <strong>постоянный заряд</strong>, который расходуется во время боя и восполняется лишь на 10&nbsp;% каждые 3 часа (30 часов, чтобы дойти от нуля до полного), даже когда Вы разделяете, сливаете или расформировываете флот либо перемещаете корабли между флотом и поверхностью планеты. Отчёт о бое показывает этот заряд в начале и в конце сражения; список флотов показывает процент каждого флота, а страница управления флотом — щит, реально взятый в бой, общую ёмкость, текущий процент и время, оставшееся до полной зарядки. Запас кораблей на поверхности тоже несёт заряд, который не восстанавливается: любой флот, созданный или пополненный с этой поверхности, наследует его, и он показан в окне создания флота и во вкладке «Корабли» управления флотом. Одно исключение: фиксированный щит, который даёт <strong>Корабль-носитель</strong>, никогда не разряжается — его генератор работает постоянно, а заряд расходует только щит остальных ваших кораблей — поэтому страница управления показывает и абсолютное значение щита, а не только процент.</p>

            <h2 id="raundy">Раунды огня</h2>
            <p>Бой длится не более <strong>100 раундов</strong>. Каждый раунд залп наносит:</p>
            <p><code>(ракеты + плазма ÷ 2 + лазеры × 2) × множитель</code></p>
            <p>Множитель берётся из броска точности: игра выбирает число между вашей точностью и 100 и делит его на 80 — результат от <strong>×0,3 до ×1,2</strong>. Высокая точность не усиливает залпы, она убирает плохие броски. Часть, прошедшая сквозь щит противника (см. выше), вычитается из суммарной брони этой стороны.</p>

            <h2 id="konec">Завершение боя</h2>
            <ul>
                <li><strong>Броня стороны падает до 0</strong> — она побеждена; все её флоты уничтожаются вместе с грузом.</li>
                <li><strong>Достигнуто 100 раундов</strong> — побеждает сторона, сохранившая больше брони; при полном равенстве побеждает атакующий.</li>
                <li><strong>Страховка победителя</strong> — даже сильно потрёпанная победившая сторона никогда не теряет больше 95&nbsp;% своей исходной брони: победа никогда не бывает истреблением, каким бы ни был перевес сил.</li>
            </ul>

            <h2 id="poteri">Ваши потери: то, что вы реально получили</h2>
            <p>Правило умещается в одну фразу: <strong>ваши потери следуют из реально полученного урона по корпусу</strong> — никогда из того, что поглотил ваш щит: это не стоит вам ни одного корабля. Этот урон по корпусу распределяется между вашим <strong>заслоном</strong> (Истребители, Тяжёлые истребители, Военные истребители — единственные корабли без щита) и вашей <strong>линией</strong> (все остальные типы) пропорционально броне каждой группы: каждый тип теряет одну и ту же долю самого себя. Отчёт показывает два счётчика: урон по корпусу и урон по щиту.</p>
            <p>Ваш заслон не защищает линию бесконечно: он отводит на себя не более <strong>половины</strong> урона, предназначенного линии, и только пока у него самого остаётся броня, чтобы его принять — один-единственный истребитель не может впитать урон, рассчитанный на весь флот. Совсем без заслона линия принимает весь урон по корпусу целиком.</p>
            <p>Прямые следствия: если враг едва вас задел, потери почти нулевые; вдесятеро более опасный враг обойдётся примерно вдесятеро дороже — включая истребители. Побеждённая сторона теряет всё.</p>

            <h2 id="posle">После боя</h2>
            <ul>
                <li><strong>Обломки</strong> — 40&nbsp;% стоимости постройки (ниобий и вода) каждого уничтоженного корабля обеих сторон падает на орбиту (20&nbsp;%, если участвует Ктулху или пришелец). Груз истреблённых флотов добавляется. Переработчик в победившем флоте собирает сразу.</li>
                <li><strong>Очки Войны</strong> — получают обе стороны, пропорционально уничтоженной вражеской мощи; победитель получает намного больше, а утешительная выплата побеждённого никогда не превышает пятой части того, что получил бы победитель за тот же флот.</li>
                <li><strong>Герои</strong> — главный герой на борту уничтоженного флота может быть захвачен победителем (это шанс, а не гарантия). Побеждённый <strong>второстепенный герой</strong> подчиняется другому, окончательному правилу без всякой случайности: см. статью <em>Второстепенные герои</em>.</li>
                <li><strong>Отчёты</strong> — каждый командир получает детали: силы, залпы, полученный урон, потери, а также судьбу любого захваченного или казнённого второстепенного героя.</li>
            </ul>

            <h2 id="sovety">Советы</h2>
            <ul>
                <li>Всегда держите <strong>заслон истребителей</strong>: дешёвый, он принимает урон по корпусу вместо ваших тяжёлых кораблей.</li>
                <li>Вкладывайтесь в <strong>щит</strong>: чем больше его заряд, тем больше урона он поглощает до того, как урон достигнет корпуса — но ни один щит не останавливает залп целиком, корпус всегда получает свою часть.</li>
                <li>Стройте <strong>плазму</strong>, чтобы быстро пробивать чужие щиты, и <strong>лазеры</strong> для урона по корпусу.</li>
                <li>Выбирайте <strong>политику альянса</strong>, глядя на политику любимых целей: +20&nbsp;% к оружию в атаке лишними не будут.</li>
            </ul>

    invasion:
        title: "Вторжение на планету"
        category: "combat"
        order: 2
        tags: "вторжение,планета,солдаты,танки,баржи,захват,развёртывание,тактика"
        summary: "Захватите вражескую планету: десантные баржи, высадка, наземный бой и тактические развёртывания."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Вторжение — это атака с целью <strong>взять под контроль</strong> вражескую планету. Ваш флот высаживает Легионеров (через баржи), которые сражаются с гарнизоном на земле.</p>
            <p>Это отличается от <strong>рейда</strong> (который грабит, но не захватывает планету): успешное вторжение отдаёт Вам всю планету целиком.</p>

            <h2 id="conditions">Что нужно для вторжения</h2>
            <ul>
                <li>Состоять в <strong>альянсе</strong>.</li>
                <li>Играть на сервере в режиме <strong>PvP</strong> (например: Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Иметь <strong>десантные баржи</strong> и <strong>Легионеров</strong> на борту флота.</li>
                <li>Цель должна быть обитаемой планетой (не торговец, не союзник, не тот, с кем у Вас мир или пакт).</li>
                <li>В этом же месте не должен быть запланирован космический бой.</li>
            </ul>

            <h2 id="barges">Роль десантных барж</h2>
            <p>Баржи — это транспортные средства, которые высаживают Ваших Легионеров на землю. Каждая баржа перевозит <strong>1&nbsp;000 Легионеров</strong> (вместимость увеличивается исследованиями альянса).</p>
            <p>Если у Вас Легионеров больше, чем мест, избыточные <strong>остаются на орбите и не сражаются</strong>. При поражении Ваши баржи <strong>захватываются защитником</strong>.</p>

            <h2 id="orbital">Фаза 1 — Бой на орбите (иногда)</h2>
            <p>Две ситуации могут остановить Вас ещё до высадки:</p>
            <ul>
                <li>Планета-цель активировала <strong>режим атаки</strong>: её турели и щиты сначала вступают в бой с Вашим флотом. Если <strong>Вы проигрываете</strong>, Ваш флот уничтожен — вторжение сразу прекращается. Если <strong>Вы побеждаете</strong>, орбитальная оборона уничтожена, и Ваш флот продолжает путь (ослабленным).</li>
                <li>Планету-цель охраняет <strong>вооружённый</strong> флот владельца или <strong>вооружённый</strong> флот союзника по его альянсу, уже находящийся на орбите (одинокий разведчик или транспорт больше не считаются): Ваше прибытие вызывает <strong>бой</strong> против этого защитника и турелей планеты вместе — даже если планета не в режиме атаки. Этот бой никогда не начинается против партнёра по миру, партнёра по пакту, союзника, Вашего собственного альянса или на сервере PvE: он подчиняется тем же дипломатическим правилам, что и обычное вторжение. Он отменяет Ваше текущее вторжение: если Вы его выиграете, нужно будет <strong>заново запустить</strong> вторжение, чтобы действительно высадиться — а если планета всё ещё охраняется в этот момент, клик на «Вторгнуться» с орбиты тоже будет <strong>отклонён</strong>: сначала активируйте режим атаки собственного флота, чтобы вызвать бой. Поскольку вторжение всегда несёт на борту Легионеров, это условие выполняется автоматически на стороне атакующего — бой начинается независимо от того, есть ли у Вашего флота оружие кораблей.</li>
            </ul>
            <p><strong>Ловушка, о которой нужно знать: флот вторжения без боевых кораблей уничтожается в этом бою.</strong> Легионеров и барж достаточно, чтобы отправить вторжение, но если Ваш флот не несёт ни одного орудия корабля, он вступает в этот предварительный бой с нулевой огневой мощью — защитники уничтожают его полностью, вместе с баржами и Легионерами, ещё до высадки. <strong>Всегда сопровождайте свои флоты вторжения боевыми кораблями</strong> — см. статью <em>Рейды (грабёж)</em> о той же ловушке при грабеже.</p>

            <h2 id="combat">Фаза 2 — Наземный бой</h2>
            <p>Наземный бой проходит в <strong>максимум 10 раундах</strong>. В каждом раунде обе стороны обмениваются потерями.</p>
            <table>
                <tr><th>Юнит</th><th>Роль</th></tr>
                <tr><td><strong>Легионер</strong></td><td>Атака и оборона. Усиливаются исследованием «Колючая проволока» для обороны.</td></tr>
                <tr><td><strong>Мех</strong></td><td>Мощный юнит тяжёлой обороны (максимум 500 на планету).</td></tr>
                <tr><td><strong>Рабочий</strong></td><td>Пассивная оборона, <strong>только при вторжении</strong> (не при рейде).</td></tr>
            </table>
            <p><strong>Атакующий побеждает только если</strong> все войска защитника уничтожены <strong>и</strong> у него остался хотя бы 1 живой Легионер. Иначе <strong>защитник побеждает за счёт преимущества местности</strong>.</p>

            <h2 id="deploiement">Тактические развёртывания защитника</h2>
            <p>Защитник мог выбрать <strong>тактическое развёртывание</strong>, невидимое для Вас. Имейте в виду: оно может перевернуть ситуацию, которая казалась заведомо выигрышной.</p>
            <table>
                <tr><th>Развёртывание</th><th>Эффект</th><th>Недостаток</th></tr>
                <tr><td><strong>Сбалансированное</strong></td><td>Без бонуса и штрафа.</td><td>Нейтрально.</td></tr>
                <tr><td><strong>Укреплённое</strong></td><td>+30&nbsp;% к наземной обороне.</td><td>−20&nbsp;% к контратаке.</td></tr>
                <tr><td><strong>Партизанское</strong></td><td>Рабочие +150&nbsp;% к обороне.</td><td>Легионеры на −50&nbsp;%.</td></tr>
                <tr><td><strong>Последний бастион</strong></td><td>+50&nbsp;%, если войска падают ниже 30&nbsp;%.</td><td>Условный.</td></tr>
                <tr><td><strong>Выжженная земля</strong></td><td>Без активного бонуса.</td><td>Если Вы проигрываете рейд, 50&nbsp;% награбленного (не вывезенного) уничтожается.</td></tr>
            </table>

            <h2 id="victoire">Если Вы выиграли вторжение</h2>
            <ul>
                <li><strong>Захват</strong> — планета переходит к Вам со всеми зданиями. Рабочие сбрасываются до базового уровня (~2&nbsp;000).</li>
                <li><strong>Планета Ктулху</strong> — если Вы отбиваете планету, захваченную Ктулху, она освобождается (здания обнуляются, награда в уране).</li>
                <li><strong>Нет места для колонизации?</strong> Завоёванная планета становится базой Ктулху: Вы её не оставляете себе.</li>
            </ul>
            <p><strong>Очереди производства</strong> не переходят вместе с захваченной планетой: и корабли, и оборона (турели или войска), уже оплаченные, но ещё не доставленные, теряются при захвате — заказ, сделанный побеждённым, никогда не меняет владельца. То, что было доставлено до штурма, напротив, находится на поверхности и переходит вместе с планетой.</p>
            <p>Если на захваченной планете находится вражеский <strong>второстепенный герой</strong>, его судьба решается немедленно: Вы <strong>захватываете</strong> его, если у Вас есть Тюрьма (уровня 1 или выше), иначе он будет <strong>казнён</strong>. Рейд же никогда не захватывает планету и потому никогда не ставит героя под угрозу. Подробности в статье <em>Второстепенные герои</em>.</p>

            <h2 id="gameover">Уничтожение защитника</h2>
            <p>Если защитник теряет свою <strong>последнюю планету</strong>, он исключается с сервера. Вы получаете всё: Биткойны, выжившие флоты и связанные Очки войны.</p>

            <h2 id="defaite">Если Вы проиграли вторжение</h2>
            <p><strong>Баржи захватываются защитником</strong>. Высаженные Легионеры потеряны. Это дорогостоящее поражение: перед вторжением проводите разведку.</p>

    raid:
        title: "Рейды (грабёж)"
        category: "combat"
        order: 3
        tags: "рейд,грабёж,воровство,ресурсы,бункер,баржи"
        summary: "Грабьте ресурсы вражеской планеты, не пытаясь её захватить."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Что такое рейд?</h2>
            <p>Рейд — это наземная атака, цель которой <strong>украсть ресурсы</strong>. Вы не забираете планету: Вы уходите с добычей. Важное следствие: рейд, даже успешный, никогда не захватывает планету, поэтому там <strong>никогда не захватывается и не казнится второстепенный герой</strong> — ни у атакующего, ни у защитника.</p>

            <h2 id="difference">Рейд vs Вторжение</h2>
            <table>
                <tr><th></th><th>Рейд</th><th>Вторжение</th></tr>
                <tr><td>Цель</td><td>Украсть ниобий, воду, уран</td><td>Взять под контроль планету</td></tr>
                <tr><td>Защитники</td><td>Легионеры + Меха</td><td>Легионеры + Меха + Рабочие</td></tr>
                <tr><td>Непредсказуемость</td><td>Низкая</td><td>Выше (более широкий случайный фактор атаки)</td></tr>
                <tr><td>Потеря барж при поражении</td><td>Нет</td><td>Да (захватываются защитником)</td></tr>
            </table>

            <h2 id="combat">Как это происходит</h2>
            <p>Те же этапы, что и при вторжении (возможный орбитальный бой, затем 10 раундов на земле), <strong>но рабочие не защищаются</strong>. Легионеры и Меха защитника действуют одни.</p>
            <p><strong>Планета под охраной флота на орбите</strong> — если цель защищена <strong>вооружённым</strong> флотом владельца или <strong>вооружённым</strong> флотом союзника по его альянсу (одинокий разведчик или транспорт больше не достаточно), Ваш рейд сначала вызывает бой против этого защитника и турелей планеты. Этот бой никогда не начинается против партнёра по миру, партнёра по пакту, союзника, Вашего собственного альянса или на сервере PvE. Грабёж не происходит сразу же: если Вы выиграете этот бой, нужно будет <strong>заново запустить</strong> рейд, чтобы реально ограбить планету — а если планета всё ещё под охраной, клик на «Грабить» с орбиты тоже будет <strong>отклонён</strong>: сначала активируйте режим атаки собственного флота, чтобы вызвать бой. На стороне атакующего этот бой начинается только если Ваш собственный флот рейда является наступательным — на борту есть орудия кораблей, Легионеры или Мехи: чистый грузовой флот без единого орудия и без войск ничего не вызывает.</p>

            <h2 id="tolko-voyska">Рейд из одних войск уничтожается</h2>
            <p>Наличия на борту Легионеров или Мехов достаточно, чтобы вызвать этот бой — но если Ваш флот рейда не несёт <strong>ни одного орудия корабля</strong>, он вступает в этот бой с нулевой огневой мощью. Защитники уничтожают его полностью, не потеряв ни одного своего корабля. <strong>Всегда сопровождайте свои десантные транспорты</strong>: это самый дорогой сюрприз, который может преподнести эта механика.</p>

            <h2 id="pillage">Грабёж (при победе)</h2>
            <p>Вы забираете столько ресурсов, сколько может унести Ваш флот. Ресурсы берутся в таком порядке:</p>
            <ol>
                <li><strong>Ниобий</strong> в первую очередь.</li>
                <li>Затем <strong>Вода</strong>.</li>
                <li>В последнюю очередь <strong>Уран</strong> (если останется место).</li>
            </ol>

            <h2 id="bunker">Бункер защищает часть</h2>
            <p>Бункер защитника <strong>укрывает 5&nbsp;% от максимального хранилища за уровень</strong>. Примеры:</p>
            <ul>
                <li>Бункер уровня 5 → 25&nbsp;% от максимального хранилища защищено для ниобия и воды.</li>
                <li>Бункер уровня 10 → 50&nbsp;% защищено.</li>
            </ul>
            <p>Уран защищён таким же образом: <strong>5&nbsp;% Вашего запаса урана за уровень бункера</strong> (у урана нет максимального хранилища, поэтому защита применяется к текущему запасу).</p>

            <h2 id="scorched">Осторожно с Выжженной землёй</h2>
            <p>Если защитник выбрал <strong>тактическое развёртывание «Выжженная земля»</strong> и проигрывает, <strong>50&nbsp;% оставшихся (не разграбленных) ресурсов уничтожаются</strong>. Вы уходите со своей добычей, но противник не сможет всё восстановить.</p>

    nuclear:
        title: "Ядерная атака"
        category: "combat"
        order: 4
        tags: "ядерное,бомба,уран,разрушение,перехватчик"
        summary: "Абсолютное оружие для разрушения ключевых зданий противника — при условии, что у него нет противоракетной обороны."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Что Вам нужно</h2>
            <ul>
                <li>Здание <strong>Ядерная база</strong>.</li>
                <li><strong>Уран</strong> (очень редкий).</li>
                <li>Изготовленная <strong>ядерная бомба</strong>.</li>
                <li>Флот, отправляющийся на <strong>ядерную миссию</strong> к цели с бомбой на борту.</li>
            </ul>

            <h2 id="degats">Что делает бомба при попадании?</h2>
            <p>Бомба <strong>разрушает одно здание</strong>, приоритетно самые стратегические:</p>
            <ol>
                <li><strong>Метрополия</strong> — потеря 1 уровня (−80&nbsp;000 макс. рабочих).</li>
                <li><strong>Город</strong> — потеря 1 уровня (−25&nbsp;000 макс. рабочих).</li>
                <li><strong>Бункер</strong> — потеря 1 уровня (уменьшение защиты).</li>
                <li><strong>Казарма</strong> — потеря 1 уровня (−5&nbsp;000 макс. Легионеров).</li>
            </ol>
            <p>Бомба поражает первое найденное здание в этом порядке.</p>

            <h2 id="regle">Особые правила</h2>
            <ul>
                <li>Флот на ядерной миссии <strong>не может быть перехвачен</strong> флотом на орбите. Он летит прямо к цели.</li>
                <li>Единственный способ его остановить: <strong>ядерный перехватчик</strong> защитника.</li>
            </ul>

            <h2 id="anti">Оборона: ядерный перехватчик</h2>
            <p>Если планета-цель имеет хотя бы один <strong>ядерный перехватчик</strong>, бомба автоматически нейтрализуется:</p>
            <ul>
                <li>Флот-носитель <strong>уничтожается</strong>.</li>
                <li>Расходуется <strong>от 1 до 3 перехватчиков</strong>.</li>
                <li>Оба игрока получают отчёт.</li>
            </ul>
            <p>Мораль: стратегическая база всегда стоит нескольких перехватчиков. Без них она уязвима.</p>

    defense:
        title: "Защита планет"
        category: "combat"
        order: 5
        tags: "оборона,солдаты,танки,турель,щит,бункер,орбитальный,тактика,развёртывание,статистика,мощь"
        summary: "3 уровня обороны: орбитальный (турели), тактический (развёртывание), наземный (Легионеры + Меха)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">3 уровня обороны</h2>
            <ol>
                <li><strong>Орбитальная оборона</strong> — турели, щиты, космическая база. Перехватывают флот до высадки.</li>
                <li><strong>Тактическое развёртывание</strong> — стратегический выбор, меняющий силу Ваших наземных войск.</li>
                <li><strong>Наземная оборона</strong> — Легионеры, Меха, рабочие (при вторжениях).</li>
            </ol>

            <h2 id="mode-attaque">Активация режима атаки Вашей планеты</h2>
            <p>Если Ваша планета имеет <strong>хотя бы одну турель</strong>, Вы можете активировать <strong>режим атаки</strong>. В этом режиме, как только вражеский флот в режиме атаки прибывает на орбиту, автоматически начинается <strong>орбитальный бой</strong>.</p>
            <ul>
                <li><strong>Победа</strong>: вражеский флот уничтожен, и Вы получаете <strong>очки войны</strong> пропорционально его сигнатуре (значительно меньше против Ктулху).</li>
                <li><strong>Поражение</strong>: все Ваши турели, щиты, космическая база и очередь производства обороны уничтожены; режим атаки <strong>отключается автоматически</strong> (планета без турели не может его удерживать), а флот продолжает к наземному бою.</li>
            </ul>
            <p>Без турели Ваши щиты и космическая база уничтожаются <strong>даже без боя</strong>.</p>
            <p>Включить его можно в двух местах: на странице <strong>Оборона</strong> планеты или на странице <strong>Планеты</strong>, где виден статус каждой планеты (прицел рядом с её обороной, кликабельный для переключения) и есть кнопки <strong>«Включить все»</strong> / <strong>«Выключить все»</strong> для всей империи. Массовое переключение пропускает планеты без турелей или уже втянутые в бой и сообщает, сколько было пропущено.</p>
            <p><strong>Внимание</strong>: включение режима атаки на планете, над которой уже висит вражеский флот, запускает орбитальный бой <strong>через пять минут</strong>. При массовом включении может начаться сразу несколько сражений — в сообщении указано, сколько.</p>
            <p><strong>Что приносит с собой атакующий.</strong> Флот, штурмующий Ваши турели, теперь сражается со <strong>всеми своими бонусами</strong>: бонусами альянса его командира (ракеты, лазеры, плазма, броня, щит, точность) и бонусами снаряжения героя на борту. До 10 сентября 2026 года они учитывались только в космическом бою: альянс, вложивший до +5&nbsp;% в каждую из этих шести характеристик, не получал от них ничего против турелей. Это работает в обе стороны — Ваши собственные флоты сохраняют бонусы, когда штурмуете планету в режиме атаки Вы, — и цифры орбитальных отчётов теперь в той же шкале, что и цифры космических отчётов.</p>

            <h2 id="oborona-i-vashi-floty">Ваша оборона стреляет и без режима атаки</h2>
            <p>Режим атаки — не единственный способ заставить Ваши турели стрелять. Как только один из Ваших флотов — или <strong>вооружённый</strong> флот союзника по альянсу — оказывается на орбите планеты в момент, когда там начинается космический бой, оборона планеты автоматически присоединяется к этому бою, независимо от того, включён режим атаки или нет (планета, которой нечего защищать — ни одной турели, ни щита, ни космической базы — никогда не участвует). Это делает его <strong>единым боем</strong>: отдельного орбитального боя после него не будет. В этом бою бонус брони Вашей <strong>космической базы</strong> (+20&nbsp;%) действует и на турели, и на щиты, а военная склонность Вашего <strong>размещённого героя</strong> усиливает огонь Ваших собственных турелей и может нести Устрашение или Тактика для всей Вашей стороны, точно как герой флота. Ваши турели целятся там со своей собственной точностью (70 — выше, чем может достичь любой флот), и несут <strong>реальные потери</strong> — пропорциональные полученному урону, если Ваша сторона побеждает, <strong>полные</strong> (турели, щиты, космическая база, очередь производства обороны, режим атаки отключён), если Ваша сторона проигрывает. Вы получаете долю очков войны Вашей планеты каждый раз, когда Ваша сторона выигрывает этот бой — даже если Вы не задействовали ни одного своего флота. Следствие для Ваших противников: планету, которую охраняет один из Ваших <strong>вооружённых</strong> флотов или вооружённый союзный флот (одинокий разведчик или транспорт больше не считаются), больше нельзя ограбить или захватить без предварительного боя, будь то свежее прибытие атакующего или клик на «Грабить»/«Вторгнуться» с орбиты — и этот бой никогда не начинается против партнёра по миру, партнёра по пакту, союзника, Вашего собственного альянса или на сервере PvE.</p>
            <p><strong>Не задействовали ни одного своего флота?</strong> Вы всё равно получаете отдельный отчёт, сообщающий, устояла ли Ваша оборона или была уничтожена, с подробностями потерь турелей и Вашей долей очков войны в случае победы — судьба Вашей планеты никогда не остаётся для Вас неизвестной.</p>

            <h2 id="combat-orbital">Орбитальный бой в деталях</h2>
            <p>Турели стреляют по вражескому флоту в ритме раундов. <strong>Космическая база</strong> даёт бонус брони всем защитам (+20&nbsp;%). Щиты (50&nbsp;000 или 600&nbsp;000 очков брони) поглощают первые выстрелы.</p>
            <p>Ваши турели стреляют <strong>уже в первом раунде</strong>, каким бы ни был флот напротив: экран корабля никогда не откладывает их первый залп. Этот экран — резерв, который принимает урон, пока не иссякнет. Каждый залп сразу проходит сквозь него в размере своей <strong>пробивной силы</strong> (плазма ×4, лазер ×2, ракеты ÷ 7); остальное изнашивает экран, а то, что переполняет его, бьёт по корпусу. Оборона из одних ракетных установок по-прежнему в невыгодном положении против флота с большим щитом — но она стреляет, наносит потери и оставляет обломки.</p>
            <p>Даже если вражеский флот побеждает, его заслон истребителей больше не защищает его бесконечно&nbsp;: Ваши турели наносят реальные потери и его более тяжёлым кораблям, пропорционально полученному урону — в худшем для него случае 95&nbsp;% исходной брони. Оборона, таким образом, всегда обходится атакующему в нечто ощутимое, даже если он побеждает.</p>

            <h2 id="deploiement">Тактическое развёртывание</h2>
            <p>Каждая планета может выбрать <strong>тактическое развёртывание</strong>. Оно <strong>невидимо для атакующего</strong> — это Ваш скрытый козырь.</p>
            <table>
                <tr><th>Развёртывание</th><th>Эффект</th><th>Недостаток</th></tr>
                <tr><td><strong>Сбалансированное</strong></td><td>Без бонуса и штрафа.</td><td>Нейтрально.</td></tr>
                <tr><td><strong>Укреплённое</strong></td><td>+30&nbsp;% к наземной обороне.</td><td>−20&nbsp;% к контратаке.</td></tr>
                <tr><td><strong>Партизанское</strong></td><td>Рабочие +150&nbsp;% к обороне.</td><td>Легионеры на −50&nbsp;%.</td></tr>
                <tr><td><strong>Последний бастион</strong></td><td>+50&nbsp;%, если Ваши войска падают ниже 30&nbsp;%.</td><td>Без эффекта до этого порога.</td></tr>
                <tr><td><strong>Выжженная земля</strong></td><td>Без активного бонуса.</td><td>Если Вы проигрываете рейд: 50&nbsp;% Ваших оставшихся ресурсов уничтожаются.</td></tr>
            </table>

            <h2 id="combat-sol">Наземный бой</h2>
            <p>Он проходит в <strong>максимум 10 раундах</strong>. В каждом раунде обе стороны несут потери. Если за 10 раундов никто не побеждает, <strong>атакующий отброшен</strong> (преимущество местности).</p>

            <h2 id="troupes">Наземные юниты</h2>
            <table>
                <tr><th>Юнит</th><th>Роль</th><th>Примечания</th></tr>
                <tr><td><strong>Легионеры</strong></td><td>Атака и оборона.</td><td>Сильный оборонный бонус с исследованием «Колючая проволока».</td></tr>
                <tr><td><strong>Меха</strong></td><td>Тяжёлая оборона.</td><td>Максимум 500 на планету. Потребляют пищу.</td></tr>
                <tr><td><strong>Рабочие</strong></td><td>Пассивная оборона.</td><td>Только против вторжений, не против рейдов.</td></tr>
            </table>

            <h2 id="ressources-defense">Ресурсы, используемые для производства Вашей обороны</h2>
            <p>Как и Космическая верфь, производство обороны берёт сначала ресурсы <strong>самой планеты</strong>, а затем <strong>из карго флотов, стоящих на орбите</strong>. Поэтому Вы можете продолжать наём даже при малом запасе на земле, пока над планетой находятся загруженные флоты.</p>

            <h2 id="installations">Орбитальные установки и оборона</h2>
            <ul>
                <li><strong>Турели</strong> — ракетные, лазерные, тяжёлые лазерные, Гаусса, ионные, плазменные. Разнообразны для противодействия разным типам флотов.</li>
                <li><strong>Щит</strong> (50&nbsp;000 очков) и <strong>Большой щит</strong> (600&nbsp;000 очков) — поглощают первые выстрелы.</li>
                <li><strong>Космическая база</strong> — +20&nbsp;% брони всем орбитальным защитам.</li>
            </ul>

            <h2 id="stats-defensives">Как читать мощь своей планеты</h2>
            <p>Страница <strong>Оборона</strong> состоит из двух вкладок. Вторая, <strong>Статистика обороны</strong>, показывает, чего планета стоит на самом деле: суммарную броню, ракеты, лазеры и плазму всех Ваших турелей, вклад каждого сооружения, влияние щита, большого щита и космической базы на броню, с которой реально сталкивается флот, а также мощь наземной обороны. Это самый быстрый способ заметить отстающий показатель до начала новой серии построек.</p>
            <p>Одна деталь при чтении: круговая диаграмма и полосы показывают броню <strong>только сооружений</strong>. Фиксированные значения щитов вынесены отдельно, в модификаторы, иначе они полностью заслонили бы сравнение между Вашими орудиями.</p>

            <h2 id="bunker">Бункер против грабежа</h2>
            <p>Бункер защищает <strong>5&nbsp;% от максимального хранилища за уровень</strong> от рейдов. Бункер уровня 5 уже укрывает 25&nbsp;% Ваших запасов. Уран защищён из расчёта 5&nbsp;% от текущего запаса за уровень.</p>

            <h2 id="entretien">Осторожно со стоимостью содержания</h2>
            <p>Юниты на <strong>миссии</strong> (флоты, отправленные баржи) стоят <strong>гораздо дороже</strong>, чем размещённые. Например, Мех в гарнизоне стоит мало, но Мех на борту стоит в ~50 раз больше. Не оставляйте большую армию в постоянном путешествии.</p>

    embargo:
        title: "Эмбарго и голод"
        category: "combat"
        order: 6
        tags: "эмбарго,голод,блокада,осада,планета,пища,снабжение,рационы"
        summary: "Заморить планету голодом перед вторжением: блокада, подступающий голод и как ему противостоять."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Принцип</h2>
            <p><strong>Эмбарго</strong> — это планетарная осада. Вы удерживаете крупный флот на орбите вражеской планеты; обмен прерывается, пища заканчивается, население страдает. Когда планета ослаблена, Вы переходите к штурму.</p>

            <h2 id="consommation">Напоминание: пища</h2>
            <p>Ваши рабочие, Легионеры и Меха постоянно потребляют пищу. Если Ваши запасы падают до <strong>0</strong>, начинается <strong>голод</strong>.</p>

            <p>Рационы <strong>перевозятся в трюме</strong>: загрузите их на одной планете и разгрузите на другой, чтобы доставить снабжение. Пока один из ваших флотов <strong>стоит на приколе</strong> (не в полёте и не в бою) над вашей планетой, его рационы дополняют запас планеты — и осада выкачивает их так же, как и остальное: трюм не сейф.</p>

            <h2 id="famine">Голод (вне эмбарго)</h2>
            <p>Когда не хватает пищи, потери идут в <strong>3 фазах</strong>:</p>
            <ul>
                <li><strong>Фаза 1 (0–3ч)</strong> — умеренные потери рабочих. Время на реакцию.</li>
                <li><strong>Фаза 2 (3–8ч)</strong> — ускоренные потери. Легионеры начинают дезертировать.</li>
                <li><strong>Фаза 3 (после 8ч)</strong> — обвал: рабочие уничтожены, Легионеры бегут, Меха заброшены.</li>
            </ul>
            <p>Минимум в <strong>5&nbsp;000 рабочих</strong> предотвращает полное исчезновение. Без снабжения планета достигает этого минимума за ~27 часов.</p>

            <h2 id="declenchement">Как запустить эмбарго</h2>
            <p>Эмбарго автоматически активируется, когда:</p>
            <ul>
                <li>Хотя бы один <strong>вражеский флот</strong> (кроме союзников) находится на орбите,</li>
                <li>в <strong>режиме атаки</strong>,</li>
                <li>с <strong>достаточным числом тяжёлых кораблей</strong> (эквивалент ~250 линкоров, 37 эсминцев или 3 материнских кораблей).</li>
            </ul>
            <p>Как только вражеский флот уходит или уничтожен, блокада снимается.</p>
            <p>Флот рейда или вторжения, помеченный как «атакующий» объединённым боем, описанным в статье <em>Защита планет</em>, сохраняет эту метку, если выживает: если он остаётся на орбите, он учитывается в этой сигнатуре наравне с любым другим вражеским флотом.</p>

            <h2 id="effets">Что испытывает осаждённая планета</h2>
            <ul>
                <li>Дополнительный <strong>почасовой расход пищи</strong>: население паникует и потребляет больше.</li>
                <li>Производство <strong>пищи</strong> снижено (фермы нарушены).</li>
                <li>Производство <strong>ниобия и воды</strong> снижено.</li>
                <li><strong>Прирост рабочих</strong> почти остановлен.</li>
                <li><strong>Рынок заблокирован</strong>: нет автоматических продаж торговцам.</li>
                <li><strong>Чужие грузовики заблокированы</strong>: только Ваши или Вашего альянса могут приземлиться (союзническое снабжение).</li>
            </ul>

            <h2 id="famine-embargo">Голод под эмбарго: хуже</h2>
            <p>Если пища падает до 0 <strong>во время</strong> эмбарго, потери <strong>тяжелее</strong> и немедленные: рабочие, Легионеры и Меха сокращаются все три, непрерывно.</p>

            <h2 id="timings">Сколько можно продержаться?</h2>
            <table>
                <tr><th>Профиль планеты</th><th>Начало голода</th><th>Обвал</th></tr>
                <tr><td>Малая (50 000 рабочих, 100 000 пищи)</td><td>~14 часов</td><td>~1.75 дня</td></tr>
                <tr><td>Средняя (150 000 рабочих, 800 000 пищи)</td><td>~1.5 дня</td><td>~3.25 дня</td></tr>
                <tr><td>Крепость (200 000 рабочих, 2 000 000 пищи)</td><td>~3 дня</td><td>~4.8 дня</td></tr>
            </table>

            <h2 id="defense">Как противостоять эмбарго</h2>
            <ul>
                <li><strong>Уничтожить осаждающий флот</strong>, чтобы снять блокаду.</li>
                <li><strong>Организовать союзническое снабжение</strong> — Ваши грузовики и грузовики альянса всегда проходят.</li>
                <li><strong>Эвакуироваться</strong> — Ваши <em>исходящие</em> флоты не заблокированы, Вы можете срочно вывезти ресурсы.</li>
                <li><strong>Строить Силосы</strong> и запасать пищу <em>до</em> того, как ситуация ухудшится.</li>
                <li><strong>Обратиться за помощью к альянсу</strong>, чтобы совместно прорвать осаду.</li>
            </ul>

            <h2 id="rapports">Отчёты во время эмбарго</h2>
            <p>Каждый час Вы (и атакующий) получаете отчёт: прошедшее время, оставшаяся пища, понесённые потери. Страница Планеты также показывает очень полезный раздел <strong>Снабжение</strong> (производство, потребление, оценочная автономия).</p>

    combat_stats:
        title: "Понимание мощности войск"
        category: "combat"
        order: 7
        tags: "мощность,бонус,бой,политика,расчёт,фракция"
        summary: "Как сравнить мощность Ваших юнитов и что её усиливает."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Наземная мощность</h2>
            <p>Порядок величины (без бонусов):</p>
            <table>
                <tr><th>Юнит</th><th>Относительная мощность</th><th>Роль</th></tr>
                <tr><td><strong>Мех</strong></td><td>Очень высокая</td><td>Столп обороны. Дорогой, но сокрушает малое вторжение.</td></tr>
                <tr><td><strong>Легионер (оборона)</strong></td><td>Высокая с развитым исследованием «Колючая проволока»</td><td>Множитель обороны × уровень «Колючей проволоки».</td></tr>
                <tr><td><strong>Легионер (атака)</strong></td><td>Средняя, со случайностью</td><td>Переменная — рейд менее непредсказуем, чем вторжение.</td></tr>
                <tr><td><strong>Рабочий (оборона)</strong></td><td>Слабая, но количество важно</td><td>Только при вторжении. 200 000 рабочих имеют вес.</td></tr>
            </table>
            <p><strong>Баржи</strong> не сражаются: они перевозят по 1&nbsp;000 Легионеров каждая (больше с исследованиями альянса).</p>

            <h2 id="bonus">Что увеличивает Вашу мощность</h2>
            <ul>
                <li><strong>Исследование «Колючая проволока»</strong> — массивный множитель обороны Легионеров.</li>
                <li><strong>Исследование «Дисциплина»</strong> — улучшает наземных Легионеров.</li>
                <li><strong>Исследования альянса</strong> — бонусы атаки Легионеров, обороны Мехов, обороны рабочих, огневой мощи кораблей, брони кораблей, вместимости барж.</li>
                <li><strong>Тактическое развёртывание</strong> — выбор, усиливающий оборону или контратаку.</li>
                <li><strong>Военный герой</strong> — прямой бонус атаки и обороны.</li>
                <li><strong>Предметы</strong>, экипированные на герое.</li>
            </ul>

            <h2 id="faction">Политический бонус (космические бои)</h2>
            <p>Бонус к оружию в космическом бою даёт <strong>политика вашего альянса</strong>. Каждый режим бьёт своего соперника: <strong>Демократия</strong> бьёт <strong>Коммунизм</strong>, тот бьёт <strong>Фашизм</strong>, а тот — <strong>Демократию</strong>.</p>
            <p>Когда политика <strong>атакующего</strong> бьёт политику защитника, все его орудия (ракеты, лазеры, плазма) получают <strong>+20&nbsp;%</strong> на этот бой. Бонус действует только для нападающего: защитник опирается на планетарную оборону.</p>

            <h2 id="precision">Точность и броски боя</h2>
            <p>В космическом бою каждая сторона делает <strong>один залп за раунд</strong>. Случайный бросок между точностью стороны и 100, делённый на 80, масштабирует урон залпа от <strong>×0,3 до ×1,2</strong>. Высокая точность не делает удары сильнее — она убирает плохие броски.</p>
            <p>Наведение флота больше нигде не показывается в процентах&nbsp;: везде — на Космической верфи, на странице управления флотом, во вкладке «Оборона» и в боевых отчётах — игра показывает <strong>множитель урона</strong>, который наведение реально даёт (<strong>×0,66</strong> без единого вложения, <strong>×0,94</strong> при полном наведении). Этот уровень зависит от очков <strong>кастомизации</strong>, вложенных в точность для каждой модели корабля (40 очков/день), и является отдельным показателем&nbsp;: трата очков в другое место, на броню или оружие той же модели, никогда его не снижает. Когда несколько флотов сражаются вместе, сторона использует среднее их значений. Оборона планеты стреляет с <strong>×1,06</strong> — лучше, чем флот с полным наведением. Против противника под управлением ИИ (бота) его наведение никогда не опускается ниже фиксированного, известного порога&nbsp;: бот, который реально инвестирует в него, превосходит этот порог, а достаточно вложившийся игрок может сравняться с ним или превзойти его.</p>

    reports:
        title: "Игровые отчёты"
        category: "beginner"
        order: 9
        tags: "отчёт,уведомление,бой,шпионаж,альянс,колонизация,сообщения"
        summary: "Игра отправляет Вам отчёты о каждом важном событии. Вот где их найти и что они содержат."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Где найти Ваши отчёты?</h2>
            <p>Нажмите <strong>Сообщения</strong> в левом меню. Там Вы найдёте все полученные отчёты, отсортированные по типу. Цветная точка обозначает непрочитанные сообщения.</p>
            <p>Вы также можете включить <strong>пуш-уведомления</strong>, чтобы получать оповещения на телефоне или в браузере (см. отдельную статью).</p>

            <h2 id="combat">Отчёты о бое</h2>
            <ul>
                <li><strong>Космический бой</strong> — один из Ваших флотов встретил вражеский флот.</li>
                <li><strong>Орбитальный бой</strong> — Ваша планетарная оборона отбила (или нет) атакующего.</li>
                <li><strong>Планетарная оборона</strong> — отдельный отчёт для владельца планеты, не задействовавшего ни одного своего флота в объединённом бою: его оборона устояла или была уничтожена.</li>
                <li><strong>Рейд</strong> — понесённый или нанесённый грабёж.</li>
                <li><strong>Вторжение</strong> — попытка захвата планеты (с той или другой стороны).</li>
                <li><strong>Ядерное</strong> — отправленная или полученная бомба.</li>
                <li><strong>Эмбарго</strong> — почасовая сводка, если одна из Ваших планет осаждена.</li>
            </ul>

            <h2 id="cthulhu">Отчёты Ктулху</h2>
            <ul>
                <li><strong>Атака Ктулху</strong> — орда Ктулху против Вашей планеты.</li>
                <li><strong>Tower Defense</strong> — победа или поражение Вашей активной обороны.</li>
                <li><strong>Освобождение планеты</strong> — отбитие планеты у Ктулху.</li>
            </ul>

            <h2 id="flotte">Отчёты флота</h2>
            <ul>
                <li><strong>Прибытие флота</strong> — Ваш флот достиг назначения.</li>
                <li><strong>Доставка ресурсов</strong> — союзник отправил Вам что-то.</li>
                <li><strong>Переработка завершена</strong> — Ваши переработчики закончили работу.</li>
                <li><strong>Шпионаж</strong> — результат отправленного зонда (или зонд, обнаруженный у Вас).</li>
            </ul>

            <h2 id="alliance">Отчёты альянса</h2>
            <ul>
                <li><strong>Дипломатия</strong> — объявление войны, предложение пакта, принятие мира, расторжение пакта о ненападении или оборонительного союза, истечение мирного соглашения.</li>
                <li><strong>Участники</strong> — прибытие, уход, исключение, Game Over товарища.</li>
            </ul>

            <h2 id="divers">Прочие отчёты</h2>
            <ul>
                <li><strong>Ежедневный отчёт</strong> — Ваш ежедневный экономический баланс (18:59 UTC).</li>
                <li><strong>Колонизация</strong> — основана новая планета.</li>
                <li><strong>Продажа торговцу</strong> — Ваши ресурсы куплены.</li>
                <li><strong>Бонус за вход</strong> — получены Биткойны дня.</li>
                <li><strong>Тюрьма</strong> — герой захвачен или освобождён.</li>
            </ul>
            <h2 id="compte-valide">Подтвердите аккаунт</h2>
            <p>⚠️ Чтобы <strong>отправить сообщение или биткоины</strong> другому игроку, ваш аккаунт должен быть <strong>подтверждён</strong> (создан логин), а <strong>email подтверждён</strong>. Тестовые/анонимные аккаунты заблокированы — подтвердите email в разделе <strong>Мои настройки</strong>.</p>

    battle_reports:
        title: "Читаем отчёт о бое"
        category: "combat"
        order: 8
        tags: "отчет,бой,победа,поражение,анализ"
        summary: "После каждого боя приходит подробный отчёт. Вот как его расшифровать, чтобы в следующий раз ударить лучше."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="gde">Где их найти</h2>
            <p>Все отчёты о боях приходят на страницу <strong>Сообщения</strong>. Они отсортированы по типу (космос, рейд, вторжение, орбита, эмбарго, ядерный удар).</p>

            <h2 id="tipy">Типы боевых отчётов</h2>
            <ul>
                <li><strong>Космический бой</strong> — два флота встретились.</li>
                <li><strong>Орбитальный бой</strong> — ваша планетарная оборона перехватила флот.</li>
                <li><strong>Планетарная оборона</strong> — объединённый бой, в котором вы не задействовали ни одного своего флота: ваши турели, щиты и космическая база устояли или были уничтожены.</li>
                <li><strong>Рейд</strong> — попытка грабежа (вами или против вас).</li>
                <li><strong>Вторжение</strong> — попытка захвата планеты.</li>
                <li><strong>Ядерный удар</strong> — бомба отправлена или получена.</li>
                <li><strong>Эмбарго</strong> — почасовой отчёт во время осады.</li>
            </ul>

            <h2 id="soderzhanie">Что содержит отчёт</h2>
            <ul>
                <li><strong>Задействованные силы</strong> — стартовая броня, щит и оружие каждой стороны, состав каждого флота. Наведение больше не показывается в процентах, а в виде <strong>множителя урона</strong>, который оно даёт на самом деле (×0,66 без вложений, ×0,94 при полном наведении, ×1,06 для обороны планеты): ни один выстрел никогда не промахивается, лучшее наведение поднимает нижнюю границу вашего урона.</li>
                <li><strong>Залпы</strong> — сколько залпов произвела эта сторона, сколько из них ушло по щитам противника, и был ли пробит её собственный щит или он выдержал.</li>
                <li><strong>Заряд щита</strong> — для блока флота, процент заряда в начале и в конце боя, вместе с его полной ёмкостью: Ваш щит не восстанавливается автоматически до 100&nbsp;% от боя к бою, он заряжается постепенно (см. статью <em>Космический бой</em>).</li>
                <li><strong>Остаток брони</strong> — что ещё держится, и какая это доля стартовой брони. Уничтоженная сторона показывает вместо этого <strong>избыточный урон</strong>, полученный сверх её брони: это и есть ваш запас победы.</li>
                <li><strong>Полученный урон</strong> — два счётчика на сторону: <strong>корпус</strong> (что прошло сквозь щит) и <strong>щит</strong> (что стена заблокировала). Ваши потери следуют прямо из них.</li>
                <li><strong>Потери</strong> — корабль за кораблём, с обеих сторон.</li>
                <li><strong>Детализация планетарной обороны</strong> — потери турелей, плюс Ваш Щит, Большой щит и Космическая база, если они у Вас есть; показатель обороны и метка «Атака» для объединённого боя теперь настоящие.</li>
                <li><strong>Награбленные ресурсы</strong> (в рейдах) и <strong>обломки</strong> — перерабатывайте!</li>
                <li><strong>Полученные Очки Войны</strong> и итог.</li>
            </ul>

            <h2 id="analiz">Как извлечь урок</h2>
            <ul>
                <li>Сначала смотрите на <strong>полученный урон</strong>: строка «корпус» учитывает экспозицию ваших кораблей без щита <em>и</em> то, что прошло сквозь пробитый щит; строка «щит» — то, что стена поглотила (носители щита изнашиваются пропорционально).</li>
                <li>Сравнивайте два <strong>множителя урона</strong>: это единственное число, напрямую сопоставимое между сторонами, и теперь единственное, которое показывает игра — проценты точности исчезли со всех экранов. Затем смотрите на <strong>остаток брони</strong> — победа с 5&nbsp;% оставшейся брони и победа с 70&nbsp;% раньше читались одинаково. Большой избыток у противника означает, что вы переплатили за победу.</li>
                <li>Потери среди <strong>истребителей</strong> нормальны, даже когда стена держится: без щита они принимают свою долю огня напрямую — но, будучи маленькими, притягивают лишь малую её часть.</li>
                <li>Много <strong>залпов ушло на щит противника</strong>? Стройте плазму (×4 против щитов), чтобы пробивать быстрее.</li>
                <li><strong>Достигнуто 100 раундов</strong>: побеждает сторона с наибольшей бронёй — если это случилось с вами в атаке, флоту не хватает мощи или точности.</li>
                <li><strong>Архивируйте важные отчёты</strong>: они служат доказательствами в спорах альянса.</li>
            </ul>

    combat_simulator:
        title: "Симулятор боя"
        category: "combat"
        order: 9
        tags: "симулятор,бой,симуляция,флот,потери,оценка,отчет"
        summary: "Оцените риски перед атакой: прогоните бой тысячу раз против флота из отчёта — на настоящем движке игры."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="zachem">Для чего он нужен</h2>
            <p>Вкладка <strong>Симулятор боя</strong> на странице Флоты оценивает, чем вы рискуете перед атакой. Она прогоняет бой <strong>1&nbsp;000 раз</strong> между одним из ваших флотов и флотом противника — на <strong>настоящем движке игры</strong>: те же формулы, те же случайные броски. Ничего не задействуется по-настоящему: ни один корабль не летит и не гибнет.</p>

            <h2 id="istochnik">Источник: отчёт о бое</h2>
            <p>Флот противника берётся из одного из ваших <strong>свежих отчётов о бое</strong> (со строкой «Полученный урон»): это единственные честные источники — они содержат реальную мощь наблюдавшейся стороны, включая бонусы. Отчёт разведки даёт лишь количество кораблей без их реальных характеристик — симуляция была бы обманчивой, поэтому он не предлагается.</p>
            <p>Выберите отчёт, сторону противника (одну из двух армад отчёта) и один из ваших вооружённых флотов. Вы всегда моделируете в роли <strong>атакующего</strong>, со своими реальными бонусами (герой, альянс, политика).</p>

            <h2 id="chtenie">Как читать результат</h2>
            <ul>
                <li><strong>Доля побед</strong> — часть из 1&nbsp;000 прогонов, в которых вы выигрываете.</li>
                <li><strong>Вилка потерь по типам кораблей</strong> (минимум, медиана, максимум) — только по победным прогонам: при поражении ваш флот был бы уничтожен полностью.</li>
                <li><strong>Пример исхода</strong> — медианный прогон, оформленный как отчёт и явно помеченный «СИМУЛЯЦИЯ».</li>
            </ul>

            <h2 id="granicy">Ограничения, о которых стоит помнить</h2>
            <ul>
                <li>Флот противника — тот, что <strong>наблюдался на дату отчёта</strong>: с тех пор он мог быть восстановлен, улучшен или усилен.</li>
                <li>Ситуативные козыри противника (герой, планетарная оборона при бое у себя дома) известны только в настоящем бою.</li>
                <li>Лимит — <strong>20 симуляций в день</strong>: симулятор помогает принять решение, но не отменяет риск боя.</li>
            </ul>

    colonization:
        title: "Колонизировать новую планету"
        category: "planet"
        order: 1
        tags: "колонизация,планета,колонизатор,расширение"
        summary: "Расширьте свою империю, основывая новые планеты на пустых позициях."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Зачем колонизировать?</h2>
            <ul>
                <li><strong>Больше производства</strong> — у каждой планеты своя экономика.</li>
                <li><strong>Больше параллельных очередей строительства</strong>.</li>
                <li><strong>Меньше риска</strong> — ваши яйца больше не в одной корзине.</li>
                <li><strong>Стратегические позиции</strong> — близость к торговцам, союзникам, целям.</li>
            </ul>

            <h2 id="etapes">Как колонизировать</h2>
            <ol>
                <li>Разблокируйте исследование <strong>Экспансия</strong> (чтобы получить право на большее количество планет).</li>
                <li>Постройте <strong>Колонизатор</strong> на своём Космическом верфи.</li>
                <li>Загрузите его начальными ресурсами (рекомендуется: ниобий и вода).</li>
                <li>Отправьте его с миссией <strong>Колонизация</strong> на <strong>пустую позицию</strong> на карте.</li>
            </ol>
            <p>По прибытии новая планета будет основана. Она появится на вашей правой панели.</p>

            <h2 id="initial">Что у неё есть при старте</h2>
            <p>Свежеколонизированная планета начинает со скромной базой (несколько сотен ниобия и воды, около 2&nbsp;500 рабочих, 20 Легионеров). Всё остальное нужно строить.</p>

            <h2 id="limite">Максимальное количество планет?</h2>
            <p>Лимит зависит от:</p>
            <ul>
                <li>Уровня исследования <strong>Экспансия</strong>.</li>
                <li>Вашего <strong>альянса</strong> (некоторые исследования альянса разблокируют дополнительные планеты).</li>
                <li>Ваших успешных <strong>вторжений</strong> (некоторые наступательные исследования альянса также дают планеты).</li>
            </ul>

            <h2 id="choix">Где колонизировать?</h2>
            <ul>
                <li>Рядом с <strong>торговцем</strong>: лёгкая экономика за счёт отправки грузовых кораблей.</li>
                <li>Рядом с вашими <strong>союзниками</strong>: взаимная защита.</li>
                <li>На <strong>"богатой" позиции</strong> (большая, терраформируемая): лучшее производство.</li>
                <li>Избегайте слишком большой изоляции: флоты медленнее, снабжение усложнено.</li>
            </ul>

    planet_types:
        title: "Всё, что можно найти на карте"
        category: "planet"
        order: 2
        tags: "планета,луна,солнце,торговец,пришелец,обломки,ктулху"
        summary: "Различные объекты, видимые на галактической карте, и что с ними можно делать."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">7 типов объектов</h2>
            <table>
                <tr><th>Тип</th><th>Описание</th><th>Возможные действия</th></tr>
                <tr><td><strong>Планета</strong> (обитаемая)</td><td>Принадлежит игроку. Можно строить, колонизировать (если пустая)…</td><td>Зондировать, рейдить, вторгаться, бомбардировать.</td></tr>
                <tr><td><strong>Луна</strong></td><td>Создана Moon Maker. Ультра-быстрое производство пищи (цикл 1 мин).</td><td>Зондировать, рейдить, вторгаться.</td></tr>
                <tr><td><strong>Солнце</strong></td><td>Звёздный объект, не колонизируемый.</td><td>Никакие.</td></tr>
                <tr><td><strong>Пустая позиция</strong></td><td>Свободная позиция без объекта. Идеальна для колонизации или создания луны.</td><td>Колонизировать, установить луну, снабдить союзника.</td></tr>
                <tr><td><strong>Торговец</strong></td><td>Неприкасаемый NPC, покупающий ваши ресурсы за биткойны.</td><td>Продавать (миссия Разгрузка).</td></tr>
                <tr><td><strong>Планета Пришельцев / Ктулху</strong></td><td>База улья, защищённая постоянным гарнизоном.</td><td>Вторгнуться для освобождения (уран + снижает Угрозу вселенной).</td></tr>
                <tr><td><strong>Поле обломков</strong></td><td>Остатки боя (ниобий, вода) или спонтанное появление (уран).</td><td>Переработать.</td></tr>
            </table>

            <h2 id="reperer">Распознать на карте</h2>
            <p>У каждого типа свой значок. Наведите мышь, чтобы увидеть имя владельца (если обитаема), примерный размер и ваши возможные действия.</p>

            <h2 id="lunes">Особый случай: луны</h2>
            <p>Луны создаются специальным кораблём <strong>Moon Maker</strong> на пустой позиции с не менее чем 2 млн ниобия и 2 млн воды в обломках. После установки луна производит <strong>пищу в 10 раз быстрее</strong>, чем планета (цикл 1 минута вместо 10). Это драгоценный источник пищи для поддержки большой армии.</p>

    planet_management:
        title: "Управление планетой"
        category: "planet"
        order: 3
        tags: "управление,планета,производство,вместимость,специализация"
        summary: "Как оптимизировать производство, организовать пространство и при необходимости специализировать планету."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Основы для освоения</h2>
            <ul>
                <li><strong>Уровни производства</strong> — регулярно повышайте Шахту / Экстрактор / Ферму.</li>
                <li><strong>Хранилище</strong> — без достаточных запасов производство насыщается и останавливается.</li>
                <li><strong>Население</strong> — Города и Мегаполисы увеличивают лимит рабочих.</li>
                <li><strong>Минимальная защита</strong> — небольшой бункер, несколько Мехов — это основа.</li>
            </ul>

            <h2 id="optimiser">Оптимизировать планету</h2>
            <ol>
                <li>Стройте производственные здания <strong>парами</strong> (Шахта + Экстрактор часто растут вместе).</li>
                <li>Исследуйте <strong>Терраформирование</strong>, чтобы увеличить планету и иметь возможность строить больше.</li>
                <li>Следите за <strong>продовольственной автономией</strong>: Ферма/Аэропонная ферма, достаточные для вашего населения.</li>
                <li>Установите <strong>Луну</strong> поблизости, чтобы усилить производство пищи.</li>
            </ol>

            <h2 id="specialiser">Специализировать планеты</h2>
            <p>Несколько планет = возможность специализировать их в зависимости от положения и зданий:</p>
            <ul>
                <li><strong>Экономическая планета</strong> — много шахт, рабочих, продажа близлежащим торговцам.</li>
                <li><strong>Военная планета</strong> — космическая верфь, тяжёлые заводы, мощная защита, чтобы размещать ваш флот.</li>
                <li><strong>Исследовательская планета</strong> — Научный центр высокого уровня, много учёных.</li>
                <li><strong>Пограничный форпост</strong> — радар/глушитель, зонды, турели. Служит для наблюдения или сдерживания соседа.</li>
            </ul>

            <h2 id="capitale">Столичная планета</h2>
            <p>Ваша <strong>первая планета</strong> играет особую роль: если ваш герой уничтожен в бою, он автоматически переназначается на эту планету. Держите её всегда хорошо защищённой.</p>

    planet_abandon:
        title: "Покинуть планету"
        category: "planet"
        order: 4
        tags: "покинуть,планета,удаление,game over"
        summary: "Когда это хорошая идея, как это сделать и почему в некоторых случаях стоит воздержаться."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Зачем покидать планету?</h2>
            <ul>
                <li>Она <strong>слишком уязвима</strong> для атак и потребляет больше, чем приносит.</li>
                <li>Она <strong>плохо расположена</strong> (далеко от всего, сложна в защите).</li>
                <li>Вы хотите <strong>колонизировать лучшую</strong>, но достигли лимита планет.</li>
            </ul>

            <h2 id="comment">Как это сделать</h2>
            <p>Отказ производится со страницы <strong>Планета</strong> → раздел Управление. Требуется подтверждение (это необратимо).</p>
            <p>Перед тем как её бросить: <strong>эвакуируйте все ресурсы, Легионеров, корабли</strong> на другую планету. После покидания всё оставшееся теряется.</p>

            <h2 id="danger">Ловушка, которой следует безусловно избегать</h2>
            <p>Покинуть <strong>последнюю планету</strong> — это <strong>Game Over</strong>:</p>
            <ul>
                <li>Ваши флоты <strong>передаются пришельцам</strong>.</li>
                <li>Ваш командир удаляется с сервера.</li>
                <li>Партия окончена.</li>
            </ul>
            <p>Никогда не покидайте планету, не убедившись, что у вас есть хотя бы ещё одна активная.</p>

    galaxy_navigation:
        title: "Навигация по галактике"
        category: "planet"
        order: 5
        tags: "галактика,сектор,навигация,карта,вселенная,координаты"
        summary: "Как устроена вселенная, как читать координаты и как использовать карту."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Как устроена вселенная</h2>
            <p>Вселенная — это иерархия:</p>
            <ul>
                <li><strong>Вселенная</strong> содержит несколько <strong>Галактик</strong>.</li>
                <li>Каждая <strong>Галактика</strong> содержит <strong>Секторы</strong> (сетка 10×10).</li>
                <li>Каждый <strong>Сектор</strong> содержит 25 <strong>Позиций</strong> (сетка 5×5).</li>
            </ul>
            <p>Каждая позиция может содержать планету, торговца, поле обломков, луну, солнце или быть пустой.</p>

            <h2 id="coordonnees">Чтение координат</h2>
            <p>Формат: <strong>Галактика:Сектор:Позиция</strong>, например <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — первая галактика;</li>
                <li><strong>5</strong> — пятый сектор этой галактики;</li>
                <li><strong>12</strong> — двенадцатая позиция в этом секторе.</li>
            </ul>

            <h2 id="carte">Использование карты</h2>
            <p>Страница <strong>Карта</strong> (левое меню) показывает космический вид. Вы можете:</p>
            <ul>
                <li>Перемещаться между галактиками и секторами.</li>
                <li>Нажать на позицию, чтобы увидеть, что там находится.</li>
                <li><strong>Напрямую отправить флот</strong>, нажав "Атаковать / Отправить" из клетки.</li>
                <li>Видеть позиции союзников, врагов и торговцев (в зависимости от ваших отношений и вашего радара).</li>
            </ul>
            <p><strong>Флоты в полёте</strong> отображаются в виде маленьких анимированных кораблей, плавно перемещающихся в реальном времени между планетой отправления и планетой назначения. <strong>Цветной ореол</strong> указывает сторону: <strong>синий</strong> = вы, <strong>зелёный</strong> = альянс, <strong>серый</strong> = пакт/мир, <strong>пурпурный</strong> = торговец, <strong>фиолетовый</strong> = инопланетянин, <strong>красный</strong> = враг. <strong>Размер</strong> отражает сигнатуру флота. Ваши флоты и флоты альянса всегда видимы; остальные появляются только если ваш <strong>радар</strong> покрывает сектор. Для дальних перелётов через несколько секторов маркер появляется только в финальной части пути — при входе в сектор назначения — а не на протяжении всего путешествия.</p>

            <h2 id="hyperespace">Межгалактические путешествия</h2>
            <p>Чтобы перейти из одной галактики в другую, вам нужно исследование <strong>Гиперпространство</strong>. Межгалактические перелёты долгие и затратные по топливу — планируйте.</p>

    radar_jammer:
        title: "Радар и глушение"
        category: "planet"
        order: 6
        tags: "радар,глушитель,jammer,обнаружение,наблюдение"
        summary: "Видеть врага приближающимся до того, как он прибудет, и скрывать свои собственные передвижения."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Радар против Глушителя (Jammer)</h2>
            <ul>
                <li><strong>Радар</strong> — видит приближающиеся флоты. Даёт вам время отреагировать.</li>
                <li><strong>Глушитель (Jammer)</strong> — скрывает ваши собственные передвижения от вражеских радаров.</li>
            </ul>

            <h2 id="detection">Доступные радары</h2>
            <table>
                <tr><th>Тип</th><th>Где</th><th>Роль</th></tr>
                <tr><td><strong>Радар</strong> (здание)</td><td>На планете (поверхность)</td><td>Локальное обнаружение. Оповещает о флотах, приближающихся к вашей планете.</td></tr>
                <tr><td><strong>Sky Radar</strong> (здание)</td><td>В небе (орбитальный остров)</td><td>Расширенное обнаружение. Больший радиус, лучшая точность.</td></tr>
                <tr><td><strong>Радар</strong> (корабль)</td><td>Во флоте</td><td>Мобильное обнаружение. Полезно для исследования или наблюдения за зоной далеко от дома.</td></tr>
            </table>

            <h2 id="brouillage">Доступные глушители</h2>
            <table>
                <tr><th>Тип</th><th>Где</th><th>Роль</th></tr>
                <tr><td><strong>Sky Jammer</strong> (здание)</td><td>В небе (орбитальный остров)</td><td>Глушит вражеские радары вокруг вашей планеты.</td></tr>
                <tr><td><strong>Jammer</strong> (корабль)</td><td>Во флоте</td><td>Глушит радары вокруг вашего флота в полёте.</td></tr>
            </table>

            <h2 id="korabli-na-zemle">Как увидеть корабли на земле</h2>
            <p><strong>Наземная сигнатура</strong> — корабли, стоящие на планете — подчиняется чуть более мягкому правилу: ваш флот <strong>на орбите</strong> считает их визуально, даже без радара. Но только для этой планеты.</p>
            <p><strong>Радар</strong> остаётся тем, что даёт эту информацию <strong>на расстоянии</strong>, по всему сектору. А <strong>Sky Jammer</strong> на планете снова закрывает обзор: без радара сильнее глушителя наземная сигнатура опять становится невидимой — даже если флот стоит над планетой.</p>

            <h2 id="strategie">Как их использовать</h2>
            <ul>
                <li><strong>Радар</strong> на каждой планете: минимум базовое здание, чтобы вас не застали врасплох.</li>
                <li><strong>Глушитель</strong> во флоте: необходим для внезапной атаки на большом расстоянии.</li>
                <li><strong>Разместите</strong> радарный спутник (специальная миссия) на стратегической позиции для наблюдения за соседом.</li>
                <li>Исследование <strong>Волна</strong> улучшает радиус и точность всех радаров.</li>
            </ul>

    moon:
        title: "Луны"
        category: "planet"
        order: 7
        tags: "луна,moonmaker,пища,производство"
        summary: "Луна производит пищу в 10 раз быстрее, чем планета. Как создать её."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Что такое луна?</h2>
            <p><strong>Луна</strong> — это особый объект, меньше планеты, <strong>предназначенный исключительно для производства пищи</strong>. Её цикл длится <strong>1 минуту</strong> вместо 10: таким образом, она производит в 10 раз быстрее, чем планета того же размера.</p>
            <p>Луна — отличное дополнение для поддержки армии, которая много потребляет (много Легионеров, Мехов, кораблей в миссии).</p>

            <h2 id="creation">Как создать луну</h2>
            <p>Луна рождается из <strong>поля обломков</strong>: нужна <strong>пустая позиция</strong> с не менее чем <strong>2 млн ниобия И 2 млн воды</strong> в обломках (оставленных космической битвой в этом месте). Миссия «Луна» предлагается на карте, только если позиция удовлетворяет этому условию.</p>
            <ol>
                <li>Постройте <strong>Moon Maker</strong> (особый корабль, дорогостоящий).</li>
                <li>Отправьте его с миссией <strong>Луна</strong> на пустую позицию с достаточным количеством обломков.</li>
                <li>По прибытии луна создаётся и <strong>поглощает все обломки</strong>. Если условия больше не выполняются (обломки переработаны во время полёта, позиция колонизирована…), отчёт объяснит причину неудачи.</li>
            </ol>

            <h2 id="razmer">Размер луны</h2>
            <p>Чем богаче поле обломков, тем больше луна. Уровень определяется <strong>меньшим</strong> из двух ресурсов:</p>
            <table>
                <tr><th>Обломки (мин. ниобий/вода)</th><th>Территория</th></tr>
                <tr><td>2 млн – 8 млн</td><td>100 – 150</td></tr>
                <tr><td>8 млн – 15 млн</td><td>150 – 190</td></tr>
                <tr><td>15 млн – 25 млн</td><td>190 – 230</td></tr>
                <tr><td>25 млн – 50 млн</td><td>230 – 280</td></tr>
                <tr><td>50 млн и более</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limitations">Ограничения</h2>
            <ul>
                <li>Луна <strong>производит только пищу</strong> (ни ниобия, ни воды).</li>
                <li>На неё можно <strong>напасть, рейдить, вторгнуться</strong>, как на обычную планету.</li>
                <li>Построить луну рядом с собой безопаснее (менее подвержена враждебным соседям).</li>
            </ul>

            <h2 id="strategie">Когда устанавливать</h2>
            <ul>
                <li>Вам трудно кормить армию → близкая луна решит проблему.</li>
                <li>Крупная битва оставила <strong>богатое поле обломков</strong> рядом с вами: вместо того чтобы всё переработать, превратите его в луну.</li>
                <li>Вы хорошо обосновались, имеете ресурсы для трат и стремитесь укрепить свою экономику.</li>
            </ul>

    alliance_basics:
        title: "Создать и вступить в альянс"
        category: "alliance"
        order: 1
        tags: "альянс,создание,вступить,бонус,режим,политика"
        summary: "Объединяйтесь с игроками, получайте бонусы и выбирайте свой политический режим."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Зачем вступать в альянс?</h2>
            <ul>
                <li><strong>+20&nbsp;% к производству</strong> немедленно на все ресурсы.</li>
                <li>Доступ к <strong>20 исследованиям альянса</strong> (экономические, военные, оборонительные бонусы).</li>
                <li><strong>Общая казна</strong> в биткойнах.</li>
                <li><strong>Дипломатия</strong> (войны, мир, пакты) и <strong>чат альянса</strong>.</li>
                <li>Возможность <strong>вторгаться</strong> на другие планеты (доступно только членам альянса в режиме PvP).</li>
            </ul>
            <p>Проще говоря: играть соло — жизнеспособно в начале. Но как только игра становится серьёзной, альянс умножает ваши шансы на прогресс.</p>

            <h2 id="rejoindre">Как вступить</h2>
            <ol>
                <li>Страница <strong>Альянс</strong> (левое меню).</li>
                <li>Просмотрите список открытых альянсов или ищите по названию.</li>
                <li>Подайте заявку на вступление. Лидер (или офицер) её утверждает.</li>
            </ol>
            <p>Вы также можете <strong>создать свой собственный альянс</strong> с той же страницы, выбрав название, тег и политический режим.</p>

            <h2 id="invitations">Получение приглашений</h2>
            <p>Лидер (или офицер с правом рекрутирования) также может <strong>пригласить</strong> вас напрямую. Вы можете одновременно иметь <strong>по одному приглашению от каждого альянса</strong> — приглашение от одного не скрывает вас от остальных, — но один и тот же альянс не может пригласить вас дважды, пока вы не ответите. Альянсы, которые вас находят, видят, что вас <strong>уже приглашали</strong>, но не знают кто. Как только вы <strong>принимаете</strong> приглашение, все остальные автоматически отзываются; а если альянс <strong>распущен</strong>, его приглашение исчезает из вашего списка.</p>

            <h2 id="delai">Задержка после выхода из альянса</h2>
            <p>После <strong>выхода</strong> из альянса, <strong>исключения</strong> (кик) или <strong>роспуска</strong> вашего альянса действует <strong>задержка в 2&nbsp;дня</strong>: вы не можете <strong>создать</strong> новый альянс или <strong>вступить</strong> в него, пока она не истечёт. Это предотвращает злоупотребления с переходами между альянсами.</p>

            <h2 id="regimes">3 политических режима</h2>
            <p>При <strong>создании</strong> альянса вы выбираете <strong>политический режим</strong>. Этот выбор определяет доступные бонусы, возможные исследования и некоторые внутренние правила. Он <strong>окончательный</strong>.</p>

            <h3 id="democratie">Весы Миров (Весы Миров)</h3>
            <p><strong>Преимущества:</strong></p>
            <ul>
                <li>Голосование за выбор Президента.</li>
                <li><strong>+20%</strong> атаки против наступательных альянсов.</li>
                <li>Игроки могут свободно покидать альянс.</li>
                <li>7 экономических исследований:
                    <ul>
                        <li>+35% производство ресурсов</li>
                        <li>+50% скорость исследований</li>
                        <li>-100% стоимость содержания учёных</li>
                        <li>+100% размер грузовых кораблей</li>
                        <li>+50% броня кораблей</li>
                        <li>+25% прибыль от продажи торговцам</li>
                        <li>+5 колонизируемых планет</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Недостатки:</strong></p>
            <ul>
                <li>Все члены альянса известны публично.</li>
                <li>Позиция первой планеты отображается.</li>
            </ul>

            <h3 id="communisme">Безмолвный Оплот (Наступательный Альянс)</h3>
            <p><strong>Преимущества:</strong></p>
            <ul>
                <li>Один дополнительный член альянса.</li>
                <li><strong>+20%</strong> атаки против оборонительных альянсов.</li>
                <li>7 наступательных исследований:
                    <ul>
                        <li>+100% скорость переработки</li>
                        <li>+100% защита рабочих</li>
                        <li>+50% мощность кораблей</li>
                        <li>-50% стоимость содержания Легионеров</li>
                        <li>-1 биткойн за уровень на вербовку Легионеров (8 → 3)</li>
                        <li>+5 планет через вторжения</li>
                        <li>+50% получение Очков Войны</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Недостатки:</strong></p>
            <ul>
                <li>Налог автоматически установлен на 50%.</li>
                <li>Все члены имеют статус лидера.</li>
                <li>Невозможно покинуть альянс.</li>
            </ul>

            <h3 id="fascisme">Молот Звёзд (Оборонительный Альянс)</h3>
            <p><strong>Преимущества:</strong></p>
            <ul>
                <li>Снижение угрозы Ктулху.</li>
                <li><strong>+20%</strong> атаки против альянсов Весы Миров.</li>
                <li>Публично отображается только Лидер.</li>
                <li>7 оборонительных исследований:
                    <ul>
                        <li>+100% производство рабочих</li>
                        <li>+50% мощность кораблей</li>
                        <li>+75% вместимость барж вторжения</li>
                        <li>+50% сила Легионеров</li>
                        <li>-100% стоимость содержания Мехов</li>
                        <li>+50 защита Мехов</li>
                        <li>+5 планет через вторжения</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Недостатки:</strong></p>
            <ul>
                <li>Если лидер получает Game Over, альянс распускается.</li>
                <li>Невозможно покинуть альянс.</li>
                <li>Невозможно удалить альянс.</li>
                <li>На одного члена альянса меньше.</li>
                <li>Лидер — единственный глава альянса.</li>
            </ul>
            <h2 id="compte-valide">Подтвердите аккаунт</h2>
            <p>⚠️ Чтобы <strong>создать альянс или вступить</strong> в него, ваш аккаунт должен быть <strong>подтверждён</strong>, а <strong>email подтверждён</strong>. Тестовые/анонимные аккаунты не могут вступать в альянс — подтвердите email в разделе <strong>Мои настройки</strong>.</p>
            <h2 id="discord">Ваш альянс в Discord</h2>
            <p>Привяжите аккаунт Discord в разделе <strong>«Мои настройки»</strong> и отметьте <strong>«Показывать мои альянсы в Discord»</strong>: игра выдаст вам на <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord-сервере Area Universe</a> роль каждого из ваших альянсов и снимет её, когда вы покинете альянс или он будет распущен. Никто не может получить роль альянса, в котором не состоит. Снимите отметку в любой момент, чтобы убрать роли.</p>

    alliance_grades:
        title: "Ранги и разрешения"
        category: "alliance"
        order: 2
        tags: "ранги,разрешения,роли,иерархия,офицер,руководитель"
        summary: "Как работает внутренняя иерархия альянса и кто имеет право что делать."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Альянс организован по <strong>рангам</strong>, от самого высокого (руководитель) до самого низкого (новобранец). Каждый ранг имеет набор настраиваемых <strong>разрешений</strong>.</p>

            <h2 id="hierarchie">Типичная иерархия</h2>
            <ul>
                <li><strong>Ранг 1 — Руководитель</strong> — Основатель альянса. Все права. Только один на альянс (за исключением некоторых режимов).</li>
                <li><strong>Ранг 2+ — Офицеры</strong> — могут принимать делегированные решения (дипломатия, казна, набор…).</li>
                <li><strong>Промежуточные ранги</strong> — ветераны, советники. Настраиваются по обычаям.</li>
                <li><strong>Самый низкий ранг</strong> — новобранцы, ограниченные разрешения.</li>
            </ul>

            <h2 id="permissions">Настраиваемые разрешения</h2>
            <p>Руководитель может для каждого ранга включить или отключить:</p>
            <ul>
                <li><strong>Приглашать</strong> новых членов.</li>
                <li><strong>Исключать</strong> члена.</li>
                <li><strong>Доступ к казне</strong> (вклад, снятие).</li>
                <li><strong>Объявлять войну</strong> другому альянсу.</li>
                <li><strong>Принимать мир</strong>, пакт или оборонительный союз.</li>
                <li><strong>Изменять ранги</strong> других членов.</li>
                <li><strong>Управлять исследованиями альянса</strong>.</li>
            </ul>

            <h2 id="changer">Повышение или понижение</h2>
            <p>Офицер с соответствующим разрешением может изменить ранг члена. Это способ поощрить активных и наставить новичков.</p>

            <h2 id="regimes">Особые случаи в зависимости от режима</h2>
            <p>Некоторые политические режимы изменяют эти правила:</p>
            <ul>
                <li><strong>Безмолвный Оплот</strong> — все члены являются руководителями (нет иерархии).</li>
                <li><strong>Молот Звёзд</strong> — один несменяемый руководитель; если руководитель падёт, альянс распускается.</li>
                <li><strong>Весы Миров</strong> — Президент избирается голосованием.</li>
            </ul>

            <h2 id="afk">Автоматическая замена неактивного руководителя</h2>
            <p>Если <strong>руководитель</strong> альянса не заходит в игру <strong>более 7 дней</strong>, он автоматически заменяется, чтобы альянс не оказался парализованным:</p>
            <ul>
                <li><strong>Самый высокий по рангу активный член</strong> возглавляет альянс. При равенстве рангов им становится тот, у кого больше <strong>Очков войны</strong>.</li>
                <li>Два ранга просто <strong>меняются местами</strong>: бывший руководитель получает ранг заменившего его члена.</li>
                <li>Если <strong>нет ни одного активного члена</strong>, способного принять руководство, ничего не меняется.</li>
            </ul>

    diplomacy:
        title: "Дипломатия"
        category: "alliance"
        order: 3
        tags: "дипломатия,война,мир,пакт,союзник,defcon,договор"
        summary: "4 типа отношений между альянсами, как их вести, и что означает DEFCON."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Ваш альянс поддерживает <strong>отношения</strong> с другими альянсами на сервере. Эти отношения меняют правила игры между вашими членами (кто может атаковать кого).</p>

            <h2 id="types">4 типа отношений</h2>
            <table>
                <tr><th>Тип</th><th>Эффект</th><th>Использование</th></tr>
                <tr><td><strong>Война</strong></td><td>Открытый конфликт. Между двумя альянсами разрешено всё.</td><td>Объявляется офицером. Приоритетные враги.</td></tr>
                <tr><td><strong>Мир</strong></td><td>Прекращение огня. Никаких атак. Может включать налог мира.</td><td>Прекратить войну или избежать дорогого конфликта.</td></tr>
                <tr><td><strong>Пакт</strong></td><td>Взаимное ненападение. Никаких атак, но взаимопомощь не обязательна.</td><td>Стабильные нейтральные отношения.</td></tr>
                <tr><td><strong>Оборонительный союз</strong></td><td>Взаимная военная поддержка. Обмен информацией, совместная оборона.</td><td>Для близких союзников.</td></tr>
            </table>

            <h2 id="proposer">Как предложить договор</h2>
            <ol>
                <li>Страница <strong>Альянс</strong> → <strong>Дипломатия</strong>.</li>
                <li>Выберите целевой альянс из списка.</li>
                <li>Предложите тип отношений (мир, пакт, союз).</li>
                <li>Другая сторона должна <strong>принять</strong>. Она может принять, отказать или сделать встречное предложение.</li>
            </ol>

            <h2 id="defcon">DEFCON (уровень тревоги)</h2>
            <p>Ваш альянс имеет <strong>уровень тревоги DEFCON</strong> — число, указывающее на напряжённость. <strong>Чем меньше число, тем опаснее ситуация.</strong> DEFCON 1 означает неизбежную тотальную войну.</p>
            <p>Это визуальный индикатор для координации: низкий DEFCON = все члены на боевом посту.</p>

            <h2 id="logs">Дипломатический журнал</h2>
            <p>Любое дипломатическое действие (объявление войны, принятый мир, разорванный пакт…) <strong>записывается</strong> в историю альянса с никнеймом автора и временной меткой. Полезно для внутренней прозрачности и разборов после событий.</p>

    alliance_treasury:
        title: "Казна альянса"
        category: "alliance"
        order: 4
        tags: "казна,биткойн,вклад,снятие,налог"
        summary: "Общий фонд вашего альянса, пополняемый членами и налогами мира."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Для чего нужна казна</h2>
            <p>Казна альянса — это <strong>общий счёт в Биткойнах</strong>. Она служит для:</p>
            <ul>
                <li>Оплаты <strong>исследований альянса</strong>.</li>
                <li>Помощи члену, попавшему в беду.</li>
                <li>Финансирования коллективных усилий (подготовка к войне, ивент).</li>
            </ul>

            <h2 id="alimenter">Как её пополнять</h2>
            <ul>
                <li><strong>Добровольные вклады</strong> — любой член может внести Биткойны.</li>
                <li><strong>Налог альянса</strong> — если включён, процент от доходов каждого члена автоматически удерживается при ежедневном отчёте.</li>
                <li><strong>Налоги мира</strong> — если Вы обложили налогом альянс, с которым заключили мир, он автоматически поступает в казну.</li>
            </ul>

            <h2 id="retrait">Снятия</h2>
            <p>Снятия доступны только рангам с <strong>разрешением на казну</strong> — обычно офицерам и руководителю. Каждое движение записывается в журнал.</p>

            <h2 id="taxes">Налог альянса</h2>
            <p>Налог альянса настраивается руководителем. Он удерживает процент от доходов каждого члена <strong>автоматически при ежедневном отчёте</strong>. Выбирайте разумный уровень: слишком высокий — члены уходят.</p>

            <h2 id="transparence">Прозрачность</h2>
            <p>В <strong>логах казны</strong> отображается, кто внёс/снял, когда и сколько. Это инструмент доверия: каждый может проверить.</p>

    political_system:
        title: "3 политических режима"
        category: "alliance"
        order: 5
        tags: "политика,режим,бонус,весы,оплот,молот"
        summary: "3 возможных режима для альянса: преимущества, недостатки и как выбрать."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principe">Выбор при создании</h2>
            <p>Когда альянс создаётся, основатель выбирает <strong>политический режим</strong>. Этот режим определяет <strong>внутренние правила</strong>, <strong>специфические бонусы</strong> и отдельное <strong>дерево исследований альянса</strong>. Выбор <strong>необратим</strong>.</p>

            <h2 id="balance">Весы Миров (демократический)</h2>
            <p>Открытый и экономический режим. Члены голосуют, чтобы избрать своего Президента. Фокус на <strong>экономике</strong>.</p>
            <ul>
                <li>+20&nbsp;% атаки против наступательных альянсов.</li>
                <li>Члены видны публично.</li>
                <li>Члены могут свободно покидать альянс.</li>
                <li>Исследования, ориентированные на экономику (производство, карго, ускорение научных исследований, продажа торговцам…).</li>
            </ul>

            <h2 id="rempart">Безмолвный Оплот (наступательный)</h2>
            <p>Агрессивный и коллективный режим. Все члены являются руководителями. Фокус на <strong>наступлении</strong>.</p>
            <ul>
                <li>+20&nbsp;% атаки против оборонительных альянсов.</li>
                <li>Один дополнительный член разрешён.</li>
                <li>Налог альянса автоматически установлен на 50&nbsp;%.</li>
                <li>Невозможно покинуть альянс.</li>
                <li>Исследования, ориентированные на бой (мощь кораблей, сниженная стоимость Легионеров, скорость переработки, вторжения…).</li>
            </ul>
            <p>Три высших ранга (<strong>Вождь</strong>, <strong>Защитник</strong>, <strong>Товарищ</strong>) <strong>равнозначны</strong>: одинаковые права, никакой иерархии между ними. Они могут свободно распределяться между членами; ниже стоит только ранг новобранца (Гулаг).</p>

            <h2 id="marteau">Молот Звёзд (оборонительный)</h2>
            <p>Скрытный и оборонительный режим. Один руководитель. Фокус на <strong>обороне</strong> и стойкости.</p>
            <ul>
                <li>+20&nbsp;% атаки против демократических альянсов.</li>
                <li>Сниженная угроза от Ктулху (очень полезно в PvE).</li>
                <li>Публично отображается только руководитель.</li>
                <li>Невозможно покинуть альянс. Невозможно его распустить.</li>
                <li>Если руководитель получает Game Over, альянс распускается.</li>
                <li>На одного члена меньше, чем в других режимах.</li>
                <li>Исследования, ориентированные на оборону (производство рабочих, сила Легионеров, оборона Мехов, вместимость барж…).</li>
            </ul>

            <h2 id="combat">Бонусы между режимами</h2>
            <p>Каждый режим имеет бонус +20&nbsp;% атаки <strong>против соперничающего режима</strong>, по принципу камень-ножницы-бумага:</p>
            <ul>
                <li>Весы побеждают Оплот.</li>
                <li>Оплот побеждает Молот.</li>
                <li>Молот побеждает Весы.</li>
            </ul>

            <h2 id="choisir">Как выбрать?</h2>
            <ul>
                <li><strong>Вы начинаете и стремитесь к росту</strong> → Весы Миров (экономичный, гибкий).</li>
                <li><strong>Вы хотите сплочённый и агрессивный альянс</strong> → Безмолвный Оплот.</li>
                <li><strong>Вы хотите защититься, играть оборонительно</strong> → Молот Звёзд (внимание: в случае game over руководителя всё рушится).</li>
            </ul>

    alliance_research:
        title: "Исследования альянса"
        category: "alliance"
        order: 6
        tags: "исследование,альянс,политика,улучшение,бонус"
        summary: "Коллективные бонусы, финансируемые казной альянса, приносящие пользу всем членам."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principe">Как это работает</h2>
            <p>Ваш альянс располагает <strong>отдельным деревом исследований</strong>, которое зависит от его <strong>политического режима</strong>. Каждое исследование стоит Биткойны (взимаются из казны) и распределяется по нескольким уровням.</p>
            <p>Бонусы <strong>приносят пользу всем членам</strong>. Это одна из главных причин вступать или оставаться верным альянсу.</p>

            <h2 id="liste">Типичные исследования альянса</h2>
            <table>
                <tr><th>Исследование</th><th>Что улучшает</th></tr>
                <tr><td><strong>Производство</strong></td><td>Бонус к производству ресурсов.</td></tr>
                <tr><td><strong>Рабочие</strong></td><td>Более быстрый рост населения.</td></tr>
                <tr><td><strong>Оборона рабочих</strong></td><td>Рабочие лучше сопротивляются при вторжении.</td></tr>
                <tr><td><strong>Скорость исследований</strong></td><td>Индивидуальные исследования завершаются быстрее.</td></tr>
                <tr><td><strong>Вооружение</strong></td><td>Урон кораблей в бою.</td></tr>
                <tr><td><strong>Броня</strong></td><td>Броня кораблей.</td></tr>
                <tr><td><strong>Стоимость Легионеров / учёных / Мехов</strong></td><td>Более дешёвый набор.</td></tr>
                <tr><td><strong>Вместимость барж</strong></td><td>Больше Легионеров, высаживаемых баржой.</td></tr>
                <tr><td><strong>Вместимость карго</strong></td><td>Больше перевозимых ресурсов.</td></tr>
                <tr><td><strong>Мощность переработки</strong></td><td>Больше обломков, возвращаемых за цикл.</td></tr>
                <tr><td><strong>Колонизация</strong></td><td>Больше колонизируемых планет.</td></tr>
                <tr><td><strong>Атака / Оборона Легионеров</strong></td><td>Сила наземных войск.</td></tr>
                <tr><td><strong>Оборона Мехов</strong></td><td>Меха более стойкие.</td></tr>
                <tr><td><strong>Цены торговцев</strong></td><td>Лучшие продажи NPC.</td></tr>
                <tr><td><strong>Вторжение</strong></td><td>Бонус в наземных боях.</td></tr>
                <tr><td><strong>Очки войны</strong></td><td>Больше ОВ, получаемых в бою.</td></tr>
            </table>

            <h2 id="choisir">Какие исследования приоритетны?</h2>
            <ul>
                <li><strong>Экономический альянс</strong> (Весы) → Производство, Скорость исследований, Карго.</li>
                <li><strong>Наступательный альянс</strong> (Оплот) → Вооружение, Вторжение, Атака Легионеров.</li>
                <li><strong>Оборонительный альянс</strong> (Молот) → Производство рабочих, Оборона Мехов, Баржи.</li>
            </ul>
            <p>Обсудите в чате альянса перед запуском: это коллективное решение.</p>

    salon:
        title: "Чат альянса"
        category: "alliance"
        order: 7
        tags: "чат,обсуждение,альянс,сообщение"
        summary: "Внутренний чат вашего альянса: в реальном времени, история и стратегическая база."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="fonctionnement">Как это работает</h2>
            <p><strong>Чат альянса</strong> — это чат в реальном времени, зарезервированный для членов Вашего альянса. Доступен со страницы <strong>Альянс → Чат</strong> (или отдельной кнопкой в меню).</p>
            <p>Сообщения сохраняются: Вы можете подняться вверх по истории, чтобы найти информацию.</p>

            <h2 id="usage">Для чего он служит</h2>
            <ul>
                <li><strong>Координировать атаки</strong> — запустить рейд вдвоём лучше, чем в одиночку и быть отброшенным.</li>
                <li><strong>Предупреждать</strong> в случае обнаружения вражеского флота.</li>
                <li><strong>Делиться координатами</strong> (целевые планеты, интересные поля обломков) — записанные в формате <code>галактика:сектор:позиция</code> (напр. <code>1:15:25</code>), они автоматически становятся кликабельными, как и ссылка на страницу игры.</li>
                <li><strong>Обсуждать стратегию</strong> альянса (исследования, дипломатия, войны).</li>
                <li><strong>Представляться</strong> новым членам и завязывать связи.</li>
            </ul>

            <h2 id="bonnes-pratiques">Хорошие практики</h2>
            <ul>
                <li>Сохраняйте уважение — оскорбления и домогательства могут быть наказаны администратором.</li>
                <li>Избегайте спама: оставьте место для стратегических обсуждений.</li>
                <li>Упоминайте ники соответствующих членов, когда хотите привлечь их внимание.</li>
                <li>Мысленное архивирование: когда даётся совет, держите его в уме — сообщения быстро прокручиваются.</li>
            </ul>

            <h2 id="messages-prives">А личные сообщения?</h2>
            <p>Помимо чата, Вы можете отправить <strong>личное сообщение</strong> любому игроку на сервере (включая вне альянса). Полезно для тихой дипломатии или чтобы незаметно ответить на предложение. Координаты и игровые ссылки там тоже становятся кликабельными, точно как в чате.</p>

    alliance_improvements:
        title: "Улучшения альянса"
        category: "alliance"
        order: 8
        tags: "улучшения,альянс,бонус,биткоин,инвестиции,коллектив,уровни"
        summary: "Инвестируйте биткоины, чтобы разблокировать 16 коллективных бонусов, усиливающих весь ваш альянс — скорость исследований, производство, боевая мощь и многое другое."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="obzor">Обзор</h2>
            <p>Вкладка <strong>Улучшения</strong> на странице альянса позволяет участникам инвестировать биткоины для разблокировки и улучшения <strong>16 коллективных бонусов</strong>. Эти бонусы действуют на <strong>всех активных членов</strong> альянса. Игрок, покинувший альянс, перестаёт получать бонусы, но альянс сохраняет набранные уровни.</p>

            <h2 id="kvota">Квота инвестиций</h2>
            <p>Каждый участник располагает квотой в <strong>20 инвестиций в скользящем окне 3 часа</strong>. Неиспользованные инвестиции сгорают — квота не накапливается. Каждая инвестиция стоит <strong>1 000 биткоинов</strong>, списываемых с личного баланса (постоянный денежный сток).</p>
            <p>В интерфейсе быстрые кнопки <strong>×1 / ×5 / ×10</strong> под каждым бонусом позволяют мгновенно вложить несколько очков одним нажатием.</p>

            <h2 id="urovni">Уровни и пороги</h2>
            <p>Каждый бонус имеет <strong>5 уровней</strong>. Необходимые пороги инвестиций для перехода на следующий уровень:</p>
            <table>
                <tr><th>Уровень</th><th>Необходимые инвестиции</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1 000</td></tr>
            </table>
            <p>⚠️ Инвестиции сверх порога уровня <strong>сгорают</strong> — переноса на следующий уровень нет.</p>

            <h2 id="bonusy">16 бонусов и их эффекты</h2>
            <table>
                <tr><th>Бонус</th><th>Эффект за уровень</th><th>Максимум (уровень 5)</th></tr>
                <tr><td><strong>Скорость исследований</strong></td><td>+2 % за уровень</td><td>+10 %</td></tr>
                <tr><td><strong>Стоимость исследований</strong></td><td>−1 % за уровень</td><td>−5 %</td></tr>
                <tr><td><strong>Ускорение строительства</strong></td><td>+15 с снижения на помощника</td><td>75 с снижения на помощника</td></tr>
                <tr><td><strong>Стоимость строительства</strong></td><td>−1 % за уровень</td><td>−5 %</td></tr>
                <tr><td><strong>Добыча ниобия</strong></td><td>+2 % за уровень</td><td>+10 %</td></tr>
                <tr><td><strong>Производство воды</strong></td><td>+2 % за уровень</td><td>+10 %</td></tr>
                <tr><td><strong>Производство рационов</strong></td><td>+2 % за уровень</td><td>+10 %</td></tr>
                <tr><td><strong>Скорость флота</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Мощь ракет</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Мощь лазера</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Мощь плазмы</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Точность</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Броня флота</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Щит</strong></td><td>+1 % за уровень</td><td>+5 %</td></tr>
                <tr><td><strong>Планетарная защита</strong></td><td>+2 % за уровень</td><td>+10 %</td></tr>
                <tr><td><strong>Опыт героя</strong></td><td>+2 %/уровень</td><td>+10 %</td></tr>
            </table>
            <p>Бонус <strong>«Ускорение строительства»</strong> напрямую питает функцию <a href="/wiki/alliance_construction_help">помощи в строительстве</a>: чем выше его уровень, тем больше каждая помощь союзника сокращает время постройки.</p>

    alliance_construction_help:
        title: "Помощь в строительстве"
        category: "alliance"
        order: 9
        tags: "помощь,строительство,альянс,ускорение,здание"
        summary: "Одно нажатие, чтобы ускорить все текущие стройки союзников сразу — и они делают то же самое для вас."
        related: "alliance_improvements"
        body: |
            <h2 id="obzor">Обзор</h2>
            <p><strong>Помощь в строительстве</strong> позволяет членам альянса ускорять текущие стройки друг друга одним нажатием. Если у одного или нескольких союзников на планете ведётся строительство, в глобальной панели интерфейса появляется <strong>значок помощи</strong> (сердечко). Цифра на значке показывает количество доступных для ускорения строек.</p>
            <p>Нажатие на значок автоматически ускоряет <strong>все подходящие стройки</strong> альянса сразу — выбирать их по одной не нужно.</p>

            <h2 id="vyigrysh">Выигрыш от одной помощи</h2>
            <p>Каждое действие помощи сокращает оставшееся время строительства на:</p>
            <blockquote><strong>15 секунд × уровень бонуса «Ускорение строительства»</strong></blockquote>
            <p>Выигрыш <strong>ограничен 75 секундами</strong> за одну помощь от одного члена (уровень 5 × 15 с = 75 с). Стройка никогда не опускается ниже <strong>30 секунд оставшегося времени</strong> благодаря помощи.</p>
            <table>
                <tr><th>Уровень бонуса</th><th>Выигрыш за помощь</th></tr>
                <tr><td>0 (не разблокирован)</td><td>15 с</td></tr>
                <tr><td>1</td><td>15 с</td></tr>
                <tr><td>2</td><td>30 с</td></tr>
                <tr><td>3</td><td>45 с</td></tr>
                <tr><td>4</td><td>60 с</td></tr>
                <tr><td>5</td><td>75 с</td></tr>
            </table>

            <h2 id="usloviya">Условия для ускорения стройки</h2>
            <p>Чтобы стройка была доступна для помощи, необходимо выполнение обоих условий:</p>
            <ul>
                <li><strong>Общая длительность &gt; 30 секунд</strong> (от начала до плановой даты окончания).</li>
                <li><strong>Оставшееся время &gt; 30 секунд</strong> в момент помощи.</li>
            </ul>
            <p>Почти завершённые стройки (менее 30 с) не получают ускорения от помощи.</p>

            <h2 id="dedupl">Дедупликация</h2>
            <p>Один член альянса может помочь <strong>каждой стройке только один раз</strong>. Значок исчезает автоматически, когда не остаётся строек, которым ты ещё не помогал. Несколько членов могут помочь одной стройке — выигрыши суммируются: 3 члена с уровнем 3 вносят по 45 с, итого 135 с.</p>

            <h2 id="svyaz">Связь с улучшениями альянса</h2>
            <p>Выигрыш от помощи зависит напрямую от уровня бонуса <strong>«Ускорение строительства»</strong> во вкладке <a href="/wiki/alliance_improvements">Улучшения</a>. Инвестирование в этот бонус выгодно всем: чем быстрее союзники заканчивают свои здания, тем быстрее растёт империя альянса.</p>

    leveling:
        title: "Уровни и опыт"
        category: "progression"
        order: 1
        tags: "уровень,опыт,прогресс,level,счёт"
        summary: "Ваш прогресс с 1 по 40 уровень, основанный на размере Вашей империи."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Что учитывается в Вашем счёте</h2>
            <p>Ваш счёт (или «очки командира») отражает <strong>общий размер Вашей империи</strong>:</p>
            <ul>
                <li>Количество <strong>рабочих</strong>.</li>
                <li>Количество и качество <strong>кораблей</strong>.</li>
                <li>Количество <strong>войск</strong> (Легионеры, Меха).</li>
                <li>Уровень построенных <strong>зданий</strong>.</li>
            </ul>
            <p>Корабли учитываются сильно, здания — очень много. Потеря флота в бою снижает Ваш счёт.</p>

            <h2 id="seuils">Пороги уровней</h2>
            <table>
                <tr><th>Уровень</th><th>Требуемый опыт</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100&nbsp;000</td></tr>
                <tr><td>10</td><td>800&nbsp;000</td></tr>
                <tr><td>15</td><td>5&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>18&nbsp;000&nbsp;000</td></tr>
                <tr><td>25</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>30</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>35</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>Прогрессия <strong>экспоненциальная</strong>: подняться с 1 на 10 уровень гораздо быстрее, чем с 30 на 40.</p>

            <h2 id="utilite">Для чего служит Ваш уровень</h2>
            <ul>
                <li><strong>Рейтинг</strong> сервера — публичный показатель Вашей мощи.</li>
                <li><strong>Бонус за вход</strong> — ежедневная сумма зависит от Вашего уровня.</li>
                <li><strong>Признание</strong> — высокий уровень впечатляет друзей и врагов.</li>
            </ul>

    war_points:
        title: "Очки войны (ОВ)"
        category: "progression"
        order: 2
        tags: "ов,очки,война,бой,рейтинг"
        summary: "Вторая валюта игры, зарабатываемая в бою. Служит мерой Вашей агрессивности."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Что такое ОВ?</h2>
            <p><strong>Очки войны</strong> (<strong>ОВ</strong>) — это вторая «валюта» прогрессии, <strong>ориентированная на бой</strong>. Там, где Ваш уровень отражает Ваш размер, Ваши ОВ отражают Вашу военную активность.</p>

            <h2 id="gagner">Как их заработать</h2>
            <ul>
                <li><strong>Космические бои</strong> — ОВ зависят от уничтоженной вражеской мощи, а не от Ваших собственных потерь. Уничтожение орды Ктулху или флота пришельцев приносит намного меньше, чем флот игрока такой же мощи (защита от фарма).</li>
                <li><strong>Проигрыш космического боя</strong> — утешительная выплата всё равно начисляется, пропорционально сигнатуре потерянного флота, но всегда значительно меньше того, что получил бы победитель за такой же флот: пятая часть этой суммы, не больше.</li>
                <li><strong>Орбитальная оборона</strong> — когда ваши турели уничтожают флот на орбите, по тому же соотношению, что и победа в космосе (значительно меньше против Ктулху). А вот снос защиты чужой планеты пока не приносит атакующему ничего.</li>
                <li><strong>Рейды и вторжения</strong> — каждая победа на земле приносит ОВ.</li>
                <li><strong>Ежедневные задания</strong> — некоторые дают ОВ. <strong>3 выполненных за день = +250 ОВ бонуса</strong>.</li>
                <li><strong>Арена (дуэли героев)</strong> — от 50 до 200 ОВ за победу.</li>
                <li><strong>Оборона против Ктулху</strong> — победа в Tower Defense или во вторжении Ктулху.</li>
                <li><strong>Тюрьма</strong> — казнить пленного героя (с модерацией).</li>
            </ul>

            <h2 id="utilite">Для чего они служат</h2>
            <ul>
                <li><strong>Разблокировка некоторых исследований</strong>, требующих ОВ как предпосылки.</li>
                <li><strong>Рейтинг ОВ</strong> (военный) — мера Вашей агрессивности на сервере.</li>
                <li><strong>Пытки пленника</strong> в тюрьме (стоит ОВ, чтобы раскрыть позицию вражеской планеты).</li>
                <li><strong>Взвешенный счёт</strong> в некоторых режимах сервера (таких как Paid Server).</li>
            </ul>

            <h2 id="strategie">Стратегия</h2>
            <p>ОВ вознаграждают <strong>агрессивных</strong> игроков. Если Вы хотите подняться в военном рейтинге, сосредоточьтесь на космических боях и вторжениях, а не на чистом экономическом росте.</p>

    quests:
        title: "Ежедневные задания"
        category: "progression"
        order: 3
        tags: "задания,ежедневные,миссия,награда,ов"
        summary: "3 небольших миссии каждый день. Простые, быстрые, и бонус 250 ОВ, если Вы выполните их все."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Каждый день в <strong>18:59 UTC</strong> игра выдаёт Вам <strong>3 ежедневных задания</strong>. Это небольшие задачи, которые Вы можете выполнить в ходе обычной игровой сессии.</p>

            <h2 id="types">Примеры заданий</h2>
            <ul>
                <li>Шпионить за планетой.</li>
                <li>Продать ресурсы торговцу.</li>
                <li>Колонизировать новую планету.</li>
                <li>Построить или повысить уровень Города / Мегаполиса.</li>
                <li>Отправить личное сообщение другому игроку.</li>
                <li>Написать сообщение в чат альянса.</li>
                <li>Заработать определённое количество ОВ в бою.</li>
                <li>Переработать поле обломков.</li>
            </ul>

            <h2 id="recompense">Награды</h2>
            <ul>
                <li>Каждое выполненное задание даёт <strong>ОВ</strong>: награда выбирается как наибольшее из базового значения задания и 5% от среднего количества очков игроков на сервере — так что выполнять задания выгодно, даже когда Ваша империя становится огромной.</li>
                <li>Если Вы выполните <strong>все 3 задания</strong> до следующего ежедневного отчёта, то на следующий день получите <strong>+250 ОВ бонусом</strong>.</li>
            </ul>
            <p>За 30 дней это 7&nbsp;500 "бесплатных" ОВ дополнительно, только за регулярную игру.</p>

            <h2 id="consulter">Где их посмотреть</h2>
            <p>Ваши задания на день отображаются на странице <strong>Империя</strong> (или в специальном блоке, в зависимости от версии). Отмечаются автоматически по мере выполнения действий.</p>

    ranking:
        title: "Рейтинги"
        category: "progression"
        order: 4
        tags: "рейтинг,ранг,позиция,топ,таблица лидеров"
        summary: "Несколько рейтингов для оценки Вашего прогресса (и прогресса Ваших соперников)."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="types">Доступные рейтинги</h2>
            <table>
                <tr><th>Рейтинг</th><th>Основан на</th><th>Награда</th></tr>
                <tr><td><strong>Очки (Империя)</strong></td><td>Общий размер Вашей империи (рабочие, корабли, войска, здания, оборонительные сооружения).</td><td>Престиж.</td></tr>
                <tr><td><strong>Очки войны</strong></td><td>Военная активность (бои, рейды, вторжения).</td><td>Военный престиж.</td></tr>
                <tr><td><strong>Альянс</strong></td><td>Сумма очков всех членов альянса.</td><td>Венчает самый могущественный альянс.</td></tr>
                <tr><td><strong>Арена (герои)</strong></td><td>Соотношение побед/поражений в дуэлях (минимум 5 боёв).</td><td>Еженедельные награды для топ-3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Лучшие результаты TD на сервере.</td><td>Престиж.</td></tr>
            </table>

            <h2 id="consulter">Где их посмотреть</h2>
            <p>Страница <strong>Рейтинг</strong> в левом меню. Вы можете фильтровать по типу, искать игрока или альянс и видеть свою собственную позицию.</p>

            <h2 id="utilite">Почему это важно</h2>
            <ul>
                <li><strong>Стратегически</strong> — определяйте крупных игроков, которых следует избегать или выбирать в качестве цели.</li>
                <li><strong>Социально</strong> — витрина для вербовки в Ваш альянс.</li>
                <li><strong>Соревновательно</strong> — в некоторых режимах сервера (Paid Server, Доминирование) финальный рейтинг определяет победителя.</li>
            </ul>

    heroes:
        title: "Ваш герой"
        category: "progression"
        order: 5
        tags: "герой,бонус,планета,флот,опыт,захват,тюрьма,специализация"
        summary: "Ваш личный герой: он развивается, сражается, усиливает Вашу империю и может быть захвачен."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Каждый игрок имеет <strong>одного главного героя</strong>, созданного в начале игры. Этот герой должен <strong>всегда</strong> быть назначен либо на планету, либо на флот — никогда свободным. Кроме него Вы можете иметь неограниченное число <strong>второстепенных героев</strong> — см. отдельную статью.</p>
            <p>Пока у Вас нет главного героя — в начале игры или после его казни в тюрьме, — игра возвращает Вас к его созданию: до тех пор игровые страницы закрыты, а страницы Вашего аккаунта остаются доступны. Если один из Ваших второстепенных героев занимает планету, выбранную для нового героя, он возвращается в <strong>резерв</strong>.</p>
            <p>Герой даёт бонусы к бою, интеллекту и скорости в зависимости от его специализации и уровня.</p>
            <p>4 навыка героя: <strong>Атака</strong>, <strong>Защита</strong>, <strong>Интеллект</strong> и <strong>Скорость</strong>.</p>
            <p><strong>Интеллект</strong> даёт бонус к производству ресурсов на планетах и стратегическое преимущество в дуэлях на арене.</p>
            <p><strong>Скорость</strong> сокращает время полёта флотов и питает Порыв в дуэли на арене.</p>

            <h2 id="specialites">Специализации</h2>
            <p>Каждая специализация даёт пассивный бонус и открывает 3 черты на уровнях 5, 10 и 15:</p>
            <ul>
                <li><strong>Военный</strong>: +5&nbsp;% к атаке и защите, как во флоте, так и на земле (против Cthulhu и в PvP), и +5&nbsp;% мощи в дуэли на арене. Черты: <strong>Устрашение</strong> (ур. 5, противник получает −5&nbsp;% наступательной мощи, в том числе против Cthulhu, и −5&nbsp;% к счёту в дуэли), <strong>Тактик</strong> (ур. 10, +10&nbsp;% мощи в первом раунде ваших боёв и +10&nbsp;% в дуэли), <strong>Военачальник</strong> (ур. 15, −5&nbsp;% потерь наземных войск в бою между игроками и +5&nbsp;% мощи в дуэли).</li>
                <li><strong>Экономика</strong>: удваивает бонусы Интеллекта (производство) и лагеря рабов. Черты: <strong>Эффективный</strong> (ур. 5, −10&nbsp;% стоимости строительства), <strong>Торговец</strong> (ур. 10, +15&nbsp;% при продаже торговцу), <strong>Магнат</strong> (ур. 15, +20&nbsp;% производства).</li>
                <li><strong>Исследователь</strong>: +5&nbsp;% к точности флота. Черты: <strong>Разведчик</strong> (ур. 5, +1 к силе радара на планете, куда назначен), <strong>Навигатор</strong> (ур. 10, +15&nbsp;% к скорости флота), <strong>Картограф</strong> (ур. 15, +2 к силе радара на планете, куда назначен).</li>
            </ul>

            <p>В <strong>дуэли на арене</strong> действуют те же правила: военный сохраняет свои +5&nbsp;% и все три черты, удвоенный Интеллект экономики (плюс 20&nbsp;% с Магнатом) питает Хитрость, а удвоенная Скорость исследователя (плюс 15&nbsp;% с Навигатором) — Порыв. Хитрость и Порыв учитываются на 60&nbsp;%.</p>
            <p>Подробная сводка этих бонусов теперь автоматически отображается при создании героя.</p>

            <h2 id="xp">Получение опыта</h2>
            <p>Опыт зарабатывается несколькими способами:</p>
            <ul>
                <li><strong>Бой</strong>: фиксированный опыт + пропорциональный уничтоженной мощи врага, делённый на уровень героя (естественное масштабирование).</li>
                <li><strong>Дуэль на арене</strong>: базовый опыт (30), умноженный в зависимости от напряжённости боя — напряжённая дуэль приносит до 3× больше опыта, чем разгромная победа.</li>
                <li><strong>Пассивно</strong>: +5 опыта/час, когда герой назначен на планету (рассчитывается с производством ресурсов).</li>
            </ul>
            <p>Формула повышения уровня: необходимый опыт = уровень × 500. Каждый уровень игрок получает очки навыков для распределения.</p>

            <h2 id="assignation">Назначение</h2>
            <p>Назначьте Вашего героя со страницы <strong>Планеты</strong> или страницы управления <strong>флотом</strong>. Назначение происходит через AJAX без перезагрузки страницы.</p>
            <p>Героя на флоте в полёте или в бою нельзя переназначить. Если флот уничтожен, герой автоматически переназначается на Вашу столичную планету.</p>

            <h2 id="capture">Захват</h2>
            <p>Герой может быть захвачен в бою:</p>
            <ul>
                <li><strong>Космический бой</strong> (флот уничтожен): 20% шанс</li>
                <li><strong>Вторжение на планету</strong> (планета захвачена): 35% шанс</li>
            </ul>
            <p>Для захвата нужна <strong>Тюрьма уровня 1 или выше</strong>: героя запирают на месте боя, если эта планета Ваша и на ней есть Тюрьма, иначе на Вашей планете с самой высокой Тюрьмой. Без Тюрьмы захвата нет.</p>
            <p>После освобождения герой получает <strong>24 часа иммунитета</strong> от повторного захвата.</p>
            <p>Cthulhu и боты не могут захватывать героев.</p>
            <p>Этот раздел описывает Вашего <strong>главного</strong> героя. Ваши <strong>второстепенные герои</strong> подчиняются совершенно другому правилу захвата, без всякой вероятности — см. статью <em>Второстепенные герои</em>.</p>

    secondary_heroes:
        title: "Второстепенные герои"
        category: "progression"
        order: 6
        tags: "герой,второстепенный,конюшня,захват,казнь,тюрьма,переработка,резерв,добыча"
        summary: "Дополнительные герои, полученные как редкая добыча: те же бонусы, что у главного героя, но их можно окончательно захватить или казнить в бою."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Второстепенный герой даёт <strong>те же бонусы</strong>, что и главный герой, будучи размещённым на планете или флоте. Отличие в том, что при поражении он может быть <strong>окончательно захвачен или убит</strong>. Вы можете накопить несколько таких героев в дополнение к главному.</p>

            <h2 id="obtention">Как их получить</h2>
            <p>Второстепенный герой — это <strong>редкая добыча</strong>, которую никогда нельзя купить:</p>
            <table>
                <tr><th>Источник</th><th>Шанс</th></tr>
                <tr><td>Победа в Tower Defense против Ктулху (за один заход)</td><td>2&nbsp;%</td></tr>
                <tr><td>Отражённая атака Ктулху на одной из Ваших планет</td><td>1&nbsp;%</td></tr>
                <tr><td>Победитель турнира арены</td><td>25&nbsp;%</td></tr>
            </table>
            <p>При получении его имя и специализация выбираются случайно, и он сразу попадает в <strong>резерв</strong> — Вы сами решаете, куда его разместить, или переработать, так и не разместив.</p>

            <p>О каждом полученном герое сообщает <strong>отчёт</strong>, в котором указано, откуда он взялся. Итоговый экран Tower Defense и отчёт о победе над Ктулху тоже сообщают об этом сразу.</p>

            <h2 id="placement">Куда их размещать</h2>
            <p>Как и главного героя: <strong>на планету</strong> или <strong>на флот</strong>, никогда одновременно на оба. Неразмещённый второстепенный герой остаётся в <strong>резерве</strong>: никакого бонуса, но и <strong>никакого риска</strong> — это нормальный выбор, а не оплошность, которую нужно исправлять. Управляйте всеми второстепенными героями на вкладке <strong>Конюшня</strong> страницы Героя.</p>

            <h2 id="gestion">Навыки и снаряжение</h2>
            <p>Второстепенный герой развивается так же, как основной: он получает уровни, а вместе с ними <strong>очки навыков</strong>. Кнопка <strong>Управление</strong> в Конюшне открывает их распределение между Атакой, Защитой, Интеллектом и Скоростью.</p>
            <p>Та же панель управляет его <strong>снаряжением</strong>: наденьте на него свободный предмет из инвентаря или снимите его. Предметы захваченного вражеского героя переходят вместе с ним — именно здесь вы их забираете.</p>

            <h2 id="risque">Чем Вы рискуете</h2>
            <p>Размещённый второстепенный герой может быть потерян <strong>навсегда</strong> при:</p>
            <ul>
                <li>Проигранном <strong>космическом бою</strong> (его флот уничтожен).</li>
                <li>Проигранном <strong>техническом бою</strong> (полностью безоружный флот, уничтоженный без настоящего сражения).</li>
                <li>Успешном <strong>вторжении</strong> на планету, где он размещён.</li>
                <li>Уничтожении его флота <strong>орбитальной обороной</strong> планеты, переведённой в режим атаки.</li>
            </ul>
            <p>Зато он ничем не рискует при:</p>
            <ul>
                <li><strong>Рейде</strong> — даже успешном: рейд никогда не захватывает планету.</li>
                <li>Бою против <strong>Ктулху</strong> (или любого другого противника не из игроков).</li>
                <li><strong>Арене</strong> — дуэли и турниры никогда не подвергают героя риску захвата.</li>
            </ul>

            <p><strong>Уведомление</strong> предупредит вас, как только один из ваших второстепенных героев будет захвачен или казнён: безвозвратная потеря не должна зависеть от того, откроете ли вы отчёт.</p>

            <h2 id="prison">Условие тюрьмы</h2>
            <p>В отличие от главного героя (захват <em>вероятностный</em>, см. статью <em>Тюрьма и захваченные герои</em>), судьба побеждённого второстепенного героя <strong>полностью детерминирована</strong> — никакой случайности:</p>
            <ul>
                <li>У победителя есть <strong>здание Тюрьмы</strong> уровня 1 или выше хотя бы на одной из его планет → он <strong>захватывает</strong> героя, сохраняя его уровень, опыт и предметы нетронутыми.</li>
                <li>У победителя <strong>нет</strong> ни одной построенной Тюрьмы → герой будет <strong>казнён</strong>.</li>
            </ul>
            <p>В блоковом бою (несколько союзников сражаются бок о бок) герой достаётся победившему командиру, <strong>вложившему больше всего сил</strong> в бой — если у него нет Тюрьмы, герой будет казнён, даже если Тюрьма была у союзника из того же лагеря.</p>
            <p>Захваченный второстепенный герой — <strong>не</strong> классический пленник: нет страницы тюрьмы, нет мини-игры побега, нет выкупа. Он сразу попадает, активным, в Конюшню нового владельца, готовым к повторному размещению или переработке.</p>

            <h2 id="no-recovery">Никакого возврата невозможно</h2>
            <p>После захвата или казни второстепенный герой потерян <strong>окончательно</strong>: ни побег, ни выкуп, ни освобождение вторжением бывшего владельца не смогут его вернуть. Единственный способ снова его увидеть — отвоевать его самому в бою, и так он может бесконечно переходить от империи к империи.</p>

            <h2 id="identite">Захваченный герой сохраняет свою личность</h2>
            <p>Захваченный второстепенный герой сохраняет своё <strong>имя</strong>, свой <strong>уровень</strong> и свой <strong>опыт</strong>. В Вашей Конюшне отображается его исходный командир («Захвачен у …»).</p>

            <h2 id="recyclage">Переработка</h2>
            <p>Вы можете <strong>сами казнить</strong> одного из своих второстепенных героев, чтобы передать его опыт главному герою, <strong>минус 10&nbsp;%</strong>. Перед подтверждением отображается точный предварительный расчёт (переданный опыт, прогнозируемый уровень главного героя). <strong>Действие необратимо.</strong></p>

    items:
        title: "Предметы героя"
        category: "progression"
        order: 6
        tags: "предметы,снаряжение,бонус,редкость,дроп,cthulhu,слияние"
        summary: "Экипируйте Вашего героя до 3 предметами для накопления бонусов. Как их получить."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Предметы — это объекты, которые можно экипировать на Вашего героя (максимум <strong>3 предмета</strong>). Они дают разнообразные бонусы, которые добавляются к естественным бонусам героя.</p>

            <h2 id="categories">Категории</h2>
            <ul>
                <li><strong>Наступательные</strong>: Оружие, предметы, ориентированные на атаку</li>
                <li><strong>Оборонительные</strong>: Броня, щиты, защита</li>
                <li><strong>Силовые</strong>: Предметы статуса, смешанные бонусы</li>
            </ul>
            <p>Нет ограничений по типу: Вы можете экипировать 3 наступательных, если хотите.</p>

            <h2 id="raretes">Редкость</h2>
            <ul>
                <li><strong>Обычный</strong>: 1 бонус (+2-5%)</li>
                <li><strong>Редкий</strong>: 1-2 бонуса (+5-10%)</li>
                <li><strong>Эпический</strong>: 2-3 бонуса (+10-15%)</li>
                <li><strong>Легендарный</strong>: 3+ бонуса (+15-25%)</li>
            </ul>

            <h2 id="bonus">Типы бонусов</h2>
            <p>16 возможных типов бонусов: сила Легионеров, сила Мехов, атака флота, защита флота, точность, щит, скорость флота, производство ресурсов, скорость строительства, производство рабочих, производство кораблей, радар, переработка, бонус против Cthulhu, бонус дуэли, бонус опыта.</p>

            <h2 id="obtention">Получение</h2>
            <p>Теперь существует четыре способа получить предметы:</p>

            <h3>Сражаться с Cthulhu</h3>
            <p>Предметы могут выпадать при победе над Cthulhu — как при отражении их высадки на земле, так и при полном уничтожении их орды на орбите до посадки. Шанс дропа одинаков в обоих случаях и зависит от сложности PvE:</p>
            <ul>
                <li><strong>Лёгкая</strong>: 30% обычный, 8% редкий, 1% эпический</li>
                <li><strong>Нормальная</strong>: 40% обычный, 15% редкий, 5% эпический, 0.5% легендарный</li>
                <li><strong>Сложная</strong>: 50% обычный, 25% редкий, 10% эпический, 2% легендарный</li>
            </ul>
            <p>Орда, уничтоженная лишь частично на орбите, всё равно высаживается: тогда именно эта высадка запускает розыгрыш — никогда оба варианта за одну и ту же волну.</p>

            <h3>Победы на арене</h3>
            <p>Каждая победа в дуэли на арене даёт шанс выпадения предмета:</p>
            <ul>
                <li><strong>Обычный</strong>: 15%</li>
                <li><strong>Редкий</strong>: 5%</li>
                <li><strong>Эпический</strong>: 1%</li>
            </ul>

            <h3>Ставки в дуэлях</h3>
            <p>Отправляя вызов, Вы можете поставить предмет. Если противник соглашается, он должен поставить предмет той же редкости. Победитель забирает оба предмета.</p>

            <h3>Слияние трёх предметов</h3>
            <p>Три предмета <strong>одной редкости</strong> сливаются в один предмет более высокой редкости — бесплатно и мгновенно. Категория и бонусы нового предмета определяются случайно, как при обычном дропе. Три исходных предмета расходуются безвозвратно, а предмет, экипированный на героя, нужно сначала снять. Легендарный — максимальная редкость: он не может быть слит.</p>
            <p>Слияние запускается на странице <strong>Командиры</strong>, вкладка <strong>Слияние</strong>: кликните три карточки предметов, чтобы выбрать их (кликабельна вся карточка), затем подтвердите кнопкой слияния — она доступна и над списком, и под ним.</p>

            <h2 id="vol">Кража предметов</h2>
            <p>Если Ваш герой захвачен, его экипированные предметы могут быть украдены победителем. Вероятность кражи: Обычный 80%, Редкий 60%, Эпический 40%, Легендарный 25%.</p>

            <h2 id="inventaire">Инвентарь</h2>
            <p>Откройте инвентарь на странице <strong>Командиры</strong>, вкладка <strong>Инвентарь</strong>. В инвентаре Вы можете:</p>
            <ul>
                <li><strong>Экипировать</strong> предмет на героя (если он активен и экипировано менее 3 предметов)</li>
                <li><strong>Снять</strong> предмет и вернуть его в инвентарь</li>
                <li><strong>Уничтожить</strong> ненужный предмет</li>
                <li><strong>Слить</strong> 3 предмета одной редкости в один предмет более высокой редкости — на соседней вкладке <strong>Слияние</strong></li>
            </ul>
            <p>Каждый предмет отображается в виде <strong>иллюстрированной карточки</strong> с его изображением, бонусами и рамкой, окрашенной в цвет редкости. Карточки располагаются сеткой (3–4 в ряд в зависимости от доступного места на экране).</p>

    prison:
        title: "Тюрьма и захваченные герои"
        category: "progression"
        order: 7
        tags: "тюрьма,захват,герой,побег,пытка,выкуп,темница,второстепенный"
        summary: "Когда герой захвачен, что происходит? Действия заключённого и тюремщика, а также прямой захват вражеских второстепенных героев."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Захват героя</h2>
            <p>Герой захватывается в космическом бою (20%) или при вторжении (35%). Захваченный игрок оказывается заперт: любая страница вне разрешённого периметра перенаправляет его на <strong>страницу тюрьмы</strong>. Тем не менее у него остаётся доступ к <strong>чату альянса</strong>, к его <strong>личным сообщениям</strong>, к его <strong>отчётам</strong>, к <strong>просмотру</strong> (только чтение) своего альянса и к <strong>управлению своим аккаунтом</strong>. Всё остальное — строительство, флоты, карта, рынок, арена и даже страница героя — остаётся недоступным, пока он не будет освобождён.</p>
            <p>Для захвата нужна <strong>Тюрьма уровня 1 или выше</strong>: героя запирают на месте боя, если эта планета Ваша и на ней есть Тюрьма, иначе на Вашей планете с самой высокой Тюрьмой. Без Тюрьмы захвата нет.</p>

            <h2 id="prisonnier">Действия заключённого</h2>
            <p>Каждые <strong>4 часа</strong> заключённый может совершить действие:</p>
            <ul>
                <li><strong>Предупредить альянс</strong> (70% успеха): отправляет координаты тюрьмы в чат альянса. Провал = тюремщик получает оповещение. Без альянса действие недоступно. После неудачи следующее действие ждёт 6 часов вместо 4.</li>
                <li><strong>Сбежать</strong>: одна попытка каждые 4 часа с момента захвата (первая через 4 часа). 40% успеха, +5% за каждые следующие 4 часа плена. Неудача = тюремщик предупреждён. Этот срок не зависит от двух других действий.</li>
                <li><strong>Побег через Slash</strong>: в любое время и без ограничений. См. статью <em>Побег из тюрьмы</em>.</li>
                <li><strong>Заплатить выкуп</strong>: если тюремщик потребовал выкуп, его можно заплатить или отклонить на странице тюрьмы.</li>
                <li><strong>Восстать</strong> (25% + военный бонус): саботаж 5% ресурсов тюрьмы. Провал = потеря уровня. В обоих случаях тюремщик получает отчёт.</li>
            </ul>

            <h2 id="geolier">Действия тюремщика</h2>
            <p>Доступно через здание Тюрьма или Лагерь рабов:</p>
            <ul>
                <li><strong>Казнить</strong>: окончательно уничтожает героя (+ОВ пропорционально уровню). Предметы восстановлены. Владелец героя узнаёт об этом из отчёта.</li>
                <li><strong>Освободить</strong>: дипломатический жест, герой возвращается к своему владельцу.</li>
                <li><strong>Пытать</strong> (стоимость: 200 ОВ): раскрывает положение вражеской планеты.</li>
                <li><strong>Требовать выкуп</strong>: запросить ресурсы в обмен на освобождение (24 часа на принятие).</li>
            </ul>

            <h2 id="liberation">Освобождение</h2>
            <ul>
                <li><strong>Альянс заключённого вторгается</strong>: автоматическое освобождение</li>
                <li><strong>Другой альянс вторгается</strong>: 60% шанс побега, иначе пленник переходит к захватчику, если у того есть Тюрьма, либо освобождается</li>
                <li><strong>Cthulhu вторгается</strong>: все заключённые освобождены</li>
            </ul>

            <h2 id="secondaires">Захват вражеского второстепенного героя</h2>
            <p>Всё вышесказанное — побег, пытка, выкуп, освобождение — касается <strong>главного героя</strong> противника. <strong>Второстепенный герой</strong> (см. статью <em>Второстепенные герои</em>) подчиняется гораздо более прямому правилу, и именно здесь Ваше здание Тюрьмы приобретает <strong>решающее значение</strong>: как только у Вас есть Тюрьма уровня 1 или выше хотя бы на одной из планет, любой вражеский второстепенный герой, побеждённый в бою с Вами (космический бой, технический бой или успешное вторжение), <strong>немедленно и окончательно</strong> становится Вашим — с нетронутым уровнем, опытом и предметами. Без Тюрьмы он будет <strong>казнён</strong> вместо захвата.</p>
            <p>Захваченный второстепенный герой — <strong>не</strong> пленник в смысле этой страницы: нет страницы тюрьмы, нет побега, нет выкупа. Он сразу попадает, активным, в Вашу <strong>Конюшню</strong> — готовым к размещению на планете или флоте, либо к переработке.</p>

            <h2 id="prerequis">Требования</h2>
            <p>Исследование <strong>Тюрьма</strong> (требуется Колючая проволока уровня 5), затем здания <strong>Тюрьма</strong> и <strong>Лагерь рабов</strong>.</p>

    prison_escape:
        title: "Побег из тюрьмы"
        category: "progression"
        order: 8
        tags: "тюрьма,побег,slash,выкуп,герой,захват"
        summary: "Три способа выйти из тюрьмы своими силами: мгновенный побег, Slash и выкуп."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Три выхода</h2>
            <p>Когда Ваш герой захвачен, страница тюрьмы предлагает три способа выйти, не дожидаясь союзников. Мини-игра побега удалена.</p>

            <h2 id="instant">Мгновенный побег</h2>
            <ul>
                <li>Одна попытка каждые <strong>4 часа</strong>. Первая открывается через 4 часа после захвата.</li>
                <li><strong>40%</strong> успеха при первой попытке, затем <strong>+5%</strong> за каждые следующие 4 часа плена, пытались Вы или нет.</li>
                <li>Шанс следующей попытки показан на кнопке.</li>
                <li>Неудача: герой остаётся в тюрьме, а <strong>тюремщик предупреждён</strong>.</li>
            </ul>

            <h2 id="slash">Побег через Slash</h2>
            <p><strong>Slash</strong> — наша другая игра (slash-game.com). Играйте с <strong>тем же адресом электронной почты</strong>, что и в Area Universe, подтверждённым с обеих сторон.</p>
            <ul>
                <li>Наберите <strong>75% лучшего результата недели</strong> в партии, сыгранной <strong>после захвата</strong>.</li>
                <li>Пока в текущей неделе (с понедельника 00:00 UTC) меньше 10 игроков в рейтинге или её лучший результат ниже 50 очков, ориентиром служит лучший результат прошлой недели.</li>
                <li>Вернитесь на страницу тюрьмы и нажмите <strong>Проверить мой результат</strong>: герой будет освобождён.</li>
                <li>Число попыток <strong>не ограничено</strong>, ожидания нет.</li>
                <li>Гостевая учётная запись или неподтверждённый адрес не могут воспользоваться этим выходом.</li>
            </ul>

            <h2 id="ransom">Заплатить выкуп</h2>
            <p>Если тюремщик требует выкуп, он появляется на странице тюрьмы с суммой и сроком (24 часа). Его можно <strong>заплатить</strong> или <strong>отклонить</strong>. Ресурсы списываются со всех Ваших планет и передаются тюремщику. Если ресурсов не хватает, платёж отклоняется и ничего не списывается.</p>

            <h2 id="after">После освобождения</h2>
            <p>Герой возвращается на одну из Ваших планет с оставшимися предметами и получает <strong>24 часа иммунитета</strong> от повторного захвата.</p>

    arena:
        title: "PvP Арена"
        category: "progression"
        order: 8
        tags: "арена,дуэль,турнир,pvp,герой,вызов,рейтинг"
        summary: "Бросайте вызов другим героям в дуэли 1 на 1. Ставьте уран или предметы, получайте престиж."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Система вызовов</h2>
            <p>Со страницы <strong>Арена</strong> отправьте вызов другому игроку. Защитник получает уведомление и может <strong>принять</strong> или <strong>отклонить</strong> вызов.</p>
            <ul>
                <li>Вызов автоматически истекает через <strong>7 дней</strong> без ответа. Число полученных вызовов, ожидающих ответа, отображается на вкладке «Арена» и в пункте меню «Командиры». Время, оставшееся до истечения, отображается рядом с каждым полученным вызовом. После истечения Вы можете снова вызвать того же игрока.</li>
                <li>Вы можете <strong>отменить</strong> отправленный Вами вызов, пока он ожидает ответа.</li>
                <li>Перезарядка: <strong>1 час</strong> между двумя дуэлями для одного и того же игрока. Она проверяется при отправке вызова <strong>и</strong> при его принятии, для обоих героев: накопление ожидающих вызовов не позволяет проводить несколько дуэлей подряд.</li>
                <li>Захваченный герой не может ни вызывать, ни быть вызванным. Захват и принадлежность к одному альянсу перепроверяются при принятии.</li>
                <li>Герой никогда не в опасности (нет захвата на арене).</li>
            </ul>

            <h2 id="combat">Разрешение боя</h2>
            <p>Когда защитник принимает вызов, бой разрешается <strong>немедленно</strong>, а результат показывается на экране игрока, принявшего вызов: победа или поражение, оба счёта, награды и выигранная или проигранная ставка. Оба игрока также получают отчёт. Счёт основан на:</p>
            <ul>
                <li><strong>Уровень</strong> героя: основа счёта</li>
                <li><strong>Атака</strong>: атака героя, +5&nbsp;% если он военный, и наступательные бонусы его предметов</li>
                <li><strong>Защита</strong>: защита героя и защитные бонусы его предметов</li>
                <li><strong>Хитрость</strong> (вес 60&nbsp;%): Интеллект — удваивается для экономики, +20&nbsp;% с чертой Магнат — и вспомогательные бонусы предметов (производство, строительство, переработка, радар)</li>
                <li><strong>Порыв</strong> (вес 60&nbsp;%): Скорость — удваивается для исследователя, +15&nbsp;% с чертой Навигатор — и скорость флота от предметов</li>
                <li><strong>Черты военного</strong>: Тактик +10&nbsp;%, Военачальник +5&nbsp;%, а Устрашение отнимает у противника 5&nbsp;% мощи</li>
                <li><strong>Специализация</strong>: преимущество камень-ножницы-бумага (Военный &gt; Исследователь &gt; Экономика &gt; Военный, +10&nbsp;%)</li>
                <li><strong>Случайный фактор</strong> ±15&nbsp;% с каждой стороны</li>
            </ul>

            <h2 id="mises">Ставки</h2>
            <p>Отправляя вызов, Вы можете добавить необязательную ставку:</p>
            <ul>
                <li><strong>Уран</strong>: каждый игрок ставит одинаковое количество. Победитель забирает обе ставки.</li>
                <li><strong>Предмет</strong>: каждый игрок ставит предмет той же редкости. Победитель забирает оба предмета. Предмет должен быть <strong>снят</strong> (с обеих сторон) и не может участвовать одновременно в двух ожидающих вызовах.</li>
                <li><strong>Дружеский</strong>: без ставки, начисляются только базовые награды.</li>
            </ul>
            <p>Ставка покрыта, если хотя бы одна из ваших планет располагает необходимым ураном: он снимается с вашей самой богатой ураном планеты. Если у игрока в момент принятия нет достаточного урана ни на одной планете, вызов отменяется. Если предмет, поставленный инициатором, больше недоступен, когда защитник принимает вызов (больше не принадлежит ему или надет), дуэль отклоняется.</p>

            <h2 id="recompenses">Базовые награды</h2>
            <p>Победитель получает в каждой дуэли:</p>
            <ul>
                <li>Уран: пропорционально среднему уровню бойцов, но не более <strong>20</strong> за дуэль</li>
                <li>Очки войны: пропорционально уровню победителя (около 225 на 15-м уровне), уменьшаются при большой разнице в уровнях</li>
                <li>Шанс получения предмета: 15% обычный, 5% редкий, 1% эпический</li>
            </ul>
            <p>Проигравший ничего не теряет (кроме возможной ставки).</p>

            <h2 id="classement">Рейтинг</h2>
            <p>Серверный рейтинг отображает лучших дуэлянтов:</p>
            <ul>
                <li>Основан на соотношении побед/поражений</li>
                <li>Минимум <strong>5 боёв</strong> для отображения</li>
                <li><strong>Топ-5</strong> видны прямо на странице; кнопка открывает полный рейтинг с пагинацией и сортировкой</li>
                <li>Еженедельные награды выплачиваются автоматически каждый <strong>понедельник</strong> за предыдущую неделю (с понедельника по воскресенье), один раз: топ-3 по <strong>числу побед в дуэлях</strong> за неделю, минимум <strong>5 дуэлей</strong> за неделю. В рейтинге участвуют только игроки (ни командиры ИИ, ни удалённые аккаунты). 1-й = 3000 урана + 300 ОВ, 2-й = 2000 + 200 ОВ, 3-й = 1000 + 100 ОВ. Каждый награждённый игрок получает отчёт.</li>
            </ul>

            <h2 id="tournois">Турниры</h2>
            <p>Периодическое серверное событие: один турнир каждые <strong>7 дней</strong> на сервере.</p>
            <ul>
                <li>Регистрация открыта <strong>24 часа</strong> на странице Арена. Захваченный герой не может зарегистрироваться и исключается, если его захватят до начала.</li>
                <li>Затем автоматическая сетка на выбывание со случайной жеребьёвкой (лишний игрок автоматически проходит первый раунд) и матч за 3-е место между двумя проигравшими полуфиналистами.</li>
                <li>Нужно не менее <strong>2 участников</strong>: иначе турнир отменяется (без наград), а зарегистрированных уведомляют отчётом. Если зарегистрирован всего один игрок, турнир проходит, когда командир ИИ может дополнить сетку.</li>
                <li>Как только зарегистрирован хотя бы один игрок, <strong>командиры ИИ</strong> сервера (главный герой, не захваченный) дополняют сетку до <strong>8 участников</strong> в сумме. Они регистрируются постепенно в течение 24 часов регистрации, а по её закрытии сетка дополняется, если кого-то ещё не хватает.</li>
                <li>Если зарегистрировано <strong>8 игроков или больше</strong>, ни один командир ИИ не участвует. Без зарегистрированных игроков турнир не проводится: командиры ИИ никогда не играют между собой.</li>
                <li>Каждый бой турнира также приносит победителю обычные награды за дуэль.</li>
                <li>Командиры ИИ борются за пьедестал и получают те же награды, что и игроки, кроме шанса получить вторичного героя.</li>
                <li>Чемпион сохраняет 25 % шанс получить вторичного героя (только для игроков).</li>
            </ul>
            <p>Награды:</p>
            <ul>
                <li>1-й = 5000 урана + 500 ОВ + 1 эпический предмет (20 % шанс на дополнительный легендарный предмет)</li>
                <li>2-й = 3000 урана + 300 ОВ + 1 редкий предмет (10 % шанс на дополнительный эпический предмет)</li>
                <li>3-й = 1500 урана + 150 ОВ + 1 редкий предмет</li>
                <li>Остальные участники = 500 урана + 50 ОВ (10 % шанс на обычный предмет)</li>
            </ul>
            <p>Каждый участник получает отчёт со своим местом и наградами. Страница Арена показывает обратный отсчёт до конца регистрации, пьедестал последнего турнира и дату следующего.</p>

    login_bonus:
        title: "Бонус за вход"
        category: "progression"
        order: 9
        tags: "бонус,вход,ежедневный,биткойн,серия,streak"
        summary: "Бесплатные Биткойны каждый день, умножаемые при нескольких последовательных днях."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>При Вашем <strong>первом входе</strong> каждого календарного дня игра дарит Вам бонус Биткойнов. Это бесплатно и не требует никаких действий, кроме входа.</p>
            <p>Сумма выбирается как <strong>наибольшее</strong> из двух значений ниже, затем умножается на Вашу серию:</p>
            <ul>
                <li><strong>Базовое значение по уровню</strong> с ежедневным случайным числом (×1 до ×5) — гарантирует мотивирующий бонус на старте игры.</li>
                <li><strong>5% от среднего баланса Биткойнов на сервере</strong> — бонус остаётся актуальным по мере роста экономики сервера.</li>
                <li>Результат затем умножается на Ваш <strong>множитель серии</strong> (см. ниже).</li>
            </ul>
            <p>Среднее по серверу исключает крайние аккаунты (5% богатейших и 5% беднейших), а также ботов и тестовые аккаунты.</p>
            <p>Пример: игрок 10 уровня в 1-й день получает не менее 50&nbsp;000–250&nbsp;000 Биткойнов — больше, если 5% от среднего по серверу превышает этот минимум.</p>

            <h2 id="streak">Серия из 7 последовательных дней</h2>
            <p>Ежедневный вход увеличивает Ваш множитель:</p>
            <table>
                <tr><th>Последовательный день</th><th>Множитель</th></tr>
                <tr><td>День 1</td><td>×1.0</td></tr>
                <tr><td>День 2</td><td>×1.2</td></tr>
                <tr><td>День 3</td><td>×1.5</td></tr>
                <tr><td>День 4</td><td>×1.8</td></tr>
                <tr><td>День 5</td><td>×2.0</td></tr>
                <tr><td>День 6</td><td>×2.5</td></tr>
                <tr><td>День 7</td><td>×5.0</td></tr>
            </table>
            <p>На 8-й день цикл начинается заново с 1-го дня. Если Вы <strong>пропускаете день</strong> (более 24 часов без входа), серия сбрасывается до нуля.</p>

            <h2 id="items">Бонусные предметы</h2>
            <p>В некоторые дни серии дополнительно выдаётся <strong>случайный предмет для Вашего героя</strong>:</p>
            <ul>
                <li><strong>День 3</strong>: обычный предмет.</li>
                <li><strong>День 7</strong>: редкий предмет.</li>
            </ul>

            <h2 id="reclamation">Как его забрать</h2>
            <p>Окно открывается автоматически при входе. Один клик, чтобы забрать всё. Ваша <strong>лучшая серия</strong> сохраняется как личный рекорд.</p>

            <h2 id="conseil">Маленький совет</h2>
            <p>Даже 30 секунд подключения достаточно для засчитывания серии. Не пропускайте 7-й день, именно тогда награда максимальна.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,уничтожение,банкротство,конец"
        summary: "2 способа проиграть, и что остаётся после."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">2 типа Game Over</h2>
            <p>Есть два способа быть устранённым с сервера. Знать их — значит уже защищаться от них.</p>

            <h2 id="faillite">1. Экономическое банкротство</h2>
            <p>Если после <strong>ежедневного отчёта в 18:59 UTC</strong> Ваш баланс Биткойнов <strong>отрицательный</strong>: <strong>экономический Game Over</strong>.</p>
            <p><strong>Вас предупредят заранее:</strong> как только Ваш баланс опускается ниже прогнозируемого дневного дефицита (содержание минус доходы), приходит рапорт-предупреждение «Надвигающееся банкротство» — не более одного в день. Получив его, действуйте до следующего ежедневного рапорта.</p>
            <ul>
                <li>Все Ваши <strong>флоты в полёте</strong> уничтожены.</li>
                <li>Ваш баланс <strong>сброшен до 125&nbsp;000 Биткойнов</strong>.</li>
                <li>Ваши <strong>исследования</strong> обнулены.</li>
                <li>Ваша <strong>терраформация</strong> разделена на 2.</li>
                <li>Ваш <strong>рейтинг</strong> сброшен.</li>
            </ul>
            <p>Командир остаётся в живых (он может продолжать играть), но возвращается сильно ослабленным.</p>

            <h2 id="planetes">2. Потеря всех Ваших планет</h2>
            <p>Если Вы теряете Вашу <strong>последнюю планету</strong> (вторжение, добровольный отказ, Battle Royale, где Ваш сектор исчезает), игра <strong>действительно</strong> окончена:</p>
            <ul>
                <li>Все Ваши <strong>флоты</strong> передаются пришельцам.</li>
                <li>Ваш <strong>командир устранён</strong> с сервера.</li>
                <li>Ваша статистика <strong>архивируется</strong> на Вашем аккаунте.</li>
            </ul>

            <h2 id="eviter">Как избежать Game Over</h2>
            <ul>
                <li>Следите каждый день за Вашим <strong>балансом</strong> (доходы − расходы). Если он становится красным, реагируйте.</li>
                <li>Не набирайте избыточно: армия на постоянном содержании может разорить невнимательного экономиста.</li>
                <li>Всегда держите <strong>не менее 2 планет</strong> в состоянии обороны.</li>
                <li>Следите за <strong>приближающимися вражескими флотами</strong> (уведомления, радар).</li>
                <li>В случае большой опасности <strong>эвакуируйте</strong> Ваши войска и ресурсы на безопасную планету.</li>
            </ul>

            <h2 id="apres">Что остаётся после?</h2>
            <p>Даже будучи устранённым, Вы сохраняете Ваш <strong>игровой аккаунт</strong>. Ваша <strong>статистика</strong> предыдущих партий сохраняется, и Вы можете присоединиться к новому серверу.</p>

    game_modes:
        title: "Режимы сервера"
        category: "events"
        order: 1
        tags: "режим,battle royale,доминация,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe предлагает 7 различных режимов сервера со своими правилами и целями."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Обзор</h2>
            <p>Каждый сервер Area Universe имеет свой <strong>режим</strong>, выбираемый администратором при создании. Режим определяет длительность, условие победы и наличие Ктулху.</p>
            <table>
                <tr><th>Режим</th><th>Длительность</th><th>Условие победы</th><th>Ктулху?</th><th>Альянсы?</th><th>Исследования</th></tr>
                <tr><td>Cthulhu</td><td>300 дней</td><td>Нет (таблица выживания)</td><td>Да</td><td>Да</td><td>Обычные</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 дней</td><td>VIP выживает 72 ч</td><td>Нет</td><td>Да (кроме VIP)</td><td>Макс. с начала</td></tr>
                <tr><td>Доминация</td><td>60 дней</td><td>Лучший счёт в конце</td><td>Нет</td><td>Да</td><td>Макс. с начала</td></tr>
                <tr><td>Battle Royale</td><td>40 дней</td><td>Последний выживший</td><td>Нет</td><td>Нет</td><td>Макс. с начала</td></tr>
                <tr><td>Платный сервер</td><td>60 дней</td><td>Лучший взвешенный счёт (бои высоко ценятся)</td><td>Нет</td><td>Да</td><td>Обычные</td></tr>
                <tr><td>Long Run</td><td>900 дней</td><td>Нет (марафон)</td><td>Да</td><td>Да</td><td>Обычные</td></tr>
                <tr><td>Short Run</td><td>150 дней</td><td>Нет (спринт)</td><td>Да</td><td>Да</td><td>Обычные</td></tr>
            </table>

            <h2 id="cthulhu">Режим Cthulhu (классический PvE)</h2>
            <p>Базовый режим, идеально подходит для знакомства с игрой. В течение <strong>первых 72 часов</strong> атак Ктулху нет — это <strong>фаза подготовки</strong>. Затем орды Ктулху периодически атакуют Ваши планеты.</p>
            <p>Условия победы нет: в конце (300 дней) таблица выживания награждает тех, кто лучше всех выжил.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (охота на VIP)</h2>
            <p><strong>VIP</strong> выбирается случайно в конце 48-часового прекращения огня. Его цель — <strong>выжить 72 часа</strong>. Если ему это удаётся, он побеждает. Если его убивает игрок, <strong>убийца становится новым VIP</strong>. Если его уничтожает нечеловеческая причина (Ктулху, событие), случайно выбирается другой игрок.</p>
            <p>VIP <strong>один против всех</strong>: он автоматически исключается из альянса в момент назначения и не может присоединяться к альянсам, пока носит этот статус.</p>

            <h2 id="domination">Доминация (стратегические планеты)</h2>
            <p>Случайно выбираются 5 стратегических планет. Каждый день их владелец получает <strong>+5 очков</strong>. Новая жеребьёвка каждые 5 дней (предупреждение за 24 ч в чате).</p>
            <p>В конце сервера (60 дней) побеждает игрок с лучшим счётом. Для альянсов счёт — это сумма счётов всех участников.</p>

            <h2 id="battle-royale">Battle Royale (последний оставшийся)</h2>
            <p>Соло-режим: <strong>альянсы запрещены</strong>. Регистрация закрывается через 7 дней. Одна галактика.</p>
            <p>Карта — это пространственная сетка из 100 систем, которая <strong>сжимается концентрическими кольцами</strong>: каждый раунд <strong>всё внешнее кольцо исчезает разом</strong> (не система за системой). Уничтоженные системы остаются на экране в виде <strong>дыр</strong>: карта не перестраивается, поэтому безопасная зона видна с первого взгляда.</p>
            <p><strong>5 раундов, по одному в неделю:</strong></p>
            <ul>
                <li>День 7: 36 систем · День 14: 28 · День 21: 20 · День 28: 12 · День 35: последние 3 (<strong>выживает только одна</strong>). Последние 5 дней проходят в центре.</li>
                <li><strong>За 12 часов</strong> до уничтожения кольцо становится <strong>оранжевым</strong> (предупреждение).</li>
                <li><strong>За 1 час</strong> оно становится <strong>мигающе-красным</strong>, и ни один флот не может войти или выйти.</li>
                <li>Уничтоженная система навсегда удаляет свои планеты и флоты.</li>
                <li>Флот, летящий в исчезнувшую систему, уничтожается. Если там был Ваш герой — это поражение.</li>
            </ul>
            <p><strong>Победа</strong>: стать последним активным командиром.</p>

            <h2 id="paid-server">Платный сервер (конкурентный платный)</h2>
            <p>Платный сервер (<strong>5&nbsp;€</strong>), 100&nbsp;% PvP, без Ктулху. Длительность 60 дней.</p>
            <p><strong>Победа</strong>: в конце побеждает игрок с лучшим <strong>взвешенным счётом</strong>. Этот счёт сочетает размер империи и военную активность, причём бои имеют большой вес — это режим для конкурентных игроков.</p>
            <p>Победитель получает <strong>постоянное отличие</strong> в своём профиле, сохраняющееся от сервера к серверу.</p>

            <h2 id="long-short-run">Long Run / Short Run (с событиями)</h2>
            <p>Два режима PvE с запланированными <strong>повторяющимися событиями</strong>: атаки Ктулху, рейды пиратов, бонусы производства, улучшенная переработка, арены альянсов, тотальные войны, межсерверные столкновения…</p>
            <p><strong>Long Run</strong> (900 дней) — спокойный марафон; <strong>Short Run</strong> (150 дней) — более интенсивный спринт. Расписание событий <strong>детерминистское</strong>: Вы можете их предвидеть.</p>

            <h2 id="recherches-max">Режимы с максимальными исследованиями с самого начала</h2>
            <p>В режимах <strong>Search &amp; Destroy, Доминация и Battle Royale</strong> все Ваши исследования начинаются на максимальном уровне — меню исследований скрыто, чтобы сразу играть на военной части.</p>
            <p>Ваша стартовая планета получает <strong>стартовый набор</strong>:</p>
            <ul>
                <li><strong>500 урана</strong> для быстрой кастомизации.</li>
                <li><strong>Все очки кораблей разблокированы</strong> с 1-го дня (1&nbsp;375 очков сразу вместо 40 в день).</li>
            </ul>
            <p>В <strong>Search &amp; Destroy</strong> предоставляется более крупный военный набор, чтобы VIP смог продержаться 72 ч: 2&nbsp;000 Легионеров, 25 барж, 500 эсминцев, 250 тяжёлых лазерных турелей.</p>

            <h2 id="fin-de-serveur">Конец сервера и архивация</h2>
            <p>Когда сервер закрывается, Ваша <strong>финальная статистика</strong> (очки, герои, успехи VIP, победы и т.д.) архивируется в Вашу <strong>учётную запись игрока</strong>. Ваш командир (персонаж этой партии) удаляется, но Ваша история сохраняется.</p>

    cthulhus:
        title: "Угроза Ктулху"
        category: "events"
        order: 2
        tags: "cthulhu,ктулху,улей,орда,гарнизон,осада,угроза,pve,уран,tower defense,td"
        summary: "Ктулху теперь собирают настоящие орды, которые открыто летят к цели, прежде чем атаковать Ваши планеты. Как защищаться, как обороняются их базы, и Tower Defense для отражения натиска."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">Что такое Ктулху?</h2>
            <p><strong>Ктулху</strong> (Одержимые) — это враждебные существа, управляемые игрой (PvE). Они удерживают <strong>базы улья</strong>, разбросанные по галактике, откуда выходят <strong>орды</strong>: настоящие флоты с видимым составом, мощью и маршрутом — а не просто обратный отсчёт.</p>
            <p>Чем больше Вы их отражаете, тем выше растёт <strong>общий уровень угрозы</strong> и тем сильнее становятся последующие атаки.</p>

            <h2 id="menace">Уровень угрозы</h2>
            <p>При каждой победе над вторжением Ктулху уровень угрозы для Вашей империи повышается. Прирост больше при высокой сложности и в зависимости от режима альянса:</p>
            <table>
                <tr><th>Сложность</th><th>Без альянса</th><th>Альянс «Молот Звёзд»</th><th>Другой альянс</th></tr>
                <tr><td>Лёгкая</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Нормальная</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Сложная</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p><strong>«Молот Звёзд»</strong> снижает прирост угрозы (оборонительный режим спокойнее переносит Ктулху).</p>
            <p>Угроза также <strong>растёт сама по себе</strong>: +5 с каждым ежедневным отчётом Империи и +1 за каждый час, пока орда остаётся на орбите одной из Ваших планет перед высадкой (не выше 300 и только после первого контакта с Ктулху). Победа в Tower Defense <strong>делит её пополам</strong>: усердный игрок держит угрозу низкой, а тот, кто её запускает, рискует всё более крупными ордами.</p>

            <h2 id="puissance">Мощь вторжений</h2>
            <p>Мощь вторжения Ктулху зависит от:</p>
            <ul>
                <li><strong>накопленного уровня угрозы</strong>;</li>
                <li>выбранной <strong>сложности</strong>;</li>
                <li><strong>терраформирования</strong> целевой планеты.</li>
            </ul>
            <p>На <strong>Лёгкой</strong> сложности мощь атаки делится на 2. На <strong>Сложной</strong> она увеличена.</p>

            <h2 id="horde">Атака: настоящая орда</h2>
            <p>Атака всегда начинается со <strong>сбора</strong>: орда собирается на орбите базы улья в течение <strong>6 часов</strong> (12 часов для орды-босса), прежде чем отправиться в путь.</p>
            <p>В полёте она движется на <strong>скорости орды</strong> — медленно и хорошо заметно на <strong>радаре</strong> — а предупреждение <strong>гарантированно приходит за 1 час до прибытия</strong>, независимо от Вашего радарного покрытия.</p>
            <p>Это <strong>настоящий флот</strong>: Вы можете уничтожить его в любой момент — во время сбора над базой, в полёте, уже на орбите Вашей планеты, или победив в <strong>Tower Defense</strong> (доступен, как только орда запланирована или уже активна). Уничтожение отменяет атаку в любой момент.</p>
            <p>По прибытии происходит <strong>орбитальный бой</strong> (Ваши флоты и турели против орды). Выжившие высаживаются <strong>через 2 часа</strong> для наземного штурма. Несколько орд могут одновременно собираться или лететь, со случайным составом.</p>
            <p>Единственное исключение — <strong>инфильтрация</strong> (открывается с уровня 200): она остаётся <strong>мгновенной и невидимой</strong> — без сбора и без предупреждения.</p>

            <h3>Если Ваша защита победит</h3>
            <table>
                <tr><th></th><th>Лёгкая</th><th>Нормальная</th><th>Сложная</th></tr>
                <tr><td>Потери Легионеров</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                <tr><td>Потери Мехов</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                <tr><td>Потери рабочих</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
            </table>
            <p>Вы получаете <strong>ОВ</strong> и шанс <strong>выпадения предмета</strong>.</p>

            <h3>Если орда победит на земле</h3>
            <p>Разграбление и захват теперь <strong>пропорциональны тому, что осталось от орды</strong> после орбитального боя: орда, уничтоженная наполовину, грабит вдвое меньше. При выживании ниже <strong>90&nbsp;%</strong> у неё уже не хватает войск для захвата планеты, даже на Сложной сложности.</p>
            <table>
                <tr><th></th><th>Лёгкая</th><th>Нормальная</th><th>Сложная</th></tr>
                <tr><td>Разграбление ресурсов (орда без потерь)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Планета захвачена (при ≥ 90&nbsp;% выживания)</td></tr>
                <tr><td>Снижение угрозы после поражения</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>На <strong>Сложной</strong> сложности без достаточного числа выживших для захвата разграбление возвращается к ставке <strong>Нормальной</strong> сложности (70&nbsp;%), умноженной на долю выживших орды. Если планета захвачена и это была последняя — Game Over.</p>

            <h2 id="bases">Базы улья</h2>
            <p>Улей удерживает <strong>базы</strong>, разбросанные по галактике: исходные базы улья (до 36 на галактику, с растущей мощью — их названия идут от «Ктулху I» для форпостов до грозного «Ктулху V») и бывшие планеты игроков, обращённые расширением или извержением. Каждая защищена <strong>постоянным гарнизоном</strong>, восстанавливающимся за <strong>24 часа</strong> при ослаблении.</p>
            <p>Скопление флота игрока на орбите базы (суммарная сигнатура не менее <strong>10 000</strong>) запускает <strong>осаду</strong>: осаждённая база больше не отправляет орды (они теперь стартуют с более дальней базы), <strong>волны обороны</strong> усиливаются (+25&nbsp;% каждые 2 часа), а через <strong>6 часов</strong> другие базы отправляют <strong>флоты подкрепления</strong>. Осаждённая база отмечена значком <strong>«База в осаде»</strong> на карте галактики. Когда осада снята, флоты подкрепления возвращаются домой, а база снова получает обычный гарнизон.</p>
            <p>Когда осада снимается, каждый участник получает выплату <strong>пропорционально уничтоженной сигнатуре</strong>: 0,02 биткоина за очко, плюс очки войны.</p>

            <h2 id="liberation">Освобождение базы</h2>
            <p>Успешное вторжение на базу улья — теперь включая инопланетные базы «Ктулху I» — «V» — приносит обычные награды (уран, шанс выпадения предмета) <strong>и</strong> снижает <strong>Угрозу вселенной</strong> на <strong>50 очков</strong>, отсрочивая следующее пророчество Ктулху (см. статью <em>Пророчества Ктулху</em>). Освобождённая таким образом планета получает <strong>защиту на 72 часа</strong>: улей не может ни повторно колонизировать её, ни устроить на ней извержение в течение этого срока. Если освобождённая планета изначально была планетой игрока — захваченной ульем, обращённой после проигранного вторжения, покинутой, или возникшей в результате расширения или извержения — она остаётся колонизируемой, и Ваш отчёт об освобождении сообщает крайний срок для отправки туда колонизатора. Исходные форпосты улья («Ктулху I» — «V»), напротив, остаются непригодными после освобождения: планета остаётся свободной, но отправить туда колонизатор нельзя, и никакой крайний срок не объявляется.</p>
            <p>И наоборот, поражение при вторжении на инопланетную базу теперь также повышает Вашу <strong>личную угрозу на 10 очков</strong> — как и при обычной базе Ктулху.</p>

            <h2 id="expansion">Расширение и извержение</h2>
            <p>Улей расширяется сам: как только <strong>Угроза вселенной</strong> достигает <strong>300 очков</strong>, каждые <strong>3 дня</strong> (каждый <strong>день</strong>, если угроза превышает <strong>500</strong>) от существующей базы отправляется <strong>рой спор</strong> к необитаемой планете рядом с игроками — до <strong>36 баз на галактику</strong>. Это флот, как и любой другой: <strong>его можно перехватить в полёте</strong>. При прибытии он основывает новую базу с гарнизоном, а игроки в пределах <strong>5 секторов</strong> получают отчёт.</p>
            <p>Уничтожение <strong>всех</strong> баз не избавляет от улья навсегда: после <strong>48 часов тишины</strong> <strong>извержение</strong> поднимает базу в другом месте, с отчётом для игроков рядом. Это извержение никогда не может произойти <strong>ближе 8 секторов</strong> от планеты игрока, а также на планете, ещё находящейся под защитой освобождения: улей возрождается в пустоте, а не на Ваших землях. Если достаточно изолированного сектора не найдётся, извержение просто откладывается до следующего окна.</p>

            <h2 id="changement-difficulte">Смена сложности</h2>
            <p>Вы можете изменить сложность PvE из Ваших <strong>настроек</strong>. Внимание: между двумя изменениями применяется <strong>кулдаун 72 ч</strong> — никакого уклонения от крупных атак.</p>

            <h2 id="tower-defense">Tower Defense (TD)</h2>
            <p><strong>Tower Defense</strong> — это мини-игра активной защиты. Она доступна, как только орда <strong>запланирована</strong> (собирается на своей базе) или уже <strong>активна</strong> (в полёте или на орбите): Вы можете запустить её, чтобы уничтожить орду до того, как она нанесёт урон. Это интерактивный режим: Вы размещаете свои защиты на сетке и отражаете волны монстров Ктулху в реальном времени.</p>
            <p>Совет: чтобы разместить несколько защит подряд (юниты, стены, колючая проволока), <strong>зажмите и проведите</strong> — линия автоматически фиксируется <strong>по прямой</strong> (горизонтальной или вертикальной), и все пройденные клетки заполняются без пропусков, даже при быстром движении.</p>
            <p>Сложность TD — это ваш уровень <strong>PvE</strong> (задаётся в настройках). <strong>Обучение</strong> — это тренировка: оно ничего не приносит и ничего не стоит. После запуска первой волны выход из партии считается <strong>сдачей</strong> (поражением).</p>
            <p>Над ареной плывёт <strong>туман</strong>, гуще у разломов и пока рядом босс. Он стелется под вашими защитами и монстрами и ничего не скрывает. Кнопка <strong>Туман</strong> на панели отключает его, если устройство не справляется.</p>

            <h3>Возможный результат</h3>
            <ul>
                <li><strong>Победа</strong> — активная орда уничтожена, атака отменена. Вы получаете уран, угроза снижается (÷2). Кулдаун 6 ч перед следующим TD.</li>
                <li><strong>Поражение</strong> — частичные награды; если орда уже высадилась, наземный бой происходит немедленно.</li>
                <li><strong>TD не сыгран</strong> — орда проходит свой обычный путь: сбор, полёт, прибытие, высадка.</li>
            </ul>

            <h3>Отчёт по итогам игры</h3>
            <p>В конце каждого Tower Defense (победа или поражение) во вкладке <strong>Ктулху</strong> ваших отчётов сохраняется <strong>отчёт</strong>: пройденные волны, очки, собранный уран, снижение угрозы, потери по типам юнитов и уничтоженные враги по типам. Удобно сравнивать свои забеги.</p>

            <h3>Как играть</h3>
            <ul>
                <li>Выберите сложность: Лёгкая, Нормальная или Сложная.</li>
                <li>Разместите свои юниты на сетке. <strong>Штаб в центре</strong>; монстры выходят из <strong>1–4 разломов Ктулху</strong>, открывшихся у края платформы.</li>
                <li>Монстры пересекают сетку, чтобы добраться до Вашего штаба: атакуйте их по пути.</li>
                <li><strong>Стены</strong> (150 на Лёгкой, 125 на Нормальной, 75 на Сложной): монстры обходят их — у каждого разлома всегда остаётся путь к штабу (стена, которая его запечатала бы, отклоняется). Башни путь не блокируют: монстр, упёршийся в башню, останавливается и разрушает её.</li>
                <li><strong>Колючая проволока</strong> (30/20/10 в зависимости от сложности, требуется исследование «Колючая проволока»): не блокирует, но ранит и замедляет монстров, проходящих через неё.</li>
                <li><strong>Запомненная расстановка</strong>: Ваше размещение (башни, стены, проволока) сохраняется для каждого сервера и предлагается заново в начале каждой партии.</li>
                <li>Большие волны приходят <strong>группами</strong> (до 20 монстров одновременно): волна никогда не растягивается дольше ~2 минут.</li>
                <li><strong>Немедленное поражение</strong>: если все враги волны прорываются сквозь Вашу оборону и достигают штаба, партия проигрывается мгновенно — победить без эффективной обороны невозможно (особенно на Лёгкой сложности).</li>
                <li>Между волнами рабочие автоматически ремонтируют повреждённые турели.</li>
                <li>Скорость регулируется от ×1 до ×10, с возможной паузой.</li>
                <li><strong>Волны без пауз</strong>: опция на верхней панели автоматически запускает следующую волну сразу после окончания текущей — без фазы подготовки и с сохранением вашей скорости, до победы или поражения. Отключите её во время волны, чтобы в конце этой волны снова получить паузу подготовки. Недоступна в обучении.</li>
                <li>Бой длится <strong>максимум 20 волн</strong>, всё более интенсивных.</li>
                <li><strong>Интерфейс</strong>: верхняя панель на всю ширину (пилл штаба + полоса HP, круглый счётчик волны, очки, кнопка «Старт» и иконки звук / музыка / инфо юнитов / сетка / волны без пауз справа), панель «Юниты» справа с сеткой из 2 колонок вертикальных карточек (иконка + имя + запас + характеристики). Во время игры нет ни бокового меню, ни футера — вся ширина экрана отдана карте.</li>
            </ul>

            <h3>Ваши юниты для TD</h3>
            <p>Ваши планетарные юниты (Легионеры, Меха, турели) конвертируются в юниты TD по <strong>коэффициенту конвертации</strong>. У каждого типа юнитов есть максимальное количество для размещения, чтобы поощрять тактическое разнообразие.</p>

            <h3>Монстры, с которыми Вы сталкиваетесь</h3>
            <ul>
                <li><strong>Глубинный</strong> — базовый монстр. Ничего особенного, но их много.</li>
                <li><strong>Наблюдатель</strong> — очень быстрый, но хрупкий. Нужно быстро перехватить.</li>
                <li><strong>Шогготт</strong> — медленный, массивный, тяжело бронированный. Трудно сбить.</li>
                <li><strong>Звёздный вампир</strong> — стреляет снарядами на расстоянии по Вашим защитам.</li>
                <li><strong>Иллитид</strong> — может <strong>превращать Ваших Легионеров в монстров</strong> (визуальный эффект конверсии), не чаще одного в секунду и ни одного после смертельного удара.</li>
                <li><strong>Босс Ктулху</strong> — огромный, редкий (Нормальная/Сложная, высокая угроза). Призывает вокруг себя Глубинных.</li>
            </ul>

            <h3>Полезные механики</h3>
            <ul>
                <li>Юниты и монстры имеют <strong>разные размеры</strong> на сетке (Легионер 1×1, Мех 2×1, турель 2×2, Босс 2×2).</li>
                <li><strong>Полоса волны</strong> отображает количество оставшихся врагов.</li>
                <li>Если Вы обновите страницу, партия <strong>продолжится ровно с того места, где Вы остановились</strong>.</li>
                <li>Сохранённую партию нужно <strong>продолжить</strong>, прежде чем начать новую.</li>
            </ul>

            <h3>Награды и потери</h3>
            <ul>
                <li><strong>Победа</strong>: снижение угрозы + уран + орда уничтожена.</li>
                <li><strong>Поражение</strong>: частичные награды; если орда уже прибыла, высадка происходит немедленно.</li>
                <li><strong>Потери юнитов реальны</strong> в обоих случаях (Легионеры, погибшие в TD = погибшие по-настоящему).</li>
            </ul>

            <h3>Рейтинг TD</h3>
            <p>Серверный рейтинг хранит <strong>лучшие результаты</strong> Tower Defense. Ещё одна таблица для покорения.</p>

    events:
        title: "Специальные события"
        category: "events"
        order: 3
        tags: "событие,total war,alliance arena,raiders"
        summary: "Периодические события оживляют жизнь сервера: бонусы, испытания, конкурсы между альянсами."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Принцип</h2>
            <p>Некоторые режимы сервера (Long Run, Short Run) регулярно запускают <strong>специальные события</strong>. Они длятся несколько часов или дней и временно изменяют правила, чтобы разнообразить партию.</p>
            <p>Расписание <strong>детерминистское</strong>: Вы можете предвидеть каждое событие и планировать стратегию соответственно.</p>

            <h2 id="liste">События, с которыми Вы можете столкнуться</h2>
            <table>
                <tr><th>Событие</th><th>Что происходит</th></tr>
                <tr><td><strong>Total War</strong></td><td>Всеобщая тотальная война — все альянсы могут свободно атаковать друг друга.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Бонус военного производства: быстрее вербовка и изготовление.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>Волны NPC-врагов атакуют серверы. Защищайтесь или контратакуйте.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Защитите угрожаемых торговцев. Награды, если Вы спасёте NPC.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Вторгайтесь на планеты Ктулху ради наград в уране.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Атакуйте флоты Ктулху, чтобы получить ОВ.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Период бонусов за уничтожение вражеских флотов.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Временно увеличенная вместимость переработки. Идеальное время для сбора обломков.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Соревнование между альянсами: рейтинговые бои и коллективные награды.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Противостояние между разными серверами. Побеждает лучший сервер.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Запланирована интенсивная волна Ктулху — подготовьте свою защиту.</td></tr>
            </table>

            <h2 id="ou">Где увидеть расписание?</h2>
            <p>Страница <strong>Событий</strong> (левое меню в соответствующих режимах). Там Вы увидите список предстоящих событий, их даты и эффекты.</p>

            <h2 id="strategie">Как извлечь выгоду</h2>
            <ul>
                <li><strong>Готовьтесь</strong> заранее: стройте армию перед Total War, переработчиков перед бонусом Recycling.</li>
                <li><strong>Обсуждайте в чате</strong>: событие — это повод скоординироваться с Вашим альянсом.</li>
                <li><strong>Пользуйтесь бонусами</strong>: не запускайте крупное производство вне Product Army, если можете подождать.</li>
            </ul>

    alliance_arena:
        title: "Альянсовая арена"
        category: "events"
        order: 9
        tags: "альянс,арена,сетка,pvp,событие,турнир,сектор,планета,флот,база,история,зритель"
        summary: "Повторяющееся событие каждые 3 дня: твой альянс сражается с другими в битве за сектор — копии флотов, планеты, которые нужно удерживать, — чтобы наполнить общий банк и получить личный бонус."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Когда стартует</h2>
            <p>Событие возвращается <strong>каждые 3 дня</strong> на соответствующих серверах. Расписание дня арены (время Europe/Paris):</p>
            <ul>
                <li><strong>08:00</strong> — анонс в салоне «Вселенная» (на всех языках) и <strong>открытие регистрации</strong>, с уведомлением членам альянса.</li>
                <li><strong>18:45</strong> — закрытие регистрации: состав сетки зафиксирован.</li>
                <li><strong>19:00</strong> — первый тур. Следующие туры начинаются в <strong>19:15</strong> и <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — окончание боёв, выдача наград.</li>
            </ul>
            <p>Если на 19:00 во всём сервере зарегистрировано меньше <strong>2 альянсов</strong>, событие отменяется и общий broadcast предупреждает всех.</p>

            <h2 id="inscription">Как зарегистрироваться</h2>
            <p>Когда регистрация открывается, <strong>модальное окно открывается автоматически</strong> в твоём интерфейсе. Также ты можешь зайти через вкладку «Арена» на странице твоего альянса.</p>
            <p>Условия:</p>
            <ul>
                <li>Быть членом альянса.</li>
                <li>Иметь хотя бы <strong>1 атакующий корабль</strong> (на земле или во флоте) на момент спавна (19:00).</li>
            </ul>
            <p>Ты можешь отменить регистрацию до 19:00. Если на 19:00 у тебя больше не осталось атакующих кораблей (потеряны в реальном бою между регистрацией и спавном), тебе автоматически засчитывается неявка — твой альянс продолжает без тебя.</p>
            <p><strong>ИИ-командиры</strong>: ИИ-командиры твоего альянса следуют за твоей регистрацией — как только зарегистрировался человек из альянса, до 4 из них присоединяются к блоку рядом с ним (не более 5 регистраций на альянс). Полностью ИИ-альянсы тоже регистрируются, чтобы заполнить сетку.</p>

            <h2 id="combat">Как это происходит</h2>
            <p>Каждый матч проходит в <strong>секторе, созданном специально для него</strong> и показанном как космическая карта: сетка 5 × 5, где сражаются <strong>от 2 до 4 альянсов</strong>. Каждый альянс стартует со своей <strong>базы</strong> в середине одного из краёв сектора.</p>
            <p>Твои корабли <strong>копируются</strong> для арены: ничто из того, чем ты владеешь, не под угрозой. Никаких настоящих потерь, никаких обломков, никаких пленённых героев.</p>
            <ul>
                <li>Матч длится не более <strong>15 минут</strong>.</li>
                <li>Побеждает альянс, первым набравший <strong>300 очков</strong>; иначе — лучший счёт по истечении времени. При равенстве: больше удерживаемых планет, затем больше нанесённого урона.</li>
                <li>В следующий тур проходит только один альянс из сектора. Сетка на выбывание — не более 3 туров; победитель последнего матча становится чемпионом сервера.</li>
            </ul>

            <h2 id="flotte">Твой флот</h2>
            <p>Ты начинаешь с <strong>одним флотом</strong>, собранным из всех твоих атакующих кораблей — и тех, что на земле, и тех, что во флотах, — и с твоим главным героем.</p>
            <ul>
                <li><strong>Отправить</strong>: выбери флот, нажми на планету и подтверди. Время полёта показывается до вылета, а отменить полёт нельзя.</li>
                <li><strong>Разделить</strong>: выдели часть кораблей в новый флот (не более 4 флотов). Флот летит со скоростью своего самого медленного корабля: эскадра одних истребителей втрое быстрее флота, который тащит за собой броненосцы.</li>
                <li><strong>Объединить</strong>: два твоих флота на орбите одной планеты можно слить.</li>
            </ul>
            <p>Когда два альянса оказываются на одной планете, бой решается через <strong>5 секунд</strong> — время, чтобы подошли подкрепления, — по <strong>тем же правилам, что и космический бой</strong> в игре. Флот, вступивший в бой, не может улететь до его окончания.</p>
            <p>Уничтоженный флот не потерян: он <strong>восстанавливается на твоей базе</strong> в полном составе через 45 секунд — на 15 больше за каждое новое уничтожение, но не более 2 минут. Каждый уничтоженный вражеский флот приносит твоему альянсу <strong>5 очков</strong>.</p>
            <p><strong>ИИ-командиры сражаются по-настоящему</strong>: они занимают свободные планеты, избегают заведомо проигранных боёв и возвращаются на ремонт. Если ты не открываешь экран матча и минуту не отдаёшь приказов, автопилот играет и за тебя — управление возвращается к тебе, как только ты вернёшься.</p>

            <h2 id="planetes">Планеты и очки</h2>
            <p>Альянс, оставшийся <strong>один</strong> на чужой планете, захватывает её через <strong>15 секунд</strong>; прибывший враг обнуляет отсчёт. Планета <strong>остаётся за твоим альянсом</strong>, когда твои флоты улетают, пока её не отобьёт другой. В этом и состоит выбор: рассредоточиться ради очков или собраться, чтобы выигрывать бои.</p>
            <p>Каждые <strong>10 секунд</strong> каждая удерживаемая планета приносит очки:</p>
            <table>
                <tr><th>Планета</th><th>Очки</th><th>Дополнительно</th></tr>
                <tr><td><strong>Мир</strong> (4 на сектор)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Верфь</strong></td><td>1</td><td>Ремонтирует твои флоты на орбите: 10&nbsp;% состава за период.</td></tr>
                <tr><td><strong>Нексус</strong> (в центре)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Каждое очко, принесённое планетой, по окончании матча также даёт <strong>ПДГ в банк твоего альянса</strong>: 3 ПДГ за очко в 1-м туре, 8 во 2-м, 15 в 3-м — выиграл ты матч или нет. Очки за уничтоженные флоты и разорённые базы ПДГ не приносят.</p>

            <h2 id="bases">Базы</h2>
            <p>Твоя база — точка старта и восстановления; твои флоты ремонтируются на ней (5&nbsp;% за период). Захватить её нельзя, но можно <strong>разорить</strong>.</p>
            <p>Базу защищает <strong>планетарная оборона всех планет игроков альянса, участвующих в матче</strong>, сложенная вместе: взять её трудно. Отбитая атака всё равно повреждает оборону, и она восстанавливается на 10&nbsp;% за период.</p>
            <p>Если оборона пала, база разорена: <strong>50 очков</strong> атакующему, его флоты сразу отправляются домой, а база 2 минуты неприкосновенна.</p>

            <h2 id="recompenses">Награды</h2>
            <p>Два типа наград, которые суммируются.</p>
            <h3 id="banque">Альянсовый банк</h3>
            <table>
                <tr><th>Достигнутый тур</th><th>Bitcoin</th><th>ПДГ</th></tr>
                <tr><td>Проигравшие тур 1</td><td>50 000</td><td>1 000</td></tr>
                <tr><td>Проигравшие тур 2</td><td>150 000</td><td>3 000</td></tr>
                <tr><td>Проигравшие тур 3</td><td>350 000</td><td>8 000</td></tr>
                <tr><td><strong>Чемпион</strong></td><td><strong>1 000 000</strong></td><td><strong>25 000</strong></td></tr>
            </table>
            <h3 id="perso">Индивидуальный бонус</h3>
            <p>Зачисляется напрямую на твой личный кошелёк, при условии, что ты <strong>сам отдал хотя бы один приказ</strong> за матч: если весь матч за тебя играл автопилот, бонуса нет.</p>
            <table>
                <tr><th>Достигнутый тур</th><th>Личные Bitcoin</th></tr>
                <tr><td>Проигравшие тур 1</td><td>5 000</td></tr>
                <tr><td>Проигравшие тур 2</td><td>15 000</td></tr>
                <tr><td>Проигравшие тур 3</td><td>30 000</td></tr>
                <tr><td><strong>Чемпион</strong></td><td><strong>50 000</strong></td></tr>
            </table>
            <p>Ты суммируешь бонус со всех достигнутых туров. Чемпион = 5 000 + 15 000 + 30 000 + 50 000 = <strong>100 000 Bitcoin</strong> на твой кошелёк, в дополнение к ПДГ, которые твои удерживаемые планеты принесли банку.</p>

            <h2 id="rapports">Боевые отчёты</h2>
            <p>По окончании каждого матча каждый игрок получает <strong>отчёт</strong> на странице «Отчёты»: результат, счёт твоего альянса и каждого противника, удерживаемые планеты, разорённые базы, твой нанесённый и полученный урон, вражеские флоты, уничтоженные твоими, и потерянные тобой, оставшийся состав, твоё место по урону среди пилотов альянса — с титулом <strong>MVP матча</strong> для первого — и ПДГ, зачисленные в банк.</p>
            <p>По окончании турнира к нему добавляется <strong>личная сводка</strong>: путь твоего альянса по сетке, итог матчей, твой общий вклад и разбивка твоих наград (личный бонус, банк альянса, удерживаемые территории).</p>

            <h2 id="suivi">Следить за событием на вкладке «Арена»</h2>
            <p>Вкладка <strong>«Арена»</strong> на странице твоего альянса всегда показывает реальное состояние события: нет активной арены, скоро следующая арена (с обратным отсчётом до анонса), анонсирована, регистрация открыта или закрыта, арена идёт, или завершена. Обратный отсчёт показывает время до следующего этапа (закрытие регистрации, начало боёв, следующий раунд), а панель показывает, сколько членов твоего альянса уже зарегистрировано от общего числа.</p>
            <p>После завершения арены вкладка также хранит <strong>историю результатов</strong> твоего альянса (сыгранные арены, титулы чемпиона, лучший достигнутый раунд, баланс побед/поражений) и историю последних десяти выпусков, сыгранных на твоём сервере, с результатом твоего альянса и наградами, полученными каждый раз.</p>

            <h2 id="spectateur">Режим зрителя</h2>
            <p>Не зарегистрирован на текущую арену? Ты всё равно можешь следить в прямом эфире за матчами <strong>своего альянса</strong> на вкладке «Арена»: сектор показывается точно так же, как пилоту, но отдавать приказы ты не можешь.</p>

            <h2 id="astuces">Советы</h2>
            <ul>
                <li><strong>Бери Нексус рано</strong>: он приносит столько же, сколько три мира. Но это знают все.</li>
                <li><strong>Выделяй истребители</strong>: быстрая эскадра захватывает миры, пока тяжёлый флот держит центр.</li>
                <li><strong>Прибывайте вместе</strong>: флоты, прибывшие в одни и те же 5 секунд, сражаются сообща; одинокий флот уничтожают, и он дарит 5 очков.</li>
                <li><strong>Держи верфь</strong>: на ней твои флоты ремонтируются вдвое быстрее, чем на базе.</li>
                <li><strong>Не стой на месте</strong>: захваченная планета остаётся твоей, когда ты улетаешь. Лети за следующей.</li>
                <li><strong>Базу берут вместе</strong>: атаковать целую базу в одиночку — значит дарить очки. Вместе с союзниками, в одном 5-секундном окне, это 50 очков разом.</li>
                <li><strong>Отдай хотя бы один приказ</strong>: без твоего приказа личного бонуса не будет.</li>
            </ul>

            <h2 id="mobile">На мобильном</h2>
            <p>Арена играется на мобильном пальцем:</p>
            <ul>
                <li><strong>Альбомная ориентация</strong> включается принудительно при входе в матч в мобильном приложении. В мобильном браузере, где игра не может повернуть экран, сообщение предложит повернуть устройство.</li>
                <li><strong>Весь сектор помещается на экране</strong>: ни масштаба, ни камеры.</li>
                <li><strong>Три касания на приказ</strong>: твой флот (на нижней панели или касанием его планеты), планета назначения, затем кнопка «Отправить».</li>
                <li><strong>Рамка и тег</strong> каждой планеты показывают, чья она; числа в её углах — силы на орбите: твои зелёным, вражеские красным.</li>
                <li><strong>Кнопка ⓘ</strong>: сведения о выбранной планете и журнал боёв.</li>
                <li><strong>Push-уведомление</strong>: одно оповещение при открытии регистрации (08:00), с крайним сроком и временем боёв.</li>
            </ul>

    ia_bots:
        title: "ИИ-командиры (боты)"
        category: "events"
        order: 4
        tags: "ии,бот,искусственный интеллект,npc,bot,автопилот"
        summary: "Некоторые серверы включают командиров, управляемых ИИ. Как они себя ведут и зачем."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Почему ИИ?</h2>
            <p>На некоторых серверах часть командиров — это не игроки-люди, а <strong>искусственный интеллект</strong>. Они позволяют:</p>
            <ul>
                <li><strong>заселить сервер</strong>, когда активных игроков мало;</li>
                <li>предложить <strong>интересные цели</strong> игрокам, которые ищут боёв;</li>
                <li>имитировать живую дипломатию с предложениями, предательствами и правдоподобными альянсами.</li>
            </ul>

            <h2 id="comportement">Как они себя ведут</h2>
            <p>У каждого бота есть:</p>
            <ul>
                <li><strong>личность</strong> (агрессивный, миролюбивый, оппортунистический…);</li>
                <li><strong>настроение</strong>, которое меняется в зависимости от событий;</li>
                <li><strong>стратегический архетип</strong> (экономист, милитарист, исследователь…).</li>
            </ul>
            <p>Они играют по-настоящему: строят, исследуют, атакуют, создают альянсы, иногда предают. Они могут быть как Вашими союзниками, так и злейшими врагами.</p>
            <p>Они растут <strong>каждый день в темпе активных игроков</strong> сервера (чуть быстрее медианы), но никогда не превосходят <strong>90 % лучшего игрока</strong>. Всё, что они теряют в бою, потеряно навсегда: если игрок уничтожит их гарнизон, на этой планете они не станут восстанавливать его в течение <strong>7 дней</strong> и вместо этого усилят свои турели.</p>
            <p><strong>Где спит их флот.</strong> ИИ-милитаристы и ИИ-исследователи держат гарнизон на орбите своих планет. Остальные, более осторожные, держат корабли <strong>на земле</strong>, как многие игроки, и выводят их только для защиты: если их радар замечает приближающийся враждебный флот, который они могут победить, они выводят свой флот на орбиту и вызывают корабли с соседних планет, успевающие прибыть вовремя; против слишком сильного флота они отправляют свой флот приземлиться на другую свою планету. Они также вступают в уже идущий бой над своей планетой или атакуют вооружённый флот, стоящий на орбите, если могут победить. Как и игрок, спящий ИИ не реагирует, а флот, скрытый глушителем, застаёт его врасплох. Они никогда не оставляют корабли на земле планеты без турелей, где вторжение захватило бы их: корабли садятся на их лучше всего защищённую планету, которая служит им и первым убежищем.</p>
            <p><strong>Их торговля.</strong> Они продают излишки и груз своих переработчиков ближайшему торговцу, если только он не в блокаде и не охраняется враждебным флотом в режиме атаки, который уничтожил бы их конвой по прибытии: тогда они летят к следующему.</p>

            <h2 id="reconnaitre">Как их распознать</h2>
            <p>Боты появляются в рейтинге как обычные игроки. Их поведение согласовано, но опытный глаз часто замечает паттерны: очень быстрые ответы на сообщения альянса, нетипичные часы подключения, механическая дипломатия.</p>

            <h2 id="strategie">Как с ними играть</h2>
            <ul>
                <li>Не недооценивайте бота: некоторые из них — настоящие военные ужасы.</li>
                <li>Бот вполне может пригласить Вас в альянс, сотрудничать, а затем атаковать, если ситуация изменится.</li>
                <li>Для иммерсии относитесь к ним как к игрокам: так сервер становится более живым.</li>
            </ul>

            <h2 id="pilote-automatique">Отсутствующие игроки: автопилот</h2>
            <p>Если игрок не заходит в игру <strong>8 дней</strong>, его аккаунт переходит на <strong>автопилот</strong>: <strong>немого</strong> бота, который никогда не пишет в чатах и личных сообщениях. Этот автопилот <strong>не играет вместо игрока</strong>: аккаунт не начинает никаких атак, не перемещает и не вводит в бой ваши флоты и не колонизирует. Он лишь продолжает ваши постройки и исследования и медленно усиливает ваши турели. Другие ИИ-командиры его не атакуют; другие игроки по-прежнему могут это делать. Вы по-прежнему можете написать ему личное сообщение: игрок прочтёт его по возвращении. Как только игрок снова войдёт в игру, он мгновенно вернёт контроль над своим аккаунтом и найдёт свои флоты ровно там, где оставил.</p>

    cthulhu_prophecies:
        title: "Пророчества Ктулху"
        category: "events"
        order: 5
        tags: "ктулху,пророчество,блокада,угроза,событие,альянс,ов,биткойн,торговец,переработка,рейтинг"
        summary: "Когда шкала угрозы сервера достигает порога, Одержимые объявляют пророчество: через 48 часов их орды блокируют торговлю по всему серверу. Как читать шкалу, как сообща прорвать блокаду и чем платят за провал."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Что такое пророчество?</h2>
            <p>Общий для сервера <strong>резерв угрозы</strong> — отдельный от Вашего личного уровня угрозы Ктулху — растёт автоматически, день за днём. Когда он достигает порога, <strong>Одержимые</strong> публикуют в общем чате <strong>датированное пророчество</strong>: в ближайшие часы на весь сервер обрушится <strong>блокада</strong>. Пророчество также сообщает, что будет, если никто не отреагирует.</p>

            <h2 id="jauge">Как читать шкалу угрозы сервера</h2>
            <ul>
                <li>Она видна на <strong>странице Ктулху</strong> (той же, что и Tower Defense) и растёт независимо от Ваших личных боёв.</li>
                <li>Она поднимается на <strong>100 очков в день</strong>; порог, запускающий пророчество, достигается примерно за <strong>неделю</strong>.</li>
                <li><strong>Одержимые</strong> публикуют в общем чате <strong>ежедневную сводку</strong> с текущим уровнем — так Вы видите приближение угрозы.</li>
                <li>Первое событие на сервере не может произойти раньше его <strong>первых двух недель</strong> существования.</li>
                <li>На одном сервере никогда не бывает двух пророчеств (или двух блокад) одновременно: шкала снова начинает расти только после завершения предыдущего события.</li>
            </ul>

            <h2 id="prophetie">Объявление</h2>
            <p>Когда порог пройден, Одержимые публикуют своё пророчество в чате: срок наступает <strong>~48 часов позже</strong>. Сообщение прямо называет ставки — блокаду, дань, рейтинг альянсов, судьбу полей обломков — никаких скрытых правил, которые обнаруживаются постфактум.</p>

            <h2 id="blocus">Блокада</h2>
            <p>По истечении срока <strong>орда Ктулху</strong> занимает орбиту <strong>каждого торговца</strong> и <strong>каждого астероида</strong> на сервере:</p>
            <ul>
                <li><strong>Продажа невозможна</strong> у любого блокированного торговца.</li>
                <li><strong>Переработка невозможна</strong> на любом блокированном астероиде.</li>
                <li>В остальной части вселенной <strong>поля обломков остаются перерабатываемыми как обычно</strong>, как после любого другого боя.</li>
                <li>А вот на блокированной цели <strong>обломки от Ваших собственных штурмов накапливаются на месте и остаются недоступными, пока жива охраняющая её орда</strong>. Уничтожьте её — и <strong>эта цель открывается сразу же</strong>, не дожидаясь судьбы блокады на остальном сервере: продажа или переработка там возобновляются, а Ваши переработчики, уже находящиеся на орбите, сами возвращаются к работе.</li>
                <li>Ничего общего с осадой или голодом, которые вражеский флот может навязать планете игрока: здесь останавливаются только торговля и переработка.</li>
                <li>Блокада длится <strong>максимум 48 часов</strong>.</li>
            </ul>

            <h2 id="briser">Как сообща прорвать блокаду</h2>
            <p>Орды неодинаковы. Те, что стерегут <strong>торговцев</strong>, рассчитаны заметно выше самой мощной флотилии сервера (игрока или бота): в одиночку их не сломить. Гарнизоны <strong>астероидов</strong> куда легче и по силам одной крупной флотилии — именно они дают основную часть счёта. В обоих случаях <strong>коалиция</strong>, бьющая по одной и той же орде несколькими штурмами подряд, в итоге её добивает.</p>
            <p>Урон, полученный ордой, <strong>никогда не восстанавливается</strong> между боями: каждый штурм, даже проигранный, ослабляет её для следующего. Сосредоточьте удары на одной орде, а не распыляйте их на несколько.</p>

            <h2 id="recompenses">Награды</h2>
            <p>Каждое очко урона, нанесённого орде, <strong>оплачивается биткойнами и очками войны</strong> при завершении события — независимо от исхода, ни один штурм не проходит впустую.</p>
            <p>Блокада считается <strong>прорванной</strong>, как только <strong>до истечения срока уничтожено 70 % орд сервера</strong> — торговцы и астероиды считаются наравне: ставка награды тогда <strong>удваивается</strong> для всех участников. Индивидуальный рапорт в конце события показывает Ваш нанесённый урон и Вашу награду. Пока блокада активна, <strong>страница Ктулху</strong> показывает прогресс в реальном времени: уничтоженные орды, цель и оставшееся время.</p>

            <h2 id="echec">Цена провала</h2>
            <p>Если блокада <strong>истекает без прорыва</strong>:</p>
            <ul>
                <li><strong>Каждый игрок теряет половину своих биткоинов</strong> — Одержимые взимают свою дань. Игроки под <strong>защитой новичка</strong> и игроки в game over не затронуты.</li>
                <li><strong>Все боевые поля обломков во вселенной поглощаются</strong> Ктулху; <strong>астероиды</strong> остаются нетронутыми.</li>
                <li><strong>Казна биткоинов каждого альянса</strong>, где есть хотя бы один живой игрок, тоже теряет половину содержимого: положить свои биткоины в казну до срока ничего не спасает. Списание видно в истории казны.</li>
                <li><strong>3 последних альянса рейтинга</strong> дополнительно теряют часть производства на 72 часа (см. ниже).</li>
            </ul>
            <p>Каждый затронутый игрок получает отчёт с указанием потерянных биткоинов. Эти ставки всегда объявляются в пророчестве — никаких скрытых правил.</p>

            <h2 id="classement">Рейтинг альянсов</h2>
            <p>Во время блокады каждый альянс получает место в рейтинге по тому, что он делает против роя. <strong>Страница Ктулху</strong> показывает рейтинг в реальном времени и то, что Ваш альянс выиграет или потеряет, если блокада закончится прямо сейчас.</p>
            <ul>
                <li><strong>Очки</strong>: урон по <strong>флоту-стене</strong> считается вдвойне; урон по рою в других местах (осады баз, орды) — один раз; каждая <strong>победа в Tower Defense</strong> стоит столько же, сколько уничтожение четверти стены астероида.</li>
                <li><strong>Очки на участника</strong>: счёт делится на число активных участников (заходили за последние 7 дней, без защиты новичка). Урон новичка всё равно засчитывается: набор новых игроков никогда не снижает счёт.</li>
                <li><strong>Состав фиксируется</strong> в начале блокады: смена альянса во время события не переносит ни очки, ни бонус, ни штраф.</li>
                <li>Для попадания в рейтинг нужно не менее <strong>2 активных участников</strong>. <strong>Игроков без альянса</strong> это никогда не касается.</li>
            </ul>
            <p><strong>Блокада сломлена</strong>: три первых альянса получают <strong>+15 %, +10 % и +5 % к производству</strong> на 72 часа, если они набрали очки. Ни один альянс не наказывается.</p>
            <p><strong>Блокада выстояла</strong>: три последних альянса теряют <strong>15 %, 10 % и 5 % производства</strong> на 72 часа, сверх дани. Штраф никогда не затрагивает больше половины альянсов в рейтинге, а альянс, приложивший минимальное усилие (половина уничтоженной стены астероида или две победы в Tower Defense на активного участника), пощажён даже на последнем месте.</p>
            <p>Каждый участник получает отчёт о бонусе или штрафе своего альянса и сроке его окончания. Одержимые объявляют начало блокады в чате, напоминают о ней за 6 часов до срока и в конце называют награждённые или наказанные альянсы.</p>

            <h2 id="conseils">На практике</h2>
            <ul>
                <li>Следите за <strong>ежедневной сводкой</strong> Одержимых: она даёт представление, сколько времени осталось до порога.</li>
                <li>Как только объявлено <strong>пророчество</strong>, предупредите свой альянс: у Вас есть <strong>48 часов</strong>, чтобы организоваться до падения блокады.</li>
                <li>Сосредоточьте штурмы на одних и тех же ордах, а не распыляйте их: урон сохраняется, лучше добить одну орду, чем оцарапать несколько.</li>
                <li>Даже проигранный штурм приносит что-то: не ждите гарантированной победы, чтобы атаковать.</li>
                <li>Не хватает флота, чтобы атаковать стену? <strong>Победа в Tower Defense</strong> во время блокады тоже приносит очки Вашему альянсу.</li>
            </ul>

    notifications:
        title: "Пуш-уведомления"
        category: "beginner"
        order: 10
        tags: "уведомление,push,оповещение,мобильный,браузер,настройки"
        summary: "Получайте оповещения на мобильном устройстве или в браузере, как только в Вашей империи происходит важное событие."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">Для чего это нужно?</h2>
            <p>Area Universe играется непрерывно: вражеские флоты могут прибыть, пока Вы на работе. <strong>Пуш-уведомления</strong> оповещают Вас в реальном времени на телефоне или в браузере, чтобы Вы могли вовремя отреагировать.</p>

            <h2 id="evenements">Что Вы можете получать</h2>
            <ul>
                <li><strong>Исследование завершено</strong> — технология только что завершена.</li>
                <li><strong>Здание построено</strong> — Ваша очередь строительства пуста.</li>
                <li><strong>Производство завершено</strong> — Ваши корабли или турели готовы.</li>
                <li><strong>Флот прибыл к цели</strong> — Ваш флот на месте.</li>
                <li><strong>Флот в бою</strong> — начинается космический бой.</li>
                <li><strong>Вражеский флот приближается</strong> — кто-то летит к одной из Ваших планет.</li>
                <li><strong>Планета под атакой</strong> — идёт наземное вторжение.</li>
                <li><strong>Планета под эмбарго</strong> — одна из Ваших планет в осаде.</li>
                <li><strong>Получен ядерный удар</strong> — на Вас обрушилась бомба.</li>
                <li><strong>Альянс в войне</strong> — объявление войны с участием Вашего альянса.</li>
                <li><strong>Личное сообщение / сообщение альянса</strong> — получено новое сообщение.</li>
                <li><strong>Герой пленён / освобождён</strong> — событие тюрьмы.</li>
                <li><strong>Атака Ктулху</strong> — орда Ктулху на Вашей планете.</li>
            </ul>
            <p>Вы можете <strong>индивидуально</strong> активировать каждый тип по своему усмотрению.</p>

            <h2 id="activation">Как их активировать</h2>
            <ol>
                <li>Откройте Ваши <strong>Настройки</strong> (меню профиля).</li>
                <li>Вкладка <strong>Уведомления</strong>.</li>
                <li>Примите запрос разрешения Вашего браузера или телефона.</li>
                <li>Отметьте интересующие Вас типы.</li>
            </ol>
            <p>Кнопка <em>Отключить всё</em> позволяет отключить всё одним кликом.</p>

            <h2 id="compatibilite">Где это работает</h2>
            <ul>
                <li><strong>Мобильное приложение</strong>: нативные Android и iOS.</li>
                <li><strong>Браузер</strong>: Chrome, Firefox, Edge, Safari desktop. Для Safari iOS добавьте сайт на главный экран (iOS 16.4+).</li>
                <li><strong>Мульти-устройство</strong>: если Вы подключены на телефоне + ПК, оба получат сигнал.</li>
            </ul>

            <h2 id="ustranenie-problem">Браузер отказывает в регистрации?</h2>
            <p>В <strong>Brave</strong> push-служба Google по умолчанию отключена. Откройте <code>brave://settings/privacy</code>, включите <strong>«Использовать сервисы Google для push-сообщений»</strong> и полностью перезапустите браузер. В других браузерах убедитесь, что VPN, антивирус или фильтрующий DNS не блокируют службу уведомлений.</p>

            <h2 id="mobilnoe">В мобильном приложении</h2>
            <p>На Android и iOS страница <strong>Уведомления</strong> содержит раздел «Уведомления на этом устройстве»: включайте и отключайте push-уведомления телефона в любой момент. Если они заблокированы, кнопка откроет настройки телефона напрямую. Настройки по типам уведомлений действуют на всех ваших устройствах.</p>

            <h2 id="discord">В Discord</h2>
            <p>Если ваш аккаунт Discord привязан (<strong>«Мои настройки»</strong>), оповещение <strong>«Приближается вражеский флот»</strong> приходит и в личные сообщения Discord — со временем прибытия и ссылкой на планету. Не больше одного сообщения на планету раз в 30 минут: атака несколькими флотами не завалит вас сообщениями. Нужно быть участником <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord-сервера Area Universe</a> и разрешить личные сообщения от его участников. Опция включена по умолчанию и отключается в разделе <strong>Discord</strong> настроек уведомлений.</p>

    glossary:
        title: "Глоссарий"
        category: "beginner"
        order: 11
        tags: "глоссарий,термины,определения,словарь,сокращения"
        summary: "Все термины и сокращения игры, объяснённые одной фразой."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Все игровые термины</h2>
            <table>
                <tr><th>Термин</th><th>Определение</th></tr>
                <tr><td><strong>Баржа</strong></td><td>Десантный корабль для высадки Легионеров во время рейдов и вторжений.</td></tr>
                <tr><td><strong>Биткойн</strong></td><td>Основная валюта игры. Генерируется Вашими рабочими.</td></tr>
                <tr><td><strong>Блок</strong></td><td>Автоматическая группировка союзных флотов во время космического боя.</td></tr>
                <tr><td><strong>Бункер</strong></td><td>Оборонительное здание. Увеличивает вместимость Легионеров и защищает часть Ваших ресурсов от грабежа.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Поле обломков: обломки, оставшиеся после боя, подлежащие переработке.</td></tr>
                <tr><td><strong>Космическая верфь</strong></td><td>Здание, позволяющее строить корабли.</td></tr>
                <tr><td><strong>Ктулху</strong></td><td>Враждебные существа (бывшие «зомби»). Появляются в режиме PvE и на планетах пришельцев.</td></tr>
                <tr><td><strong>Цикл</strong></td><td>Внутренний ритм производства. 10 мин для планеты, 1 мин для луны.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Уровень тревоги альянса. Чем ниже цифра, тем напряжённее ситуация.</td></tr>
                <tr><td><strong>Эмбарго</strong></td><td>Осада планеты вражеским флотом на орбите. Вызывает голод.</td></tr>
                <tr><td><strong>Содержание</strong></td><td>Ежедневная стоимость Ваших войск, кораблей и зданий в биткойнах.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Конец игры: экономическое банкротство или потеря всех Ваших планет.</td></tr>
                <tr><td><strong>Экономический Game Over</strong></td><td>Ваш баланс биткойнов стал отрицательным после ежедневного отчёта.</td></tr>
                <tr><td><strong>Герой</strong></td><td>Ваш уникальный персонаж. Развивается, сражается и может быть пленён.</td></tr>
                <tr><td><strong>Торговец</strong></td><td>NPC на карте, который покупает Ваши ресурсы за биткойны.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Редкий корабль, создающий луну на поле обломков (пустая позиция, мин. 2 млн ниобия и 2 млн воды).</td></tr>
                <tr><td><strong>Mothership / Материнский корабль</strong></td><td>Крупный флагманский корабль. Немного замедляет флот.</td></tr>
                <tr><td><strong>ОВ</strong></td><td>Очки войны. Получаются в боях, используются для исследований и рейтинга.</td></tr>
                <tr><td><strong>Активная планета</strong></td><td>Планета, выбранная в данный момент. Все Ваши действия применяются к ней.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Неигровой персонаж: торговцы, пришельцы, Ктулху, ИИ-боты.</td></tr>
                <tr><td><strong>Рейд</strong></td><td>Наземная атака для разграбления ресурсов планеты (не для её захвата).</td></tr>
                <tr><td><strong>Ежедневный отчёт</strong></td><td>Ежедневный баланс, рассчитываемый в 18:59 UTC: доходы, расходы и сальдо.</td></tr>
                <tr><td><strong>Переработчик</strong></td><td>Корабль, собирающий обломки (CDR) после боя.</td></tr>
                <tr><td><strong>Раунд</strong></td><td>Ход боя. Максимум 100 в космическом бою, максимум 10 в наземном.</td></tr>
                <tr><td><strong>Зонд</strong></td><td>Маленький разведывательный корабль. Отправляйте перед любой атакой.</td></tr>
                <tr><td><strong>Размер флота</strong></td><td>Общий показатель массы Вашего флота. Чем он больше, тем больше топлива потребляется.</td></tr>
                <tr><td><strong>Терраформирование</strong></td><td>Исследование, увеличивающее строительный размер планеты.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Мини-игра активной защиты против орд Ктулху.</td></tr>
                <tr><td><strong>Рабочий</strong></td><td>Единица населения. Производит биткойны каждый день. Защищает при вторжении.</td></tr>
                <tr><td><strong>Туториал</strong></td><td>Управляемый режим из 16 шагов для обучения игре, доступный из Настроек.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Игрок, назначенный приоритетной целью в режиме Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Удалить мой аккаунт и данные"
        category: "beginner"
        order: 99
        tags: "удаление,аккаунт,данные,gdpr,конфиденциальность"
        summary: "Как запросить окончательное удаление вашего аккаунта и персональных данных."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Где подать запрос</h2>
            <p>Вы можете в любой момент запросить удаление своего аккаунта и персональных данных на публичной странице <strong>/suppression-donnees</strong> или внизу настроек в игре.</p>

            <h2 id="irreversible">Окончательный отказ от аккаунта</h2>
            <p><strong>Внимание: это окончательный отказ от аккаунта.</strong> Ваши персональные данные (email, социальные идентификаторы, IP-адрес, уведомления, личные сообщения…) удаляются или анонимизируются немедленно, и вы больше никогда не сможете войти в этот аккаунт.</p>

            <h2 id="conserve">Что сохраняется, и почему</h2>
            <p>Чтобы сохранить баланс игры, ваши командиры, планеты и флоты продолжают существовать под анонимным именем бота, без какой-либо связи с вашей личностью. Публичные сообщения, написанные в чатах, также сохраняются и закрепляются за вашим анонимным именем бота. История платежей сохраняется (законодательное бухгалтерское обязательство), также отделённая от вашей личности.</p>

    achievements:
        title: "Достижения"
        category: "progression"
        order: 11
        tags: "достижения,achievements,трофеи,google play,play игры,прогресс"
        summary: "15 достижений аккаунта, от первых шагов до карьерных подвигов, в вашем профиле и в Google Play Играх."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Принцип</h2>
            <p><strong>Достижения</strong> награждают за то, чего вы добились своим аккаунтом, <strong>на всех серверах</strong>. Открытое достижение остаётся навсегда, даже если потом вы потеряете планету или покинете альянс, который его принёс.</p>
            <p>Они собраны в вашем <strong>межсерверном профиле</strong> (меню «Мой межсерверный профиль»): с прогрессом и датой каждого открытия. Профиль другого игрока показывает его достижения. То, что уже заслужено вашей историей, открывается сразу.</p>
            <h2 id="liste">15 достижений</h2>
            <table>
            <tr><th>Достижение</th><th>Условие</th><th>Очки</th></tr>
            <tr><td>Командир</td><td>Пройти обучение</td><td>20</td></tr>
            <tr><td>Строитель</td><td>Завершить первую постройку</td><td>20</td></tr>
            <tr><td>Учёный</td><td>Завершить первое исследование</td><td>20</td></tr>
            <tr><td>Колонист</td><td>Владеть 2 планетами</td><td>20</td></tr>
            <tr><td>Союзник</td><td>Вступить в альянс или основать его</td><td>20</td></tr>
            <tr><td>Ветеран I, II, III</td><td>Провести 10, 100, затем 1000 космических сражений</td><td>25, 50, 100</td></tr>
            <tr><td>Завоеватель I, II</td><td>Успешно провести 10, затем 100 вторжений</td><td>50, 100</td></tr>
            <tr><td>Тюремщик</td><td>Взять в плен вражеского героя</td><td>50</td></tr>
            <tr><td>Охотник на Ктулху</td><td>Выиграть партию в Tower Defense</td><td>50</td></tr>
            <tr><td>Элита</td><td>Завершить сервер в топ-10</td><td>100</td></tr>
            <tr><td>Император</td><td>Выиграть сервер</td><td>200</td></tr>
            <tr><td>Скрытое достижение</td><td>Откройте его в игре</td><td>50</td></tr>
            </table>

            <h2 id="progression">Прогресс</h2>
            <p>Достижения за сражения и вторжения растут по ступеням, а профиль показывает счётчик (например, 37 / 100). Учитывается каждое проведённое космическое сражение, выигранное или проигранное, включая уничтожение безоружного флота (грузовые корабли, переработчики, зонды), для обеих сторон; вторжения — только успешные (набеги не учитываются). «Элита» и «Император» решаются в конце сервера.</p>
            <h2 id="google-play">Google Play Игры (Android)</h2>
            <p>В приложении для Android ваши достижения появляются и в <strong>Google Play Играх</strong>, с баннером «Достижение получено».</p>
            <ul>
            <li><strong>Пробный аккаунт</strong>, созданный в приложении, автоматически привязывается к вашему профилю Google Play Игр. Тогда он больше не удаляется после 7 дней без игры и сам открывается после переустановки или на новом телефоне.</li>
            <li><strong>Зарегистрированный аккаунт</strong> привязывается в межсерверном профиле (карточка «Google Play Игры»). После этого он будет открываться без пароля с этим профилем Google Play Игр: делайте это только на своём устройстве. Отвязать его можно в любой момент в той же карточке — на сайте или в приложении.</li>
            <li>Кнопка <strong>«Play Jeux»</strong> на экране входа снова открывает привязанный аккаунт. После выхода из аккаунта он больше не открывается сам на этом устройстве: тогда его снова открывает эта кнопка.</li>
            </ul>
            <p>Профиль Google Play Игр привязывается только к одному аккаунту Area, а аккаунт — только к одному профилю. Привязка аккаунта в профиле забирает профиль Google Play Игр у другого аккаунта, к которому он был привязан.</p>

