        tags: "исследования,технология,наука,биткойн,разблокировка,технологическое дерево,терраформирование,стоимость"
        summary: "Технологии, открывающие корабли, бонусы и новые возможности. Как расставлять приоритеты."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="fonctionnement">Как это работает</h2>
            <p>Исследования запускаются со страницы <strong>Исследования</strong> (никакого здания для этого не нужно). Каждое исследование:</p>
            <ul>
                <li>стоит <strong>Биткойны</strong> (только Территориальное расширение оплачивается Очками Войны): уровень N стоит N раз по базовой стоимости;</li>
                <li>занимает <strong>время</strong>, тоже пропорциональное уровню: от нескольких минут до более суток;</li>
                <li>может иметь <strong>предварительное требование</strong> (другое исследование определённого уровня).</li>
            </ul>
            <p>Пример: Терраформирование 2-го уровня стоит 2 × 12&nbsp;000 = 24&nbsp;000 Биткойнов и длится 2 × 1 ч 10 мин = 2 ч 20 мин при базовой скорости. Улучшение альянса «Стоимость исследований» снижает цену на 1&nbsp;% за уровень (до −5&nbsp;%).</p>
            <p>Вы можете запланировать несколько исследований подряд: стоимость списывается при добавлении в очередь и возвращается полностью, если Вы отмените исследование.</p>
            <p>Длительность исследования фиксируется <strong>в момент, когда Вы его запускаете или ставите в очередь</strong>: базовая длительность × уровень ÷ Ваша <strong>скорость исследований</strong> (в начале 1). То, что меняет эту скорость (учёные, исследование альянса «Научная мобилизация»), объясняется в <a href="/wiki/workers_scientists">Рабочие и учёные</a>. Улучшение альянса «Скорость исследований» сокращает длительность, отображаемую на странице «Исследования», но не реальную длительность: после запуска исследование завершается в срок, рассчитанный без него.</p>

            <h2 id="priorite-debutant">Приоритеты для новичка</h2>
            <ol>
                <li><strong>Утилитарные корабли</strong> — открывают Терраформирование (уровень 1), Управление грузами (уровень 2), Планетарное вторжение и Орбитальную переработку (уровень 3).</li>
                <li><strong>Терраформирование</strong> — Колонизационный корабль и ещё одна планета за уровень.</li>
                <li><strong>Управление грузами</strong> — грузовые корабли и здания для хранения.</li>
                <li><strong>Городская перестройка</strong> — Большой город, затем Мегаполис: больше рабочих, а значит, больше Биткойнов.</li>
                <li><strong>Промышленность</strong> — чтобы улучшать Космическую верфь и открывать лёгкие (уровень 3) и тяжёлые (уровень 5) корабли.</li>
                <li><strong>Планетарное вторжение</strong> и <strong>Орбитальная переработка</strong> — необходимы для вторжения и переработки.</li>
                <li><strong>Вооружение</strong>, затем <strong>Ракетное оружие</strong> — Ваши первые боевые корабли (Истребитель).</li>
            </ol>

            <h2 id="recherches">Полный список исследований</h2>
            <p>Исследования расположены так же, как на странице «Исследования». Стоимость и длительность указаны для 1-го уровня при базовой скорости: уровень N стоит и длится в N раз больше. Максимальный уровень указан в скобках.</p>

