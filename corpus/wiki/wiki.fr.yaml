articles:
    moderation_blocking:
        title: "Modération : signaler et bloquer"
        category: "beginner"
        order: 12
        tags: "moderation,signalement,blocage,salon,messages,conditions"
        summary: "Signalez un message abusif, bloquez un joueur indésirable et retrouvez les règles de la communauté que chacun accepte à la première connexion."
        related: "salon,account_deletion"
        body: |
            <h2 id="conditions">Conditions d'utilisation</h2>
            <p>À la première connexion, chaque joueur accepte les <strong>conditions d'utilisation</strong> et les règles de la communauté : respect des autres joueurs, aucun contenu illégal, obscène ou diffamatoire, pas de triche ni de multi-compte abusif. Si les conditions évoluent, elles devront être acceptées à nouveau.</p>
            <h2 id="signaler">Signaler un message</h2>
            <p>Chaque message du salon de discussion et chaque message privé reçu porte une icône <strong>drapeau</strong>. Un clic ouvre le choix du motif : insultes ou harcèlement, spam, autre contenu inapproprié. Le signalement part directement à l'équipe de modération, avec une copie du message.</p>
            <p>Un joueur peut aussi être signalé globalement depuis son profil (multi-compte, triche, insultes, spam). La limite est de trois signalements par jour, et un même joueur ne peut être signalé qu'une fois.</p>
            <h2 id="bloquer">Bloquer un joueur</h2>
            <p>Le bouton <strong>Bloquer</strong> du profil d'un joueur masque immédiatement tous ses messages dans les salons de discussion et empêche tout échange de messages privés, dans les deux sens.</p>
            <p>La liste des joueurs bloqués se gère dans <strong>Mes options</strong> : chaque joueur peut y être débloqué à tout moment.</p>
    getting_started:
        title: "Premiers pas"
        category: "beginner"
        order: 1
        tags: "debut,commencer,nouveau,tutoriel,guide"
        summary: "Bienvenue ! Le guide le plus court pour comprendre Area Universe et réussir vos premières heures de jeu."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">C'est quoi Area Universe ?</h2>
            <p>Area Universe est un jeu de <strong>stratégie spatiale multijoueur</strong>. Vous dirigez un empire : vos planètes produisent des ressources, vos vaisseaux parcourent la galaxie, et vos alliances scellent le destin des joueurs.</p>
            <p>C'est un jeu <strong>qui se joue sur la durée</strong> : vos ressources s'accumulent même quand vous êtes hors ligne. Quelques minutes par jour suffisent pour progresser.</p>

            <h2 id="objectif">Votre objectif</h2>
            <p>Selon le mode de serveur choisi (voir l'article <em>Modes de jeu</em>), le but final varie : tenir le plus longtemps, dominer le classement, être le dernier debout, etc. Mais la recette est toujours la même :</p>
            <ol>
                <li><strong>Faire tourner une économie</strong> (ressources + monnaie).</li>
                <li><strong>Bâtir une flotte et une défense</strong>.</li>
                <li><strong>Vous allier</strong> pour peser à plusieurs.</li>
            </ol>

            <h2 id="premieres-actions">Vos 6 premières actions</h2>
            <ol>
                <li><strong>Construisez une Mine de Niobium et un Extracteur d'Eau</strong> sur votre planète de départ.</li>
                <li><strong>Ajoutez une Ferme</strong> pour nourrir vos travailleurs.</li>
                <li><strong>Construisez une Cité</strong> pour augmenter le nombre de travailleurs, vos pourvoyeurs de <em>Bitcoins</em> (la monnaie du jeu).</li>
                <li><strong>Construisez un Centre de recherche</strong>, puis un <strong>Chantier spatial</strong> pour fabriquer vos premiers vaisseaux.</li>
                <li><strong>Envoyez un cargo vendre des ressources</strong> à un marchand : argent facile.</li>
                <li><strong>Rejoignez une alliance</strong> : vous gagnez <strong>+20&nbsp;% de production</strong> et vous accédez aux recherches d'alliance.</li>
            </ol>

            <h2 id="tutoriel">Le tutoriel intégré</h2>
            <p>Un <strong>tutoriel interactif</strong> vous guide pas à pas. Il est découpé en <strong>16 étapes</strong> (construction, flottes, combat…). Chaque étape complétée donne une récompense (Bitcoins, Légionnaires, vaisseaux…).</p>
            <ul>
                <li>Vous pouvez l'<strong>interrompre</strong> ou <strong>reprendre</strong> à tout moment.</li>
                <li>Il est accessible depuis vos <strong>Préférences</strong>.</li>
            </ul>

            <h2 id="a-surveiller">À surveiller dès le début</h2>
            <ul>
                <li><strong>Bitcoins positifs</strong> : chaque jour à 18h59 UTC, un bilan calcule vos revenus et coûts d'entretien. Si vous passez en négatif, c'est le <strong>Game Over économique</strong>.</li>
                <li><strong>Stockage</strong> : si vos entrepôts sont pleins, la production s'arrête. Construisez des stocks en conséquence.</li>
                <li><strong>Quêtes journalières</strong> : 3 quêtes par jour, toutes complétées = <strong>+250 Points de Guerre</strong>.</li>
            </ul>

            <h2 id="protection-debutant">La protection des débutants</h2>
            <p>Pendant vos premiers jours, vous êtes <strong>protégé</strong> : aucun joueur ne peut vous attaquer, vous piller, vous envahir ou vous bombarder. De quoi bâtir vos premières bases tranquillement.</p>
            <p>La protection s'arrête dès que l'une de ces conditions est remplie :</p>
            <ul>
                <li><strong>7 jours</strong> se sont écoulés depuis la création de votre commandant.</li>
                <li>Vous possédez une <strong>4e planète</strong>.</li>
                <li>Vous envoyez vous-même une <strong>mission offensive</strong> (pillage, invasion ou attaque nucléaire) : vous renoncez alors immédiatement à votre protection.</li>
            </ul>
            <p>Tant que vous êtes protégé, vous ne pouvez pas attaquer les autres sans perdre cette protection. Profitez-en pour monter une économie et une défense solides avant de vous lancer dans la bataille.</p>

    interface_guide:
        title: "Comprendre l'interface"
        category: "beginner"
        order: 2
        tags: "interface,ecran,menu,navigation,boutons,planete active"
        summary: "Les 3 zones de l'écran et comment naviguer sans vous perdre."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="disposition">Les 3 zones de l'écran</h2>
            <ul>
                <li><strong>La barre de ressources, en haut</strong> — vos matières, et le nom de votre <strong>planète active</strong> : tapez dessus pour changer de planète.</li>
                <li><strong>Le menu, à gauche</strong> — toutes les sections du jeu (Empire, Planètes, Flottes, Alliance, Messages…).</li>
                <li><strong>La zone centrale</strong> — le contenu de la page en cours (carte, liste de flottes, bâtiments…). C'est la seule zone qui défile.</li>
            </ul>
            <p><em>Sur téléphone, le menu de gauche devient un rail d'icônes collé au bord gauche : les cinq destinations principales y restent visibles en permanence, et le bouton Menu ouvre le reste dans un panneau qui monte du bas.</em></p>

            <h2 id="barre-ressources">La barre de ressources (en haut)</h2>
            <p>Elle affiche en temps réel vos 4 ressources principales :</p>
            <ul>
                <li><strong>Niobium</strong> — le minerai de base (bâtiments, vaisseaux).</li>
                <li><strong>Eau</strong> — indispensable à la construction et aux vaisseaux.</li>
                <li><strong>Nourriture</strong> — nourrit vos travailleurs, Légionnaires et Mechas.</li>
                <li><strong>Uranium</strong> — ressource rare, pour les bombes nucléaires et les défis en arène.</li>
            </ul>
            <p>Le niobium, l'eau, la nourriture et vos travailleurs avancent seconde par seconde au rythme de votre production, jusqu'à votre plafond de stockage. Touchez une ressource pour voir sa production horaire, bonus compris (héros, camp d'esclaves, alliance, embargo).</p>
            <p>Les <strong>Bitcoins</strong> (monnaie) et les <strong>Points de Guerre (PDG)</strong> s'affichent eux aussi dans la barre de ressources.</p>

            <h2 id="planete-active">Planète active : ce que ça veut dire</h2>
            <p>Quand vous avez plusieurs planètes, une seule est <strong>active</strong> à la fois. Toutes vos actions (construire, fabriquer un vaisseau, lancer une flotte) s'appliquent à cette planète.</p>
            <p>Pour en changer : tapez sur le nom de la planète dans la barre de ressources, puis choisissez dans la liste qui monte du bas.</p>

            <h2 id="navigation">Se repérer rapidement</h2>
            <ul>
                <li><strong>Empire</strong> — vue d'ensemble (toutes vos planètes, recherches, économie).</li>
                <li><strong>Planète</strong> — construction et gestion de la planète active.</li>
                <li><strong>Flottes</strong> — créer, envoyer et suivre vos vaisseaux.</li>
                <li><strong>Carte</strong> — explorer la galaxie.</li>
                <li><strong>Messages / Rapports</strong> — tout ce que le jeu vous signale (combats, arrivées, alliance…).</li>
                <li><strong>Alliance</strong> — votre groupe, le salon de discussion, la diplomatie.</li>
            </ul>

    resources_intro:
        title: "Les ressources"
        category: "beginner"
        order: 3
        tags: "ressources,niobium,eau,nourriture,uranium,production,stockage,cycle"
        summary: "Les 4 ressources du jeu, comment on les produit et pourquoi le stockage est critique."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Les 4 ressources du jeu</h2>
            <table>
                <tr><th>Ressource</th><th>À quoi elle sert</th><th>Comment on l'obtient</th></tr>
                <tr><td><strong>Niobium</strong></td><td>Construire des bâtiments et des vaisseaux</td><td>Mine</td></tr>
                <tr><td><strong>Eau</strong></td><td>Construire, fabriquer, entretenir</td><td>Extracteur d'eau</td></tr>
                <tr><td><strong>Nourriture</strong></td><td>Nourrir vos travailleurs, Légionnaires et Mechas</td><td>Ferme, puis Ferme aéroponique</td></tr>
                <tr><td><strong>Uranium</strong></td><td>Bombes nucléaires, défis d'arène</td><td>Recyclage de débris d'uranium, victoires contre les Cthulhu</td></tr>
            </table>

            <h2 id="cycle">Le cycle de production</h2>
            <p>Vos ressources arrivent automatiquement, en continu. On parle de <strong>cycle de production</strong> : c'est le rythme de calcul interne du jeu.</p>
            <ul>
                <li>Sur une <strong>planète</strong> : cycle de <strong>10 minutes</strong>.</li>
                <li>Sur une <strong>lune</strong> : cycle de <strong>1 minute</strong> (beaucoup plus rapide, uniquement pour la nourriture).</li>
            </ul>
            <p>Plus le niveau de votre Mine / Extracteur / Ferme est élevé, plus la quantité produite par cycle est grande.</p>

            <h2 id="bonus">Ce qui améliore votre production</h2>
            <ul>
                <li><strong>Rejoindre une alliance</strong> : <strong>+20&nbsp;%</strong> immédiat sur toutes les ressources.</li>
                <li><strong>Recherches d'alliance</strong> : bonus supplémentaires débloqués par votre alliance.</li>
                <li><strong>Terraformation</strong> : augmente l'espace disponible pour de plus grands bâtiments.</li>
                <li><strong>Héros d'Économie</strong> assigné à la planète : boost de production.</li>
            </ul>

            <h2 id="stockage">Le stockage (ne pas négliger !)</h2>
            <p>Chaque planète a une <strong>capacité maximale</strong> de stockage, par ressource. <strong>Quand c'est plein, la production s'arrête</strong>.</p>
            <p>Pour augmenter la capacité : construisez des <strong>Stocks de Niobium</strong>, <strong>Stocks d'Eau</strong> et des <strong>Silos</strong> (nourriture).</p>
            <p><em>Conseil débutant :</em> vérifiez votre stockage <strong>avant</strong> de vous déconnecter pour la nuit. Rien de pire que de retrouver ses mines à l'arrêt pendant 10 heures.</p>

    bitcoin_economy:
        title: "Bitcoins et entretien"
        category: "beginner"
        order: 4
        tags: "bitcoin,monnaie,entretien,cout,economie,game over,rapport journalier"
        summary: "Le Bitcoin est la monnaie du jeu. Comment en gagner, et surtout comment éviter la faillite."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Le Bitcoin, c'est quoi ?</h2>
            <p>Le <strong>Bitcoin</strong> est la <strong>monnaie universelle</strong> d'Area Universe (rien à voir avec la vraie crypto, c'est juste un clin d'œil). Il sert à :</p>
            <ul>
                <li>Lancer des <strong>recherches</strong>.</li>
                <li>Recruter des <strong>Légionnaires</strong> et des <strong>scientifiques</strong>.</li>
                <li>Acheter via l'<strong>alliance</strong> (trésorerie).</li>
                <li>Payer l'<strong>entretien quotidien</strong> de vos troupes, vaisseaux et bâtiments.</li>
            </ul>

            <h2 id="gagner">Comment en gagner ?</h2>
            <ul>
                <li><strong>Travailleurs</strong> — votre source principale. Chaque jour, ils vous rapportent un revenu proportionnel à leur nombre.</li>
                <li><strong>Vente aux marchands</strong> — envoyez un cargo avec du niobium et de l'eau vers un marchand.</li>
                <li><strong>Quêtes journalières</strong> — certaines rapportent des Bitcoins.</li>
                <li><strong>Bonus de connexion</strong> — une somme à chaque première connexion du jour, multipliée si vous enchaînez les jours consécutifs.</li>
                <li><strong>Pillage</strong> — les raids peuvent rapporter du niobium et de l'eau, que vous pouvez revendre.</li>
            </ul>

            <h2 id="entretien">L'entretien quotidien</h2>
            <p>Chaque jour à <strong>18h59 UTC</strong>, le jeu calcule un bilan pour vous :</p>
            <ul>
                <li><strong>Revenus</strong> : ce que vos travailleurs ont rapporté.</li>
                <li><strong>Coûts</strong> : l'entretien de vos Légionnaires, Mechas, vaisseaux et bâtiments.</li>
                <li><strong>Bilan</strong> : revenus − coûts, ajouté (ou retranché) à votre solde.</li>
            </ul>
            <p>Les unités en mission (flottes en vol, vaisseaux en combat) <strong>coûtent plus cher</strong> que celles stationnées. Une grosse armée en balade permanente finit par ruiner les plus prudents.</p>

            <h2 id="faillite">Attention : le Game Over économique</h2>
            <p>Si, après ce bilan quotidien, votre solde de Bitcoins tombe <strong>en négatif</strong>, c'est le <strong>Game Over économique</strong> :</p>
            <ul>
                <li>Toutes vos flottes en vol sont <strong>détruites</strong>.</li>
                <li>Votre solde est réinitialisé à <strong>125 000 Bitcoins</strong>.</li>
                <li>Certaines recherches et progressions sont réduites.</li>
            </ul>
            <p><em>Règle d'or :</em> ne recrutez pas une armée plus chère que ce que vos travailleurs peuvent financer.</p>

    first_buildings:
        title: "Construire ses premiers bâtiments"
        category: "beginner"
        order: 5
        tags: "batiments,construction,mine,extracteur,ferme,debutant,emplacement"
        summary: "L'ordre recommandé de construction pour bien démarrer votre planète de départ."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">L'ordre conseillé (les 10 premiers bâtiments)</h2>
            <ol>
                <li><strong>Mine de Niobium</strong> — votre première source de matière première.</li>
                <li><strong>Extracteur d'eau</strong> — indispensable pour tout construire derrière.</li>
                <li><strong>Ferme</strong> — nourrit vos travailleurs et vos Légionnaires.</li>
                <li><strong>Cité</strong> — augmente le nombre maximum de travailleurs (+25&nbsp;000).</li>
                <li><strong>Mine de Niobium et Extracteur d'eau niveau 2</strong> — augmentez la production avant d'aller plus loin.</li>
                <li><strong>Centre de recherche</strong> — permet de lancer des recherches (technologies).</li>
                <li><strong>Chantier spatial</strong> — pour fabriquer vos premiers vaisseaux.</li>
                <li><strong>Caserne</strong> — pour recruter des Légionnaires de défense.</li>
                <li><strong>Stocks</strong> (niobium, eau, silos) — évitez que la production sature.</li>
                <li><strong>Métropole</strong> — étape suivante après la Cité pour un vrai boost de population (+80&nbsp;000 travailleurs).</li>
            </ol>

            <h2 id="file-attente">Une seule construction à la fois</h2>
            <p>Chaque planète a <strong>une seule file de construction</strong>. Pendant qu'un bâtiment monte de niveau, les autres doivent attendre. Planifiez en conséquence.</p>
            <p>Plusieurs planètes = plusieurs files parallèles : c'est pour ça que la colonisation accélère votre progression.</p>

            <h2 id="espace">L'espace disponible sur une planète</h2>
            <p>Chaque planète a un nombre limité d'<strong>emplacements au sol</strong> (bâtiments "terrestres") et d'<strong>emplacements en ciel</strong> (îles orbitales, défenses).</p>
            <ul>
                <li>Vous voyez les emplacements disponibles en haut de la page Planète.</li>
                <li>La recherche <strong>Terraformation</strong> agrandit vos planètes.</li>
                <li>Pas d'espace = plus de nouveaux bâtiments (mais vous pouvez toujours monter le niveau des existants).</li>
            </ul>

    first_fleet:
        title: "Créer sa première flotte"
        category: "beginner"
        order: 6
        tags: "flotte,vaisseaux,premiere,creation,debutant,chantier,cargo,sonde"
        summary: "Fabriquer un vaisseau, composer une flotte et l'envoyer à destination : le pas-à-pas."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut avant</h2>
            <ul>
                <li>Un <strong>Chantier spatial</strong> construit sur votre planète.</li>
                <li>Assez de niobium et d'eau pour payer les vaisseaux.</li>
                <li>(Optionnel) une <strong>Recherche</strong> qui débloque le vaisseau (ex. recherche <em>Utilitaire</em> pour les cargos).</li>
            </ul>

            <h2 id="fabriquer">Étape 1 — Fabriquer des vaisseaux</h2>
            <p>Rendez-vous sur la page <strong>Spatial</strong> (menu de gauche). Vous y voyez la liste des vaisseaux disponibles. Cliquez sur celui voulu, choisissez une quantité, lancez la production.</p>
            <p>La fabrication prend du temps : vous pouvez continuer à jouer pendant.</p>

            <h2 id="composer">Étape 2 — Composer et envoyer une flotte</h2>
            <ol>
                <li>Allez sur la page <strong>Flottes</strong>.</li>
                <li>Sélectionnez les vaisseaux à embarquer (le stock disponible est affiché).</li>
                <li>Choisissez une <strong>destination</strong> au format <code>Galaxie:Secteur:Position</code> (par ex. <code>1:5:12</code>). Vous pouvez aussi cliquer directement depuis la Carte.</li>
                <li>Choisissez le <strong>type de mission</strong> (voir l'article <em>Types de missions</em>).</li>
                <li>Confirmez. Le carburant (eau) est déduit automatiquement.</li>
            </ol>

            <h2 id="premiers-vaisseaux">Les bons vaisseaux pour débuter</h2>
            <ul>
                <li><strong>Cargo I</strong> — transport de ressources (3&nbsp;000 de capacité). Indispensable pour vendre aux marchands.</li>
                <li><strong>Sonde</strong> — espionne les planètes adverses. À envoyer <em>avant</em> toute attaque.</li>
                <li><strong>Chasseur</strong> — premier vaisseau de combat, bon marché.</li>
                <li><strong>Recycleur</strong> — collecte les débris après un combat. Très rentable.</li>
            </ul>

            <h2 id="premiere-cible">Idée de première mission</h2>
            <p>Envoyez 1 cargo rempli de niobium/eau en <strong>mission Déchargement</strong> vers un marchand (position 15 d'un secteur). Le marchand vous paye en Bitcoins et le cargo revient tout seul.</p>

    first_combat:
        title: "Votre premier combat"
        category: "beginner"
        order: 7
        tags: "combat,premier,attaque,rapport,debutant,rounds"
        summary: "Comment déclencher un combat spatial, ce qui se passe pendant, et ce qu'il faut faire après."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Se préparer (important !)</h2>
            <ol>
                <li><strong>Envoyez une sonde</strong> sur la cible pour évaluer ses défenses. Perdre 10 chasseurs à l'aveugle, c'est jetable ; perdre 100, ça pique.</li>
                <li><strong>Composez une flotte adaptée</strong> : assez de puissance de feu, et pensez à ajouter un <strong>recycleur</strong> pour collecter les débris.</li>
                <li><strong>Vérifiez votre entretien</strong> : une grosse flotte coûte cher tant qu'elle est en mission.</li>
            </ol>

            <h2 id="enchainement">Ce qui se passe étape par étape</h2>
            <ol>
                <li><strong>Vous lancez la flotte</strong> en mission <em>Normal</em> (attaque) sur les coordonnées d'un ennemi.</li>
                <li><strong>Elle voyage</strong> — le temps de trajet s'affiche dans la page Flottes. Vous pouvez la rappeler avant qu'elle arrive.</li>
                <li><strong>Arrivée</strong> : s'il y a des flottes ennemies sur place, un combat s'engage automatiquement.</li>
                <li><strong>Combat en rounds</strong> : les deux camps échangent des tirs tour par tour (jusqu'à 100 tours max). Les boucliers absorbent d'abord.</li>
                <li><strong>Fin du combat</strong> : un camp est éliminé, ou les 100 tours sont atteints (dans ce cas, <strong>c'est le défenseur qui gagne</strong>).</li>
            </ol>

            <h2 id="apres-combat">Après le combat</h2>
            <ul>
                <li>Un <strong>rapport de combat</strong> vous est envoyé (page Messages / Rapports).</li>
                <li>Les vaisseaux détruits laissent des <strong>débris</strong> sur place. Envoyez des recycleurs !</li>
                <li>Le vainqueur gagne des <strong>Points de Guerre (PDG)</strong> proportionnels aux pertes infligées.</li>
                <li>Votre flotte survivante revient automatiquement à sa planète de départ.</li>
            </ul>

            <h2 id="erreurs">Les erreurs classiques à éviter</h2>
            <ul>
                <li>Attaquer sans sonder d'abord.</li>
                <li>Oublier que les rounds s'arrêtent à 100, en faveur du défenseur (attaquer une cible trop dure = défaite automatique).</li>
                <li>Ne pas envoyer de recycleur : vos adversaires récupéreront <em>vos</em> débris avant vous.</li>
            </ul>

    tips:
        title: "Astuces pour bien débuter"
        category: "beginner"
        order: 8
        tags: "astuces,conseils,strategie,debutant"
        summary: "15 conseils qui font toute la différence dans vos premiers jours."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Économie</h2>
            <ul>
                <li><strong>Maximisez vos travailleurs</strong> : c'est votre source principale de Bitcoins.</li>
                <li><strong>Ne construisez pas trop tôt</strong> une grosse armée : elle vous ruinera en entretien.</li>
                <li><strong>Construisez des Cités puis des Métropoles</strong> pour augmenter la population.</li>
                <li><strong>Surveillez votre rapport journalier</strong> : si vos coûts dépassent vos revenus, réagissez tout de suite.</li>
                <li><strong>Vendez vos surplus aux marchands</strong> plutôt que de laisser le stockage saturer.</li>
            </ul>

            <h2 id="militaire">Militaire</h2>
            <ul>
                <li><strong>Toujours une défense sur chaque planète</strong> : Légionnaires en caserne, Mechas, une ou deux tourelles.</li>
                <li><strong>Personnalisez vos vaisseaux chaque jour</strong> : 40 points gratuits à distribuer (armure, précision, armes).</li>
                <li><strong>Les recycleurs sont très rentables</strong> : après chaque combat, récupérez les débris.</li>
                <li><strong>Sondez avant d'attaquer</strong> : une sonde coûte trois fois rien, une flotte perdue coûte cher.</li>
                <li><strong>Attention au seuil des 100 rounds</strong> : si vous n'éliminez pas le défenseur en 100 tours, vous perdez.</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Rejoignez une alliance rapidement</strong> : +20&nbsp;% de production, accès à la diplomatie et aux recherches d'alliance.</li>
                <li><strong>Complétez vos 3 quêtes journalières</strong> : c'est <strong>+250 PDG</strong> à la clé, chaque jour.</li>
                <li><strong>Discutez dans le salon d'alliance</strong> : coordonner deux attaques vaut mieux qu'en tenter une seul.</li>
                <li><strong>Connectez-vous chaque jour</strong> : le bonus de connexion monte en flèche avec la série de 7 jours consécutifs.</li>
                <li><strong>Activez les notifications push</strong> : vous saurez dès qu'une flotte ennemie fonce sur vous.</li>
            </ul>

    resources:
        title: "Ressources en détail"
        category: "economy"
        order: 1
        tags: "ressources,niobium,eau,nourriture,uranium,production,stockage,cycle,rations"
        summary: "Tout comprendre sur les ressources : production, bonus, stockage et cas particulier de l'uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Rappel : les 4 ressources</h2>
            <ul>
                <li><strong>Niobium</strong> — construction.</li>
                <li><strong>Eau</strong> — construction + carburant des flottes.</li>
                <li><strong>Nourriture</strong> — entretien des travailleurs, Légionnaires, Mechas.</li>
                <li><strong>Uranium</strong> — arme nucléaire, défis d'arène. Rare et précieuse.</li>
            </ul>

            <h2 id="production">Comment la production se calcule</h2>
            <p>Chaque planète tourne sur un <strong>cycle de 10 minutes</strong>. À chaque cycle, vous recevez une quantité fixe qui dépend :</p>
            <ul>
                <li>du <strong>niveau</strong> de votre bâtiment producteur (Mine, Extracteur, Ferme) ;</li>
                <li>de la <strong>taille</strong> de la planète (terraformation) ;</li>
                <li>de vos <strong>bonus</strong> (alliance, recherches, héros).</li>
            </ul>
            <p>Les <strong>lunes</strong> produisent de la nourriture <strong>10 fois plus vite</strong> (cycle d'1 minute).</p>
            <p>Même <strong>sans bâtiment producteur</strong> — ou si vous le détruisez jusqu'au niveau 0 — une planète conserve une <strong>production de base minimale</strong> : <strong>7 Niobium, 6 Eau et 9 Nourriture</strong> par cycle. Dès le niveau 1, la production du bâtiment (toujours supérieure) prend le relais.</p>
            <p>Pour la nourriture, le <strong>Champ agricole</strong> et la <strong>Ferme aéroponique</strong> <strong>s'additionnent</strong> : leurs productions se cumulent.</p>

            <h2 id="bonus">Ce qui augmente votre production</h2>
            <table>
                <tr><th>Source</th><th>Effet</th></tr>
                <tr><td>Appartenance à une alliance</td><td>+20&nbsp;% de base</td></tr>
                <tr><td>Recherches d'alliance de production</td><td>Bonus supplémentaire croissant avec le niveau de recherche</td></tr>
                <tr><td>Terraformation de la planète</td><td>Plus d'espace = meilleurs bâtiments</td></tr>
                <tr><td>Héros d'Économie sur la planète</td><td>Boost de production (double les autres bonus)</td></tr>
                <tr><td>Événements spéciaux</td><td>Boosts temporaires pendant un événement serveur</td></tr>
            </table>

            <h2 id="stockage">Le stockage et ses pièges</h2>
            <p>Votre planète a une <strong>capacité maximale</strong> pour chaque ressource. Quand c'est plein, la production s'arrête — la ressource continue à être "produite" mais est perdue.</p>
            <p>Solutions : construire des <strong>Stocks</strong> (Niobium, Eau, Silos), vendre l'excédent aux marchands, ou envoyer les surplus à un allié.</p>

            <p>La nourriture se transporte comme le niobium et l'eau : chargez des <strong>rations</strong> dans la soute d'une flotte (1 place par ration) pour ravitailler une autre planète. Au déchargement, le grenier ne dépasse jamais sa capacité : le surplus reste en soute.</p>

            <h2 id="uranium">L'uranium : le cas particulier</h2>
            <p>Aucun bâtiment ne produit d'uranium. Vous en obtenez :</p>
            <ul>
                <li>en <strong>recyclant</strong> des débris d'uranium sur la carte (repérés par leur icône spéciale) ;</li>
                <li>en <strong>battant des Cthulhu</strong> (missions PvE) ;</li>
                <li>en <strong>gagnant des défis d'arène</strong> avec mise d'uranium.</li>
            </ul>
            <p>L'uranium sert à fabriquer des <strong>bombes nucléaires</strong> et à miser en <strong>arène</strong>.</p>

    buildings:
        title: "Les bâtiments"
        category: "economy"
        order: 2
        tags: "batiments,construction,mine,extracteur,ferme,cite,chantier,bunker,tourelle"
        summary: "Catalogue complet des bâtiments par rôle : production, stockage, population, militaire, défense."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Production de ressources</h2>
            <table>
                <tr><th>Bâtiment</th><th>Produit</th><th>Remarque</th></tr>
                <tr><td>Mine de Niobium</td><td>Niobium</td><td>Le premier à construire.</td></tr>
                <tr><td>Extracteur d'eau</td><td>Eau</td><td>Indispensable pour tout.</td></tr>
                <tr><td>Ferme</td><td>Nourriture</td><td>Pour nourrir travailleurs et Légionnaires.</td></tr>
                <tr><td>Ferme aéroponique</td><td>Nourriture (avancée)</td><td>Plus efficace que la Ferme. Débloquée par recherche.</td></tr>
            </table>

            <h2 id="stockage">Stockage</h2>
            <table>
                <tr><th>Bâtiment</th><th>Rôle</th></tr>
                <tr><td>Stock de Niobium</td><td>Augmente la capacité de niobium stockable.</td></tr>
                <tr><td>Stock d'Eau</td><td>Augmente la capacité d'eau stockable.</td></tr>
                <tr><td>Silos</td><td>Augmente la capacité de nourriture.</td></tr>
            </table>

            <h2 id="population">Population et science</h2>
            <table>
                <tr><th>Bâtiment</th><th>Rôle</th></tr>
                <tr><td>Cité</td><td>+25&nbsp;000 travailleurs maximum par niveau.</td></tr>
                <tr><td>Métropole</td><td>+80&nbsp;000 travailleurs maximum par niveau.</td></tr>
                <tr><td>Centre de recherche</td><td>Permet de lancer des recherches et d'augmenter la vitesse.</td></tr>
            </table>

            <h2 id="militaire">Militaire et production de vaisseaux</h2>
            <table>
                <tr><th>Bâtiment</th><th>Rôle</th></tr>
                <tr><td>Caserne</td><td>+5&nbsp;000 Légionnaires maximum par niveau.</td></tr>
                <tr><td>Bunker</td><td>+15&nbsp;000 Légionnaires max, et <strong>protège une part de vos ressources</strong> contre les raids (5&nbsp;% par niveau).</td></tr>
                <tr><td>Base nucléaire</td><td>Permet de fabriquer des bombes nucléaires (uranium requis).</td></tr>
                <tr><td>Chantier spatial</td><td>Fabrique les vaisseaux utilitaires (cargo, sonde, recycleur…) et accélère la production de tous les vaisseaux (+25&nbsp;% par niveau).</td></tr>
                <tr><td>Usine légère</td><td>Fabrique les vaisseaux légers (chasseurs, corvettes) et accélère la production de vaisseaux (+40&nbsp;%/niveau) <strong>et de défenses</strong> (+40&nbsp;%/niveau).</td></tr>
                <tr><td>Usine lourde</td><td>Fabrique les vaisseaux lourds (frégates, cuirassés, destroyers) et accélère la production de vaisseaux (+60&nbsp;%/niveau) <strong>et de défenses</strong> (+60&nbsp;%/niveau).</td></tr>
                <tr><td>Prison</td><td>Enferme les héros capturés.</td></tr>
                <tr><td>Camp d'esclaves</td><td>Alternative à la Prison. Permet de faire travailler les héros capturés.</td></tr>
            </table>

            <h2 id="orbital">Défense et installations orbitales (en ciel)</h2>
            <table>
                <tr><th>Bâtiment / Installation</th><th>Rôle</th></tr>
                <tr><td>Île orbitale</td><td>Ajoute des emplacements en ciel pour poser des tourelles/boucliers.</td></tr>
                <tr><td>Base spatiale</td><td>Apporte un bonus d'armure aux défenses orbitales.</td></tr>
                <tr><td>Bouclier / Grand bouclier</td><td>Absorbe les dégâts avant que les défenses soient touchées.</td></tr>
                <tr><td>Tourelles (missile, laser, Gauss, plasma…)</td><td>Défendent votre planète contre les flottes en mode attaque.</td></tr>
            </table>

            <h2 id="detection">Détection et brouillage</h2>
            <table>
                <tr><th>Bâtiment</th><th>Rôle</th></tr>
                <tr><td>Radar</td><td>Détecte les flottes qui approchent.</td></tr>
                <tr><td>Sky Radar</td><td>Version orbitale du radar, portée augmentée.</td></tr>
                <tr><td>Sky Jammer</td><td>Brouille la détection ennemie : vos mouvements deviennent invisibles.</td></tr>
            </table>

            <h2 id="file-production">Gérer la file de production</h2>
            <p>Les constructions de bâtiments, de vaisseaux (Chantier spatial) et de défenses passent par une <strong>file d'attente</strong> que vous pouvez gérer :</p>
            <ul>
                <li><strong>Réorganiser</strong> l'ordre des éléments en attente (glisser-déposer) pour prioriser ce qui compte.</li>
                <li><strong>Annuler</strong> un élément en attente : vous êtes <strong>remboursé au prorata</strong> de ce qui n'a pas encore été produit.</li>
                <li>La file en cours s'affiche en haut de chaque page de production, sous le titre.</li>
                <li>La file est limitée à <strong>15 éléments en attente</strong> (hors construction en cours) : au-delà, un message vous indique d'attendre la fin d'une construction ou d'en annuler une avant d'en ajouter une nouvelle.</li>
                <li>La <strong>Ville flottante</strong> (+10&nbsp;sol/niveau) et la <strong>Station orbitale</strong> (+5&nbsp;ciel/niveau) sont plafonnées à <strong>5 exemplaires par planète</strong> chacune.</li>
            </ul>

    research:
        title: "Recherche et technologies"
        category: "economy"
        order: 3
        tags: "recherche,technologie,science,bitcoin,deblocage,arbre technologique"
        summary: "Les technologies qui débloquent vaisseaux, bonus et nouvelles capacités. Comment prioriser."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="fonctionnement">Comment ça marche</h2>
            <p>Les recherches se lancent depuis le <strong>Centre de recherche</strong>. Chaque recherche :</p>
            <ul>
                <li>coûte des <strong>Bitcoins</strong> ;</li>
                <li>prend du <strong>temps</strong> (de quelques minutes à plusieurs heures selon le niveau) ;</li>
                <li>peut avoir un <strong>prérequis</strong> (une autre recherche à un certain niveau).</li>
            </ul>
            <p>Recruter des <strong>scientifiques</strong> accélère vos recherches en cours.</p>

            <h2 id="priorite-debutant">Priorités pour un débutant</h2>
            <ol>
                <li><strong>Utilitaire</strong> — débloque cargos, sondes, recycleurs.</li>
                <li><strong>Industrie</strong> — plus de production de ressources.</li>
                <li><strong>Démographie</strong> — plus de travailleurs (donc plus de Bitcoins).</li>
                <li><strong>Barge</strong> et <strong>Recycleur</strong> — indispensables pour attaquer et recycler.</li>
                <li><strong>Armement / Armure</strong> — avant tout vrai combat.</li>
            </ol>

            <h2 id="recherches">Liste complète des recherches</h2>
            <table>
                <tr><th>Recherche</th><th>Effet</th><th>Niveau max</th></tr>
                <tr><td>Utilitaire</td><td>Débloque cargos, sondes, recycleur, etc.</td><td>3</td></tr>
                <tr><td>Terraformation</td><td>Agrandit la taille constructible des planètes.</td><td>18</td></tr>
                <tr><td>Expansion</td><td>Augmente le nombre de planètes que vous pouvez coloniser.</td><td>2</td></tr>
                <tr><td>Industrie</td><td>Bonus de production pour les ressources.</td><td>5</td></tr>
                <tr><td>Démographie</td><td>Augmente la production de travailleurs.</td><td>5</td></tr>
                <tr><td>Discipline</td><td>Renforce les Légionnaires au sol.</td><td>3</td></tr>
                <tr><td>Barbelés</td><td>Bonus de défense au sol.</td><td>5</td></tr>
                <tr><td>Unités blindées</td><td>Débloque les Mechas.</td><td>1</td></tr>
                <tr><td>Armement</td><td>Augmente les dégâts de vos vaisseaux.</td><td>5</td></tr>
                <tr><td>Missile</td><td>Faction missile (bonus vs lasers).</td><td>3</td></tr>
                <tr><td>Laser</td><td>Faction laser (bonus vs plasma).</td><td>3</td></tr>
                <tr><td>Plasma</td><td>Faction plasma (bonus vs missiles).</td><td>3</td></tr>
                <tr><td>Hyperespace</td><td>Permet les voyages inter-galaxies.</td><td>1</td></tr>
                <tr><td>Onde</td><td>Améliore radars et communications. Prérequis d'autres recherches.</td><td>5</td></tr>
                <tr><td>Espionnage</td><td>Améliore la portée de vos sondes (prérequis : Onde niveau 5).</td><td>999</td></tr>
                <tr><td>Cargo</td><td>Augmente la capacité des cargos.</td><td>5</td></tr>
                <tr><td>Barge</td><td>Débloque les barges (transport de Légionnaires).</td><td>1</td></tr>
                <tr><td>Recycleur</td><td>Débloque le recycleur.</td><td>1</td></tr>
                <tr><td>Vaisseau léger</td><td>Débloque/améliore les vaisseaux légers.</td><td>3</td></tr>
                <tr><td>Vaisseau lourd</td><td>Débloque/améliore les vaisseaux lourds.</td><td>3</td></tr>
                <tr><td>Ferme aéroponique</td><td>Débloque la version avancée de la ferme.</td><td>1</td></tr>
                <tr><td>Prison</td><td>Débloque la prison (prérequis : Barbelés 5).</td><td>1</td></tr>
            </table>

            <h2 id="modes-speciaux">Modes de serveur à recherches maximales</h2>
            <p>Dans certains modes (Battle Royale, Domination, Search &amp; Destroy), toutes vos recherches démarrent au <strong>niveau maximum</strong>. Le menu Recherche est alors caché.</p>

    workers_scientists:
        title: "Travailleurs et scientifiques"
        category: "economy"
        order: 4
        tags: "travailleurs,scientifiques,population,bitcoin,production,defense"
        summary: "Les deux populations de votre empire : les travailleurs qui paient, les scientifiques qui accélèrent."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Les travailleurs</h2>
            <p>Les travailleurs sont votre <strong>source principale de Bitcoins</strong>. Chaque jour (au rapport journalier), ils vous versent un revenu proportionnel à leur nombre.</p>
            <p>Leur <strong>nombre maximum</strong> dépend des Cités et Métropoles que vous avez construites :</p>
            <ul>
                <li><strong>Cité</strong> : +25&nbsp;000 travailleurs max par niveau.</li>
                <li><strong>Métropole</strong> : +80&nbsp;000 travailleurs max par niveau.</li>
            </ul>
            <p>Pour augmenter leur nombre concret (pas juste le cap), il faut avoir de la <strong>nourriture</strong> en réserve — la population grandit naturellement tant qu'elle est nourrie.</p>

            <h2 id="scientifiques">Les scientifiques</h2>
            <p>Les scientifiques <strong>accélèrent vos recherches</strong>. Plus vous en recrutez, plus vos technologies se terminent vite.</p>
            <p>Attention : chaque scientifique coûte un petit entretien quotidien. Ne sur-recrutez pas.</p>

            <h2 id="defense">Rôle défensif</h2>
            <p>Vos <strong>travailleurs participent à la défense au sol</strong> — mais uniquement lors d'une <strong>invasion</strong> (quand l'ennemi veut prendre votre planète). Pendant un <strong>raid</strong> classique (pillage simple), ils restent cachés.</p>
            <p>Les recherches d'alliance de type "défense des travailleurs" renforcent encore leur efficacité.</p>

            <h2 id="gerer">Bien gérer sa population</h2>
            <ul>
                <li>Adaptez votre nombre de travailleurs à votre capacité en nourriture.</li>
                <li>Pas besoin d'avoir la population maximale à 100&nbsp;% tout le temps : visez la rentabilité.</li>
                <li>En cas de famine ou d'embargo, vos travailleurs peuvent mourir — prévoyez des réserves.</li>
            </ul>

            <h2 id="reserve-5000">La réserve intouchable de 5 000 travailleurs</h2>
            <p>Une planète ne peut <strong>jamais descendre sous 5 000 travailleurs</strong>. Cette réserve est protégée : toute action qui la ferait passer en dessous est bloquée avec un message clair. Sont concernés :</p>
            <ul>
                <li>Le <strong>recrutement de défense</strong> (Légionnaires, Mechas, scientifiques) qui consomme des travailleurs.</li>
                <li>La <strong>construction de vaisseaux</strong> au Chantier spatial.</li>
                <li>Le <strong>chargement de travailleurs dans un cargo</strong> en vue d'un transfert.</li>
            </ul>
            <p>Le bouton « MAX » des pages de production tient compte de cette réserve : il ne vous proposera jamais un maximum qui viderait votre planète sous le seuil.</p>

    market:
        title: "Marché et marchands"
        category: "economy"
        order: 5
        tags: "marche,marchands,vente,commerce,cargo,bitcoin"
        summary: "Comment vendre vos ressources aux marchands PNJ contre des Bitcoins."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Les marchands, c'est qui ?</h2>
            <p>Des <strong>personnages non-joueurs</strong> (PNJ) présents sur la carte. Vous pouvez leur vendre votre niobium et votre eau en échange de Bitcoins.</p>
            <p>Ils apparaissent régulièrement dans différents secteurs de l'univers — leur position est visible sur la carte.</p>

            <h2 id="vendre">Comment leur vendre</h2>
            <ol>
                <li>Chargez un <strong>cargo</strong> avec du niobium et/ou de l'eau.</li>
                <li>Envoyez-le au marchand en mission <strong>Déchargement</strong>.</li>
                <li>Le cargo arrive, la vente est faite, vous recevez des Bitcoins.</li>
                <li>Le cargo rentre automatiquement chez vous.</li>
            </ol>

            <h2 id="immunite">Les marchands sont intouchables</h2>
            <p>Les marchands sont <strong>immunisés contre toute attaque</strong>. Vous ne pouvez pas les raider, les envahir ni les combattre. Leurs flottes ne participent jamais à un combat, même si elles se trouvent sur le même point qu'un affrontement.</p>
            <p>Moralité : pas de mauvaise surprise, c'est un partenaire commercial sûr.</p>

            <h2 id="gain">Combien ça rapporte ?</h2>
            <p>Le prix payé dépend de la ressource (l'eau rapporte plus que le niobium, au taux actuel) et d'un <strong>bonus marchand</strong> qui augmente avec les recherches d'alliance dédiées.</p>
            <p>L'interface vous affiche le gain estimé avant de valider la vente. Regardez avant d'envoyer.</p>

            <h2 id="astuce">Astuce</h2>
            <p>Plutôt que laisser vos stocks saturer, envoyez un cargo régulièrement. C'est du Bitcoin gratuit pour financer vos recherches ou votre armée.</p>

    recycling:
        title: "Recyclage"
        category: "economy"
        order: 6
        tags: "recyclage,debris,cdr,recycleur,asteroide,uranium"
        summary: "Après chaque combat, des débris traînent. Les récupérer, c'est une mine à ciel ouvert."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Les débris : c'est quoi ?</h2>
            <p>Chaque vaisseau détruit en combat laisse une partie de son coût sous forme de <strong>débris</strong> flottants dans l'espace. On appelle ça un <strong>CDR</strong> (Champ De Ressources).</p>
            <p>Les débris contiennent du <strong>niobium</strong>, de l'<strong>eau</strong>, et parfois de l'<strong>uranium</strong> (sur des débris spéciaux qui apparaissent seuls sur la carte).</p>
            <p>Sur la carte, les débris sont matérialisés par une icône spécifique à la position de l'affrontement.</p>

            <h2 id="combien">Combien de débris ?</h2>
            <p>Un champ contient <strong>40 % du coût de construction des vaisseaux réellement détruits</strong>, dans les deux camps. Chaque vaisseau rend ses propres ressources : un Cuirassé, coûteux en eau, laisse surtout de l'eau. Les survivants ne laissent rien.</p>
            <p>Trois cas particuliers :</p>
            <ul>
                <li>Face aux hordes de <strong>Cthulhu</strong>, le taux tombe à <strong>20 %</strong>.</li>
                <li>La <strong>cargaison</strong> d'une flotte entièrement détruite se déverse aussi dans le champ, à 40 %. Un vainqueur amoché, lui, garde toute sa soute.</li>
                <li>Les <strong>défenses planétaires</strong> rasées et les vaisseaux payés en <strong>points de guerre</strong> (Chasseur à plasma, Corvette de combat, Vaisseau de bataille, Caravelle) ne laissent <strong>aucun</strong> débris : ils ne coûtent ni niobium ni eau à la construction.</li>
            </ul>
            <p>Un <strong>combat orbital</strong> (flotte abattue par les tourelles d'une planète en mode attaque, ou vaisseaux perdus en forçant une orbite défendue) laisse un champ selon la même règle.</p>

            <h2 id="comment">Comment recycler</h2>
            <ol>
                <li>Débloquez la recherche <strong>Recycleur</strong>.</li>
                <li>Fabriquez des <strong>recycleurs</strong> dans votre Chantier spatial.</li>
                <li>Envoyez une flotte de recycleurs en mission <strong>Recyclage</strong> sur les coordonnées du champ de débris.</li>
                <li>Ils travaillent par <strong>cycles de 5 minutes</strong> : à chaque cycle, ils ramassent ce qu'ils peuvent.</li>
                <li>Une fois pleins (ou le champ vide), la flotte rentre automatiquement.</li>
            </ol>

            <h2 id="capacite">Combien un recycleur peut ramener ?</h2>
            <p>Chaque recycleur collecte <strong>1&nbsp;000 ressources par cycle de 5 minutes</strong>, soit 12&nbsp;000/heure. Les <strong>recherches d'alliance</strong> peuvent fortement booster cette capacité.</p>

            <h2 id="strategie">Stratégie</h2>
            <ul>
                <li>Après chaque combat, envoyez immédiatement des recycleurs : sinon, vos adversaires les auront.</li>
                <li>Protégez-les : un recycleur isolé est une cible facile.</li>
                <li>Les débris d'<strong>uranium</strong> apparaissent spontanément : c'est votre meilleure source d'uranium hors combat.</li>
                <li>Le recyclage est très rentable — pensez-y comme une deuxième économie derrière vos mines.</li>
            </ul>

    daily_report:
        title: "Le rapport journalier"
        category: "economy"
        order: 7
        tags: "rapport,journalier,quotidien,bilan,revenus,couts,taxe"
        summary: "Chaque jour à 18h59 UTC, le jeu fait votre bilan : revenus, coûts, taxes. À surveiller de près."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Quand ça tombe</h2>
            <p>Chaque jour à <strong>18h59 UTC</strong> (19h59 en heure française d'hiver, 20h59 en été). C'est un rendez-vous fixe pour tous les joueurs du serveur.</p>
            <p>Vous recevez un rapport détaillé dans vos Messages.</p>

            <h2 id="contenu">Ce que contient le rapport</h2>
            <ul>
                <li><strong>Revenus</strong> — ce que vos travailleurs ont généré.</li>
                <li><strong>Coûts d'entretien</strong> — Légionnaires, Mechas, scientifiques, vaisseaux, bâtiments. Les unités en mission coûtent plus cher que celles stationnées.</li>
                <li><strong>Taxe de paix</strong> — si vous êtes en paix avec une alliance ayant exigé une taxe.</li>
                <li><strong>Taxe d'alliance</strong> — contribution automatique à la trésorerie de votre alliance (si configurée).</li>
                <li><strong>Bilan final</strong> — revenus − coûts − taxes, ajouté à votre solde.</li>
            </ul>

            <h2 id="quetes">Les quêtes journalières</h2>
            <p>Le rapport journalier <strong>renouvelle vos 3 quêtes</strong> du jour. Si vous aviez complété les <strong>3 quêtes de la veille</strong>, vous recevez <strong>+250 PDG</strong> en récompense bonus.</p>

            <h2 id="danger">Le danger à surveiller</h2>
            <p>Si votre solde tombe <strong>en négatif</strong> après le rapport, c'est le <strong>Game Over économique</strong> : flottes détruites, solde réinitialisé à 125&nbsp;000 Bitcoins, recherches partiellement réduites.</p>
            <p>Vérifiez votre rapport chaque jour. Si vos coûts grimpent trop : ralentissez le recrutement, rappelez vos flottes en mission, ou licenciez des unités.</p>

    exchange:
        title: "Échanges entre joueurs"
        category: "economy"
        order: 8
        tags: "echange,alliance,ressources,bitcoin,don,depot"
        summary: "Comment envoyer des ressources ou des Bitcoins à un allié (et les limites de la chose)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Area Universe permet à des joueurs d'une <strong>même alliance</strong> de s'entraider en se transférant des ressources ou des Bitcoins. C'est très utile pour :</p>
            <ul>
                <li>Relancer un membre qui vient d'être pillé.</li>
                <li>Mutualiser un effort de recherche ou de construction coûteux.</li>
                <li>Ravitailler un allié sous embargo.</li>
            </ul>

            <h2 id="ressources">Envoyer des ressources physiques</h2>
            <p>Pour envoyer du niobium, de l'eau ou de la nourriture : chargez-les dans un <strong>cargo</strong> et envoyez le cargo en mission <strong>Déchargement</strong> vers la planète du destinataire. Les ressources sont déposées automatiquement à l'arrivée, le cargo rentre tout seul.</p>

            <h2 id="bitcoins">Envoyer des Bitcoins</h2>
            <p>Les Bitcoins se transfèrent via la <strong>trésorerie d'alliance</strong> (voir l'article dédié). Vous déposez sur la trésorerie, et les officiers peuvent répartir ou verser à un joueur.</p>

            <h2 id="limites">Les limites</h2>
            <ul>
                <li>On ne peut <strong>pas transférer d'uranium</strong> librement (ressource stratégique).</li>
                <li>Les échanges passent obligatoirement par une flotte : il faut du temps et du carburant.</li>
                <li>Une planète sous <strong>embargo</strong> ne peut recevoir que de vous-même ou d'un allié, pas d'un étranger.</li>
                <li>On ne peut pas envoyer de ressources à un ennemi ou à un joueur hors alliance (sauf via la trésorerie, selon règles).</li>
            </ul>

    fleet_creation:
        title: "Créer et envoyer une flotte"
        category: "fleet"
        order: 1
        tags: "flotte,creation,vaisseaux,composition,chantier,mission"
        summary: "De la fabrication du vaisseau jusqu'à son arrivée à destination : le parcours complet."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut</h2>
            <ul>
                <li>Un <strong>Chantier spatial</strong> sur votre planète active.</li>
                <li>Les ressources nécessaires (niobium et eau).</li>
                <li>Les recherches requises pour le vaisseau voulu (par ex. <em>Utilitaire</em> pour les cargos).</li>
            </ul>

            <h2 id="fabriquer">Étape 1 — Fabriquer les vaisseaux</h2>
            <p>Depuis la page <strong>Spatial</strong>, choisissez un modèle et une quantité. La production prend du temps et se fait en arrière-plan.</p>

            <h2 id="composer">Étape 2 — Composer la flotte</h2>
            <p>Une fois les vaisseaux livrés, allez sur la page <strong>Flottes</strong>. Vous pouvez :</p>
            <ul>
                <li>Sélectionner quels vaisseaux embarquent.</li>
                <li>Charger des <strong>ressources</strong> (pour un transport).</li>
                <li>Embarquer des <strong>Légionnaires</strong> (pour raid/invasion, avec des barges).</li>
            </ul>

            <h2 id="envoyer">Étape 3 — Envoyer la flotte</h2>
            <ol>
                <li>Choisissez la <strong>destination</strong>. Vous pouvez la saisir au format <code>Galaxie:Secteur:Position</code> ou cliquer depuis la Carte.</li>
                <li>Choisissez un <strong>type de mission</strong> (Normal, Déchargement, Recyclage, Raid, Invasion…).</li>
                <li>Vérifiez le coût en carburant (eau) et la durée du vol.</li>
                <li>Confirmez.</li>
            </ol>
            <p>La flotte apparaît dans votre liste de flottes en vol. Vous pouvez la <strong>rappeler</strong> avant son arrivée si besoin.</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li>Pensez à ajouter un <strong>recycleur</strong> à vos flottes d'attaque, pour récupérer les débris tout de suite.</li>
                <li>N'envoyez jamais toute votre défense d'un coup : gardez de quoi tenir votre planète.</li>
                <li>Le retour d'une flotte après mission ne coûte pas de carburant supplémentaire (déjà provisionné).</li>
            </ul>

    ship_types:
        title: "Types de vaisseaux"
        category: "fleet"
        order: 2
        tags: "vaisseaux,chasseur,corvette,fregate,cuirasse,croiseur,destroyer,cargo,sonde"
        summary: "Tous les vaisseaux du jeu : utilitaires, légers, lourds, spéciaux — et comment les utiliser."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Vaisseaux utilitaires</h2>
            <p>Ils ne combattent pas. Ils servent à transporter, explorer, recycler, coloniser.</p>
            <table>
                <tr><th>Vaisseau</th><th>Rôle</th><th>Capacité</th></tr>
                <tr><td>Sonde</td><td>Espionner une planète.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Transport léger.</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>Transport moyen.</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>Gros transport.</td><td>25&nbsp;000</td></tr>
                <tr><td>Caravelle</td><td>Cargo premium : le plus grand et le plus rapide des cargos. Payé en Points de Guerre (25) + 15&nbsp;travailleurs par unité produite.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonisateur</td><td>Fonder une nouvelle planète.</td><td>—</td></tr>
                <tr><td>Recycleur</td><td>Collecter les débris de combat.</td><td>1&nbsp;000 par cycle de 5 min</td></tr>
                <tr><td>Barge</td><td>Transporter des Légionnaires pour un raid ou une invasion.</td><td>1&nbsp;000 Légionnaires</td></tr>
                <tr><td>Moon Maker</td><td>Créer une lune sur un emplacement vide portant assez de débris (min. 2M niobium et 2M eau).</td><td>—</td></tr>
                <tr><td>Radar (vaisseau)</td><td>Étendre votre détection dans un secteur.</td><td>—</td></tr>
                <tr><td>Jammer (vaisseau)</td><td>Brouiller la détection ennemie.</td><td>—</td></tr>
                <tr><td>Vaisseau-mère</td><td>Vaisseau amiral de prestige. Ralentit la flotte.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Vaisseaux de combat</h2>
            <p>Ils sont répartis en <strong>classes</strong> (du plus léger au plus lourd). Chaque classe a ses forces et faiblesses ; un combat équilibré mélange les classes.</p>
            <table>
                <tr><th>Classe</th><th>Exemples</th><th>Profil</th></tr>
                <tr><td>Léger</td><td>Chasseur, Chasseur lourd, Chasseur de guerre</td><td>Rapide, pas cher, nombreux. Bon contre les corvettes.</td></tr>
                <tr><td>Moyen</td><td>Corvette, Corvette laser, Corvette de guerre</td><td>Équilibré. Bon contre les chasseurs et frégates.</td></tr>
                <tr><td>Lourd</td><td>Frégate, Frégate plasma</td><td>Gros dégâts à longue portée.</td></tr>
                <tr><td>Très lourd</td><td>Cuirassé</td><td>Résistant, dégâts solides.</td></tr>
                <tr><td>Capital</td><td>Croiseur, Blindé, Destroyer</td><td>Colossal, très cher, dévastateur. Cœur de votre flotte.</td></tr>
            </table>

            <h2 id="factions">Les factions de combat</h2>
            <p>Certains vaisseaux appartiennent à une <strong>faction</strong> : <em>missile</em>, <em>laser</em> ou <em>plasma</em>. Les factions se contrent (pierre-feuille-ciseaux), avec un bonus de +20&nbsp;% de puissance contre leur faction cible.</p>

            <h2 id="bonus-cargo">Capacité de transport</h2>
            <p>La capacité des cargos augmente avec les <strong>recherches d'alliance</strong> dédiées au cargo. Utile quand vous commencez à jouer sur de longues distances.</p>

    ship_customization:
        title: "Personnaliser ses vaisseaux"
        category: "fleet"
        order: 3
        tags: "personnalisation,vaisseaux,points,armure,precision,armes"
        summary: "40 points gratuits chaque jour pour booster armure, précision et armes de vos vaisseaux."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Chaque modèle de vaisseau a trois caractéristiques que vous pouvez faire évoluer :</p>
            <ul>
                <li><strong>Armure</strong> — combien il peut encaisser.</li>
                <li><strong>Précision</strong> — relève le pire résultat possible de chaque salve (aucun tir ne rate jamais, mais un tir mal ajusté inflige moins de dégâts).</li>
                <li><strong>Armes</strong> — dégâts infligés.</li>
            </ul>
            <p>Chaque jour, le jeu vous offre <strong>40 points à répartir librement</strong>, pour tous vos vaisseaux. C'est gratuit, ne l'oubliez pas.</p>

            <h2 id="utiliser">Comment les utiliser</h2>
            <p>Rendez-vous sur la page <strong>Personnalisation</strong> (menu Spatial). Pour chaque modèle, ajustez les curseurs. Vos choix s'appliquent à <strong>tous les vaisseaux de ce modèle</strong> (actuels et futurs). Ces trois statistiques progressent indépendamment les unes des autres : mettre des points dans l'armure ou les armes d'un modèle ne réduit jamais sa précision.</p>

            <h2 id="lecture">Lire votre visée à l'écran</h2>
            <p>L'onglet <strong>Statistiques</strong> du Chantier spatial affiche, modèle par modèle, la visée que vous avez investie sur le crédit de ce modèle (par exemple <code>676 / 676</code> pour un Destroyer) et le <strong>multiplicateur de dégâts</strong> qui en découle&nbsp;: <strong>×0,94</strong> à visée pleine, <strong>×0,66</strong> sans le moindre point investi.</p>
            <p>Ce n'est pas un taux de touche&nbsp;: <strong>aucun tir ne rate jamais</strong>. Mieux viser relève le plancher de vos dégâts, jamais leur plafond. C'est le même chiffre que sur votre page de gestion de flotte, dans l'onglet Défenses et dans vos rapports de combat — les quatre écrans se comparent enfin directement. À titre de repère, les défenses d'une planète tirent à <strong>×1,06</strong>, soit mieux qu'une flotte à visée pleine.</p>

            <h2 id="reset">Remises à zéro</h2>
            <p>Vous pouvez réinitialiser vos points <strong>une fois toutes les 96 heures</strong>, sans limite de nombre : si votre stratégie change ou que le moteur de combat évolue, récupérez tous vos points dépensés pour les redistribuer. Après une réinitialisation, le bouton reste grisé et un compte à rebours affiche le temps restant avant la prochaine.</p>

            <h2 id="modes-speciaux">Modes de serveur à recherches maximales</h2>
            <p>Dans certains modes (Battle Royale, Domination, Search &amp; Destroy), <strong>tous vos points sont débloqués dès le premier jour</strong> (1&nbsp;375 points disponibles immédiatement au lieu de 40/jour).</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li>Ne dispersez pas vos points sur trop de modèles : concentrez-vous sur ceux que vous utilisez vraiment en masse.</li>
                <li>Les <strong>recycleurs</strong> et <strong>cargos</strong> gagnent à avoir un peu d'armure pour survivre aux embuscades.</li>
                <li>Les <strong>chasseurs</strong> bénéficient plus de la précision et des armes que de l'armure (ils meurent vite).</li>
            </ul>

    fleet_missions:
        title: "Types de missions"
        category: "fleet"
        order: 4
        tags: "mission,attaque,transport,colonisation,recyclage,espionnage,nucleaire,raid,invasion"
        summary: "Chaque mission donne un ordre différent à votre flotte. Voici comment choisir la bonne."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Quand vous envoyez une flotte, vous lui donnez un <strong>type de mission</strong>. C'est cette mission qui détermine ce qui se passe à l'arrivée. Certains types exigent des vaisseaux spécifiques.</p>

            <h2 id="missions">Les types disponibles</h2>
            <table>
                <tr><th>Mission</th><th>Ce que ça fait</th><th>Vaisseaux requis</th></tr>
                <tr><td><strong>Normal</strong> (Attaque)</td><td>La flotte se rend au point cible. Si l'ennemi est là, combat automatique.</td><td>N'importe quels vaisseaux</td></tr>
                <tr><td><strong>Déchargement</strong></td><td>Dépose des ressources sur une planète alliée ou chez un marchand, puis revient.</td><td>Au moins un cargo</td></tr>
                <tr><td><strong>Colonisation</strong></td><td>Fonde une nouvelle planète sur un emplacement vide.</td><td>Un colonisateur</td></tr>
                <tr><td><strong>Raid (Pillage)</strong></td><td>Combat la défense au sol pour voler des ressources, sans prendre la planète.</td><td>Barges + Légionnaires</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Combat la défense au sol pour <strong>prendre la planète</strong> à l'adversaire.</td><td>Barges + Légionnaires</td></tr>
                <tr><td><strong>Espionnage</strong></td><td>Envoie une sonde pour obtenir un rapport sur les défenses ennemies.</td><td>Au moins une sonde</td></tr>
                <tr><td><strong>Lune</strong></td><td>Crée une lune sur un emplacement vide portant assez de débris (min. 2M niobium et 2M eau).</td><td>Un Moon Maker</td></tr>
                <tr><td><strong>Radar</strong></td><td>Déploie un satellite radar sur place (détection étendue).</td><td>Un radar-vaisseau</td></tr>
                <tr><td><strong>Brouilleur</strong></td><td>Déploie un satellite de brouillage (cache vos mouvements).</td><td>Un jammer-vaisseau</td></tr>
                <tr><td><strong>Atterrir</strong></td><td>Transfère les vaisseaux directement dans la garnison d'une de vos planètes.</td><td>Planète de vous-même</td></tr>
                <tr><td><strong>Nucléaire</strong></td><td>Largue une bombe nucléaire sur la planète cible.</td><td>Bombe nucléaire embarquée</td></tr>
                <tr><td><strong>Recyclage</strong></td><td>Collecte les débris d'un champ de bataille.</td><td>Au moins un recycleur</td></tr>
            </table>

            <h2 id="choisir">Comment choisir la bonne mission</h2>
            <ul>
                <li>Vous voulez <strong>du Bitcoin</strong> ? → Déchargement vers un marchand.</li>
                <li>Vous voulez <strong>des renseignements</strong> ? → Espionnage.</li>
                <li>Vous voulez <strong>affaiblir</strong> un ennemi ? → Raid (pillage).</li>
                <li>Vous voulez <strong>prendre</strong> sa planète ? → Invasion.</li>
                <li>Vous voulez <strong>récupérer des débris</strong> ? → Recyclage.</li>
            </ul>

    fleet_movement:
        title: "Déplacement et distance"
        category: "fleet"
        order: 5
        tags: "deplacement,distance,vitesse,voyage,carburant,coordonnees"
        summary: "Comment se calcule la durée de vol, le carburant consommé, et ce qui ralentit votre flotte."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Les coordonnées, comment ça marche</h2>
            <p>Chaque position dans l'univers s'écrit au format <strong>Galaxie:Secteur:Position</strong>. Exemple : <code>1:5:12</code> = galaxie 1, secteur 5, position 12.</p>
            <ul>
                <li>Une <strong>galaxie</strong> contient plusieurs secteurs (grille 10×10).</li>
                <li>Un <strong>secteur</strong> contient 25 positions (grille 5×5).</li>
            </ul>

            <h2 id="distance">Comment se calcule la distance</h2>
            <ul>
                <li><strong>Même secteur</strong> — distance courte, voyage rapide.</li>
                <li><strong>Même galaxie, secteur différent</strong> — distance moyenne.</li>
                <li><strong>Galaxie différente</strong> — distance longue, fixe. Nécessite la recherche <strong>Hyperespace</strong>.</li>
            </ul>
            <p>L'interface affiche toujours la distance et la durée estimées avant que vous validiez l'envoi.</p>

            <h2 id="duree">La durée de vol</h2>
            <p>Elle dépend de :</p>
            <ul>
                <li>la <strong>distance</strong> ;</li>
                <li>la <strong>vitesse du vaisseau le plus lent</strong> de votre flotte (une flotte va à la vitesse du plus lent) ;</li>
                <li>la <strong>vitesse du serveur</strong> (certains serveurs sont accélérés).</li>
            </ul>
            <p>Le <strong>Vaisseau-mère</strong> (mothership) est prestigieux mais <strong>ralentit la flotte de 10&nbsp;%</strong>. À prendre en compte. Il <strong>réduit aussi de 10&nbsp;% la signature radar</strong> de la flotte (camouflage) — l'aperçu Empire affiche, lui, le total brut de vos vaisseaux.</p>

            <h2 id="carburant">Le carburant</h2>
            <p>Le carburant est de l'<strong>eau</strong>. Plus votre flotte est <strong>grosse</strong> (masse totale), plus elle consomme. Plus le trajet est <strong>long</strong>, plus elle consomme.</p>
            <p>Une mission <strong>Déchargement</strong> consomme le double (le cargo part lourd, revient lourd du retour).</p>
            <p>Le carburant estimé est affiché avant de lancer la flotte : vérifiez que vous avez assez d'eau en stock.</p>

            <h2 id="rappel">Rappeler une flotte en vol</h2>
            <p>Vous pouvez <strong>rappeler</strong> une flotte tant qu'elle n'est pas arrivée. Elle fait demi-tour et rentre chez elle. Cas typique : un allié attaque avant vous, annulez votre offensive.</p>

            <h2 id="night-slowdown">🌙 Ralentissement nocturne</h2>
            <p>Une flotte offensive (vaisseaux de combat ou troupes terrestres) envoyée vers la planète d'un ennemi prend <strong>×10 plus de temps</strong> si elle arrive pendant la <strong>nuit du défenseur</strong> (23h–06h dans son fuseau horaire). La durée affichée intègre déjà ce multiplicateur.</p>
            <p>Une icône 🌙 sur la carte indique les joueurs actuellement en fenêtre nocturne. Une modale de confirmation s'affiche lors de l'envoi si l'arrivée tombe dans la nuit adverse. Le fuseau horaire est auto-détecté et modifiable au maximum une fois par mois.</p>

    fleet_management:
        title: "Gestion avancée des flottes"
        category: "fleet"
        order: 6
        tags: "gestion,flotte,diviser,fusionner,transferer,regrouper"
        summary: "Diviser, regrouper, faire atterrir : les manipulations avancées pour optimiser vos mouvements."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Les opérations disponibles</h2>
            <ul>
                <li><strong>Diviser</strong> — détacher une partie des vaisseaux dans une nouvelle flotte.</li>
                <li><strong>Regrouper</strong> — fusionner plusieurs de vos flottes qui se trouvent au même endroit.</li>
                <li><strong>Atterrir</strong> — transférer les vaisseaux d'une flotte vers la garnison d'une planète. Les troupes et la cargaison débarquées doivent tenir dans les capacités de la planète&nbsp;; une flotte qui n'en transporte pas atterrit toujours, même sur une planète déjà pleine.</li>
                <li><strong>Rappeler</strong> — faire faire demi-tour à une flotte en vol.</li>
                <li><strong>Transférer au port</strong> — mettre une flotte en "stationnement" sur une planète sans fusion.</li>
            </ul>

            <h2 id="en-vol">Ce qu'on ne peut pas faire</h2>
            <ul>
                <li>Modifier la composition d'une flotte <strong>en vol</strong> (chargement, vaisseaux).</li>
                <li>Changer la mission d'une flotte en vol (sauf rappel).</li>
                <li>Téléporter une flotte (pas de raccourci magique !).</li>
            </ul>

            <h2 id="astuces">Cas d'usage</h2>
            <ul>
                <li><strong>Diviser avant un combat</strong> : gardez une partie de votre flotte en réserve, envoyez une avant-garde.</li>
                <li><strong>Regrouper après un raid</strong> : fusionner plusieurs retours pour gagner en lisibilité.</li>
                <li><strong>Atterrir</strong> : rebasculer une flotte en défense orbitale d'une planète.</li>
            </ul>

    espionage:
        title: "Espionnage et sondes"
        category: "fleet"
        order: 7
        tags: "espionnage,sonde,espion,detection,information,renseignement"
        summary: "Savoir ce que l'adversaire a avant de frapper : l'envoi de sondes expliqué."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Envoyer une sonde</h2>
            <ol>
                <li>Fabriquez des <strong>sondes</strong> dans votre Chantier spatial (débloquées par la recherche Utilitaire).</li>
                <li>Allez sur la page Flottes, ajoutez au moins 1 sonde.</li>
                <li>Choisissez la mission <strong>Espionnage</strong>, désignez la cible.</li>
                <li>Envoyez — la sonde file à toute vitesse.</li>
            </ol>
            <p>À l'arrivée, elle scanne la planète et vous renvoie un rapport.</p>

            <h2 id="reussite">Qu'est-ce qui détermine la réussite ?</h2>
            <p>Un duel silencieux oppose votre <strong>niveau d'Espionnage</strong> à celui du défenseur :</p>
            <ul>
                <li>Si votre niveau est <strong>supérieur ou égal</strong>, le rapport est détaillé.</li>
                <li>Si votre niveau est plus faible, vous obtenez soit des infos partielles, soit rien du tout.</li>
            </ul>
            <p>Pour faire monter votre espionnage : recherche <strong>Onde</strong> niveau 5, puis recherche <strong>Espionnage</strong>.</p>

            <h2 id="rapport">Ce que révèle un rapport réussi</h2>
            <ul>
                <li>Les <strong>ressources</strong> présentes sur la planète.</li>
                <li>La liste des <strong>bâtiments</strong> et leur niveau.</li>
                <li>Les <strong>flottes</strong> en orbite.</li>
                <li>Les <strong>défenses au sol et orbitales</strong>.</li>
                <li>Les <strong>Légionnaires, Mechas, travailleurs</strong>.</li>
            </ul>
            <p>Exactement ce qu'il faut pour décider : raid, invasion, ou retraite.</p>

            <h2 id="detection">Peut-on se faire repérer ?</h2>
            <p>Oui. Si le défenseur a un <strong>Radar</strong> suffisamment bon, il reçoit une alerte d'espionnage (sans forcément savoir quoi a été vu).</p>
            <p>À l'inverse, une planète équipée d'un <strong>Jammer</strong> peut brouiller votre sonde ou la rendre peu fiable.</p>

    spatial_combat:
        title: "Combat spatial"
        category: "combat"
        order: 1
        tags: "combat,spatial,flotte,bataille,bloc,round,bouclier,precision,pertes,degats,ecran,chasseurs"
        summary: "Le déroulé complet d'un combat entre flottes : puissance des camps, duel des boucliers, rounds de tir, fin de combat et calcul exact de vos pertes."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="declenchement">Quand un combat se déclenche</h2>
            <p>Dès qu'une flotte marquée <strong>[Attaque]</strong> partage sa position (Galaxie:Secteur:Position) avec une flotte ennemie, le combat s'engage automatiquement. Vos flottes présentes au même endroit fusionnent d'abord en une seule armada.</p>
            <p>Toutes les flottes sur place sont réparties en <strong>deux camps</strong> selon la diplomatie : votre alliance et ses pactes d'un côté, l'ennemi et ses soutiens de l'autre. Un camp sans la moindre arme (cargos, recycleurs, sondes) ne livre pas bataille : il est détruit, et le rapport le mentionne.</p>
            <p><strong>Alliances en guerre, personne d'armé</strong> — deux flottes d'alliances en guerre qui se croisent en orbite ne déclenchent un combat que si l'une des deux au moins porte des armes de vaisseau. Deux flottes entièrement désarmées (cargos, sondes, recycleurs) qui se croisent ne se battent tout simplement pas&nbsp;: vos flottes ne sont pas immobilisées et personne n'est averti pour rien.</p>
            <p><strong>Cas des raids et invasions</strong> — quand cette bataille est déclenchée par un raid ou une invasion contre une planète gardée (voir les articles <em>Invasion de planète</em> et <em>Raids (pillage)</em>), c'est ce déclenchement lui-même qui pose le marqueur <strong>[Attaque]</strong> sur votre flotte assaillante. Il n'est jamais retiré ensuite&nbsp;: une flotte de raid ou d'invasion qui survit reste donc marquée hostile — les tourelles en mode attaque pourront l'engager plus tard, et elle sera reprise dans la détection du prochain combat spatial dès qu'elle croisera un ennemi.</p>

            <h2 id="puissance">La puissance d'un camp</h2>
            <p>Le combat oppose les <strong>totaux</strong> des deux camps : le jeu additionne l'armure, le bouclier, les missiles, les lasers et le plasma de tous les vaisseaux engagés.</p>
            <ul>
                <li><strong>Défenseur chez lui</strong> — les tourelles et l'armure des défenses de la planète rejoignent son camp ; le Bouclier planétaire ajoute +50&nbsp;000 d'armure, le Grand bouclier +600&nbsp;000. Une flotte armée d'un allié d'alliance stationnée sur votre planète en profite aussi.</li>
                <li><strong>Précision</strong> — moyenne des précisions des flottes du camp (issue de la personnalisation de vos vaisseaux).</li>
                <li><strong>Politique d'alliance</strong> — chaque régime bat son rival : Démocratie bat Communisme, qui bat Fascisme, qui bat Démocratie. Si la politique de l'<strong>attaquant</strong> bat celle du défenseur, toutes ses armes gagnent +20&nbsp;%.</li>
                <li><strong>Améliorations d'alliance</strong> — jusqu'à +5&nbsp;% par type d'arme, d'armure et de bouclier, et jusqu'à +10&nbsp;% pour les défenses planétaires.</li>
                <li><strong>Héros</strong> — bonus d'attaque, de défense, de bouclier et de précision selon compétences et objets. Un héros doué d'<strong>Intimidation</strong> réduit les armes adverses ; un <strong>Tacticien</strong> renforce la première salve de son camp.</li>
            </ul>

            <h2 id="defenses-planete">Vos tourelles se battent dans ce même combat</h2>
            <p>Quand les défenses de votre planète rejoignent un camp, ce combat <strong>est</strong> désormais tout le combat de votre planète&nbsp;: il n'y a plus de second combat orbital séparé derrière pour vos tourelles. Elles visent avec leur propre précision (une escorte peu précise stationnée à côté d'elles ne dégrade plus leur tir), et elles y prennent de <strong>vraies pertes</strong>&nbsp;: proportionnelles aux dégâts encaissés par votre camp s'il l'emporte, <strong>totales</strong> — tourelles, boucliers, base spatiale, mode attaque coupé — si votre camp s'effondre. Cela vaut que le mode attaque de la planète soit actif ou non&nbsp;: dès qu'elles tirent, elles peuvent désormais être détruites. Une planète gardée par une de vos flottes, ou une flotte <strong>armée</strong> d'un allié de votre alliance, ne peut donc plus être pillée ou envahie sans qu'une bataille ne tranche d'abord.</p>

            <h2 id="boucliers">Le duel des boucliers</h2>
            <p>Chaque salve se heurte d'abord au bouclier adverse. Sa <strong>puissance de perçage</strong> vaut&nbsp;:</p>
            <p><code>missiles ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>Le plasma excelle contre les boucliers, les missiles les percent mal — et cet avantage se vérifie désormais quelle que soit la taille du combat, dix contre dix comme cent millions contre cent millions. À chaque salve, la part de dégâts qui dépasse la puissance de perçage est absorbée par le bouclier adverse jusqu'à épuisement de sa charge&nbsp;; le reste, et tout ce qui déborde une fois le bouclier vide, touche directement la coque. Un bouclier ne peut donc jamais bloquer une salve entière&nbsp;: face à un adversaire armé, votre coque encaisse toujours quelque chose, dès le premier round.</p>
            <p>Le bouclier d'une flotte n'est plus une réserve qui repart automatiquement à 100&nbsp;% avant chaque bataille&nbsp;: c'est une <strong>charge persistante</strong> qui s'use pendant le combat et ne remonte que de 10&nbsp;% toutes les 3 heures (30 heures pour repasser de zéro à plein), même quand vous scindez, fusionnez ou dissolvez la flotte, ou que vous transférez des vaisseaux entre la flotte et le sol de la planète. Le rapport de combat affiche cette charge au début et à la fin de la bataille&nbsp;; la liste des flottes montre le pourcentage de chaque flotte, et la page de gestion de flotte indique le bouclier réellement emmené au combat, la capacité totale, le pourcentage actuel et le temps restant avant charge pleine. Le stock de vaisseaux au sol porte lui aussi une charge, qui ne se recharge pas&nbsp;: toute flotte créée ou complétée depuis ce sol en hérite, et elle est affichée dans la fenêtre de création de flotte comme dans l'onglet «&nbsp;Vaisseaux&nbsp;» de la gestion de flotte. Une exception : le bouclier forfaitaire apporté par un <strong>Vaisseau-mère</strong> ne se décharge jamais — son générateur tient en permanence, et la charge n'use que le bouclier de vos autres vaisseaux — c'est pourquoi la page de gestion affiche aussi la valeur absolue du bouclier, pas seulement le pourcentage.</p>

            <h2 id="rounds">Les rounds de tir</h2>
            <p>Le combat dure au maximum <strong>100 rounds</strong>. À chaque round, une salve inflige&nbsp;:</p>
            <p><code>(missiles + plasma ÷ 2 + lasers × 2) × multiplicateur</code></p>
            <p>Le multiplicateur vient d'un jet de précision : le jeu tire un nombre entre votre précision et 100 et le divise par 80, pour un résultat entre <strong>×0,3 et ×1,2</strong>. Une précision élevée ne rend pas vos salves plus fortes, elle élimine les mauvais tirages. La part qui franchit le bouclier adverse (voir plus haut) s'impute sur l'armure totale de ce camp.</p>

            <h2 id="fin">Fin du combat</h2>
            <ul>
                <li><strong>L'armure d'un camp tombe à 0</strong> — il est vaincu, toutes ses flottes sont détruites avec leur cargaison.</li>
                <li><strong>100 rounds atteints</strong> — le camp qui conserve le plus d'armure l'emporte ; à égalité parfaite, l'attaquant gagne.</li>
                <li><strong>Filet du vainqueur</strong> — même très amoché, le camp vainqueur ne perd jamais plus de 95&nbsp;% de son armure de départ : une victoire n'est jamais un anéantissement, quel que soit l'écart de puissance.</li>
            </ul>

            <h2 id="pertes">Vos pertes : ce que vous avez encaissé</h2>
            <p>La règle tient en une phrase : <strong>vos pertes découlent des dégâts de coque que vous avez réellement encaissés</strong> — jamais de ceux qu'a absorbés votre bouclier, qui ne coûte aucun vaisseau. Ces dégâts de coque se répartissent entre votre <strong>écran</strong> (Chasseurs, Chasseurs lourds, Chasseurs de guerre : les seuls vaisseaux sans bouclier) et votre <strong>ligne</strong> (tous les autres types), au prorata de l'armure de chaque groupe&nbsp;: chaque type perd la même fraction de lui-même. Le rapport affiche deux compteurs : dégâts de coque et dégâts de bouclier.</p>
            <p>Votre écran ne protège pas votre ligne indéfiniment&nbsp;: il détourne sur lui-même au plus la <strong>moitié</strong> des dégâts qui visaient la ligne, et seulement tant qu'il lui reste de l'armure pour les encaisser — un seul chasseur ne peut pas éponger les dégâts de toute une flotte. Sans écran du tout, la ligne encaisse l'intégralité des dégâts de coque.</p>
            <p>Conséquences directes : si l'ennemi vous touche à peine, vos pertes sont quasi nulles ; un ennemi dix fois plus dangereux vous coûte environ dix fois plus — chasseurs compris. Le camp vaincu, lui, perd tout.</p>

            <h2 id="apres">Après le combat</h2>
            <ul>
                <li><strong>Débris</strong> — 40&nbsp;% du coût de construction (niobium et eau) de chaque vaisseau détruit, des deux camps, tombe en orbite (20&nbsp;% quand un Cthulhu ou un alien est impliqué). La cargaison des flottes anéanties s'y ajoute. Un recycleur dans la flotte victorieuse ramasse immédiatement.</li>
                <li><strong>Points de Guerre</strong> — les deux camps en gagnent, proportionnellement à la puissance ennemie détruite ; le vainqueur en reçoit nettement plus, la consolation du vaincu ne dépassant jamais un cinquième de ce que le vainqueur aurait touché sur la même flotte.</li>
                <li><strong>Héros</strong> — un héros principal à bord d'une flotte détruite peut être capturé par le vainqueur (chance, jamais garanti). Un <strong>héros secondaire</strong> vaincu suit une règle différente et définitive, sans hasard : voir l'article <em>Héros secondaires</em>.</li>
                <li><strong>Rapports</strong> — chaque commandant reçoit le détail : forces, salves, dégâts encaissés, pertes, et le sort de tout héros secondaire capturé ou exécuté.</li>
            </ul>

            <h2 id="conseils">Conseils</h2>
            <ul>
                <li>Gardez toujours un <strong>écran de chasseurs</strong> : bon marché, il encaisse les dégâts de coque à la place de vos vaisseaux lourds.</li>
                <li>Investissez dans le <strong>bouclier</strong> : plus il est chargé, plus il absorbe de dégâts avant qu'ils n'atteignent votre coque — mais aucun bouclier n'arrête une salve entière, votre coque encaisse toujours une part.</li>
                <li>Montez du <strong>plasma</strong> pour percer vite les boucliers adverses, des <strong>lasers</strong> pour les dégâts de coque.</li>
                <li>Choisissez la <strong>politique d'alliance</strong> en regardant celle de vos cibles favorites : +20&nbsp;% d'armes en attaque.</li>
            </ul>

    invasion:
        title: "Invasion de planète"
        category: "combat"
        order: 2
        tags: "invasion,planete,soldats,tanks,barges,conquete,deploiement,tactique"
        summary: "Conquérir une planète ennemie : barges, débarquement, combat au sol et déploiements tactiques."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'invasion est une attaque pour <strong>prendre possession</strong> d'une planète ennemie. Votre flotte débarque des Légionnaires (via des barges) qui affrontent la garnison au sol.</p>
            <p>C'est différent d'un <strong>raid</strong> (qui pille sans prendre la planète) : une invasion réussie vous donne la planète entière.</p>

            <h2 id="conditions">Ce qu'il faut pour invader</h2>
            <ul>
                <li>Être dans une <strong>alliance</strong>.</li>
                <li>Jouer sur un serveur en <strong>mode PvP</strong> (ex. : Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Avoir des <strong>barges</strong> et des <strong>Légionnaires</strong> à bord de la flotte.</li>
                <li>La cible doit être une planète habitée (pas un marchand, pas un allié, pas quelqu'un avec qui vous êtes en paix ou en pacte).</li>
                <li>Pas déjà de combat spatial prévu au même endroit.</li>
            </ul>

            <h2 id="barges">Le rôle des barges</h2>
            <p>Les barges sont les véhicules qui débarquent vos Légionnaires au sol. Chaque barge transporte <strong>1&nbsp;000 Légionnaires</strong> (capacité augmentée par les recherches d'alliance).</p>
            <p>Si vous avez plus de Légionnaires que de places, les excédentaires <strong>restent en orbite et ne combattent pas</strong>. En cas d'échec, vos barges sont <strong>capturées par le défenseur</strong>.</p>

            <h2 id="orbital">Phase 1 — Combat en orbite (parfois)</h2>
            <p>Deux situations peuvent vous arrêter avant même le débarquement :</p>
            <ul>
                <li>La planète cible a activé son <strong>mode attaque</strong> : ses tourelles et boucliers engagent d'abord votre flotte. Si <strong>vous perdez</strong>, votre flotte est détruite — l'invasion s'arrête net. Si <strong>vous gagnez</strong>, les défenses orbitales sont anéanties et votre flotte continue (affaiblie).</li>
                <li>La planète cible est gardée par une flotte <strong>armée</strong> du propriétaire, ou une flotte <strong>armée</strong> d'un allié de son alliance, déjà en orbite (une sonde ou un cargo seuls ne comptent plus) : votre arrivée déclenche une <strong>bataille</strong> contre ce défenseur et ses tourelles réunis — même si la planète n'est pas en mode attaque. Cette bataille ne se déclenche jamais contre un partenaire de paix, de pacte, un allié ou votre propre alliance, ni sur un serveur PvE : elle respecte les mêmes règles diplomatiques qu'une invasion normale. Elle annule votre invasion en cours&nbsp;: si vous la remportez, il vous faut <strong>relancer</strong> une invasion pour débarquer réellement — et si la planète est toujours gardée à ce moment-là, cliquer sur «&nbsp;Envahir&nbsp;» depuis l'orbite est <strong>refusé</strong> de la même façon&nbsp;: engagez d'abord le mode attaque de votre propre flotte pour forcer le combat. Comme une invasion embarque toujours des Légionnaires, cette condition de bataille est automatiquement remplie côté attaquant&nbsp;: la bataille se déclenche donc que votre flotte porte ou non des armes de vaisseau.</li>
            </ul>
            <p><strong>Piège à connaître&nbsp;: une flotte d'invasion sans vaisseau de combat est anéantie dans cette bataille.</strong> Légionnaires et barges suffisent à faire décoller une invasion, mais si votre flotte ne porte aucune arme de vaisseau, elle entre dans cette bataille préliminaire avec une puissance de feu nulle&nbsp;: les défenseurs l'anéantissent entièrement, barges et Légionnaires compris, avant même le débarquement. <strong>Escortez toujours vos flottes d'invasion avec des vaisseaux de combat</strong> — voir l'article <em>Raids (pillage)</em> pour le même piège côté pillage.</p>

            <h2 id="combat">Phase 2 — Combat au sol</h2>
            <p>Le combat au sol se déroule en <strong>10 rounds maximum</strong>. À chaque round, les deux camps s'échangent des pertes.</p>
            <table>
                <tr><th>Unité</th><th>Rôle</th></tr>
                <tr><td><strong>Légionnaire</strong></td><td>Attaque et défense. Boostés par la recherche Barbelés pour la défense.</td></tr>
                <tr><td><strong>Mecha</strong></td><td>Puissante unité de défense lourde (max 500 par planète).</td></tr>
                <tr><td><strong>Travailleur</strong></td><td>Défense passive, <strong>uniquement en invasion</strong> (pas en raid).</td></tr>
            </table>
            <p><strong>L'attaquant gagne uniquement si</strong> toutes les troupes du défenseur sont éliminées <strong>et</strong> qu'il lui reste au moins 1 Légionnaire vivant. Sinon, <strong>le défenseur gagne par avantage du terrain</strong>.</p>

            <h2 id="deploiement">Les déploiements tactiques du défenseur</h2>
            <p>Le défenseur peut avoir choisi un <strong>déploiement tactique</strong> invisible pour vous. À garder en tête : il peut retourner une situation qui semblait gagnée d'avance.</p>
            <table>
                <tr><th>Déploiement</th><th>Effet</th><th>Contrepartie</th></tr>
                <tr><td><strong>Équilibré</strong></td><td>Aucun bonus ni malus.</td><td>Neutre.</td></tr>
                <tr><td><strong>Fortifié</strong></td><td>+30&nbsp;% défense au sol.</td><td>−20&nbsp;% de contre-attaque.</td></tr>
                <tr><td><strong>Guérilla</strong></td><td>Travailleurs +150&nbsp;% en défense.</td><td>Légionnaires à −50&nbsp;%.</td></tr>
                <tr><td><strong>Dernier Bastion</strong></td><td>+50&nbsp;% si les troupes passent sous 30&nbsp;%.</td><td>Conditionnel.</td></tr>
                <tr><td><strong>Terre Brûlée</strong></td><td>Aucun bonus actif.</td><td>Si vous perdez un raid, 50&nbsp;% des ressources non pillées sont détruites.</td></tr>
            </table>

            <h2 id="victoire">Si vous gagnez l'invasion</h2>
            <ul>
                <li><strong>Capture</strong> — la planète vous revient, avec ses bâtiments. Les travailleurs sont réinitialisés à un seuil de base (~2&nbsp;000).</li>
                <li><strong>Planète Cthulhu</strong> — si vous reprenez une planète capturée par les Cthulhu, elle est libérée (bâtiments remis à zéro, récompense en uranium).</li>
                <li><strong>Plus de place pour coloniser ?</strong> La planète conquise devient une base Cthulhu : vous ne la gardez pas.</li>
            </ul>
            <p>Les <strong>files de production</strong> ne suivent pas la planète capturée&nbsp;: les vaisseaux comme les défenses (tourelles ou troupes) déjà payés mais pas encore livrés sont perdus à la capture — une commande passée par le vaincu ne change jamais de main. Ce qui a été livré avant l'assaut, en revanche, est au sol et suit la planète.</p>
            <p>Si la planète capturée héberge un <strong>héros secondaire</strong> adverse, son sort se joue immédiatement : vous le <strong>capturez</strong> si vous possédez une Prison (niveau 1 ou plus), sinon il est <strong>exécuté</strong>. Un raid, lui, ne prend jamais la planète et ne met donc jamais un héros en jeu. Détails dans l'article <em>Héros secondaires</em>.</p>

            <h2 id="gameover">Élimination du défenseur</h2>
            <p>Si le défenseur perd sa <strong>dernière planète</strong>, il est éliminé du serveur. Vous récupérez tout : Bitcoins, flottes survivantes et Points de Guerre associés.</p>

            <h2 id="defaite">Si vous perdez l'invasion</h2>
            <p>Les <strong>barges sont capturées par le défenseur</strong>. Les Légionnaires débarqués sont perdus. C'est une défaite coûteuse : sondez avant d'invader.</p>

    raid:
        title: "Raids (pillage)"
        category: "combat"
        order: 3
        tags: "raid,pillage,vol,ressources,bunker,barges"
        summary: "Piller les ressources d'une planète ennemie sans chercher à la conquérir."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Qu'est-ce qu'un raid ?</h2>
            <p>Un raid est une attaque au sol dont le but est de <strong>voler des ressources</strong>. Vous ne prenez pas la planète : vous repartez avec du butin. Conséquence importante : un raid, même réussi, ne prend jamais la planète, donc <strong>aucun héros secondaire n'y est jamais capturé ni exécuté</strong>, que vous soyez attaquant ou défenseur.</p>

            <h2 id="difference">Raid vs Invasion</h2>
            <table>
                <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                <tr><td>Objectif</td><td>Voler du niobium, de l'eau, de l'uranium</td><td>Prendre possession de la planète</td></tr>
                <tr><td>Défenseurs</td><td>Légionnaires + Mechas</td><td>Légionnaires + Mechas + Travailleurs</td></tr>
                <tr><td>Imprévisibilité</td><td>Faible</td><td>Plus forte (facteur aléatoire d'attaque plus large)</td></tr>
                <tr><td>Perte des barges si défaite</td><td>Non</td><td>Oui (capturées par le défenseur)</td></tr>
            </table>

            <h2 id="combat">Comment ça se passe</h2>
            <p>Mêmes étapes que l'invasion (combat orbital éventuel, puis 10 rounds au sol), <strong>mais les travailleurs ne défendent pas</strong>. Les Légionnaires et Mechas du défenseur sont seuls.</p>
            <p><strong>Planète gardée par une flotte en orbite</strong> — si la cible est protégée par une flotte <strong>armée</strong> du propriétaire, ou une flotte <strong>armée</strong> d'un allié de son alliance (une sonde ou un cargo seuls ne suffisent plus), votre raid déclenche d'abord une bataille contre ce défenseur et les tourelles de la planète. Cette bataille ne se déclenche jamais contre un partenaire de paix, de pacte, un allié ou votre propre alliance, ni sur un serveur PvE. Le pillage n'a pas lieu dans la foulée&nbsp;: si vous remportez cette bataille, il vous faut <strong>relancer</strong> un raid pour piller réellement — et si la planète est toujours gardée, cliquer sur «&nbsp;Piller&nbsp;» depuis l'orbite est <strong>refusé</strong> lui aussi&nbsp;: engagez d'abord le mode attaque de votre propre flotte pour forcer le combat. Côté attaquant, cette bataille ne se déclenche que si votre flotte de raid est elle-même offensive — armes de vaisseaux, Légionnaires ou Mechas à bord&nbsp;: un cargo pur, sans la moindre arme ni troupe, ne déclenche rien.</p>

            <h2 id="raid-sans-armes">Un raid tout en troupes est anéanti</h2>
            <p>Emmener des Légionnaires ou des Mechas suffit à déclencher cette bataille — mais si votre flotte de raid ne porte <strong>aucune arme de vaisseau</strong>, elle y entre avec une puissance de feu nulle. Les défenseurs l'anéantissent entièrement, sans perdre le moindre vaisseau en face. <strong>Escortez toujours vos transports de troupes</strong>&nbsp;: c'est la surprise la plus coûteuse que ce système puisse vous réserver.</p>

            <h2 id="pillage">Le pillage (en cas de victoire)</h2>
            <p>Vous récupérez autant de ressources que votre flotte peut transporter. Les ressources sont prises dans cet ordre :</p>
            <ol>
                <li><strong>Niobium</strong> d'abord.</li>
                <li>Puis <strong>Eau</strong>.</li>
                <li>Enfin <strong>Uranium</strong> (si place restante).</li>
            </ol>

            <h2 id="bunker">Le bunker protège une partie</h2>
            <p>Le bunker du défenseur <strong>met à l'abri 5&nbsp;% du stockage max par niveau</strong>. Exemples :</p>
            <ul>
                <li>Bunker niveau 5 → 25&nbsp;% du stockage max protégé sur le niobium et l'eau.</li>
                <li>Bunker niveau 10 → 50&nbsp;% protégé.</li>
            </ul>
            <p>L'uranium est protégé de la même façon : <strong>5&nbsp;% de votre stock d'uranium par niveau de bunker</strong> (l'uranium n'ayant pas de stockage max, la protection s'applique au stock du moment).</p>

            <h2 id="scorched">Attention à la Terre Brûlée</h2>
            <p>Si le défenseur a choisi le <strong>déploiement tactique Terre Brûlée</strong> et qu'il perd, <strong>50&nbsp;% des ressources restantes (non pillées) sont détruites</strong>. Vous repartez avec votre butin, mais l'adversaire ne peut pas tout reprendre derrière.</p>

    nuclear:
        title: "Attaque nucléaire"
        category: "combat"
        order: 4
        tags: "nucleaire,bombe,uranium,destruction,intercepteur"
        summary: "L'arme ultime pour détruire les bâtiments clés d'un ennemi — à condition qu'il n'ait pas de défense anti-missile."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut</h2>
            <ul>
                <li>Un bâtiment <strong>Base nucléaire</strong>.</li>
                <li>De l'<strong>uranium</strong> (très rare).</li>
                <li>Une <strong>bombe nucléaire</strong> fabriquée.</li>
                <li>Une flotte qui part en <strong>mission Nucléaire</strong> vers la cible, avec la bombe embarquée.</li>
            </ul>

            <h2 id="degats">Que fait une bombe qui touche ?</h2>
            <p>La bombe <strong>détruit un bâtiment</strong>, en priorité les plus stratégiques :</p>
            <ol>
                <li><strong>Métropole</strong> — perte de 1 niveau (−80&nbsp;000 travailleurs max).</li>
                <li><strong>Cité</strong> — perte de 1 niveau (−25&nbsp;000 travailleurs max).</li>
                <li><strong>Bunker</strong> — perte de 1 niveau (protection réduite).</li>
                <li><strong>Caserne</strong> — perte de 1 niveau (−5&nbsp;000 Légionnaires max).</li>
            </ol>
            <p>La bombe cible le premier bâtiment trouvé dans cet ordre.</p>

            <h2 id="regle">Règles spéciales</h2>
            <ul>
                <li>Une flotte en mission Nucléaire <strong>ne peut pas être interceptée</strong> par une flotte en orbite. Elle file droit vers sa cible.</li>
                <li>La seule façon de l'arrêter : l'<strong>intercepteur nucléaire</strong> du défenseur.</li>
            </ul>

            <h2 id="anti">La défense : l'intercepteur nucléaire</h2>
            <p>Si la planète cible possède au moins un <strong>intercepteur nucléaire</strong>, la bombe est automatiquement neutralisée :</p>
            <ul>
                <li>La flotte porteuse est <strong>détruite</strong>.</li>
                <li><strong>1 à 3 intercepteurs</strong> sont consommés.</li>
                <li>Les deux joueurs reçoivent un rapport.</li>
            </ul>
            <p>Moralité : une base stratégique vaut toujours quelques intercepteurs. Sans eux, elle est vulnérable.</p>

    defense:
        title: "Défendre ses planètes"
        category: "combat"
        order: 5
        tags: "defense,soldats,tanks,tourelle,bouclier,bunker,orbital,tactique,deploiement,stats,puissance"
        summary: "Les 3 couches de défense : orbitale (tourelles), tactique (déploiement), terrestre (Légionnaires + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Les 3 couches de défense</h2>
            <ol>
                <li><strong>Défense orbitale</strong> — tourelles, boucliers, base spatiale. Interceptent la flotte avant qu'elle débarque.</li>
                <li><strong>Déploiement tactique</strong> — un choix stratégique qui modifie la puissance de vos troupes au sol.</li>
                <li><strong>Défense terrestre</strong> — Légionnaires, Mechas, travailleurs (pour les invasions).</li>
            </ol>

            <h2 id="mode-attaque">Activer le mode attaque de votre planète</h2>
            <p>Si votre planète possède <strong>au moins une tourelle</strong>, vous pouvez activer le <strong>mode attaque</strong>. Dans ce mode, dès qu'une flotte ennemie en mode attaque arrive en orbite, un <strong>combat orbital</strong> s'engage automatiquement.</p>
            <ul>
                <li><strong>Victoire</strong> : la flotte ennemie est détruite, et vous encaissez des <strong>points de guerre</strong> proportionnels à sa signature (bien moins face à un Cthulhu).</li>
                <li><strong>Défaite</strong> : toutes vos tourelles, boucliers, votre base spatiale et votre file de production de défenses en cours sont anéantis ; le mode attaque se <strong>désactive automatiquement</strong> (une planète sans tourelle ne peut pas le garder actif), et la flotte continue vers le combat au sol.</li>
            </ul>
            <p>Sans tourelle, vos boucliers et la base spatiale sont détruits <strong>sans même combattre</strong>.</p>
            <p>Deux endroits pour l'activer : la page <strong>Défense</strong> d'une planète, ou la page <strong>Planètes</strong>, qui affiche l'état de chaque planète (une mire à côté de ses défenses, cliquable pour basculer) et propose <strong>« Tout activer »</strong> / <strong>« Tout désactiver »</strong> sur l'empire entier. La bascule groupée saute les planètes sans tourelle ou déjà prises dans un combat, et vous dit combien ont été ignorées.</p>
            <p><strong>Attention</strong> : activer le mode attaque sur une planète qu'une flotte ennemie survole déjà déclenche le combat orbital <strong>cinq minutes plus tard</strong>. En bascule groupée, plusieurs batailles peuvent partir d'un coup — le message vous indique combien.</p>
            <p><strong>Ce que l'assaillant apporte avec lui.</strong> La flotte qui attaque vos tourelles combat désormais avec <strong>tous ses bonus</strong>&nbsp;: les bonus d'alliance de son commandant (missiles, lasers, plasma, blindage, bouclier, précision) et les bonus d'équipement de son héros embarqué. Jusqu'au 10 septembre 2026 ils ne comptaient qu'en combat spatial&nbsp;: une alliance ayant investi jusqu'à +5&nbsp;% sur chacune de ces six statistiques n'en tirait rien face à des tourelles. Cela vaut dans les deux sens — vos propres flottes gardent leurs bonus quand c'est vous qui assaillez une planète en mode attaque —, et les chiffres des rapports orbitaux sont désormais à la même échelle que ceux des rapports spatiaux.</p>

            <h2 id="defenses-et-vos-flottes">Vos défenses tirent aussi sans le mode attaque</h2>
            <p>Le mode attaque n'est pas la seule façon de faire tirer vos tourelles. Dès qu'une de vos flottes — ou une flotte <strong>armée</strong> d'un allié de votre alliance — est en orbite de la planète au moment où un combat spatial s'y déclenche, vos défenses rejoignent automatiquement ce combat, mode attaque actif ou non (une planète qui n'a rien à défendre — aucune tourelle, aucun bouclier, aucune base spatiale — n'y participe jamais). C'est alors une <strong>seule bataille</strong> : pas de second combat orbital séparé derrière. Dans cette bataille, le bonus d'armure de votre <strong>base spatiale</strong> (+20&nbsp;%) profite à la fois à vos tourelles et à vos boucliers, et l'affinité militaire de votre <strong>héros posté</strong> renforce le tir de vos propres tourelles et peut porter Intimidation ou Tacticien pour tout votre camp, exactement comme un héros de flotte. Vos tourelles y visent avec leur propre précision (70, au-dessus de ce qu'une flotte peut atteindre), et elles y prennent de <strong>vraies pertes</strong> — proportionnelles aux dégâts encaissés si votre camp l'emporte, <strong>totales</strong> (tourelles, boucliers, base spatiale, file de production de défenses en cours, mode attaque coupé) si votre camp tombe. Vous touchez la part de <strong>points de guerre</strong> de votre planète chaque fois que votre camp remporte cette bataille — même si vous n'y avez engagé aucune flotte à vous. Conséquence pour vos adversaires&nbsp;: une planète gardée par une de vos flottes <strong>armée</strong> ou une flotte armée alliée (une sonde ou un cargo seuls ne comptent plus) ne peut plus être pillée ou envahie sans bataille préalable, que l'assaillant arrive fraîchement ou clique sur «&nbsp;Piller&nbsp;»/«&nbsp;Envahir&nbsp;» depuis l'orbite — et cette bataille ne démarre jamais contre un partenaire de paix, de pacte, un allié, votre propre alliance ou sur un serveur PvE.</p>
            <p><strong>Vous n'avez engagé aucune flotte à vous&nbsp;?</strong> Vous recevez malgré tout un rapport dédié qui vous indique si vos défenses ont tenu ou ont été anéanties, pertes de tourelles détaillées à l'appui, avec votre part de points de guerre si vous l'avez emporté&nbsp;: vous n'êtes jamais laissé dans l'ignorance du sort de votre planète.</p>

            <h2 id="combat-orbital">Le combat orbital en détail</h2>
            <p>Les tourelles tirent sur la flotte ennemie au rythme des rounds. La <strong>Base spatiale</strong> donne un bonus d'armure à toutes les défenses (+20&nbsp;%). Les boucliers (50&nbsp;000 ou 600&nbsp;000 pts d'armure) absorbent les premiers tirs.</p>
            <p>Vos tourelles tirent <strong>dès le premier round</strong>, quelle que soit la flotte en face : l'écran d'un vaisseau ne repousse jamais leur salve d'ouverture. Cet écran est une réserve qui encaisse les dégâts jusqu'à épuisement. Chaque salve le traverse d'emblée à hauteur de sa <strong>puissance de perçage</strong> (plasma ×4, laser ×2, missiles ÷ 7)&nbsp;; le reste use l'écran, et ce qui le déborde touche la coque. Une défense composée uniquement de lance-missiles reste donc désavantagée face à une flotte à gros bouclier — mais elle tire, elle fait des pertes et elle laisse des débris.</p>
            <p>Même si la flotte ennemie l'emporte, son écran de chasseurs ne la protège plus indéfiniment&nbsp;: vos tourelles infligent de vraies pertes à ses vaisseaux plus lourds aussi, au prorata des dégâts qu'elle encaisse — au pire pour elle, 95&nbsp;% de son armure de départ. Se défendre coûte donc toujours quelque chose à l'attaquant, même s'il gagne.</p>

            <h2 id="deploiement">Le déploiement tactique</h2>
            <p>Chaque planète peut choisir un <strong>déploiement tactique</strong>. Il est <strong>invisible pour l'attaquant</strong> — c'est votre carte cachée.</p>
            <table>
                <tr><th>Déploiement</th><th>Effet</th><th>Contrepartie</th></tr>
                <tr><td><strong>Équilibré</strong></td><td>Aucun bonus ni malus.</td><td>Neutre.</td></tr>
                <tr><td><strong>Fortifié</strong></td><td>+30&nbsp;% défense au sol.</td><td>−20&nbsp;% de contre-attaque.</td></tr>
                <tr><td><strong>Guérilla</strong></td><td>Travailleurs +150&nbsp;% en défense.</td><td>Légionnaires à −50&nbsp;%.</td></tr>
                <tr><td><strong>Dernier Bastion</strong></td><td>+50&nbsp;% si vos troupes tombent sous 30&nbsp;%.</td><td>Aucun effet avant ce seuil.</td></tr>
                <tr><td><strong>Terre Brûlée</strong></td><td>Aucun bonus actif.</td><td>Si vous perdez un raid : 50&nbsp;% de vos ressources restantes sont détruites.</td></tr>
            </table>

            <h2 id="combat-sol">Le combat au sol</h2>
            <p>Il se joue en <strong>10 rounds maximum</strong>. Chaque round, les deux camps se font des pertes. Si personne ne l'emporte en 10 rounds, <strong>l'attaquant est repoussé</strong> (avantage du terrain).</p>

            <h2 id="troupes">Les unités terrestres</h2>
            <table>
                <tr><th>Unité</th><th>Rôle</th><th>Notes</th></tr>
                <tr><td><strong>Légionnaires</strong></td><td>Attaque et défense.</td><td>Fort bonus défensif avec la recherche Barbelés.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>Défense lourde.</td><td>Max 500 par planète. Consomment de la nourriture.</td></tr>
                <tr><td><strong>Travailleurs</strong></td><td>Défense passive.</td><td>Uniquement contre les invasions, pas les raids.</td></tr>
            </table>

            <h2 id="ressources-defense">Ressources utilisées pour produire vos défenses</h2>
            <p>Comme le Chantier spatial, la production de défenses puise d'abord dans les ressources <strong>de la planète</strong>, puis dans le <strong>cargo des flottes stationnées en orbite</strong>. Vous pouvez donc continuer à recruter même si le stock au sol est faible, tant que des flottes chargées sont présentes au-dessus de la planète.</p>

            <h2 id="installations">Installations orbitales et défenses</h2>
            <ul>
                <li><strong>Tourelles</strong> — lance-missiles, laser, laser lourd, Gauss, ionique, plasma. Variées pour contrer différents types de flottes.</li>
                <li><strong>Bouclier</strong> (50&nbsp;000 pts) et <strong>Grand bouclier</strong> (600&nbsp;000 pts) — absorbent les premiers tirs.</li>
                <li><strong>Base spatiale</strong> — +20&nbsp;% d'armure à toutes les défenses orbitales.</li>
            </ul>

            <h2 id="stats-defensives">Lire la puissance de votre planète</h2>
            <p>La page <strong>Défense</strong> comporte deux onglets. Le second, <strong>Stats défensives</strong>, récapitule ce que vaut réellement la planète : le blindage, les missiles, les lasers et les plasmas cumulés de toutes vos tourelles, l'apport de chaque structure, l'effet du bouclier, du grand bouclier et de la base spatiale sur le blindage réellement opposé à une flotte, et la puissance de votre défense au sol. C'est le moyen le plus rapide de repérer la statistique en retard avant de lancer une nouvelle série de constructions.</p>
            <p>Un détail de lecture : le camembert et les barres portent sur le blindage <strong>des structures seules</strong>. Les forfaits de bouclier apparaissent à part, dans les modificateurs, parce qu'ils écraseraient sinon toute comparaison entre vos armes.</p>

            <h2 id="bunker">Le bunker contre le pillage</h2>
            <p>Le bunker protège <strong>5&nbsp;% du stockage max par niveau</strong> contre les raids. Un bunker niveau 5 met déjà 25&nbsp;% de vos réserves à l'abri. L'uranium est protégé à hauteur de 5&nbsp;% de son stock par niveau.</p>

            <h2 id="entretien">Attention au coût d'entretien</h2>
            <p>Les unités en <strong>mission</strong> (flottes, barges parties) coûtent <strong>beaucoup plus cher</strong> que celles stationnées. Par exemple, un Mecha en garnison coûte peu, mais un Mecha embarqué coûte ~50× plus. Ne laissez pas une grosse armée en voyage permanent.</p>

    embargo:
        title: "Embargo et famine"
        category: "combat"
        order: 6
        tags: "embargo,famine,blocus,siege,planete,nourriture,ravitaillement,rations"
        summary: "Affamer une planète avant de l'envahir : le blocus, la famine qui s'installe, et comment y survivre."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Un <strong>embargo</strong> est un siège planétaire. Vous maintenez une grosse flotte en orbite d'une planète ennemie ; les échanges sont coupés, la nourriture s'épuise, la population souffre. Quand la planète est affaiblie, vous passez à l'assaut.</p>

            <h2 id="consommation">Rappel : la nourriture</h2>
            <p>Vos travailleurs, Légionnaires et Mechas consomment de la nourriture en continu. Si vos réserves tombent à <strong>0</strong>, c'est la <strong>famine</strong>.</p>

            <p>Les rations se <strong>transportent en soute</strong> : chargez-en sur une planète, déchargez-les ailleurs pour ravitailler. Tant qu'une de vos flottes est <strong>à quai</strong> (ni en vol, ni en combat) au-dessus de votre planète, ses rations complètent le grenier — et un siège les ponctionne comme le reste : la soute n'est pas un coffre-fort.</p>

            <h2 id="famine">La famine (hors embargo)</h2>
            <p>Quand la nourriture manque, les pertes s'enchaînent en <strong>3 phases</strong> :</p>
            <ul>
                <li><strong>Phase 1 (0–3h)</strong> — pertes modérées de travailleurs. Le temps de réagir.</li>
                <li><strong>Phase 2 (3–8h)</strong> — pertes accélérées. Des Légionnaires commencent à déserter.</li>
                <li><strong>Phase 3 (au-delà de 8h)</strong> — effondrement : travailleurs décimés, Légionnaires en fuite, Mechas à l'abandon.</li>
            </ul>
            <p>Un plancher de <strong>5&nbsp;000 travailleurs</strong> évite la disparition totale. Sans ravitaillement, une planète atteint ce plancher en ~27 heures.</p>

            <h2 id="declenchement">Comment déclencher un embargo</h2>
            <p>Un embargo s'active automatiquement quand :</p>
            <ul>
                <li>Au moins une <strong>flotte ennemie</strong> (hors alliés) est en orbite,</li>
                <li>en <strong>mode attaque</strong>,</li>
                <li>avec <strong>suffisamment de vaisseaux lourds</strong> (équivalent à ~250 cuirassés, 37 destroyers ou 3 vaisseaux-mères).</li>
            </ul>
            <p>Dès que la flotte ennemie part ou est détruite, le blocus se lève.</p>
            <p>Une flotte de raid ou d'invasion marquée «&nbsp;en attaque&nbsp;» par la bataille fusionnée décrite dans l'article <em>Défendre ses planètes</em> garde ce marqueur si elle survit&nbsp;: si elle reste en orbite, elle compte dans cette signature au même titre que n'importe quelle flotte hostile.</p>

            <h2 id="effets">Ce que subit la planète assiégée</h2>
            <ul>
                <li><strong>Drain de nourriture horaire</strong> supplémentaire : la population panique et consomme plus.</li>
                <li><strong>Production de nourriture</strong> réduite (fermes perturbées).</li>
                <li><strong>Production de niobium et d'eau</strong> réduite.</li>
                <li><strong>Croissance des travailleurs</strong> quasiment stoppée.</li>
                <li><strong>Marché bloqué</strong> : plus de ventes automatiques aux marchands.</li>
                <li><strong>Cargos étrangers bloqués</strong> : seuls vos cargos ou ceux de vos alliés peuvent atterrir (ravitaillement allié).</li>
            </ul>

            <h2 id="famine-embargo">Famine sous embargo : c'est pire</h2>
            <p>Si la nourriture tombe à 0 <strong>pendant</strong> un embargo, les pertes sont <strong>plus lourdes</strong> et immédiates : travailleurs, Légionnaires et Mechas déclinent tous les trois, en continu.</p>

            <h2 id="timings">Combien de temps tient-on ?</h2>
            <table>
                <tr><th>Profil de planète</th><th>Début de famine</th><th>Effondrement</th></tr>
                <tr><td>Petite (50 000 travailleurs, 100 000 nourriture)</td><td>~14 heures</td><td>~1.75 jour</td></tr>
                <tr><td>Moyenne (150 000 travailleurs, 800 000 nourriture)</td><td>~1.5 jour</td><td>~3.25 jours</td></tr>
                <tr><td>Forteresse (200 000 travailleurs, 2 000 000 nourriture)</td><td>~3 jours</td><td>~4.8 jours</td></tr>
            </table>

            <h2 id="defense">Comment résister à un embargo</h2>
            <ul>
                <li><strong>Détruire la flotte assiégeante</strong> pour lever le blocus.</li>
                <li><strong>Faire venir du ravitaillement allié</strong> — vos cargos et ceux de votre alliance passent toujours.</li>
                <li><strong>Évacuer</strong> — vos flottes <em>sortantes</em> ne sont pas bloquées, vous pouvez vider vos ressources en urgence.</li>
                <li><strong>Construire des Silos</strong> et stocker de la nourriture <em>avant</em> que ça tourne mal.</li>
                <li><strong>Demander de l'aide à votre alliance</strong> pour briser le siège à plusieurs.</li>
            </ul>

            <h2 id="rapports">Les rapports pendant un embargo</h2>
            <p>Chaque heure, vous (et l'attaquant) recevez un rapport : temps écoulé, nourriture restante, pertes subies. La page Planète affiche aussi une section <strong>Approvisionnement</strong> très utile (production, consommation, autonomie estimée).</p>

    combat_stats:
        title: "Comprendre la puissance des troupes"
        category: "combat"
        order: 7
        tags: "puissance,bonus,combat,politique,calcul,faction"
        summary: "Comment se compare la puissance de vos unités, et ce qui la booste."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Puissance au sol</h2>
            <p>En ordre de grandeur (sans bonus) :</p>
            <table>
                <tr><th>Unité</th><th>Puissance relative</th><th>Rôle</th></tr>
                <tr><td><strong>Mecha</strong></td><td>Très élevée</td><td>Pilier de défense. Cher, mais écrase une petite invasion.</td></tr>
                <tr><td><strong>Légionnaire (défense)</strong></td><td>Élevée si recherche Barbelés montée</td><td>Multiplicateur défense × niveau Barbelés.</td></tr>
                <tr><td><strong>Légionnaire (attaque)</strong></td><td>Moyenne, avec aléatoire</td><td>Variable — un raid est moins imprévisible qu'une invasion.</td></tr>
                <tr><td><strong>Travailleur (défense)</strong></td><td>Faible, mais le nombre compte</td><td>Uniquement en invasion. 200 000 travailleurs pèsent.</td></tr>
            </table>
            <p>Les <strong>barges</strong> ne combattent pas : elles transportent 1&nbsp;000 Légionnaires chacune (plus avec les recherches d'alliance).</p>

            <h2 id="bonus">Ce qui augmente votre puissance</h2>
            <ul>
                <li><strong>Recherche Barbelés</strong> — multiplicateur massif sur la défense des Légionnaires.</li>
                <li><strong>Recherche Discipline</strong> — améliore les Légionnaires au sol.</li>
                <li><strong>Recherches d'alliance</strong> — bonus d'attaque Légionnaire, défense Mechas, défense travailleurs, puissance de feu vaisseaux, armure vaisseaux, capacité barges.</li>
                <li><strong>Déploiement tactique</strong> — choix qui peut booster défense ou contre-attaque.</li>
                <li><strong>Héros Militaire</strong> — bonus direct d'attaque et de défense.</li>
                <li><strong>Items</strong> équipés sur le héros.</li>
            </ul>

            <h2 id="faction">Bonus politique (combats spatiaux)</h2>
            <p>Le bonus d'armes du combat spatial vient de la <strong>politique de votre alliance</strong>. Chaque régime bat son rival : <strong>Démocratie</strong> bat <strong>Communisme</strong>, qui bat <strong>Fascisme</strong>, qui bat <strong>Démocratie</strong>.</p>
            <p>Quand la politique de l'<strong>attaquant</strong> bat celle du défenseur, toutes ses armes (missiles, lasers, plasma) gagnent <strong>+20&nbsp;%</strong> pour ce combat. Le bonus ne s'applique qu'à l'assaillant : le défenseur compte sur ses défenses planétaires.</p>

            <h2 id="precision">Précision et jets de combat</h2>
            <p>En combat spatial, chaque camp tire <strong>une salve par round</strong>. Un jet aléatoire, tiré entre la précision du camp et 100 puis divisé par 80, module les dégâts de la salve de <strong>×0,3 à ×1,2</strong>. Une précision élevée ne rend pas vos coups plus forts : elle élimine les mauvais tirages.</p>
            <p>La visée d'une flotte ne s'affiche plus jamais en pourcentage&nbsp;: partout — Chantier spatial, page de gestion de flotte, onglet Défenses et rapports de combat — le jeu montre le <strong>multiplicateur de dégâts</strong> qu'elle produit réellement (<strong>×0,66</strong> sans le moindre investissement, <strong>×0,94</strong> à visée pleine). Ce niveau dépend des points de <strong>personnalisation</strong> investis en précision pour chaque modèle de vaisseau (40 points/jour) et lui est propre&nbsp;: dépenser vos points ailleurs, sur l'armure ou les armes du même modèle, ne le fait jamais redescendre. Quand plusieurs flottes combattent ensemble, le camp utilise la moyenne de leurs visées. Les défenses d'une planète tirent à <strong>×1,06</strong> — mieux qu'une flotte à visée pleine. Face à un adversaire dirigé par l'IA (bot), sa visée ne descend jamais sous un plancher fixe et connu&nbsp;: un bot qui a réellement investi le dépasse, et un joueur suffisamment investi peut l'égaler ou le dépasser.</p>

    reports:
        title: "Les rapports du jeu"
        category: "beginner"
        order: 9
        tags: "rapport,notification,combat,espionnage,alliance,colonisation,messages"
        summary: "Le jeu vous envoie des rapports pour tout événement important. Voici où les trouver et ce qu'ils contiennent."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Où trouver vos rapports ?</h2>
            <p>Cliquez sur <strong>Messages</strong> dans le menu de gauche. Vous y trouverez tous les rapports reçus, classés par type. Un point de couleur signale les messages non lus.</p>
            <p>Vous pouvez aussi activer les <strong>notifications push</strong> pour recevoir une alerte sur votre téléphone ou navigateur (voir l'article dédié).</p>

            <h2 id="combat">Rapports de combat</h2>
            <ul>
                <li><strong>Combat spatial</strong> — une de vos flottes a croisé une flotte ennemie.</li>
                <li><strong>Combat orbital</strong> — vos défenses planétaires ont repoussé (ou non) un attaquant.</li>
                <li><strong>Défenses planétaires</strong> — rapport dédié au propriétaire qui n'a engagé aucune flotte à lui dans une bataille fusionnée : ses défenses ont tenu ou ont été anéanties.</li>
                <li><strong>Raid</strong> — pillage subi ou infligé.</li>
                <li><strong>Invasion</strong> — tentative de prise de planète (d'un côté ou de l'autre).</li>
                <li><strong>Nucléaire</strong> — bombe envoyée ou reçue.</li>
                <li><strong>Embargo</strong> — point horaire si une de vos planètes est assiégée.</li>
            </ul>

            <h2 id="cthulhu">Rapports Cthulhu</h2>
            <ul>
                <li><strong>Attaque Cthulhu</strong> — horde Cthulhu contre votre planète.</li>
                <li><strong>Tower Defense</strong> — victoire ou défaite de votre défense active.</li>
                <li><strong>Libération de planète</strong> — reprise d'une planète aux Cthulhu.</li>
            </ul>

            <h2 id="flotte">Rapports de flotte</h2>
            <ul>
                <li><strong>Arrivée de flotte</strong> — votre flotte a atteint sa destination.</li>
                <li><strong>Dépôt de ressources</strong> — un allié vous a envoyé quelque chose.</li>
                <li><strong>Recyclage terminé</strong> — vos recycleurs ont fini leur travail.</li>
                <li><strong>Espionnage</strong> — résultat d'une sonde envoyée (ou sonde détectée chez vous).</li>
            </ul>

            <h2 id="alliance">Rapports d'alliance</h2>
            <ul>
                <li><strong>Diplomatie</strong> — déclaration de guerre, proposition de pacte, paix acceptée, rupture d'un pacte de non-agression ou d'une alliance défensive, expiration d'un accord de paix.</li>
                <li><strong>Membres</strong> — arrivée, départ, exclusion, Game Over d'un camarade.</li>
            </ul>

            <h2 id="divers">Autres rapports</h2>
            <ul>
                <li><strong>Rapport journalier</strong> — votre bilan économique quotidien (18h59 UTC).</li>
                <li><strong>Colonisation</strong> — nouvelle planète fondée.</li>
                <li><strong>Vente marchand</strong> — vos ressources ont été achetées.</li>
                <li><strong>Bonus de connexion</strong> — Bitcoins du jour reçus.</li>
                <li><strong>Prison</strong> — héros capturé ou libéré.</li>
            </ul>
            <h2 id="compte-valide">Compte à valider</h2>
            <p>⚠️ Pour <strong>envoyer un message ou des Bitcoins</strong> à un autre joueur, votre compte doit être <strong>validé</strong> (identifiant créé) et votre <strong>email confirmé</strong>. Les comptes test/anonymes en sont empêchés — confirmez votre email depuis <strong>Mes options</strong>.</p>

    battle_reports:
        title: "Lire un rapport de combat"
        category: "combat"
        order: 8
        tags: "rapport,combat,victoire,defaite,analyse"
        summary: "Après chaque combat, un rapport détaillé. Voici comment le décoder pour mieux frapper la prochaine fois."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Où les trouver</h2>
            <p>Tous les rapports de combat arrivent dans votre page <strong>Messages</strong>. Ils sont classés par type (spatial, raid, invasion, orbital, embargo, nucléaire).</p>

            <h2 id="types">Types de rapports de combat</h2>
            <ul>
                <li><strong>Combat spatial</strong> — deux flottes se sont croisées.</li>
                <li><strong>Combat orbital</strong> — vos défenses planétaires ont intercepté une flotte.</li>
                <li><strong>Défenses planétaires</strong> — bataille fusionnée où vous n'avez engagé aucune flotte à vous : vos tourelles, boucliers et base spatiale ont tenu, ou ont été détruits.</li>
                <li><strong>Raid</strong> — tentative de pillage (de votre côté ou contre vous).</li>
                <li><strong>Invasion</strong> — tentative de prise de planète.</li>
                <li><strong>Nucléaire</strong> — bombe envoyée ou reçue.</li>
                <li><strong>Embargo</strong> — rapport horaire pendant un siège.</li>
            </ul>

            <h2 id="contenu">Ce que contient un rapport</h2>
            <ul>
                <li><strong>Forces engagées</strong> — armure de départ, bouclier, armes de chaque camp, et la composition de chaque flotte. La visée n'y figure plus en pourcentage, mais sous la forme du <strong>multiplicateur de dégâts</strong> qu'elle produit réellement (×0,66 sans aucun investissement, ×0,94 à visée pleine, ×1,06 pour les défenses d'une planète) : aucun tir ne rate jamais, une meilleure visée relève le plancher de vos dégâts.</li>
                <li><strong>Salves</strong> — le nombre de salves tirées par ce camp, celles passées sur le bouclier adverse, et si son propre bouclier a été percé ou a tenu.</li>
                <li><strong>Charge de bouclier</strong> — pour un bloc flotte, le pourcentage de charge au début et à la fin du combat, avec sa capacité totale : votre bouclier ne repart pas systématiquement à 100&nbsp;% d'un combat à l'autre, il se recharge progressivement (voir l'article <em>Combat spatial</em>).</li>
                <li><strong>Armure restante</strong> — ce qui reste debout, et sa part de l'armure de départ. Un camp anéanti affiche à la place le <strong>surplus de dégâts</strong> encaissé au-delà de son armure : c'est votre marge de victoire.</li>
                <li><strong>Dégâts encaissés</strong> — deux compteurs par camp : <strong>coque</strong> (ce qui a traversé le bouclier) et <strong>bouclier</strong> (ce que le mur a bloqué). Vos pertes en découlent directement.</li>
                <li><strong>Pertes</strong> — vaisseau par vaisseau, de chaque côté.</li>
                <li><strong>Défenses planétaires détaillées</strong> — pertes de tourelles, plus votre Bouclier, Grand bouclier et Base spatiale quand vous les possédez ; le score de défense et le tag «&nbsp;Attaque&nbsp;» affichés pour une bataille fusionnée sont désormais les vrais.</li>
                <li><strong>Ressources pillées</strong> (pour les raids) et <strong>débris générés</strong> — à recycler !</li>
                <li><strong>Points de Guerre gagnés</strong> et résultat final.</li>
            </ul>

            <h2 id="analyser">Comment en tirer une leçon</h2>
            <ul>
                <li>Regardez d'abord les <strong>dégâts encaissés</strong> : la ligne « coque » compte l'exposition de vos vaisseaux sans bouclier <em>et</em> ce qui a traversé un bouclier percé ; la ligne « bouclier », ce que le mur a absorbé (vos porteurs de bouclier s'usent en proportion).</li>
                <li>Comparez les deux <strong>multiplicateurs de dégâts</strong> : c'est le seul chiffre directement comparable d'un camp à l'autre, et c'est désormais le seul que le jeu affiche — les pourcentages de précision ont disparu de tous les écrans. Puis regardez l'<strong>armure restante</strong> — gagner en gardant 5&nbsp;% de votre armure et gagner en en gardant 70&nbsp;% se lisaient pareil auparavant. Un gros surplus chez l'adversaire signifie que vous avez surpayé la victoire.</li>
                <li>Des pertes dans vos <strong>chasseurs</strong> sont normales même quand le mur tient : sans bouclier, ils encaissent leur part du feu de plein fouet — mais petits, ils n'en attirent qu'une faible part.</li>
                <li>Beaucoup de <strong>salves passées sur le bouclier adverse</strong> ? Montez du plasma (×4 contre les boucliers) pour percer plus vite.</li>
                <li><strong>100 rounds atteints</strong> : le camp qui garde le plus d'armure l'emporte — si ça vous arrive en attaque, votre flotte manque de puissance ou de précision.</li>
                <li><strong>Archivez vos rapports importants</strong> : ils servent de preuves dans les débats d'alliance.</li>
            </ul>

    combat_simulator:
        title: "Simulateur de combat"
        category: "combat"
        order: 9
        tags: "simulateur,combat,simulation,flotte,pertes,estimation,rapport"
        summary: "Estimez vos risques avant d'attaquer : rejouez mille fois un combat contre une flotte observée dans un rapport, avec le vrai moteur du jeu."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="principe">À quoi ça sert</h2>
            <p>L'onglet <strong>Simulateur de combat</strong> de la page Flottes estime ce que vous risquez avant d'attaquer. Il rejoue <strong>1&nbsp;000 fois</strong> un combat entre l'une de vos flottes et une flotte adverse, avec le <strong>vrai moteur du jeu</strong> — mêmes formules, mêmes jets aléatoires. Rien n'est réellement engagé : aucun vaisseau ne bouge, aucun ne meurt.</p>

            <h2 id="source">La source : un rapport de combat</h2>
            <p>La flotte adverse vient d'un de vos <strong>rapports de combat récents</strong> (ceux qui affichent la ligne «&nbsp;Dégâts encaissés&nbsp;») : ce sont les seules sources honnêtes, car elles contiennent la puissance réelle du camp observé, bonus compris. Un rapport d'espionnage ne donne que des nombres de vaisseaux, sans leurs statistiques réelles — la simulation serait mensongère, c'est pourquoi il n'est pas proposé.</p>
            <p>Choisissez le rapport, le camp à affronter (l'une des deux armadas du rapport), puis l'une de vos flottes armées. Vous simulez toujours en position d'<strong>attaquant</strong>, avec vos bonus réels (héros, alliance, politique).</p>

            <h2 id="resultat">Lire le résultat</h2>
            <ul>
                <li><strong>Taux de victoire</strong> — la part des 1&nbsp;000 tirages où vous l'emportez.</li>
                <li><strong>Fourchette de pertes par vaisseau</strong> (minimum, médiane, maximum) — sur les tirages victorieux uniquement : en cas de défaite, votre flotte serait intégralement détruite.</li>
                <li><strong>Un exemple de déroulé</strong> — un tirage médian, présenté comme un rapport et clairement marqué «&nbsp;SIMULATION&nbsp;».</li>
            </ul>

            <h2 id="limites">Les limites à garder en tête</h2>
            <ul>
                <li>La flotte adverse est celle <strong>observée à la date du rapport</strong> : elle a pu être reconstruite, améliorée ou renforcée depuis.</li>
                <li>Les atouts de circonstance de l'adversaire (héros, défenses planétaires s'il combat chez lui) ne sont connus qu'au moment du vrai combat.</li>
                <li>Limite de <strong>20 simulations par jour</strong> : le simulateur éclaire une décision, il ne remplace pas le risque du combat.</li>
            </ul>

    colonization:
        title: "Coloniser une nouvelle planète"
        category: "planet"
        order: 1
        tags: "colonisation,planete,colonisateur,expansion"
        summary: "Étendre votre empire en fondant de nouvelles planètes sur des emplacements vides."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Pourquoi coloniser ?</h2>
            <ul>
                <li><strong>Plus de production</strong> — chaque planète a sa propre économie.</li>
                <li><strong>Plus de files de construction</strong> parallèles.</li>
                <li><strong>Moins de risque</strong> — vos œufs ne sont plus dans le même panier.</li>
                <li><strong>Positions stratégiques</strong> — proximité de marchands, d'alliés, de cibles.</li>
            </ul>

            <h2 id="etapes">Comment coloniser</h2>
            <ol>
                <li>Débloquez la recherche <strong>Expansion</strong> (pour avoir le droit à plus de planètes).</li>
                <li>Fabriquez un <strong>colonisateur</strong> dans votre Chantier spatial.</li>
                <li>Chargez-le avec quelques ressources de départ (recommandé : niobium et eau).</li>
                <li>Envoyez-le en mission <strong>Colonisation</strong> vers un <strong>emplacement vide</strong> sur la carte.</li>
            </ol>
            <p>À l'arrivée, la nouvelle planète est fondée. Elle apparaît dans votre panneau de droite.</p>

            <h2 id="initial">Ce qu'elle a au démarrage</h2>
            <p>Une planète fraîchement colonisée débute avec une base modeste (quelques centaines de niobium et d'eau, environ 2&nbsp;500 travailleurs, 20 Légionnaires). Tout le reste est à construire.</p>

            <h2 id="limite">Combien de planètes max ?</h2>
            <p>La limite dépend :</p>
            <ul>
                <li>Du niveau de la recherche <strong>Expansion</strong>.</li>
                <li>De votre <strong>alliance</strong> (certaines recherches d'alliance débloquent des planètes supplémentaires).</li>
                <li>De vos <strong>invasions</strong> réussies (certaines recherches d'alliance offensives donnent aussi des planètes).</li>
            </ul>

            <h2 id="choix">Où coloniser ?</h2>
            <ul>
                <li>Près d'un <strong>marchand</strong> : économie facile en envoi de cargos.</li>
                <li>Près de vos <strong>alliés</strong> : défense mutuelle.</li>
                <li>Sur un <strong>emplacement "riche"</strong> (plus grand, terraformable) : meilleure production.</li>
                <li>Évitez de vous isoler trop loin de tout : flottes plus lentes, ravitaillement compliqué.</li>
            </ul>

    planet_types:
        title: "Tout ce qu'on trouve sur la carte"
        category: "planet"
        order: 2
        tags: "planete,lune,soleil,marchand,alien,debris,cthulhu"
        summary: "Les différents objets visibles sur la carte galactique et ce qu'on peut en faire."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Les 7 types d'objets</h2>
            <table>
                <tr><th>Type</th><th>Description</th><th>Actions possibles</th></tr>
                <tr><td><strong>Planète</strong> (habitée)</td><td>Appartient à un joueur. On peut y construire, la coloniser (si vide)…</td><td>Sonder, raider, envahir, bombarder.</td></tr>
                <tr><td><strong>Lune</strong></td><td>Créée par un Moon Maker. Production de nourriture ultra-rapide (cycle de 1 min).</td><td>Sonder, raider, envahir.</td></tr>
                <tr><td><strong>Soleil</strong></td><td>Objet stellaire non-colonisable.</td><td>Aucune.</td></tr>
                <tr><td><strong>Emplacement vide</strong></td><td>Position libre sans objet. Idéal pour coloniser ou créer une lune.</td><td>Coloniser, poser une lune, ravitailler un allié.</td></tr>
                <tr><td><strong>Marchand</strong></td><td>PNJ immunisé qui achète vos ressources contre des Bitcoins.</td><td>Vendre (mission Déchargement).</td></tr>
                <tr><td><strong>Planète Alien / Cthulhu</strong></td><td>Base de la ruche, défendue par une garnison permanente.</td><td>Envahir pour libérer (uranium + recul de la Menace de l'univers).</td></tr>
                <tr><td><strong>Champ de débris</strong></td><td>Reste d'un combat (niobium, eau) ou apparition spontanée (uranium).</td><td>Recycler.</td></tr>
            </table>

            <h2 id="reperer">Les repérer sur la carte</h2>
            <p>Chaque type a son icône. Survolez avec la souris pour voir le nom du propriétaire (si habitée), la taille estimée et vos options possibles.</p>

            <h2 id="lunes">Cas particulier : les lunes</h2>
            <p>Les lunes se créent avec un vaisseau spécial <strong>Moon Maker</strong>, sur un emplacement vide portant au moins 2M de niobium et 2M d'eau en débris. Une fois posée, la lune produit de la <strong>nourriture 10× plus vite</strong> qu'une planète (cycle d'1 minute au lieu de 10). C'est une mine à nourriture précieuse pour soutenir une grosse armée.</p>

    planet_management:
        title: "Gérer une planète"
        category: "planet"
        order: 3
        tags: "gestion,planete,production,capacite,specialisation"
        summary: "Comment optimiser la production, organiser votre espace, et éventuellement spécialiser une planète."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Les bases à maîtriser</h2>
            <ul>
                <li><strong>Niveaux de production</strong> — montez régulièrement Mine / Extracteur / Ferme.</li>
                <li><strong>Stockage</strong> — sans stocks suffisants, la production sature et s'arrête.</li>
                <li><strong>Population</strong> — Cités et Métropoles augmentent votre cap de travailleurs.</li>
                <li><strong>Défense minimale</strong> — un petit bunker, quelques Mechas, c'est la base.</li>
            </ul>

            <h2 id="optimiser">Optimiser une planète</h2>
            <ol>
                <li>Construisez des bâtiments de production <strong>par paire</strong> (Mine + Extracteur montent souvent ensemble).</li>
                <li>Recherchez <strong>Terraformation</strong> pour agrandir la planète et pouvoir construire plus.</li>
                <li>Gardez un œil sur <strong>l'autonomie alimentaire</strong> : Ferme/Ferme aéroponique suffisantes pour votre pop.</li>
                <li>Posez une <strong>lune</strong> à proximité pour renforcer la production de nourriture.</li>
            </ol>

            <h2 id="specialiser">Spécialiser ses planètes</h2>
            <p>Plusieurs planètes = possibilité de les spécialiser selon leur position et leurs bâtiments :</p>
            <ul>
                <li><strong>Planète économique</strong> — beaucoup de mines, de travailleurs, vente aux marchands proches.</li>
                <li><strong>Planète militaire</strong> — chantier spatial, usines lourdes, grosses défenses, pour y stationner votre flotte.</li>
                <li><strong>Planète de recherche</strong> — Centre de recherche monté haut, beaucoup de scientifiques.</li>
                <li><strong>Avant-poste frontalier</strong> — radar/jammer, sondes, tourelles. Sert à surveiller ou contenir un voisin.</li>
            </ul>

            <h2 id="capitale">La planète capitale</h2>
            <p>Votre <strong>première planète</strong> joue un rôle particulier : si votre héros est détruit en combat, il est automatiquement réaffecté à cette planète. Gardez-la toujours bien défendue.</p>

    planet_abandon:
        title: "Abandonner une planète"
        category: "planet"
        order: 4
        tags: "abandon,planete,suppression,game over"
        summary: "Quand c'est une bonne idée, comment faire, et pourquoi il faut s'abstenir dans certains cas."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Pourquoi abandonner une planète ?</h2>
            <ul>
                <li>Elle est <strong>trop exposée</strong> aux attaques et vous consomme plus qu'elle ne rapporte.</li>
                <li>Elle est <strong>mal placée</strong> (loin de tout, difficile à défendre).</li>
                <li>Vous voulez <strong>en coloniser une meilleure</strong>, mais vous êtes au plafond de planètes.</li>
            </ul>

            <h2 id="comment">Comment faire</h2>
            <p>L'abandon se fait depuis la page <strong>Planète</strong> → section Gestion. Une confirmation est demandée (c'est irréversible).</p>
            <p>Avant de la lâcher : <strong>évacuez toutes les ressources, les Légionnaires, les vaisseaux</strong> vers une autre planète. Une fois abandonnée, tout ce qui reste est perdu.</p>

            <h2 id="danger">Le piège à éviter absolument</h2>
            <p>Abandonner votre <strong>dernière planète</strong>, c'est le <strong>Game Over</strong> :</p>
            <ul>
                <li>Vos flottes sont <strong>transférées aux aliens</strong>.</li>
                <li>Votre commandeur est éliminé du serveur.</li>
                <li>La partie est terminée.</li>
            </ul>
            <p>Ne jamais abandonner sans s'assurer que vous en avez au moins une autre encore active.</p>

    galaxy_navigation:
        title: "Naviguer dans la galaxie"
        category: "planet"
        order: 5
        tags: "galaxie,secteur,navigation,carte,univers,coordonnees"
        summary: "Comment est organisé l'univers, comment lire une coordonnée, et comment utiliser la carte."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Comment l'univers est organisé</h2>
            <p>L'univers est une hiérarchie :</p>
            <ul>
                <li>L'<strong>Univers</strong> contient plusieurs <strong>Galaxies</strong>.</li>
                <li>Chaque <strong>Galaxie</strong> contient des <strong>Secteurs</strong> (grille 10×10).</li>
                <li>Chaque <strong>Secteur</strong> contient 25 <strong>Positions</strong> (grille 5×5).</li>
            </ul>
            <p>Chaque position peut contenir une planète, un marchand, un champ de débris, une lune, un soleil, ou être vide.</p>

            <h2 id="coordonnees">Lire une coordonnée</h2>
            <p>Format : <strong>Galaxie:Secteur:Position</strong>, par exemple <code>1:5:12</code> :</p>
            <ul>
                <li><strong>1</strong> — première galaxie ;</li>
                <li><strong>5</strong> — cinquième secteur de cette galaxie ;</li>
                <li><strong>12</strong> — douzième position dans ce secteur.</li>
            </ul>

            <h2 id="carte">Utiliser la carte</h2>
            <p>La page <strong>Carte</strong> (menu de gauche) vous montre la vue spatiale. Vous pouvez :</p>
            <ul>
                <li>Vous déplacer entre galaxies et secteurs.</li>
                <li>Cliquer sur une position pour voir ce qu'il y a.</li>
                <li><strong>Envoyer directement une flotte</strong> en cliquant sur "Attaquer / Envoyer" depuis la case.</li>
                <li>Voir les positions des alliés, des ennemis et des marchands (selon vos relations et votre radar).</li>
            </ul>
            <p>Les <strong>flottes en transit</strong> apparaissent comme de petits vaisseaux animés qui glissent en temps réel entre la planète d'origine et la destination. Le <strong>halo coloré</strong> indique le camp : <strong>bleu</strong> = vous, <strong>vert</strong> = alliance, <strong>gris</strong> = pacte/paix, <strong>magenta</strong> = marchand, <strong>violet</strong> = alien, <strong>rouge</strong> = ennemi. La <strong>taille</strong> reflète la signature de la flotte. Vos flottes et celles de votre alliance sont toujours visibles ; les autres apparaissent uniquement si votre <strong>radar</strong> couvre le secteur. Pour un vol longue distance traversant plusieurs secteurs, le marker n'apparaît que durant la dernière fraction du trajet — l'entrée dans le secteur de destination — pas pendant tout le voyage.</p>

            <h2 id="hyperespace">Voyages inter-galaxies</h2>
            <p>Pour aller d'une galaxie à une autre, il vous faut la recherche <strong>Hyperespace</strong>. Les trajets inter-galaxies sont longs et coûteux en carburant — planifiez.</p>

    radar_jammer:
        title: "Radar et brouillage"
        category: "planet"
        order: 6
        tags: "radar,brouilleur,jammer,detection,surveillance"
        summary: "Voir l'ennemi venir avant qu'il arrive, et cacher vos propres mouvements."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs Brouilleur (Jammer)</h2>
            <ul>
                <li><strong>Radar</strong> — voit les flottes qui s'approchent. Vous donne le temps de réagir.</li>
                <li><strong>Brouilleur (Jammer)</strong> — cache vos propres mouvements aux radars ennemis.</li>
            </ul>

            <h2 id="detection">Les radars disponibles</h2>
            <table>
                <tr><th>Type</th><th>Où</th><th>Rôle</th></tr>
                <tr><td><strong>Radar</strong> (bâtiment)</td><td>Sur la planète (sol)</td><td>Détection locale. Alerte sur les flottes qui approchent votre planète.</td></tr>
                <tr><td><strong>Sky Radar</strong> (bâtiment)</td><td>En ciel (île orbitale)</td><td>Détection étendue. Plus de portée, meilleure précision.</td></tr>
                <tr><td><strong>Radar</strong> (vaisseau)</td><td>En flotte</td><td>Détection mobile. Utile pour explorer ou surveiller une zone loin de chez vous.</td></tr>
            </table>

            <h2 id="brouillage">Les brouilleurs disponibles</h2>
            <table>
                <tr><th>Type</th><th>Où</th><th>Rôle</th></tr>
                <tr><td><strong>Sky Jammer</strong> (bâtiment)</td><td>En ciel (île orbitale)</td><td>Brouille les radars ennemis autour de votre planète.</td></tr>
                <tr><td><strong>Jammer</strong> (vaisseau)</td><td>En flotte</td><td>Brouille les radars autour de votre flotte en vol.</td></tr>
            </table>

            <h2 id="vaisseaux-au-sol">Voir les vaisseaux au sol</h2>
            <p>La <strong>signature au sol</strong> — les vaisseaux stationnés sur une planète — suit une règle un peu plus souple : une de vos flottes <strong>en orbite</strong> les compte à vue, même sans radar. Mais uniquement pour cette planète-là.</p>
            <p>Le <strong>radar</strong> reste ce qui vous donne cette lecture <strong>à distance</strong>, sur tout le secteur. Et un <strong>Sky Jammer</strong> sur la planète referme l'observation : sans radar supérieur au brouilleur, la signature au sol redevient invisible, même avec une flotte au-dessus.</p>

            <h2 id="strategie">Comment les utiliser</h2>
            <ul>
                <li><strong>Radar</strong> sur chaque planète : au minimum le bâtiment de base, pour ne pas vous faire surprendre.</li>
                <li><strong>Jammer</strong> en flotte : essentiel pour une attaque surprise à longue distance.</li>
                <li><strong>Déployer</strong> un satellite radar (mission dédiée) sur un emplacement stratégique pour surveiller un voisin.</li>
                <li>La recherche <strong>Onde</strong> améliore la portée et la précision de tous les radars.</li>
            </ul>

    moon:
        title: "Les lunes"
        category: "planet"
        order: 7
        tags: "lune,moonmaker,nourriture,production"
        summary: "Une lune produit de la nourriture 10× plus vite qu'une planète. Comment en créer une."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Une lune, c'est quoi ?</h2>
            <p>Une <strong>lune</strong> est un objet spécial, plus petit qu'une planète, <strong>dédié uniquement à la production de nourriture</strong>. Son cycle tourne en <strong>1 minute</strong> au lieu de 10 : elle produit donc 10× plus vite qu'une planète de même taille.</p>
            <p>Une lune est un excellent complément pour soutenir une armée qui consomme beaucoup (beaucoup de Légionnaires, Mechas, vaisseaux en mission).</p>

            <h2 id="creation">Comment créer une lune</h2>
            <p>Une lune naît d'un <strong>champ de débris</strong> : il faut un <strong>emplacement vide</strong> portant au moins <strong>2M de niobium ET 2M d'eau</strong> en débris (laissés par une bataille spatiale à cet endroit). La mission Lune n'est proposée sur la carte que si l'emplacement remplit cette condition.</p>
            <ol>
                <li>Fabriquez un <strong>Moon Maker</strong> (vaisseau spécial, coûteux).</li>
                <li>Envoyez-le en mission <strong>Lune</strong> vers un emplacement vide assez riche en débris.</li>
                <li>À l'arrivée, la lune est créée et <strong>consomme tous les débris</strong>. Si les conditions ne sont plus réunies (débris recyclés pendant le vol, position colonisée…), un rapport vous explique l'échec.</li>
            </ol>

            <h2 id="taille">Taille de la lune</h2>
            <p>Plus le champ de débris est riche, plus la lune est grande. Le palier est fixé par la <strong>plus faible</strong> des deux ressources :</p>
            <table>
                <tr><th>Débris (min. niobium/eau)</th><th>Terrain</th></tr>
                <tr><td>2M – 8M</td><td>100 – 150</td></tr>
                <tr><td>8M – 15M</td><td>150 – 190</td></tr>
                <tr><td>15M – 25M</td><td>190 – 230</td></tr>
                <tr><td>25M – 50M</td><td>230 – 280</td></tr>
                <tr><td>50M et plus</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limitations">Limites</h2>
            <ul>
                <li>Une lune <strong>ne produit que de la nourriture</strong> (pas de niobium ni d'eau).</li>
                <li>Elle peut être <strong>attaquée, raidée, envahie</strong> comme une planète normale.</li>
                <li>Construire une lune près de chez vous est plus sûr (moins exposée aux voisins hostiles).</li>
            </ul>

            <h2 id="strategie">Quand en poser une</h2>
            <ul>
                <li>Vous avez du mal à nourrir votre armée → une lune proche règle le problème.</li>
                <li>Une grande bataille a laissé un <strong>champ de débris riche</strong> près de chez vous : plutôt que de tout recycler, transformez-le en lune.</li>
                <li>Vous êtes bien établi, avez des ressources à dépenser et cherchez à consolider votre économie.</li>
            </ul>

    alliance_basics:
        title: "Créer et rejoindre une alliance"
        category: "alliance"
        order: 1
        tags: "alliance,creation,rejoindre,bonus,regime,politique"
        summary: "Rejoignez des joueurs, gagnez des bonus, et choisissez votre régime politique."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Pourquoi rejoindre une alliance ?</h2>
            <ul>
                <li><strong>+20&nbsp;% de production</strong> immédiat sur toutes les ressources.</li>
                <li>Accès à <strong>20 recherches d'alliance</strong> (bonus économique, militaire, défensif).</li>
                <li>Une <strong>trésorerie partagée</strong> en Bitcoins.</li>
                <li>La <strong>diplomatie</strong> (guerres, paix, pactes) et un <strong>salon de chat</strong>.</li>
                <li>Pouvoir <strong>invader</strong> d'autres planètes (réservé aux membres d'alliance en mode PvP).</li>
            </ul>
            <p>En clair : jouer solo, c'est viable au début. Mais dès que le jeu devient sérieux, une alliance multiplie vos chances de progresser.</p>

            <h2 id="rejoindre">Comment rejoindre</h2>
            <ol>
                <li>Page <strong>Alliance</strong> (menu de gauche).</li>
                <li>Parcourez la liste des alliances ouvertes, ou cherchez par nom.</li>
                <li>Faites une demande d'adhésion. Le dirigeant (ou un officier) la valide.</li>
            </ol>
            <p>Vous pouvez aussi <strong>créer votre propre alliance</strong> depuis la même page, en choisissant un nom, un tag et un régime politique.</p>

            <h2 id="invitations">Recevoir des invitations</h2>
            <p>Un dirigeant (ou un officier ayant la permission de recrutement) peut aussi vous <strong>inviter</strong> directement. Vous pouvez recevoir <strong>une invitation de chaque alliance en même temps</strong> — être sollicité par l'une ne vous rend pas invisible pour les autres — mais une même alliance ne peut pas vous inviter deux fois tant que vous n'avez pas répondu. Les alliances qui vous repèrent voient que vous êtes <strong>déjà sollicité</strong>, sans savoir par qui. Dès que vous <strong>acceptez</strong> une invitation, toutes les autres sont automatiquement retirées ; et si une alliance est <strong>dissoute</strong>, son invitation disparaît de votre liste.</p>

            <h2 id="delai">Délai après avoir quitté une alliance</h2>
            <p>Après avoir <strong>quitté</strong> une alliance, <strong>été exclu</strong> (kick) ou après la <strong>dissolution</strong> de votre alliance, un <strong>délai de 2&nbsp;jours</strong> s'applique : impossible de <strong>créer</strong> ou de <strong>rejoindre</strong> une nouvelle alliance tant qu'il n'est pas écoulé. Ce délai empêche les allers-retours abusifs entre alliances.</p>

            <h2 id="regimes">Les 3 régimes politiques</h2>
            <p>Au moment de <strong>créer</strong> une alliance, vous choisissez un <strong>régime politique</strong>. Ce choix détermine les bonus accessibles, les recherches possibles et certaines règles internes. Il est <strong>définitif</strong>.</p>

            <h3 id="democratie">La Balance des Mondes (La Balance des Mondes)</h3>
            <p><strong>Avantages :</strong></p>
            <ul>
                <li>Vote pour désigner le Président.</li>
                <li><strong>+20%</strong> d'attaque contre les alliances offensives.</li>
                <li>Les joueurs peuvent quitter l'alliance librement.</li>
                <li>7 recherches économiques :
                    <ul>
                        <li>+35% production de ressources</li>
                        <li>+50% vitesse des recherches</li>
                        <li>-100% coût d'entretien des scientifiques</li>
                        <li>+100% taille des cargos</li>
                        <li>+50% armure des vaisseaux</li>
                        <li>+25% gain lors de vente aux marchands</li>
                        <li>+5 planètes colonisables</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvénients :</strong></p>
            <ul>
                <li>Tous les membres de l'alliance sont connus publiquement.</li>
                <li>La position de la première planète est affichée.</li>
            </ul>

            <h3 id="communisme">Le Rempart Silencieux (L'Alliance Offensive)</h3>
            <p><strong>Avantages :</strong></p>
            <ul>
                <li>Un membre d'alliance supplémentaire.</li>
                <li><strong>+20%</strong> d'attaque contre les alliances défensives.</li>
                <li>7 recherches offensives :
                    <ul>
                        <li>+100% vitesse de recyclage</li>
                        <li>+100% défense des travailleurs</li>
                        <li>+50% puissance des vaisseaux</li>
                        <li>-50% coût d'entretien des Légionnaires</li>
                        <li>-1 Bitcoin par niveau sur le recrutement des Légionnaires (8 → 3)</li>
                        <li>+5 planètes via les invasions</li>
                        <li>+50% gain de Points de Guerre</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvénients :</strong></p>
            <ul>
                <li>Taxe fixée automatiquement à 50%.</li>
                <li>Tous les membres ont le statut de dirigeant.</li>
                <li>Impossibilité de quitter l'alliance.</li>
            </ul>

            <h3 id="fascisme">Le Marteau des Étoiles (L'Alliance Défensive)</h3>
            <p><strong>Avantages :</strong></p>
            <ul>
                <li>Diminution de la menace Cthulhu.</li>
                <li><strong>+20%</strong> d'attaque contre les alliances La Balance des Mondes.</li>
                <li>Seul le Dirigeant est affiché publiquement.</li>
                <li>7 recherches défensives :
                    <ul>
                        <li>+100% production de travailleurs</li>
                        <li>+50% puissance des vaisseaux</li>
                        <li>+75% capacité des barges d'invasion</li>
                        <li>+50% force des Légionnaires</li>
                        <li>-100% coût d'entretien des Mechas</li>
                        <li>+50 défense des Mechas</li>
                        <li>+5 planètes via les invasions</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Inconvénients :</strong></p>
            <ul>
                <li>Si le dirigeant est mis Game Over, l'alliance est dissoute.</li>
                <li>Impossibilité de quitter l'alliance.</li>
                <li>Impossibilité de supprimer l'alliance.</li>
                <li>Un membre d'alliance en moins.</li>
                <li>Le Dirigeant est le seul chef de l'alliance.</li>
            </ul>
            <h2 id="compte-valide">Compte à valider</h2>
            <p>⚠️ Pour <strong>créer ou rejoindre</strong> une alliance, votre compte doit être <strong>validé</strong> et votre <strong>email confirmé</strong>. Les comptes test/anonymes ne peuvent pas rejoindre d'alliance — confirmez votre email depuis <strong>Mes options</strong>.</p>
            <h2 id="discord">Votre alliance sur Discord</h2>
            <p>Liez votre compte Discord dans <strong>Mes options</strong> et cochez <strong>Afficher mes alliances sur Discord</strong> : le jeu vous donne sur le <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord d'Area Universe</a> le rôle de chacune de vos alliances, et le retire quand vous la quittez ou qu'elle est dissoute. Personne ne peut prendre le rôle d'une alliance dont il n'est pas membre. Décochez la case à tout moment pour retirer vos rôles.</p>

    alliance_grades:
        title: "Grades et permissions"
        category: "alliance"
        order: 2
        tags: "grades,permissions,roles,hierarchie,officier,dirigeant"
        summary: "Comment fonctionne la hiérarchie interne d'une alliance et qui a le droit de faire quoi."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Une alliance est organisée par <strong>grades</strong>, du plus haut (dirigeant) au plus bas (nouvelle recrue). Chaque grade a un jeu de <strong>permissions</strong> configurables.</p>

            <h2 id="hierarchie">La hiérarchie typique</h2>
            <ul>
                <li><strong>Grade 1 — Dirigeant</strong> — fondateur de l'alliance. Tous les droits. Un seul par alliance (sauf dans certains régimes).</li>
                <li><strong>Grade 2+ — Officiers</strong> — peuvent prendre des décisions déléguées (diplomatie, trésorerie, recrutement…).</li>
                <li><strong>Grades intermédiaires</strong> — vétérans, conseillers. Configurables selon les habitudes.</li>
                <li><strong>Grade le plus bas</strong> — nouvelles recrues, permissions limitées.</li>
            </ul>

            <h2 id="permissions">Permissions configurables</h2>
            <p>Le dirigeant peut, pour chaque grade, activer ou non :</p>
            <ul>
                <li><strong>Inviter</strong> de nouveaux membres.</li>
                <li><strong>Exclure</strong> un membre.</li>
                <li><strong>Accéder à la trésorerie</strong> (dépôt, retrait).</li>
                <li><strong>Déclarer la guerre</strong> à une autre alliance.</li>
                <li><strong>Accepter la paix</strong>, un pacte ou une alliance défensive.</li>
                <li><strong>Modifier les grades</strong> des autres membres.</li>
                <li><strong>Gérer les recherches d'alliance</strong>.</li>
            </ul>

            <h2 id="changer">Promouvoir ou rétrograder</h2>
            <p>Un officier avec la permission adéquate peut modifier le grade d'un membre. C'est une manière de récompenser les actifs et d'encadrer les nouveaux.</p>

            <h2 id="regimes">Cas particuliers selon le régime</h2>
            <p>Certains régimes politiques modifient ces règles :</p>
            <ul>
                <li><strong>Le Rempart Silencieux</strong> — tous les membres sont dirigeants (pas de hiérarchie).</li>
                <li><strong>Le Marteau des Étoiles</strong> — un seul dirigeant, inamovible ; si le dirigeant tombe, l'alliance est dissoute.</li>
                <li><strong>La Balance des Mondes</strong> — le Président est élu par vote.</li>
            </ul>

            <h2 id="afk">Remplacement automatique d'un chef inactif</h2>
            <p>Si le <strong>chef</strong> d'une alliance ne se connecte plus pendant <strong>plus de 7 jours</strong>, il est automatiquement remplacé pour éviter que l'alliance ne soit paralysée :</p>
            <ul>
                <li>Le <strong>membre actif le plus haut gradé</strong> prend la tête de l'alliance. En cas d'égalité de grade, c'est celui qui a le plus de <strong>Points de Guerre</strong>.</li>
                <li>Les deux grades sont simplement <strong>échangés</strong> : l'ancien chef récupère le grade du remplaçant.</li>
                <li>S'il n'existe <strong>aucun membre actif</strong> pouvant prendre le relais, rien ne change.</li>
            </ul>

    diplomacy:
        title: "La diplomatie"
        category: "alliance"
        order: 3
        tags: "diplomatie,guerre,paix,pacte,allie,defcon,traite"
        summary: "Les 4 types de relations entre alliances, comment les négocier, et ce que signifie le DEFCON."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Votre alliance entretient des <strong>relations</strong> avec les autres alliances du serveur. Ces relations changent les règles du jeu entre vos membres respectifs (qui peut attaquer qui).</p>

            <h2 id="types">Les 4 types de relations</h2>
            <table>
                <tr><th>Type</th><th>Effet</th><th>Usage</th></tr>
                <tr><td><strong>Guerre</strong></td><td>Conflit ouvert. Tout est permis entre les deux alliances.</td><td>Déclarée par un officier. Ennemis prioritaires.</td></tr>
                <tr><td><strong>Paix</strong></td><td>Cessez-le-feu. Aucune attaque possible. Peut inclure une taxe de paix.</td><td>Mettre fin à une guerre, ou éviter un conflit coûteux.</td></tr>
                <tr><td><strong>Pacte</strong></td><td>Non-agression mutuelle. Aucune attaque mais pas d'entraide obligatoire.</td><td>Relations neutres stables.</td></tr>
                <tr><td><strong>Alliance défensive</strong></td><td>Soutien militaire mutuel. On partage les infos, on peut se défendre ensemble.</td><td>Pour des alliés proches.</td></tr>
            </table>

            <h2 id="proposer">Comment proposer un traité</h2>
            <ol>
                <li>Page <strong>Alliance</strong> → <strong>Diplomatie</strong>.</li>
                <li>Choisissez l'alliance cible dans la liste.</li>
                <li>Proposez un type de relation (paix, pacte, alliance).</li>
                <li>L'autre camp doit <strong>accepter</strong>. Soit il accepte, soit il refuse, soit il contre-propose.</li>
            </ol>

            <h2 id="defcon">Le DEFCON (niveau d'alerte)</h2>
            <p>Votre alliance a un <strong>niveau d'alerte DEFCON</strong>, un chiffre qui indique son état de tension. <strong>Plus le chiffre est bas, plus la situation est dangereuse.</strong> Un DEFCON 1 signifie guerre totale imminente.</p>
            <p>C'est un indicateur visuel pour coordonner : un DEFCON bas = tous les membres sur le pont.</p>

            <h2 id="logs">Le journal diplomatique</h2>
            <p>Toute action diplomatique (déclaration de guerre, paix acceptée, pacte rompu…) est <strong>enregistrée</strong> dans l'historique d'alliance, avec le pseudo de l'auteur et l'horodatage. Utile pour la transparence interne et les débats post-mortem.</p>

    alliance_treasury:
        title: "Trésorerie d'alliance"
        category: "alliance"
        order: 4
        tags: "tresorerie,bitcoin,depot,retrait,taxe"
        summary: "Le pot commun de votre alliance, alimenté par les membres et les taxes de paix."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">À quoi sert la trésorerie</h2>
            <p>La trésorerie d'alliance est un <strong>compte partagé en Bitcoins</strong>. Elle sert à :</p>
            <ul>
                <li>Payer les <strong>recherches d'alliance</strong>.</li>
                <li>Dépanner un membre en difficulté.</li>
                <li>Financer un effort collectif (préparation à une guerre, event).</li>
            </ul>

            <h2 id="alimenter">Comment l'alimenter</h2>
            <ul>
                <li><strong>Dépôts volontaires</strong> — n'importe quel membre peut verser des Bitcoins.</li>
                <li><strong>Taxe d'alliance</strong> — si activée, un pourcentage des revenus de chaque membre est prélevé automatiquement au rapport journalier.</li>
                <li><strong>Taxes de paix</strong> — si vous avez imposé une taxe à une alliance avec qui vous faites la paix, elle tombe automatiquement dans la trésorerie.</li>
            </ul>

            <h2 id="retrait">Les retraits</h2>
            <p>Les retraits sont réservés aux grades qui ont la <strong>permission trésorerie</strong> — en général, les officiers et le dirigeant. Chaque mouvement est journalisé.</p>

            <h2 id="taxes">La taxe d'alliance</h2>
            <p>La taxe d'alliance est configurable par le dirigeant. Elle prélève un pourcentage des revenus de chaque membre, <strong>automatiquement au rapport journalier</strong>. Choisissez-la raisonnable : trop élevée, les membres partent.</p>

            <h2 id="transparence">Transparence</h2>
            <p>Les <strong>logs de trésorerie</strong> affichent qui a déposé/retiré, quand, combien. C'est un outil de confiance : tout le monde peut vérifier.</p>

    political_system:
        title: "Les 3 régimes politiques"
        category: "alliance"
        order: 5
        tags: "politique,regime,bonus,balance,rempart,marteau"
        summary: "Les 3 régimes possibles pour une alliance : avantages, inconvénients, et comment choisir."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principe">Choisir à la création</h2>
            <p>Quand une alliance est créée, le fondateur choisit un <strong>régime politique</strong>. Ce régime définit des <strong>règles internes</strong>, des <strong>bonus spécifiques</strong>, et un <strong>arbre de recherches d'alliance</strong> dédié. Le choix est <strong>irréversible</strong>.</p>

            <h2 id="balance">La Balance des Mondes (démocratique)</h2>
            <p>Régime ouvert et économique. Les membres votent pour élire leur Président. Focus sur l'<strong>économie</strong>.</p>
            <ul>
                <li>+20&nbsp;% d'attaque contre les alliances offensives.</li>
                <li>Membres visibles publiquement.</li>
                <li>Les membres peuvent quitter librement.</li>
                <li>Recherches orientées économie (production, cargo, recherches scientifiques plus rapides, vente marchand…).</li>
            </ul>

            <h2 id="rempart">Le Rempart Silencieux (offensif)</h2>
            <p>Régime agressif et collectif. Tous les membres sont dirigeants. Focus sur l'<strong>offensive</strong>.</p>
            <ul>
                <li>+20&nbsp;% d'attaque contre les alliances défensives.</li>
                <li>Un membre supplémentaire autorisé.</li>
                <li>Taxe d'alliance fixée à 50&nbsp;% automatiquement.</li>
                <li>Impossible de quitter l'alliance.</li>
                <li>Recherches orientées combat (puissance vaisseaux, coût Légionnaires réduit, vitesse de recyclage, invasions…).</li>
            </ul>
            <p>Les trois grades de tête (<strong>Guide</strong>, <strong>Protecteur</strong>, <strong>Camarade</strong>) sont <strong>équivalents</strong> : mêmes droits, aucune hiérarchie entre eux. Ils peuvent être librement attribués entre membres ; seul le grade de recrue (Goulag) est inférieur.</p>

            <h2 id="marteau">Le Marteau des Étoiles (défensif)</h2>
            <p>Régime discret et défensif. Un seul dirigeant. Focus sur la <strong>défense</strong> et la résistance.</p>
            <ul>
                <li>+20&nbsp;% d'attaque contre les alliances démocratiques.</li>
                <li>Menace Cthulhu réduite (très utile en PvE).</li>
                <li>Seul le dirigeant est affiché publiquement.</li>
                <li>Impossible de quitter l'alliance. Impossible de la dissoudre.</li>
                <li>Si le dirigeant est mis en Game Over, l'alliance est dissoute.</li>
                <li>Un membre en moins que les autres régimes.</li>
                <li>Recherches orientées défense (production workers, force Légionnaires, défense Mechas, capacité barges…).</li>
            </ul>

            <h2 id="combat">Bonus entre régimes</h2>
            <p>Chaque régime a un bonus de +20&nbsp;% d'attaque <strong>contre un régime rival</strong>, en pierre-feuille-ciseaux :</p>
            <ul>
                <li>La Balance bat le Rempart.</li>
                <li>Le Rempart bat le Marteau.</li>
                <li>Le Marteau bat la Balance.</li>
            </ul>

            <h2 id="choisir">Comment choisir ?</h2>
            <ul>
                <li><strong>Vous débutez et visez la croissance</strong> → La Balance des Mondes (économique, flexible).</li>
                <li><strong>Vous voulez une alliance soudée et agressive</strong> → Le Rempart Silencieux.</li>
                <li><strong>Vous voulez vous protéger, jouer défensif</strong> → Le Marteau des Étoiles (attention : en cas de game over du dirigeant, tout s'effondre).</li>
            </ul>

    alliance_research:
        title: "Recherches d'alliance"
        category: "alliance"
        order: 6
        tags: "recherche,alliance,politique,amelioration,bonus"
        summary: "Des bonus collectifs financés par la trésorerie d'alliance, qui profitent à tous les membres."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principe">Comment ça marche</h2>
            <p>Votre alliance dispose d'un <strong>arbre de recherches dédié</strong> qui dépend de son <strong>régime politique</strong>. Chaque recherche coûte des Bitcoins (prélevés sur la trésorerie) et s'étale sur plusieurs niveaux.</p>
            <p>Les bonus <strong>profitent à tous les membres</strong>. C'est une des raisons principales de rejoindre ou de rester fidèle à une alliance.</p>

            <h2 id="liste">Les recherches d'alliance typiques</h2>
            <table>
                <tr><th>Recherche</th><th>Ce qu'elle améliore</th></tr>
                <tr><td><strong>Production</strong></td><td>Bonus de production des ressources.</td></tr>
                <tr><td><strong>Travailleurs</strong></td><td>Croissance plus rapide de la population.</td></tr>
                <tr><td><strong>Défense des travailleurs</strong></td><td>Les travailleurs résistent mieux en invasion.</td></tr>
                <tr><td><strong>Vitesse de recherche</strong></td><td>Les recherches individuelles finissent plus vite.</td></tr>
                <tr><td><strong>Armement</strong></td><td>Dégâts des vaisseaux en combat.</td></tr>
                <tr><td><strong>Armure</strong></td><td>Armure des vaisseaux.</td></tr>
                <tr><td><strong>Coût Légionnaires / scientifiques / Mechas</strong></td><td>Recrutement moins cher.</td></tr>
                <tr><td><strong>Capacité des barges</strong></td><td>Plus de Légionnaires débarqués par barge.</td></tr>
                <tr><td><strong>Capacité des cargos</strong></td><td>Plus de ressources transportées.</td></tr>
                <tr><td><strong>Capacité de recyclage</strong></td><td>Plus de débris ramenés par cycle.</td></tr>
                <tr><td><strong>Colonisation</strong></td><td>Plus de planètes colonisables.</td></tr>
                <tr><td><strong>Attaque / Défense Légionnaires</strong></td><td>Force des troupes au sol.</td></tr>
                <tr><td><strong>Défense Mechas</strong></td><td>Mechas plus résistants.</td></tr>
                <tr><td><strong>Prix marchands</strong></td><td>Meilleures ventes aux PNJ.</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Bonus dans les combats au sol.</td></tr>
                <tr><td><strong>Points de Guerre</strong></td><td>Plus de PDG gagnés en combat.</td></tr>
            </table>

            <h2 id="choisir">Quelles recherches prioriser ?</h2>
            <ul>
                <li><strong>Alliance économique</strong> (La Balance) → Production, Vitesse recherche, Cargo.</li>
                <li><strong>Alliance offensive</strong> (Le Rempart) → Armement, Invasion, Attaque Légionnaires.</li>
                <li><strong>Alliance défensive</strong> (Le Marteau) → Production workers, Défense Mechas, Barges.</li>
            </ul>
            <p>À discuter en salon d'alliance avant de lancer : c'est un choix collectif.</p>

    salon:
        title: "Le salon d'alliance"
        category: "alliance"
        order: 7
        tags: "salon,chat,discussion,alliance,message"
        summary: "Le chat interne de votre alliance : temps réel, historique, et base stratégique."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="fonctionnement">Comment ça marche</h2>
            <p>Le <strong>salon d'alliance</strong> est un chat en temps réel réservé aux membres de votre alliance. Accessible depuis la page <strong>Alliance → Salon</strong> (ou un bouton dédié dans le menu).</p>
            <p>Les messages sont conservés : vous pouvez remonter dans l'historique pour retrouver une info.</p>

            <h2 id="usage">À quoi ça sert</h2>
            <ul>
                <li><strong>Coordonner les attaques</strong> — lancer un raid à deux vaut mieux qu'un seul qui se fait repousser.</li>
                <li><strong>Alerter</strong> en cas de flotte ennemie repérée.</li>
                <li><strong>Partager des coordonnées</strong> (planètes cibles, champs de débris intéressants) — écrites au format <code>galaxie:secteur:position</code> (ex. <code>1:15:25</code>), elles deviennent automatiquement cliquables, tout comme un lien vers une page du jeu.</li>
                <li><strong>Discuter de la stratégie</strong> d'alliance (recherches, diplomatie, guerres).</li>
                <li><strong>Se présenter</strong> aux nouveaux membres et tisser des liens.</li>
            </ul>

            <h2 id="bonnes-pratiques">Bonnes pratiques</h2>
            <ul>
                <li>Restez respectueux — insultes et harcèlement peuvent être sanctionnés par l'admin.</li>
                <li>Évitez de spammer : laissez la place aux discussions stratégiques.</li>
                <li>Mentionnez les pseudos des membres concernés quand vous voulez leur attention.</li>
                <li>Archivage mental : quand un conseil est donné, gardez-le en tête — les messages défilent vite.</li>
            </ul>

            <h2 id="messages-prives">Et les messages privés ?</h2>
            <p>À part du salon, vous pouvez envoyer un <strong>message privé</strong> à n'importe quel joueur du serveur (hors alliance comprise). Utile pour la diplomatie silencieuse ou pour répondre discrètement à une proposition. Coordonnées et liens du jeu y deviennent cliquables exactement comme dans le salon.</p>

    alliance_improvements:
        title: "Améliorations d'alliance"
        category: "alliance"
        order: 8
        tags: "ameliorations,alliance,bonus,bitcoin,investissement,collectif,niveaux"
        summary: "Investissez des Bitcoins pour débloquer 16 bonus collectifs qui renforcent toute votre alliance — vitesse de recherche, production, puissance de combat et plus encore."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'onglet <strong>Améliorations</strong> de la page d'alliance permet aux membres d'investir des Bitcoins pour débloquer et améliorer <strong>16 bonus collectifs</strong>. Ces bonus profitent à <strong>tous les membres actifs</strong> de l'alliance. Un joueur qui quitte l'alliance cesse d'en bénéficier, mais l'alliance conserve ses niveaux acquis.</p>

            <h2 id="quota">Quota d'investissement</h2>
            <p>Chaque membre dispose d'un quota de <strong>20 investissements par tranche glissante de 3 heures</strong>. Les investissements non utilisés sont perdus — le quota ne s'accumule pas. Chaque investissement coûte <strong>1 000 Bitcoin</strong> prélevés sur le solde personnel (c'est une dépense définitive, un puits à monnaie).</p>
            <p>Dans l'interface, sous chaque bonus, des boutons rapides <strong>×1 / ×5 / ×10</strong> permettent d'investir instantanément plusieurs points en un clic.</p>

            <h2 id="niveaux">Niveaux et seuils</h2>
            <p>Chaque bonus possède <strong>5 niveaux</strong>. Les seuils d'investissements requis pour passer au niveau suivant sont :</p>
            <table>
                <tr><th>Niveau</th><th>Investissements nécessaires</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1 000</td></tr>
            </table>
            <p>⚠️ Les investissements excédentaires au-delà du seuil d'un niveau sont <strong>perdus</strong> — il n'y a pas de report au niveau suivant.</p>

            <h2 id="bonus">Les 16 bonus et leurs effets</h2>
            <table>
                <tr><th>Bonus</th><th>Effet par niveau</th><th>Maximum (niveau 5)</th></tr>
                <tr><td><strong>Vitesse de recherche</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
                <tr><td><strong>Coût de recherche</strong></td><td>−1 % par niveau</td><td>−5 %</td></tr>
                <tr><td><strong>Boost de construction de bâtiment</strong></td><td>+15 s de réduction par aidant</td><td>75 s de réduction par aidant</td></tr>
                <tr><td><strong>Coût de construction</strong></td><td>−1 % par niveau</td><td>−5 %</td></tr>
                <tr><td><strong>Production de niobium</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
                <tr><td><strong>Production d'eau</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
                <tr><td><strong>Production de rations</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
                <tr><td><strong>Vitesse de flotte</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Puissance missile</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Puissance laser</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Puissance plasma</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Précision</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Blindage de flotte</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Bouclier</strong></td><td>+1 % par niveau</td><td>+5 %</td></tr>
                <tr><td><strong>Défense planétaire</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
                <tr><td><strong>Expérience du héros</strong></td><td>+2 % par niveau</td><td>+10 %</td></tr>
            </table>
            <p>Le <strong>Boost de construction de bâtiment</strong> alimente directement la fonctionnalité d'<a href="/wiki/alliance_construction_help">entraide construction</a> : plus son niveau est élevé, plus chaque aide d'un allié réduit la durée du chantier.</p>

    alliance_construction_help:
        title: "Entraide construction"
        category: "alliance"
        order: 9
        tags: "entraide,construction,alliance,boost,batiment,aide,acceleration"
        summary: "Un clic pour accélérer les chantiers de tous vos alliés en même temps — et eux font pareil pour vous."
        related: "alliance_improvements"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'<strong>entraide construction</strong> permet aux membres d'une alliance d'accélérer mutuellement leurs chantiers en cours d'un simple clic. Lorsqu'un ou plusieurs alliés ont une construction en cours sur leur planète, une <strong>icône d'aide</strong> (cœur) apparaît dans la barre globale de l'interface. Le badge indique le nombre de constructions éligibles.</p>
            <p>Un clic sur cette icône déclenche automatiquement l'aide sur <strong>toutes les constructions éligibles</strong> de l'alliance à la fois — pas besoin de les sélectionner une par une.</p>

            <h2 id="gain">Gain par aide</h2>
            <p>Chaque aide apportée accélère la construction de :</p>
            <blockquote><strong>15 secondes × niveau du bonus « Boost de construction de bâtiment »</strong></blockquote>
            <p>Le gain est <strong>plafonné à 75 secondes</strong> par aide et par membre (niveau 5 × 15 s = 75 s). Une construction ne peut pas descendre en dessous de <strong>30 secondes restantes</strong> grâce à l'entraide.</p>
            <table>
                <tr><th>Niveau du bonus</th><th>Gain par aide</th></tr>
                <tr><td>0 (non débloqué)</td><td>15 s</td></tr>
                <tr><td>1</td><td>15 s</td></tr>
                <tr><td>2</td><td>30 s</td></tr>
                <tr><td>3</td><td>45 s</td></tr>
                <tr><td>4</td><td>60 s</td></tr>
                <tr><td>5</td><td>75 s</td></tr>
            </table>

            <h2 id="eligibilite">Éligibilité d'une construction</h2>
            <p>Pour qu'une construction soit aidée, deux conditions doivent être remplies :</p>
            <ul>
                <li><strong>Durée totale &gt; 30 secondes</strong> (entre le début et la fin prévue).</li>
                <li><strong>Temps restant &gt; 30 secondes</strong> au moment où l'aide est apportée.</li>
            </ul>
            <p>Les chantiers presque terminés (moins de 30 s restantes) ne bénéficient pas de l'entraide.</p>

            <h2 id="deduplication">Déduplication</h2>
            <p>Un même membre ne peut aider <strong>chaque construction qu'une seule fois</strong>. L'icône disparaît automatiquement lorsqu'il n'y a plus de construction que vous n'avez pas encore aidée. Plusieurs membres peuvent aider la même construction — les gains s'accumulent : 3 membres au niveau 3 apportent chacun 45 s, soit 135 s au total.</p>

            <h2 id="lien-ameliorations">Lien avec les améliorations d'alliance</h2>
            <p>Le gain par aide dépend directement du niveau du bonus <strong>« Boost de construction de bâtiment »</strong> dans l'onglet <a href="/wiki/alliance_improvements">Améliorations</a>. Investir dans ce bonus bénéficie à tout le monde : plus vite vos alliés finissent leurs bâtiments, plus vite l'empire de l'alliance grandit.</p>

    leveling:
        title: "Niveaux et expérience"
        category: "progression"
        order: 1
        tags: "niveau,experience,progression,level,score"
        summary: "Votre progression de niveau 1 à 40, basée sur la taille de votre empire."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Ce qui compte pour votre score</h2>
            <p>Votre score (ou "points de commandeur") reflète la <strong>taille globale de votre empire</strong> :</p>
            <ul>
                <li>Nombre de <strong>travailleurs</strong>.</li>
                <li>Nombre et qualité des <strong>vaisseaux</strong>.</li>
                <li>Nombre de <strong>troupes</strong> (Légionnaires, Mechas).</li>
                <li>Niveau des <strong>bâtiments</strong> construits.</li>
            </ul>
            <p>Les vaisseaux comptent fort, les bâtiments comptent beaucoup. Perdre une flotte en combat fait baisser votre score.</p>

            <h2 id="seuils">Les paliers de niveau</h2>
            <table>
                <tr><th>Niveau</th><th>Expérience requise</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100&nbsp;000</td></tr>
                <tr><td>10</td><td>800&nbsp;000</td></tr>
                <tr><td>15</td><td>5&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>18&nbsp;000&nbsp;000</td></tr>
                <tr><td>25</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>30</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>35</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>La progression est <strong>exponentielle</strong> : monter du niveau 1 au 10 est bien plus rapide que du 30 au 40.</p>

            <h2 id="utilite">À quoi sert votre niveau</h2>
            <ul>
                <li><strong>Classement</strong> serveur — un indicateur public de votre puissance.</li>
                <li><strong>Bonus de connexion</strong> — le montant quotidien gagné dépend de votre niveau.</li>
                <li><strong>Reconnaissance</strong> — un haut niveau impressionne amis et ennemis.</li>
            </ul>

    war_points:
        title: "Points de Guerre (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,points,guerre,combat,classement"
        summary: "La seconde monnaie du jeu, gagnée au combat. Sert de mesure de votre agressivité."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Les PDG, c'est quoi ?</h2>
            <p>Les <strong>Points de Guerre</strong> (<strong>PDG</strong>) sont une deuxième "monnaie" de progression, <strong>orientée combat</strong>. Là où votre niveau reflète votre taille, vos PDG reflètent votre activité militaire.</p>

            <h2 id="gagner">Comment en gagner</h2>
            <ul>
                <li><strong>Combats spatiaux</strong> — les PDG dépendent de la puissance ennemie que vous détruisez, jamais de vos propres pertes. Anéantir une horde Cthulhu ou une flotte alien en rapporte nettement moins qu'une flotte de joueur de même puissance (garde-fou anti-fermage).</li>
                <li><strong>Perdre un combat spatial</strong> — une consolation vous est tout de même versée, proportionnelle à la signature de la flotte que vous avez perdue, mais toujours nettement inférieure à ce qu'un vainqueur touche sur une flotte identique : un cinquième de ce gain, jamais plus.</li>
                <li><strong>Défense orbitale</strong> — quand vos tourelles anéantissent une flotte en orbite, au même ratio qu'une victoire spatiale (bien moins face à un Cthulhu). Raser les défenses d'une planète adverse, en revanche, ne rapporte encore rien à l'attaquant.</li>
                <li><strong>Raids et invasions</strong> — chaque victoire au sol rapporte des PDG.</li>
                <li><strong>Quêtes journalières</strong> — certaines donnent des PDG. Les <strong>3 du jour complétées = +250 PDG bonus</strong>.</li>
                <li><strong>Arène (duels de héros)</strong> — 50 à 200 PDG par victoire.</li>
                <li><strong>Défense contre les Cthulhu</strong> — victoire en Tower Defense ou en invasion Cthulhu.</li>
                <li><strong>Prison</strong> — exécuter un héros capturé (avec modération).</li>
            </ul>

            <h2 id="utilite">À quoi ils servent</h2>
            <ul>
                <li><strong>Débloquer certaines recherches</strong> qui demandent des PDG comme prérequis.</li>
                <li><strong>Classement PDG</strong> (militaire) — mesure de votre agressivité sur le serveur.</li>
                <li><strong>Torturer un prisonnier</strong> en prison (coûte des PDG pour révéler la position d'une planète ennemie).</li>
                <li><strong>Score pondéré</strong> dans certains modes de serveur (comme Paid Server).</li>
            </ul>

            <h2 id="strategie">Stratégie</h2>
            <p>Les PDG récompensent les joueurs <strong>agressifs</strong>. Si vous voulez grimper le classement militaire, concentrez-vous sur les combats spatiaux et invasions plutôt que sur la pure croissance économique.</p>

    quests:
        title: "Quêtes journalières"
        category: "progression"
        order: 3
        tags: "quetes,journalier,mission,recompense,pdg"
        summary: "3 petites missions chaque jour. Simples, rapides, et un bonus de 250 PDG si vous les faites toutes."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Chaque jour, à <strong>18h59 UTC</strong>, le jeu vous attribue <strong>3 quêtes journalières</strong>. Ce sont de petites tâches que vous pouvez accomplir pendant votre session de jeu normale.</p>

            <h2 id="types">Exemples de quêtes</h2>
            <ul>
                <li>Espionner une planète.</li>
                <li>Vendre des ressources à un marchand.</li>
                <li>Coloniser une nouvelle planète.</li>
                <li>Construire ou monter de niveau une Cité / Métropole.</li>
                <li>Envoyer un message privé à un autre joueur.</li>
                <li>Poster un message dans le salon d'alliance.</li>
                <li>Gagner un certain nombre de PDG en combat.</li>
                <li>Recycler un champ de débris.</li>
            </ul>

            <h2 id="recompense">Les récompenses</h2>
            <ul>
                <li>Chaque quête terminée rapporte des <strong>PDG</strong> : le gain est le <strong>plus élevé</strong> entre la valeur de base de la quête et <strong>5&nbsp;% de la moyenne des points du serveur</strong>, pour rester intéressant même quand votre empire devient énorme.</li>
                <li>Si vous complétez <strong>les 3 quêtes</strong> avant le prochain rapport journalier, vous recevez <strong>+250 PDG bonus</strong> le lendemain.</li>
            </ul>
            <p>Sur 30 jours, c'est 7&nbsp;500 PDG "gratuits" en plus, rien qu'en jouant régulièrement.</p>

            <h2 id="consulter">Où les voir</h2>
            <p>Vos quêtes du jour sont affichées sur la page <strong>Empire</strong> (ou un encart dédié selon la version). Cochées automatiquement au fur et à mesure des actions.</p>

    ranking:
        title: "Les classements"
        category: "progression"
        order: 4
        tags: "classement,rang,position,top,leaderboard"
        summary: "Plusieurs classements pour mesurer votre progression (et celle de vos rivaux)."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="types">Les classements disponibles</h2>
            <table>
                <tr><th>Classement</th><th>Basé sur</th><th>Récompense</th></tr>
                <tr><td><strong>Points (Empire)</strong></td><td>Taille globale de votre empire (travailleurs, vaisseaux, troupes, bâtiments, défenses).</td><td>Prestige.</td></tr>
                <tr><td><strong>Points de Guerre</strong></td><td>Activité militaire (combats, raids, invasions).</td><td>Prestige militaire.</td></tr>
                <tr><td><strong>Alliance</strong></td><td>Somme des points de tous les membres d'une alliance.</td><td>Couronne l'alliance la plus puissante.</td></tr>
                <tr><td><strong>Arène (héros)</strong></td><td>Ratio victoires/défaites en duels (minimum 5 combats).</td><td>Récompenses hebdomadaires pour le top 3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Meilleurs scores TD du serveur.</td><td>Prestige.</td></tr>
            </table>

            <h2 id="consulter">Où les voir</h2>
            <p>Page <strong>Classement</strong> dans le menu de gauche. Vous pouvez filtrer par type, rechercher un joueur ou une alliance, et voir votre propre position.</p>

            <h2 id="utilite">Pourquoi ça compte</h2>
            <ul>
                <li><strong>Stratégique</strong> — identifiez les gros joueurs à éviter ou à cibler.</li>
                <li><strong>Social</strong> — vitrine pour recruter dans votre alliance.</li>
                <li><strong>Compétition</strong> — dans certains modes de serveur (Paid Server, Domination), le classement final détermine le vainqueur.</li>
            </ul>

    heroes:
        title: "Votre héros"
        category: "progression"
        order: 5
        tags: "heros,bonus,planete,flotte,xp,capture,prison,specialite"
        summary: "Votre héros personnel : il évolue, combat, booste votre empire, et peut être capturé."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Chaque joueur possède <strong>un seul héros principal</strong>, créé en début de partie. Ce héros doit <strong>toujours</strong> être assigné soit à une planète, soit à une flotte — jamais libre. Vous pouvez en plus posséder des <strong>héros secondaires</strong> en nombre illimité — voir l'article dédié.</p>
            <p>Tant que vous n'avez pas de héros principal — en début de partie, ou après son exécution en prison —, le jeu vous ramène à sa création&nbsp;: les pages de jeu restent fermées jusque-là, celles de votre compte restent accessibles. Si l'un de vos héros secondaires occupe la planète choisie pour le nouveau héros, il repasse en <strong>réserve</strong>.</p>
            <p>Le héros apporte des bonus de combat, d'intelligence et de vitesse selon sa spécialité et son niveau.</p>
            <p>Les 4 compétences du héros sont : <strong>Attaque</strong>, <strong>Défense</strong>, <strong>Intelligence</strong> et <strong>Vitesse</strong>.</p>
            <p><strong>Intelligence</strong> confère un bonus de production de ressources sur les planètes, et un avantage stratégique dans les duels en arène.</p>
            <p><strong>Vitesse</strong> réduit le temps de vol des flottes, et alimente l'Élan en duel d'arène.</p>

            <h2 id="specialites">Spécialités</h2>
            <p>Chaque spécialité confère un bonus passif et débloque 3 traits aux niveaux 5, 10 et 15 :</p>
            <ul>
                <li><strong>Militaire</strong> : +5&nbsp;% d'attaque et de défense, en flotte comme au sol (contre Cthulhu et en PvP), et +5&nbsp;% de puissance en duel d'arène. Traits : <strong>Intimidation</strong> (niv. 5, l'adversaire subit −5&nbsp;% de puissance offensive, y compris contre le Cthulhu, et −5&nbsp;% de score en duel), <strong>Tacticien</strong> (niv. 10, +10&nbsp;% de puissance au premier round de vos combats, et +10&nbsp;% en duel), <strong>Seigneur de guerre</strong> (niv. 15, −5&nbsp;% de pertes de vos troupes au sol en combat entre joueurs, et +5&nbsp;% de puissance en duel).</li>
                <li><strong>Économie</strong> : double les bonus d'Intelligence (production) et du camp d'esclaves. Traits : <strong>Efficient</strong> (niv. 5, −10&nbsp;% du coût de construction), <strong>Négociant</strong> (niv. 10, +15&nbsp;% sur les ventes au marchand), <strong>Magnat</strong> (niv. 15, +20&nbsp;% de production).</li>
                <li><strong>Explorateur</strong> : +5&nbsp;% de précision de flotte. Traits : <strong>Éclaireur</strong> (niv. 5, +1 force radar sur la planète où il est affecté), <strong>Navigateur</strong> (niv. 10, +15&nbsp;% de vitesse de flotte), <strong>Cartographe</strong> (niv. 15, +2 force radar sur la planète où il est affecté).</li>
            </ul>

            <p>En <strong>duel d'arène</strong>, ces mêmes règles s'appliquent : le militaire garde ses +5&nbsp;% et ses trois traits, l'économiste voit son Intelligence doublée (plus 20&nbsp;% avec Magnat) alimenter la Ruse, et l'explorateur sa Vitesse doublée (plus 15&nbsp;% avec Navigateur) alimenter l'Élan. Ruse et Élan comptent pour 60&nbsp;% de leur valeur.</p>
            <p>Un récapitulatif détaillé de ces bonus s'affiche automatiquement à la création du héros.</p>

            <h2 id="xp">Gain d'expérience</h2>
            <p>L'XP se gagne de plusieurs façons :</p>
            <ul>
                <li><strong>Combat</strong> : XP fixe + proportionnel à la puissance ennemie détruite, divisé par le niveau du héros (scaling naturel).</li>
                <li><strong>Duel en arène</strong> : XP de base (30) multiplié selon le serrage du combat — un duel serré rapporte jusqu'à 3× plus d'XP qu'une victoire écrasante.</li>
                <li><strong>Passif</strong> : +5 XP/heure quand le héros est assigné à une planète (calculé avec la production de ressources).</li>
            </ul>
            <p>Formule level up : XP requise = niveau × 500. À chaque level, le joueur gagne des points de compétence à allouer.</p>

            <h2 id="assignation">Assignation</h2>
            <p>Assignez votre héros depuis la page <strong>Planètes</strong> ou la page de gestion d'une <strong>flotte</strong>. L'assignation se fait en AJAX sans rechargement de page.</p>
            <p>Un héros sur une flotte en vol ou en combat ne peut pas être réassigné. Si la flotte est détruite, le héros est automatiquement réassigné à votre planète capitale.</p>

            <h2 id="capture">Capture</h2>
            <p>Un héros peut être capturé lors d'un combat :</p>
            <ul>
                <li><strong>Combat spatial</strong> (flotte détruite) : 20% de chance</li>
                <li><strong>Invasion de planète</strong> (planète envahie) : 35% de chance</li>
            </ul>
            <p>Une capture exige un <strong>bâtiment Prison de niveau 1 ou plus</strong> : le héros est enfermé sur le lieu du combat s'il vous appartient et porte une Prison, sinon sur votre planète à la Prison la plus élevée. Sans aucune Prison, pas de capture.</p>
            <p>Après libération, le héros bénéficie de <strong>24h d'immunité</strong> contre la recapture.</p>
            <p>Les Cthulhu et bots ne peuvent pas capturer de héros.</p>
            <p>Cette section décrit votre héros <strong>principal</strong>. Vos <strong>héros secondaires</strong> suivent une règle de capture totalement différente, sans probabilité — voir l'article <em>Héros secondaires</em>.</p>

    secondary_heroes:
        title: "Héros secondaires"
        category: "progression"
        order: 6
        tags: "heros,secondaire,ecurie,capture,execution,prison,recyclage,reserve,butin"
        summary: "Des héros supplémentaires obtenus en butin rare : mêmes bonus que votre héros principal, mais capturables ou exécutables définitivement en combat."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Un héros secondaire apporte <strong>les mêmes bonus</strong> qu'un héros principal une fois placé sur une planète ou une flotte. Ce qui le distingue : il peut être <strong>capturé ou tué définitivement</strong> en cas de défaite. Vous pouvez en accumuler plusieurs, en plus de votre héros principal.</p>

            <h2 id="obtention">Comment on les obtient</h2>
            <p>Un héros secondaire est un <strong>butin rare</strong>, jamais achetable :</p>
            <table>
                <tr><th>Source</th><th>Chance</th></tr>
                <tr><td>Victoire en Tower Defense Cthulhu (par run)</td><td>2&nbsp;%</td></tr>
                <tr><td>Attaque Cthulhu repoussée sur une de vos planètes</td><td>1&nbsp;%</td></tr>
                <tr><td>Vainqueur d'un tournoi d'arène</td><td>25&nbsp;%</td></tr>
            </table>
            <p>À l'obtention, son nom et sa spécialité sont tirés au hasard, et il arrive directement en <strong>réserve</strong> — c'est à vous de décider où le placer, ou de le recycler sans jamais le placer.</p>

            <p>Chaque héros obtenu vous est annoncé par un <strong>rapport</strong> qui précise d'où il vient. L'écran de fin de Tower Defense et le rapport de victoire contre les Cthulhu le signalent également sur le moment.</p>

            <h2 id="placement">Où les placer</h2>
            <p>Comme votre héros principal : <strong>une planète</strong> ou <strong>une flotte</strong>, jamais les deux à la fois. Un secondaire non placé reste en <strong>réserve</strong> : aucun bonus, mais <strong>aucun risque</strong> non plus — c'est un choix normal, pas un oubli à corriger. Gérez tous vos secondaires depuis l'onglet <strong>Écurie</strong> de la page Héros.</p>

            <h2 id="gestion">Compétences et équipement</h2>
            <p>Un héros secondaire progresse comme le principal : il gagne des niveaux, et avec eux des <strong>points de compétence</strong>. Le bouton <strong>Gérer</strong> de l'Écurie ouvre leur répartition entre Attaque, Défense, Intelligence et Vitesse.</p>
            <p>Le même panneau gère son <strong>équipement</strong> : posez-lui un item libre de votre inventaire, ou reprenez-le. Les items d'un héros ennemi capturé vous reviennent avec lui — c'est là que vous les récupérez.</p>

            <h2 id="risque">Ce que vous risquez</h2>
            <p>Un héros secondaire placé peut être perdu <strong>définitivement</strong> lors de :</p>
            <ul>
                <li>Un <strong>combat spatial</strong> perdu (sa flotte est détruite).</li>
                <li>Un <strong>combat utilitaire</strong> perdu (flotte sans la moindre arme, anéantie sans même livrer bataille).</li>
                <li>Une <strong>invasion</strong> réussie contre la planète où il est stationné.</li>
                <li>La destruction de sa flotte par les <strong>défenses orbitales</strong> d'une planète passée en mode attaque.</li>
            </ul>
            <p>Il ne risque en revanche <strong>rien</strong> lors :</p>
            <ul>
                <li>D'un <strong>raid</strong> — même réussi, un raid ne prend jamais la planète.</li>
                <li>D'un combat contre les <strong>Cthulhu</strong> (ou tout adversaire non-joueur).</li>
                <li>De l'<strong>arène</strong> — duels et tournois n'exposent aucun héros à la capture.</li>
            </ul>

            <p>Une <strong>notification</strong> vous prévient dès qu'un de vos secondaires est capturé ou exécuté : une perte définitive ne dépend pas du fait que vous ouvriez votre rapport.</p>

            <h2 id="prison">La condition prison</h2>
            <p>Contrairement à votre héros principal (capture <em>probabiliste</em>, voir l'article <em>Prison et héros capturés</em>), le sort d'un secondaire vaincu est <strong>entièrement déterministe</strong>, sans le moindre hasard :</p>
            <ul>
                <li>Le vainqueur possède un <strong>bâtiment Prison</strong> de niveau 1 ou plus sur au moins une de ses planètes → il <strong>capture</strong> le héros, avec son niveau, son expérience et ses items intacts.</li>
                <li>Le vainqueur n'a <strong>aucune</strong> Prison construite → le héros est <strong>exécuté</strong>.</li>
            </ul>
            <p>En combat de blocs (plusieurs alliés côte à côte), le héros revient au commandant vainqueur qui a <strong>le plus engagé de puissance</strong> dans le combat — s'il n'a pas de Prison, le héros est exécuté même si un allié du même camp en possédait une.</p>
            <p>Un secondaire capturé n'est <strong>pas</strong> un prisonnier classique : pas de page prison, pas de mini-jeu d'évasion, pas de rançon. Il arrive directement, actif, dans l'Écurie de son nouveau propriétaire, prêt à être replacé ou recyclé.</p>

            <h2 id="recuperation">Aucune récupération possible</h2>
            <p>Une fois capturé ou exécuté, un héros secondaire est perdu <strong>pour de bon</strong> : ni évasion, ni rançon, ni libération par invasion de son ancien propriétaire ne peuvent le récupérer. Le seul moyen de le revoir un jour est de le reprendre vous-même au combat — et il peut ainsi recirculer indéfiniment d'empire en empire.</p>

            <h2 id="identite">Un héros capturé garde son identité</h2>
            <p>Un secondaire capturé conserve son <strong>nom</strong>, son <strong>niveau</strong> et son <strong>expérience</strong>. Dans votre Écurie, il affiche son commandant d'origine (« Capturé sur … »).</p>

            <h2 id="recyclage">Le recyclage</h2>
            <p>Vous pouvez <strong>exécuter vous-même</strong> un de vos héros secondaires pour transférer son expérience à votre héros principal, <strong>moins 10&nbsp;%</strong>. Un aperçu chiffré (XP transférée, niveau projeté du principal) s'affiche avant confirmation. <strong>Action irréversible.</strong></p>

    items:
        title: "Items du héros"
        category: "progression"
        order: 6
        tags: "items,equipement,bonus,rarete,drop,cthulhu,fusion"
        summary: "Équipez votre héros avec jusqu'à 3 items pour cumuler des bonus. Comment les obtenir."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Les items sont des objets équipables sur votre héros (maximum <strong>3 items</strong>). Ils apportent des bonus variés qui s'ajoutent aux bonus naturels du héros.</p>

            <h2 id="categories">Catégories</h2>
            <ul>
                <li><strong>Offensif</strong> : Armes, objets orientés attaque</li>
                <li><strong>Défensif</strong> : Armures, boucliers, protection</li>
                <li><strong>Pouvoir</strong> : Objets de statut, bonus mixtes</li>
            </ul>
            <p>Aucune contrainte de type : vous pouvez équiper 3 offensifs si vous le souhaitez.</p>

            <h2 id="raretes">Raretés</h2>
            <ul>
                <li><strong>Commun</strong> : 1 bonus (+2-5%)</li>
                <li><strong>Rare</strong> : 1-2 bonus (+5-10%)</li>
                <li><strong>Épique</strong> : 2-3 bonus (+10-15%)</li>
                <li><strong>Légendaire</strong> : 3+ bonus (+15-25%)</li>
            </ul>

            <h2 id="bonus">Types de bonus</h2>
            <p>16 types de bonus possibles : force Légionnaires, force Mechas, attaque flotte, défense flotte, précision, bouclier, vitesse flotte, production ressources, vitesse construction, production workers, production vaisseaux, radar, recyclage, bonus anti-Cthulhu, bonus duel, bonus XP.</p>

            <h2 id="obtention">Obtention</h2>
            <p>Il existe désormais quatre façons d'obtenir des items :</p>

            <h3>Combattre les Cthulhu</h3>
            <p>Les items peuvent drop en battant des Cthulhu, que vous repoussiez leur débarquement au sol ou que vous anéantissiez entièrement leur horde en orbite avant qu'elle n'atterrisse. Le taux de drop est identique dans les deux cas et dépend de la difficulté PvE :</p>
            <ul>
                <li><strong>Facile</strong> : 30% commun, 8% rare, 1% épique</li>
                <li><strong>Normal</strong> : 40% commun, 15% rare, 5% épique, 0.5% légendaire</li>
                <li><strong>Difficile</strong> : 50% commun, 25% rare, 10% épique, 2% légendaire</li>
            </ul>
            <p>Une horde seulement partiellement détruite en orbite débarque quand même : c'est alors ce débarquement qui déclenche le tirage, jamais les deux à la fois.</p>

            <h3>Victoires en arène</h3>
            <p>Chaque victoire en duel d'arène offre une chance de drop d'item :</p>
            <ul>
                <li><strong>Commun</strong> : 15%</li>
                <li><strong>Rare</strong> : 5%</li>
                <li><strong>Épique</strong> : 1%</li>
            </ul>

            <h3>Mises en duel</h3>
            <p>En lançant un défi, vous pouvez miser un item. Si l'adversaire accepte, il doit miser un item de même rareté. Le vainqueur remporte les deux items.</p>

            <h3>Fusionner trois items</h3>
            <p>Trois items de <strong>même rareté</strong> se fusionnent en un item de la rareté supérieure, sans coût ni délai. La catégorie et les bonus du nouvel item sont tirés au hasard, comme pour un drop. Les trois items d'origine sont consommés définitivement, et un item porté par un héros doit d'abord être déséquipé. Le légendaire est la rareté maximale : il ne se fusionne pas.</p>
            <p>La fusion se lance depuis la page <strong>Commandants</strong>, onglet <strong>Fusion</strong> : cliquez trois cartes d'items pour les sélectionner (la carte entière est cliquable), puis validez avec le bouton de fusion, disponible en haut comme en bas de la liste.</p>

            <h2 id="vol">Vol d'items</h2>
            <p>Si votre héros est capturé, ses items équipés risquent d'être volés par le vainqueur. Probabilité de vol : Commun 80%, Rare 60%, Épique 40%, Légendaire 25%.</p>

            <h2 id="inventaire">Inventaire</h2>
            <p>Accédez à votre inventaire depuis la page <strong>Commandants</strong>, onglet <strong>Inventaire</strong>. Depuis l'inventaire, vous pouvez :</p>
            <ul>
                <li><strong>Équiper</strong> un item sur votre héros (si actif et moins de 3 items équipés)</li>
                <li><strong>Déséquiper</strong> un item pour le remettre en inventaire</li>
                <li><strong>Détruire</strong> un item dont vous n'avez plus besoin</li>
                <li><strong>Fusionner</strong> 3 items de même rareté en un item de la rareté supérieure, depuis l'onglet <strong>Fusion</strong> voisin</li>
            </ul>
            <p>Chaque item est présenté sous forme de <strong>carte illustrée</strong> affichant son image, ses bonus et un liseré coloré selon sa rareté. Les cartes s'organisent en grille (3 à 4 par ligne selon la place disponible sur votre écran).</p>

    prison:
        title: "Prison et héros capturés"
        category: "progression"
        order: 7
        tags: "prison,capture,heros,evasion,torture,rancon,geole,secondaire"
        summary: "Quand un héros est capturé, que se passe-t-il ? Les options du prisonnier et du geôlier, et la capture directe des héros secondaires adverses."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Capture d'un héros</h2>
            <p>Un héros est capturé lors d'un combat spatial (20%) ou d'une invasion (35%). Le joueur capturé est enfermé : toute page hors du périmètre autorisé le renvoie vers la <strong>page prison</strong>. Il garde cependant accès au <strong>salon d'alliance</strong>, à ses <strong>messages privés</strong>, à ses <strong>rapports</strong>, à la <strong>consultation</strong> (lecture seule) de son alliance, et à la <strong>gestion de son compte</strong>. Tout le reste — construction, flottes, carte, marché, arène, et même la page héros — reste inaccessible tant qu'il n'est pas libéré.</p>
            <p>Une capture exige un <strong>bâtiment Prison de niveau 1 ou plus</strong> : le héros est enfermé sur le lieu du combat s'il vous appartient et porte une Prison, sinon sur votre planète à la Prison la plus élevée. Sans aucune Prison, pas de capture.</p>

            <h2 id="prisonnier">Actions du prisonnier</h2>
            <p>Toutes les <strong>4 heures</strong>, le prisonnier peut effectuer une action :</p>
            <ul>
                <li><strong>Alerter l'alliance</strong> (70% de réussite) : envoie les coordonnées de la prison au salon d'alliance. Échec = le geôlier est alerté. Sans alliance, l'action est indisponible. Après un échec, la prochaine action attend 6 heures au lieu de 4.</li>
                <li><strong>S'évader</strong> : une tentative toutes les 4 heures à compter de la capture (la première 4 heures après). 40% de réussite, +5% par tranche de 4 heures de captivité. Échec = le geôlier est alerté. Ce délai est indépendant des deux autres actions.</li>
                <li><strong>S'évader grâce à Slash</strong> : à tout moment et sans limite. Voir l'article <em>S'évader de prison</em>.</li>
                <li><strong>Payer la rançon</strong> : si le geôlier en a demandé une, vous pouvez la payer ou la refuser depuis la page prison.</li>
                <li><strong>Se rebeller</strong> (25% + bonus militaire) : sabote 5% des ressources de la prison. Échec = perte d'un niveau. Dans les deux cas, le geôlier reçoit un rapport.</li>
            </ul>

            <h2 id="geolier">Actions du geôlier</h2>
            <p>Accessible via le bâtiment Prison ou Camp d'esclaves :</p>
            <ul>
                <li><strong>Exécuter</strong> : détruit le héros définitivement (+PG proportionnels au niveau). Items récupérés. Le propriétaire du héros en est informé par un rapport.</li>
                <li><strong>Libérer</strong> : geste diplomatique, le héros retourne chez son propriétaire.</li>
                <li><strong>Torturer</strong> (coût: 200 PG) : révèle la position d'une planète ennemie.</li>
                <li><strong>Rançonner</strong> : demander des ressources en échange de la libération (24h pour accepter).</li>
            </ul>

            <h2 id="liberation">Libération</h2>
            <ul>
                <li><strong>Alliance du prisonnier envahit</strong> : libération automatique</li>
                <li><strong>Autre alliance envahit</strong> : 60% de chance d'évasion, sinon le prisonnier passe à l'envahisseur s'il possède une Prison, ou est libéré</li>
                <li><strong>Cthulhu envahit</strong> : tous les prisonniers sont libérés</li>
            </ul>

            <h2 id="secondaires">Capturer un héros secondaire adverse</h2>
            <p>Tout ce qui précède — évasion, torture, rançon, libération — concerne le <strong>héros principal</strong> d'un adversaire. Un <strong>héros secondaire</strong> (voir l'article <em>Héros secondaires</em>) obéit à une règle bien plus directe, et c'est là que votre bâtiment Prison prend une <strong>utilité décisive</strong> : dès que vous possédez une Prison de niveau 1 ou plus sur l'une de vos planètes, tout héros secondaire adverse vaincu face à vous (combat spatial, combat utilitaire ou invasion réussie) devient <strong>immédiatement et définitivement</strong> le vôtre — avec son niveau, son expérience et ses items intacts. Sans Prison, il est <strong>exécuté</strong> au lieu d'être capturé.</p>
            <p>Un secondaire capturé n'est <strong>pas</strong> un prisonnier au sens de cette page : il n'y a pas de page prison, pas d'évasion, pas de rançon possible. Il arrive directement, actif, dans votre <strong>Écurie</strong> — prêt à être placé sur une planète ou une flotte, ou recyclé.</p>

            <h2 id="prerequis">Prérequis</h2>
            <p>Recherche <strong>Prison</strong> (nécessite Barbelées niveau 5), puis bâtiments <strong>Prison</strong> et <strong>Camp d'esclaves</strong>.</p>

    prison_escape:
        title: "S'évader de prison"
        category: "progression"
        order: 8
        tags: "prison,evasion,slash,rancon,heros,capture"
        summary: "Les trois façons de sortir de prison par vous-même : l'évasion instantanée, Slash et la rançon."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Trois sorties</h2>
            <p>Quand votre héros est capturé, la page prison vous propose trois façons d'en sortir sans attendre vos alliés. Le mini-jeu d'évasion a été retiré.</p>

            <h2 id="instantanee">Évasion instantanée</h2>
            <ul>
                <li>Une tentative toutes les <strong>4 heures</strong>. La première s'ouvre 4 heures après la capture.</li>
                <li><strong>40%</strong> de réussite à la première tentative, puis <strong>+5%</strong> par tranche de 4 heures de captivité, que vous ayez tenté votre chance ou non.</li>
                <li>La chance de la prochaine tentative est affichée sur le bouton.</li>
                <li>Échec : votre héros reste en prison et <strong>le geôlier est alerté</strong>.</li>
            </ul>

            <h2 id="slash">S'évader grâce à Slash</h2>
            <p><strong>Slash</strong> est notre autre jeu (slash-game.com). Jouez-y avec la <strong>même adresse e-mail</strong> que votre compte Area Universe, confirmée des deux côtés.</p>
            <ul>
                <li>Atteignez <strong>75% du meilleur score de la semaine</strong> sur une partie jouée <strong>après votre capture</strong>.</li>
                <li>Tant que la semaine en cours (depuis lundi 00:00 UTC) compte moins de 10 joueurs classés ou que son meilleur score est sous 50 points, c'est le meilleur score de la semaine précédente qui sert de référence.</li>
                <li>Revenez sur la page prison et cliquez sur <strong>Vérifier mon score</strong> : votre héros est libéré.</li>
                <li>Tentatives <strong>illimitées</strong>, sans délai.</li>
                <li>Un compte invité ou une adresse non confirmée ne peut pas utiliser cette sortie.</li>
            </ul>

            <h2 id="rancon">Payer la rançon</h2>
            <p>Si le geôlier demande une rançon, elle apparaît sur la page prison avec son montant et sa date limite (24 heures). Vous pouvez la <strong>payer</strong> ou la <strong>refuser</strong>. Les ressources sont prélevées sur l'ensemble de vos planètes et versées au geôlier. Si vous n'avez pas assez de ressources, le paiement est refusé et rien n'est prélevé.</p>

            <h2 id="apres">Après la libération</h2>
            <p>Votre héros revient sur l'une de vos planètes avec ses items restants et bénéficie de <strong>24 heures d'immunité</strong> contre une nouvelle capture.</p>

    arena:
        title: "Arène PvP"
        category: "progression"
        order: 8
        tags: "arene,duel,tournoi,pvp,heros,defi,classement"
        summary: "Défiez d'autres héros en duel 1 contre 1. Mettez de l'uranium ou des items en jeu, gagnez du prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Système de défis</h2>
            <p>Depuis la page <strong>Arène</strong>, lancez un défi à un autre joueur. Le défié reçoit une notification et peut <strong>accepter</strong> ou <strong>refuser</strong> le défi.</p>
            <ul>
                <li>Un défi expire automatiquement après <strong>7 jours</strong> sans réponse. Le nombre de défis reçus en attente s'affiche sur l'onglet Arène et sur l'entrée « Héros » du menu. Le temps restant avant l'expiration s'affiche à côté de chaque défi reçu. Une fois expiré, vous pouvez de nouveau défier le même joueur.</li>
                <li>Vous pouvez <strong>annuler</strong> un défi que vous avez envoyé tant qu'il est en attente.</li>
                <li>Cooldown : <strong>1h</strong> entre deux duels pour le même joueur. Il est vérifié à l'envoi du défi <strong>et</strong> à son acceptation, pour les deux héros : empiler des défis en attente ne permet donc pas d'enchaîner plusieurs duels.</li>
                <li>Un héros capturé ne peut ni défier ni être défié. La capture et l'appartenance à la même alliance sont revérifiées à l'acceptation.</li>
                <li>Le héros n'est jamais en danger (pas de capture en arène).</li>
            </ul>

            <h2 id="combat">Résolution du combat</h2>
            <p>Quand le défié accepte, le combat est résolu <strong>immédiatement</strong> et le résultat s'affiche à l'écran du joueur qui a accepté : victoire ou défaite, les deux scores, les récompenses et la mise gagnée ou perdue. Les deux joueurs reçoivent aussi un rapport. Le score est basé sur :</p>
            <ul>
                <li><strong>Niveau</strong> du héros : le socle du score</li>
                <li><strong>Offense</strong> : attaque du héros, +5 % s'il est militaire, et les bonus offensifs de ses items</li>
                <li><strong>Défense</strong> : défense du héros et les bonus défensifs de ses items</li>
                <li><strong>Ruse</strong> (poids 60 %) : Intelligence — doublée pour un économiste, +20 % avec le trait Magnat — et les bonus utilitaires des items (production, construction, recyclage, radar)</li>
                <li><strong>Élan</strong> (poids 60 %) : Vitesse — doublée pour un explorateur, +15 % avec le trait Navigateur — et la vitesse de flotte des items</li>
                <li><strong>Traits militaires</strong> : Tacticien +10 %, Seigneur de guerre +5 %, et Intimidation retire 5 % de puissance à l'adversaire</li>
                <li><strong>Spécialité</strong> : avantage pierre-feuille-ciseaux (Militaire &gt; Explorateur &gt; Économie &gt; Militaire, +10 %)</li>
                <li><strong>Facteur aléatoire</strong> de ±15 % de chaque côté</li>
            </ul>

            <h2 id="mises">Mises</h2>
            <p>En lançant un défi, vous pouvez ajouter une mise optionnelle :</p>
            <ul>
                <li><strong>Uranium</strong> : chaque joueur mise la même quantité. Le vainqueur remporte les deux mises.</li>
                <li><strong>Item</strong> : chaque joueur mise un item de même rareté. Le vainqueur remporte les deux items. L'item doit être <strong>déséquipé</strong> (des deux côtés) et ne peut pas être engagé dans deux défis en attente à la fois.</li>
                <li><strong>Amical</strong> : sans mise, seules les récompenses de base sont attribuées.</li>
            </ul>
            <p>La mise est couverte si au moins une de vos planètes possède l'uranium requis : il est prélevé sur votre planète la plus riche en uranium. Si un joueur n'a plus assez d'uranium sur aucune planète au moment de l'acceptation, le défi échoue. Si l'item misé par le challenger n'est plus disponible quand le défié accepte (il ne lui appartient plus ou il est équipé), le duel est refusé.</p>

            <h2 id="recompenses">Récompenses de base</h2>
            <p>Le vainqueur reçoit à chaque duel :</p>
            <ul>
                <li>Uranium : proportionnel au niveau moyen des combattants, plafonné à <strong>20</strong> par duel</li>
                <li>Points de guerre : proportionnels au niveau du vainqueur (environ 225 à niveau 15), réduits quand l'écart de niveau est grand</li>
                <li>Chance d'item : 15% commun, 5% rare, 1% épique</li>
            </ul>
            <p>Le perdant ne perd rien (sauf sa mise éventuelle).</p>

            <h2 id="classement">Classement</h2>
            <p>Un classement par serveur affiche les meilleurs duellistes :</p>
            <ul>
                <li>Basé sur le ratio victoires/défaites</li>
                <li>Minimum <strong>5 combats</strong> pour apparaître</li>
                <li>Les <strong>5 premiers</strong> sont visibles directement sur la page ; un bouton permet d'ouvrir le classement complet avec pagination et tri</li>
                <li>Récompenses hebdomadaires versées automatiquement chaque <strong>lundi</strong> pour la semaine précédente (lundi au dimanche), une seule fois : top 3 selon le <strong>nombre de victoires en duel</strong> de la semaine, avec un minimum de <strong>5 duels</strong> dans la semaine. Seuls les joueurs sont concernés (ni les commandants IA, ni les comptes supprimés). 1er = 3000 uranium + 300 PG, 2ème = 2000 + 200 PG, 3ème = 1000 + 100 PG. Chaque joueur récompensé reçoit un rapport.</li>
            </ul>

            <h2 id="tournois">Tournois</h2>
            <p>Événement serveur périodique : un tournoi tous les <strong>7 jours</strong> par serveur.</p>
            <ul>
                <li>Inscription ouverte pendant <strong>24h</strong> depuis la page Arène. Un héros capturé ne peut pas s'inscrire, et il est exclu s'il est capturé avant le début.</li>
                <li>Ensuite, élimination directe automatique avec tirage au sort aléatoire (un joueur en surnombre passe le premier tour d'office), et un match pour la 3ème place entre les deux perdants des demi-finales.</li>
                <li>Il faut au moins <strong>2 participants</strong> : sinon le tournoi est annulé (aucune récompense) et les inscrits sont prévenus par rapport. Avec un seul joueur inscrit, le tournoi a lieu si un commandant IA peut compléter le tableau.</li>
                <li>Dès qu'au moins un joueur est inscrit, les <strong>commandants IA</strong> du serveur (héros principal non capturé) complètent le tableau jusqu'à <strong>8 participants</strong> au total. Ils s'inscrivent progressivement pendant les 24h d'inscription, et le tableau est complété à la clôture s'il en manque encore.</li>
                <li>Si <strong>8 joueurs ou plus</strong> sont inscrits, aucun commandant IA ne participe. Sans joueur inscrit, le tournoi n'a pas lieu : les commandants IA ne jouent jamais entre eux.</li>
                <li>Chaque combat du tournoi rapporte aussi à son vainqueur les récompenses habituelles d'un duel.</li>
                <li>Les commandants IA concourent pour le podium et reçoivent les mêmes récompenses que les joueurs, sauf la chance d'obtenir un héros secondaire.</li>
                <li>Le champion conserve 25 % de chance d'obtenir un héros secondaire (réservée aux joueurs).</li>
            </ul>
            <p>Récompenses :</p>
            <ul>
                <li>1er = 5000 uranium + 500 PG + 1 item épique (20 % de chance d'un item légendaire en plus)</li>
                <li>2ème = 3000 uranium + 300 PG + 1 item rare (10 % de chance d'un item épique en plus)</li>
                <li>3ème = 1500 uranium + 150 PG + 1 item rare</li>
                <li>Autres participants = 500 uranium + 50 PG (10 % de chance d'un item commun)</li>
            </ul>
            <p>Chaque participant reçoit un rapport avec son classement et ses récompenses. La page Arène affiche le compte à rebours de fin d'inscription, le podium du dernier tournoi et la date du prochain.</p>

    login_bonus:
        title: "Bonus de connexion"
        category: "progression"
        order: 9
        tags: "bonus,connexion,quotidien,bitcoin,serie,streak"
        summary: "Des Bitcoins gratuits chaque jour, multipliés si vous enchaînez plusieurs jours consécutifs."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>À votre <strong>première connexion</strong> de chaque jour calendaire, le jeu vous offre un bonus de Bitcoins. C'est gratuit, ça ne demande aucune action à part vous connecter.</p>
            <p>Le montant correspond au <strong>plus avantageux</strong> des deux calculs ci-dessous, puis multiplié par votre série :</p>
            <ul>
                <li>Un <strong>plancher lié à votre niveau</strong>, avec un aléatoire quotidien (×1 à ×5) — il garantit un bonus motivant en début de partie.</li>
                <li><strong>5&nbsp;% de la moyenne des Bitcoins du serveur</strong> — ainsi le bonus reste pertinent à mesure que l'économie du serveur grandit.</li>
                <li>Le résultat est ensuite multiplié par votre <strong>multiplicateur de série</strong> (voir ci-dessous).</li>
            </ul>
            <p>La moyenne du serveur écarte les comptes extrêmes (les 5&nbsp;% les plus riches et les plus pauvres) et ne compte ni les bots ni les comptes de test.</p>
            <p>Exemple : un joueur niveau 10 au jour 1 reçoit au minimum entre 50&nbsp;000 et 250&nbsp;000 Bitcoins — davantage si 5&nbsp;% de la moyenne du serveur dépasse ce plancher.</p>

            <h2 id="streak">La série de 7 jours consécutifs</h2>
            <p>Vous connecter <strong>chaque jour</strong> fait grimper votre multiplicateur :</p>
            <table>
                <tr><th>Jour consécutif</th><th>Multiplicateur</th></tr>
                <tr><td>Jour 1</td><td>×1.0</td></tr>
                <tr><td>Jour 2</td><td>×1.2</td></tr>
                <tr><td>Jour 3</td><td>×1.5</td></tr>
                <tr><td>Jour 4</td><td>×1.8</td></tr>
                <tr><td>Jour 5</td><td>×2.0</td></tr>
                <tr><td>Jour 6</td><td>×2.5</td></tr>
                <tr><td>Jour 7</td><td>×5.0</td></tr>
            </table>
            <p>Au 8e jour, le cycle repart au jour 1. Si vous <strong>manquez un jour</strong> (plus de 24h sans vous connecter), la série est remise à zéro.</p>

            <h2 id="items">Les items bonus</h2>
            <p>Certains jours de la série offrent en plus un <strong>item pour votre héros</strong>, aléatoire :</p>
            <ul>
                <li><strong>Jour 3</strong> : un item commun.</li>
                <li><strong>Jour 7</strong> : un item rare.</li>
            </ul>

            <h2 id="reclamation">Comment le réclamer</h2>
            <p>Une fenêtre s'ouvre automatiquement à votre connexion. Un clic pour tout récupérer. Votre <strong>meilleure série</strong> est archivée comme record personnel.</p>

            <h2 id="conseil">Un petit conseil</h2>
            <p>Même 30 secondes de connexion suffisent à valider la série. Ne ratez pas le jour 7, c'est là que ça rapporte le plus.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,elimination,faillite,fin"
        summary: "Les 2 façons de perdre la partie, et ce qu'il vous reste après."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">Les 2 types de Game Over</h2>
            <p>Il y a deux façons d'être éliminé d'un serveur. Les connaître, c'est déjà s'en protéger.</p>

            <h2 id="faillite">1. La faillite économique</h2>
            <p>Si, après le <strong>rapport journalier de 18h59 UTC</strong>, votre solde de Bitcoins est <strong>négatif</strong> : <strong>Game Over économique</strong>.</p>
            <ul>
                <li>Toutes vos <strong>flottes en vol</strong> sont détruites.</li>
                <li>Votre solde est <strong>réinitialisé à 125&nbsp;000 Bitcoins</strong>.</li>
                <li>Vos <strong>recherches</strong> sont remises à zéro.</li>
                <li>Votre <strong>terraformation</strong> est divisée par 2.</li>
                <li>Votre <strong>classement</strong> est réinitialisé.</li>
            </ul>
            <p>Le commandeur reste en vie (il peut continuer à jouer), mais il repart fortement affaibli.</p>
            <p><strong>Vous êtes prévenu avant :</strong> dès que votre solde passe sous le déficit quotidien projeté (coût d'entretien moins revenus), un rapport d'alerte « Faillite imminente » vous avertit — au maximum un par jour. Si vous le recevez, agissez avant le prochain rapport journalier.</p>

            <h2 id="planetes">2. La perte de toutes vos planètes</h2>
            <p>Si vous perdez votre <strong>dernière planète</strong> (invasion, abandon volontaire, Battle Royale où votre secteur disparaît), la partie est <strong>vraiment</strong> terminée :</p>
            <ul>
                <li>Toutes vos <strong>flottes</strong> sont transférées aux aliens.</li>
                <li>Votre <strong>commandeur est éliminé</strong> du serveur.</li>
                <li>Vos statistiques sont <strong>archivées</strong> sur votre compte.</li>
            </ul>

            <h2 id="eviter">Comment éviter le Game Over</h2>
            <ul>
                <li>Surveillez chaque jour votre <strong>bilan</strong> (revenus − coûts). Si ça tourne au rouge, réagissez.</li>
                <li>Ne sur-recrutez pas : une armée en entretien permanent peut ruiner un économiste peu vigilant.</li>
                <li>Gardez toujours <strong>au moins 2 planètes</strong> en état de défendre.</li>
                <li>Surveillez les <strong>flottes ennemies en approche</strong> (notifications, radar).</li>
                <li>En cas de gros danger, <strong>évacuez</strong> vos troupes et ressources vers une planète sûre.</li>
            </ul>

            <h2 id="apres">Que reste-t-il après ?</h2>
            <p>Même éliminé, vous gardez votre <strong>compte joueur</strong>. Vos <strong>statistiques</strong> des parties précédentes sont conservées, et vous pouvez rejoindre un nouveau serveur.</p>

    game_modes:
        title: "Les modes de serveur"
        category: "events"
        order: 1
        tags: "mode,battle royale,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe propose 7 modes de serveur différents, avec des règles et des objectifs propres."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Vue d'ensemble</h2>
            <p>Chaque serveur d'Area Universe est d'un <strong>mode</strong> précis, choisi par l'admin à la création. Le mode définit la durée, la condition de victoire, et si les Cthulhu sont présents.</p>
            <table>
                <tr><th>Mode</th><th>Durée</th><th>Condition de victoire</th><th>Cthulhu ?</th><th>Alliances ?</th><th>Recherches</th></tr>
                <tr><td>Cthulhu</td><td>300 jours</td><td>Aucune (scoreboard de survie)</td><td>Oui</td><td>Oui</td><td>Normales</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 jours</td><td>Le VIP qui survit 72h</td><td>Non</td><td>Oui (sauf pour le VIP)</td><td>Max dès le départ</td></tr>
                <tr><td>Domination</td><td>60 jours</td><td>Top-scoreur à la fin</td><td>Non</td><td>Oui</td><td>Max dès le départ</td></tr>
                <tr><td>Battle Royale</td><td>40 jours</td><td>Dernier survivant</td><td>Non</td><td>Non</td><td>Max dès le départ</td></tr>
                <tr><td>Paid Server</td><td>60 jours</td><td>Meilleur score pondéré (combat très valorisé)</td><td>Non</td><td>Oui</td><td>Normales</td></tr>
                <tr><td>Long Run</td><td>900 jours</td><td>Aucune (marathon)</td><td>Oui</td><td>Oui</td><td>Normales</td></tr>
                <tr><td>Short Run</td><td>150 jours</td><td>Aucune (sprint)</td><td>Oui</td><td>Oui</td><td>Normales</td></tr>
            </table>

            <h2 id="cthulhu">Mode Cthulhu (PvE classique)</h2>
            <p>Le mode de base, parfait pour découvrir le jeu. Pendant les <strong>72 premières heures</strong>, aucune attaque Cthulhu : c'est une <strong>phase de préparation</strong>. Ensuite, les hordes Cthulhu harcèlent périodiquement vos planètes.</p>
            <p>Pas de condition de victoire : à la fin (300 jours), un scoreboard récompense ceux qui ont le mieux survécu.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (chasse au VIP)</h2>
            <p>Un <strong>VIP</strong> est désigné au hasard à la fin du cessez-le-feu de 48h. Son objectif : <strong>survivre 72 heures</strong>. S'il réussit, il gagne. S'il est tué par un joueur, <strong>le tueur devient le nouveau VIP</strong>. Si c'est une cause non-humaine qui l'élimine (Cthulhu, événement), un autre joueur est tiré au sort.</p>
            <p>Le VIP est <strong>seul contre tous</strong> : il est automatiquement sorti de son alliance au moment de sa nomination, et ne peut plus en rejoindre une tant qu'il porte le statut.</p>

            <h2 id="domination">Domination (planètes stratégiques)</h2>
            <p>5 planètes stratégiques sont tirées au sort. Chaque jour, leur propriétaire marque <strong>+5 points</strong>. Nouveau tirage tous les 5 jours (préavis de 24h dans le salon).</p>
            <p>À la fin du serveur (60 jours), le joueur avec le meilleur score gagne. Pour les alliances, le score est la somme des scores des membres.</p>

            <h2 id="battle-royale">Battle Royale (dernier survivant)</h2>
            <p>Mode solo : <strong>pas d'alliance autorisée</strong>. Inscriptions fermées après 7 jours. Une seule galaxie.</p>
            <p>La carte est une grille spatiale de 100 systèmes qui <strong>rétrécit par anneaux concentriques</strong> : à chaque tour, <strong>tout l'anneau extérieur disparaît d'un seul coup</strong> (pas système par système). Les systèmes détruits restent affichés comme des <strong>trous</strong> : la carte ne se réorganise pas, ce qui rend la zone sûre lisible d'un coup d'œil.</p>
            <p><strong>5 tours, un par semaine :</strong></p>
            <ul>
                <li>J+7 : 36 systèmes · J+14 : 28 · J+21 : 20 · J+28 : 12 · J+35 : les 3 derniers (<strong>1 seul survit</strong>). Les 5 derniers jours se jouent au centre.</li>
                <li><strong>12 h avant</strong> sa destruction, un anneau passe en <strong>orange</strong> (avertissement).</li>
                <li><strong>1 h avant</strong>, il passe en <strong>rouge clignotant</strong> et plus aucune flotte ne peut y entrer ou en sortir.</li>
                <li>Un système détruit supprime définitivement ses planètes et ses flottes.</li>
                <li>Une flotte en transit vers un système disparu est détruite. Si votre héros s'y trouve, c'est la défaite.</li>
            </ul>
            <p><strong>Victoire</strong> : être le dernier commandeur actif.</p>

            <h2 id="paid-server">Paid Server (compétitif payant)</h2>
            <p>Serveur payant (<strong>5&nbsp;€</strong>), 100&nbsp;% PvP, aucun Cthulhu. Durée 60 jours.</p>
            <p><strong>Victoire</strong> : à la fin, le joueur avec le meilleur <strong>score pondéré</strong> gagne. Ce score combine taille de l'empire et activité militaire, le combat étant très valorisé — c'est un mode pour joueurs compétitifs.</p>
            <p>Le vainqueur reçoit une <strong>distinction permanente</strong> sur son profil, conservée d'un serveur à l'autre.</p>

            <h2 id="long-short-run">Long Run / Short Run (avec événements)</h2>
            <p>Deux modes PvE avec <strong>événements récurrents</strong> programmés : attaques Cthulhu, raids de pirates, bonus de production, recyclage amélioré, arènes d'alliance, guerres totales, affrontements inter-serveurs…</p>
            <p>Le <strong>Long Run</strong> (900 jours) est un marathon tranquille ; le <strong>Short Run</strong> (150 jours) est un sprint plus intense. Le calendrier des événements est <strong>déterministe</strong> : vous pouvez les anticiper.</p>

            <h2 id="recherches-max">Modes avec recherches maximales dès le départ</h2>
            <p>Dans <strong>Search &amp; Destroy, Domination et Battle Royale</strong>, toutes vos recherches démarrent au niveau maximum — le menu Recherche est masqué, pour jouer directement sur la partie militaire.</p>
            <p>Votre planète de départ reçoit alors un <strong>kit de départ</strong> :</p>
            <ul>
                <li><strong>500 uranium</strong> pour personnaliser rapidement.</li>
                <li><strong>Tous vos points de vaisseaux débloqués</strong> dès le jour 1 (1&nbsp;375 points d'un coup au lieu de 40/jour).</li>
            </ul>
            <p>En <strong>Search &amp; Destroy</strong>, un kit militaire plus gros est accordé pour permettre au VIP de tenir ses 72h : 2&nbsp;000 Légionnaires, 25 barges, 500 destroyers, 250 tourelles laser lourdes.</p>

            <h2 id="fin-de-serveur">Fin de serveur et archivage</h2>
            <p>Quand un serveur ferme, vos <strong>statistiques finales</strong> (points, héros, succès de VIP, victoires, etc.) sont archivées sur votre <strong>compte joueur</strong>. Votre commandeur (le personnage de cette partie) est supprimé, mais votre historique reste.</p>

    cthulhus:
        title: "La menace Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,ruche,horde,garnison,siege,menace,pve,uranium,tower defense,td"
        summary: "Les Cthulhu massent de vraies hordes qui voyagent à découvert avant d'attaquer vos planètes. Comment vous en défendre, comment leurs bases se défendent aussi, et le Tower Defense pour repousser l'assaut."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">C'est quoi, les Cthulhu ?</h2>
            <p>Les <strong>Cthulhu</strong> (les Possédés) sont les créatures hostiles contrôlées par le jeu (PvE). Elles tiennent des <strong>bases de la ruche</strong> disséminées dans la galaxie, d'où partent des <strong>hordes</strong> : de vraies flottes, avec une composition, une puissance et un trajet visibles — pas un simple compte à rebours.</p>
            <p>Plus vous les repoussez, plus la <strong>menace globale</strong> monte, et plus les attaques suivantes sont fortes.</p>

            <h2 id="menace">Le niveau de menace</h2>
            <p>À chaque victoire contre une invasion Cthulhu, le niveau de menace sur votre empire augmente. Les gains sont plus importants en difficulté élevée et selon votre régime d'alliance :</p>
            <table>
                <tr><th>Difficulté</th><th>Sans alliance</th><th>Alliance Marteau des Étoiles</th><th>Autre alliance</th></tr>
                <tr><td>Facile</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Difficile</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p>Le <strong>Marteau des Étoiles</strong> réduit la progression de menace (le régime défensif est plus tranquille face aux Cthulhu).</p>
            <p>La menace <strong>remonte aussi toute seule</strong> : +5 à chaque rapport quotidien de l'Empire, et +1 par heure tant qu'une horde reste en orbite de l'une de vos planètes avant de débarquer (plafonnée à 300, et seulement après votre premier contact avec les Cthulhu). Gagner un Tower Defense la <strong>divise par 2</strong> : un joueur assidu la garde donc basse, un joueur qui la laisse filer s'expose à des hordes toujours plus grosses.</p>

            <h2 id="puissance">Puissance des invasions</h2>
            <p>La puissance d'une invasion Cthulhu dépend :</p>
            <ul>
                <li>du <strong>niveau de menace</strong> accumulé ;</li>
                <li>de la <strong>difficulté</strong> choisie ;</li>
                <li>de la <strong>terraformation</strong> de la planète visée.</li>
            </ul>
            <p>En <strong>Facile</strong>, la puissance d'attaque est divisée par 2. En <strong>Difficile</strong>, elle est boostée.</p>

            <h2 id="horde">L'attaque : une horde bien réelle</h2>
            <p>Une attaque commence toujours par un <strong>rassemblement</strong> : la horde se masse en orbite d'une base de la ruche pendant <strong>6 heures</strong> (12 heures pour une horde Boss) avant de s'élancer.</p>
            <p>Une fois en route, elle vole à <strong>vitesse de horde</strong> — lente, largement visible au <strong>radar</strong> — et une <strong>alerte est garantie 1 heure avant son arrivée</strong>, quelle que soit votre couverture radar.</p>
            <p>C'est une <strong>vraie flotte</strong> : vous pouvez la détruire à tout moment — en formation au-dessus de sa base, en plein vol, une fois arrivée en orbite de votre planète, ou en gagnant le <strong>Tower Defense</strong> (jouable dès qu'elle est planifiée ou déjà active). La détruire annule l'attaque, quel que soit le moment.</p>
            <p>À l'arrivée, un <strong>combat orbital</strong> se joue (vos flottes et vos tourelles contre la horde). Les survivants débarquent <strong>2 heures plus tard</strong> pour l'assaut au sol. Plusieurs hordes peuvent être en formation ou en vol simultanément, avec une composition aléatoire.</p>
            <p>Seule exception : l'<strong>infiltration</strong> (débloquée niveau 200+) reste <strong>instantanée et invisible</strong> — aucun rassemblement, aucun préavis.</p>

            <h3>Si vos défenses l'emportent</h3>
            <table>
                <tr><th></th><th>Facile</th><th>Normal</th><th>Difficile</th></tr>
                <tr><td>Pertes de Légionnaires</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                <tr><td>Pertes de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                <tr><td>Pertes de travailleurs</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
            </table>
            <p>Vous gagnez des <strong>PDG</strong> et une chance de <strong>drop d'item</strong>.</p>

            <h3>Si la horde l'emporte au sol</h3>
            <p>Le pillage et la capture sont <strong>proportionnels à ce qu'il reste de la horde</strong> après le combat orbital : une horde à moitié détruite pille moitié moins. Sous <strong>90&nbsp;% de survie</strong>, elle n'a plus assez de troupes pour capturer la planète, même en difficulté Difficile.</p>
            <table>
                <tr><th></th><th>Facile</th><th>Normal</th><th>Difficile</th></tr>
                <tr><td>Pillage de ressources (horde intacte)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planète capturée (si ≥ 90&nbsp;% de survie)</td></tr>
                <tr><td>Réduction de menace après défaite</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>En <strong>Difficile</strong>, sans assez de survivants pour capturer, le pillage retombe au taux <strong>Normal</strong> (70&nbsp;%), multiplié par le ratio de survie de la horde. Si la planète est capturée et que c'était votre dernière, c'est le Game Over.</p>

            <h2 id="bases">Les bases de la ruche</h2>
            <p>La ruche tient des <strong>bases</strong> disséminées dans la galaxie : les bases d'origine de la ruche (jusqu'à 36 par galaxie, de puissance croissante — leurs noms vont de « Cthulhu I » pour les avant-postes aux redoutables « Cthulhu V ») et d'anciennes planètes converties par une expansion ou une éruption. Chacune est protégée par une <strong>garnison permanente</strong> qui se reconstitue en <strong>24 heures</strong> si elle est entamée.</p>
            <p>Masser une flotte joueur en orbite d'une base (signature cumulée d'au moins <strong>10&nbsp;000</strong>) déclenche un <strong>siège</strong> : la base assiégée n'envoie plus de hordes (elles partent d'une base plus lointaine), des <strong>vagues de défense</strong> montent en puissance (+25&nbsp;% toutes les 2 heures), et après <strong>6 heures</strong> les autres bases envoient des <strong>flottes de secours</strong> en renfort. Une base assiégée porte le badge <strong>« Base assiégée »</strong> sur la carte galactique. Une fois le siège levé, les secours rentrent chez eux et la base retrouve une garnison normale.</p>
            <p>Quand le siège est levé, chaque participant est payé <strong>au prorata de la signature détruite</strong> : 0,02 bitcoin par point, plus des points de guerre.</p>

            <h2 id="liberation">Libérer une base</h2>
            <p>Envahir avec succès une base de la ruche — y compris désormais les bases alien « Cthulhu I » à « V » — donne les récompenses habituelles (uranium, chance de drop d'item) <strong>et</strong> fait reculer la <strong>Menace de l'univers</strong> de <strong>50 points</strong>, retardant la prochaine prophétie de Cthulhu (voir l'article <em>Les prophéties de Cthulhu</em>). Une planète ainsi libérée est <strong>protégée 72 heures</strong> : la ruche ne peut ni la recoloniser ni y faire éruption pendant ce délai. Si la planète libérée était à l'origine une planète de joueur — capturée par la ruche, convertie après une invasion perdue, abandonnée, ou née d'une expansion ou d'une éruption — elle reste colonisable, et votre rapport de libération vous donne la date limite pour y envoyer un colonisateur. Les avant-postes d'origine de la ruche (« Cthulhu I » à « V »), eux, restent inexploitables une fois libérés : la planète reste libre, mais vous ne pouvez pas y envoyer de colonisateur, et aucune date limite n'est annoncée.</p>
            <p>À l'inverse, perdre une invasion contre une base alien fait désormais aussi monter votre <strong>menace personnelle de 10 points</strong>, comme contre une base Cthulhu classique.</p>

            <h2 id="expansion">Expansion et éruption</h2>
            <p>La ruche s'étend toute seule : quand la <strong>Menace de l'univers</strong> atteint <strong>300 points</strong>, une <strong>nuée de spores</strong> part d'une base existante tous les <strong>3 jours</strong> (tous les jours si la menace dépasse <strong>500</strong>) vers une planète inhabitée proche de joueurs — jusqu'à <strong>36 bases par galaxie</strong>. C'est une flotte comme une autre : <strong>interceptable en vol</strong>. Si elle arrive, elle fonde une nouvelle base avec sa garnison, et les joueurs à <strong>5 secteurs ou moins</strong> reçoivent un rapport.</p>
            <p>Éradiquer <strong>toutes</strong> les bases ne l'élimine pas pour de bon : après <strong>48 heures de silence</strong>, une <strong>éruption</strong> fait resurgir une base ailleurs, avec un rapport aux joueurs proches. Cette éruption ne peut jamais tomber à <strong>moins de 8 secteurs</strong> d'une planète de joueur, ni sur une planète encore sous son répit de libération : la ruche renaît dans le vide, pas sur vos terres. Si aucun secteur assez isolé n'est disponible, l'éruption est simplement repoussée au prochain créneau.</p>

            <h2 id="changement-difficulte">Changer de difficulté</h2>
            <p>Vous pouvez modifier la difficulté PvE depuis vos <strong>options</strong>. Attention : un <strong>cooldown de 72 h</strong> s'applique entre deux changements — pas de va-et-vient pour esquiver les grosses attaques.</p>

            <h2 id="tower-defense">Le Tower Defense (TD)</h2>
            <p>Le <strong>Tower Defense</strong> est un mini-jeu de défense active. Il est jouable dès qu'une horde est <strong>planifiée</strong> (en formation sur sa base) ou déjà <strong>active</strong> (en vol ou en orbite) : vous pouvez le lancer pour l'anéantir avant qu'elle ne fasse des dégâts. C'est interactif : vous placez vos défenses sur une grille et affrontez des vagues de monstres Cthulhu en temps réel.</p>
            <p>Astuce : pour poser plusieurs défenses d'affilée (unités, murs, barbelés), <strong>maintenez et glissez</strong> — le tracé se verrouille automatiquement en <strong>ligne droite</strong> (horizontale ou verticale) et toutes les cases traversées sont remplies, sans trou même en allant vite.</p>
            <p>La difficulté du TD est votre niveau <strong>PvE</strong> (réglable dans vos préférences). Le <strong>tutoriel</strong> est un entraînement : il ne rapporte rien et ne coûte rien. Une fois la première vague lancée, quitter la partie compte comme un <strong>abandon</strong> (défaite).</p>
            <p>Une <strong>brume</strong> dérive sur l'arène, plus dense autour des failles et quand un boss approche. Elle passe sous vos défenses et les monstres : elle ne cache rien. Le bouton <strong>Brume</strong> du dock la coupe si votre appareil peine.</p>

            <h3>Résultat possible</h3>
            <ul>
                <li><strong>Victoire</strong> — la horde active est détruite, l'attaque est annulée. Vous gagnez de l'uranium, la menace baisse (÷2). Cooldown de 6h avant de refaire un TD.</li>
                <li><strong>Défaite</strong> — récompenses partielles ; si la horde avait déjà débarqué, le combat au sol se joue immédiatement.</li>
                <li><strong>TD non joué</strong> — la horde suit son cours normal : rassemblement, vol, arrivée, débarquement.</li>
            </ul>

            <h3>Rapport de fin de partie</h3>
            <p>À la fin de chaque Tower Defense (victoire ou défaite), un <strong>rapport</strong> est archivé dans l'onglet <strong>Cthulhu</strong> de vos rapports : vagues survécues, score, uranium récolté, réduction de menace, pertes par type d'unité et ennemis tués par type. Pratique pour comparer vos parties.</p>

            <h3>Comment on y joue</h3>
            <ul>
                <li>Choisissez une difficulté : Facile, Normal ou Difficile.</li>
                <li>Placez vos unités sur la grille. Le <strong>QG est au centre</strong> ; les monstres émergent de <strong>1 à 4 failles Cthulhu</strong> ouvertes en bord de plateforme.</li>
                <li>Les monstres traversent la grille pour atteindre votre QG : attaquez-les en chemin.</li>
                <li><strong>Murs</strong> (150 en Facile, 125 en Normal, 75 en Difficile) : les monstres les contournent — chaque faille garde toujours un chemin vers le QG (un mur qui la scellerait est refusé). Les tours, elles, ne bloquent pas le chemin : un monstre qui bute dessus s'arrête et la détruit.</li>
                <li><strong>Barbelés</strong> (30/20/10 selon la difficulté, recherche Barbelé requise) : ne bloquent pas, mais blessent et ralentissent les monstres qui les traversent.</li>
                <li><strong>Placement mémorisé</strong> : votre disposition (tours, murs, barbelés) est sauvegardée pour chaque serveur et re-proposée au début de chaque partie.</li>
                <li>Les grosses vagues arrivent <strong>par groupes</strong> (jusqu'à 20 monstres simultanés) : une vague ne s'étale jamais sur plus de ~2 minutes.</li>
                <li><strong>Défaite immédiate</strong> : si tous les ennemis d'une vague franchissent vos défenses et atteignent le QG, la partie est perdue sur-le-champ — impossible de gagner sans poser de défenses efficaces (surtout en difficulté Facile).</li>
                <li>Entre les vagues, les travailleurs réparent automatiquement les tourelles endommagées.</li>
                <li>Vitesse réglable de ×1 à ×10, avec pause possible.</li>
                <li><strong>Enchaîner les vagues</strong> : une option de la barre supérieure lance automatiquement la vague suivante dès la fin de chaque vague, sans repasser par la préparation et en conservant votre vitesse, jusqu'à la victoire ou la défaite. Désactivez-la en cours de vague pour retrouver la pause de préparation à la fin de celle-ci. Indisponible dans le tutoriel.</li>
                <li>Le combat fait <strong>20 vagues maximum</strong>, de plus en plus intenses.</li>
                <li><strong>Interface</strong> : barre supérieure plein largeur (pill QG + barre HP, compteur de vague circulaire, score, bouton « Démarrer », et icônes son / musique / infos unités / grille / enchaînement des vagues à droite), panneau « Unités » à droite avec grille 2 colonnes de cards verticales (icône + nom + stock + stats). Pas de menu latéral ni de footer pendant la partie : toute la largeur de l'écran est dédiée à la map.</li>
            </ul>

            <h3>Vos unités pour le TD</h3>
            <p>Vos unités de planète (Légionnaires, Mechas, tourelles) sont converties en unités TD selon un <strong>ratio de conversion</strong>. Chaque type d'unité a un nombre maximum plaçable, pour forcer la diversité tactique.</p>

            <h3>Les monstres que vous affrontez</h3>
            <ul>
                <li><strong>Profond</strong> — le monstre de base. Rien d'exceptionnel, mais ils arrivent en nombre.</li>
                <li><strong>Guetteur</strong> — très rapide mais fragile. À intercepter vite.</li>
                <li><strong>Shoggoth</strong> — lent, massif, lourdement blindé. Difficile à descendre.</li>
                <li><strong>Étoile vampirique</strong> — tire des projectiles à distance sur vos défenses.</li>
                <li><strong>Flagelleur mental</strong> — peut <strong>convertir vos Légionnaires en monstres</strong> (effet visuel de conversion), un au plus par seconde, et plus aucun une fois mortellement touché.</li>
                <li><strong>Boss Cthulhu</strong> — énorme, rare (Normal/Difficile, menace élevée). Invoque des Profonds autour de lui.</li>
            </ul>

            <h3>Mécaniques utiles à connaître</h3>
            <ul>
                <li>Les unités et monstres ont des <strong>tailles différentes</strong> sur la grille (Légionnaire 1×1, Mecha 2×1, tourelle 2×2, Boss 2×2).</li>
                <li>La <strong>barre de vague</strong> affiche le nombre d'ennemis restants.</li>
                <li>Si vous rafraîchissez la page, la partie <strong>reprend exactement où vous l'aviez laissée</strong>.</li>
                <li>Une partie sauvegardée doit être <strong>reprise</strong> avant d'en commencer une nouvelle.</li>
            </ul>

            <h3>Récompenses et pertes</h3>
            <ul>
                <li><strong>Victoire</strong> : réduction de menace + uranium + horde détruite.</li>
                <li><strong>Défaite</strong> : récompenses partielles ; si la horde était déjà arrivée, le débarquement a lieu immédiatement.</li>
                <li><strong>Les pertes d'unités sont réelles</strong> dans tous les cas (Légionnaires morts dans le TD = morts pour de vrai).</li>
            </ul>

            <h3>Classement TD</h3>
            <p>Un classement par serveur garde en mémoire les <strong>meilleurs scores</strong> au Tower Defense. Un autre tableau de chasse à conquérir.</p>

    events:
        title: "Événements spéciaux"
        category: "events"
        order: 3
        tags: "evenement,total war,alliance arena,raiders"
        summary: "Des événements ponctuels animent la vie du serveur : bonus, défis, compétitions inter-alliances."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Certains modes de serveur (Long Run, Short Run) déclenchent régulièrement des <strong>événements spéciaux</strong>. Ils durent quelques heures ou quelques jours, et modifient temporairement les règles pour pimenter la partie.</p>
            <p>Le calendrier est <strong>déterministe</strong> : vous pouvez anticiper chaque événement, planifier votre stratégie en conséquence.</p>

            <h2 id="liste">Les événements que vous pouvez rencontrer</h2>
            <table>
                <tr><th>Événement</th><th>Ce qui se passe</th></tr>
                <tr><td><strong>Total War</strong></td><td>Guerre totale généralisée — toutes les alliances peuvent s'attaquer librement.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Bonus de production militaire : recruter et fabriquer plus vite.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>Des vagues d'ennemis PNJ attaquent les serveurs. Défendez-vous ou ripostez.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Protégez les marchands menacés. Récompenses si vous sauvez les PNJ.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Envahissez des planètes Cthulhu pour des récompenses en uranium.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Attaquez les flottes Cthulhu pour gagner des PDG.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Période de bonus à la destruction de flottes ennemies.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Capacité de recyclage temporairement augmentée. Moment idéal pour nettoyer les débris.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Compétition entre alliances : combats classés et récompenses collectives.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Affrontement entre serveurs différents. Le meilleur serveur l'emporte.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Vague Cthulhu intense prévue — préparez vos défenses.</td></tr>
            </table>

            <h2 id="ou">Où voir le calendrier ?</h2>
            <p>Page <strong>Événements</strong> (menu de gauche sur les modes concernés). Vous y verrez la liste des événements à venir, leurs dates et leurs effets.</p>

            <h2 id="strategie">Comment en tirer parti</h2>
            <ul>
                <li><strong>Préparez-vous</strong> à l'avance : construisez votre armée avant un Total War, vos recycleurs avant un bonus Recycling.</li>
                <li><strong>Discutez en salon</strong> : un événement est une occasion de coordonner avec votre alliance.</li>
                <li><strong>Profitez des bonus</strong> : ne lancez pas une grosse production en dehors d'un Product Army si vous pouvez attendre.</li>
            </ul>

    alliance_arena:
        title: "Arène Alliance"
        category: "events"
        order: 9
        tags: "alliance,arene,bracket,pvp,evenement,tournoi,secteur,planete,flotte,base,historique,spectateur"
        summary: "Événement récurrent tous les 3 jours : ton alliance affronte les autres dans une bataille de secteur — flottes dupliquées, planètes à tenir — pour remplir la banque commune et empocher un bonus perso."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Quand ça démarre</h2>
            <p>L'événement revient <strong>tous les 3 jours</strong> sur les serveurs concernés. Calendrier d'une journée d'arène (heures Europe/Paris) :</p>
            <ul>
                <li><strong>08:00</strong> — annonce sur le salon Univers (toutes langues) et <strong>ouverture des inscriptions</strong>, avec notification aux membres d'alliance.</li>
                <li><strong>18:45</strong> — fermeture des inscriptions : la composition du tableau est figée.</li>
                <li><strong>19:00</strong> — premier tour. Les tours suivants partent à <strong>19:15</strong> et <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — fin des combats, distribution des récompenses.</li>
            </ul>
            <p>Si moins de <strong>2 alliances</strong> sont inscrites au global à 19:00, l'événement est annulé et un broadcast prévient tout le monde.</p>

            <h2 id="inscription">S'inscrire</h2>
            <p>Quand les inscriptions ouvrent, une <strong>modal s'ouvre automatiquement</strong> sur ton interface. Tu peux aussi y accéder depuis l'onglet Arène de ta page Alliance.</p>
            <p>Conditions :</p>
            <ul>
                <li>Être membre d'une alliance.</li>
                <li>Avoir au moins <strong>1 vaisseau d'attaque</strong> (au sol ou en flotte) au moment du spawn (19:00).</li>
            </ul>
            <p>Tu peux te désinscrire jusqu'à 19:00. Si tu n'as plus aucun vaisseau d'attaque à 19:00 (perdus en combat réel entre l'inscription et le spawn), tu es automatiquement déclaré forfait — ton alliance continue sans toi.</p>
            <p><strong>Commandants IA</strong> : les commandants IA de ton alliance suivent ton inscription — dès qu'un membre humain est inscrit, jusqu'à 4 d'entre eux rejoignent le bloc à ses côtés (5 inscrits maximum par alliance). Les alliances entièrement IA s'inscrivent aussi pour compléter le tableau.</p>

            <h2 id="combat">Comment ça se passe</h2>
            <p>Chaque match se joue dans un <strong>secteur créé pour l'occasion</strong>, affiché comme la carte spatiale : une grille de 5 × 5 où <strong>2 à 4 alliances</strong> s'affrontent. Chaque alliance part de sa <strong>base</strong>, au milieu d'un bord du secteur.</p>
            <p>Tes vaisseaux sont <strong>dupliqués</strong> pour l'arène : rien de ce que tu possèdes n'est risqué. Aucune perte réelle, aucun débris, aucun héros capturé.</p>
            <ul>
                <li>Un match dure <strong>15 minutes</strong> au plus.</li>
                <li>La première alliance à <strong>300 points</strong> l'emporte ; sinon, le meilleur score à la fin du temps. En cas d'égalité : le plus de planètes tenues, puis le plus de dégâts infligés.</li>
                <li>Une seule alliance par secteur passe au tour suivant. Tableau à élimination directe sur 3 tours au plus ; le vainqueur du dernier match est champion du serveur.</li>
            </ul>

            <h2 id="flotte">Ta flotte</h2>
            <p>Tu pars avec <strong>une seule flotte</strong>, faite de tous tes vaisseaux d'attaque — ceux au sol comme ceux de tes flottes — et de ton héros principal.</p>
            <ul>
                <li><strong>Envoyer</strong> : choisis ta flotte, touche une planète, puis valide. La durée du vol est annoncée avant le départ, et un vol ne s'annule pas.</li>
                <li><strong>Diviser</strong> : détache une partie de tes vaisseaux dans une nouvelle flotte (4 flottes au plus). Une flotte vole à la vitesse de son vaisseau le plus lent : une escadre de chasseurs seule va trois fois plus vite qu'une flotte qui traîne des cuirassés.</li>
                <li><strong>Regrouper</strong> : deux de tes flottes en orbite de la même planète peuvent fusionner.</li>
            </ul>
            <p>Quand deux alliances se retrouvent sur la même planète, le combat se résout <strong>5 secondes</strong> plus tard — le temps pour des renforts d'arriver — avec les <strong>mêmes règles que le combat spatial</strong> du jeu. Une flotte engagée ne peut plus partir avant la fin du combat.</p>
            <p>Une flotte détruite n'est pas perdue : elle <strong>se reforme à ta base</strong>, effectif plein, après 45 secondes — 15 de plus à chaque nouvelle destruction, 2 minutes au plus. Chaque flotte ennemie détruite rapporte <strong>5 points</strong> à ton alliance.</p>
            <p><strong>Les commandants IA se battent vraiment</strong> : ils vont prendre les planètes libres, évitent les combats perdus d'avance et rentrent se réparer. Si tu n'ouvres pas l'écran du match et ne donnes aucun ordre pendant une minute, le pilote automatique joue aussi pour toi — tu reprends la main dès que tu reviens.</p>

            <h2 id="planetes">Planètes et points</h2>
            <p>Une alliance <strong>seule</strong> sur une planète qui n'est pas à elle la capture après <strong>15 secondes</strong> ; un ennemi qui arrive remet le compteur à zéro. La planète <strong>reste à ton alliance</strong> quand tes flottes repartent, jusqu'à ce qu'une autre la reprenne. C'est tout le dilemme : s'étaler pour marquer, ou se grouper pour gagner les combats.</p>
            <p>Toutes les <strong>10 secondes</strong>, chaque planète tenue rapporte des points :</p>
            <table>
                <tr><th>Planète</th><th>Points</th><th>En plus</th></tr>
                <tr><td><strong>Monde</strong> (4 par secteur)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Chantier</strong></td><td>1</td><td>Répare tes flottes en orbite : 10&nbsp;% de l'effectif à chaque période.</td></tr>
                <tr><td><strong>Nexus</strong> (au centre)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Chaque point marqué par une planète verse aussi des <strong>PDG à la banque de ton alliance</strong> à la fin du match : 3 PDG par point au tour 1, 8 au tour 2, 15 au tour 3 — que tu gagnes le match ou non. Les points des flottes détruites et des bases saccagées ne rapportent pas de PDG.</p>

            <h2 id="bases">Les bases</h2>
            <p>Ta base est ton point de départ et de reformation ; tes flottes s'y réparent (5&nbsp;% par période). Elle ne se capture pas, mais elle <strong>se saccage</strong>.</p>
            <p>Une base est défendue par les <strong>défenses planétaires de toutes les planètes des joueurs de l'alliance engagés dans le match</strong>, mises en commun : elle est difficile à prendre. Une attaque repoussée l'abîme quand même, et elle se répare de 10&nbsp;% par période.</p>
            <p>Si la défense tombe, la base est saccagée : <strong>50 points</strong> pour l'attaquant, ses flottes rentrent d'office chez elles, et la base devient intouchable pendant 2 minutes.</p>

            <h2 id="recompenses">Récompenses</h2>
            <p>Deux types de récompenses cumulables.</p>
            <h3 id="banque">Banque alliance</h3>
            <table>
                <tr><th>Tour atteint</th><th>Bitcoin</th><th>PDG</th></tr>
                <tr><td>Perdants tour 1</td><td>50 000</td><td>1 000</td></tr>
                <tr><td>Perdants tour 2</td><td>150 000</td><td>3 000</td></tr>
                <tr><td>Perdants tour 3</td><td>350 000</td><td>8 000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>1 000 000</strong></td><td><strong>25 000</strong></td></tr>
            </table>
            <h3 id="perso">Bonus individuel</h3>
            <p>Versé direct sur ton portefeuille perso, à condition d'avoir <strong>donné au moins un ordre toi-même</strong> pendant le match : si le pilote automatique a joué tout le match à ta place, pas de bonus.</p>
            <table>
                <tr><th>Tour atteint</th><th>Bitcoin perso</th></tr>
                <tr><td>Perdants tour 1</td><td>5 000</td></tr>
                <tr><td>Perdants tour 2</td><td>15 000</td></tr>
                <tr><td>Perdants tour 3</td><td>30 000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>50 000</strong></td></tr>
            </table>
            <p>Tu cumules le bonus de tous les tours atteints. Champion = 5 000 + 15 000 + 30 000 + 50 000 = <strong>100 000 Bitcoins</strong> sur ton portefeuille, en plus des PDG que tes planètes tenues ont rapportés à la banque.</p>

            <h2 id="rapports">Rapports de combat</h2>
            <p>À la fin de chaque match, chaque joueur reçoit un <strong>rapport</strong> dans sa page Rapports : résultat, score de ton alliance et de chaque adversaire, planètes tenues, bases saccagées, tes dégâts infligés et encaissés, les flottes ennemies détruites par les tiennes et celles que tu as perdues, ton effectif restant, ton rang en dégâts parmi les pilotes de ton alliance — avec le titre de <strong>MVP du match</strong> pour le premier — et les PDG versés à la banque.</p>
            <p>À la fin du tournoi, un <strong>récapitulatif personnel</strong> s'y ajoute : parcours de ton alliance dans le tableau, bilan des matchs, ta contribution totale et le détail de tes gains (bonus perso, banque d'alliance, territoires tenus).</p>

            <h2 id="suivi">Suivre l'événement depuis l'onglet Arène</h2>
            <p>L'onglet <strong>Arène</strong> de ta page Alliance affiche en permanence l'état réel de l'événement : pas d'arène en cours, prochaine arène à venir (avec un décompte jusqu'à l'annonce), annoncée, inscriptions ouvertes ou closes, arène en cours, ou terminée. Un décompte indique le temps restant avant la prochaine étape (fermeture des inscriptions, début des combats, tour suivant), et un encadré montre combien de membres de ton alliance sont déjà inscrits sur l'effectif total.</p>
            <p>Une fois l'arène terminée, l'onglet garde aussi le <strong>palmarès</strong> de ton alliance (nombre d'arènes jouées, titres de champion, meilleur tour atteint, bilan victoires/défaites) et l'historique des dix dernières éditions jouées sur ton serveur, avec le résultat de ton alliance et les récompenses obtenues à chacune.</p>

            <h2 id="spectateur">Mode spectateur</h2>
            <p>Tu n'es pas inscrit à l'arène en cours ? Tu peux quand même suivre en direct les matchs de <strong>ton alliance</strong> depuis l'onglet Arène : le secteur s'affiche exactement comme pour un pilote, mais tu ne peux donner aucun ordre.</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li><strong>Prends le Nexus tôt</strong> : il rapporte autant que trois mondes. Mais tout le monde le sait.</li>
                <li><strong>Détache tes chasseurs</strong> : une escadre rapide capture les mondes pendant que ta flotte lourde tient le centre.</li>
                <li><strong>Arrive groupé</strong> : des flottes arrivées dans les mêmes 5 secondes se battent ensemble ; une flotte isolée se fait détruire et offre 5 points.</li>
                <li><strong>Garde un chantier</strong> : y repasser répare tes flottes deux fois plus vite qu'à la base.</li>
                <li><strong>Ne campe pas</strong> : une planète capturée reste à toi quand tu repars. Va en prendre une autre.</li>
                <li><strong>Une base se prend à plusieurs</strong> : attaquer seul une base intacte, c'est offrir des points. À plusieurs alliés, dans la même fenêtre de 5 secondes, c'est 50 points d'un coup.</li>
                <li><strong>Donne au moins un ordre</strong> : sans ordre de ta main, pas de bonus individuel.</li>
            </ul>

            <h2 id="mobile">Sur mobile</h2>
            <p>L'arène se joue au doigt sur mobile :</p>
            <ul>
                <li><strong>Orientation paysage</strong> forcée à l'entrée du match dans l'application mobile. Dans un navigateur mobile, où le jeu ne peut pas forcer l'écran, un message t'invite à tourner l'appareil.</li>
                <li><strong>Tout le secteur tient à l'écran</strong> : ni zoom ni caméra à gérer.</li>
                <li><strong>Trois touchers pour un ordre</strong> : ta flotte (dans la barre du bas, ou en touchant sa planète), la planète de destination, puis le bouton « Envoyer ».</li>
                <li><strong>Le cadre et le tag</strong> de chaque planète disent à qui elle est ; les chiffres dans ses coins donnent les forces en orbite, les tiennes en vert, celles de l'ennemi en rouge.</li>
                <li><strong>Bouton ⓘ</strong> : le détail de la planète choisie et le journal des combats.</li>
                <li><strong>Push notif</strong> : une alerte à l'ouverture des inscriptions (08:00), avec l'heure limite et l'heure des combats.</li>
            </ul>

    ia_bots:
        title: "Commandants IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,intelligence artificielle,pnj,bot,pilote automatique"
        summary: "Certains serveurs incluent des commandants contrôlés par IA. Comment ils se comportent, et pourquoi."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Pourquoi des IA ?</h2>
            <p>Sur certains serveurs, quelques commandants ne sont pas des joueurs humains mais des <strong>intelligences artificielles</strong>. Ils permettent :</p>
            <ul>
                <li>de <strong>peupler le serveur</strong> quand il y a peu de joueurs actifs ;</li>
                <li>d'offrir des <strong>cibles intéressantes</strong> aux joueurs qui cherchent des combats ;</li>
                <li>de simuler une diplomatie vivante avec propositions, trahisons et alliances crédibles.</li>
            </ul>

            <h2 id="comportement">Comment ils se comportent</h2>
            <p>Chaque bot a :</p>
            <ul>
                <li>une <strong>personnalité</strong> (agressif, pacifique, opportuniste…) ;</li>
                <li>une <strong>humeur</strong> qui évolue selon les événements ;</li>
                <li>un <strong>archétype stratégique</strong> (économiste, militariste, explorateur…).</li>
            </ul>
            <p>Ils jouent vraiment : ils construisent, recherchent, attaquent, forment des alliances, trahissent parfois. Ils peuvent être vos alliés comme vos pires ennemis.</p>
            <p>Ils grandissent <strong>chaque jour au rythme des joueurs actifs</strong> du serveur (un peu plus vite que la médiane), sans jamais dépasser <strong>90 % du meilleur joueur</strong>. Ce qu'ils perdent au combat est perdu pour de bon : si un joueur détruit leur garnison, ils ne la reconstruisent pas sur cette planète pendant <strong>7 jours</strong> et renforcent plutôt leurs tourelles.</p>
            <p><strong>Où dort leur flotte.</strong> Les IA militaristes et exploratrices gardent une garnison en orbite de leurs planètes. Les autres, plus prudentes, gardent leurs vaisseaux <strong>au sol</strong>, comme beaucoup de joueurs, et ne les sortent que pour se défendre&nbsp;: si leur radar repère une flotte hostile en approche qu'elles peuvent battre, elles mettent leur flotte en orbite et font venir les vaisseaux de leurs planètes voisines qui arrivent à temps&nbsp;; face à une flotte trop forte, elles envoient la leur se poser sur une autre de leurs planètes. Elles rejoignent aussi un combat déjà engagé au-dessus de leur planète, ou attaquent une flotte armée garée en orbite, quand elles peuvent gagner. Comme un joueur, une IA endormie ne réagit pas, et une flotte masquée par un brouilleur la prend par surprise. Elles ne laissent jamais leurs vaisseaux au sol d'une planète sans tourelles, qu'une invasion prendrait avec eux&nbsp;: ils vont se poser sur leur planète la mieux défendue, qui est aussi leur premier refuge.</p>
            <p><strong>Leur commerce.</strong> Elles vendent leurs surplus et la cargaison de leurs recycleurs au marchand le plus proche, sauf s'il est sous blocus ou gardé par une flotte hostile en mode attaque, qui détruirait leur convoi à l'arrivée&nbsp;: elles vont alors chez le suivant.</p>

            <h2 id="reconnaitre">Comment les reconnaître</h2>
            <p>Les bots apparaissent dans le classement comme des joueurs normaux. Leur comportement est cohérent mais un œil averti repère souvent les patterns : réponses très rapides aux messages d'alliance, horaires de connexion atypiques, diplomatie mécanique.</p>

            <h2 id="strategie">Jouer avec eux</h2>
            <ul>
                <li>Ne sous-estimez pas un bot : certains sont de vraies terreurs militaires.</li>
                <li>Un bot peut parfaitement vous inviter en alliance, coopérer, puis vous attaquer si la situation change.</li>
                <li>Côté immersion, traitez-les comme des joueurs : ça rend le serveur plus vivant.</li>
            </ul>

            <h2 id="pilote-automatique">Joueurs absents : le pilote automatique</h2>
            <p>Si un joueur ne se connecte plus pendant <strong>8 jours</strong>, son compte passe en <strong>pilote automatique</strong> : un bot <strong>muet</strong>, qui n'écrit jamais dans les salons ni par message privé. Ce pilote automatique <strong>ne joue pas à sa place</strong> : le compte ne lance aucune attaque, ne déplace ni n'engage vos flottes et ne colonise pas. Il se contente de poursuivre vos constructions et recherches et de renforcer lentement vos tourelles. Les autres commandants IA ne l'attaquent pas ; les autres joueurs, eux, le peuvent toujours. Vous pouvez toujours lui écrire un message privé : il le lira à son retour. Dès que le joueur se reconnecte, il reprend instantanément le contrôle de son compte, et retrouve ses flottes là où il les avait laissées.</p>

    cthulhu_prophecies:
        title: "Les prophéties de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,prophetie,blocus,menace,evenement,alliance,pdg,bitcoin,marchand,recyclage,classement"
        summary: "Quand la menace du serveur atteint son seuil, Possédés annonce une prophétie : 48 heures plus tard, ses hordes bloquent le commerce de tout le serveur. Comment lire la jauge, briser un blocus à plusieurs, et ce que coûte l'échec."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Qu'est-ce qu'une prophétie ?</h2>
            <p>Un <strong>pool de menace</strong> propre à votre serveur — distinct de votre propre menace personnelle contre les Cthulhu — monte automatiquement, jour après jour. Quand il atteint son seuil, <strong>Possédés</strong> publie une <strong>prophétie datée</strong> dans le salon public : un <strong>blocus</strong> va s'abattre sur tout le serveur dans les heures qui suivent. La prophétie annonce aussi ce qui est en jeu si personne ne réagit.</p>

            <h2 id="jauge">Lire la jauge de menace du serveur</h2>
            <ul>
                <li>Elle est visible sur la <strong>page Cthulhu</strong> (celle du Tower Defense) et progresse indépendamment de vos combats personnels.</li>
                <li>Elle monte de <strong>100 points par jour</strong> ; le seuil qui déclenche une prophétie est atteint en <strong>une semaine environ</strong>.</li>
                <li><strong>Possédés</strong> publie un <strong>bulletin quotidien</strong> dans le salon public avec le niveau atteint : de quoi anticiper.</li>
                <li>Le premier événement d'un serveur ne peut pas survenir avant ses <strong>deux premières semaines</strong> d'existence.</li>
                <li>Jamais deux prophéties (ni deux blocus) en même temps sur un même serveur : la jauge ne recommence à monter qu'une fois l'événement précédent terminé.</li>
            </ul>

            <h2 id="prophetie">L'annonce</h2>
            <p>Au franchissement du seuil, Possédés poste sa prophétie dans le salon : l'échéance tombe <strong>~48 heures plus tard</strong>. Le message annonce explicitement les enjeux — le blocus, la dîme, le classement des alliances, le sort des champs de ruines — pour que personne ne découvre les règles après coup.</p>

            <h2 id="blocus">Le blocus</h2>
            <p>À l'échéance, une <strong>horde Cthulhu</strong> se poste en orbite de <strong>chaque marchand</strong> et de <strong>chaque astéroïde</strong> du serveur :</p>
            <ul>
                <li><strong>Vente impossible</strong> à tout marchand bloqué.</li>
                <li><strong>Recyclage impossible</strong> sur tout astéroïde bloqué.</li>
                <li>Ailleurs dans l'univers, les <strong>champs de ruines restent recyclables normalement</strong>, comme après n'importe quel autre combat.</li>
                <li>Sur une cible bloquée, en revanche, les <strong>épaves de vos propres assauts s'accumulent sur place et restent hors de portée tant que la horde qui la garde est vivante</strong>. Détruisez-la et <strong>cette cible-là rouvre aussitôt</strong>, sans attendre le sort du blocus sur le reste du serveur : la vente ou le recyclage y reprennent, et vos recycleurs déjà en orbite s'y remettent tout seuls.</li>
                <li>Rien à voir avec l'embargo ou la famine qu'une flotte ennemie impose à une planète joueur : ici, seuls le commerce et le recyclage s'arrêtent.</li>
                <li>Le blocus dure au maximum <strong>48 heures</strong>.</li>
            </ul>

            <h2 id="briser">Briser un blocus à plusieurs</h2>
            <p>Toutes les hordes ne se valent pas. Celles qui gardent les <strong>marchands</strong> sont taillées bien au-dessus de la plus grande puissance de flotte du serveur (joueur ou bot) : personne ne les brise seul. Les garnisons des <strong>astéroïdes</strong>, beaucoup plus légères, restent à la portée d'une grosse flotte isolée — et ce sont elles qui font le gros du compteur. Dans tous les cas, une <strong>coalition</strong> qui frappe la même horde en assauts successifs finit par l'avoir.</p>
            <p>Les dégâts qu'une horde a subis <strong>ne se régénèrent jamais</strong> entre deux combats : chaque assaut, même perdu, l'affaiblit pour le suivant. Concentrez vos coups sur la même cible plutôt que d'égratigner plusieurs hordes à la fois.</p>

            <h2 id="recompenses">Récompenses</h2>
            <p>Chaque point de dégâts infligé à une horde est <strong>payé en Bitcoin et en Points de Guerre</strong> à la résolution de l'événement — que le blocus soit brisé ou non, aucun assaut n'est perdu pour rien.</p>
            <p>Le blocus est déclaré <strong>brisé</strong> dès que <strong>70 % des hordes du serveur ont été détruites avant l'échéance</strong>, marchands et astéroïdes confondus : le taux de récompense est alors <strong>doublé</strong> pour tous les contributeurs. Un rapport individuel détaille vos dégâts infligés et votre récompense à la fin de l'événement. Pendant le blocus, la <strong>page Cthulhu</strong> affiche la progression en direct : hordes détruites, objectif à atteindre et temps restant.</p>

            <h2 id="echec">Le prix de l'échec</h2>
            <p>Si le blocus <strong>expire sans être brisé</strong> :</p>
            <ul>
                <li><strong>Chaque joueur perd la moitié de son Bitcoin</strong> — les Possédés prélèvent leur dîme. Les joueurs sous <strong>protection débutant</strong> et les joueurs en game over sont épargnés.</li>
                <li><strong>Tous les champs de ruines de bataille de l'univers sont dévorés</strong> par les Cthulhu ; les <strong>astéroïdes</strong>, eux, restent intacts.</li>
                <li>Le <strong>coffre bitcoin de chaque alliance</strong> comptant au moins un joueur humain perd lui aussi la moitié de son contenu : déposer son Bitcoin au coffre avant l'échéance ne protège de rien. Le prélèvement apparaît dans l'historique du coffre.</li>
                <li>Les <strong>3 dernières alliances du classement</strong> perdent en plus de la production pendant 72 heures (voir ci-dessous).</li>
            </ul>
            <p>Chaque joueur touché reçoit un rapport détaillant le Bitcoin perdu. Ces enjeux sont toujours annoncés dans la prophétie : pas de règle cachée.</p>

            <h2 id="classement">Le classement des alliances</h2>
            <p>Pendant le blocus, chaque alliance est classée sur ce qu'elle fait contre la ruche. La <strong>page Cthulhu</strong> affiche le classement en direct, avec ce que votre alliance gagnerait ou perdrait si le blocus se terminait maintenant.</p>
            <ul>
                <li><strong>Points</strong> : les dégâts infligés à une <strong>flotte-mur</strong> comptent double ; les dégâts infligés à la ruche ailleurs (sièges de bases, hordes) comptent simple ; chaque <strong>victoire au Tower Defense</strong> vaut autant que détruire un quart de mur d'astéroïde.</li>
                <li><strong>Points par membre</strong> : le score est divisé par le nombre de membres actifs (connectés dans les 7 derniers jours, hors protection débutant). Les dégâts d'un débutant comptent quand même : recruter ne fait jamais baisser le score.</li>
                <li><strong>Appartenance figée</strong> au début du blocus : changer d'alliance pendant l'événement ne déplace ni les points, ni le bonus, ni le malus.</li>
                <li>Il faut au moins <strong>2 membres actifs</strong> pour être classée. Les <strong>joueurs sans alliance</strong> ne sont jamais concernés.</li>
            </ul>
            <p><strong>Blocus brisé</strong> : les 3 premières alliances gagnent <strong>+15 %, +10 % et +5 % de production</strong> pendant 72 heures, à condition d'avoir marqué des points. Aucune alliance n'est pénalisée.</p>
            <p><strong>Blocus subi</strong> : les 3 dernières alliances perdent <strong>15 %, 10 % et 5 % de production</strong> pendant 72 heures, en plus de la dîme. Jamais plus de la moitié des alliances classées n'est touchée, et une alliance qui a fourni l'effort minimum (l'équivalent d'un demi-mur d'astéroïde détruit, ou de deux victoires au Tower Defense, par membre actif) est épargnée, même dernière.</p>
            <p>Chaque membre reçoit un rapport qui explique le bonus ou le malus de son alliance et sa date de fin. Possédés annonce le début du blocus dans le salon, fait un rappel 6 heures avant l'échéance, puis nomme les alliances récompensées ou punies.</p>

            <h2 id="conseils">En pratique</h2>
            <ul>
                <li>Surveillez le <strong>bulletin quotidien</strong> de Possédés : il vous donne une idée du temps restant avant le seuil.</li>
                <li>Dès qu'une <strong>prophétie</strong> est annoncée, prévenez votre alliance : vous avez <strong>48 heures</strong> pour vous organiser avant que le blocus ne tombe.</li>
                <li>Concentrez les assauts sur les mêmes hordes plutôt que de les disperser : les dégâts persistent, mieux vaut en achever une que d'en égratigner plusieurs.</li>
                <li>Même un assaut perdu rapporte quelque chose : n'attendez pas d'être sûr de gagner pour attaquer.</li>
                <li>Pas assez de flotte pour attaquer un mur ? Une <strong>victoire au Tower Defense</strong> pendant le blocus rapporte aussi des points à votre alliance.</li>
            </ul>

    notifications:
        title: "Notifications push"
        category: "beginner"
        order: 10
        tags: "notification,push,alerte,mobile,navigateur,preference"
        summary: "Recevez une alerte sur mobile ou navigateur dès qu'un événement important se produit dans votre empire."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">À quoi ça sert ?</h2>
            <p>Area Universe se joue en continu : des flottes ennemies peuvent arriver pendant que vous êtes au travail. Les <strong>notifications push</strong> vous alertent en temps réel sur votre téléphone ou navigateur, pour que vous puissiez réagir à temps.</p>

            <h2 id="evenements">Ce que vous pouvez recevoir</h2>
            <ul>
                <li><strong>Recherche terminée</strong> — une technologie vient de s'achever.</li>
                <li><strong>Bâtiment terminé</strong> — votre file de construction est vide.</li>
                <li><strong>Production terminée</strong> — vos vaisseaux ou tourelles sont prêts.</li>
                <li><strong>Flotte arrivée à destination</strong> — votre flotte est sur place.</li>
                <li><strong>Flotte en combat</strong> — un combat spatial va se déclencher.</li>
                <li><strong>Flotte ennemie en approche</strong> — quelqu'un fonce vers une de vos planètes.</li>
                <li><strong>Planète sous attaque</strong> — invasion terrestre en cours.</li>
                <li><strong>Planète sous embargo</strong> — une de vos planètes est assiégée.</li>
                <li><strong>Frappe nucléaire reçue</strong> — une bombe s'est abattue sur vous.</li>
                <li><strong>Alliance en guerre</strong> — déclaration de guerre impliquant votre alliance.</li>
                <li><strong>Message privé / d'alliance</strong> — nouveau message reçu.</li>
                <li><strong>Héros capturé / libéré</strong> — événement prison.</li>
                <li><strong>Attaque Cthulhu</strong> — horde Cthulhu sur votre planète.</li>
            </ul>
            <p>Vous pouvez activer chaque type <strong>individuellement</strong> selon ce qui vous intéresse.</p>

            <h2 id="activation">Comment les activer</h2>
            <ol>
                <li>Ouvrez vos <strong>Préférences</strong> (menu profil).</li>
                <li>Onglet <strong>Notifications</strong>.</li>
                <li>Acceptez la demande de permission de votre navigateur ou téléphone.</li>
                <li>Cochez les types qui vous intéressent.</li>
            </ol>
            <p>Un bouton <em>Tout désactiver</em> permet de couper l'ensemble en un clic.</p>

            <h2 id="compatibilite">Où ça marche</h2>
            <ul>
                <li><strong>Application mobile</strong> : Android et iOS natifs.</li>
                <li><strong>Navigateur</strong> : Chrome, Firefox, Edge, Safari desktop. Pour Safari iOS, ajoutez le site à l'écran d'accueil (iOS 16.4+).</li>
                <li><strong>Multi-appareil</strong> : si vous êtes connecté sur téléphone + PC, les deux sonnent.</li>
            </ul>

            <h2 id="depannage">Le navigateur refuse l'inscription ?</h2>
            <p>Sur <strong>Brave</strong>, le service push de Google est désactivé par défaut. Ouvrez <code>brave://settings/privacy</code>, activez <strong>« Utiliser les services Google pour la messagerie push »</strong>, puis redémarrez complètement le navigateur. Sur les autres navigateurs, vérifiez qu'un VPN, un antivirus ou un DNS filtrant ne bloque pas le service de notifications.</p>

            <h2 id="mobile">Sur l'application mobile</h2>
            <p>Sur Android et iOS, la page <strong>Notifications</strong> comporte une section « Notifications de cet appareil » : activez ou désactivez les notifications push du téléphone à tout moment. Si elles sont bloquées, un bouton ouvre directement les réglages du téléphone. Vos préférences par type de notification s'appliquent à tous vos appareils.</p>

            <h2 id="discord">Sur Discord</h2>
            <p>Si votre compte Discord est lié (<strong>Mes options</strong>), l'alerte <strong>Flotte ennemie en approche</strong> vous arrive aussi en message privé sur Discord, avec l'heure d'arrivée et un lien vers la planète. Au plus un message par planète toutes les 30 minutes : une attaque à plusieurs flottes ne vous inonde pas. Il faut être membre du <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord d'Area Universe</a> et accepter les messages privés de ses membres. L'option est activée par défaut et se coupe dans la section <strong>Discord</strong> des préférences de notification.</p>

    glossary:
        title: "Glossaire"
        category: "beginner"
        order: 11
        tags: "glossaire,termes,definitions,vocabulaire,abreviations"
        summary: "Tous les termes et abréviations du jeu, expliqués en une phrase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Tous les termes du jeu</h2>
            <table>
                <tr><th>Terme</th><th>Définition</th></tr>
                <tr><td><strong>Barge</strong></td><td>Vaisseau de débarquement de Légionnaires pour les raids et invasions.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Monnaie principale du jeu. Générée par vos travailleurs.</td></tr>
                <tr><td><strong>Bloc</strong></td><td>Regroupement automatique de flottes alliées pendant un combat spatial.</td></tr>
                <tr><td><strong>Bunker</strong></td><td>Bâtiment défensif. Augmente la cap' de Légionnaires et protège une part de vos ressources contre les pillages.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Champ De Ressources : les débris laissés après un combat, recyclables.</td></tr>
                <tr><td><strong>Chantier spatial</strong></td><td>Bâtiment qui permet de fabriquer des vaisseaux.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Les créatures hostiles (ex-"zombies"). Apparaissent en mode PvE et sur les planètes aliens.</td></tr>
                <tr><td><strong>Cycle</strong></td><td>Rythme interne de production. 10 min pour une planète, 1 min pour une lune.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Niveau d'alerte d'alliance. Plus le chiffre est bas, plus la situation est tendue.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Siège d'une planète par une flotte ennemie en orbite. Provoque une famine.</td></tr>
                <tr><td><strong>Entretien</strong></td><td>Coût quotidien en Bitcoins de vos troupes, vaisseaux et bâtiments.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fin de partie : faillite économique, ou perte de toutes vos planètes.</td></tr>
                <tr><td><strong>Game Over économique</strong></td><td>Votre solde de Bitcoins est devenu négatif après le rapport journalier.</td></tr>
                <tr><td><strong>Héros</strong></td><td>Votre personnage unique. Il évolue, combat, et peut être capturé.</td></tr>
                <tr><td><strong>Marchand</strong></td><td>PNJ sur la carte qui achète vos ressources contre des Bitcoins.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Vaisseau rare qui crée une lune sur un champ de débris (emplacement vide, min. 2M niobium et 2M eau).</td></tr>
                <tr><td><strong>Mothership / Vaisseau-mère</strong></td><td>Gros vaisseau amiral. Ralentit légèrement la flotte.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Points De Guerre. Gagnés en combat, servent aux recherches et au classement.</td></tr>
                <tr><td><strong>Planète active</strong></td><td>La planète actuellement sélectionnée. Toutes vos actions s'y appliquent.</td></tr>
                <tr><td><strong>PNJ</strong></td><td>Personnage Non Joueur : marchands, aliens, Cthulhu, bots IA.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Attaque terrestre pour piller les ressources d'une planète (pas pour la conquérir).</td></tr>
                <tr><td><strong>Rapport journalier</strong></td><td>Bilan quotidien calculé à 18h59 UTC : revenus, coûts, et solde.</td></tr>
                <tr><td><strong>Recycleur</strong></td><td>Vaisseau qui ramasse les débris (CDR) après un combat.</td></tr>
                <tr><td><strong>Round</strong></td><td>Tour de combat. Max 100 en combat spatial, max 10 en combat au sol.</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Petit vaisseau d'espionnage. À envoyer avant toute attaque.</td></tr>
                <tr><td><strong>Taille de flotte</strong></td><td>Indicateur global de la masse de votre flotte. Plus elle est grande, plus elle consomme de carburant.</td></tr>
                <tr><td><strong>Terraformation</strong></td><td>Recherche qui agrandit la taille constructible d'une planète.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Mini-jeu de défense active contre les hordes Cthulhu.</td></tr>
                <tr><td><strong>Travailleur</strong></td><td>Unité de population. Produit des Bitcoins chaque jour. Défend en invasion.</td></tr>
                <tr><td><strong>Tutoriel</strong></td><td>Mode guidé de 16 étapes pour apprendre le jeu, accessible depuis les Préférences.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Joueur désigné comme cible prioritaire en mode Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Supprimer mon compte et mes données"
        category: "beginner"
        order: 99
        tags: "suppression,compte,donnees,rgpd,confidentialite"
        summary: "Comment demander la suppression définitive de votre compte et de vos données personnelles."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Où faire la demande</h2>
            <p>Vous pouvez demander à tout moment la suppression de votre compte et de vos données personnelles depuis la page publique <strong>/suppression-donnees</strong>, ou depuis le bas de vos options en jeu.</p>

            <h2 id="irreversible">Un abandon de compte définitif</h2>
            <p><strong>Attention : c'est un abandon définitif de compte.</strong> Vos données personnelles (email, identifiants sociaux, IP, notifications, messages privés…) sont supprimées ou anonymisées immédiatement, et vous ne pourrez plus jamais vous reconnecter avec ce compte.</p>

            <h2 id="conserve">Ce qui est conservé, et pourquoi</h2>
            <p>Pour préserver l'équilibre du jeu, vos commandants, planètes et flottes continuent d'exister sous un pseudonyme de bot anonyme, sans aucun lien avec votre identité. Les messages publics écrits dans les salons sont également conservés, désormais attribués à votre pseudonyme de bot anonyme. L'historique de paiement est conservé (obligation légale comptable), lui aussi dissocié de votre identité.</p>

    achievements:
        title: "Succès"
        category: "progression"
        order: 11
        tags: "succes,succès,achievements,trophees,google play,play jeux,progression"
        summary: "15 succès de compte, des premiers pas aux exploits de carrière, sur votre profil et dans Google Play Jeux."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Les <strong>succès</strong> récompensent ce que vous accomplissez avec votre compte, <strong>tous serveurs confondus</strong>. Une fois débloqué, un succès l'est pour toujours, même si vous perdez ensuite la planète ou quittez l'alliance qui vous l'a valu.</p>
            <p>Retrouvez-les sur votre <strong>profil cross-serveur</strong> (menu « Mon profil cross-serveur »), avec votre progression et la date de chaque déblocage. Le profil d'un autre joueur montre les siens. Ceux que votre historique a déjà mérités sont débloqués d'office.</p>
            <h2 id="liste">Les 15 succès</h2>
            <table>
            <tr><th>Succès</th><th>Condition</th><th>Points</th></tr>
            <tr><td>Commandant</td><td>Terminer le tutoriel</td><td>20</td></tr>
            <tr><td>Bâtisseur</td><td>Terminer une première construction</td><td>20</td></tr>
            <tr><td>Savant</td><td>Terminer une première recherche</td><td>20</td></tr>
            <tr><td>Colon</td><td>Posséder 2 planètes</td><td>20</td></tr>
            <tr><td>Allié</td><td>Rejoindre ou fonder une alliance</td><td>20</td></tr>
            <tr><td>Vétéran I, II, III</td><td>Livrer 10, 100 puis 1 000 batailles spatiales</td><td>25, 50, 100</td></tr>
            <tr><td>Conquérant I, II</td><td>Réussir 10 puis 100 invasions</td><td>50, 100</td></tr>
            <tr><td>Geôlier</td><td>Capturer un héros ennemi</td><td>50</td></tr>
            <tr><td>Chasseur de Cthulhu</td><td>Gagner une partie du Tower Defense</td><td>50</td></tr>
            <tr><td>Élite</td><td>Finir dans le top 10 d'un serveur</td><td>100</td></tr>
            <tr><td>Empereur</td><td>Remporter un serveur</td><td>200</td></tr>
            <tr><td>Un succès caché</td><td>À découvrir en jouant</td><td>50</td></tr>
            </table>

            <h2 id="progression">La progression</h2>
            <p>Les succès de batailles et d'invasions avancent par paliers, et votre profil affiche le compteur (par exemple 37 / 100). Toutes les batailles spatiales livrées comptent, gagnées ou perdues, y compris la destruction d'une flotte sans armes (cargos, recycleurs, sondes), pour les deux camps ; les invasions comptent quand elles réussissent (les raids ne comptent pas). Élite et Empereur se décident à la fin d'un serveur.</p>
            <h2 id="google-play">Google Play Jeux (Android)</h2>
            <p>Dans l'application Android, vos succès apparaissent aussi dans <strong>Google Play Jeux</strong>, avec la bannière « Succès débloqué ».</p>
            <ul>
            <li><strong>Compte d'essai</strong> créé dans l'application : il est lié automatiquement à votre profil Google Play Jeux. Il n'est alors plus supprimé après 7 jours sans jouer, et il se rouvre tout seul après une réinstallation ou sur un nouveau téléphone.</li>
            <li><strong>Compte inscrit</strong> : liez-le depuis votre profil cross-serveur (carte « Google Play Jeux »). Il s'ouvrira ensuite sans mot de passe avec ce profil Google Play Jeux : ne le faites que sur votre propre appareil. Vous pouvez le délier à tout moment depuis la même carte, sur le site comme dans l'application.</li>
            <li>Le bouton <strong>« Play Jeux »</strong> de l'écran de connexion rouvre le compte lié. Vous déconnecter coupe l'ouverture automatique sur cet appareil : c'est alors ce bouton qui rouvre le compte.</li>
            </ul>
            <p>Un profil Google Play Jeux ne se lie qu'à un seul compte Area, et un compte qu'à un seul profil. Lier votre compte depuis votre profil reprend le profil Google Play Jeux à l'autre compte auquel il était lié, s'il y en avait un.</p>

