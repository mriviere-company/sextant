                <tr><td>Destroyer</td><td>230</td><td>140 s</td><td>270</td><td>—</td></tr>
            </table>
            <p>Exemple : le Lunar est très lent et sa signature de 10&nbsp;000 rend son trajet cher. Vers un secteur voisin, il met 25 minutes et coûte environ 50 Bitcoins de carburant ; vers une autre galaxie, 2 h 30 et 1&nbsp;250 Bitcoins.</p>

            <h3>Prérequis</h3>
            <p>Recherches à obtenir, et bâtiment à construire sur la planète qui produit :</p>
            <ul>
                <li>Aucune recherche : Sonde, Caravelle, Chasseur à plasma, Corvette de combat, Vaisseau de bataille.</li>
                <li>Cargo I / V / X : Gestion des cargaisons niveau 1 / 3 / 5.</li>
                <li>Colonisateur : Terraformation niveau 1. Lunar : Terraformation niveau 15 + Industrie lourde.</li>
                <li>Recycleur : Recyclage orbital. Barge d'invasion : Invasion planétaire.</li>
                <li>Vaisseau radar : Scanner de système niveau 3 + Usine d'armement. Vaisseau brouilleur : Scanner de système niveau 5 + Usine d'armement.</li>
                <li>Vaisseau mère : Vaisseaux utilitaires niveau 3 + Industrie lourde (un seul par commandant).</li>
                <li>Chasseur : Industrie niveau 1 + Arme missile niveau 1. Chasseur lourd : Arme missile niveau 2 + Usine d'armement.</li>
                <li>Corvette : Arme missile niveau 3 + Vaisseaux légers niveau 2 + Usine d'armement. Corvette à laser : Arme missile 3 + Arme laser 1 + Vaisseaux légers 3 + Usine d'armement.</li>
                <li>Frégate : Arme missile 3 + Arme laser 1 + Industrie lourde. Frégate à plasma : la même chose + Arme plasma 1.</li>
                <li>Croiseur : Arme missile 3 + Arme laser 2 + Arme plasma 2 + Industrie lourde.</li>
                <li>Cuirassé : les trois armes au niveau 3 + Vaisseaux lourds 2 + Industrie lourde. Destroyer : les trois armes au niveau 3 + Vaisseaux lourds 3 + Industrie lourde.</li>
            </ul>

    ship_customization:
        title: "Personnaliser ses vaisseaux"
        category: "fleet"
        order: 3
        tags: "personnalisation,vaisseaux,points,coque,bouclier,precision,armes,amelioration"
        summary: "Jusqu'à 40 points par jour pour renforcer la coque, le bouclier, les armes et la précision de vos vaisseaux de combat."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Chacun des 12 vaisseaux de combat dispose d'un <strong>crédit de points d'amélioration</strong> qui lui est propre : 3 pour le Chasseur, 676 pour le Destroyer, 1&nbsp;465 pour l'ensemble des modèles. Vous les dépensez dans ses caractéristiques :</p>
            <ul>
                <li><strong>Coque</strong> — combien il peut encaisser (+5 par point).</li>
                <li><strong>Bouclier</strong> — absorbe une partie des tirs (+1 par point ; les chasseurs n'en ont pas).</li>
                <li><strong>Missile</strong>, <strong>Laser</strong>, <strong>Plasma</strong> — ses armes (+3, +2 et +1 par point), selon celles que le vaisseau possède.</li>
                <li><strong>Précision</strong> — relève le pire résultat possible de chaque salve (+1 par point ; aucun tir ne rate jamais, mais un tir mal ajusté inflige moins de dégâts).</li>
            </ul>
            <p>Vous pouvez dépenser <strong>au plus 40 points par jour</strong>, tous vaisseaux confondus. Dès que vous avez dépensé ces 40 points, un compte à rebours de 24&nbsp;h démarre ; à la fin, vous en retrouvez 40. Les points non dépensés ne s'accumulent pas au-delà de 40 : pensez à passer chaque jour.</p>
            <p>Seuls les vaisseaux de combat s'améliorent : cargos, recycleurs, sondes et autres vaisseaux utilitaires n'ont pas de points.</p>

            <h2 id="utiliser">Comment les utiliser</h2>
            <p>Rendez-vous sur la page <strong>Chantier spatial</strong>, onglet <strong>Améliorez vos vaisseaux !</strong> (l'entrée du menu s'allume en vert quand vous avez des points à dépenser). Pour chaque modèle, saisissez le nombre de points à placer dans chaque caractéristique (le gain s'affiche à côté), puis cliquez sur <strong>Appliquer</strong>. Vos choix s'appliquent à <strong>tous les vaisseaux de ce modèle</strong> (actuels et futurs). Ces statistiques progressent indépendamment les unes des autres : mettre des points dans la coque ou les armes d'un modèle ne réduit jamais sa précision.</p>

            <h2 id="lecture">Lire votre visée à l'écran</h2>
            <p>L'onglet <strong>Statistiques</strong> du Chantier spatial affiche, modèle par modèle, la visée que vous avez investie sur le crédit de ce modèle (par exemple <code>676 / 676</code> pour un Destroyer) et le <strong>multiplicateur de dégâts</strong> qui en découle&nbsp;: <strong>×0,94</strong> à visée pleine, <strong>×0,66</strong> sans le moindre point investi.</p>
            <p>Ce n'est pas un taux de touche&nbsp;: <strong>aucun tir ne rate jamais</strong>. Mieux viser relève le plancher de vos dégâts, jamais leur plafond. C'est le même chiffre que sur votre page de gestion de flotte, dans l'onglet Défenses et dans vos rapports de combat — les quatre écrans se comparent enfin directement. À titre de repère, les défenses d'une planète tirent à <strong>×1,06</strong>, soit mieux qu'une flotte à visée pleine.</p>

            <h2 id="maximum">Combien de points pour maximiser ?</h2>
            <p>La <strong>précision</strong> atteint son maximum quand vous y placez <strong>tout le crédit du modèle</strong> : 3 points pour le Chasseur, 5 pour le Chasseur lourd, 21 pour le Chasseur à plasma et la Corvette à laser, 23 pour la Corvette, 34 pour la Corvette de combat, 61 pour la Frégate à plasma, 64 pour la Frégate, 118 pour le Croiseur, 160 pour le Vaisseau de bataille, 279 pour le Cuirassé et 676 pour le Destroyer. C'est un choix : tout dans la visée, ou tout dans les canons et la coque.</p>
            <p>Les autres caractéristiques n'ont pas de maximum, seulement la limite du crédit. Exemple : les 676 points d'un Destroyer placés en coque lui ajoutent 3&nbsp;380 points de coque (de 2&nbsp;600 à 5&nbsp;980). À 40 points par jour, il faut 17 jours pour dépenser le crédit d'un Destroyer, et 37 jours pour les 1&nbsp;465 points de tous les modèles.</p>

            <h2 id="reset">Remises à zéro</h2>
            <p>Vous pouvez réinitialiser vos points <strong>une fois toutes les 96 heures</strong>, sans limite de nombre : si votre stratégie change ou que le moteur de combat évolue, tous vos points dépensés reviennent dans le crédit de chaque modèle. Après une réinitialisation, le bouton reste grisé et un compte à rebours affiche le temps restant avant la prochaine.</p>
            <p>Juste après la remise à zéro, la ligne « Vous pouvez encore dépenser … points aujourd'hui » indique vos points dépensés moins 90, plus ce qu'il vous restait à dépenser ce jour-là, avec un minimum de 40. Le reste revient ensuite au rythme habituel de 40 par jour. Exemples : si vous aviez dépensé les 1&nbsp;465 points et plus rien aujourd'hui, vous pouvez en replacer 1&nbsp;375 tout de suite ; si vous en aviez dépensé 300, vous pouvez en replacer 210.</p>

            <h2 id="modes-speciaux">Modes de serveur à recherches maximales</h2>
            <p>Dans certains modes (Battle Royale, Domination, Search &amp; Destroy), <strong>tous vos points sont débloqués dès le premier jour</strong> : les 1&nbsp;465 points sont disponibles immédiatement, au lieu de 40 par jour.</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li>Ne dispersez pas vos points sur trop de modèles : concentrez-vous sur ceux que vous utilisez vraiment en masse.</li>
                <li>Le <strong>Chasseur à plasma</strong> et le <strong>Vaisseau de bataille</strong> n'ont aucune arme d'origine : sans points dans leurs armes, ils ne tirent pas.</li>
                <li>Le <strong>Chasseur</strong> n'a que 3 points : ils suffisent à porter sa précision au maximum.</li>
                <li>Cargos et recycleurs ne peuvent pas être améliorés : pour les protéger, faites-les escorter par une flotte armée.</li>
            </ul>

    fleet_missions:
        title: "Types de missions"
        category: "fleet"
        order: 4
        tags: "mission,attaque,transport,colonisation,recyclage,espionnage,nucleaire,raid,invasion"
        summary: "Chaque mission donne un ordre différent à votre flotte. Voici comment choisir la bonne."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Quand vous envoyez une flotte, vous lui donnez un <strong>type de mission</strong>. C'est cette mission qui détermine ce qui se passe à l'arrivée. Certains types exigent des vaisseaux spécifiques.</p>
            <p>Toutes les missions s'envoient depuis la <strong>Carte spatiale</strong> : cliquez sur la case visée, puis sur <strong>Interaction</strong>, choisissez la flotte et la mission, et cliquez sur <strong>Envoyer</strong>. La liste ne propose que les missions possibles sur cette case. L'onglet <strong>Déplacer la flotte</strong> de la page d'une flotte sert aux déplacements simples (Normal) et à l'espionnage.</p>

            <h2 id="missions">Les types disponibles</h2>
            <table>
                <tr><th>Mission (libellé en jeu)</th><th>Ce que ça fait</th><th>Vaisseaux requis</th></tr>
                <tr><td><strong>Normal</strong></td><td>La flotte se rend au point visé et y reste en orbite. Un combat éclate 5 minutes après l'arrivée si une flotte en mode attaque (la vôtre ou une flotte déjà présente) fait face à un adversaire, si vos alliances sont en guerre, ou si la planète visée est en mode attaque (ses défenses tirent). Détails dans <em>Combat spatial</em>.</td><td>N'importe lesquels</td></tr>
                <tr><td><strong>Décharger et revenir</strong></td><td>Dépose la cargaison sur une planète (dans la limite de ses entrepôts : le surplus repart avec la flotte) ou la vend à un marchand contre des Bitcoins, puis rentre seule. Le carburant est doublé à l'aller, et le retour se paie au tarif normal à son départ.</td><td>Des vaisseaux avec soute (des cargos, en pratique)</td></tr>
                <tr><td><strong>Coloniser</strong></td><td>Fonde une colonie sur une <strong>planète inhabitée</strong> (pas sur une case vide).</td><td>Un colonisateur</td></tr>
                <tr><td><strong>Piller</strong></td><td>Combat la défense au sol pour voler des ressources, sans prendre la planète.</td><td>Barges + Légionnaires</td></tr>
                <tr><td><strong>Envahir</strong></td><td>Combat la défense au sol pour <strong>prendre la planète</strong> à l'adversaire.</td><td>Barges + Légionnaires</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Espionne la planète et vous envoie un rapport.</td><td>Au moins une sonde</td></tr>
                <tr><td><strong>Créer une lune</strong></td><td>Crée une lune sur une case vide portant au moins 2M de niobium et 2M d'eau en débris.</td><td>Un Lunar</td></tr>
                <tr><td><strong>Déployer radar</strong></td><td>Installe un radar de puissance 1 sur une case vide pendant 2&nbsp;h.</td><td>Un vaisseau radar</td></tr>
                <tr><td><strong>Déployer brouilleur</strong></td><td>Installe un brouilleur de puissance 1 sur une case vide pendant 1&nbsp;h.</td><td>Un vaisseau brouilleur</td></tr>
            </table>
            <p>Une flotte déjà en orbite de sa cible peut aussi agir directement depuis sa page, rubrique <strong>Interaction</strong> : Envahir, Piller, Coloniser, Espionner ou déployer.</p>

            <h3>Ce ne sont pas des missions</h3>
            <ul>
                <li><strong>Recyclage</strong> : automatique. Une flotte qui compte au moins un recycleur et de la place en soute se met à recycler dès qu'elle arrive sur un champ de débris, quelle que soit sa mission (Normal, en général). Le bouton <strong>Recycler</strong> de la flotte relance le travail.</li>
                <li><strong>Mettre au sol</strong> : sur une de vos planètes, la flotte rejoint le stock de vaisseaux au sol (voir <em>Gestion avancée des flottes</em>).</li>
                <li><strong>Missile nucléaire</strong> : depuis la Carte spatiale, « Envoyer un missile nucléaire » sur une planète ennemie. Le missile part d'une de vos planètes qui en possède un, vole 30 minutes et ne peut pas être annulé.</li>
            </ul>

            <h2 id="choisir">Comment choisir la bonne mission</h2>
            <ul>
                <li>Vous voulez <strong>du Bitcoin</strong> ? → Décharger et revenir, vers un marchand.</li>
                <li>Vous voulez <strong>des renseignements</strong> ? → Sonde.</li>
                <li>Vous voulez <strong>affaiblir</strong> un ennemi ? → Piller.</li>
                <li>Vous voulez <strong>prendre</strong> sa planète ? → Envahir.</li>
                <li>Vous voulez <strong>récupérer des débris</strong> ? → Envoyez des recycleurs (mission Normal) : ils recyclent tout seuls à l'arrivée.</li>
            </ul>

    fleet_movement:
        title: "Déplacement et distance"
        category: "fleet"
        order: 5
        tags: "deplacement,distance,vitesse,voyage,carburant,coordonnees,bitcoin,annuler,nuit"
        summary: "Comment se calcule la durée de vol, le carburant consommé, et ce qui ralentit votre flotte."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Les coordonnées, comment ça marche</h2>
            <p>Chaque position dans l'univers s'écrit au format <strong>Galaxie:Secteur:Position</strong>. Exemple : <code>1:5:12</code> = galaxie 1, secteur 5, position 12.</p>
            <ul>
                <li>Une <strong>galaxie</strong> contient 100 secteurs (grille 10×10, numérotés de 1 à 100 ligne par ligne : 1 à 10 sur la première ligne, 91 à 100 sur la dernière). La Carte spatiale les appelle « systèmes ».</li>
                <li>Un <strong>secteur</strong> contient 25 positions (grille 5×5) ; la position 13, au centre, est toujours un soleil.</li>
            </ul>

            <h2 id="distance">Comment se calcule la distance</h2>
            <ul>
                <li><strong>Dans votre secteur</strong> : environ 1 par case d'écart (1 entre deux cases voisines, 6,25 au plus d'un coin à l'autre).</li>
                <li><strong>Vers un autre secteur de la même galaxie</strong> : environ 3 par secteur d'écart, en ligne droite sur la grille 10×10 ; la position dans le secteur ne compte plus. De 3 pour un secteur voisin à 40 environ d'un coin de la galaxie à l'autre.</li>
                <li><strong>Vers une autre galaxie</strong> : toujours 18, quel que soit le secteur visé. Il faut la recherche <strong>Technologie hyperespace</strong>.</li>
            </ul>
            <p>L'onglet <strong>Déplacer la flotte</strong> de la page d'une flotte affiche une estimation du coût et de la durée avant l'envoi. Cette estimation ne tient compte ni des bonus de vitesse, ni du doublement de « Décharger et revenir », ni de la vitesse du serveur. Depuis la Carte spatiale, l'envoi part sans aperçu.</p>

            <h2 id="duree">La durée de vol</h2>
            <p>La durée se calcule ainsi : <strong>distance × temps par unité du vaisseau le plus lent × vitesse du serveur</strong>. Une flotte va toujours à la vitesse de son vaisseau le plus lent. Temps par unité de distance, sur un serveur de vitesse ×1 (certains serveurs sont accélérés) :</p>
            <table>
                <tr><th>Temps par unité</th><th>Vaisseaux</th></tr>
                <tr><td>1 s</td><td>Sonde, Vaisseau radar, Vaisseau brouilleur</td></tr>
                <tr><td>30 s</td><td>Caravelle</td></tr>
                <tr><td>40 s</td><td>Cargo I</td></tr>
                <tr><td>50 s</td><td>Cargo V, Chasseur, Chasseur lourd, Chasseur à plasma</td></tr>
                <tr><td>60 s</td><td>Cargo X</td></tr>
                <tr><td>70 s</td><td>Corvette, Corvette de combat</td></tr>
                <tr><td>100 s</td><td>Corvette à laser, Vaisseau de bataille, Vaisseau mère</td></tr>
                <tr><td>110 s</td><td>Frégate</td></tr>
                <tr><td>120 s</td><td>Frégate à plasma</td></tr>
                <tr><td>130 s</td><td>Croiseur</td></tr>
                <tr><td>140 s</td><td>Destroyer</td></tr>
                <tr><td>150 s</td><td>Cuirassé, Recycleur</td></tr>
                <tr><td>200 s</td><td>Colonisateur</td></tr>
                <tr><td>300 s</td><td>Barge d'invasion</td></tr>
                <tr><td>500 s</td><td>Lunar</td></tr>
            </table>
            <p>Exemples, sur un serveur de vitesse ×1 :</p>
            <ul>
                <li>Des chasseurs vers un secteur voisin : 2 min 30 s (3 × 50 s).</li>
                <li>Un Cargo I qui livre un allié : environ 2 minutes vers un secteur voisin, 10 minutes vers un secteur situé 5 secteurs plus loin, 12 minutes vers une autre galaxie (Cargo X : 3, 15 et 18 minutes). Avec « Décharger et revenir », comptez autant pour le retour.</li>
                <li>Un colonisateur : environ 10 minutes vers un secteur voisin, 50 minutes à 5 secteurs, 1 heure vers une autre galaxie.</li>
            </ul>
            <p>Ce qui modifie la durée :</p>
            <ul>
                <li>Le <strong>Vaisseau mère</strong> réduit de 10&nbsp;% la durée de vol de sa flotte. Attention : il vole lui-même à 100 s par unité, donc une flotte de chasseurs qui l'emmène passe de 50 à 90 s par unité. Il <strong>réduit aussi de 10&nbsp;% la signature radar</strong> de la flotte (camouflage) — la Vue d'ensemble affiche, elle, le total brut de vos vaisseaux.</li>
                <li>Un <strong>héros</strong> à bord qui donne un bonus de vitesse (voir l'article <em>Héros</em>) et le bonus d'alliance de vitesse de flotte raccourcissent le trajet. Ensemble, les bonus du héros ne peuvent pas réduire la durée de plus de 90&nbsp;%.</li>
                <li>Le <strong>ralentissement nocturne</strong> peut multiplier la durée (voir plus bas).</li>
            </ul>

            <h2 id="carburant">Le carburant</h2>
            <p>Le carburant se paie en <strong>Bitcoins</strong>, au départ. Il dépend de la <strong>signature</strong> de la flotte (la somme des signatures de ses vaisseaux ; la cargaison ne compte pas) et de la distance :</p>
            <ul>
                <li>dans la même galaxie : <strong>signature × distance ÷ 600</strong>, arrondi ;</li>
                <li>vers une autre galaxie : <strong>signature ÷ 8</strong>, arrondi, quelle que soit la destination.</li>
            </ul>
            <p>La mission <strong>Décharger et revenir</strong> coûte le <strong>double</strong> à l'aller, et son retour se paie ensuite comme un trajet normal, au moment où la flotte repart. Un Vaisseau mère réduit la signature de la flotte, donc son carburant, de 10&nbsp;% (mais sa propre signature est de 4&nbsp;000).</p>
            <p>Exemples : 1 Cargo I (signature 10) vers un secteur voisin : 0 Bitcoin. 100 Cargo X (signature 5&nbsp;000) vers un marchand situé 5 secteurs plus loin : 252 Bitcoins à l'aller, 126 au retour. 1&nbsp;000 chasseurs vers une autre galaxie : 125 Bitcoins. Si vous n'avez pas assez de Bitcoins, l'envoi est refusé.</p>

            <h2 id="rappel">Rappeler une flotte en vol</h2>
            <p>Pendant les <strong>2 premières minutes</strong> du vol, un bouton ✕ avec compte à rebours apparaît sur la flotte (page Flottes), et une ligne <strong>Annuler</strong> sur sa page : il <strong>annule l'envoi</strong>. La flotte est aussitôt de retour sur sa planète de départ, mais le carburant payé n'est pas remboursé. C'est aussi vrai pour un colonisateur.</p>
            <p>Passé ce délai, la flotte ne peut plus être arrêtée : une fois arrivée, renvoyez-la (nouveau trajet, nouveau carburant). Un missile nucléaire ne s'annule jamais.</p>

            <h2 id="night-slowdown">🌙 Ralentissement nocturne</h2>
            <p>Ce ralentissement touche une flotte qui transporte au moins un vaisseau de combat, des Légionnaires ou des Mechas, envoyée vers la planète d'un autre joueur ou d'un commandant IA qui n'est ni de votre alliance, ni allié, ni en pacte ou en paix avec vous. Si cette flotte devait arriver pendant la <strong>nuit du défenseur</strong> (23h–06h dans son fuseau horaire), <strong>toute sa durée de vol est multipliée</strong>, par 10 par défaut (chaque serveur peut régler ce multiplicateur).</p>
            <p>Exemple : un vol d'1&nbsp;h qui arriverait à 23h30 dure 10&nbsp;h et arrive à 9h30. Une flotte de cargos, de sondes ou de colonisateurs sans troupes à bord n'est jamais ralentie. La durée affichée dans l'onglet <strong>Déplacer la flotte</strong> intègre déjà ce multiplicateur.</p>
            <p>Une icône 🌙 sur la carte indique les joueurs actuellement en fenêtre nocturne. Dans l'onglet <strong>Déplacer la flotte</strong>, une fenêtre de confirmation s'affiche lors de l'envoi si l'arrivée tombe dans la nuit adverse ; depuis la Carte spatiale, la flotte part sans cet avertissement. Le fuseau horaire est auto-détecté et modifiable au plus une fois par mois (et 6 fois par an).</p>

    fleet_management:
        title: "Gestion avancée des flottes"
        category: "fleet"
        order: 6
        tags: "gestion,flotte,diviser,scinder,fusionner,transferer,regrouper,mettre au sol,ralliement,cohorte,abandonner"
        summary: "Scinder, fusionner, mettre au sol, annuler un envoi : les manipulations avancées de vos flottes."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Les opérations disponibles</h2>
            <p>Elles se font depuis la page d'une flotte (clic sur son nom, page <strong>Flottes</strong>) :</p>
            <ul>
                <li><strong>Scinder</strong> (onglet <strong>Vaisseaux</strong>) — détacher une partie des vaisseaux et de la cargaison dans une nouvelle flotte. Impossible en vol ou en combat ; 100 flottes au plus.</li>
                <li><strong>Fusionner</strong> (liste « Flottes en orbite ») — réunir une autre de vos flottes, ou toutes (<strong>Fusion</strong>), stationnées sur la même planète.</li>
                <li><strong>Gérer</strong> les vaisseaux (onglet <strong>Vaisseaux</strong>) et le <strong>Fret</strong> — sur une de vos planètes, faire passer des vaisseaux ou de la cargaison entre la flotte et le sol.</li>
                <li><strong>Mettre au sol</strong> — sur une de vos planètes, verser toute la flotte (vaisseaux, troupes, cargaison) dans le stock de la planète ; la flotte disparaît. Les troupes et la cargaison débarquées doivent tenir dans les capacités de la planète&nbsp;; une flotte qui n'en transporte pas se pose toujours, même sur une planète déjà pleine.</li>
                <li><strong>Annuler l'envoi</strong> (bouton ✕ sur la flotte en vol, ou ligne <strong>Annuler</strong> sur sa page) — pendant les 2 premières minutes du vol seulement : la flotte revient aussitôt à son point de départ, carburant perdu.</li>
                <li><strong>Abandonner</strong> — vous perdez la flotte : sur un serveur où Cthulhu est présent, elle lui revient (et peut se retourner contre vous) ; ailleurs, elle est détruite.</li>
            </ul>
            <p>Sur la page <strong>Flottes</strong> elle-même :</p>
            <ul>
                <li><strong>Ralliement des flottes</strong> — envoie toutes vos flottes à l'arrêt vers cette planète, où elles se posent à l'arrivée.</li>
                <li><strong>Ralliement des vaisseaux</strong> — rassemble les vaisseaux au sol de vos autres planètes dans des flottes qui volent vers celle-ci et s'y posent.</li>
                <li><strong>Cohortes</strong> — rangez vos flottes dans des listes nommées (10 au plus) pour les retrouver facilement. Aucun effet en combat.</li>
            </ul>
            <p>Scinder, fusionner, transférer et mettre au sol ne coûtent aucune ressource. Seuls les déplacements, ralliements compris, se paient, en Bitcoins de carburant.</p>

            <h2 id="en-vol">Ce qu'on ne peut pas faire</h2>
            <ul>
                <li>Modifier la composition d'une flotte <strong>en vol</strong> (chargement, vaisseaux).</li>
                <li>Changer la mission ou la destination d'une flotte en vol. Seule l'annulation est possible, et uniquement pendant les 2 premières minutes.</li>
                <li>Téléporter une flotte (pas de raccourci magique !).</li>
            </ul>

            <h2 id="astuces">Cas d'usage</h2>
            <ul>
                <li><strong>Scinder avant un combat</strong> : gardez une partie de votre flotte en réserve, envoyez une avant-garde.</li>
                <li><strong>Fusionner après un raid</strong> : réunissez plusieurs retours pour gagner en lisibilité.</li>
                <li><strong>Mettre au sol</strong> : les vaisseaux au sol coûtent six fois moins d'entretien qu'en flotte (un douzième de leur signature en Bitcoins chaque jour, au bilan de 18h59, heure de Paris, contre la moitié en flotte), mais ils <strong>ne combattent pas</strong>. Pour défendre une planète, gardez une flotte armée en orbite, en mode attaque.</li>
            </ul>

    espionage:
        title: "Espionnage et sondes"
        category: "fleet"
        order: 7
        tags: "espionnage,sonde,espion,detection,information,renseignement"
        summary: "Savoir ce que l'adversaire a avant de frapper : l'envoi de sondes expliqué."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Envoyer une sonde</h2>
            <ol>
                <li>Fabriquez des <strong>sondes</strong> au Chantier spatial (aucune recherche requise ; 1&nbsp;000 niobium l'unité).</li>
                <li>Sur la <strong>Carte spatiale</strong>, cliquez sur la planète visée, puis sur <strong>Interaction</strong> → <strong>Sonder la planète</strong> : une sonde stockée au sol sur l'une de vos planètes part aussitôt. Vous pouvez aussi créer une flotte de sondes et l'envoyer en mission <strong>Sonde</strong>.</li>
                <li>Seule, une sonde est quasi instantanée : 1 seconde par unité de distance (18 secondes vers une autre galaxie). Mêlée à d'autres vaisseaux, elle vole à leur vitesse.</li>
            </ol>
            <p>Le bouton <strong>Interaction</strong> de la carte n'apparaît que si au moins une de vos flottes est à l'arrêt. Seules les planètes habitées par un autre commandant peuvent être scannées : une sonde envoyée vers une lune arrive sans produire de rapport.</p>
            <p>À l'arrivée, la sonde scanne la planète et vous envoie un rapport, puis reste en orbite de la cible. Depuis sa page (bouton <strong>Espionner</strong>), elle peut refaire un rapport plus tard ; si la planète passe en mode attaque, ses défenses peuvent la détruire. Depuis la Carte ou le bouton Espionner, une même planète ne peut être sondée qu'une fois par heure.</p>

            <h2 id="reussite">Qu'est-ce qui détermine la réussite ?</h2>
            <p>Un duel silencieux oppose votre <strong>niveau d'Espionnage</strong> à celui du défenseur :</p>
            <ul>
                <li>Si votre niveau est <strong>supérieur ou égal</strong>, le rapport est complet.</li>
                <li>Si votre niveau est plus faible, l'espionnage échoue : le rapport ne contient rien d'autre que le nom de la planète. Il n'y a pas de résultat partiel.</li>
            </ul>
            <p>Pour faire monter votre espionnage : recherche <strong>Scanner de système</strong> jusqu'au niveau 5, puis recherche <strong>Espionnage</strong>, sans niveau maximum.</p>

            <h2 id="rapport">Ce que révèle un rapport réussi</h2>
            <ul>
                <li>Les <strong>ressources</strong> : niobium, eau, rations, uranium, travailleurs et scientifiques.</li>
                <li>Les <strong>bâtiments</strong> et leur niveau.</li>
                <li>Les <strong>défenses</strong> : tourelles, intercepteurs nucléaires, bouclier, <strong>Légionnaires</strong> et <strong>Mechas</strong>.</li>
                <li>Les <strong>vaisseaux au sol</strong> de la planète (missiles nucléaires compris). Les flottes en orbite n'y figurent pas : regardez-les sur la Carte spatiale.</li>
                <li>Les <strong>prisonniers</strong> (héros) détenus sur la planète.</li>
            </ul>
            <p>Exactement ce qu'il faut pour décider : raid, invasion, ou retraite.</p>

            <h2 id="detection">Peut-on se faire repérer ?</h2>
            <p>Toujours. À chaque sondage, le défenseur reçoit un rapport « Espionnage détecté » qui donne <strong>votre nom</strong> et précise si la tentative a réussi ou échoué, ainsi qu'une notification. Le radar n'y change rien.</p>
            <p>Le Brouilleur de radar non plus : il cache une planète sur la carte, mais n'empêche pas une sonde de la scanner. Seul un niveau d'Espionnage supérieur au vôtre protège le défenseur.</p>

    spatial_combat:
        title: "Combat spatial"
        category: "combat"
        order: 1
        tags: "combat,spatial,flotte,bataille,bloc,round,bouclier,precision,pertes,degats,ecran,chasseurs"
        summary: "Le déroulé complet d'un combat entre flottes : puissance des camps, duel des boucliers, rounds de tir, fin de combat et calcul exact de vos pertes."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="declenchement">Quand un combat se déclenche</h2>
            <p>Dès qu'une flotte marquée <strong>[Attaque]</strong> partage sa position (Galaxie:Secteur:Position) avec une flotte ennemie, le combat est programmé <strong>5 minutes</strong> plus tard ; d'ici là, personne ne peut plus changer le mode attaque de ses flottes. Vos flottes présentes au même endroit fusionnent d'abord en une seule armada.</p>
            <p>Toutes les flottes sur place sont réparties en <strong>deux camps</strong> selon la diplomatie : votre alliance et les alliances liées à elle par une Alliance défensive d'un côté, l'ennemi et les siennes de l'autre ; une alliance liée par un Pacte de non-agression au camp adverse reste à l'écart. Un camp sans la moindre arme de vaisseau (cargos, recycleurs, sondes, troupes seules) ne livre pas bataille : il est détruit, et le rapport le mentionne.</p>
            <p><strong>Alliances en guerre, personne d'armé</strong> — deux flottes d'alliances en guerre qui se croisent en orbite ne déclenchent un combat que si l'une des deux au moins porte des armes de vaisseau. Deux flottes entièrement désarmées (cargos, sondes, recycleurs) qui se croisent ne se battent tout simplement pas&nbsp;: vos flottes ne sont pas immobilisées et personne n'est averti pour rien.</p>
            <p><strong>Cas des raids et invasions</strong> — quand cette bataille est déclenchée par un raid ou une invasion contre une planète gardée (voir les articles <em>Invasion de planète</em> et <em>Raids (pillage)</em>), c'est ce déclenchement lui-même qui pose le marqueur <strong>[Attaque]</strong> sur votre flotte assaillante. Il n'est jamais retiré ensuite&nbsp;: une flotte de raid ou d'invasion qui survit reste donc marquée hostile — les tourelles en mode attaque pourront l'engager plus tard, et elle sera reprise dans la détection du prochain combat spatial dès qu'elle croisera un ennemi.</p>

            <h2 id="puissance">La puissance d'un camp</h2>
            <p>Le combat oppose les <strong>totaux</strong> des deux camps : le jeu additionne l'armure, le bouclier, les missiles, les lasers et le plasma de tous les vaisseaux engagés.</p>
            <ul>
                <li><strong>Défenseur chez lui</strong> — les tourelles et l'armure des défenses de la planète rejoignent son camp ; le Bouclier ajoute +50&nbsp;000 d'armure, le Grand bouclier +600&nbsp;000 (+20&nbsp;% chacun avec une Base spatiale). Une flotte armée d'un membre de son alliance stationnée sur la planète en profite aussi.</li>
                <li><strong>Précision</strong> — moyenne des précisions des flottes du camp (issue de la personnalisation de vos vaisseaux). Voir <em>Comprendre la puissance des troupes</em>.</li>
                <li><strong>Politique d'alliance</strong> — chaque régime bat son rival : <strong>La Balance des Mondes</strong> bat <strong>Le Rempart Silencieux</strong>, qui bat <strong>Le Marteau des Étoiles</strong>, qui bat La Balance des Mondes. Si la politique de l'<strong>attaquant</strong> bat celle du défenseur, ses missiles, lasers et plasma gagnent +20&nbsp;% pour ce combat.</li>
                <li><strong>Améliorations d'alliance</strong> — jusqu'à +5&nbsp;% par type d'arme, d'armure, de bouclier et de précision, et jusqu'à +10&nbsp;% pour les défenses planétaires. Ce dernier bonus joue quand vos défenses combattent aux côtés d'une flotte, pas dans le combat orbital du mode attaque.</li>
                <li><strong>Héros</strong> — bonus d'attaque, de défense, de bouclier et de précision selon compétences et objets. Un héros doué d'<strong>Intimidation</strong> réduit les armes adverses ; un <strong>Tacticien</strong> renforce la première salve de son camp.</li>
            </ul>

            <h2 id="defenses-planete">Vos tourelles se battent dans ce même combat</h2>
            <p>Quand les défenses de votre planète rejoignent un camp, ce combat <strong>est</strong> tout le combat de votre planète&nbsp;: il n'y a pas de second combat orbital séparé derrière pour vos tourelles. Elles visent avec leur propre précision (une escorte peu précise stationnée à côté d'elles ne dégrade pas leur tir), et elles y prennent de <strong>vraies pertes</strong>, que le mode attaque de la planète soit actif ou non :</p>
            <ul>
                <li><strong>si votre camp l'emporte</strong>, vos tourelles perdent la même fraction que l'armure perdue par votre camp (au plus 95&nbsp;%) ; boucliers et Base spatiale restent intacts ;</li>
                <li><strong>si votre camp s'effondre</strong>, toutes les tourelles, le Bouclier, le Grand bouclier et la Base spatiale sont détruits, la file de production de la page Défense est perdue (tourelles, Légionnaires, Mechas, bombes ou intercepteurs pas encore livrés compris) et le mode attaque est coupé. Les Légionnaires, Mechas et travailleurs déjà au sol, les bâtiments et les bombes ou intercepteurs en stock ne sont pas touchés.</li>
            </ul>
            <p>Une planète gardée par une flotte <strong>armée</strong> (armes de vaisseau) — la vôtre ou celle d'un membre de votre alliance — ne peut donc pas être pillée ou envahie sans qu'une bataille ne tranche d'abord ; une sonde ou un cargo seuls ne suffisent pas.</p>

            <h2 id="boucliers">Le duel des boucliers</h2>
            <p>Chaque salve se heurte d'abord au bouclier adverse. Sa <strong>puissance de perçage</strong> vaut&nbsp;:</p>
            <p><code>missiles ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>Le plasma excelle contre les boucliers, les missiles les percent mal — quelle que soit la taille du combat, dix contre dix comme cent millions contre cent millions. À chaque salve, la part de dégâts qui dépasse la puissance de perçage est absorbée par le bouclier adverse jusqu'à épuisement de sa charge&nbsp;; le reste, et tout ce qui déborde une fois le bouclier vide, touche directement la coque. Un bouclier ne peut donc jamais bloquer une salve entière&nbsp;: face à un adversaire armé, votre coque encaisse toujours quelque chose, dès le premier round.</p>
            <p>Exemple : une salve tirée par 700 missiles, 200 plasma et 300 lasers perce à hauteur de 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1&nbsp;500</strong> points ; seul ce qui dépasse ces 1&nbsp;500 points peut être absorbé par le bouclier adverse.</p>
            <p>Le bouclier d'une flotte n'est pas une réserve qui repart automatiquement à 100&nbsp;% avant chaque bataille&nbsp;: c'est une <strong>charge persistante</strong> qui s'use pendant le combat et ne remonte que de 10&nbsp;% toutes les 3 heures, en continu (30 heures pour repasser de zéro à plein), même quand vous scindez, fusionnez ou dissolvez la flotte, ou que vous transférez des vaisseaux entre la flotte et le sol de la planète. Le rapport de combat affiche cette charge au début et à la fin de la bataille&nbsp;; la liste des flottes montre le pourcentage de chaque flotte, et la page de gestion de flotte indique le bouclier réellement emmené au combat, la capacité totale, le pourcentage actuel et le temps restant avant charge pleine. Le stock de vaisseaux au sol porte lui aussi une charge, qui ne se recharge pas&nbsp;: toute flotte créée ou complétée depuis ce sol en hérite, et elle est affichée dans la fenêtre de création de flotte comme dans l'onglet «&nbsp;Vaisseaux&nbsp;» de la gestion de flotte.</p>
            <p>Une exception : le bouclier forfaitaire apporté par un <strong>Vaisseau mère</strong> (5&nbsp;250 points par flotte, une seule fois même avec plusieurs Vaisseaux mères) ne se décharge jamais d'une bataille à l'autre — il absorbe des coups pendant le combat, puis repart plein au suivant ; la charge n'use que le bouclier de vos autres vaisseaux. C'est pourquoi la page de gestion affiche aussi la valeur absolue du bouclier, pas seulement le pourcentage.</p>

            <h2 id="rounds">Les rounds de tir</h2>
            <p>Le combat dure au maximum <strong>100 rounds</strong>. À chaque round, chaque camp tire une salve qui inflige&nbsp;:</p>
            <p><code>(missiles + plasma ÷ 2 + lasers × 2) × multiplicateur</code></p>
            <p>Le multiplicateur vient d'un jet de précision : le jeu tire un nombre entre la précision du camp et 100 et le divise par 80, pour un résultat entre <strong>×0,3 et ×1,2</strong>. Aucune salve ne rate. Une précision élevée ne rend pas vos meilleures salves plus fortes, elle élimine les mauvais tirages. La part qui franchit le bouclier adverse (voir plus haut) s'impute sur l'armure totale de ce camp.</p>

            <h2 id="fin">Fin du combat</h2>
            <ul>
                <li><strong>L'armure d'un camp tombe à 0</strong> — il est vaincu, toutes ses flottes sont détruites avec leur cargaison.</li>
                <li><strong>100 rounds atteints</strong> — le camp qui conserve le plus d'armure l'emporte ; à égalité parfaite, l'attaquant gagne.</li>
                <li><strong>Filet du vainqueur</strong> — même très amoché, le camp vainqueur ne perd jamais plus de 95&nbsp;% de son armure de départ : une victoire n'est jamais un anéantissement, quel que soit l'écart de puissance.</li>
            </ul>

            <h2 id="pertes">Vos pertes : ce que vous avez encaissé</h2>
            <p>La règle tient en une phrase : <strong>vos pertes découlent des dégâts de coque que vous avez réellement encaissés</strong> — jamais de ceux qu'a absorbés votre bouclier, qui ne coûte aucun vaisseau. Ces dégâts de coque se répartissent entre votre <strong>écran</strong> (Chasseurs, Chasseurs lourds, Chasseurs à plasma : les seuls vaisseaux sans bouclier) et votre <strong>ligne</strong> (les autres vaisseaux de combat, des Corvettes aux Destroyers), au prorata de l'armure de chaque groupe&nbsp;: chaque type perd la même fraction de lui-même. Le rapport affiche deux compteurs : dégâts de coque et dégâts de bouclier.</p>
            <p>Votre écran ne protège pas votre ligne indéfiniment&nbsp;: il détourne sur lui-même au plus la <strong>moitié</strong> des dégâts qui visaient la ligne, et seulement tant qu'il lui reste de l'armure pour les encaisser — un seul chasseur ne peut pas éponger les dégâts de toute une flotte. Sans écran du tout, la ligne encaisse l'intégralité des dégâts de coque.</p>
            <p>Vos vaisseaux utilitaires (cargos, recycleurs, barges, sondes, colonisateurs, Vaisseau mère) ne subissent aucune perte tant que votre camp gagne : seuls les vaisseaux de combat encaissent.</p>
            <p>Conséquences directes : si l'ennemi vous touche à peine, vos pertes sont quasi nulles ; un ennemi dix fois plus dangereux vous coûte environ dix fois plus — chasseurs compris. Le camp vaincu, lui, perd tout.</p>

            <h2 id="apres">Après le combat</h2>
            <ul>
                <li><strong>Débris</strong> — 40&nbsp;% du coût de construction (niobium et eau) de chaque vaisseau détruit, des deux camps, tombe en orbite (20&nbsp;% quand un Cthulhu ou un alien est impliqué). Les vaisseaux payés en Points de Guerre ne laissent pas de débris. La cargaison des flottes anéanties s'y ajoute. Un recycleur dans la flotte victorieuse commence aussitôt à ramasser, s'il a de la place en soute.</li>
                <li><strong>Points de Guerre</strong> — le gain se calcule sur la signature du camp vaincu : signature totale ÷ nombre de flottes de ce camp ÷ 100 (÷ 500 face à un Cthulhu ou un alien), arrondi à l'entier. Chaque flotte du camp vainqueur reçoit ce montant, et le propriétaire de la planète en touche autant si ses défenses étaient du côté gagnant. Le camp vaincu reçoit exactement un cinquième de ce barème, calculé sur ses propres flottes. La recherche politique « Points de Guerre » ajoute 10&nbsp;% par niveau. Exemple : une flotte de 100 Chasseurs (signature 1 chacun) détruite rapporte 1 PDG ; un Destroyer (signature 270), environ 3. Détruire une flotte sans armes (cargos, sondes, recycleurs) ne rapporte rien.</li>
                <li><strong>Héros</strong> — un héros principal à bord d'une flotte détruite peut être capturé par le vainqueur (chance, jamais garanti). Un <strong>héros secondaire</strong> vaincu suit une règle différente et définitive, sans hasard : voir l'article <em>Héros secondaires</em>.</li>
                <li><strong>Rapports</strong> — chaque commandant reçoit le détail (menu <strong>Rapport</strong>, onglet <strong>Combats</strong>) : forces, salves, dégâts encaissés, pertes, et le sort de tout héros secondaire capturé ou exécuté.</li>
                <li><strong>Et ensuite</strong> — les flottes survivantes restent sur place : rien ne les renvoie automatiquement chez elles.</li>
            </ul>

            <h2 id="conseils">Conseils</h2>
            <ul>
                <li>Gardez toujours un <strong>écran de chasseurs</strong> : bon marché, il encaisse une partie des dégâts de coque à la place de vos vaisseaux lourds.</li>
                <li>Investissez dans le <strong>bouclier</strong> : plus il est chargé, plus il absorbe de dégâts avant qu'ils n'atteignent votre coque — mais aucun bouclier n'arrête une salve entière, votre coque encaisse toujours une part. Laissez-le se recharger entre deux batailles.</li>
                <li>Montez du <strong>plasma</strong> pour percer vite les boucliers adverses, des <strong>lasers</strong> pour les dégâts de coque.</li>
                <li>Choisissez la <strong>politique d'alliance</strong> en regardant celle de vos cibles favorites : +20&nbsp;% d'armes en attaque.</li>
            </ul>

    invasion:
        title: "Invasion de planète"
        category: "combat"
        order: 2
        tags: "invasion,planete,soldats,tanks,barges,conquete,deploiement,tactique,annuler"
        summary: "Conquérir une planète ennemie : barges, débarquement, combat au sol et déploiements tactiques."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'invasion est une attaque pour <strong>prendre possession</strong> d'une planète ennemie. Votre flotte débarque des Légionnaires (via des barges) qui affrontent la garnison au sol.</p>
            <p>C'est différent d'un <strong>raid</strong> (qui pille sans prendre la planète) : une invasion réussie vous donne la planète entière.</p>
            <p>Deux façons de la lancer : envoyer la flotte en mission « Envahir » vers la planète, ou cliquer sur « Envahir » quand votre flotte est déjà en orbite de la cible (l'assaut a alors lieu immédiatement).</p>

            <h2 id="conditions">Ce qu'il faut pour envahir</h2>
            <ul>
                <li>Jouer sur un serveur en <strong>mode PvP</strong> (ex. : Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Avoir des <strong>barges</strong> et des <strong>Légionnaires</strong> à bord de la flotte.</li>
                <li>La cible doit être une planète habitée d'un autre joueur : pas un marchand, pas un membre de votre alliance, ni une alliance avec laquelle vous avez une Alliance défensive, un Pacte de non-agression ou un Accord de paix.</li>
                <li>La cible ne doit pas être protégée par le statut de débutant. Lancer une invasion pendant votre propre protection vous la fait perdre (le jeu demande confirmation).</li>
                <li>Votre flotte ne doit pas être déjà engagée dans un combat programmé.</li>
            </ul>
            <p>Il n'est pas nécessaire d'appartenir à une alliance.</p>

            <h2 id="barges">Le rôle des barges</h2>
            <p>Les barges sont les véhicules qui débarquent vos Légionnaires au sol. Chaque barge transporte <strong>1&nbsp;000 Légionnaires</strong>, +25&nbsp;% par niveau de la recherche politique « Invasions planifiées » (1&nbsp;250 au niveau 1, 1&nbsp;500 au niveau 2…).</p>
            <p>Si vous avez plus de Légionnaires que de places, les excédentaires <strong>restent en orbite et ne combattent pas</strong>. Les Mechas embarqués ne participent pas à l'assaut : seuls les Légionnaires attaquent au sol. En cas d'échec, vos barges sont <strong>capturées par le défenseur</strong>.</p>

            <h2 id="annuler">Annuler une invasion</h2>
            <p>Une flotte envoyée en invasion peut être rappelée pendant les <strong>2 minutes</strong> qui suivent son départ (bouton « Annuler ») : elle revient aussitôt à son point de départ, mais le carburant payé est perdu. Passé ce délai, l'invasion aura lieu à l'arrivée. Une invasion lancée depuis l'orbite (« Envahir ») se résout immédiatement et ne s'annule pas.</p>

            <h2 id="orbital">Phase 1 — Combat en orbite (parfois)</h2>
            <p>Deux situations peuvent vous arrêter avant même le débarquement :</p>
            <ul>
                <li>La planète cible a activé son <strong>mode attaque</strong> : dès votre arrivée, ses tourelles et boucliers engagent votre flotte. Si <strong>vous perdez</strong>, votre flotte est détruite — l'invasion s'arrête net. Si <strong>vous gagnez</strong>, les défenses orbitales sont anéanties et votre flotte continue (affaiblie). Une planète sans tourelle perd ses boucliers et sa base spatiale sans combattre dès que votre raid ou votre invasion arrive.</li>
                <li>La planète cible est gardée par une flotte <strong>armée</strong> (armes de vaisseau) du propriétaire, ou d'un membre de son alliance, déjà en orbite (une sonde ou un cargo seuls ne comptent pas) : votre arrivée déclenche une <strong>bataille</strong> contre ce défenseur et ses tourelles réunis, 5 minutes plus tard — même si la planète n'est pas en mode attaque. Cette bataille ne se déclenche jamais contre un partenaire de paix, de pacte, une alliance défensive ou votre propre alliance, ni sur un serveur PvE : elle respecte les mêmes règles diplomatiques qu'une invasion normale. Elle annule votre invasion en cours&nbsp;: si vous la remportez, il vous faut <strong>relancer</strong> une invasion pour débarquer réellement — et si la planète est toujours gardée à ce moment-là, cliquer sur «&nbsp;Envahir&nbsp;» depuis l'orbite est <strong>refusé</strong> de la même façon&nbsp;: engagez d'abord le mode attaque de votre propre flotte pour forcer le combat. Comme une invasion embarque toujours des Légionnaires, cette condition de bataille est automatiquement remplie côté attaquant&nbsp;: la bataille se déclenche donc que votre flotte porte ou non des armes de vaisseau.</li>
            </ul>
            <p><strong>Piège à connaître&nbsp;: une flotte d'invasion sans vaisseau de combat est anéantie dans cette bataille.</strong> Légionnaires et barges suffisent à faire décoller une invasion, mais si votre flotte ne porte aucune arme de vaisseau, elle entre dans cette bataille préliminaire avec une puissance de feu nulle&nbsp;: les défenseurs l'anéantissent entièrement, barges et Légionnaires compris, avant même le débarquement. Il en va de même face à une planète en mode attaque : ses tourelles détruisent d'office une flotte sans arme de vaisseau. <strong>Escortez toujours vos flottes d'invasion avec des vaisseaux de combat</strong> — voir l'article <em>Raids (pillage)</em> pour le même piège côté pillage.</p>

            <h2 id="combat">Phase 2 — Combat au sol</h2>
            <p>Le combat au sol se déroule en <strong>10 rounds maximum</strong>. À chaque round, l'assaillant inflige le dixième de sa puissance d'attaque à la garnison, qui riposte avec le dixième de sa puissance de défense.</p>
            <table>
                <thead>
                    <tr><th>Unité</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Légionnaire</strong></td><td>Attaque (5 à 7 par round en invasion) et défense (6, +5&nbsp;% par niveau de Barbelées).</td></tr>
                    <tr><td><strong>Mecha</strong></td><td>Défense lourde (2&nbsp;200), max 500 par planète. Ne participe pas à l'assaut.</td></tr>
                    <tr><td><strong>Travailleur</strong></td><td>Défense passive (1 chacun), <strong>uniquement en invasion</strong> (pas en raid).</td></tr>
                </tbody>
            </table>
            <p><strong>L'attaquant gagne uniquement si</strong> toutes les troupes du défenseur sont éliminées <strong>et</strong> qu'il lui reste au moins 1 Légionnaire vivant. Sinon, <strong>le défenseur gagne par avantage du terrain</strong>. Détail des puissances : article <em>Comprendre la puissance des troupes</em>.</p>

            <h2 id="deploiement">Les déploiements tactiques du défenseur</h2>
            <p>Le défenseur peut avoir choisi un <strong>déploiement tactique</strong> invisible pour vous (seul son propre rapport l'indique). À garder en tête : il peut retourner une situation qui semblait gagnée d'avance.</p>
            <table>
                <thead>
                    <tr><th>Déploiement</th><th>Effet</th><th>Ordre des pertes de la garnison</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Équilibré</strong></td><td>Aucun bonus ni malus.</td><td>Légionnaires, puis Mechas, puis travailleurs.</td></tr>
                    <tr><td><strong>Fortifié</strong></td><td>La riposte de la garnison gagne 30&nbsp;% puis en perd 20&nbsp;% : au total <strong>+4&nbsp;%</strong> de dégâts infligés à l'assaillant. Les unités ne deviennent pas plus dures à tuer.</td><td>Comme Équilibré.</td></tr>
                    <tr><td><strong>Guérilla</strong></td><td>Dans la riposte, chaque travailleur compte 2,5 fois (+150&nbsp;%) et chaque Légionnaire moitié moins (−50&nbsp;%).</td><td>Travailleurs d'abord, puis Légionnaires, puis Mechas.</td></tr>
                    <tr><td><strong>Dernier Bastion</strong></td><td>+50&nbsp;% de riposte dès que la garnison tombe sous 30&nbsp;% de son effectif de départ (en nombre d'unités), jusqu'à la fin du combat.</td><td>Légionnaires, puis travailleurs, puis Mechas.</td></tr>
                    <tr><td><strong>Terre Brûlée</strong></td><td>Aucun bonus au combat. Si l'assaillant gagne, en raid comme en invasion, 50&nbsp;% du niobium, de l'eau et de l'uranium restant sur la planète sont détruits.</td><td>Comme Équilibré.</td></tr>
                </tbody>
            </table>
            <p>Les travailleurs ne combattent qu'en invasion. Le défenseur peut changer de déploiement librement, à tout moment, sur la page <strong>Défense</strong>.</p>

            <h2 id="victoire">Si vous gagnez l'invasion</h2>
            <ul>
                <li><strong>Capture</strong> — la planète vous revient, avec ses bâtiments. Les travailleurs sont ramenés à <strong>2&nbsp;000</strong>. Si le défenseur avait choisi Terre Brûlée, la moitié de son niobium, de son eau et de son uranium est détruite avant la capture.</li>
                <li><strong>Planète Cthulhu</strong> — si vous reprenez une planète capturée par les Cthulhu, elle est libérée (bâtiments remis à zéro, récompense en uranium).</li>
                <li><strong>Plus de place pour coloniser ?</strong> Vos planètes colonisées doivent rester sous Terraformation + 2, plus le niveau de la recherche politique « Empire sans frontières ». Au-delà, la planète conquise devient une base Cthulhu — ou redevient inhabitée sur un serveur sans Cthulhu : vous ne la gardez pas, mais vous touchez vos points de guerre.</li>
            </ul>
            <p>Les <strong>files de production</strong> ne suivent pas la planète capturée&nbsp;: les vaisseaux comme les défenses (tourelles ou troupes) déjà payés mais pas encore livrés sont perdus à la capture — une commande passée par le vaincu ne change jamais de main. Ce qui a été livré avant l'assaut, en revanche, est au sol et suit la planète.</p>
            <p>Si la planète capturée héberge un <strong>héros secondaire</strong> adverse, son sort se joue immédiatement : vous le <strong>capturez</strong> si vous possédez une Prison (niveau 1 ou plus), sinon il est <strong>exécuté</strong>. Un raid, lui, ne prend jamais la planète et ne met donc jamais un héros en jeu. Détails dans l'article <em>Héros secondaires</em>.</p>

            <h2 id="gameover">Élimination du défenseur</h2>
            <p>Si le défenseur perd sa <strong>dernière planète</strong>, il est éliminé du serveur. Vous récupérez tout : ses Bitcoins, ses flottes survivantes et ses Points de Guerre.</p>

            <h2 id="defaite">Si vous perdez l'invasion</h2>
            <p>Les <strong>barges sont capturées par le défenseur</strong>. Les Légionnaires tués au sol sont perdus ; ceux qui ont tenu jusqu'au 10e round, et ceux restés en orbite faute de place, reviennent dans votre flotte — sans barges pour les redébarquer. C'est une défaite coûteuse : sondez avant d'envahir.</p>

    raid:
        title: "Raids (pillage)"
        category: "combat"
        order: 3
        tags: "raid,pillage,vol,ressources,bunker,fort defensif,barges,terre brulee"
        summary: "Piller les ressources d'une planète ennemie sans chercher à la conquérir."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Qu'est-ce qu'un raid ?</h2>
            <p>Un raid est une attaque au sol dont le but est de <strong>voler des ressources</strong>. Vous ne prenez pas la planète : vous repartez avec du butin. Conséquence importante : un raid, même réussi, ne prend jamais la planète, donc <strong>aucun héros secondaire n'y est jamais capturé ni exécuté</strong>, que vous soyez attaquant ou défenseur.</p>
            <p>Il faut les mêmes moyens qu'une invasion : des <strong>barges</strong> et des <strong>Légionnaires</strong> à bord, contre la planète d'un autre joueur qui n'est ni dans votre alliance, ni liée à elle par une Alliance défensive, un Pacte de non-agression ou un Accord de paix (voir <em>Invasion de planète</em>). Envoyez la flotte en mission « Piller », ou cliquez sur « Piller » quand elle est déjà en orbite. Une base Cthulhu ne se pille pas.</p>

            <h2 id="difference">Raid vs Invasion</h2>
            <table>
                <thead>
                    <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                </thead>
                <tbody>
                    <tr><td>Objectif</td><td>Voler du niobium, de l'eau, de l'uranium</td><td>Prendre possession de la planète</td></tr>
                    <tr><td>Défenseurs</td><td>Légionnaires + Mechas</td><td>Légionnaires + Mechas + Travailleurs</td></tr>
                    <tr><td>Attaque d'un Légionnaire</td><td>5 à 6 par round (moins imprévisible)</td><td>5 à 7 par round (plus imprévisible)</td></tr>
                    <tr><td>Perte des barges si défaite</td><td>Non</td><td>Oui (capturées par le défenseur)</td></tr>
                </tbody>
            </table>

            <h2 id="combat">Comment ça se passe</h2>
            <p>Mêmes étapes que l'invasion (combat orbital éventuel, puis 10 rounds au sol), <strong>mais les travailleurs ne défendent pas</strong>. Les Légionnaires et Mechas du défenseur sont seuls.</p>
            <p><strong>Planète gardée par une flotte en orbite</strong> — si la cible est protégée par une flotte <strong>armée</strong> (armes de vaisseau) du propriétaire, ou d'un membre de son alliance (une sonde ou un cargo seuls ne suffisent pas), votre raid déclenche d'abord une bataille contre ce défenseur et les tourelles de la planète, 5 minutes après votre arrivée. Cette bataille ne se déclenche jamais contre un partenaire de paix, de pacte, une alliance défensive ou votre propre alliance, ni sur un serveur PvE. Le pillage n'a pas lieu dans la foulée&nbsp;: si vous remportez cette bataille, il vous faut <strong>relancer</strong> un raid pour piller réellement — et si la planète est toujours gardée, cliquer sur «&nbsp;Piller&nbsp;» depuis l'orbite est <strong>refusé</strong> lui aussi&nbsp;: engagez d'abord le mode attaque de votre propre flotte pour forcer le combat. Côté attaquant, cette bataille ne se déclenche que si votre flotte de raid est elle-même offensive — armes de vaisseaux, Légionnaires ou Mechas à bord.</p>

            <h2 id="raid-sans-armes">Un raid tout en troupes est anéanti</h2>
            <p>Emmener des Légionnaires ou des Mechas suffit à déclencher cette bataille — mais si votre flotte de raid ne porte <strong>aucune arme de vaisseau</strong>, elle y entre avec une puissance de feu nulle. Les défenseurs l'anéantissent entièrement, sans perdre le moindre vaisseau en face. Face à une planète en mode attaque, c'est pareil : ses tourelles détruisent d'office une flotte sans arme de vaisseau. <strong>Escortez toujours vos transports de troupes</strong>&nbsp;: c'est la surprise la plus coûteuse que ce système puisse vous réserver.</p>

            <h2 id="pillage">Le pillage (en cas de victoire)</h2>
            <p>Vous récupérez autant de ressources qu'il reste de place dans vos soutes après le combat : chaque Légionnaire survivant occupe une place, chaque Mecha 500 (une barge offre 1&nbsp;000 places). Emmenez des cargos pour repartir avec un vrai butin. Les ressources sont prises dans cet ordre :</p>
            <ol>
                <li><strong>Niobium</strong> d'abord.</li>
                <li>Puis <strong>Eau</strong>.</li>
                <li>Enfin <strong>Uranium</strong> (si place restante).</li>
            </ol>

            <h2 id="bunker">Le Fort défensif protège une partie</h2>
            <p>Le <strong>Fort défensif</strong> (bunker) du défenseur <strong>met à l'abri 5&nbsp;% du stockage max par niveau</strong>. Exemples :</p>
            <ul>
                <li>Fort défensif niveau 5 → 25&nbsp;% du stockage max protégé sur le niobium et l'eau.</li>
                <li>Fort défensif niveau 10 → 50&nbsp;% protégé.</li>
            </ul>
            <p>L'uranium est protégé de la même façon : <strong>5&nbsp;% de votre stock d'uranium par niveau de Fort défensif</strong> (l'uranium n'ayant pas de stockage max, la protection s'applique au stock du moment).</p>

            <h2 id="scorched">Attention à la Terre Brûlée</h2>
            <p>Si le défenseur a choisi le <strong>déploiement tactique Terre Brûlée</strong> et qu'il perd, <strong>la moitié de tout ce qui reste</strong> sur la planète (niobium, eau, uranium) est détruite, y compris la part que le Fort défensif avait mise à l'abri. Vous repartez avec votre butin, mais l'adversaire ne peut pas tout reprendre derrière.</p>

    nuclear:
        title: "Attaque nucléaire"
        category: "combat"
        order: 4
        tags: "nucleaire,bombe,uranium,destruction,intercepteur"
        summary: "L'arme ultime pour détruire les bâtiments clés d'un ennemi — à condition qu'il n'ait pas de défense anti-missile."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut</h2>
            <ul>
                <li>La recherche <strong>Armement</strong> au niveau 5 et un bâtiment <strong>Base nucléaire</strong>.</li>
                <li>De l'<strong>uranium</strong> (très rare).</li>
                <li>Une <strong>bombe nucléaire</strong>, fabriquée sur la page <strong>Défense</strong> : 500 uranium et 25&nbsp;000 Bitcoins, 6 heures par bombe (accélérées par l'Usine d'armement et l'Industrie lourde). Une planète stocke au plus autant de bombes que le niveau de sa Base nucléaire.</li>
            </ul>
            <p><strong>Lancer la frappe</strong> — depuis la <strong>carte spatiale</strong>, sélectionnez la planète ennemie, puis « Envoyer un missile nucléaire ». Le jeu prend une bombe sur l'une de vos planètes ; elle arrive en <strong>30 minutes</strong>, quelle que soit la distance, et ne peut pas être annulée. Viser une autre galaxie demande la Technologie hyperespace. Une planète protégée par le statut de débutant ne peut pas être visée, et lancer une frappe pendant votre propre protection vous la fait perdre (le jeu demande confirmation).</p>

            <h2 id="degats">Que fait une bombe qui touche ?</h2>
            <p>La bombe <strong>détruit un niveau de bâtiment</strong>, en priorité les plus stratégiques :</p>
            <ol>
                <li><strong>Métropole</strong> — perte de 1 niveau : −80&nbsp;000 travailleurs de capacité (ceux qui dépassent la nouvelle capacité disparaissent) et production de travailleurs réduite.</li>
                <li><strong>Grande ville</strong> — perte de 1 niveau : −25&nbsp;000 travailleurs de capacité, même règle.</li>
                <li><strong>Fort défensif</strong> (bunker) — perte de 1 niveau : protection contre le pillage réduite et −15&nbsp;000 Légionnaires de capacité.</li>
                <li><strong>Caserne</strong> — perte de 1 niveau : −5&nbsp;000 Légionnaires de capacité.</li>
                <li><strong>Camp d'esclaves</strong> — perte de 1 niveau.</li>
            </ol>
            <p>La bombe frappe le premier bâtiment présent dans cet ordre ; si la planète n'en a aucun, elle ne fait aucun dégât. Les Légionnaires au-delà de la nouvelle capacité disparaissent aussi. Dans tous les cas, la bombe est consommée.</p>

            <h2 id="regle">Règles spéciales</h2>
            <ul>
                <li>Une bombe en vol <strong>ne peut pas être interceptée</strong> par une flotte en orbite. Elle file droit vers sa cible.</li>
                <li>La seule façon de l'arrêter : le <strong>missile intercepteur</strong> du défenseur.</li>
            </ul>

            <h2 id="anti">La défense : le missile intercepteur</h2>
            <p>Si la planète cible possède au moins un <strong>missile intercepteur</strong>, la bombe est automatiquement neutralisée :</p>
            <ul>
                <li>La bombe est <strong>détruite</strong>.</li>
                <li><strong>1 à 3 intercepteurs</strong> sont consommés (jamais plus que le stock).</li>
                <li>Les deux joueurs reçoivent un rapport.</li>
            </ul>
            <p>Les missiles intercepteurs se fabriquent sur la page <strong>Défense</strong> : 10&nbsp;000 niobium et 200 uranium, 3 heures chacun (recherche Armement niveau 5 et Base nucléaire). Une planète en stocke au plus 4 par niveau de Base nucléaire.</p>
            <p>Moralité : une base stratégique vaut toujours quelques intercepteurs. Sans eux, elle est vulnérable.</p>

    defense:
        title: "Défendre ses planètes"
        category: "combat"
        order: 5
        tags: "defense,soldats,tanks,mechas,tourelle,bouclier,grand bouclier,bunker,fort defensif,orbital,tactique,deploiement,stats,puissance,temps,cout"
        summary: "Les 3 couches de défense : orbitale (tourelles), tactique (déploiement), terrestre (Légionnaires + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Les 3 couches de défense</h2>
            <ol>
                <li><strong>Défense orbitale</strong> — tourelles, boucliers, base spatiale. Interceptent la flotte avant qu'elle débarque.</li>
                <li><strong>Déploiement tactique</strong> — un choix stratégique qui modifie la riposte de vos troupes au sol.</li>
                <li><strong>Défense terrestre</strong> — Légionnaires, Mechas, travailleurs (pour les invasions).</li>
            </ol>

            <h2 id="mode-attaque">Activer le mode attaque de votre planète</h2>
            <p>Si votre planète possède <strong>au moins une tourelle</strong>, vous pouvez activer le <strong>mode attaque</strong>. Dans ce mode, toute flotte étrangère qui stationne en orbite — hors marchands, membres de votre alliance et alliances liées à la vôtre par une Alliance défensive — est engagée par un <strong>combat orbital</strong> 5 minutes après son arrivée, qu'elle soit elle-même en mode attaque ou non. Un raid ou une invasion est engagé dès son arrivée.</p>
            <ul>
                <li><strong>Victoire</strong> : la flotte ennemie est détruite, vos tourelles perdent la même fraction que l'armure que vous avez perdue, et vous encaissez des <strong>points de guerre</strong> égaux à sa signature ÷ 100 (÷ 500 face à un Cthulhu).</li>
                <li><strong>Défaite</strong> : toutes vos tourelles, boucliers, votre base spatiale et toute votre file de production de la page Défense (Légionnaires, Mechas, bombes ou intercepteurs pas encore livrés compris) sont anéantis — les troupes déjà au sol et vos stocks de bombes et d'intercepteurs restent intacts ; le mode attaque se <strong>désactive automatiquement</strong> (une planète sans tourelle ne peut pas le garder actif), et la flotte continue vers le combat au sol s'il s'agit d'un raid ou d'une invasion. L'assaillant ne gagne aucun point de guerre en rasant vos défenses.</li>
            </ul>
            <p>Sans tourelle, vos boucliers et la base spatiale sont détruits <strong>sans même combattre</strong> dès qu'un raid ou une invasion ennemie arrive.</p>
            <p>Deux endroits pour l'activer : la page <strong>Défense</strong> d'une planète, ou la page <strong>Planètes</strong>, qui affiche l'état de chaque planète (une mire à côté de ses défenses, cliquable pour basculer) et propose <strong>« Tout activer »</strong> / <strong>« Tout désactiver »</strong> sur l'empire entier. La bascule groupée saute les planètes sans tourelle ou déjà prises dans un combat, et vous dit combien ont été ignorées.</p>
            <p><strong>Attention</strong> : activer le mode attaque sur une planète qu'une flotte ennemie survole déjà déclenche le combat orbital <strong>cinq minutes plus tard</strong>. En bascule groupée, plusieurs batailles peuvent partir d'un coup — le message vous indique combien.</p>
            <p><strong>Ce que l'assaillant apporte avec lui.</strong> La flotte qui attaque vos tourelles combat avec <strong>tous ses bonus</strong>&nbsp;: les bonus d'alliance de son commandant (missiles, lasers, plasma, blindage, bouclier, précision) et les bonus d'équipement de son héros embarqué. Cela vaut dans les deux sens : vos propres flottes gardent leurs bonus quand c'est vous qui assaillez une planète en mode attaque, et les chiffres des rapports orbitaux sont à la même échelle que ceux des rapports spatiaux.</p>

            <h2 id="defenses-et-vos-flottes">Vos défenses tirent aussi sans le mode attaque</h2>
            <p>Le mode attaque n'est pas la seule façon de faire tirer vos tourelles. Dès qu'une de vos flottes — ou une flotte <strong>armée</strong> d'un membre de votre alliance — est en orbite de la planète au moment où un combat spatial s'y déclenche, vos défenses rejoignent automatiquement ce combat, mode attaque actif ou non (une planète qui n'a rien à défendre — aucune tourelle, aucun bouclier, aucune base spatiale — n'y participe jamais). C'est alors une <strong>seule bataille</strong> : pas de second combat orbital séparé derrière. Dans cette bataille, le bonus d'armure de votre <strong>base spatiale</strong> (+20&nbsp;%) profite à la fois à vos tourelles et à vos boucliers, et l'affinité militaire de votre <strong>héros posté</strong> renforce le tir de vos propres tourelles et peut porter Intimidation ou Tacticien pour tout votre camp, exactement comme un héros de flotte. Vos tourelles y visent avec leur propre précision (multiplicateur moyen ×1,06, au-dessus de ce qu'une flotte peut atteindre), et elles y prennent de <strong>vraies pertes</strong> — proportionnelles aux dégâts encaissés si votre camp l'emporte, <strong>totales</strong> (tourelles, boucliers, base spatiale, file de production de la page Défense, mode attaque coupé) si votre camp tombe. Vous touchez la part de <strong>points de guerre</strong> de votre planète chaque fois que votre camp remporte cette bataille — même si vous n'y avez engagé aucune flotte à vous.</p>
            <p>Conséquence pour vos adversaires&nbsp;: une planète gardée par une de vos flottes <strong>armée</strong> (armes de vaisseau) ou une flotte armée d'un membre de votre alliance (une sonde ou un cargo seuls ne comptent pas) ne peut pas être pillée ou envahie sans bataille préalable, que l'assaillant arrive fraîchement ou clique sur «&nbsp;Piller&nbsp;»/«&nbsp;Envahir&nbsp;» depuis l'orbite — et cette bataille ne démarre jamais contre un partenaire de paix, de pacte, une alliance défensive, votre propre alliance ou sur un serveur PvE.</p>
            <p>Sans aucune flotte en orbite et sans mode attaque, vos tourelles ne tirent pas : un raid ou une invasion passe directement au combat au sol.</p>
            <p><strong>Vous n'avez engagé aucune flotte à vous&nbsp;?</strong> Vous recevez malgré tout un rapport dédié qui vous indique si vos défenses ont tenu ou ont été anéanties, pertes de tourelles détaillées à l'appui, avec votre part de points de guerre si vous l'avez emporté&nbsp;: vous n'êtes jamais laissé dans l'ignorance du sort de votre planète.</p>

            <h2 id="combat-orbital">Le combat orbital en détail</h2>
            <p>Les tourelles tirent sur la flotte ennemie au rythme des rounds (100 au plus). La <strong>Base spatiale</strong> ajoute +20&nbsp;% à l'armure de toutes les défenses. Les boucliers ajoutent 50&nbsp;000 (Bouclier) ou 600&nbsp;000 (Grand bouclier) points à l'armure de la planète : plus votre armure totale est grande, plus la part perdue — et donc la part de tourelles détruites — est petite.</p>
            <p>Vos tourelles tirent <strong>dès le premier round</strong>, quelle que soit la flotte en face : le bouclier d'un vaisseau ne repousse jamais leur salve d'ouverture. Ce bouclier est une réserve qui encaisse les dégâts jusqu'à épuisement. Chaque salve le traverse d'emblée à hauteur de sa <strong>puissance de perçage</strong> (plasma ×4, laser ×2, missiles ÷ 7)&nbsp;; le reste use le bouclier, et ce qui le déborde touche la coque. Une défense composée uniquement de lanceurs de missile reste donc désavantagée face à une flotte à gros bouclier — mais elle tire, elle fait des pertes et elle laisse des débris.</p>
            <p>Même si la flotte ennemie l'emporte, son écran de chasseurs ne la protège pas indéfiniment&nbsp;: vos tourelles infligent de vraies pertes à ses vaisseaux plus lourds aussi, au prorata des dégâts qu'elle encaisse — au pire pour elle, 95&nbsp;% de son armure de départ. Se défendre coûte donc toujours quelque chose à l'attaquant, même s'il gagne. Au bout de 100 rounds, le camp qui garde le plus d'armure l'emporte (l'assaillant en cas d'égalité).</p>
            <p>Dans ce combat orbital, ni le +20&nbsp;% de politique d'alliance, ni le bonus d'alliance « défense planétaire » ne s'appliquent : ils ne jouent que dans les batailles où vos défenses combattent aux côtés d'une flotte.</p>

            <h2 id="deploiement">Le déploiement tactique</h2>
            <p>Chaque planète peut choisir un <strong>déploiement tactique</strong>, sur la page <strong>Défense</strong>, et en changer librement à tout moment. Il est <strong>invisible pour l'attaquant</strong> — c'est votre carte cachée.</p>
            <table>
                <thead>
                    <tr><th>Déploiement</th><th>Effet</th><th>Ordre des pertes de votre garnison</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Équilibré</strong></td><td>Aucun bonus ni malus.</td><td>Légionnaires, puis Mechas, puis travailleurs.</td></tr>
                    <tr><td><strong>Fortifié</strong></td><td>La riposte de votre garnison gagne 30&nbsp;% puis en perd 20&nbsp;% : au total <strong>+4&nbsp;%</strong> de dégâts infligés à l'assaillant. Vos unités ne deviennent pas plus dures à tuer.</td><td>Comme Équilibré.</td></tr>
                    <tr><td><strong>Guérilla</strong></td><td>Dans la riposte, chaque travailleur compte 2,5 fois (+150&nbsp;%) et chaque Légionnaire moitié moins (−50&nbsp;%).</td><td>Travailleurs d'abord, puis Légionnaires, puis Mechas.</td></tr>
                    <tr><td><strong>Dernier Bastion</strong></td><td>+50&nbsp;% de riposte dès que vos troupes tombent sous 30&nbsp;% de leur effectif de départ (en nombre d'unités), jusqu'à la fin du combat.</td><td>Légionnaires, puis travailleurs, puis Mechas.</td></tr>
                    <tr><td><strong>Terre Brûlée</strong></td><td>Aucun bonus au combat. Si vous perdez, raid comme invasion, 50&nbsp;% de votre niobium, de votre eau et de votre uranium restants sont détruits, part protégée par le Fort défensif comprise.</td><td>Comme Équilibré.</td></tr>
                </tbody>
            </table>
            <p>Les travailleurs ne combattent qu'en invasion.</p>

            <h2 id="combat-sol">Le combat au sol</h2>
            <p>Il se joue en <strong>10 rounds maximum</strong>. Chaque round, l'assaillant inflige le dixième de sa puissance d'attaque à votre garnison, qui riposte avec le dixième de sa puissance de défense. L'assaillant ne gagne que s'il élimine toute votre garnison en gardant au moins un Légionnaire. Si personne ne l'emporte en 10 rounds, <strong>l'attaquant est repoussé</strong> (avantage du terrain).</p>

            <h2 id="troupes">Les unités terrestres</h2>
            <table>
                <thead>
                    <tr><th>Unité</th><th>Rôle</th><th>Notes</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Légionnaires</strong></td><td>Attaque et défense (puissance 6 en défense).</td><td>+5&nbsp;% de défense par niveau de Barbelées (jusqu'à +25&nbsp;%).</td></tr>
                    <tr><td><strong>Mechas</strong></td><td>Défense lourde (puissance 2&nbsp;200).</td><td>Max 500 par planète. Entretien de 2 Bitcoins par jour au sol, 100 embarqués.</td></tr>
                    <tr><td><strong>Travailleurs</strong></td><td>Défense passive (puissance 1).</td><td>Uniquement contre les invasions, pas les raids.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Ressources utilisées pour produire vos défenses</h2>
            <p>Comme le Chantier spatial, la production de défenses puise d'abord dans les ressources <strong>de la planète</strong>, puis dans le <strong>cargo des flottes stationnées en orbite</strong>. Vous pouvez donc continuer à recruter même si le stock au sol est faible, tant que des flottes chargées sont présentes au-dessus de la planète.</p>

            <h2 id="installations">Installations orbitales et défenses</h2>
            <ul>
                <li><strong>Tourelles</strong> — Lanceur de missile, Tourelle laser, Tourelle laser lourd, Canon de Gauss, Artillerie à ion, Lanceur plasma. Variées pour contrer différents types de flottes (voir le tableau ci-dessous).</li>
                <li><strong>Bouclier</strong> — +50&nbsp;000 d'armure, permanent (5&nbsp;000 niobium et 5&nbsp;000 eau, 5 heures de construction).</li>
                <li><strong>Grand bouclier</strong> — +600&nbsp;000 d'armure pendant <strong>12 heures</strong> à partir de son activation (150&nbsp;000 niobium et 150&nbsp;000 eau à chaque activation).</li>
                <li><strong>Base spatiale</strong> — +20&nbsp;% d'armure aux tourelles et aux boucliers (50&nbsp;000 niobium et 50&nbsp;000 eau, 1 heure).</li>
            </ul>

            <h2 id="temps">Coûts et temps de construction</h2>
            <table>
                <thead>
                    <tr><th>Défense</th><th>Coût</th><th>Temps par unité</th><th>Blindage</th><th>Armes</th><th>Prérequis</th></tr>
                </thead>
                <tbody>
                    <tr><td>Lanceur de missile</td><td>12 niobium, 9 eau</td><td>2 s</td><td>10</td><td>9 missile</td><td>Arme missile niv. 1</td></tr>
                    <tr><td>Tourelle laser</td><td>13 niobium, 12 eau</td><td>2,4 s</td><td>15</td><td>6 laser</td><td>Arme laser niv. 1</td></tr>
                    <tr><td>Tourelle laser lourd</td><td>23 niobium, 23 eau</td><td>4,4 s</td><td>25</td><td>12 laser</td><td>Arme laser niv. 3, Usine d'armement</td></tr>
                    <tr><td>Canon de Gauss</td><td>50 niobium, 25 eau</td><td>7,2 s</td><td>50</td><td>24 missile</td><td>Arme missile niv. 3, Usine d'armement</td></tr>
                    <tr><td>Artillerie à ion</td><td>30 niobium, 45 eau</td><td>7,2 s</td><td>50</td><td>8 laser, 4 plasma</td><td>Arme missile niv. 3, Arme laser niv. 3, Industrie lourde</td></tr>
                    <tr><td>Lanceur plasma</td><td>15 niobium, 60 eau</td><td>7,2 s</td><td>50</td><td>8 plasma</td><td>Arme plasma niv. 1, Industrie lourde</td></tr>
                </tbody>
            </table>
            <p>Ces temps sont divisés par la vitesse de production des défenses de la planète : ×1, +0,4 par niveau d'<strong>Usine d'armement</strong> et +0,6 par niveau d'<strong>Industrie lourde</strong>. Exemple : 1&nbsp;000 Lanceurs de missile prennent 33 minutes sans usine, moins de 10 minutes avec une Usine d'armement niveau 3 et une Industrie lourde niveau 2 (×3,4). La vitesse du serveur ne change pas ces temps. La production se fait une ligne après l'autre et les unités arrivent au fur et à mesure.</p>
            <p>Même accélération pour les troupes et le nucléaire : Légionnaire 1 s, Mecha 100 s, missile intercepteur 3 h, bombe nucléaire 6 h. Le Bouclier (5 h) et la Base spatiale (1 h) ont un temps fixe ; le Grand bouclier est actif dès son activation, pour 12 heures.</p>

            <h2 id="stats-defensives">Lire la puissance de votre planète</h2>
            <p>La page <strong>Défense</strong> comporte deux onglets. Le second, <strong>Stats défensives</strong>, récapitule ce que vaut réellement la planète : le blindage, les missiles, les lasers et les plasmas cumulés de toutes vos tourelles, l'apport de chaque structure, l'effet du bouclier, du grand bouclier et de la base spatiale sur le blindage réellement opposé à une flotte, et la puissance de votre défense au sol. C'est le moyen le plus rapide de repérer la statistique en retard avant de lancer une nouvelle série de constructions.</p>
            <p>Un détail de lecture : le camembert et les barres portent sur le blindage <strong>des structures seules</strong>. Les forfaits de bouclier apparaissent à part, dans les modificateurs, parce qu'ils écraseraient sinon toute comparaison entre vos armes.</p>

            <h2 id="bunker">Le Fort défensif contre le pillage</h2>
            <p>Le <strong>Fort défensif</strong> (bunker) protège <strong>5&nbsp;% du stockage max par niveau</strong> contre les raids. Un Fort défensif niveau 5 met déjà 25&nbsp;% de vos réserves de niobium et d'eau à l'abri. L'uranium est protégé à hauteur de 5&nbsp;% de son stock par niveau. Attention : avec le déploiement Terre Brûlée, la moitié de ce qui reste est détruite si vous perdez, part protégée comprise.</p>

            <h2 id="entretien">Attention au coût d'entretien</h2>
            <p>Tout ce qui est <strong>dans une flotte</strong> — en vol ou stationné — coûte bien plus cher qu'au sol : un Mecha passe de 2 à 100 Bitcoins par jour (×50), un Légionnaire de 0,1 à 0,6, un vaisseau de sa signature ÷ 12 à sa signature ÷ 2. Remettez au sol ce qui n'a pas de mission.</p>

    embargo:
        title: "Embargo et famine"
        category: "combat"
        order: 6
        tags: "embargo,famine,blocus,siege,planete,nourriture,rations,ravitaillement,signature,seuil"
        summary: "Affamer une planète avant de l'envahir : le blocus, la famine qui s'installe, et comment y survivre."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Un <strong>embargo</strong> est un siège planétaire. Vous maintenez une grosse flotte en mode attaque en orbite d'une planète ennemie ; les livraisons sont coupées, les rations s'épuisent, la population souffre. Quand la planète est affaiblie, vous passez à l'assaut.</p>

            <h2 id="consommation">Rappel : la nourriture</h2>
            <p>Seuls vos <strong>travailleurs</strong> consomment des rations : 1 ration par heure pour 500 travailleurs (150&nbsp;000 travailleurs = 300 rations par heure). Légionnaires et Mechas ne mangent pas, mais meurent aussi quand la famine s'installe. Si vos réserves tombent à <strong>0</strong>, c'est la <strong>famine</strong>.</p>
            <p>Les rations se <strong>transportent en soute</strong> : chargez-en sur une planète, déchargez-les ailleurs pour ravitailler. Tant qu'une de vos flottes est <strong>à quai</strong> (ni en vol, ni en combat) au-dessus de votre planète, ses rations complètent le grenier — et un siège les ponctionne comme le reste : la soute n'est pas un coffre-fort.</p>

            <h2 id="famine">La famine (hors embargo)</h2>
            <p>Quand les rations manquent, les pertes s'enchaînent en <strong>3 phases</strong> :</p>
            <ul>
                <li><strong>Phase 1 (0–3 h)</strong> — environ 3&nbsp;% des travailleurs par heure. Le temps de réagir.</li>
                <li><strong>Phase 2 (3–8 h)</strong> — environ 6&nbsp;% des travailleurs et 2&nbsp;% des Légionnaires par heure : des Légionnaires commencent à déserter.</li>
                <li><strong>Phase 3 (au-delà de 8 h)</strong> — effondrement : environ 11&nbsp;% des travailleurs, 5&nbsp;% des Légionnaires et 2&nbsp;% des Mechas par heure.</li>
            </ul>
            <p>Un plancher de <strong>5&nbsp;000 travailleurs</strong> évite la disparition totale. Sans ravitaillement, une planète l'atteint en environ 24 heures avec 50&nbsp;000 travailleurs, 30 heures avec 100&nbsp;000, 33 heures avec 150&nbsp;000. Dès qu'une ration revient au grenier, la famine s'arrête et les phases repartent de zéro. Un rapport vous prévient à chaque nouvelle phase.</p>

            <h2 id="declenchement">Comment déclencher un embargo</h2>
            <p>Un embargo s'active automatiquement (le jeu vérifie chaque minute) quand :</p>
            <ul>
                <li>la planète visée appartient à un joueur (les planètes des IA et les bases Cthulhu n'y sont jamais soumises) ;</li>
                <li>des flottes ennemies y sont <strong>à quai en orbite</strong> — ni en vol, ni déjà engagées dans un combat programmé — et en <strong>mode attaque</strong> (ce qui suppose des armes de vaisseau) ;</li>
                <li>la <strong>signature thermique cumulée</strong> de ces flottes atteint au moins <strong>10&nbsp;000</strong>.</li>
            </ul>
            <p>Toutes les flottes ennemies présentes s'additionnent, même si elles appartiennent à des joueurs différents. Seules sont exclues les flottes de l'alliance du propriétaire et des alliances liées à elle par une <strong>Alliance défensive</strong> (un Pacte de non-agression ou un Accord de paix ne protège pas), ainsi que les marchands. Chaque vaisseau de ces flottes compte, cargos et sondes compris ; la signature de chaque vaisseau est indiquée au Chantier spatial.</p>
            <table>
                <thead>
                    <tr><th>Vaisseau</th><th>Signature</th><th>Nombre pour 10&nbsp;000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Chasseur</td><td>1</td><td>10&nbsp;000</td></tr>
                    <tr><td>Corvette</td><td>7</td><td>1&nbsp;429</td></tr>
                    <tr><td>Frégate</td><td>20</td><td>500</td></tr>
                    <tr><td>Vaisseau de bataille</td><td>40</td><td>250</td></tr>
                    <tr><td>Croiseur</td><td>56</td><td>179</td></tr>
                    <tr><td>Cuirassé</td><td>64</td><td>157</td></tr>
                    <tr><td>Destroyer</td><td>270</td><td>38</td></tr>
                    <tr><td>Vaisseau mère</td><td>4&nbsp;000 (−10&nbsp;% pour toute sa flotte)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>Un Vaisseau mère réduit de 10&nbsp;% la signature de toute la flotte qui le porte : 3 Vaisseaux mères seuls font 12&nbsp;000 − 10&nbsp;% = 10&nbsp;800, assez pour le seuil, mais 2 ne suffisent pas (7&nbsp;200). Les nombres du tableau valent pour une flotte sans Vaisseau mère ; on peut bien sûr mélanger les types.</p>
            <p>Dès que la signature des flottes assiégeantes repasse sous 10&nbsp;000 (départ, destruction ou mode attaque coupé), le blocus se lève.</p>
            <p>Une flotte de raid ou d'invasion marquée «&nbsp;en attaque&nbsp;» par la bataille fusionnée décrite dans l'article <em>Défendre ses planètes</em> garde ce marqueur si elle survit&nbsp;: si elle reste en orbite, elle compte dans cette signature au même titre que n'importe quelle flotte hostile.</p>

            <h2 id="effets">Ce que subit la planète assiégée</h2>
            <ul>
                <li><strong>Drain de rations</strong> supplémentaire chaque heure : vos travailleurs ÷ 7 (150&nbsp;000 travailleurs = 21&nbsp;429 rations par heure), pris au grenier puis dans les soutes de vos flottes à quai.</li>
                <li><strong>Production de rations</strong> réduite de 30&nbsp;%.</li>
                <li><strong>Production de niobium et d'eau</strong> réduite de 20&nbsp;%.</li>
                <li><strong>Naissances de travailleurs</strong> divisées par deux.</li>
                <li><strong>Marché bloqué</strong> : plus de ventes automatiques aux marchands.</li>
                <li><strong>Livraisons bloquées</strong> : seules vos flottes et celles des membres de votre alliance peuvent décharger sur la planète ; les autres repartent avec leur chargement.</li>
                <li><strong>Héros bloqués</strong> : impossible d'affecter un héros à la planète ou de l'en retirer.</li>
            </ul>

            <h2 id="famine-embargo">Famine sous embargo : c'est pire</h2>
            <p>Si les rations tombent à 0 <strong>pendant</strong> un embargo, il n'y a plus de phases : dès la première heure, la planète perd chaque heure <strong>8&nbsp;%</strong> de ses travailleurs, <strong>3&nbsp;%</strong> de ses Légionnaires et <strong>3&nbsp;%</strong> de ses Mechas, et le drain de l'embargo continue de vider tout ravitaillement qui arrive. Le plancher de 5&nbsp;000 travailleurs s'applique toujours.</p>

            <h2 id="timings">Combien de temps tient-on ?</h2>
            <p>Sous embargo, sans production ni ravitaillement :</p>
            <table>
                <thead>
                    <tr><th>Profil de planète</th><th>Début de famine</th><th>Plancher de 5&nbsp;000 travailleurs atteint</th></tr>
                </thead>
                <tbody>
                    <tr><td>Petite (50&nbsp;000 travailleurs, 100&nbsp;000 rations)</td><td>~14 heures</td><td>~1,7 jour</td></tr>
                    <tr><td>Moyenne (150&nbsp;000 travailleurs, 800&nbsp;000 rations)</td><td>~1,5 jour</td><td>~3,2 jours</td></tr>
                    <tr><td>Forteresse (200&nbsp;000 travailleurs, 2&nbsp;000&nbsp;000 rations)</td><td>~2,9 jours</td><td>~4,7 jours</td></tr>
                </tbody>
            </table>

            <h2 id="defense">Comment résister à un embargo</h2>
            <ul>
                <li><strong>Détruire la flotte assiégeante</strong> pour lever le blocus.</li>
                <li><strong>Faire venir du ravitaillement</strong> — vos flottes et celles des membres de votre alliance peuvent toujours décharger (mission « Décharger et revenir »).</li>
                <li><strong>Évacuer</strong> — vos flottes <em>sortantes</em> ne sont pas bloquées, vous pouvez vider vos ressources en urgence.</li>
                <li><strong>Construire des Silos agricoles</strong> et stocker des rations <em>avant</em> que ça tourne mal.</li>
                <li><strong>Demander de l'aide à votre alliance</strong> pour briser le siège à plusieurs.</li>
            </ul>

            <h2 id="rapports">Les rapports pendant un embargo</h2>
            <p>Chaque heure, vous (et chaque joueur dont une flotte assiège la planète) recevez un rapport dans le menu <strong>Rapport</strong>, onglet <strong>Combats</strong> : temps écoulé, rations restantes, pertes subies. Un dernier rapport vous annonce la levée du blocus. Sur la page <strong>Planètes</strong>, la carte de chaque planète affiche aussi sa Production, sa Consommation, le Drain embargo, le Bilan et l'Autonomie estimée.</p>

    combat_stats:
        title: "Comprendre la puissance des troupes"
        category: "combat"
        order: 7
        tags: "puissance,bonus,combat,politique,calcul,barbelees,precision,mechas"
        summary: "Comment se compare la puissance de vos unités, et ce qui la booste."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Puissance au sol</h2>
            <p>Valeurs exactes, sans bonus :</p>
            <table>
                <thead>
                    <tr><th>Unité</th><th>Puissance</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mecha</strong></td><td>2&nbsp;200 en défense</td><td>Pilier de défense : un Mecha vaut environ 367 Légionnaires. Maximum 500 par planète. Il ne combat qu'en défense : embarqué dans une flotte, il ne participe pas à l'assaut.</td></tr>
                    <tr><td><strong>Légionnaire (défense)</strong></td><td>6, +5&nbsp;% par niveau de Barbelées</td><td>Le cœur de la garnison.</td></tr>
                    <tr><td><strong>Légionnaire (attaque)</strong></td><td>5 à 7 par round en invasion, 5 à 6 en raid (tiré au hasard à chaque round)</td><td>Seule unité qui attaque au sol : un raid est un peu moins imprévisible qu'une invasion.</td></tr>
                    <tr><td><strong>Travailleur (défense)</strong></td><td>1</td><td>Uniquement en invasion. 200&nbsp;000 travailleurs pèsent autant qu'environ 91 Mechas.</td></tr>
                </tbody>
            </table>
            <p>À chaque round (10 au plus), l'assaillant inflige le dixième de sa puissance d'attaque à la garnison, qui riposte avec le dixième de sa puissance de défense. Les dégâts tuent les unités selon leur puissance : il faut 6 points pour un Légionnaire défenseur sans bonus, 2&nbsp;200 pour un Mecha, 1 pour un travailleur. Exemple : 10&nbsp;000 Légionnaires en invasion (jet moyen de 6) infligent environ 6&nbsp;000 points par round, de quoi tuer 1&nbsp;000 Légionnaires sans bonus, ou moins de 3 Mechas.</p>
            <p>Les <strong>barges</strong> ne combattent pas : elles transportent 1&nbsp;000 Légionnaires chacune (+25&nbsp;% par niveau de la recherche politique « Invasions planifiées »).</p>

            <h2 id="bonus">Ce qui augmente votre puissance</h2>
            <ul>
                <li><strong>Recherche Barbelées</strong> — +5&nbsp;% de défense par niveau pour vos Légionnaires (5 niveaux, soit +25&nbsp;% au maximum).</li>
                <li><strong>Recherches politiques</strong> (onglet « Politiques » de la page Recherches) — Puissance militaire (+10&nbsp;% par niveau à l'attaque et à la défense des Légionnaires), Blindage mechas (+10&nbsp;% par niveau à la défense des Mechas), Renforcement idéologique (+20&nbsp;% par niveau à la défense des travailleurs), Invasions planifiées (+25&nbsp;% de capacité par barge et par niveau), Armements améliorés (+10&nbsp;% par niveau aux missiles et lasers des vaisseaux), Blindage vaisseaux (+10&nbsp;% d'armure des vaisseaux par niveau).</li>
                <li><strong>Améliorations d'alliance</strong> — en combat spatial, jusqu'à +5&nbsp;% par type d'arme, d'armure, de bouclier et de précision des vaisseaux, et jusqu'à +10&nbsp;% pour les défenses planétaires.</li>
                <li><strong>Déploiement tactique</strong> — choix du défenseur qui modifie la riposte de sa garnison et l'ordre de ses pertes (voir <em>Invasion de planète</em>).</li>
                <li><strong>Héros Militaire</strong> — bonus direct d'attaque et de défense, pour le héros de la flotte assaillante comme pour celui posté sur la planète.</li>
                <li><strong>Items</strong> équipés sur le héros.</li>
            </ul>
            <p>La recherche <strong>Accroissement militaire</strong> ne donne aucun bonus de combat : elle débloque la Caserne (niveau 1), le Fort défensif (niveau 3), puis les recherches Barbelées et Unités blindées (Mechas).</p>

            <h2 id="faction">Bonus politique (combats spatiaux)</h2>
            <p>Le bonus d'armes du combat spatial vient de la <strong>politique de votre alliance</strong>. Chaque régime bat son rival : <strong>La Balance des Mondes</strong> bat <strong>Le Rempart Silencieux</strong>, qui bat <strong>Le Marteau des Étoiles</strong>, qui bat <strong>La Balance des Mondes</strong>.</p>
            <p>Quand la politique de l'<strong>attaquant</strong> bat celle du défenseur, toutes ses armes (missiles, lasers, plasma) gagnent <strong>+20&nbsp;%</strong> pour ce combat. Le bonus ne s'applique qu'à l'assaillant : le défenseur compte sur ses défenses planétaires. Il vaut en combat entre flottes seulement, pas contre des tourelles seules (combat orbital du mode attaque) ni au sol.</p>

            <h2 id="precision">Précision et jets de combat</h2>
            <p>En combat spatial, chaque camp tire <strong>une salve par round</strong>. Un jet aléatoire, tiré entre la précision du camp et 100 puis divisé par 80, module les dégâts de la salve de <strong>×0,3 à ×1,2</strong>. Aucune salve ne rate : une précision élevée ne rend pas vos meilleurs coups plus forts, elle élimine les mauvais tirages.</p>
            <p>La visée d'une flotte ne s'affiche jamais en pourcentage&nbsp;: partout — Chantier spatial, page de gestion de flotte, onglet Stats défensives de la page Défense et rapports de combat — le jeu montre le <strong>multiplicateur de dégâts moyen</strong> qu'elle produit :</p>
            <ul>
                <li><strong>×0,66</strong> sans le moindre investissement : chaque salve tombe entre ×0,3 et ×1,2 ;</li>
                <li><strong>×0,94</strong> à visée pleine : chaque salve tombe entre ×0,63 et ×1,2 ;</li>
                <li><strong>×1,06</strong> pour les défenses d'une planète : chaque salve tombe entre ×0,88 et ×1,2 — mieux qu'une flotte à visée pleine.</li>
            </ul>
            <p>Ce niveau dépend des points de <strong>personnalisation</strong> investis en précision pour chaque modèle de vaisseau (40 points/jour) et lui est propre&nbsp;: dépenser vos points ailleurs, sur l'armure ou les armes du même modèle, ne le fait jamais redescendre. Les bonus de précision d'alliance et de héros s'ajoutent, sans jamais dépasser la visée pleine. Quand plusieurs flottes combattent ensemble, le camp utilise la moyenne de leurs visées.</p>
            <p>Face à un adversaire dirigé par l'IA (bot), sa visée ne descend jamais sous un plancher fixe (multiplicateur moyen ×0,81)&nbsp;: un bot qui a réellement investi le dépasse, et un joueur suffisamment investi peut l'égaler ou le dépasser. Les hordes Cthulhu visent toujours à ×0,94.</p>

    reports:
        title: "Les rapports du jeu"
        category: "beginner"
        order: 9
        tags: "rapport,notification,combat,espionnage,alliance,colonisation,onglets,supprimer,partager"
        summary: "Le jeu vous envoie des rapports pour tout événement important. Voici où les trouver, ce qu'ils contiennent et comment les gérer."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Où trouver vos rapports ?</h2>
            <p>Ouvrez <strong>Rapport</strong> dans le menu (sur téléphone : bouton <strong>Menu</strong>, puis <strong>Rapport</strong>). Le nombre de nouveaux rapports s'affiche sur cette entrée.</p>
            <p>La page s'ouvre sur l'onglet <strong>Tous</strong> (vos 300 rapports les plus récents). Les autres onglets trient par catégorie : <strong>Autre</strong>, <strong>Alliance</strong>, <strong>Cthulhu</strong>, <strong>Combats</strong>, <strong>Invasions</strong>, <strong>Économiques</strong> et <strong>Flottes</strong>. Un onglet n'apparaît que s'il contient au moins un rapport, et affiche son nombre de non-lus. Chaque rapport non lu porte la mention « Non lu » : touchez sa ligne pour l'ouvrir.</p>
            <p>Les messages des autres joueurs ne sont pas ici : ils sont dans <strong>Messagerie</strong>.</p>
            <p>Vous pouvez aussi activer les <strong>notifications push</strong> pour être alerté sur votre téléphone ou dans votre navigateur (voir l'article dédié).</p>

            <h2 id="gerer">Lire, partager, supprimer</h2>
            <ul>
                <li><strong>Marquer lu</strong> : bouton d'un rapport ouvert (l'ouvrir suffit aussi). <strong>Marquer tout comme lu</strong>, en haut de la page, traite tous vos rapports d'un coup.</li>
                <li><strong>Générer lien de partage</strong> : crée un lien public vers ce rapport ; le bouton <strong>Lien</strong> le copie. Toute personne qui a ce lien peut lire le rapport, même sans compte.</li>
                <li><strong>Supprimer</strong> : efface le rapport tout de suite, sans confirmation ni corbeille.</li>
            </ul>
            <p>La suppression se fait rapport par rapport : il n'existe ni archivage ni suppression groupée. Vos rapports ne s'effacent pas d'eux-mêmes avec le temps.</p>

            <h2 id="combat">Rapports de combat et d'invasion</h2>
            <p>Onglet <strong>Combats</strong> :</p>
            <ul>
                <li><strong>Rapport de combat : Victoire / Défaite</strong> — une de vos flottes a affronté une flotte ennemie (combat spatial).</li>
                <li><strong>Défense orbitale : Victoire / Défaite</strong> — les défenses de votre planète ont affronté une flotte ennemie ; l'attaquant reçoit de son côté <strong>Attaque orbitale : Victoire / Défaite</strong>.</li>
                <li><strong>Défenses planétaires : Tenues / Anéanties</strong> — rapport dédié au propriétaire qui n'a engagé aucune flotte à lui dans une bataille fusionnée : ses défenses ont tenu ou ont été anéanties.</li>
                <li><strong>Missile nucléaire</strong> — votre missile a touché sa cible ou a été intercepté ; un missile vous a frappé ou a été intercepté chez vous.</li>
                <li><strong>Votre planète est sous embargo !</strong> — un point toutes les heures tant qu'une de vos planètes est assiégée, puis un dernier rapport quand l'embargo est levé. Les assiégeants reçoivent aussi le leur.</li>
                <li><strong>Famine sur votre planète !</strong> — vos rations sont épuisées et la famine fait des victimes.</li>
            </ul>
            <p>Onglet <strong>Invasions</strong> :</p>
            <ul>
                <li><strong>Rapport de pillage</strong> — raid subi ou infligé (victoire ou défaite, en attaque ou en défense).</li>
                <li><strong>Rapport d'invasion</strong> — tentative de prise de planète, d'un côté ou de l'autre.</li>
            </ul>

            <h2 id="cthulhu">Rapports Cthulhu</h2>
            <ul>
                <li><strong>Alerte : horde en approche</strong> — une horde Cthulhu se dirige vers une de vos planètes.</li>
                <li><strong>Rapport possédés : Victoire défensive / Attaque subie</strong> — le résultat de l'attaque d'une horde contre votre planète. En difficulté PvE Difficile, le titre devient <strong>Rapport attaque des possédés : Victoire / Défaite</strong>.</li>
                <li><strong>Tower Defense Cthulhu : Victoire / Défaite</strong> — le résultat de votre défense active.</li>
                <li><strong>Rapport contre attaque : Victoire / Défaite</strong> — votre invasion d'une planète tenue par les Cthulhu. Une victoire libère la planète : elle redevient libre, et la ruche ne peut pas la reprendre pendant 72 heures.</li>
                <li><strong>Blocus de Cthulhu</strong>, <strong>La ruche s'étend</strong>, <strong>Éruption de la ruche</strong> — les événements Cthulhu de votre secteur et leurs conséquences.</li>
            </ul>

            <h2 id="flotte">Rapports de flotte</h2>
            <p>Onglet <strong>Flottes</strong> :</p>
            <ul>
                <li><strong>Votre flotte est arrivée</strong> — votre flotte a atteint sa destination.</li>
                <li><strong>Dépôt de ressources</strong> — un autre joueur a déchargé des ressources sur une de vos planètes.</li>
                <li><strong>Votre flotte a arrêté de recycler !</strong> — vos recycleurs ont fini leur travail.</li>
            </ul>
            <p>L'espionnage est rangé dans l'onglet <strong>Autre</strong> : <strong>Analyse de la planète</strong> (le résultat de votre sonde) et <strong>Espionnage détecté</strong> (quelqu'un a tenté d'espionner une de vos planètes).</p>

            <h2 id="alliance">Rapports d'alliance</h2>
            <ul>
                <li><strong>Diplomatie</strong> — Guerre déclarée (par votre alliance) ou Guerre reçue, alliance défensive conclue ou rompue, pacte de non-agression conclu ou rompu, accord de paix conclu ou expiré.</li>
                <li><strong>Membres</strong> — Nouveau membre, Membre parti, Membre exclu, Membre Game Over.</li>
            </ul>

            <h2 id="divers">Autres rapports</h2>
            <p>Onglet <strong>Économiques</strong> :</p>
            <ul>
                <li><strong>Rapport de l'empire</strong> — votre bilan économique quotidien, chaque jour à 18h59 (heure de Paris).</li>
                <li><strong>⚠ Faillite imminente !</strong> — vos dépenses quotidiennes dépassent vos gains et vos Bitcoins ne couvrent plus un jour de déficit (au plus une alerte par 24 heures).</li>
                <li><strong>Vente aux marchands</strong> — votre flotte a vendu sa cargaison à un marchand.</li>
                <li><strong>Bonus de connexion</strong> — les Bitcoins du jour et, certains jours, un objet.</li>
            </ul>
            <p>Onglet <strong>Autre</strong> :</p>
            <ul>
                <li><strong>Colonisation de planète</strong> — nouvelle planète fondée.</li>
                <li><strong>Analyse de la planète</strong> et <strong>Espionnage détecté</strong> — voir plus haut.</li>
                <li><strong>Files terminées</strong> (Bâtiments, Vaisseaux, Défense, Recherche) — la file est vide : vous pouvez relancer.</li>
                <li><strong>Héros et prison</strong> — héros capturé, évadé, libéré ou exécuté, alerte prison, position révélée, objet volé ou trouvé, nouveau héros, demandes de rançon.</li>
                <li><strong>Arène</strong> — défi reçu, résultat de duel, tournoi, récompense hebdomadaire, arène d'alliance.</li>
                <li><strong>Divers</strong> — fin de votre protection débutant, flotte renvoyée, mission lunaire échouée.</li>
            </ul>

            <h2 id="compte-valide">Compte à valider</h2>
            <p>⚠️ Pour <strong>envoyer un message ou des Bitcoins</strong> à un autre joueur, et pour créer ou rejoindre une alliance, votre compte doit être <strong>validé</strong> et votre <strong>e-mail confirmé</strong>.</p>
            <p>Un compte d'essai (créé avec « Tester sans email ») se valide depuis l'entrée <strong>Valider compte</strong> du menu : vous y choisissez un pseudo, un mot de passe et votre adresse e-mail. Un e-mail de confirmation part alors : cliquez sur son lien. Vous ne l'avez pas reçu ? Ouvrez <strong>Options</strong> (en bas du menu sur ordinateur, dans le panneau Menu sur téléphone) : la section <strong>Confirmer mon adresse e-mail</strong> permet de le <strong>renvoyer</strong> (trois fois par heure au plus).</p>

    battle_reports:
        title: "Lire un rapport de combat"
        category: "combat"
        order: 8
        tags: "rapport,combat,victoire,defaite,analyse"
        summary: "Après chaque combat, un rapport détaillé. Voici comment le décoder pour mieux frapper la prochaine fois."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Où les trouver</h2>
            <p>Tous les rapports de combat arrivent dans le menu <strong>Rapport</strong>. L'onglet <strong>Combats</strong> regroupe les combats spatiaux et orbitaux, les défenses planétaires, le nucléaire, l'embargo et la famine ; l'onglet <strong>Invasions</strong> regroupe les raids et les invasions ; les combats contre les Cthulhu ont leur propre onglet <strong>Cthulhu</strong>.</p>

            <h2 id="types">Types de rapports de combat</h2>
            <ul>
                <li><strong>Combat spatial</strong> — deux flottes se sont croisées.</li>
                <li><strong>Combat orbital</strong> — vos défenses planétaires ont intercepté une flotte.</li>
                <li><strong>Défenses planétaires</strong> — bataille fusionnée où vous n'avez engagé aucune flotte à vous : vos tourelles, boucliers et base spatiale ont tenu, ou ont été détruits.</li>
                <li><strong>Flotte désarmée détruite</strong> — un camp sans arme de vaisseau (cargos, sondes, recycleurs) a été détruit sans combat.</li>
                <li><strong>Raid</strong> — tentative de pillage (de votre côté ou contre vous).</li>
                <li><strong>Invasion</strong> — tentative de prise de planète.</li>
                <li><strong>Nucléaire</strong> — bombe envoyée ou reçue, ou interceptée.</li>
                <li><strong>Embargo</strong> — rapport horaire pendant un siège, et un dernier quand il se lève.</li>
                <li><strong>Famine</strong> — envoyé à chaque nouvelle phase de famine (hors embargo).</li>
            </ul>

            <h2 id="contenu">Ce que contient un rapport</h2>
            <ul>
                <li><strong>Forces engagées</strong> — armure de départ, bouclier, armes de chaque camp, et la composition de chaque flotte. La visée n'y figure pas en pourcentage, mais sous la forme du <strong>multiplicateur de dégâts moyen</strong> qu'elle produit (×0,66 sans aucun investissement, ×0,94 à visée pleine, ×1,06 pour les défenses d'une planète) : aucun tir ne rate jamais, une meilleure visée relève le plancher de vos dégâts.</li>
                <li><strong>Salves</strong> — le nombre de salves tirées par ce camp, celles passées sur le bouclier adverse, et si son propre bouclier a été percé ou a tenu.</li>
                <li><strong>Charge de bouclier</strong> — pour un bloc flotte, le pourcentage de charge au début et à la fin du combat, avec sa capacité totale : votre bouclier ne repart pas systématiquement à 100&nbsp;% d'un combat à l'autre, il se recharge progressivement (voir l'article <em>Combat spatial</em>).</li>
                <li><strong>Armure restante</strong> — ce qui reste debout, et sa part de l'armure de départ. Un camp anéanti affiche à la place le <strong>surplus de dégâts</strong> encaissé au-delà de son armure : c'est votre marge de victoire.</li>
                <li><strong>Dégâts encaissés</strong> — deux compteurs par camp : <strong>coque</strong> (ce qui n'a pas été arrêté par le bouclier) et <strong>bouclier</strong> (ce que le bouclier a absorbé). Vos pertes découlent uniquement de la coque.</li>
                <li><strong>Pertes</strong> — vaisseau par vaisseau, de chaque côté.</li>
                <li><strong>Défenses planétaires détaillées</strong> — pertes de tourelles, plus votre Bouclier, Grand bouclier et Base spatiale quand vous les possédez, avec le score de défense et le tag «&nbsp;Attaque&nbsp;» de la planète pour une bataille fusionnée.</li>
                <li><strong>Ressources pillées</strong> (pour les raids) et <strong>débris générés</strong> — à recycler !</li>
                <li><strong>Points de Guerre gagnés</strong> et résultat final.</li>
            </ul>

            <h2 id="analyser">Comment en tirer une leçon</h2>
            <ul>
                <li>Regardez d'abord les <strong>dégâts encaissés</strong> : la ligne « coque » compte tout ce qui n'a pas été arrêté par votre bouclier (la part qui le perce, puis tout une fois qu'il est vide) ; la ligne « bouclier », ce que votre bouclier a absorbé — cela ne coûte aucun vaisseau, seulement de la charge, qui remonte de 10&nbsp;% toutes les 3 heures.</li>
                <li>Comparez les deux <strong>multiplicateurs de dégâts</strong> : c'est le seul chiffre directement comparable d'un camp à l'autre. Puis regardez l'<strong>armure restante</strong> — gagner en gardant 5&nbsp;% de votre armure et gagner en en gardant 70&nbsp;% ne se valent pas. Un gros surplus chez l'adversaire signifie que vous avez surpayé la victoire.</li>
                <li>Des pertes dans vos <strong>chasseurs</strong> sont normales même quand votre bouclier tient : sans bouclier, ils encaissent leur part de la coque au prorata de leur armure, plus jusqu'à la moitié des coups destinés à vos vaisseaux lourds — c'est leur rôle d'écran.</li>
                <li>Beaucoup de <strong>salves passées sur le bouclier adverse</strong> ? Montez du plasma (×4 contre les boucliers) pour percer plus vite.</li>
                <li><strong>100 rounds atteints</strong> : le camp qui garde le plus d'armure l'emporte (l'attaquant en cas d'égalité) — si ça vous arrive en attaque, votre flotte manque de puissance ou de précision.</li>
                <li><strong>Gardez vos rapports importants</strong> (ne les supprimez pas) et utilisez « Générer lien de partage » pour les montrer à votre alliance : ils servent de preuves dans les débats.</li>
            </ul>

    combat_simulator:
        title: "Simulateur de combat"
        category: "combat"
        order: 9
        tags: "simulateur,combat,simulation,flotte,pertes,estimation,rapport"
        summary: "Estimez vos risques avant d'attaquer : rejouez mille fois un combat contre une flotte observée dans un rapport, avec le vrai moteur du jeu."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="principe">À quoi ça sert</h2>
            <p>L'onglet <strong>Simulateur de combat</strong> de la page Flottes estime ce que vous risquez avant d'attaquer. Il rejoue <strong>1&nbsp;000 fois</strong> un combat entre l'une de vos flottes et une flotte adverse, avec le <strong>vrai moteur du jeu</strong> — mêmes formules, mêmes jets aléatoires. Rien n'est réellement engagé : aucun vaisseau ne bouge, aucun ne meurt.</p>

            <h2 id="source">La source : un rapport de combat</h2>
            <p>La flotte adverse vient d'un de vos <strong>rapports de combat spatial récents</strong> (ceux qui affichent la ligne «&nbsp;Dégâts encaissés&nbsp;») : ce sont les seules sources honnêtes, car elles contiennent la puissance réelle du camp observé, bonus compris. Le simulateur vous propose les 30 plus récents ; les rapports orbitaux, de raid ou d'invasion ne servent pas de source. Un rapport d'espionnage ne donne que des nombres de vaisseaux, sans leurs statistiques réelles — la simulation serait mensongère, c'est pourquoi il n'est pas proposé.</p>
            <p>Choisissez le rapport, le camp à affronter (l'une des deux armadas du rapport), puis l'une de vos flottes armées, où qu'elle se trouve. Vous simulez toujours en position d'<strong>attaquant</strong>, hors de chez vous : sans vos tourelles ni vos boucliers planétaires, avec vos bonus réels (héros, alliance, politique comparée à celle de l'alliance actuelle de l'adversaire) et le bouclier que votre flotte a <strong>en ce moment</strong> — une flotte usée est simulée usée.</p>

            <h2 id="resultat">Lire le résultat</h2>
            <ul>
                <li><strong>Taux de victoire</strong> — la part des 1&nbsp;000 tirages où vous l'emportez.</li>
                <li><strong>Fourchette de pertes par vaisseau</strong> (minimum, médiane, maximum) — sur les tirages victorieux uniquement : en cas de défaite, votre flotte serait intégralement détruite.</li>
                <li><strong>Un exemple de déroulé</strong> — un tirage victorieux médian, présenté comme un rapport et clairement marqué «&nbsp;SIMULATION&nbsp;».</li>
            </ul>

            <h2 id="limites">Les limites à garder en tête</h2>
            <ul>
                <li>La flotte adverse est celle <strong>observée à la date du rapport</strong> : elle a pu être reconstruite, améliorée ou renforcée depuis.</li>
                <li>Les talents actifs du héros adverse (Intimidation, Tacticien) ne sont pas rejoués ; ses bonus passifs sont déjà compris dans les chiffres du rapport. Ses défenses planétaires ne comptent que si le rapport source était un combat chez lui (telles qu'elles étaient ce jour-là) : si vous l'attaquez chez lui à partir d'un rapport livré ailleurs, ses tourelles n'y sont pas.</li>
                <li><strong>Pas de simulation en défenseur</strong> : votre flotte est toujours l'attaquant, hors de chez elle. Pour jauger une menace, simulez votre flotte contre la flotte ennemie de votre rapport : vos tourelles et boucliers planétaires n'y sont pas comptés (un vrai combat chez vous sera plus favorable), mais l'ennemi n'y reçoit pas non plus le +20&nbsp;% qu'il aurait en attaque si son régime bat le vôtre.</li>
                <li>Limite de <strong>20 simulations par jour</strong> (remise à zéro à minuit, heure de Paris ; le compteur restant s'affiche) : le simulateur éclaire une décision, il ne remplace pas le risque du combat.</li>
            </ul>

    colonization:
        title: "Coloniser une nouvelle planète"
        category: "planet"
        order: 1
        tags: "colonisation,planete,colonisateur,terraformation,inhabitee,plafond"
        summary: "Étendre votre empire en colonisant des planètes inhabitées : comment faire, plafond de planètes fixé par la Terraformation, tailles disponibles."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Pourquoi coloniser ?</h2>
            <ul>
                <li><strong>Plus de production</strong> : chaque planète a sa propre économie.</li>
                <li><strong>Plus de files de construction</strong> parallèles.</li>
                <li><strong>Moins de risque</strong> : vos œufs ne sont plus dans le même panier.</li>
                <li><strong>Positions stratégiques</strong> : proximité de marchands, d'alliés, de cibles.</li>
            </ul>

            <h2 id="etapes">Comment coloniser</h2>
            <p>On colonise une <strong>planète inhabitée</strong> : sur la carte, elle porte le nom « Inhabitée ». Un emplacement « Vide » (sans planète) ne se colonise pas.</p>
            <ol>
                <li>Vérifiez qu'il vous reste une place : vous pouvez avoir <strong>2 planètes + 1 par niveau de Terraformation</strong> (voir plus bas). Vous démarrez avec <strong>un colonisateur</strong> au sol sur votre planète : votre 2e planète ne demande donc aucune recherche.</li>
                <li>Pour fabriquer d'autres colonisateurs, recherchez <strong>Terraformation</strong> niveau 1. Ils se construisent au Chantier spatial : 5&nbsp;500 niobium, 7&nbsp;000 eau, 2&nbsp;000 travailleurs et 5 Légionnaires chacun.</li>
                <li>Créez une flotte qui contient le colonisateur (page <em>Flottes</em>, ou bouton <em>Créer flotte</em> de la carte).</li>
                <li>Sur la <em>Carte spatiale</em>, cliquez la planète inhabitée, puis <em>Interaction</em>. Choisissez la flotte, la mission <strong>Coloniser</strong>, puis <em>Envoyer</em>. Le vol se paie en Bitcoins.</li>
            </ol>
            <p>Si votre flotte se trouve déjà en orbite d'une planète inhabitée, le bouton <em>Coloniser</em> apparaît directement sur sa fiche.</p>
            <p>Le colonisateur n'emporte pas de ressources. Pour aider la colonie, joignez des cargos chargés à la flotte, puis déchargez-les une fois arrivés (<em>Tout décharger</em>).</p>
            <p>À l'arrivée, un colonisateur est consommé et la planète est fondée sous le nom « Colonie ». Vous recevez un rapport, et la planète apparaît dans le sélecteur de planètes de la barre du haut. Renommez-la depuis la page <strong>Planètes</strong>.</p>

            <h2 id="initial">Ce qu'elle a au démarrage</h2>
            <p>Une planète fraîchement colonisée démarre avec <strong>200 niobium, 150 eau, 2&nbsp;500 travailleurs et 20 Légionnaires</strong>. Tout le reste est à construire : une planète qui n'a jamais été habitée n'a aucun bâtiment, pas même de Chantier spatial.</p>

            <h2 id="limite">Combien de planètes max ?</h2>
            <p>Vous pouvez posséder <strong>2 planètes + 1 par niveau de Terraformation</strong> (18 niveaux au maximum). Vos lunes ne comptent pas.</p>
            <table>
                <thead>
                    <tr><th>Terraformation</th><th>Planètes max</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>Dans une alliance au régime <em>La Balance des Mondes</em>, la recherche d'alliance <strong>Apport de la démocratie</strong> ajoute 1 planète colonisable par niveau (5 niveaux, soit jusqu'à 25 planètes).</li>
                <li>Pour les <strong>invasions</strong>, le plafond est 2 + Terraformation + le niveau d'<strong>Empire sans frontières</strong> (recherche d'alliance des régimes <em>Le Marteau des Étoiles</em> et <em>Le Rempart Silencieux</em>, 5 niveaux). Si vous envahissez au-delà, la planète conquise devient une base Cthulhu au lieu de vous revenir.</li>
                <li>En modes <em>Search &amp; Destroy</em>, <em>Domination</em> et <em>Battle Royale</em>, toutes les recherches sont au maximum dès le départ : 20 planètes d'emblée.</li>
            </ul>

            <h2 id="choix">Où coloniser ?</h2>
            <ul>
                <li>Près d'un <strong>marchand</strong> : économie facile en envoi de cargos.</li>
                <li>Près de vos <strong>alliés</strong> : défense mutuelle.</li>
                <li>Sur une planète avec <strong>beaucoup de terrain</strong> : la taille ne change pas la production, mais donne plus de place pour construire. Sur la carte, plus l'icône d'une planète est grosse, plus elle a de terrain.</li>
                <li>Évitez de vous isoler trop loin de tout : trajets plus longs, ravitaillement compliqué.</li>
            </ul>
            <p>Il n'y a <strong>aucune limite de taille</strong> : toute planète inhabitée peut être colonisée, petite ou grande, tant qu'il vous reste une place. Tailles d'origine des planètes libres :</p>
            <table>
                <thead>
                    <tr><th>Où</th><th>Terrain</th><th>Espace</th></tr>
                </thead>
                <tbody>
                    <tr><td>Systèmes du bord de la galaxie (1 à 9, 92 à 99, et ceux qui finissent par 0 ou 1)</td><td>80 – 95 (quelques-unes de 25)</td><td>2 – 21 (5 pour celles de 25)</td></tr>
                    <tr><td>Systèmes 45, 46, 55 et 56 (centre)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>Tous les autres systèmes</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>Les plus grandes, au centre, sont gardées par une horde alien massive : un colonisateur envoyé seul y serait détruit. Une fois la planète à vous, la Ville flottante ajoute jusqu'à 50 terrains et la Station orbitale jusqu'à 25 espaces (recherche <em>Expansion territoriale</em>, voir <em>Gérer une planète</em>).</p>

    planet_types:
        title: "Tout ce qu'on trouve sur la carte"
        category: "planet"
        order: 2
        tags: "planete,inhabitee,lune,soleil,marchand,alien,debris,asteroide,cthulhu,colonisation"
        summary: "Les différents objets visibles sur la carte galactique et ce qu'on peut en faire."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Les 8 types d'objets</h2>
            <table>
                <thead>
                    <tr><th>Type</th><th>Description</th><th>Actions possibles</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Planète habitée</strong></td><td>Appartient à un joueur (ou à un bot), qui y construit, produit et stationne ses troupes.</td><td>Sonder, piller, envahir, frappe nucléaire, attaquer les flottes en orbite.</td></tr>
                    <tr><td><strong>Planète inhabitée</strong></td><td>Planète libre, nommée « Inhabitée » sur la carte. Plus son icône est grosse, plus elle a de terrain.</td><td><strong>Coloniser.</strong></td></tr>
                    <tr><td><strong>Lune</strong></td><td>Créée par un Lunar sur un emplacement vide riche en débris. Produit 20 rations par minute.</td><td>Piller ou envahir avec une flotte en orbite, frappe nucléaire, attaquer les flottes en orbite. Une lune ne peut pas être sondée.</td></tr>
                    <tr><td><strong>Soleil</strong></td><td>Toujours en position 13 de chaque système. Non colonisable.</td><td>Aucune.</td></tr>
                    <tr><td><strong>Emplacement vide</strong></td><td>Position « Vide », sans planète. Non colonisable.</td><td>Créer une lune (s'il porte au moins 2M de niobium et 2M d'eau en débris), déployer un radar, déployer un brouilleur.</td></tr>
                    <tr><td><strong>Marchand</strong></td><td>PNJ qu'on ne peut ni piller ni envahir. Il achète vos ressources contre des Bitcoins.</td><td>Vendre (mission <em>Décharger et revenir</em>).</td></tr>
                    <tr><td><strong>Base alien / Cthulhu</strong></td><td>Base de la ruche, défendue par une garnison permanente.</td><td>Envahir pour la libérer (uranium, points de guerre et recul de la Menace de l'univers).</td></tr>
                    <tr><td><strong>Champ d'astéroïdes</strong></td><td>Apparaît seul : niobium, eau ou uranium. Se recharge toutes les 7 à 40 heures et est souvent gardé par des aliens.</td><td>Recycler.</td></tr>
                </tbody>
            </table>
            <p>Après un combat, des <strong>débris</strong> (niobium et eau) peuvent aussi flotter sur n'importe quelle position, planète comprise : une icône le signale. Voir l'article <em>Recyclage</em>.</p>

            <h2 id="reperer">Les repérer sur la carte</h2>
            <p>Chaque type a son icône, et la taille d'une planète sur la carte reflète son terrain. Cliquez (ou touchez) un objet pour ouvrir sa fiche : propriétaire, terrain et espace exacts (si la position est dans la portée de vos radars), débris éventuels. Le bouton <em>Interaction</em> de la fiche donne accès aux actions et à l'envoi d'une flotte ; il apparaît dès que vous avez au moins une flotte à l'arrêt.</p>

            <h2 id="lunes">Cas particulier : les lunes</h2>
            <p>Les lunes se créent avec un vaisseau spécial, le <strong>Lunar</strong> (parfois appelé Moon Maker), sur un emplacement vide portant au moins 2M de niobium et 2M d'eau en débris. Une lune produit une quantité fixe de <strong>20 rations par minute</strong> (1&nbsp;200 par heure avant bonus) : autant qu'un Champ agricole de niveau 7 à 8 sur une planète. Ses rations restent sur la lune : transportez-les en cargo vers les planètes qui en manquent. Voir l'article <em>Les lunes</em>.</p>

    planet_management:
        title: "Gérer une planète"
        category: "planet"
        order: 3
        tags: "gestion,planete,production,capacite,specialisation,terrain,ville flottante,station orbitale,heros"
        summary: "Comment optimiser la production, organiser votre espace, et éventuellement spécialiser une planète."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Les bases à maîtriser</h2>
            <ul>
                <li><strong>Niveaux de production</strong> : montez régulièrement la Mine de niobium, l'Extracteur d'eau et le Champ agricole.</li>
                <li><strong>Stockage</strong> : sans stocks suffisants (Entrepôt de Niobium, Réservoir d'eau, Silo agricole), la production sature et s'arrête.</li>
                <li><strong>Population</strong> : la Grande ville (+25&nbsp;000 travailleurs maximum par niveau) et la Metropole (+80&nbsp;000) augmentent votre plafond de travailleurs et leur vitesse d'arrivée ; le Camp d'esclaves ajoute 2&nbsp;500 places par niveau.</li>
                <li><strong>Défense minimale</strong> : un Fort défensif et quelques Mechas, c'est la base.</li>
            </ul>

            <h2 id="optimiser">Optimiser une planète</h2>
            <ol>
                <li>Construisez des bâtiments de production <strong>par paire</strong> (Mine et Extracteur montent souvent ensemble).</li>
                <li>Manque de place ? Recherchez <strong>Expansion territoriale</strong> (disponible après Terraformation niveau 18), puis construisez :
                    <ul>
                        <li>la <strong>Ville flottante</strong> (niveau 1 d'Expansion territoriale) : +10 terrain par niveau ;</li>
                        <li>la <strong>Station orbitale</strong> (niveau 2) : +5 espace par niveau.</li>
                    </ul>
                    Chacune monte jusqu'au niveau 5 et se paie en points de guerre : 2&nbsp;000 × le niveau visé (30&nbsp;000 points de guerre pour les 5 niveaux). Sinon, détruisez un bâtiment devenu inutile.</li>
                <li>Gardez un œil sur <strong>l'autonomie alimentaire</strong>. Seuls les travailleurs mangent, à raison de 1 ration par heure pour 500 travailleurs. Un niveau de Champ agricole en nourrit 81&nbsp;000, un niveau de Ferme aéroponique 111&nbsp;000.</li>
                <li>Une <strong>lune</strong> produit 1&nbsp;200 rations par heure. Transportez-les en cargo vers vos planètes, ou laissez une flotte chargée de rations en orbite : la planète y puise quand son grenier est vide.</li>
            </ol>

            <h2 id="specialiser">Spécialiser ses planètes</h2>
            <p>Plusieurs planètes = possibilité de les spécialiser selon leur position et leurs bâtiments :</p>
            <ul>
                <li><strong>Planète économique</strong> : beaucoup de mines, de travailleurs, vente aux marchands proches.</li>
                <li><strong>Planète militaire</strong> : Chantier spatial, Usine d'armement, Industrie lourde, grosses défenses, pour y stationner votre flotte.</li>
                <li><strong>Planète de recherche</strong> : Centre de recherche monté haut pour loger beaucoup de scientifiques (voir <em>Travailleurs et scientifiques</em> pour leur effet réel sur la vitesse de recherche).</li>
                <li><strong>Avant-poste frontalier</strong> : Radar d'espace, Brouilleur de radar, sondes, tourelles. Sert à surveiller ou contenir un voisin.</li>
            </ul>

            <h2 id="capitale">Où va votre héros s'il perd sa place ?</h2>
            <p>Il n'y a pas de planète capitale. Un héros n'est jamais détruit. Si sa flotte est anéantie ou sa planète perdue, il peut être <strong>capturé</strong> par un joueur qui possède une Prison : 20&nbsp;% de risque en combat spatial, 35&nbsp;% lors d'une invasion.</p>
            <p>Sinon, il rejoint automatiquement <strong>la plus ancienne de vos planètes ou lunes qui n'a pas déjà un héros</strong>. S'il n'y en a aucune, votre héros principal renvoie un héros secondaire en réserve pour prendre sa place.</p>

    planet_abandon:
        title: "Abandonner une planète"
        category: "planet"
        order: 4
        tags: "abandon,planete,suppression,game over"
        summary: "Quand c'est une bonne idée, comment faire, et pourquoi il faut s'abstenir dans certains cas."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Pourquoi abandonner une planète ?</h2>
            <ul>
                <li>Elle est <strong>trop exposée</strong> aux attaques et vous consomme plus qu'elle ne rapporte.</li>
                <li>Elle est <strong>mal placée</strong> (loin de tout, difficile à défendre).</li>
                <li>Vous voulez <strong>en coloniser une meilleure</strong>, mais vous êtes au plafond de planètes.</li>
            </ul>

            <h2 id="comment">Comment faire</h2>
            <p>Rendez-vous sur la page <strong>Planètes</strong> : le lien <strong>Abandonner</strong> se trouve à côté des coordonnées de la planète. Le jeu vous demande « Souhaitez vous abandonner la planète ? » ; une fois <em>Abandonner</em> confirmé, l'abandon est <strong>immédiat et définitif</strong>.</p>
            <p>Le lien n'apparaît que si l'abandon est possible :</p>
            <ul>
                <li>il vous reste au moins une autre planète (les lunes ne comptent pas) ;</li>
                <li>ce n'est pas une lune : une lune ne s'abandonne jamais ;</li>
                <li>aucune flotte étrangère en mode attaque n'est en route vers elle ni stationnée en orbite.</li>
            </ul>
            <p>Avant de la lâcher, <strong>évacuez ressources, Légionnaires, Mechas et vaisseaux au sol</strong> vers une autre planète : tout ce qui reste est perdu. Un héros posté sur la planète est déplacé automatiquement vers une autre de vos planètes ou lunes qui n'a pas déjà de héros.</p>
            <p>Ce que devient la planète :</p>
            <ul>
                <li>sur un serveur sans ruche Cthulhu, elle redevient une planète inhabitée, rasée : il ne lui reste qu'un Chantier spatial et un Radar au sol de niveau 1 ;</li>
                <li>sur un serveur avec la ruche, une petite planète restée à sa taille d'origine (25 terrain, 5 espace) est simplement libérée, bâtiments compris ; toute autre planète devient une <strong>base alien</strong>.</li>
            </ul>
            <p><strong>Peut-on annuler ?</strong> Non : il n'y a ni délai ni retour en arrière. Pour retrouver la planète, il faut la reprendre. Si elle est redevenue libre, recolonisez-la (il vous faut un colonisateur et une place libre). Si elle est devenue une base alien, envahissez-la pour la libérer, puis recolonisez-la.</p>

            <h2 id="danger">Et ma dernière planète ?</h2>
            <p>Impossible de l'abandonner : tant qu'il ne vous reste qu'une planète, le jeu refuse (vos lunes ne comptent pas). En revanche, <strong>perdre</strong> votre dernière planète, par exemple à la suite d'une invasion, entraîne le <strong>Game Over</strong> : voir l'article <em>Game Over</em>.</p>

    galaxy_navigation:
        title: "Naviguer dans la galaxie"
        category: "planet"
        order: 5
        tags: "galaxie,secteur,navigation,carte,univers,coordonnees,systeme,marchand,hyperespace"
        summary: "Comment est organisé l'univers, comment lire une coordonnée, et comment utiliser la carte."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Comment l'univers est organisé</h2>
            <p>L'univers est une hiérarchie :</p>
            <ul>
                <li>L'<strong>Univers</strong> d'un serveur contient une ou plusieurs <strong>Galaxies</strong> : une nouvelle galaxie s'ajoute automatiquement quand les planètes de départ libres se font rares, jusqu'à 32. L'onglet <strong>Univers</strong> de la Carte spatiale montre combien il y en a. En Battle Royale, il n'y en a qu'une.</li>
                <li>Chaque <strong>Galaxie</strong> contient 100 <strong>Secteurs</strong> (grille 10×10, numérotés de 1 à 100 ligne par ligne). La Carte spatiale les appelle « systèmes ».</li>
                <li>Chaque <strong>Secteur</strong> contient 25 <strong>Positions</strong> (grille 5×5).</li>
            </ul>
            <p>Chaque position peut contenir une planète (habitée ou non), un marchand, une base alien, un champ de débris, une lune, ou être vide. La position 13, au centre du secteur, est toujours un soleil. Les marchands se trouvent dans 20 secteurs fixes de chaque galaxie : 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 et 56.</p>

            <h2 id="coordonnees">Lire une coordonnée</h2>
            <p>Format : <strong>Galaxie:Secteur:Position</strong>, par exemple <code>1:5:12</code> :</p>
            <ul>
                <li><strong>1</strong> — première galaxie ;</li>
                <li><strong>5</strong> — cinquième secteur de cette galaxie (sur la première ligne de la grille) ;</li>
                <li><strong>12</strong> — douzième position dans ce secteur.</li>
            </ul>

            <h2 id="carte">Utiliser la carte</h2>
            <p>La page <strong>Carte spatiale</strong> (menu de gauche) vous montre la vue spatiale. Vous pouvez :</p>
            <ul>
                <li>Vous déplacer entre galaxies et secteurs.</li>
                <li>Cliquer sur une position pour voir ce qu'il y a.</li>
                <li><strong>Envoyer directement une flotte</strong> : cliquez sur la case, puis sur <strong>Interaction</strong> (le bouton apparaît dès qu'au moins une de vos flottes est à l'arrêt), choisissez la flotte et la mission, et cliquez sur <strong>Envoyer</strong>. Le même panneau propose des actions rapides selon la case : <em>Sonder la planète</em>, <em>Coloniser la planète</em>, <em>Déployer radar</em> ou <em>Déployer brouilleur</em>, <em>Envoyer un missile nucléaire</em>.</li>
                <li>Voir les positions des alliés, des ennemis et des marchands (selon vos relations et votre radar).</li>
            </ul>
            <p>Les <strong>flottes en transit</strong> apparaissent comme de petits vaisseaux animés qui glissent en temps réel entre la planète d'origine et la destination. Le <strong>halo coloré</strong> indique le camp : <strong>bleu</strong> = vous, <strong>vert</strong> = alliance et alliés, <strong>gris</strong> = pacte/paix, <strong>magenta</strong> = marchand, <strong>violet</strong> = alien, <strong>rouge</strong> = ennemi. La <strong>taille</strong> reflète la signature de la flotte. Vos flottes et celles de votre alliance sont toujours visibles ; les autres apparaissent uniquement si votre <strong>radar</strong> couvre le secteur. Pour un vol longue distance traversant plusieurs secteurs, le petit vaisseau n'apparaît que durant la dernière fraction du trajet — l'entrée dans le secteur de destination — pas pendant tout le voyage.</p>

            <h2 id="hyperespace">Voyages inter-galaxies</h2>
            <p>Pour aller d'une galaxie à une autre, il vous faut la recherche <strong>Technologie hyperespace</strong>. La distance est toujours de 18 (à peu près 6 secteurs : moins qu'une traversée de galaxie), mais le carburant est cher : la signature de la flotte divisée par 8, en Bitcoins (125 Bitcoins pour 1&nbsp;000 chasseurs). Détails dans <em>Déplacement et distance</em>.</p>

    radar_jammer:
        title: "Radar et brouillage"
        category: "planet"
        order: 6
        tags: "radar,brouilleur,jammer,detection,surveillance,scanner"
        summary: "Voir ce qui bouge dans un secteur, et cacher vos planètes aux radars ennemis."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs Brouilleur</h2>
            <ul>
                <li><strong>Radar</strong> — vous montre le secteur où il se trouve : les planètes et les flottes en mouvement, avant leur arrivée.</li>
                <li><strong>Brouilleur</strong> — cache <strong>une planète</strong> aux radars ennemis qui ne sont pas plus puissants que lui : ses informations, la signature des flottes qui s'y rendent, et l'origine ou la destination des flottes qui en partent ou y vont.</li>
            </ul>

            <h2 id="detection">Les radars disponibles</h2>
            <table>
                <tr><th>Type</th><th>Où</th><th>Rôle</th></tr>
                <tr><td><strong>Radar au sol</strong> (bâtiment)</td><td>Sur la planète (emplacement au sol)</td><td>+1 de puissance radar par niveau. Requis : Scanner de système niveau 1.</td></tr>
                <tr><td><strong>Radar d'espace</strong> (bâtiment)</td><td>Sur la planète (emplacement en ciel)</td><td>Même effet, +1 par niveau : utile quand vous manquez de place au sol. Requis : Scanner de système niveau 3.</td></tr>
                <tr><td><strong>Vaisseau radar</strong></td><td>Déployé sur une case vide</td><td>Installe un radar de puissance 1 pendant 2&nbsp;h : pratique pour surveiller un secteur où vous n'avez pas de planète.</td></tr>
            </table>
            <p>Un radar couvre tout le secteur où il se trouve, et seulement celui-là. Les niveaux des deux bâtiments d'une même planète s'additionnent ; dans un secteur, c'est la meilleure planète qui compte (la vôtre, celle d'un membre de votre alliance ou celle d'un allié). Un héros Explorateur posté sur la planète renforce son radar : +1 dès le niveau 5 (trait Éclaireur), +3 au total dès le niveau 15 (trait Cartographe en plus).</p>
            <p>Le jeu vous prévient par une notification quand une flotte ennemie se dirige vers votre planète, que vous ayez un radar ou non ; le radar sert à <em>voir</em> les flottes et les planètes du secteur.</p>

            <h2 id="brouillage">Les brouilleurs disponibles</h2>
            <table>
                <tr><th>Type</th><th>Où</th><th>Rôle</th></tr>
                <tr><td><strong>Brouilleur de radar</strong> (bâtiment)</td><td>Sur la planète (emplacement en ciel)</td><td>+1 de puissance de brouillage par niveau. Tant qu'il égale ou dépasse le radar ennemi du secteur, la planète est masquée à cet ennemi. Requis : Scanner de système niveau 5.</td></tr>
                <tr><td><strong>Vaisseau brouilleur</strong></td><td>Déployé sur une case vide</td><td>Installe un brouilleur de puissance 1 pendant 1&nbsp;h sur cette case. Il ne protège pas une flotte en vol.</td></tr>
            </table>
            <p>Exemple : votre planète a un Brouilleur de radar niveau 3. Un ennemi dont le meilleur radar du secteur est au niveau 3 ne la voit pas ; avec un radar niveau 4, il la voit.</p>

            <h2 id="vaisseaux-au-sol">Voir les vaisseaux au sol</h2>
            <p>La <strong>signature au sol</strong> — les vaisseaux stationnés sur une planète — suit une règle un peu plus souple : une de vos flottes <strong>en orbite</strong> les compte à vue, même sans radar. Mais uniquement pour cette planète-là.</p>
            <p>Le <strong>radar</strong> reste ce qui vous donne cette lecture <strong>à distance</strong>, sur tout le secteur. Et un <strong>Brouilleur de radar</strong> sur la planète referme l'observation : sans radar supérieur au brouilleur, la signature au sol redevient invisible, même avec une flotte au-dessus.</p>

            <h2 id="strategie">Comment les utiliser</h2>
            <ul>
                <li><strong>Radar</strong> sur chaque planète : au minimum le Radar au sol, pour voir ce qui bouge dans votre secteur.</li>
                <li><strong>Brouilleur de radar</strong> sur vos planètes exposées : à niveau égal ou supérieur au radar adverse, elles deviennent illisibles pour lui.</li>
                <li><strong>Déployez</strong> un vaisseau radar sur une case vide du secteur de votre voisin (action « Déployer radar » de la Carte spatiale, ou mission « Vaisseau radar ») : vous voyez ce secteur pendant 2&nbsp;h.</li>
                <li>La recherche <strong>Scanner de système</strong> débloque les radars (niveau 1 : Radar au sol ; niveau 3 : Radar d'espace et Vaisseau radar ; niveau 5 : Brouilleur de radar et Vaisseau brouilleur). Elle n'augmente pas leur puissance.</li>
            </ul>

    moon:
        title: "Les lunes"
        category: "planet"
        order: 7
        tags: "lune,lunar,moonmaker,nourriture,rations,production"
        summary: "Une lune produit 1 200 rations par heure sans occuper de terrain. Comment en créer une avec un Lunar, sa taille et ses limites."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Une lune, c'est quoi ?</h2>
            <p>Une <strong>lune</strong> est un astre spécial créé par un vaisseau <strong>Lunar</strong> (parfois appelé Moon Maker). Elle ne produit ni niobium ni eau, mais une quantité fixe de <strong>20 rations par minute</strong>, soit 1&nbsp;200 par heure avant bonus (1&nbsp;440 en alliance). C'est autant qu'un Champ agricole de niveau 7 à 8 sur une planète, sans occuper le moindre terrain. Cette production ne peut pas être augmentée : on ne construit pas de ferme sur une lune.</p>
            <p>Une lune accueille aussi des <strong>travailleurs</strong> (20&nbsp;000 dès sa création, jusqu'à 200&nbsp;000), qui rapportent des Bitcoins comme ailleurs. Vous pouvez y construire la plupart des bâtiments (Grande ville, Centre de recherche, entrepôts, Caserne, Chantier spatial…), mais pas de mine, d'extracteur ni de ferme.</p>
            <p>Seuls les travailleurs consomment des rations, à raison de 1 par heure pour 500 travailleurs : les 1&nbsp;200 rations d'une lune nourrissent donc 600&nbsp;000 travailleurs. Ces rations restent sur la lune : transportez-les en cargo vers vos planètes, ou laissez une flotte chargée de rations en orbite d'une planète, qui y puisera quand son grenier sera vide.</p>

            <h2 id="creation">Comment créer une lune</h2>
            <p>Une lune naît d'un <strong>champ de débris</strong> : il faut un <strong>emplacement vide</strong> portant au moins <strong>2M de niobium ET 2M d'eau</strong> en débris (laissés par une bataille spatiale à cet endroit). La mission <em>Créer une lune</em> n'est proposée sur la carte que si l'emplacement remplit cette condition.</p>
            <ol>
                <li>Fabriquez un <strong>Lunar</strong> au Chantier spatial. Il faut la recherche Terraformation niveau 15 et une Industrie lourde sur la planète. Il coûte 50&nbsp;000 niobium, 23&nbsp;000 eau, 20&nbsp;000 travailleurs et 200&nbsp;000 Bitcoins, pour 5&nbsp;h de construction de base.</li>
                <li>Envoyez-le vers l'emplacement vide en mission <strong>Créer une lune</strong> : sur la <em>Carte spatiale</em>, cliquez l'emplacement, puis <em>Interaction</em>, choisissez la flotte et la mission, puis <em>Envoyer</em>. Si la flotte est déjà sur place, le bouton <em>Créer une lune</em> apparaît sur sa fiche.</li>
                <li>À l'arrivée, un Lunar est consommé, la lune est créée et <strong>tous les débris sont consommés</strong>. Si les conditions ne sont plus réunies (débris recyclés pendant le vol, position occupée…), un rapport vous explique l'échec.</li>
            </ol>
            <p>Le Lunar est le vaisseau le plus lent du jeu, et son entretien est lourd : 5&nbsp;000 Bitcoins par jour tant qu'il est dans une flotte, 833 quand il reste au sol. Ne le mettez en flotte qu'au dernier moment.</p>

            <h2 id="taille">Taille de la lune</h2>
            <p>Plus le champ de débris est riche, plus la lune est grande. Le palier est fixé par la <strong>plus faible</strong> des deux ressources :</p>
            <table>
                <thead>
                    <tr><th>Débris (min. niobium/eau)</th><th>Terrain</th><th>Espace</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M et plus</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Les valeurs sont tirées au hasard dans la fourchette. Exemple : un champ de 12M de niobium et 6M d'eau donne une lune de 100 à 150 terrains, car c'est l'eau (6M) qui fixe le palier. Une lune est souvent plus grande qu'une planète, dont le terrain d'origine va de 25 à 190.</p>

            <h2 id="limitations">Limites</h2>
            <ul>
                <li>Une lune ne produit ni niobium ni eau : seulement des rations et des travailleurs.</li>
                <li>Elle peut être attaquée, pillée et envahie (par une flotte en orbite), mais elle ne peut pas être sondée.</li>
                <li>Elle ne compte pas dans votre plafond de planètes, ni dans la limite de 4 planètes de la protection des débutants.</li>
                <li>Une lune ne peut jamais être abandonnée.</li>
                <li>Construire une lune près de chez vous est plus sûr (moins exposée aux voisins hostiles).</li>
            </ul>

            <h2 id="strategie">Quand en poser une</h2>
            <ul>
                <li>Vos planètes très peuplées manquent de rations : une lune proche vous en fournit 1&nbsp;200 par heure, à transporter en cargo ou à laisser à bord d'une flotte en orbite de la planète.</li>
                <li>Une grande bataille a laissé un <strong>champ de débris riche</strong> sur un emplacement vide près de chez vous : plutôt que de tout recycler, transformez-le en lune.</li>
                <li>Vous êtes bien établi, avez des ressources à dépenser et cherchez à consolider votre économie.</li>
            </ul>

    alliance_basics:
        title: "Créer et rejoindre une alliance"
        category: "alliance"
        order: 1
        tags: "alliance,creation,rejoindre,invitation,bonus,regime,politique,niveau,membres"
        summary: "Rejoindre une alliance sur invitation ou créer la vôtre, choisir son régime politique et faire monter son niveau pour accueillir plus de membres."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Pourquoi rejoindre une alliance ?</h2>
            <ul>
                <li><strong>+20&nbsp;% de production</strong> de niobium, d'eau et de rations, dès l'entrée dans l'alliance.</li>
                <li>Les <strong>7 recherches politiques</strong> du régime de votre alliance (bonus économiques, militaires ou défensifs), que vous lancez vous-même dans la page <strong>Recherches</strong>.</li>
                <li>Les <strong>améliorations d'alliance</strong> (16 bonus collectifs) et l'<strong>entraide construction</strong>.</li>
                <li>Une <strong>trésorerie partagée</strong> en Bitcoins et en Points de Guerre.</li>
                <li>La <strong>diplomatie</strong> (guerres, paix, pactes, alliances défensives), un <strong>salon</strong> réservé aux membres et l'<strong>Arène Alliance</strong>.</li>
            </ul>
            <p>En clair : jouer solo, c'est viable au début. Mais dès que le jeu devient sérieux, une alliance multiplie vos chances de progresser.</p>

            <h2 id="rejoindre">Comment rejoindre</h2>
            <ol>
                <li>Repérez une alliance : le classement des alliances (« Classement Alliances »), la fiche d'une alliance, le salon Univers.</li>
                <li>Contactez l'un de ses membres (message privé, salon). Il n'existe pas de candidature dans le jeu : <strong>c'est l'alliance qui vous invite</strong>.</li>
                <li>Un membre qui a la permission <strong>Recruter</strong> vous envoie une invitation depuis l'onglet <strong>Ajouter un membre</strong> de sa page Alliance. Il y voit les joueurs sans alliance qui se sont connectés dans les 2 derniers mois.</li>
                <li>Ouvrez votre page <strong>Alliance</strong> (menu) : l'invitation apparaît sous « Proposition(s) de recrutement ». Cliquez sur <strong>Accepter</strong>.</li>
            </ol>
            <p>Une alliance ne peut inviter que si elle a une place libre : chaque invitation en attente compte comme un membre jusqu'à votre réponse.</p>
            <p>Vous pouvez aussi <strong>créer votre propre alliance</strong> depuis la même page. Vous choisissez :</p>
            <ul>
                <li>un <strong>nom</strong> (20 caractères au plus, unique sur le serveur) et un <strong>tag</strong> (5 caractères au plus, unique) ;</li>
                <li>un cri de ralliement (30 caractères) et une description (1&nbsp;500 caractères), modifiables ensuite ;</li>
                <li>la <strong>taxe d'alliance</strong>, de 5 à 50&nbsp;%, qui <strong>ne pourra plus être modifiée</strong> ;</li>
                <li>le <strong>régime politique</strong>, définitif.</li>
            </ul>
            <p>Vous devenez le dirigeant de l'alliance. Sa trésorerie démarre vide.</p>

            <h2 id="invitations">Recevoir des invitations</h2>
            <p>Un membre qui a la permission <strong>Recruter</strong> peut vous <strong>inviter</strong> directement. Vous pouvez recevoir <strong>une invitation de chaque alliance en même temps</strong> : être sollicité par l'une ne vous rend pas invisible pour les autres. En revanche, une même alliance ne peut pas vous inviter deux fois tant que vous n'avez pas répondu. Les alliances qui vous repèrent voient que vous êtes <strong>déjà sollicité</strong>, sans savoir par qui. Dès que vous <strong>acceptez</strong> une invitation, toutes les autres sont automatiquement retirées. Si une alliance est <strong>dissoute</strong>, son invitation disparaît de votre liste.</p>

            <h2 id="delai">Délai après avoir quitté une alliance</h2>
            <p>Après avoir <strong>quitté</strong> une alliance, en avoir été <strong>exclu</strong> ou après sa <strong>dissolution</strong> par son dirigeant, un <strong>délai de 2&nbsp;jours</strong> s'applique : impossible de <strong>créer</strong> ou de <strong>rejoindre</strong> une alliance avant la fin du décompte, affiché sur la page Alliance. Si l'alliance disparaît d'elle-même (Game Over du dirigeant du Marteau des Étoiles, ou du dernier membre), ce délai est de <strong>12&nbsp;heures</strong>. Ce délai empêche les allers-retours abusifs entre alliances.</p>
            <p><strong>Quitter</strong> n'est possible que dans <strong>La Balance des Mondes</strong>, et à quatre conditions : ne pas être le Président, ne pas être le dernier membre, que l'alliance ne soit pas en guerre et qu'aucune de vos flottes ne soit en combat. Une <strong>exclusion</strong> est elle aussi impossible pendant une guerre, ou si une flotte du membre visé est en combat.</p>
            <p>En partant, vous perdez le bonus de production et les améliorations d'alliance, et <strong>vos recherches politiques retombent à zéro</strong>.</p>

            <h2 id="regimes">Les 3 régimes politiques</h2>
            <p>En <strong>créant</strong> une alliance, vous choisissez son <strong>régime politique</strong>. Ce choix est <strong>définitif</strong> : il fixe le nombre de membres de départ, les 7 recherches politiques accessibles et plusieurs règles internes. Tout le détail : <a href="/wiki/political_system">Les 3 régimes politiques</a>.</p>

            <h3 id="democratie">La Balance des Mondes</h3>
            <ul>
                <li>3 membres au départ ; un Président élu par le vote des membres.</li>
                <li>Les membres peuvent quitter l'alliance (sauf le Président, et jamais en temps de guerre).</li>
                <li>Recherches économiques : production, vitesse des recherches, entretien des scientifiques, cargos, blindage des vaisseaux, ventes aux marchands, colonisation.</li>
                <li>Tous les membres sont visibles publiquement, ainsi que la position de leur première planète.</li>
                <li>+20&nbsp;% d'armes en attaque contre Le Rempart Silencieux.</li>
            </ul>

            <h3 id="communisme">Le Rempart Silencieux</h3>
            <ul>
                <li>4 membres au départ ; tous les membres sont dirigeants.</li>
                <li>Taxe d'alliance fixée à 50&nbsp;% ; impossible de quitter l'alliance.</li>
                <li>Recherches offensives : recyclage, défense des travailleurs, puissance des vaisseaux, entretien et recrutement des Légionnaires, invasions, Points de Guerre.</li>
                <li>+20&nbsp;% d'armes en attaque contre Le Marteau des Étoiles.</li>
            </ul>

            <h3 id="fascisme">Le Marteau des Étoiles</h3>
            <ul>
                <li>2 membres au départ ; un seul dirigeant, le Primaris.</li>
                <li>Impossible de quitter ou de dissoudre l'alliance ; si le Primaris est mis Game Over, l'alliance est dissoute.</li>
                <li>Recherches défensives : travailleurs, puissance des vaisseaux, barges, Légionnaires, entretien et défense des Mechas, invasions. La menace Cthulhu monte moins vite.</li>
                <li>Seul le dirigeant est affiché publiquement.</li>
                <li>+20&nbsp;% d'armes en attaque contre La Balance des Mondes.</li>
            </ul>

            <h2 id="niveau">Niveau d'alliance et nombre de membres</h2>
            <p>Une alliance démarre avec <strong>3 places</strong> (La Balance des Mondes), <strong>4</strong> (Le Rempart Silencieux) ou <strong>2</strong> (Le Marteau des Étoiles). Pour accueillir plus de monde, un membre qui a la permission <strong>Modifier</strong> fait monter son <strong>niveau</strong> avec le bouton « Monter niveau de l'alliance » de l'onglet <strong>Banque</strong>. Le coût est payé par la <strong>trésorerie</strong>. Chaque niveau débloque aussi une recherche politique de plus (voir <a href="/wiki/alliance_research">Recherches d'alliance</a>).</p>
            <table>
                <thead>
                    <tr><th>Passage</th><th>Coût (trésorerie)</th><th>Places en plus</th><th>Places totales Balance / Rempart / Marteau</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125&nbsp;000 Bitcoins</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225&nbsp;000 Bitcoins + 2&nbsp;500 PDG</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600&nbsp;000 Bitcoins + 10&nbsp;000 PDG</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1&nbsp;000&nbsp;000 Bitcoins + 25&nbsp;000 PDG</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50&nbsp;000 PDG</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10&nbsp;000&nbsp;000 Bitcoins</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15&nbsp;000&nbsp;000 Bitcoins + 125&nbsp;000 PDG</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35&nbsp;000&nbsp;000 Bitcoins + 300&nbsp;000 PDG</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50&nbsp;000&nbsp;000 Bitcoins + 500&nbsp;000 PDG</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100&nbsp;000&nbsp;000 Bitcoins + 1&nbsp;000&nbsp;000 PDG</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>Le niveau 10 est le maximum.</p>

            <h2 id="compte-valide">Compte à valider</h2>
            <p>⚠️ Pour <strong>créer ou rejoindre</strong> une alliance, votre compte doit être <strong>validé</strong> et votre <strong>e-mail confirmé</strong>. Les comptes test ou anonymes ne peuvent pas rejoindre d'alliance : confirmez votre e-mail depuis <strong>Mes options</strong>.</p>
            <p>Autres cas où c'est impossible : pendant le délai qui suit un départ ou une exclusion (voir plus haut), tant qu'une de vos flottes est engagée dans un combat, sur un serveur <strong>Battle Royale</strong>, et pour le VIP d'un serveur <strong>Search &amp; Destroy</strong>. Sans e-mail confirmé, vous ne pouvez pas non plus déposer ni retirer à la trésorerie, investir dans les améliorations ou aider les constructions.</p>

            <h2 id="discord">Votre alliance sur Discord</h2>
            <p>Liez votre compte Discord dans <strong>Mes options</strong> et cochez <strong>Afficher mes alliances sur Discord</strong> : le jeu vous donne sur le <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord d'Area Universe</a> le rôle de chacune de vos alliances, et le retire quand vous la quittez ou qu'elle est dissoute. Personne ne peut prendre le rôle d'une alliance dont il n'est pas membre. Décochez la case à tout moment pour retirer vos rôles.</p>

    alliance_grades:
        title: "Grades et permissions"
        category: "alliance"
        order: 2
        tags: "grades,permissions,roles,hierarchie,officier,dirigeant,vote,inactif"
        summary: "Comment fonctionne la hiérarchie interne d'une alliance et qui a le droit de faire quoi."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Une alliance est organisée par <strong>grades</strong>, du plus haut (le dirigeant, rang&nbsp;1) au plus bas (rang&nbsp;5). Chaque grade porte une liste de <strong>permissions</strong> qui dit ce que ses membres peuvent faire.</p>

            <h2 id="hierarchie">Les grades de départ</h2>
            <p>Chaque alliance démarre avec 4 grades, selon son régime :</p>
            <table>
                <thead>
                    <tr><th>Régime</th><th>Dirigeant (rang 1, toutes les permissions)</th><th>Rang 2</th><th>Rang 3</th><th>Nouveaux membres</th></tr>
                </thead>
                <tbody>
                    <tr><td>La Balance des Mondes</td><td>Président</td><td>Ministre (Recruter, Voir)</td><td>Citoyen (Voir)</td><td>Mineur (rang 5, aucune permission)</td></tr>
                    <tr><td>Le Marteau des Étoiles</td><td>Primaris</td><td>Capitaine (Recruter, Voir)</td><td>Soldat (Voir)</td><td>Aspirant (rang 5, aucune permission)</td></tr>
                    <tr><td>Le Rempart Silencieux</td><td>Guide, Protecteur, Camarade (tous rang 1)</td><td>Gulag (aucune permission)</td><td>—</td><td>Camarade (toutes les permissions)</td></tr>
                </tbody>
            </table>
            <p>Un membre qui a la permission <strong>Modifier</strong> peut créer d'autres grades dans l'onglet <strong>Administration</strong> : il leur donne un nom, un « type de grade » de 2 à 5 (le rang) et des permissions. Le rang&nbsp;1 est réservé aux dirigeants.</p>

            <h2 id="permissions">Les permissions</h2>
            <p>Les permissions d'un grade se choisissent à sa <strong>création</strong> :</p>
            <ul>
                <li><strong>Recruter</strong> : inviter des joueurs.</li>
                <li><strong>Exclure</strong> : exclure un membre (impossible en temps de guerre).</li>
                <li><strong>Pacte</strong> : proposer, accepter, refuser ou rompre un pacte de non-agression ou une alliance défensive. Elle est aussi nécessaire pour la guerre et la paix.</li>
                <li><strong>Guerre</strong> : déclarer la guerre et négocier la paix (il faut aussi la permission Pacte).</li>
                <li><strong>Modifier</strong> : gérer les grades et leur attribution, le DEFCON, l'image, le cri de ralliement et la description, valider les demandes de retrait de la trésorerie, monter le niveau de l'alliance, la dissoudre. Les retraits demandés par ce grade sont immédiats.</li>
                <li><strong>Flottes</strong> : retirer du partage les flottes que d'autres membres ont partagées avec l'alliance.</li>
                <li><strong>Voir</strong> : voir sur la carte spatiale les flottes de tous les membres et des alliances défensives alliées. Sans elle, vous ne voyez que les vôtres.</li>
            </ul>
            <p>Les permissions d'un grade existant ne se modifient pas : créez un nouveau grade, attribuez-le, puis supprimez l'ancien (ses membres descendent au grade le plus bas). Vous ne pouvez donner à un grade que des permissions que vous avez vous-même. Il doit toujours rester au moins un grade de chacun des rangs 1, 2, 3 et 5, et vous ne pouvez pas supprimer votre propre grade.</p>

            <h2 id="changer">Promouvoir ou rétrograder</h2>
            <p>Un membre qui a la permission <strong>Modifier</strong> change le grade d'un autre en cliquant sur son <strong>rang</strong> dans la liste des membres. C'est une manière de récompenser les actifs et d'encadrer les nouveaux.</p>
            <p>Limites :</p>
            <ul>
                <li>on ne peut pas donner un grade qui a plus de permissions que le sien ;</li>
                <li>personne ne peut rétrograder le dernier dirigeant, et un dirigeant ne peut pas changer son propre grade ;</li>
                <li>le grade de <strong>Président</strong> (Balance) ou de <strong>Primaris</strong> (Marteau) ne s'attribue jamais à la main : le Président change par le vote, le Primaris seulement par le remplacement automatique d'un chef inactif (voir plus bas) ;</li>
                <li>au Rempart Silencieux, Guide, Protecteur et Camarade s'échangent librement.</li>
            </ul>

            <h2 id="regimes">Cas particuliers selon le régime</h2>
            <ul>
                <li><strong>Le Rempart Silencieux</strong> : tous les membres sont dirigeants, avec tous les droits, et les nouveaux venus arrivent Camarades. Le seul grade inférieur est le <strong>Gulag</strong>, sans aucune permission, qu'on attribue pour mettre un membre à l'écart.</li>
                <li><strong>Le Marteau des Étoiles</strong> : un seul dirigeant, le Primaris, qu'on ne peut ni élire ni nommer. Il n'est remplacé que s'il reste inactif plus de 7 jours (voir plus bas). S'il est mis <strong>Game Over</strong>, l'alliance est dissoute.</li>
                <li><strong>La Balance des Mondes</strong> : chaque membre a une voix, qu'il peut changer à tout moment, depuis l'onglet des membres (« Voter pour votre président »). Dès qu'un membre a plus de voix que le Président, il devient Président et l'ancien prend son grade.</li>
            </ul>

            <h2 id="afk">Remplacement automatique d'un chef inactif</h2>
            <p>Si un <strong>dirigeant</strong> ne se connecte plus pendant <strong>plus de 7 jours</strong>, il est automatiquement remplacé pour éviter que l'alliance ne soit paralysée :</p>
            <ul>
                <li>Le <strong>membre le plus haut gradé</strong> parmi ceux qui ne sont pas dirigeants et qui se sont connectés dans les 7 derniers jours prend la tête de l'alliance. À grade égal, c'est celui qui a le plus de <strong>points au classement</strong>.</li>
                <li>Les deux grades sont simplement <strong>échangés</strong> : l'ancien chef récupère le grade du remplaçant. Le changement est noté dans l'historique de l'alliance.</li>
                <li>La règle vaut pour les trois régimes. Au Rempart Silencieux, où tout le monde est dirigeant, seul un membre au grade Gulag peut prendre la place d'un dirigeant inactif.</li>
                <li>S'il n'existe <strong>aucun candidat actif</strong>, rien ne change.</li>
            </ul>

    diplomacy:
        title: "La diplomatie"
        category: "alliance"
        order: 3
        tags: "diplomatie,guerre,paix,pacte,allie,alliance defensive,defcon,traite,taxe de paix"
        summary: "Les 4 types de relations entre alliances, comment les négocier, et ce que signifie le DEFCON."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Votre alliance entretient des <strong>relations</strong> avec les autres alliances du serveur. Ces relations changent les règles entre vos membres respectifs : qui peut piller ou envahir qui, et qui combat aux côtés de qui. La diplomatie se gère dans l'onglet <strong>Pactes</strong> de la page Alliance.</p>

            <h2 id="types">Les 4 types de relations</h2>
            <table>
                <thead>
                    <tr><th>Type</th><th>Effet</th><th>Mise en place et fin</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Aucune relation</strong></td><td>Situation par défaut : raids, invasions et combats sont possibles.</td><td>—</td></tr>
                    <tr><td><strong>Guerre</strong></td><td>Les flottes <strong>armées</strong> des deux alliances qui se croisent sur une planète s'affrontent automatiquement, même sans mode attaque. Pendant la guerre, impossible d'exclure un membre, de quitter ou de dissoudre l'alliance. Le jeu compte les invasions et les PDG gagnés et perdus de chaque camp.</td><td>Déclarée <strong>immédiatement</strong>, sans acceptation (permissions Guerre et Pacte). Les deux alliances passent à DEFCON 5 et leurs membres reçoivent une alerte. Elle ne se termine que par une <strong>paix</strong> acceptée.</td></tr>
                    <tr><td><strong>Paix</strong></td><td>Aucun raid ni aucune invasion entre vous. Le vaincu paie la <strong>taxe de paix</strong> convenue : une part de ses revenus quotidiens et une part des PDG qu'il gagne en combat, versées à la trésorerie du vainqueur.</td><td>Proposée depuis une guerre en cours, avec le bouton « Faire la paix ». Dure <strong>4 jours</strong>, puis les deux alliances redeviennent neutres.</td></tr>
                    <tr><td><strong>Pacte de non-agression</strong></td><td>Aucun raid ni aucune invasion entre vous. Dans une bataille, une alliance qui a un pacte avec le camp d'en face ne combat pas.</td><td>Proposé, puis accepté par l'autre camp. Se rompt <strong>immédiatement</strong>.</td></tr>
                    <tr><td><strong>Alliance défensive</strong></td><td>Aucun raid ni aucune invasion entre vous. Vos flottes combattent <strong>dans le même camp</strong>. Radar et flottes partagés sur la carte (avec la permission Voir). Un <strong>salon commun</strong> aux deux alliances.</td><td>Proposée, puis acceptée. La rupture prend effet <strong>12 heures</strong> après ; le salon commun et ses messages sont alors supprimés.</td></tr>
                </tbody>
            </table>
            <p>On ne peut pas déclarer la guerre à une alliance avec qui l'on a un pacte, une alliance défensive ou une paix en cours : rompez d'abord le pacte ou l'alliance défensive. Une paix, elle, ne se rompt pas : il faut attendre qu'elle expire.</p>

            <h2 id="proposer">Comment proposer un traité</h2>
            <ol>
                <li>Page <strong>Alliance</strong>, onglet <strong>Pactes</strong> (« Diplomatie de l'alliance »).</li>
                <li>Dans « Proposer », saisissez le <strong>tag</strong> de l'alliance visée et choisissez <strong>Alliance défensive</strong>, <strong>Pacte de non-agression</strong> ou <strong>Déclarer guerre</strong>.</li>
                <li>L'autre alliance voit votre demande sous « Demandes reçues » : elle peut l'<strong>accepter</strong> ou la <strong>refuser</strong>. Il n'y a pas de contre-proposition : pour changer les termes, refusez puis faites votre propre proposition. Une seule proposition peut être en attente entre deux alliances.</li>
            </ol>
            <p>Un pacte peut devenir une alliance défensive, et une paix peut devenir un pacte ou une alliance défensive : l'acceptation remplace l'ancienne relation (une paix et sa taxe prennent alors fin).</p>

            <h2 id="paix">Négocier la paix</h2>
            <p>Dans la liste « Guerres en cours », cliquez sur <strong>Faire la paix</strong> à côté de la guerre concernée, puis remplissez les termes :</p>
            <ul>
                <li><strong>Type</strong> : <strong>Proposer</strong> (vous offrez les termes, et c'est votre alliance qui paiera) ou <strong>Réclamer</strong> (vous exigez que l'adversaire paie).</li>
                <li><strong>Bitcoins reversés par jour</strong> : 0 ou de 10 à 25&nbsp;% des revenus quotidiens de chaque membre de l'alliance vaincue, prélevés au rapport journalier (18h59, heure de Paris). Exemple : à 20&nbsp;%, un membre qui touche 10&nbsp;000 Bitcoins par jour en reverse 2&nbsp;000.</li>
                <li><strong>Pourcentage des pdg</strong> : 0 ou de 25 à 50&nbsp;% des PDG que les membres vaincus gagnent en combat.</li>
                <li><strong>Nombre de planètes</strong> : ce champ (0 à 5) est enregistré dans les termes, mais aucune planète n'est transférée.</li>
            </ul>
            <p>Cliquez sur <strong>Signer</strong>. L'adversaire voit votre proposition sur ce même écran et peut accepter les termes ou les refuser ; vous pouvez annuler la vôtre tant qu'il n'a pas répondu. Une fois acceptée, la paix dure 4 jours.</p>

            <h2 id="defcon">Le DEFCON (niveau d'alerte)</h2>
            <p>Votre alliance a un <strong>niveau d'alerte DEFCON</strong>, de <strong>0 à 5</strong> : <strong>plus le chiffre est haut, plus la situation est tendue</strong>. 0 = aucune alerte, 5 = alerte maximale. Un membre qui a la permission <strong>Modifier</strong> le règle dans l'onglet <strong>Administration</strong> (« Niveau de défense »). Une <strong>déclaration de guerre</strong> met automatiquement les deux alliances à <strong>DEFCON 5</strong>.</p>
            <p>Le niveau s'affiche en bandeau sur la <strong>Vue d'ensemble</strong> de tous les membres (vert à 1, orange à 2, rouge de 3 à 5, rien à 0), avec la liste des alliances avec qui vous êtes en guerre. C'est un signal de coordination, sans effet sur les combats.</p>

            <h2 id="logs">Le journal diplomatique</h2>
            <p>Toute action diplomatique (déclaration de guerre, proposition, paix acceptée, pacte rompu, proposition refusée…) est <strong>enregistrée</strong> dans l'<strong>Historique</strong> de l'alliance (onglet des membres), avec le pseudo de l'auteur, la date et l'heure. Les arrivées, départs, exclusions et changements de dirigeant y figurent aussi. Utile pour la transparence interne et les débats après coup.</p>

    alliance_treasury:
        title: "Trésorerie d'alliance"
        category: "alliance"
        order: 4
        tags: "tresorerie,banque,bitcoin,pdg,depot,retrait,taxe,niveau"
        summary: "Le compte commun de votre alliance en Bitcoins et en PDG : dépôts, taxe d'alliance, taxes de paix, retraits et montée de niveau."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">À quoi sert la trésorerie</h2>
            <p>La trésorerie d'alliance (onglet <strong>Banque</strong> de la page Alliance) est un compte commun en <strong>Bitcoins</strong> et en <strong>Points de Guerre (PDG)</strong>. Elle sert à :</p>
            <ul>
                <li><strong>Monter le niveau de l'alliance</strong>, pour accueillir plus de membres et débloquer les recherches politiques suivantes (voir <a href="/wiki/alliance_basics#niveau">Niveau d'alliance</a>).</li>
                <li><strong>Redistribuer</strong> des Bitcoins ou des PDG à un membre : dépanner un joueur en difficulté, financer une préparation à la guerre.</li>
            </ul>
            <p>Les recherches politiques ne sont <strong>pas</strong> payées par la trésorerie : chaque joueur paie les siennes (voir <a href="/wiki/alliance_research">Recherches d'alliance</a>). Un blocus Cthulhu subi peut aussi y prélever une « Dîme des Possédés ».</p>

            <h2 id="alimenter">Comment l'alimenter</h2>
            <ul>
                <li><strong>Dépôts volontaires</strong> : tout membre peut verser des Bitcoins ou des PDG (onglet Banque, « Donner »), avec une raison s'il le souhaite. Compte validé et e-mail confirmé requis.</li>
                <li><strong>Taxe d'alliance</strong> : toujours active, elle est prélevée automatiquement sur chaque membre au rapport journalier (voir plus bas).</li>
                <li><strong>Taxes de paix</strong> : quand une alliance vaincue vous paie une paix, sa taxe journalière en Bitcoins et sa part des PDG gagnés en combat tombent dans votre trésorerie (voir <a href="/wiki/diplomacy#paix">Négocier la paix</a>).</li>
                <li><strong>Arène Alliance</strong> : les récompenses de l'alliance (Bitcoins et PDG) sont versées à la banque.</li>
            </ul>

            <h2 id="retrait">Les retraits</h2>
            <p>Tout membre peut demander un <strong>retrait</strong> (onglet Banque, « Retirer »), en Bitcoins ou en PDG.</p>
            <ul>
                <li>Si vous avez la permission <strong>Modifier</strong>, ou si votre alliance est un <strong>Rempart Silencieux</strong>, le retrait est immédiat.</li>
                <li>Sinon, la demande reste <strong>En attente</strong> jusqu'à ce qu'un membre qui a la permission Modifier l'accepte (« Oui » : les fonds vous sont versés) ou la refuse (« Non » : la demande est supprimée).</li>
                <li>L'acceptation échoue si la trésorerie n'a plus la somme, ou si le demandeur a quitté l'alliance entre-temps.</li>
            </ul>
            <p>Chaque mouvement est inscrit dans l'historique de la banque.</p>

            <h2 id="taxes">La taxe d'alliance</h2>
            <p>La <strong>taxe d'alliance</strong> se choisit <strong>à la création</strong> de l'alliance, de 5 à 50&nbsp;%. Elle <strong>ne peut plus être modifiée ensuite</strong>. Au Rempart Silencieux, elle est fixée à 50&nbsp;%.</p>
            <p>Elle est prélevée automatiquement au <strong>rapport journalier</strong> (18h59, heure de Paris), sur le revenu en Bitcoins que vous rapportent vos travailleurs, et versée à la trésorerie (ligne « Taxe journalière »).</p>
            <p>Calcul : le prélèvement vaut revenu − revenu ÷ (1 + taux). Une taxe de 10&nbsp;% retire donc environ 9,1&nbsp;% du revenu, une taxe de 50&nbsp;% en retire un tiers. Exemple : sur 10&nbsp;000 Bitcoins de revenu quotidien, 10&nbsp;% prélèvent 909 Bitcoins, 50&nbsp;% en prélèvent 3&nbsp;333.</p>
            <p>Choisissez-la raisonnable : trop élevée, les membres partent.</p>

            <h2 id="transparence">Transparence</h2>
            <p>L'onglet <strong>Banque</strong> affiche à <strong>tous les membres</strong> l'historique des 200 derniers mouvements : membre, type (Bitcoins ou PDG), montant, raison, date et statut (Accepté ou En attente). Les taxes journalières et les taxes de paix y figurent aussi. Chacun peut donc vérifier où va l'argent.</p>

    political_system:
        title: "Les 3 régimes politiques"
        category: "alliance"
        order: 5
        tags: "politique,regime,bonus,balance,rempart,marteau"
        summary: "Les 3 régimes possibles pour une alliance : avantages, inconvénients, et comment choisir."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principe">Choisir à la création</h2>
            <p>Quand une alliance est créée, le fondateur choisit un <strong>régime politique</strong>. Ce régime définit des <strong>règles internes</strong>, des <strong>bonus spécifiques</strong> et les <strong>7 recherches politiques</strong> que ses membres peuvent lancer. Le choix est <strong>irréversible</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>La Balance des Mondes</th><th>Le Rempart Silencieux</th><th>Le Marteau des Étoiles</th></tr>
                </thead>
                <tbody>
                    <tr><td>Membres au départ</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Dirigeants</td><td>Un Président, élu par vote</td><td>Tous les membres</td><td>Un seul, le Primaris</td></tr>
                    <tr><td>Quitter l'alliance</td><td>Oui (sauf le Président)</td><td>Non</td><td>Non</td></tr>
                    <tr><td>Dissoudre l'alliance</td><td>Oui</td><td>Oui</td><td>Non</td></tr>
                    <tr><td>Taxe d'alliance</td><td>Choisie à la création (5 à 50&nbsp;%)</td><td>50&nbsp;%</td><td>Choisie à la création (5 à 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% d'armes en attaque contre</td><td>Le Rempart Silencieux</td><td>Le Marteau des Étoiles</td><td>La Balance des Mondes</td></tr>
                </tbody>
            </table>
            <p>Le nombre de membres augmente ensuite avec le <a href="/wiki/alliance_basics#niveau">niveau de l'alliance</a>. Dissoudre une alliance est toujours impossible en temps de guerre.</p>

            <h2 id="balance">La Balance des Mondes (démocratique)</h2>
            <p>Régime ouvert et économique. Les membres votent pour élire leur Président. Focus sur l'<strong>économie</strong>.</p>
            <ul>
                <li>3 membres au départ.</li>
                <li>Chaque membre a une voix, qu'il peut changer à tout moment (onglet des membres, « Voter pour votre président »). Dès qu'un membre a plus de voix que le Président, il prend sa place.</li>
                <li>+20&nbsp;% d'armes en attaque contre Le Rempart Silencieux.</li>
                <li>Les membres peuvent quitter l'alliance (sauf le Président, et jamais en temps de guerre).</li>
                <li>Membres visibles publiquement, ainsi que la position de leur première planète.</li>
                <li>Recherches orientées économie : production, vitesse des recherches, entretien des scientifiques, cargos, blindage des vaisseaux, ventes aux marchands, colonisation (détail dans <a href="/wiki/alliance_research">Recherches d'alliance</a>).</li>
            </ul>

            <h2 id="rempart">Le Rempart Silencieux (offensif)</h2>
            <p>Régime agressif et collectif. Tous les membres sont dirigeants. Focus sur l'<strong>offensive</strong>.</p>
            <ul>
                <li>4 membres au départ (un de plus que la Balance des Mondes).</li>
                <li>+20&nbsp;% d'armes en attaque contre Le Marteau des Étoiles.</li>
                <li>Taxe d'alliance fixée à 50&nbsp;% automatiquement.</li>
                <li>Les retraits de la trésorerie sont immédiats pour tous les membres.</li>
                <li>Impossible de quitter l'alliance.</li>
                <li>Recherches orientées combat : recyclage, défense des travailleurs, puissance des vaisseaux, entretien et recrutement des Légionnaires, invasions, Points de Guerre.</li>
            </ul>
            <p>Les trois grades de tête (<strong>Guide</strong>, <strong>Protecteur</strong>, <strong>Camarade</strong>) sont <strong>équivalents</strong> : mêmes droits, aucune hiérarchie entre eux. Ils peuvent être librement attribués entre membres, et les nouveaux venus arrivent Camarades, avec tous les droits. Le seul grade inférieur est le <strong>Gulag</strong>, sans aucune permission, qu'on attribue pour mettre un membre à l'écart.</p>

            <h2 id="marteau">Le Marteau des Étoiles (défensif)</h2>
            <p>Régime discret et défensif. Un seul dirigeant, le Primaris, qui n'est remplacé que s'il reste inactif plus de 7 jours (voir <a href="/wiki/alliance_grades#afk">Grades et permissions</a>). Focus sur la <strong>défense</strong> et la résistance.</p>
            <ul>
                <li>2 membres au départ (un de moins que la Balance des Mondes, deux de moins que le Rempart Silencieux).</li>
                <li>+20&nbsp;% d'armes en attaque contre La Balance des Mondes.</li>
                <li>Menace Cthulhu qui monte 25&nbsp;% moins vite que dans les deux autres régimes : +150 au lieu de +200 par victoire contre les Cthulhu en difficulté normale (voir <a href="/wiki/cthulhus#menace">La menace Cthulhu</a>). Très utile en PvE.</li>
                <li>Seul le dirigeant est affiché publiquement.</li>
                <li>Impossible de quitter l'alliance. Impossible de la dissoudre.</li>
                <li>Si le dirigeant est mis en Game Over, l'alliance est dissoute.</li>
                <li>Recherches orientées défense : production de travailleurs, puissance des vaisseaux, capacité des barges, force des Légionnaires, entretien et défense des Mechas, invasions.</li>
            </ul>

            <h2 id="combat">Bonus entre régimes</h2>
            <p>Chaque régime en domine un autre, en pierre-feuille-ciseaux :</p>
            <ul>
                <li>La Balance des Mondes bat Le Rempart Silencieux.</li>
                <li>Le Rempart Silencieux bat Le Marteau des Étoiles.</li>
                <li>Le Marteau des Étoiles bat La Balance des Mondes.</li>
            </ul>
            <p>Quand votre camp <strong>attaque</strong> dans un combat spatial (ou en Arène Alliance) et que votre régime domine celui du défenseur, vos <strong>missiles, lasers et plasma</strong> gagnent <strong>+20&nbsp;%</strong>. En défense, ou face au même régime, il n'y a pas de bonus. Les combats au sol ne sont pas concernés.</p>

            <h2 id="visibilite">Ce que les autres voient de vous</h2>
            <ul>
                <li><strong>La Balance des Mondes</strong> : tous les membres apparaissent sur la fiche de l'alliance, avec son nombre de planètes, et la fiche de chaque membre indique la position de sa première planète.</li>
                <li><strong>Le Rempart Silencieux</strong> : les membres apparaissent sur la fiche de l'alliance, mais les classements masquent le nombre de membres et de planètes.</li>
                <li><strong>Le Marteau des Étoiles</strong> : seul le dirigeant apparaît sur la fiche de l'alliance, la liste des planètes des membres est masquée sur leur fiche, et les classements masquent le nombre de membres et de planètes.</li>
            </ul>

            <h2 id="choisir">Comment choisir ?</h2>
            <ul>
                <li><strong>Vous débutez et visez la croissance</strong> → La Balance des Mondes (économique, et la seule qu'on peut quitter).</li>
                <li><strong>Vous voulez une alliance soudée et agressive</strong> → Le Rempart Silencieux.</li>
                <li><strong>Vous voulez vous protéger, jouer défensif</strong> → Le Marteau des Étoiles (attention : en cas de Game Over du dirigeant, tout s'effondre).</li>
            </ul>

    alliance_research:
        title: "Recherches d'alliance"
        category: "alliance"
        order: 6
        tags: "recherche,alliance,politique,politiques,regime,bonus"
        summary: "Les 7 recherches politiques de votre régime : des recherches personnelles, payées avec vos propres Bitcoins et débloquées par le niveau de l'alliance."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principe">Comment ça marche</h2>
            <p>Les recherches d'alliance, appelées <strong>recherches politiques</strong>, se lancent dans la page <strong>Recherches</strong>, catégorie <strong>Politiques</strong>. Chaque régime a <strong>7 recherches</strong> de <strong>5 niveaux</strong>. Elles se débloquent une à une avec le <strong>niveau de l'alliance</strong> : la première dès le niveau 0, la deuxième au niveau 1… jusqu'à la septième au niveau 6 (voir <a href="/wiki/alliance_basics#niveau">Niveau d'alliance</a>). Sans alliance, la catégorie affiche « Requis : Rejoindre une alliance ».</p>
            <p>Ce sont des recherches <strong>personnelles</strong> : chaque membre les lance pour lui-même, dans sa propre file de recherches, avec <strong>ses propres Bitcoins</strong>, et le bonus ne s'applique <strong>qu'à lui</strong>. Le coût d'un niveau vaut le coût de base × le niveau visé, réduit par l'amélioration d'alliance « Coût de recherche ». La durée dépend de vos scientifiques, comme pour toute recherche.</p>
            <p><strong>Attention</strong> : si vous quittez l'alliance, en êtes exclu ou si elle est dissoute, tous vos niveaux de recherches politiques retombent à zéro. Une recherche politique qui se termine alors que vous n'avez plus d'alliance n'apporte rien.</p>
            <p>À ne pas confondre avec les <a href="/wiki/alliance_improvements">améliorations d'alliance</a>, collectives et financées par les investissements des membres. Les deux se cumulent.</p>

            <h2 id="liste">Les recherches de chaque régime</h2>
            <p>Effet par niveau, puis effet au niveau 5. Coût du niveau N = coût de base × N, en Bitcoins : les 5 niveaux coûtent 15 fois le coût de base (par exemple 375&nbsp;000 Bitcoins pour une recherche à 25&nbsp;000). Le niveau d'alliance requis est indiqué entre parenthèses.</p>

            <h3>La Balance des Mondes</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Effet</th><th>Coût de base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Loi Macron</strong> (niv. 0)</td><td>+7,1&nbsp;% de production de niobium, d'eau et de rations par niveau, en plus du +20&nbsp;% d'alliance (×1,56 au total au niveau 5, contre ×1,2 sans la recherche)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Mobilisation scientifique</strong> (niv. 1)</td><td>+0,1 de vitesse de recherche par niveau (+0,5 au niveau 5), jusqu'à la prochaine arrivée de scientifiques, qui arrondit la vitesse à l'entier le plus proche (voir <em>Travailleurs et scientifiques</em>)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Engouement scientifique</strong> (niv. 2)</td><td>Entretien des scientifiques réduit : −17&nbsp;% au niveau 1, −50&nbsp;% au niveau 5</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Cargos améliorés</strong> (niv. 3)</td><td>+20&nbsp;% de capacité des cargos par niveau (+100&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Blindage vaisseaux</strong> (niv. 4)</td><td>+10&nbsp;% d'armure des vaisseaux par niveau (+50&nbsp;%)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Accords marchands</strong> (niv. 5)</td><td>+5&nbsp;% de gains de vente aux marchands par niveau (+25&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Apport de la démocratie</strong> (niv. 6)</td><td>+1 planète colonisable par niveau (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>Le Rempart Silencieux</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Effet</th><th>Coût de base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Optimisation recyclage</strong> (niv. 0)</td><td>Chaque recycleur ramène 1&nbsp;000 + 400 × niveau ressources par cycle de 5 minutes (1&nbsp;400 au niveau 1, 3&nbsp;000 au niveau 5, soit le triple)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Renforcement idéologique</strong> (niv. 1)</td><td>+20&nbsp;% de défense des travailleurs par niveau (+100&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Armements améliorés</strong> (niv. 2)</td><td>+10&nbsp;% de puissance des vaisseaux par niveau (+50&nbsp;%)</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Structure soviétique</strong> (niv. 3)</td><td>Entretien des Légionnaires réduit : −9&nbsp;% au niveau 1, −33&nbsp;% au niveau 5</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Recrutement volontaires</strong> (niv. 4)</td><td>−1 Bitcoin par niveau sur le prix de recrutement d'un Légionnaire (8 → 3 Bitcoins)</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Empire sans frontières</strong> (niv. 5)</td><td>+1 planète conquise par invasion par niveau (+5)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Points de Guerre</strong> (niv. 6)</td><td>+10&nbsp;% de PDG gagnés par niveau (+50&nbsp;%)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h3>Le Marteau des Étoiles</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Effet</th><th>Coût de base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Politique familiale</strong> (niv. 0)</td><td>+20&nbsp;% de production de travailleurs par niveau (+100&nbsp;%)</td><td>25&nbsp;000</td></tr>
                    <tr><td><strong>Armements améliorés</strong> (niv. 1)</td><td>+10&nbsp;% de puissance des vaisseaux par niveau (+50&nbsp;%)</td><td>50&nbsp;000</td></tr>
                    <tr><td><strong>Invasions planifiées</strong> (niv. 2)</td><td>+25&nbsp;% de capacité des barges par niveau : 1&nbsp;250 Légionnaires par barge au niveau 1, 2&nbsp;250 au niveau 5</td><td>100&nbsp;000</td></tr>
                    <tr><td><strong>Puissance militaire</strong> (niv. 3)</td><td>+10&nbsp;% de force des Légionnaires, en attaque comme en défense, par niveau (+50&nbsp;%)</td><td>150&nbsp;000</td></tr>
                    <tr><td><strong>Supériorité mécanique</strong> (niv. 4)</td><td>Entretien des Mechas réduit : −17&nbsp;% au niveau 1, −50&nbsp;% au niveau 5</td><td>200&nbsp;000</td></tr>
                    <tr><td><strong>Blindage mechas</strong> (niv. 5)</td><td>+10&nbsp;% de défense des Mechas par niveau (+50&nbsp;%)</td><td>250&nbsp;000</td></tr>
                    <tr><td><strong>Empire sans frontières</strong> (niv. 6)</td><td>+1 planète conquise par invasion par niveau (+5)</td><td>300&nbsp;000</td></tr>
                </tbody>
            </table>

            <h2 id="choisir">Quelles recherches prioriser ?</h2>
            <ul>
                <li><strong>La Balance des Mondes</strong> → Loi Macron, Mobilisation scientifique, Cargos améliorés.</li>
                <li><strong>Le Rempart Silencieux</strong> → Armements améliorés, Empire sans frontières, Points de Guerre.</li>
                <li><strong>Le Marteau des Étoiles</strong> → Politique familiale, Invasions planifiées, Puissance militaire, Blindage mechas.</li>
            </ul>
            <p>Chacun choisit ses propres recherches, mais les dernières ne s'ouvrent qu'en montant le niveau de l'alliance : à organiser ensemble en salon, avec la trésorerie.</p>

    salon:
        title: "Le salon d'alliance"
        category: "alliance"
        order: 7
        tags: "salon,chat,discussion,alliance,message"
        summary: "Le chat de votre alliance : en direct, avec historique, coordonnées cliquables et salons communs avec vos alliés."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="fonctionnement">Comment ça marche</h2>
            <p>Le <strong>salon d'alliance</strong> est un chat en direct réservé aux membres de votre alliance. Ouvrez <strong>Salon</strong> dans le menu : le salon de votre alliance est l'onglet qui porte son nom.</p>
            <p>Vous y trouvez aussi le salon <strong>Univers</strong> (tout le serveur), un salon pour chaque galaxie où vous avez une planète et, pour chaque <strong>alliance défensive</strong> signée, un salon commun aux deux alliances (supprimé avec ses messages quand l'alliance défensive prend fin).</p>
            <p>Les messages sont conservés : vous pouvez remonter dans l'historique pour retrouver une info.</p>

            <h2 id="usage">À quoi ça sert</h2>
            <ul>
                <li><strong>Coordonner les attaques</strong> : lancer un raid à deux vaut mieux qu'un seul qui se fait repousser.</li>
                <li><strong>Alerter</strong> en cas de flotte ennemie repérée.</li>
                <li><strong>Partager des coordonnées</strong> (planètes cibles, champs de débris intéressants) : écrites au format <code>galaxie:secteur:position</code> (ex. <code>1:15:25</code>), elles deviennent un lien qui ouvre ce secteur sur la carte spatiale (la galaxie doit exister, le secteur aller de 1 à 100 et la position de 1 à 25). Les liens vers une page du jeu deviennent eux aussi cliquables.</li>
                <li><strong>Discuter de la stratégie</strong> d'alliance (recherches, diplomatie, guerres).</li>
                <li><strong>Se présenter</strong> aux nouveaux membres et tisser des liens.</li>
            </ul>

            <h2 id="bonnes-pratiques">Bonnes pratiques</h2>
            <ul>
                <li>Restez respectueux : insultes et harcèlement peuvent être sanctionnés. Un message abusif se signale depuis le message lui-même (voir <a href="/wiki/moderation_blocking">Modération</a>).</li>
                <li>Évitez de spammer : laissez la place aux discussions stratégiques. Un message fait au plus <strong>200 caractères</strong>, et l'on peut en envoyer 20 par minute.</li>
                <li>Pour interpeller quelqu'un, cliquez sur son pseudo : « Pseudo &gt; » s'ajoute à votre message. Un message qui contient votre pseudo, ou le tag de votre alliance entre crochets (ex. <code>[TAG]</code>), est mis en évidence pour vous.</li>
                <li>Quand un conseil est donné, notez-le : les messages défilent vite.</li>
            </ul>

            <h2 id="messages-prives">Et les messages privés ?</h2>
            <p>À part du salon, vous pouvez envoyer un <strong>message privé</strong> à n'importe quel joueur du serveur, y compris hors de votre alliance. Utile pour la diplomatie discrète, pour répondre à une proposition, ou pour demander à une alliance de vous inviter. Coordonnées et liens du jeu y deviennent cliquables exactement comme dans le salon.</p>

    alliance_improvements:
        title: "Améliorations d'alliance"
        category: "alliance"
        order: 8
        tags: "ameliorations,alliance,bonus,bitcoin,investissement,collectif,niveaux"
        summary: "Investissez des Bitcoins pour débloquer 16 bonus collectifs qui renforcent toute votre alliance — vitesse de recherche, production, puissance de combat et plus encore."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'onglet <strong>Améliorations</strong> de la page d'alliance permet aux membres d'investir des Bitcoins pour débloquer et améliorer <strong>16 bonus collectifs</strong>. Ces bonus profitent à <strong>tous les membres</strong> de l'alliance, connectés ou non. Un joueur qui quitte l'alliance cesse d'en bénéficier, mais l'alliance conserve ses niveaux acquis.</p>

            <h2 id="quota">Quota d'investissement</h2>
            <p>Chaque membre dispose de <strong>20 investissements par période de 3 heures</strong>. La période démarre à votre premier investissement ; au bout de 3 heures, le quota revient à 20. Les investissements non utilisés sont perdus : le quota ne s'accumule pas. L'onglet affiche vos « Investissements disponibles » et, quand le quota est épuisé, le temps restant avant le « Prochain créneau ».</p>
            <p>Chaque investissement coûte <strong>1&nbsp;000 Bitcoins</strong> pris sur votre solde personnel. C'est une dépense définitive, sans remboursement. Il faut un compte validé et un e-mail confirmé pour investir.</p>
            <p>Sous chaque bonus, des boutons rapides <strong>×1 / ×5 / ×10</strong> permettent d'investir plusieurs points en un clic.</p>

            <h2 id="niveaux">Niveaux et seuils</h2>
            <p>Chaque bonus possède <strong>5 niveaux</strong>. Les seuils d'investissements requis pour passer au niveau suivant sont :</p>
            <table>
                <thead>
                    <tr><th>Niveau</th><th>Investissements nécessaires</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Les investissements excédentaires au-delà du seuil d'un niveau sont <strong>perdus</strong> : il n'y a pas de report au niveau suivant.</p>
            <p>Pour amener un bonus au niveau 5, il faut <strong>3&nbsp;360 investissements</strong> au total, soit 3&nbsp;360&nbsp;000 Bitcoins. C'est un projet collectif : à 20 investissements par période de 3 heures, un joueur seul y mettrait 168 périodes.</p>

            <h2 id="bonus">Les 16 bonus et leurs effets</h2>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Effet par niveau</th><th>Maximum (niveau 5)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Vitesse de recherche</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Coût de recherche</strong></td><td>−1&nbsp;% par niveau</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Boost de construction</strong></td><td>+15 s de réduction par aide</td><td>75 s de réduction par aide</td></tr>
                    <tr><td><strong>Coût de construction</strong></td><td>−1&nbsp;% par niveau</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Production de niobium</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Production d'eau</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Production de rations</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Vitesse de flotte</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Puissance missile</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Puissance laser</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Puissance plasma</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Précision</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Blindage de flotte</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Bouclier</strong></td><td>+1&nbsp;% par niveau</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Défense planétaire</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Expérience du héros</strong></td><td>+2&nbsp;% par niveau</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Le <strong>Boost de construction</strong> alimente directement l'<a href="/wiki/alliance_construction_help">entraide construction</a> : plus son niveau est élevé, plus chaque aide d'un allié réduit la durée du chantier.</p>
            <p>Ne confondez pas l'amélioration « Vitesse de recherche » avec la recherche politique « Mobilisation scientifique » de la Balance des Mondes (pour celui qui la recherche, voir <a href="/wiki/alliance_research">Recherches d'alliance</a>). L'amélioration « Vitesse de recherche » raccourcit la durée affichée sur la page Recherches, mais pas la durée réelle : une recherche lancée se termine à l'heure calculée sans elle.</p>

            <h2 id="absence">Et si un membre s'absente ?</h2>
            <p>Il n'existe pas de mode vacances. Un membre absent <strong>garde tous ses bonus d'alliance</strong> (production, améliorations, recherches politiques) tant qu'il reste dans l'alliance, et sa taxe d'alliance continue d'être prélevée chaque jour. Après <strong>7 jours</strong> sans connexion, un dirigeant inactif est remplacé automatiquement (voir <a href="/wiki/alliance_grades#afk">Grades et permissions</a>). Après <strong>8 jours</strong>, le compte passe en pilote automatique, mais il reste membre de l'alliance.</p>

    alliance_construction_help:
        title: "Entraide construction"
        category: "alliance"
        order: 9
        tags: "entraide,construction,alliance,boost,batiment,aide,acceleration"
        summary: "Un clic pour accélérer les chantiers de tous vos alliés en même temps — et eux font pareil pour vous."
        related: "alliance_improvements"
        body: |
            <h2 id="principe">Principe</h2>
            <p>L'<strong>entraide construction</strong> permet aux membres d'une alliance d'accélérer mutuellement leurs chantiers en cours d'un simple clic. Lorsqu'un ou plusieurs alliés ont une construction en cours sur leur planète, une <strong>icône d'aide</strong> (une main qui tient un cœur) apparaît dans la barre globale de l'interface. Le badge indique le nombre de constructions éligibles. Il faut un compte validé et un e-mail confirmé pour aider.</p>
            <p>Un clic sur cette icône déclenche automatiquement l'aide sur <strong>toutes les constructions éligibles</strong> de l'alliance à la fois : pas besoin de les sélectionner une par une.</p>

            <h2 id="gain">Gain par aide</h2>
            <p>Chaque aide apportée accélère la construction de :</p>
            <blockquote><strong>15 secondes × niveau du bonus « Boost de construction »</strong></blockquote>
            <p>Le gain est <strong>plafonné à 75 secondes</strong> par aide et par membre (niveau 5 × 15 s = 75 s). Ce niveau est celui de <strong>votre alliance</strong> : tous ses membres apportent le même gain par aide. Une construction ne peut pas descendre en dessous de <strong>30 secondes restantes</strong> grâce à l'entraide.</p>
            <table>
                <thead>
                    <tr><th>Niveau du bonus</th><th>Gain par aide</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (non débloqué)</td><td>15 s</td></tr>
                    <tr><td>1</td><td>15 s</td></tr>
                    <tr><td>2</td><td>30 s</td></tr>
                    <tr><td>3</td><td>45 s</td></tr>
                    <tr><td>4</td><td>60 s</td></tr>
                    <tr><td>5</td><td>75 s</td></tr>
                </tbody>
            </table>

            <h2 id="eligibilite">Éligibilité d'une construction</h2>
            <p>Pour qu'une construction soit aidée, deux conditions doivent être remplies :</p>
            <ul>
                <li><strong>Durée totale &gt; 30 secondes</strong> (entre le début et la fin prévue).</li>
                <li><strong>Temps restant &gt; 30 secondes</strong> au moment où l'aide est apportée.</li>
            </ul>
            <p>Les chantiers presque terminés (30 s restantes ou moins) ne bénéficient pas de l'entraide.</p>

            <h2 id="deduplication">Une aide par construction</h2>
            <p>Un même membre ne peut aider <strong>chaque construction qu'une seule fois</strong>. L'icône disparaît automatiquement lorsqu'il n'y a plus de construction que vous n'avez pas encore aidée. Plusieurs membres peuvent aider la même construction, et les gains s'accumulent : 3 membres d'une alliance au niveau 3 apportent chacun 45 s, soit 135 s au total.</p>

            <h2 id="lien-ameliorations">Lien avec les améliorations d'alliance</h2>
            <p>Le gain par aide dépend directement du niveau du bonus <strong>« Boost de construction »</strong> dans l'onglet <a href="/wiki/alliance_improvements">Améliorations</a>. Investir dans ce bonus bénéficie à tout le monde : plus vite vos alliés finissent leurs bâtiments, plus vite l'empire de l'alliance grandit.</p>

    leveling:
        title: "Niveaux et expérience"
        category: "progression"
        order: 1
        tags: "niveau,experience,progression,level,score"
        summary: "Votre progression du niveau 2 au niveau 40, nourrie par la croissance de votre score."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Ce qui compte pour votre score</h2>
            <p>Votre score (vos <strong>points</strong>, ceux du classement) mesure la <strong>taille de votre empire</strong>. Il est recalculé une fois par jour, au rapport journalier de 18h59 (heure de Paris), et additionne :</p>
            <table>
                <tr><th>Élément</th><th>Ce qui vaut 1 point</th></tr>
                <tr><td><strong>Travailleurs</strong></td><td>100 travailleurs.</td></tr>
                <tr><td><strong>Vaisseaux au hangar</strong> (et en production)</td><td>120 de signature thermique (par exemple 6 frégates, de signature 20 chacune).</td></tr>
                <tr><td><strong>Vaisseaux en flotte</strong></td><td>20 de signature (par exemple 1 frégate). Un vaisseau en flotte compte <strong>six fois plus</strong> qu'au hangar.</td></tr>
                <tr><td><strong>Légionnaires</strong></td><td>500 sur une planète, environ 83 embarqués sur une flotte.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>25 sur une planète ; embarqué sur une flotte, chaque Mecha vaut 2 points.</td></tr>
                <tr><td><strong>Scientifiques</strong></td><td>Environ 17 sur une planète, 25 sur une flotte.</td></tr>
                <tr><td><strong>Tourelles</strong></td><td>Chaque tourelle vaut : lance-missiles 0,9 ; tourelle laser 0,6 ; tourelle laser lourde 1,2 ; laser ionique 1,2 ; artillerie plasma 0,8 ; canon Gauss 2,4.</td></tr>
                <tr><td><strong>Bâtiments</strong> (par niveau)</td><td>Mine de niobium, Extracteur d'eau, Champ agricole : 15 · Radar au sol : 20 · Caserne : 25 · Ferme aéroponique, Centre de recherche, Chantier spatial : 30 · Entrepôt de Niobium, Réservoir d'eau, Silo agricole : 45 · Usine d'armement : 50 · Radar d'espace : 60 · Grande ville : 65 · Brouilleur de radar : 100 · Métropole : 120 · Fort défensif : 130 · Industrie lourde : 150 · Base nucléaire : 300 · Ville flottante, Station orbitale : 2&nbsp;000. La Prison et le Camp d'esclaves ne rapportent pas de points.</td></tr>
            </table>
            <p>Les valeurs des troupes sont celles de base : les recherches de régime qui réduisent l'entretien des Légionnaires, des Mechas ou des scientifiques réduisent aussi les points qu'ils rapportent. Les Points de Guerre ne comptent pas dans le score.</p>
            <p>Perdre des vaisseaux au combat, démolir un bâtiment ou voir mourir des troupes fait donc baisser votre score au rapport suivant.</p>

            <h2 id="experience">Score, expérience et niveau</h2>
            <p>Votre niveau dépend de votre <strong>expérience</strong>, qui ne grandit qu'avec votre score. À chaque rapport journalier, si votre nouveau score dépasse celui de l'avant-veille, la différence s'ajoute à votre expérience.</p>
            <p>Exemple : votre score valait 10&nbsp;000 avant-hier, 11&nbsp;000 hier et 12&nbsp;000 aujourd'hui : vous gagnez 2&nbsp;000 points d'expérience au rapport du jour.</p>
            <p>Si votre score baisse, vous ne gagnez pas d'expérience ce jour-là, mais vous n'en perdez jamais : <strong>votre niveau ne redescend jamais</strong>. Le total d'expérience n'est pas affiché en jeu ; seul le niveau l'est.</p>

            <h2 id="seuils">Les paliers de niveau</h2>
            <p>Tout commandant démarre au <strong>niveau 2</strong>, avec 0 point d'expérience. Expérience à atteindre pour chaque niveau :</p>
            <table>
                <tr><th>Niveau</th><th>Expérience</th><th>Niveau</th><th>Expérience</th></tr>
                <tr><td>2</td><td>0</td><td>22</td><td>24&nbsp;000&nbsp;000</td></tr>
                <tr><td>3</td><td>2&nbsp;000</td><td>23</td><td>30&nbsp;000&nbsp;000</td></tr>
                <tr><td>4</td><td>10&nbsp;000</td><td>24</td><td>50&nbsp;000&nbsp;000</td></tr>
                <tr><td>5</td><td>40&nbsp;000</td><td>25</td><td>80&nbsp;000&nbsp;000</td></tr>
                <tr><td>6</td><td>100&nbsp;000</td><td>26</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>7</td><td>150&nbsp;000</td><td>27</td><td>200&nbsp;000&nbsp;000</td></tr>
                <tr><td>8</td><td>200&nbsp;000</td><td>28</td><td>250&nbsp;000&nbsp;000</td></tr>
                <tr><td>9</td><td>280&nbsp;000</td><td>29</td><td>500&nbsp;000&nbsp;000</td></tr>
                <tr><td>10</td><td>450&nbsp;000</td><td>30</td><td>800&nbsp;000&nbsp;000</td></tr>
                <tr><td>11</td><td>800&nbsp;000</td><td>31</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>12</td><td>1&nbsp;000&nbsp;000</td><td>32</td><td>2&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>13</td><td>1&nbsp;300&nbsp;000</td><td>33</td><td>3&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>14</td><td>2&nbsp;000&nbsp;000</td><td>34</td><td>6&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>15</td><td>3&nbsp;000&nbsp;000</td><td>35</td><td>12&nbsp;500&nbsp;000&nbsp;000</td></tr>
                <tr><td>16</td><td>5&nbsp;000&nbsp;000</td><td>36</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>17</td><td>7&nbsp;000&nbsp;000</td><td>37</td><td>50&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>18</td><td>9&nbsp;000&nbsp;000</td><td>38</td><td>80&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>19</td><td>12&nbsp;000&nbsp;000</td><td>39</td><td>100&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>15&nbsp;000&nbsp;000</td><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>21</td><td>18&nbsp;000&nbsp;000</td><td></td><td></td></tr>
            </table>
            <p>Le niveau 40 est le maximum. La progression est <strong>exponentielle</strong> : monter du niveau 2 au niveau 10 va bien plus vite que du 30 au 40.</p>

            <h2 id="utilite">À quoi sert votre niveau</h2>
            <ul>
                <li><strong>Bonus de connexion</strong> — le plancher du bonus quotidien vaut votre niveau × 5&nbsp;000 Bitcoins, multiplié par un tirage de ×1 à ×5 (voir <em>Bonus de connexion</em>).</li>
                <li><strong>Vitrine</strong> — votre niveau s'affiche sur la carte du commandant (page Vue d'ensemble) et sur votre profil. Le classement, lui, se fait sur les points, pas sur le niveau.</li>
            </ul>

    war_points:
        title: "Points de Guerre (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,points,guerre,combat,classement"
        summary: "La deuxième monnaie du jeu, gagnée surtout au combat, à dépenser en Bitcoins, troupes, vaisseaux d'élite et bâtiments."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Les PDG, c'est quoi ?</h2>
            <p>Les <strong>Points de Guerre</strong> (<strong>PDG</strong>) sont une deuxième "monnaie" de progression, <strong>orientée combat</strong>. Là où votre niveau reflète la croissance de votre empire, vos PDG reflètent votre activité militaire. Ils s'affichent dans la barre de ressources, et sont propres à chaque serveur : sur un nouveau serveur, vous repartez de zéro.</p>

            <h2 id="gagner">Comment en gagner</h2>
            <ul>
                <li><strong>Combats spatiaux</strong> — le vainqueur gagne des PDG proportionnels à la signature de la flotte ennemie détruite (1 PDG pour 100 de signature dans un combat d'une flotte contre une flotte), jamais selon ses propres pertes. Une horde Cthulhu ou une flotte alien en rapporte 5 fois moins qu'une flotte de joueur de même signature (garde-fou anti-fermage).</li>
                <li><strong>Perdre un combat spatial</strong> — une consolation vous est tout de même versée : 1 PDG pour 500 de signature perdue, soit un cinquième de ce qu'un vainqueur toucherait sur la même flotte.</li>
                <li><strong>Défense orbitale</strong> — quand vos tourelles anéantissent une flotte en orbite : 1 PDG pour 100 de signature détruite (5 fois moins face à un Cthulhu ou un alien). Raser les défenses d'une planète adverse, en revanche, ne rapporte rien à l'attaquant.</li>
                <li><strong>Raids</strong> — l'attaquant victorieux gagne 1 PDG pour 100 Légionnaires et Mechas défenseurs tués.</li>
                <li><strong>Invasions</strong> — une invasion réussie rapporte très peu : 1 PDG pour 60&nbsp;000 Légionnaires défenseurs tués (un travailleur tué compte pour un dixième de Légionnaire).</li>
                <li><strong>Repousser un raid ou une invasion</strong> — le défenseur gagne environ 7,5 PDG pour 100 Légionnaires assaillants tués.</li>
                <li><strong>Éliminer un joueur</strong> — si votre invasion lui prend sa dernière planète, vous récupérez tous ses PDG et tous ses Bitcoins.</li>
                <li><strong>Cthulhu</strong> — repousser une horde qui attaque votre planète rapporte des PDG selon la force de la horde, et briser un blocus Cthulhu rapporte une récompense en Bitcoins et en PDG, partagée selon les dégâts de chacun. Le Tower Defense, lui, rapporte de l'uranium, pas de PDG.</li>
                <li><strong>Objectifs quotidiens</strong> — chaque objectif accompli rapporte des PDG, et les accomplir tous rapporte au rapport journalier un bonus égal à leur récompense moyenne (voir <em>Quêtes journalières</em>).</li>
                <li><strong>Arène (duels de héros)</strong> — chaque duel gagné rapporte 15 PDG par niveau de votre héros, réduits jusqu'à moitié si les deux héros ont des niveaux très différents (dans un sens comme dans l'autre). Exemples : héros niveau 10 contre niveau 10 = 150 PDG ; niveau 10 contre niveau 4 = 75 PDG. Le podium du classement hebdomadaire de l'arène (300 / 200 / 100 PDG) et celui des tournois (500 / 300 / 150 PDG, et 50 PDG pour chaque participant) en rapportent aussi.</li>
                <li><strong>Prison</strong> — exécuter un héros capturé rapporte 100 PDG par niveau du héros.</li>
                <li><strong>Vente aux marchands</strong> — chaque vente livrée par une flotte rapporte 1 PDG pour 5&nbsp;000 Bitcoins de valeur de base (voir <a href="/wiki/market">Marché et marchands</a>).</li>
                <li><strong>Tutoriel</strong> — 500 PDG font partie de ses récompenses.</li>
                <li><strong>Banque d'alliance</strong> — un retrait sur la banque de votre alliance peut vous verser des PDG.</li>
            </ul>
            <p>La recherche d'alliance <strong>Points de Guerre</strong> (alliance de niveau 6 minimum) augmente de 10&nbsp;% par niveau, jusqu'à +50&nbsp;%, les PDG gagnés en combat spatial, en défense orbitale, en raid, en invasion et à la vente aux marchands.</p>

            <h2 id="utilite">À quoi ils servent</h2>
            <ul>
                <li><strong>Boutique de la page Objectifs</strong> — échangez vos PDG contre des Bitcoins (1 PDG = 1 Bitcoin), des Légionnaires (1 PDG = 2 Légionnaires) ou des travailleurs (1 PDG = 10 travailleurs), livrés sur la planète de votre choix dans la limite de sa capacité.</li>
                <li><strong>Vaisseaux d'élite</strong> — certains vaisseaux se paient en PDG (et en travailleurs) : Chasseur à plasma (1 PDG), Corvette de combat (3), Vaisseau de bataille (8), Caravelle (25), Vaisseau mère (25&nbsp;000), par unité.</li>
                <li><strong>Bâtiments</strong> — la Ville flottante et la Station orbitale coûtent 2&nbsp;000 PDG par niveau visé (2&nbsp;000 pour le niveau 1, 4&nbsp;000 pour le niveau 2…).</li>
                <li><strong>Recherche Expansion territoriale</strong> — 75&nbsp;000 PDG pour le niveau 1, 150&nbsp;000 pour le niveau 2.</li>
                <li><strong>Torturer un prisonnier</strong> — 200 PDG pour révéler la position d'une planète ennemie.</li>
                <li><strong>Banque d'alliance</strong> — vous pouvez y déposer des PDG.</li>
                <li><strong>Classement</strong> — la colonne « Pdg » du Classement Commandants permet de comparer l'activité militaire des joueurs.</li>
                <li><strong>Paid Server</strong> — le vainqueur est le joueur qui a le plus haut total « points + 2 × PDG » à la fin du serveur.</li>
            </ul>

            <h2 id="perdre">Peut-on en perdre ?</h2>
            <ul>
                <li><strong>En les dépensant</strong> — boutique de la page Objectifs, vaisseaux d'élite, Ville flottante, Station orbitale, recherche Expansion territoriale, torture d'un prisonnier, dépôt à la banque d'alliance. Annuler une production de vaisseaux, une construction ou une recherche vous rend les PDG dépensés.</li>
                <li><strong>En étant éliminé</strong> — si un joueur envahit votre dernière planète, vous êtes Game Over et il récupère <strong>tous</strong> vos PDG et vos Bitcoins.</li>
                <li><strong>Taxe de paix</strong> — si votre alliance a accepté une paix qui verse un tribut en PDG, une part des PDG que vous gagnez au combat part à l'alliance gagnante.</li>
            </ul>
            <p>Perdre un combat ne vous retire aucun PDG (vous touchez même une petite consolation), et une faillite économique ne les touche pas.</p>

            <h2 id="strategie">Stratégie</h2>
            <p>Les PDG récompensent les joueurs <strong>agressifs</strong>. Si vous voulez grimper dans la colonne « Pdg » du classement, concentrez-vous sur les combats spatiaux, la défense de vos planètes, les raids et l'arène plutôt que sur la pure croissance économique.</p>

    quests:
        title: "Quêtes journalières"
        category: "progression"
        order: 3
        tags: "quetes,objectifs,journalier,mission,recompense,pdg"
        summary: "3 objectifs chaque jour, à accomplir avant le rapport suivant, payés en Points de Guerre."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Chaque jour, au rapport journalier de <strong>18h59 (heure de Paris)</strong>, le jeu vous attribue <strong>3 quêtes journalières</strong>, appelées « Objectifs » dans le menu. Ce sont de petites tâches que vous pouvez accomplir pendant votre session de jeu normale.</p>
            <p>Vous avez jusqu'au rapport suivant pour les accomplir : celles qui restent sont alors supprimées et remplacées par 3 nouvelles.</p>
            <p>À votre arrivée sur un serveur, vos premières quêtes sont toujours les mêmes : écrire un message dans le salon, sonder la planète d'un joueur et rejoindre ou créer une alliance (sauf en Battle Royale).</p>
            <p>Le jeu ne vous donne que des quêtes réalisables dans la journée : pas de construction sans la recherche ou la place nécessaires, pas d'attaque tant que vous êtes sous protection débutant, pas de raid ni d'invasion sans barge, pas de « Coloniser une planète » si vous possédez déjà 20 planètes colonisées, etc.</p>

            <h2 id="types">Les quêtes possibles</h2>
            <p>Les 3 quêtes du jour sont tirées au hasard dans cette liste (récompense de base en PDG) :</p>
            <table>
                <tr><th>Quête</th><th>Récompense de base</th></tr>
                <tr><td>Envoyer un message privé</td><td>250</td></tr>
                <tr><td>Écrire un message dans le salon (n'importe quel salon auquel vous avez accès)</td><td>250</td></tr>
                <tr><td>Dépenser des Points de Guerre (dans la boutique de la page Objectifs)</td><td>250</td></tr>
                <tr><td>Sonder la planète d'un joueur</td><td>250</td></tr>
                <tr><td>Changer votre avatar (si vous n'en avez pas)</td><td>250</td></tr>
                <tr><td>Vendre des ressources aux marchands</td><td>500</td></tr>
                <tr><td>Créer une nouvelle Cohorte</td><td>500</td></tr>
                <tr><td>Entraîner des Légionnaires</td><td>500</td></tr>
                <tr><td>Améliorer vos vaisseaux</td><td>500</td></tr>
                <tr><td>Construire des défenses (troupes ou tourelles)</td><td>500</td></tr>
                <tr><td>Construire des vaisseaux</td><td>500</td></tr>
                <tr><td>Construire un bouclier</td><td>750</td></tr>
                <tr><td>Coloniser une planète</td><td>1&nbsp;000</td></tr>
                <tr><td>Recycler des ressources</td><td>1&nbsp;000</td></tr>
                <tr><td>Construire le bâtiment Grande ville</td><td>1&nbsp;000</td></tr>
                <tr><td>Finir une recherche</td><td>1&nbsp;000</td></tr>
                <tr><td>Entraîner des scientifiques</td><td>1&nbsp;000</td></tr>
                <tr><td>Détruire une flotte adverse (non utilitaire)</td><td>1&nbsp;000</td></tr>
                <tr><td>Construire une base spatiale</td><td>1&nbsp;000</td></tr>
                <tr><td>Construire un grand bouclier</td><td>1&nbsp;750</td></tr>
                <tr><td>Construire le bâtiment Métropole</td><td>2&nbsp;000</td></tr>
                <tr><td>Rejoindre ou créer une alliance (si vous n'en avez pas)</td><td>2&nbsp;000</td></tr>
                <tr><td>Construire le bâtiment Industrie lourde</td><td>4&nbsp;000</td></tr>
                <tr><td>Envahir la planète d'un joueur</td><td>4&nbsp;000</td></tr>
                <tr><td>Piller la planète d'un joueur</td><td>4&nbsp;000</td></tr>
                <tr><td>Lancer une frappe nucléaire sur la planète d'un joueur</td><td>5&nbsp;000</td></tr>
            </table>
            <p>Pour les bâtiments, toute construction terminée compte, quel que soit son niveau. « Finir une recherche » n'existe pas sur les serveurs où toutes les recherches sont débloquées dès le départ.</p>

            <h2 id="recompense">Les récompenses</h2>
            <ul>
                <li>Chaque quête terminée rapporte des <strong>PDG</strong>, crédités tout de suite : le gain est le <strong>plus élevé</strong> entre la récompense de base de la quête et <strong>5&nbsp;% de la moyenne des points des joueurs du serveur</strong> (recalculée à chaque rapport journalier), pour rester intéressant même quand les empires deviennent énormes.</li>
                <li>La récompense affichée sur la page Objectifs est celle que vous toucherez.</li>
                <li><strong>Bonus</strong> : si vous accomplissez <strong>tous vos objectifs du jour</strong> avant le rapport suivant, le rapport journalier vous verse en plus la <strong>récompense moyenne de ces objectifs</strong>, comme un objectif de plus.</li>
            </ul>
            <p>Exemple : si la moyenne du serveur est de 30&nbsp;000 points, « Envoyer un message privé » rapporte 1&nbsp;500 PDG au lieu de 250, tandis qu'« Envahir la planète d'un joueur » reste à 4&nbsp;000. Si ce jour-là vos trois objectifs vous rapportent 15&nbsp;000, 15&nbsp;000 et 12&nbsp;000 PDG et que vous les accomplissez tous, le rapport suivant vous verse un bonus de 14&nbsp;000 PDG.</p>

            <h2 id="consulter">Où les voir</h2>
            <p>Vos quêtes du jour sont sur la page <strong>Objectifs</strong> (menu, icône de cible) ; un badge indique combien il vous en reste (par exemple 2/3). Chaque quête y est listée avec sa récompense en PDG et sa rareté (de 1 à 5 étoiles).</p>
            <p>Elles se valident automatiquement : dès que vous faites l'action, la quête disparaît de la liste et un message « Objectif accompli » affiche votre gain. Cette même page vous permet de dépenser vos PDG (Bitcoins, Légionnaires, travailleurs).</p>

    ranking:
        title: "Les classements"
        category: "progression"
        order: 4
        tags: "classement,rang,position,top,leaderboard"
        summary: "Plusieurs classements pour mesurer votre progression (et celle de vos rivaux)."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="types">Les classements disponibles</h2>
            <table>
                <tr><th>Classement</th><th>Basé sur</th><th>Récompense</th></tr>
                <tr><td><strong>Classement Commandants</strong></td><td>Vos <strong>points</strong> : travailleurs, vaisseaux, troupes, tourelles et bâtiments (voir <em>Niveaux et expérience</em>). Les colonnes Position, Pseudo, Planètes, Points et <strong>Pdg</strong> (Points de Guerre) se trient d'un clic.</td><td>Aucune récompense directe. À la fermeture du serveur, finir dans le top 10 débloque le succès <em>Élite</em>, et le vainqueur obtient <em>Empereur</em>.</td></tr>
                <tr><td><strong>Classement Alliances</strong></td><td>Somme des points des membres (les 100 premières alliances du serveur).</td><td>Aucune récompense directe.</td></tr>
                <tr><td><strong>Classement des duels</strong> (arène)</td><td>Taux de victoire de votre héros principal en duels (victoires ÷ duels livrés), à partir de 5 duels.</td><td>Chaque lundi, les 3 héros qui ont gagné le plus de duels pendant la semaine écoulée (5 duels minimum dans la semaine) reçoivent 300 / 200 / 100 PDG et 3&nbsp;000 / 2&nbsp;000 / 1&nbsp;000 uranium.</td></tr>
                <tr><td><strong>Classement des alliances pendant un blocus Cthulhu</strong></td><td>Ce que chaque alliance fait contre la ruche pendant le blocus.</td><td>Bonus ou malus de production pendant 72&nbsp;heures (voir <em>Les prophéties de Cthulhu</em>).</td></tr>
            </table>
            <p>Les points et les positions du Classement Commandants sont recalculés une fois par jour, au rapport journalier (18h59, heure de Paris) ; à côté de chaque joueur, une flèche et un chiffre montrent l'évolution depuis le rapport précédent. Les Points de Guerre, eux, sont à jour en permanence.</p>

            <h2 id="consulter">Où les voir</h2>
            <p>Ouvrez la page <strong>Vue d'ensemble</strong> : sur la carte de votre commandant, le lien <strong>« Rang : N »</strong> ouvre le Classement Commandants, et le nom de votre alliance ouvre le Classement Alliances. Votre rang est donc toujours visible sur cette carte.</p>
            <p>Dans le Classement Commandants, vous pouvez rechercher un joueur par son pseudo ou par le tag de son alliance, et trier chaque colonne. Votre ligne est mise en évidence, comme celles de vos alliés et de vos ennemis. En première page, un graphique compare l'évolution de vos points et de vos PDG à la moyenne du serveur.</p>
            <p>Le Classement des duels se trouve sur la page <strong>Héros</strong>, onglet <strong>Arène</strong>. Le classement d'un blocus s'affiche sur la page <strong>Cthulhu</strong> pendant l'événement.</p>

            <h2 id="utilite">Pourquoi ça compte</h2>
            <ul>
                <li><strong>Stratégique</strong> — identifiez les gros joueurs à éviter ou à cibler.</li>
                <li><strong>Social</strong> — vitrine pour recruter dans votre alliance.</li>
                <li><strong>Compétition</strong> — en <strong>Paid Server</strong>, le vainqueur est le joueur qui a le plus haut total « points + 2 × Points de Guerre » à la fin du serveur. Sur tous les serveurs, votre rang final compte pour vos succès (top 10 = <em>Élite</em>).</li>
            </ul>

    heroes:
        title: "Votre héros"
        category: "progression"
        order: 5
        tags: "heros,bonus,planete,flotte,xp,capture,prison,specialite"
        summary: "Votre héros personnel : il évolue, combat, booste votre empire, et peut être capturé."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Chaque joueur possède <strong>un seul héros principal</strong>, créé en début de partie. Ce héros doit <strong>toujours</strong> être assigné soit à une planète, soit à une flotte — jamais libre. Vous pouvez en plus posséder des <strong>héros secondaires</strong> en nombre illimité — voir l'article dédié.</p>
            <p>Tant que vous n'avez pas de héros principal — en début de partie, ou après son exécution en prison —, le jeu vous ramène à sa création&nbsp;: les pages de jeu restent fermées jusque-là, celles de votre compte restent accessibles. Si l'un de vos héros secondaires occupe la planète choisie pour le nouveau héros, il repasse en <strong>réserve</strong>.</p>
            <p>Le héros apporte des bonus selon ses compétences, sa spécialité, son niveau et ses items. Ses 4 compétences sont : <strong>Attaque</strong>, <strong>Défense</strong>, <strong>Intelligence</strong> et <strong>Vitesse</strong>. Chaque point investi vaut <strong>+1&nbsp;%</strong> :</p>
            <ul>
                <li><strong>Attaque</strong> : puissance de feu de la flotte qu'il accompagne.</li>
                <li><strong>Défense</strong> : blindage de la flotte qu'il accompagne ; sur une planète, défense au sol contre les débarquements Cthulhu.</li>
                <li><strong>Intelligence</strong> : production de niobium, d'eau et de nourriture de la planète où il est affecté (et seulement celle-ci).</li>
                <li><strong>Vitesse</strong> : temps de vol de la flotte qu'il accompagne (−1&nbsp;% par point, réduction totale plafonnée à 90&nbsp;%).</li>
            </ul>
            <p>Attaque et Défense ne jouent pas dans les combats au sol entre joueurs (raid, invasion) : seuls la spécialité Militaire et ses traits y comptent. En duel d'arène, les quatre compétences entrent dans le score : l'Intelligence alimente la Ruse et la Vitesse alimente l'Élan (voir l'article <em>Arène PvP</em>).</p>

            <h2 id="specialites">Spécialités</h2>
            <p>Chaque spécialité confère un bonus passif, relève le plafond d'une ou deux compétences et débloque 3 traits aux niveaux 5, 10 et 15 :</p>
            <ul>
                <li><strong>Militaire</strong> : +5&nbsp;% de puissance de feu pour la flotte qu'il accompagne ; sur une planète, +5&nbsp;% au tir des tourelles et à la défense au sol ; au sol entre joueurs, +5&nbsp;% à la puissance de son camp (en attaque comme en défense) ; +5&nbsp;% en duel d'arène. Plafond d'Attaque et de Défense porté à 50&nbsp;%. Traits : <strong>Intimidation</strong> (niv. 5, l'adversaire subit −5&nbsp;% de puissance offensive, y compris contre le Cthulhu, et −5&nbsp;% de score en duel), <strong>Tacticien</strong> (niv. 10, +10&nbsp;% de puissance au premier round de vos combats, et +10&nbsp;% en duel), <strong>Seigneur de guerre</strong> (niv. 15, −5&nbsp;% de pertes de vos troupes au sol en combat entre joueurs, et +5&nbsp;% de puissance en duel).</li>
                <li><strong>Économie</strong> : double les bonus d'Intelligence (production, items de production compris) et du camp d'esclaves de la planète où il est affecté. Plafond d'Intelligence porté à 50&nbsp;%. Traits : <strong>Efficient</strong> (niv. 5 : affiché sur la fiche du héros comme −10&nbsp;% de construction, ce trait n'a pas d'effet sur les constructions), <strong>Négociant</strong> (niv. 10, +15&nbsp;% sur les ventes au marchand faites par sa flotte ou depuis sa planète), <strong>Magnat</strong> (niv. 15, +20&nbsp;% de production sur sa planète).</li>
                <li><strong>Explorateur</strong> : +5&nbsp;% de précision pour la flotte qu'il accompagne, et double son bonus de Vitesse (items compris) pour le temps de vol. Plafond de Vitesse porté à 50&nbsp;%. Traits : <strong>Éclaireur</strong> (niv. 5, +1 force radar sur la planète où il est affecté), <strong>Navigateur</strong> (niv. 10, −15&nbsp;% de temps de vol en plus pour sa flotte), <strong>Cartographe</strong> (niv. 15, +2 force radar de plus, soit +3 au total avec Éclaireur).</li>
            </ul>

            <p>En <strong>duel d'arène</strong>, ces mêmes règles s'appliquent : le militaire garde ses +5&nbsp;% et ses trois traits, l'économiste voit son Intelligence doublée (plus 20&nbsp;% avec Magnat) alimenter la Ruse, et l'explorateur sa Vitesse doublée (plus 15&nbsp;% avec Navigateur) alimenter l'Élan. Ruse et Élan comptent pour 60&nbsp;% de leur valeur.</p>
            <p>Un récapitulatif détaillé de ces bonus s'affiche automatiquement à la création du héros.</p>

            <h2 id="xp">Gain d'expérience</h2>
            <p>L'XP se gagne de plusieurs façons :</p>
            <ul>
                <li><strong>Combat</strong> : une part fixe (victoire en combat spatial 150 XP, raid gagné 100, invasion réussie 200, défaite 25), plus une part liée à la force de l'ennemi : sa signature ÷ 150, divisée par le niveau du héros. Exemple : un héros niveau 5 qui détruit une flotte de 30&nbsp;000 de signature gagne 150 + 40 = 190 XP.</li>
                <li><strong>Duel en arène</strong> (et chaque combat de tournoi) : seul le vainqueur gagne de l'XP, de 30 XP pour une victoire écrasante à 90 XP pour un duel très serré. Le perdant n'en gagne pas.</li>
                <li><strong>Passif</strong> : un héros affecté à une planète (pas sur une flotte) gagne 5 XP par heure d'absence, crédités à votre retour (40 XP après 8 heures d'absence). Les connexions rapprochées de moins de 12 minutes n'en rapportent pas.</li>
            </ul>
            <p>Toute l'XP gagnée est augmentée par le bonus d'XP de votre alliance et, si le héros est affecté à une planète dotée d'un Camp d'esclaves, de +5&nbsp;% par prisonnier qui y est détenu (+25&nbsp;% au maximum). Un héros capturé ne gagne pas d'XP.</p>
            <p>Pour passer du niveau N au niveau N+1, il faut N × 500 XP : 500 XP pour atteindre le niveau 2, 5&nbsp;000 XP pour passer du niveau 10 au niveau 11, et 22&nbsp;500 XP au total pour atteindre le niveau 10. Chaque niveau gagné donne <strong>2 points de compétence</strong>, à répartir depuis la page Héros. Chaque point vaut +1&nbsp;% dans la compétence choisie, jusqu'à 30&nbsp;% par compétence (50&nbsp;% pour la ou les compétences de votre spécialité). Les bonus d'items s'ajoutent au-delà de ces plafonds.</p>

            <h2 id="assignation">Assignation</h2>
            <p>Assignez votre héros depuis la page <strong>Héros</strong> (bouton « Réassigner le héros »), depuis la page <strong>Planètes</strong> (bouton « Assigner le héros » d'une planète) ou depuis la page de gestion d'une <strong>flotte</strong> (bouton « Assigner »). Le changement est immédiat, sans temps de trajet.</p>
            <p>Une planète ou une flotte ne peut accueillir qu'un seul héros. Une planète sous embargo ne peut pas recevoir de héros, et un héros posté sur une planète sous embargo ne peut pas rejoindre une flotte. Un héros sur une flotte en vol ou en combat ne peut pas être réassigné.</p>
            <p>Si sa flotte est détruite et qu'il n'est pas capturé, le héros débarque sur la planète du combat si elle vous appartient et n'a pas de héros ; sinon sur votre plus ancienne planète sans héros. Si toutes vos planètes ont déjà un héros, votre héros principal prend la place d'un de vos héros secondaires, qui repasse en réserve.</p>

            <h2 id="capture">Capture</h2>
            <p>Votre héros principal peut être capturé lors d'un combat :</p>
            <ul>
                <li><strong>Combat spatial contre des flottes</strong> (votre flotte est détruite) : 20&nbsp;% de chance. La destruction de votre flotte par les seules défenses d'une planète, ou d'une flotte sans armes, ne capture pas votre héros principal.</li>
                <li><strong>Invasion</strong> de la planète où il est affecté : 35&nbsp;% de chance. Le héros à bord de la flotte d'invasion ne risque jamais la capture, même si l'invasion échoue, et un raid ne capture jamais.</li>
            </ul>
            <p>Une capture exige un <strong>bâtiment Prison de niveau 1 ou plus</strong> : le héros est enfermé sur le lieu du combat s'il appartient au vainqueur et porte une Prison, sinon sur la planète du vainqueur à la Prison la plus élevée. Sans aucune Prison, pas de capture.</p>
            <p>Après libération, le héros bénéficie de <strong>24h d'immunité</strong> contre la recapture.</p>
            <p>Seul un joueur peut capturer votre héros principal : ni les Cthulhu ni les commandants IA ne le font. Attention, les commandants IA peuvent en revanche capturer ou exécuter vos héros secondaires.</p>
            <p>Cette section décrit votre héros <strong>principal</strong>. Vos <strong>héros secondaires</strong> suivent une règle de capture totalement différente, sans probabilité — voir l'article <em>Héros secondaires</em>.</p>

    secondary_heroes:
        title: "Héros secondaires"
        category: "progression"
        order: 6
        tags: "heros,secondaire,ecurie,capture,execution,prison,recyclage,reserve,butin"
        summary: "Des héros supplémentaires obtenus en butin rare : mêmes bonus que votre héros principal, mais capturables ou exécutables définitivement en combat."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Un héros secondaire apporte <strong>les mêmes bonus</strong> qu'un héros principal une fois placé sur une planète ou une flotte. Ce qui le distingue : il peut être <strong>capturé ou tué définitivement</strong> en cas de défaite. Vous pouvez en accumuler plusieurs, en plus de votre héros principal.</p>

            <h2 id="obtention">Comment on les obtient</h2>
            <p>Un héros secondaire est un <strong>butin rare</strong>, jamais achetable :</p>
            <table>
                <thead>
                    <tr><th>Source</th><th>Chance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Victoire en Tower Defense Cthulhu (par run)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Attaque Cthulhu repoussée sur une de vos planètes (débarquement repoussé ou horde anéantie en orbite)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Vainqueur d'un tournoi d'arène</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>À l'obtention, il est niveau 1, son nom et sa spécialité sont tirés au hasard, et il arrive directement en <strong>réserve</strong> — c'est à vous de décider où le placer, ou de le recycler sans jamais le placer.</p>

            <p>Chaque héros obtenu vous est annoncé par un <strong>rapport</strong> qui précise d'où il vient. L'écran de fin de Tower Defense et le rapport de victoire contre les Cthulhu le signalent également sur le moment.</p>

            <h2 id="placement">Où les placer</h2>
            <p>Comme votre héros principal : <strong>une planète</strong> ou <strong>une flotte</strong>, jamais les deux à la fois. Un secondaire non placé reste en <strong>réserve</strong> : aucun bonus, mais <strong>aucun risque</strong> non plus — c'est un choix normal, pas un oubli à corriger. Gérez tous vos secondaires depuis l'onglet <strong>Écurie</strong> de la page Héros : bouton « Assigner » pour le placer, « Rappeler en réserve » pour le retirer.</p>

            <h2 id="gestion">Compétences et équipement</h2>
            <p>Un héros secondaire progresse comme le principal : il gagne des niveaux, et avec eux des <strong>points de compétence</strong>. Le bouton <strong>Gérer</strong> de l'Écurie ouvre leur répartition entre Attaque, Défense, Intelligence et Vitesse.</p>
            <p>Le même panneau gère son <strong>équipement</strong> : posez-lui un item libre de votre inventaire, ou reprenez-le. Les items d'un héros ennemi capturé vous reviennent avec lui — c'est là que vous les récupérez.</p>

            <h2 id="risque">Ce que vous risquez</h2>
            <p>Un héros secondaire placé peut être perdu <strong>définitivement</strong> lors de :</p>
            <ul>
                <li>Un <strong>combat spatial</strong> perdu (sa flotte est détruite).</li>
                <li>Un <strong>combat utilitaire</strong> perdu (flotte sans la moindre arme, anéantie sans même livrer bataille).</li>
                <li>Une <strong>invasion</strong> réussie contre la planète où il est stationné.</li>
                <li>La destruction de sa flotte par les <strong>défenses orbitales</strong> d'une planète passée en mode attaque.</li>
            </ul>
            <p>Il ne risque en revanche <strong>rien</strong> lors :</p>
            <ul>
                <li>Du <strong>combat au sol d'un raid</strong> — même réussi, un raid ne prend jamais la planète. En revanche, si la flotte qui le transporte est détruite en orbite, il est exposé comme pour toute flotte détruite.</li>
                <li>D'un combat contre les <strong>Cthulhu</strong> (ou contre le Marchand). Attention : les <strong>commandants IA</strong> suivent la même règle que les joueurs et peuvent capturer ou exécuter vos héros secondaires.</li>
                <li>De l'<strong>arène</strong> — duels et tournois n'exposent aucun héros à la capture.</li>
            </ul>

            <p>Une <strong>notification</strong> vous prévient dès qu'un de vos secondaires est capturé ou exécuté : une perte définitive ne dépend pas du fait que vous ouvriez votre rapport.</p>

            <h2 id="prison">La condition prison</h2>
            <p>Contrairement à votre héros principal (capture <em>probabiliste</em>, voir l'article <em>Prison et héros capturés</em>), le sort d'un secondaire vaincu est <strong>entièrement déterministe</strong>, sans le moindre hasard :</p>
            <ul>
                <li>Le vainqueur possède un <strong>bâtiment Prison</strong> de niveau 1 ou plus sur au moins une de ses planètes → il <strong>capture</strong> le héros, avec son niveau, son expérience et ses items intacts.</li>
                <li>Le vainqueur n'a <strong>aucune</strong> Prison construite → le héros est <strong>exécuté</strong>, et ses items rejoignent l'inventaire du vainqueur.</li>
            </ul>
            <p>En combat de blocs (plusieurs alliés côte à côte), le héros revient au commandant vainqueur qui a <strong>le plus engagé de puissance</strong> dans le combat — s'il n'a pas de Prison, le héros est exécuté même si un allié du même camp en possédait une.</p>
            <p>Un secondaire capturé n'est <strong>pas</strong> un prisonnier classique : pas de page prison, pas d'évasion, pas de rançon. Il arrive directement, actif, dans l'Écurie de son nouveau propriétaire, en réserve, prêt à être placé ou recyclé.</p>

            <h2 id="recuperation">Aucune récupération possible</h2>
            <p>Une fois capturé ou exécuté, un héros secondaire est perdu <strong>pour de bon</strong> : ni évasion, ni rançon, ni libération par invasion de son ancien propriétaire ne peuvent le récupérer. Le seul moyen de le revoir un jour est de le reprendre vous-même au combat — et il peut ainsi recirculer indéfiniment d'empire en empire.</p>

            <h2 id="identite">Un héros capturé garde son identité</h2>
            <p>Un secondaire capturé conserve son <strong>nom</strong>, son <strong>niveau</strong> et son <strong>expérience</strong>. Dans votre Écurie, il affiche son commandant d'origine (« Capturé sur … »).</p>

            <h2 id="recyclage">Le recyclage</h2>
            <p>Vous pouvez <strong>recycler</strong> un de vos héros secondaires (bouton « Recycler » de l'Écurie) : il est détruit et votre héros principal reçoit <strong>90&nbsp;%</strong> de toute l'expérience que ce secondaire a accumulée depuis le niveau 1 (les bonus d'XP d'alliance ne s'y appliquent pas). Ses items retournent dans votre inventaire.</p>
            <p>Exemple : un secondaire niveau 10 rapporte 20&nbsp;250 XP, de quoi faire passer un principal du niveau 10 au niveau 13.</p>
            <p>Un aperçu chiffré (XP transférée, niveau projeté du principal) s'affiche avant confirmation. Le recyclage est impossible tant que sa flotte est en vol ou en combat. <strong>Action irréversible.</strong></p>

    items:
        title: "Items du héros"
        category: "progression"
        order: 6
        tags: "items,equipement,bonus,rarete,drop,cthulhu,fusion"
        summary: "Équipez votre héros avec jusqu'à 3 items pour cumuler des bonus. Comment les obtenir."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Les items sont des objets équipables sur vos héros (maximum <strong>3 items</strong> par héros). Leurs bonus s'ajoutent à ceux du héros, au-delà des plafonds de compétences. Ce qu'ils apportent dépend de leurs types de bonus, détaillés plus bas.</p>

            <h2 id="categories">Catégories</h2>
            <ul>
                <li><strong>Offensif</strong> (armes), <strong>Défensif</strong> (armures, boucliers) et <strong>Pouvoir</strong> (objets de statut).</li>
            </ul>
            <p>La catégorie ne change que le nom et l'apparence de l'item : ses bonus sont tirés au hasard parmi tous les types, quelle que soit sa catégorie. Regardez donc les bonus affichés sur la carte, pas la catégorie. Aucune contrainte de type : vous pouvez équiper 3 offensifs si vous le souhaitez.</p>

            <h2 id="raretes">Raretés</h2>
            <ul>
                <li><strong>Commun</strong> : 1 bonus (+2 à 5&nbsp;%)</li>
                <li><strong>Rare</strong> : 1 ou 2 bonus (+5 à 10&nbsp;% chacun)</li>
                <li><strong>Épique</strong> : 2 ou 3 bonus (+10 à 15&nbsp;% chacun)</li>
                <li><strong>Légendaire</strong> : 3 ou 4 bonus (+15 à 25&nbsp;% chacun)</li>
            </ul>
            <p>Chaque bonus est tiré au hasard dans la fourchette de sa rareté à la création de l'item, puis ne change plus.</p>
            <p>Le niveau du héros ne change pas les bonus d'un item : ils s'ajoutent tels quels, que le héros soit niveau 1 ou 20. Seule la spécialité compte : un héros Économie double les bonus de Production et un Explorateur double les bonus de Vitesse flotte. En duel, comme le score est proportionnel au niveau, un même item rapporte plus de points à un héros de haut niveau, pour la même part de son score.</p>

            <h2 id="bonus">Types de bonus</h2>
            <p>16 types de bonus existent. Voici où chacun agit (les noms sont ceux affichés sur les cartes) :</p>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Effet</th></tr>
                </thead>
                <tbody>
                    <tr><td>Attaque flotte, Défense flotte, Précision flotte, Bouclier flotte</td><td>Combats de la flotte que le héros accompagne.</td></tr>
                    <tr><td>Vitesse flotte</td><td>Temps de vol de la flotte que le héros accompagne.</td></tr>
                    <tr><td>Production</td><td>Production de niobium, d'eau et de nourriture de la planète où le héros est affecté.</td></tr>
                    <tr><td>Force Légionnaires</td><td>Défense au sol de la planète où le héros est affecté, contre les débarquements Cthulhu uniquement.</td></tr>
                    <tr><td>Puissance duel</td><td>Score en duel d'arène.</td></tr>
                    <tr><td>Force Mechas, Vitesse construction, Production workers, Production vaisseaux, Portée radar, Vitesse recyclage, Dégâts Cthulhu, Gain d'XP</td><td>Ces bonus ne s'appliquent qu'en duel d'arène.</td></tr>
                </tbody>
            </table>
            <p>En duel d'arène, les 16 types comptent tous, avec un poids qui dépend du type (voir l'article <em>Arène PvP</em>). Un bonus de flotte porté par un héros affecté à une planète n'agit qu'en duel.</p>

            <h2 id="obtention">Obtention</h2>
            <p>Voici toutes les façons d'obtenir des items :</p>

            <h3>Combattre les Cthulhu</h3>
            <p>Un item peut tomber quand vous battez des Cthulhu, que vous repoussiez leur débarquement au sol ou que vous anéantissiez entièrement leur horde en orbite avant qu'elle n'atterrisse. Les chances sont identiques dans les deux cas et dépendent de votre difficulté PvE :</p>
            <ul>
                <li><strong>Facile</strong> : 30&nbsp;% de chance d'obtenir un item (22&nbsp;% commun, 7&nbsp;% rare, 1&nbsp;% épique)</li>
                <li><strong>Normal</strong> : 40&nbsp;% de chance (25&nbsp;% commun, 10&nbsp;% rare, 4,5&nbsp;% épique, 0,5&nbsp;% légendaire)</li>
                <li><strong>Difficile</strong> : 50&nbsp;% de chance (25&nbsp;% commun, 15&nbsp;% rare, 8&nbsp;% épique, 2&nbsp;% légendaire)</li>
            </ul>
            <p>Une horde seulement partiellement détruite en orbite débarque quand même : c'est alors ce débarquement qui déclenche le tirage, jamais les deux à la fois.</p>

            <h3>Victoires en arène</h3>
            <p>Chaque victoire en duel d'arène, combats de tournoi compris, offre une chance d'item :</p>
            <ul>
                <li><strong>Commun</strong> : 10&nbsp;%</li>
                <li><strong>Rare</strong> : 4&nbsp;%</li>
                <li><strong>Épique</strong> : 1&nbsp;%</li>
            </ul>
            <p>Soit environ 15&nbsp;% de chance d'obtenir un item à chaque victoire.</p>

            <h3>Mises en duel</h3>
            <p>En lançant un défi, vous pouvez miser un item. Si l'adversaire accepte, il doit miser un item de même rareté. Le vainqueur remporte les deux items.</p>

            <h3>Autres sources</h3>
            <ul>
                <li><strong>Tower Defense Cthulhu</strong> : chaque victoire donne droit à un tirage selon les chances de votre difficulté ci-dessus (deux tirages en Difficile).</li>
                <li><strong>Tournois d'arène</strong> : item épique garanti pour le 1er, rare pour le 2e et le 3e, 10&nbsp;% de chance d'un commun pour les autres participants (voir l'article <em>Arène PvP</em>).</li>
                <li><strong>Bonus de connexion</strong> : un item commun au 3e jour de votre série, un item rare au 7e.</li>
            </ul>

            <h3>Fusionner trois items</h3>
            <p>Trois items de <strong>même rareté</strong> se fusionnent en un item de la rareté supérieure, sans coût ni délai. La catégorie et les bonus du nouvel item sont tirés au hasard, comme pour un item trouvé au combat. Les trois items d'origine sont consommés définitivement, et un item porté par un héros doit d'abord être déséquipé. Le légendaire est la rareté maximale : il ne se fusionne pas.</p>
            <p>La fusion se lance depuis la page <strong>Héros</strong>, onglet <strong>Fusion</strong> : cliquez trois cartes d'items pour les sélectionner (la carte entière est cliquable), puis validez avec le bouton de fusion, disponible en haut comme en bas de la liste.</p>

            <h2 id="vol">Vol d'items</h2>
            <p>Si votre héros principal est capturé, chacun de ses items équipés peut être volé par le vainqueur. Probabilité de vol : Commun 80&nbsp;%, Rare 60&nbsp;%, Épique 40&nbsp;%, Légendaire 25&nbsp;%.</p>
            <p>Les items non volés restent sur votre héros pendant sa captivité : il les garde s'il est libéré, mais le geôlier les récupère tous s'il l'exécute. Un héros secondaire capturé emporte tous ses items chez son nouveau propriétaire.</p>

            <h2 id="inventaire">Inventaire</h2>
            <p>Accédez à votre inventaire depuis la page <strong>Héros</strong>, onglet <strong>Inventaire</strong>. Depuis l'inventaire, vous pouvez :</p>
            <ul>
                <li><strong>Équiper</strong> un item sur votre héros principal (s'il n'est pas capturé, porte moins de 3 items et n'est pas à bord d'une flotte en vol ou en combat). Les héros secondaires s'équipent depuis l'onglet <strong>Écurie</strong> (bouton « Gérer »).</li>
                <li><strong>Déséquiper</strong> un item pour le remettre en inventaire (impossible pendant que sa flotte est en vol ou en combat).</li>
                <li><strong>Détruire</strong> un item dont vous n'avez plus besoin.</li>
                <li><strong>Fusionner</strong> 3 items de même rareté en un item de la rareté supérieure, depuis l'onglet <strong>Fusion</strong> voisin.</li>
            </ul>
            <p>Chaque item est présenté sous forme de <strong>carte illustrée</strong> affichant son image, ses bonus et un liseré coloré selon sa rareté. Les cartes s'organisent en grille (3 à 4 par ligne selon la place disponible sur votre écran).</p>

    prison:
        title: "Prison et héros capturés"
        category: "progression"
        order: 7
        tags: "prison,capture,heros,evasion,torture,rancon,geole,secondaire"
        summary: "Quand un héros est capturé, que se passe-t-il ? Les options du prisonnier et du geôlier, et la capture directe des héros secondaires adverses."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Capture d'un héros</h2>
            <p>Un héros principal est capturé lors d'un combat spatial contre des flottes (20&nbsp;%) ou de l'invasion de la planète où il est affecté (35&nbsp;%) — détails dans l'article <em>Votre héros</em>. Le joueur capturé est enfermé : toute page hors du périmètre autorisé le renvoie vers la <strong>page prison</strong>. Il garde cependant accès au <strong>salon d'alliance</strong>, à ses <strong>messages privés</strong>, à ses <strong>rapports</strong>, à la <strong>consultation</strong> (lecture seule) de son alliance, à la <strong>gestion de son compte</strong> et au <strong>changement de serveur</strong>. Tout le reste — construction, flottes, carte, marché, arène, et même la page Héros — reste inaccessible tant qu'il n'est pas libéré.</p>
            <p>Une capture exige un <strong>bâtiment Prison de niveau 1 ou plus</strong> : le héros est enfermé sur le lieu du combat s'il appartient au vainqueur et porte une Prison, sinon sur la planète du vainqueur à la Prison la plus élevée. Sans aucune Prison, pas de capture.</p>

            <h2 id="prisonnier">Actions du prisonnier</h2>
            <p>Le prisonnier dispose de plusieurs actions. <strong>Alerter l'alliance</strong> et <strong>Se rebeller</strong> partagent un même délai : l'une des deux est possible dès la capture, puis une toutes les <strong>4 heures</strong>.</p>
            <ul>
                <li><strong>Alerter l'alliance</strong> (70&nbsp;% + 2&nbsp;% par niveau du héros, 90&nbsp;% au maximum ; 80&nbsp;% au niveau 5) : envoie les coordonnées de la prison au salon d'alliance. Échec = le geôlier est alerté. Sans alliance, l'action est indisponible. Après un échec, la prochaine action attend 6 heures au lieu de 4.</li>
                <li><strong>Se rebeller</strong> (25&nbsp;% + 1,5&nbsp;% par niveau, +10&nbsp;% pour un Militaire ; 50&nbsp;% pour un Militaire niveau 10) : détruit 5&nbsp;% du niobium, de l'eau et de la nourriture de la planète-prison. Échec = perte d'un niveau. Dans les deux cas, le geôlier reçoit un rapport.</li>
                <li><strong>S'évader</strong> : une tentative toutes les 4 heures à compter de la capture (la première 4 heures après). 40&nbsp;% de réussite, +5&nbsp;% par tranche de 4 heures de captivité, jusqu'à 100&nbsp;% au bout de 52 heures. Échec = le geôlier est alerté. Ce délai est indépendant des deux actions précédentes.</li>
                <li><strong>S'évader grâce à Slash</strong> : à tout moment et sans limite. Voir l'article <em>S'évader de prison</em>.</li>
                <li><strong>Payer la rançon</strong> : si le geôlier en a demandé une, vous pouvez la payer ou la refuser depuis la page prison.</li>
            </ul>

            <h2 id="geolier">Actions du geôlier</h2>
            <p>Vos prisonniers se gèrent depuis la page <strong>Héros</strong>, onglet <strong>Prisonniers détenus</strong> :</p>
            <ul>
                <li><strong>Exécuter</strong> : détruit le héros définitivement et vous rapporte 100 PDG par niveau du héros (1&nbsp;200 PDG pour un niveau 12). Vous récupérez tous ses items restants. Son propriétaire en est informé par un rapport.</li>
                <li><strong>Libérer</strong> : geste diplomatique, le héros retourne chez son propriétaire.</li>
                <li><strong>Torturer</strong> (200 PDG) : révèle les coordonnées d'une planète du propriétaire du prisonnier, tirée au hasard (elle peut déjà être connue), et fait perdre 50 XP au prisonnier. Répétable sans délai.</li>
                <li><strong>Rançonner</strong> : réclamer du niobium, de l'eau et/ou de l'uranium contre sa libération. Le prisonnier a 24 heures pour payer ou refuser ; une seule demande à la fois, mais vous pouvez en faire une nouvelle après un refus ou une expiration.</li>
            </ul>

            <h2 id="liberation">Libération</h2>
            <ul>
                <li><strong>L'alliance du prisonnier envahit</strong> la planète-prison : libération automatique.</li>
                <li><strong>Un autre joueur envahit</strong> la planète-prison : 60&nbsp;% de chance que le prisonnier s'évade dans le chaos ; sinon il reste enfermé et l'envahisseur, nouveau propriétaire de la planète, devient son geôlier.</li>
                <li><strong>Les Cthulhu s'emparent de la planète-prison</strong> : les prisonniers ne sont pas libérés. Ils restent enfermés dans la base Cthulhu et doivent s'évader par eux-mêmes (voir <em>S'évader de prison</em>). Si la planète redevient inhabitée, ils sont libérés.</li>
                <li><strong>Le geôlier abandonne la planète-prison</strong> (ou quitte la partie) : le prisonnier est libéré automatiquement.</li>
            </ul>

            <h2 id="secondaires">Capturer un héros secondaire adverse</h2>
            <p>Tout ce qui précède — évasion, torture, rançon, libération — concerne le <strong>héros principal</strong> d'un adversaire. Un <strong>héros secondaire</strong> (voir l'article <em>Héros secondaires</em>) obéit à une règle bien plus directe, et c'est là que votre bâtiment Prison prend une <strong>utilité décisive</strong> : dès que vous possédez une Prison de niveau 1 ou plus sur l'une de vos planètes, tout héros secondaire adverse vaincu face à vous (combat spatial, combat utilitaire, destruction de sa flotte par vos défenses orbitales ou invasion réussie) devient <strong>immédiatement et définitivement</strong> le vôtre — avec son niveau, son expérience et ses items intacts. Sans Prison, il est <strong>exécuté</strong> au lieu d'être capturé, et ses items rejoignent votre inventaire.</p>
            <p>Un secondaire capturé n'est <strong>pas</strong> un prisonnier au sens de cette page : il n'y a pas de page prison, pas d'évasion, pas de rançon possible. Il arrive directement, actif, dans votre <strong>Écurie</strong> — prêt à être placé sur une planète ou une flotte, ou recyclé.</p>

            <h2 id="prerequis">Prérequis</h2>
            <p>Recherche <strong>Système carcéral</strong> (nécessite Barbelées niveau 5), puis bâtiments <strong>Prison</strong> et <strong>Camp d'esclaves</strong>.</p>

    prison_escape:
        title: "S'évader de prison"
        category: "progression"
        order: 8
        tags: "prison,evasion,slash,rancon,heros,capture"
        summary: "Les trois façons de sortir de prison par vous-même : l'évasion instantanée, Slash et la rançon."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Trois sorties</h2>
            <p>Quand votre héros est capturé, la page prison vous propose trois façons d'en sortir sans attendre vos alliés : l'évasion instantanée, l'évasion grâce à Slash et le paiement d'une rançon.</p>

            <h2 id="instantanee">Évasion instantanée</h2>
            <ul>
                <li>Une tentative toutes les <strong>4 heures</strong>. La première s'ouvre 4 heures après la capture.</li>
                <li><strong>40&nbsp;%</strong> de réussite à la première tentative, puis <strong>+5&nbsp;%</strong> par tranche de 4 heures de captivité, que vous ayez tenté votre chance ou non.</li>
                <li>La chance monte jusqu'à <strong>100&nbsp;%</strong> : 65&nbsp;% après 24 heures de captivité, 95&nbsp;% après 48 heures, et réussite garantie à partir de <strong>52 heures</strong>. Le niveau du héros n'a pas d'influence.</li>
                <li>La chance de la prochaine tentative est affichée sur le bouton.</li>
                <li>Échec : votre héros reste en prison et <strong>le geôlier est alerté</strong>.</li>
            </ul>

            <h2 id="slash">S'évader grâce à Slash</h2>
            <p><strong>Slash</strong> est notre autre jeu (slash-game.com). Jouez-y avec la <strong>même adresse e-mail</strong> que votre compte Area Universe, confirmée des deux côtés.</p>
            <ul>
                <li>Atteignez <strong>75&nbsp;% du meilleur score de la semaine</strong> sur une partie jouée <strong>après votre capture</strong>.</li>
                <li>Tant que la semaine en cours (depuis lundi 00:00 UTC) compte moins de 10 joueurs classés ou que son meilleur score est sous 50 points, c'est le meilleur score de la semaine précédente qui sert de référence.</li>
                <li>Revenez sur la page prison et cliquez sur <strong>Vérifier mon score</strong> : votre héros est libéré.</li>
                <li>Tentatives <strong>illimitées</strong>, sans délai, et le geôlier n'est pas alerté.</li>
                <li>Un compte invité ou une adresse non confirmée ne peut pas utiliser cette sortie.</li>
            </ul>

            <h2 id="rancon">Payer la rançon</h2>
            <p>Si le geôlier demande une rançon (niobium, eau et/ou uranium), vous en êtes averti par un rapport et elle apparaît sur la page prison avec son montant et sa date limite (24 heures). Vous pouvez la <strong>payer</strong> ou la <strong>refuser</strong>.</p>
            <p>Refuser ne libère pas votre héros : le geôlier en est simplement informé et peut vous proposer une nouvelle rançon. Le paiement est prélevé sur l'ensemble de vos planètes et versé sur la planète-prison. Si vous n'avez pas assez de ressources, le paiement est refusé et rien n'est prélevé.</p>

            <h2 id="sans-rancon">Et sans rançon ?</h2>
            <p>Le geôlier n'est jamais obligé de demander une rançon, et votre captivité n'a pas de durée fixe. Sans rançon, votre héros sort de prison si :</p>
            <ul>
                <li>vous réussissez une <strong>évasion instantanée</strong> : la chance augmente de 5&nbsp;% toutes les 4 heures et atteint 100&nbsp;% au bout de <strong>52 heures</strong> de captivité ;</li>
                <li>vous atteignez le score demandé sur <strong>Slash</strong> ;</li>
                <li>votre alliance <strong>envahit</strong> la planète-prison (libération assurée), ou un autre joueur l'envahit (60&nbsp;% de chance d'évasion) ;</li>
                <li>le geôlier vous <strong>libère</strong>, ou abandonne la planète-prison.</li>
            </ul>
            <p>Tant que vous êtes captif, le geôlier peut aussi torturer votre héros (50 XP perdus à chaque fois) ou l'exécuter. Mieux vaut donc tenter l'évasion dès que possible.</p>

            <h2 id="apres">Après la libération</h2>
            <p>Votre héros revient sur votre plus ancienne planète sans héros, avec ses items restants, et bénéficie de <strong>24 heures d'immunité</strong> contre une nouvelle capture.</p>

    arena:
        title: "Arène PvP"
        category: "progression"
        order: 8
        tags: "arene,duel,tournoi,pvp,heros,defi,classement"
        summary: "Défiez d'autres héros en duel 1 contre 1. Mettez de l'uranium ou des items en jeu, gagnez du prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Système de défis</h2>
            <p>Depuis la page <strong>Héros</strong>, onglet <strong>Arène</strong> (formulaire « Lancer un défi »), ou depuis le bouton « Défier en duel » du profil d'un joueur, lancez un défi à un autre joueur. Vous ne pouvez pas défier un membre de votre alliance. Le défié reçoit un rapport et peut <strong>accepter</strong> ou <strong>refuser</strong> le défi.</p>
            <ul>
                <li>Un défi expire automatiquement après <strong>7 jours</strong> sans réponse. Le nombre de défis reçus en attente s'affiche sur l'onglet Arène et sur l'entrée « Héros » du menu. Le temps restant avant l'expiration s'affiche à côté de chaque défi reçu. Une fois expiré, vous pouvez de nouveau défier le même joueur.</li>
                <li>Vous pouvez <strong>annuler</strong> un défi que vous avez envoyé tant qu'il est en attente.</li>
                <li>Délai de récupération : chaque héros doit attendre <strong>1 heure</strong> après son dernier duel, quel que soit l'adversaire. Ce délai est vérifié à l'envoi du défi <strong>et</strong> à son acceptation, pour les deux héros : empiler des défis en attente ne permet donc pas d'enchaîner plusieurs duels.</li>
                <li>Un héros capturé ne peut ni défier ni être défié. La capture et l'appartenance à la même alliance sont revérifiées à l'acceptation.</li>
                <li>Le héros n'est jamais en danger (pas de capture en arène).</li>
            </ul>

            <h2 id="combat">Résolution du combat</h2>
            <p>Quand le défié accepte, le combat est résolu <strong>immédiatement</strong> et le résultat s'affiche à l'écran du joueur qui a accepté : victoire ou défaite, les deux scores, les récompenses et la mise gagnée ou perdue. Les deux joueurs reçoivent aussi un rapport. Le score est basé sur :</p>
            <ul>
                <li><strong>Niveau</strong> du héros : le socle du score</li>
                <li><strong>Offense</strong> : attaque du héros, +5&nbsp;% s'il est militaire, et les bonus offensifs de ses items</li>
                <li><strong>Défense</strong> : défense du héros et les bonus défensifs de ses items</li>
                <li><strong>Ruse</strong> (poids 60&nbsp;%) : Intelligence — doublée pour un économiste, +20&nbsp;% avec le trait Magnat — et les bonus utilitaires des items</li>
                <li><strong>Élan</strong> (poids 60&nbsp;%) : Vitesse — doublée pour un explorateur, +15&nbsp;% avec le trait Navigateur — et la vitesse de flotte des items</li>
                <li><strong>Traits militaires</strong> : Tacticien +10&nbsp;%, Seigneur de guerre +5&nbsp;%, et Intimidation retire 5&nbsp;% au score de l'adversaire</li>
                <li><strong>Spécialité</strong> : avantage pierre-feuille-ciseaux (Militaire &gt; Explorateur &gt; Économie &gt; Militaire, +10&nbsp;%)</li>
                <li><strong>Facteur aléatoire</strong> de ±15&nbsp;% de chaque côté</li>
            </ul>
            <p>En pratique : score = niveau × 10 × (1 + Offense + Défense + 0,6 × Ruse + 0,6 × Élan + traits), où chaque bonus compte pour sa valeur (10&nbsp;% = 0,10). Le résultat est ensuite multiplié par 1,10 en cas d'avantage de spécialité et par 0,95 si l'adversaire a Intimidation, puis le hasard s'applique. Exemple : un Militaire niveau 10 avec 10&nbsp;% d'Attaque, 8&nbsp;% de Défense, sans item, et le trait Tacticien obtient 10 × 10 × (1 + 0,15 + 0,08 + 0,10) = 133. Le niveau pèse donc plus lourd que tout le reste.</p>
            <p>En duel, tous les bonus d'items comptent, avec un poids selon leur type (ils ne sont pas doublés par la spécialité) :</p>
            <ul>
                <li><strong>Offense</strong> : Puissance duel (×1,5) ; Force Légionnaires et Attaque flotte (×1) ; Force Mechas, Précision flotte et Dégâts Cthulhu (×0,5).</li>
                <li><strong>Défense</strong> : Défense flotte et Bouclier flotte (×1).</li>
                <li><strong>Ruse</strong> : Production (×1) ; Production workers, Production vaisseaux, Vitesse construction, Vitesse recyclage et Portée radar (×0,5) ; Gain d'XP (×0,25).</li>
                <li><strong>Élan</strong> : Vitesse flotte (×1).</li>
            </ul>

            <h2 id="mises">Mises</h2>
            <p>En lançant un défi, vous pouvez ajouter une mise optionnelle :</p>
            <ul>
                <li><strong>Uranium</strong> : chaque joueur mise la même quantité. Le vainqueur remporte les deux mises.</li>
                <li><strong>Item</strong> : chaque joueur mise un item de même rareté. Le vainqueur remporte les deux items. L'item doit être <strong>déséquipé</strong> (des deux côtés) et ne peut pas être engagé dans deux défis en attente à la fois.</li>
                <li><strong>Amical</strong> : sans mise, seules les récompenses de base sont attribuées.</li>
            </ul>
            <p>La mise est couverte si au moins une de vos planètes possède l'uranium requis : il est prélevé sur votre planète la plus riche en uranium. Si un joueur n'a plus assez d'uranium sur aucune planète au moment de l'acceptation, le défi échoue. Si l'item misé par le challenger n'est plus disponible quand le défié accepte (il ne lui appartient plus ou il est équipé), le duel est refusé.</p>

            <h2 id="recompenses">Récompenses de base</h2>
            <p>Le vainqueur reçoit à chaque duel :</p>
            <ul>
                <li>Uranium : entre 5 et 15, multiplié par le niveau moyen des deux héros ÷ 10, plafonné à <strong>20</strong> par duel (5 à 15 entre deux niveaux 10). Il est versé sur votre plus petite planète, comme l'uranium des mises remportées.</li>
                <li>Points de guerre : 15 × le niveau du vainqueur, multipliés par le rapport entre le plus petit et le plus grand des deux niveaux (jamais moins de la moitié). Deux héros niveau 15 : 225 PDG ; un niveau 15 qui bat un niveau 10 : 150 PDG.</li>
                <li>XP : de 30 à 90 selon le serrage du duel (voir l'article <em>Votre héros</em>).</li>
                <li>Chance d'item : environ 15&nbsp;% au total (10&nbsp;% commun, 4&nbsp;% rare, 1&nbsp;% épique)</li>
            </ul>
            <p>Le perdant ne perd rien (sauf sa mise éventuelle), mais ne gagne ni XP ni récompense.</p>

            <h2 id="classement">Classement</h2>
            <p>Un classement par serveur affiche les meilleurs duellistes :</p>
            <ul>
                <li>Classé par pourcentage de victoires en duel (les combats de tournoi ne comptent pas), puis par nombre de victoires</li>
                <li>Minimum <strong>5 combats</strong> pour apparaître</li>
                <li>Les <strong>5 premiers</strong> sont visibles directement sur la page ; un bouton permet d'ouvrir le classement complet avec pagination et tri</li>
                <li>Récompenses hebdomadaires versées automatiquement chaque <strong>lundi</strong> pour la semaine précédente (du lundi 0h au dimanche 24h, heure de Paris), une seule fois : top 3 selon le <strong>nombre de victoires en duel</strong> de la semaine, avec un minimum de <strong>5 duels</strong> dans la semaine. Seuls les joueurs sont concernés (ni les commandants IA, ni les comptes supprimés). 1er = 3000 uranium + 300 PDG, 2ème = 2000 + 200 PDG, 3ème = 1000 + 100 PDG. Chaque joueur récompensé reçoit un rapport.</li>
            </ul>

            <h2 id="tournois">Tournois</h2>
            <p>Événement serveur périodique : un tournoi tous les <strong>7 jours</strong> par serveur.</p>
            <ul>
                <li>Inscription ouverte pendant <strong>24h</strong> depuis l'onglet Arène de la page Héros. Un héros capturé ne peut pas s'inscrire, et il est exclu s'il est capturé avant la clôture des inscriptions.</li>
                <li>À la clôture des inscriptions, tout le tableau est joué d'un coup : élimination directe après tirage au sort (quand le nombre de qualifiés est impair, l'un d'eux passe le tour d'office, à n'importe quel tour), puis un match pour la 3e place entre les deux perdants des demi-finales.</li>
                <li>Il faut au moins <strong>2 participants</strong> : sinon le tournoi est annulé (aucune récompense) et les inscrits sont prévenus par rapport. Avec un seul joueur inscrit, le tournoi a lieu si un commandant IA peut compléter le tableau.</li>
                <li>Dès qu'au moins un joueur est inscrit, les <strong>commandants IA</strong> du serveur (héros principal non capturé) complètent le tableau jusqu'à <strong>8 participants</strong> au total. Ils s'inscrivent progressivement pendant les 24h d'inscription, et le tableau est complété à la clôture s'il en manque encore.</li>
                <li>Si <strong>8 joueurs ou plus</strong> sont inscrits, aucun commandant IA ne participe. Sans joueur inscrit, le tournoi n'a pas lieu : les commandants IA ne jouent jamais entre eux.</li>
                <li>Chaque combat du tournoi rapporte aussi à son vainqueur les récompenses habituelles d'un duel.</li>
                <li>Les commandants IA concourent pour le podium et reçoivent les mêmes récompenses que les joueurs, sauf la chance d'obtenir un héros secondaire.</li>
                <li>Le champion conserve 25&nbsp;% de chance d'obtenir un héros secondaire (réservée aux joueurs).</li>
            </ul>
            <p>Récompenses :</p>
            <ul>
                <li>1er = 5000 uranium + 500 PDG + 1 item épique (20&nbsp;% de chance d'un item légendaire en plus)</li>
                <li>2ème = 3000 uranium + 300 PDG + 1 item rare (10&nbsp;% de chance d'un item épique en plus)</li>
                <li>3ème = 1500 uranium + 150 PDG + 1 item rare</li>
                <li>Autres participants = 500 uranium + 50 PDG (10&nbsp;% de chance d'un item commun)</li>
            </ul>
            <p>Chaque participant reçoit un rapport avec son classement et ses récompenses. La page Arène affiche le compte à rebours de fin d'inscription, le podium du dernier tournoi et la date du prochain.</p>

    login_bonus:
        title: "Bonus de connexion"
        category: "progression"
        order: 9
        tags: "bonus,connexion,quotidien,bitcoin,serie,streak"
        summary: "Des Bitcoins gratuits chaque jour, multipliés si vous enchaînez plusieurs jours consécutifs."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Chaque <strong>jour calendaire</strong> (le jour change à minuit, heure de Paris), le jeu vous offre un bonus de Bitcoins, sur chacun des serveurs où vous jouez. Une fenêtre s'ouvre à votre arrivée en jeu : cliquez sur <strong>« Réclamer »</strong> pour le recevoir. Le jeu peut aussi vous prévenir par une notification quand le bonus du jour est disponible.</p>
            <p>Le montant correspond au <strong>plus avantageux</strong> des deux calculs ci-dessous, puis il est multiplié par votre série :</p>
            <ul>
                <li>Un <strong>plancher lié à votre niveau</strong> : <strong>niveau × 5&nbsp;000 Bitcoins</strong>, multiplié chaque jour par un tirage au hasard de ×1, ×2, ×3, ×4 ou ×5. Il garantit un bonus motivant en début de partie.</li>
                <li><strong>5&nbsp;% de la moyenne des Bitcoins du serveur</strong> — ainsi le bonus reste intéressant à mesure que l'économie du serveur grandit.</li>
                <li>Le résultat est ensuite multiplié par votre <strong>multiplicateur de série</strong> (voir ci-dessous).</li>
            </ul>
            <p>Cette moyenne ne compte que les joueurs (ni bots ni comptes de test) ; à partir de 20 joueurs, elle écarte les 5&nbsp;% les plus riches et les 5&nbsp;% les plus pauvres. Elle est recalculée une fois par jour.</p>
            <p>Plancher selon le niveau (avant le multiplicateur de série ; tout commandant démarre au niveau 2) :</p>
            <table>
                <tr><th>Niveau</th><th>Plancher possible</th><th>Au jour 7 (×5)</th></tr>
                <tr><td>2</td><td>10&nbsp;000 à 50&nbsp;000</td><td>50&nbsp;000 à 250&nbsp;000</td></tr>
                <tr><td>5</td><td>25&nbsp;000 à 125&nbsp;000</td><td>125&nbsp;000 à 625&nbsp;000</td></tr>
                <tr><td>10</td><td>50&nbsp;000 à 250&nbsp;000</td><td>250&nbsp;000 à 1&nbsp;250&nbsp;000</td></tr>
                <tr><td>15</td><td>75&nbsp;000 à 375&nbsp;000</td><td>375&nbsp;000 à 1&nbsp;875&nbsp;000</td></tr>
                <tr><td>20</td><td>100&nbsp;000 à 500&nbsp;000</td><td>500&nbsp;000 à 2&nbsp;500&nbsp;000</td></tr>
                <tr><td>30</td><td>150&nbsp;000 à 750&nbsp;000</td><td>750&nbsp;000 à 3&nbsp;750&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000 à 1&nbsp;000&nbsp;000</td><td>1&nbsp;000&nbsp;000 à 5&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>Pour un autre niveau, multipliez-le par 5&nbsp;000 (tirage ×1) et par 25&nbsp;000 (tirage ×5).</p>
            <p>Exemple : au niveau 10, le tirage du jour donne ×2, soit un plancher de 100&nbsp;000 Bitcoins. Si la moyenne du serveur est de 3&nbsp;000&nbsp;000 Bitcoins, 5&nbsp;% font 150&nbsp;000 : c'est ce montant qui est retenu. Au 3<sup>e</sup> jour de série (×1,5), vous recevez 225&nbsp;000 Bitcoins.</p>

            <h2 id="streak">La série de 7 jours consécutifs</h2>
            <p>Réclamer votre bonus <strong>chaque jour</strong> fait grimper votre multiplicateur :</p>
            <table>
                <tr><th>Jour consécutif</th><th>Multiplicateur</th></tr>
                <tr><td>Jour 1</td><td>×1.0</td></tr>
                <tr><td>Jour 2</td><td>×1.2</td></tr>
                <tr><td>Jour 3</td><td>×1.5</td></tr>
                <tr><td>Jour 4</td><td>×1.8</td></tr>
                <tr><td>Jour 5</td><td>×2.0</td></tr>
                <tr><td>Jour 6</td><td>×2.5</td></tr>
                <tr><td>Jour 7</td><td>×5.0</td></tr>
            </table>
            <p>Au 8<sup>e</sup> jour, le cycle repart au jour 1. Il faut réclamer le bonus <strong>chaque jour du calendrier</strong> (de minuit à minuit, heure de Paris) : si un jour passe sans réclamation, la série repart au jour 1. Le nombre d'heures entre deux connexions ne compte pas, seul le jour compte. Réclamer lundi à 0h05 puis mardi à 23h55 garde la série ; réclamer lundi à 23h59 puis mercredi à 0h01 la casse.</p>

            <h2 id="items">Les items bonus</h2>
            <p>Certains jours de la série offrent en plus un <strong>item pour votre héros</strong>, aléatoire :</p>
            <ul>
                <li><strong>Jour 3</strong> : un item commun.</li>
                <li><strong>Jour 7</strong> : un item rare.</li>
            </ul>

            <h2 id="reclamation">Comment le réclamer</h2>
            <p>La fenêtre « Bonus de connexion » s'ouvre automatiquement à votre arrivée en jeu : un clic sur <strong>« Réclamer »</strong> crédite les Bitcoins (et l'item du jour 3 ou 7). Elle affiche aussi votre record personnel de jours d'affilée, qui ne peut pas dépasser 7 puisque la série repart au jour 1 après le jour 7.</p>

            <h2 id="conseil">Un petit conseil</h2>
            <p>Même 30 secondes suffisent : ouvrez le jeu et cliquez sur « Réclamer ». Ne ratez pas le jour 7, c'est là que ça rapporte le plus.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,elimination,faillite,fin"
        summary: "Les 2 façons de perdre la partie, et ce qu'il vous reste après."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">Les 2 types de Game Over</h2>
            <p>Il y a deux façons de tout perdre sur un serveur : la faillite, qui vous laisse vos planètes mais pas vos vaisseaux, et la perte de toutes vos planètes, qui remet votre commandant à zéro. Les connaître, c'est déjà s'en protéger.</p>

            <h2 id="faillite">1. La faillite économique</h2>
            <p>Si, après le <strong>rapport journalier de 18h59 (heure de Paris)</strong>, votre solde de Bitcoins est <strong>négatif</strong> : <strong>Game Over économique</strong>.</p>
            <ul>
                <li>Toutes vos <strong>flottes</strong> sont supprimées, en vol comme en orbite, avec leur cargaison et leurs troupes.</li>
                <li>Tous les <strong>vaisseaux au sol</strong> de vos planètes sont perdus.</li>
                <li>Votre solde est <strong>remis à 125&nbsp;000 Bitcoins</strong>.</li>
            </ul>
            <p>Vous conservez vos planètes, bâtiments, défenses, recherches, troupes au sol et votre classement : vous continuez à jouer, mais sans aucun vaisseau.</p>
            <p><strong>Vous êtes prévenu avant :</strong> dès que votre solde passe sous le déficit quotidien projeté (coût d'entretien moins revenus du dernier rapport), un rapport d'alerte « Faillite imminente » vous avertit — au maximum un par jour. Si vous le recevez, agissez avant le prochain rapport journalier.</p>

            <h2 id="planetes">2. La perte de toutes vos planètes</h2>
            <p>Si vous perdez votre <strong>dernière planète</strong> — envahie par un joueur ou par les Cthulhu, ou, en Battle Royale, quand votre secteur disparaît —, votre commandant est éliminé. Vous ne pouvez pas abandonner volontairement votre dernière planète.</p>
            <ul>
                <li>Si c'est un joueur qui envahit votre dernière planète, il <strong>empoche tous vos Bitcoins et tous vos Points de Guerre</strong>.</li>
                <li>Vos <strong>flottes</strong> sont supprimées (si ce sont les Cthulhu qui prennent votre dernière planète, elles passent sous leur contrôle).</li>
                <li>Votre commandant est <strong>remis à zéro</strong> : 125&nbsp;000 Bitcoins, recherches et recherches politiques remises à zéro, terraformation divisée par 2, classement réinitialisé, héros et rapports supprimés.</li>
                <li>Vous quittez votre alliance (elle est dissoute si vous en étiez le seul membre, ou le Dirigeant d'une alliance du Marteau des Étoiles).</li>
                <li>Votre carrière sur ce serveur est <strong>enregistrée</strong> dans votre profil de compte.</li>
            </ul>

            <h2 id="eviter">Comment éviter le Game Over</h2>
            <ul>
                <li>Surveillez chaque jour votre <strong>bilan</strong> (revenus − coûts). Si ça tourne au rouge, réagissez.</li>
                <li>Mettez au sol les flottes qui ne servent pas : leur entretien est divisé par 6.</li>
                <li>Ne sur-recrutez pas : une armée en entretien permanent peut ruiner un économiste peu vigilant.</li>
                <li>Gardez toujours <strong>au moins 2 planètes</strong> en état de défendre.</li>
                <li>Surveillez les <strong>flottes ennemies en approche</strong> (notifications, radar).</li>
                <li>En cas de gros danger, <strong>évacuez</strong> vos troupes et ressources vers une planète sûre.</li>
            </ul>

            <h2 id="apres">Que reste-t-il après ?</h2>
            <p>Même éliminé, vous gardez votre <strong>compte joueur</strong> et vos <strong>statistiques</strong> des parties précédentes. Vous pouvez rejoindre un autre serveur, ou vous réinscrire sur le même depuis la page de sélection des serveurs (menu « Serveur ») tant que ses inscriptions sont ouvertes : vous repartez alors d'une nouvelle planète de départ.</p>

    game_modes:
        title: "Les modes de serveur"
        category: "events"
        order: 1
        tags: "mode,battle royale,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe propose 7 modes de serveur différents, avec des règles et des objectifs propres."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Vue d'ensemble</h2>
            <p>Chaque serveur d'Area Universe a un <strong>mode</strong>, choisi par l'admin à sa création. Le mode fixe la durée, la condition de victoire et la présence des Cthulhu.</p>
            <table>
                <thead>
                    <tr><th>Mode</th><th>Durée</th><th>Condition de victoire</th><th>Cthulhu ?</th><th>Alliances ?</th><th>Recherches</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu</td><td>300 jours</td><td>Aucune</td><td>Oui</td><td>Oui</td><td>Normales</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>30 jours au plus</td><td>Le VIP qui survit 72&nbsp;h</td><td>Non</td><td>Oui (sauf pour le VIP)</td><td>Max dès le départ</td></tr>
                    <tr><td>Domination</td><td>60 jours</td><td>Meilleur score individuel à la fin</td><td>Non</td><td>Oui</td><td>Max dès le départ</td></tr>
                    <tr><td>Battle Royale</td><td>40 jours au plus</td><td>Dernier survivant</td><td>Non</td><td>Non</td><td>Max dès le départ</td></tr>
                    <tr><td>Paid Server</td><td>60 jours</td><td>Meilleur score pondéré (points + 2 × PDG)</td><td>Non</td><td>Oui</td><td>Normales</td></tr>
                    <tr><td>Long Run</td><td>900 jours</td><td>Aucune (marathon)</td><td>Pendant les événements « Attaque Cthulhu »</td><td>Oui</td><td>Normales</td></tr>
                    <tr><td>Short Run</td><td>150 jours</td><td>Aucune (sprint)</td><td>Pendant les événements « Attaque Cthulhu »</td><td>Oui</td><td>Normales</td></tr>
                </tbody>
            </table>
            <p>Une partie qui désigne un vainqueur (Search &amp; Destroy, Battle Royale) s'arrête dès que ce vainqueur est connu, et le serveur ferme : la durée indiquée est alors un maximum.</p>
            <p>Dans la liste des serveurs, certains modes portent un autre nom : <strong>Search &amp; Destroy</strong> s'affiche « Recherche &amp; Destruction » (et « Chasse &amp; Destruction » dans le menu du jeu), <strong>Long Run</strong> « Long terme », <strong>Short Run</strong> « Court terme » et <strong>Paid Server</strong> « Serveur payant ».</p>

            <h2 id="cthulhu">Mode Cthulhu (PvE classique)</h2>
            <p>Le mode de base, parfait pour découvrir le jeu. Pendant les <strong>72 premières heures</strong> du serveur, aucune attaque Cthulhu : c'est la <strong>phase de préparation</strong>. Pendant cette phase, le serveur porte le badge « Verrouillé » dans la liste des serveurs et refuse les nouveaux commandants (message « Ce serveur est verrouillé (préparation ou inscriptions fermées). »).</p>
            <p>Ensuite, les hordes Cthulhu vous attaquent régulièrement. La première est lancée <strong>5 jours après votre inscription</strong>, puis une nouvelle horde part toutes les <strong>18 à 30 heures</strong> en Facile, <strong>12 à 24 heures</strong> en Normal et <strong>8 à 16 heures</strong> en Difficile. Vous pouvez aussi désactiver complètement le PvE dans vos <strong>Préférences</strong> (voir l'article <em>La menace Cthulhu</em>).</p>
            <p>Pas de condition de victoire ni de vainqueur : à la fin des 300 jours, le serveur ferme et votre résultat (classement, points…) reste sur votre profil de carrière. Le succès <strong>Élite</strong> récompense une place dans le top 10 d'un serveur.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (chasse au VIP)</h2>
            <p>Les <strong>48 premières heures</strong> du serveur servent de mise en place : aucun VIP n'est encore désigné. Comme en mode Cthulhu, le serveur porte alors le badge « Verrouillé » et refuse les nouveaux commandants.</p>
            <p>Ensuite, un <strong>VIP</strong> est tiré au sort parmi les joueurs encore en jeu, et le salon public annonce « Nouveau VIP désigné : … ». Son objectif : <strong>survivre 72 heures</strong>. S'il y parvient, il gagne et la partie s'arrête aussitôt.</p>
            <ul>
                <li>S'il est éliminé (game over) par un joueur, <strong>le tueur devient le nouveau VIP</strong> (« Le VIP a été éliminé par … ») et le compte à rebours de 72 heures repart de zéro.</li>
                <li>S'il est éliminé autrement (par un commandant IA, par exemple), un nouveau VIP est tiré au sort.</li>
            </ul>
            <p>Le VIP est <strong>seul contre tous</strong> : il est automatiquement sorti de son alliance au moment de sa nomination. S'il en était le chef, le membre le plus gradé prend sa place ; s'il en était le seul membre, l'alliance est dissoute. Tant qu'il porte le statut, il ne peut ni créer ni rejoindre d'alliance, et il en reste interdit pendant <strong>3 jours</strong> après l'avoir perdu.</p>
            <p>La <strong>protection des débutants</strong> s'applique aussi au VIP : tant qu'elle dure (moins de 7 jours depuis son inscription, moins de 4 planètes, aucune mission offensive lancée), aucun joueur ne peut envoyer de flotte sur ses planètes.</p>

            <h2 id="domination">Domination (planètes stratégiques)</h2>
            <p>Au démarrage, <strong>5 planètes stratégiques</strong> sont tirées au sort parmi toutes les planètes du serveur, planètes de joueurs comme planètes inhabitées.</p>
            <ul>
                <li>Une fois par jour, au changement de date (minuit, heure de Paris), chaque planète stratégique rapporte <strong>+5 points</strong> au joueur qui la possède à cet instant. En tenir deux rapporte donc +10 par jour.</li>
                <li>Les commandants IA ne marquent pas de points.</li>
                <li>Tous les <strong>5 jours</strong>, un nouveau tirage remplace les planètes stratégiques. Le salon public annonce « Les planètes stratégiques viennent de changer. » au moment où il a lieu, sans préavis.</li>
            </ul>
            <p>À la fin du serveur (60 jours), le joueur qui a le plus de points gagne. Le classement est <strong>individuel</strong> : il n'y a ni score ni victoire d'alliance en Domination.</p>

            <h2 id="battle-royale">Battle Royale (dernier survivant)</h2>
            <p>Mode solo : <strong>pas d'alliance autorisée</strong>. Une seule galaxie. Les inscriptions ferment <strong>7 jours</strong> après l'ouverture : le serveur porte alors le badge « Verrouillé », et seuls les joueurs déjà inscrits peuvent y revenir.</p>
            <p>La carte est une grille spatiale de 10 × 10, soit 100 systèmes, qui <strong>rétrécit par anneaux concentriques</strong> : à chaque tour, <strong>tout l'anneau extérieur disparaît d'un seul coup</strong> (pas système par système). Les systèmes détruits restent affichés comme des <strong>trous</strong> : la carte ne se réorganise pas, ce qui rend la zone sûre lisible d'un coup d'œil.</p>
            <p><strong>5 tours, un par semaine :</strong></p>
            <table>
                <thead>
                    <tr><th>Jour</th><th>Systèmes détruits</th><th>Systèmes restants</th></tr>
                </thead>
                <tbody>
                    <tr><td>J+7</td><td>36 (le bord de la grille)</td><td>64</td></tr>
                    <tr><td>J+14</td><td>28</td><td>36</td></tr>
                    <tr><td>J+21</td><td>20</td><td>16</td></tr>
                    <tr><td>J+28</td><td>12</td><td>4</td></tr>
                    <tr><td>J+35</td><td>3 des 4 derniers</td><td><strong>1 seul</strong>, tiré au sort</td></tr>
                </tbody>
            </table>
            <p>Les 5 derniers jours se jouent dans ce dernier système.</p>
            <ul>
                <li><strong>12&nbsp;h avant</strong> sa destruction, un anneau passe en <strong>orange</strong> (avertissement).</li>
                <li><strong>1&nbsp;h avant</strong>, il passe en <strong>rouge clignotant</strong> : plus aucune flotte ne peut partir vers ses systèmes ni en partir.</li>
                <li>Un système détruit supprime définitivement ses planètes et ses flottes. Si votre <strong>héros principal</strong> s'y trouvait (sur une planète ou dans une flotte), vous êtes éliminé ; un héros secondaire retourne simplement en réserve. Vous êtes aussi éliminé si vous n'avez plus aucune planète.</li>
                <li>Une flotte en route vers un système disparu (ou partie d'un système disparu) est détruite à l'arrivée ; si votre héros principal est à bord, vous êtes éliminé.</li>
            </ul>
            <p><strong>Victoire</strong> : être le dernier joueur encore en jeu. La partie s'arrête dès qu'il ne reste qu'un survivant. Si plusieurs joueurs sont encore en jeu au 40<sup>e</sup> jour, le serveur se termine sans vainqueur.</p>

            <h2 id="paid-server">Paid Server (compétitif payant)</h2>
            <p>Serveur payant : l'inscription coûte <strong>5&nbsp;€</strong>, payés une seule fois via Stripe pour ce serveur précis (un autre serveur payant se paie à part). Il faut un compte complet, pas un compte invité. Dans la liste des serveurs, il porte le badge « 💳 Payant 5 € ». 100&nbsp;% PvP, aucun Cthulhu. Durée 60 jours.</p>
            <p><strong>Victoire</strong> : à la fin, le joueur encore en jeu qui a le meilleur <strong>score pondéré</strong> gagne.</p>
            <ul>
                <li>Score pondéré = points du classement + 2 × points de guerre (PDG).</li>
                <li>Exemple : 300&nbsp;000 points et 50&nbsp;000 PDG donnent un score de 400&nbsp;000.</li>
            </ul>
            <p>Le combat compte donc double : c'est un mode pour joueurs compétitifs.</p>
            <p>Comme dans tous les modes qui désignent un vainqueur, le gagnant reçoit le badge <strong>Vainqueur</strong> sur son profil de carrière, conservé d'un serveur à l'autre, et le succès <strong>Empereur</strong>.</p>

            <h2 id="long-short-run">Long Run / Short Run (avec événements)</h2>
            <p>Deux modes PvE aux règles identiques : seule la durée change. Le <strong>Long Run</strong> dure 900 jours, le <strong>Short Run</strong> 150 jours.</p>
            <p>Les Cthulhu n'y attaquent pas en permanence : leurs hordes ne partent que pendant les événements <strong>Attaque Cthulhu</strong>. Ces événements durent 72 heures : le premier commence 7 jours après l'ouverture du serveur, puis ils reviennent tous les 21 jours.</p>
            <p>L'<strong>Arène d'alliance</strong> y revient tous les 3 jours, et les prophéties de Cthulhu s'y déclenchent aussi. Le calendrier est fixe, calculé depuis l'ouverture du serveur : voir l'article <em>Événements spéciaux</em>.</p>

            <h2 id="recherches-max">Modes avec recherches maximales dès le départ</h2>
            <p>Dans <strong>Search &amp; Destroy, Domination et Battle Royale</strong>, toutes vos recherches démarrent au niveau maximum : le menu Recherche est masqué, pour jouer directement sur la partie militaire.</p>
            <p>Votre planète de départ reçoit alors un <strong>kit de départ</strong> :</p>
            <ul>
                <li><strong>500 uranium</strong> pour personnaliser rapidement.</li>
                <li><strong>Toute votre réserve de points d'amélioration de vaisseaux</strong> dès le jour 1, au lieu du plafond habituel de 40 points par jour.</li>
            </ul>
            <p>En <strong>Search &amp; Destroy</strong>, chaque joueur reçoit en plus, à l'inscription, un kit militaire sur sa planète de départ (tout le monde peut devenir VIP) : 2&nbsp;000 Légionnaires, 25 barges, 500 destroyers et 250 tourelles laser lourdes.</p>

            <h2 id="fin-de-serveur">Fin de serveur et archivage</h2>
            <p>Quand un serveur ferme, vos <strong>statistiques finales</strong> (points, héros, succès de VIP, victoires, etc.) sont archivées sur votre <strong>compte joueur</strong>. Votre commandeur (le personnage de cette partie) est supprimé, mais votre historique reste.</p>

    cthulhus:
        title: "La menace Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,ruche,horde,garnison,siege,menace,pve,uranium,tower defense,td"
        summary: "Les Cthulhu massent de vraies hordes qui voyagent à découvert avant d'attaquer vos planètes. Comment vous en défendre, comment leurs bases se défendent aussi, et le Tower Defense pour repousser l'assaut."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">C'est quoi, les Cthulhu ?</h2>
            <p>Les <strong>Cthulhu</strong> (les Possédés) sont les créatures hostiles contrôlées par le jeu (PvE). Elles tiennent des <strong>bases de la ruche</strong> disséminées dans la galaxie, d'où partent des <strong>hordes</strong> : de vraies flottes, avec une composition, une puissance et un trajet visibles, pas un simple compte à rebours.</p>
            <p>Les Cthulhu n'existent que sur les serveurs <strong>Cthulhu</strong>, <strong>Long Run</strong> et <strong>Short Run</strong>. En Long Run et Short Run, leurs hordes ne partent que pendant les événements <strong>Attaque Cthulhu</strong> (voir <em>Événements spéciaux</em>).</p>
            <p>Deux jauges à ne pas confondre :</p>
            <ul>
                <li>votre <strong>menace personnelle</strong>, qui règle la force des hordes lancées contre vous (cet article) ;</li>
                <li>la <strong>Menace de l'univers</strong>, commune au serveur, qui déclenche les prophéties (voir <em>Les prophéties de Cthulhu</em>).</li>
            </ul>

            <h2 id="menace">Le niveau de menace</h2>
            <p>Votre menace personnelle s'affiche sur la page <strong>Cthulhu</strong>, dans le bloc « Menace Cthulhu » (Planète menacée, Niveau de menace, Temps restant). Plus elle est haute, plus les attaques suivantes sont fortes.</p>
            <p>Chaque fois que vos défenses repoussent un <strong>débarquement</strong> Cthulhu au sol, votre menace augmente. Détruire la horde avant qu'elle ne débarque (au-dessus de sa base, en vol ou en orbite de votre planète) ne la fait pas monter. Le gain dépend de la difficulté et du régime de votre alliance :</p>
            <table>
                <thead>
                    <tr><th>Difficulté</th><th>Sans alliance</th><th>Alliance Le Marteau des Étoiles</th><th>Autre alliance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Facile</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Difficile</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>Le régime <strong>Le Marteau des Étoiles</strong> réduit donc la progression de la menace.</p>
            <p>La menace <strong>remonte aussi toute seule</strong>, tant que votre PvE est actif :</p>
            <ul>
                <li>+5 à chaque rapport journalier (18h59, heure de Paris) ;</li>
                <li>+1 par heure tant qu'une horde reste en orbite de l'une de vos planètes avant de débarquer.</li>
            </ul>
            <p>Cette remontée automatique s'arrête à 300. Pour faire baisser la menace :</p>
            <ul>
                <li>gagner un <strong>Tower Defense</strong> la divise par 2 ;</li>
                <li><strong>libérer une base</strong> de la ruche la divise par 10 (voir plus bas) ;</li>
                <li>une défaite au sol la divise aussi (voir le tableau « Si la horde l'emporte au sol »).</li>
            </ul>
            <p>Un joueur assidu la garde donc basse ; un joueur qui la laisse filer s'expose à des hordes toujours plus grosses.</p>

            <h2 id="puissance">Puissance des invasions</h2>
            <p>Une attaque se joue en deux temps, et la difficulté pèse sur les deux :</p>
            <ul>
                <li><strong>La horde (combat orbital)</strong> : sa flotte est calculée à partir de la <strong>puissance de votre propre flotte</strong>. Plus votre flotte est forte par rapport à votre niveau de menace, plus la horde l'est aussi (de 0,7 à 1,5 fois votre puissance). La difficulté s'applique ensuite : ×0,5 en Facile, ×1 en Normal, ×1,5 en Difficile. Une horde sur cinq est renforcée (+25&nbsp;%). La horde qui suit le passage de votre menace au-dessus de 100, 250 puis 500 est une <strong>horde Boss</strong>, deux fois plus grosse.</li>
                <li><strong>Le débarquement (combat au sol)</strong> : sa force dépend de votre <strong>niveau de menace</strong> et de votre niveau de recherche <strong>Terraformation</strong>, puis de la part de la horde qui a survécu au combat orbital. En Facile, elle est divisée par 2.</li>
            </ul>

            <h2 id="horde">L'attaque : une horde bien réelle</h2>
            <p>La première horde est lancée <strong>5 jours après votre inscription</strong>. Ensuite, une nouvelle horde part toutes les <strong>18 à 30 heures</strong> en Facile, <strong>12 à 24 heures</strong> en Normal et <strong>8 à 16 heures</strong> en Difficile. Le minuteur de l'entrée « Cthulhu » du menu indique le prochain lancement.</p>
            <p>Une attaque commence toujours par un <strong>rassemblement</strong> : la horde se masse en orbite d'une base de la ruche pendant <strong>6 heures</strong> (12 heures pour une horde Boss) avant de s'élancer.</p>
            <p>Une fois en route, elle vole à <strong>vitesse de horde</strong> (lente, largement visible au <strong>radar</strong>) et une <strong>alerte est garantie 1 heure avant son arrivée</strong>, quelle que soit votre couverture radar.</p>
            <p>C'est une <strong>vraie flotte</strong> : vous pouvez la détruire à tout moment, en formation au-dessus de sa base, en plein vol, une fois arrivée en orbite de votre planète, ou en gagnant le <strong>Tower Defense</strong>. La détruire annule l'attaque, quel que soit le moment.</p>
            <p>À l'arrivée, un <strong>combat orbital</strong> se joue (vos flottes et vos tourelles contre la horde). Les survivants débarquent <strong>2 heures plus tard</strong> pour l'assaut au sol. Plusieurs hordes peuvent être en formation ou en vol simultanément.</p>
            <p>Seule exception : l'<strong>infiltration</strong>. À partir d'une <strong>menace de 200</strong>, chaque attaque a 15&nbsp;% de chances d'en être une : elle est <strong>instantanée et invisible</strong> (aucun rassemblement, aucun préavis) et son débarquement est 30&nbsp;% plus puissant.</p>

            <h3>Si vos défenses l'emportent</h3>
            <table>
                <thead>
                    <tr><th></th><th>Facile</th><th>Normal</th><th>Difficile</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pertes de Légionnaires</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Pertes de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Pertes de travailleurs</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Vous gagnez des <strong>PDG</strong>, une chance de <strong>drop d'item</strong> et 1&nbsp;% de chances de recruter un <strong>héros secondaire</strong>. Anéantir entièrement la horde avant son débarquement donne la même chance d'objet et de héros.</p>

            <h3>Si la horde l'emporte au sol</h3>
            <p>Le pillage et la capture sont <strong>proportionnels à ce qu'il reste de la horde</strong> après le combat orbital : une horde à moitié détruite pille moitié moins. Sous <strong>90&nbsp;% de survie</strong>, elle n'a plus assez de troupes pour capturer la planète, même en difficulté Difficile.</p>
            <table>
                <thead>
                    <tr><th></th><th>Facile</th><th>Normal</th><th>Difficile</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pillage de ressources (horde intacte)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planète capturée (si ≥ 90&nbsp;% de survie)</td></tr>
                    <tr><td>Réduction de menace après défaite</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>En <strong>Difficile</strong>, sans assez de survivants pour capturer, le pillage retombe au taux <strong>Normal</strong> (70&nbsp;%), multiplié par le ratio de survie de la horde. Si la planète est capturée et que c'était votre dernière, c'est le Game Over.</p>

            <h2 id="bases">Les bases de la ruche</h2>
            <p>La ruche tient des <strong>bases</strong> disséminées dans la galaxie : les bases d'origine de la ruche (jusqu'à 36 par galaxie, de puissance croissante ; leurs noms vont de « Cthulhu I » pour les avant-postes aux redoutables « Cthulhu V ») et d'anciennes planètes converties par une expansion ou une éruption.</p>
            <p>Chacune est protégée par une <strong>garnison permanente</strong> d'environ 0,8 fois la plus grosse flotte du serveur. Une garnison abîmée ne se répare pas ; une garnison détruite est remplacée par une nouvelle <strong>24 heures</strong> plus tard.</p>
            <p>Stationner en orbite d'une base une ou plusieurs flottes <strong>en mode attaque</strong> (les vôtres et celles d'autres joueurs) dont la signature cumulée atteint au moins <strong>10&nbsp;000</strong> déclenche un <strong>siège</strong> :</p>
            <ul>
                <li>la base assiégée n'envoie plus de hordes : elles partent d'une base plus lointaine ;</li>
                <li>des <strong>vagues de défense</strong> montent en puissance (+25&nbsp;% toutes les 2 heures) ;</li>
                <li>après <strong>6 heures</strong>, les autres bases envoient des <strong>flottes de secours</strong> en renfort ;</li>
                <li>la base porte le badge <strong>« Base assiégée »</strong> sur la carte galactique.</li>
            </ul>
            <p>Une fois le siège levé, les secours rentrent chez eux et la base retrouve une garnison normale. Chaque participant est alors payé <strong>au prorata de la signature détruite</strong> : 0,02 bitcoin par point, plus 1 point de guerre par tranche de 5&nbsp;000 bitcoins gagnés.</p>

            <h2 id="liberation">Libérer une base</h2>
            <p>Envahir avec succès une base de la ruche, y compris les bases alien « Cthulhu I » à « V », rapporte des PDG et de l'<strong>uranium</strong>, chargé dans la flotte victorieuse (prévoyez de la place en soute). La victoire a aussi deux effets :</p>
            <ul>
                <li>votre <strong>menace personnelle est divisée par 10</strong> : c'est le moyen le plus radical de la faire baisser ;</li>
                <li>la <strong>Menace de l'univers</strong> recule de <strong>50 points</strong>, ce qui retarde la prochaine prophétie de Cthulhu (voir l'article <em>Les prophéties de Cthulhu</em>).</li>
            </ul>
            <p>Une planète ainsi libérée est <strong>protégée 72 heures</strong> : la ruche ne peut ni la recoloniser ni y faire éruption pendant ce délai.</p>
            <ul>
                <li>Si la planète libérée était à l'origine une planète de joueur (capturée par la ruche, convertie après une invasion perdue, abandonnée, ou née d'une expansion ou d'une éruption), elle reste colonisable, et votre rapport de libération vous donne la date limite pour y envoyer un colonisateur.</li>
                <li>Les avant-postes d'origine de la ruche (« Cthulhu I » à « V »), eux, restent inexploitables une fois libérés : la planète reste libre, mais vous ne pouvez pas y envoyer de colonisateur, et aucune date limite n'est annoncée.</li>
            </ul>
            <p>À l'inverse, perdre une invasion contre une base de la ruche fait monter votre <strong>menace personnelle de 10 points</strong>.</p>

            <h2 id="expansion">Expansion et éruption</h2>
            <p>La ruche s'étend toute seule : quand la <strong>Menace de l'univers</strong> atteint <strong>300 points</strong>, une <strong>nuée de spores</strong> part d'une base existante tous les <strong>3 jours</strong> (tous les jours à partir de <strong>500</strong>) vers une planète inhabitée proche de joueurs, jusqu'à <strong>36 bases par galaxie</strong>. C'est une flotte comme une autre : <strong>interceptable en vol</strong>. Si elle arrive, elle fonde une nouvelle base avec sa garnison, et les joueurs à <strong>5 secteurs ou moins</strong> reçoivent un rapport.</p>
            <p>Éradiquer <strong>toutes</strong> les bases ne l'élimine pas pour de bon : après <strong>48 heures de silence</strong>, une <strong>éruption</strong> fait resurgir une base ailleurs, avec un rapport aux joueurs proches. Cette éruption ne peut jamais tomber à <strong>moins de 8 secteurs</strong> d'une planète de joueur, ni sur une planète encore sous son répit de libération : la ruche renaît dans le vide, pas sur vos terres. Si aucun secteur assez isolé n'est disponible, l'éruption est simplement repoussée au prochain créneau.</p>

            <h2 id="changement-difficulte">Changer de difficulté</h2>
            <p>Vous réglez votre difficulté PvE dans vos <strong>Préférences</strong> (champ « Difficulté PvE ») : <strong>Désactivé</strong>, Facile, Normal ou Difficile.</p>
            <ul>
                <li>En <strong>Désactivé</strong>, les Cthulhu ne vous attaquent plus et le Tower Defense n'est pas disponible.</li>
                <li>Si vous réactivez le PvE, la première attaque arrive 4 jours plus tard.</li>
                <li>Un <strong>délai de 72&nbsp;h</strong> s'applique entre deux changements : pas de va-et-vient pour esquiver les grosses attaques.</li>
            </ul>

            <h2 id="tower-defense">Le Tower Defense (TD)</h2>
            <p>Le <strong>Tower Defense</strong> est un mini-jeu de défense active, sur la page <strong>Cthulhu</strong>. Il est jouable dès qu'une attaque est programmée contre vous ou qu'une horde est déjà en route : vous pouvez le lancer pour l'anéantir avant qu'elle ne fasse des dégâts. C'est interactif : vous placez vos défenses sur une grille et affrontez des vagues de monstres Cthulhu en temps réel.</p>
            <p>Astuce : pour poser plusieurs défenses d'affilée (unités, murs, barbelés), <strong>maintenez et glissez</strong>. Le tracé se verrouille automatiquement en <strong>ligne droite</strong> (horizontale ou verticale) et toutes les cases traversées sont remplies, sans trou même en allant vite.</p>
            <p>La partie se joue dans votre difficulté <strong>PvE</strong> (réglée dans vos Préférences). Le <strong>tutoriel</strong> est un entraînement : il ne rapporte rien et ne coûte rien. Une fois la première vague lancée, quitter la partie compte comme un <strong>abandon</strong> (défaite).</p>
            <p>Une <strong>brume</strong> dérive sur l'arène, plus dense autour des failles et quand un boss approche. Elle passe sous vos défenses et les monstres : elle ne cache rien. Le bouton <strong>Brume</strong> du dock la coupe si votre appareil peine.</p>

            <h3>Résultat possible</h3>
            <ul>
                <li><strong>Victoire</strong> : la horde active est détruite et l'attaque annulée (si aucune horde n'était encore partie, la prochaine est retardée de 8 heures). Votre menace est divisée par 2. Vous gagnez de l'uranium, un tirage d'objet (deux en Difficile) et 2&nbsp;% de chances de recruter un héros secondaire. Délai de 6 heures avant de refaire un TD.</li>
                <li><strong>Défaite</strong> : votre menace baisse en proportion des vagues repoussées (la moitié des vagues = menace divisée par 2) et vous touchez un peu d'uranium. Si la horde est déjà en orbite de votre planète, elle débarque aussitôt ; sinon, la ruche lance immédiatement sa prochaine attaque. Pas de délai d'attente avant de rejouer.</li>
                <li><strong>TD non joué</strong> : la horde suit son cours normal (rassemblement, vol, arrivée, débarquement).</li>
            </ul>
            <p>Uranium gagné en cas de victoire : nombre de vagues × (50 + menace ÷ 2), multiplié par 0,4 en Facile et par 3 en Difficile. En cas de défaite : vagues repoussées × (20 + menace ÷ 5), avec les mêmes multiplicateurs. Exemple, à 100 de menace : victoire en Normal (13 vagues) = 1&nbsp;300 uranium ; en Facile (11 vagues) = 440 ; en Difficile (15 vagues) = 4&nbsp;500.</p>

            <h3>Rapport de fin de partie</h3>
            <p>À la fin de chaque Tower Defense (victoire ou défaite), un <strong>rapport</strong> est archivé dans l'onglet <strong>Cthulhu</strong> de vos rapports : vagues survécues, score, uranium récolté, réduction de menace, pertes par type d'unité et ennemis tués par type. Pratique pour comparer vos parties.</p>

            <h3>Comment on y joue</h3>
            <ul>
                <li>La partie se joue dans votre difficulté PvE (Facile, Normal ou Difficile) : le bouton « Jouer en … » vous la rappelle. Seul le tutoriel permet d'essayer une autre difficulté.</li>
                <li>Placez vos unités sur la grille. Le <strong>QG est au centre</strong> ; les monstres émergent de <strong>1 à 4 failles Cthulhu</strong> ouvertes en bord de plateforme.</li>
                <li>Les monstres traversent la grille pour atteindre votre QG : attaquez-les en chemin.</li>
                <li><strong>Murs</strong> (150 en Facile, 125 en Normal, 75 en Difficile) : les monstres les contournent. Chaque faille garde toujours un chemin vers le QG (un mur qui la scellerait est refusé). Les tours, elles, ne bloquent pas le chemin : un monstre qui bute dessus s'arrête et la détruit.</li>
                <li><strong>Barbelés</strong> (30 / 20 / 10 selon la difficulté, recherche Barbelé requise) : ne bloquent pas, mais blessent et ralentissent les monstres qui les traversent.</li>
                <li><strong>Placement mémorisé</strong> : votre disposition (tours, murs, barbelés) est sauvegardée pour chaque serveur et re-proposée au début de chaque partie.</li>
                <li>Les grosses vagues arrivent <strong>par groupes</strong> (jusqu'à 20 monstres simultanés) : une vague finit d'apparaître en 2 minutes environ.</li>
                <li><strong>Défaite immédiate</strong> : si tous les ennemis d'une vague franchissent vos défenses et atteignent le QG, la partie est perdue sur-le-champ. Impossible de gagner sans poser de défenses efficaces.</li>
                <li>Entre les vagues, les travailleurs réparent automatiquement les tourelles endommagées.</li>
                <li>Vitesse réglable de ×1 à ×10, avec pause possible.</li>
                <li><strong>Enchaîner les vagues</strong> : une option de la barre supérieure lance automatiquement la vague suivante dès la fin de chaque vague, sans repasser par la préparation et en conservant votre vitesse, jusqu'à la victoire ou la défaite. Désactivez-la en cours de vague pour retrouver la pause de préparation à la fin de celle-ci. Indisponible dans le tutoriel.</li>
                <li>Le nombre de vagues dépend de votre menace : menace ÷ 10 (arrondi à l'inférieur) + 3, avec 2 vagues de moins en Facile (2 au minimum) et 2 de plus en Difficile, <strong>20 au maximum</strong>. Exemple : à 100 de menace, 13 vagues en Normal. Les vagues sont de plus en plus intenses.</li>
                <li><strong>Interface</strong> : une barre en haut, sur toute la largeur (points de vie du QG, compteur de vagues, score, bouton « Démarrer », et à droite les icônes son, musique, infos unités, grille et enchaînement des vagues), et un panneau « Unités » à droite qui présente chaque unité (icône, nom, stock, caractéristiques). Pendant la partie, ni menu latéral ni bas de page : toute la largeur de l'écran est dédiée à la carte.</li>
            </ul>

            <h3>Vos unités pour le TD</h3>
            <p>Vos défenses de planète sont converties en unités TD : chaque unité TD représente un paquet d'unités réelles, et chaque type a un maximum plaçable pour forcer la diversité tactique.</p>
            <table>
                <thead>
                    <tr><th>Unité de planète</th><th>Unités réelles pour 1 unité TD</th><th>Maximum sur la grille</th></tr>
                </thead>
                <tbody>
                    <tr><td>Légionnaire</td><td>20</td><td>200</td></tr>
                    <tr><td>Mecha</td><td>10</td><td>20</td></tr>
                    <tr><td>Lanceur de missile</td><td>1&nbsp;750</td><td>150</td></tr>
                    <tr><td>Tourelle laser</td><td>1&nbsp;500</td><td>100</td></tr>
                    <tr><td>Tourelle laser lourd</td><td>1&nbsp;250</td><td>75</td></tr>
                    <tr><td>Canon de Gauss</td><td>1&nbsp;000</td><td>60</td></tr>
                    <tr><td>Artillerie à ion</td><td>750</td><td>50</td></tr>
                    <tr><td>Lanceur plasma</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Exemple : 2&nbsp;000 Légionnaires donnent 100 Légionnaires TD. En plus, le TD vous prête des <strong>défenses gratuites</strong> : 8 de chaque type en Facile, 5 en Normal, aucune en Difficile.</p>

            <h3>Les monstres que vous affrontez</h3>
            <ul>
                <li><strong>Profond</strong> : le monstre de base. Rien d'exceptionnel, mais ils arrivent en nombre.</li>
                <li><strong>Guetteur</strong> : très rapide mais fragile. À intercepter vite.</li>
                <li><strong>Shoggoth</strong> : lent, massif, lourdement blindé. Difficile à descendre.</li>
                <li><strong>Étoile vampirique</strong> : tire des projectiles à distance sur vos défenses.</li>
                <li><strong>Flagelleur mental</strong> : peut <strong>convertir vos Légionnaires en monstres</strong> (effet visuel de conversion), un au plus par seconde, et plus aucun une fois mortellement touché.</li>
                <li><strong>Boss Cthulhu</strong> : énorme, il n'arrive qu'à la dernière vague, en Normal si votre menace atteint 40, en Difficile dès 20, jamais en Facile. Il invoque des Profonds autour de lui.</li>
            </ul>

            <h3>Mécaniques utiles à connaître</h3>
            <ul>
                <li>Les unités et monstres ont des <strong>tailles différentes</strong> sur la grille (Légionnaire 1×1, Mecha 2×1, tourelle 2×2, Boss 2×2).</li>
                <li>La <strong>barre de vague</strong> affiche le nombre d'ennemis restants.</li>
                <li>Si vous rafraîchissez la page, la partie <strong>reprend exactement où vous l'aviez laissée</strong>.</li>
                <li>Une partie sauvegardée doit être <strong>reprise</strong> avant d'en commencer une nouvelle.</li>
            </ul>

            <h3>Récompenses et pertes</h3>
            <ul>
                <li><strong>Victoire</strong> : menace divisée par 2, uranium, objets et horde détruite.</li>
                <li><strong>Défaite</strong> : menace réduite selon les vagues repoussées et un peu d'uranium ; si la horde est déjà en orbite, elle débarque aussitôt.</li>
                <li><strong>Les pertes d'unités sont réelles</strong> au-delà des défenses gratuites : une unité TD détruite retire de votre planète toutes les unités qu'elle représente (1 Légionnaire TD perdu = 20 Légionnaires morts pour de vrai).</li>
            </ul>

            <h3>Classement TD</h3>
            <p>Un classement par serveur garde en mémoire les <strong>meilleurs scores</strong> au Tower Defense. Un autre tableau de chasse à conquérir.</p>

    events:
        title: "Événements spéciaux"
        category: "events"
        order: 3
        tags: "evenement,calendrier,attaque cthulhu,arene,alliance arena,long run,short run"
        summary: "Sur les serveurs Long Run et Short Run, l'Attaque Cthulhu et l'Arène d'alliance reviennent à dates fixes : quand elles tombent, ce qu'elles changent et comment s'y préparer."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principe">Principe</h2>
            <p>Sur les serveurs <strong>Long Run</strong> et <strong>Short Run</strong>, deux événements reviennent à dates fixes : l'<strong>Attaque Cthulhu</strong> et l'<strong>Arène d'alliance</strong>. Leur calendrier est calculé une fois pour toutes à l'ouverture du serveur, sans hasard : en connaissant la date d'ouverture de votre serveur, vous pouvez prévoir chacun d'eux.</p>
            <p>Il n'y a pas d'événement saisonnier (fêtes, saisons de l'année).</p>
            <p>Sur les serveurs <strong>Cthulhu</strong>, <strong>Long Run</strong> et <strong>Short Run</strong>, la ruche déclenche aussi ses <strong>prophéties</strong> et ses blocus. Ceux-là ne suivent pas un calendrier fixe mais une jauge de menace : voir l'article <em>Les prophéties de Cthulhu</em>.</p>

            <h2 id="liste">Les événements du calendrier</h2>
            <table>
                <thead>
                    <tr><th>Événement</th><th>Quand</th><th>Ce qui se passe</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Attaque Cthulhu</strong></td><td>72 heures, la première fois 7 jours après l'ouverture du serveur, puis tous les 21 jours (jours 7, 28, 49, 70…)</td><td>Seule période où les Cthulhu lancent leurs hordes contre vos planètes.</td></tr>
                    <tr><td><strong>Arène d'alliance</strong></td><td>Tous les 3 jours à partir du lendemain de l'ouverture : inscriptions à 08:00, combats à 19:00 (heure de Paris)</td><td>Tournoi entre alliances, sans aucune perte réelle.</td></tr>
                </tbody>
            </table>

            <h3>Attaque Cthulhu</h3>
            <p>Sur un serveur Long Run ou Short Run, les Cthulhu ne lancent aucune horde en dehors de ces fenêtres de 72 heures. Pendant la fenêtre, ils attaquent comme sur un serveur Cthulhu, au rythme de votre difficulté PvE :</p>
            <ul>
                <li>dès l'ouverture de la fenêtre, une horde part contre vous si votre délai d'attaque est écoulé (5 jours après votre inscription pour la toute première) ;</li>
                <li>la horde suivante part <strong>18 à 30 heures</strong> plus tard en Facile, <strong>12 à 24 heures</strong> en Normal, <strong>8 à 16 heures</strong> en Difficile ;</li>
                <li>une horde lancée pendant la fenêtre va jusqu'au bout (6 heures de rassemblement, puis le vol), même si elle arrive après la fin de l'événement.</li>
            </ul>
            <p>En Normal, comptez donc 3 à 6 hordes par fenêtre. Pendant ce temps, le <strong>Tower Defense</strong> de la page <strong>Cthulhu</strong> permet de repousser chaque horde. Si votre PvE est désactivé dans vos Préférences, vous n'êtes pas attaqué. Le fonctionnement des hordes est détaillé dans l'article <em>La menace Cthulhu</em>.</p>

            <h3>Arène d'alliance</h3>
            <p>Une journée d'arène se déroule ainsi (heures de Paris) :</p>
            <ul>
                <li><strong>08:00</strong> : annonce et ouverture des inscriptions.</li>
                <li><strong>18:45</strong> : fermeture des inscriptions.</li>
                <li><strong>19:00</strong> : premier tour, puis tours suivants à 19:15 et 19:30 ; fin des combats vers 19:45.</li>
            </ul>
            <p>Il faut être membre d'une alliance et posséder au moins un vaisseau d'attaque. Vos vaisseaux sont <strong>dupliqués</strong> pour l'arène : vous ne risquez rien de ce que vous possédez.</p>
            <p>Chaque tour atteint remplit la <strong>banque d'alliance</strong> : 50&nbsp;000 Bitcoins et 1&nbsp;000 PDG pour une élimination au premier tour, jusqu'à 1&nbsp;000&nbsp;000 Bitcoins et 25&nbsp;000 PDG pour l'alliance championne. Chaque joueur qui a donné au moins un ordre touche aussi un bonus personnel, de 5&nbsp;000 à 50&nbsp;000 Bitcoins par tour atteint. Tout le détail (inscription, combat, points, récompenses) est dans l'article <em>Arène Alliance</em>.</p>

            <h2 id="ou">Où suivre les prochains événements ?</h2>
            <p>Il n'y a pas de page de calendrier dans le jeu. Pour savoir ce qui arrive :</p>
            <ul>
                <li><strong>Arène d'alliance</strong> : l'onglet <strong>Arène</strong> de votre page Alliance affiche la prochaine arène avec un décompte.</li>
                <li><strong>Attaque Cthulhu</strong> : comptez depuis l'ouverture du serveur (jour 7, puis tous les 21 jours). La liste des serveurs affiche le temps restant avant la fin de chaque serveur : sur un Long Run (900 jours), un serveur à qui il reste 880 jours a ouvert il y a 20 jours, et sa prochaine Attaque Cthulhu commence au jour 28.</li>
                <li><strong>Prophéties</strong> : la jauge « Menace de l'univers » de la page <strong>Cthulhu</strong>.</li>
            </ul>

            <h2 id="strategie">Comment en tirer parti</h2>
            <ul>
                <li><strong>Avant chaque Attaque Cthulhu</strong>, renforcez tourelles, Légionnaires et flotte : c'est la seule période où les hordes frappent.</li>
                <li><strong>Pendant la fenêtre</strong>, jouez le Tower Defense : une victoire détruit la horde en cours et divise votre menace par 2.</li>
                <li><strong>Inscrivez-vous à l'Arène d'alliance</strong> avec au moins un vaisseau d'attaque, et donnez au moins un ordre pendant le match : vous n'y risquez rien et vous y gagnez un bonus personnel.</li>
                <li><strong>Discutez en salon</strong> : un événement est une occasion de coordonner avec votre alliance.</li>
            </ul>

    alliance_arena:
        title: "Arène Alliance"
        category: "events"
        order: 9
        tags: "alliance,arene,bracket,pvp,evenement,tournoi,secteur,planete,flotte,base,historique,spectateur"
        summary: "Événement récurrent tous les 3 jours : votre alliance affronte les autres dans une bataille de secteur (flottes dupliquées, planètes à tenir) pour remplir la banque commune et toucher un bonus personnel."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Quand ça démarre</h2>
            <p>L'événement revient <strong>tous les 3 jours</strong> sur les serveurs concernés. Calendrier d'une journée d'arène (heures de Paris ; l'onglet Arène les affiche dans votre fuseau horaire) :</p>
            <ul>
                <li><strong>08:00</strong> : annonce dans le salon Univers (dans toutes les langues) et <strong>ouverture des inscriptions</strong>, avec une notification aux membres d'alliance.</li>
                <li><strong>18:45</strong> : fermeture des inscriptions. La composition du tableau est figée.</li>
                <li><strong>19:00</strong> : premier tour. Les tours suivants partent à <strong>19:15</strong> et <strong>19:30</strong>.</li>
                <li><strong>Vers 19:45</strong> : fin des combats et distribution des récompenses.</li>
            </ul>
            <p>Si moins de <strong>2 alliances</strong> sont inscrites sur tout le serveur à 19:00, l'événement est annulé et un message dans le salon Univers prévient tout le monde.</p>

            <h2 id="inscription">S'inscrire</h2>
            <p>Quand les inscriptions ouvrent, une <strong>fenêtre s'ouvre automatiquement</strong> dans votre interface (bouton « M'inscrire à l'arène »). Vous pouvez aussi vous inscrire depuis l'onglet <strong>Arène</strong> de votre page Alliance.</p>
            <p>Conditions :</p>
            <ul>
                <li>Être membre d'une alliance.</li>
                <li>Avoir au moins <strong>1 vaisseau d'attaque</strong> (au sol ou en flotte) au moment de l'inscription, puis au début de chaque match (19:00, 19:15, 19:30).</li>
                <li>L'inscription est <strong>gratuite</strong> : elle ne coûte aucune ressource, et rien de ce que vous possédez n'est mis en jeu.</li>
            </ul>
            <p>Vous pouvez vous désinscrire (« Me désinscrire ») jusqu'à la clôture des inscriptions, à 18:45. Si vous n'avez plus aucun vaisseau d'attaque au début d'un match (perdus en combat réel entre-temps), vous êtes automatiquement déclaré forfait pour ce match : votre alliance continue sans vous.</p>
            <p><strong>Commandants IA</strong> : dès qu'un membre humain est inscrit, les commandants IA de votre alliance s'inscrivent aussi, jusqu'à ce qu'elle compte 5 inscrits, humains compris. Les membres humains peuvent, eux, tous s'inscrire. Les alliances entièrement IA s'inscrivent aussi pour compléter le tableau.</p>

            <h2 id="combat">Comment ça se passe</h2>
            <p>Chaque match se joue dans un <strong>secteur créé pour l'occasion</strong>, affiché comme la carte spatiale : une grille de 5 × 5 où <strong>2 à 4 alliances</strong> s'affrontent. Chaque alliance part de sa <strong>base</strong>, au milieu d'un bord du secteur.</p>
            <p>Vos vaisseaux sont <strong>dupliqués</strong> pour l'arène : rien de ce que vous possédez n'est risqué. Aucune perte réelle, aucun débris, aucun héros capturé.</p>
            <ul>
                <li>Un match dure <strong>15 minutes</strong> au plus.</li>
                <li>La première alliance à <strong>300 points</strong> l'emporte ; sinon, le meilleur score à la fin du temps. En cas d'égalité : le plus de planètes tenues, puis le plus de dégâts infligés, puis un tirage au sort. Si personne n'a marqué ni tiré, le match est nul et personne ne passe.</li>
                <li>Une seule alliance par secteur passe au tour suivant. Le tableau est à élimination directe, sur 3 tours au plus ; le vainqueur du dernier match est champion du serveur.</li>
            </ul>

            <h2 id="flotte">Votre flotte</h2>
            <p>Vous partez avec <strong>une seule flotte</strong>, faite de tous vos vaisseaux d'attaque (ceux au sol comme ceux de vos flottes) et de votre héros principal.</p>
            <ul>
                <li><strong>Envoyer</strong> : choisissez votre flotte, touchez une planète, puis validez. La durée du vol est annoncée avant le départ, et un vol ne s'annule pas.</li>
                <li><strong>Diviser</strong> : détachez une partie de vos vaisseaux dans une nouvelle flotte (4 flottes au plus). Une flotte vole à la vitesse de son vaisseau le plus lent : une escadre de chasseurs seule va trois fois plus vite qu'une flotte qui traîne des cuirassés.</li>
                <li><strong>Regrouper</strong> : deux de vos flottes en orbite de la même planète peuvent fusionner.</li>
            </ul>
            <p>Votre <strong>héros principal</strong> prête ses bonus (dont les traits comme Tacticien) à votre flotte de départ. Une flotte détachée part sans lui ; si vous la regroupez avec la flotte du héros, il reste avec l'ensemble. Le héros ne risque rien : ni blessure ni capture, même en cas de forfait.</p>
            <p>Quand deux alliances se retrouvent sur la même planète, le combat se résout <strong>5 secondes</strong> plus tard (le temps pour des renforts d'arriver), avec les <strong>mêmes règles que le combat spatial</strong> du jeu. Une flotte engagée ne peut plus partir avant la fin du combat.</p>
            <p>Une flotte détruite n'est pas perdue : elle <strong>se reforme à votre base</strong>, effectif plein, après 45 secondes, puis 15 secondes de plus à chaque nouvelle destruction, 2 minutes au plus. Chaque flotte ennemie détruite rapporte <strong>5 points</strong> à votre alliance.</p>
            <p><strong>Les commandants IA se battent vraiment</strong> : ils vont prendre les planètes libres, évitent les combats perdus d'avance et rentrent se réparer. Si vous n'ouvrez pas l'écran du match et ne donnez aucun ordre pendant une minute, le pilote automatique joue aussi pour vous ; vous reprenez la main dès que vous revenez.</p>

            <h2 id="planetes">Planètes et points</h2>
            <p>Une alliance <strong>seule</strong> sur une planète qui n'est pas à elle la capture après <strong>15 secondes</strong> ; un ennemi qui arrive remet le compteur à zéro. La planète <strong>reste à votre alliance</strong> quand vos flottes repartent, jusqu'à ce qu'une autre la reprenne. C'est tout le dilemme : s'étaler pour marquer, ou se grouper pour gagner les combats.</p>
            <p>Toutes les <strong>10 secondes</strong>, chaque planète tenue rapporte des points :</p>
            <table>
                <thead>
                    <tr><th>Planète</th><th>Points</th><th>En plus</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Monde</strong> (4 par secteur)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Chantier</strong></td><td>1</td><td>Répare vos flottes en orbite : 10&nbsp;% de l'effectif à chaque période.</td></tr>
                    <tr><td><strong>Nexus</strong> (au centre)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Chaque point marqué par une planète verse aussi des <strong>PDG à la banque de votre alliance</strong> à la fin du match : 3 PDG par point au tour 1, 8 au tour 2, 15 au tour 3, que vous gagniez le match ou non. Les points des flottes détruites et des bases saccagées ne rapportent pas de PDG.</p>

            <h2 id="bases">Les bases</h2>
            <p>Votre base est votre point de départ et de reformation ; vos flottes s'y réparent (5&nbsp;% par période). Elle ne se capture pas, mais elle <strong>se saccage</strong>.</p>
            <p>Une base est défendue par les <strong>défenses planétaires de toutes les planètes des joueurs de l'alliance engagés dans le match</strong>, mises en commun : elle est difficile à prendre. Une attaque repoussée l'abîme quand même, et elle se répare de 10&nbsp;% par période.</p>
            <p>Si sa défense tombe, la base est saccagée : <strong>50 points</strong> pour l'attaquant, ses flottes rentrent d'office chez elles, et la base devient intouchable pendant 2 minutes.</p>

            <h2 id="recompenses">Récompenses</h2>
            <p>Deux types de récompenses cumulables.</p>
            <h3 id="banque">Banque alliance</h3>
            <table>
                <thead>
                    <tr><th>Tour atteint</th><th>Bitcoins</th><th>PDG</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdants tour 1</td><td>50&nbsp;000</td><td>1&nbsp;000</td></tr>
                    <tr><td>Perdants tour 2</td><td>150&nbsp;000</td><td>3&nbsp;000</td></tr>
                    <tr><td>Perdants tour 3</td><td>350&nbsp;000</td><td>8&nbsp;000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>1&nbsp;000&nbsp;000</strong></td><td><strong>25&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>La banque reçoit une seule de ces récompenses, celle du tour atteint, plus les PDG des planètes tenues pendant les matchs.</p>
            <h3 id="perso">Bonus individuel</h3>
            <p>Versé directement sur votre portefeuille personnel, à condition d'avoir <strong>donné au moins un ordre vous-même</strong> pendant l'un des matchs de la soirée : si le pilote automatique a tout joué à votre place, pas de bonus.</p>
            <table>
                <thead>
                    <tr><th>Tour atteint</th><th>Bitcoins personnels</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdants tour 1</td><td>5&nbsp;000</td></tr>
                    <tr><td>Perdants tour 2</td><td>15&nbsp;000</td></tr>
                    <tr><td>Perdants tour 3</td><td>30&nbsp;000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>50&nbsp;000</strong></td></tr>
                </tbody>
            </table>
            <p>Vous touchez <strong>un seul</strong> bonus par arène, celui du tour le plus haut atteint par votre alliance : <strong>50&nbsp;000 Bitcoins</strong> pour un champion.</p>

            <h2 id="rapports">Rapports de combat</h2>
            <p>À la fin de chaque match, chaque joueur reçoit un <strong>rapport</strong> dans sa page Rapports : résultat, score de votre alliance et de chaque adversaire, planètes tenues, bases saccagées, vos dégâts infligés et encaissés, les flottes ennemies détruites par les vôtres et celles que vous avez perdues, votre effectif restant, votre rang en dégâts parmi les pilotes de votre alliance (avec le titre de <strong>« MVP du match »</strong> pour le premier) et les PDG versés à la banque.</p>
            <p>À la fin du tournoi, un <strong>récapitulatif personnel</strong> s'y ajoute : parcours de votre alliance dans le tableau, bilan des matchs, votre contribution totale et le détail de vos gains (bonus personnel, banque d'alliance, planètes tenues).</p>

            <h2 id="suivi">Suivre l'événement depuis l'onglet Arène</h2>
            <p>L'onglet <strong>Arène</strong> de votre page Alliance affiche en permanence l'état réel de l'événement : pas d'arène en cours, prochaine arène à venir (avec un décompte jusqu'à l'annonce), annoncée, inscriptions ouvertes ou closes, arène en cours, ou terminée. Un décompte indique le temps restant avant la prochaine étape (fermeture des inscriptions, début des combats, tour suivant), et un encadré montre combien de membres de votre alliance sont déjà inscrits sur l'effectif total.</p>
            <p>Une fois l'arène terminée, l'onglet garde aussi le <strong>palmarès</strong> de votre alliance (nombre d'arènes jouées, titres de champion, meilleur tour atteint, bilan victoires/défaites) et l'historique des dix dernières éditions jouées sur votre serveur, avec le résultat de votre alliance et les récompenses obtenues à chacune.</p>

            <h2 id="spectateur">Mode spectateur</h2>
            <p>Vous n'êtes pas inscrit à l'arène en cours ? Vous pouvez quand même suivre en direct les matchs de <strong>votre alliance</strong> depuis l'onglet Arène : le secteur s'affiche exactement comme pour un pilote, mais vous ne pouvez donner aucun ordre.</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li><strong>Prenez le Nexus tôt</strong> : il rapporte autant que trois mondes. Mais tout le monde le sait.</li>
                <li><strong>Détachez vos chasseurs</strong> : une escadre rapide capture les mondes pendant que votre flotte lourde tient le centre.</li>
                <li><strong>Arrivez groupés</strong> : des flottes arrivées dans les mêmes 5 secondes se battent ensemble ; une flotte isolée se fait détruire et offre 5 points.</li>
                <li><strong>Gardez un chantier</strong> : y repasser répare vos flottes deux fois plus vite qu'à la base.</li>
                <li><strong>Ne campez pas</strong> : une planète capturée reste à vous quand vous repartez. Allez en prendre une autre.</li>
                <li><strong>Une base se prend à plusieurs</strong> : attaquer seul une base intacte, c'est offrir des points. À plusieurs alliés, dans la même fenêtre de 5 secondes, c'est 50 points d'un coup.</li>
                <li><strong>Donnez au moins un ordre</strong> : sans ordre de votre main, pas de bonus individuel.</li>
            </ul>

            <h2 id="mobile">Sur mobile</h2>
            <p>L'arène se joue au doigt sur mobile :</p>
            <ul>
                <li><strong>Orientation paysage</strong> forcée à l'entrée du match dans l'application mobile. Dans un navigateur mobile, où le jeu ne peut pas forcer l'écran, un message vous invite à tourner l'appareil.</li>
                <li><strong>Tout le secteur tient à l'écran</strong> : ni zoom ni caméra à gérer.</li>
                <li><strong>Trois touchers pour un ordre</strong> : votre flotte (dans la barre du bas, ou en touchant sa planète), la planète de destination, puis le bouton « Envoyer ».</li>
                <li><strong>Le cadre et le tag</strong> de chaque planète disent à qui elle est ; les chiffres dans ses coins donnent les forces en orbite, les vôtres en vert, celles de l'ennemi en rouge.</li>
                <li><strong>Bouton ⓘ</strong> : le détail de la planète choisie et le journal des combats.</li>
                <li><strong>Notification</strong> : une alerte à l'ouverture des inscriptions (08:00), avec l'heure limite et l'heure des combats.</li>
            </ul>

    ia_bots:
        title: "Commandants IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,intelligence artificielle,pnj,bot,pilote automatique"
        summary: "Certains serveurs incluent des commandants contrôlés par IA. Comment ils se comportent, et pourquoi."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Pourquoi des IA ?</h2>
            <p>Sur certains serveurs, quelques commandants ne sont pas des joueurs humains mais des <strong>intelligences artificielles</strong>. Ils permettent :</p>
            <ul>
                <li>de <strong>peupler le serveur</strong> quand il y a peu de joueurs actifs ;</li>
                <li>d'offrir des <strong>cibles intéressantes</strong> aux joueurs qui cherchent des combats ;</li>
                <li>de simuler une diplomatie vivante avec propositions, trahisons et alliances crédibles.</li>
            </ul>
            <p>Il n'y a pas de nombre maximum fixé par les règles : l'équipe du jeu choisit combien de commandants IA elle place sur chaque serveur, et les comptes de joueurs passés en pilote automatique (voir plus bas) s'y ajoutent. Ce nombre n'est affiché nulle part.</p>

            <h2 id="comportement">Comment ils se comportent</h2>
            <p>Chaque bot a :</p>
            <ul>
                <li>une <strong>personnalité</strong> (bavard, diplomate, agressif, troll, vétéran, silencieux…) ;</li>
                <li>une <strong>humeur</strong> qui évolue selon les événements (content, méfiant, frustré, énervé…) ;</li>
                <li>un <strong>archétype stratégique</strong> parmi cinq : économiste, équilibré, conquérant, expansionniste ou défensif.</li>
            </ul>
            <p>Ils jouent vraiment : ils construisent, recherchent, attaquent, forment des alliances, trahissent parfois. Ils peuvent être vos alliés comme vos pires ennemis.</p>
            <p>Ils grandissent <strong>chaque jour au rythme des joueurs actifs</strong> du serveur (un peu plus vite que la médiane), sans jamais dépasser <strong>90&nbsp;% du meilleur joueur</strong>. Ce qu'ils perdent au combat est perdu pour de bon : si un joueur détruit leur garnison, ils ne la reconstruisent pas sur cette planète pendant <strong>7 jours</strong> et renforcent plutôt leurs tourelles.</p>
            <p><strong>Où dort leur flotte.</strong> Les IA conquérantes et expansionnistes gardent une garnison en orbite de leurs planètes. Les autres (économistes, équilibrées et défensives), plus prudentes, gardent leurs vaisseaux <strong>au sol</strong>, comme beaucoup de joueurs, et ne les sortent que pour se défendre&nbsp;: si leur radar repère une flotte hostile en approche qu'elles peuvent battre, elles mettent leur flotte en orbite et font venir les vaisseaux de leurs planètes voisines qui arrivent à temps&nbsp;; face à une flotte trop forte, elles envoient la leur se poser sur une autre de leurs planètes. Elles rejoignent aussi un combat déjà engagé au-dessus de leur planète, ou attaquent une flotte armée garée en orbite, quand elles peuvent gagner. Comme un joueur, une IA endormie ne réagit pas, et une flotte masquée par un brouilleur la prend par surprise. Elles ne laissent jamais leurs vaisseaux au sol d'une planète sans tourelles, qu'une invasion prendrait avec eux&nbsp;: ils vont se poser sur leur planète la mieux défendue, qui est aussi leur premier refuge.</p>
            <p><strong>Leur commerce.</strong> Elles vendent leurs surplus et la cargaison de leurs recycleurs au marchand le plus proche, sauf s'il est sous blocus ou gardé par une flotte hostile en mode attaque, qui détruirait leur convoi à l'arrivée&nbsp;: elles vont alors chez le suivant.</p>

            <h2 id="reconnaitre">Peut-on les reconnaître ?</h2>
            <p>Pas à coup sûr. Les commandants IA apparaissent au classement et sur la carte comme des joueurs, et rien dans l'interface ne les signale. Le jeu est conçu pour que vous ne puissiez pas savoir avec certitude si un commandant est une IA.</p>

            <h2 id="strategie">Jouer avec eux</h2>
            <ul>
                <li>Ne sous-estimez pas un bot : certains sont de vraies terreurs militaires.</li>
                <li>Un bot peut parfaitement vous inviter en alliance, coopérer, puis vous attaquer si la situation change.</li>
                <li>Côté immersion, traitez-les comme des joueurs : ça rend le serveur plus vivant.</li>
            </ul>

            <h2 id="pilote-automatique">Joueurs absents : le pilote automatique</h2>
            <p>Si un joueur <strong>inscrit</strong> ne se connecte plus pendant <strong>8 jours</strong>, son compte passe en <strong>pilote automatique</strong> (il reçoit un e-mail de rappel après 7 jours d'absence ; les comptes d'essai ne sont pas concernés) : un bot <strong>muet</strong>, qui n'écrit jamais dans les salons ni par message privé. Ce pilote automatique <strong>ne joue pas à sa place</strong> : le compte ne lance aucune attaque, ne déplace ni n'engage vos flottes et ne colonise pas. Il se contente de poursuivre vos constructions et recherches et de renforcer lentement vos tourelles. Les autres commandants IA ne l'attaquent pas ; les autres joueurs, eux, le peuvent toujours. Vous pouvez toujours lui écrire un message privé : il le lira à son retour. Dès que le joueur se reconnecte, il reprend instantanément le contrôle de son compte, et retrouve ses flottes là où il les avait laissées.</p>

    cthulhu_prophecies:
        title: "Les prophéties de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,prophetie,blocus,menace,evenement,alliance,pdg,bitcoin,marchand,recyclage,classement"
        summary: "Quand la menace du serveur atteint son seuil, Possédés annonce une prophétie : 48 heures plus tard, ses hordes bloquent le commerce de tout le serveur. Comment lire la jauge, briser un blocus à plusieurs, et ce que coûte l'échec."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Qu'est-ce qu'une prophétie ?</h2>
            <p>Sur les serveurs <strong>Cthulhu</strong>, <strong>Long Run</strong> et <strong>Short Run</strong>, un <strong>pool de menace</strong> propre au serveur, la « Menace de l'univers », monte automatiquement, jour après jour. Il est distinct de votre menace personnelle contre les Cthulhu.</p>
            <p>Quand il atteint son seuil, <strong>Possédés</strong> publie une <strong>prophétie</strong> dans le salon public : un <strong>blocus</strong> va s'abattre sur tout le serveur <strong>48 heures</strong> plus tard.</p>

            <h2 id="jauge">Lire la jauge de menace du serveur</h2>
            <ul>
                <li>Elle est visible sur la page <strong>Cthulhu</strong> (celle du Tower Defense), dans le bloc <strong>« Menace de l'univers »</strong> : une barre qui va de 0 à <strong>700</strong>, le seuil qui déclenche une prophétie. Elle progresse indépendamment de vos combats personnels.</li>
                <li>Elle monte de <strong>100 points par jour</strong>, au changement de date (minuit, heure de Paris). Partie de zéro, elle atteint le seuil en <strong>7 jours</strong>. Pour estimer le temps restant : (700 − niveau actuel) ÷ 100 jours. Exemple : à 400, la prophétie tombe dans 3 jours.</li>
                <li>Chaque base de la ruche libérée la fait reculer de <strong>50 points</strong>, soit une demi-journée de répit.</li>
                <li>Le premier événement d'un serveur ne peut pas survenir avant ses <strong>deux premières semaines</strong> d'existence.</li>
                <li>Jamais deux prophéties (ni deux blocus) en même temps sur un même serveur. Pendant l'événement, la jauge peut continuer d'afficher sa progression, mais elle est remise à zéro à la fin : le cycle suivant repart de 0. Comptez environ 11 jours entre deux prophéties (7 jours de montée, 48 heures d'attente, 48 heures de blocus au plus).</li>
            </ul>

            <h2 id="prophetie">L'annonce</h2>
            <p>Au franchissement du seuil, Possédés poste sa prophétie dans le salon public : le blocus tombe <strong>48 heures plus tard</strong>, et la page Cthulhu affiche le compte à rebours. Le message, dans la voix de Possédés, évoque ce qui est en jeu : le blocus du commerce, la dîme sur les Bitcoins, les épaves dévorées.</p>
            <p>Possédés poste ensuite, à coup sûr, trois autres messages dans le salon public :</p>
            <ul>
                <li>au <strong>début du blocus</strong> : le nombre de hordes, l'objectif à détruire et le temps restant, en rappelant que les alliances sont classées ;</li>
                <li><strong>6 heures avant l'échéance</strong> : un rappel du temps restant et du nombre de hordes déjà tombées sur l'objectif ;</li>
                <li>à l'<strong>issue</strong> : blocus brisé ou blocus tenu, avec le nom des alliances récompensées ou punies.</li>
            </ul>
            <p>Le Discord du jeu annonce aussi la prophétie (avec la date du blocus, en heure UTC), le début du blocus et son issue.</p>
            <p>En dehors de ces annonces, Possédés commente de temps en temps la vie du serveur dans le salon public, mais ces messages ne sont pas garantis : pour suivre la menace, fiez-vous à la jauge.</p>

            <h2 id="blocus">Le blocus</h2>
            <p>À l'échéance, une <strong>horde Cthulhu</strong> (appelée « flotte-mur » sur la page Cthulhu) se poste en orbite de <strong>chaque marchand</strong> et de <strong>chaque astéroïde</strong> du serveur :</p>
            <ul>
                <li><strong>Vente impossible</strong> à tout marchand bloqué.</li>
                <li><strong>Recyclage impossible</strong> sur tout astéroïde bloqué.</li>
                <li>Ailleurs dans l'univers, les <strong>champs de ruines restent recyclables normalement</strong>, comme après n'importe quel autre combat.</li>
                <li>Sur une cible bloquée, en revanche, les <strong>épaves de vos propres assauts s'accumulent sur place et restent hors de portée tant que la horde qui la garde est vivante</strong>. Détruisez-la et <strong>cette cible-là rouvre aussitôt</strong>, sans attendre le sort du blocus sur le reste du serveur : la vente ou le recyclage y reprennent, et vos recycleurs déjà en orbite s'y remettent tout seuls.</li>
                <li>Rien à voir avec l'embargo ou la famine qu'une flotte ennemie impose à une planète joueur : ici, seuls le commerce et le recyclage s'arrêtent.</li>
                <li>Le blocus dure au maximum <strong>48 heures</strong>, moins s'il est brisé avant.</li>
            </ul>

            <h2 id="briser">Briser un blocus à plusieurs</h2>
            <p>Toutes les hordes ne se valent pas :</p>
            <ul>
                <li>Celles qui gardent les <strong>marchands</strong> valent <strong>1,8 fois</strong> la plus grosse flotte du serveur (joueur ou commandant IA). Personne ne les brise seul : il faut s'y mettre à deux ou trois.</li>
                <li>Celles des <strong>astéroïdes</strong> ne valent que <strong>la moitié</strong> de cette plus grosse flotte : une grosse flotte isolée peut les vaincre. Comme les astéroïdes sont bien plus nombreux que les marchands, ce sont elles qui font le gros du compteur.</li>
            </ul>
            <p>Dans tous les cas, une <strong>coalition</strong> qui frappe la même horde en assauts successifs finit par l'avoir. Les dégâts qu'une horde a subis <strong>ne se régénèrent jamais</strong> entre deux combats : chaque assaut, même perdu, l'affaiblit pour le suivant. Concentrez vos coups sur la même cible plutôt que d'égratigner plusieurs hordes à la fois.</p>

            <h2 id="recompenses">Récompenses</h2>
            <p>Chaque point de dégâts infligé à une horde est <strong>payé en Bitcoin et en Points de Guerre</strong> à la fin de l'événement, que le blocus soit brisé ou non : aucun assaut n'est perdu pour rien. Vous recevez 1 point de guerre par tranche de 5&nbsp;000 Bitcoins gagnés.</p>
            <p>Le blocus est déclaré <strong>brisé</strong> dès que <strong>70&nbsp;% des hordes du serveur ont été détruites avant l'échéance</strong> (arrondi au supérieur), marchands et astéroïdes confondus. Exemple : sur 160 hordes, il faut en détruire 112.</p>
            <p>Le blocus prend alors <strong>fin immédiatement</strong> : les hordes restantes disparaissent, tous les marchands et astéroïdes rouvrent, et le taux de récompense est <strong>doublé</strong> pour tous les contributeurs.</p>
            <p>Un rapport individuel détaille vos dégâts infligés et votre récompense à la fin de l'événement. Pendant le blocus, la <strong>page Cthulhu</strong> affiche la progression en direct : hordes détruites, objectif à atteindre et temps restant.</p>

            <h2 id="echec">Le prix de l'échec</h2>
            <p>Si le blocus <strong>expire sans être brisé</strong> :</p>
            <ul>
                <li><strong>Chaque joueur perd la moitié de son Bitcoin</strong> : les Possédés prélèvent leur dîme, y compris chez les joueurs qui ont désactivé le PvE. Seuls les joueurs sous <strong>protection débutant</strong> et les joueurs en game over sont épargnés.</li>
                <li><strong>Tous les champs de ruines de bataille de l'univers sont dévorés</strong> par les Cthulhu ; les <strong>astéroïdes</strong>, eux, restent intacts.</li>
                <li>Le <strong>coffre bitcoin de chaque alliance</strong> comptant au moins un joueur humain perd lui aussi la moitié de son contenu : déposer son Bitcoin au coffre avant l'échéance ne protège de rien. Le prélèvement apparaît dans l'historique du coffre.</li>
                <li>Les <strong>3 dernières alliances du classement</strong> perdent en plus de la production pendant 72 heures (voir ci-dessous).</li>
            </ul>
            <p>La dîme est prélevée avant le paiement des récompenses : ce que vous gagnez en combattant les hordes n'est pas amputé. Chaque joueur touché reçoit un rapport détaillant le Bitcoin perdu.</p>

            <h2 id="classement">Le classement des alliances</h2>
            <p>Pendant le blocus, chaque alliance est classée sur ce qu'elle fait contre la ruche. La <strong>page Cthulhu</strong> affiche le classement en direct, avec ce que votre alliance gagnerait ou perdrait si le blocus se terminait maintenant.</p>
            <ul>
                <li><strong>Points</strong> : les dégâts infligés à une <strong>flotte-mur</strong> du blocus comptent double ; les dégâts infligés à la ruche ailleurs (sièges de bases, hordes) comptent simple ; chaque <strong>victoire au Tower Defense</strong> vaut autant que détruire un quart de flotte-mur d'astéroïde.</li>
                <li><strong>Points par membre</strong> : le score est divisé par le nombre de membres actifs (connectés dans les 7 derniers jours, hors protection débutant). Les dégâts d'un débutant comptent quand même : recruter ne fait jamais baisser le score.</li>
                <li><strong>Appartenance figée</strong> au début du blocus : changer d'alliance pendant l'événement ne déplace ni les points, ni le bonus, ni le malus.</li>
                <li>Il faut au moins <strong>2 membres actifs</strong> pour être classée. Les <strong>joueurs sans alliance</strong> ne sont jamais concernés.</li>
            </ul>
            <p><strong>Blocus brisé</strong> : les 3 premières alliances gagnent <strong>+15&nbsp;%, +10&nbsp;% et +5&nbsp;% de production</strong> pendant 72 heures, à condition d'avoir marqué des points. Aucune alliance n'est pénalisée.</p>
            <p><strong>Blocus subi</strong> : les 3 dernières alliances perdent <strong>15&nbsp;%, 10&nbsp;% et 5&nbsp;% de production</strong> pendant 72 heures, en plus de la dîme. Jamais plus de la moitié des alliances classées n'est touchée. Une alliance qui a fourni l'effort minimum est épargnée, même dernière : l'équivalent d'une demi-flotte-mur d'astéroïde détruite, ou de deux victoires au Tower Defense, par membre actif.</p>
            <p>Chaque membre reçoit un rapport qui explique le bonus ou le malus de son alliance et sa date de fin.</p>

            <h2 id="conseils">En pratique</h2>
            <ul>
                <li>Surveillez la jauge <strong>« Menace de l'univers »</strong> de la page Cthulhu : à 100 points par jour, elle vous dit combien de jours il reste avant le seuil de 700.</li>
                <li>Dès qu'une <strong>prophétie</strong> est annoncée, prévenez votre alliance : vous avez <strong>48 heures</strong> pour vous organiser avant que le blocus ne tombe.</li>
                <li>Concentrez les assauts sur les mêmes hordes plutôt que de les disperser : les dégâts persistent, mieux vaut en achever une que d'en égratigner plusieurs.</li>
                <li>Même un assaut perdu rapporte quelque chose : n'attendez pas d'être sûr de gagner pour attaquer.</li>
                <li>Pas assez de flotte pour attaquer une horde ? Une <strong>victoire au Tower Defense</strong> pendant le blocus rapporte aussi des points à votre alliance.</li>
            </ul>

    notifications:
        title: "Notifications push"
        category: "beginner"
        order: 10
        tags: "notification,push,alerte,mobile,android,navigateur,preference,cloche"
        summary: "Recevez une alerte dans l'application Android ou dans votre navigateur dès qu'un événement important se produit dans votre empire."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">À quoi ça sert ?</h2>
            <p>Area Universe se joue en continu : des flottes ennemies peuvent arriver pendant que vous êtes au travail. Les <strong>notifications push</strong> vous alertent en temps réel sur votre téléphone ou dans votre navigateur, pour que vous puissiez réagir à temps.</p>

            <h2 id="evenements">Ce que vous pouvez recevoir</h2>
            <p>Sur la page Notifications, les types sont rangés en cinq groupes :</p>
            <ul>
                <li><strong>Production &amp; Recherche</strong> — Recherche terminée ; Bâtiment terminé (votre file de construction est vide) ; Production terminée (votre file de vaisseaux ou de défenses est vide).</li>
                <li><strong>Flottes</strong> — Flotte arrivée à destination ; Flotte en combat (une de vos flottes est engagée dans un combat) ; Flotte ennemie en approche (une flotte hostile vient d'être lancée vers une de vos planètes).</li>
                <li><strong>Planètes</strong> — Planète sous attaque (une flotte arrive pour piller ou envahir) ; Planète sous embargo ; Frappe nucléaire reçue ; Attaque Cthulhu ; Espionnage détecté.</li>
                <li><strong>Alliance</strong> — Alliance en guerre ; Message d'alliance.</li>
                <li><strong>Personnel</strong> — Nouveau message privé ; Héros capturé ; Héros libéré.</li>
            </ul>
            <p>Chaque type s'active ou se coupe <strong>individuellement</strong>. Deux alertes n'ont pas d'interrupteur à elles : <strong>Planète capturée</strong> est toujours envoyée, et le rappel <strong>Bonus de connexion disponible</strong> (une fois par jour au plus) ne se coupe qu'avec <em>Tout désactiver</em>.</p>
            <p>« Flotte ennemie en approche » ignore les flottes de votre alliance et celles d'une alliance avec qui vous avez une alliance défensive, un pacte de non-agression ou un accord de paix.</p>

            <h2 id="activation">Comment les activer</h2>
            <ol>
                <li>Ouvrez la page <strong>Notifications</strong> : icône cloche en bas du menu sur ordinateur ; bouton <strong>Menu</strong>, puis <strong>Notifications</strong> sur téléphone.</li>
                <li>Dans un navigateur, cliquez sur <strong>Activer les notifications</strong> (cadre « Notifications navigateur ») ; dans l'application Android, sur <strong>Activer les notifications</strong> de la section « Notifications de cet appareil ».</li>
                <li>Acceptez la demande d'autorisation du navigateur ou du téléphone.</li>
                <li>Plus bas, décochez les types que vous ne voulez pas recevoir : ils sont tous activés au départ.</li>
            </ol>
            <p>Un bouton <em>Tout désactiver</em> coupe l'ensemble en un clic. Vos choix par type valent pour le serveur sur lequel vous jouez, sur tous vos appareils.</p>
            <p>Dans un navigateur, l'option <strong>Son de notification</strong> joue en plus un son quand du nouveau arrive alors que l'onglet est en arrière-plan. Un bandeau peut aussi vous proposer d'activer les notifications : <strong>Activer</strong> ou <strong>Non merci</strong>.</p>

            <h2 id="compatibilite">Où ça marche</h2>
            <ul>
                <li><strong>Application Android</strong> (Google Play) : c'est la seule application ; il n'en existe pas pour iPhone ni iPad.</li>
                <li><strong>Navigateur sur ordinateur</strong> : Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone et iPad</strong> : le jeu se joue dans le navigateur.</li>
                <li><strong>Plusieurs appareils</strong> : chaque appareil sur lequel vous avez activé les notifications les reçoit ; si vous les avez activées sur votre téléphone et sur votre ordinateur, les deux sonnent.</li>
            </ul>

            <h2 id="depannage">Le navigateur refuse l'inscription ?</h2>
            <p>Si votre navigateur bloque le service de notifications, la page Notifications affiche elle-même la marche à suivre et un bouton <strong>Réessayer</strong>.</p>
            <p>Sur <strong>Brave</strong>, le service push de Google est désactivé par défaut. Ouvrez <code>brave://settings/privacy</code>, activez <strong>« Utiliser les services Google pour la messagerie push »</strong>, puis redémarrez complètement le navigateur. Sur les autres navigateurs, vérifiez qu'un VPN, un antivirus ou un DNS filtrant ne bloque pas le service de notifications.</p>

            <h2 id="mobile">Sur l'application mobile</h2>
            <p>Dans l'application Android, la page <strong>Notifications</strong> comporte une section « Notifications de cet appareil » : activez ou désactivez à tout moment les notifications push du téléphone. Si elles sont bloquées, le bouton <strong>Ouvrir les réglages</strong> vous mène directement aux réglages du téléphone. Vos choix par type de notification valent pour tous vos appareils, sur le serveur où vous jouez.</p>

            <h2 id="discord">Sur Discord</h2>
            <p>Si votre compte Discord est lié (<strong>Mes options</strong>), l'alerte <strong>Flotte ennemie en approche</strong> vous arrive aussi en message privé sur Discord, avec l'heure d'arrivée et un lien vers la planète. Au plus un message par planète toutes les 30 minutes : une attaque à plusieurs flottes ne vous inonde pas. Il faut être membre du <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord d'Area Universe</a> et accepter les messages privés de ses membres. L'option est activée par défaut et se coupe dans la section <strong>Discord</strong> des préférences de notification.</p>

    glossary:
        title: "Glossaire"
        category: "beginner"
        order: 11
        tags: "glossaire,termes,definitions,vocabulaire,abreviations"
        summary: "Tous les termes et abréviations du jeu, expliqués en une phrase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Tous les termes du jeu</h2>
            <table>
                <tr><th>Terme</th><th>Définition</th></tr>
                <tr><td><strong>Alliance</strong></td><td>Groupe de joueurs. En faire partie augmente de 20&nbsp;% la production de niobium, d'eau et de rations de vos planètes.</td></tr>
                <tr><td><strong>Barge</strong></td><td>Vaisseau de débarquement de Légionnaires pour les raids et invasions.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Monnaie principale du jeu. Générée par vos travailleurs.</td></tr>
                <tr><td><strong>Bloc</strong></td><td>Regroupement automatique de flottes alliées pendant un combat spatial.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Champ De Ressources : les débris laissés après un combat, recyclables.</td></tr>
                <tr><td><strong>Chantier spatial</strong></td><td>Bâtiment qui permet de fabriquer des vaisseaux.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Les créatures hostiles (ex-"zombies"). Apparaissent en mode PvE et sur les planètes aliens.</td></tr>
                <tr><td><strong>Cycle</strong></td><td>Rythme interne de production. 10 min pour une planète, 1 min pour une lune.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Niveau d'alerte d'alliance, de 0 (aucune alerte) à 5 (alerte maximale) : plus le chiffre est haut, plus la situation est tendue.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Siège d'une planète par une flotte ennemie en orbite. Provoque une famine.</td></tr>
                <tr><td><strong>Entretien</strong></td><td>Coût quotidien en Bitcoins de vos troupes, vaisseaux et bâtiments.</td></tr>
                <tr><td><strong>Fort défensif</strong> (Bunker)</td><td>Bâtiment défensif : augmente la capacité de Légionnaires, permet de construire des Mechas et met à l'abri des pillages, par niveau, 5&nbsp;% de votre capacité de stockage de niobium et d'eau (et 5&nbsp;% de votre uranium).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fin de partie : faillite économique, ou perte de toutes vos planètes.</td></tr>
                <tr><td><strong>Game Over économique</strong></td><td>Votre solde de Bitcoins est devenu négatif après le rapport journalier.</td></tr>
                <tr><td><strong>Héros</strong></td><td>Votre personnage principal (vous pouvez aussi avoir des héros secondaires). Il évolue, combat, et peut être capturé.</td></tr>
                <tr><td><strong>Lunar</strong> (parfois appelé Moon Maker)</td><td>Vaisseau qui crée une lune sur un emplacement vide contenant au moins 2 millions de niobium et 2 millions d'eau en débris.</td></tr>
                <tr><td><strong>Marchand</strong></td><td>PNJ sur la carte qui achète vos ressources contre des Bitcoins (et quelques Points de Guerre).</td></tr>
                <tr><td><strong>Niveau</strong></td><td>De 2 à 40, il monte avec votre expérience, qui grandit avec votre score ; il ne redescend jamais. Il fixe le plancher du bonus de connexion.</td></tr>
                <tr><td><strong>Objectifs</strong></td><td>Les 3 quêtes journalières, renouvelées à chaque rapport journalier et payées en PDG ; les accomplir toutes rapporte en plus leur récompense moyenne. Page du même nom dans le menu.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Points De Guerre. Gagnés surtout au combat (et par les objectifs quotidiens, l'arène, la prison, la vente aux marchands). Se dépensent sur la page Objectifs (Bitcoins, Légionnaires, travailleurs), pour des vaisseaux d'élite, la Ville flottante, la Station orbitale et la recherche Expansion territoriale.</td></tr>
                <tr><td><strong>Pilote automatique</strong></td><td>Mode muet qui prend le relais d'un compte inscrit absent depuis 8 jours : il poursuit constructions et recherches, ne bouge aucune flotte, et vous rend la main dès votre retour.</td></tr>
                <tr><td><strong>Planète active</strong></td><td>La planète actuellement sélectionnée. Toutes vos actions s'y appliquent.</td></tr>
                <tr><td><strong>PNJ</strong></td><td>Personnage Non Joueur : marchands, aliens, Cthulhu, bots IA.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Attaque terrestre pour piller les ressources d'une planète (pas pour la conquérir).</td></tr>
                <tr><td><strong>Rapport journalier</strong></td><td>Bilan quotidien calculé à 18h59 (heure de Paris) : revenus, coûts, solde, mise à jour des points et du classement, nouveaux objectifs du jour.</td></tr>
                <tr><td><strong>Recycleur</strong></td><td>Vaisseau qui ramasse les débris (CDR) : le recyclage démarre tout seul quand une flotte avec recycleurs arrive sur un champ de débris.</td></tr>
                <tr><td><strong>Round</strong></td><td>Tour de combat. Max 100 en combat spatial, max 10 en combat au sol.</td></tr>
                <tr><td><strong>Signature</strong> (thermique)</td><td>Ordre de grandeur de la masse d'une flotte, sans en révéler la composition. Plus elle est grande, plus un vol coûte de carburant (payé en Bitcoins) ; elle sert aussi à calculer vos points et les Points de Guerre gagnés en combat.</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Petit vaisseau d'espionnage. À envoyer avant toute attaque.</td></tr>
                <tr><td><strong>Terraformation</strong></td><td>Recherche qui fixe le nombre maximum de planètes que vous pouvez posséder : son niveau + 2 (plus les bonus de régime de votre alliance), jusqu'au niveau 18. Le niveau 1 débloque le colonisateur, le niveau 15 le Lunar. Pour agrandir une planète, construisez une Ville flottante ou une Station orbitale (recherche Expansion territoriale).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Mini-jeu de défense active contre les hordes Cthulhu.</td></tr>
                <tr><td><strong>Travailleur</strong></td><td>Unité de population. Produit des Bitcoins chaque jour. Défend en invasion.</td></tr>
                <tr><td><strong>Tutoriel</strong></td><td>Parcours guidé et récompensé (jusqu'à 18 étapes en 5 chapitres, selon le parcours choisi). Se lance ou se reprend depuis la page Préférences, section Tutoriel.</td></tr>
                <tr><td><strong>Vaisseau mère</strong></td><td>Vaisseau amiral payé notamment en PDG : il apporte à sa flotte 20&nbsp;000 de coque et 5&nbsp;000 de bouclier, +5&nbsp;% de coque et de bouclier, +10&nbsp;% de précision et −10&nbsp;% de signature. Aussi lent qu'un vaisseau de bataille, il ralentit une flotte de chasseurs ou de corvettes.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Joueur désigné comme cible prioritaire en mode Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Supprimer mon compte et mes données"
        category: "beginner"
        order: 99
        tags: "suppression,compte,donnees,rgpd,confidentialite,supprimer"
        summary: "Comment supprimer définitivement votre compte et vos données personnelles, et ce que le jeu conserve."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Où faire la demande</h2>
            <p>Dans le jeu, ouvrez <strong>Préférences</strong> : tout en bas, la <strong>Zone dangereuse</strong> propose le bouton <strong>Supprimer mon compte</strong>.</p>
            <p>Vous pouvez aussi passer par la page publique <strong>/suppression-donnees</strong> (lien « Suppression du compte et des données » du Règlement). Elle résume ce qui est supprimé et ce qui est conservé ; il faut ensuite vous connecter pour faire la demande.</p>
            <p>Pour confirmer, tapez exactement le mot <strong>SUPPRIMER</strong>, puis touchez <strong>Supprimer définitivement mon compte</strong>. La suppression est <strong>immédiate</strong> et vaut pour votre compte sur <strong>tous les serveurs</strong>.</p>

            <h2 id="irreversible">Un abandon de compte définitif</h2>
            <p><strong>Attention : c'est un abandon définitif de compte.</strong> Vos données personnelles sont supprimées ou anonymisées immédiatement :</p>
            <ul>
                <li>e-mail, mot de passe et pseudo ;</li>
                <li>identifiants Google, Discord ou LinkedIn, liaison Google Play Jeux et adresse de portefeuille ;</li>
                <li>adresse IP, empreinte technique et fuseau horaire ;</li>
                <li>sessions, jetons de connexion et jetons de notification ;</li>
                <li>messages privés, envoyés et reçus ;</li>
                <li>abonnements à la newsletter et aux notifications.</li>
            </ul>
            <p>Vos succès sont effacés. Vous ne pourrez plus jamais vous reconnecter avec ce compte, et aucune fonction du jeu ne permet de le récupérer : pour rejouer, il faudra créer un nouveau compte et repartir de zéro.</p>
            <p>Aucun achat en cours n'est remboursé.</p>

            <h2 id="conserve">Ce qui est conservé, et pourquoi</h2>
            <p>Pour préserver l'équilibre du jeu, vos commandants, planètes et flottes continuent d'exister, confiés à un bot muet. Vos commandants, vos héros et vos planètes sont renommés « Bot- » suivi d'un numéro, sans aucun lien avec votre identité ; ce nom remplace aussi le vôtre dans les classements et les archives des serveurs terminés.</p>
            <p>Les messages publics écrits dans les salons sont conservés et apparaissent désormais sous ce nom « Bot-… ».</p>
            <p>L'historique de paiement est conservé (obligation légale comptable), lui aussi dissocié de votre identité.</p>

    achievements:
        title: "Succès"
        category: "progression"
        order: 11
        tags: "succes,succès,achievements,trophees,google play,play jeux,progression"
        summary: "15 succès de compte, des premiers pas aux exploits de carrière, sur votre profil et dans Google Play Jeux."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Les <strong>succès</strong> récompensent ce que vous accomplissez avec votre compte, <strong>tous serveurs confondus</strong>. Une fois débloqué, un succès l'est pour toujours, même si vous perdez ensuite la planète ou quittez l'alliance qui vous l'a valu.</p>
            <p>Retrouvez-les sur votre <strong>profil cross-serveur</strong> (menu « Mon profil cross-serveur »), avec votre progression et la date de chaque déblocage. Le profil d'un autre joueur montre les siens. Ceux que votre historique a déjà mérités sont débloqués d'office.</p>
            <h2 id="liste">Les 15 succès</h2>
            <table>
            <tr><th>Succès</th><th>Condition</th><th>Points</th></tr>
            <tr><td>Commandant</td><td>Terminer le tutoriel en le suivant (le passer avec « Je découvre seul » ne compte pas)</td><td>20</td></tr>
            <tr><td>Bâtisseur</td><td>Terminer une première construction</td><td>20</td></tr>
            <tr><td>Savant</td><td>Terminer une première recherche</td><td>20</td></tr>
            <tr><td>Colon</td><td>Posséder 2 planètes</td><td>20</td></tr>
            <tr><td>Allié</td><td>Rejoindre ou fonder une alliance</td><td>20</td></tr>
            <tr><td>Vétéran I, II, III</td><td>Livrer 10, 100 puis 1 000 batailles spatiales</td><td>25, 50, 100</td></tr>
            <tr><td>Conquérant I, II</td><td>Réussir 10 puis 100 invasions</td><td>50, 100</td></tr>
            <tr><td>Geôlier</td><td>Capturer un héros ennemi</td><td>50</td></tr>
            <tr><td>Chasseur de Cthulhu</td><td>Gagner une partie du Tower Defense</td><td>50</td></tr>
            <tr><td>Élite</td><td>Finir dans le top 10 d'un serveur</td><td>100</td></tr>
            <tr><td>Empereur</td><td>Remporter un serveur</td><td>200</td></tr>
            <tr><td>Un succès caché</td><td>À découvrir en jouant</td><td>50</td></tr>
            </table>
            <p>« Savant » ne peut pas se gagner sur les serveurs où toutes les recherches sont débloquées dès le départ. Une lune compte comme une planète pour « Colon ».</p>

            <h2 id="progression">La progression</h2>
            <p>Les succès de batailles et d'invasions avancent par paliers, et votre profil affiche le compteur (par exemple 37 / 100). Toutes les batailles spatiales livrées comptent, gagnées ou perdues, y compris la destruction d'une flotte sans armes (cargos, recycleurs, sondes), pour les deux camps ; les invasions comptent quand elles réussissent (les raids ne comptent pas). Élite et Empereur se décident à la fin d'un serveur.</p>
            <h2 id="google-play">Google Play Jeux (Android)</h2>
            <p>Dans l'application Android, vos succès apparaissent aussi dans <strong>Google Play Jeux</strong>, avec la bannière « Succès débloqué ».</p>
            <ul>
            <li><strong>Compte d'essai</strong> créé dans l'application : il est lié automatiquement à votre profil Google Play Jeux. Il n'est alors plus supprimé après 7 jours sans jouer, et il se rouvre tout seul après une réinstallation ou sur un nouveau téléphone.</li>
            <li><strong>Compte inscrit</strong> : dans l'application Android, ouvrez votre profil cross-serveur (menu « Mon profil cross-serveur ») et touchez « Lier ce compte » sur la carte « Google Play Jeux ». Il s'ouvrira ensuite sans mot de passe avec ce profil Google Play Jeux : ne le faites que sur votre propre appareil. Vous pouvez le délier à tout moment depuis la même carte, sur le site comme dans l'application.</li>
            <li>Le bouton <strong>« Play Jeux »</strong> de l'écran de connexion rouvre le compte lié. Vous déconnecter coupe l'ouverture automatique sur cet appareil : c'est alors ce bouton qui rouvre le compte.</li>
            </ul>
            <p>Un profil Google Play Jeux ne se lie qu'à un seul compte Area, et un compte qu'à un seul profil. Lier votre compte depuis votre profil reprend le profil Google Play Jeux à l'autre compte auquel il était lié, s'il y en avait un.</p>
    faq:
        title: "Questions fréquentes : compte, appareils et aide"
        category: "beginner"
        order: 13
        tags: "faq,compte,plusieurs serveurs,multi-compte,hors ligne,android,iphone,console,langue,espagnol,pseudo,contact,support,bug,achat,remboursement,suppression,rapports"
        summary: "Plusieurs serveurs, jeu hors ligne, appareils, langues, pseudo, contact, bugs, achats : les réponses aux questions pratiques."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Jouer sur plusieurs serveurs</h2>
            <p>Oui. Votre compte vous suit sur tous les serveurs. Sur chaque serveur que vous rejoignez, vous avez un <strong>commandant distinct</strong>, avec son propre pseudo, ses planètes, ses héros, ses Bitcoins, son alliance et son classement : rien ne passe d'un serveur à l'autre.</p>
            <p>Vous pouvez jouer sur plusieurs serveurs en même temps et passer de l'un à l'autre par l'entrée <strong>Serveur</strong> du menu : les serveurs où vous jouez déjà s'ouvrent directement.</p>
            <p>Ce qui est commun à tous vos serveurs : votre <strong>profil cross-serveur</strong> (menu « Mon profil cross-serveur »), qui cumule votre carrière et vos succès, votre langue et votre liste de joueurs bloqués.</p>
            <p>Plusieurs comptes sur un même serveur : le Règlement (section « Comptes multiples ») les autorise à condition de les déclarer par e-mail à <strong>support@areauniverse.com</strong>. Ces comptes ne doivent pas interagir directement entre eux, ni par l'intermédiaire d'un tiers. Partager vos identifiants de connexion avec quelqu'un d'autre est interdit.</p>

            <h2 id="hors-ligne">Jouer hors ligne</h2>
            <p>Non : Area Universe se joue en ligne et demande une connexion Internet, dans l'application comme dans le navigateur. Si la connexion se coupe, le jeu affiche « Reconnexion… » et reprend dès qu'elle revient.</p>
            <p>En revanche, la partie continue sans vous : vos planètes produisent jusqu'à leur plafond de stockage, vos constructions, recherches et flottes avancent… et vos adversaires peuvent vous attaquer. Activez les <a href="/wiki/notifications">notifications push</a> pour être prévenu.</p>
            <ul>
                <li>Après <strong>8 jours</strong> sans connexion, votre commandant passe en <a href="/wiki/ia_bots">pilote automatique</a>.</li>
                <li>Un <strong>compte d'essai</strong> (créé avec « Tester sans email ») est supprimé après <strong>7 jours</strong> sans jouer, sauf s'il est lié à Google Play Jeux dans l'application Android. Pour le garder, validez-le depuis l'entrée <strong>Valider compte</strong> du menu.</li>
            </ul>

            <h2 id="plateformes">Sur quels appareils jouer ?</h2>
            <ul>
                <li><strong>Ordinateur</strong> : dans un navigateur récent (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong> : dans l'application Area Universe de Google Play. Un navigateur Android est renvoyé vers Google Play quand il veut entrer dans le jeu. L'application se joue à l'horizontale.</li>
                <li><strong>iPhone et iPad</strong> : il n'existe pas d'application ; jouez dans le navigateur.</li>
                <li><strong>Consoles</strong> (PlayStation, Xbox, Switch…) : il n'existe aucune version console.</li>
            </ul>
            <p>Votre compte est le même partout : connectez-vous avec les mêmes identifiants pour retrouver votre partie sur un autre appareil.</p>

            <h2 id="langues">Langues disponibles</h2>
            <p>Le jeu existe en <strong>six langues</strong> : français, anglais, allemand, espagnol, portugais et russe. Ce wiki aussi.</p>
            <p>Pour changer de langue : sur ordinateur, touchez le drapeau en bas du menu ; sur téléphone, ouvrez le bouton <strong>Menu</strong>, puis choisissez un drapeau sur la ligne <strong>Langue</strong>. Votre choix est enregistré sur votre compte : vos notifications push arrivent aussi dans cette langue.</p>

            <h2 id="pseudo">Changer de pseudo</h2>
            <p>Votre pseudo est celui de votre commandant : il est <strong>propre à chaque serveur</strong>. Pour le changer, ouvrez <strong>Préférences</strong>, section <strong>Identité</strong>, champ <strong>Pseudonyme</strong> (3 à 15 caractères ; la première lettre est mise en majuscule), puis <strong>Sauvegarder</strong>. Le changement est immédiat et possible à tout moment, à condition que ce pseudo ne soit pas déjà pris sur le serveur. Il faut avoir créé votre héros pour pouvoir sauvegarder.</p>
            <p>Votre identifiant de connexion, lui, est votre adresse e-mail. Elle se change dans <strong>Options</strong> (page « Mes options », Changer l'email) : un lien de confirmation part à la nouvelle adresse, et l'ancienne reste active tant que vous n'avez pas cliqué dessus. Le mot de passe se change au même endroit.</p>

            <h2 id="contact">Contacter l'équipe</h2>
            <ul>
                <li><strong>Par e-mail</strong> : <strong>support@areauniverse.com</strong>, pour une question de compte, de paiement ou de données personnelles.</li>
                <li><strong>Sur Discord</strong> : le serveur communautaire d'Area Universe (discord.gg/bpwWyS8), dont le lien figure en bas des pages du site, à côté de Facebook, Telegram et LinkedIn. En liant votre compte Discord dans <strong>Mes options</strong>, vous y recevez le rôle de vos alliances et l'alerte « Flotte ennemie en approche » en message privé.</li>
                <li><strong>Pour un bug</strong> : utilisez de préférence le bouton <strong>Erreur</strong> du jeu (voir ci-dessous) ; votre rapport arrive directement à l'équipe, avec la page où vous étiez.</li>
            </ul>

            <h2 id="bug">Signaler un bug</h2>
            <p>Touchez le bouton <strong>Erreur</strong> (icône d'insecte) : en bas du menu sur ordinateur ; sur téléphone, bouton <strong>Menu</strong>, puis <strong>Erreur</strong>. Dans la fenêtre <strong>Rapporter une erreur</strong> :</p>
            <ol>
                <li>décrivez ce qui s'est passé et ce que vous faisiez (2&nbsp;000 caractères au plus) ;</li>
                <li>joignez si possible une image (JPEG, PNG ou WebP, 5&nbsp;Mo au plus) ; dans l'application, le bouton <strong>Capturer l'écran</strong> le fait pour vous ;</li>
                <li>touchez <strong>Envoyer</strong>.</li>
            </ol>
            <p>La page où vous étiez et le type d'appareil sont joints automatiquement. Vous pouvez envoyer jusqu'à 10 rapports par jour. Pour un joueur qui triche ou insulte, utilisez plutôt le <a href="/wiki/moderation_blocking">signalement</a>.</p>

            <h2 id="achats">Achats et remboursements</h2>
            <p>Le jeu est gratuit. Le seul achat proposé aujourd'hui est l'accès à un <strong>Paid Server</strong> (serveur compétitif payant) : <strong>5&nbsp;€</strong>, payés une seule fois par serveur, par carte bancaire, avant d'y entrer ; il faut un compte validé. Les <strong>Bitcoins</strong> du jeu ne s'achètent pas avec de l'argent réel : ils se gagnent uniquement en jouant. Les notifications push sont gratuites.</p>
            <p>Pour un problème de paiement (paiement débité mais accès non débloqué, demande de remboursement), écrivez à <strong>support@areauniverse.com</strong> en indiquant l'adresse e-mail de votre compte, le serveur concerné et la date du paiement. Les conditions d'utilisation prévoient qu'aucun remboursement n'est accordé une fois le service payant utilisé, sauf droit de rétractation ou cas exceptionnel examiné par le support. Supprimer votre compte ne rembourse aucun achat en cours.</p>

            <h2 id="compte-supprime">Récupérer un compte supprimé</h2>
            <p>Aucune fonction du jeu ne permet de récupérer un compte supprimé : la <a href="/wiki/account_deletion">suppression de compte</a> est définitive et vos données personnelles sont effacées sur-le-champ. Pour rejouer, créez un nouveau compte. Si vous pensez qu'il y a eu une erreur, écrivez à <strong>support@areauniverse.com</strong>.</p>
            <p>Un compte d'essai supprimé faute d'avoir joué pendant 7 jours ne se récupère pas non plus.</p>
            <p>Vous avez seulement oublié votre mot de passe ? Sur l'écran de connexion, touchez l'icône clé (<strong>Mot de passe oublié</strong>) et saisissez votre adresse e-mail : un lien de réinitialisation vous est envoyé.</p>

            <h2 id="rapports">Supprimer ou archiver des rapports</h2>
            <p>Dans la page <strong>Rapport</strong>, ouvrez un rapport puis touchez <strong>Supprimer</strong> : il disparaît aussitôt, sans confirmation ni corbeille. La suppression se fait un rapport à la fois ; il n'y a ni archivage ni suppression groupée. Pour faire le ménage dans les non-lus, <strong>Marquer tout comme lu</strong> traite tous vos rapports d'un coup. Les rapports ne s'effacent pas d'eux-mêmes avec le temps.</p>
            <p>Les messages privés de la <strong>Messagerie</strong>, eux, ne peuvent pas être supprimés.</p>

