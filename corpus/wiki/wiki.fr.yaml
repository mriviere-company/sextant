articles:
    moderation_blocking:
        title: "Modération : signaler et bloquer"
        category: "beginner"
        order: 12
        tags: "moderation,signalement,blocage,salon,messages,conditions,sanction"
        summary: "Signalez un message abusif, bloquez un joueur indésirable, voyez ce que fait la modération et retrouvez les règles que chacun accepte à la première connexion."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="conditions">Conditions d'utilisation</h2>
            <p>À la première connexion, chaque joueur accepte les <strong>conditions d'utilisation</strong> et les règles de la communauté : respect des autres joueurs (ni harcèlement, ni insultes, ni discours haineux), aucun contenu illégal, obscène ou diffamatoire dans les salons, les messages et les noms, pas de triche, de multi-compte abusif ni d'exploitation de bugs. Refuser vous déconnecte. Si les conditions évoluent, elles devront être acceptées à nouveau.</p>

            <h2 id="signaler">Signaler un message</h2>
            <p>Chaque message d'un autre joueur dans les salons, et chaque message privé reçu (sauf ceux envoyés en anonyme), porte une icône <strong>drapeau</strong>. Un clic ouvre le choix du motif : <strong>Insultes / Harcèlement</strong>, <strong>Spam</strong> ou <strong>Autre contenu inapproprié</strong>. Le signalement part à l'équipe de modération, avec une copie du message.</p>
            <p>Un joueur peut aussi être signalé depuis son profil, bouton <strong>Signaler</strong> : Multicompte, Insultes / Harcèlement, Triche, Spam ou Autre.</p>
            <p>Limites : <strong>trois signalements par jour</strong> (le compteur repart à minuit, heure de Paris) et <strong>un seul signalement par joueur, définitivement</strong>, qu'il passe par un drapeau ou par son profil. Au-delà, le jeu affiche « Vous avez déjà signalé ce joueur, ou atteint la limite quotidienne de signalements ».</p>

            <h2 id="moderation">Ce que fait la modération</h2>
            <p>Un signalement ne déclenche aucune sanction automatique : chacun est examiné par l'équipe de modération, qui voit aussi qui l'a envoyé. Multiplier les signalements contre un joueur ne suffit donc pas à le faire sanctionner, et un signalement abusif n'a aucun effet direct sur la personne visée.</p>
            <p>Selon la gravité, la modération peut interdire à un joueur, pour une durée donnée, d'écrire dans les salons et par message privé, ou bannir son compte.</p>

            <h2 id="bloquer">Bloquer un joueur</h2>
            <p>Le bouton <strong>Bloquer</strong> du profil d'un joueur masque immédiatement tous ses messages dans les salons de discussion et empêche tout échange de messages privés, dans les deux sens. Le blocage vise son compte : il vaut sur tous les serveurs où vous le croisez.</p>
            <p>La liste des joueurs bloqués se gère dans <strong>Options</strong> (section « Joueurs bloqués ») : chaque joueur peut y être débloqué à tout moment avec le bouton <strong>Débloquer</strong>.</p>
    getting_started:
        title: "Premiers pas"
        category: "beginner"
        order: 1
        tags: "debut,commencer,nouveau,tutoriel,guide"
        summary: "Bienvenue ! Le guide le plus court pour comprendre Area Universe et réussir vos premières heures de jeu."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">C'est quoi Area Universe ?</h2>
            <p>Area Universe est un jeu de <strong>stratégie spatiale multijoueur</strong>. Vous dirigez un empire : vos planètes produisent des ressources, vos vaisseaux parcourent la galaxie, et vos alliances scellent le destin des joueurs.</p>
            <p>C'est un jeu <strong>qui se joue sur la durée</strong> : vos ressources s'accumulent même quand vous êtes hors ligne. Quelques minutes par jour suffisent pour progresser.</p>

            <h2 id="objectif">Votre objectif</h2>
            <p>Selon le mode de serveur choisi (voir l'article <em>Modes de jeu</em>), le but final varie : tenir le plus longtemps, dominer le classement, être le dernier debout, etc. Mais la recette est toujours la même :</p>
            <ol>
                <li><strong>Faire tourner une économie</strong> (ressources + monnaie).</li>
                <li><strong>Bâtir une flotte et une défense</strong>.</li>
                <li><strong>Vous allier</strong> pour peser à plusieurs.</li>
            </ol>

            <h2 id="premieres-actions">Vos 6 premières actions</h2>
            <p>Votre planète de départ n'est pas vide : elle possède déjà une Mine de niobium et un Extracteur d'eau de niveau 3, un Chantier spatial, un Radar au sol et une petite flotte au sol (10 sondes, 5 chasseurs, 2 frégates et 1 colonisateur).</p>
            <ol>
                <li><strong>Montez votre Mine de niobium et votre Extracteur d'eau</strong> (page <em>Infrastructures</em>).</li>
                <li><strong>Ajoutez un Champ agricole</strong> : vos travailleurs mangent des rations (la nourriture du jeu).</li>
                <li><strong>Recherchez Redéfinition urbaine, puis construisez une Grande ville</strong> : +25&nbsp;000 travailleurs maximum par niveau. Les travailleurs sont vos pourvoyeurs de <em>Bitcoins</em> (la monnaie du jeu).</li>
                <li><strong>Construisez un Centre de recherche</strong> : il loge vos scientifiques, qui augmentent votre vitesse de recherche par paliers (voir <em>Travailleurs et scientifiques</em>).</li>
                <li><strong>Envoyez des cargos vendre vos surplus</strong> de niobium et d'eau à un marchand : sur la <em>Carte spatiale</em>, cliquez le marchand, puis <em>Interaction</em>, choisissez votre flotte de cargos et la mission <em>Décharger et revenir</em>. Le Cargo I demande la recherche <em>Gestion des cargaisons</em>.</li>
                <li><strong>Rejoignez une alliance</strong> : <strong>+20&nbsp;%</strong> sur la production de niobium, d'eau et de rations de toutes vos planètes, et accès aux recherches d'alliance.</li>
            </ol>
            <p>Pensez aussi à <strong>coloniser une 2e planète</strong> avec votre colonisateur de départ : aucune recherche n'est nécessaire (voir l'article <em>Coloniser une nouvelle planète</em>).</p>

            <h2 id="tutoriel">Le tutoriel intégré</h2>
            <p>Un <strong>tutoriel interactif</strong> vous guide pas à pas, en 5 chapitres : Premiers pas, Puissance militaire, Explorer et conquérir, Développer son économie, Diplomatie et communauté. À votre première connexion, vous choisissez votre parcours :</p>
            <table>
                <thead>
                    <tr><th>Parcours</th><th>Étapes</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Découverte complète</strong></td><td>18</td></tr>
                    <tr><td><strong>Parcours équilibré</strong></td><td>17 (sans le rappel sur le clic d'une planète)</td></tr>
                    <tr><td><strong>Direct au cœur du jeu</strong></td><td>8 (seulement ce qui est propre à Area Universe)</td></tr>
                    <tr><td><strong>Je découvre seul</strong></td><td>aucune</td></tr>
                </tbody>
            </table>
            <p>Les étapes, chapitre par chapitre (* = étapes du parcours <em>Direct au cœur du jeu</em>) :</p>
            <ol>
                <li><strong>Premiers pas</strong> : Vos ressources*, Protection débutant*, Votre Empire*.</li>
                <li><strong>Puissance militaire</strong> : Créer une flotte, Produire des vaisseaux, Améliorer vos vaisseaux*, Découvrir l'arène*, Organiser vos flottes en cohortes.</li>
                <li><strong>Explorer et conquérir</strong> : La carte spatiale, Sélectionner une planète, Interagir avec une planète, Coloniser une planète, Défendre vos planètes.</li>
                <li><strong>Développer son économie</strong> : Construire des bâtiments, Lancer une recherche.</li>
                <li><strong>Diplomatie et communauté</strong> : Rejoindre une alliance*, La Wiki*, Le Salon*.</li>
            </ol>
            <p>Certains modes retirent des étapes : celle des recherches en <em>Search &amp; Destroy</em> et en <em>Domination</em>, celles des recherches et de l'alliance en <em>Battle Royale</em>. Le compteur « Étape X sur N » du guide indique toujours le total de votre parcours.</p>
            <p>Chaque étape réussie donne une récompense. Quel que soit votre parcours, vous touchez au total <strong>232&nbsp;000 Bitcoins, 150 Légionnaires, 100 travailleurs, 500 points de guerre et 2 chasseurs</strong> : ce que votre parcours saute vous est versé en bonus à la fin (tout de suite avec <em>Je découvre seul</em>).</p>
            <ul>
                <li>Vous pouvez le quitter à tout moment (<em>Quitter le tutoriel</em>) et changer de parcours en cours de route ; les étapes déjà faites restent acquises.</li>
                <li>Pour le relancer : page <strong>Préférences</strong>, section <em>Tutoriel</em>.</li>
            </ul>

            <h2 id="a-surveiller">À surveiller dès le début</h2>
            <ul>
                <li><strong>Bitcoins positifs</strong> : chaque jour à <strong>18h59 (heure de Paris)</strong>, soit 17h59 UTC en hiver et 16h59 UTC en été, un bilan calcule vos revenus et vos coûts d'entretien. Si votre solde passe en négatif, c'est le <strong>Game Over économique</strong> : vous perdez toutes vos flottes et tous vos vaisseaux, et votre solde repart à 125&nbsp;000 Bitcoins (vous gardez vos planètes et vos bâtiments).</li>
                <li><strong>Stockage</strong> : si vos entrepôts sont pleins, la production s'arrête. Construisez des stocks en conséquence.</li>
                <li><strong>Quêtes journalières</strong> : 3 quêtes par jour (page <em>Objectifs</em>), chacune récompensée en points de guerre, et un bonus égal à leur récompense moyenne si vous les accomplissez toutes.</li>
            </ul>

            <h2 id="protection-debutant">La protection des débutants</h2>
            <p>Pendant vos premiers jours, vous êtes <strong>protégé</strong> : aucun joueur ne peut envoyer de flotte vers vos planètes. Personne ne peut donc vous attaquer, vous piller, vous envahir, vous bombarder ni même vous sonder ; un allié ne peut pas non plus vous livrer de ressources. Les flottes déjà en route vers vous sont renvoyées. De quoi bâtir vos premières bases tranquillement.</p>
            <p>La protection s'arrête dès que l'une de ces conditions est remplie :</p>
            <ul>
                <li><strong>7 jours</strong> se sont écoulés depuis la création de votre commandant.</li>
                <li>Vous possédez une <strong>4e planète</strong> (vos lunes ne comptent pas).</li>
                <li>Vous envoyez vous-même une <strong>mission offensive</strong> (pillage, invasion ou frappe nucléaire) : vous renoncez alors immédiatement à votre protection.</li>
                <li>Vous activez le <strong>mode attaque</strong> d'une de vos flottes.</li>
            </ul>
            <p>Dans les deux derniers cas, une fenêtre de confirmation vous prévient avant. Profitez de cette période pour monter une économie et une défense solides avant de vous lancer dans la bataille.</p>

    interface_guide:
        title: "Comprendre l'interface"
        category: "beginner"
        order: 2
        tags: "interface,ecran,menu,navigation,boutons,planete active,barre de ressources,rations,preferences,options"
        summary: "Les 3 zones de l'écran et comment naviguer sans vous perdre."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="disposition">Les 3 zones de l'écran</h2>
            <ul>
                <li><strong>La barre de ressources, en haut</strong> — vos ressources, vos Bitcoins, vos Points de Guerre, et le nom de votre <strong>planète active</strong> : touchez-le pour changer de planète.</li>
                <li><strong>Le menu</strong> — toutes les sections du jeu (Vue d'ensemble, Héros, Flottes, Planètes, Infrastructures, Carte spatiale, Alliance, Rapport, Messagerie, Salon…). Sa place dépend de votre écran (voir ci-dessous).</li>
                <li><strong>La zone centrale</strong> — le contenu de la page en cours (carte, liste de flottes, bâtiments…). C'est la seule zone qui défile.</li>
            </ul>
            <p>La place du menu dépend de votre écran :</p>
            <ul>
                <li><strong>Sur ordinateur</strong> : le menu complet est à gauche. Tout en bas, une rangée d'icônes ouvre le signalement d'erreur, le tutoriel (s'il est en cours), les <strong>Notifications</strong>, les <strong>Préférences</strong>, les <strong>Options</strong> de votre compte, votre <strong>profil cross-serveur</strong> et le choix de la <strong>langue</strong>.</li>
                <li><strong>Sur téléphone à l'horizontale et dans l'application Android</strong> : un rail d'icônes est collé au bord gauche. Il garde en permanence les cinq destinations principales — Vue d'ensemble, Carte spatiale, Infrastructures, Chantier spatial et Défense — et le bouton <strong>Menu</strong> (…), qui ouvre tout le reste dans un panneau qui monte du bas.</li>
                <li><strong>Sur tablette ou sur téléphone tenu à la verticale</strong> (dans un navigateur) : ces cinq destinations et le bouton <strong>Menu</strong> forment une barre en bas de l'écran.</li>
            </ul>
            <p>Le chiffre affiché sur le bouton Menu additionne vos nouveaux rapports, messages privés, messages de salon et duels d'arène en attente.</p>

            <h2 id="barre-ressources">La barre de ressources (en haut)</h2>
            <p>Elle affiche en temps réel les ressources de votre planète active :</p>
            <ul>
                <li><strong>Niobium</strong> — le minerai de base (bâtiments, vaisseaux).</li>
                <li><strong>Eau</strong> — indispensable à la construction et aux vaisseaux.</li>
                <li><strong>Rations</strong> (la nourriture) — consommées par vos travailleurs : 1 ration par heure pour 500 travailleurs. Si elles tombent à zéro, la famine tue d'abord des travailleurs, puis aussi des Légionnaires, et enfin des Mechas.</li>
                <li><strong>Uranium</strong> — ressource rare (bombes nucléaires, Base nucléaire, mises en arène). Il n'apparaît que si la planète en possède.</li>
            </ul>
            <p>Le niobium, l'eau, les rations et vos travailleurs avancent seconde par seconde au rythme de votre production, jusqu'à votre plafond de stockage ; les rations peuvent aussi baisser si vos travailleurs en mangent plus que vous n'en produisez. Touchez le niobium, l'eau ou les rations pour voir leur production horaire, bonus compris (héros, camp d'esclaves, alliance, lunes, embargo) ; pour les rations, c'est le bilan net, consommation déduite.</p>
            <p>Les <strong>Bitcoins</strong> (monnaie) et les <strong>Points de Guerre (PDG)</strong> s'affichent eux aussi dans la barre, ainsi que vos travailleurs, Légionnaires, scientifiques et Mechas, et la place occupée au sol (<strong>Terrain</strong>) et en orbite (<strong>Espace</strong>), sous la forme « occupé/maximum ».</p>
            <p><em>Sur téléphone, la barre est repliée : elle ne montre que le niobium, l'eau, les rations, l'uranium, les Bitcoins et les PDG, plus toute ressource en alerte (famine, menace en orbite). Le bouton flèche au bout de la barre, qui indique le nombre de ressources masquées, la déplie.</em></p>

            <h2 id="planete-active">Planète active : ce que ça veut dire</h2>
            <p>Quand vous avez plusieurs planètes, une seule est <strong>active</strong> à la fois. Toutes vos actions (construire, fabriquer un vaisseau, lancer une flotte) s'appliquent à cette planète.</p>
            <p>Pour en changer :</p>
            <ul>
                <li>touchez le nom de la planète dans la barre de ressources : la liste <strong>Mes planètes</strong> s'ouvre (dans un panneau qui monte du bas sur téléphone, juste sous la barre sur ordinateur) ; choisissez-en une ;</li>
                <li>ou utilisez les flèches ‹ et › de part et d'autre du nom pour passer à la planète précédente ou suivante.</li>
            </ul>
            <p>Vous restez sur la même page, affichée pour la nouvelle planète. L'ordre de la liste se règle dans <strong>Préférences</strong>, « Tri des planètes » : alphabétique, position, colonisation ou taille.</p>

            <h2 id="navigation">Se repérer rapidement</h2>
            <ul>
                <li><strong>Vue d'ensemble</strong> — votre commandant, vos flottes, vos finances, la recherche en cours et l'activité de toutes vos planètes.</li>
                <li><strong>Infrastructures</strong> — construire les bâtiments de la planète active.</li>
                <li><strong>Chantier spatial</strong> et <strong>Défense</strong> — produire vaisseaux et défenses sur la planète active.</li>
                <li><strong>Planètes</strong> — la liste de toutes vos planètes, et le marché.</li>
                <li><strong>Flottes</strong> — créer, envoyer et suivre vos vaisseaux.</li>
                <li><strong>Carte spatiale</strong> — explorer la galaxie.</li>
                <li><strong>Rapport</strong> — tout ce que le jeu vous signale (combats, arrivées, alliance…).</li>
                <li><strong>Messagerie</strong> — vos messages privés ; <strong>Salon</strong> — les salons de discussion.</li>
                <li><strong>Alliance</strong> — membres, banque, diplomatie, arène d'alliance.</li>
                <li><strong>Préférences</strong> — votre pseudo et vos réglages sur ce serveur ; <strong>Options</strong> — votre compte (e-mail, mot de passe, fuseau horaire, joueurs bloqués, liaison de votre compte Discord).</li>
                <li><strong>Serveur</strong> — changer de serveur.</li>
            </ul>
            <p>Selon le mode du serveur, certaines entrées n'apparaissent pas (Recherches, Alliance ou Cthulhu).</p>

    resources_intro:
        title: "Les ressources"
        category: "beginner"
        order: 3
        tags: "ressources,niobium,eau,nourriture,rations,uranium,production,stockage,cycle"
        summary: "Les 4 ressources du jeu, comment on les produit et pourquoi le stockage est critique."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Les 4 ressources du jeu</h2>
            <table>
                <thead>
                    <tr><th>Ressource</th><th>À quoi elle sert</th><th>Comment on l'obtient</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Niobium</strong></td><td>Construire bâtiments, vaisseaux et défenses</td><td>Mine de niobium</td></tr>
                    <tr><td><strong>Eau</strong></td><td>Construire bâtiments, vaisseaux et défenses</td><td>Extracteur d'eau</td></tr>
                    <tr><td><strong>Nourriture</strong> (« Rations » dans le jeu)</td><td>Nourrir vos travailleurs</td><td>Champ agricole et Ferme aéroponique (leurs productions s'additionnent)</td></tr>
                    <tr><td><strong>Uranium</strong></td><td>Base nucléaire, bombes nucléaires, intercepteurs, mises d'arène</td><td>Recyclage de débris d'uranium, victoires contre les Cthulhu</td></tr>
                </tbody>
            </table>
            <p>Seuls les <strong>travailleurs</strong> mangent : 1 ration par heure pour 500 travailleurs. Si les rations viennent à manquer, la famine tue des travailleurs, puis des Légionnaires et des Mechas si elle dure.</p>
            <p>À côté de ces ressources, le <strong>Bitcoin</strong> est la monnaie du jeu : il paie les recherches, les recrutements, le carburant des flottes et l'entretien quotidien (voir <a href="/wiki/bitcoin_economy">Bitcoins et entretien</a>).</p>

            <h2 id="cycle">Le cycle de production</h2>
            <p>Vos ressources arrivent automatiquement, en continu. Les quantités produites sont exprimées par <strong>cycle de production</strong>, et le jeu vous crédite au prorata du temps écoulé :</p>
            <ul>
                <li>Sur une <strong>planète</strong> : cycle de <strong>10 minutes</strong>.</li>
                <li>Sur une <strong>lune</strong> : cycle de <strong>1 minute</strong> (10 fois plus rapide, uniquement pour la nourriture).</li>
            </ul>
            <p>La production est <strong>proportionnelle au niveau</strong> du bâtiment. Par niveau et par cycle de 10 minutes :</p>
            <ul>
                <li><strong>Mine de niobium</strong> : 33 niobium ;</li>
                <li><strong>Extracteur d'eau</strong> : 22 eau ;</li>
                <li><strong>Champ agricole</strong> : 27 rations ;</li>
                <li><strong>Ferme aéroponique</strong> : 37 rations.</li>
            </ul>
            <p>Exemple : une Mine de niobium niveau 10 produit 330 niobium toutes les 10 minutes, soit 1&nbsp;980 par heure, avant bonus. La barre de ressources affiche votre production horaire réelle, bonus compris.</p>

            <h2 id="bonus">Ce qui améliore votre production</h2>
            <ul>
                <li><strong>Rejoindre une alliance</strong> : <strong>+20&nbsp;%</strong> immédiat sur le niobium, l'eau et les rations.</li>
                <li><strong>Recherches et améliorations d'alliance</strong> : la recherche « Loi Macron » (+7&nbsp;% par niveau, alliances de la Balance des Mondes) et les améliorations « Production de niobium », « Production d'eau » et « Production de rations » (+2&nbsp;% par niveau chacune).</li>
                <li><strong>Héros posté sur la planète</strong> : bonus tiré de son Intelligence, doublé pour un héros d'Économie.</li>
                <li><strong>Camp d'esclaves</strong> : +2,5&nbsp;% par niveau.</li>
            </ul>
            <p>La taille de la planète ne change pas ce que produit un niveau : la place disponible limite seulement le nombre de niveaux que vous pouvez construire.</p>

            <h2 id="stockage">Le stockage (ne pas négliger !)</h2>
            <p>Chaque planète a une <strong>capacité maximale</strong> de stockage, par ressource. <strong>Quand c'est plein, tout ce qui est produit en plus est perdu</strong>.</p>
            <p>Au départ, une planète stocke 200&nbsp;000 niobium, 180&nbsp;000 eau et 150&nbsp;000 rations. Pour augmenter la capacité :</p>
            <ul>
                <li><strong>Entrepôt de Niobium</strong> : +1&nbsp;200&nbsp;000 niobium par niveau ;</li>
                <li><strong>Réservoir d'eau</strong> : +800&nbsp;000 eau par niveau ;</li>
                <li><strong>Silo agricole</strong> : +800&nbsp;000 rations par niveau.</li>
            </ul>
            <p>Ils se débloquent avec la recherche <strong>Gestion des cargaisons</strong> niveau 1 ; le Silo agricole demande aussi la recherche <strong>Aéroponique</strong>. L'uranium, lui, n'a pas de limite de stockage.</p>
            <p><em>Conseil débutant :</em> vérifiez votre stockage <strong>avant</strong> de vous déconnecter pour la nuit. Rien de pire que de retrouver ses mines à l'arrêt pendant 10 heures.</p>

    bitcoin_economy:
        title: "Bitcoins et entretien"
        category: "beginner"
        order: 4
        tags: "bitcoin,monnaie,entretien,cout,bareme,carburant,economie,game over,rapport journalier"
        summary: "Le Bitcoin est la monnaie du jeu. Comment en gagner, et surtout comment éviter la faillite."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Le Bitcoin, c'est quoi ?</h2>
            <p>Le <strong>Bitcoin</strong> est la <strong>monnaie universelle</strong> d'Area Universe (rien à voir avec la vraie crypto, c'est juste un clin d'œil). Vous démarrez avec <strong>125&nbsp;000 Bitcoins</strong>. Ils servent à :</p>
            <ul>
                <li>Lancer des <strong>recherches</strong>.</li>
                <li>Recruter des <strong>Légionnaires</strong> (8 Bitcoins chacun), des <strong>Mechas</strong> (60) et des <strong>scientifiques</strong> (25), et fabriquer des <strong>bombes nucléaires</strong> (25&nbsp;000).</li>
                <li>Payer le <strong>carburant</strong> de chaque flotte que vous envoyez.</li>
                <li>Soutenir votre <strong>alliance</strong> : dépôts dans la trésorerie et investissements dans les améliorations d'alliance.</li>
                <li>Payer l'<strong>entretien quotidien</strong> de vos troupes, vaisseaux et bâtiments.</li>
            </ul>

            <h2 id="gagner">Comment en gagner ?</h2>
            <ul>
                <li><strong>Travailleurs</strong> — votre source principale. Au rapport journalier, chaque travailleur présent sur vos planètes rapporte <strong>0,5 Bitcoin</strong> : 10&nbsp;000 travailleurs = 5&nbsp;000 Bitcoins par jour, les 50&nbsp;000 travailleurs de votre planète de départ = 25&nbsp;000 Bitcoins par jour, avant les taxes d'alliance et de paix. Les travailleurs embarqués dans une flotte ne rapportent rien.</li>
                <li><strong>Vente aux marchands</strong> — livrez-leur du niobium, de l'eau, de l'uranium, et même des travailleurs ou des troupes, ou utilisez la vente en un clic de la page <strong>Planètes</strong> (voir <a href="/wiki/market">Marché et marchands</a>).</li>
                <li><strong>Points de Guerre</strong> — gagnés notamment avec les quêtes journalières, ils s'échangent sur la page <strong>Objectifs</strong> : 1 PDG = 1 Bitcoin.</li>
                <li><strong>Bonus de connexion</strong> — une somme à chaque première connexion du jour, multipliée si vous enchaînez les jours consécutifs.</li>
                <li><strong>Pillage</strong> — les raids rapportent du niobium, de l'eau et de l'uranium, que vous pouvez revendre.</li>
            </ul>

            <h2 id="entretien">L'entretien quotidien</h2>
            <p>Chaque jour à <strong>18h59 (heure de Paris)</strong>, soit 17h59 UTC en hiver et 16h59 UTC en été, le jeu calcule un bilan pour vous :</p>
            <ul>
                <li><strong>Revenus</strong> : ce que rapportent vos travailleurs.</li>
                <li><strong>Coûts</strong> : l'entretien de vos Légionnaires, Mechas, scientifiques, vaisseaux et bâtiments.</li>
                <li><strong>Bilan</strong> : revenus − taxes − coûts, ajouté (ou retranché) à votre solde.</li>
            </ul>
            <p>Tout ce qui est <strong>dans une flotte</strong> — en vol <em>ou</em> stationnée en orbite — coûte bien plus cher que ce qui est <strong>au sol</strong> sur une planète : 6 fois plus pour les vaisseaux et les Légionnaires, 50 fois plus pour les Mechas. Une flotte qui ne sert pas : mettez-la au sol. Une grosse armée en balade permanente finit par ruiner les plus prudents.</p>

            <h2 id="bareme">Le barème de l'entretien</h2>
            <p>Montants en Bitcoins par jour.</p>
            <table>
                <thead>
                    <tr><th>Unité</th><th>Au sol</th><th>Dans une flotte</th></tr>
                </thead>
                <tbody>
                    <tr><td>Légionnaire</td><td>0,1</td><td>0,6</td></tr>
                    <tr><td>Mecha</td><td>2</td><td>100</td></tr>
                    <tr><td>Scientifique</td><td>3</td><td>2</td></tr>
                    <tr><td>Vaisseau</td><td>signature ÷ 12</td><td>signature ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Exemples : 10&nbsp;000 Légionnaires coûtent 1&nbsp;000 Bitcoins par jour au sol, 6&nbsp;000 dans une flotte. 100 Cargo X (signature 50 chacun) coûtent environ 417 Bitcoins par jour au sol, 2&nbsp;500 dans une flotte.</p>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Par niveau</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mine de niobium, Extracteur d'eau, Champ agricole</td><td>1</td></tr>
                    <tr><td>Ferme aéroponique</td><td>2</td></tr>
                    <tr><td>Grande ville, Radar au sol</td><td>13</td></tr>
                    <tr><td>Métropole</td><td>26</td></tr>
                    <tr><td>Entrepôt de Niobium, Réservoir d'eau, Silo agricole</td><td>30</td></tr>
                    <tr><td>Centre de recherche</td><td>53</td></tr>
                    <tr><td>Caserne</td><td>66</td></tr>
                    <tr><td>Chantier spatial</td><td>100</td></tr>
                    <tr><td>Radar d'espace</td><td>133</td></tr>
                    <tr><td>Usine d'armement, Ville flottante, Station orbitale</td><td>333</td></tr>
                    <tr><td>Brouilleur de radar</td><td>400</td></tr>
                    <tr><td>Industrie lourde</td><td>666</td></tr>
                    <tr><td>Fort défensif</td><td>800</td></tr>
                    <tr><td>Base nucléaire</td><td>3&nbsp;333</td></tr>
                    <tr><td>Prison, Camp d'esclaves</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Exemple : un Fort défensif niveau 3 coûte 2&nbsp;400 Bitcoins par jour. Les défenses planétaires (tourelles, boucliers) et les travailleurs n'ont pas d'entretien. Les recherches d'alliance « Structure soviétique », « Supériorité mécanique » et « Engouement scientifique » réduisent l'entretien des Légionnaires, des Mechas et des scientifiques.</p>

            <h2 id="faillite">Attention : le Game Over économique</h2>
            <p>Si, après ce bilan quotidien, votre solde de Bitcoins tombe <strong>en négatif</strong>, c'est le <strong>Game Over économique</strong> :</p>
            <ul>
                <li>Toutes vos <strong>flottes</strong> sont supprimées, en vol comme en orbite, avec leur cargaison et les troupes à bord.</li>
                <li>Tous les <strong>vaisseaux au sol</strong> de vos planètes sont perdus.</li>
                <li>Votre solde est remis à <strong>125&nbsp;000 Bitcoins</strong>.</li>
            </ul>
            <p>Vous gardez vos planètes, bâtiments, défenses, recherches et les troupes restées au sol. Un rapport « Faillite imminente » vous prévient à l'avance (voir <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Règle d'or :</em> ne recrutez pas une armée plus chère que ce que vos travailleurs peuvent financer.</p>

    first_buildings:
        title: "Construire ses premiers bâtiments"
        category: "beginner"
        order: 5
        tags: "batiments,construction,mine,extracteur,champ agricole,grande ville,debutant,emplacement"
        summary: "L'ordre recommandé de construction pour bien démarrer votre planète de départ."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">L'ordre conseillé (les 10 premiers bâtiments)</h2>
            <p>Votre planète de départ possède déjà une Mine de niobium et un Extracteur d'eau niveau 3, un Chantier spatial et un Radar au sol niveau 1, 50&nbsp;000 travailleurs et 125&nbsp;000 rations d'avance.</p>
            <ol>
                <li><strong>Mine de niobium</strong> — montez-la : c'est votre première source de matière première.</li>
                <li><strong>Extracteur d'eau</strong> — indispensable pour tout construire derrière.</li>
                <li><strong>Champ agricole</strong> — produit les rations qui nourrissent vos travailleurs.</li>
                <li><strong>Grande ville</strong> — +25&nbsp;000 travailleurs maximum (vous démarrez au plafond de 50&nbsp;000). Demande la recherche <strong>Redéfinition urbaine</strong> niveau 1.</li>
                <li><strong>Mine de niobium et Extracteur d'eau</strong> encore plus haut — augmentez la production avant d'aller plus loin.</li>
                <li><strong>Centre de recherche</strong> — loge vos scientifiques (250 par niveau). Il n'est pas nécessaire pour lancer une recherche.</li>
                <li><strong>Chantier spatial</strong> — vous en avez déjà un ; chaque niveau accélère la production de vaisseaux de 25&nbsp;%. Monter de niveau demande la recherche <strong>Industrie</strong> niveau 1.</li>
                <li><strong>Caserne</strong> — +5&nbsp;000 Légionnaires maximum par niveau (2&nbsp;000 sans caserne). Demande la recherche <strong>Accroissement militaire</strong> niveau 1.</li>
                <li><strong>Entrepôt de Niobium</strong>, <strong>Réservoir d'eau</strong>, <strong>Silo agricole</strong> — évitez que la production sature. Demandent la recherche <strong>Gestion des cargaisons</strong> niveau 1 (et <strong>Aéroponique</strong> pour le Silo).</li>
                <li><strong>Métropole</strong> — +80&nbsp;000 travailleurs maximum par niveau. Demande la recherche <strong>Redéfinition urbaine</strong> niveau 5.</li>
            </ol>
            <p>Coûts, durées et place occupée de chaque bâtiment : voir <a href="/wiki/buildings">Les bâtiments</a>.</p>

            <h2 id="file-attente">Une seule construction à la fois</h2>
            <p>Chaque planète a <strong>une seule file de construction</strong>. Pendant qu'un bâtiment monte de niveau, les autres doivent attendre. Planifiez en conséquence.</p>
            <p>Plusieurs planètes = plusieurs files parallèles : c'est pour ça que la colonisation accélère votre progression.</p>

            <h2 id="espace">L'espace disponible sur une planète</h2>
            <p>Chaque planète a un nombre limité d'<strong>emplacements au sol</strong> et d'<strong>emplacements en ciel</strong>. <strong>Chaque niveau</strong> de bâtiment occupe des emplacements, montée de niveau comprise : une Mine de niobium prend 1 emplacement au sol par niveau, une Grande ville 6, une Métropole 6 au sol et 6 en ciel.</p>
            <ul>
                <li>Les emplacements utilisés et disponibles s'affichent sur la carte de chaque planète (page <strong>Planètes</strong>) et sur la page <strong>Infrastructures</strong>.</li>
                <li>Le ciel sert à la Métropole, à la Ferme aéroponique, au Chantier spatial, au Radar d'espace et au Brouilleur de radar. Les défenses (tourelles, boucliers) n'occupent aucun emplacement.</li>
                <li>Pour agrandir une planète : <strong>Ville flottante</strong> (+10 emplacements au sol par niveau) et <strong>Station orbitale</strong> (+5 en ciel par niveau), 5 de chaque au maximum par planète. Elles coûtent 2&nbsp;000 Points de Guerre × le niveau et se débloquent avec la recherche <strong>Expansion territoriale</strong> (niveau 1 puis 2), accessible après Terraformation niveau 18.</li>
                <li>Plus d'emplacement libre = plus aucune construction ni montée de niveau sur cette planète.</li>
            </ul>

    first_fleet:
        title: "Créer sa première flotte"
        category: "beginner"
        order: 6
        tags: "flotte,vaisseaux,premiere,creation,debutant,chantier,cargo,sonde"
        summary: "Fabriquer un vaisseau, composer une flotte et l'envoyer à destination : le pas-à-pas."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut avant</h2>
            <ul>
                <li>Un <strong>Chantier spatial</strong> construit sur votre planète.</li>
                <li>Les ressources du vaisseau : le plus souvent du <strong>niobium</strong>, de l'<strong>eau</strong> et des <strong>travailleurs</strong> (votre planète en garde toujours 5&nbsp;000 en réserve, intouchables). Quelques vaisseaux demandent aussi des Points de Guerre, des Bitcoins ou des Légionnaires (voir l'article <em>Types de vaisseaux</em>).</li>
                <li>La <strong>recherche</strong> qui débloque le vaisseau. Exemple : les cargos demandent <em>Gestion des cargaisons</em> (niveau 1 pour le Cargo I), elle-même accessible avec <em>Vaisseaux utilitaires</em> niveau 2. La Sonde, elle, ne demande aucune recherche.</li>
            </ul>

            <h2 id="fabriquer">Étape 1 — Fabriquer des vaisseaux</h2>
            <p>Rendez-vous sur la page <strong>Chantier spatial</strong> (menu de gauche), onglet <strong>Construction de vaisseaux</strong>. Choisissez un vaisseau, indiquez une quantité et cliquez sur <strong>Construire</strong>. Un vaisseau encore verrouillé indique la recherche ou le bâtiment qui lui manque.</p>
            <p>La fabrication prend du temps : vous pouvez continuer à jouer pendant.</p>

            <h2 id="composer">Étape 2 — Composer et envoyer une flotte</h2>
            <ol>
                <li>Sur la page <strong>Flottes</strong>, cliquez sur <strong>Créer une nouvelle flotte</strong>, choisissez les vaisseaux à embarquer (le stock au sol est affiché) et donnez un nom à la flotte (12 caractères au plus).</li>
                <li>Cliquez sur le nom de la flotte pour ouvrir sa page. L'onglet <strong>Fret</strong> sert à charger des ressources quand la flotte se trouve sur une de vos planètes.</li>
                <li>Envoyez-la :
                    <ul>
                        <li>pour un simple déplacement (mission <strong>Normal</strong>) ou un espionnage, onglet <strong>Déplacer la flotte</strong> : saisissez la destination dans les champs galaxie, système et planète (par ex. <code>1:5:12</code>) ou choisissez l'une de « Mes planètes », vérifiez le coût et la durée estimés, puis cliquez sur <strong>Envoyer</strong> ;</li>
                        <li>pour les autres missions (Décharger et revenir, Coloniser, Piller, Envahir…), passez par la <strong>Carte spatiale</strong> : cliquez sur la case visée, puis sur <strong>Interaction</strong>, choisissez la flotte et la mission, et cliquez sur <strong>Envoyer</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>Le carburant se paie en <strong>Bitcoins</strong>, au départ (voir l'article <em>Déplacement et distance</em>). Les missions sont détaillées dans l'article <em>Types de missions</em>.</p>

            <h2 id="premiers-vaisseaux">Les bons vaisseaux pour débuter</h2>
            <ul>
                <li><strong>Cargo I</strong> — transport de ressources (3&nbsp;000 de capacité). Le vaisseau idéal pour vendre aux marchands.</li>
                <li><strong>Sonde</strong> — espionne les planètes adverses. À envoyer <em>avant</em> toute attaque.</li>
                <li><strong>Chasseur</strong> — premier vaisseau de combat, bon marché (25 niobium, 5 eau et 1 travailleur).</li>
                <li><strong>Recycleur</strong> — collecte les débris après un combat. Très rentable, mais lent : ajouté à une flotte de chasseurs, il triple sa durée de vol.</li>
            </ul>

            <h2 id="premiere-cible">Idée de première mission</h2>
            <p>Remplissez 1 cargo de niobium ou d'eau, puis envoyez-le depuis la <strong>Carte spatiale</strong> en mission <strong>Décharger et revenir</strong> vers un marchand. Les marchands se trouvent dans 20 secteurs fixes de chaque galaxie (les quatre coins 1, 10, 91 et 100, puis 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 et, au centre, 45, 46, 55 et 56), à une position qui change d'un secteur à l'autre : repérez-les sur la carte.</p>
            <p>Le marchand vous paie en Bitcoins et le cargo revient tout seul. L'aller coûte le double d'un trajet normal et le retour se paie à son départ, au tarif normal : pour un seul Cargo I, comptez 0 à 2 Bitcoins à l'aller et 0 ou 1 au retour.</p>

    first_combat:
        title: "Votre premier combat"
        category: "beginner"
        order: 7
        tags: "combat,premier,attaque,rapport,debutant,rounds"
        summary: "Comment déclencher un combat spatial, ce qui se passe pendant, et ce qu'il faut faire après."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Se préparer (important !)</h2>
            <ol>
                <li><strong>Envoyez une sonde</strong> sur la cible pour évaluer ses défenses. Perdre 10 chasseurs à l'aveugle, c'est jetable ; perdre 100, ça pique.</li>
                <li><strong>Composez une flotte adaptée</strong> : assez de puissance de feu, et pensez à ajouter un <strong>recycleur</strong> pour collecter les débris.</li>
                <li><strong>Vérifiez votre entretien</strong> : chaque jour, un vaisseau coûte sa signature ÷ 2 en Bitcoins tant qu'il est dans une flotte (en vol ou stationnée), contre sa signature ÷ 12 au sol. Remettez au sol ce qui ne sert pas.</li>
            </ol>

            <h2 id="enchainement">Ce qui se passe étape par étape</h2>
            <ol>
                <li><strong>Vous activez le mode attaque</strong> de votre flotte (case « mode attaque » de la gestion de flotte ; il faut des armes de vaisseau), puis vous l'envoyez en mission <em>Normal</em> sur les coordonnées d'un ennemi. Le carburant se paie en Bitcoins au départ.</li>
                <li><strong>Elle voyage</strong> — le temps de trajet s'affiche dans la page Flottes. Pendant les <strong>2 minutes</strong> qui suivent le départ, le bouton « Annuler » la ramène aussitôt à sa planète de départ (le carburant payé n'est pas rendu) ; passé ce délai, elle ira jusqu'au bout.</li>
                <li><strong>Arrivée</strong> : s'il y a des flottes ennemies sur place, le combat est programmé <strong>5 minutes</strong> plus tard. Pendant ce délai, plus personne ne peut changer le mode attaque de ses flottes.</li>
                <li><strong>Combat en rounds</strong> : les deux camps échangent une salve par round, 100 rounds au maximum. Chaque salve se heurte d'abord au bouclier adverse, mais une part le traverse toujours.</li>
                <li><strong>Fin du combat</strong> : un camp est éliminé, ou les 100 rounds sont atteints. Dans ce cas, le camp qui conserve <strong>le plus d'armure</strong> l'emporte (à égalité parfaite, l'attaquant gagne).</li>
            </ol>

            <h2 id="apres-combat">Après le combat</h2>
            <ul>
                <li>Un <strong>rapport de combat</strong> vous est envoyé : menu <strong>Rapport</strong>, onglet <strong>Combats</strong>.</li>
                <li>Les vaisseaux détruits laissent des <strong>débris</strong> sur place. Envoyez des recycleurs !</li>
                <li>Le vainqueur gagne des <strong>Points de Guerre (PDG)</strong> selon la flotte ennemie détruite ; le vaincu touche une petite consolation (voir <em>Combat spatial</em>).</li>
                <li>Votre flotte survivante <strong>reste en orbite</strong> sur le lieu du combat : renvoyez-la vous-même. Si elle compte des recycleurs avec de la place en soute, ils commencent aussitôt à ramasser les débris.</li>
            </ul>

            <h2 id="erreurs">Les erreurs classiques à éviter</h2>
            <ul>
                <li>Attaquer sans sonder d'abord.</li>
                <li>Oublier que les rounds s'arrêtent à 100 : une cible trop solide que vous n'entamez pas assez garde plus d'armure que vous et gagne.</li>
                <li>Ne pas envoyer de recycleur : vos adversaires récupéreront <em>vos</em> débris avant vous.</li>
            </ul>

    tips:
        title: "Astuces pour bien débuter"
        category: "beginner"
        order: 8
        tags: "astuces,conseils,strategie,debutant"
        summary: "15 conseils qui font toute la différence dans vos premiers jours."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Économie</h2>
            <ul>
                <li><strong>Maximisez vos travailleurs</strong> : c'est votre source principale de Bitcoins.</li>
                <li><strong>Ne construisez pas trop tôt</strong> une grosse armée : elle vous ruinera en entretien.</li>
                <li><strong>Recherchez Redéfinition urbaine, puis construisez des Grandes villes et des Metropoles</strong> pour augmenter la population.</li>
                <li><strong>Surveillez votre rapport journalier</strong> : si vos coûts dépassent vos revenus, réagissez tout de suite.</li>
                <li><strong>Vendez vos surplus aux marchands</strong> plutôt que de laisser le stockage saturer.</li>
            </ul>

            <h2 id="militaire">Militaire</h2>
            <ul>
                <li><strong>Toujours une défense sur chaque planète</strong> : Légionnaires en caserne, Mechas, une ou deux tourelles.</li>
                <li><strong>Personnalisez vos vaisseaux chaque jour</strong> : vous pouvez dépenser jusqu'à 40 points d'amélioration par jour (coque, bouclier, armes, précision), pris dans le crédit propre à chaque type de vaisseau.</li>
                <li><strong>Les recycleurs sont très rentables</strong> : après chaque combat, récupérez les débris. Ajoutez des cargos à la flotte : un recycleur seul ne transporte que 1&nbsp;000 ressources.</li>
                <li><strong>Sondez avant d'attaquer</strong> : une sonde ne coûte que 1&nbsp;000 niobium (vous en avez 10 au départ), une flotte perdue coûte cher. Sachez que la cible est prévenue de l'espionnage.</li>
                <li><strong>Attention au plafond des 100 rounds</strong> : si aucun camp n'est détruit au bout de 100 tours, celui qui garde le plus d'armure l'emporte (l'attaquant en cas d'égalité parfaite).</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Rejoignez une alliance rapidement</strong> : +20&nbsp;% de production de niobium, d'eau et de rations, accès à la diplomatie et aux recherches d'alliance.</li>
                <li><strong>Complétez vos quêtes journalières</strong> (page <em>Objectifs</em>) : chacune rapporte des points de guerre (PDG), et les accomplir toutes rapporte en plus leur récompense moyenne au rapport suivant.</li>
                <li><strong>Discutez dans le salon d'alliance</strong> : coordonner deux attaques vaut mieux qu'en tenter une seule.</li>
                <li><strong>Connectez-vous chaque jour</strong> : le bonus de connexion monte en flèche avec la série de 7 jours consécutifs.</li>
                <li><strong>Activez les notifications push</strong> : vous saurez dès qu'une flotte ennemie fonce sur vous.</li>
            </ul>

    resources:
        title: "Ressources en détail"
        category: "economy"
        order: 1
        tags: "ressources,niobium,eau,nourriture,uranium,production,stockage,cycle,rations"
        summary: "Tout comprendre sur les ressources : production, bonus, stockage et cas particulier de l'uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Rappel : les 4 ressources</h2>
            <ul>
                <li><strong>Niobium</strong> — construction (bâtiments, vaisseaux, défenses).</li>
                <li><strong>Eau</strong> — construction (bâtiments, vaisseaux, défenses). Le carburant des flottes, lui, se paie en Bitcoins.</li>
                <li><strong>Nourriture</strong> (« Rations » dans le jeu) — mangée par vos travailleurs, et par eux seuls : 1 ration par heure pour 500 travailleurs. Une famine tue aussi Légionnaires et Mechas.</li>
                <li><strong>Uranium</strong> — Base nucléaire, bombes nucléaires, intercepteurs, mises d'arène. Rare et précieux.</li>
            </ul>

            <h2 id="production">Comment la production se calcule</h2>
            <p>La production est exprimée par tranche de <strong>10 minutes</strong> (le cycle de production d'une planète) et créditée au prorata du temps écoulé. Elle dépend :</p>
            <ul>
                <li>du <strong>niveau</strong> du bâtiment producteur : par niveau et par 10 minutes, Mine de niobium 33 niobium, Extracteur d'eau 22 eau, Champ agricole 27 rations, Ferme aéroponique 37 rations ;</li>
                <li>de vos <strong>bonus</strong> (alliance, recherche « Loi Macron », améliorations d'alliance, héros, Camp d'esclaves).</li>
            </ul>
            <p>Exemple : un Extracteur d'eau niveau 8 produit 8 × 22 = 176 eau par 10 minutes, soit 1&nbsp;056 par heure ; dans une alliance (+20&nbsp;%), 1&nbsp;267 par heure. La taille de la planète ne change pas ce que produit un niveau : elle limite seulement le nombre de niveaux que vous pouvez construire.</p>
            <p>Les <strong>lunes</strong> produisent de la nourriture <strong>10 fois plus vite</strong> (cycle d'1 minute).</p>
            <p>Même <strong>sans bâtiment producteur</strong> — ou si vous le détruisez jusqu'au niveau 0 — une planète conserve une <strong>production de base minimale</strong> : <strong>7 niobium, 6 eau et 9 rations</strong> par cycle (20 rations sur votre planète de départ). Dès le niveau 1, la production du bâtiment remplace ce minimum : elle ne s'y ajoute pas.</p>
            <p>Pour la nourriture, le <strong>Champ agricole</strong> et la <strong>Ferme aéroponique</strong> <strong>s'additionnent</strong> : leurs productions se cumulent.</p>

            <h2 id="bonus">Ce qui augmente votre production</h2>
            <table>
                <thead>
                    <tr><th>Source</th><th>Effet</th></tr>
                </thead>
                <tbody>
                    <tr><td>Appartenance à une alliance</td><td>+20&nbsp;% sur le niobium, l'eau et les rations</td></tr>
                    <tr><td>Recherche d'alliance « Loi Macron » (Balance des Mondes)</td><td>+7&nbsp;% par niveau, jusqu'au niveau 5</td></tr>
                    <tr><td>Améliorations d'alliance « Production de niobium », « Production d'eau », « Production de rations »</td><td>+2&nbsp;% par niveau, jusqu'à +10&nbsp;%</td></tr>
                    <tr><td>Héros posté sur la planète</td><td>Bonus tiré de son Intelligence, doublé si c'est un héros d'Économie ; +20&nbsp;% de plus avec le trait « Magnat » (héros d'Économie niveau 15)</td></tr>
                    <tr><td>Camp d'esclaves</td><td>+2,5&nbsp;% par niveau, plus 1&nbsp;% par niveau de chaque prisonnier détenu (plafonné à 5&nbsp;% par niveau du camp)</td></tr>
                    <tr><td>Verdict d'un blocus Cthulhu</td><td>De +15&nbsp;% à −15&nbsp;% pour les membres d'une alliance, pendant une durée limitée</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Le stockage et ses pièges</h2>
            <p>Votre planète a une <strong>capacité maximale</strong> pour chaque ressource. Quand c'est plein, la production continue mais ce qui dépasse est perdu.</p>
            <p>Solutions : construire des <strong>Entrepôts de Niobium</strong>, <strong>Réservoirs d'eau</strong> et <strong>Silos agricoles</strong>, vendre l'excédent de niobium et d'eau aux marchands (les rations, elles, ne se vendent pas), ou envoyer les surplus à un autre joueur.</p>

            <p>La nourriture se transporte comme le niobium et l'eau : chargez des <strong>rations</strong> dans la soute d'une flotte (1 place par ration) pour ravitailler une autre planète. Au déchargement, le grenier ne dépasse jamais sa capacité : le surplus reste en soute.</p>

            <h2 id="uranium">L'uranium : le cas particulier</h2>
            <p>Aucun bâtiment ne produit d'uranium. Vous en obtenez :</p>
            <ul>
                <li>en <strong>recyclant</strong> des débris d'uranium sur la carte (repérés par leur icône spéciale) ;</li>
                <li>en <strong>battant des Cthulhu</strong> (missions PvE) ;</li>
                <li>en <strong>gagnant des défis d'arène</strong> avec mise d'uranium.</li>
            </ul>
            <p>L'uranium sert à construire la <strong>Base nucléaire</strong> (500 par niveau), à fabriquer des <strong>bombes nucléaires</strong> (500 chacune) et des <strong>intercepteurs</strong> (200 chacun), et à miser en <strong>arène</strong>. Il n'a pas de limite de stockage, se transporte en soute comme les autres ressources et se revend <strong>2&nbsp;000 Bitcoins l'unité</strong> aux marchands.</p>

    buildings:
        title: "Les bâtiments"
        category: "economy"
        order: 2
        tags: "batiments,construction,cout,mine,extracteur,champ agricole,grande ville,metropole,chantier,fort defensif,bunker,ville flottante,station orbitale"
        summary: "Catalogue complet des bâtiments par rôle, avec leurs coûts, leur durée et la place qu'ils occupent."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Production de ressources</h2>
            <p>Les noms ci-dessous sont ceux affichés sur la page <strong>Infrastructures</strong>. Chaque niveau occupe des emplacements au sol ou en ciel (voir la section « Coût des bâtiments » plus bas), et beaucoup de bâtiments demandent une recherche préalable.</p>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Produit</th><th>Remarque</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mine de niobium</td><td>Niobium</td><td>33 niobium par niveau et par 10 minutes.</td></tr>
                    <tr><td>Extracteur d'eau</td><td>Eau</td><td>22 eau par niveau et par 10 minutes.</td></tr>
                    <tr><td>Champ agricole</td><td>Rations</td><td>27 rations par niveau et par 10 minutes. 1 emplacement au sol par niveau.</td></tr>
                    <tr><td>Ferme aéroponique</td><td>Rations</td><td>37 rations par niveau et par 10 minutes, mais 1 emplacement <strong>en ciel</strong> par niveau (aucun au sol). Recherche Aéroponique requise. Sa production s'ajoute à celle du Champ agricole.</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Stockage</h2>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td>Entrepôt de Niobium</td><td>+1&nbsp;200&nbsp;000 niobium stockables par niveau. Recherche Gestion des cargaisons 1.</td></tr>
                    <tr><td>Réservoir d'eau</td><td>+800&nbsp;000 eau stockables par niveau. Recherche Gestion des cargaisons 1.</td></tr>
                    <tr><td>Silo agricole</td><td>+800&nbsp;000 rations stockables par niveau. Recherches Gestion des cargaisons 1 et Aéroponique.</td></tr>
                </tbody>
            </table>
            <p>Sans ces bâtiments, une planète stocke 200&nbsp;000 niobium, 180&nbsp;000 eau et 150&nbsp;000 rations.</p>

            <h2 id="population">Population et science</h2>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td>Grande ville</td><td>+25&nbsp;000 travailleurs maximum et environ +8&nbsp;000 travailleurs par jour, par niveau. Recherche Redéfinition urbaine 1.</td></tr>
                    <tr><td>Métropole</td><td>+80&nbsp;000 travailleurs maximum et environ +12&nbsp;000 travailleurs par jour, par niveau. Recherche Redéfinition urbaine 5.</td></tr>
                    <tr><td>Centre de recherche</td><td>+250 scientifiques maximum par niveau. Indispensable pour recruter des scientifiques ; inutile pour lancer une recherche.</td></tr>
                </tbody>
            </table>

            <h2 id="militaire">Militaire et production de vaisseaux</h2>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td>Caserne</td><td>+5&nbsp;000 Légionnaires maximum par niveau (2&nbsp;000 sans caserne). Recherche Accroissement militaire 1.</td></tr>
                    <tr><td>Fort défensif</td><td>+15&nbsp;000 Légionnaires maximum par niveau, et <strong>protège des pillages</strong> 5&nbsp;% de votre capacité de stockage de niobium et d'eau (et 5&nbsp;% de votre uranium) par niveau. Requis pour les Mechas. Recherche Accroissement militaire 3.</td></tr>
                    <tr><td>Base nucléaire</td><td>Chaque niveau permet de stocker 1 bombe nucléaire et 4 intercepteurs (recherche Armement 5 requise pour les fabriquer). Coûte 100&nbsp;000 niobium et 500 uranium par niveau.</td></tr>
                    <tr><td>Chantier spatial</td><td>Fabrique les vaisseaux utilitaires (cargo, sonde, recycleur…) et accélère la production de tous les vaisseaux (+25&nbsp;% par niveau). Recherche Industrie 1.</td></tr>
                    <tr><td>Usine d'armement</td><td>Fabrique les vaisseaux légers (chasseurs lourds, corvettes…) et accélère la production de vaisseaux <strong>et de défenses</strong> de 40&nbsp;%. Un seul niveau par planète. Recherche Vaisseaux légers 1.</td></tr>
                    <tr><td>Industrie lourde</td><td>Fabrique les vaisseaux lourds (frégates, croiseurs, cuirassés, destroyers) et accélère la production de vaisseaux <strong>et de défenses</strong> de 60&nbsp;%. Un seul niveau par planète. Recherche Vaisseaux lourds 1.</td></tr>
                    <tr><td>Prison</td><td>Enferme les héros capturés. Recherche Système carcéral.</td></tr>
                    <tr><td>Camp d'esclaves</td><td>Par niveau : +2,5&nbsp;% de production de ressources, +2&nbsp;500 travailleurs maximum, −1,5&nbsp;% de durée de construction ; chaque prisonnier détenu ajoute 1&nbsp;% de production par niveau du prisonnier. Recherche Système carcéral.</td></tr>
                </tbody>
            </table>

            <h2 id="orbital">Agrandir la planète et défenses orbitales</h2>
            <table>
                <thead>
                    <tr><th>Bâtiment / Installation</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ville flottante</td><td>+10 emplacements au sol par niveau (5 au maximum par planète). Coûte 2&nbsp;000 Points de Guerre × le niveau. Recherche Expansion territoriale 1.</td></tr>
                    <tr><td>Station orbitale</td><td>+5 emplacements en ciel par niveau (5 au maximum par planète). Coûte 2&nbsp;000 Points de Guerre × le niveau. Recherche Expansion territoriale 2.</td></tr>
                    <tr><td>Base spatiale</td><td>Apporte un bonus d'armure aux défenses orbitales.</td></tr>
                    <tr><td>Bouclier / Grand bouclier</td><td>Absorbe les dégâts avant que les défenses soient touchées.</td></tr>
                    <tr><td>Tourelles (missile, laser, Gauss, plasma…)</td><td>Défendent votre planète contre les flottes en mode attaque.</td></tr>
                </tbody>
            </table>
            <p>Les défenses (tourelles, boucliers) n'occupent aucun emplacement.</p>

            <h2 id="detection">Détection et brouillage</h2>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Rôle</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar au sol</td><td>Détecte les flottes qui approchent (+1 de puissance radar par niveau). Recherche Scanner de système 1.</td></tr>
                    <tr><td>Radar d'espace</td><td>Même apport qu'un Radar au sol (+1 de puissance radar par niveau), mais occupe des emplacements en ciel au lieu du sol. Recherche Scanner de système 3.</td></tr>
                    <tr><td>Brouilleur de radar</td><td>Brouille la détection ennemie de vos mouvements. Recherche Scanner de système 5.</td></tr>
                </tbody>
            </table>

            <h2 id="couts">Coût des bâtiments</h2>
            <p>Le coût et la durée d'un niveau sont <strong>proportionnels au niveau visé</strong> : le niveau N coûte N fois le coût de base et dure N fois la durée de base. Exemple : une Mine de niobium niveau 4 coûte 4 × 45 = 180 niobium et 4 × 20 = 80 eau, en 4 × 3 = 12 minutes. Si un niveau du même bâtiment est déjà en file, le suivant est facturé au niveau d'après.</p>
            <p>Valeurs de base (niveau 1). « Place » = emplacements occupés au sol / en ciel par niveau.</p>

            <h3>Ressources et stockage</h3>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Niobium / eau</th><th>Durée</th><th>Place</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mine de niobium</td><td>45 / 20</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Extracteur d'eau</td><td>20 / 50</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Champ agricole</td><td>60 / 90</td><td>5 min</td><td>1 / 0</td></tr>
                    <tr><td>Ferme aéroponique</td><td>650 / 100</td><td>5 min 50 s</td><td>0 / 1</td></tr>
                    <tr><td>Entrepôt de Niobium</td><td>11&nbsp;000 / 6&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Réservoir d'eau</td><td>8&nbsp;000 / 9&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Silo agricole</td><td>12&nbsp;000 / 20&nbsp;000</td><td>50 min</td><td>4 / 0</td></tr>
                </tbody>
            </table>

            <h3>Population et science</h3>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Niobium / eau</th><th>Durée</th><th>Place</th></tr>
                </thead>
                <tbody>
                    <tr><td>Grande ville</td><td>1&nbsp;500 / 1&nbsp;100</td><td>12 min</td><td>6 / 0</td></tr>
                    <tr><td>Métropole</td><td>7&nbsp;500 / 5&nbsp;500</td><td>46 min 40 s</td><td>6 / 6</td></tr>
                    <tr><td>Centre de recherche</td><td>285 / 360</td><td>15 min</td><td>5 / 0</td></tr>
                </tbody>
            </table>
            <p>Exemple : une Métropole niveau 3 coûte 22&nbsp;500 niobium et 16&nbsp;500 eau, en 2 h 20 min.</p>

            <h3>Militaire et vaisseaux</h3>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Niobium / eau</th><th>Durée</th><th>Place</th></tr>
                </thead>
                <tbody>
                    <tr><td>Caserne</td><td>1&nbsp;300 / 1&nbsp;900</td><td>35 min</td><td>6 / 0</td></tr>
                    <tr><td>Fort défensif</td><td>20&nbsp;000 / 19&nbsp;000</td><td>1 h 12 min</td><td>10 / 0</td></tr>
                    <tr><td>Base nucléaire</td><td>100&nbsp;000 / 0 (+ 500 uranium)</td><td>1 h 12 min</td><td>2 / 0</td></tr>
                    <tr><td>Prison</td><td>3&nbsp;000 / 3&nbsp;500</td><td>50 min</td><td>5 / 0</td></tr>
                    <tr><td>Camp d'esclaves</td><td>2&nbsp;000 / 2&nbsp;500</td><td>40 min</td><td>4 / 0</td></tr>
                    <tr><td>Chantier spatial</td><td>300 / 200</td><td>3 min</td><td>2 / 1</td></tr>
                    <tr><td>Usine d'armement (1 niveau)</td><td>700 / 390</td><td>36 min</td><td>6 / 0</td></tr>
                    <tr><td>Industrie lourde (1 niveau)</td><td>8&nbsp;300 / 6&nbsp;800</td><td>2 h</td><td>12 / 0</td></tr>
                </tbody>
            </table>

            <h3>Détection et agrandissement</h3>
            <table>
                <thead>
                    <tr><th>Bâtiment</th><th>Coût (niobium / eau)</th><th>Durée</th><th>Place</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar au sol</td><td>120 / 65</td><td>3 min 40 s</td><td>2 / 0</td></tr>
                    <tr><td>Radar d'espace</td><td>2&nbsp;000 / 1&nbsp;720</td><td>24 min</td><td>0 / 2</td></tr>
                    <tr><td>Brouilleur de radar</td><td>5&nbsp;100 / 3&nbsp;210</td><td>54 min</td><td>0 / 4</td></tr>
                    <tr><td>Ville flottante (5 max)</td><td>2&nbsp;000 Points de Guerre</td><td>24 min</td><td>ajoute 10 au sol</td></tr>
                    <tr><td>Station orbitale (5 max)</td><td>2&nbsp;000 Points de Guerre</td><td>24 min</td><td>ajoute 5 en ciel</td></tr>
                </tbody>
            </table>
            <p>L'amélioration d'alliance « Coût de construction » réduit le coût en niobium, eau et uranium (−1&nbsp;% par niveau, jusqu'à −5&nbsp;%), et chaque niveau de Camp d'esclaves réduit la durée de 1,5&nbsp;%. L'entretien quotidien de chaque bâtiment est détaillé dans <a href="/wiki/bitcoin_economy#bareme">Bitcoins et entretien</a>.</p>

            <h2 id="file-production">Gérer la file de production</h2>
            <p>Les constructions de bâtiments, de vaisseaux (Chantier spatial) et de défenses passent par une <strong>file d'attente</strong> que vous pouvez gérer :</p>
            <ul>
                <li><strong>Réorganiser</strong> l'ordre des éléments en attente (glisser-déposer) pour prioriser ce qui compte.</li>
                <li><strong>Annuler</strong> un élément en attente : vous êtes <strong>remboursé au prorata</strong> de ce qui n'a pas encore été produit (un bâtiment en attente est remboursé en entier).</li>
                <li>Le coût d'un bâtiment est débité dès son ajout à la file.</li>
                <li>La file en cours s'affiche en haut de chaque page de production, sous le titre.</li>
                <li>La file est limitée à <strong>15 éléments en attente</strong> (hors construction en cours) : au-delà, un message vous indique d'attendre la fin d'une construction ou d'en annuler une avant d'en ajouter une nouvelle.</li>
                <li>La <strong>Ville flottante</strong> (+10&nbsp;sol/niveau) et la <strong>Station orbitale</strong> (+5&nbsp;ciel/niveau) sont plafonnées à <strong>5 exemplaires par planète</strong> chacune.</li>
            </ul>

    research:
        title: "Recherche et technologies"
        category: "economy"
        order: 3
        tags: "recherche,technologie,science,bitcoin,deblocage,arbre technologique,terraformation,cout"
        summary: "Les technologies qui débloquent vaisseaux, bonus et nouvelles capacités. Comment prioriser."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="fonctionnement">Comment ça marche</h2>
            <p>Les recherches se lancent depuis la page <strong>Recherches</strong> (aucun bâtiment n'est nécessaire). Chaque recherche :</p>
            <ul>
                <li>coûte des <strong>Bitcoins</strong> (seule Expansion territoriale se paie en Points de Guerre) : le niveau N coûte N fois le coût de base ;</li>
                <li>prend du <strong>temps</strong>, lui aussi proportionnel au niveau : de quelques minutes à plus d'une journée ;</li>
                <li>peut avoir un <strong>prérequis</strong> (une autre recherche à un certain niveau).</li>
            </ul>
            <p>Exemple : Terraformation niveau 2 coûte 2 × 12&nbsp;000 = 24&nbsp;000 Bitcoins et dure 2 × 1 h 10 min = 2 h 20 min à vitesse de base. L'amélioration d'alliance « Coût de recherche » réduit le prix de 1&nbsp;% par niveau (jusqu'à −5&nbsp;%).</p>
            <p>Vous pouvez programmer plusieurs recherches à la suite : le coût est débité à l'ajout en file, et intégralement remboursé si vous annulez.</p>
            <p>La durée d'une recherche est fixée <strong>au moment où vous la lancez ou la mettez en file</strong> : durée de base × niveau ÷ votre <strong>vitesse de recherche</strong> (1 au départ). Ce qui fait varier cette vitesse (scientifiques, recherche d'alliance « Mobilisation scientifique ») est expliqué dans <a href="/wiki/workers_scientists">Travailleurs et scientifiques</a>. L'amélioration d'alliance « Vitesse de recherche » raccourcit la durée affichée sur la page Recherches, mais pas la durée réelle : une fois lancée, la recherche se termine à l'heure calculée sans elle.</p>

            <h2 id="priorite-debutant">Priorités pour un débutant</h2>
            <ol>
                <li><strong>Vaisseaux utilitaires</strong> — ouvre Terraformation (niveau 1), Gestion des cargaisons (niveau 2), Invasion planétaire et Recyclage orbital (niveau 3).</li>
                <li><strong>Terraformation</strong> — le Vaisseau de colonisation et une planète de plus par niveau.</li>
                <li><strong>Gestion des cargaisons</strong> — les cargos et les bâtiments de stockage.</li>
                <li><strong>Redéfinition urbaine</strong> — Grande ville puis Métropole : plus de travailleurs, donc plus de Bitcoins.</li>
                <li><strong>Industrie</strong> — pour agrandir le Chantier spatial et ouvrir les vaisseaux légers (niveau 3) et lourds (niveau 5).</li>
                <li><strong>Invasion planétaire</strong> et <strong>Recyclage orbital</strong> — indispensables pour envahir et recycler.</li>
                <li><strong>Armement</strong> puis <strong>Arme missile</strong> — vos premiers vaisseaux de combat (Chasseur).</li>
            </ol>

            <h2 id="recherches">Liste complète des recherches</h2>
            <p>Les recherches sont rangées comme sur la page Recherches. Coût et durée indiqués pour le niveau 1, à vitesse de base : le niveau N coûte et dure N fois plus. Le niveau maximum est indiqué entre parenthèses.</p>

            <h3>Explorations</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Ce qu'elle apporte</th><th>Prérequis</th><th>Niveau 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Vaisseaux utilitaires (3)</td><td>Niv. 1 : Terraformation. Niv. 2 : Gestion des cargaisons. Niv. 3 : Invasion planétaire, Recyclage orbital et Vaisseau mère.</td><td>—</td><td>2&nbsp;500 ; 3 min 20 s</td></tr>
                    <tr><td>Terraformation (18)</td><td><strong>+1 planète possédable par niveau</strong> (2 + niveau au total, plus les bonus de régime politique). Niv. 1 : Vaisseau de colonisation. Niv. 15 : Lunar.</td><td>Vaisseaux utilitaires 1</td><td>12&nbsp;000 ; 1 h 10 min</td></tr>
                    <tr><td>Gestion des cargaisons (5)</td><td>Cargo I (niv. 1), Cargo V (niv. 3), Cargo X (niv. 5). Niv. 1 : Entrepôt de Niobium, Réservoir d'eau, Silo agricole (avec Aéroponique).</td><td>Vaisseaux utilitaires 2</td><td>3&nbsp;500 ; 6 min 40 s</td></tr>
                    <tr><td>Invasion planétaire (1)</td><td>Barge d'invasion.</td><td>Vaisseaux utilitaires 3</td><td>35&nbsp;000 ; 4 min 40 s</td></tr>
                    <tr><td>Recyclage orbital (1)</td><td>Recycleur.</td><td>Vaisseaux utilitaires 3</td><td>16&nbsp;900 ; 6 min 40 s</td></tr>
                    <tr><td>Scanner de système (5)</td><td>Radar au sol (niv. 1), Radar d'espace et vaisseau radar (niv. 3), Brouilleur de radar et vaisseau brouilleur (niv. 5).</td><td>—</td><td>2&nbsp;300 ; 5 min</td></tr>
                    <tr><td>Espionnage (999)</td><td>Une sonde ne rapporte d'informations que si votre niveau d'Espionnage est au moins égal à celui du propriétaire de la planète sondée.</td><td>Scanner de système 5</td><td>20&nbsp;000 ; 1 h</td></tr>
                    <tr><td>Technologie hyperespace (1)</td><td>Voyager vers les autres galaxies.</td><td>—</td><td>25&nbsp;000&nbsp;000 ; 25 h</td></tr>
                </tbody>
            </table>

            <h3>Planétaires</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Ce qu'elle apporte</th><th>Prérequis</th><th>Niveau 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Aéroponique (1)</td><td>Ferme aéroponique ; Silo agricole (avec Gestion des cargaisons 1).</td><td>—</td><td>16&nbsp;000 ; 8 min</td></tr>
                    <tr><td>Redéfinition urbaine (5)</td><td>Grande ville (niv. 1), Métropole (niv. 5).</td><td>—</td><td>8&nbsp;000 ; 8 min</td></tr>
                    <tr><td>Accroissement militaire (3)</td><td>Caserne (niv. 1), Fort défensif (niv. 3).</td><td>Redéfinition urbaine 1</td><td>11&nbsp;700 ; 15 min 30 s</td></tr>
                    <tr><td>Barbelées (5)</td><td>+5&nbsp;% de puissance de vos Légionnaires en défense au sol, par niveau.</td><td>Accroissement militaire 3</td><td>200&nbsp;000 ; 20 min</td></tr>
                    <tr><td>Système carcéral (1)</td><td>Prison et Camp d'esclaves.</td><td>Barbelées 5</td><td>350&nbsp;000 ; 1 h</td></tr>
                    <tr><td>Unités blindées (1)</td><td>Mechas.</td><td>Accroissement militaire 3</td><td>40&nbsp;000 ; 33 min 20 s</td></tr>
                    <tr><td>Expansion territoriale (2)</td><td>Ville flottante (niv. 1), Station orbitale (niv. 2) : de la place en plus sur vos planètes.</td><td>Terraformation 18</td><td>75&nbsp;000 Points de Guerre ; 1 h 40 min</td></tr>
                </tbody>
            </table>

            <h3>Armes</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Ce qu'elle apporte</th><th>Prérequis</th><th>Niveau 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Armement (5)</td><td>Arme missile (niv. 1), Arme laser (niv. 3), Arme plasma (niv. 5). Le niveau 5 est aussi requis pour les bombes nucléaires et les intercepteurs.</td><td>—</td><td>2&nbsp;000 ; 6 min 10 s</td></tr>
                    <tr><td>Arme missile (3)</td><td>Chasseur (niv. 1), Chasseur lourd (niv. 2) ; le niveau 3 est exigé par tous les vaisseaux de combat plus gros.</td><td>Armement 1</td><td>2&nbsp;600 ; 7 min 30 s</td></tr>
                    <tr><td>Arme laser (3)</td><td>Frégate et Corvette à laser (niv. 1) ; niveaux supérieurs exigés par les croiseurs, cuirassés et destroyers.</td><td>Armement 3</td><td>13&nbsp;000 ; 30 min</td></tr>
                    <tr><td>Arme plasma (3)</td><td>Frégate à plasma (niv. 1), Croiseur (niv. 2), Cuirassé et Destroyer (niv. 3).</td><td>Armement 5</td><td>29&nbsp;000 ; 1 h 18 min</td></tr>
                </tbody>
            </table>

            <h3>Spatiales</h3>
            <table>
                <thead>
                    <tr><th>Recherche</th><th>Ce qu'elle apporte</th><th>Prérequis</th><th>Niveau 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Industrie (5)</td><td>Chantier spatial et Chasseur (niv. 1), Vaisseaux légers (niv. 3), Vaisseaux lourds (niv. 5).</td><td>—</td><td>1&nbsp;500 ; 2 min 30 s</td></tr>
                    <tr><td>Vaisseaux légers (3)</td><td>Usine d'armement (niv. 1), Corvette (niv. 2), Corvette à laser (niv. 3).</td><td>Industrie 3</td><td>9&nbsp;000 ; 14 min 20 s</td></tr>
                    <tr><td>Vaisseaux lourds (3)</td><td>Industrie lourde (niv. 1), Cuirassé (niv. 2), Destroyer (niv. 3).</td><td>Industrie 5</td><td>42&nbsp;000 ; 20 min</td></tr>
                </tbody>
            </table>
            <p>Les vaisseaux demandent aussi leur bâtiment (Chantier spatial, Usine d'armement ou Industrie lourde) : voir <a href="/wiki/ship_types">Types de vaisseaux</a>.</p>

            <h3>Politiques</h3>
            <p>Membre d'une alliance, vous accédez aussi à 7 <strong>recherches politiques</strong> qui dépendent du régime de votre alliance et de son niveau — par exemple « Loi Macron » (production) ou « Mobilisation scientifique » (vitesse de recherche) pour la Balance des Mondes. Elles se paient avec vos propres Bitcoins : voir <a href="/wiki/alliance_research">Recherches d'alliance</a>.</p>

            <h2 id="modes-speciaux">Modes de serveur à recherches maximales</h2>
            <p>Dans certains modes (Battle Royale, Domination, Search &amp; Destroy), toutes vos recherches individuelles démarrent au <strong>niveau maximum</strong> et votre planète de départ reçoit 500 uranium. Il ne reste alors à faire que les recherches politiques de votre alliance.</p>

    workers_scientists:
        title: "Travailleurs et scientifiques"
        category: "economy"
        order: 4
        tags: "travailleurs,scientifiques,population,bitcoin,revenu,famine,defense,vitesse de recherche"
        summary: "Les deux populations de votre empire : les travailleurs qui rapportent les Bitcoins, les scientifiques qui augmentent la vitesse de recherche."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Les travailleurs</h2>
            <p>Les travailleurs sont votre <strong>source principale de Bitcoins</strong>. Au rapport journalier, chaque travailleur présent sur vos planètes rapporte <strong>0,5 Bitcoin</strong> : 10&nbsp;000 travailleurs = 5&nbsp;000 Bitcoins par jour, avant les taxes d'alliance et de paix. Les travailleurs embarqués dans une flotte ne rapportent rien. Ils ne coûtent aucun entretien en Bitcoins, seulement de la nourriture.</p>
            <p>Leur <strong>nombre maximum</strong> dépend de vos bâtiments :</p>
            <ul>
                <li><strong>Grande ville</strong> : +25&nbsp;000 travailleurs max et environ +8&nbsp;000 travailleurs par jour, par niveau.</li>
                <li><strong>Métropole</strong> : +80&nbsp;000 travailleurs max et environ +12&nbsp;000 travailleurs par jour, par niveau.</li>
                <li><strong>Camp d'esclaves</strong> : +2&nbsp;500 travailleurs max par niveau.</li>
            </ul>
            <p>Votre planète de départ commence au plafond (50&nbsp;000 travailleurs pour 50&nbsp;000 maximum) : construisez une Grande ville pour continuer à grandir.</p>
            <p>La population <strong>grandit toute seule</strong> jusqu'au plafond, au rythme donné par vos Grandes villes et Métropoles (+20&nbsp;% par niveau de la recherche d'alliance « Politique familiale », deux fois moins vite sous embargo). La nourriture ne la fait pas grandir, mais si vos rations tombent à zéro, la famine tue une partie de vos travailleurs.</p>

            <h2 id="scientifiques">Les scientifiques</h2>
            <p>Pour recruter des scientifiques (page <strong>Défense</strong>), il faut un <strong>Centre de recherche</strong> sur la planète : chaque niveau loge 250 scientifiques. Chacun coûte <strong>25 Bitcoins et 10 travailleurs</strong> au recrutement, puis <strong>3 Bitcoins par jour</strong> d'entretien (30 fois un Légionnaire au sol). La recherche d'alliance « Engouement scientifique » réduit cet entretien.</p>
            <p>Les scientifiques servent à augmenter votre <strong>vitesse de recherche</strong>. Elle vaut 1 au départ, et la durée d'une recherche est divisée par cette vitesse (vitesse 2 = recherches deux fois plus rapides). Comment elle évolue :</p>
            <ul>
                <li>Elle progresse par <strong>paliers entiers</strong>. Les scientifiques arrivent au fil de leur formation, et une arrivée ne fait gagner un palier que si elle compte <strong>au moins 5&nbsp;000 scientifiques à la fois</strong>. Des arrivées plus petites ne changent pas la vitesse : en pratique, recruter quelques centaines de scientifiques ne raccourcit pas vos recherches.</li>
                <li>La recherche d'alliance « Mobilisation scientifique » (Balance des Mondes) ajoute 0,1 de vitesse par niveau ; mais la prochaine arrivée de scientifiques arrondit la vitesse à l'entier le plus proche.</li>
                <li>La durée d'une recherche est fixée à son lancement : un gain de vitesse ne profite qu'aux recherches lancées ensuite.</li>
            </ul>

            <h2 id="defense">Rôle défensif</h2>
            <p>Vos <strong>travailleurs participent à la défense au sol</strong> — mais uniquement lors d'une <strong>invasion</strong> (quand l'ennemi veut prendre votre planète). Pendant un <strong>raid</strong> classique (pillage simple), ils restent cachés.</p>
            <p>La recherche d'alliance « Renforcement idéologique » (Rempart Silencieux) augmente leur défense de 20&nbsp;% par niveau.</p>

            <h2 id="gerer">Bien gérer sa population</h2>
            <ul>
                <li>Vos travailleurs mangent <strong>1 ration par heure pour 500 travailleurs</strong> (50&nbsp;000 travailleurs = 100 rations par heure ; un Champ agricole niveau 1 en produit 162).</li>
                <li>Si le grenier est vide, les rations chargées dans vos propres flottes en orbite de la planète sont consommées automatiquement.</li>
                <li>Ensuite, c'est la famine : vos travailleurs meurent (0,5&nbsp;% par cycle de 10 minutes au début, jusqu'à 2&nbsp;% si elle dure plus de 8 heures), puis vos Légionnaires et vos Mechas. La famine ne fait jamais descendre une planète sous 5&nbsp;000 travailleurs.</li>
                <li>Gardez des Silos agricoles pleins, surtout face à un embargo (voir <a href="/wiki/embargo">Embargo et famine</a>).</li>
            </ul>

            <h2 id="reserve-5000">La réserve intouchable de 5 000 travailleurs</h2>
            <p>Vos propres actions ne peuvent <strong>jamais faire descendre une planète sous 5 000 travailleurs</strong> : toute action qui la ferait passer en dessous est bloquée avec un message clair. La famine s'arrête aussi à ce seuil ; seule une invasion ennemie peut tuer des travailleurs au-delà. Sont concernés :</p>
            <ul>
                <li>Le <strong>recrutement de défense</strong> (Légionnaires, Mechas, scientifiques) qui consomme des travailleurs.</li>
                <li>La <strong>construction de vaisseaux</strong> au Chantier spatial.</li>
                <li>Le <strong>chargement de travailleurs dans un cargo</strong> en vue d'un transfert.</li>
            </ul>
            <p>Le bouton « MAX » des pages de production tient compte de cette réserve : il ne vous proposera jamais un maximum qui viderait votre planète sous le seuil.</p>
            <p>Attention : une nouvelle colonie démarre avec 2&nbsp;500 travailleurs. Vous ne pourrez y dépenser des travailleurs qu'une fois les 5&nbsp;000 dépassés.</p>

    market:
        title: "Marché et marchands"
        category: "economy"
        order: 5
        tags: "marche,marchands,vente,commerce,cargo,bitcoin,prix,points de guerre"
        summary: "Vendre ressources et troupes aux marchands contre des Bitcoins, en livrant soi-même ou en un clic, et échanger ses Points de Guerre."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Les marchands, c'est qui ?</h2>
            <p>Des <strong>personnages non-joueurs</strong> (PNJ) installés sur des planètes marchandes fixes : 20 par galaxie, aux mêmes secteurs dans chaque galaxie (les quatre coins, le centre et des positions intermédiaires). Leur position est visible sur la carte.</p>
            <p>Ils vous achètent contre des Bitcoins votre <strong>niobium</strong>, votre <strong>eau</strong> et votre <strong>uranium</strong>, mais aussi des <strong>travailleurs</strong>, des <strong>Légionnaires</strong>, des <strong>scientifiques</strong> et des <strong>Mechas</strong>. Ils n'achètent pas les rations.</p>

            <h2 id="vendre">Comment leur vendre</h2>
            <ol>
                <li>Chargez une flotte (un <strong>cargo</strong>, de préférence) avec ce que vous voulez vendre.</li>
                <li>Envoyez-la au marchand en mission <strong>« Décharger et revenir »</strong>. Le carburant se paie en Bitcoins : cette mission coûte le double à l'aller, puis le retour est facturé au tarif normal quand la flotte repart.</li>
                <li>À l'arrivée, toute la cargaison vendable est vendue : vous recevez des Bitcoins et quelques Points de Guerre. Les rations restent à bord.</li>
                <li>La flotte rentre automatiquement chez vous.</li>
            </ol>
            <p>Si une horde de Cthulhu fait le blocus d'un marchand, il refuse toute vente tant que le blocus tient.</p>

            <h2 id="vente-clic">Vendre en un clic, sans flotte</h2>
            <p>Page <strong>Planètes</strong>, onglet <strong>Vente aux marchands</strong> : ajoutez à la liste les planètes de votre choix (menu « Ajouter »), puis cliquez sur <strong>Lancer la vente aux marchands</strong>. Tout le niobium et toute l'eau de ces planètes sont vendus aussitôt, sans cargo ni carburant, mais <strong>20&nbsp;% moins cher</strong> qu'en livrant vous-même (0,10 Bitcoin par niobium, 0,25 par eau) et sans Points de Guerre. Une planète attaquée ou sous embargo est ignorée.</p>

            <h2 id="immunite">Les marchands sont intouchables</h2>
            <p>Les marchands sont <strong>immunisés contre toute attaque</strong>. Vous ne pouvez pas les raider, les envahir ni les combattre. Leurs flottes ne participent jamais à un combat, même si elles se trouvent sur le même point qu'un affrontement.</p>
            <p>Attention toutefois : sur les serveurs avec PvE, une <strong>horde alien en mode attaque</strong> peut stationner en orbite d'un marchand (chaque marchand en reçoit une à la création de la galaxie, plus puissante vers le centre). Un cargo sans armes qui arrive dans cette orbite est attaqué et détruit sans rien vendre. Avant d'envoyer vos cargos, assurez-vous qu'aucune horde ne garde ce marchand, ou utilisez la vente en un clic.</p>

            <h2 id="gain">Combien ça rapporte ?</h2>
            <p>Prix de base par unité, en livrant vous-même :</p>
            <table>
                <thead>
                    <tr><th>Marchandise</th><th>Bitcoins par unité</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium</td><td>0,125 (1&nbsp;000 niobium = 125)</td></tr>
                    <tr><td>Eau</td><td>0,3125 (1&nbsp;000 eau = 312)</td></tr>
                    <tr><td>Uranium</td><td>2&nbsp;000</td></tr>
                    <tr><td>Travailleur</td><td>5</td></tr>
                    <tr><td>Légionnaire</td><td>27 (formé pour 8 Bitcoins et 2 travailleurs)</td></tr>
                    <tr><td>Scientifique</td><td>110 (formé pour 25 Bitcoins et 10 travailleurs)</td></tr>
                    <tr><td>Mecha</td><td>130 (formé pour 60 Bitcoins et 5 travailleurs)</td></tr>
                </tbody>
            </table>
            <p>Une troupe se revend environ 1,5 fois son coût de formation, en comptant chaque travailleur consommé à 5 Bitcoins : un Légionnaire formé pour 8 Bitcoins et 2 travailleurs (18 au total) se revend 27. Le commerce reste rentable sans être une source illimitée de Bitcoins. Le montant de chaque vente figure dans le rapport « Vente aux marchands ». Chaque vente livrée par une flotte rapporte aussi des Points de Guerre, à l'arrivée comme depuis l'orbite du marchand : 1 PDG pour 5&nbsp;000 Bitcoins de valeur de base (prix du tableau, avant bonus), soit 1 PDG pour 40&nbsp;000 niobium, 16&nbsp;000 eau ou 1&nbsp;000 travailleurs, et 0,4 PDG par uranium ; le total de la vente est arrondi à l'unité. La recherche d'alliance « Points de Guerre » ajoute 10&nbsp;% par niveau ; les Accords marchands et le héros augmentent les Bitcoins, pas les PDG. L'eau rapporte 2,5 fois plus que le niobium. La recherche d'alliance « Accords marchands » (Balance des Mondes) ajoute 5&nbsp;% par niveau, jusqu'à +25&nbsp;%, et un héros d'Économie de niveau 10 (trait « Négociant ») ajoute 15&nbsp;% aux ventes qu'il accompagne : celles de sa flotte, ou celles de sa planète dans la vente en un clic. L'onglet Vente aux marchands de la page Planètes affiche vos prix réels.</p>

            <h2 id="astuce">Astuce</h2>
            <p>Plutôt que laisser vos stocks saturer, vendez régulièrement : envoyez un cargo bien rempli (le carburant se paie en Bitcoins, mieux vaut un gros chargement que plusieurs petits) ou utilisez la vente en un clic pour financer vos recherches ou votre armée.</p>

            <h2 id="points-de-guerre">Échanger ses Points de Guerre</h2>
            <p>La page <strong>Objectifs</strong>, qui liste vos quêtes du jour, permet aussi de dépenser vos Points de Guerre : <strong>1 PDG = 1 Bitcoin</strong>, <strong>2 Légionnaires</strong> ou <strong>10 travailleurs</strong>, livrés sur la planète de votre choix dans la limite de ses plafonds.</p>

    recycling:
        title: "Recyclage"
        category: "economy"
        order: 6
        tags: "recyclage,debris,cdr,recycleur,asteroide,uranium"
        summary: "Après chaque combat, des débris traînent. Les récupérer, c'est une mine à ciel ouvert."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Les débris : c'est quoi ?</h2>
            <p>Chaque vaisseau détruit en combat laisse une partie de son coût sous forme de <strong>débris</strong> flottants dans l'espace. On appelle ça un <strong>CDR</strong> (Champ De Ressources).</p>
            <p>Un champ laissé par un combat contient du <strong>niobium</strong> et de l'<strong>eau</strong>, jamais d'uranium. Il reste à la position de l'affrontement, quelle qu'elle soit (planète, emplacement vide…), où une icône le signale sur la carte.</p>
            <p>Il existe aussi des <strong>champs d'astéroïdes</strong> qui apparaissent seuls sur la carte. Il y en a trois sortes : niobium, eau ou <strong>uranium</strong>. Ils se rechargent toutes les 7 à 40 heures et changent parfois de place :</p>
            <ul>
                <li>niobium : 40&nbsp;000 à 800&nbsp;000 par recharge ;</li>
                <li>eau : 30&nbsp;000 à 500&nbsp;000 par recharge ;</li>
                <li>uranium : 50 à 180 par recharge.</li>
            </ul>
            <p>Ils sont souvent gardés par une flotte alien qui attaque tout arrivant.</p>

            <h2 id="combien">Combien de débris ?</h2>
            <p>Un champ contient <strong>40&nbsp;% du coût de construction des vaisseaux réellement détruits</strong>, dans les deux camps. Chaque vaisseau rend ses propres ressources : un Destroyer (2&nbsp;100 niobium, 6&nbsp;000 eau) laisse surtout de l'eau. Les survivants ne laissent rien.</p>
            <p>Trois cas particuliers :</p>
            <ul>
                <li>Face aux hordes de <strong>Cthulhu</strong>, le taux tombe à <strong>20&nbsp;%</strong>.</li>
                <li>La <strong>cargaison</strong> (niobium et eau) d'une flotte entièrement détruite se déverse aussi dans le champ, à 40&nbsp;%. Un vainqueur amoché, lui, garde toute sa soute.</li>
                <li>Les vaisseaux payés en <strong>points de guerre</strong> (Chasseur à plasma, Corvette de combat, Vaisseau de bataille, Caravelle) ne laissent <strong>aucun</strong> débris, car ils ne coûtent ni niobium ni eau. Les <strong>défenses planétaires</strong> rasées n'en laissent jamais non plus.</li>
            </ul>
            <p>Un <strong>combat orbital</strong> (flotte abattue par les tourelles d'une planète en mode attaque, ou vaisseaux perdus en forçant une orbite défendue) laisse un champ selon la même règle.</p>

            <h2 id="comment">Comment recycler</h2>
            <ol>
                <li>Recherchez <strong>Recyclage orbital</strong> (page <em>Recherches</em>, demande <em>Vaisseaux utilitaires</em> niveau 3).</li>
                <li>Fabriquez des <strong>recycleurs</strong> dans votre Chantier spatial (2&nbsp;200 niobium, 1&nbsp;000 eau et 10 travailleurs chacun).</li>
                <li>Créez une flotte avec vos recycleurs, et des cargos pour la soute (voir plus bas).</li>
                <li>Envoyez-la sur les coordonnées du champ en mission <strong>Normal</strong>. Sur la <em>Carte spatiale</em> : cliquez la position, puis <em>Interaction</em>, choisissez la flotte et la mission <em>Normal</em>, puis <em>Envoyer</em>. Il n'y a pas de mission spéciale de recyclage.</li>
                <li>Dès l'arrivée, le recyclage démarre tout seul : un premier ramassage tout de suite, puis un toutes les <strong>5 minutes</strong>.</li>
                <li>Quand la soute est pleine ou le champ vide, le recyclage s'arrête et vous recevez le rapport « Votre flotte a arrêté de recycler ! ». <strong>La flotte reste sur place</strong> : à vous de la ramener. Le bouton <em>Recycler</em> de la flotte relance le recyclage s'il lui reste de la place.</li>
            </ol>
            <p>Une flotte qui attend sur un champ d'astéroïdes reprend le recyclage toute seule à chaque recharge du champ, tant qu'il lui reste de la place.</p>

            <h2 id="capacite">Combien un recycleur peut ramener ?</h2>
            <p>À chaque passage, chaque recycleur ramasse <strong>1&nbsp;000 ressources</strong>, réparties à parts égales entre les ressources présentes dans le champ (niobium, eau, uranium).</p>
            <p><strong>Attention : un recycleur n'a que 1&nbsp;000 de soute.</strong> Seul, il est donc plein dès le premier passage. Pour vider un gros champ, ajoutez des cargos à la flotte : leur soute se remplit au rythme de vos recycleurs.</p>
            <table>
                <thead>
                    <tr><th>Vaisseau</th><th>Soute</th></tr>
                </thead>
                <tbody>
                    <tr><td>Recycleur</td><td>1&nbsp;000</td></tr>
                    <tr><td>Cargo I</td><td>3&nbsp;000</td></tr>
                    <tr><td>Cargo V</td><td>10&nbsp;000</td></tr>
                    <tr><td>Cargo X</td><td>25&nbsp;000</td></tr>
                    <tr><td>Caravelle</td><td>40&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>La recherche d'alliance <strong>Cargos améliorés</strong> agrandit la soute des cargos et de la Caravelle.</p>
            <p>Exemples :</p>
            <ul>
                <li>5 recycleurs seuls : 5&nbsp;000 ressources ramassées dès l'arrivée, puis la flotte est pleine.</li>
                <li>1 recycleur + 2 Cargos I (7&nbsp;000 de soute) : 1&nbsp;000 par passage, soit 5&nbsp;000 ressources en 20 minutes (à l'arrivée, puis à 5, 10, 15 et 20 minutes).</li>
                <li>10 recycleurs + 5 Cargos V (60&nbsp;000 de soute) : 10&nbsp;000 par passage, flotte pleine au 6e passage, soit en 25 minutes environ.</li>
            </ul>
            <p>La recherche d'alliance <strong>Optimisation recyclage</strong> (régime <em>Le Rempart Silencieux</em>) ajoute 400 ressources par recycleur et par passage à chaque niveau, jusqu'à 3&nbsp;000 au niveau 5. Elle n'agrandit pas la soute des recycleurs : prévoyez des cargos pour en profiter.</p>

            <h2 id="strategie">Stratégie</h2>
            <ul>
                <li>Après chaque combat, envoyez immédiatement des recycleurs : sinon, vos adversaires les auront.</li>
                <li>Protégez-les : un recycleur isolé est une cible facile, et les champs d'astéroïdes sont souvent gardés.</li>
                <li>Les combats ne laissent jamais d'uranium : recyclez les <strong>champs d'astéroïdes d'uranium</strong> (50 à 180 unités par recharge), ou libérez des bases aliens.</li>
                <li>Le recyclage est très rentable : pensez-y comme une deuxième économie derrière vos mines.</li>
            </ul>

    daily_report:
        title: "Le rapport journalier"
        category: "economy"
        order: 7
        tags: "rapport,journalier,quotidien,bilan,revenus,couts,taxe"
        summary: "Chaque jour à 18h59 (heure de Paris), le jeu fait votre bilan : revenus, coûts, taxes. À surveiller de près."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Quand ça tombe</h2>
            <p>Chaque jour à <strong>18h59 (heure de Paris)</strong>, soit 17h59 UTC en hiver et 16h59 UTC en été. C'est un rendez-vous fixe pour tous les joueurs du serveur.</p>
            <p>Vous recevez un « Rapport de l'empire » dans la page <strong>Rapport</strong>, onglet <strong>Économiques</strong>.</p>

            <h2 id="contenu">Ce que contient le rapport</h2>
            <ul>
                <li><strong>Revenus</strong> — 0,5 Bitcoin par travailleur présent sur vos planètes au moment du rapport.</li>
                <li><strong>Coûts d'entretien</strong> — Légionnaires, Mechas, scientifiques, vaisseaux, bâtiments. Tout ce qui est dans une flotte, même stationnée en orbite, coûte bien plus cher que ce qui est au sol (barème dans <a href="/wiki/bitcoin_economy#bareme">Bitcoins et entretien</a>).</li>
                <li><strong>Taxe de paix</strong> — si votre alliance a signé une paix où elle doit verser une taxe à l'autre alliance : ce pourcentage est prélevé sur le revenu de vos travailleurs.</li>
                <li><strong>Taxe d'alliance</strong> — prélevée sur le revenu de vos travailleurs (après la taxe de paix, s'il y en a une) et versée à la trésorerie de votre alliance. Avec un taux de t&nbsp;%, la part prélevée vaut revenu × t ÷ (100 + t) : un taux de 10&nbsp;% prend environ 9&nbsp;% de votre revenu.</li>
                <li><strong>Bilan final</strong> — revenus − taxes − coûts, ajouté à votre solde.</li>
                <li><strong>Menace Cthulhu</strong> — si les Cthulhu sont actifs pour vous, la menace qui pèse sur votre empire remonte de 5 points (300 au maximum).</li>
            </ul>

            <h2 id="quetes">Les quêtes journalières</h2>
            <p>Le rapport journalier <strong>renouvelle vos 3 quêtes</strong> du jour : celles de la veille que vous n'avez pas terminées disparaissent. Si vous les aviez toutes accomplies, il vous verse aussi un bonus égal à leur récompense moyenne. Retrouvez-les dans la page <strong>Objectifs</strong> (voir <a href="/wiki/quests">Quêtes journalières</a>).</p>

            <h2 id="danger">Le danger à surveiller</h2>
            <p>Si votre solde tombe <strong>en négatif</strong> après le rapport, c'est le <strong>Game Over économique</strong> : toutes vos flottes et tous les vaisseaux au sol de vos planètes sont perdus, et votre solde est remis à 125&nbsp;000 Bitcoins (vos planètes, bâtiments et recherches ne bougent pas). Un rapport « Faillite imminente » vous prévient à l'avance, au plus une fois par jour.</p>
            <p>Vérifiez votre rapport chaque jour. Si vos coûts grimpent trop : mettez au sol les flottes qui ne servent pas (leur entretien est divisé par 6), ralentissez le recrutement, vendez des troupes ou des ressources aux marchands.</p>

    exchange:
        title: "Échanges entre joueurs"
        category: "economy"
        order: 8
        tags: "echange,alliance,ressources,bitcoin,don,depot,uranium,dechargement"
        summary: "Comment envoyer des ressources à un autre joueur ou des Bitcoins à un allié, et les limites de la chose."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Le principe</h2>
            <p>Area Universe permet d'envoyer des ressources à <strong>n'importe quel joueur</strong> par flotte, et des Bitcoins aux membres de votre alliance via la trésorerie. C'est très utile pour :</p>
            <ul>
                <li>Relancer un allié qui vient d'être pillé.</li>
                <li>Mutualiser un effort de construction coûteux.</li>
                <li>Ravitailler un membre de votre alliance sous embargo.</li>
            </ul>

            <h2 id="ressources">Envoyer des ressources physiques</h2>
            <p>Chargez ce que vous voulez livrer dans la soute d'une flotte : niobium, eau, rations, uranium, mais aussi travailleurs, Légionnaires, scientifiques ou Mechas. Envoyez-la ensuite en mission <strong>« Décharger et revenir »</strong> vers la planète du destinataire.</p>
            <p>À l'arrivée, tout est déposé dans la limite des capacités de la planète (stockage, plafonds de Légionnaires, de travailleurs et de scientifiques, 500 Mechas au plus) ; le surplus reste à bord. La flotte rentre toute seule et le destinataire reçoit un rapport de dépôt.</p>

            <h2 id="bitcoins">Envoyer des Bitcoins</h2>
            <p>Les Bitcoins se transfèrent via la <strong>trésorerie d'alliance</strong> (voir <a href="/wiki/alliance_treasury">Trésorerie d'alliance</a>) : vous y déposez, puis le membre à aider demande un retrait à son nom. Le retrait est immédiat pour un membre qui a la permission « Modifier » (et pour tous dans une alliance du Rempart Silencieux) ; sinon, il attend la validation d'un membre qui a cette permission.</p>

            <h2 id="limites">Les limites</h2>
            <ul>
                <li>Il n'y a <strong>aucune limite quotidienne</strong> ni plafond d'envoi : seules comptent la capacité de soute de vos flottes (Cargo I : 3&nbsp;000 places, Cargo V : 10&nbsp;000, Cargo X : 25&nbsp;000, 1 place par unité et 500 par Mecha) et la capacité de stockage de la planète d'arrivée.</li>
                <li>Les ressources voyagent obligatoirement par flotte : il faut du temps et du carburant, payé en Bitcoins. Une mission « Décharger et revenir » coûte le double à l'aller, puis le retour est facturé au tarif normal quand la flotte repart.</li>
                <li>Une planète sous <strong>embargo</strong> ne peut recevoir de livraison que de son propriétaire ou d'un membre de la même alliance.</li>
                <li>L'uranium se transporte comme le reste, et la planète qui le reçoit n'a pas de limite de stockage d'uranium.</li>
            </ul>

    fleet_creation:
        title: "Créer et envoyer une flotte"
        category: "fleet"
        order: 1
        tags: "flotte,creation,vaisseaux,composition,chantier,mission"
        summary: "De la fabrication du vaisseau jusqu'à son arrivée à destination : le parcours complet."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Ce qu'il vous faut</h2>
            <ul>
                <li>Un <strong>Chantier spatial</strong> sur votre planète active.</li>
                <li>Les ressources du vaisseau : niobium, eau et travailleurs le plus souvent, parfois Points de Guerre, Bitcoins ou Légionnaires (tableau dans <em>Types de vaisseaux</em>).</li>
                <li>Les recherches requises pour le vaisseau voulu (par ex. <em>Gestion des cargaisons</em> pour les cargos).</li>
            </ul>

            <h2 id="fabriquer">Étape 1 — Fabriquer les vaisseaux</h2>
            <p>Depuis la page <strong>Chantier spatial</strong> (onglet <strong>Construction de vaisseaux</strong>), choisissez un modèle et une quantité, puis cliquez sur <strong>Construire</strong>. La production se fait en arrière-plan ; chaque vaisseau a une durée de base, raccourcie par la production spatiale de la planète.</p>

            <h2 id="composer">Étape 2 — Composer la flotte</h2>
            <p>Une fois les vaisseaux livrés, allez sur la page <strong>Flottes</strong> et cliquez sur <strong>Créer une nouvelle flotte</strong> : choisissez les vaisseaux qui embarquent et un nom (12 caractères au plus). Ouvrez ensuite la flotte (clic sur son nom) pour :</p>
            <ul>
                <li>Ajouter ou retirer des vaisseaux (onglet <strong>Vaisseaux</strong>, bouton <strong>Gérer</strong>), quand la flotte est sur une de vos planètes.</li>
                <li>Charger des <strong>ressources</strong> (onglet <strong>Fret</strong>), quand la flotte est sur une de vos planètes.</li>
                <li>Embarquer des <strong>Légionnaires</strong> ou des Mechas (onglet <strong>Fret</strong>) pour un raid ou une invasion : chaque Légionnaire occupe 1 place de soute, chaque Mecha 500, et ce sont les barges qui les débarquent.</li>
            </ul>

            <h2 id="envoyer">Étape 3 — Envoyer la flotte</h2>
            <ol>
                <li>Choisissez la <strong>destination</strong> : dans l'onglet <strong>Déplacer la flotte</strong> (champs galaxie, système et planète, au format <code>Galaxie:Secteur:Position</code>, ou liste « Mes planètes »), ou en cliquant sur la case depuis la <strong>Carte spatiale</strong>, puis sur <strong>Interaction</strong>.</li>
                <li>Choisissez un <strong>type de mission</strong> (Normal, Décharger et revenir, Sonde, Coloniser, Piller, Envahir… voir <em>Types de missions</em>). L'onglet <strong>Déplacer la flotte</strong> sert aux déplacements simples (Normal) et à l'espionnage ; les autres missions s'envoient depuis la Carte spatiale.</li>
                <li>Dans l'onglet <strong>Déplacer la flotte</strong>, vérifiez le coût du carburant (en <strong>Bitcoins</strong>) et la durée estimés.</li>
                <li>Cliquez sur <strong>Envoyer</strong>.</li>
            </ol>
            <p>La flotte apparaît dans votre liste de flottes en vol. Pendant les <strong>2 premières minutes</strong>, un bouton ✕ avec compte à rebours (ou la ligne <strong>Annuler</strong> de sa page) permet d'<strong>annuler l'envoi</strong> : la flotte revient aussitôt sur sa planète de départ, mais le carburant payé n'est pas rendu. Passé ce délai, elle va jusqu'au bout.</p>

            <h2 id="astuces">Astuces</h2>
            <ul>
                <li>Un <strong>recycleur</strong> dans une flotte d'attaque ramasse les débris dès la fin du combat, mais il la ralentit : la flotte avance à sa vitesse, trois fois plus lente que celle d'un chasseur. Pour une frappe rapide, envoyez les recycleurs à part, une fois le combat terminé.</li>
                <li>N'envoyez jamais toute votre défense d'un coup : gardez de quoi tenir votre planète.</li>
                <li>Seule la mission <strong>Décharger et revenir</strong> ramène la flotte toute seule, et ce retour se paie en Bitcoins comme un trajet normal. Après toute autre mission, la flotte reste en orbite de sa destination : la faire revenir est un nouvel envoi, avec son propre carburant.</li>
            </ul>

    ship_types:
        title: "Types de vaisseaux"
        category: "fleet"
        order: 2
        tags: "vaisseaux,chasseur,corvette,fregate,cuirasse,croiseur,destroyer,cargo,sonde,lunar,caravelle,recycleur,cout,vitesse,prerequis"
        summary: "Tous les vaisseaux du jeu : rôle, coût, vitesse, soute, prérequis et caractéristiques de combat."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Vaisseaux utilitaires</h2>
            <p>Ils n'ont pas d'armes. Ils servent à transporter, explorer, recycler, coloniser.</p>
            <table>
                <tr><th>Vaisseau</th><th>Rôle</th><th>Capacité</th></tr>
                <tr><td>Sonde</td><td>Espionner une planète.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Transport léger.</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>Transport moyen.</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>Gros transport.</td><td>25&nbsp;000</td></tr>
                <tr><td>Caravelle</td><td>Cargo premium : le plus grand et le plus rapide des cargos. Payé en Points de Guerre (25) + 15&nbsp;travailleurs par unité produite.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonisateur</td><td>Fonder une colonie sur une planète inhabitée.</td><td>—</td></tr>
                <tr><td>Recycleur</td><td>Collecter les débris de combat : 1&nbsp;000 par cycle de 5 min (plus avec la recherche d'alliance <em>Optimisation recyclage</em>). Sa propre soute ne contient que 1&nbsp;000 : ajoutez des cargos à la flotte pour ramasser davantage.</td><td>1&nbsp;000</td></tr>
                <tr><td>Barge d'invasion</td><td>Transporter des Légionnaires pour un raid ou une invasion.</td><td>1&nbsp;000 Légionnaires</td></tr>
                <tr><td>Lunar (parfois appelé Moon Maker)</td><td>Créer une lune sur une case vide portant assez de débris (au moins 2M de niobium et 2M d'eau).</td><td>—</td></tr>
                <tr><td>Vaisseau radar</td><td>Se déploie sur une case vide et y installe un radar (puissance 1) pendant 2&nbsp;h : vous voyez alors ce secteur.</td><td>—</td></tr>
                <tr><td>Vaisseau brouilleur</td><td>Se déploie sur une case vide et y installe un brouilleur (puissance 1) pendant 1&nbsp;h.</td><td>—</td></tr>
                <tr><td>Vaisseau mère</td><td>Vaisseau amiral, un seul par commandant. En combat, il apporte à sa flotte 20&nbsp;000 de coque et 5&nbsp;000 de bouclier, puis +5&nbsp;% de coque et de bouclier et +10&nbsp;% de précision. Il raccourcit de 10&nbsp;% la durée de vol de sa flotte et réduit sa signature de 10&nbsp;%, mais vole lui-même à 250 lumens, plus lentement qu'un chasseur.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Vaisseaux de combat</h2>
            <p>Les vaisseaux de combat se distinguent par leur coque, leur bouclier et leurs armes (missile, laser, plasma). En combat, la puissance de toute votre flotte s'additionne : il n'y a ni portée, ni bonus d'un type de vaisseau contre un autre. Deux règles comptent :</p>
            <ul>
                <li>les trois chasseurs n'ont <strong>pas de bouclier</strong> et encaissent les dégâts en premier : ils protègent les gros vaisseaux ;</li>
                <li>le <strong>laser</strong> et surtout le <strong>plasma</strong> traversent mieux les boucliers ennemis que le missile.</li>
            </ul>
            <p>Valeurs de base par vaisseau, avant vos améliorations (article <em>Personnaliser ses vaisseaux</em>). La colonne « Armes » donne missile / laser / plasma ; « — » : le vaisseau n'a pas cette caractéristique.</p>
            <h3>Chasseurs et corvettes</h3>
            <table>
                <tr><th>Vaisseau</th><th>Coque</th><th>Bouclier</th><th>Armes</th><th>Points</th></tr>
                <tr><td>Chasseur</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Chasseur lourd</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Chasseur à plasma</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Corvette</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Corvette à laser</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Corvette de combat</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Frégates et vaisseaux lourds</h3>
            <table>
                <tr><th>Vaisseau</th><th>Coque</th><th>Bouclier</th><th>Armes</th><th>Points</th></tr>
                <tr><td>Frégate</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Frégate à plasma</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Vaisseau de bataille</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Croiseur</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Cuirassé</td><td>1&nbsp;250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Destroyer</td><td>2&nbsp;600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>« Points » : le crédit de points d'amélioration du modèle. Le <strong>Chasseur à plasma</strong> et le <strong>Vaisseau de bataille</strong> n'ont <strong>aucune arme</strong> au départ : leurs armes viennent entièrement des points que vous leur attribuez.</p>

            <h2 id="factions">Le bonus de +20&nbsp;% : la politique d'alliance</h2>
            <p>Il n'existe pas de « faction » de vaisseau. Le seul bonus de +20&nbsp;% du combat spatial vient de la <strong>politique de votre alliance</strong> : la Balance des Mondes bat le Rempart Silencieux, qui bat le Marteau des Étoiles, qui bat la Balance des Mondes.</p>
            <p>Quand la politique de l'<strong>attaquant</strong> bat celle du défenseur, toutes ses armes (missile, laser, plasma) gagnent +20&nbsp;% pour ce combat ; le défenseur n'en profite jamais. Un joueur sans alliance n'a ni bonus, ni malus.</p>

            <h2 id="bonus-cargo">Capacité de transport</h2>
            <p>La capacité des cargos (Cargo I, V, X et Caravelle) augmente de <strong>+20&nbsp;% par niveau</strong> de la recherche d'alliance <strong>Cargos améliorés</strong> (5 niveaux, alliance de niveau 3 au moins). Au niveau 5, un Cargo I emporte 6&nbsp;000 au lieu de 3&nbsp;000. Les soutes des autres vaisseaux ne changent pas.</p>

            <h2 id="reference">Tableau de référence</h2>
            <h3>Coût et production</h3>
            <p>Coût d'un vaisseau. La durée est la durée de base de production d'une unité, raccourcie par la production spatiale de votre planète.</p>
            <table>
                <tr><th>Vaisseau</th><th>Coût</th><th>Durée</th></tr>
                <tr><td>Sonde</td><td>1&nbsp;000 niobium</td><td>20 s</td></tr>
                <tr><td>Cargo I</td><td>800 niobium, 650 eau, 10 travailleurs</td><td>30 s</td></tr>
                <tr><td>Cargo V</td><td>2&nbsp;200 niobium, 1&nbsp;500 eau, 20 travailleurs</td><td>1 min</td></tr>
                <tr><td>Cargo X</td><td>4&nbsp;500 niobium, 3&nbsp;800 eau, 25 travailleurs</td><td>1 min 30 s</td></tr>
                <tr><td>Caravelle</td><td>25 Points de Guerre, 15 travailleurs</td><td>2 min</td></tr>
                <tr><td>Recycleur</td><td>2&nbsp;200 niobium, 1&nbsp;000 eau, 10 travailleurs</td><td>1 min</td></tr>
                <tr><td>Colonisateur</td><td>5&nbsp;500 niobium, 7&nbsp;000 eau, 2&nbsp;000 travailleurs, 5 Légionnaires</td><td>1 h</td></tr>
                <tr><td>Barge d'invasion</td><td>5&nbsp;000 niobium, 3&nbsp;500 eau, 10 travailleurs</td><td>1 min</td></tr>
                <tr><td>Vaisseau radar</td><td>500 niobium, 600 eau, 2&nbsp;500 Bitcoins</td><td>5 min</td></tr>
                <tr><td>Vaisseau brouilleur</td><td>1&nbsp;100 niobium, 1&nbsp;300 eau, 5&nbsp;500 Bitcoins</td><td>10 min</td></tr>
                <tr><td>Lunar</td><td>50&nbsp;000 niobium, 23&nbsp;000 eau, 20&nbsp;000 travailleurs, 200&nbsp;000 Bitcoins</td><td>5 h</td></tr>
                <tr><td>Vaisseau mère</td><td>17&nbsp;500 niobium, 9&nbsp;500 eau, 2&nbsp;000 travailleurs, 25&nbsp;000 Points de Guerre</td><td>3 h 53 min</td></tr>
                <tr><td>Chasseur</td><td>25 niobium, 5 eau, 1 travailleur</td><td>1 s</td></tr>
                <tr><td>Chasseur lourd</td><td>35 niobium, 13 eau, 2 travailleurs</td><td>3,2 s</td></tr>
                <tr><td>Chasseur à plasma</td><td>1 Point de Guerre, 1 travailleur</td><td>8 s</td></tr>
                <tr><td>Corvette</td><td>100 niobium, 60 eau, 3 travailleurs</td><td>6 s</td></tr>
                <tr><td>Corvette à laser</td><td>100 niobium, 200 eau, 5 travailleurs</td><td>10 s</td></tr>
                <tr><td>Corvette de combat</td><td>3 Points de Guerre, 3 travailleurs</td><td>19 s</td></tr>
                <tr><td>Frégate</td><td>400 niobium, 200 eau, 12 travailleurs</td><td>20 s</td></tr>
                <tr><td>Frégate à plasma</td><td>300 niobium, 600 eau, 14 travailleurs</td><td>30 s</td></tr>
                <tr><td>Vaisseau de bataille</td><td>8 Points de Guerre, 12 travailleurs</td><td>40 s</td></tr>
                <tr><td>Croiseur</td><td>1&nbsp;000 niobium, 680 eau, 30 travailleurs</td><td>56 s</td></tr>
                <tr><td>Cuirassé</td><td>1&nbsp;000 niobium, 920 eau, 40 travailleurs</td><td>1 min 4 s</td></tr>
                <tr><td>Destroyer</td><td>2&nbsp;100 niobium, 6&nbsp;000 eau, 60 travailleurs</td><td>4 min 30 s</td></tr>
            </table>

            <h3>Vitesse, signature et soute</h3>
            <p>La vitesse est en lumens, comme sur la fiche du vaisseau (plus c'est haut, plus c'est rapide). La colonne « Vol » donne le temps de vol par unité de distance sur un serveur de vitesse ×1 (un serveur accéléré raccourcit ces durées) ; une flotte vole au rythme de son vaisseau le plus lent. La signature compte pour le carburant et pour ce que voient les radars ennemis.</p>
