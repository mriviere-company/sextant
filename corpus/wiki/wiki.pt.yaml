                    <tr><td>Naves leves (3)</td><td>Fábrica de armamento (nív. 1), Corveta (nív. 2), Corveta a laser (nív. 3).</td><td>Indústria 3</td><td>9&nbsp;000; 14 min 20 s</td></tr>
                    <tr><td>Naves pesadas (3)</td><td>Indústria pesada (nív. 1), Couraçado (nív. 2), Destroyer (nív. 3).</td><td>Indústria 5</td><td>42&nbsp;000; 20 min</td></tr>
                </tbody>
            </table>
            <p>As naves exigem também o seu edifício (Estaleiro espacial, Fábrica de armamento ou Indústria pesada): veja <a href="/wiki/ship_types">Tipos de naves</a>.</p>

            <h3>Políticas</h3>
            <p>Como membro de uma aliança, você também acessa 7 <strong>pesquisas políticas</strong> que dependem do regime da sua aliança e do nível dela — por exemplo «&nbsp;Lei Macron&nbsp;» (produção) ou «&nbsp;Mobilização científica&nbsp;» (velocidade de pesquisa) para a Balança dos Mundos. Elas são pagas com seus próprios Bitcoins: veja <a href="/wiki/alliance_research">Pesquisas de aliança</a>.</p>

            <h2 id="modos-especiais">Modos de servidor com pesquisas máximas</h2>
            <p>Em certos modos (Battle Royale, Dominação, Pesquisa &amp; Destruição), todas as suas pesquisas individuais começam no <strong>nível máximo</strong> e seu planeta inicial recebe 500 urânio. Resta então apenas fazer as pesquisas políticas da sua aliança.</p>

    workers_scientists:
        title: "Trabalhadores e cientistas"
        category: "economy"
        order: 4
        tags: "trabalhadores,cientistas,populacao,bitcoin,receita,fome,defesa,velocidade de pesquisa"
        summary: "As duas populações do seu império: os trabalhadores que rendem os Bitcoins e os cientistas que aumentam a velocidade de pesquisa."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="trabalhadores">Os trabalhadores</h2>
            <p>Os trabalhadores são sua <strong>principal fonte de Bitcoins</strong>. No relatório diário, cada trabalhador presente nos seus planetas rende <strong>0,5 Bitcoin</strong>: 10&nbsp;000 trabalhadores = 5&nbsp;000 Bitcoins por dia, antes das taxas de aliança e de paz. Os trabalhadores embarcados em uma frota não rendem nada. Eles não custam nenhuma manutenção em Bitcoins, apenas comida.</p>
            <p>Seu <strong>número máximo</strong> depende dos seus edifícios:</p>
            <ul>
                <li><strong>Grande cidade</strong>: +25&nbsp;000 trabalhadores no máx. e cerca de +8&nbsp;000 trabalhadores por dia, por nível.</li>
                <li><strong>Metrópole</strong>: +80&nbsp;000 trabalhadores no máx. e cerca de +12&nbsp;000 trabalhadores por dia, por nível.</li>
                <li><strong>Campo de escravos</strong>: +2&nbsp;500 trabalhadores no máx. por nível.</li>
            </ul>
            <p>Seu planeta inicial começa no teto (50&nbsp;000 trabalhadores para 50&nbsp;000 de máximo): construa uma Grande cidade para continuar crescendo.</p>
            <p>A população <strong>cresce sozinha</strong> até o teto, no ritmo dado pelas suas Grandes cidades e Metrópoles (+20&nbsp;% por nível da pesquisa de aliança «&nbsp;Política familiar&nbsp;», duas vezes mais devagar sob embargo). A comida não a faz crescer, mas se suas rações chegarem a zero, a fome mata uma parte dos seus trabalhadores.</p>

            <h2 id="cientistas">Os cientistas</h2>
            <p>Para recrutar cientistas (página <strong>Defesa</strong>), é preciso um <strong>Centro de pesquisa</strong> no planeta: cada nível abriga 250 cientistas. Cada um custa <strong>25 Bitcoins e 10 trabalhadores</strong> no recrutamento, depois <strong>3 Bitcoins por dia</strong> de manutenção (30 vezes um Legionário em solo). A pesquisa de aliança «&nbsp;Entusiasmo científico&nbsp;» reduz essa manutenção.</p>
            <p>Os cientistas servem para aumentar sua <strong>velocidade de pesquisa</strong>. Ela vale 1 no início, e a duração de uma pesquisa é dividida por essa velocidade (velocidade 2 = pesquisas duas vezes mais rápidas). Como ela evolui:</p>
            <ul>
                <li>Ela progride por <strong>patamares inteiros</strong>. Os cientistas chegam ao longo da formação, e uma chegada só faz ganhar um patamar se contar <strong>pelo menos 5&nbsp;000 cientistas de uma vez</strong>. Chegadas menores não mudam a velocidade: na prática, recrutar algumas centenas de cientistas não encurta suas pesquisas.</li>
                <li>A pesquisa de aliança «&nbsp;Mobilização científica&nbsp;» (Balança dos Mundos) adiciona 0,1 de velocidade por nível; mas a próxima chegada de cientistas arredonda a velocidade para o inteiro mais próximo.</li>
                <li>A duração de uma pesquisa é fixada ao ser iniciada: um ganho de velocidade só beneficia as pesquisas iniciadas depois.</li>
            </ul>

            <h2 id="defesa">Papel defensivo</h2>
            <p>Seus <strong>trabalhadores participam da defesa em solo</strong> — mas apenas durante uma <strong>invasão</strong> (quando o inimigo quer tomar seu planeta). Durante um <strong>raid</strong> clássico (saque simples), eles ficam escondidos.</p>
            <p>A pesquisa de aliança «&nbsp;Reforço ideológico&nbsp;» (Baluarte Silencioso) aumenta a defesa deles em 20&nbsp;% por nível.</p>

            <h2 id="gerir">Gerenciar bem sua população</h2>
            <ul>
                <li>Seus trabalhadores comem <strong>1 ração por hora para 500 trabalhadores</strong> (50&nbsp;000 trabalhadores = 100 rações por hora; um Campo agrícola de nível 1 produz 162).</li>
                <li>Se o celeiro estiver vazio, as rações carregadas nas suas próprias frotas em órbita do planeta são consumidas automaticamente.</li>
                <li>Depois disso, é a fome: seus trabalhadores morrem (0,5&nbsp;% por ciclo de 10 minutos no início, até 2&nbsp;% se durar mais de 8 horas), depois seus Legionários e seus Mechas. A fome nunca faz um planeta cair abaixo de 5&nbsp;000 trabalhadores.</li>
                <li>Mantenha Silos agrícolas cheios, sobretudo diante de um embargo (veja <a href="/wiki/embargo">Embargo e fome</a>).</li>
            </ul>

            <h2 id="reserve-5000">A reserva intocável de 5 000 trabalhadores</h2>
            <p>Suas próprias ações <strong>nunca podem fazer um planeta cair abaixo de 5 000 trabalhadores</strong>: toda ação que o fizesse passar para baixo é bloqueada com uma mensagem clara. A fome também para nesse limite; somente uma invasão inimiga pode matar trabalhadores além dele. Estão incluídos:</p>
            <ul>
                <li>O <strong>recrutamento de defesa</strong> (Legionários, Mechas, cientistas) que consome trabalhadores.</li>
                <li>A <strong>construção de naves</strong> no Estaleiro espacial.</li>
                <li>O <strong>carregamento de trabalhadores em um cargueiro</strong> com vistas a uma transferência.</li>
            </ul>
            <p>O botão «&nbsp;MÁX&nbsp;» das páginas de produção leva essa reserva em conta: ele nunca proporá um máximo que esvaziaria seu planeta abaixo do limite.</p>
            <p>Atenção: uma nova colônia começa com 2&nbsp;500 trabalhadores. Você só poderá gastar trabalhadores nela depois de ultrapassar os 5&nbsp;000.</p>

    market:
        title: "Mercado e mercadores"
        category: "economy"
        order: 5
        tags: "mercado,mercadores,venda,comercio,cargueiro,cargo,bitcoin,preco,pontos de guerra"
        summary: "Vender recursos e tropas aos mercadores em troca de Bitcoins, entregando você mesmo ou com um clique, e trocar seus Pontos de Guerra."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="mercadores">Quem são os mercadores?</h2>
            <p>São <strong>personagens não jogadores</strong> (NPC) instalados em planetas mercantes fixos: 20 por galáxia, nos mesmos setores em cada galáxia (os quatro cantos, o centro e posições intermediárias). A posição deles é visível no mapa.</p>
            <p>Eles compram de você, em troca de Bitcoins, seu <strong>niobium</strong>, sua <strong>água</strong> e seu <strong>urânio</strong>, mas também <strong>trabalhadores</strong>, <strong>Legionários</strong>, <strong>cientistas</strong> e <strong>Mechas</strong>. Eles não compram as rações.</p>

            <h2 id="vender">Como vender a eles</h2>
            <ol>
                <li>Carregue uma frota (um <strong>cargueiro</strong>, de preferência) com o que você quer vender.</li>
                <li>Envie-a ao mercador em missão <strong>«&nbsp;Descarregar e voltar&nbsp;»</strong>. O combustível é pago em Bitcoins: essa missão custa o dobro na ida, e depois a volta é cobrada na tarifa normal quando a frota parte de novo.</li>
                <li>Na chegada, toda a carga vendável é vendida: você recebe Bitcoins e alguns Pontos de Guerra. As rações permanecem a bordo.</li>
                <li>A frota volta automaticamente para a sua casa.</li>
            </ol>
            <p>Se uma horda de Cthulhu bloquear um mercador, ele recusa qualquer venda enquanto o bloqueio durar.</p>

            <h2 id="vente-clic">Vender com um clique, sem frota</h2>
            <p>Página <strong>Planetas</strong>, aba <strong>Venda aos mercadores</strong>: adicione à lista os planetas de sua escolha (menu «&nbsp;Adicionar&nbsp;») e depois clique em <strong>Vender aos mercadores</strong>. Todo o niobium e toda a água desses planetas são vendidos na hora, sem cargueiro nem combustível, mas <strong>20&nbsp;% mais barato</strong> do que entregando você mesmo (0,10 Bitcoin por niobium, 0,25 por água) e sem Pontos de Guerra. Um planeta atacado ou sob embargo é ignorado.</p>

            <h2 id="imunidade">Os mercadores são intocáveis</h2>
            <p>Os mercadores são <strong>imunes a qualquer ataque</strong>. Você não pode fazer raid contra eles, invadi-los nem combatê-los. As frotas deles nunca participam de um combate, mesmo que estejam no mesmo ponto de um confronto.</p>
            <p>Atenção, porém: nos servidores com PvE, uma <strong>horda alien em modo ataque</strong> pode estacionar na órbita de um mercador (cada mercador recebe uma na criação da galáxia, mais poderosa em direção ao centro). Um cargueiro sem armas que chega a essa órbita é atacado e destruído sem vender nada. Antes de enviar seus cargueiros, certifique-se de que nenhuma horda guarda esse mercador, ou use a venda com um clique.</p>

            <h2 id="ganho">Quanto rende?</h2>
            <p>Preços básicos por unidade, entregando você mesmo:</p>
            <table>
                <thead>
                    <tr><th>Mercadoria</th><th>Bitcoins por unidade</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium</td><td>0,125 (1&nbsp;000 niobium = 125)</td></tr>
                    <tr><td>Água</td><td>0,3125 (1&nbsp;000 água = 312)</td></tr>
                    <tr><td>Urânio</td><td>2&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>As tropas e os trabalhadores embarcados também são comprados; o valor de cada venda consta no relatório «&nbsp;Venda aos mercadores&nbsp;». A água rende 2,5 vezes mais que o niobium. A pesquisa de aliança «&nbsp;Acordos comerciais&nbsp;» (Balança dos Mundos) adiciona 5&nbsp;% por nível, até +25&nbsp;%, e um herói de Economia de nível 10 (traço «&nbsp;Negociante&nbsp;») adiciona 15&nbsp;% às vendas que ele acompanha: as da sua frota, ou as do seu planeta na venda com um clique. A aba Venda aos mercadores da página Planetas exibe seus preços reais.</p>

            <h2 id="dica">Dica</h2>
            <p>Em vez de deixar seus estoques saturarem, venda regularmente: envie um cargueiro bem cheio (o combustível é pago em Bitcoins, é melhor uma carga grande do que várias pequenas) ou use a venda com um clique para financiar suas pesquisas ou seu exército.</p>

            <h2 id="points-de-guerre">Trocar seus Pontos de Guerra</h2>
            <p>A página <strong>Objetivos</strong>, que lista suas missões do dia, também permite gastar seus Pontos de Guerra: <strong>1 PDG = 1 Bitcoin</strong>, <strong>2 Legionários</strong> ou <strong>10 trabalhadores</strong>, entregues no planeta de sua escolha dentro do limite dos tetos dele.</p>

    recycling:
        title: "Reciclagem"
        category: "economy"
        order: 6
        tags: "reciclagem,detritos,cdr,reciclador,asteroide,uranio"
        summary: "Depois de cada combate, sobram detritos. Recuperá-los é uma mina a céu aberto."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principio">Os detritos: o que são?</h2>
            <p>Cada nave destruída em combate deixa uma parte do seu custo sob a forma de <strong>detritos</strong> flutuando no espaço. Isso se chama <strong>CDR</strong> (Campo De Recursos).</p>
            <p>Um campo deixado por um combate contém <strong>niobium</strong> e <strong>água</strong>, nunca urânio. Ele permanece na posição do confronto, seja ela qual for (planeta, vaga vazia…), onde um ícone o sinaliza no mapa.</p>
            <p>Existem também <strong>campos de asteroides</strong> que aparecem sozinhos no mapa. Há três tipos: niobium, água ou <strong>urânio</strong>. Eles se recarregam a cada 7 a 40 horas e às vezes mudam de lugar:</p>
            <ul>
                <li>niobium: 40&nbsp;000 a 800&nbsp;000 por recarga;</li>
                <li>água: 30&nbsp;000 a 500&nbsp;000 por recarga;</li>
                <li>urânio: 50 a 180 por recarga.</li>
            </ul>
            <p>Eles costumam ser guardados por uma frota alien que ataca todo recém-chegado.</p>

            <h2 id="quanto">Quantos detritos?</h2>
            <p>Um campo contém <strong>40&nbsp;% do custo de construção das naves realmente destruídas</strong>, nos dois lados. Cada nave devolve seus próprios recursos: um Destroyer (2&nbsp;100 niobium, 6&nbsp;000 água) deixa sobretudo água. Os sobreviventes não deixam nada.</p>
            <p>Três casos particulares:</p>
            <ul>
                <li>Diante das hordas de <strong>Cthulhu</strong>, a taxa cai para <strong>20&nbsp;%</strong>.</li>
                <li>A <strong>carga</strong> (niobium e água) de uma frota inteiramente destruída também se derrama no campo, a 40&nbsp;%. Um vencedor avariado, por sua vez, mantém todo o seu porão.</li>
                <li>As naves pagas em <strong>pontos de guerra</strong> (Caçador de plasma, Corveta de combate, Nave de batalha, Caravela) não deixam <strong>nenhum</strong> detrito, pois não custam nem niobium nem água. As <strong>defesas planetárias</strong> arrasadas também nunca deixam.</li>
            </ul>
            <p>Um <strong>combate orbital</strong> (frota abatida pelas torres de um planeta em modo ataque, ou naves perdidas ao forçar uma órbita defendida) deixa um campo segundo a mesma regra.</p>

            <h2 id="como">Como reciclar</h2>
            <ol>
                <li>Pesquise <strong>Reciclagem orbital</strong> (página <em>Pesquisas</em>, exige <em>Naves utilitárias</em> nível 3).</li>
                <li>Fabrique <strong>recicladores</strong> no seu Estaleiro espacial (2&nbsp;200 niobium, 1&nbsp;000 água e 10 trabalhadores cada).</li>
                <li>Crie uma frota com seus recicladores, e cargueiros para o porão (veja mais abaixo).</li>
                <li>Envie-a para as coordenadas do campo em missão <strong>Normal</strong>. No <em>Mapa espacial</em>: clique na posição, depois em <em>Interação</em>, escolha a frota e a missão <em>Normal</em>, depois <em>Enviar</em>. Não existe missão especial de reciclagem.</li>
                <li>Assim que chega, a reciclagem começa sozinha: uma primeira coleta na hora, depois uma a cada <strong>5 minutos</strong>.</li>
                <li>Quando o porão está cheio ou o campo vazio, a reciclagem para e você recebe o relatório «&nbsp;Sua frota parou de reciclar!&nbsp;». <strong>A frota permanece no local</strong>: cabe a você trazê-la de volta. O botão <em>Reciclar</em> da frota reinicia a reciclagem se ainda houver espaço nela.</li>
            </ol>
            <p>Uma frota que espera em um campo de asteroides retoma a reciclagem sozinha a cada recarga do campo, desde que ainda tenha espaço.</p>

            <h2 id="capacidade">Quanto um reciclador pode trazer?</h2>
            <p>A cada passagem, cada reciclador recolhe <strong>1&nbsp;000 recursos</strong>, repartidos em partes iguais entre os recursos presentes no campo (niobium, água, urânio).</p>
            <p><strong>Atenção: um reciclador tem apenas 1&nbsp;000 de porão.</strong> Sozinho, ele fica cheio já na primeira passagem. Para esvaziar um campo grande, adicione cargueiros à frota: o porão deles se enche no ritmo dos seus recicladores.</p>
            <table>
                <thead>
                    <tr><th>Nave</th><th>Porão</th></tr>
                </thead>
                <tbody>
                    <tr><td>Reciclador</td><td>1&nbsp;000</td></tr>
                    <tr><td>Cargo I</td><td>3&nbsp;000</td></tr>
                    <tr><td>Cargo V</td><td>10&nbsp;000</td></tr>
                    <tr><td>Cargo X</td><td>25&nbsp;000</td></tr>
                    <tr><td>Caravela</td><td>40&nbsp;000</td></tr>
                </tbody>
            </table>
            <p>A pesquisa de aliança <strong>Cargos melhorados</strong> aumenta o porão dos cargueiros e da Caravela.</p>
            <p>Exemplos:</p>
            <ul>
                <li>5 recicladores sozinhos: 5&nbsp;000 recursos recolhidos assim que chegam, depois a frota está cheia.</li>
                <li>1 reciclador + 2 Cargos I (7&nbsp;000 de porão): 1&nbsp;000 por passagem, ou seja, 5&nbsp;000 recursos em 20 minutos (na chegada, depois aos 5, 10, 15 e 20 minutos).</li>
                <li>10 recicladores + 5 Cargos V (60&nbsp;000 de porão): 10&nbsp;000 por passagem, frota cheia na 6ª passagem, ou seja, em cerca de 25 minutos.</li>
            </ul>
            <p>A pesquisa de aliança <strong>Otimização de reciclagem</strong> (regime <em>O Baluarte Silencioso</em>) adiciona 400 recursos por reciclador e por passagem a cada nível, até 3&nbsp;000 no nível 5. Ela não aumenta o porão dos recicladores: preveja cargueiros para aproveitá-la.</p>

            <h2 id="estrategia">Estratégia</h2>
            <ul>
                <li>Depois de cada combate, envie imediatamente recicladores: senão, seus adversários os terão.</li>
                <li>Proteja-os: um reciclador isolado é um alvo fácil, e os campos de asteroides costumam ser guardados.</li>
                <li>Os combates nunca deixam urânio: recicle os <strong>campos de asteroides de urânio</strong> (50 a 180 unidades por recarga), ou liberte bases aliens.</li>
                <li>A reciclagem é muito rentável: pense nela como uma segunda economia por trás das suas minas.</li>
            </ul>

    daily_report:
        title: "O relatório diário"
        category: "economy"
        order: 7
        tags: "relatorio,diario,cotidiano,balanco,receitas,custos,taxa"
        summary: "Todo dia às 18h59 (hora de Paris), o jogo faz o seu balanço: receitas, custos, taxas. Para acompanhar de perto."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="quando">Quando acontece</h2>
            <p>Todo dia às <strong>18h59 (hora de Paris)</strong>, ou seja, 17h59 UTC no inverno e 16h59 UTC no verão. É um compromisso fixo para todos os jogadores do servidor.</p>
            <p>Você recebe um «&nbsp;Relatório do império&nbsp;» na página <strong>Relatório</strong>, aba <strong>Econômicos</strong>.</p>

            <h2 id="conteudo">O que o relatório contém</h2>
            <ul>
                <li><strong>Receitas</strong> — 0,5 Bitcoin por trabalhador presente nos seus planetas no momento do relatório.</li>
                <li><strong>Custos de manutenção</strong> — Legionários, Mechas, cientistas, naves, edifícios. Tudo o que está em uma frota, mesmo estacionada em órbita, custa bem mais caro do que o que está em solo (tabela em <a href="/wiki/bitcoin_economy#bareme">Bitcoins e manutenção</a>).</li>
                <li><strong>Taxa de paz</strong> — se a sua aliança assinou uma paz em que deve pagar uma taxa à outra aliança: essa porcentagem é retirada da receita dos seus trabalhadores.</li>
                <li><strong>Taxa de aliança</strong> — retirada da receita dos seus trabalhadores e paga à tesouraria da sua aliança. Com uma taxa de t&nbsp;%, a parte retirada vale receita × t ÷ (100 + t): uma taxa de 10&nbsp;% leva cerca de 9&nbsp;% da sua receita.</li>
                <li><strong>Balanço final</strong> — receitas − taxas − custos, somado ao seu saldo.</li>
                <li><strong>Ameaça Cthulhu</strong> — se os Cthulhu estiverem ativos para você, a ameaça que pesa sobre o seu império sobe 5 pontos (300 no máximo).</li>
            </ul>

            <h2 id="missoes">As missões diárias</h2>
            <p>O relatório diário <strong>renova suas 3 missões</strong> do dia: as da véspera que você não terminou desaparecem. Encontre-as na página <strong>Objetivos</strong> (veja <a href="/wiki/quests">Missões diárias</a>).</p>

            <h2 id="perigo">O perigo a vigiar</h2>
            <p>Se o seu saldo ficar <strong>negativo</strong> depois do relatório, é o <strong>Game Over econômico</strong>: todas as suas frotas e todas as naves em solo dos seus planetas são perdidas, e seu saldo volta para 125&nbsp;000 Bitcoins (seus planetas, edifícios e pesquisas não mudam). Um relatório «&nbsp;Falência iminente&nbsp;» avisa você com antecedência, no máximo uma vez por dia.</p>
            <p>Verifique seu relatório todo dia. Se seus custos subirem demais: ponha em solo as frotas que não estão servindo (a manutenção delas é dividida por 6), desacelere o recrutamento, venda tropas ou recursos aos mercadores.</p>

    exchange:
        title: "Trocas entre jogadores"
        category: "economy"
        order: 8
        tags: "troca,alianca,recursos,bitcoin,doacao,deposito,urânio,descarregamento"
        summary: "Como enviar recursos a outro jogador ou Bitcoins a um aliado, e os limites dessa operação."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Area Universe permite enviar recursos a <strong>qualquer jogador</strong> por frota, e Bitcoins aos membros da sua aliança pela tesouraria. Isso é muito útil para:</p>
            <ul>
                <li>Reerguer um aliado que acaba de ser saqueado.</li>
                <li>Reunir esforços em uma construção cara.</li>
                <li>Abastecer um membro da sua aliança sob embargo.</li>
            </ul>

            <h2 id="recursos">Enviar recursos físicos</h2>
            <p>Carregue o que você quer entregar no porão de uma frota: niobium, água, rações, urânio, mas também trabalhadores, Legionários, cientistas ou Mechas. Envie-a depois em missão <strong>«&nbsp;Descarregar e voltar&nbsp;»</strong> para o planeta do destinatário.</p>
            <p>Na chegada, tudo é depositado dentro do limite das capacidades do planeta (armazenamento, tetos de Legionários, de trabalhadores e de cientistas, 500 Mechas no máximo); o excedente permanece a bordo. A frota volta sozinha e o destinatário recebe um relatório de depósito.</p>

            <h2 id="bitcoins">Enviar Bitcoins</h2>
            <p>Os Bitcoins são transferidos pela <strong>tesouraria de aliança</strong> (veja <a href="/wiki/alliance_treasury">Tesouraria de aliança</a>): você deposita ali, depois o membro a ser ajudado pede um saque em seu nome. O saque é imediato para um membro que tem a permissão «&nbsp;Modificar&nbsp;» (e para todos em uma aliança do Baluarte Silencioso); caso contrário, ele espera a validação de um membro que tenha essa permissão.</p>

            <h2 id="limites">Os limites</h2>
            <ul>
                <li>Não há <strong>nenhum limite diário</strong> nem teto de envio: contam apenas a capacidade de porão das suas frotas (Cargo I: 3&nbsp;000 vagas, Cargo V: 10&nbsp;000, Cargo X: 25&nbsp;000, 1 vaga por unidade e 500 por Mecha) e a capacidade de armazenamento do planeta de chegada.</li>
                <li>Os recursos viajam obrigatoriamente por frota: é preciso tempo e combustível, pago em Bitcoins. Uma missão «&nbsp;Descarregar e voltar&nbsp;» custa o dobro na ida, e depois a volta é cobrada na tarifa normal quando a frota parte de novo.</li>
                <li>Um planeta sob <strong>embargo</strong> só pode receber entrega do seu proprietário ou de um membro da mesma aliança.</li>
                <li>O urânio é transportado como o resto, e o planeta que o recebe não tem limite de armazenamento de urânio.</li>
            </ul>

    fleet_creation:
        title: "Criar e enviar uma frota"
        category: "fleet"
        order: 1
        tags: "frota,criacao,naves,composicao,estaleiro,missao"
        summary: "Da fabricação da nave até a chegada ao destino: o percurso completo."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequisitos">O que você precisa</h2>
            <ul>
                <li>Um <strong>Estaleiro espacial</strong> no seu planeta ativo.</li>
                <li>Os recursos da nave: niobium, água e trabalhadores na maioria das vezes, às vezes Pontos de Guerra, Bitcoins ou Legionários (tabela em <em>Tipos de naves</em>).</li>
                <li>As pesquisas exigidas pela nave desejada (por ex. <em>Gestão de cargas</em> para os cargueiros).</li>
            </ul>

            <h2 id="fabricar">Etapa 1 — Fabricar as naves</h2>
            <p>Na página <strong>Estaleiro espacial</strong> (aba <strong>Construção de naves</strong>), escolha um modelo e uma quantidade e depois clique em <strong>Construir</strong>. A produção ocorre em segundo plano; cada nave tem uma duração básica, encurtada pela produção espacial do planeta.</p>

            <h2 id="compor">Etapa 2 — Compor a frota</h2>
            <p>Quando as naves forem entregues, vá à página <strong>Frotas</strong> e clique em <strong>Criar uma nova frota</strong>: escolha as naves que embarcam e um nome (12 caracteres no máximo). Abra depois a frota (clique no nome dela) para:</p>
            <ul>
                <li>Adicionar ou retirar naves (aba <strong>Naves</strong>, botão <strong>Gerenciar</strong>), quando a frota está em um dos seus planetas.</li>
                <li>Carregar <strong>recursos</strong> (aba <strong>Frete</strong>), quando a frota está em um dos seus planetas.</li>
                <li>Embarcar <strong>Legionários</strong> ou Mechas (aba <strong>Frete</strong>) para um raid ou uma invasão: cada Legionário ocupa 1 vaga de porão, cada Mecha 500, e são as barcaças que os desembarcam.</li>
            </ul>

            <h2 id="enviar">Etapa 3 — Enviar a frota</h2>
            <ol>
                <li>Escolha o <strong>destino</strong>: na aba <strong>Mover a frota</strong> (campos galáxia, sistema e planeta, no formato <code>Galáxia:Setor:Posição</code>, ou lista «&nbsp;Meus planetas&nbsp;»), ou clicando na casa a partir do <strong>Mapa espacial</strong> e depois em <strong>Interação</strong>.</li>
                <li>Escolha um <strong>tipo de missão</strong> (Normal, Descarregar e voltar, Sonda, Colonizar, Saquear, Invadir… veja <em>Tipos de missões</em>). A aba <strong>Mover a frota</strong> serve para os deslocamentos simples (Normal) e a espionagem; as outras missões são enviadas a partir do Mapa espacial.</li>
                <li>Na aba <strong>Mover a frota</strong>, confira o custo do combustível (em <strong>Bitcoins</strong>) e a duração estimados.</li>
                <li>Clique em <strong>Enviar</strong>.</li>
            </ol>
            <p>A frota aparece na sua lista de frotas em voo. Durante os <strong>2 primeiros minutos</strong>, um botão ✕ com contagem regressiva (ou a linha <strong>Cancelar</strong> da página dela) permite <strong>cancelar o envio</strong>: a frota volta na hora ao planeta de partida, mas o combustível pago não é devolvido. Passado esse prazo, ela vai até o fim.</p>

            <h2 id="dicas">Dicas</h2>
            <ul>
                <li>Um <strong>reciclador</strong> em uma frota de ataque recolhe os detritos assim que o combate termina, mas a atrasa: a frota avança na velocidade dele, três vezes mais lenta que a de um caçador. Para um ataque rápido, envie os recicladores à parte, depois que o combate terminar.</li>
                <li>Nunca envie toda a sua defesa de uma vez: guarde o suficiente para manter seu planeta.</li>
                <li>Somente a missão <strong>Descarregar e voltar</strong> traz a frota de volta sozinha, e essa volta é paga em Bitcoins como uma viagem normal. Depois de qualquer outra missão, a frota permanece em órbita do seu destino: fazê-la voltar é um novo envio, com seu próprio combustível.</li>
            </ul>

    ship_types:
        title: "Tipos de naves"
        category: "fleet"
        order: 2
        tags: "naves,caçador,corveta,fragata,couraçado,cruzador,destroyer,cargo,cargueiro,sonda,lunar,caravela,reciclador,custo,velocidade,pre-requisitos"
        summary: "Todas as naves do jogo: função, custo, velocidade, porão, pré-requisitos e características de combate."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitarias">Naves utilitárias</h2>
            <p>Elas não têm armas. Servem para transportar, explorar, reciclar, colonizar.</p>
            <table>
                <tr><th>Nave</th><th>Função</th><th>Capacidade</th></tr>
                <tr><td>Sonda</td><td>Espionar um planeta.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Transporte leve.</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>Transporte médio.</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>Grande transporte.</td><td>25&nbsp;000</td></tr>
                <tr><td>Caravela</td><td>Cargueiro premium: o maior e o mais rápido dos cargueiros. Pago em Pontos de Guerra (25) + 15&nbsp;trabalhadores por unidade produzida.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonizador</td><td>Fundar uma colônia em um planeta desabitado.</td><td>—</td></tr>
                <tr><td>Reciclador</td><td>Coletar os detritos de combate: 1&nbsp;000 por ciclo de 5 min (mais com a pesquisa de aliança <em>Otimização de reciclagem</em>). Seu próprio porão contém apenas 1&nbsp;000: adicione cargueiros à frota para recolher mais.</td><td>1&nbsp;000</td></tr>
                <tr><td>Barcaça de invasão</td><td>Transportar Legionários para um raid ou uma invasão.</td><td>1&nbsp;000 Legionários</td></tr>
                <tr><td>Lunar (às vezes chamado de Moon Maker)</td><td>Criar uma lua em uma casa vazia que contenha detritos suficientes (pelo menos 2M de niobium e 2M de água).</td><td>—</td></tr>
                <tr><td>Nave radar</td><td>Implanta-se em uma casa vazia e instala ali um radar (potência 1) por 2&nbsp;h: você passa então a ver esse setor.</td><td>—</td></tr>
                <tr><td>Nave bloqueadora</td><td>Implanta-se em uma casa vazia e instala ali um bloqueador (potência 1) por 1&nbsp;h.</td><td>—</td></tr>
                <tr><td>Nave mãe</td><td>Nave capitânia, uma única por comandante. Em combate, ela traz à sua frota 20&nbsp;000 de casco e 5&nbsp;000 de escudo, depois +5&nbsp;% de casco e de escudo e +10&nbsp;% de precisão. Ela encurta em 10&nbsp;% a duração de voo da sua frota e reduz a assinatura dela em 10&nbsp;%, mas voa ela mesma a 250 lumens, mais lentamente que um caçador.</td><td>—</td></tr>
            </table>

            <h2 id="combate">Naves de combate</h2>
            <p>As naves de combate se distinguem pelo casco, pelo escudo e pelas armas (míssil, laser, plasma). Em combate, a potência de toda a sua frota se soma: não há nem alcance, nem bônus de um tipo de nave contra outro. Duas regras contam:</p>
            <ul>
                <li>os três caçadores <strong>não têm escudo</strong> e absorvem os danos primeiro: eles protegem as naves grandes;</li>
                <li>o <strong>laser</strong> e, sobretudo, o <strong>plasma</strong> atravessam melhor os escudos inimigos do que o míssil.</li>
            </ul>
            <p>Valores básicos por nave, antes das suas melhorias (artigo <em>Personalizar suas naves</em>). A coluna «&nbsp;Armas&nbsp;» dá míssil / laser / plasma; «&nbsp;—&nbsp;»: a nave não tem essa característica.</p>
            <h3>Caçadores e corvetas</h3>
            <table>
                <tr><th>Nave</th><th>Casco</th><th>Escudo</th><th>Armas</th><th>Pontos</th></tr>
                <tr><td>Caçador</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Caçador pesado</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Caçador de plasma</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Corveta</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Corveta a laser</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Corveta de combate</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Fragatas e naves pesadas</h3>
            <table>
                <tr><th>Nave</th><th>Casco</th><th>Escudo</th><th>Armas</th><th>Pontos</th></tr>
                <tr><td>Fragata</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Fragata de plasma</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Nave de batalha</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Cruzador</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Couraçado</td><td>1&nbsp;250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Destroyer</td><td>2&nbsp;600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>«&nbsp;Pontos&nbsp;»: o crédito de pontos de melhoria do modelo. O <strong>Caçador de plasma</strong> e a <strong>Nave de batalha</strong> não têm <strong>nenhuma arma</strong> no início: as armas deles vêm inteiramente dos pontos que você atribui a eles.</p>

            <h2 id="faccoes">O bônus de +20&nbsp;%: a política de aliança</h2>
            <p>Não existe «&nbsp;facção&nbsp;» de nave. O único bônus de +20&nbsp;% do combate espacial vem da <strong>política da sua aliança</strong>: a Balança dos Mundos vence o Baluarte Silencioso, que vence o Martelo das Estrelas, que vence a Balança dos Mundos.</p>
            <p>Quando a política do <strong>atacante</strong> vence a do defensor, todas as suas armas (míssil, laser, plasma) ganham +20&nbsp;% para esse combate; o defensor nunca se beneficia. Um jogador sem aliança não tem nem bônus, nem penalidade.</p>

            <h2 id="bonus-cargueiro">Capacidade de transporte</h2>
            <p>A capacidade dos cargueiros (Cargo I, V, X e Caravela) aumenta <strong>+20&nbsp;% por nível</strong> da pesquisa de aliança <strong>Cargos melhorados</strong> (5 níveis, aliança de nível 3 pelo menos). No nível 5, um Cargo I leva 6&nbsp;000 em vez de 3&nbsp;000. Os porões das outras naves não mudam.</p>

            <h2 id="reference">Tabela de referência</h2>
            <h3>Custo e produção</h3>
            <p>Custo de uma nave. A duração é a duração básica de produção de uma unidade, encurtada pela produção espacial do seu planeta.</p>
            <table>
                <tr><th>Nave</th><th>Custo</th><th>Duração</th></tr>
                <tr><td>Sonda</td><td>1&nbsp;000 niobium</td><td>20 s</td></tr>
                <tr><td>Cargo I</td><td>800 niobium, 650 água, 10 trabalhadores</td><td>30 s</td></tr>
                <tr><td>Cargo V</td><td>2&nbsp;200 niobium, 1&nbsp;500 água, 20 trabalhadores</td><td>1 min</td></tr>
                <tr><td>Cargo X</td><td>4&nbsp;500 niobium, 3&nbsp;800 água, 25 trabalhadores</td><td>1 min 30 s</td></tr>
                <tr><td>Caravela</td><td>25 Pontos de Guerra, 15 trabalhadores</td><td>2 min</td></tr>
                <tr><td>Reciclador</td><td>2&nbsp;200 niobium, 1&nbsp;000 água, 10 trabalhadores</td><td>1 min</td></tr>
                <tr><td>Colonizador</td><td>5&nbsp;500 niobium, 7&nbsp;000 água, 2&nbsp;000 trabalhadores, 5 Legionários</td><td>1 h</td></tr>
                <tr><td>Barcaça de invasão</td><td>5&nbsp;000 niobium, 3&nbsp;500 água, 10 trabalhadores</td><td>1 min</td></tr>
                <tr><td>Nave radar</td><td>500 niobium, 600 água, 2&nbsp;500 Bitcoins</td><td>5 min</td></tr>
                <tr><td>Nave bloqueadora</td><td>1&nbsp;100 niobium, 1&nbsp;300 água, 5&nbsp;500 Bitcoins</td><td>10 min</td></tr>
                <tr><td>Lunar</td><td>50&nbsp;000 niobium, 23&nbsp;000 água, 20&nbsp;000 trabalhadores, 200&nbsp;000 Bitcoins</td><td>5 h</td></tr>
                <tr><td>Nave mãe</td><td>17&nbsp;500 niobium, 9&nbsp;500 água, 2&nbsp;000 trabalhadores, 25&nbsp;000 Pontos de Guerra</td><td>3 h 53 min</td></tr>
                <tr><td>Caçador</td><td>25 niobium, 5 água, 1 trabalhador</td><td>1 s</td></tr>
                <tr><td>Caçador pesado</td><td>35 niobium, 13 água, 2 trabalhadores</td><td>3,2 s</td></tr>
                <tr><td>Caçador de plasma</td><td>1 Ponto de Guerra, 1 trabalhador</td><td>8 s</td></tr>
                <tr><td>Corveta</td><td>100 niobium, 60 água, 3 trabalhadores</td><td>6 s</td></tr>
                <tr><td>Corveta a laser</td><td>100 niobium, 200 água, 5 trabalhadores</td><td>10 s</td></tr>
                <tr><td>Corveta de combate</td><td>3 Pontos de Guerra, 3 trabalhadores</td><td>19 s</td></tr>
                <tr><td>Fragata</td><td>400 niobium, 200 água, 12 trabalhadores</td><td>20 s</td></tr>
                <tr><td>Fragata de plasma</td><td>300 niobium, 600 água, 14 trabalhadores</td><td>30 s</td></tr>
                <tr><td>Nave de batalha</td><td>8 Pontos de Guerra, 12 trabalhadores</td><td>40 s</td></tr>
                <tr><td>Cruzador</td><td>1&nbsp;000 niobium, 680 água, 30 trabalhadores</td><td>56 s</td></tr>
                <tr><td>Couraçado</td><td>1&nbsp;000 niobium, 920 água, 40 trabalhadores</td><td>1 min 4 s</td></tr>
                <tr><td>Destroyer</td><td>2&nbsp;100 niobium, 6&nbsp;000 água, 60 trabalhadores</td><td>4 min 30 s</td></tr>
            </table>

            <h3>Velocidade, assinatura e porão</h3>
            <p>A velocidade é em lumens, como na ficha da nave (quanto mais alta, mais rápida). A coluna «&nbsp;Voo&nbsp;» dá o tempo de voo por unidade de distância em um servidor de velocidade ×1 (um servidor acelerado encurta essas durações); uma frota voa no ritmo da sua nave mais lenta. A assinatura conta para o combustível e para o que os radares inimigos veem.</p>
            <table>
                <tr><th>Nave</th><th>Velocidade</th><th>Voo</th><th>Assinatura</th><th>Porão</th></tr>
                <tr><td>Sonda</td><td>299</td><td>1 s</td><td>1</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>280</td><td>40 s</td><td>10</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargo V</td><td>275</td><td>50 s</td><td>24</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargo X</td><td>270</td><td>60 s</td><td>50</td><td>25&nbsp;000</td></tr>
                <tr><td>Caravela</td><td>285</td><td>30 s</td><td>60</td><td>40&nbsp;000</td></tr>
                <tr><td>Reciclador</td><td>225</td><td>150 s</td><td>16</td><td>1&nbsp;000</td></tr>
