                </thead>
                <tbody>
                    <tr><td>Aeropônica (1)</td><td>Fazenda aeropônica; Silo agrícola (com Gestão de cargas 1).</td><td>—</td><td>16&nbsp;000; 8 min</td></tr>
                    <tr><td>Redefinição urbana (5)</td><td>Grande cidade (nív. 1), Metrópole (nív. 5).</td><td>—</td><td>8&nbsp;000; 8 min</td></tr>
                    <tr><td>Crescimento militar (3)</td><td>Caserna (nív. 1), Forte defensivo (nív. 3).</td><td>Redefinição urbana 1</td><td>11&nbsp;700; 15 min 30 s</td></tr>
                    <tr><td>Arame farpado (5)</td><td>+5&nbsp;% de potência dos seus Legionários na defesa em solo, por nível.</td><td>Crescimento militar 3</td><td>200&nbsp;000; 20 min</td></tr>
                    <tr><td>Sistema prisional (1)</td><td>Prisão e Campo de escravos.</td><td>Arame farpado 5</td><td>350&nbsp;000; 1 h</td></tr>
                    <tr><td>Unidades blindadas (1)</td><td>Mechas.</td><td>Crescimento militar 3</td><td>40&nbsp;000; 33 min 20 s</td></tr>
                    <tr><td>Expansão territorial (2)</td><td>Cidade flutuante (nív. 1), Estação orbital (nív. 2): mais espaço nos seus planetas.</td><td>Terraformação 18</td><td>75&nbsp;000 Pontos de Guerra; 1 h 40 min</td></tr>
                </tbody>
            </table>

            <h3>Armas</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>O que ela traz</th><th>Pré-requisito</th><th>Nível 1</th></tr>
