                    <tr><td>Arma míssil (3)</td><td>Caçador (nív. 1), Caçador pesado (nív. 2); o nível 3 é exigido por todas as naves de combate maiores.</td><td>Armamento 1</td><td>2&nbsp;600; 7 min 30 s</td></tr>
                    <tr><td>Arma laser (3)</td><td>Fragata e Corveta a laser (nív. 1); níveis superiores exigidos pelos cruzadores, couraçados e destroyers.</td><td>Armamento 3</td><td>13&nbsp;000; 30 min</td></tr>
                    <tr><td>Arma plasma (3)</td><td>Fragata de plasma (nív. 1), Cruzador (nív. 2), Couraçado e Destroyer (nív. 3).</td><td>Armamento 5</td><td>29&nbsp;000; 1 h 18 min</td></tr>
                </tbody>
            </table>

            <h3>Espaciais</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>O que ela traz</th><th>Pré-requisito</th><th>Nível 1</th></tr>
