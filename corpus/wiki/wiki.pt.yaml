articles:
    moderation_blocking:
        title: "Moderação: denunciar e bloquear"
        category: "beginner"
        order: 12
        tags: "moderacao,denuncia,bloqueio,chat,mensagens,termos"
        summary: "Denuncia uma mensagem abusiva, bloqueia um jogador indesejado e consulta as regras da comunidade que todos aceitam na primeira ligação."
        related: "salon,account_deletion"
        body: |
            <h2 id="termos">Termos de utilização</h2>
            <p>Na primeira ligação, cada jogador aceita os <strong>termos de utilização</strong> e as regras da comunidade: respeito pelos outros jogadores, nenhum conteúdo ilegal, obsceno ou difamatório, sem batota nem multi-contas abusivas. Se os termos mudarem, terão de ser aceites novamente.</p>
            <h2 id="denunciar">Denunciar uma mensagem</h2>
            <p>Cada mensagem do salão de chat e cada mensagem privada recebida tem um ícone de <strong>bandeira</strong>. Um clique abre a escolha do motivo: insultos ou assédio, spam, outro conteúdo inapropriado. A denúncia segue diretamente para a equipa de moderação, com uma cópia da mensagem.</p>
            <p>Um jogador também pode ser denunciado globalmente a partir do seu perfil (multi-contas, batota, insultos, spam). O limite é de três denúncias por dia, e o mesmo jogador só pode ser denunciado uma vez.</p>
            <h2 id="bloquear">Bloquear um jogador</h2>
            <p>O botão <strong>Bloquear</strong> no perfil de um jogador oculta imediatamente todas as suas mensagens nos salões de chat e impede qualquer troca de mensagens privadas, nos dois sentidos.</p>
            <p>A lista de jogadores bloqueados é gerida em <strong>As minhas opções</strong>: qualquer um pode ser desbloqueado aí a qualquer momento.</p>
    getting_started:
        title: "Primeiros passos"
        category: "beginner"
        order: 1
        tags: "inicio,comecar,novo,tutorial,guia"
        summary: "Bem-vindo! O guia mais curto para entender Area Universe e ter sucesso nas suas primeiras horas de jogo."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="o-que-e">O que é Area Universe?</h2>
            <p>Area Universe é um jogo de <strong>estratégia espacial multijogador</strong>. Você dirige um império: seus planetas produzem recursos, suas naves percorrem a galáxia, e suas alianças selam o destino dos jogadores.</p>
            <p>É um jogo <strong>que se joga a longo prazo</strong>: seus recursos se acumulam mesmo quando você está offline. Alguns minutos por dia são suficientes para progredir.</p>

            <h2 id="objetivo">Seu objetivo</h2>
            <p>Dependendo do modo de servidor escolhido (veja o artigo <em>Modos de jogo</em>), o objetivo final varia: resistir o máximo possível, dominar o ranking, ser o último de pé, etc. Mas a receita é sempre a mesma:</p>
            <ol>
                <li><strong>Fazer a economia girar</strong> (recursos + moeda).</li>
                <li><strong>Construir uma frota e uma defesa</strong>.</li>
                <li><strong>Aliar-se</strong> para ter mais peso com outros jogadores.</li>
            </ol>

            <h2 id="primeiras-acoes">Suas 6 primeiras ações</h2>
            <ol>
                <li><strong>Construa uma Mina de Nióbio e um Extrator de Água</strong> no seu planeta inicial.</li>
                <li><strong>Adicione uma Fazenda</strong> para alimentar seus trabalhadores.</li>
                <li><strong>Construa uma Cidade</strong> para aumentar o número de trabalhadores, seus fornecedores de <em>Bitcoins</em> (a moeda do jogo).</li>
                <li><strong>Construa um Centro de Pesquisa</strong>, depois um <strong>Estaleiro Espacial</strong> para fabricar suas primeiras naves.</li>
                <li><strong>Envie um cargueiro para vender recursos</strong> a um mercador: dinheiro fácil.</li>
                <li><strong>Junte-se a uma aliança</strong>: você ganha <strong>+20&nbsp;% de produção</strong> e acessa as pesquisas de aliança.</li>
            </ol>

            <h2 id="tutorial">O tutorial integrado</h2>
            <p>Um <strong>tutorial interativo</strong> te guia passo a passo. Ele é dividido em <strong>16 etapas</strong> (construção, frotas, combate…). Cada etapa completada dá uma recompensa (Bitcoins, Legionários, naves…).</p>
            <ul>
                <li>Você pode <strong>interrompê-lo</strong> ou <strong>retomá-lo</strong> a qualquer momento.</li>
                <li>Ele é acessível pelas suas <strong>Preferências</strong>.</li>
            </ul>

            <h2 id="vigiar">O que vigiar desde o início</h2>
            <ul>
                <li><strong>Bitcoins positivos</strong>: todo dia às 18h59 UTC, um balanço calcula suas receitas e custos de manutenção. Se você ficar no negativo, é o <strong>Game Over econômico</strong>.</li>
                <li><strong>Armazenamento</strong>: se seus depósitos estiverem cheios, a produção para. Construa estoques adequadamente.</li>
                <li><strong>Missões diárias</strong>: 3 missões por dia, todas completadas = <strong>+250 Pontos de Guerra</strong>.</li>
            </ul>

            <h2 id="protection-debutant">A proteção dos iniciantes</h2>
            <p>Durante os seus primeiros dias, você está <strong>protegido</strong>: nenhum jogador pode atacá-lo, saqueá-lo, invadi-lo ou bombardeá-lo. O suficiente para construir suas primeiras bases com tranquilidade.</p>
            <p>A proteção termina assim que uma destas condições for atingida:</p>
            <ul>
                <li>Passaram-se <strong>7 dias</strong> desde a criação do seu comandante.</li>
                <li>Você possui um <strong>4º planeta</strong>.</li>
                <li>Você mesmo envia uma <strong>missão ofensiva</strong> (saque, invasão ou ataque nuclear): você renuncia então imediatamente à sua proteção.</li>
            </ul>
            <p>Enquanto você estiver protegido, não pode atacar os outros sem perder essa proteção. Aproveite para montar uma economia e uma defesa sólidas antes de se lançar na batalha.</p>

    interface_guide:
        title: "Entendendo a interface"
        category: "beginner"
        order: 2
        tags: "interface,tela,menu,navegacao,botoes,planeta ativo"
        summary: "As 3 zonas da tela e como navegar sem se perder."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="disposicao">As 3 zonas da tela</h2>
            <ul>
                <li><strong>A barra de recursos, no topo</strong> — seus materiais e o nome do seu <strong>planeta ativo</strong>: toque nele para trocar de planeta.</li>
                <li><strong>O menu, à esquerda</strong> — todas as seções do jogo (Império, Planetas, Frotas, Aliança, Mensagens…).</li>
                <li><strong>A zona central</strong> — o conteúdo da página atual (mapa, lista de frotas, construções…). É a única zona que rola.</li>
            </ul>
            <p><em>No celular, o menu da esquerda vira uma barra de ícones colada à borda esquerda: os cinco destinos principais ficam sempre visíveis, e o botão Menu abre o resto em um painel que sobe de baixo.</em></p>

            <h2 id="barra-recursos">A barra de recursos (no topo)</h2>
            <p>Ela exibe em tempo real seus 4 recursos principais:</p>
            <ul>
                <li><strong>Nióbio</strong> — o minério de base (construções, naves).</li>
                <li><strong>Água</strong> — indispensável para construção e naves.</li>
                <li><strong>Comida</strong> — alimenta seus trabalhadores, Legionários e Mechas.</li>
                <li><strong>Urânio</strong> — recurso raro, para bombas nucleares e desafios de arena.</li>
            </ul>
            <p>O nióbio, a água, a comida e seus trabalhadores avançam segundo a segundo no ritmo da sua produção, até o seu limite de armazenamento. Toque em um recurso para ver a produção por hora, bônus incluídos (herói, campo de escravos, aliança, embargo).</p>
            <p>Os <strong>Bitcoins</strong> (moeda) e os <strong>Pontos de Guerra (PDG)</strong> também aparecem na barra de recursos.</p>

            <h2 id="planeta-ativo">Planeta ativo: o que isso significa</h2>
            <p>Quando você tem vários planetas, apenas um é <strong>ativo</strong> por vez. Todas as suas ações (construir, fabricar uma nave, lançar uma frota) se aplicam a esse planeta.</p>
            <p>Para trocar: toque no nome do planeta na barra de recursos e escolha na lista que sobe de baixo.</p>

            <h2 id="navegacao">Se localizando rapidamente</h2>
            <ul>
                <li><strong>Império</strong> — visão geral (todos os seus planetas, pesquisas, economia).</li>
                <li><strong>Planeta</strong> — construção e gestão do planeta ativo.</li>
                <li><strong>Frotas</strong> — criar, enviar e acompanhar suas naves.</li>
                <li><strong>Mapa</strong> — explorar a galáxia.</li>
                <li><strong>Mensagens / Relatórios</strong> — tudo o que o jogo sinaliza (combates, chegadas, aliança…).</li>
                <li><strong>Aliança</strong> — seu grupo, a sala de discussão, a diplomacia.</li>
            </ul>

    resources_intro:
        title: "Os recursos"
        category: "beginner"
        order: 3
        tags: "recursos,niobio,agua,comida,uranio,producao,armazenamento,ciclo"
        summary: "Os 4 recursos do jogo, como produzi-los e por que o armazenamento é crítico."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="os-4">Os 4 recursos do jogo</h2>
            <table>
                <tr><th>Recurso</th><th>Para que serve</th><th>Como obter</th></tr>
                <tr><td><strong>Nióbio</strong></td><td>Construir edifícios e naves</td><td>Mina</td></tr>
                <tr><td><strong>Água</strong></td><td>Construir, fabricar, manter</td><td>Extrator de Água</td></tr>
                <tr><td><strong>Comida</strong></td><td>Alimentar trabalhadores, Legionários e Mechas</td><td>Fazenda, depois Fazenda Aeropônica</td></tr>
                <tr><td><strong>Urânio</strong></td><td>Bombas nucleares, desafios de arena</td><td>Reciclagem de detritos de urânio, vitórias contra os Cthulhu</td></tr>
            </table>

            <h2 id="ciclo">O ciclo de produção</h2>
            <p>Seus recursos chegam automaticamente, continuamente. Falamos do <strong>ciclo de produção</strong>: é o ritmo de cálculo interno do jogo.</p>
            <ul>
                <li>Num <strong>planeta</strong>: ciclo de <strong>10 minutos</strong>.</li>
                <li>Numa <strong>lua</strong>: ciclo de <strong>1 minuto</strong> (muito mais rápido, apenas para comida).</li>
            </ul>
            <p>Quanto maior o nível da sua Mina / Extrator / Fazenda, maior a quantidade produzida por ciclo.</p>

            <h2 id="bonus">O que melhora sua produção</h2>
            <ul>
                <li><strong>Entrar numa aliança</strong>: <strong>+20&nbsp;%</strong> imediato em todos os recursos.</li>
                <li><strong>Pesquisas de aliança</strong>: bônus adicionais desbloqueados pela sua aliança.</li>
                <li><strong>Terraformação</strong>: aumenta o espaço disponível para construções maiores.</li>
                <li><strong>Herói de Economia</strong> atribuído ao planeta: impulso de produção.</li>
            </ul>

            <h2 id="armazenamento">O armazenamento (não negligencie!)</h2>
            <p>Cada planeta tem uma <strong>capacidade máxima</strong> de armazenamento, por recurso. <strong>Quando está cheio, a produção para</strong>.</p>
            <p>Para aumentar a capacidade: construa <strong>Estoques de Nióbio</strong>, <strong>Estoques de Água</strong> e <strong>Silos</strong> (comida).</p>
            <p><em>Dica para iniciantes:</em> verifique seu armazenamento <strong>antes</strong> de desconectar para dormir. Nada pior do que encontrar suas minas paradas durante 10 horas.</p>

    bitcoin_economy:
        title: "Bitcoins e manutenção"
        category: "beginner"
        order: 4
        tags: "bitcoin,moeda,manutencao,custo,economia,game over,relatorio diario"
        summary: "O Bitcoin é a moeda do jogo. Como ganhar e, sobretudo, como evitar a falência."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="o-que-e">O que é o Bitcoin?</h2>
            <p>O <strong>Bitcoin</strong> é a <strong>moeda universal</strong> de Area Universe (nada a ver com a criptomoeda real, é só uma piscadela). Ele serve para:</p>
            <ul>
                <li>Lançar <strong>pesquisas</strong>.</li>
                <li>Recrutar <strong>Legionários</strong> e <strong>cientistas</strong>.</li>
                <li>Comprar pela <strong>aliança</strong> (tesouraria).</li>
                <li>Pagar a <strong>manutenção diária</strong> de suas tropas, naves e edifícios.</li>
            </ul>

            <h2 id="ganhar">Como ganhar?</h2>
            <ul>
                <li><strong>Trabalhadores</strong> — sua fonte principal. Todo dia, eles trazem uma receita proporcional ao seu número.</li>
                <li><strong>Venda a mercadores</strong> — envie um cargueiro com nióbio e água para um mercador.</li>
                <li><strong>Missões diárias</strong> — algumas rendem Bitcoins.</li>
                <li><strong>Bônus de conexão</strong> — uma quantia a cada primeira conexão do dia, multiplicada se você encadear dias consecutivos.</li>
                <li><strong>Pilhagem</strong> — as pilhagens podem trazer nióbio e água, que você pode revender.</li>
            </ul>

            <h2 id="manutencao">A manutenção diária</h2>
            <p>Todo dia às <strong>18h59 UTC</strong>, o jogo calcula um balanço para você:</p>
            <ul>
                <li><strong>Receitas</strong>: o que seus trabalhadores renderam.</li>
                <li><strong>Custos</strong>: a manutenção dos seus Legionários, Mechas, naves e edifícios.</li>
                <li><strong>Balanço</strong>: receitas − custos, adicionado (ou subtraído) ao seu saldo.</li>
            </ul>
            <p>As unidades em missão (frotas em voo, naves em combate) <strong>custam mais caro</strong> que as estacionadas. Um exército grande em passeio permanente acaba arruinando até os mais cuidadosos.</p>

            <h2 id="falencia">Atenção: o Game Over econômico</h2>
            <p>Se, após esse balanço diário, seu saldo de Bitcoins cair para <strong>negativo</strong>, é o <strong>Game Over econômico</strong>:</p>
            <ul>
                <li>Todas as suas frotas em voo são <strong>destruídas</strong>.</li>
                <li>Seu saldo é redefinido para <strong>125&nbsp;000 Bitcoins</strong>.</li>
                <li>Algumas pesquisas e progressões são reduzidas.</li>
            </ul>
            <p><em>Regra de ouro:</em> não recrute um exército mais caro do que seus trabalhadores podem financiar.</p>

    first_buildings:
        title: "Construir seus primeiros edifícios"
        category: "beginner"
        order: 5
        tags: "edificios,construcao,mina,extrator,fazenda,iniciante,posicao"
        summary: "A ordem de construção recomendada para começar bem seu planeta inicial."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordem">A ordem aconselhada (os 10 primeiros edifícios)</h2>
            <ol>
                <li><strong>Mina de Nióbio</strong> — sua primeira fonte de matéria-prima.</li>
                <li><strong>Extrator de Água</strong> — indispensável para construir tudo depois.</li>
                <li><strong>Fazenda</strong> — alimenta seus trabalhadores e Legionários.</li>
                <li><strong>Cidade</strong> — aumenta o número máximo de trabalhadores (+25&nbsp;000).</li>
                <li><strong>Mina de Nióbio e Extrator de Água nível 2</strong> — aumente a produção antes de ir mais longe.</li>
                <li><strong>Centro de Pesquisa</strong> — permite lançar pesquisas (tecnologias).</li>
                <li><strong>Estaleiro Espacial</strong> — para fabricar suas primeiras naves.</li>
                <li><strong>Quartel</strong> — para recrutar Legionários de defesa.</li>
                <li><strong>Estoques</strong> (nióbio, água, silos) — evite que a produção sature.</li>
                <li><strong>Metrópole</strong> — próxima etapa após a Cidade para um verdadeiro impulso de população (+80&nbsp;000 trabalhadores).</li>
            </ol>

            <h2 id="fila-espera">Uma só construção por vez</h2>
            <p>Cada planeta tem <strong>uma única fila de construção</strong>. Enquanto um edifício sobe de nível, os outros devem esperar. Planeje-se.</p>
            <p>Vários planetas = várias filas paralelas: é por isso que a colonização acelera seu progresso.</p>

            <h2 id="espaco">O espaço disponível num planeta</h2>
            <p>Cada planeta tem um número limitado de <strong>posições no solo</strong> (edifícios "terrestres") e de <strong>posições no céu</strong> (ilhas orbitais, defesas).</p>
            <ul>
                <li>Você vê as posições disponíveis no topo da página Planeta.</li>
                <li>A pesquisa <strong>Terraformação</strong> amplia seus planetas.</li>
                <li>Sem espaço = sem novos edifícios (mas você ainda pode subir o nível dos existentes).</li>
            </ul>

    first_fleet:
        title: "Criar sua primeira frota"
        category: "beginner"
        order: 6
        tags: "frota,naves,primeira,criacao,iniciante,estaleiro,cargueiro,sonda"
        summary: "Fabricar uma nave, compor uma frota e enviá-la ao destino: o passo a passo."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequisitos">O que você precisa antes</h2>
            <ul>
                <li>Um <strong>Estaleiro Espacial</strong> construído no seu planeta.</li>
                <li>Nióbio e água suficientes para pagar as naves.</li>
                <li>(Opcional) uma <strong>Pesquisa</strong> que desbloqueia a nave (ex. pesquisa <em>Utilitário</em> para os cargueiros).</li>
            </ul>

            <h2 id="fabricar">Etapa 1 — Fabricar naves</h2>
            <p>Vá para a página <strong>Espacial</strong> (menu da esquerda). Você verá a lista de naves disponíveis. Clique na desejada, escolha a quantidade, inicie a produção.</p>
            <p>A fabricação leva tempo: você pode continuar jogando durante.</p>

            <h2 id="compor">Etapa 2 — Compor e enviar uma frota</h2>
            <ol>
                <li>Vá para a página <strong>Frotas</strong>.</li>
                <li>Selecione as naves que embarcarão (o estoque disponível é exibido).</li>
                <li>Escolha um <strong>destino</strong> no formato <code>Galáxia:Setor:Posição</code> (por ex. <code>1:5:12</code>). Você também pode clicar diretamente no Mapa.</li>
                <li>Escolha o <strong>tipo de missão</strong> (veja o artigo <em>Tipos de missões</em>).</li>
                <li>Confirme. O combustível (água) é deduzido automaticamente.</li>
            </ol>

            <h2 id="primeiras-naves">As boas naves para começar</h2>
            <ul>
                <li><strong>Cargueiro I</strong> — transporte de recursos (3&nbsp;000 de capacidade). Indispensável para vender a mercadores.</li>
                <li><strong>Sonda</strong> — espiona os planetas inimigos. A enviar <em>antes</em> de qualquer ataque.</li>
                <li><strong>Caça</strong> — primeira nave de combate, barata.</li>
                <li><strong>Reciclador</strong> — coleta os detritos após um combate. Muito rentável.</li>
            </ul>

            <h2 id="primeiro-alvo">Ideia de primeira missão</h2>
            <p>Envie 1 cargueiro cheio de nióbio/água em <strong>missão Descarregamento</strong> para um mercador (posição 15 de um setor). O mercador te paga em Bitcoins e o cargueiro volta sozinho.</p>

    first_combat:
        title: "Seu primeiro combate"
        category: "beginner"
        order: 7
        tags: "combate,primeiro,ataque,relatorio,iniciante,rounds"
        summary: "Como iniciar um combate espacial, o que acontece durante e o que fazer depois."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparar">Preparar-se (importante!)</h2>
            <ol>
                <li><strong>Envie uma sonda</strong> sobre o alvo para avaliar suas defesas. Perder 10 caças às cegas é descartável; perder 100, dói.</li>
                <li><strong>Componha uma frota adequada</strong>: poder de fogo suficiente, e pense em adicionar um <strong>reciclador</strong> para coletar os detritos.</li>
                <li><strong>Verifique sua manutenção</strong>: uma frota grande custa caro enquanto está em missão.</li>
            </ol>

            <h2 id="encadeamento">O que acontece etapa por etapa</h2>
            <ol>
                <li><strong>Você lança a frota</strong> em missão <em>Normal</em> (ataque) nas coordenadas de um inimigo.</li>
                <li><strong>Ela viaja</strong> — o tempo de trajeto aparece na página Frotas. Você pode chamá-la de volta antes que chegue.</li>
                <li><strong>Chegada</strong>: se houver frotas inimigas no local, um combate se inicia automaticamente.</li>
                <li><strong>Combate em rounds</strong>: os dois lados trocam disparos por turnos (até 100 rounds no máximo). Os escudos absorvem primeiro.</li>
                <li><strong>Fim do combate</strong>: um lado é eliminado, ou os 100 rounds são atingidos (nesse caso, <strong>é o defensor que vence</strong>).</li>
            </ol>

            <h2 id="apos-combate">Depois do combate</h2>
            <ul>
                <li>Um <strong>relatório de combate</strong> é enviado a você (página Mensagens / Relatórios).</li>
                <li>As naves destruídas deixam <strong>detritos</strong> no local. Envie recicladores!</li>
                <li>O vencedor ganha <strong>Pontos de Guerra (PDG)</strong> proporcionais às perdas infligidas.</li>
                <li>Sua frota sobrevivente volta automaticamente ao seu planeta de origem.</li>
            </ul>

            <h2 id="erros">Os erros clássicos a evitar</h2>
            <ul>
                <li>Atacar sem sondar primeiro.</li>
                <li>Esquecer que os rounds param em 100, a favor do defensor (atacar um alvo muito forte = derrota automática).</li>
                <li>Não enviar reciclador: seus adversários recuperarão <em>seus</em> detritos antes de você.</li>
            </ul>

    tips:
        title: "Dicas para começar bem"
        category: "beginner"
        order: 8
        tags: "dicas,conselhos,estrategia,iniciante"
        summary: "15 conselhos que fazem toda a diferença nos seus primeiros dias."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economia">Economia</h2>
            <ul>
                <li><strong>Maximize seus trabalhadores</strong>: é sua fonte principal de Bitcoins.</li>
                <li><strong>Não construa um grande exército cedo demais</strong>: ele te arruinará em manutenção.</li>
                <li><strong>Construa Cidades e depois Metrópoles</strong> para aumentar a população.</li>
                <li><strong>Acompanhe seu relatório diário</strong>: se os custos ultrapassarem as receitas, reaja imediatamente.</li>
                <li><strong>Venda seus excedentes a mercadores</strong> em vez de deixar o armazenamento saturar.</li>
            </ul>

            <h2 id="militar">Militar</h2>
            <ul>
                <li><strong>Sempre uma defesa em cada planeta</strong>: Legionários no quartel, Mechas, uma ou duas torres.</li>
                <li><strong>Personalize suas naves todos os dias</strong>: 40 pontos grátis para distribuir (blindagem, precisão, armas).</li>
                <li><strong>Os recicladores são muito rentáveis</strong>: depois de cada combate, recupere os detritos.</li>
                <li><strong>Sonde antes de atacar</strong>: uma sonda custa muito pouco, uma frota perdida custa caro.</li>
                <li><strong>Atenção ao limite dos 100 rounds</strong>: se você não eliminar o defensor em 100 turnos, perde.</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Junte-se a uma aliança rapidamente</strong>: +20&nbsp;% de produção, acesso à diplomacia e às pesquisas de aliança.</li>
                <li><strong>Complete suas 3 missões diárias</strong>: são <strong>+250 PDG</strong> de bônus, todos os dias.</li>
                <li><strong>Converse na sala de aliança</strong>: coordenar dois ataques vale mais do que tentar sozinho.</li>
                <li><strong>Conecte-se todo dia</strong>: o bônus de conexão dispara com a sequência de 7 dias consecutivos.</li>
                <li><strong>Ative as notificações push</strong>: você saberá assim que uma frota inimiga se dirigir a você.</li>
            </ul>

    resources:
        title: "Recursos em detalhe"
        category: "economy"
        order: 1
        tags: "recursos,niobio,agua,comida,uranio,producao,armazenamento,ciclo,racoes"
        summary: "Entender tudo sobre os recursos: produção, bônus, armazenamento e caso particular do urânio."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="lembrete">Lembrete: os 4 recursos</h2>
            <ul>
                <li><strong>Nióbio</strong> — construção.</li>
                <li><strong>Água</strong> — construção + combustível das frotas.</li>
                <li><strong>Comida</strong> — manutenção dos trabalhadores, Legionários, Mechas.</li>
                <li><strong>Urânio</strong> — arma nuclear, desafios de arena. Raro e precioso.</li>
            </ul>

            <h2 id="producao">Como a produção é calculada</h2>
            <p>Cada planeta funciona num <strong>ciclo de 10 minutos</strong>. A cada ciclo, você recebe uma quantidade fixa que depende:</p>
            <ul>
                <li>do <strong>nível</strong> do seu edifício produtor (Mina, Extrator, Fazenda);</li>
                <li>do <strong>tamanho</strong> do planeta (terraformação);</li>
                <li>dos seus <strong>bônus</strong> (aliança, pesquisas, herói).</li>
            </ul>
            <p>As <strong>luas</strong> produzem comida <strong>10 vezes mais rápido</strong> (ciclo de 1 minuto).</p>
            <p>Mesmo <strong>sem edifício produtor</strong> — ou se você o destruir até o nível 0 — um planeta mantém uma <strong>produção base mínima</strong>: <strong>7 Nióbio, 6 Água e 9 Comida</strong> por ciclo. A partir do nível 1, a produção do edifício (sempre superior) assume.</p>
            <p>Para a comida, o <strong>Campo agrícola</strong> e a <strong>Fazenda aeropônica</strong> <strong>somam-se</strong>: suas produções se acumulam.</p>

            <h2 id="bonus">O que aumenta sua produção</h2>
            <table>
                <tr><th>Fonte</th><th>Efeito</th></tr>
                <tr><td>Pertencer a uma aliança</td><td>+20&nbsp;% de base</td></tr>
                <tr><td>Pesquisas de aliança de produção</td><td>Bônus adicional crescente com o nível de pesquisa</td></tr>
                <tr><td>Terraformação do planeta</td><td>Mais espaço = melhores edifícios</td></tr>
                <tr><td>Herói de Economia no planeta</td><td>Impulso de produção (dobra os outros bônus)</td></tr>
                <tr><td>Eventos especiais</td><td>Impulsos temporários durante um evento do servidor</td></tr>
            </table>

            <h2 id="armazenamento">O armazenamento e suas armadilhas</h2>
            <p>Seu planeta tem uma <strong>capacidade máxima</strong> para cada recurso. Quando está cheio, a produção para — o recurso continua a ser "produzido" mas é perdido.</p>
            <p>Soluções: construir <strong>Estoques</strong> (Nióbio, Água, Silos), vender o excesso a mercadores, ou enviar os excedentes a um aliado.</p>

            <p>A comida transporta-se como o nióbio e a água: carregue <strong>rações</strong> no porão de uma frota (1 espaço por ração) para reabastecer outro planeta. Ao descarregar, o celeiro nunca excede a sua capacidade: o excedente fica no porão.</p>

            <h2 id="uranio">O urânio: o caso particular</h2>
            <p>Nenhum edifício produz urânio. Você o obtém:</p>
            <ul>
                <li><strong>reciclando</strong> detritos de urânio no mapa (identificados pelo seu ícone especial);</li>
                <li><strong>derrotando Cthulhu</strong> (missões PvE);</li>
                <li><strong>vencendo desafios de arena</strong> com aposta em urânio.</li>
            </ul>
            <p>O urânio serve para fabricar <strong>bombas nucleares</strong> e apostar em <strong>arena</strong>.</p>

    buildings:
        title: "Os edifícios"
        category: "economy"
        order: 2
        tags: "edificios,construcao,mina,extrator,fazenda,cidade,estaleiro,bunker,torre"
        summary: "Catálogo completo dos edifícios por função: produção, armazenamento, população, militar, defesa."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="producao">Produção de recursos</h2>
            <table>
                <tr><th>Edifício</th><th>Produz</th><th>Observação</th></tr>
                <tr><td>Mina de Nióbio</td><td>Nióbio</td><td>O primeiro a construir.</td></tr>
                <tr><td>Extrator de Água</td><td>Água</td><td>Indispensável para tudo.</td></tr>
                <tr><td>Fazenda</td><td>Comida</td><td>Para alimentar trabalhadores e Legionários.</td></tr>
                <tr><td>Fazenda Aeropônica</td><td>Comida (avançada)</td><td>Mais eficiente que a Fazenda. Desbloqueada por pesquisa.</td></tr>
            </table>

            <h2 id="armazenamento">Armazenamento</h2>
            <table>
                <tr><th>Edifício</th><th>Função</th></tr>
                <tr><td>Estoque de Nióbio</td><td>Aumenta a capacidade de nióbio armazenável.</td></tr>
                <tr><td>Estoque de Água</td><td>Aumenta a capacidade de água armazenável.</td></tr>
                <tr><td>Silos</td><td>Aumenta a capacidade de comida.</td></tr>
            </table>

            <h2 id="populacao">População e ciência</h2>
            <table>
                <tr><th>Edifício</th><th>Função</th></tr>
                <tr><td>Cidade</td><td>+25&nbsp;000 trabalhadores máximos por nível.</td></tr>
                <tr><td>Metrópole</td><td>+80&nbsp;000 trabalhadores máximos por nível.</td></tr>
                <tr><td>Centro de Pesquisa</td><td>Permite lançar pesquisas e aumentar sua velocidade.</td></tr>
            </table>

            <h2 id="militar">Militar e produção de naves</h2>
            <table>
                <tr><th>Edifício</th><th>Função</th></tr>
                <tr><td>Quartel</td><td>+5&nbsp;000 Legionários máximos por nível.</td></tr>
                <tr><td>Bunker</td><td>+15&nbsp;000 Legionários máx., e <strong>protege uma parte dos seus recursos</strong> contra pilhagens (5&nbsp;% por nível).</td></tr>
                <tr><td>Base Nuclear</td><td>Permite fabricar bombas nucleares (urânio necessário).</td></tr>
                <tr><td>Estaleiro Espacial</td><td>Fabrica naves utilitárias (cargueiro, sonda, reciclador…) e acelera a produção de todas as naves (+25&nbsp;% por nível).</td></tr>
                <tr><td>Fábrica Leve</td><td>Fabrica naves leves (caças, corvetas) e acelera a produção de naves (+40&nbsp;%/nível) <strong>e de defesas</strong> (+40&nbsp;%/nível).</td></tr>
                <tr><td>Fábrica Pesada</td><td>Fabrica naves pesadas (fragatas, couraçados, destroyers) e acelera a produção de naves (+60&nbsp;%/nível) <strong>e de defesas</strong> (+60&nbsp;%/nível).</td></tr>
                <tr><td>Prisão</td><td>Encarcera os heróis capturados.</td></tr>
                <tr><td>Campo de Escravos</td><td>Alternativa à Prisão. Permite fazer os heróis capturados trabalharem.</td></tr>
            </table>

            <h2 id="orbital">Defesa e instalações orbitais (no céu)</h2>
            <table>
                <tr><th>Edifício / Instalação</th><th>Função</th></tr>
                <tr><td>Ilha Orbital</td><td>Adiciona posições no céu para colocar torres/escudos.</td></tr>
                <tr><td>Base Espacial</td><td>Traz um bônus de blindagem para as defesas orbitais.</td></tr>
                <tr><td>Escudo / Grande Escudo</td><td>Absorve os danos antes das defesas serem atingidas.</td></tr>
                <tr><td>Torres (míssil, laser, Gauss, plasma…)</td><td>Defendem seu planeta contra frotas em modo ataque.</td></tr>
            </table>

            <h2 id="deteccao">Detecção e bloqueio</h2>
            <table>
                <tr><th>Edifício</th><th>Função</th></tr>
                <tr><td>Radar</td><td>Detecta as frotas que se aproximam.</td></tr>
                <tr><td>Sky Radar</td><td>Versão orbital do radar, alcance aumentado.</td></tr>
                <tr><td>Sky Jammer</td><td>Interfere na detecção inimiga: seus movimentos ficam invisíveis.</td></tr>
            </table>

            <h2 id="file-production">Gerir a fila de produção</h2>
            <p>As construções de edifícios, de naves (Estaleiro Espacial) e de defesas passam por uma <strong>fila de espera</strong> que você pode gerir:</p>
            <ul>
                <li><strong>Reorganizar</strong> a ordem dos elementos em espera (arrastar e soltar) para priorizar o que importa.</li>
                <li><strong>Cancelar</strong> um elemento em espera: você é <strong>reembolsado proporcionalmente</strong> ao que ainda não foi produzido.</li>
                <li>A fila em curso é exibida no topo de cada página de produção, abaixo do título.</li>
                <li>A fila está limitada a <strong>15 elementos em espera</strong> (além da construção em curso): acima disso, uma mensagem indica que é preciso esperar o fim de uma construção ou cancelar uma antes de adicionar uma nova.</li>
                <li>A <strong>Cidade flutuante</strong> (+10&nbsp;solo/nível) e a <strong>Estação orbital</strong> (+5&nbsp;céu/nível) estão limitadas a <strong>5 unidades por planeta</strong> cada.</li>
            </ul>

    research:
        title: "Pesquisa e tecnologias"
        category: "economy"
        order: 3
        tags: "pesquisa,tecnologia,ciencia,bitcoin,desbloqueio,arvore tecnologica"
        summary: "As tecnologias que desbloqueiam naves, bônus e novas capacidades. Como priorizar."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="funcionamento">Como funciona</h2>
            <p>As pesquisas são lançadas do <strong>Centro de Pesquisa</strong>. Cada pesquisa:</p>
            <ul>
                <li>custa <strong>Bitcoins</strong>;</li>
                <li>leva <strong>tempo</strong> (de alguns minutos a várias horas dependendo do nível);</li>
                <li>pode ter um <strong>pré-requisito</strong> (outra pesquisa em um certo nível).</li>
            </ul>
            <p>Recrutar <strong>cientistas</strong> acelera suas pesquisas em andamento.</p>

            <h2 id="prioridade-iniciante">Prioridades para um iniciante</h2>
            <ol>
                <li><strong>Utilitário</strong> — desbloqueia cargueiros, sondas, recicladores.</li>
                <li><strong>Indústria</strong> — mais produção de recursos.</li>
                <li><strong>Demografia</strong> — mais trabalhadores (logo mais Bitcoins).</li>
                <li><strong>Barcaça</strong> e <strong>Reciclador</strong> — indispensáveis para atacar e reciclar.</li>
                <li><strong>Armamento / Blindagem</strong> — antes de qualquer combate sério.</li>
            </ol>

            <h2 id="pesquisas">Lista completa das pesquisas</h2>
            <table>
                <tr><th>Pesquisa</th><th>Efeito</th><th>Nível máx.</th></tr>
                <tr><td>Utilitário</td><td>Desbloqueia cargueiros, sondas, reciclador, etc.</td><td>3</td></tr>
                <tr><td>Terraformação</td><td>Amplia o tamanho construível dos planetas.</td><td>18</td></tr>
                <tr><td>Expansão</td><td>Aumenta o número de planetas que você pode colonizar.</td><td>2</td></tr>
                <tr><td>Indústria</td><td>Bônus de produção para os recursos.</td><td>5</td></tr>
                <tr><td>Demografia</td><td>Aumenta a produção de trabalhadores.</td><td>5</td></tr>
                <tr><td>Disciplina</td><td>Reforça os Legionários no solo.</td><td>3</td></tr>
                <tr><td>Arame Farpado</td><td>Bônus de defesa no solo.</td><td>5</td></tr>
                <tr><td>Unidades blindadas</td><td>Desbloqueia os Mechas.</td><td>1</td></tr>
                <tr><td>Armamento</td><td>Aumenta os danos das suas naves.</td><td>5</td></tr>
                <tr><td>Míssil</td><td>Facção míssil (bônus vs lasers).</td><td>3</td></tr>
                <tr><td>Laser</td><td>Facção laser (bônus vs plasma).</td><td>3</td></tr>
                <tr><td>Plasma</td><td>Facção plasma (bônus vs mísseis).</td><td>3</td></tr>
                <tr><td>Hiperespaço</td><td>Permite viagens inter-galáxias.</td><td>1</td></tr>
                <tr><td>Onda</td><td>Melhora radares e comunicações. Pré-requisito de outras pesquisas.</td><td>5</td></tr>
                <tr><td>Espionagem</td><td>Melhora o alcance das suas sondas (pré-requisito: Onda nível 5).</td><td>999</td></tr>
                <tr><td>Cargueiro</td><td>Aumenta a capacidade dos cargueiros.</td><td>5</td></tr>
                <tr><td>Barcaça</td><td>Desbloqueia as barcaças (transporte de Legionários).</td><td>1</td></tr>
                <tr><td>Reciclador</td><td>Desbloqueia o reciclador.</td><td>1</td></tr>
                <tr><td>Nave leve</td><td>Desbloqueia/melhora as naves leves.</td><td>3</td></tr>
                <tr><td>Nave pesada</td><td>Desbloqueia/melhora as naves pesadas.</td><td>3</td></tr>
                <tr><td>Fazenda Aeropônica</td><td>Desbloqueia a versão avançada da fazenda.</td><td>1</td></tr>
                <tr><td>Prisão</td><td>Desbloqueia a prisão (pré-requisito: Arame Farpado 5).</td><td>1</td></tr>
            </table>

            <h2 id="modos-especiais">Modos de servidor com pesquisas máximas</h2>
            <p>Em certos modos (Battle Royale, Dominação, Search &amp; Destroy), todas as suas pesquisas começam no <strong>nível máximo</strong>. O menu Pesquisa fica então oculto.</p>

    workers_scientists:
        title: "Trabalhadores e cientistas"
        category: "economy"
        order: 4
        tags: "trabalhadores,cientistas,populacao,bitcoin,producao,defesa"
        summary: "As duas populações do seu império: os trabalhadores que pagam, os cientistas que aceleram."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="trabalhadores">Os trabalhadores</h2>
            <p>Os trabalhadores são sua <strong>fonte principal de Bitcoins</strong>. Todo dia (no relatório diário), eles pagam uma receita proporcional ao seu número.</p>
            <p>O <strong>número máximo</strong> deles depende das Cidades e Metrópoles construídas:</p>
            <ul>
                <li><strong>Cidade</strong>: +25&nbsp;000 trabalhadores máx. por nível.</li>
                <li><strong>Metrópole</strong>: +80&nbsp;000 trabalhadores máx. por nível.</li>
            </ul>
            <p>Para aumentar o número concreto (não só o limite), é preciso ter <strong>comida</strong> em reserva — a população cresce naturalmente enquanto é alimentada.</p>

            <h2 id="cientistas">Os cientistas</h2>
            <p>Os cientistas <strong>aceleram suas pesquisas</strong>. Quanto mais você recrutar, mais rápido suas tecnologias terminam.</p>
            <p>Atenção: cada cientista custa uma pequena manutenção diária. Não recrute em excesso.</p>

            <h2 id="defesa">Papel defensivo</h2>
            <p>Seus <strong>trabalhadores participam da defesa no solo</strong> — mas apenas em uma <strong>invasão</strong> (quando o inimigo quer tomar seu planeta). Durante uma <strong>pilhagem</strong> clássica (saque simples), eles ficam escondidos.</p>
            <p>As pesquisas de aliança do tipo "defesa dos trabalhadores" reforçam ainda mais sua eficácia.</p>

            <h2 id="gerir">Bem gerir sua população</h2>
            <ul>
                <li>Ajuste seu número de trabalhadores à sua capacidade de comida.</li>
                <li>Não precisa ter a população máxima a 100&nbsp;% o tempo todo: mire na rentabilidade.</li>
                <li>Em caso de fome ou embargo, seus trabalhadores podem morrer — preveja reservas.</li>
            </ul>

            <h2 id="reserve-5000">A reserva intocável de 5&nbsp;000 trabalhadores</h2>
            <p>Um planeta nunca pode <strong>descer abaixo de 5&nbsp;000 trabalhadores</strong>. Essa reserva é protegida: toda ação que a faria passar abaixo é bloqueada com uma mensagem clara. São afetados:</p>
            <ul>
                <li>O <strong>recrutamento de defesa</strong> (Legionários, Mechas, cientistas) que consome trabalhadores.</li>
                <li>A <strong>construção de naves</strong> no Estaleiro Espacial.</li>
                <li>O <strong>carregamento de trabalhadores em um cargueiro</strong> com vista a uma transferência.</li>
            </ul>
            <p>O botão «&nbsp;MAX&nbsp;» das páginas de produção leva em conta essa reserva: ele nunca lhe proporá um máximo que esvaziaria seu planeta abaixo do limite.</p>

    market:
        title: "Mercado e mercadores"
        category: "economy"
        order: 5
        tags: "mercado,mercadores,venda,comercio,cargueiro,bitcoin"
        summary: "Como vender seus recursos a mercadores PNJ em troca de Bitcoins."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="mercadores">Os mercadores, quem são?</h2>
            <p>Personagens <strong>não-jogadores</strong> (PNJ) presentes no mapa. Você pode vender nióbio e água a eles em troca de Bitcoins.</p>
            <p>Eles aparecem regularmente em diferentes setores do universo — sua posição fica visível no mapa.</p>

            <h2 id="vender">Como vender a eles</h2>
            <ol>
                <li>Carregue um <strong>cargueiro</strong> com nióbio e/ou água.</li>
                <li>Envie-o ao mercador em missão <strong>Descarregamento</strong>.</li>
                <li>O cargueiro chega, a venda é feita, você recebe Bitcoins.</li>
                <li>O cargueiro volta automaticamente para casa.</li>
            </ol>

            <h2 id="imunidade">Os mercadores são intocáveis</h2>
            <p>Os mercadores são <strong>imunes a qualquer ataque</strong>. Você não pode pilhar, invadir nem combater eles. Suas frotas nunca participam de um combate, mesmo se estiverem no mesmo ponto de um confronto.</p>
            <p>Moral: sem surpresas desagradáveis, é um parceiro comercial seguro.</p>

            <h2 id="ganho">Quanto rende?</h2>
            <p>O preço pago depende do recurso (a água rende mais que o nióbio, na taxa atual) e de um <strong>bônus mercador</strong> que aumenta com as pesquisas de aliança dedicadas.</p>
            <p>A interface exibe o ganho estimado antes de validar a venda. Olhe antes de enviar.</p>

            <h2 id="dica">Dica</h2>
            <p>Em vez de deixar seus estoques saturarem, envie um cargueiro regularmente. É Bitcoin grátis para financiar suas pesquisas ou seu exército.</p>

    recycling:
        title: "Reciclagem"
        category: "economy"
        order: 6
        tags: "reciclagem,detritos,cdr,reciclador,asteroide,uranio"
        summary: "Depois de cada combate, detritos ficam. Recuperá-los é uma mina a céu aberto."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principio">Os detritos: o que são?</h2>
            <p>Cada nave destruída em combate deixa uma parte do seu custo na forma de <strong>detritos</strong> flutuando no espaço. Chamamos isso de <strong>CDR</strong> (Campo De Recursos).</p>
            <p>Os detritos contêm <strong>nióbio</strong>, <strong>água</strong> e às vezes <strong>urânio</strong> (em detritos especiais que aparecem sozinhos no mapa).</p>
            <p>No mapa, os detritos são representados por um ícone específico na posição do confronto.</p>

            <h2 id="quanto">Quantos detritos?</h2>
            <p>Um campo contém <strong>40 % do custo de construção das naves realmente destruídas</strong>, nos dois lados. Cada nave devolve os seus próprios recursos: uma Nave de batalha, cara em água, deixa sobretudo água. Os sobreviventes não deixam nada.</p>
            <p>Três casos particulares:</p>
            <ul>
                <li>Contra as hordas de <strong>Cthulhu</strong>, a taxa cai para <strong>20 %</strong>.</li>
                <li>A <strong>carga</strong> de uma frota inteiramente destruída também cai no campo, a 40 %. Já um vencedor danificado mantém todo o seu porão.</li>
                <li>As <strong>defesas planetárias</strong> arrasadas e as naves pagas em <strong>pontos de guerra</strong> (Caça de plasma, Corveta de combate, Nave de batalha, Caravela) não deixam <strong>nenhum</strong> detrito: não custam nióbio nem água para construir.</li>
            </ul>
            <p>Um <strong>combate orbital</strong> (uma frota abatida pelas torres de um planeta em modo ataque, ou naves perdidas ao forçar uma órbita defendida) deixa um campo pela mesma regra.</p>

            <h2 id="como">Como reciclar</h2>
            <ol>
                <li>Desbloqueie a pesquisa <strong>Reciclador</strong>.</li>
                <li>Fabrique <strong>recicladores</strong> no seu Estaleiro Espacial.</li>
                <li>Envie uma frota de recicladores em missão <strong>Reciclagem</strong> nas coordenadas do campo de detritos.</li>
                <li>Eles trabalham em <strong>ciclos de 5 minutos</strong>: a cada ciclo, eles recolhem o que podem.</li>
                <li>Uma vez cheios (ou o campo vazio), a frota volta automaticamente.</li>
            </ol>

            <h2 id="capacidade">Quanto um reciclador pode trazer?</h2>
            <p>Cada reciclador coleta <strong>1&nbsp;000 recursos por ciclo de 5 minutos</strong>, ou seja 12&nbsp;000/hora. As <strong>pesquisas de aliança</strong> podem impulsionar fortemente essa capacidade.</p>

            <h2 id="estrategia">Estratégia</h2>
            <ul>
                <li>Depois de cada combate, envie imediatamente recicladores: senão, seus adversários os pegarão.</li>
                <li>Proteja-os: um reciclador isolado é um alvo fácil.</li>
                <li>Os detritos de <strong>urânio</strong> aparecem espontaneamente: é sua melhor fonte de urânio fora de combate.</li>
                <li>A reciclagem é muito rentável — pense nela como uma segunda economia além das suas minas.</li>
            </ul>

    daily_report:
        title: "O relatório diário"
        category: "economy"
        order: 7
        tags: "relatorio,diario,cotidiano,balanco,receitas,custos,taxa"
        summary: "Todo dia às 18h59 UTC, o jogo faz seu balanço: receitas, custos, taxas. Para acompanhar de perto."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="quando">Quando acontece</h2>
            <p>Todo dia às <strong>18h59 UTC</strong>. É um encontro fixo para todos os jogadores do servidor.</p>
            <p>Você recebe um relatório detalhado em suas Mensagens.</p>

            <h2 id="conteudo">O que o relatório contém</h2>
            <ul>
                <li><strong>Receitas</strong> — o que seus trabalhadores geraram.</li>
                <li><strong>Custos de manutenção</strong> — Legionários, Mechas, cientistas, naves, edifícios. As unidades em missão custam mais que as estacionadas.</li>
                <li><strong>Taxa de paz</strong> — se você está em paz com uma aliança que exigiu uma taxa.</li>
                <li><strong>Taxa de aliança</strong> — contribuição automática para a tesouraria da sua aliança (se configurada).</li>
                <li><strong>Balanço final</strong> — receitas − custos − taxas, adicionado ao seu saldo.</li>
            </ul>

            <h2 id="missoes">As missões diárias</h2>
            <p>O relatório diário <strong>renova suas 3 missões</strong> do dia. Se você completou as <strong>3 missões do dia anterior</strong>, recebe <strong>+250 PDG</strong> como recompensa bônus.</p>

            <h2 id="perigo">O perigo a acompanhar</h2>
            <p>Se seu saldo cair para <strong>negativo</strong> após o relatório, é o <strong>Game Over econômico</strong>: frotas destruídas, saldo redefinido para 125&nbsp;000 Bitcoins, pesquisas parcialmente reduzidas.</p>
            <p>Verifique seu relatório todo dia. Se seus custos subirem demais: reduza o recrutamento, chame suas frotas em missão, ou dispense unidades.</p>

    exchange:
        title: "Trocas entre jogadores"
        category: "economy"
        order: 8
        tags: "troca,alianca,recursos,bitcoin,doacao,deposito"
        summary: "Como enviar recursos ou Bitcoins a um aliado (e os limites disso)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Area Universe permite que jogadores de uma <strong>mesma aliança</strong> se ajudem transferindo recursos ou Bitcoins. É muito útil para:</p>
            <ul>
                <li>Reerguer um membro que acabou de ser pilhado.</li>
                <li>Juntar esforço de pesquisa ou construção caro.</li>
                <li>Reabastecer um aliado sob embargo.</li>
            </ul>

            <h2 id="recursos">Enviar recursos físicos</h2>
            <p>Para enviar nióbio, água ou comida: carregue-os num <strong>cargueiro</strong> e envie o cargueiro em missão <strong>Descarregamento</strong> ao planeta do destinatário. Os recursos são depositados automaticamente na chegada, o cargueiro volta sozinho.</p>

            <h2 id="bitcoins">Enviar Bitcoins</h2>
            <p>Os Bitcoins se transferem pela <strong>tesouraria da aliança</strong> (ver artigo dedicado). Você deposita na tesouraria, e os oficiais podem distribuir ou pagar a um jogador.</p>

            <h2 id="limites">Os limites</h2>
            <ul>
                <li>Não é possível <strong>transferir urânio</strong> livremente (recurso estratégico).</li>
                <li>As trocas passam obrigatoriamente por uma frota: requer tempo e combustível.</li>
                <li>Um planeta sob <strong>embargo</strong> só pode receber de si mesmo ou de um aliado, não de um estranho.</li>
                <li>Não é possível enviar recursos a um inimigo ou a um jogador fora da aliança (exceto pela tesouraria, conforme regras).</li>
            </ul>

    fleet_creation:
        title: "Criar e enviar uma frota"
        category: "fleet"
        order: 1
        tags: "frota,criacao,naves,composicao,estaleiro,missao"
        summary: "Da fabricação da nave até sua chegada ao destino: o percurso completo."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequisitos">O que você precisa</h2>
            <ul>
                <li>Um <strong>Estaleiro Espacial</strong> no seu planeta ativo.</li>
                <li>Os recursos necessários (nióbio e água).</li>
                <li>As pesquisas exigidas para a nave desejada (por ex. <em>Utilitário</em> para os cargueiros).</li>
            </ul>

            <h2 id="fabricar">Etapa 1 — Fabricar as naves</h2>
            <p>Na página <strong>Espacial</strong>, escolha um modelo e uma quantidade. A produção leva tempo e é feita em segundo plano.</p>

            <h2 id="compor">Etapa 2 — Compor a frota</h2>
            <p>Uma vez que as naves sejam entregues, vá para a página <strong>Frotas</strong>. Você pode:</p>
            <ul>
                <li>Selecionar quais naves embarcam.</li>
                <li>Carregar <strong>recursos</strong> (para transporte).</li>
                <li>Embarcar <strong>Legionários</strong> (para pilhagem/invasão, com barcaças).</li>
            </ul>

            <h2 id="enviar">Etapa 3 — Enviar a frota</h2>
            <ol>
                <li>Escolha o <strong>destino</strong>. Você pode digitar no formato <code>Galáxia:Setor:Posição</code> ou clicar no Mapa.</li>
                <li>Escolha um <strong>tipo de missão</strong> (Normal, Descarregamento, Reciclagem, Pilhagem, Invasão…).</li>
                <li>Verifique o custo em combustível (água) e a duração do voo.</li>
                <li>Confirme.</li>
            </ol>
            <p>A frota aparece na sua lista de frotas em voo. Você pode <strong>chamá-la de volta</strong> antes da chegada se necessário.</p>

            <h2 id="dicas">Dicas</h2>
            <ul>
                <li>Pense em adicionar um <strong>reciclador</strong> às suas frotas de ataque, para recuperar os detritos imediatamente.</li>
                <li>Nunca envie toda sua defesa de uma vez: guarde o suficiente para defender seu planeta.</li>
                <li>O retorno de uma frota após missão não custa combustível adicional (já provisionado).</li>
            </ul>

    ship_types:
        title: "Tipos de naves"
        category: "fleet"
        order: 2
        tags: "naves,caca,corveta,fragata,couracado,cruzador,destroyer,cargueiro,sonda"
        summary: "Todas as naves do jogo: utilitárias, leves, pesadas, especiais — e como usá-las."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitarias">Naves utilitárias</h2>
            <p>Elas não combatem. Servem para transportar, explorar, reciclar, colonizar.</p>
            <table>
                <tr><th>Nave</th><th>Função</th><th>Capacidade</th></tr>
                <tr><td>Sonda</td><td>Espionar um planeta.</td><td>—</td></tr>
                <tr><td>Cargueiro I</td><td>Transporte leve.</td><td>3&nbsp;000</td></tr>
                <tr><td>Cargueiro V</td><td>Transporte médio.</td><td>10&nbsp;000</td></tr>
                <tr><td>Cargueiro X</td><td>Grande transporte.</td><td>25&nbsp;000</td></tr>
                <tr><td>Caravela</td><td>Cargueiro premium: o maior e mais rápido dos cargueiros. Pago em Pontos de Guerra (25) + 15&nbsp;trabalhadores por unidade produzida.</td><td>40&nbsp;000</td></tr>
                <tr><td>Colonizador</td><td>Fundar um novo planeta.</td><td>—</td></tr>
                <tr><td>Reciclador</td><td>Coletar detritos de combate.</td><td>1&nbsp;000 por ciclo de 5 min</td></tr>
                <tr><td>Barcaça</td><td>Transportar Legionários para pilhagem ou invasão.</td><td>1&nbsp;000 Legionários</td></tr>
                <tr><td>Moon Maker</td><td>Criar uma lua numa posição vazia com destroços suficientes (mín. 2M de nióbio e 2M de água).</td><td>—</td></tr>
                <tr><td>Radar (nave)</td><td>Estender sua detecção num setor.</td><td>—</td></tr>
                <tr><td>Jammer (nave)</td><td>Bloquear a detecção inimiga.</td><td>—</td></tr>
                <tr><td>Nave-mãe</td><td>Nave almirante de prestígio. Reduz a velocidade da frota.</td><td>—</td></tr>
            </table>

            <h2 id="combate">Naves de combate</h2>
            <p>Elas são divididas em <strong>classes</strong> (da mais leve à mais pesada). Cada classe tem suas forças e fraquezas; um combate equilibrado mistura as classes.</p>
            <table>
                <tr><th>Classe</th><th>Exemplos</th><th>Perfil</th></tr>
                <tr><td>Leve</td><td>Caça, Caça Pesado, Caça de Guerra</td><td>Rápido, barato, numeroso. Bom contra corvetas.</td></tr>
                <tr><td>Média</td><td>Corveta, Corveta Laser, Corveta de Guerra</td><td>Equilibrada. Boa contra caças e fragatas.</td></tr>
                <tr><td>Pesada</td><td>Fragata, Fragata Plasma</td><td>Grandes danos a longa distância.</td></tr>
                <tr><td>Muito Pesada</td><td>Couraçado</td><td>Resistente, danos sólidos.</td></tr>
                <tr><td>Capital</td><td>Cruzador, Blindado, Destroyer</td><td>Colossal, muito caro, devastador. Coração da sua frota.</td></tr>
            </table>

            <h2 id="faccoes">As facções de combate</h2>
            <p>Certas naves pertencem a uma <strong>facção</strong>: <em>míssil</em>, <em>laser</em> ou <em>plasma</em>. As facções se contrariam (pedra-papel-tesoura), com um bônus de +20&nbsp;% de potência contra sua facção alvo.</p>

            <h2 id="bonus-cargueiro">Capacidade de transporte</h2>
            <p>A capacidade dos cargueiros aumenta com as <strong>pesquisas de aliança</strong> dedicadas ao cargueiro. Útil quando você começa a jogar em longas distâncias.</p>

    ship_customization:
        title: "Personalizar suas naves"
        category: "fleet"
        order: 3
        tags: "personalizacao,naves,pontos,blindagem,precisao,armas"
        summary: "40 pontos grátis todo dia para melhorar blindagem, precisão e armas das suas naves."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Cada modelo de nave tem três características que você pode fazer evoluir:</p>
            <ul>
                <li><strong>Blindagem</strong> — quanto ela pode aguentar.</li>
                <li><strong>Precisão</strong> — eleva o pior resultado possível de cada salva (nenhum tiro erra jamais, mas um tiro mal ajustado causa menos dano).</li>
                <li><strong>Armas</strong> — danos infligidos.</li>
            </ul>
            <p>Todo dia, o jogo te oferece <strong>40 pontos para distribuir livremente</strong>, em todas as suas naves. É grátis, não se esqueça.</p>

            <h2 id="usar">Como usá-los</h2>
            <p>Vá para a página <strong>Personalização</strong> (menu Espacial). Para cada modelo, ajuste os seletores. Suas escolhas se aplicam a <strong>todas as naves desse modelo</strong> (atuais e futuras). Essas três estatísticas evoluem de forma independente umas das outras: investir pontos na blindagem ou nas armas de um modelo nunca reduz sua precisão.</p>

            <h2 id="leitura">Ler a sua mira no ecrã</h2>
            <p>O separador <strong>Estatísticas</strong> do Estaleiro espacial mostra, modelo a modelo, a mira que você investiu sobre o crédito desse modelo (por exemplo <code>676 / 676</code> para um Destroyer) e o <strong>multiplicador de dano</strong> que daí resulta&nbsp;: <strong>×0,94</strong> com a mira no máximo, <strong>×0,66</strong> sem nenhum ponto investido.</p>
            <p>Não é uma taxa de acerto&nbsp;: <strong>nenhum tiro falha alguma vez</strong>. Mirar melhor eleva o mínimo do seu dano, nunca o seu máximo. É o mesmo número da sua página de gestão de frota, do separador Defesas e dos seus relatórios de combate — os quatro ecrãs comparam-se finalmente de forma direta. Como referência, as defesas de um planeta disparam a <strong>×1,06</strong>, melhor do que uma frota com a mira no máximo.</p>

            <h2 id="reset">Resets</h2>
            <p>Você pode redefinir seus pontos <strong>uma vez a cada 96 horas</strong>, sem limite total: se sua estratégia mudar ou o motor de combate evoluir, recupere todos os pontos gastos para redistribuí-los. Após uma redefinição, o botão fica desativado e uma contagem regressiva mostra o tempo restante até a próxima.</p>

            <h2 id="modos-especiais">Modos de servidor com pesquisas máximas</h2>
            <p>Em certos modos (Battle Royale, Dominação, Search &amp; Destroy), <strong>todos os seus pontos estão desbloqueados desde o primeiro dia</strong> (1&nbsp;375 pontos disponíveis imediatamente em vez de 40/dia).</p>

            <h2 id="dicas">Dicas</h2>
            <ul>
                <li>Não disperse seus pontos em muitos modelos: concentre-se naqueles que você realmente usa em massa.</li>
                <li>Os <strong>recicladores</strong> e <strong>cargueiros</strong> se beneficiam de um pouco de blindagem para sobreviver a emboscadas.</li>
                <li>Os <strong>caças</strong> se beneficiam mais da precisão e das armas do que da blindagem (eles morrem rápido).</li>
            </ul>

    fleet_missions:
        title: "Tipos de missões"
        category: "fleet"
        order: 4
        tags: "missao,ataque,transporte,colonizacao,reciclagem,espionagem,nuclear,pilhagem,invasao"
        summary: "Cada missão dá uma ordem diferente à sua frota. Veja como escolher a certa."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Quando você envia uma frota, dá a ela um <strong>tipo de missão</strong>. É essa missão que determina o que acontece na chegada. Alguns tipos exigem naves específicas.</p>

            <h2 id="missoes">Os tipos disponíveis</h2>
            <table>
                <tr><th>Missão</th><th>O que faz</th><th>Naves necessárias</th></tr>
                <tr><td><strong>Normal</strong> (Ataque)</td><td>A frota vai ao ponto alvo. Se o inimigo estiver lá, combate automático.</td><td>Quaisquer naves</td></tr>
                <tr><td><strong>Descarregamento</strong></td><td>Deposita recursos num planeta aliado ou num mercador, depois retorna.</td><td>Pelo menos um cargueiro</td></tr>
                <tr><td><strong>Colonização</strong></td><td>Funda um novo planeta numa posição vazia.</td><td>Um colonizador</td></tr>
                <tr><td><strong>Pilhagem (Raid)</strong></td><td>Combate a defesa no solo para roubar recursos, sem tomar o planeta.</td><td>Barcaças + Legionários</td></tr>
                <tr><td><strong>Invasão</strong></td><td>Combate a defesa no solo para <strong>tomar o planeta</strong> do adversário.</td><td>Barcaças + Legionários</td></tr>
                <tr><td><strong>Espionagem</strong></td><td>Envia uma sonda para obter um relatório sobre as defesas inimigas.</td><td>Pelo menos uma sonda</td></tr>
                <tr><td><strong>Lua</strong></td><td>Cria uma lua numa posição vazia com destroços suficientes (mín. 2M de nióbio e 2M de água).</td><td>Um Moon Maker</td></tr>
                <tr><td><strong>Radar</strong></td><td>Implanta um satélite radar no local (detecção estendida).</td><td>Uma nave-radar</td></tr>
                <tr><td><strong>Bloqueador</strong></td><td>Implanta um satélite de bloqueio (oculta seus movimentos).</td><td>Uma nave-jammer</td></tr>
                <tr><td><strong>Pousar</strong></td><td>Transfere as naves diretamente para a guarnição de um dos seus planetas.</td><td>Planeta próprio</td></tr>
                <tr><td><strong>Nuclear</strong></td><td>Lança uma bomba nuclear sobre o planeta alvo.</td><td>Bomba nuclear embarcada</td></tr>
                <tr><td><strong>Reciclagem</strong></td><td>Coleta os detritos de um campo de batalha.</td><td>Pelo menos um reciclador</td></tr>
            </table>

            <h2 id="escolher">Como escolher a missão certa</h2>
            <ul>
                <li>Você quer <strong>Bitcoins</strong>? → Descarregamento para um mercador.</li>
                <li>Você quer <strong>informações</strong>? → Espionagem.</li>
                <li>Você quer <strong>enfraquecer</strong> um inimigo? → Pilhagem.</li>
                <li>Você quer <strong>tomar</strong> o planeta dele? → Invasão.</li>
                <li>Você quer <strong>recuperar detritos</strong>? → Reciclagem.</li>
            </ul>

    fleet_movement:
        title: "Deslocamento e distância"
        category: "fleet"
        order: 5
        tags: "deslocamento,distancia,velocidade,viagem,combustivel,coordenadas"
        summary: "Como se calcula a duração do voo, o combustível consumido, e o que reduz a velocidade da sua frota."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordenadas">As coordenadas, como funcionam</h2>
            <p>Cada posição no universo se escreve no formato <strong>Galáxia:Setor:Posição</strong>. Exemplo: <code>1:5:12</code> = galáxia 1, setor 5, posição 12.</p>
            <ul>
                <li>Uma <strong>galáxia</strong> contém vários setores (grade 10×10).</li>
                <li>Um <strong>setor</strong> contém 25 posições (grade 5×5).</li>
            </ul>

            <h2 id="distancia">Como se calcula a distância</h2>
            <ul>
                <li><strong>Mesmo setor</strong> — distância curta, viagem rápida.</li>
                <li><strong>Mesma galáxia, setor diferente</strong> — distância média.</li>
                <li><strong>Galáxia diferente</strong> — distância longa, fixa. Requer a pesquisa <strong>Hiperespaço</strong>.</li>
            </ul>
            <p>A interface sempre exibe a distância e a duração estimadas antes de você validar o envio.</p>

            <h2 id="duracao">A duração do voo</h2>
            <p>Depende de:</p>
            <ul>
                <li>da <strong>distância</strong>;</li>
                <li>da <strong>velocidade da nave mais lenta</strong> da sua frota (uma frota vai na velocidade da mais lenta);</li>
                <li>da <strong>velocidade do servidor</strong> (alguns servidores são acelerados).</li>
            </ul>
            <p>A <strong>Nave-mãe</strong> (mothership) é prestigiosa mas <strong>reduz a velocidade da frota em 10&nbsp;%</strong>. Leve em conta. Ela também <strong>reduz em 10&nbsp;% a assinatura de radar</strong> da frota (camuflagem) — a visão geral do Império, por sua vez, mostra o total real das suas naves.</p>

            <h2 id="combustivel">O combustível</h2>
            <p>O combustível é <strong>água</strong>. Quanto maior sua frota (massa total), mais ela consome. Quanto mais longo o trajeto, mais ela consome.</p>
            <p>Uma missão <strong>Descarregamento</strong> consome o dobro (o cargueiro sai pesado, volta pesado do retorno).</p>
            <p>O combustível estimado é exibido antes de lançar a frota: verifique se tem água suficiente em estoque.</p>

            <h2 id="chamar">Chamar uma frota em voo</h2>
            <p>Você pode <strong>chamar de volta</strong> uma frota enquanto ela não chegou. Ela dá meia-volta e retorna para casa. Caso típico: um aliado ataca antes de você, cancele sua ofensiva.</p>

            <h2 id="night-slowdown">🌙 Desaceleração noturna</h2>
            <p>Uma frota ofensiva (naves de combate ou tropas terrestres) enviada ao planeta de um inimigo demora <strong>×10 mais</strong> se chegar durante a <strong>janela noturna do defensor</strong> (23h–06h no fuso horário dele). A duração exibida já inclui este multiplicador.</p>
            <p>Um ícone 🌙 no mapa indica os jogadores atualmente em sua janela noturna. Uma modal de confirmação é exibida ao enviar se a chegada cair na noite do adversário. O fuso horário é detectado automaticamente e pode ser alterado no máximo uma vez por mês.</p>

    fleet_management:
        title: "Gestão avançada das frotas"
        category: "fleet"
        order: 6
        tags: "gestao,frota,dividir,fundir,transferir,reagrupar"
        summary: "Dividir, reagrupar, pousar: as manipulações avançadas para otimizar seus movimentos."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operacoes">As operações disponíveis</h2>
            <ul>
                <li><strong>Dividir</strong> — separar uma parte das naves numa nova frota.</li>
                <li><strong>Reagrupar</strong> — fundir várias das suas frotas que estão no mesmo lugar.</li>
                <li><strong>Pousar</strong> — transferir as naves de uma frota para a guarnição de um planeta. As tropas e a carga desembarcadas têm de caber nas capacidades do planeta; uma frota que não transporta nenhuma pousa sempre, mesmo num planeta já cheio.</li>
                <li><strong>Chamar</strong> — fazer uma frota em voo dar meia-volta.</li>
                <li><strong>Transferir para o porto</strong> — estacionar uma frota num planeta sem fundi-la.</li>
            </ul>

            <h2 id="em-voo">O que não se pode fazer</h2>
            <ul>
                <li>Modificar a composição de uma frota <strong>em voo</strong> (carregamento, naves).</li>
                <li>Mudar a missão de uma frota em voo (exceto chamada).</li>
                <li>Teletransportar uma frota (sem atalho mágico!).</li>
            </ul>

            <h2 id="dicas">Casos de uso</h2>
            <ul>
                <li><strong>Dividir antes de um combate</strong>: guarde parte da sua frota em reserva, envie uma vanguarda.</li>
                <li><strong>Reagrupar após uma pilhagem</strong>: fundir várias voltas para ganhar em legibilidade.</li>
                <li><strong>Pousar</strong>: realocar uma frota em defesa orbital de um planeta.</li>
            </ul>

    espionage:
        title: "Espionagem e sondas"
        category: "fleet"
        order: 7
        tags: "espionagem,sonda,espiao,deteccao,informacao,reconhecimento"
        summary: "Saber o que o adversário tem antes de atacar: o envio de sondas explicado."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="enviar">Enviar uma sonda</h2>
            <ol>
                <li>Fabrique <strong>sondas</strong> no seu Estaleiro Espacial (desbloqueadas pela pesquisa Utilitário).</li>
                <li>Vá para a página Frotas, adicione pelo menos 1 sonda.</li>
                <li>Escolha a missão <strong>Espionagem</strong>, designe o alvo.</li>
                <li>Envie — a sonda vai a toda velocidade.</li>
            </ol>
            <p>Na chegada, ela escaneia o planeta e te envia um relatório.</p>

            <h2 id="sucesso">O que determina o sucesso?</h2>
            <p>Um duelo silencioso opõe seu <strong>nível de Espionagem</strong> ao do defensor:</p>
            <ul>
                <li>Se seu nível for <strong>maior ou igual</strong>, o relatório é detalhado.</li>
                <li>Se seu nível for menor, você obtém informações parciais, ou nada.</li>
            </ul>
            <p>Para aumentar sua espionagem: pesquisa <strong>Onda</strong> nível 5, depois pesquisa <strong>Espionagem</strong>.</p>

            <h2 id="relatorio">O que um relatório bem-sucedido revela</h2>
            <ul>
                <li>Os <strong>recursos</strong> presentes no planeta.</li>
                <li>A lista de <strong>edifícios</strong> e seu nível.</li>
                <li>As <strong>frotas</strong> em órbita.</li>
                <li>As <strong>defesas no solo e orbitais</strong>.</li>
                <li>Os <strong>Legionários, Mechas, trabalhadores</strong>.</li>
            </ul>
            <p>Exatamente o necessário para decidir: pilhagem, invasão ou retirada.</p>

            <h2 id="deteccao">É possível ser detectado?</h2>
            <p>Sim. Se o defensor tiver um <strong>Radar</strong> suficientemente bom, ele recebe um alerta de espionagem (sem necessariamente saber o que foi visto).</p>
            <p>Ao contrário, um planeta equipado com <strong>Jammer</strong> pode bloquear sua sonda ou torná-la pouco confiável.</p>

    spatial_combat:
        title: "Combate espacial"
        category: "combat"
        order: 1
        tags: "combate,espacial,frota,batalha,bloco,ronda,escudo,precisao,perdas,dano,ecra,cacas"
        summary: "O desenrolar completo de um combate entre frotas: poder dos lados, duelo de escudos, rondas de tiro, fim do combate e cálculo exato das suas perdas."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="inicio">Quando um combate começa</h2>
            <p>Assim que uma frota marcada <strong>[Ataque]</strong> partilha a posição (Galáxia:Setor:Posição) com uma frota inimiga, o combate começa automaticamente. As suas frotas presentes no mesmo local fundem-se primeiro numa única armada.</p>
            <p>Todas as frotas presentes são divididas em <strong>dois lados</strong> segundo a diplomacia: a sua aliança e os seus pactos de um lado, o inimigo e os seus apoios do outro. Um lado sem uma única arma (cargueiros, recicladores, sondas) não combate: é destruído, e o relatório menciona-o.</p>
            <p><strong>Alianças em guerra, ninguém armado</strong> — duas frotas de alianças em guerra só desencadeiam um combate se pelo menos uma delas portar armas de nave. Duas frotas totalmente desarmadas (cargueiros, sondas, recicladores) que se cruzam simplesmente não combatem: suas frotas não ficam imobilizadas e ninguém é avisado à toa.</p>
            <p><strong>Caso das pilhagens e invasões</strong> — quando essa batalha é desencadeada por uma pilhagem ou invasão contra um planeta guardado (veja os artigos <em>Invasão de planeta</em> e <em>Pilhagens (raids)</em>), é esse próprio desencadeamento que aplica a marca <strong>[Ataque]</strong> à sua frota atacante. Ela nunca é removida depois: uma frota de pilhagem ou invasão que sobrevive permanece marcada como hostil — torres em modo ataque poderão engajá-la mais tarde, e ela voltará a ser capturada na próxima detecção de combate espacial assim que cruzar com um inimigo.</p>

            <h2 id="poder">O poder de um lado</h2>
            <p>O combate opõe os <strong>totais</strong> dos dois lados: o jogo soma a blindagem, o escudo, os mísseis, os lasers e o plasma de todas as naves envolvidas.</p>
            <ul>
                <li><strong>Defensor em casa</strong> — as torres e a blindagem das defesas do planeta juntam-se ao seu lado; o Escudo planetário acrescenta +50.000 de blindagem, o Grande escudo +600.000. Uma frota armada de um aliado de aliança estacionada no seu planeta também beneficia.</li>
                <li><strong>Precisão</strong> — média das precisões das frotas do lado (construída com a personalização das suas naves).</li>
                <li><strong>Política de aliança</strong> — cada regime vence o seu rival: a Democracia vence o Comunismo, que vence o Fascismo, que vence a Democracia. Se a política do <strong>atacante</strong> vencer a do defensor, todas as suas armas ganham +20&nbsp;%.</li>
                <li><strong>Melhorias de aliança</strong> — até +5&nbsp;% por tipo de arma, blindagem e escudo, e até +10&nbsp;% para as defesas planetárias.</li>
                <li><strong>Heróis</strong> — bónus de ataque, defesa, escudo e precisão segundo competências e objetos. Um herói com <strong>Intimidação</strong> enfraquece as armas inimigas; um <strong>Tático</strong> reforça a primeira salva do seu lado.</li>
            </ul>

            <h2 id="defesas-planeta">As suas torres combatem neste mesmo combate</h2>
            <p>Quando as defesas do seu planeta se juntam a um lado, esse combate <strong>é</strong> agora todo o combate do seu planeta: já não há um segundo combate orbital à parte para as suas torres. Elas visam com a sua própria precisão (uma escolta pouco precisa ao lado delas já não degrada o seu tiro), e sofrem ali <strong>perdas reais</strong>: proporcionais ao dano que o seu lado encaixa se vencer, <strong>totais</strong> — torres, escudos, base espacial, modo ataque desligado — se o seu lado cair. Isto aplica-se quer o modo ataque do planeta esteja ativo quer não: assim que disparam, podem agora ser destruídas. Um planeta guardado por uma das suas frotas, ou por uma frota <strong>armada</strong> de um aliado da sua aliança, já não pode ser pilhado nem invadido sem que uma batalha decida primeiro.</p>

            <h2 id="escudos">O duelo de escudos</h2>
            <p>Cada salva atinge primeiro o escudo adversário. O seu <strong>poder de perfuração</strong> vale:</p>
            <p><code>mísseis ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>O plasma brilha contra os escudos, os mísseis mal os arranham — e essa vantagem agora se confirma seja qual for o tamanho do combate, dez contra dez tanto quanto cem milhões contra cem milhões. A cada salva, a parte do dano que ultrapassa o poder de perfuração é absorvida pelo escudo adversário até esgotar a sua carga; o resto, e tudo o que transborda depois de o escudo esvaziar, atinge diretamente o casco. Um escudo nunca pode bloquear uma salva inteira&nbsp;: contra um adversário armado, o seu casco encaixa sempre alguma coisa, desde o primeiro round.</p>
            <p>O escudo de uma frota já não é uma reserva que volta automaticamente a 100&nbsp;% antes de cada batalha: é uma <strong>carga persistente</strong> que se desgasta durante o combate e só sobe 10&nbsp;% a cada 3 horas (30 horas para passar de zero a cheia), mesmo quando você divide, funde ou dissolve a frota, ou transfere naves entre a frota e o solo do planeta. O relatório de combate mostra essa carga no início e no fim da batalha; a lista de frotas mostra a percentagem de cada frota, e a página de gestão de frota indica o escudo realmente levado para o combate, a capacidade total, a percentagem atual e o tempo restante até à carga completa. As naves armazenadas no solo também têm uma carga, que não recarrega: toda frota criada ou reforçada a partir desse solo herda-a, e ela é mostrada na janela de criação de frota e na aba «Naves» da gestão de frota. Uma exceção: o escudo fixo dado por uma <strong>Nave-mãe</strong> nunca se descarrega — o seu gerador aguenta permanentemente, e a carga só desgasta o escudo das suas outras naves — por isso a página de gestão mostra também o valor absoluto do escudo, não apenas a percentagem.</p>

            <h2 id="rondas">As rondas de tiro</h2>
            <p>Um combate dura no máximo <strong>100 rondas</strong>. Em cada ronda, uma salva inflige:</p>
            <p><code>(mísseis + plasma ÷ 2 + lasers × 2) × multiplicador</code></p>
            <p>O multiplicador vem de um lançamento de precisão: o jogo tira um número entre a sua precisão e 100 e divide-o por 80, com um resultado entre <strong>×0,3 e ×1,2</strong>. Uma precisão alta não torna as suas salvas mais fortes: elimina os maus lançamentos. A parte que atravessa o escudo adversário (ver acima) é descontada da blindagem total desse lado.</p>

            <h2 id="fim">Fim do combate</h2>
            <ul>
                <li><strong>A blindagem de um lado cai a 0</strong> — está vencido; todas as suas frotas são destruídas com a carga.</li>
                <li><strong>100 rondas atingidas</strong> — vence o lado que conserva mais blindagem; em empate perfeito, vence o atacante.</li>
                <li><strong>Rede de segurança do vencedor</strong> — mesmo muito castigado, o lado vencedor nunca perde mais de 95&nbsp;% da sua blindagem inicial: uma vitória nunca é uma aniquilação, seja qual for a diferença de poder.</li>
            </ul>

            <h2 id="perdas">As suas perdas: o que realmente encaixou</h2>
            <p>A regra cabe numa frase: <strong>as suas perdas resultam do dano ao casco que realmente encaixou</strong> — nunca do que o seu escudo absorveu, que não custa nenhuma nave. Esse dano ao casco reparte-se entre o seu <strong>ecrã</strong> (Caças, Caças pesados, Caças de guerra: as únicas naves sem escudo) e a sua <strong>linha</strong> (todos os outros tipos), em proporção à blindagem de cada grupo: cada tipo perde a mesma fração de si mesmo. O relatório mostra dois contadores: dano ao casco e dano ao escudo.</p>
            <p>O seu ecrã não protege a linha indefinidamente: desvia para si, no máximo, <strong>metade</strong> do dano destinado à linha, e só enquanto lhe restar blindagem para o encaixar — um único caça não consegue absorver o dano de uma frota inteira. Sem ecrã nenhum, a linha encaixa a totalidade do dano ao casco.</p>
            <p>Consequências diretas: se o inimigo mal lhe tocar, as suas perdas são quase nulas; um inimigo dez vezes mais perigoso custa-lhe cerca de dez vezes mais — caças incluídos. O lado vencido perde tudo.</p>

            <h2 id="depois">Depois do combate</h2>
            <ul>
                <li><strong>Destroços</strong> — 40&nbsp;% do custo de construção (nióbio e água) de cada nave destruída, dos dois lados, cai em órbita (20&nbsp;% quando um Cthulhu ou um alien está envolvido). A carga das frotas aniquiladas junta-se. Um reciclador na frota vencedora recolhe de imediato.</li>
                <li><strong>Pontos de Guerra</strong> — os dois lados ganham, proporcionalmente ao poder inimigo destruído; o vencedor recebe muito mais, e a consolação do derrotado nunca ultrapassa um quinto do que o vencedor teria ganho com essa mesma frota.</li>
                <li><strong>Heróis</strong> — um herói principal a bordo de uma frota destruída pode ser capturado pelo vencedor (uma probabilidade, nunca garantida). Um <strong>herói secundário</strong> derrotado segue uma regra diferente e definitiva, sem qualquer sorteio: ver o artigo <em>Heróis secundários</em>.</li>
                <li><strong>Relatórios</strong> — cada comandante recebe o detalhe: forças, salvas, dano encaixado, perdas, e o destino de qualquer herói secundário capturado ou executado.</li>
            </ul>

            <h2 id="conselhos">Conselhos</h2>
            <ul>
                <li>Mantenha sempre um <strong>ecrã de caças</strong>: barato, encaixa o dano ao casco no lugar das suas naves pesadas.</li>
                <li>Invista no <strong>escudo</strong>: quanto mais carga tiver, mais dano absorve antes de chegar ao seu casco — mas nenhum escudo detém uma salva inteira, o seu casco encaixa sempre uma parte.</li>
                <li>Construa <strong>plasma</strong> para perfurar depressa os escudos inimigos, <strong>lasers</strong> para o dano ao casco.</li>
                <li>Escolha a <strong>política de aliança</strong> olhando para a dos seus alvos favoritos: +20&nbsp;% de armas ao atacar.</li>
            </ul>

    invasion:
        title: "Invasão de planeta"
        category: "combat"
        order: 2
        tags: "invasao,planeta,soldados,tanques,barcacas,conquista,deploy,tatico"
        summary: "Conquistar um planeta inimigo: barcaças, desembarque, combate no solo e deploys táticos."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>A invasão é um ataque para <strong>tomar posse</strong> de um planeta inimigo. Sua frota desembarca Legionários (via barcaças) que enfrentam a guarnição no solo.</p>
            <p>É diferente de uma <strong>pilhagem</strong> (que saqueia sem tomar o planeta): uma invasão bem-sucedida te dá o planeta inteiro.</p>

            <h2 id="condicoes">O que precisa para invadir</h2>
            <ul>
                <li>Estar em uma <strong>aliança</strong>.</li>
                <li>Jogar num servidor em <strong>modo PvP</strong> (ex.: Dominação, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Ter <strong>barcaças</strong> e <strong>Legionários</strong> a bordo da frota.</li>
                <li>O alvo deve ser um planeta habitado (não um mercador, não um aliado, não alguém com quem você está em paz ou pacto).</li>
                <li>Não ter já um combate espacial previsto no mesmo lugar.</li>
            </ul>

            <h2 id="barcacas">O papel das barcaças</h2>
            <p>As barcaças são os veículos que desembarcam seus Legionários no solo. Cada barcaça transporta <strong>1&nbsp;000 Legionários</strong> (capacidade aumentada pelas pesquisas de aliança).</p>
            <p>Se você tiver mais Legionários que vagas, os excedentes <strong>ficam em órbita e não combatem</strong>. Em caso de fracasso, suas barcaças são <strong>capturadas pelo defensor</strong>.</p>

            <h2 id="orbital">Fase 1 — Combate em órbita (às vezes)</h2>
            <p>Duas situações podem detê-lo antes mesmo do desembarque:</p>
            <ul>
                <li>O planeta alvo ativou seu <strong>modo ataque</strong>: suas torres e escudos engajam sua frota primeiro. Se <strong>você perder</strong>, sua frota é destruída — a invasão para na hora. Se <strong>você vencer</strong>, as defesas orbitais são aniquiladas e sua frota continua (enfraquecida).</li>
                <li>O planeta alvo é guardado por uma frota <strong>armada</strong> do proprietário, ou por uma frota <strong>armada</strong> de um aliado da sua aliança, já em órbita (uma sonda ou um cargueiro sozinhos não contam mais): sua chegada desencadeia uma <strong>batalha</strong> contra esse defensor e as torres do planeta juntos — mesmo que o planeta não esteja em modo ataque. Essa batalha nunca começa contra um parceiro de paz, de pacto, um aliado ou sua própria aliança, nem em um servidor PvE: ela segue as mesmas regras diplomáticas de uma invasão normal. Ela cancela sua invasão em curso: se você vencê-la, precisa <strong>relançar</strong> uma invasão para desembarcar de fato — e se o planeta ainda estiver guardado nesse momento, clicar em «Invadir» a partir da órbita também é <strong>recusado</strong>: ative primeiro o modo ataque da sua própria frota para forçar o combate. Como uma invasão sempre carrega Legionários, essa condição é automaticamente atendida do lado atacante — a batalha começa quer sua frota carregue armas de nave, quer não.</li>
            </ul>
            <p><strong>Armadilha que você precisa conhecer: uma frota de invasão sem naves de combate é aniquilada nessa batalha.</strong> Legionários e barcaças bastam para lançar uma invasão, mas se sua frota não tiver nenhuma arma de nave, ela entra nessa batalha preliminar com poder de fogo zero — os defensores a aniquilam por completo, barcaças e Legionários inclusive, antes mesmo do desembarque. <strong>Escolte sempre suas frotas de invasão com naves de combate</strong> — veja o artigo <em>Pilhagens (raids)</em> para a mesma armadilha no lado da pilhagem.</p>

            <h2 id="combate">Fase 2 — Combate no solo</h2>
            <p>O combate no solo ocorre em <strong>10 rounds máximos</strong>. A cada round, os dois lados trocam perdas.</p>
            <table>
                <tr><th>Unidade</th><th>Função</th></tr>
                <tr><td><strong>Legionário</strong></td><td>Ataque e defesa. Reforçados pela pesquisa Arame Farpado para defesa.</td></tr>
                <tr><td><strong>Mecha</strong></td><td>Poderosa unidade de defesa pesada (máx. 500 por planeta).</td></tr>
                <tr><td><strong>Trabalhador</strong></td><td>Defesa passiva, <strong>apenas em invasão</strong> (não em pilhagem).</td></tr>
            </table>
            <p><strong>O atacante vence somente se</strong> todas as tropas do defensor forem eliminadas <strong>e</strong> restar ao menos 1 Legionário vivo. Senão, <strong>o defensor vence por vantagem do terreno</strong>.</p>

            <h2 id="deploy">Os deploys táticos do defensor</h2>
            <p>O defensor pode ter escolhido um <strong>deploy tático</strong> invisível para você. Mantenha em mente: pode virar uma situação que parecia ganha.</p>
            <table>
                <tr><th>Deploy</th><th>Efeito</th><th>Contrapartida</th></tr>
                <tr><td><strong>Equilibrado</strong></td><td>Nenhum bônus nem penalidade.</td><td>Neutro.</td></tr>
                <tr><td><strong>Fortificado</strong></td><td>+30&nbsp;% defesa no solo.</td><td>−20&nbsp;% de contra-ataque.</td></tr>
                <tr><td><strong>Guerrilha</strong></td><td>Trabalhadores +150&nbsp;% em defesa.</td><td>Legionários a −50&nbsp;%.</td></tr>
                <tr><td><strong>Último Bastião</strong></td><td>+50&nbsp;% se as tropas ficarem abaixo de 30&nbsp;%.</td><td>Condicional.</td></tr>
                <tr><td><strong>Terra Queimada</strong></td><td>Nenhum bônus ativo.</td><td>Se perder uma pilhagem, 50&nbsp;% dos recursos não saqueados são destruídos.</td></tr>
            </table>

            <h2 id="vitoria">Se você vencer a invasão</h2>
            <ul>
                <li><strong>Captura</strong> — o planeta é seu, com seus edifícios. Os trabalhadores são redefinidos a um nível base (~2&nbsp;000).</li>
                <li><strong>Planeta Cthulhu</strong> — se você retomar um planeta capturado pelos Cthulhu, ele é libertado (edifícios zerados, recompensa em urânio).</li>
                <li><strong>Sem mais espaço para colonizar?</strong> O planeta conquistado vira uma base Cthulhu: você não o mantém.</li>
            </ul>
            <p>As <strong>filas de produção</strong> não acompanham o planeta capturado: tanto as naves como as defesas (torres ou tropas) já pagas mas ainda não entregues são perdidas na captura — uma encomenda feita pelo vencido nunca muda de mãos. O que foi entregue antes do assalto, em contrapartida, está no solo e acompanha o planeta.</p>
            <p>Se o planeta capturado abrigar um <strong>herói secundário</strong> inimigo, o seu destino é decidido imediatamente: você o <strong>captura</strong> se possuir uma Prisão (nível 1 ou superior), caso contrário ele é <strong>executado</strong>. Já uma pilhagem nunca toma o planeta e, portanto, nunca coloca um herói em jogo. Detalhes no artigo <em>Heróis secundários</em>.</p>

            <h2 id="gameover">Eliminação do defensor</h2>
            <p>Se o defensor perder seu <strong>último planeta</strong>, ele é eliminado do servidor. Você recupera tudo: Bitcoins, frotas sobreviventes e Pontos de Guerra associados.</p>

            <h2 id="derrota">Se você perder a invasão</h2>
            <p>As <strong>barcaças são capturadas pelo defensor</strong>. Os Legionários desembarcados são perdidos. É uma derrota cara: sonde antes de invadir.</p>

    raid:
        title: "Pilhagens (raids)"
        category: "combat"
        order: 3
        tags: "pilhagem,raid,saque,recursos,bunker,barcacas"
        summary: "Pilhar os recursos de um planeta inimigo sem buscar conquistá-lo."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principio">O que é uma pilhagem?</h2>
            <p>Uma pilhagem é um ataque no solo cujo objetivo é <strong>roubar recursos</strong>. Você não toma o planeta: parte com o saque. Consequência importante: uma pilhagem, mesmo bem-sucedida, nunca toma o planeta, então <strong>nenhum herói secundário é capturado ou executado</strong> nela, seja você o atacante ou o defensor.</p>

            <h2 id="diferenca">Pilhagem vs Invasão</h2>
            <table>
                <tr><th></th><th>Pilhagem</th><th>Invasão</th></tr>
                <tr><td>Objetivo</td><td>Roubar nióbio, água, urânio</td><td>Tomar posse do planeta</td></tr>
                <tr><td>Defensores</td><td>Legionários + Mechas</td><td>Legionários + Mechas + Trabalhadores</td></tr>
                <tr><td>Imprevisibilidade</td><td>Baixa</td><td>Mais alta (fator aleatório de ataque maior)</td></tr>
                <tr><td>Perda das barcaças em derrota</td><td>Não</td><td>Sim (capturadas pelo defensor)</td></tr>
            </table>

            <h2 id="combate">Como acontece</h2>
            <p>Mesmas etapas que a invasão (combate orbital eventual, depois 10 rounds no solo), <strong>mas os trabalhadores não defendem</strong>. Os Legionários e Mechas do defensor estão sozinhos.</p>
            <p><strong>Planeta guardado por uma frota em órbita</strong> — se o alvo estiver protegido por uma frota <strong>armada</strong> do proprietário, ou por uma frota <strong>armada</strong> de um aliado da sua aliança (uma sonda ou um cargueiro sozinhos não bastam mais), sua pilhagem desencadeia primeiro uma batalha contra esse defensor e as torres do planeta. Essa batalha nunca começa contra um parceiro de paz, de pacto, um aliado ou sua própria aliança, nem em um servidor PvE. O saque não acontece na hora: se você vencer essa batalha, precisa <strong>relançar</strong> uma pilhagem para saquear de fato — e se o planeta ainda estiver guardado, clicar em «Pilhar» a partir da órbita também é <strong>recusado</strong>: ative primeiro o modo ataque da sua própria frota para forçar o combate. Do lado atacante, essa batalha só é desencadeada se sua própria frota de pilhagem for ofensiva — armas de nave, Legionários ou Mechas a bordo: um cargueiro puro, sem nenhuma arma nem tropa, não desencadeia nada.</p>

            <h2 id="pilhagem-so-tropas">Uma pilhagem só de tropas é aniquilada</h2>
            <p>Levar Legionários ou Mechas basta para desencadear essa batalha — mas se sua frota de pilhagem não tiver <strong>nenhuma arma de nave</strong>, ela entra nesse combate com poder de fogo zero. Os defensores a aniquilam por completo, sem perder uma única nave sequer. <strong>Escolte sempre seus transportes de tropas</strong>: essa é a surpresa mais cara que esse sistema pode lhe reservar.</p>

            <h2 id="saque">A pilhagem (em caso de vitória)</h2>
            <p>Você recupera tantos recursos quanto sua frota puder transportar. Os recursos são pegos nesta ordem:</p>
            <ol>
                <li><strong>Nióbio</strong> primeiro.</li>
                <li>Depois <strong>Água</strong>.</li>
                <li>Por fim <strong>Urânio</strong> (se sobrar espaço).</li>
            </ol>

            <h2 id="bunker">O bunker protege uma parte</h2>
            <p>O bunker do defensor <strong>protege 5&nbsp;% do armazenamento máx. por nível</strong>. Exemplos:</p>
            <ul>
                <li>Bunker nível 5 → 25&nbsp;% do armazenamento máx. protegido em nióbio e água.</li>
                <li>Bunker nível 10 → 50&nbsp;% protegido.</li>
            </ul>
            <p>O urânio é protegido da mesma forma: <strong>5&nbsp;% do seu estoque de urânio por nível de bunker</strong> (o urânio não tem armazenamento máximo, então a proteção se aplica ao estoque atual).</p>

            <h2 id="scorched">Atenção à Terra Queimada</h2>
            <p>Se o defensor tiver escolhido o <strong>deploy tático Terra Queimada</strong> e perder, <strong>50&nbsp;% dos recursos restantes (não pilhados) são destruídos</strong>. Você parte com seu saque, mas o adversário não consegue recuperar tudo depois.</p>

    nuclear:
        title: "Ataque nuclear"
        category: "combat"
        order: 4
        tags: "nuclear,bomba,uranio,destruicao,interceptador"
        summary: "A arma final para destruir edifícios-chave de um inimigo — desde que ele não tenha defesa antimíssil."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequisitos">O que você precisa</h2>
            <ul>
                <li>Um edifício <strong>Base Nuclear</strong>.</li>
                <li><strong>Urânio</strong> (muito raro).</li>
                <li>Uma <strong>bomba nuclear</strong> fabricada.</li>
                <li>Uma frota que parte em <strong>missão Nuclear</strong> para o alvo, com a bomba embarcada.</li>
            </ul>

            <h2 id="danos">O que uma bomba que acerta faz?</h2>
            <p>A bomba <strong>destrói um edifício</strong>, prioritariamente os mais estratégicos:</p>
            <ol>
                <li><strong>Metrópole</strong> — perda de 1 nível (−80&nbsp;000 trabalhadores máx.).</li>
                <li><strong>Cidade</strong> — perda de 1 nível (−25&nbsp;000 trabalhadores máx.).</li>
                <li><strong>Bunker</strong> — perda de 1 nível (proteção reduzida).</li>
                <li><strong>Quartel</strong> — perda de 1 nível (−5&nbsp;000 Legionários máx.).</li>
            </ol>
            <p>A bomba mira no primeiro edifício encontrado nesta ordem.</p>

            <h2 id="regra">Regras especiais</h2>
            <ul>
                <li>Uma frota em missão Nuclear <strong>não pode ser interceptada</strong> por uma frota em órbita. Vai direto ao alvo.</li>
                <li>A única forma de pará-la: o <strong>interceptador nuclear</strong> do defensor.</li>
            </ul>

            <h2 id="anti">A defesa: o interceptador nuclear</h2>
            <p>Se o planeta alvo possuir pelo menos um <strong>interceptador nuclear</strong>, a bomba é automaticamente neutralizada:</p>
            <ul>
                <li>A frota portadora é <strong>destruída</strong>.</li>
                <li><strong>1 a 3 interceptadores</strong> são consumidos.</li>
                <li>Os dois jogadores recebem um relatório.</li>
            </ul>
            <p>Moral: uma base estratégica sempre vale alguns interceptadores. Sem eles, ela é vulnerável.</p>

    defense:
        title: "Defender seus planetas"
        category: "combat"
        order: 5
        tags: "defesa,soldados,tanques,torre,escudo,bunker,orbital,tatico,deploy,estatisticas,potencia"
        summary: "As 3 camadas de defesa: orbital (torres), tática (deploy), terrestre (Legionários + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="visao">As 3 camadas de defesa</h2>
            <ol>
                <li><strong>Defesa orbital</strong> — torres, escudos, base espacial. Interceptam a frota antes que desembarque.</li>
                <li><strong>Deploy tático</strong> — uma escolha estratégica que modifica a potência das suas tropas no solo.</li>
                <li><strong>Defesa terrestre</strong> — Legionários, Mechas, trabalhadores (para invasões).</li>
            </ol>

            <h2 id="modo-ataque">Ativar o modo ataque do seu planeta</h2>
            <p>Se seu planeta tiver <strong>pelo menos uma torre</strong>, você pode ativar o <strong>modo ataque</strong>. Nesse modo, assim que uma frota inimiga em modo ataque chega em órbita, um <strong>combate orbital</strong> começa automaticamente.</p>
            <ul>
                <li><strong>Vitória</strong>: a frota inimiga é destruída e você recebe <strong>pontos de guerra</strong> proporcionais à sua assinatura (bem menos contra um Cthulhu).</li>
                <li><strong>Derrota</strong>: todas as suas torres, escudos, sua base espacial e sua fila de produção de defesas em curso são aniquilados; o modo ataque é <strong>desativado automaticamente</strong> (um planeta sem torre não pode mantê-lo ativo), e a frota continua para o combate no solo.</li>
            </ul>
            <p>Sem torres, seus escudos e a base espacial são destruídos <strong>sem combate</strong>.</p>
            <p>Dois lugares para ativá-lo: a página <strong>Defesa</strong> de um planeta, ou a página <strong>Planetas</strong>, que mostra o estado de cada planeta (uma mira ao lado das suas defesas, clicável para alternar) e oferece <strong>«Ativar tudo»</strong> / <strong>«Desativar tudo»</strong> em todo o seu império. A alternância em massa ignora os planetas sem torre ou já apanhados num combate, e diz-lhe quantos foram ignorados.</p>
            <p><strong>Atenção</strong>: ativar o modo ataque num planeta sobre o qual já paira uma frota inimiga desencadeia o combate orbital <strong>cinco minutos depois</strong>. Em massa, várias batalhas podem começar de uma vez — a mensagem diz-lhe quantas.</p>
            <p><strong>O que o atacante traz consigo.</strong> A frota que assalta as suas torres combate agora com <strong>todos os seus bónus</strong>: os bónus de aliança do seu comandante (mísseis, lasers, plasma, blindagem, escudo, precisão) e os bónus de equipamento do herói a bordo. Até 10 de setembro de 2026 só contavam no combate espacial: uma aliança que tivesse investido até +5&nbsp;% em cada uma dessas seis estatísticas não tirava daí nada contra torres. Vale nos dois sentidos — as suas próprias frotas mantêm os bónus quando é você a assaltar um planeta em modo ataque — e os números dos relatórios orbitais estão agora na mesma escala que os dos relatórios espaciais.</p>

            <h2 id="defesas-e-suas-frotas">Suas defesas também disparam sem o modo ataque</h2>
            <p>O modo ataque não é a única forma de fazer suas torres disparar. Assim que uma das suas frotas — ou uma frota <strong>armada</strong> de um aliado da sua aliança — está em órbita do planeta no momento em que um combate espacial começa ali, suas defesas se juntam automaticamente a esse combate, com o modo ataque ativo ou não (um planeta sem nada a defender — nenhuma torre, nenhum escudo, nenhuma base espacial — nunca participa). Isso o torna uma <strong>única batalha</strong>: sem um segundo combate orbital à parte. Nela, o bônus de blindagem da sua <strong>base espacial</strong> (+20&nbsp;%) beneficia tanto suas torres quanto seus escudos, e a afinidade militar do seu <strong>herói estacionado</strong> reforça o disparo das suas próprias torres e pode carregar Intimidação ou Tático para todo o seu lado, exatamente como um herói de frota. Suas torres visam ali com a sua própria precisão (70, acima do que qualquer frota pode alcançar), e sofrem <strong>perdas reais</strong> — proporcionais ao dano encaixado se o seu lado vencer, <strong>totais</strong> (torres, escudos, base espacial, fila de produção de defesas em curso, modo ataque desligado) se o seu lado cair. Você ganha a parte de <strong>pontos de guerra</strong> do seu planeta sempre que o seu lado vence essa batalha — mesmo que você não tenha colocado nenhuma frota sua nela. Consequência para os seus adversários: um planeta guardado por uma das suas frotas <strong>armada</strong> ou por uma frota aliada armada (uma sonda ou um cargueiro sozinhos não contam mais) já não pode ser pilhado nem invadido sem uma batalha antes, seja o atacante recém-chegado ou clicando em «Pilhar»/«Invadir» a partir da órbita — e esse combate nunca começa contra um parceiro de paz, de pacto, um aliado, sua própria aliança ou num servidor PvE.</p>
            <p><strong>Você não colocou nenhuma frota sua na batalha?</strong> Mesmo assim, você recebe um relatório dedicado que informa se suas defesas resistiram ou foram destruídas, com o detalhe do que suas torres perderam e sua parte de pontos de guerra se venceu — você nunca fica sem saber o destino do seu planeta.</p>

            <h2 id="combate-orbital">O combate orbital em detalhe</h2>
            <p>As torres disparam na frota inimiga ao ritmo dos rounds. A <strong>Base Espacial</strong> dá um bônus de blindagem a todas as defesas (+20&nbsp;%). Os escudos (50&nbsp;000 ou 600&nbsp;000 pts de blindagem) absorvem os primeiros disparos.</p>
            <p>As suas torres disparam <strong>logo no primeiro round</strong>, seja qual for a frota à frente: a tela de uma nave nunca adia a sua salva de abertura. Essa tela é uma reserva que encaixa o dano até se esgotar. Cada salva atravessa-a de imediato até ao seu <strong>poder de perfuração</strong> (plasma ×4, laser ×2, mísseis ÷ 7); o resto desgasta a tela, e o que transborda atinge o casco. Uma defesa feita só de lança-mísseis continua em desvantagem contra uma frota com grande escudo — mas dispara, causa perdas e deixa destroços.</p>
            <p>Mesmo que a frota inimiga vença, o seu ecrã de caças já não a protege indefinidamente&nbsp;: as suas torres infligem perdas reais também às naves mais pesadas dela, em proporção ao dano que encaixa — na pior das hipóteses para ela, 95&nbsp;% da sua blindagem inicial. Defender-se custa, portanto, sempre alguma coisa ao atacante, mesmo quando ele vence.</p>

            <h2 id="deploy">O deploy tático</h2>
            <p>Cada planeta pode escolher um <strong>deploy tático</strong>. Ele é <strong>invisível para o atacante</strong> — é sua carta na manga.</p>
            <table>
                <tr><th>Deploy</th><th>Efeito</th><th>Contrapartida</th></tr>
                <tr><td><strong>Equilibrado</strong></td><td>Nenhum bônus nem penalidade.</td><td>Neutro.</td></tr>
                <tr><td><strong>Fortificado</strong></td><td>+30&nbsp;% defesa no solo.</td><td>−20&nbsp;% de contra-ataque.</td></tr>
                <tr><td><strong>Guerrilha</strong></td><td>Trabalhadores +150&nbsp;% em defesa.</td><td>Legionários a −50&nbsp;%.</td></tr>
                <tr><td><strong>Último Bastião</strong></td><td>+50&nbsp;% se suas tropas caírem abaixo de 30&nbsp;%.</td><td>Sem efeito antes desse limite.</td></tr>
                <tr><td><strong>Terra Queimada</strong></td><td>Nenhum bônus ativo.</td><td>Se perder uma pilhagem: 50&nbsp;% dos seus recursos restantes são destruídos.</td></tr>
            </table>

            <h2 id="combate-solo">O combate no solo</h2>
            <p>Ocorre em <strong>10 rounds máximos</strong>. A cada round, os dois lados sofrem perdas. Se ninguém vencer em 10 rounds, <strong>o atacante é repelido</strong> (vantagem do terreno).</p>

            <h2 id="tropas">As unidades terrestres</h2>
            <table>
                <tr><th>Unidade</th><th>Função</th><th>Notas</th></tr>
                <tr><td><strong>Legionários</strong></td><td>Ataque e defesa.</td><td>Forte bônus defensivo com a pesquisa Arame Farpado.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>Defesa pesada.</td><td>Máx. 500 por planeta. Consomem comida.</td></tr>
                <tr><td><strong>Trabalhadores</strong></td><td>Defesa passiva.</td><td>Apenas contra invasões, não pilhagens.</td></tr>
            </table>

            <h2 id="ressources-defense">Recursos usados para produzir suas defesas</h2>
            <p>Como o Estaleiro Espacial, a produção de defesas recorre primeiro aos recursos <strong>do planeta</strong>, depois ao <strong>cargueiro das frotas estacionadas em órbita</strong>. Você pode então continuar a recrutar mesmo que o estoque no solo esteja baixo, desde que frotas carregadas estejam presentes acima do planeta.</p>

            <h2 id="instalacoes">Instalações orbitais e defesas</h2>
            <ul>
                <li><strong>Torres</strong> — lança-mísseis, laser, laser pesado, Gauss, iônica, plasma. Variadas para contrariar diferentes tipos de frotas.</li>
                <li><strong>Escudo</strong> (50&nbsp;000 pts) e <strong>Grande Escudo</strong> (600&nbsp;000 pts) — absorvem os primeiros disparos.</li>
                <li><strong>Base Espacial</strong> — +20&nbsp;% de blindagem a todas as defesas orbitais.</li>
            </ul>

            <h2 id="stats-defensives">Ler a potência do seu planeta</h2>
            <p>A página <strong>Defesa</strong> tem dois separadores. O segundo, <strong>Estatísticas defensivas</strong>, resume o que o planeta vale realmente: a blindagem, os mísseis, os lasers e os plasmas acumulados de todas as suas torres, o contributo de cada estrutura, o efeito do escudo, do grande escudo e da base espacial sobre a blindagem que uma frota enfrenta de facto, e a potência da sua defesa terrestre. É a forma mais rápida de detetar a estatística atrasada antes de lançar uma nova série de construções.</p>
            <p>Um detalhe de leitura: o gráfico circular e as barras mostram a blindagem <strong>apenas das estruturas</strong>. Os valores fixos de escudo aparecem à parte, nos modificadores, porque de outro modo esmagariam qualquer comparação entre as suas armas.</p>

            <h2 id="bunker">O bunker contra a pilhagem</h2>
            <p>O bunker protege <strong>5&nbsp;% do armazenamento máx. por nível</strong> contra pilhagens. Um bunker nível 5 já protege 25&nbsp;% das suas reservas. O urânio é protegido à razão de 5&nbsp;% do seu estoque atual por nível.</p>

            <h2 id="manutencao">Atenção ao custo de manutenção</h2>
            <p>As unidades em <strong>missão</strong> (frotas, barcaças em voo) custam <strong>muito mais caro</strong> que as estacionadas. Por exemplo, um Mecha na guarnição custa pouco, mas um Mecha embarcado custa ~50× mais. Não deixe um grande exército em viagem permanente.</p>

    embargo:
        title: "Embargo e fome"
        category: "combat"
        order: 6
        tags: "embargo,fome,bloqueio,cerco,planeta,comida,abastecimento,racoes"
        summary: "Passar fome num planeta antes de invadi-lo: o bloqueio, a fome que se instala e como sobreviver."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Um <strong>embargo</strong> é um cerco planetário. Você mantém uma grande frota em órbita de um planeta inimigo; as trocas são cortadas, a comida se esgota, a população sofre. Quando o planeta está enfraquecido, você parte para o ataque.</p>

            <h2 id="consumo">Lembrete: a comida</h2>
            <p>Seus trabalhadores, Legionários e Mechas consomem comida continuamente. Se suas reservas caírem a <strong>0</strong>, é a <strong>fome</strong>.</p>

            <p>As rações <strong>viajam no porão</strong>: carregue-as num planeta e descarregue-as noutro para reabastecer. Enquanto uma das suas frotas estiver <strong>atracada</strong> (nem em voo nem em combate) sobre o seu planeta, as rações dela completam o celeiro — e um cerco consome-as como o resto: o porão não é um cofre.</p>

            <h2 id="fome">A fome (fora de embargo)</h2>
            <p>Quando a comida falta, as perdas se encadeiam em <strong>3 fases</strong>:</p>
            <ul>
                <li><strong>Fase 1 (0–3h)</strong> — perdas moderadas de trabalhadores. Tempo para reagir.</li>
                <li><strong>Fase 2 (3–8h)</strong> — perdas aceleradas. Legionários começam a desertar.</li>
                <li><strong>Fase 3 (acima de 8h)</strong> — colapso: trabalhadores dizimados, Legionários em fuga, Mechas abandonados.</li>
            </ul>
            <p>Um piso de <strong>5&nbsp;000 trabalhadores</strong> evita o desaparecimento total. Sem reabastecimento, um planeta atinge esse piso em ~27 horas.</p>

            <h2 id="inicio">Como acionar um embargo</h2>
            <p>Um embargo se ativa automaticamente quando:</p>
            <ul>
                <li>Pelo menos uma <strong>frota inimiga</strong> (fora de aliados) está em órbita,</li>
                <li>em <strong>modo ataque</strong>,</li>
                <li>com <strong>naves pesadas suficientes</strong> (equivalente a ~250 couraçados, 37 destroyers ou 3 naves-mãe).</li>
            </ul>
            <p>Assim que a frota inimiga parte ou é destruída, o bloqueio é levantado.</p>
            <p>Uma frota de pilhagem ou invasão marcada como «em ataque» pela batalha fusionada descrita no artigo <em>Defender seus planetas</em> mantém essa marca se sobreviver: se ela ficar em órbita, conta para essa assinatura como qualquer outra frota hostil.</p>

            <h2 id="efeitos">O que o planeta sitiado sofre</h2>
            <ul>
                <li><strong>Drenagem de comida por hora</strong> adicional: a população entra em pânico e consome mais.</li>
                <li><strong>Produção de comida</strong> reduzida (fazendas perturbadas).</li>
                <li><strong>Produção de nióbio e água</strong> reduzida.</li>
                <li><strong>Crescimento de trabalhadores</strong> quase parado.</li>
                <li><strong>Mercado bloqueado</strong>: sem mais vendas automáticas a mercadores.</li>
                <li><strong>Cargueiros estrangeiros bloqueados</strong>: apenas seus cargueiros ou os dos seus aliados podem pousar (reabastecimento aliado).</li>
            </ul>

            <h2 id="fome-embargo">Fome sob embargo: é pior</h2>
            <p>Se a comida cair a 0 <strong>durante</strong> um embargo, as perdas são <strong>mais pesadas</strong> e imediatas: trabalhadores, Legionários e Mechas declinam os três continuamente.</p>

            <h2 id="tempos">Quanto tempo resiste?</h2>
            <table>
                <tr><th>Perfil de planeta</th><th>Início da fome</th><th>Colapso</th></tr>
                <tr><td>Pequeno (50 000 trabalhadores, 100 000 comida)</td><td>~14 horas</td><td>~1.75 dia</td></tr>
                <tr><td>Médio (150 000 trabalhadores, 800 000 comida)</td><td>~1.5 dia</td><td>~3.25 dias</td></tr>
                <tr><td>Fortaleza (200 000 trabalhadores, 2 000 000 comida)</td><td>~3 dias</td><td>~4.8 dias</td></tr>
            </table>

            <h2 id="defesa">Como resistir a um embargo</h2>
            <ul>
                <li><strong>Destruir a frota sitiante</strong> para levantar o bloqueio.</li>
                <li><strong>Trazer reabastecimento aliado</strong> — seus cargueiros e os da sua aliança sempre passam.</li>
                <li><strong>Evacuar</strong> — suas frotas <em>saindo</em> não são bloqueadas, você pode esvaziar seus recursos em emergência.</li>
                <li><strong>Construir Silos</strong> e armazenar comida <em>antes</em> que as coisas piorem.</li>
                <li><strong>Pedir ajuda à sua aliança</strong> para quebrar o cerco com mais força.</li>
            </ul>

            <h2 id="relatorios">Os relatórios durante um embargo</h2>
            <p>A cada hora, você (e o atacante) recebe um relatório: tempo decorrido, comida restante, perdas sofridas. A página Planeta também exibe uma seção <strong>Abastecimento</strong> muito útil (produção, consumo, autonomia estimada).</p>

    combat_stats:
        title: "Entendendo a potência das tropas"
        category: "combat"
        order: 7
        tags: "potencia,bonus,combate,politica,calculo,faccao"
        summary: "Como a potência das suas unidades se compara e o que a impulsiona."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Potência no solo</h2>
            <p>Em ordem de grandeza (sem bônus):</p>
            <table>
                <tr><th>Unidade</th><th>Potência relativa</th><th>Função</th></tr>
                <tr><td><strong>Mecha</strong></td><td>Muito alta</td><td>Pilar de defesa. Caro, mas esmaga uma invasão pequena.</td></tr>
                <tr><td><strong>Legionário (defesa)</strong></td><td>Alta se pesquisa Arame Farpado subida</td><td>Multiplicador defesa × nível Arame Farpado.</td></tr>
                <tr><td><strong>Legionário (ataque)</strong></td><td>Média, com aleatoriedade</td><td>Variável — uma pilhagem é menos imprevisível que uma invasão.</td></tr>
                <tr><td><strong>Trabalhador (defesa)</strong></td><td>Baixa, mas o número conta</td><td>Apenas em invasão. 200 000 trabalhadores pesam.</td></tr>
            </table>
            <p>As <strong>barcaças</strong> não combatem: transportam 1&nbsp;000 Legionários cada (mais com as pesquisas de aliança).</p>

            <h2 id="bonus">O que aumenta sua potência</h2>
            <ul>
                <li><strong>Pesquisa Arame Farpado</strong> — multiplicador massivo na defesa dos Legionários.</li>
                <li><strong>Pesquisa Disciplina</strong> — melhora os Legionários no solo.</li>
                <li><strong>Pesquisas de aliança</strong> — bônus de ataque Legionário, defesa Mechas, defesa trabalhadores, poder de fogo naves, blindagem naves, capacidade barcaças.</li>
                <li><strong>Deploy tático</strong> — escolha que pode impulsionar defesa ou contra-ataque.</li>
                <li><strong>Herói Militar</strong> — bônus direto de ataque e defesa.</li>
                <li><strong>Itens</strong> equipados no herói.</li>
            </ul>

            <h2 id="faction">Bónus político (combates espaciais)</h2>
            <p>O bónus de armas do combate espacial vem da <strong>política da sua aliança</strong>. Cada regime vence o seu rival: a <strong>Democracia</strong> vence o <strong>Comunismo</strong>, que vence o <strong>Fascismo</strong>, que vence a <strong>Democracia</strong>.</p>
            <p>Quando a política do <strong>atacante</strong> vence a do defensor, todas as suas armas (mísseis, lasers, plasma) ganham <strong>+20&nbsp;%</strong> para esse combate. O bónus aplica-se apenas ao agressor: o defensor conta com as suas defesas planetárias.</p>

            <h2 id="precision">Precisão e lançamentos de combate</h2>
            <p>Em combate espacial, cada lado dispara <strong>uma salva por ronda</strong>. Um lançamento aleatório, tirado entre a precisão do lado e 100 e dividido por 80, modula o dano da salva de <strong>×0,3 a ×1,2</strong>. Uma precisão alta não torna os seus golpes mais fortes: elimina os maus lançamentos.</p>
            <p>A mira de uma frota já não é mostrada em percentagem em lado nenhum&nbsp;: em todo o lado — Estaleiro espacial, página de gestão de frota, separador Defesas e relatórios de combate — o jogo mostra o <strong>multiplicador de dano</strong> que ela produz realmente (<strong>×0,66</strong> sem qualquer investimento, <strong>×0,94</strong> com a mira no máximo). Esse nível depende dos pontos de <strong>personalização</strong> investidos em precisão para cada modelo de nave (40 pontos/dia) e é próprio desse modelo&nbsp;: gastar seus pontos noutro lugar, na blindagem ou nas armas do mesmo modelo, nunca o faz descer. Quando várias frotas combatem juntas, o lado usa a média das suas miras. As defesas de um planeta disparam a <strong>×1,06</strong> — melhor do que uma frota com a mira no máximo. Contra um adversário controlado pela IA (bot), a sua mira nunca fica abaixo de um piso fixo e conhecido&nbsp;: um bot que realmente investiu o ultrapassa, e um jogador suficientemente investido pode igualá-lo ou superá-lo.</p>

    reports:
        title: "Os relatórios do jogo"
        category: "beginner"
        order: 9
        tags: "relatorio,notificacao,combate,espionagem,alianca,colonizacao,mensagens"
        summary: "O jogo te envia relatórios para todo evento importante. Veja onde encontrá-los e o que contêm."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="onde">Onde encontrar seus relatórios?</h2>
            <p>Clique em <strong>Mensagens</strong> no menu da esquerda. Você encontrará todos os relatórios recebidos, classificados por tipo. Um ponto colorido sinaliza as mensagens não lidas.</p>
            <p>Você também pode ativar as <strong>notificações push</strong> para receber alertas no seu telefone ou navegador (ver artigo dedicado).</p>

            <h2 id="combate">Relatórios de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — uma das suas frotas cruzou com uma frota inimiga.</li>
                <li><strong>Combate orbital</strong> — suas defesas planetárias repeliram (ou não) um atacante.</li>
                <li><strong>Defesas planetárias</strong> — relatório dedicado ao proprietário de um planeta que não colocou nenhuma frota sua em uma batalha fusionada: suas defesas resistiram ou foram aniquiladas.</li>
                <li><strong>Pilhagem</strong> — saque sofrido ou infligido.</li>
                <li><strong>Invasão</strong> — tentativa de tomada de planeta (de um lado ou do outro).</li>
                <li><strong>Nuclear</strong> — bomba enviada ou recebida.</li>
                <li><strong>Embargo</strong> — ponto horário se um dos seus planetas está sitiado.</li>
            </ul>

            <h2 id="cthulhu">Relatórios Cthulhu</h2>
            <ul>
                <li><strong>Ataque Cthulhu</strong> — horda Cthulhu contra seu planeta.</li>
                <li><strong>Tower Defense</strong> — vitória ou derrota da sua defesa ativa.</li>
                <li><strong>Libertação de planeta</strong> — retomada de um planeta dos Cthulhu.</li>
            </ul>

            <h2 id="frota">Relatórios de frota</h2>
            <ul>
                <li><strong>Chegada de frota</strong> — sua frota atingiu seu destino.</li>
                <li><strong>Depósito de recursos</strong> — um aliado te enviou algo.</li>
                <li><strong>Reciclagem concluída</strong> — seus recicladores terminaram o trabalho.</li>
                <li><strong>Espionagem</strong> — resultado de uma sonda enviada (ou sonda detectada em você).</li>
            </ul>

            <h2 id="alianca">Relatórios de aliança</h2>
            <ul>
                <li><strong>Diplomacia</strong> — declaração de guerra, proposta de pacto, paz aceita, rutura de um pacto de não agressão ou de uma aliança defensiva, expiração de um acordo de paz.</li>
                <li><strong>Membros</strong> — chegada, saída, exclusão, Game Over de um camarada.</li>
            </ul>

            <h2 id="diversos">Outros relatórios</h2>
            <ul>
                <li><strong>Relatório diário</strong> — seu balanço econômico diário (18h59 UTC).</li>
                <li><strong>Colonização</strong> — novo planeta fundado.</li>
                <li><strong>Venda mercador</strong> — seus recursos foram comprados.</li>
                <li><strong>Bônus de conexão</strong> — Bitcoins do dia recebidos.</li>
                <li><strong>Prisão</strong> — herói capturado ou libertado.</li>
            </ul>
            <h2 id="compte-valide">Conta a validar</h2>
            <p>⚠️ Para <strong>enviar uma mensagem ou Bitcoins</strong> a outro jogador, sua conta deve estar <strong>validada</strong> (login criado) e seu <strong>e-mail confirmado</strong>. Contas de teste/anônimas são bloqueadas — confirme seu e-mail em <strong>Minhas opções</strong>.</p>

    battle_reports:
        title: "Lendo um relatório de combate"
        category: "combat"
        order: 8
        tags: "relatorio,combate,vitoria,derrota,analise"
        summary: "Depois de cada combate, um relatório detalhado. Veja como decodificá-lo para acertar melhor da próxima vez."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="onde">Onde encontrá-los</h2>
            <p>Todos os relatórios de combate chegam na sua página <strong>Mensagens</strong>. São classificados por tipo (espacial, pilhagem, invasão, orbital, embargo, nuclear).</p>

            <h2 id="tipos">Tipos de relatórios de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — duas frotas se cruzaram.</li>
                <li><strong>Combate orbital</strong> — suas defesas planetárias interceptaram uma frota.</li>
                <li><strong>Defesas planetárias</strong> — batalha fusionada em que você não colocou nenhuma frota sua: suas torres, escudos e base espacial resistiram, ou foram destruídos.</li>
                <li><strong>Pilhagem</strong> — tentativa de saque (do seu lado ou contra você).</li>
                <li><strong>Invasão</strong> — tentativa de tomada de planeta.</li>
                <li><strong>Nuclear</strong> — bomba enviada ou recebida.</li>
                <li><strong>Embargo</strong> — relatório horário durante um cerco.</li>
            </ul>

            <h2 id="contenu">O que contém um relatório</h2>
            <ul>
                <li><strong>Forças envolvidas</strong> — blindagem inicial, escudo e armas de cada lado, e a composição de cada frota. A mira já não aparece em percentagem, mas como o <strong>multiplicador de dano</strong> que ela produz realmente (×0,66 sem qualquer investimento, ×0,94 com a mira no máximo, ×1,06 para as defesas de um planeta): nenhum tiro falha nunca, uma melhor mira eleva o mínimo do seu dano.</li>
                <li><strong>Salvas</strong> — quantas salvas este lado disparou, quantas foram contra o escudo inimigo, e se o seu próprio escudo foi perfurado ou resistiu.</li>
                <li><strong>Carga de escudo</strong> — para um bloco de frota, a percentagem de carga no início e no fim do combate, junto com a sua capacidade total: o seu escudo não volta automaticamente a 100&nbsp;% de um combate para o outro, ele recarrega progressivamente (ver o artigo <em>Combate espacial</em>).</li>
                <li><strong>Blindagem restante</strong> — o que continua de pé, e a sua parte da blindagem inicial. Um lado aniquilado mostra em vez disso o <strong>dano excedente</strong> que recebeu além da sua blindagem: essa é a sua margem de vitória.</li>
                <li><strong>Dano encaixado</strong> — dois contadores por lado: <strong>casco</strong> (o que atravessou o escudo) e <strong>escudo</strong> (o que o muro bloqueou). As suas perdas resultam diretamente deles.</li>
                <li><strong>Perdas</strong> — nave a nave, dos dois lados.</li>
                <li><strong>Defesas planetárias detalhadas</strong> — perdas de torres, além do seu Escudo, Grande escudo e Base espacial quando os tem; a pontuação de defesa e a etiqueta «Ataque» mostradas numa batalha fusionada são agora as reais.</li>
                <li><strong>Recursos saqueados</strong> (nos raids) e <strong>destroços gerados</strong> — a reciclar!</li>
                <li><strong>Pontos de Guerra ganhos</strong> e resultado final.</li>
            </ul>

            <h2 id="analyser">Como tirar uma lição</h2>
            <ul>
                <li>Olhe primeiro para o <strong>dano encaixado</strong>: a linha «casco» conta a exposição das suas naves sem escudo <em>e</em> o que atravessou um escudo perfurado; a linha «escudo», o que o muro absorveu (as suas naves com escudo desgastam-se em proporção).</li>
                <li>Compare os dois <strong>multiplicadores de dano</strong>: é o único número diretamente comparável entre os lados, e agora o único que o jogo mostra — as percentagens de precisão desapareceram de todos os ecrãs. Depois olhe para a <strong>blindagem restante</strong> — vencer conservando 5&nbsp;% da sua blindagem e vencer conservando 70&nbsp;% liam-se da mesma forma antes. Um excedente grande no adversário significa que pagou a vitória demasiado caro.</li>
                <li>Perdas entre os seus <strong>caças</strong> são normais mesmo quando o muro aguenta: sem escudo, encaixam a sua parte do fogo em cheio — mas, pequenos, só atraem uma parte reduzida.</li>
                <li>Muitas <strong>salvas gastas no escudo inimigo</strong>? Construa plasma (×4 contra escudos) para perfurar mais depressa.</li>
                <li><strong>100 rondas atingidas</strong>: vence o lado que conserva mais blindagem — se lhe acontecer a atacar, falta poder ou precisão à sua frota.</li>
                <li><strong>Arquive os relatórios importantes</strong>: servem de prova nos debates de aliança.</li>
            </ul>

    combat_simulator:
        title: "Simulador de combate"
        category: "combat"
        order: 9
        tags: "simulador,combate,simulacao,frota,perdas,estimativa,relatorio"
        summary: "Estime os seus riscos antes de atacar: repita mil vezes um combate contra uma frota observada num relatório, com o motor real do jogo."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="proposito">Para que serve</h2>
            <p>O separador <strong>Simulador de combate</strong> da página Frotas estima o que arrisca antes de atacar. Repete <strong>1.000 vezes</strong> um combate entre uma das suas frotas e uma frota inimiga, com o <strong>motor real do jogo</strong>: mesmas fórmulas, mesmos lançamentos aleatórios. Nada é realmente comprometido: nenhuma nave se move, nenhuma morre.</p>

            <h2 id="fonte">A fonte: um relatório de combate</h2>
            <p>A frota inimiga vem de um dos seus <strong>relatórios de combate recentes</strong> (os que mostram a linha «Dano encaixado»): são as únicas fontes honestas, porque contêm o poder real do lado observado, bónus incluídos. Um relatório de espionagem só dá números de naves, sem as suas estatísticas reais — a simulação seria enganosa, por isso não é proposta.</p>
            <p>Escolha o relatório, o lado a enfrentar (uma das duas armadas do relatório) e uma das suas frotas armadas. Simula sempre como <strong>atacante</strong>, com os seus bónus reais (herói, aliança, política).</p>

            <h2 id="ler">Ler o resultado</h2>
            <ul>
                <li><strong>Taxa de vitória</strong> — a parte das 1.000 tiragens que ganha.</li>
                <li><strong>Intervalo de perdas por tipo de nave</strong> (mínimo, mediana, máximo) — apenas nas tiragens vitoriosas: em caso de derrota, a sua frota seria totalmente destruída.</li>
                <li><strong>Um exemplo de desenrolar</strong> — uma tiragem mediana, apresentada como um relatório e claramente marcada «SIMULAÇÃO».</li>
            </ul>

            <h2 id="limites">Limites a ter em conta</h2>
            <ul>
                <li>A frota inimiga é a <strong>observada na data do relatório</strong>: pode ter sido reconstruída, melhorada ou reforçada desde então.</li>
                <li>Os trunfos circunstanciais do adversário (herói, defesas planetárias se combater em casa) só se conhecem no combate real.</li>
                <li>Limite de <strong>20 simulações por dia</strong>: o simulador esclarece uma decisão, não substitui o risco do combate.</li>
            </ul>

    colonization:
        title: "Colonizar um novo planeta"
        category: "planet"
        order: 1
        tags: "colonizacao,planeta,colonizador,expansao"
        summary: "Expandir seu império fundando novos planetas em posições vazias."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="porque">Por que colonizar?</h2>
            <ul>
                <li><strong>Mais produção</strong> — cada planeta tem sua própria economia.</li>
                <li><strong>Mais filas de construção</strong> paralelas.</li>
                <li><strong>Menos risco</strong> — seus ovos não estão mais na mesma cesta.</li>
                <li><strong>Posições estratégicas</strong> — proximidade de mercadores, aliados, alvos.</li>
            </ul>

            <h2 id="etapas">Como colonizar</h2>
            <ol>
                <li>Desbloqueie a pesquisa <strong>Expansão</strong> (para ter direito a mais planetas).</li>
                <li>Fabrique um <strong>colonizador</strong> no seu Estaleiro Espacial.</li>
                <li>Carregue-o com alguns recursos iniciais (recomendado: nióbio e água).</li>
                <li>Envie-o em missão <strong>Colonização</strong> a uma <strong>posição vazia</strong> no mapa.</li>
            </ol>
            <p>Na chegada, o novo planeta é fundado. Aparece no seu painel da direita.</p>

            <h2 id="inicial">O que ele tem no início</h2>
            <p>Um planeta recém-colonizado começa com uma base modesta (algumas centenas de nióbio e água, cerca de 2&nbsp;500 trabalhadores, 20 Legionários). Todo o resto é para construir.</p>

            <h2 id="limite">Quantos planetas no máximo?</h2>
            <p>O limite depende:</p>
            <ul>
                <li>Do nível da pesquisa <strong>Expansão</strong>.</li>
                <li>Da sua <strong>aliança</strong> (certas pesquisas de aliança desbloqueiam planetas adicionais).</li>
                <li>Das suas <strong>invasões</strong> bem-sucedidas (certas pesquisas de aliança ofensivas também dão planetas).</li>
            </ul>

            <h2 id="escolha">Onde colonizar?</h2>
            <ul>
                <li>Perto de um <strong>mercador</strong>: economia fácil pelo envio de cargueiros.</li>
                <li>Perto dos seus <strong>aliados</strong>: defesa mútua.</li>
                <li>Numa <strong>posição "rica"</strong> (maior, terraformável): melhor produção.</li>
                <li>Evite se isolar muito longe de tudo: frotas mais lentas, abastecimento complicado.</li>
            </ul>

    planet_types:
        title: "Tudo o que se encontra no mapa"
        category: "planet"
        order: 2
        tags: "planeta,lua,sol,mercador,alien,detritos,cthulhu"
        summary: "Os diferentes objetos visíveis no mapa galáctico e o que se pode fazer com eles."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="tipos">Os 7 tipos de objetos</h2>
            <table>
                <tr><th>Tipo</th><th>Descrição</th><th>Ações possíveis</th></tr>
                <tr><td><strong>Planeta</strong> (habitado)</td><td>Pertence a um jogador. Pode-se construir nele, colonizá-lo (se vazio)…</td><td>Sondar, pilhar, invadir, bombardear.</td></tr>
                <tr><td><strong>Lua</strong></td><td>Criada por um Moon Maker. Produção de comida ultrarrápida (ciclo de 1 min).</td><td>Sondar, pilhar, invadir.</td></tr>
                <tr><td><strong>Sol</strong></td><td>Objeto estelar não colonizável.</td><td>Nenhuma.</td></tr>
                <tr><td><strong>Posição vazia</strong></td><td>Posição livre sem objeto. Ideal para colonizar ou criar uma lua.</td><td>Colonizar, colocar uma lua, reabastecer um aliado.</td></tr>
                <tr><td><strong>Mercador</strong></td><td>PNJ imune que compra seus recursos por Bitcoins.</td><td>Vender (missão Descarregamento).</td></tr>
                <tr><td><strong>Planeta Alien / Cthulhu</strong></td><td>Base da colmeia, defendida por uma guarnição permanente.</td><td>Invadir para libertar (urânio + reduz a Ameaça do universo).</td></tr>
                <tr><td><strong>Campo de detritos</strong></td><td>Resto de um combate (nióbio, água) ou aparição espontânea (urânio).</td><td>Reciclar.</td></tr>
            </table>

            <h2 id="identificar">Identificá-los no mapa</h2>
            <p>Cada tipo tem seu ícone. Passe o mouse para ver o nome do proprietário (se habitado), o tamanho estimado e suas opções possíveis.</p>

            <h2 id="luas">Caso particular: as luas</h2>
            <p>As luas são criadas com uma nave especial <strong>Moon Maker</strong>, numa posição vazia com pelo menos 2M de nióbio e 2M de água em destroços. Uma vez colocada, a lua produz <strong>comida 10× mais rápido</strong> que um planeta (ciclo de 1 minuto em vez de 10). É uma mina de comida preciosa para sustentar um grande exército.</p>

    planet_management:
        title: "Gerenciar um planeta"
        category: "planet"
        order: 3
        tags: "gestao,planeta,producao,capacidade,especializacao"
        summary: "Como otimizar a produção, organizar seu espaço, e eventualmente especializar um planeta."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basico">As bases para dominar</h2>
            <ul>
                <li><strong>Níveis de produção</strong> — suba regularmente Mina / Extrator / Fazenda.</li>
                <li><strong>Armazenamento</strong> — sem estoques suficientes, a produção satura e para.</li>
                <li><strong>População</strong> — Cidades e Metrópoles aumentam seu limite de trabalhadores.</li>
                <li><strong>Defesa mínima</strong> — um pequeno bunker, alguns Mechas, é o básico.</li>
            </ul>

            <h2 id="otimizar">Otimizar um planeta</h2>
            <ol>
                <li>Construa edifícios de produção <strong>em par</strong> (Mina + Extrator sobem frequentemente juntos).</li>
                <li>Pesquise <strong>Terraformação</strong> para ampliar o planeta e poder construir mais.</li>
                <li>Mantenha um olho na <strong>autonomia alimentar</strong>: Fazenda/Fazenda Aeropônica suficientes para sua pop.</li>
                <li>Coloque uma <strong>lua</strong> próxima para reforçar a produção de comida.</li>
            </ol>

            <h2 id="especializar">Especializar seus planetas</h2>
            <p>Vários planetas = possibilidade de especializá-los conforme sua posição e edifícios:</p>
            <ul>
                <li><strong>Planeta econômico</strong> — muitas minas, muitos trabalhadores, venda a mercadores próximos.</li>
                <li><strong>Planeta militar</strong> — estaleiro espacial, fábricas pesadas, grandes defesas, para estacionar sua frota.</li>
                <li><strong>Planeta de pesquisa</strong> — Centro de Pesquisa subido alto, muitos cientistas.</li>
                <li><strong>Posto avançado fronteiriço</strong> — radar/jammer, sondas, torres. Serve para vigiar ou conter um vizinho.</li>
            </ul>

            <h2 id="capital">O planeta capital</h2>
            <p>Seu <strong>primeiro planeta</strong> tem um papel particular: se seu herói for destruído em combate, ele é automaticamente realocado para esse planeta. Mantenha-o sempre bem defendido.</p>

    planet_abandon:
        title: "Abandonar um planeta"
        category: "planet"
        order: 4
        tags: "abandonar,planeta,exclusao,game over"
        summary: "Quando é uma boa ideia, como fazer, e por que é preciso se abster em certos casos."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="porque">Por que abandonar um planeta?</h2>
            <ul>
                <li>Ele está <strong>muito exposto</strong> a ataques e consome mais do que rende.</li>
                <li>Está <strong>mal posicionado</strong> (longe de tudo, difícil de defender).</li>
                <li>Você quer <strong>colonizar um melhor</strong>, mas está no limite de planetas.</li>
            </ul>

            <h2 id="como">Como fazer</h2>
            <p>O abandono é feito pela página <strong>Planeta</strong> → seção Gestão. Uma confirmação é solicitada (é irreversível).</p>
            <p>Antes de abandonar: <strong>evacue todos os recursos, Legionários, naves</strong> para outro planeta. Uma vez abandonado, tudo que resta é perdido.</p>

            <h2 id="perigo">A armadilha a evitar absolutamente</h2>
            <p>Abandonar seu <strong>último planeta</strong> é o <strong>Game Over</strong>:</p>
            <ul>
                <li>Suas frotas são <strong>transferidas aos aliens</strong>.</li>
                <li>Seu comandante é eliminado do servidor.</li>
                <li>A partida acabou.</li>
            </ul>
            <p>Nunca abandone sem garantir que você tem pelo menos um outro ainda ativo.</p>

    galaxy_navigation:
        title: "Navegando na galáxia"
        category: "planet"
        order: 5
        tags: "galaxia,setor,navegacao,mapa,universo,coordenadas"
        summary: "Como o universo está organizado, como ler uma coordenada e como usar o mapa."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="estrutura">Como o universo está organizado</h2>
            <p>O universo é uma hierarquia:</p>
            <ul>
                <li>O <strong>Universo</strong> contém várias <strong>Galáxias</strong>.</li>
                <li>Cada <strong>Galáxia</strong> contém <strong>Setores</strong> (grade 10×10).</li>
                <li>Cada <strong>Setor</strong> contém 25 <strong>Posições</strong> (grade 5×5).</li>
            </ul>
            <p>Cada posição pode conter um planeta, um mercador, um campo de detritos, uma lua, um sol, ou estar vazia.</p>

            <h2 id="coordenadas">Ler uma coordenada</h2>
            <p>Formato: <strong>Galáxia:Setor:Posição</strong>, por exemplo <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — primeira galáxia;</li>
                <li><strong>5</strong> — quinto setor dessa galáxia;</li>
                <li><strong>12</strong> — décima segunda posição desse setor.</li>
            </ul>

            <h2 id="mapa">Usar o mapa</h2>
            <p>A página <strong>Mapa</strong> (menu da esquerda) mostra a visão espacial. Você pode:</p>
            <ul>
                <li>Deslocar-se entre galáxias e setores.</li>
                <li>Clicar em uma posição para ver o que há lá.</li>
                <li><strong>Enviar diretamente uma frota</strong> clicando em "Atacar / Enviar" da célula.</li>
                <li>Ver as posições de aliados, inimigos e mercadores (de acordo com suas relações e seu radar).</li>
            </ul>
            <p>As <strong>frotas em trânsito</strong> aparecem como pequenas naves animadas que deslizam em tempo real entre o planeta de origem e o de destino. O <strong>halo colorido</strong> indica o lado: <strong>azul</strong> = você, <strong>verde</strong> = aliança, <strong>cinza</strong> = pacto/paz, <strong>magenta</strong> = mercador, <strong>violeta</strong> = alien, <strong>vermelho</strong> = inimigo. O <strong>tamanho</strong> reflete a assinatura da frota. Suas frotas e as da sua aliança são sempre visíveis; as outras só aparecem quando seu <strong>radar</strong> cobre o setor. Para voos de longa distância atravessando vários setores, o marcador só aparece durante a parte final da viagem — a entrada no setor de destino — não durante todo o trajeto.</p>

            <h2 id="hiperespaco">Viagens inter-galáxias</h2>
            <p>Para ir de uma galáxia a outra, você precisa da pesquisa <strong>Hiperespaço</strong>. Trajetos inter-galáxias são longos e caros em combustível — planeje-se.</p>

    radar_jammer:
        title: "Radar e bloqueio"
        category: "planet"
        order: 6
        tags: "radar,bloqueador,jammer,deteccao,vigilancia"
        summary: "Ver o inimigo chegando antes que ele chegue, e esconder seus próprios movimentos."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principio">Radar vs Bloqueador (Jammer)</h2>
            <ul>
                <li><strong>Radar</strong> — vê as frotas que se aproximam. Te dá tempo para reagir.</li>
                <li><strong>Bloqueador (Jammer)</strong> — esconde seus próprios movimentos dos radares inimigos.</li>
            </ul>

            <h2 id="deteccao">Os radares disponíveis</h2>
            <table>
                <tr><th>Tipo</th><th>Onde</th><th>Função</th></tr>
                <tr><td><strong>Radar</strong> (edifício)</td><td>No planeta (solo)</td><td>Detecção local. Alerta sobre frotas que se aproximam do seu planeta.</td></tr>
                <tr><td><strong>Sky Radar</strong> (edifício)</td><td>No céu (ilha orbital)</td><td>Detecção estendida. Mais alcance, melhor precisão.</td></tr>
                <tr><td><strong>Radar</strong> (nave)</td><td>Em frota</td><td>Detecção móvel. Útil para explorar ou vigiar uma área longe de casa.</td></tr>
            </table>

            <h2 id="bloqueio">Os bloqueadores disponíveis</h2>
            <table>
                <tr><th>Tipo</th><th>Onde</th><th>Função</th></tr>
                <tr><td><strong>Sky Jammer</strong> (edifício)</td><td>No céu (ilha orbital)</td><td>Bloqueia radares inimigos ao redor do seu planeta.</td></tr>
                <tr><td><strong>Jammer</strong> (nave)</td><td>Em frota</td><td>Bloqueia radares ao redor da sua frota em voo.</td></tr>
            </table>

            <h2 id="naves-no-solo">Ver as naves no solo</h2>
            <p>A <strong>assinatura no solo</strong> — as naves estacionadas num planeta — segue uma regra um pouco mais flexível: uma das suas frotas <strong>em órbita</strong> conta-as à vista, mesmo sem radar. Mas apenas para esse planeta.</p>
            <p>O <strong>radar</strong> continua a ser o que lhe dá essa leitura <strong>à distância</strong>, em todo o setor. E um <strong>Sky Jammer</strong> no planeta fecha a observação: sem um radar superior ao bloqueador, a assinatura no solo volta a ficar invisível, mesmo com uma frota por cima.</p>

            <h2 id="estrategia">Como usá-los</h2>
            <ul>
                <li><strong>Radar</strong> em cada planeta: no mínimo o edifício base, para não ser surpreendido.</li>
                <li><strong>Jammer</strong> em frota: essencial para um ataque surpresa a longa distância.</li>
                <li><strong>Implantar</strong> um satélite radar (missão dedicada) numa posição estratégica para vigiar um vizinho.</li>
                <li>A pesquisa <strong>Onda</strong> melhora o alcance e a precisão de todos os radares.</li>
            </ul>

    moon:
        title: "As luas"
        category: "planet"
        order: 7
        tags: "lua,moonmaker,comida,producao"
        summary: "Uma lua produz comida 10× mais rápido que um planeta. Como criar uma."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="o-que-e">O que é uma lua?</h2>
            <p>Uma <strong>lua</strong> é um objeto especial, menor que um planeta, <strong>dedicado apenas à produção de comida</strong>. Seu ciclo gira em <strong>1 minuto</strong> em vez de 10: ela produz 10× mais rápido que um planeta do mesmo tamanho.</p>
            <p>Uma lua é um excelente complemento para sustentar um exército que consome muito (muitos Legionários, Mechas, naves em missão).</p>

            <h2 id="criacao">Como criar uma lua</h2>
            <p>Uma lua nasce de um <strong>campo de destroços</strong>: é preciso uma <strong>posição vazia</strong> com pelo menos <strong>2M de nióbio E 2M de água</strong> em destroços (deixados por uma batalha espacial nesse local). A missão Lua só é oferecida no mapa se a posição cumprir esta condição.</p>
            <ol>
                <li>Fabrique um <strong>Moon Maker</strong> (nave especial, cara).</li>
                <li>Envie-o em missão <strong>Lua</strong> para uma posição vazia com destroços suficientes.</li>
                <li>Na chegada, a lua é criada e <strong>consome todos os destroços</strong>. Se as condições já não estiverem reunidas (destroços reciclados durante o voo, posição colonizada…), um relatório explica a falha.</li>
            </ol>

            <h2 id="tamanho">Tamanho da lua</h2>
            <p>Quanto mais rico o campo de destroços, maior a lua. O patamar é definido pelo <strong>menor</strong> dos dois recursos:</p>
            <table>
                <tr><th>Destroços (mín. nióbio/água)</th><th>Terreno</th></tr>
                <tr><td>2M – 8M</td><td>100 – 150</td></tr>
                <tr><td>8M – 15M</td><td>150 – 190</td></tr>
                <tr><td>15M – 25M</td><td>190 – 230</td></tr>
                <tr><td>25M – 50M</td><td>230 – 280</td></tr>
                <tr><td>50M ou mais</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limitacoes">Limites</h2>
            <ul>
                <li>Uma lua <strong>só produz comida</strong> (sem nióbio nem água).</li>
                <li>Pode ser <strong>atacada, pilhada, invadida</strong> como um planeta normal.</li>
                <li>Construir uma lua perto de casa é mais seguro (menos exposta a vizinhos hostis).</li>
            </ul>

            <h2 id="estrategia">Quando colocar uma</h2>
            <ul>
                <li>Tem dificuldade de alimentar seu exército → uma lua próxima resolve o problema.</li>
                <li>Uma grande batalha deixou um <strong>campo de destroços rico</strong> perto de casa: em vez de reciclar tudo, transforme-o numa lua.</li>
                <li>Você está bem estabelecido, tem recursos para gastar e busca consolidar sua economia.</li>
            </ul>

    alliance_basics:
        title: "Criar e entrar em uma aliança"
        category: "alliance"
        order: 1
        tags: "alianca,criacao,entrar,bonus,regime,politica"
        summary: "Junte-se a outros jogadores, ganhe bônus e escolha seu regime político."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="porque">Por que entrar em uma aliança?</h2>
            <ul>
                <li><strong>+20&nbsp;% de produção</strong> imediato em todos os recursos.</li>
                <li>Acesso a <strong>20 pesquisas de aliança</strong> (bônus econômico, militar, defensivo).</li>
                <li>Uma <strong>tesouraria compartilhada</strong> em Bitcoins.</li>
                <li>A <strong>diplomacia</strong> (guerras, paz, pactos) e uma <strong>sala de chat</strong>.</li>
                <li>Poder <strong>invadir</strong> outros planetas (reservado aos membros de aliança em modo PvP).</li>
            </ul>
            <p>Em resumo: jogar solo é viável no início. Mas quando o jogo fica sério, uma aliança multiplica suas chances de progredir.</p>

            <h2 id="entrar">Como entrar</h2>
            <ol>
                <li>Página <strong>Aliança</strong> (menu da esquerda).</li>
                <li>Percorra a lista de alianças abertas, ou procure pelo nome.</li>
                <li>Faça um pedido de adesão. O líder (ou um oficial) valida.</li>
            </ol>
            <p>Você também pode <strong>criar sua própria aliança</strong> pela mesma página, escolhendo um nome, uma tag e um regime político.</p>

            <h2 id="invitations">Receber convites</h2>
            <p>Um líder (ou um oficial com permissão de recrutamento) também pode <strong>convidar-te</strong> diretamente. Podes ter <strong>um convite de cada aliança ao mesmo tempo</strong> — ser solicitado por uma não te esconde das outras —, mas a mesma aliança não te pode convidar duas vezes enquanto não responderes. As alianças que te detetam veem que já estás <strong>solicitado</strong>, sem saber por quem. Assim que <strong>aceitas</strong> um convite, todos os outros são retirados automaticamente; e se uma aliança for <strong>dissolvida</strong>, o seu convite desaparece da tua lista.</p>

            <h2 id="delai">Período de espera depois de sair de uma aliança</h2>
            <p>Depois de <strong>sair</strong> de uma aliança, ser <strong>expulso</strong> (kick) ou após a <strong>dissolução</strong> da tua aliança, aplica-se um <strong>período de espera de 2&nbsp;dias</strong>: não podes <strong>criar</strong> nem <strong>entrar</strong> numa nova aliança enquanto não terminar. Isto evita idas e vindas abusivas entre alianças.</p>

            <h2 id="regimes">Os 3 regimes políticos</h2>
            <p>Ao <strong>criar</strong> uma aliança, você escolhe um <strong>regime político</strong>. Essa escolha determina os bônus acessíveis, as pesquisas possíveis e certas regras internas. É <strong>definitiva</strong>.</p>

            <h3 id="democracia">Balança dos Mundos (Democracia)</h3>
            <p><strong>Vantagens:</strong></p>
            <ul>
                <li>Votação para designar o Presidente.</li>
                <li><strong>+20%</strong> de ataque contra alianças ofensivas.</li>
                <li>Os jogadores podem sair da aliança livremente.</li>
                <li>7 pesquisas econômicas:
                    <ul>
                        <li>+35% produção de recursos</li>
                        <li>+50% velocidade das pesquisas</li>
                        <li>-100% custo de manutenção dos cientistas</li>
                        <li>+100% tamanho dos cargueiros</li>
                        <li>+50% blindagem das naves</li>
                        <li>+25% ganho em vendas a mercadores</li>
                        <li>+5 planetas colonizáveis</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Desvantagens:</strong></p>
            <ul>
                <li>Todos os membros da aliança são conhecidos publicamente.</li>
                <li>A posição do primeiro planeta é exibida.</li>
            </ul>

            <h3 id="comunismo">Baluarte Silencioso (Aliança Ofensiva)</h3>
            <p><strong>Vantagens:</strong></p>
            <ul>
                <li>Um membro de aliança adicional.</li>
                <li><strong>+20%</strong> de ataque contra alianças defensivas.</li>
                <li>7 pesquisas ofensivas:
                    <ul>
                        <li>+100% velocidade de reciclagem</li>
                        <li>+100% defesa dos trabalhadores</li>
                        <li>+50% potência das naves</li>
                        <li>-50% custo de manutenção dos Legionários</li>
                        <li>-1 Bitcoin por nível no recrutamento dos Legionários (8 → 3)</li>
                        <li>+5 planetas via invasões</li>
                        <li>+50% ganho de Pontos de Guerra</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Desvantagens:</strong></p>
            <ul>
                <li>Taxa fixada automaticamente em 50%.</li>
                <li>Todos os membros têm status de líder.</li>
                <li>Impossível sair da aliança.</li>
            </ul>

            <h3 id="fascismo">Martelo das Estrelas (Aliança Defensiva)</h3>
            <p><strong>Vantagens:</strong></p>
            <ul>
                <li>Diminuição da ameaça Cthulhu.</li>
                <li><strong>+20%</strong> de ataque contra alianças Balança dos Mundos.</li>
                <li>Apenas o Líder é exibido publicamente.</li>
                <li>7 pesquisas defensivas:
                    <ul>
                        <li>+100% produção de trabalhadores</li>
                        <li>+50% potência das naves</li>
                        <li>+75% capacidade das barcaças de invasão</li>
                        <li>+50% força dos Legionários</li>
                        <li>-100% custo de manutenção dos Mechas</li>
                        <li>+50 defesa dos Mechas</li>
                        <li>+5 planetas via invasões</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Desvantagens:</strong></p>
            <ul>
                <li>Se o líder sofrer Game Over, a aliança é dissolvida.</li>
                <li>Impossível sair da aliança.</li>
                <li>Impossível excluir a aliança.</li>
                <li>Um membro de aliança a menos.</li>
                <li>O Líder é o único chefe da aliança.</li>
            </ul>
            <h2 id="compte-valide">Conta a validar</h2>
            <p>⚠️ Para <strong>criar ou entrar</strong> em uma aliança, sua conta deve estar <strong>validada</strong> e seu <strong>e-mail confirmado</strong>. Contas de teste/anônimas não podem entrar em uma aliança — confirme seu e-mail em <strong>Minhas opções</strong>.</p>
            <h2 id="discord">Sua aliança no Discord</h2>
            <p>Vincule sua conta do Discord em <strong>Minhas opções</strong> e marque <strong>Mostrar minhas alianças no Discord</strong>: o jogo dá a você, no <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord do Area Universe</a>, o cargo de cada uma das suas alianças, e o remove quando você sai dela ou ela é dissolvida. Ninguém pode pegar o cargo de uma aliança da qual não é membro. Desmarque a caixa a qualquer momento para remover seus cargos.</p>

    alliance_grades:
        title: "Patentes e permissões"
        category: "alliance"
        order: 2
        tags: "patentes,permissoes,funcoes,hierarquia,oficial,lider"
        summary: "Como funciona a hierarquia interna de uma aliança e quem tem direito a fazer o quê."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Uma aliança é organizada por <strong>patentes</strong>, da mais alta (líder) à mais baixa (novo recruta). Cada patente tem um conjunto de <strong>permissões</strong> configuráveis.</p>

            <h2 id="hierarquia">A hierarquia típica</h2>
            <ul>
                <li><strong>Patente 1 — Líder</strong> — fundador da aliança. Todos os direitos. Um só por aliança (exceto em certos regimes).</li>
                <li><strong>Patente 2+ — Oficiais</strong> — podem tomar decisões delegadas (diplomacia, tesouraria, recrutamento…).</li>
                <li><strong>Patentes intermediárias</strong> — veteranos, conselheiros. Configuráveis conforme os costumes.</li>
                <li><strong>Patente mais baixa</strong> — novos recrutas, permissões limitadas.</li>
            </ul>

            <h2 id="permissoes">Permissões configuráveis</h2>
            <p>O líder pode, para cada patente, ativar ou não:</p>
            <ul>
                <li><strong>Convidar</strong> novos membros.</li>
                <li><strong>Excluir</strong> um membro.</li>
                <li><strong>Acessar a tesouraria</strong> (depósito, retirada).</li>
                <li><strong>Declarar guerra</strong> a outra aliança.</li>
                <li><strong>Aceitar paz</strong>, pacto ou aliança defensiva.</li>
                <li><strong>Modificar as patentes</strong> de outros membros.</li>
                <li><strong>Gerenciar as pesquisas de aliança</strong>.</li>
            </ul>

            <h2 id="mudar">Promover ou rebaixar</h2>
            <p>Um oficial com a permissão adequada pode modificar a patente de um membro. É uma maneira de recompensar os ativos e orientar os novos.</p>

            <h2 id="regimes">Casos particulares conforme o regime</h2>
            <p>Certos regimes políticos modificam essas regras:</p>
            <ul>
                <li><strong>Baluarte Silencioso</strong> — todos os membros são líderes (sem hierarquia).</li>
                <li><strong>Martelo das Estrelas</strong> — apenas um líder, inamovível; se o líder cair, a aliança é dissolvida.</li>
                <li><strong>Balança dos Mundos</strong> — o Presidente é eleito por voto.</li>
            </ul>

            <h2 id="afk">Substituição automática de um líder inativo</h2>
            <p>Se o <strong>líder</strong> de uma aliança não se conectar mais durante <strong>mais de 7 dias</strong>, ele é automaticamente substituído para evitar que a aliança fique paralisada:</p>
            <ul>
                <li>O <strong>membro ativo de patente mais alta</strong> assume a chefia da aliança. Em caso de empate de patente, é aquele que tem mais <strong>Pontos de Guerra</strong>.</li>
                <li>As duas patentes são simplesmente <strong>trocadas</strong>: o antigo líder recupera a patente do substituto.</li>
                <li>Se não existir <strong>nenhum membro ativo</strong> que possa assumir, nada muda.</li>
            </ul>

    diplomacy:
        title: "A diplomacia"
        category: "alliance"
        order: 3
        tags: "diplomacia,guerra,paz,pacto,aliado,defcon,tratado"
        summary: "Os 4 tipos de relações entre alianças, como negociá-las e o que significa o DEFCON."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Sua aliança mantém <strong>relações</strong> com outras alianças do servidor. Essas relações mudam as regras do jogo entre seus respectivos membros (quem pode atacar quem).</p>

            <h2 id="tipos">Os 4 tipos de relações</h2>
            <table>
                <tr><th>Tipo</th><th>Efeito</th><th>Uso</th></tr>
                <tr><td><strong>Guerra</strong></td><td>Conflito aberto. Tudo é permitido entre as duas alianças.</td><td>Declarada por um oficial. Inimigos prioritários.</td></tr>
                <tr><td><strong>Paz</strong></td><td>Cessar-fogo. Nenhum ataque possível. Pode incluir uma taxa de paz.</td><td>Pôr fim a uma guerra ou evitar um conflito caro.</td></tr>
                <tr><td><strong>Pacto</strong></td><td>Não-agressão mútua. Sem ataques mas sem ajuda mútua obrigatória.</td><td>Relações neutras estáveis.</td></tr>
                <tr><td><strong>Aliança defensiva</strong></td><td>Apoio militar mútuo. Partilham-se informações, podem defender-se juntos.</td><td>Para aliados próximos.</td></tr>
            </table>

            <h2 id="propor">Como propor um tratado</h2>
            <ol>
                <li>Página <strong>Aliança</strong> → <strong>Diplomacia</strong>.</li>
                <li>Escolha a aliança alvo na lista.</li>
                <li>Proponha um tipo de relação (paz, pacto, aliança).</li>
                <li>O outro lado deve <strong>aceitar</strong>. Aceita, recusa ou contra-propõe.</li>
            </ol>

            <h2 id="defcon">O DEFCON (nível de alerta)</h2>
            <p>Sua aliança tem um <strong>nível de alerta DEFCON</strong>, um número que indica seu estado de tensão. <strong>Quanto menor o número, mais perigosa a situação.</strong> Um DEFCON 1 significa guerra total iminente.</p>
            <p>É um indicador visual para coordenar: um DEFCON baixo = todos os membros a postos.</p>

            <h2 id="logs">O diário diplomático</h2>
            <p>Toda ação diplomática (declaração de guerra, paz aceita, pacto rompido…) é <strong>registrada</strong> no histórico da aliança, com o apelido do autor e o carimbo de data. Útil para transparência interna e debates pós-mortem.</p>

    alliance_treasury:
        title: "Tesouraria de aliança"
        category: "alliance"
        order: 4
        tags: "tesouraria,bitcoin,deposito,retirada,taxa"
        summary: "O pote comum da sua aliança, alimentado pelos membros e pelas taxas de paz."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principio">Para que serve a tesouraria</h2>
            <p>A tesouraria da aliança é uma <strong>conta compartilhada em Bitcoins</strong>. Serve para:</p>
            <ul>
                <li>Pagar as <strong>pesquisas de aliança</strong>.</li>
                <li>Socorrer um membro em dificuldade.</li>
                <li>Financiar um esforço coletivo (preparação para guerra, evento).</li>
            </ul>

            <h2 id="alimentar">Como alimentá-la</h2>
            <ul>
                <li><strong>Depósitos voluntários</strong> — qualquer membro pode depositar Bitcoins.</li>
                <li><strong>Taxa de aliança</strong> — se ativada, uma porcentagem dos ganhos de cada membro é descontada automaticamente no relatório diário.</li>
                <li><strong>Taxas de paz</strong> — se você impôs uma taxa a uma aliança com quem fez paz, ela cai automaticamente na tesouraria.</li>
            </ul>

            <h2 id="retirada">As retiradas</h2>
            <p>As retiradas são reservadas às patentes que têm a <strong>permissão tesouraria</strong> — em geral, os oficiais e o líder. Cada movimento é registrado.</p>

            <h2 id="taxas">A taxa de aliança</h2>
            <p>A taxa de aliança é configurável pelo líder. Desconta uma porcentagem dos ganhos de cada membro, <strong>automaticamente no relatório diário</strong>. Escolha-a razoável: muito alta, os membros saem.</p>

            <h2 id="transparencia">Transparência</h2>
            <p>Os <strong>logs de tesouraria</strong> exibem quem depositou/retirou, quando, quanto. É uma ferramenta de confiança: todos podem verificar.</p>

    political_system:
        title: "Os 3 regimes políticos"
        category: "alliance"
        order: 5
        tags: "politica,regime,bonus,balanca,baluarte,martelo"
        summary: "Os 3 regimes possíveis para uma aliança: vantagens, desvantagens e como escolher."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principio">Escolher na criação</h2>
            <p>Quando uma aliança é criada, o fundador escolhe um <strong>regime político</strong>. Esse regime define <strong>regras internas</strong>, <strong>bônus específicos</strong> e uma <strong>árvore de pesquisas de aliança</strong> dedicada. A escolha é <strong>irreversível</strong>.</p>

            <h2 id="balanca">Balança dos Mundos (democrático)</h2>
            <p>Regime aberto e econômico. Os membros votam para eleger seu Presidente. Foco na <strong>economia</strong>.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra alianças ofensivas.</li>
                <li>Membros visíveis publicamente.</li>
                <li>Os membros podem sair livremente.</li>
                <li>Pesquisas orientadas para economia (produção, cargueiro, pesquisas científicas mais rápidas, venda mercador…).</li>
            </ul>

            <h2 id="baluarte">Baluarte Silencioso (ofensivo)</h2>
            <p>Regime agressivo e coletivo. Todos os membros são líderes. Foco na <strong>ofensiva</strong>.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra alianças defensivas.</li>
                <li>Um membro adicional autorizado.</li>
                <li>Taxa de aliança fixada em 50&nbsp;% automaticamente.</li>
                <li>Impossível sair da aliança.</li>
                <li>Pesquisas orientadas para combate (potência naves, custo Legionários reduzido, velocidade de reciclagem, invasões…).</li>
            </ul>
            <p>As três patentes de topo (<strong>Guia</strong>, <strong>Protetor</strong>, <strong>Camarada</strong>) são <strong>equivalentes</strong>: mesmos direitos, nenhuma hierarquia entre elas. Podem ser livremente atribuídas entre os membros; apenas a patente de recruta (Gulag) é inferior.</p>

            <h2 id="martelo">Martelo das Estrelas (defensivo)</h2>
            <p>Regime discreto e defensivo. Um só líder. Foco na <strong>defesa</strong> e resistência.</p>
            <ul>
                <li>+20&nbsp;% de ataque contra alianças democráticas.</li>
                <li>Ameaça Cthulhu reduzida (muito útil em PvE).</li>
                <li>Apenas o líder é exibido publicamente.</li>
                <li>Impossível sair da aliança. Impossível dissolvê-la.</li>
                <li>Se o líder sofrer Game Over, a aliança é dissolvida.</li>
                <li>Um membro a menos que os outros regimes.</li>
                <li>Pesquisas orientadas para defesa (produção workers, força Legionários, defesa Mechas, capacidade barcaças…).</li>
            </ul>

            <h2 id="combate">Bônus entre regimes</h2>
            <p>Cada regime tem um bônus de +20&nbsp;% de ataque <strong>contra um regime rival</strong>, em pedra-papel-tesoura:</p>
            <ul>
                <li>A Balança vence o Baluarte.</li>
                <li>O Baluarte vence o Martelo.</li>
                <li>O Martelo vence a Balança.</li>
            </ul>

            <h2 id="escolher">Como escolher?</h2>
            <ul>
                <li><strong>Você está começando e visa crescimento</strong> → Balança dos Mundos (econômico, flexível).</li>
                <li><strong>Você quer uma aliança unida e agressiva</strong> → Baluarte Silencioso.</li>
                <li><strong>Você quer se proteger, jogar defensivo</strong> → Martelo das Estrelas (atenção: em caso de game over do líder, tudo desmorona).</li>
            </ul>

    alliance_research:
        title: "Pesquisas de aliança"
        category: "alliance"
        order: 6
        tags: "pesquisa,alianca,politica,melhoria,bonus"
        summary: "Bônus coletivos financiados pela tesouraria de aliança, que beneficiam todos os membros."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principio">Como funciona</h2>
            <p>Sua aliança dispõe de uma <strong>árvore de pesquisas dedicada</strong> que depende do seu <strong>regime político</strong>. Cada pesquisa custa Bitcoins (retirados da tesouraria) e se estende por vários níveis.</p>
            <p>Os bônus <strong>beneficiam todos os membros</strong>. É uma das razões principais para entrar ou permanecer fiel a uma aliança.</p>

            <h2 id="lista">As pesquisas de aliança típicas</h2>
            <table>
                <tr><th>Pesquisa</th><th>O que melhora</th></tr>
                <tr><td><strong>Produção</strong></td><td>Bônus de produção dos recursos.</td></tr>
                <tr><td><strong>Trabalhadores</strong></td><td>Crescimento mais rápido da população.</td></tr>
                <tr><td><strong>Defesa dos trabalhadores</strong></td><td>Os trabalhadores resistem melhor em invasão.</td></tr>
                <tr><td><strong>Velocidade de pesquisa</strong></td><td>As pesquisas individuais terminam mais rápido.</td></tr>
                <tr><td><strong>Armamento</strong></td><td>Danos das naves em combate.</td></tr>
                <tr><td><strong>Blindagem</strong></td><td>Blindagem das naves.</td></tr>
                <tr><td><strong>Custo Legionários / cientistas / Mechas</strong></td><td>Recrutamento mais barato.</td></tr>
                <tr><td><strong>Capacidade das barcaças</strong></td><td>Mais Legionários desembarcados por barcaça.</td></tr>
                <tr><td><strong>Capacidade dos cargueiros</strong></td><td>Mais recursos transportados.</td></tr>
                <tr><td><strong>Capacidade de reciclagem</strong></td><td>Mais detritos trazidos por ciclo.</td></tr>
                <tr><td><strong>Colonização</strong></td><td>Mais planetas colonizáveis.</td></tr>
                <tr><td><strong>Ataque / Defesa Legionários</strong></td><td>Força das tropas no solo.</td></tr>
                <tr><td><strong>Defesa Mechas</strong></td><td>Mechas mais resistentes.</td></tr>
                <tr><td><strong>Preço mercadores</strong></td><td>Melhores vendas a PNJ.</td></tr>
                <tr><td><strong>Invasão</strong></td><td>Bônus em combates no solo.</td></tr>
                <tr><td><strong>Pontos de Guerra</strong></td><td>Mais PDG ganhos em combate.</td></tr>
            </table>

            <h2 id="escolher">Quais pesquisas priorizar?</h2>
            <ul>
                <li><strong>Aliança econômica</strong> (Balança) → Produção, Velocidade pesquisa, Cargueiro.</li>
                <li><strong>Aliança ofensiva</strong> (Baluarte) → Armamento, Invasão, Ataque Legionários.</li>
                <li><strong>Aliança defensiva</strong> (Martelo) → Produção workers, Defesa Mechas, Barcaças.</li>
            </ul>
            <p>Para discutir na sala de aliança antes de lançar: é uma escolha coletiva.</p>

    salon:
        title: "A sala de aliança"
        category: "alliance"
        order: 7
        tags: "sala,chat,discussao,alianca,mensagem"
        summary: "O chat interno da sua aliança: tempo real, histórico e base estratégica."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="funcionamento">Como funciona</h2>
            <p>A <strong>sala de aliança</strong> é um chat em tempo real reservado aos membros da sua aliança. Acessível pela página <strong>Aliança → Sala</strong> (ou um botão dedicado no menu).</p>
            <p>As mensagens são mantidas: você pode voltar no histórico para encontrar uma informação.</p>

            <h2 id="uso">Para que serve</h2>
            <ul>
                <li><strong>Coordenar os ataques</strong> — lançar uma pilhagem em dois vale mais que um sozinho sendo repelido.</li>
                <li><strong>Alertar</strong> em caso de frota inimiga avistada.</li>
                <li><strong>Compartilhar coordenadas</strong> (planetas-alvo, campos de detritos interessantes) — escritas no formato <code>galáxia:setor:posição</code> (ex. <code>1:15:25</code>), tornam-se automaticamente clicáveis, assim como um link para uma página do jogo.</li>
                <li><strong>Discutir estratégia</strong> de aliança (pesquisas, diplomacia, guerras).</li>
                <li><strong>Apresentar-se</strong> aos novos membros e criar vínculos.</li>
            </ul>

            <h2 id="boas-praticas">Boas práticas</h2>
            <ul>
                <li>Seja respeitoso — insultos e assédio podem ser punidos pelo admin.</li>
                <li>Evite fazer spam: deixe espaço para discussões estratégicas.</li>
                <li>Mencione os apelidos dos membros envolvidos quando quiser a atenção deles.</li>
                <li>Arquivamento mental: quando um conselho é dado, guarde-o em mente — as mensagens passam rápido.</li>
            </ul>

            <h2 id="mensagens-privadas">E as mensagens privadas?</h2>
            <p>Além da sala, você pode enviar uma <strong>mensagem privada</strong> a qualquer jogador do servidor (fora da aliança incluso). Útil para diplomacia silenciosa ou para responder discretamente a uma proposta. Coordenadas e links do jogo também se tornam clicáveis lá, exatamente como na sala.</p>

    alliance_improvements:
        title: "Melhorias de aliança"
        category: "alliance"
        order: 8
        tags: "melhorias,alianca,bonus,bitcoin,investimento,coletivo,niveis"
        summary: "Investe Bitcoin para desbloquear 16 bónus coletivos que fortalecem toda a tua aliança — velocidade de pesquisa, produção, poder de combate e mais."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="visao-geral">Visão geral</h2>
            <p>O separador <strong>Melhorias</strong> na página da aliança permite aos membros investir Bitcoin para desbloquear e melhorar <strong>16 bónus coletivos</strong>. Estes bónus beneficiam <strong>todos os membros ativos</strong> da aliança. Um jogador que sai da aliança deixa de beneficiar, mas a aliança conserva os seus níveis obtidos.</p>

            <h2 id="quota">Quota de investimento</h2>
            <p>Cada membro dispõe de uma quota de <strong>20 investimentos por janela deslizante de 3 horas</strong>. Os investimentos não utilizados são perdidos — a quota não se acumula. Cada investimento custa <strong>1.000 Bitcoin</strong> deduzidos do saldo pessoal (um sumidouro de dinheiro permanente).</p>
            <p>Na interface, botões rápidos <strong>×1 / ×5 / ×10</strong> sob cada bónus permitem investir vários pontos instantaneamente num clique.</p>

            <h2 id="niveis">Níveis e limiares</h2>
            <p>Cada bónus tem <strong>5 níveis</strong>. Os limiares de investimento necessários para passar ao nível seguinte são:</p>
            <table>
                <tr><th>Nível</th><th>Investimentos necessários</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1.000</td></tr>
            </table>
            <p>⚠️ Os investimentos além do limiar de um nível são <strong>perdidos</strong> — não há transporte para o nível seguinte.</p>

            <h2 id="bonus">Os 16 bónus e os seus efeitos</h2>
            <table>
                <tr><th>Bónus</th><th>Efeito por nível</th><th>Máximo (nível 5)</th></tr>
                <tr><td><strong>Velocidade de pesquisa</strong></td><td>+2 % por nível</td><td>+10 %</td></tr>
                <tr><td><strong>Custo de pesquisa</strong></td><td>−1 % por nível</td><td>−5 %</td></tr>
                <tr><td><strong>Impulso de construção</strong></td><td>+15 s de redução por ajudante</td><td>75 s de redução por ajudante</td></tr>
                <tr><td><strong>Custo de construção</strong></td><td>−1 % por nível</td><td>−5 %</td></tr>
                <tr><td><strong>Produção de nióbio</strong></td><td>+2 % por nível</td><td>+10 %</td></tr>
                <tr><td><strong>Produção de água</strong></td><td>+2 % por nível</td><td>+10 %</td></tr>
                <tr><td><strong>Produção de rações</strong></td><td>+2 % por nível</td><td>+10 %</td></tr>
                <tr><td><strong>Velocidade de frota</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Potência de mísseis</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Potência laser</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Potência de plasma</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Precisão</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Blindagem de frota</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Escudo</strong></td><td>+1 % por nível</td><td>+5 %</td></tr>
                <tr><td><strong>Defesa planetária</strong></td><td>+2 % por nível</td><td>+10 %</td></tr>
                <tr><td><strong>Experiência do herói</strong></td><td>+2 %/nível</td><td>+10 %</td></tr>
            </table>
            <p>O <strong>Impulso de construção</strong> alimenta diretamente a funcionalidade de <a href="/wiki/alliance_construction_help">ajuda de construção</a>: quanto mais alto for o seu nível, mais cada ajuda de um aliado reduz o tempo de construção.</p>

    alliance_construction_help:
        title: "Ajuda de construção"
        category: "alliance"
        order: 9
        tags: "ajuda,construcao,alianca,boost,edificio,aceleracao"
        summary: "Um clique para acelerar todas as construções em curso dos teus aliados de uma vez — e eles fazem o mesmo por ti."
        related: "alliance_improvements"
        body: |
            <h2 id="visao-geral">Visão geral</h2>
            <p>A <strong>ajuda de construção</strong> permite aos membros de uma aliança acelerar mutuamente as suas obras em andamento com um único clique. Quando um ou mais aliados têm uma construção ativa no seu planeta, um <strong>ícone de ajuda</strong> (coração) aparece na barra de interface global. O badge indica o número de construções elegíveis.</p>
            <p>Clicar no ícone acelera automaticamente <strong>todas as construções elegíveis</strong> da aliança de uma só vez, sem necessidade de as selecionar individualmente.</p>

            <h2 id="ganho">Ganho por ajuda</h2>
            <p>Cada ação de ajuda reduz o tempo de construção restante em:</p>
            <blockquote><strong>15 segundos × nível do bónus «Impulso de construção»</strong></blockquote>
            <p>O ganho é <strong>limitado a 75 segundos</strong> por ajuda e por membro (nível 5 × 15 s = 75 s). Uma construção nunca pode descer abaixo de <strong>30 segundos restantes</strong> através de ajuda.</p>
            <table>
                <tr><th>Nível do bónus</th><th>Ganho por ajuda</th></tr>
                <tr><td>0 (não desbloqueado)</td><td>15 s</td></tr>
                <tr><td>1</td><td>15 s</td></tr>
                <tr><td>2</td><td>30 s</td></tr>
                <tr><td>3</td><td>45 s</td></tr>
                <tr><td>4</td><td>60 s</td></tr>
                <tr><td>5</td><td>75 s</td></tr>
            </table>

            <h2 id="elegibilidade">Elegibilidade de uma construção</h2>
            <p>Para que uma construção seja elegível, devem ser cumpridas duas condições:</p>
            <ul>
                <li><strong>Duração total &gt; 30 segundos</strong> (desde o início até à conclusão prevista).</li>
                <li><strong>Tempo restante &gt; 30 segundos</strong> no momento da ajuda.</li>
            </ul>
            <p>As construções quase concluídas (menos de 30 s restantes) não beneficiam da ajuda.</p>

            <h2 id="deduplicacao">Deduplicação</h2>
            <p>Um mesmo membro só pode ajudar <strong>cada construção uma vez</strong>. O ícone desaparece automaticamente quando já não existem construções que ainda não ajudaste. Vários membros podem ajudar a mesma construção — os ganhos acumulam-se: 3 membros no nível 3 contribuem com 45 s cada um, 135 s no total.</p>

            <h2 id="ligacao">Ligação com as melhorias de aliança</h2>
            <p>O ganho por ajuda depende diretamente do nível do bónus <strong>«Impulso de construção»</strong> no separador <a href="/wiki/alliance_improvements">Melhorias</a>. Investir nesse bónus beneficia todos: quanto mais depressa os aliados terminam os seus edifícios, mais depressa o império da aliança cresce.</p>

    leveling:
        title: "Níveis e experiência"
        category: "progression"
        order: 1
        tags: "nivel,experiencia,progressao,level,pontuacao"
        summary: "Sua progressão do nível 1 ao 40, baseada no tamanho do seu império."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calculo">O que conta para sua pontuação</h2>
            <p>Sua pontuação (ou "pontos de comandante") reflete o <strong>tamanho global do seu império</strong>:</p>
            <ul>
                <li>Número de <strong>trabalhadores</strong>.</li>
                <li>Número e qualidade das <strong>naves</strong>.</li>
                <li>Número de <strong>tropas</strong> (Legionários, Mechas).</li>
                <li>Nível dos <strong>edifícios</strong> construídos.</li>
            </ul>
            <p>As naves contam forte, os edifícios contam muito. Perder uma frota em combate faz baixar sua pontuação.</p>

            <h2 id="limites">Os patamares de nível</h2>
            <table>
                <tr><th>Nível</th><th>Experiência necessária</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100&nbsp;000</td></tr>
                <tr><td>10</td><td>800&nbsp;000</td></tr>
                <tr><td>15</td><td>5&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>18&nbsp;000&nbsp;000</td></tr>
                <tr><td>25</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>30</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>35</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>A progressão é <strong>exponencial</strong>: subir do nível 1 ao 10 é bem mais rápido que do 30 ao 40.</p>

            <h2 id="utilidade">Para que serve seu nível</h2>
            <ul>
                <li><strong>Ranking</strong> do servidor — um indicador público do seu poder.</li>
                <li><strong>Bônus de conexão</strong> — o valor diário ganho depende do seu nível.</li>
                <li><strong>Reconhecimento</strong> — um nível alto impressiona amigos e inimigos.</li>
            </ul>

    war_points:
        title: "Pontos de Guerra (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,pontos,guerra,combate,ranking"
        summary: "A segunda moeda do jogo, ganha em combate. Serve de medida da sua agressividade."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="o-que-e">Os PDG, o que são?</h2>
            <p>Os <strong>Pontos de Guerra</strong> (<strong>PDG</strong>) são uma segunda "moeda" de progressão, <strong>orientada para combate</strong>. Onde seu nível reflete seu tamanho, seus PDG refletem sua atividade militar.</p>

            <h2 id="ganhar">Como ganhá-los</h2>
            <ul>
                <li><strong>Combates espaciais</strong> — os PDG dependem do poder inimigo que você destrói, nunca das suas próprias perdas. Aniquilar uma horda Cthulhu ou uma frota alien rende bem menos do que uma frota de jogador da mesma potência (salvaguarda anti-farming).</li>
                <li><strong>Perder um combate espacial</strong> — uma consolação é paga mesmo assim, proporcional à assinatura da frota que perdeu, mas sempre bem abaixo do que um vencedor ganha com uma frota idêntica: um quinto desse ganho, nunca mais.</li>
                <li><strong>Defesa orbital</strong> — quando as suas torres aniquilam uma frota em órbita, no mesmo rácio de uma vitória espacial (bem menos contra um Cthulhu). Arrasar as defesas de um planeta alheio, em contrapartida, ainda não rende nada ao atacante.</li>
                <li><strong>Pilhagens e invasões</strong> — cada vitória no solo rende PDG.</li>
                <li><strong>Missões diárias</strong> — algumas dão PDG. As <strong>3 do dia completadas = +250 PDG bônus</strong>.</li>
                <li><strong>Arena (duelos de heróis)</strong> — 50 a 200 PDG por vitória.</li>
                <li><strong>Defesa contra os Cthulhu</strong> — vitória em Tower Defense ou em invasão Cthulhu.</li>
                <li><strong>Prisão</strong> — executar um herói capturado (com moderação).</li>
            </ul>

            <h2 id="utilidade">Para que servem</h2>
            <ul>
                <li><strong>Desbloquear certas pesquisas</strong> que pedem PDG como pré-requisito.</li>
                <li><strong>Ranking PDG</strong> (militar) — medida da sua agressividade no servidor.</li>
                <li><strong>Torturar um prisioneiro</strong> na prisão (custa PDG para revelar a posição de um planeta inimigo).</li>
                <li><strong>Pontuação ponderada</strong> em certos modos de servidor (como Paid Server).</li>
            </ul>

            <h2 id="estrategia">Estratégia</h2>
            <p>Os PDG recompensam os jogadores <strong>agressivos</strong>. Se você quer subir no ranking militar, concentre-se em combates espaciais e invasões em vez do puro crescimento econômico.</p>

    quests:
        title: "Missões diárias"
        category: "progression"
        order: 3
        tags: "missoes,diario,missao,recompensa,pdg"
        summary: "3 pequenas missões todo dia. Simples, rápidas, e um bônus de 250 PDG se você fizer todas."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Todo dia, às <strong>18h59 UTC</strong>, o jogo te atribui <strong>3 missões diárias</strong>. São pequenas tarefas que você pode realizar durante sua sessão de jogo normal.</p>

            <h2 id="tipos">Exemplos de missões</h2>
            <ul>
                <li>Espionar um planeta.</li>
                <li>Vender recursos a um mercador.</li>
                <li>Colonizar um novo planeta.</li>
                <li>Construir ou subir de nível uma Cidade / Metrópole.</li>
                <li>Enviar uma mensagem privada a outro jogador.</li>
                <li>Postar uma mensagem na sala de aliança.</li>
                <li>Ganhar um certo número de PDG em combate.</li>
                <li>Reciclar um campo de detritos.</li>
            </ul>

            <h2 id="recompensa">As recompensas</h2>
            <ul>
                <li>Cada missão concluída dá <strong>PDG</strong>: a recompensa é o maior entre o valor base da missão e 5% da média de pontos dos jogadores do servidor — assim continua valioso mesmo quando seu império se torna enorme.</li>
                <li>Se você completar <strong>as 3 missões</strong> antes do próximo relatório diário, recebe <strong>+250 PDG bônus</strong> no dia seguinte.</li>
            </ul>
            <p>Em 30 dias, são 7&nbsp;500 PDG "grátis" a mais, apenas jogando regularmente.</p>

            <h2 id="consultar">Onde vê-las</h2>
            <p>Suas missões do dia são exibidas na página <strong>Império</strong> (ou quadro dedicado conforme a versão). Marcadas automaticamente conforme as ações.</p>

    ranking:
        title: "Os rankings"
        category: "progression"
        order: 4
        tags: "ranking,rank,posicao,top,leaderboard"
        summary: "Vários rankings para medir sua progressão (e a dos seus rivais)."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="tipos">Os rankings disponíveis</h2>
            <table>
                <tr><th>Ranking</th><th>Baseado em</th><th>Recompensa</th></tr>
                <tr><td><strong>Pontos (Império)</strong></td><td>Tamanho global do seu império (trabalhadores, naves, tropas, edifícios, defesas).</td><td>Prestígio.</td></tr>
                <tr><td><strong>Pontos de Guerra</strong></td><td>Atividade militar (combates, pilhagens, invasões).</td><td>Prestígio militar.</td></tr>
                <tr><td><strong>Aliança</strong></td><td>Soma dos pontos de todos os membros de uma aliança.</td><td>Coroa a aliança mais poderosa.</td></tr>
                <tr><td><strong>Arena (heróis)</strong></td><td>Proporção vitórias/derrotas em duelos (mínimo 5 combates).</td><td>Recompensas semanais para o top 3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Melhores pontuações TD do servidor.</td><td>Prestígio.</td></tr>
            </table>

            <h2 id="consultar">Onde vê-los</h2>
            <p>Página <strong>Ranking</strong> no menu da esquerda. Você pode filtrar por tipo, procurar um jogador ou uma aliança, e ver sua própria posição.</p>

            <h2 id="utilidade">Por que isso conta</h2>
            <ul>
                <li><strong>Estratégico</strong> — identifique os grandes jogadores a evitar ou mirar.</li>
                <li><strong>Social</strong> — vitrine para recrutar na sua aliança.</li>
                <li><strong>Competição</strong> — em certos modos de servidor (Paid Server, Dominação), o ranking final determina o vencedor.</li>
            </ul>

    heroes:
        title: "Seu herói"
        category: "progression"
        order: 5
        tags: "heroi,bonus,planeta,frota,xp,captura,prisao,especialidade"
        summary: "Seu herói pessoal: ele evolui, combate, impulsiona seu império e pode ser capturado."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Cada jogador possui <strong>um único herói principal</strong>, criado no início da partida. Este herói deve <strong>sempre</strong> estar atribuído a um planeta ou a uma frota — nunca livre. Você pode ainda possuir um número ilimitado de <strong>heróis secundários</strong> — veja o artigo dedicado.</p>
            <p>Enquanto você não tiver herói principal — no início da partida, ou após a execução dele na prisão —, o jogo leva você de volta à criação dele: as páginas de jogo ficam fechadas até lá, as da sua conta continuam acessíveis. Se um dos seus heróis secundários ocupar o planeta escolhido para o novo herói, ele volta para a <strong>reserva</strong>.</p>
            <p>O herói traz bônus de combate, inteligência e velocidade de acordo com sua especialidade e nível.</p>
            <p>As 4 competências do herói são: <strong>Ataque</strong>, <strong>Defesa</strong>, <strong>Inteligência</strong> e <strong>Velocidade</strong>.</p>
            <p><strong>Inteligência</strong> confere bônus de produção de recursos nos planetas e vantagem estratégica em duelos na arena.</p>
            <p><strong>Velocidade</strong> reduz o tempo de voo das frotas, e alimenta o Ímpeto nos duelos de arena.</p>

            <h2 id="especialidades">Especialidades</h2>
            <p>Cada especialidade concede um bônus passivo e desbloqueia 3 traços nos níveis 5, 10 e 15:</p>
            <ul>
                <li><strong>Militar</strong>: +5&nbsp;% de ataque e defesa, tanto na frota quanto em solo (contra Cthulhu e em PvP), e +5&nbsp;% de poder nos duelos de arena. Traços: <strong>Intimidação</strong> (nív. 5, o adversário sofre −5&nbsp;% de poder ofensivo, inclusive contra o Cthulhu, e −5&nbsp;% de pontuação em duelo), <strong>Tático</strong> (nív. 10, +10&nbsp;% de poder na primeira rodada dos seus combates e +10&nbsp;% em duelo), <strong>Senhor da guerra</strong> (nív. 15, −5&nbsp;% de perdas das suas tropas terrestres em combate entre jogadores e +5&nbsp;% de poder em duelo).</li>
                <li><strong>Economia</strong>: dobra os bônus de Inteligência (produção) e do campo de escravos. Traços: <strong>Eficiente</strong> (nív. 5, −10&nbsp;% no custo de construção), <strong>Negociante</strong> (nív. 10, +15&nbsp;% nas vendas ao mercador), <strong>Magnata</strong> (nív. 15, +20&nbsp;% de produção).</li>
                <li><strong>Explorador</strong>: +5&nbsp;% de precisão de frota. Traços: <strong>Batedor</strong> (nív. 5, +1 força de radar no planeta ao qual está atribuído), <strong>Navegador</strong> (nív. 10, +15&nbsp;% de velocidade de frota), <strong>Cartógrafo</strong> (nív. 15, +2 força de radar no planeta ao qual está atribuído).</li>
            </ul>

            <p>No <strong>duelo de arena</strong> valem as mesmas regras: o militar mantém os seus +5&nbsp;% e os seus três traços, a Inteligência dobrada do economista (mais 20&nbsp;% com Magnata) alimenta a Astúcia, e a Velocidade dobrada do explorador (mais 15&nbsp;% com Navegador) alimenta o Ímpeto. Astúcia e Ímpeto contam por 60&nbsp;% do seu valor.</p>
            <p>Um resumo detalhado desses bônus agora é exibido automaticamente ao criar seu herói.</p>

            <h2 id="xp">Ganho de experiência</h2>
            <p>A XP é ganha de várias formas:</p>
            <ul>
                <li><strong>Combate</strong>: XP fixa + proporcional à potência inimiga destruída, dividido pelo nível do herói (escala natural).</li>
                <li><strong>Duelo na arena</strong>: XP base (30) multiplicada de acordo com o equilíbrio do combate — um duelo apertado rende até 3× mais XP que uma vitória esmagadora.</li>
                <li><strong>Passivo</strong>: +5 XP/hora quando o herói está atribuído a um planeta (calculado com a produção de recursos).</li>
            </ul>
            <p>Fórmula level up: XP necessária = nível × 500. A cada level, o jogador ganha pontos de habilidade para alocar.</p>

            <h2 id="atribuicao">Atribuição</h2>
            <p>Atribua seu herói pela página <strong>Planetas</strong> ou pela página de gestão de uma <strong>frota</strong>. A atribuição é feita em AJAX sem recarregar a página.</p>
            <p>Um herói em uma frota em voo ou em combate não pode ser reatribuído. Se a frota for destruída, o herói é automaticamente reatribuído ao seu planeta capital.</p>

            <h2 id="captura">Captura</h2>
            <p>Um herói pode ser capturado durante um combate:</p>
            <ul>
                <li><strong>Combate espacial</strong> (frota destruída): 20% de chance</li>
                <li><strong>Invasão de planeta</strong> (planeta invadido): 35% de chance</li>
            </ul>
            <p>Uma captura exige um <strong>edifício Prisão de nível 1 ou superior</strong>: o herói fica preso no local do combate se esse planeta for seu e tiver uma Prisão; caso contrário, no seu planeta com a Prisão mais alta. Sem nenhuma Prisão, não há captura.</p>
            <p>Após libertação, o herói tem <strong>24h de imunidade</strong> contra recaptura.</p>
            <p>Os Cthulhu e bots não podem capturar heróis.</p>
            <p>Esta seção descreve o seu herói <strong>principal</strong>. Os seus <strong>heróis secundários</strong> seguem uma regra de captura totalmente diferente, sem nenhuma probabilidade — veja o artigo <em>Heróis secundários</em>.</p>

    secondary_heroes:
        title: "Heróis secundários"
        category: "progression"
        order: 6
        tags: "heroi,secundario,cocheira,captura,execucao,prisao,reciclagem,reserva,saque"
        summary: "Heróis adicionais obtidos como saque raro: os mesmos bônus do seu herói principal, mas podem ser capturados ou executados definitivamente em combate."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Um herói secundário traz <strong>os mesmos bônus</strong> de um herói principal assim que estacionado num planeta ou numa frota. O que o diferencia: ele pode ser <strong>capturado ou morto definitivamente</strong> em caso de derrota. Você pode acumular vários, além do seu herói principal.</p>

            <h2 id="obtencao">Como conseguir um</h2>
            <p>Um herói secundário é um <strong>saque raro</strong>, nunca comprável:</p>
            <table>
                <tr><th>Fonte</th><th>Chance</th></tr>
                <tr><td>Vitória no Tower Defense Cthulhu (por partida)</td><td>2&nbsp;%</td></tr>
                <tr><td>Ataque Cthulhu repelido em um dos seus planetas</td><td>1&nbsp;%</td></tr>
                <tr><td>Vencedor de um torneio de arena</td><td>25&nbsp;%</td></tr>
            </table>
            <p>Ao ser obtido, seu nome e especialidade são sorteados aleatoriamente, e ele chega diretamente à <strong>reserva</strong> — cabe a você decidir onde posicioná-lo, ou reciclá-lo sem nunca posicioná-lo.</p>

            <p>Cada herói obtido é-lhe anunciado por um <strong>relatório</strong> que indica de onde vem. O ecrã final de Tower Defense e o relatório de vitória contra os Cthulhu também o assinalam no momento.</p>

            <h2 id="posicionamento">Onde posicioná-los</h2>
            <p>Como o seu herói principal: <strong>um planeta</strong> ou <strong>uma frota</strong>, nunca os dois ao mesmo tempo. Um secundário não posicionado permanece na <strong>reserva</strong>: sem bônus, mas também <strong>sem risco</strong> — é uma escolha normal, não um esquecimento a corrigir. Gerencie todos os seus secundários pela aba <strong>Cocheira</strong> da página Herói.</p>

            <h2 id="gestao">Competências e equipamento</h2>
            <p>Um herói secundário progride como o principal: sobe de nível e, com isso, ganha <strong>pontos de competência</strong>. O botão <strong>Gerir</strong> da Cocheira abre a sua distribuição entre Ataque, Defesa, Inteligência e Velocidade.</p>
            <p>O mesmo painel gere o seu <strong>equipamento</strong>: equipe-o com um item livre do seu inventário, ou retome-o. Os itens de um herói inimigo capturado vêm com ele — é aqui que os recupera.</p>

            <h2 id="risco">O que você arrisca</h2>
            <p>Um herói secundário posicionado pode ser perdido <strong>definitivamente</strong> durante:</p>
            <ul>
                <li>Um <strong>combate espacial</strong> perdido (sua frota é destruída).</li>
                <li>Um <strong>combate utilitário</strong> perdido (uma frota totalmente desarmada, aniquilada sem sequer combater).</li>
                <li>Uma <strong>invasão</strong> bem-sucedida do planeta onde está estacionado.</li>
                <li>A destruição da sua frota pelas <strong>defesas orbitais</strong> de um planeta em modo de ataque.</li>
            </ul>
            <p>Por outro lado, ele não arrisca <strong>nada</strong> durante:</p>
            <ul>
                <li>Uma <strong>pilhagem</strong> — mesmo bem-sucedida, uma pilhagem nunca toma o planeta.</li>
                <li>Um combate contra os <strong>Cthulhu</strong> (ou qualquer adversário que não seja jogador).</li>
                <li>A <strong>arena</strong> — duelos e torneios nunca expõem um herói à captura.</li>
            </ul>

            <p>Uma <strong>notificação</strong> avisa-o assim que um dos seus secundários é capturado ou executado: uma perda definitiva não depende de abrir o seu relatório.</p>

            <h2 id="prisao">A condição da prisão</h2>
            <p>Diferente do seu herói principal (captura <em>probabilística</em>, veja o artigo <em>Prisão e heróis capturados</em>), o destino de um secundário derrotado é <strong>totalmente determinístico</strong>, sem qualquer sorteio:</p>
            <ul>
                <li>O vencedor possui um <strong>edifício Prisão</strong> de nível 1 ou superior em pelo menos um dos seus planetas → ele <strong>captura</strong> o herói, com seu nível, experiência e itens intactos.</li>
                <li>O vencedor não tem <strong>nenhuma</strong> Prisão construída → o herói é <strong>executado</strong>.</li>
            </ul>
            <p>Em um combate de blocos (vários aliados lutando lado a lado), o herói vai para o comandante vencedor que <strong>mais poder empenhou</strong> no combate — se ele não tiver Prisão, o herói é executado mesmo que um aliado do mesmo lado tivesse uma.</p>
            <p>Um secundário capturado <strong>não</strong> é um prisioneiro clássico: não há página de prisão, nem minijogo de fuga, nem resgate. Ele chega diretamente, ativo, à Cocheira do seu novo proprietário, pronto para ser posicionado novamente ou reciclado.</p>

            <h2 id="sem-recuperacao">Nenhuma recuperação possível</h2>
            <p>Uma vez capturado ou executado, um herói secundário está perdido <strong>definitivamente</strong>: nem fuga, nem resgate, nem libertação por invasão do antigo proprietário podem recuperá-lo. A única forma de revê-lo é reconquistá-lo você mesmo em combate — assim ele pode circular indefinidamente entre impérios.</p>

            <h2 id="identidade">Um herói capturado mantém sua identidade</h2>
            <p>Um secundário capturado mantém seu <strong>nome</strong>, seu <strong>nível</strong> e sua <strong>experiência</strong>. Na sua Cocheira, ele exibe o seu comandante de origem («Capturado de…»).</p>

            <h2 id="reciclagem">A reciclagem</h2>
            <p>Você pode <strong>executar você mesmo</strong> um dos seus heróis secundários para transferir sua experiência ao seu herói principal, <strong>menos 10&nbsp;%</strong>. Uma prévia numérica (XP transferida, nível projetado do principal) é exibida antes da confirmação. <strong>Ação irreversível.</strong></p>

    items:
        title: "Itens do herói"
        category: "progression"
        order: 6
        tags: "itens,equipamento,bonus,raridade,drop,cthulhu,fusao"
        summary: "Equipe seu herói com até 3 itens para acumular bônus. Como obtê-los."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Os itens são objetos equipáveis no seu herói (máximo de <strong>3 itens</strong>). Trazem bônus variados que se somam aos bônus naturais do herói.</p>

            <h2 id="categorias">Categorias</h2>
            <ul>
                <li><strong>Ofensivo</strong>: Armas, objetos orientados para ataque</li>
                <li><strong>Defensivo</strong>: Armaduras, escudos, proteção</li>
                <li><strong>Poder</strong>: Objetos de status, bônus mistos</li>
            </ul>
            <p>Nenhuma restrição de tipo: você pode equipar 3 ofensivos se quiser.</p>

            <h2 id="raridades">Raridades</h2>
            <ul>
                <li><strong>Comum</strong>: 1 bônus (+2-5%)</li>
                <li><strong>Raro</strong>: 1-2 bônus (+5-10%)</li>
                <li><strong>Épico</strong>: 2-3 bônus (+10-15%)</li>
                <li><strong>Lendário</strong>: 3+ bônus (+15-25%)</li>
            </ul>

            <h2 id="bonus">Tipos de bônus</h2>
            <p>16 tipos de bônus possíveis: força Legionários, força Mechas, ataque frota, defesa frota, precisão, escudo, velocidade frota, produção recursos, velocidade construção, produção workers, produção naves, radar, reciclagem, bônus anti-Cthulhu, bônus duelo, bônus XP.</p>

            <h2 id="obtencao">Obtenção</h2>
            <p>Existem agora quatro maneiras de obter itens:</p>

            <h3>Combater os Cthulhu</h3>
            <p>Os itens podem dropar ao derrotar Cthulhu, seja repelindo o desembarque deles em solo, seja aniquilando totalmente a horda em órbita antes que ela pouse. A taxa de drop é a mesma nos dois casos e depende da dificuldade PvE:</p>
            <ul>
                <li><strong>Fácil</strong>: 30% comum, 8% raro, 1% épico</li>
                <li><strong>Normal</strong>: 40% comum, 15% raro, 5% épico, 0.5% lendário</li>
                <li><strong>Difícil</strong>: 50% comum, 25% raro, 10% épico, 2% lendário</li>
            </ul>
            <p>Uma horda apenas parcialmente destruída em órbita ainda assim pousa: é esse desembarque que então dispara o sorteio, nunca os dois para a mesma onda.</p>

            <h3>Vitórias na arena</h3>
            <p>Cada vitória em duelo de arena oferece chance de drop de item:</p>
            <ul>
                <li><strong>Comum</strong>: 15%</li>
                <li><strong>Raro</strong>: 5%</li>
                <li><strong>Épico</strong>: 1%</li>
            </ul>

            <h3>Apostas em duelo</h3>
            <p>Ao lançar um desafio, você pode apostar um item. Se o adversário aceitar, ele deve apostar um item da mesma raridade. O vencedor leva os dois itens.</p>

            <h3>Fundir três itens</h3>
            <p>Três itens da <strong>mesma raridade</strong> se fundem em um item da raridade superior, sem custo nem espera. A categoria e os bônus do novo item são sorteados aleatoriamente, como em um drop. Os três itens originais são consumidos definitivamente, e um item equipado por um herói precisa ser desequipado antes. Lendário é a raridade máxima: não pode ser fundido.</p>
            <p>A fusão é iniciada na página <strong>Comandantes</strong>, aba <strong>Fusão</strong>: clique em três cards de itens para selecioná-los (todo o card é clicável) e confirme com o botão de fusão, disponível tanto acima quanto abaixo da lista.</p>

            <h2 id="roubo">Roubo de itens</h2>
            <p>Se seu herói for capturado, os itens equipados correm risco de serem roubados pelo vencedor. Probabilidade de roubo: Comum 80%, Raro 60%, Épico 40%, Lendário 25%.</p>

            <h2 id="inventario">Inventário</h2>
            <p>Acesse seu inventário pela página <strong>Comandantes</strong>, aba <strong>Inventário</strong>. Pelo inventário, você pode:</p>
            <ul>
                <li><strong>Equipar</strong> um item no seu herói (se ativo e menos de 3 itens equipados)</li>
                <li><strong>Desequipar</strong> um item para devolvê-lo ao inventário</li>
                <li><strong>Destruir</strong> um item que você não precisa mais</li>
                <li><strong>Fundir</strong> 3 itens da mesma raridade em um item da raridade superior, pela aba <strong>Fusão</strong> ao lado</li>
            </ul>
            <p>Cada item é exibido como uma <strong>carta ilustrada</strong> mostrando sua imagem, seus bônus e uma borda colorida conforme a raridade. As cartas são organizadas em uma grade (3 a 4 por linha conforme o espaço disponível na sua tela).</p>

    prison:
        title: "Prisão e heróis capturados"
        category: "progression"
        order: 7
        tags: "prisao,captura,heroi,fuga,tortura,resgate,cela,secundario"
        summary: "Quando um herói é capturado, o que acontece? As opções do prisioneiro e do carcereiro, e a captura direta de heróis secundários inimigos."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="captura">Captura de um herói</h2>
            <p>Um herói é capturado durante um combate espacial (20%) ou uma invasão (35%). O jogador capturado fica trancado: qualquer página fora do escopo permitido o redireciona para a <strong>página prisão</strong>. Ainda assim, ele mantém acesso ao <strong>salão de aliança</strong>, às suas <strong>mensagens privadas</strong>, aos seus <strong>relatórios</strong>, à <strong>consulta</strong> (somente leitura) de sua aliança, e à <strong>gestão de sua conta</strong>. Tudo o mais — construção, frotas, mapa, mercado, arena, e até a página de herói — permanece inacessível até que seja libertado.</p>
            <p>Uma captura exige um <strong>edifício Prisão de nível 1 ou superior</strong>: o herói fica preso no local do combate se esse planeta for seu e tiver uma Prisão; caso contrário, no seu planeta com a Prisão mais alta. Sem nenhuma Prisão, não há captura.</p>

            <h2 id="prisioneiro">Ações do prisioneiro</h2>
            <p>A cada <strong>4 horas</strong>, o prisioneiro pode realizar uma ação:</p>
            <ul>
                <li><strong>Alertar a aliança</strong> (70% de sucesso): envia as coordenadas da prisão à sala de aliança. Falha = o carcereiro é alertado. Sem aliança, a ação não está disponível. Após uma falha, a próxima ação espera 6 horas em vez de 4.</li>
                <li><strong>Fugir</strong>: uma tentativa a cada 4 horas a partir da captura (a primeira, 4 horas depois). 40% de sucesso, +5% a cada período de 4 horas de cativeiro. Falha = o carcereiro é alertado. Este prazo é independente das outras duas ações.</li>
                <li><strong>Fugir graças ao Slash</strong>: a qualquer momento e sem limite. Veja o artigo <em>Fugir da prisão</em>.</li>
                <li><strong>Pagar o resgate</strong>: se o carcereiro pediu um, você pode pagá-lo ou recusá-lo na página da prisão.</li>
                <li><strong>Rebelar-se</strong> (25% + bônus militar): sabota 5% dos recursos da prisão. Falha = perda de um nível. Em ambos os casos, o carcereiro recebe um relatório.</li>
            </ul>

            <h2 id="carcereiro">Ações do carcereiro</h2>
            <p>Acessível pelo edifício Prisão ou Campo de Escravos:</p>
            <ul>
                <li><strong>Executar</strong>: destrói o herói definitivamente (+PG proporcionais ao nível). Itens recuperados. O dono do herói é informado por um relatório.</li>
                <li><strong>Libertar</strong>: gesto diplomático, o herói volta ao seu dono.</li>
                <li><strong>Torturar</strong> (custo: 200 PG): revela a posição de um planeta inimigo.</li>
                <li><strong>Resgate</strong>: exigir recursos em troca da libertação (24h para aceitar).</li>
            </ul>

            <h2 id="libertacao">Libertação</h2>
            <ul>
                <li><strong>Aliança do prisioneiro invade</strong>: libertação automática</li>
                <li><strong>Outra aliança invade</strong>: 60% de chance de fuga; senão, o prisioneiro passa ao invasor se este possuir uma Prisão, ou é libertado</li>
                <li><strong>Cthulhu invade</strong>: todos os prisioneiros são libertados</li>
            </ul>

            <h2 id="secundarios">Capturar um herói secundário inimigo</h2>
            <p>Tudo o que foi dito acima — fuga, tortura, resgate, libertação — diz respeito ao <strong>herói principal</strong> de um adversário. Um <strong>herói secundário</strong> (veja o artigo <em>Heróis secundários</em>) segue uma regra bem mais direta, e é aí que o seu edifício Prisão ganha uma <strong>utilidade decisiva</strong>: assim que você possui uma Prisão de nível 1 ou superior em um dos seus planetas, qualquer herói secundário inimigo derrotado contra você (combate espacial, combate utilitário ou invasão bem-sucedida) torna-se <strong>imediata e definitivamente</strong> seu — com seu nível, experiência e itens intactos. Sem Prisão, ele é <strong>executado</strong> em vez de capturado.</p>
            <p>Um secundário capturado <strong>não</strong> é um prisioneiro no sentido desta página: não há página de prisão, nem fuga, nem resgate. Ele chega diretamente, ativo, à sua <strong>Cocheira</strong> — pronto para ser posicionado em um planeta ou frota, ou reciclado.</p>

            <h2 id="prerequisitos">Pré-requisitos</h2>
            <p>Pesquisa <strong>Prisão</strong> (requer Arame Farpado nível 5), depois edifícios <strong>Prisão</strong> e <strong>Campo de Escravos</strong>.</p>

    prison_escape:
        title: "Fugir da prisão"
        category: "progression"
        order: 8
        tags: "prisao,fuga,slash,resgate,heroi,captura"
        summary: "As três formas de sair da prisão por conta própria: a fuga instantânea, o Slash e o resgate."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Três saídas</h2>
            <p>Quando o seu herói é capturado, a página da prisão oferece três formas de sair sem esperar pelos aliados. O minijogo de fuga foi removido.</p>

            <h2 id="instant">Fuga instantânea</h2>
            <ul>
                <li>Uma tentativa a cada <strong>4 horas</strong>. A primeira abre 4 horas depois da captura.</li>
                <li><strong>40%</strong> de sucesso na primeira tentativa e depois <strong>+5%</strong> a cada período de 4 horas de cativeiro, tenha você tentado ou não.</li>
                <li>A chance da próxima tentativa aparece no botão.</li>
                <li>Falha: o seu herói continua preso e <strong>o carcereiro é alertado</strong>.</li>
            </ul>

            <h2 id="slash">Fugir graças ao Slash</h2>
            <p><strong>Slash</strong> é o nosso outro jogo (slash-game.com). Jogue com o <strong>mesmo endereço de e-mail</strong> da sua conta Area Universe, confirmado dos dois lados.</p>
            <ul>
                <li>Atinja <strong>75% da melhor pontuação da semana</strong> numa partida jogada <strong>depois da sua captura</strong>.</li>
                <li>Enquanto a semana em curso (desde segunda-feira às 00:00 UTC) tiver menos de 10 jogadores classificados ou a sua melhor pontuação estiver abaixo de 50 pontos, a referência é a melhor pontuação da semana anterior.</li>
                <li>Volte à página da prisão e clique em <strong>Verificar a minha pontuação</strong>: o seu herói é libertado.</li>
                <li>Tentativas <strong>ilimitadas</strong>, sem espera.</li>
                <li>Uma conta de convidado ou um endereço não confirmado não pode usar esta saída.</li>
            </ul>

            <h2 id="ransom">Pagar o resgate</h2>
            <p>Se o carcereiro pedir um resgate, ele aparece na página da prisão com o valor e o prazo (24 horas). Você pode <strong>pagar</strong> ou <strong>recusar</strong>. Os recursos são retirados do conjunto dos seus planetas e entregues ao carcereiro. Se não tiver recursos suficientes, o pagamento é recusado e nada é retirado.</p>

            <h2 id="after">Depois da libertação</h2>
            <p>O seu herói volta a um dos seus planetas com os itens que lhe restam e recebe <strong>24 horas de imunidade</strong> contra uma nova captura.</p>

    arena:
        title: "Arena PvP"
        category: "progression"
        order: 8
        tags: "arena,duelo,torneio,pvp,heroi,desafio,ranking"
        summary: "Desafie outros heróis em duelo 1 contra 1. Aposte urânio ou itens, ganhe prestígio."
        related: "heroes,items,war_points"
        body: |
            <h2 id="desafios">Sistema de desafios</h2>
            <p>Pela página <strong>Arena</strong>, lance um desafio a outro jogador. O desafiado recebe uma notificação e pode <strong>aceitar</strong> ou <strong>recusar</strong> o desafio.</p>
            <ul>
                <li>Um desafio expira automaticamente após <strong>7 dias</strong> sem resposta. O número de desafios recebidos pendentes aparece na aba Arena e na entrada «Herói» do menu. O tempo restante até a expiração aparece ao lado de cada desafio recebido. Depois de expirado, você pode desafiar novamente o mesmo jogador.</li>
                <li>Você pode <strong>cancelar</strong> um desafio que enviou enquanto ele estiver pendente.</li>
                <li>Cooldown: <strong>1h</strong> entre dois duelos com o mesmo jogador. Ele é verificado ao enviar o desafio <strong>e</strong> ao aceitá-lo, para os dois heróis: acumular desafios pendentes não permite encadear vários duelos.</li>
                <li>Um herói capturado não pode desafiar nem ser desafiado. A captura e a pertença à mesma aliança são verificadas novamente na aceitação.</li>
                <li>O herói nunca está em perigo (sem captura em arena).</li>
            </ul>

            <h2 id="combate">Resolução do combate</h2>
            <p>Quando o desafiado aceita, o combate é resolvido <strong>imediatamente</strong> e o resultado aparece na tela do jogador que aceitou: vitória ou derrota, as duas pontuações, as recompensas e a aposta ganha ou perdida. Os dois jogadores também recebem um relatório. A pontuação é baseada em:</p>
            <ul>
                <li><strong>Nível</strong> do herói: a base da pontuação</li>
                <li><strong>Ofensiva</strong>: ataque do herói, +5&nbsp;% se for militar, e os bônus ofensivos dos seus itens</li>
                <li><strong>Defesa</strong>: defesa do herói e os bônus defensivos dos seus itens</li>
                <li><strong>Astúcia</strong> (peso 60&nbsp;%): Inteligência — dobrada para um economista, +20&nbsp;% com o traço Magnata — e os bônus utilitários dos itens (produção, construção, reciclagem, radar)</li>
                <li><strong>Ímpeto</strong> (peso 60&nbsp;%): Velocidade — dobrada para um explorador, +15&nbsp;% com o traço Navegador — e a velocidade de frota dos itens</li>
                <li><strong>Traços militares</strong>: Tático +10&nbsp;%, Senhor da guerra +5&nbsp;%, e Intimidação retira 5&nbsp;% de poder do adversário</li>
                <li><strong>Especialidade</strong>: vantagem pedra-papel-tesoura (Militar &gt; Explorador &gt; Economia &gt; Militar, +10&nbsp;%)</li>
                <li><strong>Fator aleatório</strong> de ±15&nbsp;% de cada lado</li>
            </ul>

            <h2 id="apostas">Apostas</h2>
            <p>Ao lançar um desafio, você pode adicionar uma aposta opcional:</p>
            <ul>
                <li><strong>Urânio</strong>: cada jogador aposta a mesma quantia. O vencedor leva as duas apostas.</li>
                <li><strong>Item</strong>: cada jogador aposta um item da mesma raridade. O vencedor leva os dois itens. O item deve estar <strong>desequipado</strong> (dos dois lados) e não pode ser usado em dois desafios pendentes ao mesmo tempo.</li>
                <li><strong>Amistoso</strong>: sem aposta, apenas as recompensas base são atribuídas.</li>
            </ul>
            <p>A aposta está coberta se pelo menos um dos seus planetas possuir o urânio necessário: ele é retirado do seu planeta mais rico em urânio. Se um jogador não tiver mais urânio suficiente em nenhum planeta no momento da aceitação, o desafio falha. Se o item apostado pelo desafiante não estiver mais disponível quando o desafiado aceitar (não lhe pertence mais ou está equipado), o duelo é recusado.</p>

            <h2 id="recompensas">Recompensas base</h2>
            <p>O vencedor recebe a cada duelo:</p>
            <ul>
                <li>Urânio: proporcional ao nível médio dos combatentes, com limite de <strong>20</strong> por duelo</li>
                <li>Pontos de guerra: proporcionais ao nível do vencedor (cerca de 225 no nível 15), reduzidos quando a diferença de nível é grande</li>
                <li>Chance de item: 15% comum, 5% raro, 1% épico</li>
            </ul>
            <p>O perdedor não perde nada (exceto sua aposta eventual).</p>

            <h2 id="ranking">Ranking</h2>
            <p>Um ranking por servidor exibe os melhores duelistas:</p>
            <ul>
                <li>Baseado na proporção vitórias/derrotas</li>
                <li>Mínimo <strong>5 combates</strong> para aparecer</li>
                <li>Os <strong>5 primeiros</strong> são visíveis diretamente na página; um botão permite abrir o ranking completo com paginação e ordenação</li>
                <li>As recompensas semanais são pagas automaticamente toda <strong>segunda-feira</strong> pela semana anterior (de segunda a domingo), uma única vez: top 3 pelo <strong>número de vitórias em duelos</strong> da semana, com mínimo de <strong>5 duelos</strong> na semana. Apenas jogadores entram na classificação (nem comandantes IA nem contas excluídas). 1º = 3000 urânio + 300 PG, 2º = 2000 + 200 PG, 3º = 1000 + 100 PG. Cada jogador recompensado recebe um relatório.</li>
            </ul>

            <h2 id="torneios">Torneios</h2>
            <p>Evento de servidor periódico: um torneio a cada <strong>7 dias</strong> por servidor.</p>
            <ul>
                <li>A inscrição fica aberta por <strong>24h</strong> na página Arena. Um herói capturado não pode se inscrever e é excluído se for capturado antes do início.</li>
                <li>Depois, eliminação direta automática com sorteio aleatório (um jogador excedente avança direto na primeira rodada) e uma disputa de terceiro lugar entre os dois perdedores das semifinais.</li>
                <li>São necessários pelo menos <strong>2 participantes</strong>: caso contrário, o torneio é cancelado (sem recompensas) e os inscritos são avisados por relatório. Com um único jogador inscrito, o torneio acontece se um comandante IA puder completar a chave.</li>
                <li>Assim que pelo menos um jogador estiver inscrito, os <strong>comandantes IA</strong> do servidor (herói principal não capturado) completam a chave até <strong>8 participantes</strong> no total. Eles se inscrevem progressivamente durante as 24h de inscrição, e a chave é completada no encerramento se ainda faltarem.</li>
                <li>Se <strong>8 jogadores ou mais</strong> estiverem inscritos, nenhum comandante IA participa. Sem nenhum jogador inscrito, o torneio não acontece: comandantes IA nunca jogam entre si.</li>
                <li>Cada combate do torneio também concede ao vencedor as recompensas habituais de um duelo.</li>
                <li>Os comandantes IA disputam o pódio e recebem as mesmas recompensas que os jogadores, exceto a chance de obter um herói secundário.</li>
                <li>O campeão mantém 25 % de chance de obter um herói secundário (reservada aos jogadores).</li>
            </ul>
            <p>Recompensas:</p>
            <ul>
                <li>1º = 5000 urânio + 500 PG + 1 item épico (20 % de chance de um item lendário adicional)</li>
                <li>2º = 3000 urânio + 300 PG + 1 item raro (10 % de chance de um item épico adicional)</li>
                <li>3º = 1500 urânio + 150 PG + 1 item raro</li>
                <li>Demais participantes = 500 urânio + 50 PG (10 % de chance de um item comum)</li>
            </ul>
            <p>Cada participante recebe um relatório com sua colocação e suas recompensas. A página Arena mostra a contagem regressiva do fim da inscrição, o pódio do último torneio e a data do próximo.</p>

    login_bonus:
        title: "Bônus de conexão"
        category: "progression"
        order: 9
        tags: "bonus,conexao,diario,bitcoin,sequencia,streak"
        summary: "Bitcoins grátis todo dia, multiplicados se você encadear vários dias consecutivos."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Na sua <strong>primeira conexão</strong> de cada dia calendário, o jogo te oferece um bônus de Bitcoins. É grátis, não pede nenhuma ação além de você se conectar.</p>
            <p>O valor é o maior entre os dois cálculos abaixo, multiplicado pela sua sequência:</p>
            <ul>
                <li>Um <strong>piso baseado no seu nível</strong>, com um aleatório diário (×1 a ×5) — garante um bônus motivador desde o início da partida.</li>
                <li><strong>5% da média de Bitcoins do servidor</strong> — assim o bônus continua relevante à medida que a economia cresce.</li>
                <li>O resultado é então multiplicado pelo seu <strong>multiplicador de sequência</strong> (veja abaixo).</li>
            </ul>
            <p>A média do servidor ignora contas extremas (os 5% mais ricos e os 5% mais pobres) e não conta bots nem contas de teste.</p>
            <p>Exemplo: um jogador nível 10 no dia 1 recebe no mínimo entre 50&nbsp;000 e 250&nbsp;000 Bitcoins — mais ainda se 5% da média do servidor superar esse piso.</p>

            <h2 id="streak">A sequência de 7 dias consecutivos</h2>
            <p>Conectar-se <strong>todo dia</strong> faz seu multiplicador subir:</p>
            <table>
                <tr><th>Dia consecutivo</th><th>Multiplicador</th></tr>
                <tr><td>Dia 1</td><td>×1.0</td></tr>
                <tr><td>Dia 2</td><td>×1.2</td></tr>
                <tr><td>Dia 3</td><td>×1.5</td></tr>
                <tr><td>Dia 4</td><td>×1.8</td></tr>
                <tr><td>Dia 5</td><td>×2.0</td></tr>
                <tr><td>Dia 6</td><td>×2.5</td></tr>
                <tr><td>Dia 7</td><td>×5.0</td></tr>
            </table>
            <p>No 8º dia, o ciclo recomeça no dia 1. Se você <strong>perder um dia</strong> (mais de 24h sem conexão), a sequência é zerada.</p>

            <h2 id="itens">Os itens bônus</h2>
            <p>Alguns dias da sequência oferecem também um <strong>item para seu herói</strong>, aleatório:</p>
            <ul>
                <li><strong>Dia 3</strong>: um item comum.</li>
                <li><strong>Dia 7</strong>: um item raro.</li>
            </ul>

            <h2 id="reclamacao">Como reclamar</h2>
            <p>Uma janela abre automaticamente na sua conexão. Um clique para recuperar tudo. Sua <strong>melhor sequência</strong> é arquivada como recorde pessoal.</p>

            <h2 id="dica">Uma pequena dica</h2>
            <p>Mesmo 30 segundos de conexão bastam para validar a sequência. Não perca o dia 7, é quando mais rende.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminacao,falencia,fim"
        summary: "As 2 formas de perder a partida, e o que te resta depois."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">Os 2 tipos de Game Over</h2>
            <p>Há duas maneiras de ser eliminado de um servidor. Conhecê-las já é se proteger delas.</p>

            <h2 id="falencia">1. A falência econômica</h2>
            <p>Se, após o <strong>relatório diário de 18h59 UTC</strong>, seu saldo de Bitcoins for <strong>negativo</strong>: <strong>Game Over econômico</strong>.</p>
            <ul>
                <li>Todas as suas <strong>frotas em voo</strong> são destruídas.</li>
                <li>Seu saldo é <strong>redefinido para 125&nbsp;000 Bitcoins</strong>.</li>
                <li>Suas <strong>pesquisas</strong> são zeradas.</li>
                <li>Sua <strong>terraformação</strong> é dividida por 2.</li>
                <li>Seu <strong>ranking</strong> é redefinido.</li>
            </ul>
            <p>O comandante continua vivo (pode continuar a jogar), mas parte fortemente enfraquecido.</p>
            <p><strong>Você é avisado antes:</strong> assim que seu saldo cai abaixo do déficit diário projetado (custo de manutenção menos receita), um relatório de alerta «Falência iminente» avisa você — no máximo um por dia. Se recebê-lo, aja antes do próximo relatório diário.</p>

            <h2 id="planetas">2. A perda de todos os seus planetas</h2>
            <p>Se você perder seu <strong>último planeta</strong> (invasão, abandono voluntário, Battle Royale onde seu setor desaparece), a partida está <strong>realmente</strong> acabada:</p>
            <ul>
                <li>Todas as suas <strong>frotas</strong> são transferidas aos aliens.</li>
                <li>Seu <strong>comandante é eliminado</strong> do servidor.</li>
                <li>Suas estatísticas são <strong>arquivadas</strong> na sua conta.</li>
            </ul>

            <h2 id="evitar">Como evitar o Game Over</h2>
            <ul>
                <li>Acompanhe todo dia seu <strong>balanço</strong> (receitas − custos). Se ficar vermelho, reaja.</li>
                <li>Não recrute em excesso: um exército em manutenção permanente pode arruinar um economista desatento.</li>
                <li>Mantenha sempre <strong>pelo menos 2 planetas</strong> em condições de defender.</li>
                <li>Observe as <strong>frotas inimigas se aproximando</strong> (notificações, radar).</li>
                <li>Em caso de grande perigo, <strong>evacue</strong> suas tropas e recursos para um planeta seguro.</li>
            </ul>

            <h2 id="depois">O que resta depois?</h2>
            <p>Mesmo eliminado, você mantém sua <strong>conta de jogador</strong>. Suas <strong>estatísticas</strong> das partidas anteriores são preservadas, e você pode entrar em um novo servidor.</p>

    game_modes:
        title: "Os modos de servidor"
        category: "events"
        order: 1
        tags: "modo,battle royale,dominacao,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe oferece 7 modos de servidor diferentes, com regras e objetivos próprios."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Visão geral</h2>
            <p>Cada servidor de Area Universe é de um <strong>modo</strong> específico, escolhido pelo admin na criação. O modo define a duração, a condição de vitória e se os Cthulhu estão presentes.</p>
            <table>
                <tr><th>Modo</th><th>Duração</th><th>Condição de vitória</th><th>Cthulhu?</th><th>Alianças?</th><th>Pesquisas</th></tr>
                <tr><td>Cthulhu</td><td>300 dias</td><td>Nenhuma (placar de sobrevivência)</td><td>Sim</td><td>Sim</td><td>Normais</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 dias</td><td>O VIP que sobreviver 72h</td><td>Não</td><td>Sim (exceto para o VIP)</td><td>Máx. desde o início</td></tr>
                <tr><td>Dominação</td><td>60 dias</td><td>Top-pontuador ao final</td><td>Não</td><td>Sim</td><td>Máx. desde o início</td></tr>
                <tr><td>Battle Royale</td><td>40 dias</td><td>Último sobrevivente</td><td>Não</td><td>Não</td><td>Máx. desde o início</td></tr>
                <tr><td>Paid Server</td><td>60 dias</td><td>Melhor pontuação ponderada (combate muito valorizado)</td><td>Não</td><td>Sim</td><td>Normais</td></tr>
                <tr><td>Long Run</td><td>900 dias</td><td>Nenhuma (maratona)</td><td>Sim</td><td>Sim</td><td>Normais</td></tr>
                <tr><td>Short Run</td><td>150 dias</td><td>Nenhuma (sprint)</td><td>Sim</td><td>Sim</td><td>Normais</td></tr>
            </table>

            <h2 id="cthulhu">Modo Cthulhu (PvE clássico)</h2>
            <p>O modo base, perfeito para descobrir o jogo. Nas <strong>72 primeiras horas</strong>, nenhum ataque Cthulhu: é uma <strong>fase de preparação</strong>. Depois, as hordas Cthulhu atacam periodicamente seus planetas.</p>
            <p>Sem condição de vitória: no final (300 dias), um placar recompensa quem melhor sobreviveu.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (caça ao VIP)</h2>
            <p>Um <strong>VIP</strong> é designado aleatoriamente no final do cessar-fogo de 48h. Seu objetivo: <strong>sobreviver 72 horas</strong>. Se conseguir, vence. Se for morto por um jogador, <strong>o assassino vira o novo VIP</strong>. Se for uma causa não-humana que o eliminar (Cthulhu, evento), outro jogador é sorteado.</p>
            <p>O VIP fica <strong>sozinho contra todos</strong>: é automaticamente retirado de sua aliança no momento da sua nomeação, e não pode mais entrar em nenhuma enquanto carregar o status.</p>

            <h2 id="dominacao">Dominação (planetas estratégicos)</h2>
            <p>5 planetas estratégicos são sorteados. Todo dia, seu proprietário marca <strong>+5 pontos</strong>. Novo sorteio a cada 5 dias (aviso prévio de 24h na sala).</p>
            <p>Ao final do servidor (60 dias), o jogador com a melhor pontuação vence. Para as alianças, a pontuação é a soma das pontuações dos membros.</p>

            <h2 id="battle-royale">Battle Royale (último sobrevivente)</h2>
            <p>Modo solo: <strong>sem alianças autorizadas</strong>. Inscrições fechadas após 7 dias. Uma única galáxia.</p>
            <p>O mapa é uma grade espacial de 100 sistemas que <strong>encolhe em anéis concêntricos</strong>: a cada rodada, <strong>todo o anel exterior desaparece de uma vez</strong> (não sistema por sistema). Os sistemas destruídos permanecem na tela como <strong>buracos</strong>: o mapa nunca se reorganiza, então a zona segura é legível num relance.</p>
            <p><strong>5 rodadas, uma por semana:</strong></p>
            <ul>
                <li>J+7: 36 sistemas · J+14: 28 · J+21: 20 · J+28: 12 · J+35: os 3 últimos (<strong>apenas um sobrevive</strong>). Os 5 últimos dias são jogados no centro.</li>
                <li><strong>12 h antes</strong> da destruição, um anel fica <strong>laranja</strong> (aviso).</li>
                <li><strong>1 h antes</strong>, fica <strong>vermelho piscando</strong> e nenhuma frota pode entrar ou sair.</li>
                <li>Um sistema destruído elimina definitivamente seus planetas e frotas.</li>
                <li>Uma frota em trânsito para um sistema desaparecido é destruída. Se seu herói estiver lá, é a derrota.</li>
            </ul>
            <p><strong>Vitória</strong>: ser o último comandante ativo.</p>

            <h2 id="paid-server">Paid Server (competitivo pago)</h2>
            <p>Servidor pago (<strong>5&nbsp;€</strong>), 100&nbsp;% PvP, nenhum Cthulhu. Duração 60 dias.</p>
            <p><strong>Vitória</strong>: ao final, o jogador com a melhor <strong>pontuação ponderada</strong> vence. Essa pontuação combina tamanho do império e atividade militar, sendo o combate muito valorizado — é um modo para jogadores competitivos.</p>
            <p>O vencedor recebe uma <strong>distinção permanente</strong> no seu perfil, conservada de um servidor para outro.</p>

            <h2 id="long-short-run">Long Run / Short Run (com eventos)</h2>
            <p>Dois modos PvE com <strong>eventos recorrentes</strong> programados: ataques Cthulhu, raids de piratas, bônus de produção, reciclagem aprimorada, arenas de aliança, guerras totais, confrontos inter-servidores…</p>
            <p>O <strong>Long Run</strong> (900 dias) é uma maratona tranquila; o <strong>Short Run</strong> (150 dias) é um sprint mais intenso. O calendário dos eventos é <strong>determinístico</strong>: você pode antecipá-los.</p>

            <h2 id="pesquisas-max">Modos com pesquisas máximas desde o início</h2>
            <p>Em <strong>Search &amp; Destroy, Dominação e Battle Royale</strong>, todas as suas pesquisas começam no nível máximo — o menu Pesquisa fica oculto, para jogar diretamente na parte militar.</p>
            <p>Seu planeta de partida recebe então um <strong>kit de início</strong>:</p>
            <ul>
                <li><strong>500 urânio</strong> para personalizar rapidamente.</li>
                <li><strong>Todos os seus pontos de naves desbloqueados</strong> desde o dia 1 (1&nbsp;375 pontos de uma vez em vez de 40/dia).</li>
            </ul>
            <p>Em <strong>Search &amp; Destroy</strong>, um kit militar maior é concedido para permitir que o VIP resista às 72h: 2&nbsp;000 Legionários, 25 barcaças, 500 destroyers, 250 torres laser pesadas.</p>

            <h2 id="fim-de-servidor">Fim de servidor e arquivamento</h2>
            <p>Quando um servidor fecha, suas <strong>estatísticas finais</strong> (pontos, herói, sucessos de VIP, vitórias, etc.) são arquivadas na sua <strong>conta de jogador</strong>. Seu comandante (o personagem dessa partida) é excluído, mas seu histórico permanece.</p>

    cthulhus:
        title: "A ameaça Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,colmeia,horda,guarnicao,cerco,ameaca,pve,uranio,tower defense,td"
        summary: "Os Cthulhu agora concentram hordas reais que viajam à vista antes de atacar seus planetas. Como se defender, como as bases deles também se defendem, e o Tower Defense para repelir o assalto."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principio">O que são os Cthulhu?</h2>
            <p>Os <strong>Cthulhu</strong> (os Possuídos) são as criaturas hostis controladas pelo jogo (PvE). Eles mantêm <strong>bases da colmeia</strong> espalhadas pela galáxia, de onde partem <strong>hordas</strong>: frotas reais, com composição, potência e trajeto visíveis — não uma simples contagem regressiva.</p>
            <p>Quanto mais você os repelir, mais a <strong>ameaça global</strong> sobe, e mais fortes ficam os ataques seguintes.</p>

            <h2 id="ameaca">O nível de ameaça</h2>
            <p>A cada vitória contra uma invasão Cthulhu, o nível de ameaça sobre seu império aumenta. Os ganhos são maiores em dificuldade alta e conforme seu regime de aliança:</p>
            <table>
                <tr><th>Dificuldade</th><th>Sem aliança</th><th>Aliança Martelo das Estrelas</th><th>Outra aliança</th></tr>
                <tr><td>Fácil</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Difícil</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p>O <strong>Martelo das Estrelas</strong> reduz a progressão da ameaça (o regime defensivo é mais tranquilo diante dos Cthulhu).</p>
            <p>A ameaça também <strong>volta a subir sozinha</strong>: +5 a cada relatório diário do Império, e +1 por hora enquanto uma horda permanece em órbita de um dos seus planetas antes de desembarcar (limitada a 300, e apenas após o seu primeiro contato com os Cthulhu). Vencer um Tower Defense <strong>divide-a por 2</strong>: um jogador assíduo mantém-na baixa; deixá-la crescer convida hordas cada vez maiores.</p>

            <h2 id="potencia">Potência das invasões</h2>
            <p>A potência de uma invasão Cthulhu depende:</p>
            <ul>
                <li>do <strong>nível de ameaça</strong> acumulado;</li>
                <li>da <strong>dificuldade</strong> escolhida;</li>
                <li>da <strong>terraformação</strong> do planeta visado.</li>
            </ul>
            <p>Em <strong>Fácil</strong>, a potência de ataque é dividida por 2. Em <strong>Difícil</strong>, é impulsionada.</p>

            <h2 id="horda">O ataque: uma horda bem real</h2>
            <p>Um ataque sempre começa com uma <strong>concentração</strong>: a horda se aglomera em órbita de uma base da colmeia por <strong>6 horas</strong> (12 horas para uma horda Boss) antes de partir.</p>
            <p>Uma vez a caminho, ela voa em <strong>velocidade de horda</strong> — lenta, bem visível no <strong>radar</strong> — e um <strong>alerta é garantido 1 hora antes da chegada</strong>, seja qual for a sua cobertura de radar.</p>
            <p>É uma <strong>frota real</strong>: você pode destruí-la em qualquer momento — em formação sobre sua base, em pleno voo, já em órbita do seu planeta, ou vencendo o <strong>Tower Defense</strong> (jogável a partir do momento em que está planejada ou já ativa). Destruí-la cancela o ataque, seja qual for o momento.</p>
            <p>Na chegada, um <strong>combate orbital</strong> ocorre (suas frotas e torres contra a horda). Os sobreviventes desembarcam <strong>2 horas depois</strong> para o assalto terrestre. Várias hordas podem estar em formação ou em voo ao mesmo tempo, com composição aleatória.</p>
            <p>Única exceção: a <strong>infiltração</strong> (desbloqueada a partir do nível 200) continua <strong>instantânea e invisível</strong> — sem concentração, sem aviso prévio.</p>

            <h3>Se suas defesas vencerem</h3>
            <table>
                <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                <tr><td>Perdas de Legionários</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                <tr><td>Perdas de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                <tr><td>Perdas de trabalhadores</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
            </table>
            <p>Você ganha <strong>PDG</strong> e uma chance de <strong>drop de item</strong>.</p>

            <h3>Se a horda vencer em terra</h3>
            <p>A pilhagem e a captura são agora <strong>proporcionais ao que resta da horda</strong> depois do combate orbital: uma horda destruída pela metade pilha metade. Abaixo de <strong>90&nbsp;% de sobrevivência</strong>, ela não tem mais tropas suficientes para capturar o planeta, mesmo na dificuldade Difícil.</p>
            <table>
                <tr><th></th><th>Fácil</th><th>Normal</th><th>Difícil</th></tr>
                <tr><td>Pilhagem de recursos (horda intacta)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planeta capturado (se ≥ 90&nbsp;% de sobrevivência)</td></tr>
                <tr><td>Redução de ameaça após derrota</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>Em <strong>Difícil</strong>, sem sobreviventes suficientes para capturar, a pilhagem volta à taxa <strong>Normal</strong> (70&nbsp;%), multiplicada pela taxa de sobrevivência da horda. Se o planeta for capturado e era o último, é o Game Over.</p>

            <h2 id="bases">As bases da colmeia</h2>
            <p>A colmeia mantém <strong>bases</strong> espalhadas pela galáxia: as bases originais da colmeia (até 36 por galáxia, de potência crescente — seus nomes vão de «Cthulhu I» para os postos avançados até o temível «Cthulhu V») e antigos planetas de jogadores convertidos por uma expansão ou uma erupção. Cada uma é protegida por uma <strong>guarnição permanente</strong> que se reconstitui em <strong>24 horas</strong> se for reduzida.</p>
            <p>Concentrar uma frota de jogador em órbita de uma base (assinatura acumulada de pelo menos <strong>10.000</strong>) desencadeia um <strong>cerco</strong>: a base sitiada deixa de enviar hordas (elas passam a partir de uma base mais distante), <strong>ondas de defesa</strong> aumentam em potência (+25&nbsp;% a cada 2 horas), e depois de <strong>6 horas</strong> as outras bases enviam <strong>frotas de socorro</strong> como reforço. Uma base sitiada exibe o selo <strong>«Base sitiada»</strong> no mapa galáctico. Uma vez levantado o cerco, as frotas de socorro regressam a casa e a base recupera uma guarnição normal.</p>
            <p>Quando o cerco é levantado, cada participante é pago <strong>proporcionalmente à assinatura destruída</strong>: 0,02 bitcoin por ponto, mais pontos de guerra.</p>

            <h2 id="liberacao">Libertar uma base</h2>
            <p>Invadir com sucesso uma base da colmeia — incluindo agora as bases alienígenas «Cthulhu I» a «V» — concede as recompensas habituais (urânio, chance de drop de item) <strong>e</strong> faz a <strong>Ameaça do universo</strong> recuar <strong>50 pontos</strong>, atrasando a próxima profecia de Cthulhu (ver o artigo <em>As profecias de Cthulhu</em>). Um planeta libertado assim fica <strong>protegido por 72 horas</strong>: a colmeia não pode recolonizá-lo nem entrar em erupção nele durante esse prazo. Se o planeta libertado era originalmente um planeta de jogador — capturado pela colmeia, convertido após uma invasão perdida, abandonado, ou nascido de uma expansão ou uma erupção —, continua colonizável, e seu relatório de libertação informa o prazo final para enviar um colonizador até lá. Os postos avançados originais da colmeia («Cthulhu I» a «V»), por sua vez, ficam inutilizáveis após libertados: o planeta continua livre, mas você não pode enviar um colonizador até lá, e nenhum prazo final é anunciado.</p>
            <p>Por outro lado, perder uma invasão contra uma base alienígena agora também aumenta sua <strong>ameaça pessoal em 10 pontos</strong>, assim como contra uma base Cthulhu clássica.</p>

            <h2 id="expansao">Expansão e erupção</h2>
            <p>A colmeia se expande por conta própria: quando a <strong>Ameaça do universo</strong> atinge <strong>300 pontos</strong>, um <strong>enxame de esporos</strong> parte de uma base existente a cada <strong>3 dias</strong> (todo <strong>dia</strong> se a ameaça superar <strong>500</strong>) em direção a um planeta desabitado próximo de jogadores — até <strong>36 bases por galáxia</strong>. É uma frota como qualquer outra: <strong>interceptável em voo</strong>. Se chegar, ela funda uma nova base com sua guarnição, e os jogadores a <strong>5 setores ou menos</strong> recebem um relatório.</p>
            <p>Erradicar <strong>todas</strong> as bases não elimina a colmeia para sempre: depois de <strong>48 horas de silêncio</strong>, uma <strong>erupção</strong> faz uma base resurgir em outro lugar, com um relatório para os jogadores próximos. Essa erupção nunca pode cair a <strong>menos de 8 setores</strong> de um planeta de jogador, nem sobre um planeta ainda sob sua trégua de libertação: a colmeia renasce no vazio, não nas suas terras. Se nenhum setor suficientemente isolado estiver disponível, a erupção é simplesmente adiada para a próxima janela.</p>

            <h2 id="mudanca-dificuldade">Mudar de dificuldade</h2>
            <p>Você pode modificar a dificuldade PvE nas suas <strong>opções</strong>. Atenção: um <strong>cooldown de 72 h</strong> se aplica entre duas mudanças — sem vai-e-vem para escapar dos grandes ataques.</p>

            <h2 id="tower-defense">O Tower Defense (TD)</h2>
            <p>O <strong>Tower Defense</strong> é um minigame de defesa ativa. Ele pode ser jogado a partir do momento em que uma horda está <strong>planejada</strong> (em formação na sua base) ou já <strong>ativa</strong> (em voo ou em órbita): você pode lançá-lo para aniquilá-la antes que ela cause danos. É interativo: você coloca suas defesas numa grade e enfrenta ondas de monstros Cthulhu em tempo real.</p>
            <p>Dica: para colocar várias defesas seguidas (unidades, muros, arame farpado), <strong>segure e arraste</strong> — o traço trava automaticamente em <strong>linha reta</strong> (horizontal ou vertical) e todas as células atravessadas são preenchidas, sem buracos mesmo em movimentos rápidos.</p>
            <p>A dificuldade do TD é o seu nível de <strong>PvE</strong> (definido nas suas preferências). O <strong>tutorial</strong> é um treino: não rende nada e não custa nada. Depois que a primeira onda é lançada, sair da partida conta como <strong>abandono</strong> (derrota).</p>
            <p>Uma <strong>névoa</strong> desliza sobre a arena, mais densa ao redor das fendas e enquanto um chefe se aproxima. Ela fica abaixo das suas defesas e dos monstros: não esconde nada. O botão <strong>Névoa</strong> do dock a desativa se o seu aparelho estiver pesado.</p>

            <h3>Resultado possível</h3>
            <ul>
                <li><strong>Vitória</strong> — a horda ativa é destruída, o ataque é cancelado. Você ganha urânio, a ameaça baixa (÷2). Cooldown de 6h antes de refazer um TD.</li>
                <li><strong>Derrota</strong> — recompensas parciais; se a horda já tivesse desembarcado, o combate terrestre ocorre imediatamente.</li>
                <li><strong>TD não jogado</strong> — a horda segue seu curso normal: concentração, voo, chegada, desembarque.</li>
            </ul>

            <h3>Relatório de fim de jogo</h3>
            <p>Ao final de cada Tower Defense (vitória ou derrota), um <strong>relatório</strong> é arquivado na aba <strong>Cthulhu</strong> dos seus relatórios: ondas sobrevividas, pontuação, urânio coletado, redução de ameaça, perdas por tipo de unidade e inimigos mortos por tipo. Útil para comparar suas partidas.</p>

            <h3>Como se joga</h3>
            <ul>
                <li>Escolha uma dificuldade: Fácil, Normal ou Difícil.</li>
                <li>Coloque suas unidades na grade. O <strong>QG fica no centro</strong>; os monstros emergem de <strong>1 a 4 fendas Cthulhu</strong> abertas na borda da plataforma.</li>
                <li>Os monstros atravessam a grade para atingir seu QG: ataque-os no caminho.</li>
                <li><strong>Muros</strong> (150 no Fácil, 125 no Normal, 75 no Difícil): os monstros os contornam — cada fenda mantém sempre um caminho até o QG (um muro que a selasse é recusado). As torres não bloqueiam o caminho: um monstro que esbarra numa torre para e a destrói.</li>
                <li><strong>Arame farpado</strong> (30/20/10 conforme a dificuldade, requer a pesquisa Arame farpado): não bloqueia, mas fere e abranda os monstros que o atravessam.</li>
                <li><strong>Posicionamento memorizado</strong>: sua disposição (torres, muros, arame) é salva por servidor e proposta novamente no início de cada partida.</li>
                <li>As ondas grandes chegam <strong>em grupos</strong> (até 20 monstros ao mesmo tempo): uma onda nunca se estende por mais de ~2 minutos.</li>
                <li><strong>Derrota imediata</strong>: se todos os inimigos de uma onda ultrapassarem suas defesas e atingirem o QG, a partida é perdida no ato — impossível vencer sem colocar defesas eficazes (sobretudo na dificuldade Fácil).</li>
                <li>Entre as ondas, os trabalhadores reparam automaticamente as torres danificadas.</li>
                <li>Velocidade ajustável de ×1 a ×10, com pausa possível.</li>
                <li><strong>Encadear vagas</strong>: uma opção da barra superior inicia automaticamente a vaga seguinte assim que a atual termina, sem passar pela preparação e mantendo a sua velocidade, até à vitória ou à derrota. Desative-a durante uma vaga para recuperar a pausa de preparação no fim dessa vaga. Indisponível no tutorial.</li>
                <li>O combate tem <strong>20 ondas no máximo</strong>, cada vez mais intensas.</li>
                <li><strong>Interface</strong>: barra superior em largura total (pill QG + barra HP, contador de onda circular, pontuação, botão «Iniciar» e ícones som / música / info de unidades / grade / encadear vagas à direita), painel «Unidades» à direita com uma grelha de 2 colunas de cards verticais (ícone + nome + stock + estatísticas). Sem menu lateral nem footer durante a partida: toda a largura do ecrã é dedicada ao mapa.</li>
            </ul>

            <h3>Suas unidades para o TD</h3>
            <p>Suas unidades de planeta (Legionários, Mechas, torres) são convertidas em unidades TD conforme uma <strong>proporção de conversão</strong>. Cada tipo de unidade tem um número máximo que pode ser colocado, para forçar a diversidade tática.</p>

            <h3>Os monstros que você enfrenta</h3>
            <ul>
                <li><strong>Profundo</strong> — o monstro base. Nada excepcional, mas chegam em número.</li>
                <li><strong>Vigia</strong> — muito rápido mas frágil. Para interceptar rápido.</li>
                <li><strong>Shoggoth</strong> — lento, massivo, pesadamente blindado. Difícil de derrubar.</li>
                <li><strong>Estrela vampírica</strong> — dispara projéteis à distância nas suas defesas.</li>
                <li><strong>Flagelador mental</strong> — pode <strong>converter seus Legionários em monstros</strong> (efeito visual de conversão), no máximo um por segundo, e nenhum depois de ferido de morte.</li>
                <li><strong>Boss Cthulhu</strong> — enorme, raro (Normal/Difícil, ameaça elevada). Invoca Profundos ao seu redor.</li>
            </ul>

            <h3>Mecânicas úteis para saber</h3>
            <ul>
                <li>As unidades e monstros têm <strong>tamanhos diferentes</strong> na grade (Legionário 1×1, Mecha 2×1, torre 2×2, Boss 2×2).</li>
                <li>A <strong>barra de onda</strong> exibe o número de inimigos restantes.</li>
                <li>Se você atualizar a página, a partida <strong>recomeça exatamente onde você parou</strong>.</li>
                <li>Uma partida salva deve ser <strong>retomada</strong> antes de começar uma nova.</li>
            </ul>

            <h3>Recompensas e perdas</h3>
            <ul>
                <li><strong>Vitória</strong>: redução de ameaça + urânio + horda destruída.</li>
                <li><strong>Derrota</strong>: recompensas parciais; se a horda já tivesse chegado, o desembarque ocorre imediatamente.</li>
                <li><strong>As perdas de unidades são reais</strong> em todos os casos (Legionários mortos no TD = mortos de verdade).</li>
            </ul>

            <h3>Ranking TD</h3>
            <p>Um ranking por servidor mantém os <strong>melhores scores</strong> do Tower Defense. Outra tabela para conquistar.</p>

    events:
        title: "Eventos especiais"
        category: "events"
        order: 3
        tags: "evento,total war,alliance arena,raiders"
        summary: "Eventos pontuais animam a vida do servidor: bônus, desafios, competições inter-alianças."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Certos modos de servidor (Long Run, Short Run) disparam regularmente <strong>eventos especiais</strong>. Duram algumas horas ou alguns dias, e modificam temporariamente as regras para apimentar a partida.</p>
            <p>O calendário é <strong>determinístico</strong>: você pode antecipar cada evento, planejar sua estratégia.</p>

            <h2 id="lista">Os eventos que você pode encontrar</h2>
            <table>
                <tr><th>Evento</th><th>O que acontece</th></tr>
                <tr><td><strong>Total War</strong></td><td>Guerra total generalizada — todas as alianças podem se atacar livremente.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Bônus de produção militar: recrutar e fabricar mais rápido.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>Ondas de inimigos PNJ atacam os servidores. Defenda-se ou retalie.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Proteja os mercadores ameaçados. Recompensas se salvar os PNJ.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Invada planetas Cthulhu por recompensas em urânio.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Ataque as frotas Cthulhu para ganhar PDG.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Período de bônus à destruição de frotas inimigas.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Capacidade de reciclagem temporariamente aumentada. Momento ideal para limpar detritos.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Competição entre alianças: combates classificados e recompensas coletivas.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Confronto entre servidores diferentes. O melhor servidor leva.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Onda Cthulhu intensa prevista — prepare suas defesas.</td></tr>
            </table>

            <h2 id="onde">Onde ver o calendário?</h2>
            <p>Página <strong>Eventos</strong> (menu da esquerda nos modos pertinentes). Você verá a lista dos eventos futuros, suas datas e efeitos.</p>

            <h2 id="estrategia">Como tirar proveito</h2>
            <ul>
                <li><strong>Prepare-se</strong> com antecedência: construa seu exército antes de um Total War, seus recicladores antes de um bônus Recycling.</li>
                <li><strong>Discuta na sala</strong>: um evento é oportunidade de coordenar com sua aliança.</li>
                <li><strong>Aproveite os bônus</strong>: não lance uma grande produção fora de um Product Army se puder esperar.</li>
            </ul>

    alliance_arena:
        title: "Arena Aliança"
        category: "events"
        order: 9
        tags: "alianca,arena,bracket,pvp,evento,torneio,setor,planeta,frota,base,historico,espectador"
        summary: "Evento recorrente a cada 3 dias: sua aliança enfrenta as outras em uma batalha de setor — frotas duplicadas, planetas a controlar — para encher o banco da aliança e embolsar um bônus pessoal."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Quando começa</h2>
            <p>O evento volta <strong>a cada 3 dias</strong> nos servidores envolvidos. Calendário de um dia de arena (horário Europe/Paris):</p>
            <ul>
                <li><strong>08:00</strong> — anúncio na sala Universo (todos os idiomas) e <strong>abertura das inscrições</strong>, com notificação aos membros da aliança.</li>
                <li><strong>18:45</strong> — fechamento das inscrições: a composição do quadro fica fixada.</li>
                <li><strong>19:00</strong> — primeira rodada. As seguintes começam às <strong>19:15</strong> e às <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — fim dos combates, distribuição das recompensas.</li>
            </ul>
            <p>Se menos de <strong>2 alianças</strong> estiverem inscritas globalmente às 19:00, o evento é cancelado e um broadcast avisa todo mundo.</p>

            <h2 id="inscription">Inscrever-se</h2>
            <p>Quando as inscrições abrem, uma <strong>modal abre automaticamente</strong> na sua interface. Você também pode acessá-la pela aba Arena da sua página Aliança.</p>
            <p>Condições:</p>
            <ul>
                <li>Ser membro de uma aliança.</li>
                <li>Ter pelo menos <strong>1 nave de ataque</strong> (no solo ou em frota) no momento do spawn (19:00).</li>
            </ul>
            <p>Você pode se desinscrever até as 19:00. Se você não tiver mais nenhuma nave de ataque às 19:00 (perdidas em combate real entre a inscrição e o spawn), você é automaticamente declarado desistente — sua aliança continua sem você.</p>
            <p><strong>Comandantes IA</strong>: os comandantes IA da sua aliança seguem a sua inscrição — assim que um membro humano se inscreve, até 4 deles se juntam ao bloco ao seu lado (no máximo 5 inscritos por aliança). Alianças totalmente IA também se inscrevem para completar a chave.</p>

            <h2 id="combat">Como funciona</h2>
            <p>Cada partida é disputada em um <strong>setor criado para a ocasião</strong>, exibido como o mapa espacial: uma grade de 5 × 5 onde <strong>2 a 4 alianças</strong> se enfrentam. Cada aliança parte da sua <strong>base</strong>, no meio de uma borda do setor.</p>
            <p>Suas naves são <strong>duplicadas</strong> para a arena: nada do que você possui está em risco. Nenhuma perda real, nenhum destroço, nenhum herói capturado.</p>
            <ul>
                <li>Uma partida dura no máximo <strong>15 minutos</strong>.</li>
                <li>Vence a primeira aliança a chegar a <strong>300 pontos</strong>; senão, a melhor pontuação ao fim do tempo. Em caso de empate: mais planetas controlados, depois mais dano causado.</li>
                <li>Apenas uma aliança por setor passa para a rodada seguinte. Chave de eliminação direta em até 3 rodadas; o vencedor da última partida é campeão do servidor.</li>
            </ul>

            <h2 id="flotte">Sua frota</h2>
            <p>Você começa com <strong>uma única frota</strong>, formada por todas as suas naves de ataque — as do solo e as das suas frotas — e pelo seu herói principal.</p>
            <ul>
                <li><strong>Enviar</strong>: escolha sua frota, toque em um planeta e confirme. A duração do voo é anunciada antes da partida, e um voo não pode ser cancelado.</li>
                <li><strong>Dividir</strong>: destaque parte das suas naves para uma nova frota (no máximo 4 frotas). Uma frota voa à velocidade da sua nave mais lenta: um esquadrão de caçadores sozinho é três vezes mais rápido do que uma frota que arrasta couraçados.</li>
                <li><strong>Reagrupar</strong>: duas das suas frotas em órbita do mesmo planeta podem se fundir.</li>
            </ul>
            <p>Quando duas alianças se encontram no mesmo planeta, o combate é resolvido <strong>5 segundos</strong> depois — tempo para a chegada de reforços — com as <strong>mesmas regras do combate espacial</strong> do jogo. Uma frota em combate não pode sair antes do fim.</p>
            <p>Uma frota destruída não está perdida: ela <strong>se reforma na sua base</strong>, com efetivo completo, após 45 segundos — 15 a mais a cada nova destruição, no máximo 2 minutos. Cada frota inimiga destruída rende <strong>5 pontos</strong> à sua aliança.</p>
            <p><strong>Os comandantes IA lutam de verdade</strong>: vão tomar os planetas livres, evitam combates perdidos de antemão e voltam para se reparar. Se você não abrir a tela da partida e não der nenhuma ordem durante um minuto, o piloto automático também joga por você — você retoma o controle assim que voltar.</p>

            <h2 id="planetes">Planetas e pontos</h2>
            <p>Uma aliança <strong>sozinha</strong> em um planeta que não é dela o captura após <strong>15 segundos</strong>; um inimigo que chega zera o contador. O planeta <strong>continua sendo da sua aliança</strong> quando suas frotas partem, até que outra o retome. Esse é o dilema: espalhar-se para pontuar ou agrupar-se para vencer os combates.</p>
            <p>A cada <strong>10 segundos</strong>, cada planeta controlado rende pontos:</p>
            <table>
                <tr><th>Planeta</th><th>Pontos</th><th>Além disso</th></tr>
                <tr><td><strong>Mundo</strong> (4 por setor)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Estaleiro</strong></td><td>1</td><td>Repara suas frotas em órbita: 10&nbsp;% do efetivo a cada período.</td></tr>
                <tr><td><strong>Nexo</strong> (no centro)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Cada ponto marcado por um planeta também paga <strong>PDG ao banco da sua aliança</strong> ao fim da partida: 3 PDG por ponto na rodada 1, 8 na rodada 2, 15 na rodada 3 — vencendo ou não a partida. Os pontos de frotas destruídas e de bases saqueadas não rendem PDG.</p>

            <h2 id="bases">As bases</h2>
            <p>Sua base é o seu ponto de partida e de reformação; suas frotas são reparadas ali (5&nbsp;% por período). Ela não pode ser capturada, mas pode ser <strong>saqueada</strong>.</p>
            <p>Uma base é defendida pelas <strong>defesas planetárias de todos os planetas dos jogadores da aliança que participam da partida</strong>, somadas: é difícil de tomar. Um ataque repelido a danifica mesmo assim, e ela se repara 10&nbsp;% por período.</p>
            <p>Se a defesa cair, a base é saqueada: <strong>50 pontos</strong> para o atacante, cujas frotas voltam imediatamente para casa, e a base fica intocável por 2 minutos.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Dois tipos de recompensas cumuláveis.</p>
            <h3 id="banque">Banco da aliança</h3>
            <table>
                <tr><th>Rodada alcançada</th><th>Bitcoin</th><th>PDG</th></tr>
                <tr><td>Perdedores rodada 1</td><td>50 000</td><td>1 000</td></tr>
                <tr><td>Perdedores rodada 2</td><td>150 000</td><td>3 000</td></tr>
                <tr><td>Perdedores rodada 3</td><td>350 000</td><td>8 000</td></tr>
                <tr><td><strong>Campeão</strong></td><td><strong>1 000 000</strong></td><td><strong>25 000</strong></td></tr>
            </table>
            <h3 id="perso">Bônus individual</h3>
            <p>Pago direto na sua carteira pessoal, desde que você tenha <strong>dado ao menos uma ordem pessoalmente</strong> durante a partida: se o piloto automático jogou a partida inteira por você, não há bônus.</p>
            <table>
                <tr><th>Rodada alcançada</th><th>Bitcoin pessoal</th></tr>
                <tr><td>Perdedores rodada 1</td><td>5 000</td></tr>
                <tr><td>Perdedores rodada 2</td><td>15 000</td></tr>
                <tr><td>Perdedores rodada 3</td><td>30 000</td></tr>
                <tr><td><strong>Campeão</strong></td><td><strong>50 000</strong></td></tr>
            </table>
            <p>Você acumula o bônus de todas as rodadas alcançadas. Campeão = 5 000 + 15 000 + 30 000 + 50 000 = <strong>100 000 Bitcoins</strong> na sua carteira, além dos PDG que seus planetas controlados renderam ao banco.</p>

            <h2 id="rapports">Relatórios de combate</h2>
            <p>Ao fim de cada partida, cada jogador recebe um <strong>relatório</strong> na página Relatórios: resultado, pontuação da sua aliança e de cada adversário, planetas controlados, bases saqueadas, seu dano causado e sofrido, as frotas inimigas destruídas pelas suas e as que você perdeu, seu efetivo restante, sua posição em dano entre os pilotos da sua aliança — com o título de <strong>MVP da partida</strong> para o primeiro — e os PDG pagos ao banco.</p>
            <p>Ao fim do torneio, soma-se um <strong>resumo pessoal</strong>: a trajetória da sua aliança na chave, o balanço das partidas, sua contribuição total e o detalhe dos seus ganhos (bônus pessoal, banco da aliança, territórios controlados).</p>

            <h2 id="suivi">Acompanhar o evento pela aba Arena</h2>
            <p>A aba <strong>Arena</strong> da sua página Aliança mostra o tempo todo o estado real do evento: sem arena em andamento, próxima arena chegando (com contagem regressiva até o anúncio), anunciada, inscrições abertas ou fechadas, arena em andamento, ou encerrada. Uma contagem regressiva mostra o tempo restante até a próxima etapa (fechamento das inscrições, início dos combates, próxima rodada), e um painel mostra quantos membros da sua aliança já estão inscritos do total.</p>
            <p>Depois que a arena termina, a aba também guarda o <strong>histórico de resultados</strong> da sua aliança (arenas jogadas, títulos de campeão, melhor rodada alcançada, saldo de vitórias/derrotas) e o histórico das últimas dez edições jogadas no seu servidor, com o resultado da sua aliança e as recompensas obtidas em cada uma.</p>

            <h2 id="spectateur">Modo espectador</h2>
            <p>Não está inscrito na arena em curso? Você ainda pode acompanhar ao vivo as partidas da <strong>sua aliança</strong> pela aba Arena: o setor é exibido exatamente como para um piloto, mas você não pode dar nenhuma ordem.</p>

            <h2 id="astuces">Dicas</h2>
            <ul>
                <li><strong>Tome o Nexo cedo</strong>: ele rende tanto quanto três mundos. Mas todo mundo sabe disso.</li>
                <li><strong>Destaque seus caçadores</strong>: um esquadrão rápido captura os mundos enquanto sua frota pesada segura o centro.</li>
                <li><strong>Cheguem juntos</strong>: frotas que chegam nos mesmos 5 segundos lutam juntas; uma frota isolada é destruída e entrega 5 pontos.</li>
                <li><strong>Mantenha um estaleiro</strong>: passar por ele repara suas frotas duas vezes mais rápido do que na base.</li>
                <li><strong>Não acampe</strong>: um planeta capturado continua seu quando você parte. Vá tomar outro.</li>
                <li><strong>Uma base se toma em grupo</strong>: atacar sozinho uma base intacta é entregar pontos. Com vários aliados, na mesma janela de 5 segundos, são 50 pontos de uma vez.</li>
                <li><strong>Dê ao menos uma ordem</strong>: sem uma ordem sua, não há bônus individual.</li>
            </ul>

            <h2 id="mobile">No mobile</h2>
            <p>A arena joga-se com o dedo no mobile:</p>
            <ul>
                <li><strong>Orientação paisagem</strong> forçada ao entrar na partida no aplicativo móvel. Em um navegador móvel, onde o jogo não pode forçar a tela, uma mensagem convida você a girar o aparelho.</li>
                <li><strong>O setor inteiro cabe na tela</strong>: sem zoom nem câmera para controlar.</li>
                <li><strong>Três toques para uma ordem</strong>: sua frota (na barra inferior, ou tocando no planeta dela), o planeta de destino e o botão «Enviar».</li>
                <li><strong>A moldura e a tag</strong> de cada planeta dizem de quem ele é; os números nos cantos dão as forças em órbita, as suas em verde, as do inimigo em vermelho.</li>
                <li><strong>Botão ⓘ</strong>: os detalhes do planeta escolhido e o registro dos combates.</li>
                <li><strong>Push notif</strong>: um alerta na abertura das inscrições (08:00), com o horário-limite e o horário dos combates.</li>
            </ul>

    ia_bots:
        title: "Comandantes IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,inteligencia artificial,pnj,bot,piloto automático"
        summary: "Alguns servidores incluem comandantes controlados por IA. Como se comportam, e por quê."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principio">Por que IAs?</h2>
            <p>Em alguns servidores, alguns comandantes não são jogadores humanos, mas <strong>inteligências artificiais</strong>. Elas permitem:</p>
            <ul>
                <li><strong>povoar o servidor</strong> quando há poucos jogadores ativos;</li>
                <li>oferecer <strong>alvos interessantes</strong> aos jogadores que buscam combates;</li>
                <li>simular uma diplomacia viva com propostas, traições e alianças críveis.</li>
            </ul>

            <h2 id="comportamento">Como se comportam</h2>
            <p>Cada bot tem:</p>
            <ul>
                <li>uma <strong>personalidade</strong> (agressivo, pacífico, oportunista…);</li>
                <li>um <strong>humor</strong> que evolui conforme os eventos;</li>
                <li>um <strong>arquétipo estratégico</strong> (economista, militarista, explorador…).</li>
            </ul>
            <p>Eles jogam de verdade: constroem, pesquisam, atacam, formam alianças, às vezes traem. Podem ser seus aliados como seus piores inimigos.</p>
            <p>Crescem <strong>todos os dias ao ritmo dos jogadores ativos</strong> do servidor (um pouco mais depressa do que a mediana), sem nunca ultrapassar <strong>90 % do melhor jogador</strong>. O que perdem em combate perde-se de vez: se um jogador destruir a sua guarnição, não a reconstroem nesse planeta durante <strong>7 dias</strong> e reforçam antes as suas torres.</p>
            <p><strong>Onde dorme a sua frota.</strong> As IA militaristas e exploradoras mantêm uma guarnição em órbita dos seus planetas. As outras, mais prudentes, guardam as suas naves <strong>em terra</strong>, como muitos jogadores, e só as tiram para se defender: se o seu radar detetar uma frota hostil a caminho que consigam vencer, põem a sua frota em órbita e chamam as naves dos seus planetas vizinhos que cheguem a tempo; perante uma frota demasiado forte, enviam a sua para aterrar noutro dos seus planetas. Também se juntam a um combate já em curso sobre o seu planeta, ou atacam uma frota armada estacionada em órbita, quando conseguem ganhar. Como um jogador, uma IA adormecida não reage, e uma frota escondida por um bloqueador apanha-a de surpresa. Nunca deixam as suas naves em terra num planeta sem torres, onde uma invasão as capturaria: as naves vão aterrar no seu planeta mais bem defendido, que é também o seu primeiro refúgio.</p>
            <p><strong>O seu comércio.</strong> Vendem os seus excedentes e a carga dos seus recicladores ao mercador mais próximo, exceto se estiver sob bloqueio ou guardado por uma frota hostil em modo ataque, que destruiria o seu comboio à chegada: vão então ao seguinte.</p>

            <h2 id="reconhecer">Como reconhecê-los</h2>
            <p>Os bots aparecem no ranking como jogadores normais. Seu comportamento é coerente, mas um olho atento frequentemente identifica os padrões: respostas muito rápidas a mensagens de aliança, horários de conexão atípicos, diplomacia mecânica.</p>

            <h2 id="estrategia">Jogar com eles</h2>
            <ul>
                <li>Não subestime um bot: alguns são verdadeiros terrores militares.</li>
                <li>Um bot pode perfeitamente te convidar para uma aliança, cooperar e depois te atacar se a situação mudar.</li>
                <li>Pelo lado da imersão, trate-os como jogadores: torna o servidor mais vivo.</li>
            </ul>

            <h2 id="pilote-automatique">Jogadores ausentes: o piloto automático</h2>
            <p>Se um jogador deixar de se ligar durante <strong>8 dias</strong>, a sua conta passa para <strong>piloto automático</strong>: um bot <strong>mudo</strong>, que nunca escreve nos salões nem por mensagem privada. Este piloto automático <strong>não joga em seu lugar</strong>: a conta não lança nenhum ataque, não move nem envolve as suas frotas em combate e não coloniza. Limita-se a prosseguir as suas construções e pesquisas e a reforçar lentamente as suas torres. Os outros comandantes IA não o atacam; os outros jogadores, esses, continuam a poder fazê-lo. Podes sempre enviar-lhe uma mensagem privada: ele lê-la-á no seu regresso. Assim que o jogador se voltar a ligar, retoma instantaneamente o controlo da sua conta e encontra as suas frotas exatamente onde as deixou.</p>

    cthulhu_prophecies:
        title: "As profecias de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,profecia,bloqueio,ameaça,evento,aliança,pdg,bitcoin,mercador,reciclagem,classificação"
        summary: "Quando o indicador de ameaça do servidor atinge seu limite, os Possuídos anunciam uma profecia: 48 horas depois, suas hordas bloqueiam o comércio de todo o servidor. Como ler o indicador, romper um bloqueio em grupo, e o que custa o fracasso."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="o-que-e">O que é uma profecia?</h2>
            <p>Um <strong>fundo de ameaça próprio do servidor</strong> — distinto do seu nível de ameaça pessoal contra os Cthulhu — sobe automaticamente, dia após dia. Quando atinge seu limite, os <strong>Possuídos</strong> publicam uma <strong>profecia datada</strong> no chat público: um <strong>bloqueio</strong> vai cair sobre todo o servidor nas horas seguintes. A profecia também anuncia o que está em jogo se ninguém reagir.</p>

            <h2 id="indicador">Ler o indicador de ameaça do servidor</h2>
            <ul>
                <li>Está visível na <strong>página Cthulhu</strong> (a do Tower Defense) e avança independentemente dos seus próprios combates.</li>
                <li>Sobe <strong>100 pontos por dia</strong>; o limite que dispara uma profecia é atingido em <strong>cerca de uma semana</strong>.</li>
                <li>Os <strong>Possuídos</strong> publicam um <strong>boletim diário</strong> no chat público com o nível atingido: assim você vê chegando.</li>
                <li>O primeiro evento de um servidor não pode ocorrer antes das suas <strong>duas primeiras semanas</strong> de existência.</li>
                <li>Nunca há duas profecias (nem dois bloqueios) ao mesmo tempo no mesmo servidor: o indicador só volta a subir depois que o evento anterior termina.</li>
            </ul>

            <h2 id="anuncio">O anúncio</h2>
            <p>Ao cruzar o limite, os Possuídos publicam sua profecia no chat: o prazo vence <strong>~48 horas depois</strong>. A mensagem anuncia explicitamente o que está em jogo — o bloqueio, o dízimo, a classificação das alianças, o destino dos campos de destroços — sem regras ocultas descobertas depois.</p>

            <h2 id="bloqueio">O bloqueio</h2>
            <p>Ao vencer o prazo, uma <strong>horda Cthulhu</strong> se posiciona em órbita de <strong>cada mercador</strong> e de <strong>cada asteroide</strong> do servidor:</p>
            <ul>
                <li><strong>Venda impossível</strong> em qualquer mercador bloqueado.</li>
                <li><strong>Reciclagem impossível</strong> em qualquer asteroide bloqueado.</li>
                <li>No resto do universo, os <strong>campos de destroços continuam recicláveis normalmente</strong>, como após qualquer outro combate.</li>
                <li>Num alvo bloqueado, porém, os <strong>destroços dos seus próprios assaltos se acumulam no local e ficam fora de alcance enquanto a horda que o guarda estiver viva</strong>. Destrua-a e <strong>esse alvo reabre imediatamente</strong>, sem esperar o desfecho do bloqueio no resto do servidor: a venda ou a reciclagem recomeçam ali, e os seus recicladores já em órbita voltam ao trabalho sozinhos.</li>
                <li>Nada a ver com o cerco ou a fome que uma frota inimiga pode impor a um planeta jogador: aqui, só o comércio e a reciclagem param.</li>
                <li>O bloqueio dura <strong>no máximo 48 horas</strong>.</li>
            </ul>

            <h2 id="romper">Romper um bloqueio em grupo</h2>
            <p>Nem todas as hordas são iguais. As que guardam os <strong>mercadores</strong> são calibradas bem acima da maior potência de frota do servidor (jogador ou bot): ninguém as rompe sozinho. As guarnições dos <strong>asteroides</strong>, bem mais leves, continuam ao alcance de uma grande frota isolada — e são elas que formam a maior parte da contagem. Em ambos os casos, uma <strong>coalizão</strong> que golpeia a mesma horda em assaltos sucessivos acaba com ela.</p>
            <p>O dano sofrido por uma horda <strong>nunca se regenera</strong> entre combates: cada assalto, mesmo perdido, a enfraquece para o próximo. Concentre seus ataques na mesma horda em vez de espalhá-los entre várias.</p>

            <h2 id="recompensas">Recompensas</h2>
            <p>Cada ponto de dano causado a uma horda é <strong>pago em Bitcoin e Pontos de Guerra</strong> na resolução do evento — vencendo ou perdendo, nenhum assalto é em vão.</p>
            <p>O bloqueio é declarado <strong>rompido</strong> assim que <strong>70 % das hordas do servidor forem destruídas antes do prazo</strong>, mercadores e asteroides igualmente: a taxa de recompensa é então <strong>dobrada</strong> para todos os contribuintes. Um relatório individual detalha seu dano causado e sua recompensa ao final do evento. Enquanto o bloqueio está ativo, a <strong>página Cthulhu</strong> mostra o progresso ao vivo: hordas destruídas, objetivo a alcançar e tempo restante.</p>

            <h2 id="preco-fracasso">O preço do fracasso</h2>
            <p>Se o bloqueio <strong>vencer sem ser rompido</strong>:</p>
            <ul>
                <li><strong>Cada jogador perde metade do seu Bitcoin</strong> — os Possuídos cobram seu dízimo. Jogadores sob <strong>proteção de iniciante</strong> e jogadores em game over são poupados.</li>
                <li><strong>Todos os campos de destroços de combate do universo são devorados</strong> pelos Cthulhu; os <strong>asteroides</strong> ficam intactos.</li>
                <li>O <strong>cofre de bitcoins de cada aliança</strong> com pelo menos um jogador humano também perde metade do seu conteúdo: depositar seu Bitcoin no cofre antes do prazo não protege de nada. A cobrança aparece no histórico do cofre.</li>
                <li>As <strong>3 últimas alianças da classificação</strong> perdem ainda produção durante 72 horas (veja abaixo).</li>
            </ul>
            <p>Cada jogador afetado recebe um relatório detalhando o Bitcoin perdido. Esses riscos são sempre anunciados na profecia: nenhuma regra oculta.</p>

            <h2 id="classificacao">A classificação das alianças</h2>
            <p>Durante o bloqueio, cada aliança é classificada pelo que faz contra a colmeia. A <strong>página Cthulhu</strong> mostra a classificação ao vivo, com o que sua aliança ganharia ou perderia se o bloqueio terminasse agora.</p>
            <ul>
                <li><strong>Pontos</strong>: o dano causado a uma <strong>frota-muralha</strong> conta em dobro; o dano causado à colmeia em outros lugares (cercos de bases, hordas) conta uma vez; cada <strong>vitória no Tower Defense</strong> vale tanto quanto destruir um quarto de muralha de asteroide.</li>
                <li><strong>Pontos por membro</strong>: a pontuação é dividida pelo número de membros ativos (conectados nos últimos 7 dias, fora da proteção de iniciante). O dano de um iniciante conta mesmo assim: recrutar nunca baixa a pontuação.</li>
                <li><strong>Participação congelada</strong> no início do bloqueio: trocar de aliança durante o evento não move nem os pontos, nem o bônus, nem a penalidade.</li>
                <li>Uma aliança precisa de pelo menos <strong>2 membros ativos</strong> para ser classificada. <strong>Jogadores sem aliança</strong> nunca são afetados.</li>
            </ul>
            <p><strong>Bloqueio quebrado</strong>: as 3 primeiras alianças ganham <strong>+15 %, +10 % e +5 % de produção</strong> durante 72 horas, desde que tenham marcado pontos. Nenhuma aliança é penalizada.</p>
            <p><strong>Bloqueio sofrido</strong>: as 3 últimas alianças perdem <strong>15 %, 10 % e 5 % de produção</strong> durante 72 horas, além do dízimo. Nunca mais da metade das alianças classificadas é atingida, e uma aliança que fez o esforço mínimo (o equivalente a meia muralha de asteroide destruída, ou duas vitórias no Tower Defense, por membro ativo) é poupada, mesmo em último lugar.</p>
            <p>Cada membro recebe um relatório que explica o bônus ou a penalidade de sua aliança e quando termina. Os Possuídos anunciam o início do bloqueio no chat, fazem um lembrete 6 horas antes do prazo e depois nomeiam as alianças recompensadas ou punidas.</p>

            <h2 id="na-pratica">Na prática</h2>
            <ul>
                <li>Acompanhe o <strong>boletim diário</strong> dos Possuídos: ele dá uma ideia de quanto tempo falta até o limite.</li>
                <li>Assim que uma <strong>profecia</strong> é anunciada, avise sua aliança: você tem <strong>48 horas</strong> para se organizar antes que o bloqueio caia.</li>
                <li>Concentre os assaltos nas mesmas hordas em vez de dispersá-los: o dano persiste, melhor terminar uma do que arranhar várias.</li>
                <li>Até um assalto perdido rende algo: não espere ter certeza da vitória para atacar.</li>
                <li>Sem frota suficiente para atacar uma muralha? Uma <strong>vitória no Tower Defense</strong> durante o bloqueio também rende pontos para sua aliança.</li>
            </ul>

    notifications:
        title: "Notificações push"
        category: "beginner"
        order: 10
        tags: "notificacao,push,alerta,celular,navegador,preferencia"
        summary: "Receba um alerta no celular ou navegador sempre que um evento importante ocorrer no seu império."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principio">Para que serve?</h2>
            <p>Area Universe se joga continuamente: frotas inimigas podem chegar enquanto você está no trabalho. As <strong>notificações push</strong> te alertam em tempo real no seu telefone ou navegador, para que você possa reagir a tempo.</p>

            <h2 id="eventos">O que você pode receber</h2>
            <ul>
                <li><strong>Pesquisa concluída</strong> — uma tecnologia acabou de terminar.</li>
                <li><strong>Edifício concluído</strong> — sua fila de construção está vazia.</li>
                <li><strong>Produção concluída</strong> — suas naves ou torres estão prontas.</li>
                <li><strong>Frota chegou ao destino</strong> — sua frota está no local.</li>
                <li><strong>Frota em combate</strong> — um combate espacial vai começar.</li>
                <li><strong>Frota inimiga se aproximando</strong> — alguém está indo em direção a um dos seus planetas.</li>
                <li><strong>Planeta sob ataque</strong> — invasão terrestre em andamento.</li>
                <li><strong>Planeta sob embargo</strong> — um dos seus planetas está sitiado.</li>
                <li><strong>Ataque nuclear recebido</strong> — uma bomba caiu sobre você.</li>
                <li><strong>Aliança em guerra</strong> — declaração de guerra envolvendo sua aliança.</li>
                <li><strong>Mensagem privada / de aliança</strong> — nova mensagem recebida.</li>
                <li><strong>Herói capturado / libertado</strong> — evento de prisão.</li>
                <li><strong>Ataque Cthulhu</strong> — horda Cthulhu no seu planeta.</li>
            </ul>
            <p>Você pode ativar cada tipo <strong>individualmente</strong> conforme o que te interessa.</p>

            <h2 id="ativacao">Como ativá-las</h2>
            <ol>
                <li>Abra suas <strong>Preferências</strong> (menu de perfil).</li>
                <li>Aba <strong>Notificações</strong>.</li>
                <li>Aceite o pedido de permissão do seu navegador ou telefone.</li>
                <li>Marque os tipos que te interessam.</li>
            </ol>
            <p>Um botão <em>Desativar tudo</em> permite desligar o conjunto com um clique.</p>

            <h2 id="compatibilidade">Onde funciona</h2>
            <ul>
                <li><strong>Aplicativo móvel</strong>: Android e iOS nativos.</li>
                <li><strong>Navegador</strong>: Chrome, Firefox, Edge, Safari desktop. Para Safari iOS, adicione o site à tela inicial (iOS 16.4+).</li>
                <li><strong>Multi-dispositivo</strong>: se você estiver conectado em celular + PC, os dois tocam.</li>
            </ul>

            <h2 id="solucao-problemas">O navegador recusa a inscrição?</h2>
            <p>No <strong>Brave</strong>, o serviço push do Google está desativado por padrão. Abra <code>brave://settings/privacy</code>, ative <strong>“Usar serviços do Google para mensagens push”</strong> e reinicie o navegador completamente. Em outros navegadores, verifique se nenhum VPN, antivírus ou DNS de filtragem está bloqueando o serviço de notificações.</p>

            <h2 id="celular">No aplicativo móvel</h2>
            <p>No Android e iOS, a página <strong>Notificações</strong> tem uma seção “Notificações deste aparelho”: ative ou desative as notificações push do telefone a qualquer momento. Se estiverem bloqueadas, um botão abre diretamente as configurações do telefone. Suas preferências por tipo de notificação valem para todos os seus aparelhos.</p>

            <h2 id="discord">No Discord</h2>
            <p>Se sua conta do Discord estiver vinculada (<strong>Minhas opções</strong>), o alerta <strong>Frota inimiga se aproximando</strong> também chega por mensagem privada no Discord, com a hora de chegada e um link para o planeta. No máximo uma mensagem por planeta a cada 30 minutos: um ataque com várias frotas não te inunda. É preciso ser membro do <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Discord do Area Universe</a> e aceitar mensagens privadas dos membros. A opção vem ativada e pode ser desligada na seção <strong>Discord</strong> das preferências de notificação.</p>

    glossary:
        title: "Glossário"
        category: "beginner"
        order: 11
        tags: "glossario,termos,definicoes,vocabulario,abreviacoes"
        summary: "Todos os termos e abreviações do jogo, explicados em uma frase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Todos os termos do jogo</h2>
            <table>
                <tr><th>Termo</th><th>Definição</th></tr>
                <tr><td><strong>Barcaça</strong></td><td>Nave de desembarque de Legionários para pilhagens e invasões.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Moeda principal do jogo. Gerada pelos seus trabalhadores.</td></tr>
                <tr><td><strong>Bloco</strong></td><td>Agrupamento automático de frotas aliadas durante um combate espacial.</td></tr>
                <tr><td><strong>Bunker</strong></td><td>Edifício defensivo. Aumenta a capacidade de Legionários e protege parte dos seus recursos contra pilhagens.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Campo De Recursos: os detritos deixados após um combate, recicláveis.</td></tr>
                <tr><td><strong>Estaleiro Espacial</strong></td><td>Edifício que permite fabricar naves.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>As criaturas hostis (ex-"zumbis"). Aparecem em modo PvE e em planetas aliens.</td></tr>
                <tr><td><strong>Ciclo</strong></td><td>Ritmo interno de produção. 10 min para um planeta, 1 min para uma lua.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Nível de alerta de aliança. Quanto menor o número, mais tensa a situação.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Cerco de um planeta por uma frota inimiga em órbita. Provoca fome.</td></tr>
                <tr><td><strong>Manutenção</strong></td><td>Custo diário em Bitcoins das suas tropas, naves e edifícios.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fim de partida: falência econômica, ou perda de todos os seus planetas.</td></tr>
                <tr><td><strong>Game Over econômico</strong></td><td>Seu saldo de Bitcoins ficou negativo após o relatório diário.</td></tr>
                <tr><td><strong>Herói</strong></td><td>Seu personagem único. Evolui, combate e pode ser capturado.</td></tr>
                <tr><td><strong>Mercador</strong></td><td>PNJ no mapa que compra seus recursos por Bitcoins.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Nave rara que cria uma lua num campo de destroços (posição vazia, mín. 2M de nióbio e 2M de água).</td></tr>
                <tr><td><strong>Mothership / Nave-mãe</strong></td><td>Grande nave almirante. Reduz ligeiramente a velocidade da frota.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Pontos De Guerra. Ganhos em combate, servem para pesquisas e ranking.</td></tr>
                <tr><td><strong>Planeta ativo</strong></td><td>O planeta atualmente selecionado. Todas as suas ações se aplicam a ele.</td></tr>
                <tr><td><strong>PNJ</strong></td><td>Personagem Não Jogador: mercadores, aliens, Cthulhu, bots IA.</td></tr>
                <tr><td><strong>Pilhagem</strong></td><td>Ataque terrestre para pilhar recursos de um planeta (não para conquistá-lo).</td></tr>
                <tr><td><strong>Relatório diário</strong></td><td>Balanço diário calculado às 18h59 UTC: receitas, custos, e saldo.</td></tr>
                <tr><td><strong>Reciclador</strong></td><td>Nave que recolhe detritos (CDR) após um combate.</td></tr>
                <tr><td><strong>Round</strong></td><td>Turno de combate. Máx. 100 em combate espacial, máx. 10 em combate no solo.</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Pequena nave de espionagem. A enviar antes de qualquer ataque.</td></tr>
                <tr><td><strong>Tamanho de frota</strong></td><td>Indicador global da massa da sua frota. Quanto maior, mais combustível consome.</td></tr>
                <tr><td><strong>Terraformação</strong></td><td>Pesquisa que amplia o tamanho construível de um planeta.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Minigame de defesa ativa contra hordas Cthulhu.</td></tr>
                <tr><td><strong>Trabalhador</strong></td><td>Unidade de população. Produz Bitcoins todo dia. Defende em invasão.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Modo guiado de 16 etapas para aprender o jogo, acessível pelas Preferências.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Jogador designado como alvo prioritário no modo Search &amp; Destroy.</td></tr>
            </table>

    account_deletion:
        title: "Excluir a minha conta e os meus dados"
        category: "beginner"
        order: 99
        tags: "exclusao,conta,dados,rgpd,privacidade"
        summary: "Como solicitar a exclusão definitiva da sua conta e dos seus dados pessoais."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Onde solicitar</h2>
            <p>Você pode solicitar a qualquer momento a exclusão da sua conta e dos seus dados pessoais na página pública <strong>/suppression-donnees</strong>, ou na parte inferior das suas opções no jogo.</p>

            <h2 id="irreversible">Um abandono de conta definitivo</h2>
            <p><strong>Atenção: isto é um abandono definitivo de conta.</strong> Os seus dados pessoais (e-mail, identificadores sociais, IP, notificações, mensagens privadas…) são excluídos ou anonimizados imediatamente, e você nunca mais poderá se conectar novamente com esta conta.</p>

            <h2 id="conserve">O que é conservado, e por quê</h2>
            <p>Para preservar o equilíbrio do jogo, os seus comandantes, planetas e frotas continuam a existir sob um pseudônimo de bot anônimo, sem nenhuma ligação com a sua identidade. As mensagens públicas escritas nas salas de chat também são conservadas, atribuídas agora ao seu pseudônimo de bot anônimo. O histórico de pagamentos é conservado (obrigação legal contábil), também dissociado da sua identidade.</p>

    achievements:
        title: "Conquistas"
        category: "progression"
        order: 11
        tags: "conquistas,achievements,trofeus,google play,play games,progressao"
        summary: "15 conquistas de conta, dos primeiros passos às façanhas de carreira, no seu perfil e no Google Play Games."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">O princípio</h2>
            <p>As <strong>conquistas</strong> recompensam o que você realiza com a sua conta, <strong>em todos os servidores</strong>. Uma conquista desbloqueada fica para sempre, mesmo que depois você perca o planeta ou saia da aliança que a rendeu.</p>
            <p>Você as encontra no seu <strong>perfil multisservidor</strong> (menu «Meu perfil multisservidor»), com o seu progresso e a data de cada desbloqueio. O perfil de outro jogador mostra as dele. As que o seu histórico já mereceu são desbloqueadas na hora.</p>
            <h2 id="liste">As 15 conquistas</h2>
            <table>
            <tr><th>Conquista</th><th>Condição</th><th>Pontos</th></tr>
            <tr><td>Comandante</td><td>Concluir o tutorial</td><td>20</td></tr>
            <tr><td>Construtor</td><td>Concluir uma primeira construção</td><td>20</td></tr>
            <tr><td>Sábio</td><td>Concluir uma primeira pesquisa</td><td>20</td></tr>
            <tr><td>Colono</td><td>Possuir 2 planetas</td><td>20</td></tr>
            <tr><td>Aliado</td><td>Entrar em uma aliança ou fundar uma</td><td>20</td></tr>
            <tr><td>Veterano I, II, III</td><td>Travar 10, 100 e depois 1.000 batalhas espaciais</td><td>25, 50, 100</td></tr>
            <tr><td>Conquistador I, II</td><td>Realizar 10 e depois 100 invasões bem-sucedidas</td><td>50, 100</td></tr>
            <tr><td>Carcereiro</td><td>Capturar um herói inimigo</td><td>50</td></tr>
            <tr><td>Caçador de Cthulhu</td><td>Vencer uma partida de Tower Defense</td><td>50</td></tr>
            <tr><td>Elite</td><td>Terminar um servidor no top 10</td><td>100</td></tr>
            <tr><td>Imperador</td><td>Vencer um servidor</td><td>200</td></tr>
            <tr><td>Uma conquista oculta</td><td>Descubra jogando</td><td>50</td></tr>
            </table>

            <h2 id="progression">O progresso</h2>
            <p>As conquistas de batalhas e invasões avançam por níveis, e o seu perfil mostra o contador (por exemplo 37 / 100). Toda batalha espacial travada conta, vencida ou perdida, incluindo a destruição de uma frota sem armas (cargueiros, recicladores, sondas), para os dois lados; as invasões contam quando são bem-sucedidas (os ataques de saque não contam). Elite e Imperador se decidem no fim de um servidor.</p>
            <h2 id="google-play">Google Play Games (Android)</h2>
            <p>No aplicativo Android, suas conquistas também aparecem no <strong>Google Play Games</strong>, com o aviso «Conquista desbloqueada».</p>
            <ul>
            <li><strong>Conta de teste</strong> criada no aplicativo: ela é vinculada automaticamente ao seu perfil do Google Play Games. Assim, não é mais excluída após 7 dias sem jogar e se reabre sozinha após uma reinstalação ou em um celular novo.</li>
            <li><strong>Conta registrada</strong>: vincule-a no seu perfil multisservidor (cartão «Google Play Games»). Depois ela abrirá sem senha com esse perfil do Google Play Games: faça isso só no seu próprio aparelho. Você pode desvinculá-la a qualquer momento pelo mesmo cartão, no site ou no aplicativo.</li>
            <li>O botão <strong>«Play Jeux»</strong> da tela de login reabre a conta vinculada. Sair da conta desativa a abertura automática nesse aparelho: é então este botão que reabre a conta.</li>
            </ul>
            <p>Um perfil do Google Play Games se vincula a uma única conta da Area, e uma conta a um único perfil. Vincular a sua conta pelo seu perfil tira o perfil do Google Play Games da outra conta à qual ele estivesse vinculado.</p>

