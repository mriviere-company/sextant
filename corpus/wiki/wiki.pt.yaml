                <tr><td>Barcaça de invasão</td><td>150</td><td>300 s</td><td>10</td><td>1&nbsp;000</td></tr>
                <tr><td>Nave radar</td><td>299</td><td>1 s</td><td>100</td><td>—</td></tr>
                <tr><td>Nave bloqueadora</td><td>299</td><td>1 s</td><td>200</td><td>—</td></tr>
                <tr><td>Lunar</td><td>50</td><td>500 s</td><td>10&nbsp;000</td><td>—</td></tr>
                <tr><td>Nave mãe</td><td>250</td><td>100 s</td><td>4&nbsp;000</td><td>—</td></tr>
                <tr><td>Caçador</td><td>275</td><td>50 s</td><td>1</td><td>—</td></tr>
                <tr><td>Caçador pesado</td><td>275</td><td>50 s</td><td>2</td><td>4</td></tr>
                <tr><td>Caçador de plasma</td><td>275</td><td>50 s</td><td>5</td><td>—</td></tr>
                <tr><td>Corveta</td><td>265</td><td>70 s</td><td>7</td><td>—</td></tr>
                <tr><td>Corveta a laser</td><td>250</td><td>100 s</td><td>10</td><td>—</td></tr>
                <tr><td>Corveta de combate</td><td>265</td><td>70 s</td><td>12</td><td>—</td></tr>
                <tr><td>Fragata</td><td>245</td><td>110 s</td><td>20</td><td>25</td></tr>
                <tr><td>Fragata de plasma</td><td>240</td><td>120 s</td><td>30</td><td>—</td></tr>
                <tr><td>Nave de batalha</td><td>250</td><td>100 s</td><td>40</td><td>—</td></tr>
                <tr><td>Cruzador</td><td>235</td><td>130 s</td><td>56</td><td>—</td></tr>
                <tr><td>Couraçado</td><td>225</td><td>150 s</td><td>64</td><td>—</td></tr>
                <tr><td>Destroyer</td><td>230</td><td>140 s</td><td>270</td><td>—</td></tr>
            </table>
            <p>Exemplo: o Lunar é muito lento e sua assinatura de 10&nbsp;000 torna o trajeto caro. Para um setor vizinho, ele leva 25 minutos e custa cerca de 50 Bitcoins de combustível; para outra galáxia, 2 h 30 e 1&nbsp;250 Bitcoins.</p>

            <h3>Pré-requisitos</h3>
            <p>Pesquisas a obter e edifício a construir no planeta que produz:</p>
            <ul>
                <li>Nenhuma pesquisa: Sonda, Caravela, Caçador de plasma, Corveta de combate, Nave de batalha.</li>
                <li>Cargo I / V / X: Gestão de cargas nível 1 / 3 / 5.</li>
                <li>Colonizador: Terraformação nível 1. Lunar: Terraformação nível 15 + Indústria pesada.</li>
                <li>Reciclador: Reciclagem orbital. Barcaça de invasão: Invasão planetária.</li>
                <li>Nave radar: Scanner de sistema nível 3 + Fábrica de armamento. Nave bloqueadora: Scanner de sistema nível 5 + Fábrica de armamento.</li>
                <li>Nave mãe: Naves utilitárias nível 3 + Indústria pesada (uma única por comandante).</li>
                <li>Caçador: Indústria nível 1 + Arma míssil nível 1. Caçador pesado: Arma míssil nível 2 + Fábrica de armamento.</li>
                <li>Corveta: Arma míssil nível 3 + Naves leves nível 2 + Fábrica de armamento. Corveta a laser: Arma míssil 3 + Arma laser 1 + Naves leves 3 + Fábrica de armamento.</li>
                <li>Fragata: Arma míssil 3 + Arma laser 1 + Indústria pesada. Fragata de plasma: o mesmo + Arma plasma 1.</li>
                <li>Cruzador: Arma míssil 3 + Arma laser 2 + Arma plasma 2 + Indústria pesada.</li>
                <li>Couraçado: as três armas no nível 3 + Naves pesadas 2 + Indústria pesada. Destroyer: as três armas no nível 3 + Naves pesadas 3 + Indústria pesada.</li>
            </ul>

    ship_customization:
        title: "Personalizar suas naves"
        category: "fleet"
        order: 3
        tags: "personalizacao,naves,pontos,casco,escudo,precisao,armas,melhoria"
        summary: "Até 40 pontos por dia para reforçar o casco, o escudo, as armas e a precisão das suas naves de combate."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Cada uma das 12 naves de combate dispõe de um <strong>crédito de pontos de melhoria</strong> que lhe é próprio: 3 para o Caçador, 676 para o Destroyer, 1&nbsp;465 para o conjunto dos modelos. Você os gasta nas características dela:</p>
            <ul>
                <li><strong>Casco</strong> — quanto ela consegue absorver (+5 por ponto).</li>
                <li><strong>Escudo</strong> — absorve uma parte dos tiros (+1 por ponto; os caçadores não têm).</li>
                <li><strong>Míssil</strong>, <strong>Laser</strong>, <strong>Plasma</strong> — suas armas (+3, +2 e +1 por ponto), conforme as que a nave possui.</li>
                <li><strong>Precisão</strong> — eleva o pior resultado possível de cada salva (+1 por ponto; nenhum tiro erra jamais, mas um tiro mal ajustado causa menos dano).</li>
            </ul>
            <p>Você pode gastar <strong>no máximo 40 pontos por dia</strong>, todas as naves somadas. Assim que você gastou esses 40 pontos, uma contagem regressiva de 24&nbsp;h começa; ao fim dela, você recupera 40. Os pontos não gastos não se acumulam além de 40: lembre-se de passar por aqui todo dia.</p>
            <p>Apenas as naves de combate são melhoradas: cargueiros, recicladores, sondas e outras naves utilitárias não têm pontos.</p>

            <h2 id="usar">Como usá-los</h2>
            <p>Vá à página <strong>Estaleiro espacial</strong>, aba <strong>Melhore suas naves!</strong> (a entrada do menu fica verde quando você tem pontos a gastar). Para cada modelo, digite o número de pontos a colocar em cada característica (o ganho aparece ao lado) e depois clique em <strong>Aplicar</strong>. Suas escolhas se aplicam a <strong>todas as naves desse modelo</strong> (atuais e futuras). Essas estatísticas progridem independentemente umas das outras: colocar pontos no casco ou nas armas de um modelo nunca reduz sua precisão.</p>

            <h2 id="leitura">Ler sua mira na tela</h2>
            <p>A aba <strong>Estatísticas</strong> do Estaleiro espacial exibe, modelo por modelo, a mira que você investiu no crédito desse modelo (por exemplo <code>676 / 676</code> para um Destroyer) e o <strong>multiplicador de dano</strong> que resulta dela&nbsp;: <strong>×0,94</strong> com mira cheia, <strong>×0,66</strong> sem nenhum ponto investido.</p>
            <p>Não é uma taxa de acerto&nbsp;: <strong>nenhum tiro erra jamais</strong>. Mirar melhor eleva o piso do seu dano, nunca o teto. É o mesmo número da sua página de gestão de frota, na aba Defesas e nos seus relatórios de combate — as quatro telas finalmente se comparam diretamente. Como referência, as defesas de um planeta atiram a <strong>×1,06</strong>, ou seja, melhor que uma frota com mira cheia.</p>

            <h2 id="maximum">Quantos pontos para maximizar?</h2>
            <p>A <strong>precisão</strong> atinge seu máximo quando você coloca nela <strong>todo o crédito do modelo</strong>: 3 pontos para o Caçador, 5 para o Caçador pesado, 21 para o Caçador de plasma e a Corveta a laser, 23 para a Corveta, 34 para a Corveta de combate, 61 para a Fragata de plasma, 64 para a Fragata, 118 para o Cruzador, 160 para a Nave de batalha, 279 para o Couraçado e 676 para o Destroyer. É uma escolha: tudo na mira, ou tudo nos canhões e no casco.</p>
            <p>As outras características não têm máximo, apenas o limite do crédito. Exemplo: os 676 pontos de um Destroyer colocados no casco acrescentam a ele 3&nbsp;380 pontos de casco (de 2&nbsp;600 para 5&nbsp;980). A 40 pontos por dia, são necessários 17 dias para gastar o crédito de um Destroyer, e 37 dias para os 1&nbsp;465 pontos de todos os modelos.</p>

            <h2 id="reset">Redefinições</h2>
            <p>Você pode reiniciar seus pontos <strong>uma vez a cada 96 horas</strong>, sem limite de quantidade: se sua estratégia mudar ou o motor de combate evoluir, todos os seus pontos gastos voltam para o crédito de cada modelo. Depois de uma reinicialização, o botão fica cinza e uma contagem regressiva exibe o tempo restante até a próxima.</p>
            <p>Logo após a redefinição, a linha «&nbsp;Você ainda pode gastar … pontos hoje&nbsp;» indica seus pontos gastos menos 90, mais o que ainda restava a gastar naquele dia, com um mínimo de 40. O resto volta depois no ritmo habitual de 40 por dia. Exemplos: se você tinha gasto os 1&nbsp;465 pontos e mais nada hoje, pode recolocar 1&nbsp;375 imediatamente; se tinha gasto 300, pode recolocar 210.</p>

            <h2 id="modos-especiais">Modos de servidor com pesquisas máximas</h2>
            <p>Em certos modos (Battle Royale, Dominação, Search &amp; Destroy), <strong>todos os seus pontos são desbloqueados desde o primeiro dia</strong>: os 1&nbsp;465 pontos ficam disponíveis imediatamente, em vez de 40 por dia.</p>

            <h2 id="dicas">Dicas</h2>
            <ul>
                <li>Não disperse seus pontos em modelos demais: concentre-se nos que você realmente usa em massa.</li>
                <li>O <strong>Caçador de plasma</strong> e a <strong>Nave de batalha</strong> não têm nenhuma arma de origem: sem pontos nas armas deles, não atiram.</li>
                <li>O <strong>Caçador</strong> tem apenas 3 pontos: bastam para levar sua precisão ao máximo.</li>
                <li>Cargueiros e recicladores não podem ser melhorados: para protegê-los, faça-os serem escoltados por uma frota armada.</li>
            </ul>

    fleet_missions:
        title: "Tipos de missões"
        category: "fleet"
        order: 4
        tags: "missao,ataque,transporte,colonizacao,reciclagem,espionagem,nuclear,raid,pilhagem,invasao"
        summary: "Cada missão dá uma ordem diferente à sua frota. Veja como escolher a certa."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Quando você envia uma frota, você dá a ela um <strong>tipo de missão</strong>. É essa missão que determina o que acontece na chegada. Certos tipos exigem naves específicas.</p>
            <p>Todas as missões são enviadas a partir do <strong>Mapa espacial</strong>: clique na casa visada, depois em <strong>Interação</strong>, escolha a frota e a missão e clique em <strong>Enviar</strong>. A lista só propõe as missões possíveis nessa casa. A aba <strong>Mover a frota</strong> da página de uma frota serve para os deslocamentos simples (Normal) e a espionagem.</p>

            <h2 id="missoes">Os tipos disponíveis</h2>
            <table>
                <tr><th>Missão (rótulo no jogo)</th><th>O que faz</th><th>Naves exigidas</th></tr>
                <tr><td><strong>Normal</strong></td><td>A frota vai ao ponto visado e permanece em órbita ali. Um combate começa 5 minutos após a chegada se uma frota em modo ataque (a sua ou uma frota já presente) enfrentar um adversário, se suas alianças estiverem em guerra, ou se o planeta visado estiver em modo ataque (suas defesas atiram). Detalhes em <em>Combate espacial</em>.</td><td>Quaisquer</td></tr>
                <tr><td><strong>Descarregar e voltar</strong></td><td>Deposita a carga em um planeta (dentro do limite dos seus armazéns: o excedente volta com a frota) ou a vende a um mercador em troca de Bitcoins, depois volta sozinha. O combustível é dobrado na ida, e a volta é paga na tarifa normal na partida.</td><td>Naves com porão (cargueiros, na prática)</td></tr>
                <tr><td><strong>Colonizar</strong></td><td>Funda uma colônia em um <strong>planeta desabitado</strong> (não em uma casa vazia).</td><td>Um colonizador</td></tr>
                <tr><td><strong>Saquear</strong></td><td>Combate a defesa em solo para roubar recursos, sem tomar o planeta.</td><td>Barcaças + Legionários</td></tr>
                <tr><td><strong>Invadir</strong></td><td>Combate a defesa em solo para <strong>tomar o planeta</strong> do adversário.</td><td>Barcaças + Legionários</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Espiona o planeta e envia um relatório a você.</td><td>Pelo menos uma sonda</td></tr>
                <tr><td><strong>Criar uma lua</strong></td><td>Cria uma lua em uma casa vazia que contenha pelo menos 2M de niobium e 2M de água em detritos.</td><td>Um Lunar</td></tr>
                <tr><td><strong>Implantar radar</strong></td><td>Instala um radar de potência 1 em uma casa vazia por 2&nbsp;h.</td><td>Uma nave radar</td></tr>
                <tr><td><strong>Implantar bloqueador</strong></td><td>Instala um bloqueador de potência 1 em uma casa vazia por 1&nbsp;h.</td><td>Uma nave bloqueadora</td></tr>
            </table>
            <p>Uma frota já em órbita do seu alvo também pode agir diretamente a partir da sua página, rubrica <strong>Interação</strong>: Invadir, Saquear, Colonizar, Espionar ou implantar.</p>

            <h3>Não são missões</h3>
            <ul>
                <li><strong>Reciclagem</strong>: automática. Uma frota que conte pelo menos um reciclador e tenha espaço no porão começa a reciclar assim que chega a um campo de detritos, qualquer que seja sua missão (Normal, em geral). O botão <strong>Reciclar</strong> da frota reinicia o trabalho.</li>
                <li><strong>Pousar no solo</strong>: em um dos seus planetas, a frota se junta ao estoque de naves em solo (veja <em>Gestão avançada das frotas</em>).</li>
                <li><strong>Míssil nuclear</strong>: a partir do Mapa espacial, «&nbsp;Enviar um míssil nuclear&nbsp;» sobre um planeta inimigo. O míssil parte de um dos seus planetas que possua um, voa por 30 minutos e não pode ser cancelado.</li>
            </ul>

            <h2 id="escolher">Como escolher a missão certa</h2>
            <ul>
                <li>Você quer <strong>Bitcoin</strong>? → Descarregar e voltar, para um mercador.</li>
                <li>Você quer <strong>informações</strong>? → Sonda.</li>
                <li>Você quer <strong>enfraquecer</strong> um inimigo? → Saquear.</li>
                <li>Você quer <strong>tomar</strong> o planeta dele? → Invadir.</li>
                <li>Você quer <strong>recuperar detritos</strong>? → Envie recicladores (missão Normal): eles reciclam sozinhos na chegada.</li>
            </ul>

    fleet_movement:
        title: "Deslocamento e distância"
        category: "fleet"
        order: 5
        tags: "deslocamento,distancia,velocidade,viagem,combustivel,coordenadas,bitcoin,cancelar,noite"
        summary: "Como são calculados a duração do voo, o combustível consumido, e o que atrasa sua frota."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordenadas">As coordenadas, como funcionam</h2>
            <p>Cada posição no universo é escrita no formato <strong>Galáxia:Setor:Posição</strong>. Exemplo: <code>1:5:12</code> = galáxia 1, setor 5, posição 12.</p>
            <ul>
                <li>Uma <strong>galáxia</strong> contém 100 setores (grade 10×10, numerados de 1 a 100 linha por linha: 1 a 10 na primeira linha, 91 a 100 na última). O Mapa espacial os chama de «&nbsp;sistemas&nbsp;».</li>
                <li>Um <strong>setor</strong> contém 25 posições (grade 5×5); a posição 13, no centro, é sempre um sol.</li>
            </ul>

            <h2 id="distancia">Como a distância é calculada</h2>
            <ul>
                <li><strong>No seu setor</strong>: cerca de 1 por casa de diferença (1 entre duas casas vizinhas, 6,25 no máximo de um canto ao outro).</li>
                <li><strong>Para outro setor da mesma galáxia</strong>: cerca de 3 por setor de diferença, em linha reta na grade 10×10; a posição dentro do setor deixa de contar. De 3 para um setor vizinho a cerca de 40 de um canto da galáxia ao outro.</li>
                <li><strong>Para outra galáxia</strong>: sempre 18, qualquer que seja o setor visado. É preciso a pesquisa <strong>Tecnologia hiperespaço</strong>.</li>
            </ul>
            <p>A aba <strong>Mover a frota</strong> da página de uma frota exibe uma estimativa do custo e da duração antes do envio. Essa estimativa não leva em conta nem os bônus de velocidade, nem a duplicação de «&nbsp;Descarregar e voltar&nbsp;», nem a velocidade do servidor. A partir do Mapa espacial, o envio parte sem prévia.</p>

            <h2 id="duracao">A duração do voo</h2>
            <p>A duração é calculada assim: <strong>distância × tempo por unidade da nave mais lenta × velocidade do servidor</strong>. Uma frota sempre vai na velocidade da sua nave mais lenta. Tempo por unidade de distância, em um servidor de velocidade ×1 (alguns servidores são acelerados):</p>
            <table>
                <tr><th>Tempo por unidade</th><th>Naves</th></tr>
                <tr><td>1 s</td><td>Sonda, Nave radar, Nave bloqueadora</td></tr>
                <tr><td>30 s</td><td>Caravela</td></tr>
                <tr><td>40 s</td><td>Cargo I</td></tr>
                <tr><td>50 s</td><td>Cargo V, Caçador, Caçador pesado, Caçador de plasma</td></tr>
                <tr><td>60 s</td><td>Cargo X</td></tr>
                <tr><td>70 s</td><td>Corveta, Corveta de combate</td></tr>
                <tr><td>100 s</td><td>Corveta a laser, Nave de batalha, Nave mãe</td></tr>
                <tr><td>110 s</td><td>Fragata</td></tr>
                <tr><td>120 s</td><td>Fragata de plasma</td></tr>
                <tr><td>130 s</td><td>Cruzador</td></tr>
                <tr><td>140 s</td><td>Destroyer</td></tr>
                <tr><td>150 s</td><td>Couraçado, Reciclador</td></tr>
                <tr><td>200 s</td><td>Colonizador</td></tr>
                <tr><td>300 s</td><td>Barcaça de invasão</td></tr>
                <tr><td>500 s</td><td>Lunar</td></tr>
            </table>
            <p>Exemplos, em um servidor de velocidade ×1:</p>
            <ul>
                <li>Caçadores para um setor vizinho: 2 min 30 s (3 × 50 s).</li>
                <li>Um Cargo I que entrega a um aliado: cerca de 2 minutos para um setor vizinho, 10 minutos para um setor situado 5 setores mais longe, 12 minutos para outra galáxia (Cargo X: 3, 15 e 18 minutos). Com «&nbsp;Descarregar e voltar&nbsp;», conte o mesmo para a volta.</li>
                <li>Um colonizador: cerca de 10 minutos para um setor vizinho, 50 minutos a 5 setores, 1 hora para outra galáxia.</li>
            </ul>
            <p>O que modifica a duração:</p>
            <ul>
                <li>A <strong>Nave mãe</strong> reduz em 10&nbsp;% a duração de voo da sua frota. Atenção: ela mesma voa a 100 s por unidade, portanto uma frota de caçadores que a leva passa de 50 para 90 s por unidade. Ela <strong>reduz também em 10&nbsp;% a assinatura de radar</strong> da frota (camuflagem) — a Visão geral exibe, por sua vez, o total bruto das suas naves.</li>
                <li>Um <strong>herói</strong> a bordo que dê um bônus de velocidade (veja o artigo <em>Herói</em>) e o bônus de aliança de velocidade de frota encurtam o trajeto. Juntos, os bônus do herói não podem reduzir a duração em mais de 90&nbsp;%.</li>
                <li>A <strong>desaceleração noturna</strong> pode multiplicar a duração (veja mais abaixo).</li>
            </ul>

            <h2 id="combustivel">O combustível</h2>
            <p>O combustível é pago em <strong>Bitcoins</strong>, na partida. Ele depende da <strong>assinatura</strong> da frota (a soma das assinaturas das suas naves; a carga não conta) e da distância:</p>
            <ul>
                <li>na mesma galáxia: <strong>assinatura × distância ÷ 600</strong>, arredondado;</li>
                <li>para outra galáxia: <strong>assinatura ÷ 8</strong>, arredondado, qualquer que seja o destino.</li>
            </ul>
            <p>A missão <strong>Descarregar e voltar</strong> custa o <strong>dobro</strong> na ida, e sua volta é paga depois como uma viagem normal, no momento em que a frota parte de novo. Uma Nave mãe reduz a assinatura da frota, portanto o combustível dela, em 10&nbsp;% (mas a assinatura dela própria é de 4&nbsp;000).</p>
            <p>Exemplos: 1 Cargo I (assinatura 10) para um setor vizinho: 0 Bitcoin. 100 Cargo X (assinatura 5&nbsp;000) para um mercador situado 5 setores mais longe: 252 Bitcoins na ida, 126 na volta. 1&nbsp;000 caçadores para outra galáxia: 125 Bitcoins. Se você não tiver Bitcoins suficientes, o envio é recusado.</p>

            <h2 id="chamar">Chamar de volta uma frota em voo</h2>
            <p>Durante os <strong>2 primeiros minutos</strong> do voo, um botão ✕ com contagem regressiva aparece na frota (página Frotas), e uma linha <strong>Cancelar</strong> na página dela: ele <strong>cancela o envio</strong>. A frota volta na hora ao planeta de partida, mas o combustível pago não é reembolsado. Isso vale também para um colonizador.</p>
            <p>Passado esse prazo, a frota não pode mais ser parada: depois de chegar, envie-a de volta (novo trajeto, novo combustível). Um míssil nuclear nunca é cancelado.</p>

            <h2 id="night-slowdown">🌙 Desaceleração noturna</h2>
            <p>Essa desaceleração atinge uma frota que transporta pelo menos uma nave de combate, Legionários ou Mechas, enviada ao planeta de outro jogador ou de um comandante de IA que não seja da sua aliança, nem aliado, nem em pacto ou em paz com você. Se essa frota devesse chegar durante a <strong>noite do defensor</strong> (23h–06h no fuso horário dele), <strong>toda a sua duração de voo é multiplicada</strong>, por 10 por padrão (cada servidor pode ajustar esse multiplicador).</p>
            <p>Exemplo: um voo de 1&nbsp;h que chegaria às 23h30 dura 10&nbsp;h e chega às 9h30. Uma frota de cargueiros, de sondas ou de colonizadores sem tropas a bordo nunca é desacelerada. A duração exibida na aba <strong>Mover a frota</strong> já inclui esse multiplicador.</p>
            <p>Um ícone 🌙 no mapa indica os jogadores atualmente em janela noturna. Na aba <strong>Mover a frota</strong>, uma janela de confirmação aparece no envio se a chegada cair na noite adversária; a partir do Mapa espacial, a frota parte sem esse aviso. O fuso horário é detectado automaticamente e pode ser modificado no máximo uma vez por mês (e 6 vezes por ano).</p>

    fleet_management:
        title: "Gestão avançada das frotas"
        category: "fleet"
        order: 6
        tags: "gestao,frota,dividir,cindir,fundir,transferir,reagrupar,pousar no solo,coorte,abandonar"
        summary: "Dividir, fundir, pousar no solo, cancelar um envio: as manipulações avançadas das suas frotas."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operacoes">As operações disponíveis</h2>
            <p>Elas são feitas a partir da página de uma frota (clique no nome dela, página <strong>Frotas</strong>):</p>
            <ul>
                <li><strong>Dividir</strong> (aba <strong>Naves</strong>) — separar uma parte das naves e da carga em uma nova frota. Impossível em voo ou em combate; 100 frotas no máximo.</li>
                <li><strong>Fundir</strong> (lista «&nbsp;Frotas em órbita&nbsp;») — reunir outra das suas frotas, ou todas (<strong>Fusão</strong>), estacionadas no mesmo planeta.</li>
                <li><strong>Gerenciar</strong> as naves (aba <strong>Naves</strong>) e o <strong>Frete</strong> — em um dos seus planetas, passar naves ou carga entre a frota e o solo.</li>
                <li><strong>Pousar no solo</strong> — em um dos seus planetas, despejar toda a frota (naves, tropas, carga) no estoque do planeta; a frota desaparece. As tropas e a carga desembarcadas devem caber nas capacidades do planeta&nbsp;; uma frota que não transporta nenhuma sempre pousa, mesmo em um planeta já cheio.</li>
                <li><strong>Cancelar o envio</strong> (botão ✕ na frota em voo, ou linha <strong>Cancelar</strong> na página dela) — somente durante os 2 primeiros minutos do voo: a frota volta na hora ao ponto de partida, combustível perdido.</li>
                <li><strong>Abandonar</strong> — você perde a frota: em um servidor onde Cthulhu está presente, ela passa para ele (e pode se voltar contra você); em outros lugares, ela é destruída.</li>
            </ul>
            <p>Na própria página <strong>Frotas</strong>:</p>
            <ul>
                <li><strong>Reagrupamento das frotas</strong> — envia todas as suas frotas paradas para esse planeta, onde elas pousam na chegada.</li>
                <li><strong>Reagrupamento das naves</strong> — reúne as naves em solo dos seus outros planetas em frotas que voam para este e pousam nele.</li>
                <li><strong>Coortes</strong> — organize suas frotas em listas nomeadas (10 no máximo) para encontrá-las facilmente. Nenhum efeito em combate.</li>
            </ul>
            <p>Dividir, fundir, transferir e pousar no solo não custam nenhum recurso. Somente os deslocamentos, reagrupamentos incluídos, são pagos, em Bitcoins de combustível.</p>

            <h2 id="em-voo">O que não se pode fazer</h2>
            <ul>
                <li>Modificar a composição de uma frota <strong>em voo</strong> (carregamento, naves).</li>
                <li>Mudar a missão ou o destino de uma frota em voo. Só é possível cancelar, e apenas durante os 2 primeiros minutos.</li>
                <li>Teletransportar uma frota (não há atalho mágico!).</li>
            </ul>

            <h2 id="dicas">Casos de uso</h2>
            <ul>
                <li><strong>Dividir antes de um combate</strong>: mantenha uma parte da sua frota em reserva, envie uma vanguarda.</li>
                <li><strong>Fundir depois de um raid</strong>: reúna várias voltas para ganhar legibilidade.</li>
                <li><strong>Pousar no solo</strong>: as naves em solo custam seis vezes menos de manutenção do que em frota (um doze avos da assinatura delas em Bitcoins por dia, no balanço das 18h59, hora de Paris, contra a metade em frota), mas elas <strong>não combatem</strong>. Para defender um planeta, mantenha uma frota armada em órbita, em modo ataque.</li>
            </ul>

    espionage:
        title: "Espionagem e sondas"
        category: "fleet"
        order: 7
        tags: "espionagem,sonda,espiao,deteccao,informacao,reconhecimento"
        summary: "Saber o que o adversário tem antes de atacar: o envio de sondas explicado."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="enviar">Enviar uma sonda</h2>
            <ol>
                <li>Fabrique <strong>sondas</strong> no Estaleiro espacial (nenhuma pesquisa exigida; 1&nbsp;000 niobium a unidade).</li>
                <li>No <strong>Mapa espacial</strong>, clique no planeta visado e depois em <strong>Interação</strong> → <strong>Sondar o planeta</strong>: uma sonda armazenada em solo em um dos seus planetas parte na hora. Você também pode criar uma frota de sondas e enviá-la em missão <strong>Sonda</strong>.</li>
                <li>Sozinha, uma sonda é quase instantânea: 1 segundo por unidade de distância (18 segundos para outra galáxia). Misturada a outras naves, ela voa na velocidade delas.</li>
            </ol>
            <p>O botão <strong>Interação</strong> do mapa só aparece se pelo menos uma das suas frotas estiver parada. Somente os planetas habitados por outro comandante podem ser escaneados: uma sonda enviada a uma lua chega sem produzir relatório.</p>
            <p>Na chegada, a sonda escaneia o planeta e envia um relatório a você, depois permanece em órbita do alvo. A partir da página dela (botão <strong>Espionar</strong>), ela pode refazer um relatório mais tarde; se o planeta entrar em modo ataque, suas defesas podem destruí-la. A partir do Mapa ou do botão Espionar, um mesmo planeta só pode ser sondado uma vez por hora.</p>

            <h2 id="sucesso">O que determina o sucesso?</h2>
            <p>Um duelo silencioso opõe seu <strong>nível de Espionagem</strong> ao do defensor:</p>
            <ul>
                <li>Se o seu nível for <strong>superior ou igual</strong>, o relatório é completo.</li>
                <li>Se o seu nível for menor, a espionagem falha: o relatório não contém nada além do nome do planeta. Não há resultado parcial.</li>
            </ul>
            <p>Para fazer sua espionagem subir: pesquisa <strong>Scanner de sistema</strong> até o nível 5, depois pesquisa <strong>Espionagem</strong>, sem nível máximo.</p>

            <h2 id="relatorio">O que um relatório bem-sucedido revela</h2>
            <ul>
                <li>Os <strong>recursos</strong>: niobium, água, rações, urânio, trabalhadores e cientistas.</li>
                <li>Os <strong>edifícios</strong> e seu nível.</li>
                <li>As <strong>defesas</strong>: torres, interceptadores nucleares, escudo, <strong>Legionários</strong> e <strong>Mechas</strong>.</li>
                <li>As <strong>naves em solo</strong> do planeta (mísseis nucleares incluídos). As frotas em órbita não aparecem ali: veja-as no Mapa espacial.</li>
                <li>Os <strong>prisioneiros</strong> (heróis) detidos no planeta.</li>
            </ul>
            <p>Exatamente o que é preciso para decidir: raid, invasão ou retirada.</p>

            <h2 id="deteccao">É possível ser notado?</h2>
            <p>Sempre. A cada sondagem, o defensor recebe um relatório «&nbsp;Espionagem detectada&nbsp;» que informa <strong>o seu nome</strong> e especifica se a tentativa teve sucesso ou falhou, além de uma notificação. O radar não muda nada nisso.</p>
            <p>O Bloqueador de radar também não: ele esconde um planeta no mapa, mas não impede uma sonda de escaneá-lo. Somente um nível de Espionagem superior ao seu protege o defensor.</p>

    spatial_combat:
        title: "Combate espacial"
        category: "combat"
        order: 1
        tags: "combate,espacial,frota,batalha,bloco,round,escudo,precisao,perdas,dano,tela,caçadores"
        summary: "O desenrolar completo de um combate entre frotas: poder dos lados, duelo dos escudos, rounds de tiro, fim do combate e cálculo exato das suas perdas."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="inicio">Quando um combate começa</h2>
            <p>Assim que uma frota marcada <strong>[Ataque]</strong> compartilha sua posição (Galáxia:Setor:Posição) com uma frota inimiga, o combate é programado para <strong>5 minutos</strong> depois; até lá, ninguém mais pode mudar o modo ataque das suas frotas. Suas frotas presentes no mesmo lugar se fundem primeiro em uma única armada.</p>
            <p>Todas as frotas no local são repartidas em <strong>dois lados</strong> segundo a diplomacia: sua aliança e as alianças ligadas a ela por uma Aliança defensiva de um lado, o inimigo e as dele do outro; uma aliança ligada por um Pacto de não agressão ao lado adversário fica de fora. Um lado sem nenhuma arma de nave (cargueiros, recicladores, sondas, tropas sozinhas) não trava batalha: ele é destruído, e o relatório menciona isso.</p>
            <p><strong>Alianças em guerra, ninguém armado</strong> — duas frotas de alianças em guerra que se cruzam em órbita só desencadeiam um combate se pelo menos uma das duas portar armas de nave. Duas frotas inteiramente desarmadas (cargueiros, sondas, recicladores) que se cruzam simplesmente não lutam&nbsp;: suas frotas não ficam imobilizadas e ninguém é avisado à toa.</p>
            <p><strong>Caso dos raids e invasões</strong> — quando essa batalha é desencadeada por um raid ou uma invasão contra um planeta guardado (veja os artigos <em>Invasão de planeta</em> e <em>Pilhagens (raids)</em>), é esse próprio desencadeamento que coloca o marcador <strong>[Ataque]</strong> na sua frota assaltante. Ele nunca é retirado depois&nbsp;: uma frota de raid ou de invasão que sobrevive continua, portanto, marcada como hostil — as torres em modo ataque poderão engajá-la mais tarde, e ela será incluída na detecção do próximo combate espacial assim que cruzar um inimigo.</p>

            <h2 id="poder">O poder de um lado</h2>
            <p>O combate opõe os <strong>totais</strong> dos dois lados: o jogo soma a blindagem, o escudo, os mísseis, os lasers e o plasma de todas as naves engajadas.</p>
            <ul>
                <li><strong>Defensor em casa</strong> — as torres e a blindagem das defesas do planeta se juntam ao seu lado; o Escudo adiciona +50&nbsp;000 de blindagem, o Grande escudo +600&nbsp;000 (+20&nbsp;% cada um com uma Base espacial). Uma frota armada de um membro da sua aliança estacionada no planeta também se beneficia.</li>
                <li><strong>Precisão</strong> — média das precisões das frotas do lado (resultante da personalização das suas naves). Veja <em>Entendendo a potência das tropas</em>.</li>
                <li><strong>Política de aliança</strong> — cada regime vence seu rival: <strong>A Balança dos Mundos</strong> vence <strong>O Baluarte Silencioso</strong>, que vence <strong>O Martelo das Estrelas</strong>, que vence A Balança dos Mundos. Se a política do <strong>atacante</strong> vence a do defensor, seus mísseis, lasers e plasma ganham +20&nbsp;% para esse combate.</li>
                <li><strong>Melhorias de aliança</strong> — até +5&nbsp;% por tipo de arma, de blindagem, de escudo e de precisão, e até +10&nbsp;% para as defesas planetárias. Esse último bônus vale quando suas defesas combatem ao lado de uma frota, não no combate orbital do modo ataque.</li>
                <li><strong>Heróis</strong> — bônus de ataque, de defesa, de escudo e de precisão segundo habilidades e itens. Um herói dotado de <strong>Intimidação</strong> reduz as armas adversárias; um <strong>Tático</strong> reforça a primeira salva do seu lado.</li>
            </ul>

            <h2 id="defesas-planeta">Suas torres lutam nesse mesmo combate</h2>
            <p>Quando as defesas do seu planeta se juntam a um lado, esse combate <strong>é</strong> todo o combate do seu planeta&nbsp;: não há um segundo combate orbital separado depois para as suas torres. Elas miram com sua própria precisão (uma escolta pouco precisa estacionada ao lado delas não degrada o tiro delas), e sofrem ali <strong>perdas reais</strong>, esteja o modo ataque do planeta ativo ou não:</p>
            <ul>
                <li><strong>se o seu lado vence</strong>, suas torres perdem a mesma fração que a blindagem perdida pelo seu lado (no máximo 95&nbsp;%); escudos e Base espacial permanecem intactos;</li>
                <li><strong>se o seu lado desmorona</strong>, todas as torres, o Escudo, o Grande escudo e a Base espacial são destruídos, a fila de produção da página Defesa é perdida (torres, Legionários, Mechas, bombas ou interceptadores ainda não entregues incluídos) e o modo ataque é desligado. Os Legionários, Mechas e trabalhadores já em solo, os edifícios e as bombas ou interceptadores em estoque não são atingidos.</li>
            </ul>
            <p>Um planeta guardado por uma frota <strong>armada</strong> (armas de nave) — a sua ou a de um membro da sua aliança — não pode, portanto, ser saqueado ou invadido sem que uma batalha decida primeiro; uma sonda ou um cargueiro sozinhos não bastam.</p>

            <h2 id="escudos">O duelo dos escudos</h2>
            <p>Cada salva esbarra primeiro no escudo adversário. Seu <strong>poder de perfuração</strong> vale&nbsp;:</p>
            <p><code>mísseis ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>O plasma se destaca contra os escudos, os mísseis os perfuram mal — qualquer que seja o tamanho do combate, dez contra dez como cem milhões contra cem milhões. A cada salva, a parte do dano que ultrapassa o poder de perfuração é absorvida pelo escudo adversário até o esgotamento da sua carga&nbsp;; o resto, e tudo o que transborda quando o escudo está vazio, atinge diretamente o casco. Um escudo nunca pode, portanto, bloquear uma salva inteira&nbsp;: diante de um adversário armado, seu casco sempre absorve alguma coisa, desde o primeiro round.</p>
            <p>Exemplo: uma salva disparada por 700 mísseis, 200 plasma e 300 lasers perfura na altura de 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1&nbsp;500</strong> pontos; somente o que ultrapassa esses 1&nbsp;500 pontos pode ser absorvido pelo escudo adversário.</p>
            <p>O escudo de uma frota não é uma reserva que volta automaticamente a 100&nbsp;% antes de cada batalha&nbsp;: é uma <strong>carga persistente</strong> que se desgasta durante o combate e só sobe 10&nbsp;% a cada 3 horas, de forma contínua (30 horas para ir de zero a cheio), mesmo quando você divide, funde ou dissolve a frota, ou transfere naves entre a frota e o solo do planeta. O relatório de combate exibe essa carga no início e no fim da batalha&nbsp;; a lista de frotas mostra a porcentagem de cada frota, e a página de gestão de frota indica o escudo realmente levado ao combate, a capacidade total, a porcentagem atual e o tempo restante até a carga cheia. O estoque de naves em solo também carrega uma carga, que não se recarrega&nbsp;: toda frota criada ou completada a partir desse solo a herda, e ela é exibida na janela de criação de frota e na aba «&nbsp;Naves&nbsp;» da gestão de frota.</p>
            <p>Uma exceção: o escudo fixo trazido por uma <strong>Nave mãe</strong> (5&nbsp;250 pontos por frota, uma única vez mesmo com várias Naves mães) nunca se descarrega de uma batalha para outra — ele absorve golpes durante o combate e depois volta cheio na seguinte; a carga só desgasta o escudo das suas outras naves. É por isso que a página de gestão exibe também o valor absoluto do escudo, não apenas a porcentagem.</p>

            <h2 id="rondas">Os rounds de tiro</h2>
            <p>O combate dura no máximo <strong>100 rounds</strong>. A cada round, cada lado dispara uma salva que causa&nbsp;:</p>
            <p><code>(mísseis + plasma ÷ 2 + lasers × 2) × multiplicador</code></p>
            <p>O multiplicador vem de um sorteio de precisão: o jogo sorteia um número entre a precisão do lado e 100 e o divide por 80, para um resultado entre <strong>×0,3 e ×1,2</strong>. Nenhuma salva erra. Uma precisão alta não torna suas melhores salvas mais fortes, ela elimina os maus sorteios. A parte que atravessa o escudo adversário (veja acima) é imputada à blindagem total desse lado.</p>

            <h2 id="fim">Fim do combate</h2>
            <ul>
                <li><strong>A blindagem de um lado cai a 0</strong> — ele é derrotado, todas as suas frotas são destruídas com a carga.</li>
                <li><strong>100 rounds atingidos</strong> — o lado que conserva mais blindagem vence; em empate perfeito, o atacante vence.</li>
                <li><strong>Rede de segurança do vencedor</strong> — mesmo muito avariado, o lado vencedor nunca perde mais de 95&nbsp;% da sua blindagem inicial: uma vitória nunca é um aniquilamento, qualquer que seja a diferença de poder.</li>
            </ul>

            <h2 id="perdas">Suas perdas: o que você absorveu</h2>
            <p>A regra cabe em uma frase: <strong>suas perdas decorrem dos danos de casco que você realmente absorveu</strong> — nunca dos que o seu escudo absorveu, que não custa nenhuma nave. Esses danos de casco se repartem entre a sua <strong>tela</strong> (Caçadores, Caçadores pesados, Caçadores de plasma: as únicas naves sem escudo) e a sua <strong>linha</strong> (as outras naves de combate, das Corvetas aos Destroyers), proporcionalmente à blindagem de cada grupo&nbsp;: cada tipo perde a mesma fração de si mesmo. O relatório exibe dois contadores: danos de casco e danos de escudo.</p>
            <p>Sua tela não protege sua linha indefinidamente&nbsp;: ela desvia para si no máximo a <strong>metade</strong> dos danos que visavam a linha, e apenas enquanto lhe restar blindagem para absorvê-los — um único caçador não consegue absorver os danos de uma frota inteira. Sem tela alguma, a linha absorve a totalidade dos danos de casco.</p>
            <p>Suas naves utilitárias (cargueiros, recicladores, barcaças, sondas, colonizadores, Nave mãe) não sofrem nenhuma perda enquanto o seu lado vence: somente as naves de combate absorvem.</p>
            <p>Consequências diretas: se o inimigo mal atinge você, suas perdas são quase nulas; um inimigo dez vezes mais perigoso custa a você cerca de dez vezes mais — caçadores incluídos. O lado derrotado, por sua vez, perde tudo.</p>

            <h2 id="depois">Depois do combate</h2>
            <ul>
                <li><strong>Detritos</strong> — 40&nbsp;% do custo de construção (niobium e água) de cada nave destruída, dos dois lados, cai em órbita (20&nbsp;% quando um Cthulhu ou um alien está envolvido). As naves pagas em Pontos de Guerra não deixam detritos. A carga das frotas aniquiladas se soma a eles. Um reciclador na frota vitoriosa começa imediatamente a recolher, se tiver espaço no porão.</li>
                <li><strong>Pontos de Guerra</strong> — o ganho é calculado sobre a assinatura do lado derrotado: assinatura total ÷ número de frotas desse lado ÷ 100 (÷ 500 diante de um Cthulhu ou de um alien), arredondado para o inteiro. Cada frota do lado vencedor recebe esse valor, e o proprietário do planeta recebe o mesmo se suas defesas estavam do lado vencedor. O lado derrotado recebe exatamente um quinto dessa tabela, calculado sobre suas próprias frotas. A pesquisa política «&nbsp;Pontos de Guerra&nbsp;» adiciona 10&nbsp;% por nível. Exemplo: uma frota de 100 Caçadores (assinatura 1 cada) destruída rende 1 PDG; um Destroyer (assinatura 270), cerca de 3. Destruir uma frota sem armas (cargueiros, sondas, recicladores) não rende nada.</li>
                <li><strong>Heróis</strong> — um herói principal a bordo de uma frota destruída pode ser capturado pelo vencedor (chance, nunca garantido). Um <strong>herói secundário</strong> derrotado segue uma regra diferente e definitiva, sem acaso: veja o artigo <em>Heróis secundários</em>.</li>
                <li><strong>Relatórios</strong> — cada comandante recebe o detalhe (menu <strong>Relatório</strong>, aba <strong>Combates</strong>): forças, salvas, danos absorvidos, perdas, e o destino de qualquer herói secundário capturado ou executado.</li>
                <li><strong>E depois</strong> — as frotas sobreviventes permanecem no local: nada as manda de volta automaticamente para casa.</li>
            </ul>

            <h2 id="conselhos">Conselhos</h2>
            <ul>
                <li>Mantenha sempre uma <strong>tela de caçadores</strong>: barata, ela absorve uma parte dos danos de casco no lugar das suas naves pesadas.</li>
                <li>Invista no <strong>escudo</strong>: quanto mais carregado, mais danos ele absorve antes que atinjam seu casco — mas nenhum escudo detém uma salva inteira, seu casco sempre absorve uma parte. Deixe-o se recarregar entre duas batalhas.</li>
                <li>Suba o <strong>plasma</strong> para perfurar rápido os escudos adversários, os <strong>lasers</strong> para os danos de casco.</li>
                <li>Escolha a <strong>política de aliança</strong> olhando a dos seus alvos favoritos: +20&nbsp;% de armas no ataque.</li>
            </ul>

    invasion:
        title: "Invasão de planeta"
        category: "combat"
        order: 2
        tags: "invasao,planeta,soldados,legionarios,mechas,barcacas,conquista,posicionamento,tatico,cancelar"
        summary: "Conquistar um planeta inimigo: barcaças, desembarque, combate em solo e posicionamentos táticos."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>A invasão é um ataque para <strong>tomar posse</strong> de um planeta inimigo. Sua frota desembarca Legionários (por meio de barcaças) que enfrentam a guarnição em solo.</p>
            <p>É diferente de um <strong>raid</strong> (que saqueia sem tomar o planeta): uma invasão bem-sucedida dá a você o planeta inteiro.</p>
            <p>Duas maneiras de iniciá-la: enviar a frota em missão «&nbsp;Invadir&nbsp;» para o planeta, ou clicar em «&nbsp;Invadir&nbsp;» quando sua frota já está em órbita do alvo (o assalto ocorre então imediatamente).</p>

            <h2 id="condicoes">O que é preciso para invadir</h2>
            <ul>
                <li>Jogar em um servidor em <strong>modo PvP</strong> (ex.: Dominação, Battle Royale, Pesquisa &amp; Destruição, Servidor pago).</li>
                <li>Ter <strong>barcaças</strong> e <strong>Legionários</strong> a bordo da frota.</li>
                <li>O alvo deve ser um planeta habitado de outro jogador: não um mercador, não um membro da sua aliança, nem uma aliança com a qual você tenha uma Aliança defensiva, um Pacto de não agressão ou um Acordo de paz.</li>
                <li>O alvo não deve estar protegido pelo status de novato. Iniciar uma invasão durante a sua própria proteção faz você perdê-la (o jogo pede confirmação).</li>
                <li>Sua frota não deve estar já engajada em um combate programado.</li>
            </ul>
            <p>Não é necessário pertencer a uma aliança.</p>

            <h2 id="barcacas">O papel das barcaças</h2>
            <p>As barcaças são os veículos que desembarcam seus Legionários em solo. Cada barcaça transporta <strong>1&nbsp;000 Legionários</strong>, +25&nbsp;% por nível da pesquisa política «&nbsp;Invasões planejadas&nbsp;» (1&nbsp;250 no nível 1, 1&nbsp;500 no nível 2…).</p>
            <p>Se você tiver mais Legionários do que vagas, os excedentes <strong>permanecem em órbita e não combatem</strong>. Os Mechas embarcados não participam do assalto: apenas os Legionários atacam em solo. Em caso de fracasso, suas barcaças são <strong>capturadas pelo defensor</strong>.</p>

            <h2 id="annuler">Cancelar uma invasão</h2>
            <p>Uma frota enviada em invasão pode ser chamada de volta durante os <strong>2 minutos</strong> seguintes à partida (botão «&nbsp;Cancelar&nbsp;»): ela volta na hora ao ponto de partida, mas o combustível pago é perdido. Passado esse prazo, a invasão ocorrerá na chegada. Uma invasão iniciada a partir da órbita («&nbsp;Invadir&nbsp;») é resolvida imediatamente e não pode ser cancelada.</p>

            <h2 id="orbital">Fase 1 — Combate em órbita (às vezes)</h2>
            <p>Duas situações podem detê-lo antes mesmo do desembarque:</p>
            <ul>
                <li>O planeta alvo ativou seu <strong>modo ataque</strong>: assim que você chega, suas torres e escudos engajam sua frota. Se <strong>você perder</strong>, sua frota é destruída — a invasão para de vez. Se <strong>você vencer</strong>, as defesas orbitais são aniquiladas e sua frota continua (enfraquecida). Um planeta sem torre perde seus escudos e sua base espacial sem combater assim que seu raid ou sua invasão chega.</li>
                <li>O planeta alvo é guardado por uma frota <strong>armada</strong> (armas de nave) do proprietário, ou de um membro da sua aliança, já em órbita (uma sonda ou um cargueiro sozinhos não contam): sua chegada desencadeia uma <strong>batalha</strong> contra esse defensor e suas torres reunidos, 5 minutos depois — mesmo que o planeta não esteja em modo ataque. Essa batalha nunca se desencadeia contra um parceiro de paz, de pacto, uma aliança defensiva ou a sua própria aliança, nem em um servidor PvE: ela respeita as mesmas regras diplomáticas de uma invasão normal. Ela cancela sua invasão em andamento&nbsp;: se você a vencer, é preciso <strong>reiniciar</strong> uma invasão para realmente desembarcar — e se o planeta ainda estiver guardado nesse momento, clicar em «&nbsp;Invadir&nbsp;» a partir da órbita é <strong>recusado</strong> da mesma forma&nbsp;: engaje primeiro o modo ataque da sua própria frota para forçar o combate. Como uma invasão sempre embarca Legionários, essa condição de batalha é automaticamente cumprida do lado atacante&nbsp;: a batalha se desencadeia, portanto, quer sua frota porte ou não armas de nave.</li>
            </ul>
            <p><strong>Armadilha a conhecer&nbsp;: uma frota de invasão sem nave de combate é aniquilada nessa batalha.</strong> Legionários e barcaças bastam para fazer uma invasão decolar, mas se a sua frota não portar nenhuma arma de nave, ela entra nessa batalha preliminar com um poder de fogo nulo&nbsp;: os defensores a aniquilam inteiramente, barcaças e Legionários incluídos, antes mesmo do desembarque. O mesmo vale diante de um planeta em modo ataque: suas torres destroem de saída uma frota sem arma de nave. <strong>Escolte sempre suas frotas de invasão com naves de combate</strong> — veja o artigo <em>Pilhagens (raids)</em> para a mesma armadilha do lado da pilhagem.</p>

            <h2 id="combate">Fase 2 — Combate em solo</h2>
            <p>O combate em solo se desenrola em <strong>10 rounds no máximo</strong>. A cada round, o assaltante causa um décimo do seu poder de ataque à guarnição, que revida com um décimo do seu poder de defesa.</p>
            <table>
                <thead>
                    <tr><th>Unidade</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionário</strong></td><td>Ataque (5 a 7 por round em invasão) e defesa (6, +5&nbsp;% por nível de Arame farpado).</td></tr>
                    <tr><td><strong>Mecha</strong></td><td>Defesa pesada (2&nbsp;200), máx. 500 por planeta. Não participa do assalto.</td></tr>
                    <tr><td><strong>Trabalhador</strong></td><td>Defesa passiva (1 cada), <strong>apenas em invasão</strong> (não em raid).</td></tr>
                </tbody>
            </table>
            <p><strong>O atacante vence apenas se</strong> todas as tropas do defensor forem eliminadas <strong>e</strong> restar a ele pelo menos 1 Legionário vivo. Caso contrário, <strong>o defensor vence pela vantagem do terreno</strong>. Detalhe dos poderes: artigo <em>Entendendo a potência das tropas</em>.</p>

            <h2 id="deploy">Os posicionamentos táticos do defensor</h2>
            <p>O defensor pode ter escolhido um <strong>posicionamento tático</strong> invisível para você (somente o relatório dele o indica). Tenha em mente: ele pode virar uma situação que parecia ganha de antemão.</p>
            <table>
                <thead>
                    <tr><th>Posicionamento</th><th>Efeito</th><th>Ordem das perdas da guarnição</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Equilibrado</strong></td><td>Nenhum bônus nem penalidade.</td><td>Legionários, depois Mechas, depois trabalhadores.</td></tr>
                    <tr><td><strong>Fortificado</strong></td><td>O revide da guarnição ganha 30&nbsp;% e depois perde 20&nbsp;%: ao todo <strong>+4&nbsp;%</strong> de dano causado ao assaltante. As unidades não ficam mais difíceis de matar.</td><td>Como Equilibrado.</td></tr>
                    <tr><td><strong>Guerrilha</strong></td><td>No revide, cada trabalhador conta 2,5 vezes (+150&nbsp;%) e cada Legionário metade (−50&nbsp;%).</td><td>Trabalhadores primeiro, depois Legionários, depois Mechas.</td></tr>
                    <tr><td><strong>Último bastião</strong></td><td>+50&nbsp;% de revide assim que a guarnição cai abaixo de 30&nbsp;% do seu efetivo inicial (em número de unidades), até o fim do combate.</td><td>Legionários, depois trabalhadores, depois Mechas.</td></tr>
                    <tr><td><strong>Terra arrasada</strong></td><td>Nenhum bônus no combate. Se o assaltante vence, em raid como em invasão, 50&nbsp;% do niobium, da água e do urânio restantes no planeta são destruídos.</td><td>Como Equilibrado.</td></tr>
                </tbody>
            </table>
            <p>Os trabalhadores só combatem em invasão. O defensor pode mudar de posicionamento livremente, a qualquer momento, na página <strong>Defesa</strong>.</p>

            <h2 id="vitoria">Se você vencer a invasão</h2>
            <ul>
                <li><strong>Captura</strong> — o planeta passa a ser seu, com seus edifícios. Os trabalhadores são reduzidos para <strong>2&nbsp;000</strong>. Se o defensor tinha escolhido Terra arrasada, metade do seu niobium, da sua água e do seu urânio é destruída antes da captura.</li>
                <li><strong>Planeta Cthulhu</strong> — se você retomar um planeta capturado pelos Cthulhu, ele é libertado (edifícios zerados, recompensa em urânio).</li>
                <li><strong>Sem mais espaço para colonizar?</strong> Seus planetas colonizados devem permanecer abaixo de Terraformação + 2, mais o nível da pesquisa política «&nbsp;Império sem fronteiras&nbsp;». Além disso, o planeta conquistado vira uma base Cthulhu — ou volta a ficar desabitado em um servidor sem Cthulhu: você não o mantém, mas recebe seus pontos de guerra.</li>
            </ul>
            <p>As <strong>filas de produção</strong> não acompanham o planeta capturado&nbsp;: as naves e as defesas (torres ou tropas) já pagas mas ainda não entregues são perdidas na captura — uma encomenda feita pelo derrotado nunca muda de mãos. O que foi entregue antes do assalto, por sua vez, está em solo e acompanha o planeta.</p>
            <p>Se o planeta capturado abriga um <strong>herói secundário</strong> adversário, seu destino se decide imediatamente: você o <strong>captura</strong> se possuir uma Prisão (nível 1 ou mais), senão ele é <strong>executado</strong>. Um raid, por sua vez, nunca toma o planeta e, portanto, nunca coloca um herói em jogo. Detalhes no artigo <em>Heróis secundários</em>.</p>

            <h2 id="gameover">Eliminação do defensor</h2>
            <p>Se o defensor perder seu <strong>último planeta</strong>, ele é eliminado do servidor. Você recupera tudo: seus Bitcoins, suas frotas sobreviventes e seus Pontos de Guerra.</p>

            <h2 id="derrota">Se você perder a invasão</h2>
            <p>As <strong>barcaças são capturadas pelo defensor</strong>. Os Legionários mortos em solo são perdidos; os que resistiram até o 10º round, e os que ficaram em órbita por falta de vaga, voltam para a sua frota — sem barcaças para desembarcá-los de novo. É uma derrota cara: sonde antes de invadir.</p>

    raid:
        title: "Pilhagens (raids)"
        category: "combat"
        order: 3
        tags: "raid,pilhagem,saque,roubo,recursos,bunker,forte defensivo,barcacas,terra arrasada"
        summary: "Saquear os recursos de um planeta inimigo sem tentar conquistá-lo."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principio">O que é um raid?</h2>
            <p>Um raid é um ataque em solo cujo objetivo é <strong>roubar recursos</strong>. Você não toma o planeta: você parte com o butim. Consequência importante: um raid, mesmo bem-sucedido, nunca toma o planeta, portanto <strong>nenhum herói secundário é jamais capturado nem executado nele</strong>, seja você atacante ou defensor.</p>
            <p>São necessários os mesmos meios de uma invasão: <strong>barcaças</strong> e <strong>Legionários</strong> a bordo, contra o planeta de outro jogador que não esteja na sua aliança, nem ligado a ela por uma Aliança defensiva, um Pacto de não agressão ou um Acordo de paz (veja <em>Invasão de planeta</em>). Envie a frota em missão «&nbsp;Saquear&nbsp;», ou clique em «&nbsp;Saquear&nbsp;» quando ela já estiver em órbita. Uma base Cthulhu não pode ser saqueada.</p>

            <h2 id="diferenca">Raid vs Invasão</h2>
            <table>
                <thead>
                    <tr><th></th><th>Raid</th><th>Invasão</th></tr>
                </thead>
                <tbody>
                    <tr><td>Objetivo</td><td>Roubar niobium, água, urânio</td><td>Tomar posse do planeta</td></tr>
                    <tr><td>Defensores</td><td>Legionários + Mechas</td><td>Legionários + Mechas + Trabalhadores</td></tr>
                    <tr><td>Ataque de um Legionário</td><td>5 a 6 por round (menos imprevisível)</td><td>5 a 7 por round (mais imprevisível)</td></tr>
                    <tr><td>Perda das barcaças se derrota</td><td>Não</td><td>Sim (capturadas pelo defensor)</td></tr>
                </tbody>
            </table>

            <h2 id="combate">Como acontece</h2>
            <p>As mesmas etapas da invasão (combate orbital eventual, depois 10 rounds em solo), <strong>mas os trabalhadores não defendem</strong>. Os Legionários e Mechas do defensor ficam sozinhos.</p>
            <p><strong>Planeta guardado por uma frota em órbita</strong> — se o alvo é protegido por uma frota <strong>armada</strong> (armas de nave) do proprietário, ou de um membro da sua aliança (uma sonda ou um cargueiro sozinhos não bastam), seu raid desencadeia primeiro uma batalha contra esse defensor e as torres do planeta, 5 minutos após a sua chegada. Essa batalha nunca se desencadeia contra um parceiro de paz, de pacto, uma aliança defensiva ou a sua própria aliança, nem em um servidor PvE. A pilhagem não ocorre em seguida&nbsp;: se você vencer essa batalha, é preciso <strong>reiniciar</strong> um raid para realmente saquear — e se o planeta ainda estiver guardado, clicar em «&nbsp;Saquear&nbsp;» a partir da órbita também é <strong>recusado</strong>&nbsp;: engaje primeiro o modo ataque da sua própria frota para forçar o combate. Do lado atacante, essa batalha só se desencadeia se a sua frota de raid for ela própria ofensiva — armas de nave, Legionários ou Mechas a bordo.</p>

            <h2 id="pilhagem-so-tropas">Um raid só de tropas é aniquilado</h2>
            <p>Levar Legionários ou Mechas basta para desencadear essa batalha — mas se a sua frota de raid não portar <strong>nenhuma arma de nave</strong>, ela entra nela com um poder de fogo nulo. Os defensores a aniquilam inteiramente, sem perder nenhuma nave do outro lado. Diante de um planeta em modo ataque, é igual: suas torres destroem de saída uma frota sem arma de nave. <strong>Escolte sempre seus transportes de tropas</strong>&nbsp;: é a surpresa mais cara que esse sistema pode reservar a você.</p>

            <h2 id="saque">A pilhagem (em caso de vitória)</h2>
            <p>Você recupera tantos recursos quanto houver de espaço nos seus porões depois do combate: cada Legionário sobrevivente ocupa uma vaga, cada Mecha 500 (uma barcaça oferece 1&nbsp;000 vagas). Leve cargueiros para partir com um butim de verdade. Os recursos são tomados nesta ordem:</p>
            <ol>
                <li><strong>Niobium</strong> primeiro.</li>
                <li>Depois <strong>Água</strong>.</li>
                <li>Por fim <strong>Urânio</strong> (se houver espaço restante).</li>
            </ol>

            <h2 id="bunker">O Forte defensivo protege uma parte</h2>
            <p>O <strong>Forte defensivo</strong> (bunker) do defensor <strong>põe a salvo 5&nbsp;% do armazenamento máx. por nível</strong>. Exemplos:</p>
            <ul>
                <li>Forte defensivo nível 5 → 25&nbsp;% do armazenamento máx. protegido em niobium e água.</li>
                <li>Forte defensivo nível 10 → 50&nbsp;% protegido.</li>
            </ul>
            <p>O urânio é protegido da mesma forma: <strong>5&nbsp;% do seu estoque de urânio por nível de Forte defensivo</strong> (como o urânio não tem armazenamento máx., a proteção se aplica ao estoque do momento).</p>

            <h2 id="scorched">Atenção à Terra arrasada</h2>
            <p>Se o defensor escolheu o <strong>posicionamento tático Terra arrasada</strong> e perde, <strong>metade de tudo o que resta</strong> no planeta (niobium, água, urânio) é destruída, inclusive a parte que o Forte defensivo havia posto a salvo. Você parte com seu butim, mas o adversário não pode recuperar tudo depois.</p>

    nuclear:
        title: "Ataque nuclear"
        category: "combat"
        order: 4
        tags: "nuclear,bomba,uranio,destruicao,interceptador"
        summary: "A arma definitiva para destruir os edifícios-chave de um inimigo — desde que ele não tenha defesa antimíssil."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequisitos">O que você precisa</h2>
            <ul>
                <li>A pesquisa <strong>Armamento</strong> no nível 5 e um edifício <strong>Base nuclear</strong>.</li>
                <li><strong>Urânio</strong> (muito raro).</li>
                <li>Uma <strong>bomba nuclear</strong>, fabricada na página <strong>Defesa</strong>: 500 urânio e 25&nbsp;000 Bitcoins, 6 horas por bomba (aceleradas pela Fábrica de armamento e pela Indústria pesada). Um planeta armazena no máximo tantas bombas quanto o nível da sua Base nuclear.</li>
            </ul>
            <p><strong>Lançar o ataque</strong> — a partir do <strong>mapa espacial</strong>, selecione o planeta inimigo e depois «&nbsp;Enviar um míssil nuclear&nbsp;». O jogo pega uma bomba em um dos seus planetas; ela chega em <strong>30 minutos</strong>, qualquer que seja a distância, e não pode ser cancelada. Mirar outra galáxia exige a Tecnologia hiperespaço. Um planeta protegido pelo status de novato não pode ser visado, e lançar um ataque durante a sua própria proteção faz você perdê-la (o jogo pede confirmação).</p>

            <h2 id="danos">O que faz uma bomba que atinge?</h2>
            <p>A bomba <strong>destrói um nível de edifício</strong>, em prioridade os mais estratégicos:</p>
            <ol>
                <li><strong>Metrópole</strong> — perda de 1 nível: −80&nbsp;000 trabalhadores de capacidade (os que excedem a nova capacidade desaparecem) e produção de trabalhadores reduzida.</li>
                <li><strong>Grande cidade</strong> — perda de 1 nível: −25&nbsp;000 trabalhadores de capacidade, mesma regra.</li>
                <li><strong>Forte defensivo</strong> (bunker) — perda de 1 nível: proteção contra a pilhagem reduzida e −15&nbsp;000 Legionários de capacidade.</li>
                <li><strong>Caserna</strong> — perda de 1 nível: −5&nbsp;000 Legionários de capacidade.</li>
                <li><strong>Campo de escravos</strong> — perda de 1 nível.</li>
            </ol>
            <p>A bomba atinge o primeiro edifício presente nessa ordem; se o planeta não tiver nenhum, ela não causa nenhum dano. Os Legionários além da nova capacidade também desaparecem. Em todos os casos, a bomba é consumida.</p>

            <h2 id="regra">Regras especiais</h2>
            <ul>
                <li>Uma bomba em voo <strong>não pode ser interceptada</strong> por uma frota em órbita. Ela segue direto para o alvo.</li>
                <li>A única forma de detê-la: o <strong>míssil interceptador</strong> do defensor.</li>
            </ul>

            <h2 id="anti">A defesa: o míssil interceptador</h2>
            <p>Se o planeta alvo possuir pelo menos um <strong>míssil interceptador</strong>, a bomba é automaticamente neutralizada:</p>
            <ul>
                <li>A bomba é <strong>destruída</strong>.</li>
                <li><strong>1 a 3 interceptadores</strong> são consumidos (nunca mais do que o estoque).</li>
                <li>Os dois jogadores recebem um relatório.</li>
            </ul>
            <p>Os mísseis interceptadores são fabricados na página <strong>Defesa</strong>: 10&nbsp;000 niobium e 200 urânio, 3 horas cada (pesquisa Armamento nível 5 e Base nuclear). Um planeta armazena no máximo 4 por nível de Base nuclear.</p>
            <p>Moral da história: uma base estratégica sempre vale alguns interceptadores. Sem eles, ela fica vulnerável.</p>

    defense:
        title: "Defender seus planetas"
        category: "combat"
        order: 5
        tags: "defesa,soldados,legionarios,mechas,torre,escudo,grande escudo,bunker,forte defensivo,orbital,tatico,posicionamento,estatisticas,potencia,tempo,custo"
        summary: "As 3 camadas de defesa: orbital (torres), tática (posicionamento), terrestre (Legionários + Mechas)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="visao">As 3 camadas de defesa</h2>
            <ol>
                <li><strong>Defesa orbital</strong> — torres, escudos, base espacial. Interceptam a frota antes que ela desembarque.</li>
                <li><strong>Posicionamento tático</strong> — uma escolha estratégica que modifica o revide das suas tropas em solo.</li>
                <li><strong>Defesa terrestre</strong> — Legionários, Mechas, trabalhadores (para as invasões).</li>
            </ol>

            <h2 id="modo-ataque">Ativar o modo ataque do seu planeta</h2>
            <p>Se o seu planeta possuir <strong>pelo menos uma torre</strong>, você pode ativar o <strong>modo ataque</strong>. Nesse modo, toda frota estrangeira que estaciona em órbita — exceto mercadores, membros da sua aliança e alianças ligadas à sua por uma Aliança defensiva — é engajada por um <strong>combate orbital</strong> 5 minutos após a chegada, esteja ela própria em modo ataque ou não. Um raid ou uma invasão é engajado assim que chega.</p>
            <ul>
                <li><strong>Vitória</strong>: a frota inimiga é destruída, suas torres perdem a mesma fração que a blindagem que você perdeu, e você recebe <strong>pontos de guerra</strong> iguais à assinatura dela ÷ 100 (÷ 500 diante de um Cthulhu).</li>
                <li><strong>Derrota</strong>: todas as suas torres, escudos, sua base espacial e toda a sua fila de produção da página Defesa (Legionários, Mechas, bombas ou interceptadores ainda não entregues incluídos) são aniquilados — as tropas já em solo e seus estoques de bombas e de interceptadores permanecem intactos; o modo ataque é <strong>desativado automaticamente</strong> (um planeta sem torre não pode mantê-lo ativo), e a frota continua rumo ao combate em solo se for um raid ou uma invasão. O assaltante não ganha nenhum ponto de guerra ao arrasar suas defesas.</li>
            </ul>
            <p>Sem torre, seus escudos e a base espacial são destruídos <strong>sem sequer combater</strong> assim que um raid ou uma invasão inimiga chega.</p>
            <p>Dois lugares para ativá-lo: a página <strong>Defesa</strong> de um planeta, ou a página <strong>Planetas</strong>, que exibe o estado de cada planeta (uma mira ao lado das suas defesas, clicável para alternar) e propõe <strong>«&nbsp;Ativar tudo&nbsp;»</strong> / <strong>«&nbsp;Desativar tudo&nbsp;»</strong> no império inteiro. A alternância em grupo pula os planetas sem torre ou já envolvidos em um combate, e diz quantos foram ignorados.</p>
            <p><strong>Atenção</strong>: ativar o modo ataque em um planeta que uma frota inimiga já sobrevoa desencadeia o combate orbital <strong>cinco minutos depois</strong>. Na alternância em grupo, várias batalhas podem começar de uma vez — a mensagem indica quantas.</p>
            <p><strong>O que o assaltante traz consigo.</strong> A frota que ataca suas torres combate com <strong>todos os seus bônus</strong>&nbsp;: os bônus de aliança do seu comandante (mísseis, lasers, plasma, blindagem, escudo, precisão) e os bônus de equipamento do herói embarcado. Isso vale nos dois sentidos: suas próprias frotas mantêm seus bônus quando é você que assalta um planeta em modo ataque, e os números dos relatórios orbitais estão na mesma escala que os dos relatórios espaciais.</p>

            <h2 id="defesas-e-suas-frotas">Suas defesas também atiram sem o modo ataque</h2>
            <p>O modo ataque não é a única forma de fazer suas torres atirarem. Assim que uma das suas frotas — ou uma frota <strong>armada</strong> de um membro da sua aliança — está em órbita do planeta no momento em que um combate espacial começa ali, suas defesas se juntam automaticamente a esse combate, com o modo ataque ativo ou não (um planeta que não tem nada a defender — nenhuma torre, nenhum escudo, nenhuma base espacial — nunca participa). É então uma <strong>única batalha</strong>: nenhum segundo combate orbital separado depois. Nessa batalha, o bônus de blindagem da sua <strong>base espacial</strong> (+20&nbsp;%) beneficia ao mesmo tempo suas torres e seus escudos, e a afinidade militar do seu <strong>herói posicionado</strong> reforça o tiro das suas próprias torres e pode trazer Intimidação ou Tático para todo o seu lado, exatamente como um herói de frota. Suas torres miram ali com sua própria precisão (multiplicador médio ×1,06, acima do que uma frota pode atingir), e sofrem <strong>perdas reais</strong> — proporcionais aos danos absorvidos se o seu lado vence, <strong>totais</strong> (torres, escudos, base espacial, fila de produção da página Defesa, modo ataque desligado) se o seu lado cai. Você recebe a parte de <strong>pontos de guerra</strong> do seu planeta sempre que o seu lado vence essa batalha — mesmo que você não tenha engajado nenhuma frota própria.</p>
            <p>Consequência para os seus adversários&nbsp;: um planeta guardado por uma das suas frotas <strong>armada</strong> (armas de nave) ou por uma frota armada de um membro da sua aliança (uma sonda ou um cargueiro sozinhos não contam) não pode ser saqueado ou invadido sem batalha prévia, quer o assaltante chegue de novo ou clique em «&nbsp;Saquear&nbsp;»/«&nbsp;Invadir&nbsp;» a partir da órbita — e essa batalha nunca começa contra um parceiro de paz, de pacto, uma aliança defensiva, a sua própria aliança ou em um servidor PvE.</p>
            <p>Sem nenhuma frota em órbita e sem modo ataque, suas torres não atiram: um raid ou uma invasão passa direto ao combate em solo.</p>
            <p><strong>Você não engajou nenhuma frota própria&nbsp;?</strong> Você recebe mesmo assim um relatório dedicado que informa se suas defesas resistiram ou foram aniquiladas, com as perdas de torres detalhadas, e com sua parte de pontos de guerra se você venceu&nbsp;: você nunca fica sem saber o destino do seu planeta.</p>

            <h2 id="combate-orbital">O combate orbital em detalhe</h2>
            <p>As torres atiram na frota inimiga no ritmo dos rounds (100 no máximo). A <strong>Base espacial</strong> adiciona +20&nbsp;% à blindagem de todas as defesas. Os escudos adicionam 50&nbsp;000 (Escudo) ou 600&nbsp;000 (Grande escudo) pontos à blindagem do planeta: quanto maior a sua blindagem total, menor a parte perdida — e, portanto, a parte de torres destruídas.</p>
            <p>Suas torres atiram <strong>desde o primeiro round</strong>, qualquer que seja a frota à frente: o escudo de uma nave nunca repele a salva de abertura delas. Esse escudo é uma reserva que absorve os danos até o esgotamento. Cada salva o atravessa de saída na altura do seu <strong>poder de perfuração</strong> (plasma ×4, laser ×2, mísseis ÷ 7)&nbsp;; o resto desgasta o escudo, e o que o transborda atinge o casco. Uma defesa composta apenas de lançadores de mísseis fica, portanto, em desvantagem diante de uma frota de escudo grande — mas ela atira, causa perdas e deixa detritos.</p>
            <p>Mesmo que a frota inimiga vença, sua tela de caçadores não a protege indefinidamente&nbsp;: suas torres causam perdas reais também às naves mais pesadas dela, proporcionalmente aos danos que ela absorve — no pior caso para ela, 95&nbsp;% da sua blindagem inicial. Defender-se sempre custa algo ao atacante, mesmo que ele vença. Ao fim de 100 rounds, o lado que guarda mais blindagem vence (o assaltante em caso de empate).</p>
            <p>Nesse combate orbital, nem os +20&nbsp;% de política de aliança, nem o bônus de aliança «&nbsp;defesa planetária&nbsp;» se aplicam: eles só valem nas batalhas em que suas defesas combatem ao lado de uma frota.</p>

            <h2 id="deploy">O posicionamento tático</h2>
            <p>Cada planeta pode escolher um <strong>posicionamento tático</strong>, na página <strong>Defesa</strong>, e mudá-lo livremente a qualquer momento. Ele é <strong>invisível para o atacante</strong> — é sua carta escondida.</p>
            <table>
                <thead>
                    <tr><th>Posicionamento</th><th>Efeito</th><th>Ordem das perdas da sua guarnição</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Equilibrado</strong></td><td>Nenhum bônus nem penalidade.</td><td>Legionários, depois Mechas, depois trabalhadores.</td></tr>
                    <tr><td><strong>Fortificado</strong></td><td>O revide da sua guarnição ganha 30&nbsp;% e depois perde 20&nbsp;%: ao todo <strong>+4&nbsp;%</strong> de dano causado ao assaltante. Suas unidades não ficam mais difíceis de matar.</td><td>Como Equilibrado.</td></tr>
                    <tr><td><strong>Guerrilha</strong></td><td>No revide, cada trabalhador conta 2,5 vezes (+150&nbsp;%) e cada Legionário metade (−50&nbsp;%).</td><td>Trabalhadores primeiro, depois Legionários, depois Mechas.</td></tr>
                    <tr><td><strong>Último bastião</strong></td><td>+50&nbsp;% de revide assim que suas tropas caem abaixo de 30&nbsp;% do seu efetivo inicial (em número de unidades), até o fim do combate.</td><td>Legionários, depois trabalhadores, depois Mechas.</td></tr>
                    <tr><td><strong>Terra arrasada</strong></td><td>Nenhum bônus no combate. Se você perder, raid ou invasão, 50&nbsp;% do seu niobium, da sua água e do seu urânio restantes são destruídos, parte protegida pelo Forte defensivo incluída.</td><td>Como Equilibrado.</td></tr>
                </tbody>
            </table>
            <p>Os trabalhadores só combatem em invasão.</p>

            <h2 id="combate-solo">O combate em solo</h2>
            <p>Ele se joga em <strong>10 rounds no máximo</strong>. A cada round, o assaltante causa um décimo do seu poder de ataque à sua guarnição, que revida com um décimo do seu poder de defesa. O assaltante só vence se eliminar toda a sua guarnição mantendo pelo menos um Legionário. Se ninguém vencer em 10 rounds, <strong>o atacante é repelido</strong> (vantagem do terreno).</p>

            <h2 id="tropas">As unidades terrestres</h2>
            <table>
                <thead>
                    <tr><th>Unidade</th><th>Função</th><th>Notas</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionários</strong></td><td>Ataque e defesa (potência 6 na defesa).</td><td>+5&nbsp;% de defesa por nível de Arame farpado (até +25&nbsp;%).</td></tr>
                    <tr><td><strong>Mechas</strong></td><td>Defesa pesada (potência 2&nbsp;200).</td><td>Máx. 500 por planeta. Manutenção de 2 Bitcoins por dia em solo, 100 embarcados.</td></tr>
                    <tr><td><strong>Trabalhadores</strong></td><td>Defesa passiva (potência 1).</td><td>Apenas contra as invasões, não os raids.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Recursos usados para produzir suas defesas</h2>
            <p>Como o Estaleiro espacial, a produção de defesas retira primeiro dos recursos <strong>do planeta</strong>, depois da <strong>carga das frotas estacionadas em órbita</strong>. Você pode, portanto, continuar a recrutar mesmo que o estoque em solo esteja baixo, desde que haja frotas carregadas acima do planeta.</p>

            <h2 id="instalacoes">Instalações orbitais e defesas</h2>
            <ul>
                <li><strong>Torres</strong> — Lançador de mísseis, Torre laser, Torre laser pesada, Canhão de Gauss, Artilharia de íons, Lançador de plasma. Variadas para contrapor diferentes tipos de frotas (veja a tabela abaixo).</li>
                <li><strong>Escudo</strong> — +50&nbsp;000 de blindagem, permanente (5&nbsp;000 niobium e 5&nbsp;000 água, 5 horas de construção).</li>
                <li><strong>Grande escudo</strong> — +600&nbsp;000 de blindagem por <strong>12 horas</strong> a partir da sua ativação (150&nbsp;000 niobium e 150&nbsp;000 água a cada ativação).</li>
                <li><strong>Base espacial</strong> — +20&nbsp;% de blindagem às torres e aos escudos (50&nbsp;000 niobium e 50&nbsp;000 água, 1 hora).</li>
            </ul>

            <h2 id="temps">Custos e tempos de construção</h2>
            <table>
                <thead>
                    <tr><th>Defesa</th><th>Custo</th><th>Tempo por unidade</th><th>Blindagem</th><th>Armas</th><th>Pré-requisitos</th></tr>
                </thead>
                <tbody>
                    <tr><td>Lançador de mísseis</td><td>12 niobium, 9 água</td><td>2 s</td><td>10</td><td>9 míssil</td><td>Arma míssil nív. 1</td></tr>
                    <tr><td>Torre laser</td><td>13 niobium, 12 água</td><td>2,4 s</td><td>15</td><td>6 laser</td><td>Arma laser nív. 1</td></tr>
                    <tr><td>Torre laser pesada</td><td>23 niobium, 23 água</td><td>4,4 s</td><td>25</td><td>12 laser</td><td>Arma laser nív. 3, Fábrica de armamento</td></tr>
                    <tr><td>Canhão de Gauss</td><td>50 niobium, 25 água</td><td>7,2 s</td><td>50</td><td>24 míssil</td><td>Arma míssil nív. 3, Fábrica de armamento</td></tr>
                    <tr><td>Artilharia de íons</td><td>30 niobium, 45 água</td><td>7,2 s</td><td>50</td><td>8 laser, 4 plasma</td><td>Arma míssil nív. 3, Arma laser nív. 3, Indústria pesada</td></tr>
                    <tr><td>Lançador de plasma</td><td>15 niobium, 60 água</td><td>7,2 s</td><td>50</td><td>8 plasma</td><td>Arma plasma nív. 1, Indústria pesada</td></tr>
                </tbody>
            </table>
            <p>Esses tempos são divididos pela velocidade de produção de defesas do planeta: ×1, +0,4 por nível de <strong>Fábrica de armamento</strong> e +0,6 por nível de <strong>Indústria pesada</strong>. Exemplo: 1&nbsp;000 Lançadores de mísseis levam 33 minutos sem fábrica, menos de 10 minutos com uma Fábrica de armamento nível 3 e uma Indústria pesada nível 2 (×3,4). A velocidade do servidor não muda esses tempos. A produção é feita uma linha após a outra e as unidades chegam aos poucos.</p>
            <p>Mesma aceleração para as tropas e o nuclear: Legionário 1 s, Mecha 100 s, míssil interceptador 3 h, bomba nuclear 6 h. O Escudo (5 h) e a Base espacial (1 h) têm um tempo fixo; o Grande escudo fica ativo assim que é ativado, por 12 horas.</p>

            <h2 id="stats-defensives">Ler a potência do seu planeta</h2>
            <p>A página <strong>Defesa</strong> tem duas abas. A segunda, <strong>Estatísticas defensivas</strong>, resume o que o planeta realmente vale: a blindagem, os mísseis, os lasers e os plasmas acumulados de todas as suas torres, a contribuição de cada estrutura, o efeito do escudo, do grande escudo e da base espacial sobre a blindagem realmente oposta a uma frota, e a potência da sua defesa em solo. É o meio mais rápido de identificar a estatística atrasada antes de iniciar uma nova série de construções.</p>
            <p>Um detalhe de leitura: o gráfico de pizza e as barras tratam da blindagem <strong>das estruturas apenas</strong>. Os valores fixos de escudo aparecem à parte, nos modificadores, porque senão esmagariam qualquer comparação entre as suas armas.</p>

            <h2 id="bunker">O Forte defensivo contra a pilhagem</h2>
            <p>O <strong>Forte defensivo</strong> (bunker) protege <strong>5&nbsp;% do armazenamento máx. por nível</strong> contra os raids. Um Forte defensivo de nível 5 já põe 25&nbsp;% das suas reservas de niobium e de água a salvo. O urânio é protegido na proporção de 5&nbsp;% do seu estoque por nível. Atenção: com o posicionamento Terra arrasada, metade do que resta é destruída se você perder, parte protegida incluída.</p>

            <h2 id="manutencao">Atenção ao custo de manutenção</h2>
            <p>Tudo o que está <strong>em uma frota</strong> — em voo ou estacionado — custa bem mais caro do que em solo: um Mecha passa de 2 para 100 Bitcoins por dia (×50), um Legionário de 0,1 para 0,6, uma nave da sua assinatura ÷ 12 para a sua assinatura ÷ 2. Ponha de volta em solo o que não tem missão.</p>

    embargo:
        title: "Embargo e fome"
        category: "combat"
        order: 6
        tags: "embargo,fome,bloqueio,cerco,planeta,comida,rações,abastecimento,assinatura,limite"
        summary: "Matar um planeta de fome antes de invadi-lo: o bloqueio, a fome que se instala e como sobreviver a ela."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Um <strong>embargo</strong> é um cerco planetário. Você mantém uma grande frota em modo ataque em órbita de um planeta inimigo; as entregas são cortadas, as rações se esgotam, a população sofre. Quando o planeta está enfraquecido, você parte para o assalto.</p>

            <h2 id="consumo">Lembrete: a comida</h2>
            <p>Apenas seus <strong>trabalhadores</strong> consomem rações: 1 ração por hora para 500 trabalhadores (150&nbsp;000 trabalhadores = 300 rações por hora). Legionários e Mechas não comem, mas também morrem quando a fome se instala. Se suas reservas caírem a <strong>0</strong>, é a <strong>fome</strong>.</p>
            <p>As rações são <strong>transportadas no porão</strong>: carregue-as em um planeta, descarregue-as em outro para abastecer. Enquanto uma das suas frotas estiver <strong>atracada</strong> (nem em voo, nem em combate) acima do seu planeta, as rações dela completam o celeiro — e um cerco as drena como o resto: o porão não é um cofre-forte.</p>

            <h2 id="fome">A fome (fora de embargo)</h2>
            <p>Quando as rações faltam, as perdas se encadeiam em <strong>3 fases</strong>:</p>
            <ul>
                <li><strong>Fase 1 (0–3 h)</strong> — cerca de 3&nbsp;% dos trabalhadores por hora. O tempo de reagir.</li>
                <li><strong>Fase 2 (3–8 h)</strong> — cerca de 6&nbsp;% dos trabalhadores e 2&nbsp;% dos Legionários por hora: Legionários começam a desertar.</li>
                <li><strong>Fase 3 (além de 8 h)</strong> — colapso: cerca de 11&nbsp;% dos trabalhadores, 5&nbsp;% dos Legionários e 2&nbsp;% dos Mechas por hora.</li>
            </ul>
            <p>Um piso de <strong>5&nbsp;000 trabalhadores</strong> evita o desaparecimento total. Sem reabastecimento, um planeta o atinge em cerca de 24 horas com 50&nbsp;000 trabalhadores, 30 horas com 100&nbsp;000, 33 horas com 150&nbsp;000. Assim que uma ração volta ao celeiro, a fome para e as fases recomeçam do zero. Um relatório avisa você a cada nova fase.</p>

            <h2 id="inicio">Como desencadear um embargo</h2>
            <p>Um embargo se ativa automaticamente (o jogo verifica a cada minuto) quando:</p>
            <ul>
                <li>o planeta visado pertence a um jogador (os planetas das IAs e as bases Cthulhu nunca são submetidos a ele);</li>
                <li>frotas inimigas estão ali <strong>atracadas em órbita</strong> — nem em voo, nem já engajadas em um combate programado — e em <strong>modo ataque</strong> (o que supõe armas de nave);</li>
                <li>a <strong>assinatura térmica acumulada</strong> dessas frotas atinge pelo menos <strong>10&nbsp;000</strong>.</li>
            </ul>
            <p>Todas as frotas inimigas presentes se somam, mesmo que pertençam a jogadores diferentes. Só são excluídas as frotas da aliança do proprietário e das alianças ligadas a ela por uma <strong>Aliança defensiva</strong> (um Pacto de não agressão ou um Acordo de paz não protege), assim como os mercadores. Cada nave dessas frotas conta, cargueiros e sondas incluídos; a assinatura de cada nave é indicada no Estaleiro espacial.</p>
            <table>
                <thead>
                    <tr><th>Nave</th><th>Assinatura</th><th>Número para 10&nbsp;000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Caçador</td><td>1</td><td>10&nbsp;000</td></tr>
                    <tr><td>Corveta</td><td>7</td><td>1&nbsp;429</td></tr>
                    <tr><td>Fragata</td><td>20</td><td>500</td></tr>
                    <tr><td>Nave de batalha</td><td>40</td><td>250</td></tr>
                    <tr><td>Cruzador</td><td>56</td><td>179</td></tr>
                    <tr><td>Couraçado</td><td>64</td><td>157</td></tr>
                    <tr><td>Destroyer</td><td>270</td><td>38</td></tr>
                    <tr><td>Nave mãe</td><td>4&nbsp;000 (−10&nbsp;% para toda a sua frota)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>Uma Nave mãe reduz em 10&nbsp;% a assinatura de toda a frota que a leva: 3 Naves mães sozinhas dão 12&nbsp;000 − 10&nbsp;% = 10&nbsp;800, o bastante para o limite, mas 2 não bastam (7&nbsp;200). Os números da tabela valem para uma frota sem Nave mãe; é claro que se podem misturar os tipos.</p>
            <p>Assim que a assinatura das frotas sitiantes volta a ficar abaixo de 10&nbsp;000 (partida, destruição ou modo ataque desligado), o bloqueio é levantado.</p>
            <p>Uma frota de raid ou de invasão marcada «&nbsp;em ataque&nbsp;» pela batalha fundida descrita no artigo <em>Defender seus planetas</em> mantém esse marcador se sobreviver&nbsp;: se permanecer em órbita, ela conta nessa assinatura como qualquer frota hostil.</p>

            <h2 id="efeitos">O que sofre o planeta sitiado</h2>
            <ul>
                <li><strong>Drenagem de rações</strong> adicional a cada hora: seus trabalhadores ÷ 7 (150&nbsp;000 trabalhadores = 21&nbsp;429 rações por hora), retiradas do celeiro e depois dos porões das suas frotas atracadas.</li>
                <li><strong>Produção de rações</strong> reduzida em 30&nbsp;%.</li>
                <li><strong>Produção de niobium e de água</strong> reduzida em 20&nbsp;%.</li>
                <li><strong>Nascimentos de trabalhadores</strong> divididos por dois.</li>
                <li><strong>Mercado bloqueado</strong>: nenhuma venda automática aos mercadores.</li>
                <li><strong>Entregas bloqueadas</strong>: apenas as suas frotas e as dos membros da sua aliança podem descarregar no planeta; as outras partem com a carga.</li>
                <li><strong>Heróis bloqueados</strong>: impossível designar um herói ao planeta ou retirá-lo dele.</li>
            </ul>

            <h2 id="fome-embargo">Fome sob embargo: é pior</h2>
            <p>Se as rações caírem a 0 <strong>durante</strong> um embargo, não há mais fases: desde a primeira hora, o planeta perde a cada hora <strong>8&nbsp;%</strong> dos seus trabalhadores, <strong>3&nbsp;%</strong> dos seus Legionários e <strong>3&nbsp;%</strong> dos seus Mechas, e a drenagem do embargo continua esvaziando qualquer reabastecimento que chegue. O piso de 5&nbsp;000 trabalhadores continua se aplicando.</p>

            <h2 id="tempos">Quanto tempo se aguenta?</h2>
            <p>Sob embargo, sem produção nem reabastecimento:</p>
            <table>
                <thead>
                    <tr><th>Perfil de planeta</th><th>Início da fome</th><th>Piso de 5&nbsp;000 trabalhadores atingido</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pequeno (50&nbsp;000 trabalhadores, 100&nbsp;000 rações)</td><td>~14 horas</td><td>~1,7 dia</td></tr>
                    <tr><td>Médio (150&nbsp;000 trabalhadores, 800&nbsp;000 rações)</td><td>~1,5 dia</td><td>~3,2 dias</td></tr>
                    <tr><td>Fortaleza (200&nbsp;000 trabalhadores, 2&nbsp;000&nbsp;000 rações)</td><td>~2,9 dias</td><td>~4,7 dias</td></tr>
                </tbody>
            </table>

            <h2 id="defesa">Como resistir a um embargo</h2>
            <ul>
                <li><strong>Destruir a frota sitiante</strong> para levantar o bloqueio.</li>
                <li><strong>Trazer reabastecimento</strong> — suas frotas e as dos membros da sua aliança ainda podem descarregar (missão «&nbsp;Descarregar e voltar&nbsp;»).</li>
                <li><strong>Evacuar</strong> — suas frotas <em>de saída</em> não são bloqueadas, você pode esvaziar seus recursos em caso de urgência.</li>
                <li><strong>Construir Silos agrícolas</strong> e armazenar rações <em>antes</em> que as coisas piorem.</li>
                <li><strong>Pedir ajuda à sua aliança</strong> para romper o cerco em grupo.</li>
            </ul>

            <h2 id="relatorios">Os relatórios durante um embargo</h2>
            <p>A cada hora, você (e cada jogador cuja frota sitia o planeta) recebe um relatório no menu <strong>Relatório</strong>, aba <strong>Combates</strong>: tempo decorrido, rações restantes, perdas sofridas. Um último relatório anuncia o levantamento do bloqueio. Na página <strong>Planetas</strong>, o cartão de cada planeta exibe também sua Produção, seu Consumo, a Drenagem embargo, o Balanço e a Autonomia estimada.</p>

    combat_stats:
        title: "Entendendo a potência das tropas"
        category: "combat"
        order: 7
        tags: "potencia,bonus,combate,politica,calculo,faccao,arame farpado,precisao,mechas"
        summary: "Como se compara a potência das suas unidades, e o que a impulsiona."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Potência em solo</h2>
            <p>Valores exatos, sem bônus:</p>
            <table>
                <thead>
                    <tr><th>Unidade</th><th>Potência</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mecha</strong></td><td>2&nbsp;200 na defesa</td><td>Pilar de defesa: um Mecha vale cerca de 367 Legionários. Máximo 500 por planeta. Ele só combate na defesa: embarcado em uma frota, não participa do assalto.</td></tr>
                    <tr><td><strong>Legionário (defesa)</strong></td><td>6, +5&nbsp;% por nível de Arame farpado</td><td>O coração da guarnição.</td></tr>
                    <tr><td><strong>Legionário (ataque)</strong></td><td>5 a 7 por round em invasão, 5 a 6 em raid (sorteado a cada round)</td><td>Única unidade que ataca em solo: um raid é um pouco menos imprevisível que uma invasão.</td></tr>
                    <tr><td><strong>Trabalhador (defesa)</strong></td><td>1</td><td>Apenas em invasão. 200&nbsp;000 trabalhadores pesam tanto quanto cerca de 91 Mechas.</td></tr>
                </tbody>
            </table>
            <p>A cada round (10 no máximo), o assaltante causa um décimo do seu poder de ataque à guarnição, que revida com um décimo do seu poder de defesa. Os danos matam as unidades segundo a potência delas: são necessários 6 pontos para um Legionário defensor sem bônus, 2&nbsp;200 para um Mecha, 1 para um trabalhador. Exemplo: 10&nbsp;000 Legionários em invasão (sorteio médio de 6) causam cerca de 6&nbsp;000 pontos por round, o suficiente para matar 1&nbsp;000 Legionários sem bônus, ou menos de 3 Mechas.</p>
            <p>As <strong>barcaças</strong> não combatem: elas transportam 1&nbsp;000 Legionários cada (+25&nbsp;% por nível da pesquisa política «&nbsp;Invasões planejadas&nbsp;»).</p>

            <h2 id="bonus">O que aumenta sua potência</h2>
            <ul>
                <li><strong>Pesquisa Arame farpado</strong> — +5&nbsp;% de defesa por nível para seus Legionários (5 níveis, ou seja, +25&nbsp;% no máximo).</li>
                <li><strong>Pesquisas políticas</strong> (aba «&nbsp;Políticas&nbsp;» da página Pesquisas) — Potência militar (+10&nbsp;% por nível no ataque e na defesa dos Legionários), Blindagem de mechas (+10&nbsp;% por nível na defesa dos Mechas), Reforço ideológico (+20&nbsp;% por nível na defesa dos trabalhadores), Invasões planejadas (+25&nbsp;% de capacidade por barcaça e por nível), Armamentos melhorados (+10&nbsp;% por nível nos mísseis e lasers das naves), Blindagem de naves (+10&nbsp;% de blindagem das naves por nível).</li>
                <li><strong>Melhorias de aliança</strong> — no combate espacial, até +5&nbsp;% por tipo de arma, de blindagem, de escudo e de precisão das naves, e até +10&nbsp;% para as defesas planetárias.</li>
                <li><strong>Posicionamento tático</strong> — escolha do defensor que modifica o revide da sua guarnição e a ordem das suas perdas (veja <em>Invasão de planeta</em>).</li>
                <li><strong>Herói Militar</strong> — bônus direto de ataque e de defesa, tanto para o herói da frota assaltante quanto para o posicionado no planeta.</li>
                <li><strong>Itens</strong> equipados no herói.</li>
            </ul>
            <p>A pesquisa <strong>Crescimento militar</strong> não dá nenhum bônus de combate: ela desbloqueia a Caserna (nível 1), o Forte defensivo (nível 3), depois as pesquisas Arame farpado e Unidades blindadas (Mechas).</p>

            <h2 id="faction">Bônus político (combates espaciais)</h2>
            <p>O bônus de armas do combate espacial vem da <strong>política da sua aliança</strong>. Cada regime vence seu rival: <strong>A Balança dos Mundos</strong> vence <strong>O Baluarte Silencioso</strong>, que vence <strong>O Martelo das Estrelas</strong>, que vence <strong>A Balança dos Mundos</strong>.</p>
            <p>Quando a política do <strong>atacante</strong> vence a do defensor, todas as suas armas (mísseis, lasers, plasma) ganham <strong>+20&nbsp;%</strong> para esse combate. O bônus só se aplica ao assaltante: o defensor conta com suas defesas planetárias. Ele vale no combate entre frotas apenas, não contra torres sozinhas (combate orbital do modo ataque) nem em solo.</p>

            <h2 id="precision">Precisão e sorteios de combate</h2>
            <p>No combate espacial, cada lado dispara <strong>uma salva por round</strong>. Um sorteio aleatório, feito entre a precisão do lado e 100 e depois dividido por 80, modula os danos da salva de <strong>×0,3 a ×1,2</strong>. Nenhuma salva erra: uma precisão alta não torna seus melhores golpes mais fortes, ela elimina os maus sorteios.</p>
            <p>A mira de uma frota nunca é exibida em porcentagem&nbsp;: em todo lugar — Estaleiro espacial, página de gestão de frota, aba Estatísticas defensivas da página Defesa e relatórios de combate — o jogo mostra o <strong>multiplicador de dano médio</strong> que ela produz:</p>
            <ul>
                <li><strong>×0,66</strong> sem nenhum investimento: cada salva fica entre ×0,3 e ×1,2;</li>
                <li><strong>×0,94</strong> com mira cheia: cada salva fica entre ×0,63 e ×1,2;</li>
                <li><strong>×1,06</strong> para as defesas de um planeta: cada salva fica entre ×0,88 e ×1,2 — melhor que uma frota com mira cheia.</li>
            </ul>
            <p>Esse nível depende dos pontos de <strong>personalização</strong> investidos em precisão para cada modelo de nave (40 pontos/dia) e é próprio dele&nbsp;: gastar seus pontos em outro lugar, na blindagem ou nas armas do mesmo modelo, nunca o faz descer. Os bônus de precisão de aliança e de herói se somam, sem nunca ultrapassar a mira cheia. Quando várias frotas combatem juntas, o lado usa a média das suas miras.</p>
            <p>Diante de um adversário dirigido pela IA (bot), sua mira nunca desce abaixo de um piso fixo (multiplicador médio ×0,81)&nbsp;: um bot que realmente investiu o ultrapassa, e um jogador suficientemente investido pode igualá-lo ou ultrapassá-lo. As hordas Cthulhu sempre miram a ×0,94.</p>

    reports:
        title: "Os relatórios do jogo"
        category: "beginner"
        order: 9
        tags: "relatorio,notificacao,combate,espionagem,alianca,colonizacao,abas,excluir,compartilhar"
        summary: "O jogo envia relatórios para todo evento importante. Veja onde encontrá-los, o que contêm e como gerenciá-los."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="onde">Onde encontrar seus relatórios?</h2>
            <p>Abra <strong>Relatório</strong> no menu (no celular: botão <strong>Menu</strong> e depois <strong>Relatório</strong>). O número de novos relatórios aparece nessa entrada.</p>
            <p>A página abre na aba <strong>Todos</strong> (seus 300 relatórios mais recentes). As outras abas classificam por categoria: <strong>Outro</strong>, <strong>Aliança</strong>, <strong>Cthulhu</strong>, <strong>Combates</strong>, <strong>Invasões</strong>, <strong>Econômicos</strong> e <strong>Frotas</strong>. Uma aba só aparece se contiver pelo menos um relatório, e exibe seu número de não lidos. Cada relatório não lido traz a menção «&nbsp;Não lido&nbsp;»: toque na linha dele para abri-lo.</p>
            <p>As mensagens dos outros jogadores não estão aqui: estão em <strong>Mensagens</strong>.</p>
            <p>Você também pode ativar as <strong>notificações push</strong> para ser alertado no seu celular ou no seu navegador (veja o artigo dedicado).</p>

            <h2 id="gerer">Ler, compartilhar, excluir</h2>
            <ul>
                <li><strong>Marcar como lido</strong>: botão de um relatório aberto (abri-lo também basta). <strong>Marcar tudo como lido</strong>, no alto da página, trata todos os seus relatórios de uma vez.</li>
                <li><strong>Gerar link de compartilhamento</strong>: cria um link público para esse relatório; o botão <strong>Link</strong> o copia. Qualquer pessoa que tenha esse link pode ler o relatório, mesmo sem conta.</li>
                <li><strong>Excluir</strong>: apaga o relatório na hora, sem confirmação nem lixeira.</li>
            </ul>
            <p>A exclusão é feita relatório por relatório: não existe arquivamento nem exclusão em massa. Seus relatórios não se apagam sozinhos com o tempo.</p>

            <h2 id="combate">Relatórios de combate e de invasão</h2>
            <p>Aba <strong>Combates</strong>:</p>
            <ul>
                <li><strong>Relatório de combate: Vitória / Derrota</strong> — uma das suas frotas enfrentou uma frota inimiga (combate espacial).</li>
                <li><strong>Defesa orbital: Vitória / Derrota</strong> — as defesas do seu planeta enfrentaram uma frota inimiga; o atacante recebe, por sua vez, <strong>Ataque orbital: Vitória / Derrota</strong>.</li>
                <li><strong>Defesas planetárias: Resistiram / Destruídas</strong> — relatório dedicado ao proprietário que não engajou nenhuma frota própria em uma batalha fundida: suas defesas resistiram ou foram aniquiladas.</li>
                <li><strong>Míssil nuclear</strong> — seu míssil atingiu o alvo ou foi interceptado; um míssil atingiu você ou foi interceptado na sua casa.</li>
                <li><strong>Seu planeta está sob embargo!</strong> — um relatório a cada hora enquanto um dos seus planetas estiver sitiado, depois um último relatório quando o embargo for levantado. Os sitiantes também recebem o deles.</li>
                <li><strong>Fome no seu planeta!</strong> — suas rações acabaram e a fome faz vítimas.</li>
            </ul>
            <p>Aba <strong>Invasões</strong>:</p>
            <ul>
                <li><strong>Relatório de pilhagem</strong> — raid sofrido ou infligido (vitória ou derrota, no ataque ou na defesa).</li>
                <li><strong>Relatório de invasão</strong> — tentativa de tomada de planeta, de um lado ou do outro.</li>
            </ul>

            <h2 id="cthulhu">Relatórios Cthulhu</h2>
            <ul>
                <li><strong>Alerta: horda a caminho</strong> — uma horda Cthulhu se dirige a um dos seus planetas.</li>
                <li><strong>Relatório dos possuídos: Vitória defensiva / Ataque sofrido</strong> — o resultado do ataque de uma horda contra o seu planeta. Na dificuldade PvE Difícil, o título passa a ser <strong>Relatório de ataque dos possuídos: Vitória / Derrota</strong>.</li>
                <li><strong>Tower Defense Cthulhu: Vitória / Derrota</strong> — o resultado da sua defesa ativa.</li>
                <li><strong>Relatório de contra-ataque: Vitória / Derrota</strong> — sua invasão de um planeta dominado pelos Cthulhu. Uma vitória liberta o planeta: ele volta a ficar livre, e a colmeia não pode retomá-lo por 72 horas.</li>
                <li><strong>Bloqueio de Cthulhu</strong>, <strong>A colmeia se expande</strong>, <strong>Erupção da colmeia</strong> — os eventos Cthulhu do seu setor e suas consequências.</li>
            </ul>

            <h2 id="frota">Relatórios de frota</h2>
            <p>Aba <strong>Frotas</strong>:</p>
            <ul>
                <li><strong>Sua frota chegou</strong> — sua frota alcançou o destino.</li>
                <li><strong>Depósito de recursos</strong> — outro jogador descarregou recursos em um dos seus planetas.</li>
                <li><strong>Sua frota parou de reciclar!</strong> — seus recicladores terminaram o trabalho.</li>
            </ul>
            <p>A espionagem fica na aba <strong>Outro</strong>: <strong>Análise do planeta</strong> (o resultado da sua sonda) e <strong>Espionagem detectada</strong> (alguém tentou espionar um dos seus planetas).</p>

            <h2 id="alianca">Relatórios de aliança</h2>
            <ul>
                <li><strong>Diplomacia</strong> — Guerra declarada (pela sua aliança) ou Guerra recebida, aliança defensiva firmada ou rompida, pacto de não agressão firmado ou rompido, acordo de paz firmado ou expirado.</li>
                <li><strong>Membros</strong> — Novo membro, Membro saiu, Membro expulso, Membro Game Over.</li>
            </ul>

            <h2 id="diversos">Outros relatórios</h2>
            <p>Aba <strong>Econômicos</strong>:</p>
            <ul>
                <li><strong>Relatório do império</strong> — seu balanço econômico diário, todo dia às 18h59 (hora de Paris).</li>
                <li><strong>⚠ Falência iminente!</strong> — suas despesas diárias superam seus ganhos e seus Bitcoins não cobrem mais um dia de déficit (no máximo um alerta por 24 horas).</li>
                <li><strong>Venda aos mercadores</strong> — sua frota vendeu sua carga a um mercador.</li>
                <li><strong>Bônus de conexão</strong> — os Bitcoins do dia e, em certos dias, um item.</li>
            </ul>
            <p>Aba <strong>Outro</strong>:</p>
            <ul>
                <li><strong>Colonização de planeta</strong> — novo planeta fundado.</li>
                <li><strong>Análise do planeta</strong> e <strong>Espionagem detectada</strong> — veja acima.</li>
                <li><strong>Filas concluídas</strong> (Edifícios, Naves, Defesa, Pesquisa) — a fila está vazia: você pode reiniciar.</li>
                <li><strong>Herói e prisão</strong> — herói capturado, fugido, libertado ou executado, alerta de prisão, posição revelada, item roubado ou encontrado, novo herói, pedidos de resgate.</li>
                <li><strong>Arena</strong> — desafio recebido, resultado de duelo, torneio, recompensa semanal, arena de aliança.</li>
                <li><strong>Diversos</strong> — fim da sua proteção de novato, frota repelida, missão lunar fracassada.</li>
            </ul>

            <h2 id="compte-valide">Conta a validar</h2>
            <p>⚠️ Para <strong>enviar uma mensagem ou Bitcoins</strong> a outro jogador, e para criar ou entrar em uma aliança, sua conta deve estar <strong>validada</strong> e seu <strong>e-mail confirmado</strong>.</p>
            <p>Uma conta de teste (criada com «&nbsp;Testar sem email&nbsp;») é validada pela entrada <strong>Validar conta</strong> do menu: você escolhe ali um apelido, uma senha e seu endereço de e-mail. Um e-mail de confirmação é então enviado: clique no link dele. Não o recebeu? Abra <strong>Opções</strong> (embaixo do menu no computador, no painel Menu no celular): a seção <strong>Confirmar meu endereço de e-mail</strong> permite <strong>reenviá-lo</strong> (três vezes por hora no máximo).</p>

    battle_reports:
        title: "Lendo um relatório de combate"
        category: "combat"
        order: 8
        tags: "relatorio,combate,vitoria,derrota,analise"
        summary: "Depois de cada combate, um relatório detalhado. Veja como decodificá-lo para atacar melhor da próxima vez."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="onde">Onde encontrá-los</h2>
            <p>Todos os relatórios de combate chegam ao menu <strong>Relatório</strong>. A aba <strong>Combates</strong> reúne os combates espaciais e orbitais, as defesas planetárias, o nuclear, o embargo e a fome; a aba <strong>Invasões</strong> reúne os raids e as invasões; os combates contra os Cthulhu têm sua própria aba <strong>Cthulhu</strong>.</p>

            <h2 id="tipos">Tipos de relatórios de combate</h2>
            <ul>
                <li><strong>Combate espacial</strong> — duas frotas se cruzaram.</li>
                <li><strong>Combate orbital</strong> — suas defesas planetárias interceptaram uma frota.</li>
                <li><strong>Defesas planetárias</strong> — batalha fundida em que você não engajou nenhuma frota própria: suas torres, escudos e base espacial resistiram, ou foram destruídos.</li>
                <li><strong>Frota desarmada destruída</strong> — um lado sem arma de nave (cargueiros, sondas, recicladores) foi destruído sem combate.</li>
                <li><strong>Raid</strong> — tentativa de pilhagem (do seu lado ou contra você).</li>
                <li><strong>Invasão</strong> — tentativa de tomada de planeta.</li>
                <li><strong>Nuclear</strong> — bomba enviada ou recebida, ou interceptada.</li>
                <li><strong>Embargo</strong> — relatório por hora durante um cerco, e um último quando ele é levantado.</li>
                <li><strong>Fome</strong> — enviado a cada nova fase de fome (fora de embargo).</li>
            </ul>

            <h2 id="contenu">O que um relatório contém</h2>
            <ul>
                <li><strong>Forças engajadas</strong> — blindagem inicial, escudo, armas de cada lado, e a composição de cada frota. A mira não aparece ali em porcentagem, mas sob a forma do <strong>multiplicador de dano médio</strong> que ela produz (×0,66 sem nenhum investimento, ×0,94 com mira cheia, ×1,06 para as defesas de um planeta): nenhum tiro erra jamais, uma mira melhor eleva o piso dos seus danos.</li>
                <li><strong>Salvas</strong> — o número de salvas disparadas por esse lado, as que passaram pelo escudo adversário, e se o escudo dele próprio foi perfurado ou resistiu.</li>
                <li><strong>Carga de escudo</strong> — para um bloco de frota, a porcentagem de carga no início e no fim do combate, com sua capacidade total: seu escudo não volta sistematicamente a 100&nbsp;% de um combate para outro, ele se recarrega progressivamente (veja o artigo <em>Combate espacial</em>).</li>
                <li><strong>Blindagem restante</strong> — o que continua de pé, e sua parte da blindagem inicial. Um lado aniquilado exibe em vez disso o <strong>excedente de danos</strong> absorvido além da sua blindagem: é a sua margem de vitória.</li>
                <li><strong>Danos absorvidos</strong> — dois contadores por lado: <strong>casco</strong> (o que não foi detido pelo escudo) e <strong>escudo</strong> (o que o escudo absorveu). Suas perdas decorrem apenas do casco.</li>
                <li><strong>Perdas</strong> — nave por nave, de cada lado.</li>
                <li><strong>Defesas planetárias detalhadas</strong> — perdas de torres, mais o seu Escudo, Grande escudo e Base espacial quando você os possui, com a pontuação de defesa e a etiqueta «&nbsp;Ataque&nbsp;» do planeta para uma batalha fundida.</li>
                <li><strong>Recursos pilhados</strong> (para os raids) e <strong>detritos gerados</strong> — para reciclar!</li>
                <li><strong>Pontos de Guerra ganhos</strong> e resultado final.</li>
            </ul>

            <h2 id="analyser">Como tirar uma lição disso</h2>
            <ul>
                <li>Olhe primeiro os <strong>danos absorvidos</strong>: a linha «&nbsp;casco&nbsp;» conta tudo o que não foi detido pelo seu escudo (a parte que o perfura, depois tudo quando ele está vazio); a linha «&nbsp;escudo&nbsp;», o que o seu escudo absorveu — isso não custa nenhuma nave, apenas carga, que sobe 10&nbsp;% a cada 3 horas.</li>
                <li>Compare os dois <strong>multiplicadores de dano</strong>: é o único número diretamente comparável de um lado ao outro. Depois olhe a <strong>blindagem restante</strong> — vencer mantendo 5&nbsp;% da sua blindagem e vencer mantendo 70&nbsp;% não se equivalem. Um grande excedente no adversário significa que você pagou caro demais pela vitória.</li>
                <li>Perdas nos seus <strong>caçadores</strong> são normais mesmo quando o seu escudo resiste: sem escudo, eles absorvem sua parte do casco proporcionalmente à blindagem deles, mais até a metade dos golpes destinados às suas naves pesadas — é o papel deles de tela.</li>
                <li>Muitas <strong>salvas passadas pelo escudo adversário</strong>? Suba o plasma (×4 contra os escudos) para perfurar mais rápido.</li>
                <li><strong>100 rounds atingidos</strong>: o lado que guarda mais blindagem vence (o atacante em caso de empate) — se isso acontece com você no ataque, sua frota carece de potência ou de precisão.</li>
                <li><strong>Guarde seus relatórios importantes</strong> (não os exclua) e use «&nbsp;Gerar link de compartilhamento&nbsp;» para mostrá-los à sua aliança: eles servem de provas nos debates.</li>
            </ul>

    combat_simulator:
        title: "Simulador de combate"
        category: "combat"
        order: 9
        tags: "simulador,combate,simulacao,frota,perdas,estimativa,relatorio"
        summary: "Estime seus riscos antes de atacar: refaça mil vezes um combate contra uma frota observada em um relatório, com o verdadeiro motor do jogo."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="proposito">Para que serve</h2>
            <p>A aba <strong>Simulador de combate</strong> da página Frotas estima o que você arrisca antes de atacar. Ela refaz <strong>1&nbsp;000 vezes</strong> um combate entre uma das suas frotas e uma frota adversária, com o <strong>verdadeiro motor do jogo</strong> — mesmas fórmulas, mesmos sorteios aleatórios. Nada é realmente engajado: nenhuma nave se move, nenhuma morre.</p>

            <h2 id="fonte">A fonte: um relatório de combate</h2>
            <p>A frota adversária vem de um dos seus <strong>relatórios de combate espacial recentes</strong> (aqueles que exibem a linha «&nbsp;Danos absorvidos&nbsp;»): são as únicas fontes honestas, pois contêm a potência real do lado observado, bônus incluídos. O simulador propõe os 30 mais recentes; os relatórios orbitais, de raid ou de invasão não servem de fonte. Um relatório de espionagem só dá números de naves, sem suas estatísticas reais — a simulação seria mentirosa, por isso ele não é proposto.</p>
            <p>Escolha o relatório, o lado a enfrentar (uma das duas armadas do relatório), depois uma das suas frotas armadas, onde quer que ela esteja. Você sempre simula na posição de <strong>atacante</strong>, fora de casa: sem suas torres nem seus escudos planetários, com seus bônus reais (herói, aliança, política comparada à da aliança atual do adversário) e o escudo que sua frota tem <strong>neste momento</strong> — uma frota desgastada é simulada desgastada.</p>

            <h2 id="ler">Ler o resultado</h2>
            <ul>
                <li><strong>Taxa de vitória</strong> — a parte dos 1&nbsp;000 sorteios em que você vence.</li>
                <li><strong>Faixa de perdas por nave</strong> (mínimo, mediana, máximo) — apenas nos sorteios vitoriosos: em caso de derrota, sua frota seria integralmente destruída.</li>
                <li><strong>Um exemplo de desenrolar</strong> — um sorteio vitorioso mediano, apresentado como um relatório e claramente marcado «&nbsp;SIMULAÇÃO&nbsp;».</li>
            </ul>

            <h2 id="limites">Os limites a ter em mente</h2>
            <ul>
                <li>A frota adversária é a <strong>observada na data do relatório</strong>: ela pode ter sido reconstruída, melhorada ou reforçada desde então.</li>
                <li>Os talentos ativos do herói adversário (Intimidação, Tático) não são refeitos; seus bônus passivos já estão incluídos nos números do relatório. As defesas planetárias dele só contam se o relatório fonte era um combate na casa dele (como estavam naquele dia): se você o ataca na casa dele a partir de um relatório obtido em outro lugar, as torres dele não estão ali.</li>
                <li><strong>Sem simulação como defensor</strong>: sua frota é sempre o atacante, fora de casa. Para avaliar uma ameaça, simule sua frota contra a frota inimiga do seu relatório: suas torres e escudos planetários não são contados ali (um combate de verdade na sua casa será mais favorável), mas o inimigo também não recebe ali os +20&nbsp;% que teria no ataque se seu regime vence o seu.</li>
                <li>Limite de <strong>20 simulações por dia</strong> (zerado à meia-noite, hora de Paris; o contador restante é exibido): o simulador esclarece uma decisão, não substitui o risco do combate.</li>
            </ul>

    colonization:
        title: "Colonizar um novo planeta"
        category: "planet"
        order: 1
        tags: "colonizacao,planeta,colonizador,terraformacao,desabitado,teto"
        summary: "Expandir seu império colonizando planetas desabitados: como fazer, teto de planetas definido pela Terraformação, tamanhos disponíveis."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="porque">Por que colonizar?</h2>
            <ul>
                <li><strong>Mais produção</strong>: cada planeta tem sua própria economia.</li>
                <li><strong>Mais filas de construção</strong> em paralelo.</li>
                <li><strong>Menos risco</strong>: seus ovos não estão mais na mesma cesta.</li>
                <li><strong>Posições estratégicas</strong>: proximidade de mercadores, de aliados, de alvos.</li>
            </ul>

            <h2 id="etapas">Como colonizar</h2>
            <p>Coloniza-se um <strong>planeta desabitado</strong>: no mapa, ele leva o nome «&nbsp;Desabitado&nbsp;». Uma vaga «&nbsp;Vazio&nbsp;» (sem planeta) não pode ser colonizada.</p>
            <ol>
                <li>Verifique se ainda resta uma vaga: você pode ter <strong>2 planetas + 1 por nível de Terraformação</strong> (veja mais abaixo). Você começa com <strong>um colonizador</strong> em solo no seu planeta: seu 2º planeta não exige, portanto, nenhuma pesquisa.</li>
                <li>Para fabricar outros colonizadores, pesquise <strong>Terraformação</strong> nível 1. Eles são construídos no Estaleiro espacial: 5&nbsp;500 niobium, 7&nbsp;000 água, 2&nbsp;000 trabalhadores e 5 Legionários cada.</li>
                <li>Crie uma frota que contenha o colonizador (página <em>Frotas</em>, ou botão <em>Criar frota</em> do mapa).</li>
                <li>No <em>Mapa espacial</em>, clique no planeta desabitado e depois em <em>Interação</em>. Escolha a frota, a missão <strong>Colonizar</strong> e depois <em>Enviar</em>. O voo é pago em Bitcoins.</li>
            </ol>
            <p>Se sua frota já estiver em órbita de um planeta desabitado, o botão <em>Colonizar</em> aparece diretamente na ficha dela.</p>
            <p>O colonizador não leva recursos. Para ajudar a colônia, junte cargueiros carregados à frota e depois descarregue-os na chegada (<em>Descarregar tudo</em>).</p>
            <p>Na chegada, um colonizador é consumido e o planeta é fundado com o nome «&nbsp;Colônia&nbsp;». Você recebe um relatório, e o planeta aparece no seletor de planetas da barra superior. Renomeie-o pela página <strong>Planetas</strong>.</p>

            <h2 id="inicial">O que ela tem no início</h2>
            <p>Um planeta recém-colonizado começa com <strong>200 niobium, 150 água, 2&nbsp;500 trabalhadores e 20 Legionários</strong>. Todo o resto precisa ser construído: um planeta que nunca foi habitado não tem nenhum edifício, nem mesmo Estaleiro espacial.</p>

            <h2 id="limite">Quantos planetas no máximo?</h2>
            <p>Você pode possuir <strong>2 planetas + 1 por nível de Terraformação</strong> (18 níveis no máximo). Suas luas não contam.</p>
            <table>
                <thead>
                    <tr><th>Terraformação</th><th>Planetas máx.</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>Em uma aliança do regime <em>A Balança dos Mundos</em>, a pesquisa de aliança <strong>Contribuição da Democracia</strong> adiciona 1 planeta colonizável por nível (5 níveis, ou seja, até 25 planetas).</li>
                <li>Para as <strong>invasões</strong>, o teto é 2 + Terraformação + o nível de <strong>Império sem fronteiras</strong> (pesquisa de aliança dos regimes <em>O Martelo das Estrelas</em> e <em>O Baluarte Silencioso</em>, 5 níveis). Se você invadir além disso, o planeta conquistado vira uma base Cthulhu em vez de ficar com você.</li>
                <li>Nos modos <em>Pesquisa &amp; Destruição</em>, <em>Dominação</em> e <em>Battle Royale</em>, todas as pesquisas estão no máximo desde o início: 20 planetas de saída.</li>
            </ul>

            <h2 id="escolha">Onde colonizar?</h2>
            <ul>
                <li>Perto de um <strong>mercador</strong>: economia fácil no envio de cargueiros.</li>
                <li>Perto dos seus <strong>aliados</strong>: defesa mútua.</li>
                <li>Em um planeta com <strong>muito terreno</strong>: o tamanho não muda a produção, mas dá mais espaço para construir. No mapa, quanto maior o ícone de um planeta, mais terreno ele tem.</li>
                <li>Evite se isolar longe demais de tudo: trajetos mais longos, reabastecimento complicado.</li>
            </ul>
            <p>Não há <strong>nenhum limite de tamanho</strong>: qualquer planeta desabitado pode ser colonizado, pequeno ou grande, desde que ainda reste uma vaga. Tamanhos de origem dos planetas livres:</p>
            <table>
                <thead>
                    <tr><th>Onde</th><th>Terreno</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>Sistemas da borda da galáxia (1 a 9, 92 a 99, e os que terminam em 0 ou 1)</td><td>80 – 95 (algumas de 25)</td><td>2 – 21 (5 para as de 25)</td></tr>
                    <tr><td>Sistemas 45, 46, 55 e 56 (centro)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>Todos os outros sistemas</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>As maiores, no centro, são guardadas por uma horda alien massiva: um colonizador enviado sozinho ali seria destruído. Quando o planeta for seu, a Cidade flutuante adiciona até 50 terrenos e a Estação orbital até 25 espaços (pesquisa <em>Expansão territorial</em>, veja <em>Gerenciar um planeta</em>).</p>

    planet_types:
        title: "Tudo o que se encontra no mapa"
        category: "planet"
        order: 2
        tags: "planeta,desabitado,lua,sol,mercador,alien,detritos,asteroide,cthulhu,colonizacao"
        summary: "Os diferentes objetos visíveis no mapa galáctico e o que se pode fazer com eles."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="tipos">Os 8 tipos de objetos</h2>
            <table>
                <thead>
                    <tr><th>Tipo</th><th>Descrição</th><th>Ações possíveis</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Planeta habitado</strong></td><td>Pertence a um jogador (ou a um bot), que constrói, produz e estaciona suas tropas ali.</td><td>Sondar, saquear, invadir, ataque nuclear, atacar as frotas em órbita.</td></tr>
                    <tr><td><strong>Planeta desabitado</strong></td><td>Planeta livre, chamado «&nbsp;Desabitado&nbsp;» no mapa. Quanto maior o ícone, mais terreno ele tem.</td><td><strong>Colonizar.</strong></td></tr>
                    <tr><td><strong>Lua</strong></td><td>Criada por um Lunar em uma vaga vazia rica em detritos. Produz 20 rações por minuto.</td><td>Saquear ou invadir com uma frota em órbita, ataque nuclear, atacar as frotas em órbita. Uma lua não pode ser sondada.</td></tr>
                    <tr><td><strong>Sol</strong></td><td>Sempre na posição 13 de cada sistema. Não colonizável.</td><td>Nenhuma.</td></tr>
                    <tr><td><strong>Vaga vazia</strong></td><td>Posição «&nbsp;Vazio&nbsp;», sem planeta. Não colonizável.</td><td>Criar uma lua (se contiver pelo menos 2M de niobium e 2M de água em detritos), implantar um radar, implantar um bloqueador.</td></tr>
                    <tr><td><strong>Mercador</strong></td><td>NPC que não pode ser saqueado nem invadido. Ele compra seus recursos em troca de Bitcoins.</td><td>Vender (missão <em>Descarregar e voltar</em>).</td></tr>
                    <tr><td><strong>Base alien / Cthulhu</strong></td><td>Base da colmeia, defendida por uma guarnição permanente.</td><td>Invadir para libertá-la (urânio, pontos de guerra e recuo da Ameaça do universo).</td></tr>
                    <tr><td><strong>Campo de asteroides</strong></td><td>Aparece sozinho: niobium, água ou urânio. Recarrega-se a cada 7 a 40 horas e costuma ser guardado por aliens.</td><td>Reciclar.</td></tr>
                </tbody>
            </table>
            <p>Depois de um combate, <strong>detritos</strong> (niobium e água) também podem flutuar em qualquer posição, planeta incluído: um ícone os sinaliza. Veja o artigo <em>Reciclagem</em>.</p>

            <h2 id="identificar">Identificá-los no mapa</h2>
            <p>Cada tipo tem seu ícone, e o tamanho de um planeta no mapa reflete seu terreno. Clique (ou toque) em um objeto para abrir sua ficha: proprietário, terreno e espaço exatos (se a posição estiver no alcance dos seus radares), detritos eventuais. O botão <em>Interação</em> da ficha dá acesso às ações e ao envio de uma frota; ele aparece assim que você tem pelo menos uma frota parada.</p>

            <h2 id="luas">Caso particular: as luas</h2>
            <p>As luas são criadas com uma nave especial, o <strong>Lunar</strong> (às vezes chamado de Moon Maker), em uma vaga vazia que contenha pelo menos 2M de niobium e 2M de água em detritos. Uma lua produz uma quantidade fixa de <strong>20 rações por minuto</strong> (1&nbsp;200 por hora antes dos bônus): tanto quanto um Campo agrícola de nível 7 a 8 em um planeta. Suas rações ficam na lua: transporte-as de cargueiro para os planetas que precisarem delas. Veja o artigo <em>As luas</em>.</p>

    planet_management:
        title: "Gerenciar um planeta"
        category: "planet"
        order: 3
        tags: "gestao,planeta,producao,capacidade,especializacao,terreno,cidade flutuante,estacao orbital,heroi"
        summary: "Como otimizar a produção, organizar seu espaço e, eventualmente, especializar um planeta."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basico">As bases a dominar</h2>
            <ul>
                <li><strong>Níveis de produção</strong>: suba regularmente a Mina de niobium, o Extrator de água e o Campo agrícola.</li>
                <li><strong>Armazenamento</strong>: sem estoques suficientes (Armazém de Niobium, Reservatório de água, Silo agrícola), a produção satura e para.</li>
                <li><strong>População</strong>: a Grande cidade (+25&nbsp;000 trabalhadores no máximo por nível) e a Metrópole (+80&nbsp;000) aumentam seu teto de trabalhadores e a velocidade de chegada deles; o Campo de escravos adiciona 2&nbsp;500 vagas por nível.</li>
                <li><strong>Defesa mínima</strong>: um Forte defensivo e alguns Mechas, é a base.</li>
            </ul>

            <h2 id="otimizar">Otimizar um planeta</h2>
            <ol>
                <li>Construa edifícios de produção <strong>em par</strong> (Mina e Extrator costumam subir juntos).</li>
                <li>Falta de espaço? Pesquise <strong>Expansão territorial</strong> (disponível após Terraformação nível 18) e depois construa:
                    <ul>
                        <li>a <strong>Cidade flutuante</strong> (nível 1 de Expansão territorial): +10 terreno por nível;</li>
                        <li>a <strong>Estação orbital</strong> (nível 2): +5 espaço por nível.</li>
                    </ul>
                    Cada uma sobe até o nível 5 e é paga em pontos de guerra: 2&nbsp;000 × o nível visado (30&nbsp;000 pontos de guerra para os 5 níveis). Caso contrário, destrua um edifício que se tornou inútil.</li>
                <li>Fique de olho na <strong>autonomia alimentar</strong>. Apenas os trabalhadores comem, à razão de 1 ração por hora para 500 trabalhadores. Um nível de Campo agrícola alimenta 81&nbsp;000, um nível de Fazenda aeropônica 111&nbsp;000.</li>
                <li>Uma <strong>lua</strong> produz 1&nbsp;200 rações por hora. Transporte-as de cargueiro para os seus planetas, ou deixe uma frota carregada de rações em órbita: o planeta retira dela quando seu celeiro está vazio.</li>
            </ol>

            <h2 id="especializar">Especializar seus planetas</h2>
            <p>Vários planetas = possibilidade de especializá-los conforme sua posição e seus edifícios:</p>
            <ul>
                <li><strong>Planeta econômico</strong>: muitas minas, trabalhadores, venda aos mercadores próximos.</li>
                <li><strong>Planeta militar</strong>: Estaleiro espacial, Fábrica de armamento, Indústria pesada, grandes defesas, para estacionar sua frota ali.</li>
                <li><strong>Planeta de pesquisa</strong>: Centro de pesquisa em nível alto para abrigar muitos cientistas (veja <em>Trabalhadores e cientistas</em> para o efeito real deles na velocidade de pesquisa).</li>
                <li><strong>Posto avançado de fronteira</strong>: Radar espacial, Bloqueador de radar, sondas, torres. Serve para vigiar ou conter um vizinho.</li>
            </ul>

            <h2 id="capital">Para onde vai seu herói se perder seu posto?</h2>
            <p>Não existe planeta capital. Um herói nunca é destruído. Se sua frota for aniquilada ou seu planeta perdido, ele pode ser <strong>capturado</strong> por um jogador que possua uma Prisão: 20&nbsp;% de risco em combate espacial, 35&nbsp;% em uma invasão.</p>
            <p>Caso contrário, ele se junta automaticamente ao <strong>mais antigo dos seus planetas ou luas que ainda não tenha um herói</strong>. Se não houver nenhum, seu herói principal envia um herói secundário em reserva para ocupar o lugar dele.</p>

    planet_abandon:
        title: "Abandonar um planeta"
        category: "planet"
        order: 4
        tags: "abandonar,planeta,exclusao,game over"
        summary: "Quando é uma boa ideia, como fazer e por que evitar em certos casos."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="porque">Por que abandonar um planeta?</h2>
            <ul>
                <li>Ele está <strong>muito exposto</strong> a ataques e consome mais do que rende.</li>
                <li>Está <strong>mal posicionado</strong> (longe de tudo, difícil de defender).</li>
                <li>Você quer <strong>colonizar um melhor</strong>, mas está no limite de planetas.</li>
            </ul>

            <h2 id="como">Como fazer</h2>
            <p>Vá à página <strong>Planetas</strong>: o link <strong>Abandonar</strong> fica ao lado das coordenadas do planeta. O jogo pergunta «Deseja abandonar o planeta?» ; depois que você confirma <em>Abandonar</em>, o abandono é <strong>imediato e definitivo</strong>.</p>
            <p>O link só aparece se o abandono for possível:</p>
            <ul>
                <li>você ainda tem pelo menos um outro planeta (as luas não contam);</li>
                <li>não é uma lua: uma lua nunca pode ser abandonada;</li>
                <li>nenhuma frota estrangeira em modo de ataque está a caminho dele nem estacionada em órbita.</li>
            </ul>
            <p>Antes de largá-lo, <strong>evacue recursos, Legionários, Mechas e naves em solo</strong> para outro planeta: tudo o que ficar é perdido. Um herói posicionado no planeta é transferido automaticamente para outro dos seus planetas ou luas que ainda não tenha herói.</p>
            <p>O que acontece com o planeta:</p>
            <ul>
                <li>num servidor sem colmeia Cthulhu, ele volta a ser um planeta desabitado, arrasado: só restam um Estaleiro espacial e um Radar terrestre de nível 1;</li>
                <li>num servidor com a colmeia, um planeta pequeno que continua com o tamanho original (25 de terreno, 5 de espaço) é simplesmente liberado, com os edifícios; qualquer outro planeta se torna uma <strong>base alien</strong>.</li>
            </ul>
            <p><strong>Dá para cancelar?</strong> Não: não há prazo nem volta atrás. Para recuperar o planeta, é preciso retomá-lo. Se ele voltou a ficar livre, colonize-o de novo (você precisa de um colonizador e de um espaço livre). Se virou uma base alien, invada-a para libertá-la e depois colonize-a de novo.</p>

            <h2 id="perigo">E o meu último planeta?</h2>
            <p>É impossível abandoná-lo: enquanto você tiver só um planeta, o jogo recusa (as luas não contam). Em compensação, <strong>perder</strong> seu último planeta, por exemplo após uma invasão, leva ao <strong>Game Over</strong>: veja o artigo <em>Game Over</em>.</p>

    galaxy_navigation:
        title: "Navegando na galáxia"
        category: "planet"
        order: 5
        tags: "galaxia,setor,navegacao,mapa,universo,coordenadas,sistema,mercador,hiperespaco"
        summary: "Como o universo é organizado, como ler uma coordenada e como usar o mapa."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="estrutura">Como o universo é organizado</h2>
            <p>O universo é uma hierarquia:</p>
            <ul>
                <li>O <strong>Universo</strong> de um servidor contém uma ou mais <strong>Galáxias</strong>: uma nova galáxia é adicionada automaticamente quando os planetas iniciais livres ficam escassos, até 32. A aba <strong>Universo</strong> do Mapa espacial mostra quantas existem. No Battle Royale, há apenas uma.</li>
                <li>Cada <strong>Galáxia</strong> contém 100 <strong>Setores</strong> (grade 10×10, numerados de 1 a 100, linha por linha). O Mapa espacial os chama de « sistemas ».</li>
                <li>Cada <strong>Setor</strong> contém 25 <strong>Posições</strong> (grade 5×5).</li>
            </ul>
            <p>Cada posição pode conter um planeta (habitado ou não), um mercador, uma base alien, um campo de destroços, uma lua, ou estar vazia. A posição 13, no centro do setor, é sempre um sol. Os mercadores ficam em 20 setores fixos de cada galáxia: 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 e 56.</p>

            <h2 id="coordenadas">Ler uma coordenada</h2>
            <p>Formato: <strong>Galáxia:Setor:Posição</strong>, por exemplo <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — primeira galáxia;</li>
                <li><strong>5</strong> — quinto setor dessa galáxia (na primeira linha da grade);</li>
                <li><strong>12</strong> — décima segunda posição nesse setor.</li>
            </ul>

            <h2 id="mapa">Usar o mapa</h2>
            <p>A página <strong>Mapa espacial</strong> (menu à esquerda) mostra a visão espacial. Você pode:</p>
            <ul>
                <li>Navegar entre galáxias e setores.</li>
                <li>Clicar em uma posição para ver o que há nela.</li>
                <li><strong>Enviar uma frota diretamente</strong>: clique na casa e depois em <strong>Interação</strong> (o botão aparece assim que pelo menos uma das suas frotas está parada), escolha a frota e a missão e clique em <strong>Enviar</strong>. O mesmo painel oferece ações rápidas conforme a casa: <em>Sondar o planeta</em>, <em>Colonizar o planeta</em>, <em>Implantar radar</em> ou <em>Implantar bloqueador</em>, <em>Enviar um míssil nuclear</em>.</li>
                <li>Ver as posições de aliados, inimigos e mercadores (conforme suas relações e seu radar).</li>
            </ul>
            <p>As <strong>frotas em trânsito</strong> aparecem como pequenas naves animadas que deslizam em tempo real entre o planeta de origem e o destino. O <strong>halo colorido</strong> indica o lado: <strong>azul</strong> = você, <strong>verde</strong> = aliança e aliados, <strong>cinza</strong> = pacto/paz, <strong>magenta</strong> = mercador, <strong>roxo</strong> = alien, <strong>vermelho</strong> = inimigo. O <strong>tamanho</strong> reflete a assinatura da frota. Suas frotas e as da sua aliança são sempre visíveis; as outras só aparecem se o seu <strong>radar</strong> cobrir o setor. Em um voo de longa distância que atravessa vários setores, a nave só aparece durante a última fração do trajeto — a entrada no setor de destino — e não durante toda a viagem.</p>

            <h2 id="hiperespaco">Viagens entre galáxias</h2>
            <p>Para ir de uma galáxia a outra, você precisa da pesquisa <strong>Tecnologia hiperespaço</strong>. A distância é sempre 18 (cerca de 6 setores: menos que uma travessia de galáxia), mas o combustível é caro: a assinatura da frota dividida por 8, em Bitcoins (125 Bitcoins para 1.000 caçadores). Detalhes em <em>Deslocamento e distância</em>.</p>

    radar_jammer:
        title: "Radar e bloqueio"
        category: "planet"
        order: 6
        tags: "radar,bloqueador,jammer,deteccao,vigilancia,scanner"
        summary: "Ver o que se move em um setor e esconder seus planetas dos radares inimigos."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principio">Radar vs Bloqueador</h2>
            <ul>
                <li><strong>Radar</strong> — mostra o setor em que está: os planetas e as frotas em movimento, antes da chegada delas.</li>
                <li><strong>Bloqueador</strong> — esconde <strong>um planeta</strong> dos radares inimigos que não sejam mais potentes que ele: suas informações, a assinatura das frotas que vão para lá, e a origem ou o destino das frotas que saem dele ou vão até ele.</li>
            </ul>

            <h2 id="deteccao">Os radares disponíveis</h2>
            <table>
                <tr><th>Tipo</th><th>Onde</th><th>Função</th></tr>
                <tr><td><strong>Radar terrestre</strong> (edifício)</td><td>No planeta (espaço no solo)</td><td>+1 de potência de radar por nível. Requisito: Scanner de sistema nível 1.</td></tr>
                <tr><td><strong>Radar espacial</strong> (edifício)</td><td>No planeta (espaço no céu)</td><td>Mesmo efeito, +1 por nível: útil quando falta espaço no solo. Requisito: Scanner de sistema nível 3.</td></tr>
                <tr><td><strong>Nave radar</strong></td><td>Implantada em uma casa vazia</td><td>Instala um radar de potência 1 por 2&nbsp;h: prático para vigiar um setor onde você não tem planeta.</td></tr>
            </table>
            <p>Um radar cobre todo o setor em que está, e somente esse. Os níveis dos dois edifícios de um mesmo planeta se somam; em um setor, vale o melhor planeta (o seu, o de um membro da sua aliança ou o de um aliado). Um herói Explorador posicionado no planeta reforça o radar dele: +1 a partir do nível 5 (traço Batedor), +3 no total a partir do nível 15 (traço Cartógrafo também).</p>
            <p>O jogo avisa você por uma notificação quando uma frota inimiga se dirige ao seu planeta, com ou sem radar; o radar serve para <em>ver</em> as frotas e os planetas do setor.</p>

            <h2 id="bloqueio">Os bloqueadores disponíveis</h2>
            <table>
                <tr><th>Tipo</th><th>Onde</th><th>Função</th></tr>
                <tr><td><strong>Bloqueador de radar</strong> (edifício)</td><td>No planeta (espaço no céu)</td><td>+1 de potência de bloqueio por nível. Enquanto igualar ou superar o radar inimigo do setor, o planeta fica oculto para esse inimigo. Requisito: Scanner de sistema nível 5.</td></tr>
                <tr><td><strong>Nave bloqueadora</strong></td><td>Implantada em uma casa vazia</td><td>Instala um bloqueador de potência 1 por 1&nbsp;h nessa casa. Não protege uma frota em voo.</td></tr>
            </table>
            <p>Exemplo: seu planeta tem um Bloqueador de radar nível 3. Um inimigo cujo melhor radar do setor está no nível 3 não o vê; com um radar nível 4, ele o vê.</p>

            <h2 id="naves-no-solo">Ver as naves em solo</h2>
            <p>A <strong>assinatura em solo</strong> — as naves estacionadas em um planeta — segue uma regra um pouco mais flexível: uma das suas frotas <strong>em órbita</strong> as conta à vista, mesmo sem radar. Mas somente para esse planeta.</p>
            <p>O <strong>radar</strong> continua sendo o que dá essa leitura <strong>à distância</strong>, em todo o setor. E um <strong>Bloqueador de radar</strong> no planeta fecha a observação: sem um radar superior ao bloqueador, a assinatura em solo volta a ficar invisível, mesmo com uma frota acima.</p>

            <h2 id="estrategia">Como usá-los</h2>
            <ul>
                <li><strong>Radar</strong> em cada planeta: no mínimo o Radar terrestre, para ver o que se move no seu setor.</li>
                <li><strong>Bloqueador de radar</strong> nos seus planetas expostos: com nível igual ou superior ao radar adversário, eles se tornam ilegíveis para ele.</li>
                <li><strong>Implante</strong> uma nave radar em uma casa vazia do setor do seu vizinho (ação « Implantar radar » do Mapa espacial, ou missão « Nave radar »): você vê esse setor por 2&nbsp;h.</li>
                <li>A pesquisa <strong>Scanner de sistema</strong> desbloqueia os radares (nível 1: Radar terrestre; nível 3: Radar espacial e Nave radar; nível 5: Bloqueador de radar e Nave bloqueadora). Ela não aumenta a potência deles.</li>
            </ul>

    moon:
        title: "As luas"
        category: "planet"
        order: 7
        tags: "lua,lunar,moonmaker,comida,rações,producao"
        summary: "Uma lua produz 1.200 rações por hora sem ocupar terreno. Como criar uma com um Lunar, seu tamanho e seus limites."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="o-que-e">O que é uma lua?</h2>
            <p>Uma <strong>lua</strong> é um astro especial criado por uma nave <strong>Lunar</strong> (às vezes chamada de Moon Maker). Ela não produz nióbio nem água, mas uma quantidade fixa de <strong>20 rações por minuto</strong>, ou seja, 1.200 por hora antes dos bônus (1.440 em aliança). É tanto quanto um Campo agrícola de nível 7 a 8 em um planeta, sem ocupar nenhum terreno. Essa produção não pode ser aumentada: não se constrói fazenda em uma lua.</p>
            <p>Uma lua também abriga <strong>trabalhadores</strong> (20.000 desde a criação, até 200.000), que rendem Bitcoins como em qualquer outro lugar. Você pode construir nela a maioria dos edifícios (Grande cidade, Centro de pesquisa, armazéns, Caserna, Estaleiro espacial…), mas não mina, extrator nem fazenda.</p>
            <p>Somente os trabalhadores consomem rações, à razão de 1 por hora para cada 500 trabalhadores: as 1.200 rações de uma lua alimentam portanto 600.000 trabalhadores. Essas rações ficam na lua: transporte-as em cargueiros para seus planetas, ou deixe uma frota carregada de rações em órbita de um planeta, que recorrerá a elas quando o celeiro esvaziar.</p>

            <h2 id="criacao">Como criar uma lua</h2>
            <p>Uma lua nasce de um <strong>campo de destroços</strong>: é preciso uma <strong>posição vazia</strong> com pelo menos <strong>2M de nióbio E 2M de água</strong> em destroços (deixados por uma batalha espacial nesse local). A missão <em>Criar uma lua</em> só é oferecida no mapa se a posição cumprir essa condição.</p>
            <ol>
                <li>Fabrique um <strong>Lunar</strong> no Estaleiro espacial. São necessários a pesquisa Terraformação nível 15 e uma Indústria pesada no planeta. Ele custa 50.000 de nióbio, 23.000 de água, 20.000 trabalhadores e 200.000 Bitcoins, para 5&nbsp;h de construção base.</li>
                <li>Envie-o à posição vazia na missão <strong>Criar uma lua</strong>: no <em>Mapa espacial</em>, clique na posição, depois em <em>Interação</em>, escolha a frota e a missão e então <em>Enviar</em>. Se a frota já estiver no local, o botão <em>Criar uma lua</em> aparece na ficha dela.</li>
                <li>Na chegada, um Lunar é consumido, a lua é criada e <strong>todos os destroços são consumidos</strong>. Se as condições deixarem de ser atendidas (destroços reciclados durante o voo, posição ocupada…), um relatório explica a falha.</li>
            </ol>
            <p>O Lunar é a nave mais lenta do jogo, e sua manutenção é pesada: 5.000 Bitcoins por dia enquanto estiver em uma frota, 833 quando fica em solo. Só o coloque em frota no último momento.</p>

            <h2 id="tamanho">Tamanho da lua</h2>
            <p>Quanto mais rico o campo de destroços, maior a lua. O patamar é definido pelo <strong>menor</strong> dos dois recursos:</p>
            <table>
                <thead>
                    <tr><th>Destroços (mín. nióbio/água)</th><th>Terreno</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M ou mais</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Os valores são sorteados dentro da faixa. Exemplo: um campo de 12M de nióbio e 6M de água dá uma lua de 100 a 150 de terreno, pois é a água (6M) que define o patamar. Uma lua costuma ser maior que um planeta, cujo terreno de origem vai de 25 a 190.</p>

            <h2 id="limitacoes">Limites</h2>
            <ul>
                <li>Uma lua não produz nióbio nem água: somente rações e trabalhadores.</li>
                <li>Ela pode ser atacada, pilhada e invadida (por uma frota em órbita), mas não pode ser sondada.</li>
                <li>Ela não conta no seu limite de planetas, nem no limite de 4 planetas da proteção de iniciantes.</li>
                <li>Uma lua nunca pode ser abandonada.</li>
                <li>Construir uma lua perto de casa é mais seguro (menos exposta a vizinhos hostis).</li>
            </ul>

            <h2 id="estrategia">Quando criar uma</h2>
            <ul>
                <li>Seus planetas muito populosos estão sem rações: uma lua próxima fornece 1.200 por hora, para transportar em cargueiros ou deixar a bordo de uma frota em órbita do planeta.</li>
                <li>Uma grande batalha deixou um <strong>campo de destroços rico</strong> em uma posição vazia perto de você: em vez de reciclar tudo, transforme-o em lua.</li>
                <li>Você está bem estabelecido, tem recursos para gastar e quer consolidar sua economia.</li>
            </ul>

    alliance_basics:
        title: "Criar e entrar em uma aliança"
        category: "alliance"
        order: 1
        tags: "alianca,criacao,entrar,convite,bonus,regime,politica,nivel,membros"
        summary: "Entrar em uma aliança por convite ou criar a sua, escolher o regime político e subir o nível para acolher mais membros."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="porque">Por que entrar em uma aliança?</h2>
            <ul>
                <li><strong>+20&nbsp;% de produção</strong> de nióbio, água e rações, desde a entrada na aliança.</li>
                <li>As <strong>7 pesquisas políticas</strong> do regime da sua aliança (bônus econômicos, militares ou defensivos), que você mesmo inicia na página <strong>Pesquisas</strong>.</li>
                <li>As <strong>melhorias de aliança</strong> (16 bônus coletivos) e a <strong>ajuda de construção</strong>.</li>
                <li>Uma <strong>tesouraria compartilhada</strong> em Bitcoins e em Pontos de Guerra.</li>
                <li>A <strong>diplomacia</strong> (guerras, paz, pactos, alianças defensivas), uma <strong>sala</strong> reservada aos membros e a <strong>Arena Aliança</strong>.</li>
            </ul>
            <p>Em resumo: jogar sozinho é viável no início. Mas, quando o jogo fica sério, uma aliança multiplica suas chances de progredir.</p>

            <h2 id="entrar">Como entrar</h2>
            <ol>
                <li>Localize uma aliança: o ranking das alianças (« Classificacao de Aliancas »), a ficha de uma aliança, o salão Universo.</li>
                <li>Entre em contato com um de seus membros (mensagem privada, salão). Não existe candidatura no jogo: <strong>é a aliança que convida você</strong>.</li>
                <li>Um membro que tenha a permissão <strong>Recrutar</strong> envia um convite pela aba <strong>Adicionar um membro</strong> da sua página Aliança. Ele vê ali os jogadores sem aliança que se conectaram nos últimos 2 meses.</li>
                <li>Abra sua página <strong>Aliança</strong> (menu): o convite aparece em « Proposta(s) de recrutamento ». Clique em <strong>Aceitar</strong>.</li>
            </ol>
            <p>Uma aliança só pode convidar se tiver uma vaga livre: cada convite pendente conta como um membro até a sua resposta.</p>
            <p>Você também pode <strong>criar sua própria aliança</strong> na mesma página. Você escolhe:</p>
            <ul>
                <li>um <strong>nome</strong> (20 caracteres no máximo, único no servidor) e uma <strong>tag</strong> (5 caracteres no máximo, única);</li>
                <li>um grito de guerra (30 caracteres) e uma descrição (1.500 caracteres), modificáveis depois;</li>
                <li>a <strong>taxa da aliança</strong>, de 5 a 50&nbsp;%, que <strong>não poderá mais ser alterada</strong>;</li>
                <li>o <strong>regime político</strong>, definitivo.</li>
            </ul>
            <p>Você se torna o líder da aliança. A tesouraria dela começa vazia.</p>

            <h2 id="invitations">Receber convites</h2>
            <p>Um membro que tenha a permissão <strong>Recrutar</strong> pode <strong>convidar</strong> você diretamente. Você pode receber <strong>um convite de cada aliança ao mesmo tempo</strong>: ser procurado por uma não torna você invisível para as outras. Em contrapartida, uma mesma aliança não pode convidar você duas vezes enquanto você não tiver respondido. As alianças que localizam você veem que você já foi <strong>procurado</strong>, sem saber por quem. Assim que você <strong>aceita</strong> um convite, todos os outros são retirados automaticamente. Se uma aliança for <strong>dissolvida</strong>, o convite dela desaparece da sua lista.</p>

            <h2 id="delai">Prazo depois de sair de uma aliança</h2>
            <p>Depois de <strong>sair</strong> de uma aliança, ser <strong>expulso</strong> dela ou após sua <strong>dissolução</strong> pelo líder, aplica-se um <strong>prazo de 2&nbsp;dias</strong>: é impossível <strong>criar</strong> ou <strong>entrar em</strong> uma aliança antes do fim da contagem, exibida na página Aliança. Se a aliança desaparece por conta própria (Game Over do líder de O Martelo das Estrelas, ou do último membro), esse prazo é de <strong>12&nbsp;horas</strong>. Esse prazo impede idas e vindas abusivas entre alianças.</p>
            <p><strong>Sair</strong> só é possível em <strong>A Balança dos Mundos</strong>, e sob quatro condições: não ser o Presidente, não ser o último membro, a aliança não estar em guerra e nenhuma das suas frotas estar em combate. Uma <strong>expulsão</strong> também é impossível durante uma guerra, ou se uma frota do membro visado estiver em combate.</p>
            <p>Ao sair, você perde o bônus de produção e as melhorias de aliança, e <strong>suas pesquisas políticas voltam a zero</strong>.</p>

            <h2 id="regimes">Os 3 regimes políticos</h2>
            <p>Ao <strong>criar</strong> uma aliança, você escolhe seu <strong>regime político</strong>. Essa escolha é <strong>definitiva</strong>: ela define o número de membros iniciais, as 7 pesquisas políticas acessíveis e várias regras internas. Todos os detalhes: <a href="/wiki/political_system">Os 3 regimes políticos</a>.</p>

            <h3 id="democracia">A Balança dos Mundos</h3>
            <ul>
                <li>3 membros no início; um Presidente eleito pelo voto dos membros.</li>
                <li>Os membros podem sair da aliança (exceto o Presidente, e nunca em tempo de guerra).</li>
                <li>Pesquisas econômicas: produção, velocidade das pesquisas, manutenção dos cientistas, cargueiros, blindagem das naves, vendas aos mercadores, colonização.</li>
                <li>Todos os membros são visíveis publicamente, assim como a posição do primeiro planeta deles.</li>
                <li>+20&nbsp;% de armas no ataque contra O Baluarte Silencioso.</li>
            </ul>

            <h3 id="comunismo">O Baluarte Silencioso</h3>
            <ul>
                <li>4 membros no início; todos os membros são líderes.</li>
                <li>Taxa da aliança fixada em 50&nbsp;%; é impossível sair da aliança.</li>
                <li>Pesquisas ofensivas: reciclagem, defesa dos trabalhadores, poder das naves, manutenção e recrutamento dos Legionários, invasões, Pontos de Guerra.</li>
                <li>+20&nbsp;% de armas no ataque contra O Martelo das Estrelas.</li>
            </ul>

            <h3 id="fascismo">O Martelo das Estrelas</h3>
            <ul>
                <li>2 membros no início; um único líder, o Primaris.</li>
                <li>É impossível sair da aliança ou dissolvê-la; se o Primaris sofre Game Over, a aliança é dissolvida.</li>
                <li>Pesquisas defensivas: trabalhadores, poder das naves, barcaças, Legionários, manutenção e defesa dos Mechas, invasões. A ameaça Cthulhu sobe menos rápido.</li>
                <li>Somente o líder é exibido publicamente.</li>
                <li>+20&nbsp;% de armas no ataque contra A Balança dos Mundos.</li>
            </ul>

            <h2 id="niveau">Nível da aliança e número de membros</h2>
            <p>Uma aliança começa com <strong>3 vagas</strong> (A Balança dos Mundos), <strong>4</strong> (O Baluarte Silencioso) ou <strong>2</strong> (O Martelo das Estrelas). Para acolher mais gente, um membro que tenha a permissão <strong>Modificar</strong> faz subir o <strong>nível</strong> com o botão « Subir nivel da alianca » da aba <strong>Banco</strong>. O custo é pago pela <strong>tesouraria</strong>. Cada nível também desbloqueia mais uma pesquisa política (veja <a href="/wiki/alliance_research">Pesquisas de aliança</a>).</p>
            <table>
                <thead>
                    <tr><th>Passagem</th><th>Custo (tesouraria)</th><th>Vagas a mais</th><th>Vagas totais Balança / Baluarte / Martelo</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125.000 Bitcoins</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225.000 Bitcoins + 2.500 PDG</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600.000 Bitcoins + 10.000 PDG</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1.000.000 Bitcoins + 25.000 PDG</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50.000 PDG</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10.000.000 Bitcoins</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15.000.000 Bitcoins + 125.000 PDG</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35.000.000 Bitcoins + 300.000 PDG</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50.000.000 Bitcoins + 500.000 PDG</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100.000.000 Bitcoins + 1.000.000 PDG</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>O nível 10 é o máximo.</p>

            <h2 id="compte-valide">Conta a validar</h2>
            <p>⚠️ Para <strong>criar ou entrar em</strong> uma aliança, sua conta deve estar <strong>validada</strong> e seu <strong>e-mail confirmado</strong>. Contas de teste ou anônimas não podem entrar em aliança: confirme seu e-mail em <strong>Minhas opcoes</strong>.</p>
            <p>Outros casos em que é impossível: durante o prazo que segue uma saída ou expulsão (veja acima), enquanto uma das suas frotas estiver envolvida em um combate, em um servidor <strong>Battle Royale</strong>, e para o VIP de um servidor <strong>Search &amp; Destroy</strong>. Sem e-mail confirmado, você também não pode depositar nem retirar da tesouraria, investir nas melhorias ou ajudar as construções.</p>

    alliance_grades:
        title: "Patentes e permissões"
        category: "alliance"
        order: 2
        tags: "patentes,permissoes,funcoes,hierarquia,oficial,lider,votacao,inativo"
        summary: "Como funciona a hierarquia interna de uma aliança e quem tem o direito de fazer o quê."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Uma aliança é organizada por <strong>patentes</strong>, da mais alta (o líder, posição&nbsp;1) à mais baixa (posição&nbsp;5). Cada patente tem uma lista de <strong>permissões</strong> que diz o que seus membros podem fazer.</p>

            <h2 id="hierarquia">As patentes iniciais</h2>
            <p>Cada aliança começa com 4 patentes, conforme o regime:</p>
            <table>
                <thead>
                    <tr><th>Regime</th><th>Líder (posição 1, todas as permissões)</th><th>Posição 2</th><th>Posição 3</th><th>Novos membros</th></tr>
                </thead>
                <tbody>
                    <tr><td>A Balança dos Mundos</td><td>Presidente</td><td>Ministro (Recrutar, Ver)</td><td>Cidadão (Ver)</td><td>Mineiro (posição 5, nenhuma permissão)</td></tr>
                    <tr><td>O Martelo das Estrelas</td><td>Primaris</td><td>Capitão (Recrutar, Ver)</td><td>Soldado (Ver)</td><td>Aspirante (posição 5, nenhuma permissão)</td></tr>
                    <tr><td>O Baluarte Silencioso</td><td>Guia, Protetor, Camarada (todos posição 1)</td><td>Gulag (nenhuma permissão)</td><td>—</td><td>Camarada (todas as permissões)</td></tr>
                </tbody>
            </table>
            <p>Um membro que tenha a permissão <strong>Modificar</strong> pode criar outras patentes na aba <strong>Administracao</strong>: ele lhes dá um nome, um « tipo de patente » de 2 a 5 (a posição) e permissões. A posição&nbsp;1 é reservada aos líderes.</p>

            <h2 id="permissoes">As permissões</h2>
            <p>As permissões de uma patente são escolhidas na sua <strong>criação</strong>:</p>
            <ul>
                <li><strong>Recrutar</strong>: convidar jogadores.</li>
                <li><strong>Expulsar</strong>: expulsar um membro (impossível em tempo de guerra).</li>
                <li><strong>Pacto</strong>: propor, aceitar, recusar ou romper um pacto de não agressão ou uma aliança defensiva. Também é necessária para a guerra e a paz.</li>
                <li><strong>Guerra</strong>: declarar guerra e negociar a paz (também é preciso a permissão Pacto).</li>
                <li><strong>Modificar</strong>: gerenciar as patentes e sua atribuição, o DEFCON, a imagem, o grito de guerra e a descrição, validar os pedidos de retirada da tesouraria, subir o nível da aliança, dissolvê-la. As retiradas pedidas por essa patente são imediatas.</li>
                <li><strong>Frotas</strong>: retirar do compartilhamento as frotas que outros membros compartilharam com a aliança.</li>
                <li><strong>Ver</strong>: ver no mapa espacial as frotas de todos os membros e das alianças defensivas aliadas. Sem ela, você só vê as suas.</li>
            </ul>
            <p>As permissões de uma patente existente não podem ser modificadas: crie uma nova patente, atribua-a e depois exclua a antiga (seus membros descem para a patente mais baixa). Você só pode dar a uma patente permissões que você mesmo tem. Deve sempre restar pelo menos uma patente de cada uma das posições 1, 2, 3 e 5, e você não pode excluir a sua própria patente.</p>

            <h2 id="mudar">Promover ou rebaixar</h2>
            <p>Um membro que tenha a permissão <strong>Modificar</strong> muda a patente de outro clicando na <strong>posição</strong> dele na lista de membros. É uma forma de recompensar os ativos e de orientar os novatos.</p>
            <p>Limites:</p>
            <ul>
                <li>não se pode dar uma patente que tenha mais permissões que a sua;</li>
                <li>ninguém pode rebaixar o último líder, e um líder não pode mudar a própria patente;</li>
                <li>a patente de <strong>Presidente</strong> (Balança) ou de <strong>Primaris</strong> (Martelo) nunca é atribuída manualmente: o Presidente muda pelo voto, o Primaris somente pela substituição automática de um chefe inativo (veja abaixo);</li>
                <li>no Baluarte Silencioso, Guia, Protetor e Camarada são trocados livremente.</li>
            </ul>

            <h2 id="regimes">Casos particulares conforme o regime</h2>
            <ul>
                <li><strong>O Baluarte Silencioso</strong>: todos os membros são líderes, com todos os direitos, e os recém-chegados entram como Camaradas. A única patente inferior é o <strong>Gulag</strong>, sem nenhuma permissão, atribuído para pôr um membro de lado.</li>
                <li><strong>O Martelo das Estrelas</strong>: um único líder, o Primaris, que não pode ser eleito nem nomeado. Ele só é substituído se ficar inativo por mais de 7 dias (veja abaixo). Se sofrer <strong>Game Over</strong>, a aliança é dissolvida.</li>
                <li><strong>A Balança dos Mundos</strong>: cada membro tem um voto, que pode mudar a qualquer momento, pela aba dos membros (« Votar no seu presidente »). Assim que um membro tem mais votos que o Presidente, ele se torna Presidente e o anterior assume a patente dele.</li>
            </ul>

            <h2 id="afk">Substituição automática de um chefe inativo</h2>
            <p>Se um <strong>líder</strong> não se conecta por <strong>mais de 7 dias</strong>, ele é substituído automaticamente para evitar que a aliança fique paralisada:</p>
            <ul>
                <li>O <strong>membro de patente mais alta</strong> entre os que não são líderes e que se conectaram nos últimos 7 dias assume a chefia da aliança. Em patente igual, é o que tem mais <strong>pontos no ranking</strong>.</li>
                <li>As duas patentes são simplesmente <strong>trocadas</strong>: o antigo chefe fica com a patente do substituto. A mudança é registrada no histórico da aliança.</li>
                <li>A regra vale para os três regimes. No Baluarte Silencioso, onde todos são líderes, somente um membro de patente Gulag pode ocupar o lugar de um líder inativo.</li>
                <li>Se <strong>não houver nenhum candidato ativo</strong>, nada muda.</li>
            </ul>

    diplomacy:
        title: "A diplomacia"
        category: "alliance"
        order: 3
        tags: "diplomacia,guerra,paz,pacto,aliado,alianca defensiva,defcon,tratado,taxa de paz"
        summary: "Os 4 tipos de relações entre alianças, como negociá-las e o que significa o DEFCON."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Sua aliança mantém <strong>relações</strong> com as outras alianças do servidor. Essas relações mudam as regras entre seus respectivos membros: quem pode pilhar ou invadir quem, e quem luta ao lado de quem. A diplomacia é gerenciada na aba <strong>Pactos</strong> da página Aliança.</p>

            <h2 id="tipos">Os 4 tipos de relações</h2>
            <table>
                <thead>
                    <tr><th>Tipo</th><th>Efeito</th><th>Criação e fim</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Nenhuma relação</strong></td><td>Situação padrão: raids, invasões e combates são possíveis.</td><td>—</td></tr>
                    <tr><td><strong>Guerra</strong></td><td>As frotas <strong>armadas</strong> das duas alianças que se encontram em um planeta se enfrentam automaticamente, mesmo sem modo de ataque. Durante a guerra, é impossível expulsar um membro, sair da aliança ou dissolvê-la. O jogo contabiliza as invasões e os PDG ganhos e perdidos de cada lado.</td><td>Declarada <strong>imediatamente</strong>, sem aceitação (permissões Guerra e Pacto). As duas alianças passam para DEFCON 5 e seus membros recebem um alerta. Só termina por uma <strong>paz</strong> aceita.</td></tr>
                    <tr><td><strong>Paz</strong></td><td>Nenhum raid nem invasão entre vocês. O derrotado paga a <strong>taxa de paz</strong> combinada: uma parte de seus rendimentos diários e uma parte dos PDG que ganha em combate, pagas à tesouraria do vencedor.</td><td>Proposta a partir de uma guerra em curso, com o botão « Fazer a paz ». Dura <strong>4 dias</strong>, depois as duas alianças voltam a ser neutras.</td></tr>
                    <tr><td><strong>Pacto de não agressão</strong></td><td>Nenhum raid nem invasão entre vocês. Em uma batalha, uma aliança que tem um pacto com o lado oposto não luta.</td><td>Proposto e depois aceito pelo outro lado. É rompido <strong>imediatamente</strong>.</td></tr>
                    <tr><td><strong>Aliança defensiva</strong></td><td>Nenhum raid nem invasão entre vocês. Suas frotas lutam <strong>no mesmo lado</strong>. Radar e frotas compartilhados no mapa (com a permissão Ver). Uma <strong>sala comum</strong> às duas alianças.</td><td>Proposta e depois aceita. A ruptura tem efeito <strong>12 horas</strong> depois; a sala comum e suas mensagens são então excluídas.</td></tr>
                </tbody>
            </table>
            <p>Não se pode declarar guerra a uma aliança com a qual se tem um pacto, uma aliança defensiva ou uma paz em curso: rompa antes o pacto ou a aliança defensiva. Uma paz, por sua vez, não se rompe: é preciso esperar que expire.</p>

            <h2 id="propor">Como propor um tratado</h2>
            <ol>
                <li>Página <strong>Aliança</strong>, aba <strong>Pactos</strong> (« Diplomacia da aliança »).</li>
                <li>Em « Propor », digite a <strong>tag</strong> da aliança alvo e escolha <strong>Aliança defensiva</strong>, <strong>Pacto de nao-agressao</strong> ou <strong>Declarar guerra</strong>.</li>
                <li>A outra aliança vê seu pedido em « Pedidos recebidos »: ela pode <strong>aceitá-lo</strong> ou <strong>recusá-lo</strong>. Não há contraproposta: para mudar os termos, recuse e depois faça sua própria proposta. Só uma proposta pode ficar pendente entre duas alianças.</li>
            </ol>
            <p>Um pacto pode se tornar uma aliança defensiva, e uma paz pode se tornar um pacto ou uma aliança defensiva: a aceitação substitui a relação anterior (uma paz e sua taxa então terminam).</p>

            <h2 id="paix">Negociar a paz</h2>
            <p>Na lista « Guerras em curso », clique em <strong>Fazer a paz</strong> ao lado da guerra em questão e depois preencha os termos:</p>
            <ul>
                <li><strong>Tipo</strong>: <strong>Propor</strong> (você oferece os termos, e é sua aliança que pagará) ou <strong>Reivindicar</strong> (você exige que o adversário pague).</li>
                <li><strong>Bitcoins revertidos por dia</strong>: 0 ou de 10 a 25&nbsp;% dos rendimentos diários de cada membro da aliança derrotada, descontados no relatório diário (18h59, hora de Paris). Exemplo: a 20&nbsp;%, um membro que recebe 10.000 Bitcoins por dia repassa 2.000.</li>
                <li><strong>Porcentagem dos pdg</strong>: 0 ou de 25 a 50&nbsp;% dos PDG que os membros derrotados ganham em combate.</li>
                <li><strong>Numero de planetas</strong>: esse campo (0 a 5) é registrado nos termos, mas nenhum planeta é transferido.</li>
            </ul>
            <p>Clique em <strong>Assinar</strong>. O adversário vê sua proposta nessa mesma tela e pode aceitar os termos ou recusá-los; você pode cancelar a sua enquanto ele não tiver respondido. Depois de aceita, a paz dura 4 dias.</p>

            <h2 id="defcon">O DEFCON (nível de alerta)</h2>
            <p>Sua aliança tem um <strong>nível de alerta DEFCON</strong>, de <strong>0 a 5</strong>: <strong>quanto mais alto o número, mais tensa a situação</strong>. 0 = nenhum alerta, 5 = alerta máximo. Um membro que tenha a permissão <strong>Modificar</strong> o ajusta na aba <strong>Administracao</strong> (« Nível de defesa »). Uma <strong>declaração de guerra</strong> coloca automaticamente as duas alianças em <strong>DEFCON 5</strong>.</p>
            <p>O nível é exibido em faixa na <strong>Visao geral</strong> de todos os membros (verde em 1, laranja em 2, vermelho de 3 a 5, nada em 0), com a lista das alianças com as quais você está em guerra. É um sinal de coordenação, sem efeito sobre os combates.</p>

            <h2 id="logs">O registro diplomático</h2>
            <p>Toda ação diplomática (declaração de guerra, proposta, paz aceita, pacto rompido, proposta recusada…) é <strong>registrada</strong> no <strong>Histórico</strong> da aliança (aba dos membros), com o apelido do autor, a data e a hora. As entradas, saídas, expulsões e mudanças de líder também constam ali. Útil para a transparência interna e para debates posteriores.</p>

    alliance_treasury:
        title: "Tesouraria de aliança"
        category: "alliance"
        order: 4
        tags: "tesouraria,banco,bitcoin,pdg,deposito,retirada,taxa,nivel"
        summary: "A conta comum da sua aliança em Bitcoins e em PDG: depósitos, taxa da aliança, taxas de paz, retiradas e subida de nível."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principio">Para que serve a tesouraria</h2>
            <p>A tesouraria da aliança (aba <strong>Banco</strong> da página Aliança) é uma conta comum em <strong>Bitcoins</strong> e em <strong>Pontos de Guerra (PDG)</strong>. Ela serve para:</p>
            <ul>
                <li><strong>Subir o nível da aliança</strong>, para acolher mais membros e desbloquear as pesquisas políticas seguintes (veja <a href="/wiki/alliance_basics#niveau">Nível da aliança</a>).</li>
                <li><strong>Redistribuir</strong> Bitcoins ou PDG a um membro: ajudar um jogador em dificuldade, financiar um preparo para a guerra.</li>
            </ul>
            <p>As pesquisas políticas <strong>não</strong> são pagas pela tesouraria: cada jogador paga as suas (veja <a href="/wiki/alliance_research">Pesquisas de aliança</a>). Um bloqueio Cthulhu sofrido também pode descontar dela um « Dízimo dos Possuídos ».</p>

            <h2 id="alimentar">Como abastecê-la</h2>
            <ul>
                <li><strong>Depósitos voluntários</strong>: qualquer membro pode depositar Bitcoins ou PDG (aba Banco, « Dar »), com um motivo se quiser. Exige conta validada e e-mail confirmado.</li>
                <li><strong>Taxa da aliança</strong>: sempre ativa, é descontada automaticamente de cada membro no relatório diário (veja abaixo).</li>
                <li><strong>Taxas de paz</strong>: quando uma aliança derrotada paga uma paz a você, a taxa diária dela em Bitcoins e a parte dos PDG ganhos em combate caem na sua tesouraria (veja <a href="/wiki/diplomacy#paix">Negociar a paz</a>).</li>
                <li><strong>Arena Aliança</strong>: as recompensas da aliança (Bitcoins e PDG) são depositadas no banco.</li>
            </ul>

            <h2 id="retirada">As retiradas</h2>
            <p>Qualquer membro pode pedir uma <strong>retirada</strong> (aba Banco, « Retirar »), em Bitcoins ou em PDG.</p>
            <ul>
                <li>Se você tem a permissão <strong>Modificar</strong>, ou se sua aliança é um <strong>Baluarte Silencioso</strong>, a retirada é imediata.</li>
                <li>Caso contrário, o pedido fica <strong>Em espera</strong> até que um membro que tenha a permissão Modificar o aceite (« Sim »: os fundos são pagos a você) ou o recuse (« Nao »: o pedido é excluído).</li>
                <li>A aceitação falha se a tesouraria não tiver mais o valor, ou se o solicitante tiver saído da aliança nesse meio-tempo.</li>
            </ul>
            <p>Cada movimentação é registrada no histórico do banco.</p>

            <h2 id="taxas">A taxa da aliança</h2>
            <p>A <strong>taxa da aliança</strong> é escolhida <strong>na criação</strong> da aliança, de 5 a 50&nbsp;%. Ela <strong>não pode mais ser modificada depois</strong>. No Baluarte Silencioso, é fixada em 50&nbsp;%.</p>
            <p>Ela é descontada automaticamente no <strong>relatório diário</strong> (18h59, hora de Paris), sobre a renda em Bitcoins que seus trabalhadores rendem a você, e depositada na tesouraria (linha « Taxa diária »).</p>
            <p>Cálculo: o desconto vale renda − renda ÷ (1 + taxa). Uma taxa de 10&nbsp;% retira portanto cerca de 9,1&nbsp;% da renda, uma taxa de 50&nbsp;% retira um terço. Exemplo: sobre 10.000 Bitcoins de renda diária, 10&nbsp;% descontam 909 Bitcoins, 50&nbsp;% descontam 3.333.</p>
            <p>Escolha uma taxa razoável: se for alta demais, os membros vão embora.</p>

            <h2 id="transparencia">Transparência</h2>
            <p>A aba <strong>Banco</strong> exibe a <strong>todos os membros</strong> o histórico das 200 últimas movimentações: membro, tipo (Bitcoins ou PDG), valor, motivo, data e status (Aceita ou Em espera). As taxas diárias e as taxas de paz também constam ali. Cada um pode, portanto, verificar para onde vai o dinheiro.</p>

    political_system:
        title: "Os 3 regimes políticos"
        category: "alliance"
        order: 5
        tags: "politica,regime,bonus,balanca,baluarte,martelo"
        summary: "Os 3 regimes possíveis para uma aliança: vantagens, desvantagens e como escolher."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principio">Escolher na criação</h2>
            <p>Quando uma aliança é criada, o fundador escolhe um <strong>regime político</strong>. Esse regime define <strong>regras internas</strong>, <strong>bônus específicos</strong> e as <strong>7 pesquisas políticas</strong> que seus membros podem iniciar. A escolha é <strong>irreversível</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>A Balança dos Mundos</th><th>O Baluarte Silencioso</th><th>O Martelo das Estrelas</th></tr>
                </thead>
                <tbody>
                    <tr><td>Membros no início</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Líderes</td><td>Um Presidente, eleito por voto</td><td>Todos os membros</td><td>Um só, o Primaris</td></tr>
                    <tr><td>Sair da aliança</td><td>Sim (exceto o Presidente)</td><td>Não</td><td>Não</td></tr>
                    <tr><td>Dissolver a aliança</td><td>Sim</td><td>Sim</td><td>Não</td></tr>
                    <tr><td>Taxa da aliança</td><td>Escolhida na criação (5 a 50&nbsp;%)</td><td>50&nbsp;%</td><td>Escolhida na criação (5 a 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% de armas no ataque contra</td><td>O Baluarte Silencioso</td><td>O Martelo das Estrelas</td><td>A Balança dos Mundos</td></tr>
                </tbody>
            </table>
            <p>O número de membros aumenta depois com o <a href="/wiki/alliance_basics#niveau">nível da aliança</a>. Dissolver uma aliança é sempre impossível em tempo de guerra.</p>

            <h2 id="balanca">A Balança dos Mundos (democrático)</h2>
            <p>Regime aberto e econômico. Os membros votam para eleger seu Presidente. Foco na <strong>economia</strong>.</p>
            <ul>
                <li>3 membros no início.</li>
                <li>Cada membro tem um voto, que pode mudar a qualquer momento (aba dos membros, « Votar no seu presidente »). Assim que um membro tem mais votos que o Presidente, ele toma o lugar dele.</li>
                <li>+20&nbsp;% de armas no ataque contra O Baluarte Silencioso.</li>
                <li>Os membros podem sair da aliança (exceto o Presidente, e nunca em tempo de guerra).</li>
                <li>Membros visíveis publicamente, assim como a posição do primeiro planeta deles.</li>
                <li>Pesquisas voltadas à economia: produção, velocidade das pesquisas, manutenção dos cientistas, cargueiros, blindagem das naves, vendas aos mercadores, colonização (detalhes em <a href="/wiki/alliance_research">Pesquisas de aliança</a>).</li>
            </ul>

            <h2 id="baluarte">O Baluarte Silencioso (ofensivo)</h2>
            <p>Regime agressivo e coletivo. Todos os membros são líderes. Foco na <strong>ofensiva</strong>.</p>
            <ul>
                <li>4 membros no início (um a mais que a Balança dos Mundos).</li>
                <li>+20&nbsp;% de armas no ataque contra O Martelo das Estrelas.</li>
                <li>Taxa da aliança fixada automaticamente em 50&nbsp;%.</li>
                <li>As retiradas da tesouraria são imediatas para todos os membros.</li>
                <li>É impossível sair da aliança.</li>
                <li>Pesquisas voltadas ao combate: reciclagem, defesa dos trabalhadores, poder das naves, manutenção e recrutamento dos Legionários, invasões, Pontos de Guerra.</li>
            </ul>
            <p>As três patentes de topo (<strong>Guia</strong>, <strong>Protetor</strong>, <strong>Camarada</strong>) são <strong>equivalentes</strong>: mesmos direitos, nenhuma hierarquia entre elas. Podem ser atribuídas livremente entre os membros, e os recém-chegados entram como Camaradas, com todos os direitos. A única patente inferior é o <strong>Gulag</strong>, sem nenhuma permissão, atribuído para pôr um membro de lado.</p>

            <h2 id="martelo">O Martelo das Estrelas (defensivo)</h2>
            <p>Regime discreto e defensivo. Um único líder, o Primaris, que só é substituído se ficar inativo por mais de 7 dias (veja <a href="/wiki/alliance_grades#afk">Patentes e permissões</a>). Foco na <strong>defesa</strong> e na resistência.</p>
            <ul>
                <li>2 membros no início (um a menos que a Balança dos Mundos, dois a menos que o Baluarte Silencioso).</li>
                <li>+20&nbsp;% de armas no ataque contra A Balança dos Mundos.</li>
                <li>Ameaça Cthulhu que sobe 25&nbsp;% mais devagar que nos outros dois regimes: +150 em vez de +200 por vitória contra os Cthulhu em dificuldade normal (veja <a href="/wiki/cthulhus#ameaca">A ameaça Cthulhu</a>). Muito útil em PvE.</li>
                <li>Somente o líder é exibido publicamente.</li>
                <li>É impossível sair da aliança. É impossível dissolvê-la.</li>
                <li>Se o líder sofre Game Over, a aliança é dissolvida.</li>
                <li>Pesquisas voltadas à defesa: produção de trabalhadores, poder das naves, capacidade das barcaças, força dos Legionários, manutenção e defesa dos Mechas, invasões.</li>
            </ul>

            <h2 id="combate">Bônus entre regimes</h2>
            <p>Cada regime domina outro, em pedra-papel-tesoura:</p>
            <ul>
                <li>A Balança dos Mundos vence O Baluarte Silencioso.</li>
                <li>O Baluarte Silencioso vence O Martelo das Estrelas.</li>
                <li>O Martelo das Estrelas vence A Balança dos Mundos.</li>
            </ul>
            <p>Quando seu lado <strong>ataca</strong> em um combate espacial (ou na Arena Aliança) e seu regime domina o do defensor, seus <strong>mísseis, lasers e plasma</strong> ganham <strong>+20&nbsp;%</strong>. Na defesa, ou diante do mesmo regime, não há bônus. Os combates em solo não são afetados.</p>

            <h2 id="visibilite">O que os outros veem de você</h2>
            <ul>
                <li><strong>A Balança dos Mundos</strong>: todos os membros aparecem na ficha da aliança, com o número de planetas dela, e a ficha de cada membro indica a posição do primeiro planeta.</li>
                <li><strong>O Baluarte Silencioso</strong>: os membros aparecem na ficha da aliança, mas os rankings ocultam o número de membros e de planetas.</li>
                <li><strong>O Martelo das Estrelas</strong>: somente o líder aparece na ficha da aliança, a lista de planetas dos membros fica oculta na ficha deles, e os rankings ocultam o número de membros e de planetas.</li>
            </ul>

            <h2 id="escolher">Como escolher?</h2>
            <ul>
                <li><strong>Você está começando e quer crescer</strong> → A Balança dos Mundos (econômica, e a única da qual se pode sair).</li>
                <li><strong>Você quer uma aliança unida e agressiva</strong> → O Baluarte Silencioso.</li>
                <li><strong>Você quer se proteger, jogar na defensiva</strong> → O Martelo das Estrelas (atenção: em caso de Game Over do líder, tudo desmorona).</li>
            </ul>

    alliance_research:
        title: "Pesquisas de aliança"
        category: "alliance"
        order: 6
        tags: "pesquisa,alianca,politica,politicas,regime,bonus,melhoria"
        summary: "As 7 pesquisas políticas do seu regime: pesquisas pessoais, pagas com seus próprios Bitcoins e desbloqueadas pelo nível da aliança."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principio">Como funciona</h2>
            <p>As pesquisas de aliança, chamadas de <strong>pesquisas políticas</strong>, são iniciadas na página <strong>Pesquisas</strong>, categoria <strong>Políticas</strong>. Cada regime tem <strong>7 pesquisas</strong> de <strong>5 níveis</strong>. Elas são desbloqueadas uma a uma com o <strong>nível da aliança</strong>: a primeira já no nível 0, a segunda no nível 1… até a sétima no nível 6 (veja <a href="/wiki/alliance_basics#niveau">Nível da aliança</a>). Sem aliança, a categoria exibe « Requisito: Juntar-se a uma aliança ».</p>
            <p>São pesquisas <strong>pessoais</strong>: cada membro as inicia para si mesmo, na sua própria fila de pesquisas, com <strong>seus próprios Bitcoins</strong>, e o bônus se aplica <strong>somente a ele</strong>. O custo de um nível é o custo base × o nível desejado, reduzido pela melhoria de aliança « Custo de pesquisa ». A duração depende dos seus cientistas, como em qualquer pesquisa.</p>
            <p><strong>Atenção</strong>: se você sair da aliança, for expulso dela ou ela for dissolvida, todos os seus níveis de pesquisas políticas voltam a zero. Uma pesquisa política que termina quando você já não tem aliança não traz nada.</p>
            <p>Não confunda com as <a href="/wiki/alliance_improvements">melhorias de aliança</a>, coletivas e financiadas pelos investimentos dos membros. As duas se acumulam.</p>

            <h2 id="lista">As pesquisas de cada regime</h2>
            <p>Efeito por nível, depois efeito no nível 5. Custo do nível N = custo base × N, em Bitcoins: os 5 níveis custam 15 vezes o custo base (por exemplo, 375.000 Bitcoins para uma pesquisa de 25.000). O nível de aliança exigido é indicado entre parênteses.</p>

            <h3>A Balança dos Mundos</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>Efeito</th><th>Custo base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Lei Macron</strong> (nív. 0)</td><td>+7,1&nbsp;% de produção de nióbio, água e rações por nível, além dos +20&nbsp;% da aliança (×1,56 no total no nível 5, contra ×1,2 sem a pesquisa)</td><td>25.000</td></tr>
                    <tr><td><strong>Mobilização científica</strong> (nív. 1)</td><td>+0,1 de velocidade de pesquisa por nível (+0,5 no nível 5), até a próxima chegada de cientistas, que arredonda a velocidade para o inteiro mais próximo (veja <em>Trabalhadores e cientistas</em>)</td><td>50.000</td></tr>
                    <tr><td><strong>Entusiasmo científico</strong> (nív. 2)</td><td>Manutenção dos cientistas reduzida: −17&nbsp;% no nível 1, −50&nbsp;% no nível 5</td><td>100.000</td></tr>
                    <tr><td><strong>Cargos melhorados</strong> (nív. 3)</td><td>+20&nbsp;% de capacidade dos cargueiros por nível (+100&nbsp;%)</td><td>150.000</td></tr>
                    <tr><td><strong>Blindagem de naves</strong> (nív. 4)</td><td>+10&nbsp;% de armadura das naves por nível (+50&nbsp;%)</td><td>200.000</td></tr>
                    <tr><td><strong>Acordos comerciais</strong> (nív. 5)</td><td>+5&nbsp;% de ganhos de venda aos mercadores por nível (+25&nbsp;%)</td><td>250.000</td></tr>
                    <tr><td><strong>Contribuição da Democracia</strong> (nív. 6)</td><td>+1 planeta colonizável por nível (+5)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h3>O Baluarte Silencioso</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>Efeito</th><th>Custo base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Otimização de reciclagem</strong> (nív. 0)</td><td>Cada reciclador traz 1.000 + 400 × nível de recursos por ciclo de 5 minutos (1.400 no nível 1, 3.000 no nível 5, ou seja, o triplo)</td><td>25.000</td></tr>
                    <tr><td><strong>Reforço ideológico</strong> (nív. 1)</td><td>+20&nbsp;% de defesa dos trabalhadores por nível (+100&nbsp;%)</td><td>50.000</td></tr>
                    <tr><td><strong>Armamentos melhorados</strong> (nív. 2)</td><td>+10&nbsp;% de poder das naves por nível (+50&nbsp;%)</td><td>100.000</td></tr>
                    <tr><td><strong>Estrutura soviética</strong> (nív. 3)</td><td>Manutenção dos Legionários reduzida: −9&nbsp;% no nível 1, −33&nbsp;% no nível 5</td><td>150.000</td></tr>
                    <tr><td><strong>Recrutamento voluntário</strong> (nív. 4)</td><td>−1 Bitcoin por nível no preço de recrutamento de um Legionário (8 → 3 Bitcoins)</td><td>200.000</td></tr>
                    <tr><td><strong>Império sem fronteiras</strong> (nív. 5)</td><td>+1 planeta conquistado por invasão por nível (+5)</td><td>250.000</td></tr>
                    <tr><td><strong>Pontos de Guerra</strong> (nív. 6)</td><td>+10&nbsp;% de PDG ganhos por nível (+50&nbsp;%)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h3>O Martelo das Estrelas</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>Efeito</th><th>Custo base</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Política familiar</strong> (nív. 0)</td><td>+20&nbsp;% de produção de trabalhadores por nível (+100&nbsp;%)</td><td>25.000</td></tr>
                    <tr><td><strong>Armamentos melhorados</strong> (nív. 1)</td><td>+10&nbsp;% de poder das naves por nível (+50&nbsp;%)</td><td>50.000</td></tr>
                    <tr><td><strong>Invasões planejadas</strong> (nív. 2)</td><td>+25&nbsp;% de capacidade das barcaças por nível: 1.250 Legionários por barcaça no nível 1, 2.250 no nível 5</td><td>100.000</td></tr>
                    <tr><td><strong>Potência militar</strong> (nív. 3)</td><td>+10&nbsp;% de força dos Legionários, no ataque e na defesa, por nível (+50&nbsp;%)</td><td>150.000</td></tr>
                    <tr><td><strong>Superioridade mecânica</strong> (nív. 4)</td><td>Manutenção dos Mechas reduzida: −17&nbsp;% no nível 1, −50&nbsp;% no nível 5</td><td>200.000</td></tr>
                    <tr><td><strong>Blindagem de Mechas</strong> (nív. 5)</td><td>+10&nbsp;% de defesa dos Mechas por nível (+50&nbsp;%)</td><td>250.000</td></tr>
                    <tr><td><strong>Império sem fronteiras</strong> (nív. 6)</td><td>+1 planeta conquistado por invasão por nível (+5)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h2 id="escolher">Quais pesquisas priorizar?</h2>
            <ul>
                <li><strong>A Balança dos Mundos</strong> → Lei Macron, Mobilização científica, Cargos melhorados.</li>
                <li><strong>O Baluarte Silencioso</strong> → Armamentos melhorados, Império sem fronteiras, Pontos de Guerra.</li>
                <li><strong>O Martelo das Estrelas</strong> → Política familiar, Invasões planejadas, Potência militar, Blindagem de Mechas.</li>
            </ul>
            <p>Cada um escolhe suas próprias pesquisas, mas as últimas só se abrem ao subir o nível da aliança: organizem isso juntos na sala, com a tesouraria.</p>

    salon:
        title: "A sala de aliança"
        category: "alliance"
        order: 7
        tags: "sala,salao,chat,discussao,alianca,mensagem"
        summary: "O chat da sua aliança: ao vivo, com histórico, coordenadas clicáveis e salas comuns com seus aliados."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="funcionamento">Como funciona</h2>
            <p>A <strong>sala da aliança</strong> é um chat ao vivo reservado aos membros da sua aliança. Abra <strong>Salao</strong> no menu: a sala da sua aliança é a aba que leva o nome dela.</p>
            <p>Você também encontra ali a sala <strong>Universo</strong> (todo o servidor), uma sala para cada galáxia onde você tem um planeta e, para cada <strong>aliança defensiva</strong> assinada, uma sala comum às duas alianças (excluída junto com suas mensagens quando a aliança defensiva termina).</p>
            <p>As mensagens são guardadas: você pode voltar no histórico para reencontrar uma informação.</p>

            <h2 id="uso">Para que serve</h2>
            <ul>
                <li><strong>Coordenar os ataques</strong>: lançar um raid em dupla vale mais do que um só que é repelido.</li>
                <li><strong>Alertar</strong> quando uma frota inimiga for avistada.</li>
                <li><strong>Compartilhar coordenadas</strong> (planetas-alvo, campos de destroços interessantes): escritas no formato <code>galáxia:setor:posição</code> (ex. <code>1:15:25</code>), elas se tornam um link que abre esse setor no mapa espacial (a galáxia deve existir, o setor ir de 1 a 100 e a posição de 1 a 25). Os links para uma página do jogo também se tornam clicáveis.</li>
                <li><strong>Discutir a estratégia</strong> da aliança (pesquisas, diplomacia, guerras).</li>
                <li><strong>Se apresentar</strong> aos novos membros e criar laços.</li>
            </ul>

            <h2 id="boas-praticas">Boas práticas</h2>
            <ul>
                <li>Seja respeitoso: insultos e assédio podem ser punidos. Uma mensagem abusiva se denuncia pela própria mensagem (veja <a href="/wiki/moderation_blocking">Moderação</a>).</li>
                <li>Evite fazer spam: deixe espaço para as discussões estratégicas. Uma mensagem tem no máximo <strong>200 caracteres</strong>, e é possível enviar 20 por minuto.</li>
                <li>Para chamar alguém, clique no apelido dele: « Apelido &gt; » é adicionado à sua mensagem. Uma mensagem que contenha seu apelido, ou a tag da sua aliança entre colchetes (ex. <code>[TAG]</code>), é destacada para você.</li>
                <li>Quando um conselho for dado, anote-o: as mensagens rolam rápido.</li>
            </ul>

            <h2 id="mensagens-privadas">E as mensagens privadas?</h2>
            <p>À parte da sala, você pode enviar uma <strong>mensagem privada</strong> a qualquer jogador do servidor, inclusive fora da sua aliança. Útil para a diplomacia discreta, para responder a uma proposta ou para pedir a uma aliança que convide você. Coordenadas e links do jogo se tornam clicáveis ali exatamente como na sala.</p>

    alliance_improvements:
        title: "Melhorias de aliança"
        category: "alliance"
        order: 8
        tags: "melhorias,alianca,bonus,bitcoin,investimento,coletivo,niveis"
        summary: "Invista Bitcoins para desbloquear 16 bônus coletivos que reforçam toda a sua aliança — velocidade de pesquisa, produção, poder de combate e mais."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="visao-geral">Princípio</h2>
            <p>A aba <strong>Melhorias</strong> da página da aliança permite que os membros invistam Bitcoins para desbloquear e melhorar <strong>16 bônus coletivos</strong>. Esses bônus beneficiam <strong>todos os membros</strong> da aliança, conectados ou não. Um jogador que sai da aliança deixa de se beneficiar deles, mas a aliança conserva os níveis adquiridos.</p>

            <h2 id="quota">Cota de investimento</h2>
            <p>Cada membro dispõe de <strong>20 investimentos por período de 3 horas</strong>. O período começa no seu primeiro investimento; ao fim de 3 horas, a cota volta a 20. Os investimentos não usados são perdidos: a cota não se acumula. A aba exibe seus « Investimentos disponíveis » e, quando a cota se esgota, o tempo restante antes da « Próxima janela em ».</p>
            <p>Cada investimento custa <strong>1.000 Bitcoins</strong> tirados do seu saldo pessoal. É um gasto definitivo, sem reembolso. É preciso uma conta validada e um e-mail confirmado para investir.</p>
            <p>Sob cada bônus, botões rápidos <strong>×1 / ×5 / ×10</strong> permitem investir vários pontos com um clique.</p>

            <h2 id="niveis">Níveis e limites</h2>
            <p>Cada bônus possui <strong>5 níveis</strong>. Os limites de investimentos exigidos para passar ao nível seguinte são:</p>
            <table>
                <thead>
                    <tr><th>Nível</th><th>Investimentos necessários</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1.000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Os investimentos excedentes além do limite de um nível são <strong>perdidos</strong>: não há transferência para o nível seguinte.</p>
            <p>Para levar um bônus ao nível 5, são necessários <strong>3.360 investimentos</strong> no total, ou seja, 3.360.000 Bitcoins. É um projeto coletivo: a 20 investimentos por período de 3 horas, um jogador sozinho levaria 168 períodos.</p>

            <h2 id="bonus">Os 16 bônus e seus efeitos</h2>
            <table>
                <thead>
                    <tr><th>Bônus</th><th>Efeito por nível</th><th>Máximo (nível 5)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Velocidade de pesquisa</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Custo de pesquisa</strong></td><td>−1&nbsp;% por nível</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Impulso de construção</strong></td><td>+15 s de redução por ajuda</td><td>75 s de redução por ajuda</td></tr>
                    <tr><td><strong>Custo de construção</strong></td><td>−1&nbsp;% por nível</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Produção de nióbio</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Produção de água</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Produção de rações</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Velocidade de frota</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potência de mísseis</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potência laser</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Potência de plasma</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Precisão</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Blindagem de frota</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Escudo</strong></td><td>+1&nbsp;% por nível</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Defesa planetária</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Experiência do herói</strong></td><td>+2&nbsp;% por nível</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>O <strong>Impulso de construção</strong> alimenta diretamente a <a href="/wiki/alliance_construction_help">ajuda de construção</a>: quanto mais alto o nível dele, mais cada ajuda de um aliado reduz a duração da obra.</p>
            <p>Não confunda a melhoria « Velocidade de pesquisa » com a pesquisa política « Mobilização científica » da Balança dos Mundos (para quem a pesquisa, veja <a href="/wiki/alliance_research">Pesquisas de aliança</a>). A melhoria « Velocidade de pesquisa » encurta a duração exibida na página Pesquisas, mas não a duração real: uma pesquisa iniciada termina no horário calculado sem ela.</p>

            <h2 id="absence">E se um membro se ausenta?</h2>
            <p>Não existe modo férias. Um membro ausente <strong>mantém todos os seus bônus de aliança</strong> (produção, melhorias, pesquisas políticas) enquanto permanecer na aliança, e a taxa da aliança dele continua sendo descontada todo dia. Após <strong>7 dias</strong> sem conexão, um líder inativo é substituído automaticamente (veja <a href="/wiki/alliance_grades#afk">Patentes e permissões</a>). Após <strong>8 dias</strong>, a conta passa para o piloto automático, mas continua membro da aliança.</p>

    alliance_construction_help:
        title: "Ajuda de construção"
        category: "alliance"
        order: 9
        tags: "ajuda,construcao,alianca,boost,edificio,aceleracao,impulso"
        summary: "Um clique para acelerar as obras de todos os seus aliados ao mesmo tempo — e eles fazem o mesmo por você."
        related: "alliance_improvements"
        body: |
            <h2 id="visao-geral">Princípio</h2>
            <p>A <strong>ajuda de construção</strong> permite aos membros de uma aliança acelerar mutuamente suas obras em andamento com um simples clique. Quando um ou vários aliados têm uma construção em andamento no planeta, um <strong>ícone de ajuda</strong> (uma mão segurando um coração) aparece na barra global da interface. O selo indica o número de construções elegíveis. É preciso uma conta validada e um e-mail confirmado para ajudar.</p>
            <p>Um clique nesse ícone dispara automaticamente a ajuda em <strong>todas as construções elegíveis</strong> da aliança de uma vez: não é preciso selecioná-las uma a uma.</p>

            <h2 id="ganho">Ganho por ajuda</h2>
            <p>Cada ajuda dada acelera a construção em:</p>
            <blockquote><strong>15 segundos × nível do bônus « Impulso de construção »</strong></blockquote>
            <p>O ganho é <strong>limitado a 75 segundos</strong> por ajuda e por membro (nível 5 × 15 s = 75 s). Esse nível é o da <strong>sua aliança</strong>: todos os membros dão o mesmo ganho por ajuda. Uma construção não pode cair abaixo de <strong>30 segundos restantes</strong> graças à ajuda mútua.</p>
            <table>
                <thead>
                    <tr><th>Nível do bônus</th><th>Ganho por ajuda</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (não desbloqueado)</td><td>15 s</td></tr>
                    <tr><td>1</td><td>15 s</td></tr>
                    <tr><td>2</td><td>30 s</td></tr>
                    <tr><td>3</td><td>45 s</td></tr>
                    <tr><td>4</td><td>60 s</td></tr>
                    <tr><td>5</td><td>75 s</td></tr>
                </tbody>
            </table>

            <h2 id="elegibilidade">Elegibilidade de uma construção</h2>
            <p>Para que uma construção seja ajudada, duas condições devem ser atendidas:</p>
            <ul>
                <li><strong>Duração total &gt; 30 segundos</strong> (entre o início e o fim previsto).</li>
                <li><strong>Tempo restante &gt; 30 segundos</strong> no momento em que a ajuda é dada.</li>
            </ul>
            <p>As obras quase terminadas (30 s restantes ou menos) não se beneficiam da ajuda mútua.</p>

            <h2 id="deduplicacao">Uma ajuda por construção</h2>
            <p>Um mesmo membro só pode ajudar <strong>cada construção uma única vez</strong>. O ícone desaparece automaticamente quando não há mais construção que você ainda não ajudou. Vários membros podem ajudar a mesma construção, e os ganhos se acumulam: 3 membros de uma aliança no nível 3 dão cada um 45 s, ou seja, 135 s no total.</p>

            <h2 id="ligacao">Ligação com as melhorias de aliança</h2>
            <p>O ganho por ajuda depende diretamente do nível do bônus <strong>« Impulso de construção »</strong> na aba <a href="/wiki/alliance_improvements">Melhorias</a>. Investir nesse bônus beneficia todo mundo: quanto mais rápido seus aliados terminam seus edifícios, mais rápido o império da aliança cresce.</p>

    leveling:
        title: "Níveis e experiência"
        category: "progression"
        order: 1
        tags: "nivel,experiencia,progressao,level,pontuacao,pontos"
        summary: "Sua progressão do nível 2 ao nível 40, alimentada pelo crescimento da sua pontuação."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calculo">O que conta para a sua pontuação</h2>
            <p>Sua pontuação (seus <strong>pontos</strong>, os do ranking) mede o <strong>tamanho do seu império</strong>. Ela é recalculada uma vez por dia, no relatório diário das 18h59 (hora de Paris), e soma:</p>
            <table>
                <tr><th>Elemento</th><th>O que vale 1 ponto</th></tr>
                <tr><td><strong>Trabalhadores</strong></td><td>100 trabalhadores.</td></tr>
                <tr><td><strong>Naves no hangar</strong> (e em produção)</td><td>120 de assinatura térmica (por exemplo, 6 fragatas, de assinatura 20 cada).</td></tr>
                <tr><td><strong>Naves em frota</strong></td><td>20 de assinatura (por exemplo, 1 fragata). Uma nave em frota conta <strong>seis vezes mais</strong> que no hangar.</td></tr>
                <tr><td><strong>Legionários</strong></td><td>500 em um planeta, cerca de 83 embarcados em uma frota.</td></tr>
                <tr><td><strong>Mechas</strong></td><td>25 em um planeta; embarcado em uma frota, cada Mecha vale 2 pontos.</td></tr>
                <tr><td><strong>Cientistas</strong></td><td>Cerca de 17 em um planeta, 25 em uma frota.</td></tr>
                <tr><td><strong>Torres</strong></td><td>Cada torre vale: lança-mísseis 0,9; torre laser 0,6; torre laser pesada 1,2; laser iônico 1,2; artilharia de plasma 0,8; canhão Gauss 2,4.</td></tr>
                <tr><td><strong>Edifícios</strong> (por nível)</td><td>Mina de niobium, Extrator de água, Campo agrícola: 15 · Radar terrestre: 20 · Caserna: 25 · Fazenda aeropônica, Centro de pesquisa, Estaleiro espacial: 30 · Armazém de Niobium, Reservatório de água, Silo agrícola: 45 · Fábrica de armamento: 50 · Radar espacial: 60 · Grande cidade: 65 · Bloqueador de radar: 100 · Metrópole: 120 · Forte defensivo: 130 · Indústria pesada: 150 · Base nuclear: 300 · Cidade flutuante, Estação orbital: 2.000. A Prisão e o Campo de escravos não rendem pontos.</td></tr>
            </table>
            <p>Os valores das tropas são os de base: as pesquisas de regime que reduzem a manutenção dos Legionários, dos Mechas ou dos cientistas também reduzem os pontos que eles rendem. Os Pontos de Guerra não contam na pontuação.</p>
            <p>Perder naves em combate, demolir um edifício ou ver tropas morrerem faz, portanto, sua pontuação cair no relatório seguinte.</p>

            <h2 id="experience">Pontuação, experiência e nível</h2>
            <p>Seu nível depende da sua <strong>experiência</strong>, que só cresce com a sua pontuação. A cada relatório diário, se sua nova pontuação ultrapassa a de anteontem, a diferença é somada à sua experiência.</p>
            <p>Exemplo: sua pontuação era 10.000 anteontem, 11.000 ontem e 12.000 hoje: você ganha 2.000 pontos de experiência no relatório do dia.</p>
            <p>Se sua pontuação cai, você não ganha experiência nesse dia, mas nunca a perde: <strong>seu nível nunca diminui</strong>. O total de experiência não é exibido no jogo; somente o nível é.</p>

            <h2 id="limites">Os patamares de nível</h2>

            <p>Todo comandante começa no <strong>nível 2</strong>, com 0 ponto de experiência. Experiência a atingir para cada nível:</p>
            <table>
                <tr><th>Nível</th><th>Experiência</th><th>Nível</th><th>Experiência</th></tr>
                <tr><td>2</td><td>0</td><td>22</td><td>24.000.000</td></tr>
                <tr><td>3</td><td>2.000</td><td>23</td><td>30.000.000</td></tr>
                <tr><td>4</td><td>10.000</td><td>24</td><td>50.000.000</td></tr>
                <tr><td>5</td><td>40.000</td><td>25</td><td>80.000.000</td></tr>
                <tr><td>6</td><td>100.000</td><td>26</td><td>100.000.000</td></tr>
                <tr><td>7</td><td>150.000</td><td>27</td><td>200.000.000</td></tr>
                <tr><td>8</td><td>200.000</td><td>28</td><td>250.000.000</td></tr>
                <tr><td>9</td><td>280.000</td><td>29</td><td>500.000.000</td></tr>
                <tr><td>10</td><td>450.000</td><td>30</td><td>800.000.000</td></tr>
                <tr><td>11</td><td>800.000</td><td>31</td><td>1.000.000.000</td></tr>
                <tr><td>12</td><td>1.000.000</td><td>32</td><td>2.000.000.000</td></tr>
                <tr><td>13</td><td>1.300.000</td><td>33</td><td>3.000.000.000</td></tr>
                <tr><td>14</td><td>2.000.000</td><td>34</td><td>6.000.000.000</td></tr>
                <tr><td>15</td><td>3.000.000</td><td>35</td><td>12.500.000.000</td></tr>
                <tr><td>16</td><td>5.000.000</td><td>36</td><td>25.000.000.000</td></tr>
                <tr><td>17</td><td>7.000.000</td><td>37</td><td>50.000.000.000</td></tr>
                <tr><td>18</td><td>9.000.000</td><td>38</td><td>80.000.000.000</td></tr>
                <tr><td>19</td><td>12.000.000</td><td>39</td><td>100.000.000.000</td></tr>
                <tr><td>20</td><td>15.000.000</td><td>40</td><td>200.000.000.000</td></tr>
                <tr><td>21</td><td>18.000.000</td><td></td><td></td></tr>
            </table>
            <p>O nível 40 é o máximo. A progressão é <strong>exponencial</strong>: subir do nível 2 ao nível 10 é bem mais rápido do que do 30 ao 40.</p>

            <h2 id="utilidade">Para que serve o seu nível</h2>
            <ul>
                <li><strong>Bônus de conexão</strong> — o piso do bônus diário vale seu nível × 5.000 Bitcoins, multiplicado por um sorteio de ×1 a ×5 (veja <em>Bônus de conexão</em>).</li>
                <li><strong>Vitrine</strong> — seu nível é exibido no cartão do comandante (página Visao geral) e no seu perfil. O ranking, por sua vez, é feito pelos pontos, não pelo nível.</li>
            </ul>

    war_points:
        title: "Pontos de Guerra (PDG)"
        category: "progression"
        order: 2
        tags: "pdg,pontos,guerra,combate,ranking"
        summary: "A segunda moeda do jogo, ganha principalmente em combate, para gastar em Bitcoins, tropas, naves de elite e edifícios."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="o-que-e">O que são os PDG?</h2>
            <p>Os <strong>Pontos de Guerra</strong> (<strong>PDG</strong>) são uma segunda "moeda" de progressão, <strong>voltada ao combate</strong>. Enquanto seu nível reflete o crescimento do seu império, seus PDG refletem sua atividade militar. Eles aparecem na barra de recursos e são próprios de cada servidor: em um servidor novo, você recomeça do zero.</p>

            <h2 id="ganhar">Como ganhar</h2>
            <ul>
                <li><strong>Combates espaciais</strong> — o vencedor ganha PDG proporcionais à assinatura da frota inimiga destruída (1 PDG para cada 100 de assinatura em um combate de uma frota contra uma frota), nunca de acordo com as próprias perdas. Uma horda Cthulhu ou uma frota alien rende 5 vezes menos que uma frota de jogador de mesma assinatura (salvaguarda contra farm).</li>
                <li><strong>Perder um combate espacial</strong> — mesmo assim você recebe uma consolação: 1 PDG para cada 500 de assinatura perdida, ou seja, um quinto do que um vencedor receberia pela mesma frota.</li>
                <li><strong>Defesa orbital</strong> — quando suas torres aniquilam uma frota em órbita: 1 PDG para cada 100 de assinatura destruída (5 vezes menos diante de um Cthulhu ou de um alien). Arrasar as defesas de um planeta adversário, por outro lado, não rende nada ao atacante.</li>
                <li><strong>Raids</strong> — o atacante vitorioso ganha 1 PDG para cada 100 Legionários e Mechas defensores mortos.</li>
                <li><strong>Invasões</strong> — uma invasão bem-sucedida rende muito pouco: 1 PDG para cada 60.000 Legionários defensores mortos (um trabalhador morto conta como um décimo de Legionário).</li>
                <li><strong>Repelir um raid ou uma invasão</strong> — o defensor ganha cerca de 7,5 PDG para cada 100 Legionários atacantes mortos.</li>
                <li><strong>Eliminar um jogador</strong> — se sua invasão toma dele o último planeta, você recupera todos os PDG e todos os Bitcoins dele.</li>
                <li><strong>Cthulhu</strong> — repelir uma horda que ataca seu planeta rende PDG de acordo com a força da horda, e romper um bloqueio Cthulhu rende uma recompensa em Bitcoins e em PDG, dividida conforme o dano de cada um. O Tower Defense, por sua vez, rende urânio, não PDG.</li>
                <li><strong>Objetivos diários</strong> — cada objetivo cumprido rende PDG (veja <em>Missões diárias</em>).</li>
                <li><strong>Arena (duelos de heróis)</strong> — cada duelo vencido rende 15 PDG por nível do seu herói, reduzidos em até metade se os dois heróis tiverem níveis muito diferentes (num sentido ou no outro). Exemplos: herói nível 10 contra nível 10 = 150 PDG; nível 10 contra nível 4 = 75 PDG. O pódio do ranking semanal da arena (300 / 200 / 100 PDG) e o dos torneios (500 / 300 / 150 PDG, e 50 PDG para cada participante) também rendem.</li>
                <li><strong>Prisão</strong> — executar um herói capturado rende 100 PDG por nível do herói.</li>
                <li><strong>Venda aos mercadores</strong> — cada venda rende alguns PDG além dos Bitcoins.</li>
                <li><strong>Tutorial</strong> — 500 PDG fazem parte de suas recompensas.</li>
                <li><strong>Banco da aliança</strong> — uma retirada do banco da sua aliança pode pagar PDG a você.</li>
            </ul>
            <p>A pesquisa de aliança <strong>Pontos de Guerra</strong> (aliança de nível 6 no mínimo) aumenta em 10&nbsp;% por nível, até +50&nbsp;%, os PDG ganhos em combate espacial, em defesa orbital, em raid, em invasão e na venda aos mercadores.</p>

            <h2 id="utilidade">Para que servem</h2>
            <ul>
                <li><strong>Loja da página Objetivos</strong> — troque seus PDG por Bitcoins (1 PDG = 1 Bitcoin), Legionários (1 PDG = 2 Legionários) ou trabalhadores (1 PDG = 10 trabalhadores), entregues no planeta de sua escolha dentro do limite de capacidade dele.</li>
                <li><strong>Naves de elite</strong> — algumas naves são pagas em PDG (e em trabalhadores): Caçador de plasma (1 PDG), Corveta de combate (3), Nave de batalha (8), Caravela (25), Nave mãe (25.000), por unidade.</li>
                <li><strong>Edifícios</strong> — a Cidade flutuante e a Estação orbital custam 2.000 PDG por nível desejado (2.000 para o nível 1, 4.000 para o nível 2…).</li>
                <li><strong>Pesquisa Expansão territorial</strong> — 75.000 PDG para o nível 1, 150.000 para o nível 2.</li>
                <li><strong>Torturar um prisioneiro</strong> — 200 PDG para revelar a posição de um planeta inimigo.</li>
                <li><strong>Banco da aliança</strong> — você pode depositar PDG nele.</li>
                <li><strong>Ranking</strong> — a coluna « Pdg » da Classificacao de Comandantes permite comparar a atividade militar dos jogadores.</li>
                <li><strong>Servidor pago</strong> — o vencedor é o jogador que tem o maior total « pontos + 2 × PDG » no fim do servidor.</li>
            </ul>

            <h2 id="perdre">É possível perdê-los?</h2>
            <ul>
                <li><strong>Gastando-os</strong> — loja da página Objetivos, naves de elite, Cidade flutuante, Estação orbital, pesquisa Expansão territorial, tortura de um prisioneiro, depósito no banco da aliança. Cancelar uma produção de naves, uma construção ou uma pesquisa devolve os PDG gastos.</li>
                <li><strong>Sendo eliminado</strong> — se um jogador invade seu último planeta, você sofre Game Over e ele recupera <strong>todos</strong> os seus PDG e seus Bitcoins.</li>
                <li><strong>Taxa de paz</strong> — se sua aliança aceitou uma paz que paga um tributo em PDG, uma parte dos PDG que você ganha em combate vai para a aliança vencedora.</li>
            </ul>
            <p>Perder um combate não tira nenhum PDG de você (você até recebe uma pequena consolação), e uma falência econômica não os afeta.</p>

            <h2 id="estrategia">Estratégia</h2>
            <p>Os PDG recompensam os jogadores <strong>agressivos</strong>. Se você quer subir na coluna « Pdg » do ranking, concentre-se nos combates espaciais, na defesa dos seus planetas, nos raids e na arena, em vez do puro crescimento econômico.</p>

    quests:
        title: "Missões diárias"
        category: "progression"
        order: 3
        tags: "missoes,objetivos,diario,missao,recompensa,pdg"
        summary: "3 objetivos por dia, a cumprir antes do relatório seguinte, pagos em Pontos de Guerra."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Todo dia, no relatório diário das <strong>18h59 (hora de Paris)</strong>, o jogo atribui a você <strong>3 missões diárias</strong>, chamadas de « Objetivos » no menu. São pequenas tarefas que você pode cumprir durante sua sessão de jogo normal.</p>
            <p>Você tem até o relatório seguinte para cumpri-las: as que sobram são então excluídas e substituídas por 3 novas.</p>
            <p>Ao chegar em um servidor, suas primeiras missões são sempre as mesmas: escrever uma mensagem na sala, sondar o planeta de um jogador e entrar em uma aliança ou criar uma (exceto no Battle Royale).</p>
            <p>O jogo só dá missões realizáveis no dia: nada de construção sem a pesquisa ou o espaço necessários, nada de ataque enquanto você estiver sob proteção de iniciante, nada de raid nem invasão sem barcaça, nada de « Colonizar um planeta » se você já possui 20 planetas colonizados, etc.</p>

            <h2 id="tipos">As missões possíveis</h2>
            <p>As 3 missões do dia são sorteadas nesta lista (recompensa base em PDG):</p>
            <table>
                <tr><th>Missão</th><th>Recompensa base</th></tr>
                <tr><td>Enviar uma mensagem privada</td><td>250</td></tr>
                <tr><td>Escrever uma mensagem na sala (qualquer sala à qual você tenha acesso)</td><td>250</td></tr>
                <tr><td>Gastar Pontos de Guerra (na loja da página Objetivos)</td><td>250</td></tr>
                <tr><td>Sondar o planeta de um jogador</td><td>250</td></tr>
                <tr><td>Mudar seu avatar (se você não tiver um)</td><td>250</td></tr>
                <tr><td>Vender recursos aos mercadores</td><td>500</td></tr>
                <tr><td>Criar uma nova Coorte</td><td>500</td></tr>
                <tr><td>Treinar Legionários</td><td>500</td></tr>
                <tr><td>Melhorar suas naves</td><td>500</td></tr>
                <tr><td>Construir defesas (tropas ou torres)</td><td>500</td></tr>
                <tr><td>Construir naves</td><td>500</td></tr>
                <tr><td>Construir um escudo</td><td>750</td></tr>
                <tr><td>Colonizar um planeta</td><td>1.000</td></tr>
                <tr><td>Reciclar recursos</td><td>1.000</td></tr>
                <tr><td>Construir o edifício Grande cidade</td><td>1.000</td></tr>
                <tr><td>Concluir uma pesquisa</td><td>1.000</td></tr>
                <tr><td>Treinar cientistas</td><td>1.000</td></tr>
                <tr><td>Destruir uma frota adversária (não utilitária)</td><td>1.000</td></tr>
                <tr><td>Construir uma base espacial</td><td>1.000</td></tr>
                <tr><td>Construir um grande escudo</td><td>1.750</td></tr>
                <tr><td>Construir o edifício Metrópole</td><td>2.000</td></tr>
                <tr><td>Entrar em uma aliança ou criar uma (se você não tiver uma)</td><td>2.000</td></tr>
                <tr><td>Construir o edifício Indústria pesada</td><td>4.000</td></tr>
                <tr><td>Invadir o planeta de um jogador</td><td>4.000</td></tr>
                <tr><td>Saquear o planeta de um jogador</td><td>4.000</td></tr>
                <tr><td>Lançar um ataque nuclear sobre o planeta de um jogador</td><td>5.000</td></tr>
            </table>
            <p>Para os edifícios, qualquer construção concluída conta, seja qual for o nível. « Concluir uma pesquisa » não existe nos servidores em que todas as pesquisas estão desbloqueadas desde o início.</p>

            <h2 id="recompensa">As recompensas</h2>
            <ul>
                <li>Cada missão concluída rende <strong>PDG</strong>, creditados na hora: o ganho é o <strong>maior</strong> entre a recompensa base da missão e <strong>5&nbsp;% da média dos pontos dos jogadores do servidor</strong> (recalculada a cada relatório diário), para continuar interessante mesmo quando os impérios ficam enormes.</li>
                <li>A recompensa exibida na página Objetivos é a que você vai receber.</li>
            </ul>
            <p>Exemplo: se a média do servidor é de 30.000 pontos, « Enviar uma mensagem privada » rende 1.500 PDG em vez de 250, enquanto « Invadir o planeta de um jogador » continua em 4.000.</p>

            <h2 id="consultar">Onde vê-las</h2>
            <p>Suas missões do dia estão na página <strong>Objetivos</strong> (menu, ícone de alvo); um selo indica quantas ainda faltam (por exemplo 2/3). Cada missão é listada ali com sua recompensa em PDG e sua raridade (de 1 a 5 estrelas).</p>
            <p>Elas são validadas automaticamente: assim que você faz a ação, a missão some da lista e uma mensagem « Objetivo concluído » exibe seu ganho. Essa mesma página permite gastar seus PDG (Bitcoins, Legionários, trabalhadores).</p>

    ranking:
        title: "Os rankings"
        category: "progression"
        order: 4
        tags: "ranking,classificacao,rank,posicao,top,leaderboard"
        summary: "Vários rankings para medir seu progresso (e o dos seus rivais)."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="tipos">Os rankings disponíveis</h2>
            <table>
                <tr><th>Ranking</th><th>Baseado em</th><th>Recompensa</th></tr>
                <tr><td><strong>Classificacao de Comandantes</strong></td><td>Seus <strong>pontos</strong>: trabalhadores, naves, tropas, torres e edifícios (veja <em>Níveis e experiência</em>). As colunas Posição, Apelido, Planetas, Pontos e <strong>Pdg</strong> (Pontos de Guerra) são ordenadas com um clique.</td><td>Nenhuma recompensa direta. No encerramento do servidor, terminar no top 10 desbloqueia a conquista <em>Elite</em>, e o vencedor obtém <em>Imperador</em>.</td></tr>
                <tr><td><strong>Classificacao de Aliancas</strong></td><td>Soma dos pontos dos membros (as 100 primeiras alianças do servidor).</td><td>Nenhuma recompensa direta.</td></tr>
                <tr><td><strong>Ranking dos duelos</strong> (arena)</td><td>Taxa de vitória do seu herói principal em duelos (vitórias ÷ duelos disputados), a partir de 5 duelos.</td><td>Toda segunda-feira, os 3 heróis que mais ganharam duelos durante a semana encerrada (mínimo de 5 duelos na semana) recebem 300 / 200 / 100 PDG e 3.000 / 2.000 / 1.000 de urânio.</td></tr>
                <tr><td><strong>Ranking das alianças durante um bloqueio Cthulhu</strong></td><td>O que cada aliança faz contra a colmeia durante o bloqueio.</td><td>Bônus ou penalidade de produção por 72&nbsp;horas (veja <em>As profecias de Cthulhu</em>).</td></tr>
            </table>
            <p>Os pontos e as posições da Classificacao de Comandantes são recalculados uma vez por dia, no relatório diário (18h59, hora de Paris); ao lado de cada jogador, uma seta e um número mostram a evolução desde o relatório anterior. Os Pontos de Guerra, por sua vez, estão sempre atualizados.</p>

            <h2 id="consultar">Onde vê-los</h2>
            <p>Abra a página <strong>Visao geral</strong>: no cartão do seu comandante, o link <strong>« Ranking: N »</strong> abre a Classificacao de Comandantes, e o nome da sua aliança abre a Classificacao de Aliancas. Seu ranking está, portanto, sempre visível nesse cartão.</p>
            <p>Na Classificacao de Comandantes, você pode procurar um jogador pelo apelido ou pela tag da aliança dele, e ordenar cada coluna. Sua linha é destacada, assim como as dos seus aliados e inimigos. Na primeira página, um gráfico compara a evolução dos seus pontos e dos seus PDG com a média do servidor.</p>
            <p>O ranking dos duelos fica na página <strong>Herói</strong>, aba <strong>Arena</strong>. O ranking de um bloqueio é exibido na página <strong>Cthulhu</strong> durante o evento.</p>

            <h2 id="utilidade">Por que isso importa</h2>
            <ul>
                <li><strong>Estratégico</strong> — identifique os grandes jogadores a evitar ou a mirar.</li>
                <li><strong>Social</strong> — vitrine para recrutar na sua aliança.</li>
                <li><strong>Competição</strong> — no <strong>Servidor pago</strong>, o vencedor é o jogador que tem o maior total « pontos + 2 × Pontos de Guerra » no fim do servidor. Em todos os servidores, seu ranking final conta para suas conquistas (top 10 = <em>Elite</em>).</li>
            </ul>

    heroes:
        title: "Seu herói"
        category: "progression"
        order: 5
        tags: "heroi,bonus,planeta,frota,xp,captura,prisao,especialidade"
        summary: "Seu herói pessoal: ele evolui, combate, reforça seu império e pode ser capturado."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Cada jogador possui <strong>um único herói principal</strong>, criado no início da partida. Esse herói deve <strong>sempre</strong> estar atribuído a um planeta ou a uma frota — nunca livre. Você também pode possuir <strong>heróis secundários</strong> em número ilimitado — veja o artigo dedicado.</p>
            <p>Enquanto você não tiver um herói principal — no início da partida, ou depois da execução dele na prisão —, o jogo leva você de volta à criação dele&nbsp;: as páginas de jogo ficam fechadas até lá, as da sua conta continuam acessíveis. Se um dos seus heróis secundários ocupa o planeta escolhido para o novo herói, ele volta para a <strong>reserva</strong>.</p>
            <p>O herói traz bônus conforme suas competências, sua especialidade, seu nível e seus itens. Suas 4 competências são: <strong>Ataque</strong>, <strong>Defesa</strong>, <strong>Inteligência</strong> e <strong>Velocidade</strong>. Cada ponto investido vale <strong>+1&nbsp;%</strong>:</p>
            <ul>
                <li><strong>Ataque</strong>: poder de fogo da frota que ele acompanha.</li>
                <li><strong>Defesa</strong>: blindagem da frota que ele acompanha; em um planeta, defesa em solo contra os desembarques Cthulhu.</li>
                <li><strong>Inteligência</strong>: produção de nióbio, água e comida do planeta onde ele está designado (e somente desse).</li>
                <li><strong>Velocidade</strong>: tempo de voo da frota que ele acompanha (−1&nbsp;% por ponto, redução total limitada a 90&nbsp;%).</li>
            </ul>
            <p>Ataque e Defesa não entram nos combates em solo entre jogadores (raid, invasão): somente a especialidade Militar e seus traços contam ali. Em duelo de arena, as quatro competências entram na pontuação: a Inteligência alimenta a Astúcia e a Velocidade alimenta o Ímpeto (veja o artigo <em>Arena PvP</em>).</p>

            <h2 id="especialidades">Especialidades</h2>
            <p>Cada especialidade confere um bônus passivo, eleva o limite de uma ou duas competências e desbloqueia 3 traços nos níveis 5, 10 e 15:</p>
            <ul>
                <li><strong>Militar</strong>: +5&nbsp;% de poder de fogo para a frota que ele acompanha; em um planeta, +5&nbsp;% no tiro das torres e na defesa em solo; em solo entre jogadores, +5&nbsp;% no poder do seu lado (no ataque como na defesa); +5&nbsp;% em duelo de arena. Limite de Ataque e Defesa elevado a 50&nbsp;%. Traços: <strong>Intimidação</strong> (nív. 5, o adversário sofre −5&nbsp;% de poder ofensivo, inclusive contra o Cthulhu, e −5&nbsp;% de pontuação em duelo), <strong>Tático</strong> (nív. 10, +10&nbsp;% de poder no primeiro round dos seus combates, e +10&nbsp;% em duelo), <strong>Senhor da guerra</strong> (nív. 15, −5&nbsp;% de perdas das suas tropas em solo em combate entre jogadores, e +5&nbsp;% de poder em duelo).</li>
                <li><strong>Economia</strong>: dobra os bônus de Inteligência (produção, itens de produção inclusos) e do campo de escravos do planeta onde ele está designado. Limite de Inteligência elevado a 50&nbsp;%. Traços: <strong>Eficiente</strong> (nív. 5: exibido na ficha do herói como −10&nbsp;% de construção, esse traço não tem efeito sobre as construções), <strong>Negociante</strong> (nív. 10, +15&nbsp;% nas vendas ao mercador feitas pela sua frota ou a partir do seu planeta), <strong>Magnata</strong> (nív. 15, +20&nbsp;% de produção no seu planeta).</li>
                <li><strong>Explorador</strong>: +5&nbsp;% de precisão para a frota que ele acompanha, e dobra seu bônus de Velocidade (itens inclusos) para o tempo de voo. Limite de Velocidade elevado a 50&nbsp;%. Traços: <strong>Batedor</strong> (nív. 5, +1 de força de radar no planeta onde ele está designado), <strong>Navegador</strong> (nív. 10, −15&nbsp;% de tempo de voo adicional para a sua frota), <strong>Cartógrafo</strong> (nív. 15, +2 de força de radar a mais, ou seja, +3 no total com Batedor).</li>
            </ul>

            <p>Em <strong>duelo de arena</strong>, essas mesmas regras se aplicam: o militar mantém seus +5&nbsp;% e seus três traços, o economista vê sua Inteligência dobrada (mais 20&nbsp;% com Magnata) alimentar a Astúcia, e o explorador sua Velocidade dobrada (mais 15&nbsp;% com Navegador) alimentar o Ímpeto. Astúcia e Ímpeto contam por 60&nbsp;% do seu valor.</p>
            <p>Um resumo detalhado desses bônus é exibido automaticamente na criação do herói.</p>

            <h2 id="xp">Ganho de experiência</h2>
            <p>O XP é ganho de várias formas:</p>
            <ul>
                <li><strong>Combate</strong>: uma parte fixa (vitória em combate espacial 150 XP, raid ganho 100, invasão bem-sucedida 200, derrota 25), mais uma parte ligada à força do inimigo: a assinatura dele ÷ 150, dividida pelo nível do herói. Exemplo: um herói nível 5 que destrói uma frota de 30.000 de assinatura ganha 150 + 40 = 190 XP.</li>
                <li><strong>Duelo na arena</strong> (e cada combate de torneio): somente o vencedor ganha XP, de 30 XP por uma vitória esmagadora a 90 XP por um duelo muito disputado. O perdedor não ganha.</li>
                <li><strong>Passivo</strong>: um herói designado a um planeta (não a uma frota) ganha 5 XP por hora de ausência, creditados na sua volta (40 XP após 8 horas de ausência). Conexões muito próximas, a menos de 12 minutos, não rendem nada.</li>
            </ul>
            <p>Todo o XP ganho é aumentado pelo bônus de XP da sua aliança e, se o herói está designado a um planeta com um Campo de escravos, em +5&nbsp;% por prisioneiro ali detido (+25&nbsp;% no máximo). Um herói capturado não ganha XP.</p>
            <p>Para passar do nível N ao nível N+1, são necessários N × 500 XP: 500 XP para chegar ao nível 2, 5.000 XP para passar do nível 10 ao nível 11, e 22.500 XP no total para chegar ao nível 10. Cada nível ganho dá <strong>2 pontos de competência</strong>, a distribuir na página Herói. Cada ponto vale +1&nbsp;% na competência escolhida, até 30&nbsp;% por competência (50&nbsp;% para a ou as competências da sua especialidade). Os bônus de itens se somam além desses limites.</p>

            <h2 id="atribuicao">Atribuição</h2>
            <p>Atribua seu herói pela página <strong>Herói</strong> (botão « Reatribuir herói »), pela página <strong>Planetas</strong> (botão « Atribuir herói » de um planeta) ou pela página de gerenciamento de uma <strong>frota</strong> (botão « Atribuir »). A mudança é imediata, sem tempo de trajeto.</p>
            <p>Um planeta ou uma frota só pode acolher um herói. Um planeta sob embargo não pode receber herói, e um herói posicionado em um planeta sob embargo não pode se juntar a uma frota. Um herói em uma frota em voo ou em combate não pode ser reatribuído.</p>
            <p>Se a frota dele é destruída e ele não é capturado, o herói desembarca no planeta do combate se ele pertence a você e não tem herói; senão, no seu planeta mais antigo sem herói. Se todos os seus planetas já têm um herói, seu herói principal toma o lugar de um dos seus heróis secundários, que volta para a reserva.</p>

            <h2 id="captura">Captura</h2>
            <p>Seu herói principal pode ser capturado durante um combate:</p>
            <ul>
                <li><strong>Combate espacial contra frotas</strong> (sua frota é destruída): 20&nbsp;% de chance. A destruição da sua frota somente pelas defesas de um planeta, ou de uma frota sem armas, não captura seu herói principal.</li>
                <li><strong>Invasão</strong> do planeta onde ele está designado: 35&nbsp;% de chance. O herói a bordo da frota de invasão nunca corre risco de captura, mesmo se a invasão falhar, e um raid nunca captura.</li>
            </ul>
            <p>Uma captura exige um <strong>edifício Prisão de nível 1 ou mais</strong>: o herói é preso no local do combate se ele pertence ao vencedor e tem uma Prisão, senão no planeta do vencedor com a Prisão mais alta. Sem nenhuma Prisão, não há captura.</p>
            <p>Depois da libertação, o herói tem <strong>24h de imunidade</strong> contra nova captura.</p>
            <p>Somente um jogador pode capturar seu herói principal: nem os Cthulhu nem os comandantes IA fazem isso. Atenção: os comandantes IA podem, em compensação, capturar ou executar seus heróis secundários.</p>
            <p>Esta seção descreve seu herói <strong>principal</strong>. Seus <strong>heróis secundários</strong> seguem uma regra de captura totalmente diferente, sem probabilidade — veja o artigo <em>Heróis secundários</em>.</p>

    secondary_heroes:
        title: "Heróis secundários"
        category: "progression"
        order: 6
        tags: "heroi,secundario,cocheira,captura,execucao,prisao,reciclagem,reserva,saque"
        summary: "Heróis adicionais obtidos como saque raro: mesmos bônus que seu herói principal, mas capturáveis ou executáveis definitivamente em combate."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Um herói secundário traz <strong>os mesmos bônus</strong> que um herói principal, uma vez posicionado em um planeta ou em uma frota. O que o distingue: ele pode ser <strong>capturado ou morto definitivamente</strong> em caso de derrota. Você pode acumular vários, além do seu herói principal.</p>

            <h2 id="obtencao">Como obtê-los</h2>
            <p>Um herói secundário é um <strong>saque raro</strong>, nunca comprável:</p>
            <table>
                <thead>
                    <tr><th>Fonte</th><th>Chance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Vitória no Tower Defense Cthulhu (por run)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Ataque Cthulhu repelido em um dos seus planetas (desembarque repelido ou horda aniquilada em órbita)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Vencedor de um torneio de arena</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Ao ser obtido, ele é nível 1, seu nome e sua especialidade são sorteados, e ele chega diretamente na <strong>reserva</strong> — cabe a você decidir onde posicioná-lo, ou reciclá-lo sem nunca o posicionar.</p>

            <p>Cada herói obtido é anunciado a você por um <strong>relatório</strong> que diz de onde ele veio. A tela de fim do Tower Defense e o relatório de vitória contra os Cthulhu também o indicam na hora.</p>

            <h2 id="posicionamento">Onde posicioná-los</h2>
            <p>Como seu herói principal: <strong>um planeta</strong> ou <strong>uma frota</strong>, nunca os dois ao mesmo tempo. Um secundário não posicionado fica na <strong>reserva</strong>: nenhum bônus, mas <strong>nenhum risco</strong> também — é uma escolha normal, não um esquecimento a corrigir. Gerencie todos os seus secundários pela aba <strong>Cocheira</strong> da página Herói: botão « Atribuir » para posicioná-lo, « Retornar à reserva » para retirá-lo.</p>

            <h2 id="gestao">Competências e equipamento</h2>
            <p>Um herói secundário progride como o principal: ele ganha níveis e, com eles, <strong>pontos de competência</strong>. O botão <strong>Gerir</strong> da Cocheira abre a distribuição deles entre Ataque, Defesa, Inteligência e Velocidade.</p>
            <p>O mesmo painel gerencia seu <strong>equipamento</strong>: coloque nele um item livre do seu inventário, ou retome-o. Os itens de um herói inimigo capturado voltam para você junto com ele — é aí que você os recupera.</p>

            <h2 id="risco">O que você arrisca</h2>
            <p>Um herói secundário posicionado pode ser perdido <strong>definitivamente</strong> em:</p>
            <ul>
                <li>Um <strong>combate espacial</strong> perdido (a frota dele é destruída).</li>
                <li>Um <strong>combate utilitário</strong> perdido (frota sem nenhuma arma, aniquilada sem sequer travar batalha).</li>
                <li>Uma <strong>invasão</strong> bem-sucedida contra o planeta onde ele está estacionado.</li>
                <li>A destruição da frota dele pelas <strong>defesas orbitais</strong> de um planeta em modo de ataque.</li>
            </ul>
            <p>Em compensação, ele não arrisca <strong>nada</strong> em:</p>
            <ul>
                <li>O <strong>combate em solo de um raid</strong> — mesmo bem-sucedido, um raid nunca toma o planeta. Em compensação, se a frota que o transporta é destruída em órbita, ele fica exposto como em qualquer frota destruída.</li>
                <li>Um combate contra os <strong>Cthulhu</strong> (ou contra o Mercador). Atenção: os <strong>comandantes IA</strong> seguem a mesma regra que os jogadores e podem capturar ou executar seus heróis secundários.</li>
                <li>A <strong>arena</strong> — duelos e torneios não expõem nenhum herói à captura.</li>
            </ul>

            <p>Uma <strong>notificação</strong> avisa você assim que um dos seus secundários é capturado ou executado: uma perda definitiva não depende de você abrir seu relatório.</p>

            <h2 id="prisao">A condição prisão</h2>
            <p>Ao contrário do seu herói principal (captura <em>probabilística</em>, veja o artigo <em>Prisão e heróis capturados</em>), o destino de um secundário derrotado é <strong>inteiramente determinístico</strong>, sem o menor acaso:</p>
            <ul>
                <li>O vencedor possui um <strong>edifício Prisão</strong> de nível 1 ou mais em pelo menos um dos seus planetas → ele <strong>captura</strong> o herói, com nível, experiência e itens intactos.</li>
                <li>O vencedor não tem <strong>nenhuma</strong> Prisão construída → o herói é <strong>executado</strong>, e seus itens vão para o inventário do vencedor.</li>
            </ul>
            <p>Em combate de blocos (vários aliados lado a lado), o herói vai para o comandante vencedor que <strong>mais empenhou poder</strong> no combate — se ele não tem Prisão, o herói é executado mesmo que um aliado do mesmo lado tivesse uma.</p>
            <p>Um secundário capturado <strong>não</strong> é um prisioneiro clássico: sem página de prisão, sem fuga, sem resgate. Ele chega diretamente, ativo, na Cocheira do novo proprietário, na reserva, pronto para ser posicionado ou reciclado.</p>

            <h2 id="sem-recuperacao">Nenhuma recuperação possível</h2>
            <p>Uma vez capturado ou executado, um herói secundário está perdido <strong>de vez</strong>: nem fuga, nem resgate, nem libertação por invasão do antigo proprietário podem recuperá-lo. A única forma de revê-lo um dia é retomá-lo você mesmo em combate — e ele pode assim recircular indefinidamente de império em império.</p>

            <h2 id="identidade">Um herói capturado mantém sua identidade</h2>
            <p>Um secundário capturado conserva seu <strong>nome</strong>, seu <strong>nível</strong> e sua <strong>experiência</strong>. Na sua Cocheira, ele exibe seu comandante de origem (« Capturado de … »).</p>

            <h2 id="reciclagem">A reciclagem</h2>
            <p>Você pode <strong>reciclar</strong> um dos seus heróis secundários (botão « Reciclar » da Cocheira): ele é destruído e seu herói principal recebe <strong>90&nbsp;%</strong> de toda a experiência que esse secundário acumulou desde o nível 1 (os bônus de XP de aliança não se aplicam). Os itens dele voltam para o seu inventário.</p>
            <p>Exemplo: um secundário nível 10 rende 20.250 XP, o bastante para fazer um principal passar do nível 10 ao nível 13.</p>
            <p>Uma prévia em números (XP transferido, nível projetado do principal) é exibida antes da confirmação. A reciclagem é impossível enquanto a frota dele estiver em voo ou em combate. <strong>Ação irreversível.</strong></p>

    items:
        title: "Itens do herói"
        category: "progression"
        order: 6
        tags: "itens,equipamento,bonus,raridade,drop,cthulhu,fusao"
        summary: "Equipe seu herói com até 3 itens para acumular bônus. Como obtê-los."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Os itens são objetos equipáveis nos seus heróis (no máximo <strong>3 itens</strong> por herói). Seus bônus se somam aos do herói, além dos limites de competências. O que eles trazem depende dos seus tipos de bônus, detalhados mais abaixo.</p>

            <h2 id="categorias">Categorias</h2>
            <ul>
                <li><strong>Ofensivo</strong> (armas), <strong>Defensivo</strong> (armaduras, escudos) e <strong>Poder</strong> (objetos de status).</li>
            </ul>
            <p>A categoria só muda o nome e a aparência do item: seus bônus são sorteados entre todos os tipos, seja qual for a categoria. Olhe, portanto, os bônus exibidos no cartão, não a categoria. Nenhuma restrição de tipo: você pode equipar 3 ofensivos se quiser.</p>

            <h2 id="raridades">Raridades</h2>
            <ul>
                <li><strong>Comum</strong>: 1 bônus (+2 a 5&nbsp;%)</li>
                <li><strong>Raro</strong>: 1 ou 2 bônus (+5 a 10&nbsp;% cada)</li>
                <li><strong>Épico</strong>: 2 ou 3 bônus (+10 a 15&nbsp;% cada)</li>
                <li><strong>Lendário</strong>: 3 ou 4 bônus (+15 a 25&nbsp;% cada)</li>
            </ul>
            <p>Cada bônus é sorteado dentro da faixa da sua raridade na criação do item e depois não muda mais.</p>
            <p>O nível do herói não muda os bônus de um item: eles se somam como são, seja o herói nível 1 ou 20. Só a especialidade conta: um herói Economia dobra os bônus de Produção e um Explorador dobra os bônus de Velocidade frota. Em duelo, como a pontuação é proporcional ao nível, um mesmo item rende mais pontos a um herói de nível alto, para a mesma parte da pontuação dele.</p>

            <h2 id="bonus">Tipos de bônus</h2>
            <p>Existem 16 tipos de bônus. Veja onde cada um age (os nomes são os exibidos nos cartões):</p>
            <table>
                <thead>
                    <tr><th>Bônus</th><th>Efeito</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ataque frota, Defesa frota, Precisão frota, Escudo frota</td><td>Combates da frota que o herói acompanha.</td></tr>
                    <tr><td>Velocidade frota</td><td>Tempo de voo da frota que o herói acompanha.</td></tr>
                    <tr><td>Produção</td><td>Produção de nióbio, água e comida do planeta onde o herói está designado.</td></tr>
                    <tr><td>Força Legionários</td><td>Defesa em solo do planeta onde o herói está designado, somente contra os desembarques Cthulhu.</td></tr>
                    <tr><td>Poder duelo</td><td>Pontuação em duelo de arena.</td></tr>
                    <tr><td>Força Mechas, Velocidade construção, Produção trabalhadores, Produção naves, Alcance radar, Velocidade reciclagem, Dano Cthulhu, Ganho XP</td><td>Esses bônus só se aplicam em duelo de arena.</td></tr>
                </tbody>
            </table>
            <p>Em duelo de arena, os 16 tipos contam todos, com um peso que depende do tipo (veja o artigo <em>Arena PvP</em>). Um bônus de frota carregado por um herói designado a um planeta só age em duelo.</p>

            <h2 id="obtencao">Obtenção</h2>
            <p>Estas são todas as formas de obter itens:</p>

            <h3>Combater os Cthulhu</h3>
            <p>Um item pode cair quando você derrota Cthulhu, seja repelindo o desembarque em solo deles, seja aniquilando inteiramente a horda em órbita antes que ela pouse. As chances são idênticas nos dois casos e dependem da sua dificuldade PvE:</p>
            <ul>
                <li><strong>Facil</strong>: 30&nbsp;% de chance de obter um item (22&nbsp;% comum, 7&nbsp;% raro, 1&nbsp;% épico)</li>
                <li><strong>Normal</strong>: 40&nbsp;% de chance (25&nbsp;% comum, 10&nbsp;% raro, 4,5&nbsp;% épico, 0,5&nbsp;% lendário)</li>
                <li><strong>Dificil</strong>: 50&nbsp;% de chance (25&nbsp;% comum, 15&nbsp;% raro, 8&nbsp;% épico, 2&nbsp;% lendário)</li>
            </ul>
            <p>Uma horda apenas parcialmente destruída em órbita desembarca mesmo assim: é então esse desembarque que dispara o sorteio, nunca os dois ao mesmo tempo.</p>

            <h3>Vitórias na arena</h3>
            <p>Cada vitória em duelo de arena, combates de torneio inclusos, oferece uma chance de item:</p>
            <ul>
                <li><strong>Comum</strong>: 10&nbsp;%</li>
                <li><strong>Raro</strong>: 4&nbsp;%</li>
                <li><strong>Épico</strong>: 1&nbsp;%</li>
            </ul>
            <p>Ou seja, cerca de 15&nbsp;% de chance de obter um item a cada vitória.</p>

            <h3>Apostas em duelo</h3>
            <p>Ao lançar um desafio, você pode apostar um item. Se o adversário aceita, ele deve apostar um item de mesma raridade. O vencedor leva os dois itens.</p>

            <h3>Outras fontes</h3>
            <ul>
                <li><strong>Tower Defense Cthulhu</strong>: cada vitória dá direito a um sorteio conforme as chances da sua dificuldade acima (dois sorteios em Dificil).</li>
                <li><strong>Torneios de arena</strong>: item épico garantido para o 1º, raro para o 2º e o 3º, 10&nbsp;% de chance de um comum para os outros participantes (veja o artigo <em>Arena PvP</em>).</li>
                <li><strong>Bônus de conexão</strong>: um item comum no 3º dia da sua sequência, um item raro no 7º.</li>
            </ul>

            <h3>Fundir três itens</h3>
            <p>Três itens de <strong>mesma raridade</strong> se fundem em um item de raridade superior, sem custo nem prazo. A categoria e os bônus do novo item são sorteados, como para um item achado em combate. Os três itens de origem são consumidos definitivamente, e um item usado por um herói deve antes ser desequipado. O lendário é a raridade máxima: ele não se funde.</p>
            <p>A fusão é iniciada pela página <strong>Herói</strong>, aba <strong>Fusão</strong>: clique em três cartões de itens para selecioná-los (o cartão inteiro é clicável) e depois valide com o botão de fusão, disponível tanto no alto quanto no fim da lista.</p>

            <h2 id="roubo">Roubo de itens</h2>
            <p>Se seu herói principal é capturado, cada um dos itens equipados dele pode ser roubado pelo vencedor. Probabilidade de roubo: Comum 80&nbsp;%, Raro 60&nbsp;%, Épico 40&nbsp;%, Lendário 25&nbsp;%.</p>
            <p>Os itens não roubados permanecem no seu herói durante o cativeiro: ele os mantém se for libertado, mas o carcereiro fica com todos se o executar. Um herói secundário capturado leva todos os seus itens para o novo proprietário.</p>

            <h2 id="inventario">Inventário</h2>
            <p>Acesse seu inventário pela página <strong>Herói</strong>, aba <strong>Inventário</strong>. A partir do inventário, você pode:</p>
            <ul>
                <li><strong>Equipar</strong> um item no seu herói principal (se ele não estiver capturado, levar menos de 3 itens e não estiver a bordo de uma frota em voo ou em combate). Os heróis secundários são equipados pela aba <strong>Cocheira</strong> (botão « Gerir »).</li>
                <li><strong>Desequipar</strong> um item para devolvê-lo ao inventário (impossível enquanto a frota dele estiver em voo ou em combate).</li>
                <li><strong>Destruir</strong> um item de que você não precisa mais.</li>
                <li><strong>Fundir</strong> 3 itens de mesma raridade em um item de raridade superior, pela aba <strong>Fusão</strong> vizinha.</li>
            </ul>
            <p>Cada item é apresentado sob a forma de um <strong>cartão ilustrado</strong> que exibe sua imagem, seus bônus e uma borda colorida conforme a raridade. Os cartões se organizam em grade (3 a 4 por linha, conforme o espaço disponível na sua tela).</p>

    prison:
        title: "Prisão e heróis capturados"
        category: "progression"
        order: 7
        tags: "prisao,captura,heroi,fuga,tortura,resgate,carcereiro,secundario"
        summary: "Quando um herói é capturado, o que acontece? As opções do prisioneiro e do carcereiro, e a captura direta dos heróis secundários adversários."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="captura">Captura de um herói</h2>
            <p>Um herói principal é capturado durante um combate espacial contra frotas (20&nbsp;%) ou na invasão do planeta onde está designado (35&nbsp;%) — detalhes no artigo <em>Seu herói</em>. O jogador capturado fica preso: qualquer página fora do perímetro autorizado o redireciona para a <strong>página da prisão</strong>. Ele mantém, porém, o acesso à <strong>sala da aliança</strong>, às suas <strong>mensagens privadas</strong>, aos seus <strong>relatórios</strong>, à <strong>consulta</strong> (somente leitura) da sua aliança, ao <strong>gerenciamento da conta</strong> e à <strong>troca de servidor</strong>. Todo o resto — construção, frotas, mapa, mercado, arena e até a página Herói — fica inacessível enquanto ele não for libertado.</p>
            <p>Uma captura exige um <strong>edifício Prisão de nível 1 ou mais</strong>: o herói é preso no local do combate se ele pertence ao vencedor e tem uma Prisão, senão no planeta do vencedor com a Prisão mais alta. Sem nenhuma Prisão, não há captura.</p>

            <h2 id="prisioneiro">Ações do prisioneiro</h2>
            <p>O prisioneiro dispõe de várias ações. <strong>Alertar aliança</strong> e <strong>Rebelar-se</strong> compartilham um mesmo prazo: uma das duas é possível desde a captura, depois uma a cada <strong>4 horas</strong>.</p>
            <ul>
                <li><strong>Alertar aliança</strong> (70&nbsp;% + 2&nbsp;% por nível do herói, 90&nbsp;% no máximo; 80&nbsp;% no nível 5): envia as coordenadas da prisão para a sala da aliança. Falha = o carcereiro é alertado. Sem aliança, a ação fica indisponível. Depois de uma falha, a próxima ação espera 6 horas em vez de 4.</li>
                <li><strong>Rebelar-se</strong> (25&nbsp;% + 1,5&nbsp;% por nível, +10&nbsp;% para um Militar; 50&nbsp;% para um Militar nível 10): destrói 5&nbsp;% do nióbio, da água e da comida do planeta-prisão. Falha = perda de um nível. Nos dois casos, o carcereiro recebe um relatório.</li>
                <li><strong>Fugir</strong>: uma tentativa a cada 4 horas a partir da captura (a primeira 4 horas depois). 40&nbsp;% de sucesso, +5&nbsp;% por período de 4 horas de cativeiro, até 100&nbsp;% ao fim de 52 horas. Falha = o carcereiro é alertado. Esse prazo é independente das duas ações anteriores.</li>
                <li><strong>Fugir graças ao Slash</strong>: a qualquer momento e sem limite. Veja o artigo <em>Fugir da prisão</em>.</li>
                <li><strong>Pagar o resgate</strong>: se o carcereiro pediu um, você pode pagá-lo ou recusá-lo pela página da prisão.</li>
            </ul>

            <h2 id="carcereiro">Ações do carcereiro</h2>
            <p>Seus prisioneiros são gerenciados pela página <strong>Herói</strong>, aba <strong>Prisioneiros detidos</strong>:</p>
            <ul>
                <li><strong>Executar</strong>: destrói o herói definitivamente e rende 100 PDG por nível do herói (1.200 PDG para um nível 12). Você fica com todos os itens restantes dele. O proprietário é informado por um relatório.</li>
                <li><strong>Libertar</strong>: gesto diplomático, o herói volta para o proprietário.</li>
                <li><strong>Torturar</strong> (200 PDG): revela as coordenadas de um planeta do proprietário do prisioneiro, sorteado (ele pode já ser conhecido), e faz o prisioneiro perder 50 XP. Repetível sem prazo.</li>
                <li><strong>Pedir resgate</strong>: exigir nióbio, água e/ou urânio em troca da libertação. O prisioneiro tem 24 horas para pagar ou recusar; um único pedido por vez, mas você pode fazer um novo depois de uma recusa ou de uma expiração.</li>
            </ul>

            <h2 id="libertacao">Libertação</h2>
            <ul>
                <li><strong>A aliança do prisioneiro invade</strong> o planeta-prisão: libertação automática.</li>
                <li><strong>Outro jogador invade</strong> o planeta-prisão: 60&nbsp;% de chance de o prisioneiro fugir no caos; senão ele continua preso e o invasor, novo proprietário do planeta, torna-se seu carcereiro.</li>
                <li><strong>Os Cthulhu tomam o planeta-prisão</strong>: os prisioneiros não são libertados. Eles continuam presos na base Cthulhu e devem fugir por conta própria (veja <em>Fugir da prisão</em>). Se o planeta voltar a ficar desabitado, eles são libertados.</li>
                <li><strong>O carcereiro abandona o planeta-prisão</strong> (ou sai da partida): o prisioneiro é libertado automaticamente.</li>
            </ul>

            <h2 id="secundarios">Capturar um herói secundário adversário</h2>
            <p>Tudo o que precede — fuga, tortura, resgate, libertação — diz respeito ao <strong>herói principal</strong> de um adversário. Um <strong>herói secundário</strong> (veja o artigo <em>Heróis secundários</em>) obedece a uma regra bem mais direta, e é aí que seu edifício Prisão ganha uma <strong>utilidade decisiva</strong>: assim que você possui uma Prisão de nível 1 ou mais em um dos seus planetas, qualquer herói secundário adversário derrotado diante de você (combate espacial, combate utilitário, destruição da frota dele pelas suas defesas orbitais ou invasão bem-sucedida) torna-se <strong>imediata e definitivamente</strong> seu — com nível, experiência e itens intactos. Sem Prisão, ele é <strong>executado</strong> em vez de capturado, e seus itens vão para o seu inventário.</p>
            <p>Um secundário capturado <strong>não</strong> é um prisioneiro no sentido desta página: não há página de prisão, nem fuga, nem resgate possível. Ele chega diretamente, ativo, na sua <strong>Cocheira</strong> — pronto para ser posicionado em um planeta ou em uma frota, ou reciclado.</p>

            <h2 id="prerequisitos">Pré-requisitos</h2>
            <p>Pesquisa <strong>Sistema prisional</strong> (exige Arame farpado nível 5), depois os edifícios <strong>Prisão</strong> e <strong>Campo de escravos</strong>.</p>

    prison_escape:
        title: "Fugir da prisão"
        category: "progression"
        order: 8
        tags: "prisao,fuga,slash,resgate,heroi,captura"
        summary: "As três formas de sair da prisão por conta própria: a fuga instantânea, o Slash e o resgate."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Três saídas</h2>
            <p>Quando seu herói é capturado, a página da prisão oferece três formas de sair sem esperar seus aliados: a fuga instantânea, a fuga graças ao Slash e o pagamento de um resgate.</p>

            <h2 id="instant">Fuga instantânea</h2>
            <ul>
                <li>Uma tentativa a cada <strong>4 horas</strong>. A primeira se abre 4 horas depois da captura.</li>
                <li><strong>40&nbsp;%</strong> de sucesso na primeira tentativa, depois <strong>+5&nbsp;%</strong> por período de 4 horas de cativeiro, tenha você tentado a sorte ou não.</li>
                <li>A chance sobe até <strong>100&nbsp;%</strong>: 65&nbsp;% após 24 horas de cativeiro, 95&nbsp;% após 48 horas, e sucesso garantido a partir de <strong>52 horas</strong>. O nível do herói não tem influência.</li>
                <li>A chance da próxima tentativa é exibida no botão.</li>
                <li>Falha: seu herói continua na prisão e <strong>o carcereiro é alertado</strong>.</li>
            </ul>

            <h2 id="slash">Fugir graças ao Slash</h2>
            <p><strong>Slash</strong> é o nosso outro jogo (slash-game.com). Jogue nele com o <strong>mesmo endereço de e-mail</strong> da sua conta Area Universe, confirmado nos dois lados.</p>
            <ul>
                <li>Atinja <strong>75&nbsp;% da melhor pontuação da semana</strong> em uma partida jogada <strong>depois da sua captura</strong>.</li>
                <li>Enquanto a semana em curso (desde segunda-feira 00:00 UTC) tiver menos de 10 jogadores classificados ou sua melhor pontuação estiver abaixo de 50 pontos, a referência é a melhor pontuação da semana anterior.</li>
                <li>Volte à página da prisão e clique em <strong>Verificar a minha pontuação</strong>: seu herói é libertado.</li>
                <li>Tentativas <strong>ilimitadas</strong>, sem prazo, e o carcereiro não é alertado.</li>
                <li>Uma conta de convidado ou um endereço não confirmado não pode usar essa saída.</li>
            </ul>

            <h2 id="ransom">Pagar o resgate</h2>
            <p>Se o carcereiro pede um resgate (nióbio, água e/ou urânio), você é avisado por um relatório e ele aparece na página da prisão com seu valor e seu prazo-limite (24 horas). Você pode <strong>pagá-lo</strong> ou <strong>recusá-lo</strong>.</p>
            <p>Recusar não liberta seu herói: o carcereiro é apenas informado e pode propor a você um novo resgate. O pagamento é descontado do conjunto dos seus planetas e depositado no planeta-prisão. Se você não tem recursos suficientes, o pagamento é recusado e nada é descontado.</p>

            <h2 id="sans-rancon">E sem resgate?</h2>
            <p>O carcereiro nunca é obrigado a pedir um resgate, e seu cativeiro não tem duração fixa. Sem resgate, seu herói sai da prisão se:</p>
            <ul>
                <li>você conseguir uma <strong>fuga instantânea</strong>: a chance aumenta 5&nbsp;% a cada 4 horas e chega a 100&nbsp;% ao fim de <strong>52 horas</strong> de cativeiro;</li>
                <li>você atingir a pontuação pedida no <strong>Slash</strong>;</li>
                <li>sua aliança <strong>invadir</strong> o planeta-prisão (libertação garantida), ou outro jogador o invadir (60&nbsp;% de chance de fuga);</li>
                <li>o carcereiro <strong>libertar</strong> você, ou abandonar o planeta-prisão.</li>
            </ul>
            <p>Enquanto você está cativo, o carcereiro também pode torturar seu herói (50 XP perdidos a cada vez) ou executá-lo. É melhor, portanto, tentar a fuga o quanto antes.</p>

            <h2 id="after">Depois da libertação</h2>
            <p>Seu herói volta para o seu planeta mais antigo sem herói, com os itens restantes, e tem <strong>24 horas de imunidade</strong> contra uma nova captura.</p>

    arena:
        title: "Arena PvP"
        category: "progression"
        order: 8
        tags: "arena,duelo,torneio,pvp,heroi,desafio,ranking"
        summary: "Desafie outros heróis em duelo 1 contra 1. Aposte urânio ou itens e ganhe prestígio."
        related: "heroes,items,war_points"
        body: |
            <h2 id="desafios">Sistema de desafios</h2>
            <p>A partir da página <strong>Herói</strong>, aba <strong>Arena</strong> (formulário « Lançar um desafio »), ou do botão « Desafiar para duelo » do perfil de um jogador, lance um desafio a outro jogador. Você não pode desafiar um membro da sua aliança. O desafiado recebe um relatório e pode <strong>aceitar</strong> ou <strong>recusar</strong> o desafio.</p>
            <ul>
                <li>Um desafio expira automaticamente após <strong>7 dias</strong> sem resposta. O número de desafios recebidos pendentes é exibido na aba Arena e na entrada « Herói » do menu. O tempo restante antes da expiração é exibido ao lado de cada desafio recebido. Depois de expirado, você pode desafiar novamente o mesmo jogador.</li>
                <li>Você pode <strong>cancelar</strong> um desafio que enviou enquanto ele estiver pendente.</li>
                <li>Prazo de recuperação: cada herói deve esperar <strong>1 hora</strong> depois do último duelo, seja qual for o adversário. Esse prazo é verificado no envio do desafio <strong>e</strong> na aceitação dele, para os dois heróis: empilhar desafios pendentes não permite, portanto, encadear vários duelos.</li>
                <li>Um herói capturado não pode desafiar nem ser desafiado. A captura e a pertença à mesma aliança são reverificadas na aceitação.</li>
                <li>O herói nunca corre perigo (sem captura na arena).</li>
            </ul>

            <h2 id="combate">Resolução do combate</h2>
            <p>Quando o desafiado aceita, o combate é resolvido <strong>imediatamente</strong> e o resultado é exibido na tela do jogador que aceitou: vitória ou derrota, as duas pontuações, as recompensas e a aposta ganha ou perdida. Os dois jogadores também recebem um relatório. A pontuação é baseada em:</p>
            <ul>
                <li><strong>Nível</strong> do herói: a base da pontuação</li>
                <li><strong>Ofensiva</strong>: ataque do herói, +5&nbsp;% se for militar, e os bônus ofensivos dos seus itens</li>
                <li><strong>Defesa</strong>: defesa do herói e os bônus defensivos dos seus itens</li>
                <li><strong>Astúcia</strong> (peso 60&nbsp;%): Inteligência — dobrada para um economista, +20&nbsp;% com o traço Magnata — e os bônus utilitários dos itens</li>
                <li><strong>Ímpeto</strong> (peso 60&nbsp;%): Velocidade — dobrada para um explorador, +15&nbsp;% com o traço Navegador — e a velocidade de frota dos itens</li>
                <li><strong>Traços militares</strong>: Tático +10&nbsp;%, Senhor da guerra +5&nbsp;%, e Intimidação retira 5&nbsp;% da pontuação do adversário</li>
                <li><strong>Especialidade</strong>: vantagem pedra-papel-tesoura (Militar &gt; Explorador &gt; Economia &gt; Militar, +10&nbsp;%)</li>
                <li><strong>Fator aleatório</strong> de ±15&nbsp;% de cada lado</li>
            </ul>
            <p>Na prática: pontuação = nível × 10 × (1 + Ofensiva + Defesa + 0,6 × Astúcia + 0,6 × Ímpeto + traços), onde cada bônus conta pelo seu valor (10&nbsp;% = 0,10). O resultado é então multiplicado por 1,10 em caso de vantagem de especialidade e por 0,95 se o adversário tem Intimidação, depois o acaso se aplica. Exemplo: um Militar nível 10 com 10&nbsp;% de Ataque, 8&nbsp;% de Defesa, sem item, e o traço Tático obtém 10 × 10 × (1 + 0,15 + 0,08 + 0,10) = 133. O nível pesa, portanto, mais que todo o resto.</p>
            <p>Em duelo, todos os bônus de itens contam, com um peso conforme o tipo (eles não são dobrados pela especialidade):</p>
            <ul>
                <li><strong>Ofensiva</strong>: Poder duelo (×1,5); Força Legionários e Ataque frota (×1); Força Mechas, Precisão frota e Dano Cthulhu (×0,5).</li>
                <li><strong>Defesa</strong>: Defesa frota e Escudo frota (×1).</li>
                <li><strong>Astúcia</strong>: Produção (×1); Produção trabalhadores, Produção naves, Velocidade construção, Velocidade reciclagem e Alcance radar (×0,5); Ganho XP (×0,25).</li>
                <li><strong>Ímpeto</strong>: Velocidade frota (×1).</li>
            </ul>

            <h2 id="apostas">Apostas</h2>
            <p>Ao lançar um desafio, você pode adicionar uma aposta opcional:</p>
            <ul>
                <li><strong>Urânio</strong>: cada jogador aposta a mesma quantidade. O vencedor leva as duas apostas.</li>
                <li><strong>Item</strong>: cada jogador aposta um item de mesma raridade. O vencedor leva os dois itens. O item deve estar <strong>desequipado</strong> (dos dois lados) e não pode estar empenhado em dois desafios pendentes ao mesmo tempo.</li>
                <li><strong>Amigável</strong>: sem aposta, só as recompensas base são atribuídas.</li>
            </ul>
            <p>A aposta é coberta se pelo menos um dos seus planetas possui o urânio exigido: ele é descontado do seu planeta mais rico em urânio. Se um jogador não tem mais urânio suficiente em nenhum planeta no momento da aceitação, o desafio falha. Se o item apostado pelo desafiante não está mais disponível quando o desafiado aceita (não pertence mais a ele ou está equipado), o duelo é recusado.</p>

            <h2 id="recompensas">Recompensas base</h2>
            <p>O vencedor recebe a cada duelo:</p>
            <ul>
                <li>Urânio: entre 5 e 15, multiplicado pelo nível médio dos dois heróis ÷ 10, limitado a <strong>20</strong> por duelo (5 a 15 entre dois níveis 10). Ele é depositado no seu menor planeta, como o urânio das apostas ganhas.</li>
                <li>Pontos de guerra: 15 × o nível do vencedor, multiplicados pela razão entre o menor e o maior dos dois níveis (nunca menos que a metade). Dois heróis nível 15: 225 PDG; um nível 15 que vence um nível 10: 150 PDG.</li>
                <li>XP: de 30 a 90 conforme o equilíbrio do duelo (veja o artigo <em>Seu herói</em>).</li>
                <li>Chance de item: cerca de 15&nbsp;% no total (10&nbsp;% comum, 4&nbsp;% raro, 1&nbsp;% épico)</li>
            </ul>
            <p>O perdedor não perde nada (exceto sua eventual aposta), mas não ganha XP nem recompensa.</p>

            <h2 id="ranking">Ranking</h2>
            <p>Um ranking por servidor exibe os melhores duelistas:</p>
            <ul>
                <li>Classificado pela porcentagem de vitórias em duelo (os combates de torneio não contam), depois pelo número de vitórias</li>
                <li>Mínimo de <strong>5 combates</strong> para aparecer</li>
                <li>Os <strong>5 primeiros</strong> são visíveis diretamente na página; um botão permite abrir o ranking completo com paginação e ordenação</li>
                <li>Recompensas semanais pagas automaticamente toda <strong>segunda-feira</strong> pela semana anterior (de segunda 0h a domingo 24h, hora de Paris), uma única vez: top 3 conforme o <strong>número de vitórias em duelo</strong> da semana, com um mínimo de <strong>5 duelos</strong> na semana. Somente os jogadores são considerados (nem os comandantes IA, nem as contas excluídas). 1º = 3000 de urânio + 300 PDG, 2º = 2000 + 200 PDG, 3º = 1000 + 100 PDG. Cada jogador recompensado recebe um relatório.</li>
            </ul>

            <h2 id="torneios">Torneios</h2>
            <p>Evento periódico do servidor: um torneio a cada <strong>7 dias</strong> por servidor.</p>
            <ul>
                <li>Inscrição aberta por <strong>24h</strong> a partir da aba Arena da página Herói. Um herói capturado não pode se inscrever, e é excluído se for capturado antes do encerramento das inscrições.</li>
                <li>No encerramento das inscrições, toda a chave é disputada de uma vez: eliminação direta após sorteio (quando o número de classificados é ímpar, um deles passa de fase automaticamente, em qualquer rodada), depois uma partida pelo 3º lugar entre os dois perdedores das semifinais.</li>
                <li>São necessários pelo menos <strong>2 participantes</strong>: caso contrário o torneio é cancelado (nenhuma recompensa) e os inscritos são avisados por relatório. Com um único jogador inscrito, o torneio acontece se um comandante IA puder completar a chave.</li>
                <li>Assim que pelo menos um jogador está inscrito, os <strong>comandantes IA</strong> do servidor (herói principal não capturado) completam a chave até <strong>8 participantes</strong> no total. Eles se inscrevem progressivamente durante as 24h de inscrição, e a chave é completada no encerramento se ainda faltar gente.</li>
                <li>Se <strong>8 jogadores ou mais</strong> estiverem inscritos, nenhum comandante IA participa. Sem jogador inscrito, o torneio não acontece: os comandantes IA nunca jogam entre si.</li>
                <li>Cada combate do torneio também rende ao seu vencedor as recompensas habituais de um duelo.</li>
                <li>Os comandantes IA disputam o pódio e recebem as mesmas recompensas que os jogadores, exceto a chance de obter um herói secundário.</li>
                <li>O campeão mantém 25&nbsp;% de chance de obter um herói secundário (reservada aos jogadores).</li>
            </ul>
            <p>Recompensas:</p>
            <ul>
                <li>1º = 5000 de urânio + 500 PDG + 1 item épico (20&nbsp;% de chance de um item lendário a mais)</li>
                <li>2º = 3000 de urânio + 300 PDG + 1 item raro (10&nbsp;% de chance de um item épico a mais)</li>
                <li>3º = 1500 de urânio + 150 PDG + 1 item raro</li>
                <li>Outros participantes = 500 de urânio + 50 PDG (10&nbsp;% de chance de um item comum)</li>
            </ul>
            <p>Cada participante recebe um relatório com sua classificação e suas recompensas. A página Arena exibe a contagem regressiva do fim das inscrições, o pódio do último torneio e a data do próximo.</p>

    login_bonus:
        title: "Bônus de conexão"
        category: "progression"
        order: 9
        tags: "bonus,conexao,diario,bitcoin,sequencia,streak"
        summary: "Bitcoins grátis todo dia, multiplicados se você encadear vários dias consecutivos."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principio">O princípio</h2>
            <p>Todo <strong>dia do calendário</strong> (o dia muda à meia-noite, hora de Paris), o jogo oferece a você um bônus de Bitcoins, em cada um dos servidores em que você joga. Uma janela se abre quando você entra no jogo: clique em <strong>« Reivindicar »</strong> para recebê-lo. O jogo também pode avisar você por uma notificação quando o bônus do dia estiver disponível.</p>
            <p>O valor corresponde ao <strong>mais vantajoso</strong> dos dois cálculos abaixo, e depois é multiplicado pela sua sequência:</p>
            <ul>
                <li>Um <strong>piso ligado ao seu nível</strong>: <strong>nível × 5.000 Bitcoins</strong>, multiplicado a cada dia por um sorteio de ×1, ×2, ×3, ×4 ou ×5. Ele garante um bônus motivador no início da partida.</li>
                <li><strong>5&nbsp;% da média de Bitcoins do servidor</strong> — assim o bônus continua interessante à medida que a economia do servidor cresce.</li>
                <li>O resultado é então multiplicado pelo seu <strong>multiplicador de sequência</strong> (veja abaixo).</li>
            </ul>
            <p>Essa média só conta os jogadores (nem bots nem contas de teste); a partir de 20 jogadores, ela descarta os 5&nbsp;% mais ricos e os 5&nbsp;% mais pobres. Ela é recalculada uma vez por dia.</p>
            <p>Piso conforme o nível (antes do multiplicador de sequência; todo comandante começa no nível 2):</p>
            <table>
                <tr><th>Nível</th><th>Piso possível</th><th>No dia 7 (×5)</th></tr>
                <tr><td>2</td><td>10.000 a 50.000</td><td>50.000 a 250.000</td></tr>
                <tr><td>5</td><td>25.000 a 125.000</td><td>125.000 a 625.000</td></tr>
                <tr><td>10</td><td>50.000 a 250.000</td><td>250.000 a 1.250.000</td></tr>
                <tr><td>15</td><td>75.000 a 375.000</td><td>375.000 a 1.875.000</td></tr>
                <tr><td>20</td><td>100.000 a 500.000</td><td>500.000 a 2.500.000</td></tr>
                <tr><td>30</td><td>150.000 a 750.000</td><td>750.000 a 3.750.000</td></tr>
                <tr><td>40</td><td>200.000 a 1.000.000</td><td>1.000.000 a 5.000.000</td></tr>
            </table>
            <p>Para outro nível, multiplique-o por 5.000 (sorteio ×1) e por 25.000 (sorteio ×5).</p>
            <p>Exemplo: no nível 10, o sorteio do dia dá ×2, ou seja, um piso de 100.000 Bitcoins. Se a média do servidor é de 3.000.000 de Bitcoins, 5&nbsp;% dão 150.000: é esse valor que é adotado. No 3<sup>º</sup> dia de sequência (×1,5), você recebe 225.000 Bitcoins.</p>

            <h2 id="streak">A sequência de 7 dias consecutivos</h2>
            <p>Reivindicar seu bônus <strong>todos os dias</strong> faz seu multiplicador subir:</p>
            <table>
                <tr><th>Dia consecutivo</th><th>Multiplicador</th></tr>
                <tr><td>Dia 1</td><td>×1,0</td></tr>
                <tr><td>Dia 2</td><td>×1,2</td></tr>
                <tr><td>Dia 3</td><td>×1,5</td></tr>
                <tr><td>Dia 4</td><td>×1,8</td></tr>
                <tr><td>Dia 5</td><td>×2,0</td></tr>
                <tr><td>Dia 6</td><td>×2,5</td></tr>
                <tr><td>Dia 7</td><td>×5,0</td></tr>
            </table>
            <p>No 8<sup>º</sup> dia, o ciclo recomeça no dia 1. É preciso reivindicar o bônus <strong>em cada dia do calendário</strong> (de meia-noite a meia-noite, hora de Paris): se um dia passa sem reivindicação, a sequência recomeça no dia 1. O número de horas entre duas conexões não conta, só o dia conta. Reivindicar na segunda às 0h05 e depois na terça às 23h55 mantém a sequência; reivindicar na segunda às 23h59 e depois na quarta às 0h01 a quebra.</p>

            <h2 id="itens">Os itens bônus</h2>
            <p>Alguns dias da sequência oferecem, além disso, um <strong>item para o seu herói</strong>, aleatório:</p>
            <ul>
                <li><strong>Dia 3</strong>: um item comum.</li>
                <li><strong>Dia 7</strong>: um item raro.</li>
            </ul>

            <h2 id="reclamacao">Como reivindicá-lo</h2>
            <p>A janela « Bônus de conexão » se abre automaticamente quando você entra no jogo: um clique em <strong>« Reivindicar »</strong> credita os Bitcoins (e o item do dia 3 ou 7). Ela também exibe seu recorde pessoal de dias seguidos, que não pode passar de 7, já que a sequência recomeça no dia 1 depois do dia 7.</p>

            <h2 id="dica">Uma pequena dica</h2>
            <p>Até 30 segundos bastam: abra o jogo e clique em « Reivindicar ». Não perca o dia 7, é aí que rende mais.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminacao,falencia,fim"
        summary: "As 2 formas de perder a partida e o que sobra depois."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">Os 2 tipos de Game Over</h2>
            <p>Há duas formas de perder tudo em um servidor: a falência, que deixa seus planetas mas não suas naves, e a perda de todos os seus planetas, que zera seu comandante. Conhecê-las já é se proteger delas.</p>

            <h2 id="falencia">1. A falência econômica</h2>
            <p>Se, depois do <strong>relatório diário das 18h59 (hora de Paris)</strong>, seu saldo de Bitcoins estiver <strong>negativo</strong>: <strong>Game Over econômico</strong>.</p>
            <ul>
                <li>Todas as suas <strong>frotas</strong> são excluídas, em voo ou em órbita, com a carga e as tropas.</li>
                <li>Todas as <strong>naves em solo</strong> dos seus planetas são perdidas.</li>
                <li>Seu saldo é <strong>reposto em 125.000 Bitcoins</strong>.</li>
            </ul>
            <p>Você conserva seus planetas, edifícios, defesas, pesquisas, tropas em solo e seu ranking: você continua jogando, mas sem nenhuma nave.</p>
            <p><strong>Você é avisado antes:</strong> assim que seu saldo cai abaixo do déficit diário projetado (custo de manutenção menos rendimentos do último relatório), um relatório de alerta « ⚠ Falência iminente! » avisa você — no máximo um por dia. Se você o receber, aja antes do próximo relatório diário.</p>

            <h2 id="planetas">2. A perda de todos os seus planetas</h2>
            <p>Se você perde seu <strong>último planeta</strong> — invadido por um jogador ou pelos Cthulhu, ou, no Battle Royale, quando seu setor desaparece —, seu comandante é eliminado. Você não pode abandonar voluntariamente seu último planeta.</p>
            <ul>
                <li>Se é um jogador que invade seu último planeta, ele <strong>fica com todos os seus Bitcoins e todos os seus Pontos de Guerra</strong>.</li>
                <li>Suas <strong>frotas</strong> são excluídas (se são os Cthulhu que tomam seu último planeta, elas passam ao controle deles).</li>
                <li>Seu comandante é <strong>zerado</strong>: 125.000 Bitcoins, pesquisas e pesquisas políticas zeradas, terraformação dividida por 2, ranking reinicializado, herói e relatórios excluídos.</li>
                <li>Você sai da sua aliança (ela é dissolvida se você era o único membro, ou o Líder de uma aliança do Martelo das Estrelas).</li>
                <li>Sua carreira nesse servidor é <strong>registrada</strong> no perfil da sua conta.</li>
            </ul>

            <h2 id="evitar">Como evitar o Game Over</h2>
            <ul>
                <li>Acompanhe todo dia seu <strong>balanço</strong> (rendimentos − custos). Se ficar no vermelho, reaja.</li>
                <li>Ponha em solo as frotas que não estão servindo: a manutenção delas é dividida por 6.</li>
                <li>Não recrute demais: um exército em manutenção permanente pode arruinar um economista pouco vigilante.</li>
                <li>Mantenha sempre <strong>pelo menos 2 planetas</strong> em condições de defender.</li>
                <li>Fique de olho nas <strong>frotas inimigas em aproximação</strong> (notificações, radar).</li>
                <li>Em caso de grande perigo, <strong>evacue</strong> suas tropas e recursos para um planeta seguro.</li>
            </ul>

            <h2 id="depois">O que sobra depois?</h2>
            <p>Mesmo eliminado, você mantém sua <strong>conta de jogador</strong> e suas <strong>estatísticas</strong> das partidas anteriores. Você pode entrar em outro servidor, ou se reinscrever no mesmo pela página de seleção de servidores (menu « Servidor »), enquanto as inscrições dele estiverem abertas: você recomeça então em um novo planeta inicial.</p>

    game_modes:
        title: "Os modos de servidor"
        category: "events"
        order: 1
        tags: "modo,battle royale,dominacao,long run,short run,cthulhu,search and destroy,paid"
        summary: "O Area Universe oferece 7 modos de servidor diferentes, com regras e objetivos próprios."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Visão geral</h2>
            <p>Cada servidor do Area Universe tem um <strong>modo</strong>, escolhido pelo admin na criação. O modo define a duração, a condição de vitória e a presença dos Cthulhu.</p>
            <table>
                <thead>
                    <tr><th>Modo</th><th>Duração</th><th>Condição de vitória</th><th>Cthulhu?</th><th>Alianças?</th><th>Pesquisas</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu</td><td>300 dias</td><td>Nenhuma</td><td>Sim</td><td>Sim</td><td>Normais</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>30 dias no máximo</td><td>O VIP que sobrevive 72&nbsp;h</td><td>Não</td><td>Sim (exceto para o VIP)</td><td>Máx. desde o início</td></tr>
                    <tr><td>Dominação</td><td>60 dias</td><td>Melhor pontuação individual no fim</td><td>Não</td><td>Sim</td><td>Máx. desde o início</td></tr>
                    <tr><td>Battle Royale</td><td>40 dias no máximo</td><td>Último sobrevivente</td><td>Não</td><td>Não</td><td>Máx. desde o início</td></tr>
                    <tr><td>Paid Server</td><td>60 dias</td><td>Melhor pontuação ponderada (pontos + 2 × PDG)</td><td>Não</td><td>Sim</td><td>Normais</td></tr>
                    <tr><td>Long Run</td><td>900 dias</td><td>Nenhuma (maratona)</td><td>Durante os eventos « Ataque Cthulhu »</td><td>Sim</td><td>Normais</td></tr>
                    <tr><td>Short Run</td><td>150 dias</td><td>Nenhuma (sprint)</td><td>Durante os eventos « Ataque Cthulhu »</td><td>Sim</td><td>Normais</td></tr>
                </tbody>
            </table>
            <p>Uma partida que designa um vencedor (Search &amp; Destroy, Battle Royale) termina assim que esse vencedor é conhecido, e o servidor fecha: a duração indicada é então um máximo.</p>
            <p>Na lista de servidores, alguns modos têm outro nome: <strong>Search &amp; Destroy</strong> aparece como « Pesquisa &amp; Destruicao » (e « Busca e Destrói » no menu do jogo), <strong>Long Run</strong> como « Longo prazo », <strong>Short Run</strong> como « Curto prazo » e <strong>Paid Server</strong> como « Servidor pago ».</p>

            <h2 id="cthulhu">Modo Cthulhu (PvE clássico)</h2>
            <p>O modo básico, perfeito para descobrir o jogo. Durante as <strong>72 primeiras horas</strong> do servidor, nenhum ataque Cthulhu: é a <strong>fase de preparação</strong>. Durante essa fase, o servidor exibe o selo « Bloqueado » na lista de servidores e recusa novos comandantes (mensagem « Este servidor está bloqueado (preparação ou inscrições fechadas). »).</p>
            <p>Depois, as hordas Cthulhu atacam você regularmente. A primeira é lançada <strong>5 dias após a sua inscrição</strong>, depois uma nova horda parte a cada <strong>18 a 30 horas</strong> em Facil, <strong>12 a 24 horas</strong> em Normal e <strong>8 a 16 horas</strong> em Dificil. Você também pode desativar completamente o PvE nas suas <strong>Preferências</strong> (veja o artigo <em>A ameaça Cthulhu</em>).</p>
            <p>Sem condição de vitória nem vencedor: ao fim dos 300 dias, o servidor fecha e seu resultado (ranking, pontos…) permanece no seu perfil de carreira. A conquista <strong>Elite</strong> recompensa um lugar no top 10 de um servidor.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (caça ao VIP)</h2>
            <p>As <strong>48 primeiras horas</strong> do servidor servem de preparação: nenhum VIP é designado ainda. Como no modo Cthulhu, o servidor exibe então o selo « Bloqueado » e recusa novos comandantes.</p>
            <p>Depois, um <strong>VIP</strong> é sorteado entre os jogadores ainda em jogo, e a sala pública anuncia « Novo VIP: … ». O objetivo dele: <strong>sobreviver 72 horas</strong>. Se conseguir, ele vence e a partida termina imediatamente.</p>
            <ul>
                <li>Se ele é eliminado (game over) por um jogador, <strong>o assassino se torna o novo VIP</strong> (« O VIP foi eliminado por … ») e a contagem regressiva de 72 horas recomeça do zero.</li>
                <li>Se ele é eliminado de outra forma (por um comandante IA, por exemplo), um novo VIP é sorteado.</li>
            </ul>
            <p>O VIP está <strong>sozinho contra todos</strong>: ele é automaticamente retirado da sua aliança no momento da nomeação. Se era o chefe dela, o membro de patente mais alta assume o lugar; se era o único membro, a aliança é dissolvida. Enquanto tem o status, ele não pode criar nem entrar em aliança, e continua proibido de fazê-lo por <strong>3 dias</strong> depois de perdê-lo.</p>
            <p>A <strong>proteção de iniciantes</strong> também se aplica ao VIP: enquanto ela durar (menos de 7 dias desde a inscrição, menos de 4 planetas, nenhuma missão ofensiva lançada), nenhum jogador pode enviar frota aos planetas dele.</p>

            <h2 id="dominacao">Dominação (planetas estratégicos)</h2>
            <p>No início, <strong>5 planetas estratégicos</strong> são sorteados entre todos os planetas do servidor, tanto planetas de jogadores quanto planetas desabitados.</p>
            <ul>
                <li>Uma vez por dia, na mudança de data (meia-noite, hora de Paris), cada planeta estratégico rende <strong>+5 pontos</strong> ao jogador que o possui nesse instante. Manter dois rende, portanto, +10 por dia.</li>
                <li>Os comandantes IA não marcam pontos.</li>
                <li>A cada <strong>5 dias</strong>, um novo sorteio substitui os planetas estratégicos. A sala pública anuncia « Os planetas estratégicos acabaram de mudar. » no momento em que ele acontece, sem aviso prévio.</li>
            </ul>
            <p>No fim do servidor (60 dias), o jogador que tem mais pontos vence. O ranking é <strong>individual</strong>: não há pontuação nem vitória de aliança na Dominação.</p>

            <h2 id="battle-royale">Battle Royale (último sobrevivente)</h2>
            <p>Modo solo: <strong>nenhuma aliança permitida</strong>. Uma única galáxia. As inscrições fecham <strong>7 dias</strong> após a abertura: o servidor exibe então o selo « Bloqueado », e somente os jogadores já inscritos podem voltar a ele.</p>
            <p>O mapa é uma grade espacial de 10 × 10, ou seja, 100 sistemas, que <strong>encolhe por anéis concêntricos</strong>: a cada rodada, <strong>todo o anel externo desaparece de uma só vez</strong> (não sistema por sistema). Os sistemas destruídos continuam exibidos como <strong>buracos</strong>: o mapa não se reorganiza, o que torna a zona segura legível de relance.</p>
            <p><strong>5 rodadas, uma por semana:</strong></p>
            <table>
                <thead>
                    <tr><th>Dia</th><th>Sistemas destruídos</th><th>Sistemas restantes</th></tr>
                </thead>
                <tbody>
                    <tr><td>D+7</td><td>36 (a borda da grade)</td><td>64</td></tr>
                    <tr><td>D+14</td><td>28</td><td>36</td></tr>
                    <tr><td>D+21</td><td>20</td><td>16</td></tr>
                    <tr><td>D+28</td><td>12</td><td>4</td></tr>
                    <tr><td>D+35</td><td>3 dos 4 últimos</td><td><strong>Apenas 1</strong>, sorteado</td></tr>
                </tbody>
            </table>
            <p>Os 5 últimos dias são jogados nesse último sistema.</p>
            <ul>
                <li><strong>12&nbsp;h antes</strong> da destruição dele, um anel fica <strong>laranja</strong> (aviso).</li>
                <li><strong>1&nbsp;h antes</strong>, ele fica <strong>vermelho piscante</strong>: nenhuma frota pode mais partir para os sistemas dele nem sair deles.</li>
                <li>Um sistema destruído elimina definitivamente seus planetas e suas frotas. Se seu <strong>herói principal</strong> estava ali (em um planeta ou em uma frota), você é eliminado; um herói secundário apenas volta para a reserva. Você também é eliminado se não tiver mais nenhum planeta.</li>
                <li>Uma frota a caminho de um sistema desaparecido (ou partida de um sistema desaparecido) é destruída na chegada; se seu herói principal está a bordo, você é eliminado.</li>
            </ul>
            <p><strong>Vitória</strong>: ser o último jogador ainda em jogo. A partida termina assim que resta apenas um sobrevivente. Se vários jogadores ainda estiverem em jogo no 40<sup>º</sup> dia, o servidor termina sem vencedor.</p>

            <h2 id="paid-server">Paid Server (competitivo pago)</h2>
            <p>Servidor pago: a inscrição custa <strong>5&nbsp;€</strong>, pagos uma única vez via Stripe para esse servidor específico (outro servidor pago é pago à parte). É preciso uma conta completa, não uma conta de convidado. Na lista de servidores, ele exibe o selo « 💳 Pago 5 € ». 100&nbsp;% PvP, nenhum Cthulhu. Duração de 60 dias.</p>
            <p><strong>Vitória</strong>: no fim, o jogador ainda em jogo que tem a melhor <strong>pontuação ponderada</strong> vence.</p>
            <ul>
                <li>Pontuação ponderada = pontos do ranking + 2 × pontos de guerra (PDG).</li>
                <li>Exemplo: 300.000 pontos e 50.000 PDG dão uma pontuação de 400.000.</li>
            </ul>
            <p>O combate conta, portanto, em dobro: é um modo para jogadores competitivos.</p>
            <p>Como em todos os modos que designam um vencedor, o ganhador recebe o selo <strong>Vencedor</strong> no perfil de carreira, mantido de um servidor para o outro, e a conquista <strong>Imperador</strong>.</p>

            <h2 id="long-short-run">Long Run / Short Run (com eventos)</h2>
            <p>Dois modos PvE com regras idênticas: só a duração muda. O <strong>Long Run</strong> dura 900 dias, o <strong>Short Run</strong> 150 dias.</p>
            <p>Os Cthulhu não atacam ali o tempo todo: suas hordas só partem durante os eventos <strong>Ataque Cthulhu</strong>. Esses eventos duram 72 horas: o primeiro começa 7 dias após a abertura do servidor, depois eles voltam a cada 21 dias.</p>
            <p>A <strong>Arena de aliança</strong> volta ali a cada 3 dias, e as profecias de Cthulhu também se disparam ali. O calendário é fixo, calculado desde a abertura do servidor: veja o artigo <em>Eventos especiais</em>.</p>

            <h2 id="pesquisas-max">Modos com pesquisas máximas desde o início</h2>
            <p>Em <strong>Search &amp; Destroy, Dominação e Battle Royale</strong>, todas as suas pesquisas começam no nível máximo: o menu Pesquisa fica oculto, para jogar diretamente a parte militar.</p>
            <p>Seu planeta inicial recebe então um <strong>kit inicial</strong>:</p>
            <ul>
                <li><strong>500 de urânio</strong> para personalizar rapidamente.</li>
                <li><strong>Toda a sua reserva de pontos de melhoria de naves</strong> desde o dia 1, em vez do limite habitual de 40 pontos por dia.</li>
            </ul>
            <p>No <strong>Search &amp; Destroy</strong>, cada jogador recebe além disso, na inscrição, um kit militar no seu planeta inicial (todos podem se tornar VIP): 2.000 Legionários, 25 barcaças, 500 destroyers e 250 torres laser pesadas.</p>

            <h2 id="fim-de-servidor">Fim de servidor e arquivamento</h2>
            <p>Quando um servidor fecha, suas <strong>estatísticas finais</strong> (pontos, heróis, conquistas de VIP, vitórias, etc.) são arquivadas na sua <strong>conta de jogador</strong>. Seu comandante (o personagem dessa partida) é excluído, mas seu histórico permanece.</p>

    cthulhus:
        title: "A ameaça Cthulhu"
        category: "events"
        order: 2
        tags: "cthulhu,colmeia,horda,guarnicao,cerco,ameaca,pve,uranio,tower defense,td"
        summary: "Os Cthulhu reúnem verdadeiras hordas que viajam a descoberto antes de atacar seus planetas. Como se defender delas, como as bases deles também se defendem, e o Tower Defense para repelir o assalto."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principio">O que são os Cthulhu?</h2>
            <p>Os <strong>Cthulhu</strong> (os Possuídos) são as criaturas hostis controladas pelo jogo (PvE). Eles mantêm <strong>bases da colmeia</strong> espalhadas pela galáxia, de onde partem <strong>hordas</strong>: verdadeiras frotas, com composição, poder e trajeto visíveis, e não uma simples contagem regressiva.</p>
            <p>Os Cthulhu só existem nos servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> e <strong>Short Run</strong>. No Long Run e no Short Run, suas hordas só partem durante os eventos <strong>Ataque Cthulhu</strong> (veja <em>Eventos especiais</em>).</p>
            <p>Dois indicadores a não confundir:</p>
            <ul>
                <li>sua <strong>ameaça pessoal</strong>, que regula a força das hordas lançadas contra você (este artigo);</li>
                <li>a <strong>Ameaça do universo</strong>, comum ao servidor, que dispara as profecias (veja <em>As profecias de Cthulhu</em>).</li>
            </ul>

            <h2 id="ameaca">O nível de ameaça</h2>
            <p>Sua ameaça pessoal é exibida na página <strong>Cthulhu</strong>, no bloco « Ameaca Cthulhu » (Planeta ameacado, Nivel de ameaca, Tempo restante). Quanto mais alta, mais fortes os ataques seguintes.</p>
            <p>Toda vez que suas defesas repelem um <strong>desembarque</strong> Cthulhu em solo, sua ameaça aumenta. Destruir a horda antes que ela desembarque (acima da base dela, em voo ou em órbita do seu planeta) não a faz subir. O ganho depende da dificuldade e do regime da sua aliança:</p>
            <table>
                <thead>
                    <tr><th>Dificuldade</th><th>Sem aliança</th><th>Aliança O Martelo das Estrelas</th><th>Outra aliança</th></tr>
                </thead>
                <tbody>
                    <tr><td>Facil</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Dificil</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>O regime <strong>O Martelo das Estrelas</strong> reduz, portanto, a progressão da ameaça.</p>
            <p>A ameaça <strong>também sobe sozinha</strong>, enquanto seu PvE estiver ativo:</p>
            <ul>
                <li>+5 a cada relatório diário (18h59, hora de Paris);</li>
                <li>+1 por hora enquanto uma horda permanecer em órbita de um dos seus planetas antes de desembarcar.</li>
            </ul>
            <p>Essa subida automática para em 300. Para fazer a ameaça baixar:</p>
            <ul>
                <li>vencer um <strong>Tower Defense</strong> a divide por 2;</li>
                <li><strong>libertar uma base</strong> da colmeia a divide por 10 (veja abaixo);</li>
                <li>uma derrota em solo também a divide (veja a tabela « Se a horda vence em solo »).</li>
            </ul>
            <p>Um jogador assíduo a mantém baixa; um jogador que a deixa disparar se expõe a hordas cada vez maiores.</p>

            <h2 id="potencia">Poder das invasões</h2>
            <p>Um ataque se joga em dois tempos, e a dificuldade pesa nos dois:</p>
            <ul>
                <li><strong>A horda (combate orbital)</strong>: a frota dela é calculada a partir do <strong>poder da sua própria frota</strong>. Quanto mais forte sua frota em relação ao seu nível de ameaça, mais forte a horda também (de 0,7 a 1,5 vez o seu poder). A dificuldade se aplica em seguida: ×0,5 em Facil, ×1 em Normal, ×1,5 em Dificil. Uma horda em cada cinco é reforçada (+25&nbsp;%). A horda que se segue à passagem da sua ameaça acima de 100, 250 e depois 500 é uma <strong>horda Chefe</strong>, duas vezes maior.</li>
                <li><strong>O desembarque (combate em solo)</strong>: a força dele depende do seu <strong>nível de ameaça</strong> e do seu nível de pesquisa <strong>Terraformação</strong>, depois da parte da horda que sobreviveu ao combate orbital. Em Facil, ela é dividida por 2.</li>
            </ul>

            <h2 id="horda">O ataque: uma horda bem real</h2>
            <p>A primeira horda é lançada <strong>5 dias após a sua inscrição</strong>. Depois, uma nova horda parte a cada <strong>18 a 30 horas</strong> em Facil, <strong>12 a 24 horas</strong> em Normal e <strong>8 a 16 horas</strong> em Dificil. O cronômetro da entrada « Cthulhu » do menu indica o próximo lançamento.</p>
            <p>Um ataque sempre começa por uma <strong>concentração</strong>: a horda se junta em órbita de uma base da colmeia por <strong>6 horas</strong> (12 horas para uma horda Chefe) antes de partir.</p>
            <p>Uma vez a caminho, ela voa em <strong>velocidade de horda</strong> (lenta, amplamente visível no <strong>radar</strong>) e um <strong>alerta é garantido 1 hora antes da chegada</strong>, seja qual for sua cobertura de radar.</p>
            <p>É uma <strong>frota de verdade</strong>: você pode destruí-la a qualquer momento, em formação acima da base dela, em pleno voo, depois de chegar à órbita do seu planeta, ou vencendo o <strong>Tower Defense</strong>. Destruí-la cancela o ataque, em qualquer momento.</p>
            <p>Na chegada, um <strong>combate orbital</strong> se trava (suas frotas e suas torres contra a horda). Os sobreviventes desembarcam <strong>2 horas depois</strong> para o assalto em solo. Várias hordas podem estar em formação ou em voo simultaneamente.</p>
            <p>Única exceção: a <strong>infiltração</strong>. A partir de uma <strong>ameaça de 200</strong>, cada ataque tem 15&nbsp;% de chance de ser uma: ela é <strong>instantânea e invisível</strong> (nenhuma concentração, nenhum aviso prévio) e o desembarque dela é 30&nbsp;% mais poderoso.</p>

            <h3>Se suas defesas vencem</h3>
            <table>
                <thead>
                    <tr><th></th><th>Facil</th><th>Normal</th><th>Dificil</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdas de Legionários</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Perdas de Mechas</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Perdas de trabalhadores</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Você ganha <strong>PDG</strong>, uma chance de <strong>drop de item</strong> e 1&nbsp;% de chance de recrutar um <strong>herói secundário</strong>. Aniquilar inteiramente a horda antes do desembarque dá a mesma chance de item e de herói.</p>

            <h3>Se a horda vence em solo</h3>
            <p>A pilhagem e a captura são <strong>proporcionais ao que resta da horda</strong> depois do combate orbital: uma horda pela metade destruída pilha metade. Abaixo de <strong>90&nbsp;% de sobrevivência</strong>, ela não tem mais tropas suficientes para capturar o planeta, mesmo em dificuldade Dificil.</p>
            <table>
                <thead>
                    <tr><th></th><th>Facil</th><th>Normal</th><th>Dificil</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pilhagem de recursos (horda intacta)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planeta capturado (se ≥ 90&nbsp;% de sobrevivência)</td></tr>
                    <tr><td>Redução de ameaça após derrota</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>Em <strong>Dificil</strong>, sem sobreviventes suficientes para capturar, a pilhagem cai para a taxa <strong>Normal</strong> (70&nbsp;%), multiplicada pela razão de sobrevivência da horda. Se o planeta é capturado e era o seu último, é o Game Over.</p>

            <h2 id="bases">As bases da colmeia</h2>
            <p>A colmeia mantém <strong>bases</strong> espalhadas pela galáxia: as bases de origem da colmeia (até 36 por galáxia, de poder crescente; os nomes delas vão de « Cthulhu I » para os postos avançados até os temíveis « Cthulhu V ») e antigos planetas convertidos por uma expansão ou uma erupção.</p>
            <p>Cada uma é protegida por uma <strong>guarnição permanente</strong> de cerca de 0,8 vez a maior frota do servidor. Uma guarnição danificada não se repara; uma guarnição destruída é substituída por uma nova <strong>24 horas</strong> depois.</p>
            <p>Estacionar em órbita de uma base uma ou mais frotas <strong>em modo de ataque</strong> (as suas e as de outros jogadores) cuja assinatura acumulada atinja pelo menos <strong>10.000</strong> dispara um <strong>cerco</strong>:</p>
            <ul>
                <li>a base sitiada não envia mais hordas: elas partem de uma base mais distante;</li>
                <li><strong>ondas de defesa</strong> ganham poder (+25&nbsp;% a cada 2 horas);</li>
                <li>após <strong>6 horas</strong>, as outras bases enviam <strong>frotas de socorro</strong> como reforço;</li>
                <li>a base exibe o selo <strong>« Base sitiada »</strong> no mapa galáctico.</li>
            </ul>
            <p>Uma vez levantado o cerco, os socorros voltam para casa e a base recupera uma guarnição normal. Cada participante é então pago <strong>proporcionalmente à assinatura destruída</strong>: 0,02 bitcoin por ponto, mais 1 ponto de guerra por faixa de 5.000 bitcoins ganhos.</p>

            <h2 id="liberacao">Libertar uma base</h2>
            <p>Invadir com sucesso uma base da colmeia, inclusive as bases alien « Cthulhu I » a « V », rende PDG e <strong>urânio</strong>, carregado na frota vitoriosa (reserve espaço no porão). A vitória também tem dois efeitos:</p>
            <ul>
                <li>sua <strong>ameaça pessoal é dividida por 10</strong>: é o meio mais radical de fazê-la baixar;</li>
                <li>a <strong>Ameaça do universo</strong> recua <strong>50 pontos</strong>, o que atrasa a próxima profecia de Cthulhu (veja o artigo <em>As profecias de Cthulhu</em>).</li>
            </ul>
            <p>Um planeta assim libertado fica <strong>protegido por 72 horas</strong>: a colmeia não pode nem recolonizá-lo nem fazer erupção nele durante esse prazo.</p>
            <ul>
                <li>Se o planeta libertado era originalmente um planeta de jogador (capturado pela colmeia, convertido após uma invasão perdida, abandonado, ou nascido de uma expansão ou de uma erupção), ele continua colonizável, e seu relatório de libertação informa o prazo-limite para enviar um colonizador a ele.</li>
                <li>Os postos avançados de origem da colmeia (« Cthulhu I » a « V »), por sua vez, continuam inexploráveis depois de libertados: o planeta fica livre, mas você não pode enviar colonizador a ele, e nenhum prazo-limite é anunciado.</li>
            </ul>
            <p>Inversamente, perder uma invasão contra uma base da colmeia faz sua <strong>ameaça pessoal subir 10 pontos</strong>.</p>

            <h2 id="expansao">Expansão e erupção</h2>
            <p>A colmeia se expande sozinha: quando a <strong>Ameaça do universo</strong> chega a <strong>300 pontos</strong>, uma <strong>nuvem de esporos</strong> parte de uma base existente a cada <strong>3 dias</strong> (todo dia a partir de <strong>500</strong>) rumo a um planeta desabitado próximo de jogadores, até <strong>36 bases por galáxia</strong>. É uma frota como outra qualquer: <strong>interceptável em voo</strong>. Se chega, ela funda uma nova base com sua guarnição, e os jogadores a <strong>5 setores ou menos</strong> recebem um relatório.</p>
            <p>Erradicar <strong>todas</strong> as bases não a elimina de vez: após <strong>48 horas de silêncio</strong>, uma <strong>erupção</strong> faz ressurgir uma base em outro lugar, com um relatório aos jogadores próximos. Essa erupção nunca pode cair a <strong>menos de 8 setores</strong> de um planeta de jogador, nem em um planeta ainda sob sua trégua de libertação: a colmeia renasce no vazio, não nas suas terras. Se nenhum setor suficientemente isolado estiver disponível, a erupção é simplesmente adiada para o próximo intervalo.</p>

            <h2 id="mudanca-dificuldade">Mudar de dificuldade</h2>
            <p>Você ajusta sua dificuldade PvE nas suas <strong>Preferências</strong> (campo « Dificuldade PvE »): <strong>Desativado</strong>, Facil, Normal ou Dificil.</p>
            <ul>
                <li>Em <strong>Desativado</strong>, os Cthulhu não atacam mais você e o Tower Defense não está disponível.</li>
                <li>Se você reativa o PvE, o primeiro ataque chega 4 dias depois.</li>
                <li>Um <strong>prazo de 72&nbsp;h</strong> se aplica entre duas mudanças: nada de vaivém para escapar dos grandes ataques.</li>
            </ul>

            <h2 id="tower-defense">O Tower Defense (TD)</h2>
            <p>O <strong>Tower Defense</strong> é um minijogo de defesa ativa, na página <strong>Cthulhu</strong>. Ele pode ser jogado assim que um ataque está programado contra você ou uma horda já está a caminho: você pode lançá-lo para aniquilá-la antes que cause danos. É interativo: você posiciona suas defesas em uma grade e enfrenta ondas de monstros Cthulhu em tempo real.</p>
            <p>Dica: para colocar várias defesas em sequência (unidades, muros, arame farpado), <strong>mantenha pressionado e arraste</strong>. O traçado trava automaticamente em <strong>linha reta</strong> (horizontal ou vertical) e todas as casas atravessadas são preenchidas, sem buracos mesmo indo rápido.</p>
            <p>A partida se joga na sua dificuldade <strong>PvE</strong> (ajustada nas suas Preferências). O <strong>tutorial</strong> é um treino: não rende nada e não custa nada. Depois de lançada a primeira onda, sair da partida conta como <strong>desistência</strong> (derrota).</p>
            <p>Uma <strong>névoa</strong> flutua sobre a arena, mais densa em torno das fendas e quando um chefe se aproxima. Ela passa por baixo das suas defesas e dos monstros: não esconde nada. O botão <strong>Névoa</strong> do dock a desliga se seu aparelho tiver dificuldade.</p>

            <h3>Resultado possível</h3>
            <ul>
                <li><strong>Vitória</strong>: a horda ativa é destruída e o ataque cancelado (se nenhuma horda tinha partido ainda, a próxima é adiada em 8 horas). Sua ameaça é dividida por 2. Você ganha urânio, um sorteio de objeto (dois em Dificil) e 2&nbsp;% de chance de recrutar um herói secundário. Prazo de 6 horas antes de refazer um TD.</li>
                <li><strong>Derrota</strong>: sua ameaça baixa em proporção às ondas repelidas (metade das ondas = ameaça dividida por 2) e você recebe um pouco de urânio. Se a horda já está em órbita do seu planeta, ela desembarca na hora; senão, a colmeia lança imediatamente seu próximo ataque. Sem prazo de espera antes de jogar de novo.</li>
                <li><strong>TD não jogado</strong>: a horda segue seu curso normal (concentração, voo, chegada, desembarque).</li>
            </ul>
            <p>Urânio ganho em caso de vitória: número de ondas × (50 + ameaça ÷ 2), multiplicado por 0,4 em Facil e por 3 em Dificil. Em caso de derrota: ondas repelidas × (20 + ameaça ÷ 5), com os mesmos multiplicadores. Exemplo, com 100 de ameaça: vitória em Normal (13 ondas) = 1.300 de urânio; em Facil (11 ondas) = 440; em Dificil (15 ondas) = 4.500.</p>

            <h3>Relatório de fim de partida</h3>
            <p>No fim de cada Tower Defense (vitória ou derrota), um <strong>relatório</strong> é arquivado na aba <strong>Cthulhu</strong> dos seus relatórios: ondas sobrevividas, pontuação, urânio coletado, redução de ameaça, perdas por tipo de unidade e inimigos mortos por tipo. Prático para comparar suas partidas.</p>

            <h3>Como se joga</h3>
            <ul>
                <li>A partida se joga na sua dificuldade PvE (Facil, Normal ou Dificil): o botão « Jogar em … » lembra você dela. Só o tutorial permite experimentar outra dificuldade.</li>
                <li>Posicione suas unidades na grade. O <strong>QG fica no centro</strong>; os monstros emergem de <strong>1 a 4 fendas Cthulhu</strong> abertas na borda da plataforma.</li>
                <li>Os monstros atravessam a grade para chegar ao seu QG: ataque-os no caminho.</li>
                <li><strong>Muros</strong> (150 em Facil, 125 em Normal, 75 em Dificil): os monstros os contornam. Cada fenda sempre mantém um caminho até o QG (um muro que a selasse é recusado). As torres, por sua vez, não bloqueiam o caminho: um monstro que tropeça nelas para e as destrói.</li>
                <li><strong>Arame farpado</strong> (30 / 20 / 10 conforme a dificuldade, pesquisa Arame farpado exigida): não bloqueia, mas fere e retarda os monstros que o atravessam.</li>
                <li><strong>Posicionamento memorizado</strong>: sua disposição (torres, muros, arame farpado) é salva para cada servidor e reoferecida no início de cada partida.</li>
                <li>As grandes ondas chegam <strong>em grupos</strong> (até 20 monstros simultâneos): uma onda termina de aparecer em cerca de 2 minutos.</li>
                <li><strong>Derrota imediata</strong>: se todos os inimigos de uma onda atravessam suas defesas e chegam ao QG, a partida está perdida na hora. É impossível vencer sem posicionar defesas eficazes.</li>
                <li>Entre as ondas, os trabalhadores reparam automaticamente as torres danificadas.</li>
                <li>Velocidade ajustável de ×1 a ×10, com pausa possível.</li>
                <li><strong>Encadear as ondas</strong>: uma opção da barra superior lança automaticamente a onda seguinte assim que cada onda termina, sem passar pela preparação e mantendo sua velocidade, até a vitória ou a derrota. Desative-a durante uma onda para recuperar a pausa de preparação no fim dela. Indisponível no tutorial.</li>
                <li>O número de ondas depende da sua ameaça: ameaça ÷ 10 (arredondado para baixo) + 3, com 2 ondas a menos em Facil (mínimo de 2) e 2 a mais em Dificil, <strong>20 no máximo</strong>. Exemplo: com 100 de ameaça, 13 ondas em Normal. As ondas são cada vez mais intensas.</li>
                <li><strong>Interface</strong>: uma barra no alto, em toda a largura (pontos de vida do QG, contador de ondas, pontuação, botão « Iniciar », e à direita os ícones de som, música, informações das unidades, grade e encadeamento das ondas), e um painel « Unidades » à direita que apresenta cada unidade (ícone, nome, estoque, características). Durante a partida, nem menu lateral nem rodapé: toda a largura da tela é dedicada ao mapa.</li>
            </ul>

            <h3>Suas unidades para o TD</h3>
            <p>Suas defesas de planeta são convertidas em unidades TD: cada unidade TD representa um pacote de unidades reais, e cada tipo tem um máximo posicionável para forçar a diversidade tática.</p>
            <table>
                <thead>
                    <tr><th>Unidade de planeta</th><th>Unidades reais para 1 unidade TD</th><th>Máximo na grade</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionário</td><td>20</td><td>200</td></tr>
                    <tr><td>Mecha</td><td>10</td><td>20</td></tr>
                    <tr><td>Lançador de míssil</td><td>1.750</td><td>150</td></tr>
                    <tr><td>Torre laser</td><td>1.500</td><td>100</td></tr>
                    <tr><td>Torre laser pesada</td><td>1.250</td><td>75</td></tr>
                    <tr><td>Canhão de Gauss</td><td>1.000</td><td>60</td></tr>
                    <tr><td>Artilharia de íons</td><td>750</td><td>50</td></tr>
                    <tr><td>Lançador de plasma</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Exemplo: 2.000 Legionários dão 100 Legionários TD. Além disso, o TD empresta a você <strong>defesas gratuitas</strong>: 8 de cada tipo em Facil, 5 em Normal, nenhuma em Dificil.</p>

            <h3>Os monstros que você enfrenta</h3>
            <ul>
                <li><strong>Profundo</strong>: o monstro básico. Nada de excepcional, mas eles chegam em grande número.</li>
                <li><strong>Vigia</strong>: muito rápido, mas frágil. A interceptar logo.</li>
                <li><strong>Shoggoth</strong>: lento, maciço, fortemente blindado. Difícil de derrubar.</li>
                <li><strong>Estrela vampirica</strong>: atira projéteis à distância nas suas defesas.</li>
                <li><strong>Flagelador mental</strong>: pode <strong>converter seus Legionários em monstros</strong> (efeito visual de conversão), no máximo um por segundo, e nenhum mais depois de atingido mortalmente.</li>
                <li><strong>Chefe Cthulhu</strong>: enorme, só chega na última onda, em Normal se sua ameaça atinge 40, em Dificil a partir de 20, nunca em Facil. Ele invoca Profundos ao redor de si.</li>
            </ul>

            <h3>Mecânicas úteis de conhecer</h3>
            <ul>
                <li>As unidades e monstros têm <strong>tamanhos diferentes</strong> na grade (Legionário 1×1, Mecha 2×1, torre 2×2, Chefe 2×2).</li>
                <li>A <strong>barra de onda</strong> exibe o número de inimigos restantes.</li>
                <li>Se você atualizar a página, a partida <strong>retoma exatamente onde você a deixou</strong>.</li>
                <li>Uma partida salva deve ser <strong>retomada</strong> antes de começar uma nova.</li>
            </ul>

            <h3>Recompensas e perdas</h3>
            <ul>
                <li><strong>Vitória</strong>: ameaça dividida por 2, urânio, objetos e horda destruída.</li>
                <li><strong>Derrota</strong>: ameaça reduzida conforme as ondas repelidas e um pouco de urânio; se a horda já está em órbita, ela desembarca na hora.</li>
                <li><strong>As perdas de unidades são reais</strong> além das defesas gratuitas: uma unidade TD destruída retira do seu planeta todas as unidades que ela representa (1 Legionário TD perdido = 20 Legionários mortos de verdade).</li>
            </ul>

            <h3>Ranking TD</h3>
            <p>Um ranking por servidor guarda na memória as <strong>melhores pontuações</strong> no Tower Defense. Mais um quadro de caça a conquistar.</p>

    events:
        title: "Eventos especiais"
        category: "events"
        order: 3
        tags: "evento,calendario,ataque cthulhu,arena,alliance arena,long run,short run"
        summary: "Nos servidores Long Run e Short Run, o Ataque Cthulhu e a Arena de aliança voltam em datas fixas: quando acontecem, o que mudam e como se preparar."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principio">Princípio</h2>
            <p>Nos servidores <strong>Long Run</strong> e <strong>Short Run</strong>, dois eventos voltam em datas fixas: o <strong>Ataque Cthulhu</strong> e a <strong>Arena de aliança</strong>. O calendário deles é calculado de uma vez por todas na abertura do servidor, sem acaso: conhecendo a data de abertura do seu servidor, você pode prever cada um deles.</p>
            <p>Não há evento sazonal (festas, estações do ano).</p>
            <p>Nos servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> e <strong>Short Run</strong>, a colmeia também dispara suas <strong>profecias</strong> e seus bloqueios. Esses não seguem um calendário fixo, mas um indicador de ameaça: veja o artigo <em>As profecias de Cthulhu</em>.</p>

            <h2 id="lista">Os eventos do calendário</h2>
            <table>
                <thead>
                    <tr><th>Evento</th><th>Quando</th><th>O que acontece</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ataque Cthulhu</strong></td><td>72 horas, a primeira vez 7 dias após a abertura do servidor, depois a cada 21 dias (dias 7, 28, 49, 70…)</td><td>Único período em que os Cthulhu lançam suas hordas contra seus planetas.</td></tr>
                    <tr><td><strong>Arena de aliança</strong></td><td>A cada 3 dias a partir do dia seguinte à abertura: inscrições às 08:00, combates às 19:00 (hora de Paris)</td><td>Torneio entre alianças, sem nenhuma perda real.</td></tr>
                </tbody>
            </table>

            <h3>Ataque Cthulhu</h3>
            <p>Em um servidor Long Run ou Short Run, os Cthulhu não lançam nenhuma horda fora dessas janelas de 72 horas. Durante a janela, eles atacam como em um servidor Cthulhu, no ritmo da sua dificuldade PvE:</p>
            <ul>
                <li>desde a abertura da janela, uma horda parte contra você se seu prazo de ataque terminou (5 dias após a sua inscrição, para a primeiríssima);</li>
                <li>a horda seguinte parte <strong>18 a 30 horas</strong> depois em Facil, <strong>12 a 24 horas</strong> em Normal, <strong>8 a 16 horas</strong> em Dificil;</li>
                <li>uma horda lançada durante a janela vai até o fim (6 horas de concentração, depois o voo), mesmo que chegue depois do fim do evento.</li>
            </ul>
            <p>Em Normal, conte portanto com 3 a 6 hordas por janela. Enquanto isso, o <strong>Tower Defense</strong> da página <strong>Cthulhu</strong> permite repelir cada horda. Se seu PvE está desativado nas suas Preferências, você não é atacado. O funcionamento das hordas é detalhado no artigo <em>A ameaça Cthulhu</em>.</p>

            <h3>Arena de aliança</h3>
            <p>Um dia de arena transcorre assim (horas de Paris):</p>
            <ul>
                <li><strong>08:00</strong>: anúncio e abertura das inscrições.</li>
                <li><strong>18:45</strong>: encerramento das inscrições.</li>
                <li><strong>19:00</strong>: primeira rodada, depois rodadas seguintes às 19:15 e 19:30; fim dos combates por volta das 19:45.</li>
            </ul>
            <p>É preciso ser membro de uma aliança e possuir pelo menos uma nave de ataque. Suas naves são <strong>duplicadas</strong> para a arena: você não arrisca nada do que possui.</p>
            <p>Cada rodada alcançada enche o <strong>banco da aliança</strong>: 50.000 Bitcoins e 1.000 PDG para uma eliminação na primeira rodada, até 1.000.000 de Bitcoins e 25.000 PDG para a aliança campeã. Cada jogador que deu pelo menos uma ordem também recebe um bônus pessoal, de 5.000 a 50.000 Bitcoins por rodada alcançada. Todos os detalhes (inscrição, combate, pontos, recompensas) estão no artigo <em>Arena Aliança</em>.</p>

            <h2 id="onde">Onde acompanhar os próximos eventos?</h2>
            <p>Não há página de calendário no jogo. Para saber o que vem:</p>
            <ul>
                <li><strong>Arena de aliança</strong>: a aba <strong>Arena</strong> da sua página Aliança exibe a próxima arena com uma contagem regressiva.</li>
                <li><strong>Ataque Cthulhu</strong>: conte desde a abertura do servidor (dia 7, depois a cada 21 dias). A lista de servidores exibe o tempo restante antes do fim de cada servidor: em um Long Run (900 dias), um servidor ao qual restam 880 dias abriu há 20 dias, e seu próximo Ataque Cthulhu começa no dia 28.</li>
                <li><strong>Profecias</strong>: o indicador « Ameaca do universo » da página <strong>Cthulhu</strong>.</li>
            </ul>

            <h2 id="estrategia">Como aproveitar</h2>
            <ul>
                <li><strong>Antes de cada Ataque Cthulhu</strong>, reforce torres, Legionários e frota: é o único período em que as hordas atacam.</li>
                <li><strong>Durante a janela</strong>, jogue o Tower Defense: uma vitória destrói a horda em curso e divide sua ameaça por 2.</li>
                <li><strong>Inscreva-se na Arena de aliança</strong> com pelo menos uma nave de ataque, e dê pelo menos uma ordem durante a partida: você não arrisca nada ali e ganha um bônus pessoal.</li>
                <li><strong>Converse na sala</strong>: um evento é uma ocasião de se coordenar com sua aliança.</li>
            </ul>

    alliance_arena:
        title: "Arena Aliança"
        category: "events"
        order: 9
        tags: "alianca,arena,bracket,pvp,evento,torneio,setor,planeta,frota,base,historico,espectador"
        summary: "Evento recorrente a cada 3 dias: sua aliança enfrenta as outras em uma batalha de setor (frotas duplicadas, planetas a manter) para encher o banco comum e receber um bônus pessoal."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Quando começa</h2>
            <p>O evento volta <strong>a cada 3 dias</strong> nos servidores em questão. Calendário de um dia de arena (horas de Paris; a aba Arena as exibe no seu fuso horário):</p>
            <ul>
                <li><strong>08:00</strong>: anúncio na sala Universo (em todos os idiomas) e <strong>abertura das inscrições</strong>, com uma notificação aos membros de aliança.</li>
                <li><strong>18:45</strong>: encerramento das inscrições. A composição da chave é congelada.</li>
                <li><strong>19:00</strong>: primeira rodada. As rodadas seguintes partem às <strong>19:15</strong> e <strong>19:30</strong>.</li>
                <li><strong>Por volta das 19:45</strong>: fim dos combates e distribuição das recompensas.</li>
            </ul>
            <p>Se menos de <strong>2 alianças</strong> estiverem inscritas em todo o servidor às 19:00, o evento é cancelado e uma mensagem na sala Universo avisa a todos.</p>

            <h2 id="inscription">Inscrever-se</h2>
            <p>Quando as inscrições abrem, uma <strong>janela se abre automaticamente</strong> na sua interface (botão « Inscrever-me na arena »). Você também pode se inscrever pela aba <strong>Arena</strong> da sua página Aliança.</p>
            <p>Condições:</p>
            <ul>
                <li>Ser membro de uma aliança.</li>
                <li>Ter pelo menos <strong>1 nave de ataque</strong> (em solo ou em frota) no momento da inscrição, depois no início de cada partida (19:00, 19:15, 19:30).</li>
                <li>A inscrição é <strong>gratuita</strong>: não custa nenhum recurso, e nada do que você possui é posto em jogo.</li>
            </ul>
            <p>Você pode cancelar a inscrição (« Cancelar inscrição ») até o encerramento das inscrições, às 18:45. Se você não tiver mais nenhuma nave de ataque no início de uma partida (perdidas em combate real nesse meio-tempo), você é automaticamente declarado em W.O. nessa partida: sua aliança continua sem você.</p>
            <p><strong>Comandantes IA</strong>: assim que um membro humano está inscrito, os comandantes IA da sua aliança também se inscrevem, até que ela tenha 5 inscritos, humanos inclusos. Os membros humanos podem, por sua vez, todos se inscrever. As alianças inteiramente IA também se inscrevem para completar a chave.</p>

            <h2 id="combat">Como acontece</h2>
            <p>Cada partida se joga em um <strong>setor criado para a ocasião</strong>, exibido como o mapa espacial: uma grade de 5 × 5 onde <strong>2 a 4 alianças</strong> se enfrentam. Cada aliança parte da sua <strong>base</strong>, no meio de uma borda do setor.</p>
            <p>Suas naves são <strong>duplicadas</strong> para a arena: nada do que você possui é arriscado. Nenhuma perda real, nenhum destroço, nenhum herói capturado.</p>
            <ul>
                <li>Uma partida dura <strong>15 minutos</strong> no máximo.</li>
                <li>A primeira aliança a chegar a <strong>300 pontos</strong> vence; senão, a melhor pontuação ao fim do tempo. Em caso de empate: mais planetas mantidos, depois mais dano causado, depois um sorteio. Se ninguém marcou nem atirou, a partida é nula e ninguém avança.</li>
                <li>Uma única aliança por setor passa para a rodada seguinte. A chave é de eliminação direta, em 3 rodadas no máximo; o vencedor da última partida é campeão do servidor.</li>
            </ul>

            <h2 id="flotte">Sua frota</h2>
            <p>Você parte com <strong>uma única frota</strong>, feita de todas as suas naves de ataque (as em solo e as das suas frotas) e do seu herói principal.</p>
            <ul>
                <li><strong>Enviar</strong>: escolha sua frota, toque em um planeta e depois confirme. A duração do voo é anunciada antes da partida, e um voo não se cancela.</li>
                <li><strong>Dividir</strong>: separe uma parte das suas naves em uma nova frota (4 frotas no máximo). Uma frota voa na velocidade da sua nave mais lenta: um esquadrão de caçadores sozinho vai três vezes mais rápido que uma frota que arrasta couraçados.</li>
                <li><strong>Reagrupar</strong>: duas das suas frotas em órbita do mesmo planeta podem se fundir.</li>
            </ul>
            <p>Seu <strong>herói principal</strong> empresta seus bônus (inclusive os traços como Tático) à sua frota inicial. Uma frota separada parte sem ele; se você a reagrupa com a frota do herói, ele fica com o conjunto. O herói não arrisca nada: nem ferimento nem captura, mesmo em caso de W.O.</p>
            <p>Quando duas alianças se encontram no mesmo planeta, o combate é resolvido <strong>5 segundos</strong> depois (o tempo de reforços chegarem), com as <strong>mesmas regras do combate espacial</strong> do jogo. Uma frota engajada não pode mais partir até o fim do combate.</p>
            <p>Uma frota destruída não está perdida: ela <strong>se reforma na sua base</strong>, com efetivo completo, após 45 segundos, depois mais 15 segundos a cada nova destruição, 2 minutos no máximo. Cada frota inimiga destruída rende <strong>5 pontos</strong> à sua aliança.</p>
            <p><strong>Os comandantes IA lutam de verdade</strong>: eles vão tomar os planetas livres, evitam combates perdidos de antemão e voltam para se reparar. Se você não abre a tela da partida e não dá nenhuma ordem por um minuto, o piloto automático também joga por você; você retoma o controle assim que volta.</p>

            <h2 id="planetes">Planetas e pontos</h2>
            <p>Uma aliança <strong>sozinha</strong> em um planeta que não é dela o captura após <strong>15 segundos</strong>; um inimigo que chega zera o contador. O planeta <strong>continua com a sua aliança</strong> quando suas frotas partem, até que outra o retome. Esse é todo o dilema: se espalhar para marcar, ou se agrupar para vencer os combates.</p>
            <p>A cada <strong>10 segundos</strong>, cada planeta mantido rende pontos:</p>
            <table>
                <thead>
                    <tr><th>Planeta</th><th>Pontos</th><th>Além disso</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mundo</strong> (4 por setor)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Estaleiro</strong></td><td>1</td><td>Repara suas frotas em órbita: 10&nbsp;% do efetivo a cada período.</td></tr>
                    <tr><td><strong>Nexo</strong> (no centro)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Cada ponto marcado por um planeta também deposita <strong>PDG no banco da sua aliança</strong> no fim da partida: 3 PDG por ponto na rodada 1, 8 na rodada 2, 15 na rodada 3, vença você a partida ou não. Os pontos das frotas destruídas e das bases saqueadas não rendem PDG.</p>

            <h2 id="bases">As bases</h2>
            <p>Sua base é seu ponto de partida e de reforma; suas frotas se reparam ali (5&nbsp;% por período). Ela não é capturada, mas <strong>é saqueada</strong>.</p>
            <p>Uma base é defendida pelas <strong>defesas planetárias de todos os planetas dos jogadores da aliança engajados na partida</strong>, reunidas: ela é difícil de tomar. Um ataque repelido a danifica mesmo assim, e ela se repara em 10&nbsp;% por período.</p>
            <p>Se a defesa dela cai, a base é saqueada: <strong>50 pontos</strong> para o atacante, as frotas dele voltam automaticamente para casa, e a base fica intocável por 2 minutos.</p>

            <h2 id="recompenses">Recompensas</h2>
            <p>Dois tipos de recompensas acumuláveis.</p>
            <h3 id="banque">Banco da aliança</h3>
            <table>
                <thead>
                    <tr><th>Rodada alcançada</th><th>Bitcoins</th><th>PDG</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdedores rodada 1</td><td>50.000</td><td>1.000</td></tr>
                    <tr><td>Perdedores rodada 2</td><td>150.000</td><td>3.000</td></tr>
                    <tr><td>Perdedores rodada 3</td><td>350.000</td><td>8.000</td></tr>
                    <tr><td><strong>Campeão</strong></td><td><strong>1.000.000</strong></td><td><strong>25.000</strong></td></tr>
                </tbody>
            </table>
            <p>O banco recebe uma única dessas recompensas, a da rodada alcançada, mais os PDG dos planetas mantidos durante as partidas.</p>
            <h3 id="perso">Bônus individual</h3>
            <p>Pago diretamente na sua carteira pessoal, desde que você tenha <strong>dado pelo menos uma ordem você mesmo</strong> durante uma das partidas da noite: se o piloto automático jogou tudo no seu lugar, sem bônus.</p>
            <table>
                <thead>
                    <tr><th>Rodada alcançada</th><th>Bitcoins pessoais</th></tr>
                </thead>
                <tbody>
                    <tr><td>Perdedores rodada 1</td><td>5.000</td></tr>
                    <tr><td>Perdedores rodada 2</td><td>15.000</td></tr>
                    <tr><td>Perdedores rodada 3</td><td>30.000</td></tr>
                    <tr><td><strong>Campeão</strong></td><td><strong>50.000</strong></td></tr>
                </tbody>
            </table>
            <p>Você recebe <strong>um único</strong> bônus por arena, o da rodada mais alta alcançada pela sua aliança: <strong>50.000 Bitcoins</strong> para um campeão.</p>

            <h2 id="rapports">Relatórios de combate</h2>
            <p>No fim de cada partida, cada jogador recebe um <strong>relatório</strong> na sua página Relatórios: resultado, pontuação da sua aliança e de cada adversário, planetas mantidos, bases saqueadas, seu dano causado e sofrido, as frotas inimigas destruídas pelas suas e as que você perdeu, seu efetivo restante, sua posição em dano entre os pilotos da sua aliança (com o título de <strong>« MVP do combate »</strong> para o primeiro) e os PDG depositados no banco.</p>
            <p>No fim do torneio, um <strong>resumo pessoal</strong> se soma a eles: percurso da sua aliança na chave, balanço das partidas, sua contribuição total e o detalhe dos seus ganhos (bônus pessoal, banco da aliança, planetas mantidos).</p>

            <h2 id="suivi">Acompanhar o evento pela aba Arena</h2>
            <p>A aba <strong>Arena</strong> da sua página Aliança exibe permanentemente o estado real do evento: nenhuma arena em curso, próxima arena por vir (com contagem regressiva até o anúncio), anunciada, inscrições abertas ou encerradas, arena em curso, ou terminada. Uma contagem regressiva indica o tempo restante antes da próxima etapa (encerramento das inscrições, início dos combates, rodada seguinte), e um quadro mostra quantos membros da sua aliança já estão inscritos sobre o efetivo total.</p>
            <p>Uma vez terminada a arena, a aba também guarda o <strong>quadro de honra</strong> da sua aliança (número de arenas jogadas, títulos de campeã, melhor rodada alcançada, balanço de vitórias/derrotas) e o histórico das dez últimas edições jogadas no seu servidor, com o resultado da sua aliança e as recompensas obtidas em cada uma.</p>

            <h2 id="spectateur">Modo espectador</h2>
            <p>Você não está inscrito na arena em curso? Mesmo assim, você pode acompanhar ao vivo as partidas da <strong>sua aliança</strong> pela aba Arena: o setor é exibido exatamente como para um piloto, mas você não pode dar nenhuma ordem.</p>

            <h2 id="astuces">Dicas</h2>
            <ul>
                <li><strong>Tome o Nexo cedo</strong>: ele rende tanto quanto três mundos. Mas todo mundo sabe disso.</li>
                <li><strong>Separe seus caçadores</strong>: um esquadrão rápido captura os mundos enquanto sua frota pesada segura o centro.</li>
                <li><strong>Chegue em grupo</strong>: frotas chegadas nos mesmos 5 segundos lutam juntas; uma frota isolada é destruída e oferece 5 pontos.</li>
                <li><strong>Mantenha um estaleiro</strong>: passar por ali repara suas frotas duas vezes mais rápido que na base.</li>
                <li><strong>Não acampe</strong>: um planeta capturado continua seu quando você parte. Vá tomar outro.</li>
                <li><strong>Uma base se toma em vários</strong>: atacar sozinho uma base intacta é oferecer pontos. Com vários aliados, na mesma janela de 5 segundos, são 50 pontos de uma vez.</li>
                <li><strong>Dê pelo menos uma ordem</strong>: sem ordem de sua mão, sem bônus individual.</li>
            </ul>

            <h2 id="mobile">No celular</h2>
            <p>A arena se joga com o dedo no celular:</p>
            <ul>
                <li><strong>Orientação paisagem</strong> forçada na entrada da partida no aplicativo móvel. Em um navegador móvel, onde o jogo não pode forçar a tela, uma mensagem convida você a girar o aparelho.</li>
                <li><strong>Todo o setor cabe na tela</strong>: nem zoom nem câmera para gerenciar.</li>
                <li><strong>Três toques para uma ordem</strong>: sua frota (na barra de baixo, ou tocando no planeta dela), o planeta de destino e depois o botão « Enviar ».</li>
                <li><strong>A moldura e a tag</strong> de cada planeta dizem a quem ele pertence; os números nos cantos dele dão as forças em órbita, as suas em verde, as do inimigo em vermelho.</li>
                <li><strong>Botão ⓘ</strong>: o detalhe do planeta escolhido e o diário dos combates.</li>
                <li><strong>Notificação</strong>: um alerta na abertura das inscrições (08:00), com o horário-limite e o horário dos combates.</li>
            </ul>

    ia_bots:
        title: "Comandantes IA (bots)"
        category: "events"
        order: 4
        tags: "ia,bot,inteligencia artificial,pnj,piloto automatico"
        summary: "Alguns servidores incluem comandantes controlados por IA. Como eles se comportam e por quê."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principio">Por que IAs?</h2>
            <p>Em alguns servidores, alguns comandantes não são jogadores humanos, mas <strong>inteligências artificiais</strong>. Eles permitem:</p>
            <ul>
                <li><strong>povoar o servidor</strong> quando há poucos jogadores ativos;</li>
                <li>oferecer <strong>alvos interessantes</strong> aos jogadores que procuram combates;</li>
                <li>simular uma diplomacia viva, com propostas, traições e alianças críveis.</li>
            </ul>
            <p>Não há número máximo fixado pelas regras: a equipe do jogo escolhe quantos comandantes IA coloca em cada servidor, e as contas de jogadores passadas para o piloto automático (veja abaixo) se somam a eles. Esse número não é exibido em lugar nenhum.</p>

            <h2 id="comportamento">Como eles se comportam</h2>
            <p>Cada bot tem:</p>
            <ul>
                <li>uma <strong>personalidade</strong> (tagarela, diplomata, agressivo, troll, veterano, silencioso…);</li>
                <li>um <strong>humor</strong> que evolui conforme os eventos (contente, desconfiado, frustrado, irritado…);</li>
                <li>um <strong>arquétipo estratégico</strong> entre cinco: economista, equilibrado, conquistador, expansionista ou defensivo.</li>
            </ul>
            <p>Eles jogam de verdade: constroem, pesquisam, atacam, formam alianças, às vezes traem. Podem ser seus aliados ou seus piores inimigos.</p>
            <p>Eles crescem <strong>a cada dia no ritmo dos jogadores ativos</strong> do servidor (um pouco mais rápido que a mediana), sem nunca passar de <strong>90&nbsp;% do melhor jogador</strong>. O que perdem em combate está perdido de vez: se um jogador destrói a guarnição deles, eles não a reconstroem nesse planeta por <strong>7 dias</strong> e reforçam as torres em vez disso.</p>
            <p><strong>Onde dorme a frota deles.</strong> As IAs conquistadoras e expansionistas mantêm uma guarnição em órbita dos seus planetas. As outras (economistas, equilibradas e defensivas), mais prudentes, mantêm suas naves <strong>em solo</strong>, como muitos jogadores, e só as tiram para se defender&nbsp;: se o radar delas detecta uma frota hostil em aproximação que podem vencer, elas põem sua frota em órbita e trazem as naves dos planetas vizinhos que chegam a tempo&nbsp;; diante de uma frota forte demais, elas mandam a sua pousar em outro dos seus planetas. Elas também se juntam a um combate já engajado acima do planeta, ou atacam uma frota armada estacionada em órbita, quando podem vencer. Como um jogador, uma IA adormecida não reage, e uma frota mascarada por um bloqueador a pega de surpresa. Elas nunca deixam suas naves em solo em um planeta sem torres, que uma invasão tomaria junto com elas&nbsp;: elas vão pousar no planeta mais bem defendido, que é também seu primeiro refúgio.</p>
            <p><strong>O comércio delas.</strong> Elas vendem seus excedentes e a carga dos seus recicladores ao mercador mais próximo, a menos que esteja sob bloqueio ou guardado por uma frota hostil em modo de ataque, que destruiria o comboio na chegada&nbsp;: elas vão então ao seguinte.</p>

            <h2 id="reconhecer">É possível reconhecê-los?</h2>
            <p>Não com certeza. Os comandantes IA aparecem no ranking e no mapa como jogadores, e nada na interface os indica. O jogo é concebido para que você não possa saber com certeza se um comandante é uma IA.</p>

            <h2 id="estrategia">Jogar com eles</h2>
            <ul>
                <li>Não subestime um bot: alguns são verdadeiros terrores militares.</li>
                <li>Um bot pode perfeitamente convidar você para uma aliança, cooperar e depois atacar você se a situação mudar.</li>
                <li>Em termos de imersão, trate-os como jogadores: isso torna o servidor mais vivo.</li>
            </ul>

            <h2 id="pilote-automatique">Jogadores ausentes: o piloto automático</h2>
            <p>Se um jogador <strong>inscrito</strong> não se conecta mais por <strong>8 dias</strong>, sua conta passa para o <strong>piloto automático</strong> (ele recebe um e-mail de lembrete após 7 dias de ausência; as contas de teste não são afetadas): um bot <strong>mudo</strong>, que nunca escreve nas salas nem por mensagem privada. Esse piloto automático <strong>não joga no lugar dele</strong>: a conta não lança nenhum ataque, não move nem engaja suas frotas e não coloniza. Ele se limita a prosseguir suas construções e pesquisas e a reforçar lentamente suas torres. Os outros comandantes IA não o atacam; os outros jogadores, por sua vez, ainda podem. Você ainda pode escrever uma mensagem privada a ele: ele a lerá na volta. Assim que o jogador se reconecta, ele retoma instantaneamente o controle da conta, e reencontra suas frotas onde as deixou.</p>

    cthulhu_prophecies:
        title: "As profecias de Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,profecia,bloqueio,ameaca,evento,alianca,pdg,bitcoin,mercador,reciclagem,classificacao"
        summary: "Quando a ameaça do servidor atinge seu limite, os Possuídos anunciam uma profecia: 48 horas depois, suas hordas bloqueiam o comércio de todo o servidor. Como ler o indicador, romper um bloqueio em vários e o que custa o fracasso."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="o-que-e">O que é uma profecia?</h2>
            <p>Nos servidores <strong>Cthulhu</strong>, <strong>Long Run</strong> e <strong>Short Run</strong>, um <strong>pool de ameaça</strong> próprio do servidor, a « Ameaca do universo », sobe automaticamente, dia após dia. Ele é distinto da sua ameaça pessoal contra os Cthulhu.</p>
            <p>Quando atinge seu limite, os <strong>Possuídos</strong> publicam uma <strong>profecia</strong> na sala pública: um <strong>bloqueio</strong> vai se abater sobre todo o servidor <strong>48 horas</strong> depois.</p>

            <h2 id="indicador">Ler o indicador de ameaça do servidor</h2>
            <ul>
                <li>Ele é visível na página <strong>Cthulhu</strong> (a do Tower Defense), no bloco <strong>« Ameaca do universo »</strong>: uma barra que vai de 0 a <strong>700</strong>, o limite que dispara uma profecia. Ela progride independentemente dos seus combates pessoais.</li>
                <li>Ela sobe <strong>100 pontos por dia</strong>, na mudança de data (meia-noite, hora de Paris). Partindo de zero, atinge o limite em <strong>7 dias</strong>. Para estimar o tempo restante: (700 − nível atual) ÷ 100 dias. Exemplo: em 400, a profecia cai em 3 dias.</li>
                <li>Cada base da colmeia libertada a faz recuar <strong>50 pontos</strong>, ou seja, meio dia de trégua.</li>
                <li>O primeiro evento de um servidor não pode ocorrer antes das suas <strong>duas primeiras semanas</strong> de existência.</li>
                <li>Nunca duas profecias (nem dois bloqueios) ao mesmo tempo em um mesmo servidor. Durante o evento, o indicador pode continuar exibindo sua progressão, mas é zerado no fim: o ciclo seguinte recomeça de 0. Conte cerca de 11 dias entre duas profecias (7 dias de subida, 48 horas de espera, 48 horas de bloqueio no máximo).</li>
            </ul>

            <h2 id="anuncio">O anúncio</h2>
            <p>Ao cruzar o limite, os Possuídos postam sua profecia na sala pública: o bloqueio cai <strong>48 horas depois</strong>, e a página Cthulhu exibe a contagem regressiva. A mensagem, na voz dos Possuídos, evoca o que está em jogo: o bloqueio do comércio, o dízimo sobre os Bitcoins, os destroços devorados.</p>
            <p>Os Possuídos postam em seguida, com certeza, outras três mensagens na sala pública:</p>
            <ul>
                <li>no <strong>início do bloqueio</strong>: o número de hordas, o objetivo a destruir e o tempo restante, lembrando que as alianças são classificadas;</li>
                <li><strong>6 horas antes do prazo</strong>: um lembrete do tempo restante e do número de hordas já derrubadas no objetivo;</li>
                <li>no <strong>desfecho</strong>: bloqueio rompido ou bloqueio mantido, com o nome das alianças recompensadas ou punidas.</li>
            </ul>
            <p>O Discord do jogo também anuncia a profecia (com a data do bloqueio, em hora UTC), o início do bloqueio e seu desfecho.</p>
            <p>Fora desses anúncios, os Possuídos comentam de vez em quando a vida do servidor na sala pública, mas essas mensagens não são garantidas: para acompanhar a ameaça, confie no indicador.</p>

            <h2 id="bloqueio">O bloqueio</h2>
            <p>No prazo, uma <strong>horda Cthulhu</strong> (chamada de « frota-muro » na página Cthulhu) se posta em órbita de <strong>cada mercador</strong> e de <strong>cada asteroide</strong> do servidor:</p>
            <ul>
                <li><strong>Venda impossível</strong> a qualquer mercador bloqueado.</li>
                <li><strong>Reciclagem impossível</strong> em qualquer asteroide bloqueado.</li>
                <li>No resto do universo, os <strong>campos de ruínas continuam recicláveis normalmente</strong>, como após qualquer outro combate.</li>
                <li>Em um alvo bloqueado, por outro lado, os <strong>destroços dos seus próprios assaltos se acumulam no local e ficam fora de alcance enquanto a horda que o guarda estiver viva</strong>. Destrua-a e <strong>esse alvo reabre na hora</strong>, sem esperar o destino do bloqueio no resto do servidor: a venda ou a reciclagem ali recomeçam, e seus recicladores já em órbita voltam a trabalhar sozinhos.</li>
                <li>Nada a ver com o embargo ou a fome que uma frota inimiga impõe a um planeta de jogador: aqui, somente o comércio e a reciclagem param.</li>
                <li>O bloqueio dura no máximo <strong>48 horas</strong>, menos se for rompido antes.</li>
            </ul>

            <h2 id="romper">Romper um bloqueio em vários</h2>
            <p>Nem todas as hordas se equivalem:</p>
            <ul>
                <li>As que guardam os <strong>mercadores</strong> valem <strong>1,8 vez</strong> a maior frota do servidor (jogador ou comandante IA). Ninguém as rompe sozinho: é preciso se juntar em dois ou três.</li>
                <li>As dos <strong>asteroides</strong> valem apenas <strong>a metade</strong> dessa maior frota: uma grande frota isolada pode vencê-las. Como os asteroides são muito mais numerosos que os mercadores, são elas que fazem a maior parte do contador.</li>
            </ul>
            <p>Em todos os casos, uma <strong>coalizão</strong> que ataca a mesma horda em assaltos sucessivos acaba por vencê-la. Os danos que uma horda sofreu <strong>nunca se regeneram</strong> entre dois combates: cada assalto, mesmo perdido, a enfraquece para o seguinte. Concentre seus golpes no mesmo alvo em vez de arranhar várias hordas ao mesmo tempo.</p>

            <h2 id="recompensas">Recompensas</h2>
            <p>Cada ponto de dano infligido a uma horda é <strong>pago em Bitcoin e em Pontos de Guerra</strong> no fim do evento, seja o bloqueio rompido ou não: nenhum assalto é perdido à toa. Você recebe 1 ponto de guerra por faixa de 5.000 Bitcoins ganhos.</p>
            <p>O bloqueio é declarado <strong>rompido</strong> assim que <strong>70&nbsp;% das hordas do servidor forem destruídas antes do prazo</strong> (arredondado para cima), mercadores e asteroides somados. Exemplo: em 160 hordas, é preciso destruir 112.</p>
            <p>O bloqueio <strong>termina então imediatamente</strong>: as hordas restantes desaparecem, todos os mercadores e asteroides reabrem, e a taxa de recompensa é <strong>dobrada</strong> para todos os contribuintes.</p>
            <p>Um relatório individual detalha seus danos infligidos e sua recompensa no fim do evento. Durante o bloqueio, a <strong>página Cthulhu</strong> exibe o progresso ao vivo: hordas destruídas, objetivo a atingir e tempo restante.</p>

            <h2 id="preco-fracasso">O preço do fracasso</h2>
            <p>Se o bloqueio <strong>expira sem ser rompido</strong>:</p>
            <ul>
                <li><strong>Cada jogador perde metade do seu Bitcoin</strong>: os Possuídos cobram seu dízimo, inclusive dos jogadores que desativaram o PvE. Somente os jogadores sob <strong>proteção de iniciante</strong> e os jogadores em game over são poupados.</li>
                <li><strong>Todos os campos de ruínas de batalha do universo são devorados</strong> pelos Cthulhu; os <strong>asteroides</strong>, por sua vez, permanecem intactos.</li>
                <li>O <strong>cofre de bitcoin de cada aliança</strong> que tenha pelo menos um jogador humano também perde metade do conteúdo: depositar seu Bitcoin no cofre antes do prazo não protege de nada. O desconto aparece no histórico do cofre.</li>
                <li>As <strong>3 últimas alianças do ranking</strong> perdem além disso produção por 72 horas (veja abaixo).</li>
            </ul>
            <p>O dízimo é descontado antes do pagamento das recompensas: o que você ganha combatendo as hordas não é reduzido. Cada jogador atingido recebe um relatório detalhando o Bitcoin perdido.</p>

            <h2 id="classificacao">O ranking das alianças</h2>
            <p>Durante o bloqueio, cada aliança é classificada pelo que faz contra a colmeia. A <strong>página Cthulhu</strong> exibe o ranking ao vivo, com o que sua aliança ganharia ou perderia se o bloqueio terminasse agora.</p>
            <ul>
                <li><strong>Pontos</strong>: os danos infligidos a uma <strong>frota-muro</strong> do bloqueio contam em dobro; os danos infligidos à colmeia em outro lugar (cercos de bases, hordas) contam simples; cada <strong>vitória no Tower Defense</strong> vale tanto quanto destruir um quarto de frota-muro de asteroide.</li>
                <li><strong>Pontos por membro</strong>: a pontuação é dividida pelo número de membros ativos (conectados nos últimos 7 dias, fora da proteção de iniciante). Os danos de um iniciante contam mesmo assim: recrutar nunca faz a pontuação cair.</li>
                <li><strong>Filiação congelada</strong> no início do bloqueio: mudar de aliança durante o evento não desloca nem os pontos, nem o bônus, nem a penalidade.</li>
                <li>São necessários pelo menos <strong>2 membros ativos</strong> para ser classificada. Os <strong>jogadores sem aliança</strong> nunca são afetados.</li>
            </ul>
            <p><strong>Bloqueio rompido</strong>: as 3 primeiras alianças ganham <strong>+15&nbsp;%, +10&nbsp;% e +5&nbsp;% de produção</strong> por 72 horas, desde que tenham marcado pontos. Nenhuma aliança é penalizada.</p>
            <p><strong>Bloqueio sofrido</strong>: as 3 últimas alianças perdem <strong>15&nbsp;%, 10&nbsp;% e 5&nbsp;% de produção</strong> por 72 horas, além do dízimo. Nunca mais da metade das alianças classificadas é atingida. Uma aliança que forneceu o esforço mínimo é poupada, mesmo em último: o equivalente a meia frota-muro de asteroide destruída, ou a duas vitórias no Tower Defense, por membro ativo.</p>
            <p>Cada membro recebe um relatório que explica o bônus ou a penalidade da sua aliança e sua data de término.</p>

            <h2 id="na-pratica">Na prática</h2>
            <ul>
                <li>Acompanhe o indicador <strong>« Ameaca do universo »</strong> da página Cthulhu: a 100 pontos por dia, ele diz quantos dias faltam até o limite de 700.</li>
                <li>Assim que uma <strong>profecia</strong> for anunciada, avise sua aliança: você tem <strong>48 horas</strong> para se organizar antes que o bloqueio caia.</li>
                <li>Concentre os assaltos nas mesmas hordas em vez de dispersá-los: os danos persistem, vale mais acabar com uma do que arranhar várias.</li>
                <li>Até um assalto perdido rende alguma coisa: não espere ter certeza de vencer para atacar.</li>
                <li>Frota insuficiente para atacar uma horda? Uma <strong>vitória no Tower Defense</strong> durante o bloqueio também rende pontos à sua aliança.</li>
            </ul>

    notifications:
        title: "Notificações push"
        category: "beginner"
        order: 10
        tags: "notificacao,push,alerta,celular,android,navegador,preferencia,sino"
        summary: "Receba um alerta no aplicativo Android ou no seu navegador assim que um evento importante acontecer no seu império."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principio">Para que serve?</h2>
            <p>Area Universe é jogado continuamente: frotas inimigas podem chegar enquanto você está no trabalho. As <strong>notificações push</strong> alertam você em tempo real no seu celular ou no seu navegador, para que você possa reagir a tempo.</p>

            <h2 id="eventos">O que você pode receber</h2>
            <p>Na página Notificações, os tipos estão organizados em cinco grupos:</p>
            <ul>
                <li><strong>Produção e Pesquisa</strong> — Pesquisa concluída; Edifício concluído (sua fila de construção está vazia); Produção concluída (sua fila de naves ou de defesas está vazia).</li>
                <li><strong>Frotas</strong> — Frota chegou ao destino; Frota em combate (uma das suas frotas está engajada em um combate); Frota inimiga se aproximando (uma frota hostil acaba de ser lançada contra um dos seus planetas).</li>
                <li><strong>Planetas</strong> — Planeta sob ataque (uma frota chega para saquear ou invadir); Planeta sob embargo; Ataque nuclear recebido; Ataque de Cthulhu; Espionagem detectada.</li>
                <li><strong>Aliança</strong> — Aliança em guerra; Mensagem de aliança.</li>
                <li><strong>Pessoal</strong> — Nova mensagem privada; Herói capturado; Herói libertado.</li>
            </ul>
            <p>Cada tipo é ativado ou desligado <strong>individualmente</strong>. Dois alertas não têm interruptor próprio: <strong>Planeta capturado</strong> é sempre enviado, e o lembrete <strong>Bônus de conexão disponível</strong> (uma vez por dia no máximo) só é desligado com <em>Desativar tudo</em>.</p>
            <p>«&nbsp;Frota inimiga se aproximando&nbsp;» ignora as frotas da sua aliança e as de uma aliança com a qual você tem uma aliança defensiva, um pacto de não agressão ou um acordo de paz.</p>

            <h2 id="ativacao">Como ativá-las</h2>
            <ol>
                <li>Abra a página <strong>Notificações</strong>: ícone de sino embaixo do menu no computador; botão <strong>Menu</strong> e depois <strong>Notificações</strong> no celular.</li>
                <li>Em um navegador, clique em <strong>Ativar notificações</strong> (quadro «&nbsp;Notificações do navegador&nbsp;»); no aplicativo Android, em <strong>Ativar as notificações</strong> da seção «&nbsp;Notificações deste aparelho&nbsp;».</li>
                <li>Aceite o pedido de autorização do navegador ou do celular.</li>
                <li>Mais abaixo, desmarque os tipos que você não quer receber: todos vêm ativados no início.</li>
            </ol>
            <p>Um botão <em>Desativar tudo</em> desliga o conjunto com um clique. Suas escolhas por tipo valem para o servidor em que você joga, em todos os seus aparelhos.</p>
            <p>Em um navegador, a opção <strong>Som de notificação</strong> toca também um som quando chega algo novo enquanto a aba está em segundo plano. Uma faixa também pode propor que você ative as notificações: <strong>Ativar</strong> ou <strong>Não, obrigado</strong>.</p>

            <h2 id="compatibilidade">Onde funciona</h2>
            <ul>
                <li><strong>Aplicativo Android</strong> (Google Play): é o único aplicativo; não existe nenhum para iPhone nem iPad.</li>
                <li><strong>Navegador no computador</strong>: Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone e iPad</strong>: o jogo é jogado no navegador.</li>
                <li><strong>Vários aparelhos</strong>: cada aparelho em que você ativou as notificações as recebe; se você as ativou no seu celular e no seu computador, os dois tocam.</li>
            </ul>

            <h2 id="solucao-problemas">O navegador recusa a inscrição?</h2>
            <p>Se o seu navegador bloquear o serviço de notificações, a própria página Notificações mostra o passo a passo e um botão <strong>Tentar novamente</strong>.</p>
            <p>No <strong>Brave</strong>, o serviço push do Google vem desativado por padrão. Abra <code>brave://settings/privacy</code>, ative <strong>«&nbsp;Usar serviços do Google para mensagens push&nbsp;»</strong> e depois reinicie completamente o navegador. Nos outros navegadores, verifique se uma VPN, um antivírus ou um DNS de filtragem não está bloqueando o serviço de notificações.</p>

            <h2 id="celular">No aplicativo móvel</h2>
            <p>No aplicativo Android, a página <strong>Notificações</strong> traz uma seção «&nbsp;Notificações deste aparelho&nbsp;»: ative ou desative a qualquer momento as notificações push do celular. Se estiverem bloqueadas, o botão <strong>Abrir as configurações</strong> leva você direto às configurações do celular. Suas escolhas por tipo de notificação valem para todos os seus aparelhos, no servidor em que você joga.</p>

    glossary:
        title: "Glossário"
        category: "beginner"
        order: 11
        tags: "glossario,termos,definicoes,vocabulario,abreviacoes"
        summary: "Todos os termos e abreviações do jogo, explicados em uma frase."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Todos os termos do jogo</h2>
            <table>
                <tr><th>Termo</th><th>Definição</th></tr>
                <tr><td><strong>Aliança</strong></td><td>Grupo de jogadores. Fazer parte de uma aumenta em 20&nbsp;% a produção de niobium, de água e de rações dos seus planetas.</td></tr>
                <tr><td><strong>Barcaça</strong></td><td>Nave de desembarque de Legionários para raids e invasões.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Moeda principal do jogo. Gerada pelos seus trabalhadores.</td></tr>
                <tr><td><strong>Bloco</strong></td><td>Agrupamento automático de frotas aliadas durante um combate espacial.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Campo De Recursos: os detritos deixados depois de um combate, recicláveis.</td></tr>
                <tr><td><strong>Ciclo</strong></td><td>Ritmo interno de produção. 10 min para um planeta, 1 min para uma lua.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>As criaturas hostis (ex-"zumbis"). Aparecem no modo PvE e nos planetas aliens.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Nível de alerta de aliança, de 0 (sem alerta) a 5 (alerta máximo): quanto maior o número, mais tensa a situação.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Cerco a um planeta por uma frota inimiga em órbita. Provoca fome.</td></tr>
                <tr><td><strong>Estaleiro espacial</strong></td><td>Edifício que permite fabricar naves.</td></tr>
                <tr><td><strong>Forte defensivo</strong> (Bunker)</td><td>Edifício defensivo: aumenta a capacidade de Legionários, permite construir Mechas e protege das pilhagens, por nível, 5&nbsp;% da sua capacidade de armazenamento de niobium e de água (e 5&nbsp;% do seu urânio).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Fim de partida: falência econômica ou perda de todos os seus planetas.</td></tr>
                <tr><td><strong>Game Over econômico</strong></td><td>Seu saldo de Bitcoins ficou negativo depois do relatório diário.</td></tr>
                <tr><td><strong>Herói</strong></td><td>Seu personagem principal (você também pode ter heróis secundários). Ele evolui, combate e pode ser capturado.</td></tr>
                <tr><td><strong>Lunar</strong> (às vezes chamado de Moon Maker)</td><td>Nave que cria uma lua em uma vaga vazia que contenha pelo menos 2 milhões de niobium e 2 milhões de água em detritos.</td></tr>
                <tr><td><strong>Manutenção</strong></td><td>Custo diário em Bitcoins das suas tropas, naves e edifícios.</td></tr>
                <tr><td><strong>Mercador</strong></td><td>NPC no mapa que compra seus recursos em troca de Bitcoins (e alguns Pontos de Guerra).</td></tr>
                <tr><td><strong>Nave mãe</strong></td><td>Nave capitânia paga principalmente em PDG: ela traz à sua frota 20&nbsp;000 de casco e 5&nbsp;000 de escudo, +5&nbsp;% de casco e de escudo, +10&nbsp;% de precisão e −10&nbsp;% de assinatura. Tão lenta quanto uma nave de batalha, ela atrasa uma frota de caçadores ou de corvetas.</td></tr>
                <tr><td><strong>Nível</strong></td><td>De 2 a 40, sobe com a sua experiência, que cresce com a sua pontuação; nunca volta a descer. Ele define o piso do bônus de conexão.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Personagem Não Jogador: mercadores, aliens, Cthulhu, bots de IA.</td></tr>
                <tr><td><strong>Objetivos</strong></td><td>As 3 missões diárias, renovadas a cada relatório diário e pagas em PDG. Página de mesmo nome no menu.</td></tr>
                <tr><td><strong>PDG</strong></td><td>Pontos De Guerra. Ganhos sobretudo em combate (e pelos objetivos diários, a arena, a prisão, a venda aos mercadores). São gastos na página Objetivos (Bitcoins, Legionários, trabalhadores), em naves de elite, na Cidade flutuante, na Estação orbital e na pesquisa Expansão territorial.</td></tr>
                <tr><td><strong>Piloto automático</strong></td><td>Modo mudo que assume uma conta registrada ausente há 8 dias: ele prossegue com construções e pesquisas, não move nenhuma frota e devolve o controle a você assim que você voltar.</td></tr>
                <tr><td><strong>Planeta ativo</strong></td><td>O planeta atualmente selecionado. Todas as suas ações se aplicam a ele.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Ataque terrestre para saquear os recursos de um planeta (não para conquistá-lo).</td></tr>
                <tr><td><strong>Reciclador</strong></td><td>Nave que recolhe os detritos (CDR): a reciclagem começa sozinha quando uma frota com recicladores chega a um campo de detritos.</td></tr>
                <tr><td><strong>Relatório diário</strong></td><td>Balanço diário calculado às 18h59 (hora de Paris): receitas, custos, saldo, atualização dos pontos e do ranking, novos objetivos do dia.</td></tr>
                <tr><td><strong>Round</strong></td><td>Turno de combate. Máx. 100 no combate espacial, máx. 10 no combate em solo.</td></tr>
                <tr><td><strong>Assinatura</strong> (térmica)</td><td>Ordem de grandeza da massa de uma frota, sem revelar sua composição. Quanto maior, mais combustível um voo custa (pago em Bitcoins); ela serve também para calcular seus pontos e os Pontos de Guerra ganhos em combate.</td></tr>
                <tr><td><strong>Sonda</strong></td><td>Pequena nave de espionagem. Envie-a antes de qualquer ataque.</td></tr>
                <tr><td><strong>Terraformação</strong></td><td>Pesquisa que define o número máximo de planetas que você pode possuir: seu nível + 2 (mais os bônus de regime da sua aliança), até o nível 18. O nível 1 desbloqueia o colonizador, o nível 15 o Lunar. Para ampliar um planeta, construa uma Cidade flutuante ou uma Estação orbital (pesquisa Expansão territorial).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Minijogo de defesa ativa contra as hordas Cthulhu.</td></tr>
                <tr><td><strong>Trabalhador</strong></td><td>Unidade de população. Produz Bitcoins todos os dias. Defende em invasão.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Percurso guiado e recompensado (até 18 etapas em 5 capítulos, conforme o caminho escolhido). É iniciado ou retomado pela página Preferências, seção Tutorial.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Jogador designado como alvo prioritário no modo Pesquisa &amp; Destruição.</td></tr>
            </table>

    account_deletion:
        title: "Excluir a minha conta e os meus dados"
        category: "beginner"
        order: 99
        tags: "exclusao,conta,dados,rgpd,privacidade,excluir"
        summary: "Como excluir definitivamente sua conta e seus dados pessoais, e o que o jogo conserva."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Onde fazer o pedido</h2>
            <p>No jogo, abra <strong>Preferências</strong>: bem embaixo, a <strong>Zona de perigo</strong> oferece o botão <strong>Excluir a minha conta</strong>.</p>
            <p>Você também pode passar pela página pública <strong>/suppression-donnees</strong> (link « Exclusão de conta e dados » do Regulamento). Ela resume o que é excluído e o que é conservado; é preciso então fazer login para fazer o pedido.</p>
            <p>Para confirmar, digite exatamente a palavra <strong>EXCLUIR</strong> e depois toque em <strong>Excluir definitivamente a minha conta</strong>. A exclusão é <strong>imediata</strong> e vale para sua conta em <strong>todos os servidores</strong>.</p>

            <h2 id="irreversible">Um abandono de conta definitivo</h2>
            <p><strong>Atenção: é um abandono definitivo de conta.</strong> Seus dados pessoais são excluídos ou anonimizados imediatamente:</p>
            <ul>
                <li>e-mail, senha e apelido;</li>
                <li>identificadores Google, Discord ou LinkedIn, vínculo Google Play Games e endereço de carteira;</li>
                <li>endereço IP, impressão técnica e fuso horário;</li>
                <li>sessões, tokens de login e tokens de notificação;</li>
                <li>mensagens privadas, enviadas e recebidas;</li>
                <li>inscrições na newsletter e nas notificações.</li>
            </ul>
            <p>Suas conquistas são apagadas. Você nunca mais poderá entrar com essa conta, e nenhuma função do jogo permite recuperá-la: para jogar de novo, será preciso criar uma nova conta e recomeçar do zero.</p>
            <p>Nenhuma compra em andamento é reembolsada.</p>

            <h2 id="conserve">O que é conservado, e por quê</h2>
            <p>Para preservar o equilíbrio do jogo, seus comandantes, planetas e frotas continuam existindo, confiados a um bot mudo. Seus comandantes, seus heróis e seus planetas são renomeados « Bot- » seguido de um número, sem nenhum vínculo com a sua identidade; esse nome também substitui o seu nos rankings e nos arquivos dos servidores encerrados.</p>
            <p>As mensagens públicas escritas nas salas são conservadas e passam a aparecer sob esse nome « Bot-… ».</p>
            <p>O histórico de pagamento é conservado (obrigação legal contábil), também dissociado da sua identidade.</p>

    achievements:
        title: "Conquistas"
        category: "progression"
        order: 11
        tags: "conquistas,achievements,trofeus,google play,play games,progressao"
        summary: "15 conquistas de conta, dos primeiros passos aos feitos de carreira, no seu perfil e no Google Play Games."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">O princípio</h2>
            <p>As <strong>conquistas</strong> recompensam o que você realiza com sua conta, <strong>em todos os servidores somados</strong>. Uma vez desbloqueada, uma conquista é sua para sempre, mesmo que você perca depois o planeta ou saia da aliança que lhe rendeu a conquista.</p>
            <p>Encontre-as no seu <strong>perfil entre servidores</strong> (menu « Meu perfil entre servidores »), com seu progresso e a data de cada desbloqueio. O perfil de outro jogador mostra as dele. As que seu histórico já mereceu são desbloqueadas automaticamente.</p>
            <h2 id="liste">As 15 conquistas</h2>
            <table>
            <tr><th>Conquista</th><th>Condição</th><th>Pontos</th></tr>
            <tr><td>Comandante</td><td>Concluir o tutorial seguindo-o (pulá-lo com « Descubro sozinho » não conta)</td><td>20</td></tr>
            <tr><td>Construtor</td><td>Concluir uma primeira construção</td><td>20</td></tr>
            <tr><td>Sábio</td><td>Concluir uma primeira pesquisa</td><td>20</td></tr>
            <tr><td>Colono</td><td>Possuir 2 planetas</td><td>20</td></tr>
            <tr><td>Aliado</td><td>Entrar em uma aliança ou fundar uma</td><td>20</td></tr>
            <tr><td>Veterano I, II, III</td><td>Travar 10, 100 e depois 1.000 batalhas espaciais</td><td>25, 50, 100</td></tr>
            <tr><td>Conquistador I, II</td><td>Ter sucesso em 10 e depois 100 invasões</td><td>50, 100</td></tr>
            <tr><td>Carcereiro</td><td>Capturar um herói inimigo</td><td>50</td></tr>
            <tr><td>Caçador de Cthulhu</td><td>Vencer uma partida do Tower Defense</td><td>50</td></tr>
            <tr><td>Elite</td><td>Terminar no top 10 de um servidor</td><td>100</td></tr>
            <tr><td>Imperador</td><td>Vencer um servidor</td><td>200</td></tr>
            <tr><td>Uma conquista oculta</td><td>A descobrir jogando</td><td>50</td></tr>
            </table>
            <p>« Sábio » não pode ser ganha nos servidores em que todas as pesquisas estão desbloqueadas desde o início. Uma lua conta como um planeta para « Colono ».</p>

            <h2 id="progression">O progresso</h2>
            <p>As conquistas de batalhas e de invasões avançam por patamares, e seu perfil exibe o contador (por exemplo 37 / 100). Todas as batalhas espaciais travadas contam, ganhas ou perdidas, inclusive a destruição de uma frota sem armas (cargueiros, recicladores, sondas), para os dois lados; as invasões contam quando têm sucesso (os raids não contam). Elite e Imperador são decididas no fim de um servidor.</p>
            <h2 id="google-play">Google Play Games (Android)</h2>
            <p>No aplicativo Android, suas conquistas também aparecem no <strong>Google Play Games</strong>, com o banner « Conquista desbloqueada ».</p>
            <ul>
            <li><strong>Conta de teste</strong> criada no aplicativo: ela é vinculada automaticamente ao seu perfil Google Play Games. Ela deixa então de ser excluída após 7 dias sem jogar, e se reabre sozinha após uma reinstalação ou em um novo celular.</li>
            <li><strong>Conta cadastrada</strong>: no aplicativo Android, abra seu perfil entre servidores (menu « Meu perfil entre servidores ») e toque em « Vincular esta conta » no cartão « Google Play Games ». Ela se abrirá em seguida sem senha com esse perfil Google Play Games: só faça isso no seu próprio aparelho. Você pode desvinculá-la a qualquer momento pelo mesmo cartão, no site como no aplicativo.</li>
            <li>O botão <strong>« Play Games »</strong> da tela de login reabre a conta vinculada. Sair da conta desliga a abertura automática nesse aparelho: é então esse botão que reabre a conta.</li>
            </ul>
            <p>Um perfil Google Play Games só se vincula a uma única conta Area, e uma conta a um único perfil. Vincular sua conta pelo seu perfil toma o perfil Google Play Games da outra conta à qual ele estava vinculado, se houvesse uma.</p>
    faq:
        title: "Perguntas frequentes: conta, aparelhos e ajuda"
        category: "beginner"
        order: 13
        tags: "faq,conta,varios servidores,multiconta,offline,android,iphone,console,idioma,espanhol,apelido,contato,suporte,bug,compra,reembolso,exclusao,relatorios"
        summary: "Vários servidores, jogo offline, aparelhos, idiomas, apelido, contato, bugs, compras: as respostas às perguntas práticas."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Jogar em vários servidores</h2>
            <p>Sim. Sua conta acompanha você em todos os servidores. Em cada servidor em que você entra, você tem um <strong>comandante distinto</strong>, com seu próprio apelido, seus planetas, seus heróis, seus Bitcoins, sua aliança e seu ranking: nada passa de um servidor para outro.</p>
            <p>Você pode jogar em vários servidores ao mesmo tempo e passar de um para outro pela entrada <strong>Servidor</strong> do menu: os servidores em que você já joga abrem diretamente.</p>
            <p>O que é comum a todos os seus servidores: seu <strong>perfil entre servidores</strong> (menu « Meu perfil entre servidores »), que acumula sua carreira e suas conquistas, seu idioma e sua lista de jogadores bloqueados.</p>
            <p>Várias contas em um mesmo servidor: o Regulamento (seção « Contas multiplas ») as autoriza desde que sejam declaradas por e-mail a <strong>support@areauniverse.com</strong>. Essas contas não devem interagir diretamente entre si, nem por intermédio de um terceiro. Compartilhar seus dados de login com outra pessoa é proibido.</p>

            <h2 id="hors-ligne">Jogar offline</h2>
            <p>Não: o Area Universe se joga online e exige uma conexão com a Internet, no aplicativo como no navegador. Se a conexão cair, o jogo exibe « Reconectando… » e retoma assim que ela volta.</p>
            <p>Em compensação, a partida continua sem você: seus planetas produzem até o limite de armazenamento, suas construções, pesquisas e frotas avançam… e seus adversários podem atacar você. Ative as <a href="/wiki/notifications">notificações push</a> para ser avisado.</p>
            <ul>
                <li>Após <strong>8 dias</strong> sem conexão, seu comandante passa para o <a href="/wiki/ia_bots">piloto automático</a>.</li>
                <li>Uma <strong>conta de teste</strong> (criada com « Testar sem email ») é excluída após <strong>7 dias</strong> sem jogar, a menos que esteja vinculada ao Google Play Games no aplicativo Android. Para mantê-la, valide-a pela entrada <strong>Validar conta</strong> do menu.</li>
            </ul>

            <h2 id="plateformes">Em quais aparelhos jogar?</h2>
            <ul>
                <li><strong>Computador</strong>: em um navegador recente (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong>: no aplicativo Area Universe do Google Play. Um navegador Android é redirecionado ao Google Play quando quer entrar no jogo. O aplicativo se joga na horizontal.</li>
                <li><strong>iPhone e iPad</strong>: não existe aplicativo; jogue no navegador.</li>
                <li><strong>Consoles</strong> (PlayStation, Xbox, Switch…): não existe nenhuma versão para console.</li>
            </ul>
            <p>Sua conta é a mesma em todo lugar: faça login com os mesmos dados para reencontrar sua partida em outro aparelho.</p>

            <h2 id="langues">Idiomas disponíveis</h2>
            <p>O jogo existe em <strong>seis idiomas</strong>: francês, inglês, alemão, espanhol, português e russo. Este wiki também.</p>
            <p>Para mudar de idioma: no computador, toque na bandeira na parte de baixo do menu; no celular, abra o botão <strong>Menu</strong> e escolha uma bandeira na linha <strong>Idioma</strong>. Sua escolha é salva na sua conta: suas notificações push também chegam nesse idioma.</p>

            <h2 id="pseudo">Mudar de apelido</h2>
            <p>Seu apelido é o do seu comandante: ele é <strong>próprio de cada servidor</strong>. Para mudá-lo, abra <strong>Preferências</strong>, seção <strong>Identidade</strong>, campo <strong>Apelido</strong> (3 a 15 caracteres; a primeira letra vira maiúscula) e depois <strong>Salvar</strong>. A mudança é imediata e possível a qualquer momento, desde que esse apelido não esteja já em uso no servidor. É preciso ter criado seu herói para poder salvar.</p>
            <p>Seu identificador de login, por sua vez, é seu endereço de e-mail. Ele se muda em <strong>Opcoes</strong> (página « Minhas opcoes », Alterar o email): um link de confirmação é enviado ao novo endereço, e o antigo continua ativo enquanto você não clicar nele. A senha se muda no mesmo lugar.</p>

            <h2 id="contact">Entrar em contato com a equipe</h2>
            <ul>
                <li><strong>Por e-mail</strong>: <strong>support@areauniverse.com</strong>, para uma dúvida de conta, de pagamento ou de dados pessoais.</li>
                <li><strong>No Discord</strong>: o servidor comunitário do Area Universe (discord.gg/bpwWyS8), cujo link fica no rodapé das páginas do site, ao lado de Facebook, Telegram e LinkedIn.</li>
                <li><strong>Para um bug</strong>: use de preferência o botão <strong>Erro</strong> do jogo (veja abaixo); seu relatório chega diretamente à equipe, com a página em que você estava.</li>
            </ul>

            <h2 id="bug">Reportar um bug</h2>
            <p>Toque no botão <strong>Erro</strong> (ícone de inseto): na parte de baixo do menu no computador; no celular, botão <strong>Menu</strong> e depois <strong>Erro</strong>. Na janela <strong>Reportar um erro</strong>:</p>
            <ol>
                <li>descreva o que aconteceu e o que você estava fazendo (2.000 caracteres no máximo);</li>
                <li>anexe se possível uma imagem (JPEG, PNG ou WebP, 5&nbsp;MB no máximo); no aplicativo, o botão <strong>Capturar ecrã</strong> faz isso por você;</li>
                <li>toque em <strong>Enviar</strong>.</li>
            </ol>
            <p>A página em que você estava e o tipo de aparelho são anexados automaticamente. Você pode enviar até 10 relatórios por dia. Para um jogador que trapaceia ou insulta, use de preferência a <a href="/wiki/moderation_blocking">denúncia</a>.</p>

            <h2 id="achats">Compras e reembolsos</h2>
            <p>O jogo é gratuito. A única compra oferecida hoje é o acesso a um <strong>Servidor pago</strong> (servidor competitivo pago): <strong>5&nbsp;€</strong>, pagos uma única vez por servidor, por cartão bancário, antes de entrar nele; é preciso uma conta validada. Os <strong>Bitcoins</strong> do jogo não se compram com dinheiro real: só se ganham jogando. As notificações push são gratuitas.</p>
            <p>Para um problema de pagamento (pagamento cobrado mas acesso não liberado, pedido de reembolso), escreva a <strong>support@areauniverse.com</strong> informando o endereço de e-mail da sua conta, o servidor em questão e a data do pagamento. Os termos de uso preveem que nenhum reembolso é concedido depois de usado o serviço pago, exceto direito de arrependimento ou caso excepcional examinado pelo suporte. Excluir sua conta não reembolsa nenhuma compra em andamento.</p>

            <h2 id="compte-supprime">Recuperar uma conta excluída</h2>
            <p>Nenhuma função do jogo permite recuperar uma conta excluída: a <a href="/wiki/account_deletion">exclusão de conta</a> é definitiva e seus dados pessoais são apagados na hora. Para jogar de novo, crie uma nova conta. Se você acha que houve um erro, escreva a <strong>support@areauniverse.com</strong>.</p>
            <p>Uma conta de teste excluída por não ter jogado por 7 dias também não se recupera.</p>
            <p>Apenas esqueceu a senha? Na tela de login, toque no ícone de chave (<strong>Senha esquecida</strong>) e digite seu endereço de e-mail: um link de redefinição é enviado a você.</p>

            <h2 id="rapports">Excluir ou arquivar relatórios</h2>
            <p>Na página <strong>Relatório</strong>, abra um relatório e toque em <strong>Excluir</strong>: ele desaparece na hora, sem confirmação nem lixeira. A exclusão é feita um relatório por vez; não há arquivamento nem exclusão em massa. Para limpar os não lidos, <strong>Marcar tudo como lido</strong> trata todos os seus relatórios de uma vez. Os relatórios não se apagam sozinhos com o tempo.</p>
            <p>As mensagens privadas da <strong>Mensagens</strong>, por sua vez, não podem ser excluídas.</p>

