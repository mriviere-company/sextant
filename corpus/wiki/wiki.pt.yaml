articles:
    moderation_blocking:
        title: "Moderação: denunciar e bloquear"
        category: "beginner"
        order: 12
        tags: "moderacao,denuncia,bloqueio,chat,mensagens,termos,sancao"
        summary: "Denuncie uma mensagem abusiva, bloqueie um jogador indesejável, veja o que a moderação faz e reencontre as regras que cada um aceita no primeiro login."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="termos">Termos de uso</h2>
            <p>No primeiro login, cada jogador aceita os <strong>termos de uso</strong> e as regras da comunidade: respeito aos outros jogadores (sem assédio, insultos nem discurso de ódio), nenhum conteúdo ilegal, obsceno ou difamatório nas salas, nas mensagens e nos nomes, nada de trapaça, multiconta abusiva nem exploração de bugs. Recusar desconecta você. Se os termos evoluírem, eles deverão ser aceitos novamente.</p>

            <h2 id="denunciar">Denunciar uma mensagem</h2>
            <p>Cada mensagem de outro jogador nas salas, e cada mensagem privada recebida (exceto as enviadas anonimamente), traz um ícone de <strong>bandeira</strong>. Um clique abre a escolha do motivo: <strong>Insultos / Assédio</strong>, <strong>Spam</strong> ou <strong>Outro conteúdo inapropriado</strong>. A denúncia vai para a equipe de moderação, com uma cópia da mensagem.</p>
            <p>Um jogador também pode ser denunciado pelo perfil dele, botão <strong>Denunciar</strong>: Multiconta, Insultos / Assédio, Batota, Spam ou Outro.</p>
            <p>Limites: <strong>três denúncias por dia</strong> (o contador reinicia à meia-noite, hora de Paris) e <strong>uma única denúncia por jogador, definitivamente</strong>, seja por uma bandeira ou pelo perfil dele. Além disso, o jogo exibe « Já denunciaste este jogador ou atingiste o limite diário ».</p>

            <h2 id="moderation">O que a moderação faz</h2>
            <p>Uma denúncia não dispara nenhuma sanção automática: cada uma é examinada pela equipe de moderação, que também vê quem a enviou. Multiplicar as denúncias contra um jogador não basta, portanto, para fazê-lo ser sancionado, e uma denúncia abusiva não tem nenhum efeito direto sobre a pessoa visada.</p>
            <p>Conforme a gravidade, a moderação pode proibir um jogador, por um tempo determinado, de escrever nas salas e por mensagem privada, ou banir a conta dele.</p>

            <h2 id="bloquear">Bloquear um jogador</h2>
            <p>O botão <strong>Bloquear</strong> do perfil de um jogador oculta imediatamente todas as mensagens dele nas salas de conversa e impede qualquer troca de mensagens privadas, nos dois sentidos. O bloqueio visa a conta dele: vale em todos os servidores em que você o encontra.</p>
            <p>A lista de jogadores bloqueados é gerenciada em <strong>Opcoes</strong> (seção « Jogadores bloqueados »): cada jogador pode ser desbloqueado ali a qualquer momento com o botão <strong>Desbloquear</strong>.</p>
    getting_started:
        title: "Primeiros passos"
        category: "beginner"
        order: 1
        tags: "inicio,comecar,novo,tutorial,guia"
        summary: "Bem-vindo! O guia mais curto para entender Area Universe e aproveitar bem as suas primeiras horas de jogo."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="o-que-e">O que é Area Universe?</h2>
            <p>Area Universe é um jogo de <strong>estratégia espacial multijogador</strong>. Você dirige um império: seus planetas produzem recursos, suas naves percorrem a galáxia e suas alianças selam o destino dos jogadores.</p>
            <p>É um jogo <strong>que se joga a longo prazo</strong>: seus recursos se acumulam mesmo quando você está offline. Alguns minutos por dia bastam para progredir.</p>

            <h2 id="objetivo">Seu objetivo</h2>
            <p>Dependendo do modo de servidor escolhido (veja o artigo <em>Modos de jogo</em>), o objetivo final varia: resistir o máximo possível, dominar o ranking, ser o último de pé etc. Mas a receita é sempre a mesma:</p>
            <ol>
                <li><strong>Fazer uma economia girar</strong> (recursos + moeda).</li>
                <li><strong>Construir uma frota e uma defesa</strong>.</li>
                <li><strong>Aliar-se</strong> para ter mais peso em grupo.</li>
            </ol>

            <h2 id="primeiras-acoes">Suas 6 primeiras ações</h2>
            <p>Seu planeta inicial não está vazio: ele já possui uma Mina de niobium e um Extrator de água de nível 3, um Estaleiro espacial, um Radar terrestre e uma pequena frota em solo (10 sondas, 5 caçadores, 2 fragatas e 1 colonizador).</p>
            <ol>
                <li><strong>Melhore sua Mina de niobium e seu Extrator de água</strong> (página <em>Infraestruturas</em>).</li>
                <li><strong>Adicione um Campo agrícola</strong>: seus trabalhadores comem rações (a comida do jogo).</li>
                <li><strong>Pesquise Redefinição urbana e depois construa uma Grande cidade</strong>: +25&nbsp;000 trabalhadores no máximo por nível. Os trabalhadores são seus fornecedores de <em>Bitcoins</em> (a moeda do jogo).</li>
                <li><strong>Construa um Centro de pesquisa</strong>: ele abriga seus cientistas, que aumentam sua velocidade de pesquisa por patamares (veja <em>Trabalhadores e cientistas</em>).</li>
                <li><strong>Envie cargueiros para vender seus excedentes</strong> de niobium e de água a um mercador: no <em>Mapa espacial</em>, clique no mercador, depois em <em>Interação</em>, escolha sua frota de cargueiros e a missão <em>Descarregar e voltar</em>. O Cargo I exige a pesquisa <em>Gestão de cargas</em>.</li>
                <li><strong>Entre em uma aliança</strong>: <strong>+20&nbsp;%</strong> na produção de niobium, de água e de rações de todos os seus planetas, e acesso às pesquisas de aliança.</li>
            </ol>
            <p>Pense também em <strong>colonizar um 2º planeta</strong> com seu colonizador inicial: nenhuma pesquisa é necessária (veja o artigo <em>Colonizar um novo planeta</em>).</p>

            <h2 id="tutorial">O tutorial integrado</h2>
            <p>Um <strong>tutorial interativo</strong> guia você passo a passo, em 5 capítulos: Primeiros passos, Poder militar, Explorar e conquistar, Desenvolver a economia, Diplomacia e comunidade. Na sua primeira conexão, você escolhe seu caminho:</p>
            <table>
                <thead>
                    <tr><th>Caminho</th><th>Etapas</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Descoberta completa</strong></td><td>18</td></tr>
                    <tr><td><strong>Caminho equilibrado</strong></td><td>17 (sem o lembrete sobre o clique em um planeta)</td></tr>
                    <tr><td><strong>Direto ao núcleo</strong></td><td>8 (apenas o que é específico de Area Universe)</td></tr>
                    <tr><td><strong>Descubro sozinho</strong></td><td>nenhuma</td></tr>
                </tbody>
            </table>
            <p>As etapas, capítulo por capítulo (* = etapas do percurso <em>Direto ao núcleo</em>):</p>
            <ol>
                <li><strong>Primeiros passos</strong>: Seus recursos*, Proteção para iniciantes*, Seu Império*.</li>
                <li><strong>Poder militar</strong>: Criar uma frota, Produzir naves, Melhorar suas naves*, Descobrir a arena*, Organizar frotas em coortes.</li>
                <li><strong>Explorar e conquistar</strong>: O mapa espacial, Selecionar um planeta, Interagir com um planeta, Colonizar um planeta, Defender seus planetas.</li>
                <li><strong>Desenvolver a economia</strong>: Construir edifícios, Iniciar uma pesquisa.</li>
                <li><strong>Diplomacia e comunidade</strong>: Entrar em uma aliança*, A Wiki*, O Salão*.</li>
            </ol>
            <p>Alguns modos retiram etapas: a das pesquisas em <em>Pesquisa &amp; Destruição</em> e em <em>Dominação</em>, as das pesquisas e da aliança em <em>Battle Royale</em>. O contador «&nbsp;Etapa X de N&nbsp;» do guia sempre indica o total do seu caminho.</p>
            <p>Cada etapa concluída dá uma recompensa. Qualquer que seja o seu caminho, você recebe no total <strong>232&nbsp;000 Bitcoins, 150 Legionários, 100 trabalhadores, 500 pontos de guerra e 2 caçadores</strong>: o que o seu caminho pula é pago a você como bônus no fim (na hora com <em>Descubro sozinho</em>).</p>
            <ul>
                <li>Você pode sair dele a qualquer momento (<em>Sair do tutorial</em>) e mudar de caminho no meio do percurso; as etapas já feitas continuam valendo.</li>
                <li>Para reiniciá-lo: página <strong>Preferências</strong>, seção <em>Tutorial</em>.</li>
            </ul>

            <h2 id="vigiar">O que vigiar desde o início</h2>
            <ul>
                <li><strong>Bitcoins positivos</strong>: todo dia às <strong>18h59 (hora de Paris)</strong>, ou seja, 17h59 UTC no inverno e 16h59 UTC no verão, um balanço calcula suas receitas e seus custos de manutenção. Se o seu saldo ficar negativo, é o <strong>Game Over econômico</strong>: você perde todas as suas frotas e todas as suas naves, e seu saldo volta para 125&nbsp;000 Bitcoins (você mantém seus planetas e seus edifícios).</li>
                <li><strong>Armazenamento</strong>: se seus depósitos estiverem cheios, a produção para. Construa estoques adequadamente.</li>
                <li><strong>Missões diárias</strong>: 3 missões por dia (página <em>Objetivos</em>), cada uma recompensada em pontos de guerra.</li>
            </ul>

            <h2 id="protection-debutant">A proteção dos iniciantes</h2>
            <p>Durante seus primeiros dias, você está <strong>protegido</strong>: nenhum jogador pode enviar uma frota para os seus planetas. Ninguém pode, portanto, atacar, saquear, invadir, bombardear ou sequer sondar você; um aliado também não pode entregar recursos a você. As frotas que já estão a caminho são mandadas de volta. O suficiente para construir suas primeiras bases com tranquilidade.</p>
            <p>A proteção termina assim que uma destas condições for atingida:</p>
            <ul>
                <li>Passaram-se <strong>7 dias</strong> desde a criação do seu comandante.</li>
                <li>Você possui um <strong>4º planeta</strong> (suas luas não contam).</li>
                <li>Você mesmo envia uma <strong>missão ofensiva</strong> (saque, invasão ou ataque nuclear): você renuncia então imediatamente à sua proteção.</li>
                <li>Você ativa o <strong>modo ataque</strong> de uma de suas frotas.</li>
            </ul>
            <p>Nos dois últimos casos, uma janela de confirmação avisa você antes. Aproveite esse período para montar uma economia e uma defesa sólidas antes de se lançar na batalha.</p>

    interface_guide:
        title: "Entendendo a interface"
        category: "beginner"
        order: 2
        tags: "interface,tela,menu,navegacao,botoes,planeta ativo,barra de recursos,rações,preferencias,opcoes"
        summary: "As 3 zonas da tela e como navegar sem se perder."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="disposicao">As 3 zonas da tela</h2>
            <ul>
                <li><strong>A barra de recursos, no alto</strong> — seus recursos, seus Bitcoins, seus Pontos de Guerra e o nome do seu <strong>planeta ativo</strong>: toque nele para trocar de planeta.</li>
                <li><strong>O menu</strong> — todas as seções do jogo (Visão geral, Herói, Frotas, Planetas, Infraestruturas, Mapa espacial, Aliança, Relatório, Mensagens, Salão…). Sua posição depende da sua tela (veja abaixo).</li>
                <li><strong>A zona central</strong> — o conteúdo da página atual (mapa, lista de frotas, edifícios…). É a única zona que rola.</li>
            </ul>
            <p>A posição do menu depende da sua tela:</p>
            <ul>
                <li><strong>No computador</strong>: o menu completo fica à esquerda. Bem embaixo, uma fileira de ícones abre o relato de erro, o tutorial (se estiver em andamento), as <strong>Notificações</strong>, as <strong>Preferências</strong>, as <strong>Opções</strong> da sua conta, seu <strong>perfil entre servidores</strong> e a escolha do <strong>idioma</strong>.</li>
                <li><strong>No celular na horizontal e no aplicativo Android</strong>: um trilho de ícones fica colado na borda esquerda. Ele mantém permanentemente os cinco destinos principais — Visão geral, Mapa espacial, Infraestruturas, Estaleiro espacial e Defesa — e o botão <strong>Menu</strong> (…), que abre todo o resto em um painel que sobe da parte de baixo.</li>
                <li><strong>No tablet ou no celular segurado na vertical</strong> (em um navegador): esses cinco destinos e o botão <strong>Menu</strong> formam uma barra na parte de baixo da tela.</li>
            </ul>
            <p>O número exibido no botão Menu soma seus novos relatórios, mensagens privadas, mensagens de salão e duelos de arena pendentes.</p>

            <h2 id="barra-recursos">A barra de recursos (no alto)</h2>
            <p>Ela exibe em tempo real os recursos do seu planeta ativo:</p>
            <ul>
                <li><strong>Niobium</strong> — o minério básico (edifícios, naves).</li>
                <li><strong>Água</strong> — indispensável para a construção e para as naves.</li>
                <li><strong>Rações</strong> (a comida) — consumidas pelos seus trabalhadores: 1 ração por hora para 500 trabalhadores. Se chegarem a zero, a fome mata primeiro trabalhadores, depois também Legionários e, por fim, Mechas.</li>
                <li><strong>Urânio</strong> — recurso raro (bombas nucleares, Base nuclear, apostas na arena). Só aparece se o planeta o possuir.</li>
            </ul>
            <p>O niobium, a água, as rações e seus trabalhadores avançam segundo a segundo no ritmo da sua produção, até o seu limite de armazenamento; as rações também podem diminuir se seus trabalhadores comerem mais do que você produz. Toque no niobium, na água ou nas rações para ver a produção por hora, bônus incluídos (herói, campo de escravos, aliança, luas, embargo); para as rações, é o saldo líquido, com o consumo já descontado.</p>
            <p>Os <strong>Bitcoins</strong> (moeda) e os <strong>Pontos de Guerra (PDG)</strong> também aparecem na barra, assim como seus trabalhadores, Legionários, cientistas e Mechas, e o espaço ocupado em solo (<strong>Terreno</strong>) e em órbita (<strong>Espaço</strong>), na forma «&nbsp;ocupado/máximo&nbsp;».</p>
            <p><em>No celular, a barra fica recolhida: ela mostra apenas o niobium, a água, as rações, o urânio, os Bitcoins e os PDG, mais qualquer recurso em alerta (fome, ameaça em órbita). O botão de seta na ponta da barra, que indica o número de recursos ocultos, a expande.</em></p>

            <h2 id="planeta-ativo">Planeta ativo: o que isso significa</h2>
            <p>Quando você tem vários planetas, apenas um fica <strong>ativo</strong> por vez. Todas as suas ações (construir, fabricar uma nave, lançar uma frota) se aplicam a esse planeta.</p>
            <p>Para trocar:</p>
            <ul>
                <li>toque no nome do planeta na barra de recursos: a lista <strong>Meus planetas</strong> se abre (em um painel que sobe da parte de baixo no celular, logo abaixo da barra no computador); escolha um;</li>
                <li>ou use as setas ‹ e › de cada lado do nome para passar ao planeta anterior ou seguinte.</li>
            </ul>
            <p>Você continua na mesma página, exibida para o novo planeta. A ordem da lista é definida em <strong>Preferências</strong>, «&nbsp;Ordenação de planetas&nbsp;»: alfabética, posição, colonização ou tamanho.</p>

            <h2 id="navegacao">Orientar-se rapidamente</h2>
            <ul>
                <li><strong>Visão geral</strong> — seu comandante, suas frotas, suas finanças, a pesquisa em andamento e a atividade de todos os seus planetas.</li>
                <li><strong>Infraestruturas</strong> — construir os edifícios do planeta ativo.</li>
                <li><strong>Estaleiro espacial</strong> e <strong>Defesa</strong> — produzir naves e defesas no planeta ativo.</li>
                <li><strong>Planetas</strong> — a lista de todos os seus planetas e o mercado.</li>
                <li><strong>Frotas</strong> — criar, enviar e acompanhar suas naves.</li>
                <li><strong>Mapa espacial</strong> — explorar a galáxia.</li>
                <li><strong>Relatório</strong> — tudo o que o jogo avisa a você (combates, chegadas, aliança…).</li>
                <li><strong>Mensagens</strong> — suas mensagens privadas; <strong>Salão</strong> — as salas de conversa.</li>
                <li><strong>Aliança</strong> — membros, banco, diplomacia, arena de aliança.</li>
                <li><strong>Preferências</strong> — seu apelido e seus ajustes neste servidor; <strong>Opções</strong> — sua conta (e-mail, senha, fuso horário, jogadores bloqueados).</li>
                <li><strong>Servidor</strong> — trocar de servidor.</li>
            </ul>
            <p>Dependendo do modo do servidor, algumas entradas não aparecem (Pesquisas, Aliança ou Cthulhu).</p>

    resources_intro:
        title: "Os recursos"
        category: "beginner"
        order: 3
        tags: "recursos,niobio,niobium,agua,comida,rações,uranio,producao,armazenamento,ciclo"
        summary: "Os 4 recursos do jogo, como são produzidos e por que o armazenamento é crítico."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="os-4">Os 4 recursos do jogo</h2>
            <table>
                <thead>
                    <tr><th>Recurso</th><th>Para que serve</th><th>Como obtê-lo</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Niobium</strong></td><td>Construir edifícios, naves e defesas</td><td>Mina de niobium</td></tr>
                    <tr><td><strong>Água</strong></td><td>Construir edifícios, naves e defesas</td><td>Extrator de água</td></tr>
                    <tr><td><strong>Comida</strong> («&nbsp;Rações&nbsp;» no jogo)</td><td>Alimentar seus trabalhadores</td><td>Campo agrícola e Fazenda aeropônica (as produções se somam)</td></tr>
                    <tr><td><strong>Urânio</strong></td><td>Base nuclear, bombas nucleares, interceptadores, apostas de arena</td><td>Reciclagem de detritos de urânio, vitórias contra os Cthulhu</td></tr>
                </tbody>
            </table>
            <p>Apenas os <strong>trabalhadores</strong> comem: 1 ração por hora para 500 trabalhadores. Se as rações faltarem, a fome mata trabalhadores e, se durar, também Legionários e Mechas.</p>
            <p>Ao lado desses recursos, o <strong>Bitcoin</strong> é a moeda do jogo: ele paga as pesquisas, os recrutamentos, o combustível das frotas e a manutenção diária (veja <a href="/wiki/bitcoin_economy">Bitcoins e manutenção</a>).</p>

            <h2 id="ciclo">O ciclo de produção</h2>
            <p>Seus recursos chegam automaticamente, de forma contínua. As quantidades produzidas são expressas por <strong>ciclo de produção</strong>, e o jogo credita a você proporcionalmente ao tempo decorrido:</p>
            <ul>
                <li>Em um <strong>planeta</strong>: ciclo de <strong>10 minutos</strong>.</li>
                <li>Em uma <strong>lua</strong>: ciclo de <strong>1 minuto</strong> (10 vezes mais rápido, apenas para a comida).</li>
            </ul>
            <p>A produção é <strong>proporcional ao nível</strong> do edifício. Por nível e por ciclo de 10 minutos:</p>
            <ul>
                <li><strong>Mina de niobium</strong>: 33 niobium;</li>
                <li><strong>Extrator de água</strong>: 22 água;</li>
                <li><strong>Campo agrícola</strong>: 27 rações;</li>
                <li><strong>Fazenda aeropônica</strong>: 37 rações.</li>
            </ul>
            <p>Exemplo: uma Mina de niobium de nível 10 produz 330 niobium a cada 10 minutos, ou seja, 1&nbsp;980 por hora, antes dos bônus. A barra de recursos exibe sua produção por hora real, bônus incluídos.</p>

            <h2 id="bonus">O que melhora sua produção</h2>
            <ul>
                <li><strong>Entrar em uma aliança</strong>: <strong>+20&nbsp;%</strong> imediato em niobium, água e rações.</li>
                <li><strong>Pesquisas e melhorias de aliança</strong>: a pesquisa «&nbsp;Lei Macron&nbsp;» (+7&nbsp;% por nível, alianças da Balança dos Mundos) e as melhorias «&nbsp;Produção de nióbio&nbsp;», «&nbsp;Produção de água&nbsp;» e «&nbsp;Produção de rações&nbsp;» (+2&nbsp;% por nível cada uma).</li>
                <li><strong>Herói posicionado no planeta</strong>: bônus derivado da sua Inteligência, dobrado para um herói de Economia.</li>
                <li><strong>Campo de escravos</strong>: +2,5&nbsp;% por nível.</li>
            </ul>
            <p>O tamanho do planeta não muda o que um nível produz: o espaço disponível limita apenas o número de níveis que você pode construir.</p>

            <h2 id="armazenamento">O armazenamento (não negligencie!)</h2>
            <p>Cada planeta tem uma <strong>capacidade máxima</strong> de armazenamento, por recurso. <strong>Quando está cheio, tudo o que é produzido a mais é perdido</strong>.</p>
            <p>No início, um planeta armazena 200&nbsp;000 niobium, 180&nbsp;000 água e 150&nbsp;000 rações. Para aumentar a capacidade:</p>
            <ul>
                <li><strong>Armazém de Niobium</strong>: +1&nbsp;200&nbsp;000 niobium por nível;</li>
                <li><strong>Reservatório de água</strong>: +800&nbsp;000 água por nível;</li>
                <li><strong>Silo agrícola</strong>: +800&nbsp;000 rações por nível.</li>
            </ul>
            <p>Eles são desbloqueados com a pesquisa <strong>Gestão de cargas</strong> nível 1; o Silo agrícola exige também a pesquisa <strong>Aeropônica</strong>. O urânio, por sua vez, não tem limite de armazenamento.</p>
            <p><em>Dica de iniciante:</em> verifique seu armazenamento <strong>antes</strong> de se desconectar para dormir. Nada pior do que encontrar suas minas paradas por 10 horas.</p>

    bitcoin_economy:
        title: "Bitcoins e manutenção"
        category: "beginner"
        order: 4
        tags: "bitcoin,moeda,manutencao,custo,tabela,combustivel,economia,game over,relatorio diario"
        summary: "O Bitcoin é a moeda do jogo. Como ganhá-lo e, sobretudo, como evitar a falência."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="o-que-e">O que é o Bitcoin?</h2>
            <p>O <strong>Bitcoin</strong> é a <strong>moeda universal</strong> de Area Universe (nada a ver com a cripto de verdade, é só uma piscadela). Você começa com <strong>125&nbsp;000 Bitcoins</strong>. Eles servem para:</p>
            <ul>
                <li>Iniciar <strong>pesquisas</strong>.</li>
                <li>Recrutar <strong>Legionários</strong> (8 Bitcoins cada), <strong>Mechas</strong> (60) e <strong>cientistas</strong> (25), e fabricar <strong>bombas nucleares</strong> (25&nbsp;000).</li>
                <li>Pagar o <strong>combustível</strong> de cada frota que você envia.</li>
                <li>Apoiar sua <strong>aliança</strong>: depósitos na tesouraria e investimentos nas melhorias de aliança.</li>
                <li>Pagar a <strong>manutenção diária</strong> das suas tropas, naves e edifícios.</li>
            </ul>

            <h2 id="ganhar">Como ganhá-lo?</h2>
            <ul>
                <li><strong>Trabalhadores</strong> — sua fonte principal. No relatório diário, cada trabalhador presente nos seus planetas rende <strong>0,5 Bitcoin</strong>: 10&nbsp;000 trabalhadores = 5&nbsp;000 Bitcoins por dia, os 50&nbsp;000 trabalhadores do seu planeta inicial = 25&nbsp;000 Bitcoins por dia, antes das taxas de aliança e de paz. Os trabalhadores embarcados em uma frota não rendem nada.</li>
                <li><strong>Venda aos mercadores</strong> — entregue a eles niobium, água, urânio e até trabalhadores ou tropas, ou use a venda com um clique da página <strong>Planetas</strong> (veja <a href="/wiki/market">Mercado e mercadores</a>).</li>
                <li><strong>Pontos de Guerra</strong> — ganhos principalmente com as missões diárias, são trocados na página <strong>Objetivos</strong>: 1 PDG = 1 Bitcoin.</li>
                <li><strong>Bônus de conexão</strong> — uma quantia a cada primeira conexão do dia, multiplicada se você encadear dias consecutivos.</li>
                <li><strong>Saque</strong> — os raids rendem niobium, água e urânio, que você pode revender.</li>
            </ul>

            <h2 id="manutencao">A manutenção diária</h2>
            <p>Todo dia às <strong>18h59 (hora de Paris)</strong>, ou seja, 17h59 UTC no inverno e 16h59 UTC no verão, o jogo calcula um balanço para você:</p>
            <ul>
                <li><strong>Receitas</strong>: o que seus trabalhadores rendem.</li>
                <li><strong>Custos</strong>: a manutenção dos seus Legionários, Mechas, cientistas, naves e edifícios.</li>
                <li><strong>Balanço</strong>: receitas − taxas − custos, somado ao (ou subtraído do) seu saldo.</li>
            </ul>
            <p>Tudo o que está <strong>em uma frota</strong> — em voo <em>ou</em> estacionada em órbita — custa bem mais caro do que o que está <strong>em solo</strong> em um planeta: 6 vezes mais para as naves e os Legionários, 50 vezes mais para os Mechas. Uma frota que não está servindo: ponha-a em solo. Um grande exército em passeio permanente acaba arruinando até os mais prudentes.</p>

            <h2 id="bareme">A tabela de manutenção</h2>
            <p>Valores em Bitcoins por dia.</p>
            <table>
                <thead>
                    <tr><th>Unidade</th><th>Em solo</th><th>Em uma frota</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionário</td><td>0,1</td><td>0,6</td></tr>
                    <tr><td>Mecha</td><td>2</td><td>100</td></tr>
                    <tr><td>Cientista</td><td>3</td><td>2</td></tr>
                    <tr><td>Nave</td><td>assinatura ÷ 12</td><td>assinatura ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Exemplos: 10&nbsp;000 Legionários custam 1&nbsp;000 Bitcoins por dia em solo, 6&nbsp;000 em uma frota. 100 Cargo X (assinatura 50 cada) custam cerca de 417 Bitcoins por dia em solo, 2&nbsp;500 em uma frota.</p>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Por nível</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de niobium, Extrator de água, Campo agrícola</td><td>1</td></tr>
                    <tr><td>Fazenda aeropônica</td><td>2</td></tr>
                    <tr><td>Grande cidade, Radar terrestre</td><td>13</td></tr>
                    <tr><td>Metrópole</td><td>26</td></tr>
                    <tr><td>Armazém de Niobium, Reservatório de água, Silo agrícola</td><td>30</td></tr>
                    <tr><td>Centro de pesquisa</td><td>53</td></tr>
                    <tr><td>Caserna</td><td>66</td></tr>
                    <tr><td>Estaleiro espacial</td><td>100</td></tr>
                    <tr><td>Radar espacial</td><td>133</td></tr>
                    <tr><td>Fábrica de armamento, Cidade flutuante, Estação orbital</td><td>333</td></tr>
                    <tr><td>Bloqueador de radar</td><td>400</td></tr>
                    <tr><td>Indústria pesada</td><td>666</td></tr>
                    <tr><td>Forte defensivo</td><td>800</td></tr>
                    <tr><td>Base nuclear</td><td>3&nbsp;333</td></tr>
                    <tr><td>Prisão, Campo de escravos</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Exemplo: um Forte defensivo de nível 3 custa 2&nbsp;400 Bitcoins por dia. As defesas planetárias (torres, escudos) e os trabalhadores não têm manutenção. As pesquisas de aliança «&nbsp;Estrutura soviética&nbsp;», «&nbsp;Superioridade mecânica&nbsp;» e «&nbsp;Entusiasmo científico&nbsp;» reduzem a manutenção dos Legionários, dos Mechas e dos cientistas.</p>

            <h2 id="falencia">Atenção: o Game Over econômico</h2>
            <p>Se, depois desse balanço diário, seu saldo de Bitcoins ficar <strong>negativo</strong>, é o <strong>Game Over econômico</strong>:</p>
            <ul>
                <li>Todas as suas <strong>frotas</strong> são suprimidas, em voo e em órbita, com a carga e as tropas a bordo.</li>
                <li>Todas as <strong>naves em solo</strong> dos seus planetas são perdidas.</li>
                <li>Seu saldo volta para <strong>125&nbsp;000 Bitcoins</strong>.</li>
            </ul>
            <p>Você mantém seus planetas, edifícios, defesas, pesquisas e as tropas que ficaram em solo. Um relatório «&nbsp;Falência iminente&nbsp;» avisa você com antecedência (veja <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Regra de ouro:</em> não recrute um exército mais caro do que o que seus trabalhadores conseguem financiar.</p>

    first_buildings:
        title: "Construir seus primeiros edifícios"
        category: "beginner"
        order: 5
        tags: "edificios,construcao,mina,extrator,campo agricola,grande cidade,iniciante,posicao,espaço"
        summary: "A ordem de construção recomendada para começar bem o seu planeta inicial."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordem">A ordem recomendada (os 10 primeiros edifícios)</h2>
            <p>Seu planeta inicial já possui uma Mina de niobium e um Extrator de água de nível 3, um Estaleiro espacial e um Radar terrestre de nível 1, 50&nbsp;000 trabalhadores e 125&nbsp;000 rações de reserva.</p>
            <ol>
                <li><strong>Mina de niobium</strong> — melhore-a: é sua primeira fonte de matéria-prima.</li>
                <li><strong>Extrator de água</strong> — indispensável para construir tudo o que vem depois.</li>
                <li><strong>Campo agrícola</strong> — produz as rações que alimentam seus trabalhadores.</li>
                <li><strong>Grande cidade</strong> — +25&nbsp;000 trabalhadores no máximo (você começa no teto de 50&nbsp;000). Exige a pesquisa <strong>Redefinição urbana</strong> nível 1.</li>
                <li><strong>Mina de niobium e Extrator de água</strong> ainda mais alto — aumente a produção antes de ir mais longe.</li>
                <li><strong>Centro de pesquisa</strong> — abriga seus cientistas (250 por nível). Ele não é necessário para iniciar uma pesquisa.</li>
                <li><strong>Estaleiro espacial</strong> — você já tem um; cada nível acelera a produção de naves em 25&nbsp;%. Subir de nível exige a pesquisa <strong>Indústria</strong> nível 1.</li>
                <li><strong>Caserna</strong> — +5&nbsp;000 Legionários no máximo por nível (2&nbsp;000 sem caserna). Exige a pesquisa <strong>Crescimento militar</strong> nível 1.</li>
                <li><strong>Armazém de Niobium</strong>, <strong>Reservatório de água</strong>, <strong>Silo agrícola</strong> — evite que a produção sature. Exigem a pesquisa <strong>Gestão de cargas</strong> nível 1 (e <strong>Aeropônica</strong> para o Silo).</li>
                <li><strong>Metrópole</strong> — +80&nbsp;000 trabalhadores no máximo por nível. Exige a pesquisa <strong>Redefinição urbana</strong> nível 5.</li>
            </ol>
            <p>Custos, durações e espaço ocupado por cada edifício: veja <a href="/wiki/buildings">Os edifícios</a>.</p>

            <h2 id="fila-espera">Uma única construção por vez</h2>
            <p>Cada planeta tem <strong>uma única fila de construção</strong>. Enquanto um edifício sobe de nível, os outros precisam esperar. Planeje com isso em mente.</p>
            <p>Vários planetas = várias filas em paralelo: é por isso que a colonização acelera a sua progressão.</p>

            <h2 id="espaco">O espaço disponível em um planeta</h2>
            <p>Cada planeta tem um número limitado de <strong>vagas no solo</strong> e de <strong>vagas no céu</strong>. <strong>Cada nível</strong> de edifício ocupa vagas, subida de nível incluída: uma Mina de niobium ocupa 1 vaga no solo por nível, uma Grande cidade 6, uma Metrópole 6 no solo e 6 no céu.</p>
            <ul>
                <li>As vagas usadas e disponíveis aparecem no cartão de cada planeta (página <strong>Planetas</strong>) e na página <strong>Infraestruturas</strong>.</li>
                <li>O céu serve para a Metrópole, a Fazenda aeropônica, o Estaleiro espacial, o Radar espacial e o Bloqueador de radar. As defesas (torres, escudos) não ocupam nenhuma vaga.</li>
                <li>Para ampliar um planeta: <strong>Cidade flutuante</strong> (+10 vagas no solo por nível) e <strong>Estação orbital</strong> (+5 no céu por nível), no máximo 5 de cada por planeta. Elas custam 2&nbsp;000 Pontos de Guerra × o nível e são desbloqueadas com a pesquisa <strong>Expansão territorial</strong> (nível 1 e depois 2), acessível após Terraformação nível 18.</li>
                <li>Nenhuma vaga livre = nenhuma construção nem subida de nível nesse planeta.</li>
            </ul>

    first_fleet:
        title: "Criar sua primeira frota"
        category: "beginner"
        order: 6
        tags: "frota,naves,primeira,criacao,iniciante,estaleiro,cargo,cargueiro,sonda"
        summary: "Fabricar uma nave, compor uma frota e enviá-la ao destino: o passo a passo."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequisitos">O que você precisa antes</h2>
            <ul>
                <li>Um <strong>Estaleiro espacial</strong> construído no seu planeta.</li>
                <li>Os recursos da nave: na maioria das vezes <strong>niobium</strong>, <strong>água</strong> e <strong>trabalhadores</strong> (seu planeta sempre mantém 5&nbsp;000 de reserva, intocáveis). Algumas naves exigem também Pontos de Guerra, Bitcoins ou Legionários (veja o artigo <em>Tipos de naves</em>).</li>
                <li>A <strong>pesquisa</strong> que desbloqueia a nave. Exemplo: os cargueiros exigem <em>Gestão de cargas</em> (nível 1 para o Cargo I), ela mesma acessível com <em>Naves utilitárias</em> nível 2. A Sonda, por sua vez, não exige nenhuma pesquisa.</li>
            </ul>

            <h2 id="fabricar">Etapa 1 — Fabricar naves</h2>
            <p>Vá à página <strong>Estaleiro espacial</strong> (menu da esquerda), aba <strong>Construção de naves</strong>. Escolha uma nave, indique uma quantidade e clique em <strong>Construir</strong>. Uma nave ainda bloqueada indica a pesquisa ou o edifício que falta.</p>
            <p>A fabricação leva tempo: você pode continuar jogando enquanto isso.</p>

            <h2 id="compor">Etapa 2 — Compor e enviar uma frota</h2>
            <ol>
                <li>Na página <strong>Frotas</strong>, clique em <strong>Criar uma nova frota</strong>, escolha as naves a embarcar (o estoque em solo é exibido) e dê um nome à frota (12 caracteres no máximo).</li>
                <li>Clique no nome da frota para abrir sua página. A aba <strong>Frete</strong> serve para carregar recursos quando a frota está em um dos seus planetas.</li>
                <li>Envie-a:
                    <ul>
                        <li>para um simples deslocamento (missão <strong>Normal</strong>) ou uma espionagem, aba <strong>Mover a frota</strong>: digite o destino nos campos galáxia, sistema e planeta (por ex. <code>1:5:12</code>) ou escolha um dos «&nbsp;Meus planetas&nbsp;», confira o custo e a duração estimados e clique em <strong>Enviar</strong>;</li>
                        <li>para as outras missões (Descarregar e voltar, Colonizar, Saquear, Invadir…), passe pelo <strong>Mapa espacial</strong>: clique na casa visada, depois em <strong>Interação</strong>, escolha a frota e a missão e clique em <strong>Enviar</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>O combustível é pago em <strong>Bitcoins</strong>, na partida (veja o artigo <em>Deslocamento e distância</em>). As missões são detalhadas no artigo <em>Tipos de missões</em>.</p>

            <h2 id="primeiras-naves">As boas naves para começar</h2>
            <ul>
                <li><strong>Cargo I</strong> — transporte de recursos (3&nbsp;000 de capacidade). A nave ideal para vender aos mercadores.</li>
                <li><strong>Sonda</strong> — espiona os planetas adversários. Envie-a <em>antes</em> de qualquer ataque.</li>
                <li><strong>Caçador</strong> — primeira nave de combate, barata (25 niobium, 5 água e 1 trabalhador).</li>
                <li><strong>Reciclador</strong> — coleta os detritos depois de um combate. Muito rentável, mas lento: adicionado a uma frota de caçadores, ele triplica a duração do voo dela.</li>
            </ul>

            <h2 id="primeiro-alvo">Ideia de primeira missão</h2>
            <p>Encha 1 cargueiro de niobium ou de água e depois envie-o a partir do <strong>Mapa espacial</strong> em missão <strong>Descarregar e voltar</strong> para um mercador. Os mercadores ficam em 20 setores fixos de cada galáxia (os quatro cantos 1, 10, 91 e 100, depois 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 e, no centro, 45, 46, 55 e 56), em uma posição que muda de um setor para outro: localize-os no mapa.</p>
            <p>O mercador paga a você em Bitcoins e o cargueiro volta sozinho. A ida custa o dobro de uma viagem normal e a volta é paga na sua partida, na tarifa normal: para um único Cargo I, conte 0 a 2 Bitcoins na ida e 0 ou 1 na volta.</p>

    first_combat:
        title: "Seu primeiro combate"
        category: "beginner"
        order: 7
        tags: "combate,primeiro,ataque,relatorio,iniciante,rounds"
        summary: "Como iniciar um combate espacial, o que acontece durante e o que fazer depois."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparar">Preparar-se (importante!)</h2>
            <ol>
                <li><strong>Envie uma sonda</strong> ao alvo para avaliar suas defesas. Perder 10 caçadores às cegas é descartável; perder 100 dói.</li>
                <li><strong>Componha uma frota adequada</strong>: poder de fogo suficiente, e pense em adicionar um <strong>reciclador</strong> para coletar os detritos.</li>
                <li><strong>Verifique sua manutenção</strong>: a cada dia, uma nave custa sua assinatura ÷ 2 em Bitcoins enquanto estiver em uma frota (em voo ou estacionada), contra sua assinatura ÷ 12 em solo. Ponha de volta em solo o que não está servindo.</li>
            </ol>

            <h2 id="encadeamento">O que acontece etapa por etapa</h2>
            <ol>
                <li><strong>Você ativa o modo ataque</strong> da sua frota (caixa «&nbsp;modo ataque&nbsp;» da gestão de frota; é preciso ter armas de nave) e depois a envia em missão <em>Normal</em> para as coordenadas de um inimigo. O combustível é pago em Bitcoins na partida.</li>
                <li><strong>Ela viaja</strong> — o tempo de trajeto aparece na página Frotas. Durante os <strong>2 minutos</strong> seguintes à partida, o botão «&nbsp;Cancelar&nbsp;» a traz de volta na hora ao planeta de partida (o combustível pago não é devolvido); passado esse prazo, ela irá até o fim.</li>
                <li><strong>Chegada</strong>: se houver frotas inimigas no local, o combate é programado para <strong>5 minutos</strong> depois. Durante esse prazo, ninguém mais pode mudar o modo ataque de suas frotas.</li>
                <li><strong>Combate em rounds</strong>: os dois lados trocam uma salva por round, 100 rounds no máximo. Cada salva esbarra primeiro no escudo adversário, mas uma parte sempre o atravessa.</li>
                <li><strong>Fim do combate</strong>: um lado é eliminado, ou os 100 rounds são atingidos. Nesse caso, o lado que conserva <strong>mais blindagem</strong> vence (em empate perfeito, o atacante vence).</li>
            </ol>

            <h2 id="apos-combate">Depois do combate</h2>
            <ul>
                <li>Um <strong>relatório de combate</strong> é enviado a você: menu <strong>Relatório</strong>, aba <strong>Combates</strong>.</li>
                <li>As naves destruídas deixam <strong>detritos</strong> no local. Envie recicladores!</li>
                <li>O vencedor ganha <strong>Pontos de Guerra (PDG)</strong> de acordo com a frota inimiga destruída; o perdedor recebe uma pequena consolação (veja <em>Combate espacial</em>).</li>
                <li>Sua frota sobrevivente <strong>permanece em órbita</strong> no local do combate: envie-a de volta você mesmo. Se ela tiver recicladores com espaço no porão, eles começam imediatamente a recolher os detritos.</li>
            </ul>

            <h2 id="erros">Os erros clássicos a evitar</h2>
            <ul>
                <li>Atacar sem sondar antes.</li>
                <li>Esquecer que os rounds param em 100: um alvo sólido demais, que você não abala o bastante, mantém mais blindagem do que você e vence.</li>
                <li>Não enviar reciclador: seus adversários vão recuperar <em>os seus</em> detritos antes de você.</li>
            </ul>

    tips:
        title: "Dicas para começar bem"
        category: "beginner"
        order: 8
        tags: "dicas,conselhos,estrategia,iniciante,astucias"
        summary: "15 conselhos que fazem toda a diferença nos seus primeiros dias."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economia">Economia</h2>
            <ul>
                <li><strong>Maximize seus trabalhadores</strong>: é sua principal fonte de Bitcoins.</li>
                <li><strong>Não construa cedo demais</strong> um grande exército: ele vai arruiná-lo em manutenção.</li>
                <li><strong>Pesquise Redefinição urbana e depois construa Grandes cidades e Metrópoles</strong> para aumentar a população.</li>
                <li><strong>Acompanhe seu relatório diário</strong>: se seus custos ultrapassarem suas receitas, reaja imediatamente.</li>
                <li><strong>Venda seus excedentes aos mercadores</strong> em vez de deixar o armazenamento saturar.</li>
            </ul>

            <h2 id="militar">Militar</h2>
            <ul>
                <li><strong>Sempre uma defesa em cada planeta</strong>: Legionários na caserna, Mechas, uma ou duas torres.</li>
                <li><strong>Personalize suas naves todos os dias</strong>: você pode gastar até 40 pontos de melhoria por dia (casco, escudo, armas, precisão), tirados do crédito próprio de cada tipo de nave.</li>
                <li><strong>Os recicladores são muito rentáveis</strong>: depois de cada combate, recupere os detritos. Adicione cargueiros à frota: um reciclador sozinho transporta apenas 1&nbsp;000 recursos.</li>
                <li><strong>Sonde antes de atacar</strong>: uma sonda custa apenas 1&nbsp;000 niobium (você tem 10 no início), uma frota perdida custa caro. Saiba que o alvo é avisado da espionagem.</li>
                <li><strong>Atenção ao limite dos 100 rounds</strong>: se nenhum lado for destruído ao fim de 100 turnos, quem mantiver mais blindagem vence (o atacante em caso de empate perfeito).</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Entre rapidamente em uma aliança</strong>: +20&nbsp;% de produção de niobium, de água e de rações, acesso à diplomacia e às pesquisas de aliança.</li>
                <li><strong>Complete suas missões diárias</strong> (página <em>Objetivos</em>): cada uma rende pontos de guerra (PDG).</li>
                <li><strong>Converse na sala da aliança</strong>: coordenar dois ataques vale mais do que tentar um só.</li>
                <li><strong>Conecte-se todos os dias</strong>: o bônus de conexão dispara com a série de 7 dias consecutivos.</li>
                <li><strong>Ative as notificações push</strong>: você saberá assim que uma frota inimiga correr na sua direção.</li>
            </ul>

    resources:
        title: "Recursos em detalhe"
        category: "economy"
        order: 1
        tags: "recursos,niobio,niobium,agua,comida,uranio,producao,armazenamento,ciclo,rações"
        summary: "Entenda tudo sobre os recursos: produção, bônus, armazenamento e o caso particular do urânio."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="lembrete">Lembrete: os 4 recursos</h2>
            <ul>
                <li><strong>Niobium</strong> — construção (edifícios, naves, defesas).</li>
                <li><strong>Água</strong> — construção (edifícios, naves, defesas). O combustível das frotas, por sua vez, é pago em Bitcoins.</li>
                <li><strong>Comida</strong> («&nbsp;Rações&nbsp;» no jogo) — comida pelos seus trabalhadores, e apenas por eles: 1 ração por hora para 500 trabalhadores. Uma fome mata também Legionários e Mechas.</li>
                <li><strong>Urânio</strong> — Base nuclear, bombas nucleares, interceptadores, apostas de arena. Raro e precioso.</li>
            </ul>

            <h2 id="producao">Como a produção é calculada</h2>
            <p>A produção é expressa por intervalo de <strong>10 minutos</strong> (o ciclo de produção de um planeta) e creditada proporcionalmente ao tempo decorrido. Ela depende:</p>
            <ul>
                <li>do <strong>nível</strong> do edifício produtor: por nível e por 10 minutos, Mina de niobium 33 niobium, Extrator de água 22 água, Campo agrícola 27 rações, Fazenda aeropônica 37 rações;</li>
                <li>dos seus <strong>bônus</strong> (aliança, pesquisa «&nbsp;Lei Macron&nbsp;», melhorias de aliança, herói, Campo de escravos).</li>
            </ul>
            <p>Exemplo: um Extrator de água de nível 8 produz 8 × 22 = 176 água por 10 minutos, ou seja, 1&nbsp;056 por hora; em uma aliança (+20&nbsp;%), 1&nbsp;267 por hora. O tamanho do planeta não muda o que um nível produz: ele limita apenas o número de níveis que você pode construir.</p>
            <p>As <strong>luas</strong> produzem comida <strong>10 vezes mais rápido</strong> (ciclo de 1 minuto).</p>
            <p>Mesmo <strong>sem edifício produtor</strong> — ou se você o destruir até o nível 0 — um planeta mantém uma <strong>produção básica mínima</strong>: <strong>7 niobium, 6 água e 9 rações</strong> por ciclo (20 rações no seu planeta inicial). A partir do nível 1, a produção do edifício substitui esse mínimo: ela não se soma a ele.</p>
            <p>Para a comida, o <strong>Campo agrícola</strong> e a <strong>Fazenda aeropônica</strong> <strong>se somam</strong>: suas produções se acumulam.</p>

            <h2 id="bonus">O que aumenta sua produção</h2>
            <table>
                <thead>
                    <tr><th>Fonte</th><th>Efeito</th></tr>
                </thead>
                <tbody>
                    <tr><td>Pertencer a uma aliança</td><td>+20&nbsp;% em niobium, água e rações</td></tr>
                    <tr><td>Pesquisa de aliança «&nbsp;Lei Macron&nbsp;» (Balança dos Mundos)</td><td>+7&nbsp;% por nível, até o nível 5</td></tr>
                    <tr><td>Melhorias de aliança «&nbsp;Produção de nióbio&nbsp;», «&nbsp;Produção de água&nbsp;», «&nbsp;Produção de rações&nbsp;»</td><td>+2&nbsp;% por nível, até +10&nbsp;%</td></tr>
                    <tr><td>Herói posicionado no planeta</td><td>Bônus derivado da sua Inteligência, dobrado se for um herói de Economia; +20&nbsp;% a mais com o traço «&nbsp;Magnata&nbsp;» (herói de Economia nível 15)</td></tr>
                    <tr><td>Campo de escravos</td><td>+2,5&nbsp;% por nível, mais 1&nbsp;% por nível de cada prisioneiro detido (limitado a 5&nbsp;% por nível do campo)</td></tr>
                    <tr><td>Veredito de um bloqueio Cthulhu</td><td>De +15&nbsp;% a −15&nbsp;% para os membros de uma aliança, por uma duração limitada</td></tr>
                </tbody>
            </table>

            <h2 id="armazenamento">O armazenamento e suas armadilhas</h2>
            <p>Seu planeta tem uma <strong>capacidade máxima</strong> para cada recurso. Quando está cheio, a produção continua, mas o que excede é perdido.</p>
            <p>Soluções: construir <strong>Armazéns de Niobium</strong>, <strong>Reservatórios de água</strong> e <strong>Silos agrícolas</strong>, vender o excedente de niobium e de água aos mercadores (as rações, por sua vez, não são vendidas), ou enviar os excedentes a outro jogador.</p>

            <p>A comida é transportada como o niobium e a água: carregue <strong>rações</strong> no porão de uma frota (1 vaga por ração) para abastecer outro planeta. Na descarga, o celeiro nunca ultrapassa sua capacidade: o excedente permanece no porão.</p>

            <h2 id="uranio">O urânio: o caso particular</h2>
            <p>Nenhum edifício produz urânio. Você o obtém:</p>
            <ul>
                <li>ao <strong>reciclar</strong> detritos de urânio no mapa (identificados pelo seu ícone especial);</li>
                <li>ao <strong>derrotar Cthulhu</strong> (missões PvE);</li>
                <li>ao <strong>vencer desafios de arena</strong> com aposta de urânio.</li>
            </ul>
            <p>O urânio serve para construir a <strong>Base nuclear</strong> (500 por nível), fabricar <strong>bombas nucleares</strong> (500 cada) e <strong>interceptadores</strong> (200 cada), e apostar na <strong>arena</strong>. Ele não tem limite de armazenamento, é transportado no porão como os outros recursos e é revendido a <strong>2&nbsp;000 Bitcoins a unidade</strong> aos mercadores.</p>

    buildings:
        title: "Os edifícios"
        category: "economy"
        order: 2
        tags: "edificios,construcao,custo,mina,extrator,campo agricola,grande cidade,metropole,estaleiro,forte defensivo,bunker,cidade flutuante,estacao orbital"
        summary: "Catálogo completo dos edifícios por função, com seus custos, sua duração e o espaço que ocupam."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="producao">Produção de recursos</h2>
            <p>Os nomes abaixo são os exibidos na página <strong>Infraestruturas</strong>. Cada nível ocupa vagas no solo ou no céu (veja a seção «&nbsp;Custo dos edifícios&nbsp;» mais abaixo), e muitos edifícios exigem uma pesquisa prévia.</p>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Produz</th><th>Observação</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de niobium</td><td>Niobium</td><td>33 niobium por nível e por 10 minutos.</td></tr>
                    <tr><td>Extrator de água</td><td>Água</td><td>22 água por nível e por 10 minutos.</td></tr>
                    <tr><td>Campo agrícola</td><td>Rações</td><td>27 rações por nível e por 10 minutos. 1 vaga no solo por nível.</td></tr>
                    <tr><td>Fazenda aeropônica</td><td>Rações</td><td>37 rações por nível e por 10 minutos, mas 1 vaga <strong>no céu</strong> por nível (nenhuma no solo). Pesquisa Aeropônica exigida. Sua produção se soma à do Campo agrícola.</td></tr>
                </tbody>
            </table>

            <h2 id="armazenamento">Armazenamento</h2>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td>Armazém de Niobium</td><td>+1&nbsp;200&nbsp;000 niobium armazenáveis por nível. Pesquisa Gestão de cargas 1.</td></tr>
                    <tr><td>Reservatório de água</td><td>+800&nbsp;000 água armazenáveis por nível. Pesquisa Gestão de cargas 1.</td></tr>
                    <tr><td>Silo agrícola</td><td>+800&nbsp;000 rações armazenáveis por nível. Pesquisas Gestão de cargas 1 e Aeropônica.</td></tr>
                </tbody>
            </table>
            <p>Sem esses edifícios, um planeta armazena 200&nbsp;000 niobium, 180&nbsp;000 água e 150&nbsp;000 rações.</p>

            <h2 id="populacao">População e ciência</h2>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td>Grande cidade</td><td>+25&nbsp;000 trabalhadores no máximo e cerca de +8&nbsp;000 trabalhadores por dia, por nível. Pesquisa Redefinição urbana 1.</td></tr>
                    <tr><td>Metrópole</td><td>+80&nbsp;000 trabalhadores no máximo e cerca de +12&nbsp;000 trabalhadores por dia, por nível. Pesquisa Redefinição urbana 5.</td></tr>
                    <tr><td>Centro de pesquisa</td><td>+250 cientistas no máximo por nível. Indispensável para recrutar cientistas; inútil para iniciar uma pesquisa.</td></tr>
                </tbody>
            </table>

            <h2 id="militar">Militar e produção de naves</h2>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td>Caserna</td><td>+5&nbsp;000 Legionários no máximo por nível (2&nbsp;000 sem caserna). Pesquisa Crescimento militar 1.</td></tr>
                    <tr><td>Forte defensivo</td><td>+15&nbsp;000 Legionários no máximo por nível, e <strong>protege das pilhagens</strong> 5&nbsp;% da sua capacidade de armazenamento de niobium e de água (e 5&nbsp;% do seu urânio) por nível. Exigido para os Mechas. Pesquisa Crescimento militar 3.</td></tr>
                    <tr><td>Base nuclear</td><td>Cada nível permite armazenar 1 bomba nuclear e 4 interceptadores (pesquisa Armamento 5 exigida para fabricá-los). Custa 100&nbsp;000 niobium e 500 urânio por nível.</td></tr>
                    <tr><td>Estaleiro espacial</td><td>Fabrica as naves utilitárias (cargueiro, sonda, reciclador…) e acelera a produção de todas as naves (+25&nbsp;% por nível). Pesquisa Indústria 1.</td></tr>
                    <tr><td>Fábrica de armamento</td><td>Fabrica as naves leves (caçadores pesados, corvetas…) e acelera a produção de naves <strong>e de defesas</strong> em 40&nbsp;%. Um único nível por planeta. Pesquisa Naves leves 1.</td></tr>
                    <tr><td>Indústria pesada</td><td>Fabrica as naves pesadas (fragatas, cruzadores, couraçados, destroyers) e acelera a produção de naves <strong>e de defesas</strong> em 60&nbsp;%. Um único nível por planeta. Pesquisa Naves pesadas 1.</td></tr>
                    <tr><td>Prisão</td><td>Aprisiona os heróis capturados. Pesquisa Sistema prisional.</td></tr>
                    <tr><td>Campo de escravos</td><td>Por nível: +2,5&nbsp;% de produção de recursos, +2&nbsp;500 trabalhadores no máximo, −1,5&nbsp;% de duração de construção; cada prisioneiro detido adiciona 1&nbsp;% de produção por nível do prisioneiro. Pesquisa Sistema prisional.</td></tr>
                </tbody>
            </table>

            <h2 id="orbital">Ampliar o planeta e defesas orbitais</h2>
            <table>
                <thead>
                    <tr><th>Edifício / Instalação</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cidade flutuante</td><td>+10 vagas no solo por nível (5 no máximo por planeta). Custa 2&nbsp;000 Pontos de Guerra × o nível. Pesquisa Expansão territorial 1.</td></tr>
                    <tr><td>Estação orbital</td><td>+5 vagas no céu por nível (5 no máximo por planeta). Custa 2&nbsp;000 Pontos de Guerra × o nível. Pesquisa Expansão territorial 2.</td></tr>
                    <tr><td>Base espacial</td><td>Traz um bônus de blindagem às defesas orbitais.</td></tr>
                    <tr><td>Escudo / Grande escudo</td><td>Absorve os danos antes que as defesas sejam atingidas.</td></tr>
                    <tr><td>Torres (míssil, laser, Gauss, plasma…)</td><td>Defendem seu planeta contra as frotas em modo ataque.</td></tr>
                </tbody>
            </table>
            <p>As defesas (torres, escudos) não ocupam nenhuma vaga.</p>

            <h2 id="deteccao">Detecção e bloqueio</h2>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Função</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar terrestre</td><td>Detecta as frotas que se aproximam (+1 de potência de radar por nível). Pesquisa Scanner de sistema 1.</td></tr>
                    <tr><td>Radar espacial</td><td>Mesma contribuição de um Radar terrestre (+1 de potência de radar por nível), mas ocupa vagas no céu em vez do solo. Pesquisa Scanner de sistema 3.</td></tr>
                    <tr><td>Bloqueador de radar</td><td>Bloqueia a detecção inimiga dos seus movimentos. Pesquisa Scanner de sistema 5.</td></tr>
                </tbody>
            </table>

            <h2 id="couts">Custo dos edifícios</h2>
            <p>O custo e a duração de um nível são <strong>proporcionais ao nível visado</strong>: o nível N custa N vezes o custo básico e dura N vezes a duração básica. Exemplo: uma Mina de niobium de nível 4 custa 4 × 45 = 180 niobium e 4 × 20 = 80 água, em 4 × 3 = 12 minutos. Se um nível do mesmo edifício já estiver na fila, o seguinte é cobrado no nível seguinte.</p>
            <p>Valores básicos (nível 1). «&nbsp;Espaço&nbsp;» = vagas ocupadas no solo / no céu por nível.</p>

            <h3>Recursos e armazenamento</h3>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Niobium / água</th><th>Duração</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mina de niobium</td><td>45 / 20</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Extrator de água</td><td>20 / 50</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Campo agrícola</td><td>60 / 90</td><td>5 min</td><td>1 / 0</td></tr>
                    <tr><td>Fazenda aeropônica</td><td>650 / 100</td><td>5 min 50 s</td><td>0 / 1</td></tr>
                    <tr><td>Armazém de Niobium</td><td>11&nbsp;000 / 6&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Reservatório de água</td><td>8&nbsp;000 / 9&nbsp;000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Silo agrícola</td><td>12&nbsp;000 / 20&nbsp;000</td><td>50 min</td><td>4 / 0</td></tr>
                </tbody>
            </table>

            <h3>População e ciência</h3>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Niobium / água</th><th>Duração</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>Grande cidade</td><td>1&nbsp;500 / 1&nbsp;100</td><td>12 min</td><td>6 / 0</td></tr>
                    <tr><td>Metrópole</td><td>7&nbsp;500 / 5&nbsp;500</td><td>46 min 40 s</td><td>6 / 6</td></tr>
                    <tr><td>Centro de pesquisa</td><td>285 / 360</td><td>15 min</td><td>5 / 0</td></tr>
                </tbody>
            </table>
            <p>Exemplo: uma Metrópole de nível 3 custa 22&nbsp;500 niobium e 16&nbsp;500 água, em 2 h 20 min.</p>

            <h3>Militar e naves</h3>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Niobium / água</th><th>Duração</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>Caserna</td><td>1&nbsp;300 / 1&nbsp;900</td><td>35 min</td><td>6 / 0</td></tr>
                    <tr><td>Forte defensivo</td><td>20&nbsp;000 / 19&nbsp;000</td><td>1 h 12 min</td><td>10 / 0</td></tr>
                    <tr><td>Base nuclear</td><td>100&nbsp;000 / 0 (+ 500 urânio)</td><td>1 h 12 min</td><td>2 / 0</td></tr>
                    <tr><td>Prisão</td><td>3&nbsp;000 / 3&nbsp;500</td><td>50 min</td><td>5 / 0</td></tr>
                    <tr><td>Campo de escravos</td><td>2&nbsp;000 / 2&nbsp;500</td><td>40 min</td><td>4 / 0</td></tr>
                    <tr><td>Estaleiro espacial</td><td>300 / 200</td><td>3 min</td><td>2 / 1</td></tr>
                    <tr><td>Fábrica de armamento (1 nível)</td><td>700 / 390</td><td>36 min</td><td>6 / 0</td></tr>
                    <tr><td>Indústria pesada (1 nível)</td><td>8&nbsp;300 / 6&nbsp;800</td><td>2 h</td><td>12 / 0</td></tr>
                </tbody>
            </table>

            <h3>Detecção e ampliação</h3>
            <table>
                <thead>
                    <tr><th>Edifício</th><th>Custo (niobium / água)</th><th>Duração</th><th>Espaço</th></tr>
                </thead>
                <tbody>
                    <tr><td>Radar terrestre</td><td>120 / 65</td><td>3 min 40 s</td><td>2 / 0</td></tr>
                    <tr><td>Radar espacial</td><td>2&nbsp;000 / 1&nbsp;720</td><td>24 min</td><td>0 / 2</td></tr>
                    <tr><td>Bloqueador de radar</td><td>5&nbsp;100 / 3&nbsp;210</td><td>54 min</td><td>0 / 4</td></tr>
                    <tr><td>Cidade flutuante (5 no máx.)</td><td>2&nbsp;000 Pontos de Guerra</td><td>24 min</td><td>adiciona 10 no solo</td></tr>
                    <tr><td>Estação orbital (5 no máx.)</td><td>2&nbsp;000 Pontos de Guerra</td><td>24 min</td><td>adiciona 5 no céu</td></tr>
                </tbody>
            </table>
            <p>A melhoria de aliança «&nbsp;Custo de construção&nbsp;» reduz o custo em niobium, água e urânio (−1&nbsp;% por nível, até −5&nbsp;%), e cada nível de Campo de escravos reduz a duração em 1,5&nbsp;%. A manutenção diária de cada edifício está detalhada em <a href="/wiki/bitcoin_economy#bareme">Bitcoins e manutenção</a>.</p>

            <h2 id="file-production">Gerenciar a fila de produção</h2>
            <p>As construções de edifícios, de naves (Estaleiro espacial) e de defesas passam por uma <strong>fila de espera</strong> que você pode gerenciar:</p>
            <ul>
                <li><strong>Reorganizar</strong> a ordem dos itens em espera (arrastar e soltar) para priorizar o que importa.</li>
                <li><strong>Cancelar</strong> um item em espera: você é <strong>reembolsado proporcionalmente</strong> ao que ainda não foi produzido (um edifício em espera é reembolsado por inteiro).</li>
                <li>O custo de um edifício é debitado assim que ele é adicionado à fila.</li>
                <li>A fila em andamento aparece no alto de cada página de produção, sob o título.</li>
                <li>A fila é limitada a <strong>15 itens em espera</strong> (excluindo a construção em andamento): além disso, uma mensagem indica que você deve esperar o fim de uma construção ou cancelar uma antes de adicionar uma nova.</li>
                <li>A <strong>Cidade flutuante</strong> (+10&nbsp;solo/nível) e a <strong>Estação orbital</strong> (+5&nbsp;céu/nível) são limitadas a <strong>5 exemplares por planeta</strong> cada uma.</li>
            </ul>

    research:
        title: "Pesquisa e tecnologias"
        category: "economy"
        order: 3
        tags: "pesquisa,tecnologia,ciencia,bitcoin,desbloqueio,arvore tecnologica,terraformacao,custo"
        summary: "As tecnologias que desbloqueiam naves, bônus e novas capacidades. Como priorizar."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="funcionamento">Como funciona</h2>
            <p>As pesquisas são iniciadas pela página <strong>Pesquisas</strong> (nenhum edifício é necessário). Cada pesquisa:</p>
            <ul>
                <li>custa <strong>Bitcoins</strong> (apenas Expansão territorial é paga em Pontos de Guerra): o nível N custa N vezes o custo básico;</li>
                <li>leva <strong>tempo</strong>, também proporcional ao nível: de alguns minutos a mais de um dia;</li>
                <li>pode ter um <strong>pré-requisito</strong> (outra pesquisa em um certo nível).</li>
            </ul>
            <p>Exemplo: Terraformação nível 2 custa 2 × 12&nbsp;000 = 24&nbsp;000 Bitcoins e dura 2 × 1 h 10 min = 2 h 20 min na velocidade básica. A melhoria de aliança «&nbsp;Custo de pesquisa&nbsp;» reduz o preço em 1&nbsp;% por nível (até −5&nbsp;%).</p>
            <p>Você pode programar várias pesquisas em sequência: o custo é debitado ao entrar na fila e integralmente reembolsado se você cancelar.</p>
            <p>A duração de uma pesquisa é fixada <strong>no momento em que você a inicia ou a coloca na fila</strong>: duração básica × nível ÷ sua <strong>velocidade de pesquisa</strong> (1 no início). O que faz essa velocidade variar (cientistas, pesquisa de aliança «&nbsp;Mobilização científica&nbsp;») é explicado em <a href="/wiki/workers_scientists">Trabalhadores e cientistas</a>. A melhoria de aliança «&nbsp;Velocidade de pesquisa&nbsp;» encurta a duração exibida na página Pesquisas, mas não a duração real: uma vez iniciada, a pesquisa termina no horário calculado sem ela.</p>

            <h2 id="prioridade-iniciante">Prioridades para um iniciante</h2>
            <ol>
                <li><strong>Naves utilitárias</strong> — abre Terraformação (nível 1), Gestão de cargas (nível 2), Invasão planetária e Reciclagem orbital (nível 3).</li>
                <li><strong>Terraformação</strong> — a Nave de colonização e um planeta a mais por nível.</li>
                <li><strong>Gestão de cargas</strong> — os cargueiros e os edifícios de armazenamento.</li>
                <li><strong>Redefinição urbana</strong> — Grande cidade e depois Metrópole: mais trabalhadores, portanto mais Bitcoins.</li>
                <li><strong>Indústria</strong> — para ampliar o Estaleiro espacial e abrir as naves leves (nível 3) e pesadas (nível 5).</li>
                <li><strong>Invasão planetária</strong> e <strong>Reciclagem orbital</strong> — indispensáveis para invadir e reciclar.</li>
                <li><strong>Armamento</strong> e depois <strong>Arma míssil</strong> — suas primeiras naves de combate (Caçador).</li>
            </ol>

            <h2 id="pesquisas">Lista completa das pesquisas</h2>
            <p>As pesquisas estão organizadas como na página Pesquisas. Custo e duração indicados para o nível 1, na velocidade básica: o nível N custa e dura N vezes mais. O nível máximo é indicado entre parênteses.</p>

            <h3>Exploração</h3>
            <table>
                <thead>
                    <tr><th>Pesquisa</th><th>O que ela traz</th><th>Pré-requisito</th><th>Nível 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Naves utilitárias (3)</td><td>Nív. 1: Terraformação. Nív. 2: Gestão de cargas. Nív. 3: Invasão planetária, Reciclagem orbital e Nave mãe.</td><td>—</td><td>2&nbsp;500; 3 min 20 s</td></tr>
                    <tr><td>Terraformação (18)</td><td><strong>+1 planeta possuível por nível</strong> (2 + nível no total, mais os bônus de regime político). Nív. 1: Nave de colonização. Nív. 15: Lunar.</td><td>Naves utilitárias 1</td><td>12&nbsp;000; 1 h 10 min</td></tr>
                    <tr><td>Gestão de cargas (5)</td><td>Cargo I (nív. 1), Cargo V (nív. 3), Cargo X (nív. 5). Nív. 1: Armazém de Niobium, Reservatório de água, Silo agrícola (com Aeropônica).</td><td>Naves utilitárias 2</td><td>3&nbsp;500; 6 min 40 s</td></tr>
                    <tr><td>Invasão planetária (1)</td><td>Barcaça de invasão.</td><td>Naves utilitárias 3</td><td>35&nbsp;000; 4 min 40 s</td></tr>
                    <tr><td>Reciclagem orbital (1)</td><td>Reciclador.</td><td>Naves utilitárias 3</td><td>16&nbsp;900; 6 min 40 s</td></tr>
                    <tr><td>Scanner de sistema (5)</td><td>Radar terrestre (nív. 1), Radar espacial e nave radar (nív. 3), Bloqueador de radar e nave bloqueadora (nív. 5).</td><td>—</td><td>2&nbsp;300; 5 min</td></tr>
                    <tr><td>Espionagem (999)</td><td>Uma sonda só traz informações se o seu nível de Espionagem for pelo menos igual ao do proprietário do planeta sondado.</td><td>Scanner de sistema 5</td><td>20&nbsp;000; 1 h</td></tr>
                    <tr><td>Tecnologia hiperespaço (1)</td><td>Viajar para as outras galáxias.</td><td>—</td><td>25&nbsp;000&nbsp;000; 25 h</td></tr>
                </tbody>
            </table>

            <h3>Planetárias</h3>
