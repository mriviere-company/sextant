articles:
    moderation_blocking:
        title: "Moderation: report and block"
        category: "beginner"
        order: 12
        tags: "moderation,report,block,chat,messages,terms"
        summary: "Report an abusive message, block an unwanted player, and review the community rules that everyone accepts on first login."
        related: "salon,account_deletion"
        body: |
            <h2 id="terms">Terms of service</h2>
            <p>On first login, every player accepts the <strong>terms of service</strong> and the community rules: respect other players, no illegal, obscene or defamatory content, no cheating or abusive multi-accounting. If the terms change, they must be accepted again.</p>
            <h2 id="report">Reporting a message</h2>
            <p>Every chat room message and every received private message carries a <strong>flag</strong> icon. Clicking it opens the reason picker: insults or harassment, spam, other inappropriate content. The report goes straight to the moderation team, with a copy of the message.</p>
            <p>A player can also be reported globally from their profile (multi-accounting, cheating, insults, spam). The limit is three reports per day, and the same player can only be reported once.</p>
            <h2 id="block">Blocking a player</h2>
            <p>The <strong>Block</strong> button on a player's profile immediately hides all their messages in chat rooms and prevents any private message exchange, in both directions.</p>
            <p>The blocked-player list is managed in <strong>My options</strong>: anyone can be unblocked there at any time.</p>
    getting_started:
        title: "Getting started"
        category: "beginner"
        order: 1
        tags: "start,begin,new,tutorial,guide"
        summary: "Welcome! The shortest guide to understanding Area Universe and succeeding in your first hours of play."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="what-is-it">What is Area Universe?</h2>
            <p>Area Universe is a <strong>multiplayer space strategy game</strong>. You lead an empire: your planets produce resources, your fleets roam the galaxy, and your alliances shape the fate of players.</p>
            <p>It's a game <strong>played over the long term</strong>: your resources pile up even when you're offline. A few minutes a day is enough to progress.</p>

            <h2 id="goal">Your goal</h2>
            <p>Depending on the server mode (see the <em>Game modes</em> article), the final goal varies: last the longest, dominate the ranking, be the last one standing, etc. But the recipe is always the same:</p>
            <ol>
                <li><strong>Run an economy</strong> (resources + currency).</li>
                <li><strong>Build a fleet and a defense</strong>.</li>
                <li><strong>Make alliances</strong> to weigh in with others.</li>
            </ol>

            <h2 id="first-actions">Your 6 first actions</h2>
            <ol>
                <li><strong>Build a Niobium Mine and a Water Extractor</strong> on your starting planet.</li>
                <li><strong>Add a Farm</strong> to feed your workers.</li>
                <li><strong>Build a City</strong> to increase your worker count — workers are your source of <em>Bitcoins</em> (the game's currency).</li>
                <li><strong>Build a Research Center</strong>, then a <strong>Spaceyard</strong> to build your first ships.</li>
                <li><strong>Send a cargo to sell resources</strong> to a trader: easy money.</li>
                <li><strong>Join an alliance</strong>: you gain <strong>+20% production</strong> and access to alliance researches.</li>
            </ol>

            <h2 id="tutorial">The built-in tutorial</h2>
            <p>An <strong>interactive tutorial</strong> guides you step by step. It's broken into <strong>16 steps</strong> (building, fleets, combat...). Each completed step grants a reward (Bitcoins, Legionnaires, ships...).</p>
            <ul>
                <li>You can <strong>pause</strong> or <strong>resume</strong> it at any time.</li>
                <li>Access it from your <strong>Preferences</strong>.</li>
            </ul>

            <h2 id="watch-out">What to watch from day one</h2>
            <ul>
                <li><strong>Positive Bitcoins</strong>: every day at 18:59 UTC, a balance calculates your income and maintenance costs. If you go negative, it's <strong>Economic Game Over</strong>.</li>
                <li><strong>Storage</strong>: if your warehouses are full, production stops. Build stocks accordingly.</li>
                <li><strong>Daily quests</strong>: 3 quests per day, all completed = <strong>+250 War Points</strong>.</li>
            </ul>

            <h2 id="protection-debutant">Beginner protection</h2>
            <p>During your first days, you are <strong>protected</strong>: no player can attack, raid, invade or bombard you. Plenty of time to build your first bases in peace.</p>
            <p>Protection ends as soon as one of these conditions is met:</p>
            <ul>
                <li><strong>7 days</strong> have passed since your commander was created.</li>
                <li>You own a <strong>4th planet</strong>.</li>
                <li>You send an <strong>offensive mission</strong> yourself (raid, invasion or nuclear attack): you then immediately give up your protection.</li>
            </ul>
            <p>As long as you are protected, you cannot attack others without losing that protection. Take advantage of it to build a solid economy and defense before throwing yourself into battle.</p>

    interface_guide:
        title: "Understanding the interface"
        category: "beginner"
        order: 2
        tags: "interface,screen,menu,navigation,buttons,active planet"
        summary: "The 3 zones of the screen and how to navigate without getting lost."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="layout">The 3 zones of the screen</h2>
            <ul>
                <li><strong>The resource bar, at the top</strong> — your materials, and the name of your <strong>active planet</strong>: tap it to switch planet.</li>
                <li><strong>The menu, on the left</strong> — all sections of the game (Empire, Planets, Fleets, Alliance, Messages...).</li>
                <li><strong>The central area</strong> — content of the current page (map, fleet list, buildings...). It is the only zone that scrolls.</li>
            </ul>
            <p><em>On a phone, the left menu becomes a rail of icons pinned to the left edge: the five main destinations stay visible at all times, and the Menu button opens the rest in a panel that slides up from the bottom.</em></p>

            <h2 id="resource-bar">The resource bar (at the top)</h2>
            <p>It displays your 4 main resources in real time:</p>
            <ul>
                <li><strong>Niobium</strong> — base ore (buildings, ships).</li>
                <li><strong>Water</strong> — essential for construction and ships.</li>
                <li><strong>Food</strong> — feeds your workers, Legionnaires and Mechs.</li>
                <li><strong>Uranium</strong> — rare resource, for nuclear bombs and arena challenges.</li>
            </ul>
            <p>Niobium, water, food and your workers tick up second by second at your production rate, up to your storage cap. Tap a resource to see its hourly production, bonuses included (hero, slave camp, alliance, embargo).</p>
            <p><strong>Bitcoins</strong> (currency) and <strong>War Points (WP)</strong> are also displayed in the resource bar.</p>

            <h2 id="active-planet">Active planet: what it means</h2>
            <p>When you have multiple planets, only one is <strong>active</strong> at a time. All your actions (build, manufacture a ship, launch a fleet) apply to this planet.</p>
            <p>To switch: tap the planet name in the resource bar, then pick from the list that slides up from the bottom.</p>

            <h2 id="navigation">Finding your way around</h2>
            <ul>
                <li><strong>Empire</strong> — overview (all your planets, researches, economy).</li>
                <li><strong>Planet</strong> — construction and management of the active planet.</li>
                <li><strong>Fleets</strong> — create, send and track your ships.</li>
                <li><strong>Map</strong> — explore the galaxy.</li>
                <li><strong>Messages / Reports</strong> — everything the game reports to you (battles, arrivals, alliance...).</li>
                <li><strong>Alliance</strong> — your group, the chat room, diplomacy.</li>
            </ul>

    resources_intro:
        title: "Resources"
        category: "beginner"
        order: 3
        tags: "resources,niobium,water,food,uranium,production,storage,cycle"
        summary: "The 4 game resources, how to produce them, and why storage is critical."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="the-4">The 4 game resources</h2>
            <table>
                <tr><th>Resource</th><th>What it's for</th><th>How to get it</th></tr>
                <tr><td><strong>Niobium</strong></td><td>Build buildings and ships</td><td>Mine</td></tr>
                <tr><td><strong>Water</strong></td><td>Building, manufacturing, upkeep</td><td>Water Extractor</td></tr>
                <tr><td><strong>Food</strong></td><td>Feed workers, Legionnaires and Mechs</td><td>Farm, then Aeroponic Farm</td></tr>
                <tr><td><strong>Uranium</strong></td><td>Nuclear bombs, arena stakes</td><td>Recycling uranium debris, victories against Cthulhu</td></tr>
            </table>

            <h2 id="cycle">The production cycle</h2>
            <p>Your resources arrive automatically, continuously. We call it a <strong>production cycle</strong>: the game's internal tick rate.</p>
            <ul>
                <li>On a <strong>planet</strong>: cycle of <strong>10 minutes</strong>.</li>
                <li>On a <strong>moon</strong>: cycle of <strong>1 minute</strong> (much faster, for food only).</li>
            </ul>
            <p>The higher the level of your Mine / Extractor / Farm, the more produced per cycle.</p>

            <h2 id="bonus">What boosts your production</h2>
            <ul>
                <li><strong>Join an alliance</strong>: <strong>+20%</strong> immediate on all resources.</li>
                <li><strong>Alliance researches</strong>: additional bonuses unlocked by your alliance.</li>
                <li><strong>Terraformation</strong>: more space available for larger buildings.</li>
                <li><strong>Economy Hero</strong> assigned to the planet: production boost.</li>
            </ul>

            <h2 id="storage">Storage (don't overlook it!)</h2>
            <p>Each planet has a <strong>maximum capacity</strong> for each resource. <strong>When it's full, production stops</strong>.</p>
            <p>To increase capacity: build <strong>Niobium Stocks</strong>, <strong>Water Stocks</strong> and <strong>Silos</strong> (food).</p>
            <p><em>Beginner tip:</em> check your storage <strong>before</strong> logging off for the night. Nothing worse than finding your mines idle for 10 hours.</p>

    bitcoin_economy:
        title: "Bitcoins and maintenance"
        category: "beginner"
        order: 4
        tags: "bitcoin,currency,maintenance,cost,economy,game over,daily report"
        summary: "Bitcoin is the game's currency. How to earn it, and how to avoid bankruptcy."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="what-is-it">What is Bitcoin?</h2>
            <p><strong>Bitcoin</strong> is Area Universe's <strong>universal currency</strong> (nothing to do with real crypto, just a wink). It's used to:</p>
            <ul>
                <li>Launch <strong>researches</strong>.</li>
                <li>Recruit <strong>Legionnaires</strong> and <strong>scientists</strong>.</li>
                <li>Fund the <strong>alliance</strong> (treasury).</li>
                <li>Pay the <strong>daily maintenance</strong> of your troops, ships and buildings.</li>
            </ul>

            <h2 id="earn">How to earn it</h2>
            <ul>
                <li><strong>Workers</strong> — main source. Every day, they generate income proportional to their count.</li>
                <li><strong>Sales to traders</strong> — send a cargo with niobium and water to a trader.</li>
                <li><strong>Daily quests</strong> — some reward Bitcoins.</li>
                <li><strong>Login bonus</strong> — a sum at each first login of the day, multiplied if you chain consecutive days.</li>
                <li><strong>Looting</strong> — raids can yield niobium and water, which you can resell.</li>
            </ul>

            <h2 id="maintenance">Daily maintenance</h2>
            <p>Every day at <strong>18:59 UTC</strong>, the game computes your balance:</p>
            <ul>
                <li><strong>Income</strong>: what your workers brought in.</li>
                <li><strong>Costs</strong>: maintenance of your Legionnaires, Mechs, ships and buildings.</li>
                <li><strong>Balance</strong>: income − costs, added to (or deducted from) your total.</li>
            </ul>
            <p>Units on mission (fleets in flight, ships in combat) <strong>cost more</strong> than stationed ones. A large army on permanent patrol will ruin even the most careful players.</p>

            <h2 id="bankruptcy">Warning: Economic Game Over</h2>
            <p>If, after this daily balance, your Bitcoin total drops <strong>below zero</strong>, it's <strong>Economic Game Over</strong>:</p>
            <ul>
                <li>All your flying fleets are <strong>destroyed</strong>.</li>
                <li>Your balance is reset to <strong>125,000 Bitcoins</strong>.</li>
                <li>Some researches and progressions are reduced.</li>
            </ul>
            <p><em>Golden rule:</em> don't recruit an army more expensive than your workers can fund.</p>

    first_buildings:
        title: "Build your first buildings"
        category: "beginner"
        order: 5
        tags: "buildings,construction,mine,extractor,farm,beginner,slot"
        summary: "The recommended build order to start your first planet right."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="order">Recommended order (first 10 buildings)</h2>
            <ol>
                <li><strong>Niobium Mine</strong> — your first source of raw material.</li>
                <li><strong>Water Extractor</strong> — essential for all construction behind.</li>
                <li><strong>Farm</strong> — feeds your workers and Legionnaires.</li>
                <li><strong>City</strong> — increases max workers (+25,000).</li>
                <li><strong>Niobium Mine and Water Extractor level 2</strong> — scale production before going further.</li>
                <li><strong>Research Center</strong> — lets you run researches (technologies).</li>
                <li><strong>Spaceyard</strong> — to build your first ships.</li>
                <li><strong>Barracks</strong> — to recruit defense Legionnaires.</li>
                <li><strong>Stocks</strong> (niobium, water, silos) — avoid production saturation.</li>
                <li><strong>Metropolis</strong> — next step after City for a real population boost (+80,000 workers).</li>
            </ol>

            <h2 id="queue">Only one construction at a time</h2>
            <p>Each planet has <strong>a single construction queue</strong>. While a building is leveling up, others must wait. Plan accordingly.</p>
            <p>Multiple planets = multiple parallel queues: this is why colonization accelerates your progress.</p>

            <h2 id="space">Space available on a planet</h2>
            <p>Each planet has limited <strong>ground slots</strong> (terrestrial buildings) and <strong>sky slots</strong> (orbital islands, defenses).</p>
            <ul>
                <li>Available slots are shown at the top of the Planet page.</li>
                <li>The <strong>Terraformation</strong> research expands your planets.</li>
                <li>No space = no new buildings (but you can still level up existing ones).</li>
            </ul>

    first_fleet:
        title: "Create your first fleet"
        category: "beginner"
        order: 6
        tags: "fleet,ships,first,creation,beginner,spaceyard,cargo,probe"
        summary: "Build a ship, assemble a fleet, and send it to destination: the step-by-step."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequisites">What you need first</h2>
            <ul>
                <li>A <strong>Spaceyard</strong> built on your planet.</li>
                <li>Enough niobium and water to pay for the ships.</li>
                <li>(Optional) a <strong>Research</strong> that unlocks the ship (e.g. <em>Utility</em> research for cargos).</li>
            </ul>

            <h2 id="build">Step 1 — Build ships</h2>
            <p>Go to the <strong>Space</strong> page (left menu). You'll see the list of available ships. Click the one you want, pick a quantity, start production.</p>
            <p>Building takes time: you can keep playing meanwhile.</p>

            <h2 id="assemble">Step 2 — Assemble and send a fleet</h2>
            <ol>
                <li>Go to the <strong>Fleets</strong> page.</li>
                <li>Select which ships to board (available stock is shown).</li>
                <li>Choose a <strong>destination</strong> in format <code>Galaxy:Sector:Position</code> (e.g. <code>1:5:12</code>). You can also click directly from the Map.</li>
                <li>Choose the <strong>mission type</strong> (see the <em>Mission types</em> article).</li>
                <li>Confirm. Fuel (water) is deducted automatically.</li>
            </ol>

            <h2 id="first-ships">Good ships to start with</h2>
            <ul>
                <li><strong>Cargo I</strong> — resource transport (3,000 capacity). Essential for selling to traders.</li>
                <li><strong>Probe</strong> — spies on enemy planets. Send <em>before</em> any attack.</li>
                <li><strong>Fighter</strong> — first combat ship, cheap.</li>
                <li><strong>Recycler</strong> — collects debris after a battle. Very profitable.</li>
            </ul>

            <h2 id="first-target">First mission idea</h2>
            <p>Send 1 cargo filled with niobium/water on a <strong>Deliver mission</strong> to a trader (position 15 of a sector). The trader pays you in Bitcoins and the cargo returns on its own.</p>

    first_combat:
        title: "Your first combat"
        category: "beginner"
        order: 7
        tags: "combat,first,attack,report,beginner,rounds"
        summary: "How to trigger a space battle, what happens during, and what to do afterward."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="prepare">Prepare (important!)</h2>
            <ol>
                <li><strong>Send a probe</strong> on the target to assess its defenses. Losing 10 fighters blindly is throwaway; losing 100 hurts.</li>
                <li><strong>Compose an appropriate fleet</strong>: enough firepower, and think about adding a <strong>recycler</strong> to collect debris.</li>
                <li><strong>Check your maintenance</strong>: a large fleet is expensive while on mission.</li>
            </ol>

            <h2 id="sequence">What happens step by step</h2>
            <ol>
                <li><strong>You launch the fleet</strong> on a <em>Normal</em> mission (attack) on an enemy's coordinates.</li>
                <li><strong>It travels</strong> — the travel time is shown on the Fleets page. You can recall it before arrival.</li>
                <li><strong>Arrival</strong>: if there are enemy fleets on site, combat is triggered automatically.</li>
                <li><strong>Round-based combat</strong>: both sides exchange fire turn by turn (up to 100 turns max). Shields absorb first.</li>
                <li><strong>End of combat</strong>: one side is wiped out, or 100 turns are reached (in which case, <strong>the defender wins</strong>).</li>
            </ol>

            <h2 id="after">After the fight</h2>
            <ul>
                <li>A <strong>combat report</strong> is sent to you (Messages / Reports page).</li>
                <li>Destroyed ships leave <strong>debris</strong> on site. Send recyclers!</li>
                <li>The winner earns <strong>War Points (WP)</strong> proportional to losses inflicted.</li>
                <li>Your surviving fleet returns automatically to its starting planet.</li>
            </ul>

            <h2 id="mistakes">Classic mistakes to avoid</h2>
            <ul>
                <li>Attacking without probing first.</li>
                <li>Forgetting the 100-round rule, in favor of the defender (attacking too tough a target = automatic defeat).</li>
                <li>Not sending a recycler: your opponents will grab <em>your</em> debris before you.</li>
            </ul>

    tips:
        title: "Tips for a good start"
        category: "beginner"
        order: 8
        tags: "tips,advice,strategy,beginner"
        summary: "15 tips that make all the difference in your first days."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economy">Economy</h2>
            <ul>
                <li><strong>Maximize your workers</strong>: your main source of Bitcoins.</li>
                <li><strong>Don't build a big army too soon</strong>: maintenance will ruin you.</li>
                <li><strong>Build Cities then Metropolises</strong> to grow population.</li>
                <li><strong>Watch your daily report</strong>: if costs exceed income, react immediately.</li>
                <li><strong>Sell your surplus to traders</strong> rather than let storage saturate.</li>
            </ul>

            <h2 id="military">Military</h2>
            <ul>
                <li><strong>Always a defense on each planet</strong>: Legionnaires in barracks, Mechs, one or two turrets.</li>
                <li><strong>Customize your ships daily</strong>: 40 free points to distribute (armor, accuracy, weapons).</li>
                <li><strong>Recyclers are very profitable</strong>: after each battle, collect debris.</li>
                <li><strong>Probe before attacking</strong>: a probe costs next to nothing, a lost fleet costs a lot.</li>
                <li><strong>Beware the 100-round threshold</strong>: if you don't wipe out the defender in 100 rounds, you lose.</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Join an alliance quickly</strong>: +20% production, access to diplomacy and alliance researches.</li>
                <li><strong>Complete your 3 daily quests</strong>: that's <strong>+250 WP</strong> at stake, every day.</li>
                <li><strong>Chat in the alliance room</strong>: two coordinated attacks beat one solo attempt.</li>
                <li><strong>Log in every day</strong>: the login bonus skyrockets with the 7-day consecutive streak.</li>
                <li><strong>Enable push notifications</strong>: you'll know as soon as an enemy fleet is heading your way.</li>
            </ul>

    reports:
        title: "Game reports"
        category: "beginner"
        order: 9
        tags: "report,notification,combat,espionage,alliance,colonization,messages"
        summary: "The game sends you reports for every important event. Where to find them, what they contain."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="where">Where to find your reports</h2>
            <p>Click on <strong>Messages</strong> in the left menu. You'll find all received reports, sorted by type. A colored dot marks unread messages.</p>
            <p>You can also enable <strong>push notifications</strong> to get an alert on your phone or browser (see the dedicated article).</p>

            <h2 id="combat">Combat reports</h2>
            <ul>
                <li><strong>Space combat</strong> — one of your fleets ran into an enemy fleet.</li>
                <li><strong>Orbital combat</strong> — your planetary defenses repelled (or not) an attacker.</li>
                <li><strong>Planetary defenses</strong> — dedicated report for a planet owner who fielded no fleet of their own in a merged battle: whether the defenses held or were wiped out.</li>
                <li><strong>Raid</strong> — looting suffered or inflicted.</li>
                <li><strong>Invasion</strong> — attempt to take a planet (either side).</li>
                <li><strong>Nuclear</strong> — bomb sent or received.</li>
                <li><strong>Embargo</strong> — hourly update if one of your planets is under siege.</li>
            </ul>

            <h2 id="cthulhu">Cthulhu reports</h2>
            <ul>
                <li><strong>Cthulhu attack</strong> — Cthulhu horde against your planet.</li>
                <li><strong>Tower Defense</strong> — victory or defeat of your active defense.</li>
                <li><strong>Planet liberation</strong> — planet retaken from the Cthulhu.</li>
            </ul>

            <h2 id="fleet">Fleet reports</h2>
            <ul>
                <li><strong>Fleet arrival</strong> — your fleet has reached its destination.</li>
                <li><strong>Resource drop</strong> — an ally sent you something.</li>
                <li><strong>Recycling complete</strong> — your recyclers finished their work.</li>
                <li><strong>Espionage</strong> — result of a probe sent (or probe detected at your place).</li>
            </ul>

            <h2 id="alliance">Alliance reports</h2>
            <ul>
                <li><strong>Diplomacy</strong> — war declaration, pact proposal, peace accepted, a non-aggression pact or defensive alliance broken, a peace agreement expiring.</li>
                <li><strong>Members</strong> — arrival, departure, kick, Game Over of a comrade.</li>
            </ul>

            <h2 id="misc">Other reports</h2>
            <ul>
                <li><strong>Daily report</strong> — your daily economic balance (18:59 UTC).</li>
                <li><strong>Colonization</strong> — new planet founded.</li>
                <li><strong>Trader sale</strong> — your resources were bought.</li>
                <li><strong>Login bonus</strong> — Bitcoins of the day received.</li>
                <li><strong>Prison</strong> — hero captured or freed.</li>
            </ul>
            <h2 id="compte-valide">Account to validate</h2>
            <p>⚠️ To <strong>send a message or Bitcoins</strong> to another player, your account must be <strong>validated</strong> (login created) and your <strong>email confirmed</strong>. Test/anonymous accounts are blocked — confirm your email from <strong>My options</strong>.</p>

    cthulhu_prophecies:
        title: "The Cthulhu Prophecies"
        category: "events"
        order: 5
        tags: "cthulhu,prophecy,blockade,threat,event,alliance,war points,bitcoin,trader,recycling,ranking"
        summary: "When the server's threat gauge hits its threshold, the Possessed announce a prophecy: 48 hours later, their hordes blockade trade across the whole server. How to read the gauge, break a blockade as a group, and what failure costs."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="what-is-it">What is a prophecy?</h2>
            <p>A <strong>server-wide threat pool</strong> — separate from your own personal threat level against the Cthulhu — climbs automatically, day after day. When it hits its threshold, the <strong>Possessed</strong> post a <strong>dated prophecy</strong> in the public chat: a <strong>blockade</strong> will fall on the whole server within the coming hours. The prophecy also spells out what's at stake if nobody reacts.</p>

            <h2 id="gauge">Reading the server's threat gauge</h2>
            <ul>
                <li>It's visible on the <strong>Cthulhu page</strong> (the Tower Defense one) and progresses independently of your own fights.</li>
                <li>It climbs by <strong>100 points a day</strong>; the threshold that triggers a prophecy is reached in <strong>about a week</strong>.</li>
                <li>The <strong>Possessed</strong> post a <strong>daily bulletin</strong> in the public chat with the current level, so you can see it coming.</li>
                <li>A server's first event can't happen before its <strong>first two weeks</strong> of existence.</li>
                <li>Never two prophecies (or two blockades) at once on the same server: the gauge only starts climbing again once the previous event is over.</li>
            </ul>

            <h2 id="prophecy">The announcement</h2>
            <p>Once the threshold is crossed, the Possessed post their prophecy in chat: the deadline falls <strong>~48 hours later</strong>. The message spells out exactly what's at stake — the blockade, the tithe, the alliance ranking, the fate of debris fields — no hidden rules discovered after the fact.</p>

            <h2 id="blockade">The blockade</h2>
            <p>When the deadline hits, a <strong>Cthulhu horde</strong> takes position in orbit of <strong>every trader</strong> and <strong>every asteroid</strong> on the server:</p>
            <ul>
                <li><strong>No selling</strong> to any blockaded trader.</li>
                <li><strong>No recycling</strong> at any blockaded asteroid.</li>
                <li>Elsewhere in the universe, <strong>debris fields stay recyclable as usual</strong>, just like after any other fight.</li>
                <li>On a blockaded target, though, <strong>wreckage from your own assaults piles up on site and stays out of reach as long as the horde guarding it is alive</strong>. Destroy that horde and <strong>this target reopens at once</strong>, without waiting for the fate of the blockade on the rest of the server: selling or recycling resumes there, and recyclers already in orbit get back to work on their own.</li>
                <li>Nothing to do with the siege or famine an enemy fleet can impose on a player's planet: here, only trade and recycling stop.</li>
                <li>The blockade lasts at most <strong>48 hours</strong>.</li>
            </ul>

            <h2 id="breaking">Breaking a blockade as a group</h2>
            <p>Not every horde is the same. The ones guarding the <strong>traders</strong> are sized well above the strongest fleet power on the server (player or bot): nobody breaks those alone. The <strong>asteroid</strong> garrisons are far lighter and stay within reach of a single big fleet — and they make up most of the count. Either way, a <strong>coalition</strong> hitting the same horde over successive assaults will bring it down.</p>
            <p>Damage a horde has taken <strong>never regenerates</strong> between fights: every assault, even a losing one, weakens it for the next. Focus your strikes on the same horde instead of spreading them thin across several.</p>

            <h2 id="rewards">Rewards</h2>
            <p>Every point of damage dealt to a horde is <strong>paid out in Bitcoin and War Points</strong> when the event is resolved — win or lose, no assault goes to waste.</p>
            <p>The blockade is declared <strong>broken</strong> as soon as <strong>70% of the server's hordes have been destroyed before the deadline</strong>, traders and asteroids alike: the reward rate is then <strong>doubled</strong> for every contributor. An individual report details your damage dealt and your reward at the end of the event. While the blockade is active, the <strong>Cthulhu page</strong> shows live progress: hordes destroyed, the objective to reach and the time remaining.</p>

            <h2 id="cost-of-failure">The cost of failure</h2>
            <p>If the blockade <strong>expires without being broken</strong>:</p>
            <ul>
                <li><strong>Every player loses half of their Bitcoin</strong> — the Possessed collect their tithe. Players under <strong>beginner protection</strong> and players in game over are spared.</li>
                <li><strong>Every combat debris field in the universe is devoured</strong> by the Cthulhu; <strong>asteroids</strong> are left untouched.</li>
                <li>The <strong>bitcoin treasury of every alliance</strong> with at least one human player also loses half of its contents: depositing your Bitcoin in the treasury before the deadline protects nothing. The levy shows up in the treasury history.</li>
                <li>The <strong>bottom 3 alliances in the ranking</strong> also lose production for 72 hours (see below).</li>
            </ul>
            <p>Each affected player receives a report detailing the Bitcoin lost. These stakes are always announced in the prophecy — no hidden rule.</p>

            <h2 id="alliance-ranking">The alliance ranking</h2>
            <p>During the blockade, every alliance is ranked on what it does against the hive. The <strong>Cthulhu page</strong> shows the live ranking, along with what your alliance would win or lose if the blockade ended now.</p>
            <ul>
                <li><strong>Points</strong>: damage dealt to a <strong>wall fleet</strong> counts double; damage dealt to the hive elsewhere (base sieges, hordes) counts once; each <strong>Tower Defense victory</strong> is worth as much as destroying a quarter of an asteroid wall.</li>
                <li><strong>Points per member</strong>: the score is divided by the number of active members (logged in within the last 7 days, outside beginner protection). A beginner's damage still counts: recruiting never lowers the score.</li>
                <li><strong>Membership is frozen</strong> when the blockade starts: switching alliance during the event moves neither the points, nor the bonus, nor the penalty.</li>
                <li>An alliance needs at least <strong>2 active members</strong> to be ranked. <strong>Players without an alliance</strong> are never affected.</li>
            </ul>
            <p><strong>Blockade broken</strong>: the top 3 alliances gain <strong>+15%, +10% and +5% production</strong> for 72 hours, provided they scored points. No alliance is penalized.</p>
            <p><strong>Blockade endured</strong>: the bottom 3 alliances lose <strong>15%, 10% and 5% production</strong> for 72 hours, on top of the tithe. Never more than half of the ranked alliances are hit, and an alliance that made the minimum effort (the equivalent of half an asteroid wall destroyed, or two Tower Defense victories, per active member) is spared, even in last place.</p>
            <p>Every member receives a report explaining their alliance's bonus or penalty and when it ends. The Possessed announce the start of the blockade in chat, post a reminder 6 hours before the deadline, then name the alliances rewarded or punished.</p>

            <h2 id="tips">In practice</h2>
            <ul>
                <li>Watch the Possessed's <strong>daily bulletin</strong>: it gives you a sense of how much time is left before the threshold.</li>
                <li>As soon as a <strong>prophecy</strong> is announced, warn your alliance: you have <strong>48 hours</strong> to organize before the blockade falls.</li>
                <li>Concentrate assaults on the same hordes rather than spreading them out: damage persists, so finishing one off beats scratching several.</li>
                <li>Even a losing assault pays something: don't wait until victory is certain to attack.</li>
                <li>Not enough fleet to attack a wall? A <strong>Tower Defense victory</strong> during the blockade also earns points for your alliance.</li>
            </ul>

    notifications:
        title: "Push notifications"
        category: "beginner"
        order: 10
        tags: "notification,push,alert,mobile,browser,preference"
        summary: "Get an alert on mobile or browser as soon as an important event happens in your empire."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principle">What's the point?</h2>
            <p>Area Universe runs continuously: enemy fleets can arrive while you're at work. <strong>Push notifications</strong> alert you in real time on your phone or browser, so you can react in time.</p>

            <h2 id="events">What you can receive</h2>
            <ul>
                <li><strong>Research complete</strong> — a technology has just finished.</li>
                <li><strong>Building complete</strong> — your build queue is empty.</li>
                <li><strong>Production complete</strong> — your ships or turrets are ready.</li>
                <li><strong>Fleet arrived</strong> — your fleet is on site.</li>
                <li><strong>Fleet in combat</strong> — a space battle is about to trigger.</li>
                <li><strong>Enemy fleet approaching</strong> — someone is heading for one of your planets.</li>
                <li><strong>Planet under attack</strong> — ground invasion in progress.</li>
                <li><strong>Planet under embargo</strong> — one of your planets is under siege.</li>
                <li><strong>Nuclear strike received</strong> — a bomb has hit you.</li>
                <li><strong>Alliance at war</strong> — war declaration involving your alliance.</li>
                <li><strong>Private / alliance message</strong> — new message received.</li>
                <li><strong>Hero captured / freed</strong> — prison event.</li>
                <li><strong>Cthulhu attack</strong> — Cthulhu horde on your planet.</li>
            </ul>
            <p>You can enable each type <strong>individually</strong> according to what interests you.</p>

            <h2 id="activation">How to activate</h2>
            <ol>
                <li>Open your <strong>Preferences</strong> (profile menu).</li>
                <li><strong>Notifications</strong> tab.</li>
                <li>Accept the permission request from your browser or phone.</li>
                <li>Check the types that interest you.</li>
            </ol>
            <p>A <em>Disable all</em> button cuts everything off in one click.</p>

            <h2 id="compatibility">Where it works</h2>
            <ul>
                <li><strong>Mobile app</strong>: native Android and iOS.</li>
                <li><strong>Browser</strong>: Chrome, Firefox, Edge, Safari desktop. For Safari iOS, add the site to your home screen (iOS 16.4+).</li>
                <li><strong>Multi-device</strong>: if you're logged in on phone + PC, both ring.</li>
            </ul>

            <h2 id="troubleshooting">Browser refusing to register?</h2>
            <p>On <strong>Brave</strong>, Google's push service is disabled by default. Open <code>brave://settings/privacy</code>, enable <strong>“Use Google services for push messaging”</strong>, then restart the browser completely. On other browsers, make sure no VPN, antivirus or filtering DNS is blocking the notification service.</p>

            <h2 id="mobile">On the mobile app</h2>
            <p>On Android and iOS, the <strong>Notifications</strong> page has a "Notifications for this device" section: enable or disable your phone's push notifications at any time. If they are blocked, a button opens the phone settings directly. Your per-type notification preferences apply to all your devices.</p>

            <h2 id="discord">On Discord</h2>
            <p>If your Discord account is linked (<strong>My options</strong>), the <strong>Enemy fleet approaching</strong> alert also reaches you as a Discord direct message, with the arrival time and a link to the planet. At most one message per planet every 30 minutes: a multi-fleet attack does not flood you. You must be a member of the <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area Universe Discord</a> and accept direct messages from its members. The option is on by default and can be turned off in the <strong>Discord</strong> section of the notification preferences.</p>

    glossary:
        title: "Glossary"
        category: "beginner"
        order: 11
        tags: "glossary,terms,definitions,vocabulary,abbreviations"
        summary: "All game terms and abbreviations, explained in one sentence."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">All game terms</h2>
            <table>
                <tr><th>Term</th><th>Definition</th></tr>
                <tr><td><strong>Barge</strong></td><td>Troop landing ship for raids and invasions.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Main currency of the game. Generated by your workers.</td></tr>
                <tr><td><strong>Block</strong></td><td>Automatic grouping of allied fleets during a space battle.</td></tr>
                <tr><td><strong>Bunker</strong></td><td>Defensive building. Raises Legionnaire cap and protects part of your resources from raids.</td></tr>
                <tr><td><strong>DF</strong></td><td>Debris Field: the wreckage left after a battle, recyclable.</td></tr>
                <tr><td><strong>Spaceyard</strong></td><td>Building that produces ships.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>The hostile creatures (formerly "zombies"). Appear in PvE mode and on alien planets.</td></tr>
                <tr><td><strong>Cycle</strong></td><td>Internal production rhythm. 10 min for a planet, 1 min for a moon.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Alliance alert level. The lower the number, the tenser the situation.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Siege of a planet by an enemy fleet in orbit. Triggers a famine.</td></tr>
                <tr><td><strong>Maintenance</strong></td><td>Daily Bitcoin cost of your troops, ships and buildings.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>End of game: economic bankruptcy, or loss of all your planets.</td></tr>
                <tr><td><strong>Economic Game Over</strong></td><td>Your Bitcoin balance went negative after the daily report.</td></tr>
                <tr><td><strong>Hero</strong></td><td>Your unique character. Evolves, fights, and can be captured.</td></tr>
                <tr><td><strong>Trader</strong></td><td>NPC on the map that buys your resources for Bitcoins.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Rare ship that creates a moon on a debris field (empty slot, min. 2M niobium and 2M water).</td></tr>
                <tr><td><strong>Mothership</strong></td><td>Large flagship. Slightly slows the fleet.</td></tr>
                <tr><td><strong>WP</strong></td><td>War Points. Earned in combat, used for researches and ranking.</td></tr>
                <tr><td><strong>Active planet</strong></td><td>Currently selected planet. All your actions apply to it.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Non-Player Character: traders, aliens, Cthulhu, AI bots.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Ground attack to loot a planet's resources (not to conquer).</td></tr>
                <tr><td><strong>Daily report</strong></td><td>Daily balance computed at 18:59 UTC: income, costs, net balance.</td></tr>
                <tr><td><strong>Recycler</strong></td><td>Ship that picks up debris (DF) after a battle.</td></tr>
                <tr><td><strong>Round</strong></td><td>Combat turn. Max 100 in space combat, max 10 in ground combat.</td></tr>
                <tr><td><strong>Probe</strong></td><td>Small espionage ship. Send before any attack.</td></tr>
                <tr><td><strong>Fleet size</strong></td><td>Overall indicator of your fleet's mass. Bigger = more fuel consumption.</td></tr>
                <tr><td><strong>Terraformation</strong></td><td>Research that expands a planet's buildable size.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Active defense mini-game against Cthulhu hordes.</td></tr>
                <tr><td><strong>Worker</strong></td><td>Population unit. Produces Bitcoins daily. Defends in invasion.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>16-step guided mode to learn the game, accessible from Preferences.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Player designated as priority target in Search &amp; Destroy mode.</td></tr>
            </table>

    resources:
        title: "Resources in detail"
        category: "economy"
        order: 1
        tags: "resources,niobium,water,food,uranium,production,storage,cycle,rations"
        summary: "Everything about resources: production, bonuses, storage and the special case of uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="reminder">Reminder: the 4 resources</h2>
            <ul>
                <li><strong>Niobium</strong> — construction.</li>
                <li><strong>Water</strong> — construction + fleet fuel.</li>
                <li><strong>Food</strong> — maintenance of workers, Legionnaires, Mechs.</li>
                <li><strong>Uranium</strong> — nuclear weapons, arena stakes. Rare and precious.</li>
            </ul>

            <h2 id="production">How production is calculated</h2>
            <p>Each planet runs on a <strong>10-minute cycle</strong>. Every cycle, you receive a fixed amount depending on:</p>
            <ul>
                <li>the <strong>level</strong> of your producing building (Mine, Extractor, Farm);</li>
                <li>the <strong>size</strong> of the planet (terraformation);</li>
                <li>your <strong>bonuses</strong> (alliance, researches, hero).</li>
            </ul>
            <p><strong>Moons</strong> produce food <strong>10 times faster</strong> (1-minute cycle).</p>
            <p>Even <strong>without a producing building</strong> — or if you destroy it down to level 0 — a planet keeps a <strong>minimum base production</strong>: <strong>7 Niobium, 6 Water and 9 Food</strong> per cycle. From level 1, the building's production (always higher) takes over.</p>
            <p>For food, the <strong>Agricultural field</strong> and the <strong>Aeroponic farm</strong> <strong>add up</strong>: their outputs are combined.</p>

            <h2 id="bonus">What increases your production</h2>
            <table>
                <tr><th>Source</th><th>Effect</th></tr>
                <tr><td>Alliance membership</td><td>+20% base</td></tr>
                <tr><td>Alliance production researches</td><td>Additional bonus growing with research level</td></tr>
                <tr><td>Planet terraformation</td><td>More space = better buildings</td></tr>
                <tr><td>Economy Hero on the planet</td><td>Production boost (doubles other bonuses)</td></tr>
                <tr><td>Special events</td><td>Temporary boosts during a server event</td></tr>
            </table>

            <h2 id="storage">Storage and its traps</h2>
            <p>Your planet has a <strong>maximum capacity</strong> for each resource. When full, production stops — the resource keeps being "produced" but is lost.</p>
            <p>Solutions: build <strong>Stocks</strong> (Niobium, Water, Silos), sell the surplus to traders, or send excess to an ally.</p>

            <p>Food travels like niobium and water: load <strong>rations</strong> into a fleet's cargo hold (1 slot per ration) to resupply another planet. On unloading, the granary never exceeds its capacity: the surplus stays in the hold.</p>

            <h2 id="uranium">Uranium: the special case</h2>
            <p>No building produces uranium. You get it by:</p>
            <ul>
                <li><strong>recycling</strong> uranium debris on the map (marked by their special icon);</li>
                <li><strong>defeating Cthulhu</strong> (PvE missions);</li>
                <li><strong>winning arena challenges</strong> with uranium stake.</li>
            </ul>
            <p>Uranium is used to build <strong>nuclear bombs</strong> and stake in the <strong>arena</strong>.</p>

    buildings:
        title: "Buildings"
        category: "economy"
        order: 2
        tags: "buildings,construction,mine,extractor,farm,city,spaceyard,bunker,turret"
        summary: "Full catalog of buildings by role: production, storage, population, military, defense."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Resource production</h2>
            <table>
                <tr><th>Building</th><th>Produces</th><th>Note</th></tr>
                <tr><td>Niobium Mine</td><td>Niobium</td><td>First to build.</td></tr>
                <tr><td>Water Extractor</td><td>Water</td><td>Essential for everything.</td></tr>
                <tr><td>Farm</td><td>Food</td><td>To feed workers and Legionnaires.</td></tr>
                <tr><td>Aeroponic Farm</td><td>Food (advanced)</td><td>More efficient than the Farm. Unlocked by research.</td></tr>
            </table>

            <h2 id="storage">Storage</h2>
            <table>
                <tr><th>Building</th><th>Role</th></tr>
                <tr><td>Niobium Stock</td><td>Increases niobium capacity.</td></tr>
                <tr><td>Water Stock</td><td>Increases water capacity.</td></tr>
                <tr><td>Silos</td><td>Increases food capacity.</td></tr>
            </table>

            <h2 id="population">Population and science</h2>
            <table>
                <tr><th>Building</th><th>Role</th></tr>
                <tr><td>City</td><td>+25,000 max workers per level.</td></tr>
                <tr><td>Metropolis</td><td>+80,000 max workers per level.</td></tr>
                <tr><td>Research Center</td><td>Lets you run researches and speeds them up.</td></tr>
            </table>

            <h2 id="military">Military and ship production</h2>
            <table>
                <tr><th>Building</th><th>Role</th></tr>
                <tr><td>Barracks</td><td>+5,000 max Legionnaires per level.</td></tr>
                <tr><td>Bunker</td><td>+15,000 max Legionnaires, and <strong>protects part of your resources</strong> from raids (5% per level).</td></tr>
                <tr><td>Nuclear Base</td><td>Lets you build nuclear bombs (uranium required).</td></tr>
                <tr><td>Spaceyard</td><td>Builds utility ships (cargo, probe, recycler...) and speeds up production of all ships (+25% per level).</td></tr>
                <tr><td>Light Factory</td><td>Builds light ships (fighters, corvettes) and speeds up ship production (+40%/level) <strong>and defense production</strong> (+40%/level).</td></tr>
                <tr><td>Heavy Factory</td><td>Builds heavy ships (frigates, battleships, destroyers) and speeds up ship production (+60%/level) <strong>and defense production</strong> (+60%/level).</td></tr>
                <tr><td>Prison</td><td>Locks up captured heroes.</td></tr>
                <tr><td>Slave Camp</td><td>Alternative to Prison. Puts captured heroes to work.</td></tr>
            </table>

            <h2 id="orbital">Defense and orbital installations (in sky)</h2>
            <table>
                <tr><th>Building / Installation</th><th>Role</th></tr>
                <tr><td>Orbital Island</td><td>Adds sky slots to place turrets/shields.</td></tr>
                <tr><td>Space Base</td><td>Armor bonus to orbital defenses.</td></tr>
                <tr><td>Shield / Great Shield</td><td>Absorbs damage before defenses are hit.</td></tr>
                <tr><td>Turrets (missile, laser, Gauss, plasma...)</td><td>Defend your planet against fleets in attack mode.</td></tr>
            </table>

            <h2 id="detection">Detection and jamming</h2>
            <table>
                <tr><th>Building</th><th>Role</th></tr>
                <tr><td>Radar</td><td>Detects incoming fleets.</td></tr>
                <tr><td>Sky Radar</td><td>Orbital version of the radar, extended range.</td></tr>
                <tr><td>Sky Jammer</td><td>Jams enemy detection: your movements become invisible.</td></tr>
            </table>

            <h2 id="file-production">Managing the production queue</h2>
            <p>Building, ship (Spaceyard) and defense constructions go through a <strong>queue</strong> that you can manage:</p>
            <ul>
                <li><strong>Reorder</strong> the pending items (drag and drop) to prioritize what matters.</li>
                <li><strong>Cancel</strong> a pending item: you are <strong>refunded pro rata</strong> for what hasn't been produced yet.</li>
                <li>The current queue shows at the top of each production page, below the title.</li>
                <li>The queue is capped at <strong>15 pending items</strong> (in addition to the one currently in progress): beyond that, a message tells you to wait for a construction to finish or to cancel one before adding a new one.</li>
                <li>The <strong>Floating city</strong> (+10&nbsp;ground/level) and the <strong>Orbital station</strong> (+5&nbsp;sky/level) are capped at <strong>5 each per planet</strong>.</li>
            </ul>

    research:
        title: "Research and technologies"
        category: "economy"
        order: 3
        tags: "research,technology,science,bitcoin,unlock,tech tree"
        summary: "Technologies that unlock ships, bonuses and new abilities. How to prioritize."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="how">How it works</h2>
            <p>Researches launch from the <strong>Research Center</strong>. Each research:</p>
            <ul>
                <li>costs <strong>Bitcoins</strong>;</li>
                <li>takes <strong>time</strong> (a few minutes to several hours depending on level);</li>
                <li>may have a <strong>prerequisite</strong> (another research at a certain level).</li>
            </ul>
            <p>Recruiting <strong>scientists</strong> speeds up your ongoing researches.</p>

            <h2 id="beginner-priority">Priorities for a beginner</h2>
            <ol>
                <li><strong>Utility</strong> — unlocks cargos, probes, recyclers.</li>
                <li><strong>Industry</strong> — more resource production.</li>
                <li><strong>Demographics</strong> — more workers (so more Bitcoins).</li>
                <li><strong>Barge</strong> and <strong>Recycler</strong> — essential for attacking and recycling.</li>
                <li><strong>Weapons / Armor</strong> — before any real combat.</li>
            </ol>

            <h2 id="researches">Full research list</h2>
            <table>
                <tr><th>Research</th><th>Effect</th><th>Max level</th></tr>
                <tr><td>Utility</td><td>Unlocks cargos, probes, recycler, etc.</td><td>3</td></tr>
                <tr><td>Terraformation</td><td>Expands buildable planet size.</td><td>18</td></tr>
                <tr><td>Expansion</td><td>Increases the number of colonizable planets.</td><td>2</td></tr>
                <tr><td>Industry</td><td>Resource production bonus.</td><td>5</td></tr>
                <tr><td>Demographics</td><td>Increases worker production.</td><td>5</td></tr>
                <tr><td>Discipline</td><td>Strengthens ground Legionnaires.</td><td>3</td></tr>
                <tr><td>Barbed Wire</td><td>Ground defense bonus.</td><td>5</td></tr>
                <tr><td>Armored units</td><td>Unlocks Mechs.</td><td>1</td></tr>
                <tr><td>Weapons</td><td>Increases ship damage.</td><td>5</td></tr>
                <tr><td>Missile</td><td>Missile faction (bonus vs lasers).</td><td>3</td></tr>
                <tr><td>Laser</td><td>Laser faction (bonus vs plasma).</td><td>3</td></tr>
                <tr><td>Plasma</td><td>Plasma faction (bonus vs missiles).</td><td>3</td></tr>
                <tr><td>Hyperspace</td><td>Enables inter-galaxy travel.</td><td>1</td></tr>
                <tr><td>Wave</td><td>Improves radars and comms. Prerequisite of other researches.</td><td>5</td></tr>
                <tr><td>Espionage</td><td>Improves probe range (prerequisite: Wave level 5).</td><td>999</td></tr>
                <tr><td>Cargo</td><td>Increases cargo capacity.</td><td>5</td></tr>
                <tr><td>Barge</td><td>Unlocks barges (troop transport).</td><td>1</td></tr>
                <tr><td>Recycler</td><td>Unlocks the recycler.</td><td>1</td></tr>
                <tr><td>Light Ship</td><td>Unlocks/improves light ships.</td><td>3</td></tr>
                <tr><td>Heavy Ship</td><td>Unlocks/improves heavy ships.</td><td>3</td></tr>
                <tr><td>Aeroponic Farm</td><td>Unlocks the advanced farm version.</td><td>1</td></tr>
                <tr><td>Prison</td><td>Unlocks the prison (prerequisite: Barbed Wire 5).</td><td>1</td></tr>
            </table>

            <h2 id="max-modes">Max-research server modes</h2>
            <p>In some modes (Battle Royale, Domination, Search &amp; Destroy), all your researches start at <strong>max level</strong>. The Research menu is then hidden.</p>

    workers_scientists:
        title: "Workers and scientists"
        category: "economy"
        order: 4
        tags: "workers,scientists,population,bitcoin,production,defense"
        summary: "The two populations of your empire: workers who pay, scientists who speed things up."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="workers">Workers</h2>
            <p>Workers are your <strong>main source of Bitcoins</strong>. Every day (at daily report), they pay you income proportional to their count.</p>
            <p>Their <strong>maximum number</strong> depends on the Cities and Metropolises you've built:</p>
            <ul>
                <li><strong>City</strong>: +25,000 max workers per level.</li>
                <li><strong>Metropolis</strong>: +80,000 max workers per level.</li>
            </ul>
            <p>To grow their actual number (not just the cap), you need <strong>food</strong> in reserve — population grows naturally while fed.</p>

            <h2 id="scientists">Scientists</h2>
            <p>Scientists <strong>speed up your researches</strong>. The more you recruit, the faster your technologies finish.</p>
            <p>Warning: each scientist costs a small daily maintenance. Don't over-recruit.</p>

            <h2 id="defense">Defensive role</h2>
            <p>Your <strong>workers participate in ground defense</strong> — but only during an <strong>invasion</strong> (when the enemy tries to take your planet). During a standard <strong>raid</strong> (simple looting), they stay hidden.</p>
            <p>Alliance researches of the "worker defense" type further strengthen their effectiveness.</p>

            <h2 id="manage">Managing your population well</h2>
            <ul>
                <li>Match your worker count to your food capacity.</li>
                <li>No need to be at 100% population at all times: aim for profitability.</li>
                <li>In case of famine or embargo, your workers may die — plan reserves.</li>
            </ul>

            <h2 id="reserve-5000">The untouchable reserve of 5,000 workers</h2>
            <p>A planet can <strong>never drop below 5,000 workers</strong>. This reserve is protected: any action that would push it below is blocked with a clear message. This concerns:</p>
            <ul>
                <li><strong>Defense recruitment</strong> (Legionnaires, Mechs, scientists) that consumes workers.</li>
                <li><strong>Ship construction</strong> at the Spaceyard.</li>
                <li><strong>Loading workers into a cargo</strong> for a transfer.</li>
            </ul>
            <p>The "MAX" button on production pages takes this reserve into account: it will never offer you a maximum that would empty your planet below the threshold.</p>

    market:
        title: "Market and traders"
        category: "economy"
        order: 5
        tags: "market,traders,sale,trade,cargo,bitcoin"
        summary: "How to sell your resources to NPC traders for Bitcoins."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="traders">Who are the traders?</h2>
            <p><strong>Non-player characters</strong> (NPCs) present on the map. You can sell them your niobium and water in exchange for Bitcoins.</p>
            <p>They appear regularly in different sectors of the universe — their position is visible on the map.</p>

            <h2 id="sell">How to sell to them</h2>
            <ol>
                <li>Load a <strong>cargo</strong> with niobium and/or water.</li>
                <li>Send it to the trader on a <strong>Deliver</strong> mission.</li>
                <li>The cargo arrives, the sale is made, you get Bitcoins.</li>
                <li>The cargo returns home automatically.</li>
            </ol>

            <h2 id="immunity">Traders are untouchable</h2>
            <p>Traders are <strong>immune to any attack</strong>. You can't raid, invade or fight them. Their fleets never participate in combat, even when located on the same point as a battle.</p>
            <p>Bottom line: no bad surprises, it's a safe trading partner.</p>

            <h2 id="gain">How much it pays</h2>
            <p>The price paid depends on the resource (water pays more than niobium at current rates) and a <strong>trader bonus</strong> that grows with dedicated alliance researches.</p>
            <p>The interface shows you the estimated gain before confirming the sale. Check before sending.</p>

            <h2 id="tip">Tip</h2>
            <p>Rather than letting your stocks saturate, send a cargo regularly. It's free Bitcoin to fund your researches or your army.</p>

    recycling:
        title: "Recycling"
        category: "economy"
        order: 6
        tags: "recycling,debris,df,recycler,asteroid,uranium"
        summary: "After each battle, debris lingers. Collecting it is an open-pit mine."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principle">What's debris?</h2>
            <p>Each ship destroyed in combat leaves part of its cost as <strong>debris</strong> floating in space. It's called a <strong>DF</strong> (Debris Field).</p>
            <p>Debris contains <strong>niobium</strong>, <strong>water</strong>, and sometimes <strong>uranium</strong> (on special debris that appears alone on the map).</p>
            <p>On the map, debris is shown by a specific icon at the position of the fight.</p>

            <h2 id="howmuch">How much debris?</h2>
            <p>A field holds <strong>40 % of the build cost of the ships actually destroyed</strong>, on both sides. Each ship returns its own resources: a Battleship, expensive in water, mostly leaves water. Survivors leave nothing.</p>
            <p>Three special cases:</p>
            <ul>
                <li>Against <strong>Cthulhu</strong> hordes the rate drops to <strong>20 %</strong>.</li>
                <li>The <strong>cargo</strong> of a fleet destroyed outright also spills into the field, at 40 %. A battered winner keeps its whole hold.</li>
                <li>Razed <strong>planetary defences</strong> and ships paid for in <strong>war points</strong> (Plasma hunter, Combat corvette, Battleship, Caravel) leave <strong>no</strong> debris: they cost no niobium or water to build.</li>
            </ul>
            <p>An <strong>orbital battle</strong> (a fleet shot down by the turrets of a planet in attack mode, or ships lost forcing a defended orbit) leaves a field under the same rule.</p>

            <h2 id="how">How to recycle</h2>
            <ol>
                <li>Unlock the <strong>Recycler</strong> research.</li>
                <li>Build <strong>recyclers</strong> in your Spaceyard.</li>
                <li>Send a fleet of recyclers on a <strong>Recycling</strong> mission to the debris field coordinates.</li>
                <li>They work in <strong>5-minute cycles</strong>: each cycle they pick up what they can.</li>
                <li>Once full (or the field is empty), the fleet returns automatically.</li>
            </ol>

            <h2 id="capacity">How much can a recycler carry?</h2>
            <p>Each recycler collects <strong>1,000 resources per 5-minute cycle</strong>, or 12,000/hour. <strong>Alliance researches</strong> can strongly boost this capacity.</p>

            <h2 id="strategy">Strategy</h2>
            <ul>
                <li>After each battle, send recyclers immediately: otherwise your opponents will grab them.</li>
                <li>Protect them: a lone recycler is an easy target.</li>
                <li><strong>Uranium</strong> debris appears spontaneously: it's your best source of uranium outside combat.</li>
                <li>Recycling is very profitable — think of it as a second economy behind your mines.</li>
            </ul>

    daily_report:
        title: "The daily report"
        category: "economy"
        order: 7
        tags: "report,daily,balance,income,costs,tax"
        summary: "Every day at 18:59 UTC, the game calculates your balance: income, costs, taxes. Watch it closely."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="when">When it happens</h2>
            <p>Every day at <strong>18:59 UTC</strong>. A fixed appointment for all server players.</p>
            <p>You receive a detailed report in your Messages.</p>

            <h2 id="contents">What the report contains</h2>
            <ul>
                <li><strong>Income</strong> — what your workers generated.</li>
                <li><strong>Maintenance costs</strong> — Legionnaires, Mechs, scientists, ships, buildings. Units on mission cost more than stationed ones.</li>
                <li><strong>Peace tax</strong> — if you're at peace with an alliance that imposed a tax.</li>
                <li><strong>Alliance tax</strong> — automatic contribution to your alliance treasury (if configured).</li>
                <li><strong>Final balance</strong> — income − costs − taxes, added to your total.</li>
            </ul>

            <h2 id="quests">Daily quests</h2>
            <p>The daily report <strong>renews your 3 quests</strong> for the day. If you completed <strong>yesterday's 3 quests</strong>, you receive <strong>+250 WP</strong> as a bonus reward.</p>

            <h2 id="danger">Danger to watch</h2>
            <p>If your balance falls <strong>into negative</strong> after the report, it's <strong>Economic Game Over</strong>: fleets destroyed, balance reset to 125,000 Bitcoins, researches partially reduced.</p>
            <p>Check your report every day. If costs climb too much: slow recruitment, recall your fleets on mission, or dismiss units.</p>

    exchange:
        title: "Exchanges between players"
        category: "economy"
        order: 8
        tags: "exchange,alliance,resources,bitcoin,gift,deposit"
        summary: "How to send resources or Bitcoins to an ally (and the limits of it)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principle">The principle</h2>
            <p>Area Universe lets players of the <strong>same alliance</strong> help each other by transferring resources or Bitcoins. Very useful to:</p>
            <ul>
                <li>Get a recently-looted member back on their feet.</li>
                <li>Pool a costly research or building effort.</li>
                <li>Resupply an ally under embargo.</li>
            </ul>

            <h2 id="resources">Sending physical resources</h2>
            <p>To send niobium, water or food: load them into a <strong>cargo</strong> and send the cargo on a <strong>Deliver</strong> mission to the recipient's planet. Resources are dropped automatically on arrival, the cargo returns on its own.</p>

            <h2 id="bitcoins">Sending Bitcoins</h2>
            <p>Bitcoins are transferred via the <strong>alliance treasury</strong> (see the dedicated article). You deposit into the treasury, and officers can distribute or pay out to a player.</p>

            <h2 id="limits">The limits</h2>
            <ul>
                <li>You <strong>cannot transfer uranium</strong> freely (strategic resource).</li>
                <li>Exchanges always go through a fleet: takes time and fuel.</li>
                <li>A planet under <strong>embargo</strong> can only receive from yourself or an ally, not from a stranger.</li>
                <li>You can't send resources to an enemy or a non-alliance player (except via the treasury, per rules).</li>
            </ul>

    fleet_creation:
        title: "Create and send a fleet"
        category: "fleet"
        order: 1
        tags: "fleet,creation,ships,composition,spaceyard,mission"
        summary: "From building the ship to its arrival at destination: the full path."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequisites">What you need</h2>
            <ul>
                <li>A <strong>Spaceyard</strong> on your active planet.</li>
                <li>The required resources (niobium and water).</li>
                <li>The researches required for the desired ship (e.g. <em>Utility</em> for cargos).</li>
            </ul>

            <h2 id="build">Step 1 — Build the ships</h2>
            <p>From the <strong>Space</strong> page, choose a model and quantity. Production takes time and runs in the background.</p>

            <h2 id="compose">Step 2 — Compose the fleet</h2>
            <p>Once ships are delivered, go to the <strong>Fleets</strong> page. You can:</p>
            <ul>
                <li>Select which ships to board.</li>
                <li>Load <strong>resources</strong> (for transport).</li>
                <li>Board <strong>Legionnaires</strong> (for raid/invasion, with barges).</li>
            </ul>

            <h2 id="send">Step 3 — Send the fleet</h2>
            <ol>
                <li>Choose the <strong>destination</strong>. Type it in format <code>Galaxy:Sector:Position</code> or click from the Map.</li>
                <li>Choose a <strong>mission type</strong> (Normal, Deliver, Recycling, Raid, Invasion...).</li>
                <li>Check the fuel cost (water) and flight duration.</li>
                <li>Confirm.</li>
            </ol>
            <p>The fleet appears in your list of fleets in flight. You can <strong>recall</strong> it before arrival if needed.</p>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>Add a <strong>recycler</strong> to your attack fleets, to collect debris right away.</li>
                <li>Never send your whole defense at once: keep enough to hold your planet.</li>
                <li>A fleet's return after mission costs no extra fuel (already provisioned).</li>
            </ul>

    ship_types:
        title: "Ship types"
        category: "fleet"
        order: 2
        tags: "ships,fighter,corvette,frigate,battleship,cruiser,destroyer,cargo,probe"
        summary: "All ships in the game: utility, light, heavy, special — and how to use them."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utility">Utility ships</h2>
            <p>They don't fight. They transport, explore, recycle, colonize.</p>
            <table>
                <tr><th>Ship</th><th>Role</th><th>Capacity</th></tr>
                <tr><td>Probe</td><td>Spy on a planet.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Light transport.</td><td>3,000</td></tr>
                <tr><td>Cargo V</td><td>Medium transport.</td><td>10,000</td></tr>
                <tr><td>Cargo X</td><td>Heavy transport.</td><td>25,000</td></tr>
                <tr><td>Caravel</td><td>Premium cargo: the biggest and fastest of the cargo ships. Paid in War Points (25) + 15 workers per unit produced.</td><td>40,000</td></tr>
                <tr><td>Colonizer</td><td>Found a new planet.</td><td>—</td></tr>
                <tr><td>Recycler</td><td>Collect combat debris.</td><td>1,000 per 5-min cycle</td></tr>
                <tr><td>Barge</td><td>Transport Legionnaires for raid or invasion.</td><td>1,000 Legionnaires</td></tr>
                <tr><td>Moon Maker</td><td>Create a moon on an empty slot holding enough debris (min. 2M niobium and 2M water).</td><td>—</td></tr>
                <tr><td>Radar (ship)</td><td>Extend your detection in a sector.</td><td>—</td></tr>
                <tr><td>Jammer (ship)</td><td>Jam enemy detection.</td><td>—</td></tr>
                <tr><td>Mothership</td><td>Prestige flagship. Slows the fleet.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Combat ships</h2>
            <p>They are split into <strong>classes</strong> (from lightest to heaviest). Each class has its strengths and weaknesses; a balanced fight mixes classes.</p>
            <table>
                <tr><th>Class</th><th>Examples</th><th>Profile</th></tr>
                <tr><td>Light</td><td>Fighter, Heavy Fighter, War Fighter</td><td>Fast, cheap, numerous. Good against corvettes.</td></tr>
                <tr><td>Medium</td><td>Corvette, Laser Corvette, War Corvette</td><td>Balanced. Good against fighters and frigates.</td></tr>
                <tr><td>Heavy</td><td>Frigate, Plasma Frigate</td><td>High damage at long range.</td></tr>
                <tr><td>Very heavy</td><td>Battleship</td><td>Resistant, solid damage.</td></tr>
                <tr><td>Capital</td><td>Cruiser, Armored, Destroyer</td><td>Colossal, very expensive, devastating. Core of your fleet.</td></tr>
            </table>

            <h2 id="factions">Combat factions</h2>
            <p>Some ships belong to a <strong>faction</strong>: <em>missile</em>, <em>laser</em> or <em>plasma</em>. Factions counter each other (rock-paper-scissors), with a +20% power bonus against their target faction.</p>

            <h2 id="cargo-bonus">Transport capacity</h2>
            <p>Cargo capacity grows with dedicated <strong>alliance researches</strong> for cargo. Useful once you play over long distances.</p>

    ship_customization:
        title: "Customize your ships"
        category: "fleet"
        order: 3
        tags: "customization,ships,points,armor,accuracy,weapons"
        summary: "40 free points every day to boost armor, accuracy and weapons of your ships."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principle">The principle</h2>
            <p>Each ship model has three stats you can evolve:</p>
            <ul>
                <li><strong>Armor</strong> — how much it can take.</li>
                <li><strong>Accuracy</strong> — raises the worst possible outcome of every salvo (no shot ever misses, but a poorly aimed one deals less damage).</li>
                <li><strong>Weapons</strong> — damage dealt.</li>
            </ul>
            <p>Each day, the game gives you <strong>40 points to freely allocate</strong>, across all your ships. It's free, don't forget it.</p>

            <h2 id="use">How to use them</h2>
            <p>Go to the <strong>Customization</strong> page (Space menu). For each model, adjust the sliders. Your choices apply to <strong>all ships of that model</strong> (current and future). These three stats progress independently of one another: putting points into a model's armor or weapons never lowers its accuracy.</p>

            <h2 id="reading">Reading your aim on screen</h2>
            <p>The Shipyard's <strong>Statistics</strong> tab shows, model by model, the aim you have invested against that model's credit (for example <code>676 / 676</code> for a Destroyer) and the <strong>damage multiplier</strong> it yields: <strong>×0.94</strong> at full aim, <strong>×0.66</strong> with no point invested at all.</p>
            <p>It is not a hit rate: <strong>no shot ever misses</strong>. Better aim raises the floor of your damage, never its ceiling. It is the same figure as on your fleet management page, in the Defenses tab and in your combat reports — the four screens can finally be compared directly. For reference, a planet's defenses fire at <strong>×1.06</strong>, better than a fully aimed fleet.</p>

            <h2 id="reset">Resets</h2>
            <p>You can reset your points <strong>once every 96 hours</strong>, with no lifetime cap: if your strategy changes or the combat engine evolves, recover all your spent points to redistribute them. After a reset, the button stays greyed out and a countdown shows the time left before the next one.</p>

            <h2 id="max-modes">Max-research server modes</h2>
            <p>In some modes (Battle Royale, Domination, Search &amp; Destroy), <strong>all your points are unlocked from day one</strong> (1,375 points immediately available instead of 40/day).</p>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>Don't spread points across too many models: focus on the ones you actually use in bulk.</li>
                <li><strong>Recyclers</strong> and <strong>cargos</strong> benefit from a bit of armor to survive ambushes.</li>
                <li><strong>Fighters</strong> benefit more from accuracy and weapons than from armor (they die fast).</li>
            </ul>

    fleet_missions:
        title: "Mission types"
        category: "fleet"
        order: 4
        tags: "mission,attack,transport,colonization,recycling,espionage,nuclear,raid,invasion"
        summary: "Each mission gives your fleet a different order. Here's how to pick the right one."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principle">The principle</h2>
            <p>When you send a fleet, you give it a <strong>mission type</strong>. This mission determines what happens on arrival. Some types require specific ships.</p>

            <h2 id="missions">Available types</h2>
            <table>
                <tr><th>Mission</th><th>What it does</th><th>Ships required</th></tr>
                <tr><td><strong>Normal</strong> (Attack)</td><td>The fleet goes to the target point. If the enemy is there, automatic combat.</td><td>Any ships</td></tr>
                <tr><td><strong>Deliver</strong></td><td>Drop resources on an allied planet or at a trader, then return.</td><td>At least one cargo</td></tr>
                <tr><td><strong>Colonization</strong></td><td>Found a new planet on an empty slot.</td><td>A colonizer</td></tr>
                <tr><td><strong>Raid (Loot)</strong></td><td>Fight the ground defense to steal resources, without taking the planet.</td><td>Barges + Legionnaires</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Fight the ground defense to <strong>take the planet</strong> from the opponent.</td><td>Barges + Legionnaires</td></tr>
                <tr><td><strong>Espionage</strong></td><td>Send a probe to obtain a report on enemy defenses.</td><td>At least one probe</td></tr>
                <tr><td><strong>Moon</strong></td><td>Create a moon on an empty slot holding enough debris (min. 2M niobium and 2M water).</td><td>A Moon Maker</td></tr>
                <tr><td><strong>Radar</strong></td><td>Deploy a radar satellite on site (extended detection).</td><td>A radar ship</td></tr>
                <tr><td><strong>Jammer</strong></td><td>Deploy a jamming satellite (hides your movements).</td><td>A jammer ship</td></tr>
                <tr><td><strong>Land</strong></td><td>Transfer ships directly into the garrison of one of your planets.</td><td>Your own planet</td></tr>
                <tr><td><strong>Nuclear</strong></td><td>Drop a nuclear bomb on the target planet.</td><td>Nuclear bomb on board</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Collect debris from a battlefield.</td><td>At least one recycler</td></tr>
            </table>

            <h2 id="pick">How to pick the right mission</h2>
            <ul>
                <li>You want <strong>Bitcoin</strong>? → Deliver to a trader.</li>
                <li>You want <strong>intel</strong>? → Espionage.</li>
                <li>You want to <strong>weaken</strong> an enemy? → Raid (loot).</li>
                <li>You want to <strong>take</strong> their planet? → Invasion.</li>
                <li>You want to <strong>recover debris</strong>? → Recycling.</li>
            </ul>

    fleet_movement:
        title: "Movement and distance"
        category: "fleet"
        order: 5
        tags: "movement,distance,speed,travel,fuel,coordinates"
        summary: "How travel time and fuel consumption are calculated, and what slows your fleet."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordinates">Coordinates, how they work</h2>
            <p>Each position in the universe is written in format <strong>Galaxy:Sector:Position</strong>. Example: <code>1:5:12</code> = galaxy 1, sector 5, position 12.</p>
            <ul>
                <li>A <strong>galaxy</strong> contains several sectors (10×10 grid).</li>
                <li>A <strong>sector</strong> contains 25 positions (5×5 grid).</li>
            </ul>

            <h2 id="distance">How distance is calculated</h2>
            <ul>
                <li><strong>Same sector</strong> — short distance, fast travel.</li>
                <li><strong>Same galaxy, different sector</strong> — medium distance.</li>
                <li><strong>Different galaxy</strong> — long, fixed distance. Requires the <strong>Hyperspace</strong> research.</li>
            </ul>
            <p>The interface always shows the estimated distance and duration before you confirm the send.</p>

            <h2 id="duration">Flight duration</h2>
            <p>It depends on:</p>
            <ul>
                <li>the <strong>distance</strong>;</li>
                <li>the <strong>speed of the slowest ship</strong> in your fleet (a fleet moves at the speed of its slowest ship);</li>
                <li>the <strong>server speed</strong> (some servers are accelerated).</li>
            </ul>
            <p>The <strong>Mothership</strong> is prestigious but <strong>slows the fleet by 10%</strong>. Something to account for. It also <strong>lowers the fleet's radar signature by 10%</strong> (camouflage) — the Empire overview, on the other hand, shows the raw total of your ships.</p>

            <h2 id="fuel">Fuel</h2>
            <p>Fuel is <strong>water</strong>. The <strong>bigger</strong> your fleet (total mass), the more it consumes. The <strong>longer</strong> the trip, the more it consumes.</p>
            <p>A <strong>Deliver</strong> mission consumes double (cargo leaves heavy, comes back heavy from return).</p>
            <p>Estimated fuel is shown before launching the fleet: check that you have enough water in stock.</p>

            <h2 id="recall">Recalling a fleet in flight</h2>
            <p>You can <strong>recall</strong> a fleet as long as it hasn't arrived. It turns around and heads home. Typical case: an ally attacks before you, cancel your offensive.</p>

            <h2 id="night-slowdown">🌙 Night slowdown</h2>
            <p>An offensive fleet (combat ships or ground troops) sent toward an enemy planet takes <strong>×10 longer</strong> if it arrives during the <strong>defender's night window</strong> (23:00–06:00 in their timezone). The displayed duration already includes this multiplier.</p>
            <p>A 🌙 icon on the map indicates players currently in their night window. A confirmation modal appears when sending if the arrival falls in the opponent's night. Timezone is auto-detected and can be changed at most once per month.</p>

    fleet_management:
        title: "Advanced fleet management"
        category: "fleet"
        order: 6
        tags: "management,fleet,split,merge,transfer,regroup"
        summary: "Split, merge, land: advanced manipulations to optimize your movements."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Available operations</h2>
            <ul>
                <li><strong>Split</strong> — detach part of the ships into a new fleet.</li>
                <li><strong>Merge</strong> — combine several of your fleets at the same location.</li>
                <li><strong>Land</strong> — transfer ships from a fleet to the garrison of a planet. Unloaded troops and cargo must fit within the planet's capacities; a fleet carrying none always lands, even on a planet that is already full.</li>
                <li><strong>Recall</strong> — turn around a flying fleet.</li>
                <li><strong>Park</strong> — put a fleet in "parking" on a planet without merging.</li>
            </ul>

            <h2 id="in-flight">What you can't do</h2>
            <ul>
                <li>Change the composition of a fleet <strong>in flight</strong> (cargo, ships).</li>
                <li>Change the mission of a fleet in flight (except recall).</li>
                <li>Teleport a fleet (no magic shortcut!).</li>
            </ul>

            <h2 id="tips">Use cases</h2>
            <ul>
                <li><strong>Split before a fight</strong>: keep part of your fleet in reserve, send an advance guard.</li>
                <li><strong>Merge after a raid</strong>: combine multiple returns for clarity.</li>
                <li><strong>Land</strong>: switch a fleet into orbital defense of a planet.</li>
            </ul>

    espionage:
        title: "Espionage and probes"
        category: "fleet"
        order: 7
        tags: "espionage,probe,spy,detection,information,intel"
        summary: "Know what the opponent has before striking: sending probes explained."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="send">Sending a probe</h2>
            <ol>
                <li>Build <strong>probes</strong> in your Spaceyard (unlocked by Utility research).</li>
                <li>Go to Fleets, add at least 1 probe.</li>
                <li>Choose <strong>Espionage</strong> mission, designate the target.</li>
                <li>Send — the probe flies at high speed.</li>
            </ol>
            <p>On arrival, it scans the planet and sends you back a report.</p>

            <h2 id="success">What determines success</h2>
            <p>A silent duel pits your <strong>Espionage level</strong> against the defender's:</p>
            <ul>
                <li>If your level is <strong>higher or equal</strong>, the report is detailed.</li>
                <li>If your level is lower, you get either partial info, or nothing.</li>
            </ul>
            <p>To raise your espionage: <strong>Wave</strong> research level 5, then <strong>Espionage</strong> research.</p>

            <h2 id="report">What a successful report reveals</h2>
            <ul>
                <li>The <strong>resources</strong> on the planet.</li>
                <li>The list of <strong>buildings</strong> and their levels.</li>
                <li>The <strong>fleets</strong> in orbit.</li>
                <li>The <strong>ground and orbital defenses</strong>.</li>
                <li>The <strong>Legionnaires, Mechs, workers</strong>.</li>
            </ul>
            <p>Exactly what you need to decide: raid, invasion, or retreat.</p>

            <h2 id="detection">Can you get spotted?</h2>
            <p>Yes. If the defender has a good enough <strong>Radar</strong>, they receive an espionage alert (without necessarily knowing what was seen).</p>
            <p>Conversely, a planet equipped with a <strong>Jammer</strong> can scramble your probe or make it unreliable.</p>

    spatial_combat:
        title: "Space combat"
        category: "combat"
        order: 1
        tags: "combat,space,fleet,battle,block,round,shield,precision,losses,damage,screen,hunters"
        summary: "How a fleet battle unfolds, step by step: side power, the shield duel, firing rounds, how it ends and exactly how your losses are computed."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="trigger">When a battle starts</h2>
            <p>As soon as a fleet flagged <strong>[Attack]</strong> shares its position (Galaxy:Sector:Position) with an enemy fleet, battle starts automatically. Your own fleets at the same spot first merge into a single armada.</p>
            <p>Every fleet present is split into <strong>two sides</strong> according to diplomacy: your alliance and its pacts on one side, the enemy and its backers on the other. A side without a single weapon (cargos, recyclers, probes) does not fight: it is destroyed, and the report says so.</p>
            <p><strong>Warring alliances, nobody armed</strong> — two fleets from alliances at war only trigger a battle when at least one of them carries ship weapons. Two entirely unarmed fleets (cargos, probes, recyclers) crossing paths simply don't fight: your fleets aren't locked down and nobody gets notified for nothing.</p>
            <p><strong>Raids and invasions</strong> — when this battle is triggered by a raid or invasion against a guarded planet (see the <em>Planet invasion</em> and <em>Raids (pillaging)</em> articles), the trigger itself sets the <strong>[Attack]</strong> flag on your attacking fleet. It is never cleared afterward: a raid or invasion fleet that survives stays marked hostile — turrets in attack mode can engage it later, and it will be pulled back into the next space battle detection the moment it meets an enemy.</p>

            <h2 id="power">A side's power</h2>
            <p>The battle opposes the <strong>totals</strong> of both sides: the game sums the armor, shield, missiles, lasers and plasma of every ship engaged.</p>
            <ul>
                <li><strong>Defender at home</strong> — the planet's turrets and defense armor join its side; the planetary Shield adds +50,000 armor, the Big shield +600,000. An armed fleet from an alliance mate stationed on your planet benefits too.</li>
                <li><strong>Precision</strong> — average of the side's fleet precisions (built through ship customization).</li>
                <li><strong>Alliance politics</strong> — each regime beats its rival: Democracy beats Communism, which beats Fascism, which beats Democracy. If the <strong>attacker's</strong> politics beats the defender's, all its weapons gain +20%.</li>
                <li><strong>Alliance improvements</strong> — up to +5% per weapon type, armor and shield, and up to +10% for planetary defenses.</li>
                <li><strong>Heroes</strong> — attack, defense, shield and precision bonuses from skills and items. A hero with <strong>Intimidation</strong> weakens enemy weapons; a <strong>Tactician</strong> boosts his side's first salvo.</li>
            </ul>

            <h2 id="planet-defenses">Your turrets fight in this same battle</h2>
            <p>When your planet's defenses join a side, that battle <strong>is</strong> now the whole of your planet's battle: there is no separate orbital combat left behind for your turrets afterward. They aim with their own precision (a low-precision escort stationed next to them no longer drags their fire down), and they take <strong>real losses</strong> there: proportional to the damage your side absorbs if it wins, <strong>total</strong> — turrets, shields, space base, attack mode switched off — if your side falls. That holds whether the planet's attack mode is on or off: the moment they fire, they can now be destroyed. A planet guarded by one of your fleets, or an <strong>armed</strong> fleet from an ally in your alliance, can therefore no longer be looted or invaded without a battle deciding it first.</p>

            <h2 id="shields">The shield duel</h2>
            <p>Every salvo hits the enemy shield first. Its <strong>piercing power</strong> is:</p>
            <p><code>missiles ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>Plasma excels against shields, missiles barely dent them — and that edge now holds at any battle size, ten against ten just as much as a hundred million against a hundred million. On every salvo, whatever damage exceeds the piercing power is absorbed by the enemy shield until its charge runs out; the rest, and anything that overflows once the shield is empty, hits the hull directly. A shield can therefore never block a whole salvo: against an armed enemy, your hull always takes something, from the very first round.</p>
            <p>A fleet's shield is no longer a reserve that automatically snaps back to 100% before every battle: it is a <strong>persistent charge</strong> that wears down during the fight and only regains 10% every 3 hours (30 hours to go from empty to full), even when you split, merge or disband the fleet, or transfer ships between the fleet and the planet's ground. The battle report shows this charge at the start and end of the fight; the fleet list shows each fleet's percentage, and the fleet management page shows the shield actually taken into battle, the total capacity, the current percentage and the time left until it's fully charged. The ship stock on the ground also carries a charge, which does not recharge: any fleet created or reinforced from that ground inherits it, and it is shown in the fleet creation window as well as in the "Ships" tab of fleet management. One exception: the flat shield granted by a <strong>Mothership</strong> never discharges — its generator holds permanently, and the charge only wears down your other ships' shield — which is why the management page also shows the shield's absolute value, not just the percentage.</p>

            <h2 id="rounds">Firing rounds</h2>
            <p>A battle lasts at most <strong>100 rounds</strong>. Each round, a salvo deals:</p>
            <p><code>(missiles + plasma ÷ 2 + lasers × 2) × multiplier</code></p>
            <p>The multiplier comes from a precision roll: the game draws a number between your precision and 100 and divides it by 80, for a result between <strong>×0.3 and ×1.2</strong>. High precision does not make your salvos stronger, it removes the bad rolls. Whatever gets through the enemy shield (see above) is taken off that side's total armor.</p>

            <h2 id="ending">How the battle ends</h2>
            <ul>
                <li><strong>A side's armor reaches 0</strong> — it is defeated; all its fleets are destroyed along with their cargo.</li>
                <li><strong>100 rounds reached</strong> — the side keeping the most armor wins; on a perfect tie, the attacker wins.</li>
                <li><strong>Winner's safety net</strong> — even badly mauled, the winning side never loses more than 95% of its starting armor: a victory is never an annihilation, whatever the power gap.</li>
            </ul>

            <h2 id="losses">Your losses: what you actually took</h2>
            <p>The rule fits in one sentence: <strong>your losses follow from the hull damage you actually took</strong> — never from what your shield absorbed, which costs you no ship at all. That hull damage splits between your <strong>screen</strong> (Hunters, Heavy hunters, War hunters: the only ships without shields) and your <strong>line</strong> (every other type), in proportion to each group's armor: every type loses the same fraction of itself. The report shows two counters: hull damage and shield damage.</p>
            <p>Your screen does not protect your line forever: it diverts onto itself at most <strong>half</strong> of the damage that was headed for the line, and only as long as it has armor left to absorb it — a single hunter cannot soak up an entire fleet's worth of damage. With no screen at all, the line takes the full hull damage.</p>
            <p>Direct consequences: if the enemy barely touches you, your losses are close to zero; an enemy ten times more dangerous costs you about ten times more — hunters included. The defeated side loses everything.</p>

            <h2 id="aftermath">After the battle</h2>
            <ul>
                <li><strong>Debris</strong> — 40% of the build cost (niobium and water) of every destroyed ship, on both sides, falls into orbit (20% when a Cthulhu or an alien is involved). The cargo of annihilated fleets is added. A recycler in the winning fleet collects immediately.</li>
                <li><strong>War Points</strong> — both sides earn some, proportional to the enemy power destroyed; the winner earns far more, and the loser's consolation never exceeds a fifth of what the winner would have earned on the same fleet.</li>
                <li><strong>Heroes</strong> — a main hero aboard a destroyed fleet can be captured by the winner (a chance, never guaranteed). A defeated <strong>secondary hero</strong> follows a different, permanent rule with no randomness: see the <em>Secondary heroes</em> article.</li>
                <li><strong>Reports</strong> — every commander receives the details: forces, salvos, damage taken, losses, and the fate of any secondary hero captured or executed.</li>
            </ul>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>Always keep a <strong>hunter screen</strong>: cheap, it soaks hull damage instead of your heavy ships.</li>
                <li>Invest in <strong>shield</strong>: the more charge it has, the more damage it absorbs before it reaches your hull — but no shield stops a whole salvo, your hull always takes some of it.</li>
                <li>Build <strong>plasma</strong> to break enemy shields fast, <strong>lasers</strong> for hull damage.</li>
                <li>Pick your <strong>alliance politics</strong> by looking at your favorite targets: +20% weapons on the attack is worth taking.</li>
            </ul>

    invasion:
        title: "Planet invasion"
        category: "combat"
        order: 2
        tags: "invasion,planet,soldiers,tanks,barges,conquest,deployment,tactical"
        summary: "Conquering an enemy planet: barges, landing, ground combat and tactical deployments."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principle">Principle</h2>
            <p>An invasion is an attack to <strong>take over</strong> an enemy planet. Your fleet lands Legionnaires (via barges) who face the ground garrison.</p>
            <p>It's different from a <strong>raid</strong> (which pillages without taking the planet): a successful invasion gives you the entire planet.</p>

            <h2 id="conditions">What you need to invade</h2>
            <ul>
                <li>Be in an <strong>alliance</strong>.</li>
                <li>Play on a server in <strong>PvP mode</strong> (e.g., Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Have <strong>barges</strong> and <strong>Legionnaires</strong> in your fleet.</li>
                <li>The target must be an inhabited planet (not a trader, not an ally, not someone you're at peace or pact with).</li>
                <li>No space combat already scheduled at the same location.</li>
            </ul>

            <h2 id="barges">The role of barges</h2>
            <p>Barges are the vehicles that land your Legionnaires. Each barge carries <strong>1,000 Legionnaires</strong> (capacity increased by alliance research).</p>
            <p>If you have more Legionnaires than seats, the surplus <strong>stays in orbit and doesn't fight</strong>. On failure, your barges are <strong>captured by the defender</strong>.</p>

            <h2 id="orbital">Phase 1 — Combat in orbit (sometimes)</h2>
            <p>Two situations can stop you before you even land:</p>
            <ul>
                <li>The target planet has activated its <strong>attack mode</strong>: its turrets and shields engage your fleet first. If <strong>you lose</strong>, your fleet is destroyed — the invasion stops cold. If <strong>you win</strong>, orbital defenses are wiped out and your fleet continues (weakened).</li>
                <li>The target planet is guarded by an <strong>armed</strong> fleet of the owner, or an <strong>armed</strong> fleet from an ally in their alliance, already in orbit (a lone probe or cargo no longer counts): your arrival triggers a <strong>battle</strong> against that defender and the planet's turrets combined — even if the planet is not in attack mode. This battle never starts against a peace partner, a pact partner, an ally, your own alliance, or on a PvE server — it follows the same diplomatic rules a normal invasion would. It cancels your invasion in progress: if you win it, you must <strong>relaunch</strong> an invasion to actually land — and if the planet is still guarded at that point, clicking "Invade" from orbit is <strong>refused</strong> the same way: engage your own fleet's attack mode first to force the fight. Since an invasion always carries Legionnaires, this trigger condition is automatically met on the attacker's side — the battle starts whether or not your fleet carries any ship weapons.</li>
            </ul>
            <p><strong>Trap to know: an invasion fleet with no combat ships is wiped out in this battle.</strong> Legionnaires and barges are enough to launch an invasion, but if your fleet carries no ship weapons at all, it enters this preliminary battle with zero firepower — the defenders wipe it out completely, barges and Legionnaires included, before you ever land. <strong>Always escort your invasion fleets with combat ships</strong> — see the <em>Raids (pillaging)</em> article for the same trap on the looting side.</p>

            <h2 id="combat">Phase 2 — Ground combat</h2>
            <p>Ground combat runs for <strong>up to 10 rounds</strong>. Each round, both sides exchange losses.</p>
            <table>
                <tr><th>Unit</th><th>Role</th></tr>
                <tr><td><strong>Legionnaire</strong></td><td>Attack and defense. Boosted by Barbed Wire research for defense.</td></tr>
                <tr><td><strong>Mech</strong></td><td>Powerful heavy defense unit (max 500 per planet).</td></tr>
                <tr><td><strong>Worker</strong></td><td>Passive defense, <strong>only in invasion</strong> (not raids).</td></tr>
            </table>
            <p><strong>The attacker wins only if</strong> all defender troops are eliminated <strong>and</strong> at least 1 Legionnaire remains alive. Otherwise, <strong>the defender wins by terrain advantage</strong>.</p>

            <h2 id="deployment">The defender's tactical deployments</h2>
            <p>The defender may have chosen a <strong>tactical deployment</strong> invisible to you. Keep in mind: it can flip a fight that seemed won in advance.</p>
            <table>
                <tr><th>Deployment</th><th>Effect</th><th>Trade-off</th></tr>
                <tr><td><strong>Balanced</strong></td><td>No bonus or penalty.</td><td>Neutral.</td></tr>
                <tr><td><strong>Fortified</strong></td><td>+30% ground defense.</td><td>−20% counter-attack.</td></tr>
                <tr><td><strong>Guerrilla</strong></td><td>Workers +150% in defense.</td><td>Legionnaires at −50%.</td></tr>
                <tr><td><strong>Last Stand</strong></td><td>+50% if troops fall below 30%.</td><td>Conditional.</td></tr>
                <tr><td><strong>Scorched Earth</strong></td><td>No active bonus.</td><td>If you lose a raid, 50% of unstolen resources are destroyed.</td></tr>
            </table>

            <h2 id="victory">If you win the invasion</h2>
            <ul>
                <li><strong>Capture</strong> — the planet is yours, with its buildings. Workers reset to a base level (~2,000).</li>
                <li><strong>Cthulhu planet</strong> — if you retake a planet captured by Cthulhu, it's freed (buildings reset, uranium reward).</li>
                <li><strong>No more colonization slots?</strong> The conquered planet becomes a Cthulhu base: you don't keep it.</li>
            </ul>
            <p><strong>Production queues</strong> do not follow the captured planet: ships as well as defenses (turrets or troops) already paid for but not yet delivered are lost on capture — an order placed by the defeated owner never changes hands. Whatever was delivered before the assault, on the other hand, sits on the ground and follows the planet.</p>
            <p>If the captured planet hosts an enemy <strong>secondary hero</strong>, its fate is decided immediately: you <strong>capture</strong> it if you own a Prison (level 1 or higher), otherwise it is <strong>executed</strong>. A raid, by contrast, never takes the planet and therefore never puts a hero at stake. See the <em>Secondary heroes</em> article for details.</p>

            <h2 id="gameover">Defender elimination</h2>
            <p>If the defender loses their <strong>last planet</strong>, they're eliminated from the server. You get everything: Bitcoins, surviving fleets and associated War Points.</p>

            <h2 id="defeat">If you lose the invasion</h2>
            <p>The <strong>barges are captured by the defender</strong>. Landed Legionnaires are lost. It's a costly defeat: scout before invading.</p>

    raid:
        title: "Raids (pillaging)"
        category: "combat"
        order: 3
        tags: "raid,pillage,theft,resources,bunker,barges"
        summary: "Looting resources from an enemy planet without trying to conquer it."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principle">What is a raid?</h2>
            <p>A raid is a ground attack aimed at <strong>stealing resources</strong>. You don't take the planet: you leave with loot. Important consequence: a raid, even a successful one, never takes the planet, so <strong>no secondary hero is ever captured or executed</strong> there, whether you're attacking or defending.</p>

            <h2 id="difference">Raid vs Invasion</h2>
            <table>
                <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                <tr><td>Objective</td><td>Steal niobium, water, uranium</td><td>Take over the planet</td></tr>
                <tr><td>Defenders</td><td>Legionnaires + Mechs</td><td>Legionnaires + Mechs + Workers</td></tr>
                <tr><td>Unpredictability</td><td>Low</td><td>Higher (wider random attack factor)</td></tr>
                <tr><td>Loss of barges if defeated</td><td>No</td><td>Yes (captured by the defender)</td></tr>
            </table>

            <h2 id="combat">How it plays out</h2>
            <p>Same steps as invasion (possible orbital combat, then 10 ground rounds), <strong>but workers don't defend</strong>. The defender's Legionnaires and Mechs stand alone.</p>
            <p><strong>Planet guarded by a fleet in orbit</strong> — if the target is protected by an <strong>armed</strong> fleet of the owner, or an <strong>armed</strong> fleet from an ally in their alliance (a lone probe or cargo no longer counts), your raid first triggers a battle against that defender and the planet's turrets. This battle never starts against a peace partner, a pact partner, an ally, your own alliance, or on a PvE server. Looting does not happen on the spot: if you win that battle, you must <strong>relaunch</strong> a raid to actually loot — and if the planet is still guarded, clicking "Loot" from orbit is <strong>refused</strong> too: engage your own fleet's attack mode first to force the fight. On the attacker's side, this battle only triggers if your raid fleet is itself offensive — ship weapons, Legionnaires or Mechs aboard: a pure cargo fleet, with no weapon and no troops, triggers nothing.</p>

            <h2 id="raid-troops-only">A troops-only raid is wiped out</h2>
            <p>Bringing Legionnaires or Mechs is enough to trigger this battle — but if your raid fleet carries <strong>no ship weapons at all</strong>, it enters that battle with zero firepower. The defenders wipe it out completely, without losing a single ship of their own. <strong>Always escort your troop transports</strong>: this is the single most expensive surprise this feature can spring on you.</p>

            <h2 id="loot">Pillaging (on victory)</h2>
            <p>You recover as many resources as your fleet can carry. Resources are taken in this order:</p>
            <ol>
                <li><strong>Niobium</strong> first.</li>
                <li>Then <strong>Water</strong>.</li>
                <li>Finally <strong>Uranium</strong> (if space remains).</li>
            </ol>

            <h2 id="bunker">The bunker protects a portion</h2>
            <p>The defender's bunker <strong>shelters 5% of max storage per level</strong>. Examples:</p>
            <ul>
                <li>Bunker level 5 → 25% of max storage protected on niobium and water.</li>
                <li>Bunker level 10 → 50% protected.</li>
            </ul>
            <p>Uranium is protected the same way: <strong>5&nbsp;% of your uranium stock per bunker level</strong> (uranium has no storage cap, so the protection applies to the current stock).</p>

            <h2 id="scorched">Watch out for Scorched Earth</h2>
            <p>If the defender chose the <strong>Scorched Earth</strong> tactical deployment and loses, <strong>50% of remaining (unlooted) resources are destroyed</strong>. You leave with your loot, but the opponent can't reclaim everything afterward.</p>

    nuclear:
        title: "Nuclear strike"
        category: "combat"
        order: 4
        tags: "nuclear,bomb,uranium,destruction,interceptor"
        summary: "The ultimate weapon to destroy an enemy's key buildings — provided they have no anti-missile defense."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="requirements">What you need</h2>
            <ul>
                <li>A <strong>Nuclear Base</strong> building.</li>
                <li><strong>Uranium</strong> (very rare).</li>
                <li>A <strong>nuclear bomb</strong> produced.</li>
                <li>A fleet going on a <strong>Nuclear mission</strong> to the target, with the bomb onboard.</li>
            </ul>

            <h2 id="damage">What does a bomb that hits do?</h2>
            <p>The bomb <strong>destroys one building</strong>, prioritizing the most strategic:</p>
            <ol>
                <li><strong>Metropolis</strong> — loses 1 level (−80,000 max workers).</li>
                <li><strong>City</strong> — loses 1 level (−25,000 max workers).</li>
                <li><strong>Bunker</strong> — loses 1 level (reduced protection).</li>
                <li><strong>Barracks</strong> — loses 1 level (−5,000 max Legionnaires).</li>
            </ol>
            <p>The bomb targets the first building found in that order.</p>

            <h2 id="rules">Special rules</h2>
            <ul>
                <li>A fleet on Nuclear mission <strong>cannot be intercepted</strong> by a fleet in orbit. It goes straight to its target.</li>
                <li>The only way to stop it: the defender's <strong>nuclear interceptor</strong>.</li>
            </ul>

            <h2 id="anti">Defense: the nuclear interceptor</h2>
            <p>If the target planet has at least one <strong>nuclear interceptor</strong>, the bomb is automatically neutralized:</p>
            <ul>
                <li>The carrier fleet is <strong>destroyed</strong>.</li>
                <li><strong>1 to 3 interceptors</strong> are consumed.</li>
                <li>Both players get a report.</li>
            </ul>
            <p>Moral: a strategic base is always worth a few interceptors. Without them, it's vulnerable.</p>

    defense:
        title: "Defending your planets"
        category: "combat"
        order: 5
        tags: "defense,soldiers,tanks,turret,shield,bunker,orbital,tactical,deployment,stats,power"
        summary: "The 3 layers of defense: orbital (turrets), tactical (deployment), ground (Legionnaires + Mechs)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="overview">The 3 layers of defense</h2>
            <ol>
                <li><strong>Orbital defense</strong> — turrets, shields, space base. Intercept the fleet before it lands.</li>
                <li><strong>Tactical deployment</strong> — a strategic choice that modifies your ground troops' power.</li>
                <li><strong>Ground defense</strong> — Legionnaires, Mechs, workers (for invasions).</li>
            </ol>

            <h2 id="attack-mode">Activating your planet's attack mode</h2>
            <p>If your planet has <strong>at least one turret</strong>, you can activate <strong>attack mode</strong>. In this mode, as soon as an enemy fleet in attack mode arrives in orbit, an <strong>orbital combat</strong> begins automatically.</p>
            <ul>
                <li><strong>Victory</strong>: the enemy fleet is destroyed, and you collect <strong>war points</strong> proportional to its signature (far less against a Cthulhu).</li>
                <li><strong>Defeat</strong>: all your turrets, shields, space base and queued defense production are wiped out; attack mode <strong>turns off automatically</strong> (a planet without a turret can't keep it active), and the fleet continues to ground combat.</li>
            </ul>
            <p>Without a turret, your shields and space base are destroyed <strong>without even fighting</strong>.</p>
            <p>Two places to switch it on: a planet's <strong>Defence</strong> page, or the <strong>Planets</strong> page, which shows every planet's state (a crosshair next to its defences, clickable to toggle) and offers <strong>"Enable all"</strong> / <strong>"Disable all"</strong> across your whole empire. The bulk toggle skips planets with no turret or already caught in a battle, and tells you how many were skipped.</p>
            <p><strong>Careful</strong>: enabling attack mode on a planet an enemy fleet is already sitting over triggers the orbital battle <strong>five minutes later</strong>. In bulk, several battles can start at once — the message tells you how many.</p>
            <p><strong>What the attacker brings along.</strong> The fleet assaulting your turrets now fights with <strong>all of its bonuses</strong>: its commander's alliance bonuses (missiles, lasers, plasma, armour, shield, accuracy) and the equipment bonuses of the hero aboard. Until 10 September 2026 these only counted in space combat: an alliance that had invested up to +5% in each of those six stats got nothing out of them against turrets. It cuts both ways — your own fleets keep their bonuses when you are the one storming a planet in attack mode — and the figures in orbital reports are now on the same scale as those in space reports.</p>

            <h2 id="defenses-and-your-fleets">Your defenses also fire without attack mode</h2>
            <p>Attack mode isn't the only way to get your turrets firing. As soon as one of your fleets — or an <strong>armed</strong> fleet from an ally in your alliance — is in orbit of the planet when a space battle breaks out there, your defenses automatically join that battle, attack mode on or off (a planet with nothing to defend — no turret, no shield, no space base — never joins one). That makes it a <strong>single battle</strong>: no separate orbital combat left behind. In it, your <strong>Space Base</strong>'s +20% armor bonus applies to both your turrets and your shields, and your <strong>stationed hero</strong>'s military affinity boosts your own turret fire and can carry Intimidation or Tactician for your whole side, exactly like a fleet hero. Your turrets aim there with their own precision (70, above what any fleet can reach), and they take <strong>real losses</strong> — proportional to the damage taken if your side wins, <strong>total</strong> (turrets, shields, space base, queued defense production, attack mode switched off) if your side falls. You earn your planet's share of <strong>war points</strong> whenever your side wins this battle — even if you fielded no fleet of your own. Consequence for your opponents: a planet guarded by an <strong>armed</strong> fleet of yours or an armed allied fleet (a lone probe or cargo no longer counts) can no longer be looted or invaded without a battle first, whether the attacker arrives fresh or clicks "Loot"/"Invade" from orbit — and that battle never starts against a peace partner, a pact partner, an ally, your own alliance, or on a PvE server.</p>
            <p><strong>Fielded no fleet of your own?</strong> You still receive a dedicated report telling you whether your defenses held or were destroyed, with your turret losses spelled out and your share of war points if you won — you are never left in the dark about your planet's fate.</p>

            <h2 id="orbital-detail">Orbital combat in detail</h2>
            <p>Turrets fire at the enemy fleet at the rhythm of the rounds. The <strong>Space Base</strong> gives an armor bonus to all defenses (+20%). Shields (50,000 or 600,000 armor pts) absorb the first hits.</p>
            <p>Your turrets fire <strong>from the very first round</strong>, whatever fleet stands in front of them: a ship's screen never pushes back their opening salvo. That screen is a pool which soaks damage until it is spent. Every salvo goes straight through it up to its <strong>piercing power</strong> (plasma ×4, laser ×2, missiles ÷ 7); the rest wears the screen down, and whatever overflows hits the hull. A defense made only of missile launchers is therefore still at a disadvantage against a heavily shielded fleet — but it fires, it inflicts losses and it leaves debris.</p>
            <p>Even when the enemy fleet wins, its hunter screen no longer protects it forever: your turrets inflict real losses on its heavier ships too, in proportion to the damage it takes — at worst for it, 95% of its starting armor. Defending yourself therefore always costs the attacker something, even when they win.</p>

            <h2 id="deployment">Tactical deployment</h2>
            <p>Each planet can choose a <strong>tactical deployment</strong>. It's <strong>invisible to the attacker</strong> — your hidden card.</p>
            <table>
                <tr><th>Deployment</th><th>Effect</th><th>Trade-off</th></tr>
                <tr><td><strong>Balanced</strong></td><td>No bonus or penalty.</td><td>Neutral.</td></tr>
                <tr><td><strong>Fortified</strong></td><td>+30% ground defense.</td><td>−20% counter-attack.</td></tr>
                <tr><td><strong>Guerrilla</strong></td><td>Workers +150% in defense.</td><td>Legionnaires at −50%.</td></tr>
                <tr><td><strong>Last Stand</strong></td><td>+50% if your troops fall below 30%.</td><td>No effect before that threshold.</td></tr>
                <tr><td><strong>Scorched Earth</strong></td><td>No active bonus.</td><td>If you lose a raid: 50% of your remaining resources are destroyed.</td></tr>
            </table>

            <h2 id="ground">Ground combat</h2>
            <p>It runs for <strong>up to 10 rounds</strong>. Each round, both sides take losses. If no one wins in 10 rounds, <strong>the attacker is repelled</strong> (terrain advantage).</p>

            <h2 id="troops">Ground units</h2>
            <table>
                <tr><th>Unit</th><th>Role</th><th>Notes</th></tr>
                <tr><td><strong>Legionnaires</strong></td><td>Attack and defense.</td><td>Strong defensive bonus with Barbed Wire research.</td></tr>
                <tr><td><strong>Mechs</strong></td><td>Heavy defense.</td><td>Max 500 per planet. Consume food.</td></tr>
                <tr><td><strong>Workers</strong></td><td>Passive defense.</td><td>Only against invasions, not raids.</td></tr>
            </table>

            <h2 id="ressources-defense">Resources used to produce your defenses</h2>
            <p>Like the Spaceyard, defense production draws first from the <strong>planet's</strong> resources, then from the <strong>cargo of fleets stationed in orbit</strong>. So you can keep recruiting even if your ground stock is low, as long as loaded fleets are present above the planet.</p>

            <h2 id="installations">Orbital installations and defenses</h2>
            <ul>
                <li><strong>Turrets</strong> — missile launcher, laser, heavy laser, Gauss, ionic, plasma. Varied to counter different fleet types.</li>
                <li><strong>Shield</strong> (50,000 pts) and <strong>Large Shield</strong> (600,000 pts) — absorb the first hits.</li>
                <li><strong>Space Base</strong> — +20% armor to all orbital defenses.</li>
            </ul>

            <h2 id="stats-defensives">Reading your planet's strength</h2>
            <p>The <strong>Defense</strong> page has two tabs. The second one, <strong>Defense stats</strong>, sums up what the planet is really worth: the combined armor, missiles, lasers and plasmas of all your turrets, the contribution of each structure, how the shield, the large shield and the space base affect the armor a fleet actually faces, and your ground defense power. It is the fastest way to spot the lagging stat before starting a new round of construction.</p>
            <p>One reading detail: the pie chart and the bars cover the armor of the <strong>structures alone</strong>. The flat shield values are listed separately, under the modifiers, because they would otherwise crush any comparison between your weapons.</p>

            <h2 id="bunker">The bunker against pillaging</h2>
            <p>The bunker protects <strong>5% of max storage per level</strong> against raids. A level 5 bunker already shelters 25% of your reserves. Uranium is protected at 5% of its current stock per level.</p>

            <h2 id="upkeep">Watch upkeep costs</h2>
            <p>Units on <strong>mission</strong> (fleets, barges departed) cost <strong>much more</strong> than those stationed. A garrisoned Mech costs little, but an embarked Mech costs ~50× more. Don't leave a large army on permanent travel.</p>

    embargo:
        title: "Embargo and famine"
        category: "combat"
        order: 6
        tags: "embargo,famine,blockade,siege,planet,food,supply,rations"
        summary: "Starving a planet before invading: blockade, famine setting in, and how to survive it."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principle">The principle</h2>
            <p>An <strong>embargo</strong> is a planetary siege. You keep a large fleet in orbit of an enemy planet; trades are cut off, food runs out, population suffers. Once the planet is weakened, you assault.</p>

            <h2 id="consumption">Reminder: food</h2>
            <p>Your workers, Legionnaires and Mechs consume food continuously. If your reserves hit <strong>0</strong>, it's <strong>famine</strong>.</p>

            <p>Rations <strong>travel in the cargo hold</strong>: load them on one planet, unload them elsewhere to resupply. As long as one of your fleets is <strong>docked</strong> (neither in flight nor in combat) above your planet, its rations top up the granary — and a siege drains them like the rest: the hold is no safe.</p>

            <h2 id="famine">Famine (outside embargo)</h2>
            <p>When food runs out, losses cascade in <strong>3 phases</strong>:</p>
            <ul>
                <li><strong>Phase 1 (0–3h)</strong> — moderate worker losses. Time to react.</li>
                <li><strong>Phase 2 (3–8h)</strong> — accelerated losses. Legionnaires start deserting.</li>
                <li><strong>Phase 3 (beyond 8h)</strong> — collapse: workers decimated, Legionnaires fleeing, Mechs abandoned.</li>
            </ul>
            <p>A floor of <strong>5,000 workers</strong> prevents total extinction. Without resupply, a planet reaches that floor in ~27 hours.</p>

            <h2 id="trigger">How to trigger an embargo</h2>
            <p>An embargo activates automatically when:</p>
            <ul>
                <li>At least one <strong>enemy fleet</strong> (not allied) is in orbit,</li>
                <li>in <strong>attack mode</strong>,</li>
                <li>with <strong>enough heavy ships</strong> (equivalent to ~250 battleships, 37 destroyers or 3 motherships).</li>
            </ul>
            <p>As soon as the enemy fleet leaves or is destroyed, the blockade lifts.</p>
            <p>A raid or invasion fleet marked "attacking" by the merged battle described in the <em>Defending your planets</em> article keeps that flag if it survives: if it stays in orbit, it counts toward this signature just like any other hostile fleet.</p>

            <h2 id="effects">What the besieged planet suffers</h2>
            <ul>
                <li><strong>Extra hourly food drain</strong>: the population panics and consumes more.</li>
                <li><strong>Food production</strong> reduced (farms disrupted).</li>
                <li><strong>Niobium and water production</strong> reduced.</li>
                <li><strong>Worker growth</strong> nearly stopped.</li>
                <li><strong>Market blocked</strong>: no more automatic sales to traders.</li>
                <li><strong>Foreign cargos blocked</strong>: only your cargos or your allies' can land (allied resupply).</li>
            </ul>

            <h2 id="famine-embargo">Famine under embargo: it's worse</h2>
            <p>If food hits 0 <strong>during</strong> an embargo, losses are <strong>heavier</strong> and immediate: workers, Legionnaires and Mechs all decline together, continuously.</p>

            <h2 id="timings">How long can you hold out?</h2>
            <table>
                <tr><th>Planet profile</th><th>Famine onset</th><th>Collapse</th></tr>
                <tr><td>Small (50,000 workers, 100,000 food)</td><td>~14 hours</td><td>~1.75 days</td></tr>
                <tr><td>Medium (150,000 workers, 800,000 food)</td><td>~1.5 days</td><td>~3.25 days</td></tr>
                <tr><td>Fortress (200,000 workers, 2,000,000 food)</td><td>~3 days</td><td>~4.8 days</td></tr>
            </table>

            <h2 id="defense">How to resist an embargo</h2>
            <ul>
                <li><strong>Destroy the besieging fleet</strong> to lift the blockade.</li>
                <li><strong>Bring allied resupply</strong> — your cargos and your alliance's always get through.</li>
                <li><strong>Evacuate</strong> — your <em>outgoing</em> fleets aren't blocked, you can empty resources in emergency.</li>
                <li><strong>Build Silos</strong> and stockpile food <em>before</em> trouble starts.</li>
                <li><strong>Call for alliance help</strong> to break the siege together.</li>
            </ul>

            <h2 id="reports">Reports during an embargo</h2>
            <p>Every hour, you (and the attacker) receive a report: time elapsed, food remaining, losses suffered. The Planet page also shows a very useful <strong>Supply</strong> section (production, consumption, estimated autonomy).</p>

    combat_stats:
        title: "Understanding troop power"
        category: "combat"
        order: 7
        tags: "power,bonus,combat,politics,calculation,faction"
        summary: "How your units' power compares, and what boosts it."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="ground">Ground power</h2>
            <p>In orders of magnitude (without bonuses):</p>
            <table>
                <tr><th>Unit</th><th>Relative power</th><th>Role</th></tr>
                <tr><td><strong>Mech</strong></td><td>Very high</td><td>Defense pillar. Expensive, but crushes a small invasion.</td></tr>
                <tr><td><strong>Legionnaire (defense)</strong></td><td>High with Barbed Wire research</td><td>Defense multiplier × Barbed Wire level.</td></tr>
                <tr><td><strong>Legionnaire (attack)</strong></td><td>Medium, with randomness</td><td>Variable — a raid is less unpredictable than an invasion.</td></tr>
                <tr><td><strong>Worker (defense)</strong></td><td>Low, but numbers matter</td><td>Only in invasion. 200,000 workers weigh in.</td></tr>
            </table>
            <p><strong>Barges</strong> don't fight: they each carry 1,000 Legionnaires (more with alliance research).</p>

            <h2 id="bonuses">What increases your power</h2>
            <ul>
                <li><strong>Barbed Wire research</strong> — massive multiplier on Legionnaire defense.</li>
                <li><strong>Discipline research</strong> — improves ground Legionnaires.</li>
                <li><strong>Alliance research</strong> — Legionnaire attack bonus, Mech defense, worker defense, ship firepower, ship armor, barge capacity.</li>
                <li><strong>Tactical deployment</strong> — choice that can boost defense or counter-attack.</li>
                <li><strong>Military Hero</strong> — direct attack and defense bonus.</li>
                <li><strong>Items</strong> equipped on the hero.</li>
            </ul>

            <h2 id="faction">Politics bonus (space combat)</h2>
            <p>The weapons bonus in space combat comes from your <strong>alliance politics</strong>. Each regime beats its rival: <strong>Democracy</strong> beats <strong>Communism</strong>, which beats <strong>Fascism</strong>, which beats <strong>Democracy</strong>.</p>
            <p>When the <strong>attacker's</strong> politics beats the defender's, all its weapons (missiles, lasers, plasma) gain <strong>+20%</strong> for that battle. The bonus only applies to the aggressor: the defender relies on planetary defenses instead.</p>

            <h2 id="precision">Precision and combat rolls</h2>
            <p>In space combat, each side fires <strong>one salvo per round</strong>. A random roll, drawn between the side's precision and 100 then divided by 80, scales the salvo's damage from <strong>×0.3 to ×1.2</strong>. High precision does not make your hits stronger: it removes the bad rolls.</p>
            <p>A fleet's aim is never shown as a percentage any more: everywhere — Shipyard, fleet management page, Defenses tab and combat reports — the game shows the <strong>damage multiplier</strong> it actually produces (<strong>×0.66</strong> with nothing invested at all, <strong>×0.94</strong> at full aim). That level depends on the <strong>customization</strong> points invested in precision for each ship model (40 points/day) and is a level of its own: spending your points elsewhere, on that model's armor or weapons, never brings it back down. When several fleets fight together, the side uses the average of their aims. A planet's defenses fire at <strong>×1.06</strong> — better than a fully aimed fleet. Against an AI-controlled opponent (a bot), its aim never drops below a fixed, known floor: a bot that genuinely invests in it exceeds that floor, and a sufficiently invested player can match or beat it.</p>

    battle_reports:
        title: "Reading a battle report"
        category: "combat"
        order: 8
        tags: "report,combat,victory,defeat,analysis"
        summary: "After every combat, a detailed report. Here's how to decode it to hit better next time."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="where">Where to find them</h2>
            <p>All battle reports arrive in your <strong>Messages</strong> page. They're sorted by type (space, raid, invasion, orbital, embargo, nuclear).</p>

            <h2 id="types">Types of battle reports</h2>
            <ul>
                <li><strong>Space combat</strong> — two fleets crossed paths.</li>
                <li><strong>Orbital combat</strong> — your planetary defenses intercepted a fleet.</li>
                <li><strong>Planetary defenses</strong> — a merged battle where you fielded no fleet of your own: your turrets, shields and space base held, or were destroyed.</li>
                <li><strong>Raid</strong> — pillaging attempt (yours or against you).</li>
                <li><strong>Invasion</strong> — planet-taking attempt.</li>
                <li><strong>Nuclear</strong> — bomb sent or received.</li>
                <li><strong>Embargo</strong> — hourly report during a siege.</li>
            </ul>

            <h2 id="content">What a report contains</h2>
            <ul>
                <li><strong>Forces engaged</strong> — starting armor, shield and weapons of each side, and the composition of every fleet. Aim no longer appears as a percentage, but as the <strong>damage multiplier</strong> it actually produces (×0.66 with nothing invested, ×0.94 at full aim, ×1.06 for a planet's defenses): no shot ever misses, better aim raises the floor of your damage.</li>
                <li><strong>Salvos</strong> — how many salvos this side fired, how many went against the enemy shield, and whether its own shield was pierced or held.</li>
                <li><strong>Shield charge</strong> — for a fleet block, the charge percentage at the start and end of the fight, along with its total capacity: your shield doesn't automatically reset to 100% from one battle to the next, it recharges gradually (see the <em>Space combat</em> article).</li>
                <li><strong>Armour remaining</strong> — what is still standing, and its share of the starting armour. An annihilated side instead shows the <strong>surplus damage</strong> it absorbed beyond its armour: that is your margin of victory.</li>
                <li><strong>Damage taken</strong> — two counters per side: <strong>hull</strong> (what got through the shield) and <strong>shield</strong> (what the wall blocked). Your losses follow directly from them.</li>
                <li><strong>Losses</strong> — ship by ship, on both sides.</li>
                <li><strong>Planetary defense breakdown</strong> — turret losses, plus your Shield, Large Shield and Space Base when you have them; the defense score and the "Attacking" tag shown for a merged battle are the real ones.</li>
                <li><strong>Plundered resources</strong> (for raids) and <strong>debris generated</strong> — recycle them!</li>
                <li><strong>War Points earned</strong> and the final result.</li>
            </ul>

            <h2 id="learn">How to learn from it</h2>
            <ul>
                <li>Look at the <strong>damage taken</strong> first: the "hull" line counts the exposure of your shieldless ships <em>and</em> what got through a pierced shield; the "shield" line, what the wall absorbed (your shield bearers wear down in proportion).</li>
                <li>Compare the two <strong>damage multipliers</strong>: it is the only figure directly comparable between the two sides, and now the only one the game shows — precision percentages are gone from every screen. Then look at the <strong>armour remaining</strong> — winning with 5% of your armour left and winning with 70% left used to read identically. A large surplus on the enemy side means you overpaid for the win.</li>
                <li>Losses among your <strong>hunters</strong> are normal even when the wall holds: without shields, they take their share of the fire head-on — but being small, they only attract a small share.</li>
                <li>Many <strong>salvos spent on the enemy shield</strong>? Build plasma (×4 against shields) to pierce faster.</li>
                <li><strong>100 rounds reached</strong>: the side keeping the most armor wins — if that happens to you on the attack, your fleet lacks power or precision.</li>
                <li><strong>Archive your important reports</strong>: they serve as evidence in alliance debates.</li>
            </ul>

    combat_simulator:
        title: "Combat simulator"
        category: "combat"
        order: 9
        tags: "simulator,combat,simulation,fleet,losses,estimate,report"
        summary: "Estimate your risks before attacking: replay a battle a thousand times against a fleet observed in a report, using the game's real engine."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="purpose">What it is for</h2>
            <p>The <strong>Combat simulator</strong> tab of the Fleets page estimates what you risk before attacking. It replays a battle <strong>1,000 times</strong> between one of your fleets and an enemy fleet, using the <strong>game's real engine</strong> — same formulas, same random rolls. Nothing is actually committed: no ship moves, none dies.</p>

            <h2 id="source">The source: a combat report</h2>
            <p>The enemy fleet comes from one of your <strong>recent combat reports</strong> (those showing the "Damage taken" line): they are the only honest sources, as they hold the observed side's real power, bonuses included. A spy report only gives ship counts, without their real statistics — the simulation would be misleading, which is why it is not offered.</p>
            <p>Pick the report, the side to face (either armada of the report), then one of your armed fleets. You always simulate as the <strong>attacker</strong>, with your real bonuses (hero, alliance, politics).</p>

            <h2 id="reading">Reading the result</h2>
            <ul>
                <li><strong>Win rate</strong> — the share of the 1,000 runs you win.</li>
                <li><strong>Loss range per ship type</strong> (minimum, median, maximum) — across winning runs only: in case of defeat, your fleet would be entirely destroyed.</li>
                <li><strong>A sample outcome</strong> — a median run, laid out like a report and clearly marked "SIMULATION".</li>
            </ul>

            <h2 id="limits">Limits to keep in mind</h2>
            <ul>
                <li>The enemy fleet is the one <strong>observed at the report's date</strong>: it may have been rebuilt, upgraded or reinforced since.</li>
                <li>The enemy's situational assets (hero, planetary defenses when fighting at home) are only known in the real battle.</li>
                <li>Limit of <strong>20 simulations per day</strong>: the simulator informs a decision, it does not replace the risk of battle.</li>
            </ul>

    colonization:
        title: "Colonizing a new planet"
        category: "planet"
        order: 1
        tags: "colonization,planet,colonizer,expansion"
        summary: "Expand your empire by founding new planets on empty locations."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="why">Why colonize?</h2>
            <ul>
                <li><strong>More production</strong> — each planet has its own economy.</li>
                <li><strong>More parallel build queues</strong>.</li>
                <li><strong>Less risk</strong> — your eggs aren't in one basket anymore.</li>
                <li><strong>Strategic positions</strong> — close to traders, allies, targets.</li>
            </ul>

            <h2 id="steps">How to colonize</h2>
            <ol>
                <li>Unlock the <strong>Expansion</strong> research (to earn the right to more planets).</li>
                <li>Build a <strong>Colonizer</strong> at your Spaceyard.</li>
                <li>Load it with some starter resources (recommended: niobium and water).</li>
                <li>Send it on a <strong>Colonization</strong> mission to an <strong>empty location</strong> on the map.</li>
            </ol>
            <p>On arrival, the new planet is founded. It appears in your right panel.</p>

            <h2 id="initial">What it starts with</h2>
            <p>A freshly colonized planet starts with a modest base (a few hundred niobium and water, about 2,500 workers, 20 Legionnaires). Everything else needs building.</p>

            <h2 id="limit">Max planets?</h2>
            <p>The limit depends on:</p>
            <ul>
                <li>Your <strong>Expansion</strong> research level.</li>
                <li>Your <strong>alliance</strong> (some alliance research unlocks extra planets).</li>
                <li>Your successful <strong>invasions</strong> (some offensive alliance research also grants planets).</li>
            </ul>

            <h2 id="choice">Where to colonize?</h2>
            <ul>
                <li>Near a <strong>trader</strong>: easy economy by sending cargos.</li>
                <li>Near your <strong>allies</strong>: mutual defense.</li>
                <li>On a <strong>"rich" location</strong> (larger, terraformable): better production.</li>
                <li>Avoid isolating yourself too far from everything: slower fleets, complicated resupply.</li>
            </ul>

    planet_types:
        title: "Everything you find on the map"
        category: "planet"
        order: 2
        tags: "planet,moon,sun,trader,alien,debris,cthulhu"
        summary: "The different objects visible on the galaxy map and what you can do with them."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">The 7 types of objects</h2>
            <table>
                <tr><th>Type</th><th>Description</th><th>Possible actions</th></tr>
                <tr><td><strong>Planet</strong> (inhabited)</td><td>Belongs to a player. You can build there, colonize (if empty)…</td><td>Scout, raid, invade, bomb.</td></tr>
                <tr><td><strong>Moon</strong></td><td>Created by a Moon Maker. Ultra-fast food production (1 min cycle).</td><td>Scout, raid, invade.</td></tr>
                <tr><td><strong>Sun</strong></td><td>Non-colonizable stellar object.</td><td>None.</td></tr>
                <tr><td><strong>Empty slot</strong></td><td>Free position with no object. Ideal to colonize or create a moon.</td><td>Colonize, drop a moon, resupply an ally.</td></tr>
                <tr><td><strong>Trader</strong></td><td>Immune NPC that buys your resources for Bitcoins.</td><td>Sell (Unloading mission).</td></tr>
                <tr><td><strong>Alien / Cthulhu planet</strong></td><td>Hive base, defended by a permanent garrison.</td><td>Invade to liberate (uranium + lowers the Universe Threat).</td></tr>
                <tr><td><strong>Debris field</strong></td><td>Combat remains (niobium, water) or spontaneous spawn (uranium).</td><td>Recycle.</td></tr>
            </table>

            <h2 id="spot">Spotting them on the map</h2>
            <p>Each type has its icon. Hover with the mouse to see the owner's name (if inhabited), estimated size and your options.</p>

            <h2 id="moons">Special case: moons</h2>
            <p>Moons are created with a special <strong>Moon Maker</strong> ship, on an empty slot holding at least 2M niobium and 2M water in debris. Once placed, the moon produces <strong>food 10× faster</strong> than a planet (1-minute cycle instead of 10). It's a precious food mine to support a large army.</p>

    planet_management:
        title: "Managing a planet"
        category: "planet"
        order: 3
        tags: "management,planet,production,capacity,specialization"
        summary: "How to optimize production, organize your space, and optionally specialize a planet."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basics">Basics to master</h2>
            <ul>
                <li><strong>Production levels</strong> — regularly upgrade Mine / Extractor / Farm.</li>
                <li><strong>Storage</strong> — without enough storage, production caps and stops.</li>
                <li><strong>Population</strong> — Cities and Metropolises raise your worker cap.</li>
                <li><strong>Minimum defense</strong> — a small bunker, a few Mechs — that's the baseline.</li>
            </ul>

            <h2 id="optimize">Optimize a planet</h2>
            <ol>
                <li>Build production buildings <strong>in pairs</strong> (Mine + Extractor often go up together).</li>
                <li>Research <strong>Terraforming</strong> to expand the planet and build more.</li>
                <li>Keep an eye on <strong>food autonomy</strong>: Farm / Aeroponic Farm sufficient for your pop.</li>
                <li>Drop a <strong>moon</strong> nearby to boost food production.</li>
            </ol>

            <h2 id="specialize">Specializing your planets</h2>
            <p>Multiple planets = chance to specialize them by position and buildings:</p>
            <ul>
                <li><strong>Economic planet</strong> — many mines, many workers, selling to nearby traders.</li>
                <li><strong>Military planet</strong> — spaceyard, heavy factories, big defenses, to station your fleet.</li>
                <li><strong>Research planet</strong> — Research Center built high, many scientists.</li>
                <li><strong>Frontier outpost</strong> — radar/jammer, probes, turrets. For monitoring or containing a neighbor.</li>
            </ul>

            <h2 id="capital">The capital planet</h2>
            <p>Your <strong>first planet</strong> plays a special role: if your hero is destroyed in combat, they're automatically reassigned there. Always keep it well-defended.</p>

    planet_abandon:
        title: "Abandoning a planet"
        category: "planet"
        order: 4
        tags: "abandon,planet,delete,game over"
        summary: "When it's a good idea, how to do it, and why you should avoid it in some cases."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="why">Why abandon a planet?</h2>
            <ul>
                <li>It's <strong>too exposed</strong> to attacks and costs more than it earns.</li>
                <li>It's <strong>badly placed</strong> (far from everything, hard to defend).</li>
                <li>You want to <strong>colonize a better one</strong>, but you're at the planet cap.</li>
            </ul>

            <h2 id="how">How to do it</h2>
            <p>Abandon is done from the <strong>Planet</strong> page → Management section. A confirmation is required (it's irreversible).</p>
            <p>Before letting it go: <strong>evacuate all resources, Legionnaires, ships</strong> to another planet. Once abandoned, everything left is lost.</p>

            <h2 id="danger">The trap to absolutely avoid</h2>
            <p>Abandoning your <strong>last planet</strong> is <strong>Game Over</strong>:</p>
            <ul>
                <li>Your fleets are <strong>transferred to aliens</strong>.</li>
                <li>Your commander is eliminated from the server.</li>
                <li>The game is over.</li>
            </ul>
            <p>Never abandon without making sure you have at least one other still active.</p>

    galaxy_navigation:
        title: "Navigating the galaxy"
        category: "planet"
        order: 5
        tags: "galaxy,sector,navigation,map,universe,coordinates"
        summary: "How the universe is organized, how to read coordinates, and how to use the map."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">How the universe is organized</h2>
            <p>The universe is a hierarchy:</p>
            <ul>
                <li>The <strong>Universe</strong> contains several <strong>Galaxies</strong>.</li>
                <li>Each <strong>Galaxy</strong> contains <strong>Sectors</strong> (10×10 grid).</li>
                <li>Each <strong>Sector</strong> contains 25 <strong>Positions</strong> (5×5 grid).</li>
            </ul>
            <p>Each position can hold a planet, trader, debris field, moon, sun, or be empty.</p>

            <h2 id="coordinates">Reading coordinates</h2>
            <p>Format: <strong>Galaxy:Sector:Position</strong>, e.g. <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — first galaxy;</li>
                <li><strong>5</strong> — fifth sector of that galaxy;</li>
                <li><strong>12</strong> — twelfth position in that sector.</li>
            </ul>

            <h2 id="map">Using the map</h2>
            <p>The <strong>Map</strong> page (left menu) shows the space view. You can:</p>
            <ul>
                <li>Move between galaxies and sectors.</li>
                <li>Click a position to see what's there.</li>
                <li><strong>Send a fleet directly</strong> by clicking "Attack / Send" from the tile.</li>
                <li>See positions of allies, enemies and traders (based on your relations and radar).</li>
            </ul>
            <p><strong>Fleets in transit</strong> appear as small animated ships gliding in real time between the origin and destination planets. The <strong>colored halo</strong> indicates the side: <strong>blue</strong> = you, <strong>green</strong> = alliance, <strong>grey</strong> = pact/peace, <strong>magenta</strong> = trader, <strong>purple</strong> = alien, <strong>red</strong> = enemy. The <strong>size</strong> reflects the fleet's signature. Your own and alliance fleets are always visible; others only appear when your <strong>radar</strong> covers the sector. For long-range flights crossing several sectors, the marker only shows during the final portion of the trip — entry into the destination sector — not throughout the journey.</p>

            <h2 id="hyperspace">Inter-galaxy travel</h2>
            <p>To go from one galaxy to another, you need the <strong>Hyperspace</strong> research. Inter-galaxy trips are long and fuel-expensive — plan ahead.</p>

    radar_jammer:
        title: "Radar and jamming"
        category: "planet"
        order: 6
        tags: "radar,jammer,detection,surveillance"
        summary: "See the enemy coming before they arrive, and hide your own movements."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principle">Radar vs Jammer</h2>
            <ul>
                <li><strong>Radar</strong> — sees approaching fleets. Gives you time to react.</li>
                <li><strong>Jammer</strong> — hides your own movements from enemy radars.</li>
            </ul>

            <h2 id="detection">Available radars</h2>
            <table>
                <tr><th>Type</th><th>Where</th><th>Role</th></tr>
                <tr><td><strong>Radar</strong> (building)</td><td>On the planet (ground)</td><td>Local detection. Warns about fleets approaching your planet.</td></tr>
                <tr><td><strong>Sky Radar</strong> (building)</td><td>Sky (orbital island)</td><td>Extended detection. More range, better accuracy.</td></tr>
                <tr><td><strong>Radar</strong> (ship)</td><td>In fleet</td><td>Mobile detection. Useful for exploring or monitoring a zone far from home.</td></tr>
            </table>

            <h2 id="jamming">Available jammers</h2>
            <table>
                <tr><th>Type</th><th>Where</th><th>Role</th></tr>
                <tr><td><strong>Sky Jammer</strong> (building)</td><td>Sky (orbital island)</td><td>Jams enemy radars around your planet.</td></tr>
                <tr><td><strong>Jammer</strong> (ship)</td><td>In fleet</td><td>Jams radars around your fleet in flight.</td></tr>
            </table>

            <h2 id="ground-ships">Seeing the ships on the ground</h2>
            <p>The <strong>ground signature</strong> — the ships parked on a planet — follows a slightly looser rule: one of your fleets <strong>in orbit</strong> counts them on sight, even with no radar. But for that planet only.</p>
            <p>The <strong>radar</strong> remains what gives you that reading <strong>at range</strong>, across the whole sector. And a <strong>Sky Jammer</strong> on the planet shuts the observation down: without a radar stronger than the jammer, the ground signature goes invisible again, even with a fleet overhead.</p>

            <h2 id="strategy">How to use them</h2>
            <ul>
                <li><strong>Radar</strong> on every planet: at minimum the base building, so you don't get surprised.</li>
                <li><strong>Jammer</strong> in fleet: essential for a long-distance surprise attack.</li>
                <li><strong>Deploy</strong> a radar satellite (dedicated mission) on a strategic spot to watch a neighbor.</li>
                <li>The <strong>Wave</strong> research improves the range and accuracy of all radars.</li>
            </ul>

    moon:
        title: "Moons"
        category: "planet"
        order: 7
        tags: "moon,moonmaker,food,production"
        summary: "A moon produces food 10× faster than a planet. How to create one."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="what">What is a moon?</h2>
            <p>A <strong>moon</strong> is a special object, smaller than a planet, <strong>dedicated solely to food production</strong>. Its cycle runs in <strong>1 minute</strong> instead of 10: so it produces 10× faster than a planet of the same size.</p>
            <p>A moon is an excellent complement to support an army that consumes a lot (many Legionnaires, Mechs, ships on mission).</p>

            <h2 id="creation">How to create a moon</h2>
            <p>A moon is born from a <strong>debris field</strong>: you need an <strong>empty slot</strong> holding at least <strong>2M niobium AND 2M water</strong> in debris (left by a space battle at that spot). The Moon mission is only offered on the map when the slot meets this condition.</p>
            <ol>
                <li>Build a <strong>Moon Maker</strong> (special, costly ship).</li>
                <li>Send it on a <strong>Moon</strong> mission to an empty slot rich enough in debris.</li>
                <li>On arrival, the moon is created and <strong>consumes all the debris</strong>. If the conditions are no longer met (debris recycled during the flight, slot colonized…), a report explains the failure.</li>
            </ol>

            <h2 id="size">Moon size</h2>
            <p>The richer the debris field, the bigger the moon. The tier is set by the <strong>lower</strong> of the two resources:</p>
            <table>
                <tr><th>Debris (min. niobium/water)</th><th>Ground</th></tr>
                <tr><td>2M – 8M</td><td>100 – 150</td></tr>
                <tr><td>8M – 15M</td><td>150 – 190</td></tr>
                <tr><td>15M – 25M</td><td>190 – 230</td></tr>
                <tr><td>25M – 50M</td><td>230 – 280</td></tr>
                <tr><td>50M and above</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limits">Limitations</h2>
            <ul>
                <li>A moon <strong>only produces food</strong> (no niobium or water).</li>
                <li>It can be <strong>attacked, raided, invaded</strong> like a regular planet.</li>
                <li>Building a moon close to home is safer (less exposed to hostile neighbors).</li>
            </ul>

            <h2 id="strategy">When to place one</h2>
            <ul>
                <li>You struggle to feed your army → a nearby moon solves it.</li>
                <li>A big battle left a <strong>rich debris field</strong> near your home: instead of recycling it all, turn it into a moon.</li>
                <li>You're well established, have resources to spend, and want to consolidate your economy.</li>
            </ul>

    alliance_basics:
        title: "Creating and joining an alliance"
        category: "alliance"
        order: 1
        tags: "alliance,creation,join,bonus,regime,politics"
        summary: "Team up with players, gain bonuses, and choose your political regime."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="why">Why join an alliance?</h2>
            <ul>
                <li><strong>+20% production</strong> immediately on all resources.</li>
                <li>Access to <strong>20 alliance researches</strong> (economic, military, defensive bonuses).</li>
                <li>A <strong>shared Bitcoin treasury</strong>.</li>
                <li><strong>Diplomacy</strong> (wars, peace, pacts) and a <strong>chat room</strong>.</li>
                <li>The ability to <strong>invade</strong> other planets (reserved for alliance members in PvP mode).</li>
            </ul>
            <p>In short: playing solo is viable at the start. But as soon as the game gets serious, an alliance multiplies your chances of progress.</p>

            <h2 id="join">How to join</h2>
            <ol>
                <li><strong>Alliance</strong> page (left menu).</li>
                <li>Browse the list of open alliances, or search by name.</li>
                <li>Make a membership request. The leader (or an officer) approves.</li>
            </ol>
            <p>You can also <strong>create your own alliance</strong> from the same page, choosing a name, tag and political regime.</p>

            <h2 id="invitations">Receiving invitations</h2>
            <p>A leader (or an officer with the recruit permission) can also <strong>invite</strong> you directly. You can hold <strong>one invitation from each alliance at the same time</strong> — being courted by one does not hide you from the others — but the same alliance cannot invite you twice until you answer. Alliances that spot you can see you are <strong>already courted</strong>, without knowing by whom. As soon as you <strong>accept</strong> one invitation, all the others are automatically withdrawn; and if an alliance is <strong>dissolved</strong>, its invitation disappears from your list.</p>

            <h2 id="delai">Cooldown after leaving an alliance</h2>
            <p>After <strong>leaving</strong> an alliance, being <strong>kicked</strong>, or after your alliance is <strong>dissolved</strong>, a <strong>2-day cooldown</strong> applies: you cannot <strong>create</strong> or <strong>join</strong> a new alliance until it expires. This prevents abusive back-and-forth between alliances.</p>

            <h2 id="regimes">The 3 political regimes</h2>
            <p>When <strong>creating</strong> an alliance, you pick a <strong>political regime</strong>. This choice determines the accessible bonuses, possible researches, and certain internal rules. It is <strong>final</strong>.</p>

            <h3 id="democracy">The Balance of Worlds (Democratic)</h3>
            <p><strong>Advantages:</strong></p>
            <ul>
                <li>Vote to designate the President.</li>
                <li><strong>+20%</strong> attack against offensive alliances.</li>
                <li>Members can leave the alliance freely.</li>
                <li>7 economic researches:
                    <ul>
                        <li>+35% resource production</li>
                        <li>+50% research speed</li>
                        <li>-100% scientist upkeep cost</li>
                        <li>+100% cargo size</li>
                        <li>+50% ship armor</li>
                        <li>+25% gain on trader sales</li>
                        <li>+5 colonizable planets</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Drawbacks:</strong></p>
            <ul>
                <li>All alliance members are publicly known.</li>
                <li>The position of the first planet is displayed.</li>
            </ul>

            <h3 id="communism">The Silent Rampart (Offensive Alliance)</h3>
            <p><strong>Advantages:</strong></p>
            <ul>
                <li>One extra alliance member.</li>
                <li><strong>+20%</strong> attack against defensive alliances.</li>
                <li>7 offensive researches:
                    <ul>
                        <li>+100% recycling speed</li>
                        <li>+100% worker defense</li>
                        <li>+50% ship power</li>
                        <li>-50% Legionnaire upkeep cost</li>
                        <li>-1 Bitcoin per level on Legionnaire recruitment (8 → 3)</li>
                        <li>+5 planets via invasions</li>
                        <li>+50% War Points gain</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Drawbacks:</strong></p>
            <ul>
                <li>Tax fixed automatically at 50%.</li>
                <li>All members hold leader status.</li>
                <li>Impossible to leave the alliance.</li>
            </ul>

            <h3 id="fascism">The Hammer of the Stars (Defensive Alliance)</h3>
            <p><strong>Advantages:</strong></p>
            <ul>
                <li>Reduced Cthulhu threat.</li>
                <li><strong>+20%</strong> attack against Balance of Worlds alliances.</li>
                <li>Only the Leader is publicly displayed.</li>
                <li>7 defensive researches:
                    <ul>
                        <li>+100% worker production</li>
                        <li>+50% ship power</li>
                        <li>+75% invasion barge capacity</li>
                        <li>+50% Legionnaire strength</li>
                        <li>-100% Mech upkeep cost</li>
                        <li>+50 Mech defense</li>
                        <li>+5 planets via invasions</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Drawbacks:</strong></p>
            <ul>
                <li>If the leader is Game Over'd, the alliance dissolves.</li>
                <li>Impossible to leave the alliance.</li>
                <li>Impossible to delete the alliance.</li>
                <li>One fewer alliance member.</li>
                <li>The Leader is the sole head of the alliance.</li>
            </ul>
            <h2 id="compte-valide">Account to validate</h2>
            <p>⚠️ To <strong>create or join</strong> an alliance, your account must be <strong>validated</strong> and your <strong>email confirmed</strong>. Test/anonymous accounts cannot join an alliance — confirm your email from <strong>My options</strong>.</p>
            <h2 id="discord">Your alliance on Discord</h2>
            <p>Link your Discord account in <strong>My options</strong> and tick <strong>Show my alliances on Discord</strong>: the game gives you the role of each of your alliances on the <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area Universe Discord</a>, and removes it when you leave or the alliance is dissolved. Nobody can take the role of an alliance they are not a member of. Untick the box at any time to remove your roles.</p>

    alliance_grades:
        title: "Grades and permissions"
        category: "alliance"
        order: 2
        tags: "grades,permissions,roles,hierarchy,officer,leader"
        summary: "How an alliance's internal hierarchy works and who's allowed to do what."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principle">The principle</h2>
            <p>An alliance is organized into <strong>grades</strong>, from the highest (leader) to the lowest (fresh recruit). Each grade has a set of <strong>configurable permissions</strong>.</p>

            <h2 id="hierarchy">Typical hierarchy</h2>
            <ul>
                <li><strong>Grade 1 — Leader</strong> — founder of the alliance. All rights. One per alliance (except in certain regimes).</li>
                <li><strong>Grade 2+ — Officers</strong> — can make delegated decisions (diplomacy, treasury, recruiting…).</li>
                <li><strong>Intermediate grades</strong> — veterans, advisors. Configurable to taste.</li>
                <li><strong>Lowest grade</strong> — new recruits, limited permissions.</li>
            </ul>

            <h2 id="permissions">Configurable permissions</h2>
            <p>For each grade, the leader can toggle:</p>
            <ul>
                <li><strong>Invite</strong> new members.</li>
                <li><strong>Kick</strong> a member.</li>
                <li><strong>Access the treasury</strong> (deposit, withdraw).</li>
                <li><strong>Declare war</strong> on another alliance.</li>
                <li><strong>Accept peace</strong>, a pact or a defensive alliance.</li>
                <li><strong>Change grades</strong> of other members.</li>
                <li><strong>Manage alliance researches</strong>.</li>
            </ul>

            <h2 id="change">Promoting or demoting</h2>
            <p>An officer with the right permission can change a member's grade. It's a way to reward the active players and mentor new ones.</p>

            <h2 id="regimes">Special cases by regime</h2>
            <p>Some political regimes change these rules:</p>
            <ul>
                <li><strong>The Silent Rampart</strong> — all members are leaders (no hierarchy).</li>
                <li><strong>The Hammer of the Stars</strong> — one sole, irremovable leader; if the leader falls, the alliance dissolves.</li>
                <li><strong>The Balance of Worlds</strong> — the President is elected by vote.</li>
            </ul>

            <h2 id="afk">Automatic replacement of an inactive leader</h2>
            <p>If the <strong>leader</strong> of an alliance stops logging in for <strong>more than 7 days</strong>, they are automatically replaced to keep the alliance from being paralyzed:</p>
            <ul>
                <li>The <strong>highest-ranked active member</strong> takes the head of the alliance. In case of a tie in grade, it's the one with the most <strong>War Points</strong>.</li>
                <li>The two grades are simply <strong>swapped</strong>: the former leader gets the replacement's grade.</li>
                <li>If there is <strong>no active member</strong> who can take over, nothing changes.</li>
            </ul>

    diplomacy:
        title: "Diplomacy"
        category: "alliance"
        order: 3
        tags: "diplomacy,war,peace,pact,ally,defcon,treaty"
        summary: "The 4 relation types between alliances, how to negotiate them, and what DEFCON means."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Your alliance maintains <strong>relations</strong> with other alliances on the server. These relations change the game rules between your respective members (who can attack whom).</p>

            <h2 id="types">The 4 relation types</h2>
            <table>
                <tr><th>Type</th><th>Effect</th><th>Use</th></tr>
                <tr><td><strong>War</strong></td><td>Open conflict. Everything is allowed between the two alliances.</td><td>Declared by an officer. Priority enemies.</td></tr>
                <tr><td><strong>Peace</strong></td><td>Cease-fire. No attack possible. Can include a peace tax.</td><td>Ending a war, or avoiding a costly conflict.</td></tr>
                <tr><td><strong>Pact</strong></td><td>Mutual non-aggression. No attack but no forced mutual aid.</td><td>Stable neutral relations.</td></tr>
                <tr><td><strong>Defensive alliance</strong></td><td>Mutual military support. Info shared, joint defense.</td><td>For close allies.</td></tr>
            </table>

            <h2 id="propose">How to propose a treaty</h2>
            <ol>
                <li><strong>Alliance</strong> page → <strong>Diplomacy</strong>.</li>
                <li>Choose the target alliance from the list.</li>
                <li>Propose a relation type (peace, pact, alliance).</li>
                <li>The other side must <strong>accept</strong>. They accept, refuse, or counter-propose.</li>
            </ol>

            <h2 id="defcon">DEFCON (alert level)</h2>
            <p>Your alliance has a <strong>DEFCON alert level</strong>, a number indicating its state of tension. <strong>The lower the number, the more dangerous the situation.</strong> DEFCON 1 means imminent total war.</p>
            <p>It's a visual indicator for coordinating: low DEFCON = all members on deck.</p>

            <h2 id="logs">The diplomatic log</h2>
            <p>Every diplomatic action (war declaration, peace accepted, pact broken…) is <strong>recorded</strong> in the alliance history, with author's name and timestamp. Useful for internal transparency and post-mortem debates.</p>

    alliance_treasury:
        title: "Alliance treasury"
        category: "alliance"
        order: 4
        tags: "treasury,bitcoin,deposit,withdrawal,tax"
        summary: "Your alliance's common pool, fueled by members and peace taxes."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principle">What the treasury is for</h2>
            <p>The alliance treasury is a <strong>shared Bitcoin account</strong>. It serves to:</p>
            <ul>
                <li>Pay for <strong>alliance researches</strong>.</li>
                <li>Help out a struggling member.</li>
                <li>Fund a collective effort (war preparation, event).</li>
            </ul>

            <h2 id="fund">How to fund it</h2>
            <ul>
                <li><strong>Voluntary deposits</strong> — any member can pay in Bitcoins.</li>
                <li><strong>Alliance tax</strong> — if enabled, a percentage of each member's income is automatically deducted at daily report time.</li>
                <li><strong>Peace taxes</strong> — if you've imposed a tax on an alliance you've made peace with, it automatically lands in the treasury.</li>
            </ul>

            <h2 id="withdraw">Withdrawals</h2>
            <p>Withdrawals are restricted to grades with <strong>treasury permission</strong> — usually officers and the leader. Every movement is logged.</p>

            <h2 id="taxes">The alliance tax</h2>
            <p>The alliance tax is configurable by the leader. It takes a percentage of each member's income, <strong>automatically at daily report</strong>. Keep it reasonable: too high, and members leave.</p>

            <h2 id="transparency">Transparency</h2>
            <p>The <strong>treasury logs</strong> show who deposited/withdrew, when, how much. It's a trust tool: anyone can verify.</p>

    political_system:
        title: "The 3 political regimes"
        category: "alliance"
        order: 5
        tags: "politics,regime,bonus,balance,rampart,hammer"
        summary: "The 3 regime choices for an alliance: pros, cons, and how to pick."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principle">Choose at creation</h2>
            <p>When an alliance is created, the founder chooses a <strong>political regime</strong>. This regime defines <strong>internal rules</strong>, <strong>specific bonuses</strong>, and a dedicated <strong>alliance research tree</strong>. The choice is <strong>irreversible</strong>.</p>

            <h2 id="balance">The Balance of Worlds (democratic)</h2>
            <p>Open and economic regime. Members vote to elect their President. Focus on the <strong>economy</strong>.</p>
            <ul>
                <li>+20% attack against offensive alliances.</li>
                <li>Members publicly visible.</li>
                <li>Members can leave freely.</li>
                <li>Economy-oriented researches (production, cargo, faster science research, trader sales…).</li>
            </ul>

            <h2 id="rampart">The Silent Rampart (offensive)</h2>
            <p>Aggressive, collective regime. All members are leaders. Focus on <strong>offense</strong>.</p>
            <ul>
                <li>+20% attack against defensive alliances.</li>
                <li>One extra allowed member.</li>
                <li>Alliance tax fixed at 50% automatically.</li>
                <li>Cannot leave the alliance.</li>
                <li>Combat-oriented researches (ship power, reduced Legionnaire cost, recycling speed, invasions…).</li>
            </ul>
            <p>The three top grades (<strong>Guide</strong>, <strong>Protector</strong>, <strong>Comrade</strong>) are <strong>equivalent</strong>: same rights, no hierarchy between them. They can be freely assigned among members; only the recruit grade (Gulag) is lower.</p>

            <h2 id="hammer">The Hammer of the Stars (defensive)</h2>
            <p>Discreet, defensive regime. One sole leader. Focus on <strong>defense</strong> and resilience.</p>
            <ul>
                <li>+20% attack against democratic alliances.</li>
                <li>Reduced Cthulhu threat (very useful in PvE).</li>
                <li>Only the leader is publicly displayed.</li>
                <li>Cannot leave the alliance. Cannot dissolve it.</li>
                <li>If the leader Game Overs, the alliance is dissolved.</li>
                <li>One fewer member than other regimes.</li>
                <li>Defense-oriented researches (worker production, Legionnaire strength, Mech defense, barge capacity…).</li>
            </ul>

            <h2 id="combat">Bonuses between regimes</h2>
            <p>Each regime has a +20% attack bonus <strong>against a rival regime</strong>, rock-paper-scissors style:</p>
            <ul>
                <li>Balance beats Rampart.</li>
                <li>Rampart beats Hammer.</li>
                <li>Hammer beats Balance.</li>
            </ul>

            <h2 id="choose">How to choose?</h2>
            <ul>
                <li><strong>You're starting out and want growth</strong> → The Balance of Worlds (economic, flexible).</li>
                <li><strong>You want a tight, aggressive alliance</strong> → The Silent Rampart.</li>
                <li><strong>You want to protect yourself, play defensively</strong> → The Hammer of the Stars (warning: if the leader Game Overs, everything collapses).</li>
            </ul>

    alliance_research:
        title: "Alliance researches"
        category: "alliance"
        order: 6
        tags: "research,alliance,politics,upgrade,bonus"
        summary: "Collective bonuses funded by the alliance treasury, benefiting all members."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principle">How it works</h2>
            <p>Your alliance has a <strong>dedicated research tree</strong> that depends on its <strong>political regime</strong>. Each research costs Bitcoins (deducted from the treasury) and spans multiple levels.</p>
            <p>Bonuses <strong>benefit all members</strong>. This is one of the main reasons to join or stay loyal to an alliance.</p>

            <h2 id="list">Typical alliance researches</h2>
            <table>
                <tr><th>Research</th><th>What it improves</th></tr>
                <tr><td><strong>Production</strong></td><td>Resource production bonus.</td></tr>
                <tr><td><strong>Workers</strong></td><td>Faster population growth.</td></tr>
                <tr><td><strong>Worker defense</strong></td><td>Workers resist better in invasions.</td></tr>
                <tr><td><strong>Research speed</strong></td><td>Individual researches finish faster.</td></tr>
                <tr><td><strong>Armament</strong></td><td>Ship damage in combat.</td></tr>
                <tr><td><strong>Armor</strong></td><td>Ship armor.</td></tr>
                <tr><td><strong>Legionnaire / scientist / Mech cost</strong></td><td>Cheaper recruitment.</td></tr>
                <tr><td><strong>Barge capacity</strong></td><td>More Legionnaires per barge.</td></tr>
                <tr><td><strong>Cargo capacity</strong></td><td>More resources transported.</td></tr>
                <tr><td><strong>Recycling capacity</strong></td><td>More debris per cycle.</td></tr>
                <tr><td><strong>Colonization</strong></td><td>More colonizable planets.</td></tr>
                <tr><td><strong>Legionnaire attack / defense</strong></td><td>Ground troops strength.</td></tr>
                <tr><td><strong>Mech defense</strong></td><td>Tougher Mechs.</td></tr>
                <tr><td><strong>Trader prices</strong></td><td>Better NPC sales.</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Bonus in ground combat.</td></tr>
                <tr><td><strong>War Points</strong></td><td>More WP earned in combat.</td></tr>
            </table>

            <h2 id="choose">Which researches to prioritize?</h2>
            <ul>
                <li><strong>Economic alliance</strong> (The Balance) → Production, Research Speed, Cargo.</li>
                <li><strong>Offensive alliance</strong> (The Rampart) → Armament, Invasion, Legionnaire Attack.</li>
                <li><strong>Defensive alliance</strong> (The Hammer) → Worker production, Mech defense, Barges.</li>
            </ul>
            <p>Discuss in the alliance chat before starting — it's a collective choice.</p>

    salon:
        title: "The alliance chat"
        category: "alliance"
        order: 7
        tags: "salon,chat,discussion,alliance,message"
        summary: "Your alliance's internal chat: real-time, searchable history, and strategic hub."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="how">How it works</h2>
            <p>The <strong>alliance chat</strong> is a real-time chat reserved for your alliance members. Accessible from the <strong>Alliance → Chat</strong> page (or a dedicated button in the menu).</p>
            <p>Messages are kept: you can scroll back through history to find info.</p>

            <h2 id="use">What it's for</h2>
            <ul>
                <li><strong>Coordinate attacks</strong> — launching a raid as a pair beats one solo try that gets repelled.</li>
                <li><strong>Alert</strong> when an enemy fleet is spotted.</li>
                <li><strong>Share coordinates</strong> (target planets, interesting debris fields) — written as <code>galaxy:sector:position</code> (e.g. <code>1:15:25</code>), they automatically become clickable, just like a link to a page in the game.</li>
                <li><strong>Discuss alliance strategy</strong> (researches, diplomacy, wars).</li>
                <li><strong>Introduce yourself</strong> to new members and build bonds.</li>
            </ul>

            <h2 id="best-practices">Best practices</h2>
            <ul>
                <li>Stay respectful — insults and harassment can be sanctioned by admins.</li>
                <li>Avoid spamming: leave room for strategic discussions.</li>
                <li>Mention members' names when you want their attention.</li>
                <li>Mental archiving: when advice is given, remember it — messages scroll fast.</li>
            </ul>

            <h2 id="private">What about private messages?</h2>
            <p>Aside from the chat, you can send a <strong>private message</strong> to any player on the server (including outside your alliance). Useful for silent diplomacy or to respond discreetly to a proposal. Coordinates and in-game links become clickable there too, exactly as in the chat.</p>

    alliance_improvements:
        title: "Alliance Improvements"
        category: "alliance"
        order: 8
        tags: "improvements,alliance,bonus,bitcoin,investment,collective,levels"
        summary: "Invest Bitcoin to unlock 16 collective bonuses that strengthen your whole alliance — research speed, production, combat power, and more."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="overview">Overview</h2>
            <p>The <strong>Improvements</strong> tab on the alliance page lets members invest Bitcoin to unlock and upgrade <strong>16 collective bonuses</strong>. These bonuses benefit <strong>all active members</strong> of the alliance. A player who leaves stops benefiting, but the alliance keeps its earned levels.</p>

            <h2 id="quota">Investment quota</h2>
            <p>Each member has a quota of <strong>20 investments per rolling 3-hour window</strong>. Unused investments are lost — the quota does not accumulate. Each investment costs <strong>1,000 Bitcoin</strong> deducted from your personal balance (a permanent money sink).</p>
            <p>In the interface, quick buttons <strong>×1 / ×5 / ×10</strong> under each bonus let you invest multiple points instantly in one click.</p>

            <h2 id="levels">Levels and thresholds</h2>
            <p>Each bonus has <strong>5 levels</strong>. The investment thresholds required to reach the next level are:</p>
            <table>
                <tr><th>Level</th><th>Investments required</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1,000</td></tr>
            </table>
            <p>⚠️ Investments beyond a level threshold are <strong>lost</strong> — there is no carry-over to the next level.</p>

            <h2 id="bonuses">The 16 bonuses and their effects</h2>
            <table>
                <tr><th>Bonus</th><th>Effect per level</th><th>Maximum (level 5)</th></tr>
                <tr><td><strong>Research speed</strong></td><td>+2% per level</td><td>+10%</td></tr>
                <tr><td><strong>Research cost</strong></td><td>−1% per level</td><td>−5%</td></tr>
                <tr><td><strong>Building construction boost</strong></td><td>+15 s reduction per helper</td><td>75 s reduction per helper</td></tr>
                <tr><td><strong>Building cost</strong></td><td>−1% per level</td><td>−5%</td></tr>
                <tr><td><strong>Niobium production</strong></td><td>+2% per level</td><td>+10%</td></tr>
                <tr><td><strong>Water production</strong></td><td>+2% per level</td><td>+10%</td></tr>
                <tr><td><strong>Ration production</strong></td><td>+2% per level</td><td>+10%</td></tr>
                <tr><td><strong>Fleet speed</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Missile power</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Laser power</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Plasma power</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Accuracy</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Fleet armor</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Shield</strong></td><td>+1% per level</td><td>+5%</td></tr>
                <tr><td><strong>Planetary defense</strong></td><td>+2% per level</td><td>+10%</td></tr>
                <tr><td><strong>Hero Experience</strong></td><td>+2% per level</td><td>+10%</td></tr>
            </table>
            <p>The <strong>Building construction boost</strong> directly powers the <a href="/wiki/alliance_construction_help">construction help</a> feature: the higher its level, the more each ally's help reduces build time.</p>

    alliance_construction_help:
        title: "Construction Help"
        category: "alliance"
        order: 9
        tags: "construction,help,alliance,boost,building,acceleration"
        summary: "One click to speed up all your allies' ongoing constructions at once — and they do the same for you."
        related: "alliance_improvements"
        body: |
            <h2 id="overview">Overview</h2>
            <p><strong>Construction help</strong> lets alliance members speed up each other's ongoing building projects with a single tap. When one or more allies have an active construction on their planet, a <strong>help icon</strong> (heart) appears in your global interface bar. The badge shows the number of eligible constructions.</p>
            <p>Clicking the icon automatically accelerates <strong>all eligible constructions</strong> in the alliance at once — no need to select them individually.</p>

            <h2 id="gain">Gain per help</h2>
            <p>Each help action reduces the remaining construction time by:</p>
            <blockquote><strong>15 seconds × level of the "Building construction boost" bonus</strong></blockquote>
            <p>The gain is <strong>capped at 75 seconds</strong> per help and per member (level 5 × 15 s = 75 s). A construction can never drop below <strong>30 seconds remaining</strong> through help.</p>
            <table>
                <tr><th>Bonus level</th><th>Gain per help</th></tr>
                <tr><td>0 (not unlocked)</td><td>15 s</td></tr>
                <tr><td>1</td><td>15 s</td></tr>
                <tr><td>2</td><td>30 s</td></tr>
                <tr><td>3</td><td>45 s</td></tr>
                <tr><td>4</td><td>60 s</td></tr>
                <tr><td>5</td><td>75 s</td></tr>
            </table>

            <h2 id="eligibility">Construction eligibility</h2>
            <p>For a construction to be eligible for help, two conditions must be met:</p>
            <ul>
                <li><strong>Total duration &gt; 30 seconds</strong> (from start to scheduled completion).</li>
                <li><strong>Remaining time &gt; 30 seconds</strong> at the moment help is given.</li>
            </ul>
            <p>Constructions that are nearly finished (less than 30 s remaining) do not benefit from help.</p>

            <h2 id="deduplication">Deduplication</h2>
            <p>A member can only help <strong>each construction once</strong>. The icon disappears automatically when there are no more constructions you haven't yet helped. Multiple members can help the same construction — gains stack: 3 members at level 3 each contribute 45 s, for a total of 135 s.</p>

            <h2 id="link">Link to alliance improvements</h2>
            <p>The gain per help depends directly on the level of the <strong>"Building construction boost"</strong> bonus in the <a href="/wiki/alliance_improvements">Improvements</a> tab. Investing in that bonus benefits everyone: the faster your allies finish their buildings, the faster the alliance empire grows.</p>

    leveling:
        title: "Levels and experience"
        category: "progression"
        order: 1
        tags: "level,experience,progression,score"
        summary: "Your progression from level 1 to 40, based on the size of your empire."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="score">What counts toward your score</h2>
            <p>Your score (or "commander points") reflects the <strong>overall size of your empire</strong>:</p>
            <ul>
                <li>Number of <strong>workers</strong>.</li>
                <li>Number and quality of <strong>ships</strong>.</li>
                <li>Number of <strong>troops</strong> (Legionnaires, Mechs).</li>
                <li>Level of <strong>buildings</strong> constructed.</li>
            </ul>
            <p>Ships weigh heavily, buildings weigh a lot. Losing a fleet in combat drops your score.</p>

            <h2 id="tiers">Level tiers</h2>
            <table>
                <tr><th>Level</th><th>Experience required</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100,000</td></tr>
                <tr><td>10</td><td>800,000</td></tr>
                <tr><td>15</td><td>5,000,000</td></tr>
                <tr><td>20</td><td>18,000,000</td></tr>
                <tr><td>25</td><td>100,000,000</td></tr>
                <tr><td>30</td><td>1,000,000,000</td></tr>
                <tr><td>35</td><td>25,000,000,000</td></tr>
                <tr><td>40</td><td>200,000,000,000</td></tr>
            </table>
            <p>Progression is <strong>exponential</strong>: going from level 1 to 10 is much faster than 30 to 40.</p>

            <h2 id="use">What your level is for</h2>
            <ul>
                <li><strong>Server ranking</strong> — a public indicator of your power.</li>
                <li><strong>Login bonus</strong> — the daily amount earned depends on your level.</li>
                <li><strong>Recognition</strong> — a high level impresses friends and enemies.</li>
            </ul>

    war_points:
        title: "War Points (WP)"
        category: "progression"
        order: 2
        tags: "wp,points,war,combat,ranking"
        summary: "The game's second currency, earned in combat. A measure of your aggressiveness."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="what">What are WP?</h2>
            <p><strong>War Points</strong> (<strong>WP</strong>) are a second "currency" of progression, <strong>combat-oriented</strong>. Where your level reflects your size, your WP reflect your military activity.</p>

            <h2 id="earn">How to earn them</h2>
            <ul>
                <li><strong>Space combats</strong> — WP depend on the enemy power you destroy, never on your own losses. Annihilating a Cthulhu horde or an alien fleet earns much less than a player fleet of the same power (anti-farming safeguard).</li>
                <li><strong>Losing a space fight</strong> — a consolation is still paid out, proportional to the signature of the fleet you lost, but always well below what a winner earns on an identical fleet: a fifth of that gain, never more.</li>
                <li><strong>Orbital defense</strong> — when your turrets annihilate a fleet in orbit, at the same ratio as a space victory (far less against a Cthulhu). Razing another planet's defenses, on the other hand, still earns the attacker nothing.</li>
                <li><strong>Raids and invasions</strong> — each ground victory earns WP.</li>
                <li><strong>Daily quests</strong> — some give WP. <strong>All 3 of the day completed = +250 bonus WP</strong>.</li>
                <li><strong>Arena (hero duels)</strong> — 50 to 200 WP per victory.</li>
                <li><strong>Defense against Cthulhu</strong> — victory in Tower Defense or Cthulhu invasion.</li>
                <li><strong>Prison</strong> — execute a captured hero (sparingly).</li>
            </ul>

            <h2 id="use">What they're for</h2>
            <ul>
                <li><strong>Unlock some researches</strong> that require WP as prerequisite.</li>
                <li><strong>WP ranking</strong> (military) — measure of your aggressiveness on the server.</li>
                <li><strong>Torture a prisoner</strong> in prison (costs WP to reveal the position of an enemy planet).</li>
                <li><strong>Weighted score</strong> in some server modes (like Paid Server).</li>
            </ul>

            <h2 id="strategy">Strategy</h2>
            <p>WP reward <strong>aggressive</strong> players. If you want to climb the military ranking, focus on space combat and invasions rather than pure economic growth.</p>

    quests:
        title: "Daily quests"
        category: "progression"
        order: 3
        tags: "quests,daily,mission,reward,wp"
        summary: "3 small missions each day. Simple, fast, and a 250 WP bonus if you do them all."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Every day, at <strong>18:59 UTC</strong>, the game assigns you <strong>3 daily quests</strong>. Small tasks you can complete during your normal play session.</p>

            <h2 id="examples">Quest examples</h2>
            <ul>
                <li>Scout a planet.</li>
                <li>Sell resources to a trader.</li>
                <li>Colonize a new planet.</li>
                <li>Build or level up a City / Metropolis.</li>
                <li>Send a private message to another player.</li>
                <li>Post a message in the alliance chat.</li>
                <li>Earn a certain amount of WP in combat.</li>
                <li>Recycle a debris field.</li>
            </ul>

            <h2 id="reward">Rewards</h2>
            <ul>
                <li>Each completed quest grants <strong>WP</strong>: the reward is the <strong>higher</strong> of the quest's base value and <strong>5% of the server's average points</strong>, so it stays worthwhile even when your empire grows huge.</li>
                <li>If you complete <strong>all 3 quests</strong> before the next daily report, you receive <strong>+250 bonus WP</strong> the following day.</li>
            </ul>
            <p>Over 30 days, that's 7,500 "free" WP just from playing regularly.</p>

            <h2 id="view">Where to see them</h2>
            <p>Your quests of the day are shown on the <strong>Empire</strong> page (or in a dedicated panel depending on the version). Automatically checked off as actions occur.</p>

    ranking:
        title: "Rankings"
        category: "progression"
        order: 4
        tags: "ranking,rank,position,top,leaderboard"
        summary: "Several rankings to measure your progression (and your rivals')."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="types">Available rankings</h2>
            <table>
                <tr><th>Ranking</th><th>Based on</th><th>Reward</th></tr>
                <tr><td><strong>Points (Empire)</strong></td><td>Overall size of your empire (workers, ships, troops, buildings, defences).</td><td>Prestige.</td></tr>
                <tr><td><strong>War Points</strong></td><td>Military activity (combats, raids, invasions).</td><td>Military prestige.</td></tr>
                <tr><td><strong>Alliance</strong></td><td>Sum of all alliance members' points.</td><td>Crowns the most powerful alliance.</td></tr>
                <tr><td><strong>Arena (heroes)</strong></td><td>Win/loss ratio in duels (minimum 5 fights).</td><td>Weekly rewards for top 3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Best TD scores on the server.</td><td>Prestige.</td></tr>
            </table>

            <h2 id="view">Where to see them</h2>
            <p><strong>Ranking</strong> page in the left menu. You can filter by type, search a player or alliance, and see your own position.</p>

            <h2 id="why">Why it matters</h2>
            <ul>
                <li><strong>Strategic</strong> — identify big players to avoid or target.</li>
                <li><strong>Social</strong> — showcase for recruiting in your alliance.</li>
                <li><strong>Competition</strong> — in some server modes (Paid Server, Domination), the final ranking determines the winner.</li>
            </ul>

    heroes:
        title: "Your hero"
        category: "progression"
        order: 5
        tags: "hero,bonus,planet,fleet,xp,capture,prison,specialty"
        summary: "Your personal hero: evolves, fights, boosts your empire, and can be captured."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Each player has <strong>a single main hero</strong>, created at the start of the game. This hero must <strong>always</strong> be assigned either to a planet or to a fleet — never free. You can additionally own an unlimited number of <strong>secondary heroes</strong> — see the dedicated article.</p>
            <p>As long as you have no main hero — at the start of the game, or after it has been executed in prison — the game brings you back to its creation: game pages stay closed until then, while your account pages remain available. If one of your secondary heroes occupies the planet chosen for the new hero, it goes back to the <strong>reserve</strong>.</p>
            <p>The hero grants combat, intelligence and speed bonuses depending on their specialty and level.</p>
            <p>The hero's 4 skills are: <strong>Attack</strong>, <strong>Defense</strong>, <strong>Intelligence</strong> and <strong>Speed</strong>.</p>
            <p><strong>Intelligence</strong> grants a resource production bonus on planets, and a strategic edge in arena duels.</p>
            <p><strong>Speed</strong> reduces fleet flight time, and feeds Momentum in arena duels.</p>

            <h2 id="specialties">Specialties</h2>
            <p>Each specialty grants a passive bonus and unlocks 3 traits at levels 5, 10 and 15:</p>
            <ul>
                <li><strong>Military</strong>: +5% attack and defense, in fleet combat and on the ground alike (against Cthulhu and in PvP), and +5% power in arena duels. Traits: <strong>Intimidation</strong> (lvl 5, the opponent suffers −5% offensive power, including against Cthulhu, and −5% score in a duel), <strong>Tactician</strong> (lvl 10, +10% power on the first round of your combats, and +10% in a duel), <strong>Warlord</strong> (lvl 15, −5% losses for your ground troops in player-vs-player combat, and +5% power in a duel).</li>
                <li><strong>Economy</strong>: doubles Intelligence (production) and slave camp bonuses. Traits: <strong>Efficient</strong> (lvl 5, −10% construction cost), <strong>Trader</strong> (lvl 10, +15% on merchant sales), <strong>Magnate</strong> (lvl 15, +20% production).</li>
                <li><strong>Explorer</strong>: +5% fleet accuracy. Traits: <strong>Scout</strong> (lvl 5, +1 radar strength on the planet they're assigned to), <strong>Navigator</strong> (lvl 10, +15% fleet speed), <strong>Cartographer</strong> (lvl 15, +2 radar strength on the planet they're assigned to).</li>
            </ul>

            <p>In an <strong>arena duel</strong> the same rules apply: the soldier keeps their +5% and their three traits, the economist's doubled Intelligence (plus 20% with Magnate) feeds Cunning, and the explorer's doubled Speed (plus 15% with Navigator) feeds Momentum. Cunning and Momentum count for 60% of their value.</p>
            <p>A detailed breakdown of these bonuses is now shown automatically when creating your hero.</p>

            <h2 id="xp">XP gain</h2>
            <p>XP is earned in several ways:</p>
            <ul>
                <li><strong>Combat</strong>: flat XP + proportional to enemy power destroyed, divided by hero level (natural scaling).</li>
                <li><strong>Arena duel</strong>: base XP (30) multiplied by how close the fight was — a tight duel yields up to 3× more XP than a crushing victory.</li>
                <li><strong>Passive</strong>: +5 XP/hour when the hero is assigned to a planet (calculated with resource production).</li>
            </ul>
            <p>Level-up formula: XP required = level × 500. On each level, the player earns skill points to allocate.</p>

            <h2 id="assignment">Assignment</h2>
            <p>Assign your hero from the <strong>Planets</strong> page or a <strong>fleet</strong> management page. Assignment uses AJAX, no page reload.</p>
            <p>A hero on a fleet in flight or combat cannot be reassigned. If the fleet is destroyed, the hero is automatically reassigned to your capital planet.</p>

            <h2 id="capture">Capture</h2>
            <p>A hero can be captured during combat:</p>
            <ul>
                <li><strong>Space combat</strong> (fleet destroyed): 20% chance</li>
                <li><strong>Planet invasion</strong> (planet invaded): 35% chance</li>
            </ul>
            <p>A capture requires a <strong>Prison building of level 1 or higher</strong>: the hero is locked up where the fight took place if that planet is yours and has a Prison, otherwise on your planet with the highest Prison. With no Prison at all, there is no capture.</p>
            <p>After release, the hero enjoys <strong>24h of immunity</strong> against recapture.</p>
            <p>Cthulhu and bots cannot capture heroes.</p>
            <p>This section describes your <strong>main</strong> hero. Your <strong>secondary heroes</strong> follow a completely different capture rule, with no probability involved — see the <em>Secondary heroes</em> article.</p>

    secondary_heroes:
        title: "Secondary heroes"
        category: "progression"
        order: 6
        tags: "hero,secondary,roster,capture,execution,prison,recycling,reserve,loot"
        summary: "Extra heroes earned as rare loot: same bonuses as your main hero, but they can be permanently captured or executed in combat."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principle">Principle</h2>
            <p>A secondary hero grants <strong>the same bonuses</strong> as a main hero once stationed on a planet or a fleet. What sets it apart: it can be <strong>permanently captured or killed</strong> on defeat. You can accumulate several of them, on top of your main hero.</p>

            <h2 id="acquisition">How to get one</h2>
            <p>A secondary hero is <strong>rare loot</strong>, never purchasable:</p>
            <table>
                <tr><th>Source</th><th>Chance</th></tr>
                <tr><td>Tower Defense Cthulhu victory (per run)</td><td>2%</td></tr>
                <tr><td>Cthulhu attack repelled on one of your planets</td><td>1%</td></tr>
                <tr><td>Winning an arena tournament</td><td>25%</td></tr>
            </table>
            <p>On acquisition, its name and specialty are drawn at random, and it arrives directly in <strong>reserve</strong> — it's up to you to decide where to place it, or to recycle it without ever placing it.</p>

            <p>Every hero you earn is announced by a <strong>report</strong> stating where it came from. The Tower Defense end screen and the Cthulhu victory report also flag it on the spot.</p>

            <h2 id="placement">Where to place them</h2>
            <p>Same as your main hero: <strong>a planet</strong> or <strong>a fleet</strong>, never both at once. An unplaced secondary stays in <strong>reserve</strong>: no bonus, but <strong>no risk</strong> either — that's a normal choice, not an oversight to fix. Manage all your secondaries from the <strong>Roster</strong> tab on the Hero page.</p>

            <h2 id="management">Skills and equipment</h2>
            <p>A secondary hero progresses like the main one: it gains levels, and with them <strong>skill points</strong>. The <strong>Manage</strong> button in the Roster opens their allocation across Attack, Defense, Intelligence and Speed.</p>
            <p>The same panel handles its <strong>equipment</strong>: fit it with a free item from your inventory, or take that item back. The items of a captured enemy hero come along with it — this is where you get them back.</p>

            <h2 id="risk">What you risk</h2>
            <p>A placed secondary hero can be lost <strong>permanently</strong> during:</p>
            <ul>
                <li>A lost <strong>space battle</strong> (its fleet is destroyed).</li>
                <li>A lost <strong>utility combat</strong> (a fleet with no weapons at all, wiped out without even fighting).</li>
                <li>A successful <strong>invasion</strong> of the planet where it's stationed.</li>
                <li>Its fleet being shot down by the <strong>orbital defenses</strong> of a planet switched to attack mode.</li>
            </ul>
            <p>It risks <strong>nothing</strong>, however, during:</p>
            <ul>
                <li>A <strong>raid</strong> — even a successful one never takes the planet.</li>
                <li>A fight against the <strong>Cthulhu</strong> (or any non-player opponent).</li>
                <li>The <strong>arena</strong> — duels and tournaments never expose any hero to capture.</li>
            </ul>

            <p>A <strong>notification</strong> warns you as soon as one of your secondaries is captured or executed: a permanent loss does not depend on you opening your report.</p>

            <h2 id="prison">The prison condition</h2>
            <p>Unlike your main hero (a <em>probabilistic</em> capture, see the <em>Prison and captured heroes</em> article), the fate of a defeated secondary is <strong>fully deterministic</strong>, with no randomness whatsoever:</p>
            <ul>
                <li>The winner owns a <strong>Prison building</strong> at level 1 or higher on at least one of their planets → they <strong>capture</strong> the hero, keeping its level, experience and items intact.</li>
                <li>The winner has <strong>no</strong> Prison built → the hero is <strong>executed</strong>.</li>
            </ul>
            <p>In a block battle (several allies fighting side by side), the hero goes to the winning commander who <strong>committed the most power</strong> to the fight — if they have no Prison, the hero is executed even if an ally on the same side owned one.</p>
            <p>A captured secondary is <strong>not</strong> a classic prisoner: no prison page, no escape mini-game, no ransom. It arrives directly, active, in its new owner's Roster, ready to be placed again or recycled.</p>

            <h2 id="no-recovery">No recovery possible</h2>
            <p>Once captured or executed, a secondary hero is lost <strong>for good</strong>: neither escape, nor ransom, nor liberation by invasion from its former owner can recover it. The only way to ever see it again is to win it back yourself in combat — and it can thus circulate indefinitely between empires.</p>

            <h2 id="identity">A captured hero keeps its identity</h2>
            <p>A captured secondary keeps its <strong>name</strong>, <strong>level</strong> and <strong>experience</strong>. In your Roster, it shows its original commander (&laquo;&nbsp;Captured from &hellip;&nbsp;&raquo;).</p>

            <h2 id="recycling">Recycling</h2>
            <p>You can <strong>execute one of your own secondary heroes</strong> yourself to transfer its experience to your main hero, <strong>minus 10%</strong>. A numeric preview (XP transferred, projected main hero level) is shown before you confirm. <strong>This action is irreversible.</strong></p>

    items:
        title: "Hero items"
        category: "progression"
        order: 6
        tags: "items,equipment,bonus,rarity,drop,cthulhu,fusion"
        summary: "Equip your hero with up to 3 items to stack bonuses. How to get them."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Items are objects equippable on your hero (maximum <strong>3 items</strong>). They grant varied bonuses that add to the hero's natural bonuses.</p>

            <h2 id="categories">Categories</h2>
            <ul>
                <li><strong>Offensive</strong>: Weapons, attack-oriented objects</li>
                <li><strong>Defensive</strong>: Armors, shields, protection</li>
                <li><strong>Power</strong>: Status items, mixed bonuses</li>
            </ul>
            <p>No type constraint: you can equip 3 offensive items if you wish.</p>

            <h2 id="rarities">Rarities</h2>
            <ul>
                <li><strong>Common</strong>: 1 bonus (+2-5%)</li>
                <li><strong>Rare</strong>: 1-2 bonuses (+5-10%)</li>
                <li><strong>Epic</strong>: 2-3 bonuses (+10-15%)</li>
                <li><strong>Legendary</strong>: 3+ bonuses (+15-25%)</li>
            </ul>

            <h2 id="bonuses">Bonus types</h2>
            <p>16 possible bonus types: Legionnaire strength, Mech strength, fleet attack, fleet defense, accuracy, shield, fleet speed, resource production, construction speed, worker production, ship production, radar, recycling, anti-Cthulhu bonus, duel bonus, XP bonus.</p>

            <h2 id="obtain">Obtaining</h2>
            <p>There are now four ways to get items:</p>

            <h3>Fight Cthulhu</h3>
            <p>Items can drop from beating Cthulhu, whether you repel their landing on the ground or annihilate their horde entirely in orbit before it lands. The drop rate is the same in both cases and depends on PvE difficulty:</p>
            <ul>
                <li><strong>Easy</strong>: 30% common, 8% rare, 1% epic</li>
                <li><strong>Normal</strong>: 40% common, 15% rare, 5% epic, 0.5% legendary</li>
                <li><strong>Hard</strong>: 50% common, 25% rare, 10% epic, 2% legendary</li>
            </ul>
            <p>A horde only partially destroyed in orbit still lands: it's that landing which then triggers the roll, never both for the same wave.</p>

            <h3>Arena victories</h3>
            <p>Every arena duel win gives a chance to drop an item:</p>
            <ul>
                <li><strong>Common</strong>: 15%</li>
                <li><strong>Rare</strong>: 5%</li>
                <li><strong>Epic</strong>: 1%</li>
            </ul>

            <h3>Duel stakes</h3>
            <p>When issuing a challenge, you can stake an item. If the opponent accepts, they must stake an item of the same rarity. The winner takes both items.</p>

            <h3>Fusing three items</h3>
            <p>Three items of the <strong>same rarity</strong> fuse into one item of the next rarity up, for free and instantly. The category and bonuses of the new item are rolled at random, just like a drop. The three original items are consumed permanently, and an item worn by a hero must be unequipped first. Legendary is the highest rarity: it cannot be fused.</p>
            <p>Fusion is started from the <strong>Commanders</strong> page, <strong>Fusion</strong> tab: click three item cards to select them (the whole card is clickable), then confirm with the fusion button, available both above and below the list.</p>

            <h2 id="theft">Item theft</h2>
            <p>If your hero is captured, their equipped items may be stolen by the victor. Theft probability: Common 80%, Rare 60%, Epic 40%, Legendary 25%.</p>

            <h2 id="inventory">Inventory</h2>
            <p>Access your inventory from the <strong>Commanders</strong> page, <strong>Inventory</strong> tab. From inventory, you can:</p>
            <ul>
                <li><strong>Equip</strong> an item on your hero (if active and fewer than 3 items equipped)</li>
                <li><strong>Unequip</strong> an item back into inventory</li>
                <li><strong>Destroy</strong> an item you no longer need</li>
                <li><strong>Fuse</strong> 3 items of the same rarity into one item of the rarity above, from the neighbouring <strong>Fusion</strong> tab</li>
            </ul>
            <p>Each item is shown as an <strong>illustrated card</strong> displaying its image, its bonuses and a rarity-colored border. The cards are laid out in a grid (3 to 4 per row depending on the space available on your screen).</p>

    prison:
        title: "Prison and captured heroes"
        category: "progression"
        order: 7
        tags: "prison,capture,hero,escape,torture,ransom,jail,secondary"
        summary: "When a hero is captured, what happens? The options for prisoner and jailer, and the direct capture of enemy secondary heroes."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Hero capture</h2>
            <p>A hero is captured during space combat (20%) or an invasion (35%). The captured player is locked down: any page outside the allowed scope redirects them to the <strong>prison page</strong>. They still have access to the <strong>alliance chat</strong>, their <strong>private messages</strong>, their <strong>reports</strong>, <strong>viewing</strong> (read-only) their alliance, and <strong>managing their account</strong>. Everything else — building, fleets, the map, the market, the arena, even the hero page — stays inaccessible until they are freed.</p>
            <p>A capture requires a <strong>Prison building of level 1 or higher</strong>: the hero is locked up where the fight took place if that planet is yours and has a Prison, otherwise on your planet with the highest Prison. With no Prison at all, there is no capture.</p>

            <h2 id="prisoner">Prisoner actions</h2>
            <p>Every <strong>4 hours</strong>, the prisoner can take an action:</p>
            <ul>
                <li><strong>Alert the alliance</strong> (70% success): sends the prison coordinates to alliance chat. Failure = jailer is alerted. Without an alliance, the action is unavailable. After a failure, the next action waits 6 hours instead of 4.</li>
                <li><strong>Escape</strong>: one attempt every 4 hours counted from the capture (the first one 4 hours after it). 40% success, +5% for each further 4 hours in captivity. Failure = the jailer is alerted. This timer is independent of the two other actions.</li>
                <li><strong>Escape through Slash</strong>: at any time, without limit. See the article <em>Escaping from prison</em>.</li>
                <li><strong>Pay the ransom</strong>: if the jailer demanded one, you can pay or refuse it from the prison page.</li>
                <li><strong>Rebel</strong> (25% + military bonus): sabotage 5% of prison resources. Failure = lose a level. Either way, the jailer receives a report.</li>
            </ul>

            <h2 id="jailer">Jailer actions</h2>
            <p>Accessible via the Prison or Slave Camp building:</p>
            <ul>
                <li><strong>Execute</strong>: permanently destroys the hero (+WP proportional to level). Items recovered. The hero's owner is informed by a report.</li>
                <li><strong>Release</strong>: a diplomatic gesture, the hero returns to their owner.</li>
                <li><strong>Torture</strong> (cost: 200 WP): reveals the position of an enemy planet.</li>
                <li><strong>Ransom</strong>: demand resources in exchange for release (24h to accept).</li>
            </ul>

            <h2 id="release">Release</h2>
            <ul>
                <li><strong>Prisoner's alliance invades</strong>: automatic release</li>
                <li><strong>Other alliance invades</strong>: 60% chance of escape, otherwise the prisoner goes to the invader if they own a Prison, or is released</li>
                <li><strong>Cthulhu invade</strong>: all prisoners are freed</li>
            </ul>

            <h2 id="secondary">Capturing an enemy secondary hero</h2>
            <p>Everything above — escape, torture, ransom, release — concerns an opponent's <strong>main hero</strong>. A <strong>secondary hero</strong> (see the <em>Secondary heroes</em> article) follows a much more direct rule, and that's where your Prison building gains a <strong>hard purpose</strong>: as soon as you own a Prison at level 1 or higher on one of your planets, any enemy secondary hero defeated against you (space combat, utility combat, or a successful invasion) becomes <strong>immediately and permanently</strong> yours — with its level, experience and items intact. Without a Prison, it is <strong>executed</strong> instead of captured.</p>
            <p>A captured secondary is <strong>not</strong> a prisoner in the sense of this page: there's no prison page, no escape, no ransom. It arrives directly, active, in your <strong>Roster</strong> — ready to be placed on a planet or fleet, or recycled.</p>

            <h2 id="requirements">Requirements</h2>
            <p>Research <strong>Prison</strong> (requires Barbed Wire level 5), then <strong>Prison</strong> and <strong>Slave Camp</strong> buildings.</p>

    prison_escape:
        title: "Escaping from prison"
        category: "progression"
        order: 8
        tags: "prison,escape,slash,ransom,hero,capture"
        summary: "The three ways to get out of prison on your own: the instant escape, Slash and the ransom."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Three ways out</h2>
            <p>When your hero is captured, the prison page offers three ways out without waiting for your allies. The escape mini-game has been removed.</p>

            <h2 id="instant">Instant escape</h2>
            <ul>
                <li>One attempt every <strong>4 hours</strong>. The first opens 4 hours after the capture.</li>
                <li><strong>40%</strong> success on the first attempt, then <strong>+5%</strong> for each further 4 hours in captivity, whether you tried your luck or not.</li>
                <li>The odds of the next attempt are shown on the button.</li>
                <li>Failure: your hero stays in prison and <strong>the jailer is alerted</strong>.</li>
            </ul>

            <h2 id="slash">Escaping through Slash</h2>
            <p><strong>Slash</strong> is our other game (slash-game.com). Play it with the <strong>same email address</strong> as your Area Universe account, confirmed on both sides.</p>
            <ul>
                <li>Reach <strong>75% of this week's best score</strong> in a game played <strong>after your capture</strong>.</li>
                <li>As long as the current week (since Monday 00:00 UTC) has fewer than 10 ranked players or its best score is below 50 points, last week's best score is the reference.</li>
                <li>Come back to the prison page and click <strong>Check my score</strong>: your hero is freed.</li>
                <li><strong>Unlimited</strong> attempts, with no delay.</li>
                <li>A guest account or an unconfirmed address cannot use this way out.</li>
            </ul>

            <h2 id="ransom">Paying the ransom</h2>
            <p>If the jailer demands a ransom, it appears on the prison page with its amount and deadline (24 hours). You can <strong>pay</strong> or <strong>refuse</strong> it. Resources are taken from all your planets and given to the jailer. If you do not have enough resources, the payment is refused and nothing is taken.</p>

            <h2 id="after">After release</h2>
            <p>Your hero returns to one of your planets with their remaining items and gets <strong>24 hours of immunity</strong> against being captured again.</p>

    arena:
        title: "PvP Arena"
        category: "progression"
        order: 8
        tags: "arena,duel,tournament,pvp,hero,challenge,ranking"
        summary: "Challenge other heroes in 1v1 duels. Stake uranium or items, gain prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="challenges">Challenge system</h2>
            <p>From the <strong>Arena</strong> page, issue a challenge to another player. The challenged receives a notification and can <strong>accept</strong> or <strong>decline</strong>.</p>
            <ul>
                <li>A challenge automatically expires after <strong>7 days</strong> without a reply. The number of received challenges awaiting your answer is shown on the Arena tab and on the "Hero" menu entry. The time left before expiry is shown next to each received challenge. Once expired, you can challenge the same player again.</li>
                <li>You can <strong>cancel</strong> a challenge you sent while it is still pending.</li>
                <li>Cooldown: <strong>1h</strong> between two duels for the same player. It is checked when the challenge is sent <strong>and</strong> when it is accepted, for both heroes: stacking pending challenges does not allow several duels in a row.</li>
                <li>A captured hero cannot challenge or be challenged. Capture and same-alliance status are re-checked at acceptance.</li>
                <li>The hero is never in danger (no capture in arena).</li>
            </ul>

            <h2 id="combat">Combat resolution</h2>
            <p>When the challenged player accepts, the fight is resolved <strong>immediately</strong> and the result is shown on screen to the player who accepted: victory or defeat, both scores, rewards, and the stake won or lost. Both players also receive a report. The score is based on:</p>
            <ul>
                <li><strong>Level</strong>: the foundation of the score</li>
                <li><strong>Offense</strong>: the hero's attack, +5% if they are a soldier, and the offensive bonuses of their items</li>
                <li><strong>Defense</strong>: the hero's defense and the defensive bonuses of their items</li>
                <li><strong>Cunning</strong> (60% weight): Intelligence — doubled for an economist, +20% with the Magnate trait — and the utility bonuses of items (production, construction, recycling, radar)</li>
                <li><strong>Momentum</strong> (60% weight): Speed — doubled for an explorer, +15% with the Navigator trait — and the fleet speed of items</li>
                <li><strong>Military traits</strong>: Tactician +10%, Warlord +5%, and Intimidation takes 5% power away from the opponent</li>
                <li><strong>Specialty</strong>: rock-paper-scissors advantage (Military &gt; Explorer &gt; Economy &gt; Military, +10%)</li>
                <li><strong>Random factor</strong> of ±15% on each side</li>
            </ul>

            <h2 id="stakes">Stakes</h2>
            <p>When issuing a challenge, you can add an optional stake:</p>
            <ul>
                <li><strong>Uranium</strong>: each player stakes the same amount. Winner takes both stakes.</li>
                <li><strong>Item</strong>: each player stakes an item of the same rarity. Winner takes both items. The item must be <strong>unequipped</strong> (on both sides) and cannot be committed to two pending challenges at once.</li>
                <li><strong>Friendly</strong>: no stake, only base rewards are granted.</li>
            </ul>
            <p>The stake is covered if at least one of your planets holds the required uranium: it is deducted from your planet richest in uranium. If a player no longer has enough uranium on any planet at acceptance time, the challenge fails. If the item staked by the challenger is no longer available when the challenged player accepts (no longer owned, or equipped), the duel is refused.</p>

            <h2 id="rewards">Base rewards</h2>
            <p>The winner receives in every duel:</p>
            <ul>
                <li>Uranium: proportional to the average level of the fighters, capped at <strong>20</strong> per duel</li>
                <li>War Points: proportional to the winner's level (around 225 at level 15), reduced when the level gap is large</li>
                <li>Item chance: 15% common, 5% rare, 1% epic</li>
            </ul>
            <p>The loser loses nothing (except their stake if any).</p>

            <h2 id="ranking">Ranking</h2>
            <p>A per-server ranking shows the best duelists:</p>
            <ul>
                <li>Based on win/loss ratio</li>
                <li>Minimum <strong>5 fights</strong> to appear</li>
                <li>The <strong>top 5</strong> are visible directly on the page; a button opens the full ranking with pagination and sorting</li>
                <li>Weekly rewards are paid automatically every <strong>Monday</strong> for the previous week (Monday to Sunday), once: top 3 by <strong>number of duel wins</strong> that week, with a minimum of <strong>5 duels</strong> in the week. Only players are ranked (neither AI commanders nor deleted accounts). 1st = 3000 uranium + 300 WP, 2nd = 2000 + 200 WP, 3rd = 1000 + 100 WP. Each rewarded player receives a report.</li>
            </ul>

            <h2 id="tournaments">Tournaments</h2>
            <p>Periodic server event: one tournament every <strong>7 days</strong> per server.</p>
            <ul>
                <li>Registration is open for <strong>24h</strong> from the Arena page. A captured hero cannot register, and is excluded if captured before the start.</li>
                <li>Then automatic single elimination with random seeding (an odd player gets a bye), and a third-place match between the two semi-final losers.</li>
                <li>At least <strong>2 participants</strong> are needed: otherwise the tournament is cancelled (no rewards) and registrants are told by report. With a single registered player, the tournament takes place if an AI commander can fill the bracket.</li>
                <li>As soon as at least one player is registered, the server's <strong>AI commanders</strong> (main hero, not captured) fill the bracket up to <strong>8 participants</strong> in total. They register progressively during the 24h registration window, and the bracket is topped up when registration closes if some are still missing.</li>
                <li>If <strong>8 or more players</strong> are registered, no AI commander joins. With no registered player, the tournament does not take place: AI commanders never play among themselves.</li>
                <li>Each fight of the tournament also grants its winner the usual per-duel rewards.</li>
                <li>AI commanders compete for the podium and receive the same rewards as players, except the chance of a secondary hero.</li>
                <li>The champion keeps a 25% chance of a secondary hero (players only).</li>
            </ul>
            <p>Rewards:</p>
            <ul>
                <li>1st = 5000 uranium + 500 WP + 1 epic item (20% chance of an extra legendary item)</li>
                <li>2nd = 3000 uranium + 300 WP + 1 rare item (10% chance of an extra epic item)</li>
                <li>3rd = 1500 uranium + 150 WP + 1 rare item</li>
                <li>Every other participant = 500 uranium + 50 WP (10% chance of a common item)</li>
            </ul>
            <p>Every participant receives a report with their placement and rewards. The Arena page shows the countdown to the end of registration, the podium of the last tournament and the date of the next one.</p>

    login_bonus:
        title: "Login bonus"
        category: "progression"
        order: 9
        tags: "bonus,login,daily,bitcoin,streak"
        summary: "Free Bitcoins every day, multiplied if you chain several consecutive days."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principle">The principle</h2>
            <p>On your <strong>first login</strong> of each calendar day, the game gives you a Bitcoin bonus. It's free, no action required beyond logging in.</p>
            <p>The amount is the <strong>higher</strong> of the two calculations below, then multiplied by your streak:</p>
            <ul>
                <li>A <strong>level-based floor</strong>, with a daily random (×1 to ×5) — it guarantees a motivating bonus early in the game.</li>
                <li><strong>5% of the server's average Bitcoin holdings</strong> — so the bonus stays relevant as the server economy grows.</li>
                <li>The result is then multiplied by your <strong>streak multiplier</strong> (see below).</li>
            </ul>
            <p>The server average ignores extreme accounts (the richest and poorest 5%) and counts neither bots nor test accounts.</p>
            <p>Example: a level 10 player on day 1 receives at least 50,000 to 250,000 Bitcoins — more if 5% of the server average exceeds that floor.</p>

            <h2 id="streak">The 7-day streak</h2>
            <p>Logging in <strong>every day</strong> grows your multiplier:</p>
            <table>
                <tr><th>Consecutive day</th><th>Multiplier</th></tr>
                <tr><td>Day 1</td><td>×1.0</td></tr>
                <tr><td>Day 2</td><td>×1.2</td></tr>
                <tr><td>Day 3</td><td>×1.5</td></tr>
                <tr><td>Day 4</td><td>×1.8</td></tr>
                <tr><td>Day 5</td><td>×2.0</td></tr>
                <tr><td>Day 6</td><td>×2.5</td></tr>
                <tr><td>Day 7</td><td>×5.0</td></tr>
            </table>
            <p>On day 8, the cycle restarts at day 1. If you <strong>miss a day</strong> (more than 24h without logging in), the streak resets.</p>

            <h2 id="items">Bonus items</h2>
            <p>Some streak days also grant a random <strong>hero item</strong>:</p>
            <ul>
                <li><strong>Day 3</strong>: a common item.</li>
                <li><strong>Day 7</strong>: a rare item.</li>
            </ul>

            <h2 id="claim">How to claim</h2>
            <p>A window opens automatically at login. One click to collect. Your <strong>best streak</strong> is archived as a personal record.</p>

            <h2 id="tip">A small tip</h2>
            <p>Even 30 seconds of login is enough to validate the streak. Don't miss day 7, that's where it pays most.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,elimination,bankruptcy,end"
        summary: "The 2 ways to lose the game, and what you have left afterward."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">The 2 types of Game Over</h2>
            <p>There are two ways to be eliminated from a server. Knowing them is already protecting yourself.</p>

            <h2 id="bankruptcy">1. Economic bankruptcy</h2>
            <p>If, after the <strong>18:59 UTC daily report</strong>, your Bitcoin balance is <strong>negative</strong>: <strong>Economic Game Over</strong>.</p>
            <ul>
                <li>All your <strong>flying fleets</strong> are destroyed.</li>
                <li>Your balance is <strong>reset to 125,000 Bitcoins</strong>.</li>
                <li>Your <strong>researches</strong> are reset.</li>
                <li>Your <strong>terraformation</strong> is halved.</li>
                <li>Your <strong>ranking</strong> is reset.</li>
            </ul>
            <p>The commander stays alive (can keep playing), but restarts heavily weakened.</p>
            <p><strong>You are warned beforehand:</strong> as soon as your balance drops below the projected daily deficit (upkeep cost minus income), a "Bankruptcy imminent" alert report warns you — at most one per day. If you receive it, act before the next daily report.</p>

            <h2 id="planets">2. Losing all your planets</h2>
            <p>If you lose your <strong>last planet</strong> (invasion, voluntary abandon, Battle Royale where your sector disappears), the game is <strong>truly</strong> over:</p>
            <ul>
                <li>All your <strong>fleets</strong> are transferred to aliens.</li>
                <li>Your <strong>commander is eliminated</strong> from the server.</li>
                <li>Your statistics are <strong>archived</strong> on your account.</li>
            </ul>

            <h2 id="avoid">How to avoid Game Over</h2>
            <ul>
                <li>Check your <strong>balance</strong> daily (income − costs). If it turns red, react.</li>
                <li>Don't over-recruit: a permanently maintained army can ruin an unattentive economist.</li>
                <li>Always keep <strong>at least 2 planets</strong> able to defend.</li>
                <li>Watch <strong>incoming enemy fleets</strong> (notifications, radar).</li>
                <li>In great danger, <strong>evacuate</strong> your troops and resources to a safe planet.</li>
            </ul>

            <h2 id="after">What's left afterward?</h2>
            <p>Even eliminated, you keep your <strong>player account</strong>. Your <strong>statistics</strong> from previous games are kept, and you can join a new server.</p>

    game_modes:
        title: "Server modes"
        category: "events"
        order: 1
        tags: "mode,battle royale,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe offers 7 different server modes, each with its own rules and goals."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Overview</h2>
            <p>Each Area Universe server has a specific <strong>mode</strong>, chosen by the admin at creation. The mode defines duration, victory condition, and whether Cthulhu are present.</p>
            <table>
                <tr><th>Mode</th><th>Duration</th><th>Victory condition</th><th>Cthulhu?</th><th>Alliances?</th><th>Researches</th></tr>
                <tr><td>Cthulhu</td><td>300 days</td><td>None (survival scoreboard)</td><td>Yes</td><td>Yes</td><td>Normal</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 days</td><td>The VIP who survives 72h</td><td>No</td><td>Yes (except for the VIP)</td><td>Max from the start</td></tr>
                <tr><td>Domination</td><td>60 days</td><td>Top scorer at end</td><td>No</td><td>Yes</td><td>Max from the start</td></tr>
                <tr><td>Battle Royale</td><td>40 days</td><td>Last survivor</td><td>No</td><td>No</td><td>Max from the start</td></tr>
                <tr><td>Paid Server</td><td>60 days</td><td>Best weighted score (combat highly valued)</td><td>No</td><td>Yes</td><td>Normal</td></tr>
                <tr><td>Long Run</td><td>900 days</td><td>None (marathon)</td><td>Yes</td><td>Yes</td><td>Normal</td></tr>
                <tr><td>Short Run</td><td>150 days</td><td>None (sprint)</td><td>Yes</td><td>Yes</td><td>Normal</td></tr>
            </table>

            <h2 id="cthulhu">Cthulhu Mode (classic PvE)</h2>
            <p>The base mode, perfect for discovering the game. During the <strong>first 72 hours</strong>, no Cthulhu attacks: a <strong>preparation phase</strong>. Then Cthulhu hordes periodically harass your planets.</p>
            <p>No victory condition: at the end (300 days), a scoreboard rewards those who survived best.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (VIP hunt)</h2>
            <p>A <strong>VIP</strong> is randomly designated at the end of the 48h ceasefire. Their goal: <strong>survive 72 hours</strong>. If they succeed, they win. If killed by a player, <strong>the killer becomes the new VIP</strong>. If a non-human cause eliminates them (Cthulhu, event), another player is drawn.</p>
            <p>The VIP is <strong>alone against all</strong>: automatically removed from their alliance at nomination, and can no longer join one while holding the status.</p>

            <h2 id="domination">Domination (strategic planets)</h2>
            <p>5 strategic planets are drawn at random. Each day, their owner scores <strong>+5 points</strong>. New draw every 5 days (24h notice in chat).</p>
            <p>At server end (60 days), the player with the best score wins. For alliances, the score is the sum of its members' scores.</p>

            <h2 id="battle-royale">Battle Royale (last survivor)</h2>
            <p>Solo mode: <strong>no alliances allowed</strong>. Signups closed after 7 days. One single galaxy.</p>
            <p>The map is a 100-system spatial grid that <strong>shrinks in concentric rings</strong>: each round, <strong>the entire outer ring disappears at once</strong> (not system by system). Destroyed systems stay on screen as <strong>holes</strong> — the map never reflows, so the safe zone is readable at a glance.</p>
            <p><strong>5 rounds, one per week:</strong></p>
            <ul>
                <li>D+7: 36 systems · D+14: 28 · D+21: 20 · D+28: 12 · D+35: the last 3 (<strong>only one survives</strong>). The final 5 days play out in the center.</li>
                <li><strong>12h before</strong> its destruction, a ring turns <strong>amber</strong> (warning).</li>
                <li><strong>1h before</strong>, it turns <strong>flashing red</strong> and no fleet can enter or leave it.</li>
                <li>A destroyed system permanently erases its planets and fleets.</li>
                <li>A fleet transiting toward a vanished system is destroyed. If your hero is there, it's defeat.</li>
            </ul>
            <p><strong>Victory</strong>: be the last active commander.</p>

            <h2 id="paid-server">Paid Server (competitive paid)</h2>
            <p>Paid server (<strong>€5</strong>), 100% PvP, no Cthulhu. 60-day duration.</p>
            <p><strong>Victory</strong>: at the end, the player with the best <strong>weighted score</strong> wins. This score combines empire size and military activity, combat being highly valued — a mode for competitive players.</p>
            <p>The winner receives a <strong>permanent distinction</strong> on their profile, kept from one server to the next.</p>

            <h2 id="long-short-run">Long Run / Short Run (with events)</h2>
            <p>Two PvE modes with <strong>scheduled recurring events</strong>: Cthulhu attacks, pirate raids, production bonuses, enhanced recycling, alliance arenas, total wars, inter-server confrontations…</p>
            <p>The <strong>Long Run</strong> (900 days) is a relaxed marathon; the <strong>Short Run</strong> (150 days) is a more intense sprint. The event calendar is <strong>deterministic</strong>: you can plan ahead.</p>

            <h2 id="max-research">Modes with max research from the start</h2>
            <p>In <strong>Search &amp; Destroy, Domination and Battle Royale</strong>, all your researches start at max level — the Research menu is hidden, to play directly on the military side.</p>
            <p>Your starting planet then receives a <strong>starter kit</strong>:</p>
            <ul>
                <li><strong>500 uranium</strong> to customize quickly.</li>
                <li><strong>All your ship points unlocked</strong> from day 1 (1,375 points at once instead of 40/day).</li>
            </ul>
            <p>In <strong>Search &amp; Destroy</strong>, a bigger military kit is granted to let the VIP hold their 72h: 2,000 Legionnaires, 25 barges, 500 destroyers, 250 heavy laser turrets.</p>

            <h2 id="server-end">Server end and archival</h2>
            <p>When a server closes, your <strong>final statistics</strong> (points, heroes, VIP successes, victories, etc.) are archived on your <strong>player account</strong>. Your commander (the character of this game) is deleted, but your history remains.</p>

    cthulhus:
        title: "The Cthulhu threat"
        category: "events"
        order: 2
        tags: "cthulhu,hive,horde,garrison,siege,threat,pve,uranium,tower defense,td"
        summary: "The Cthulhu now mass real hordes that travel in the open before attacking your planets. How to defend, how their bases fight back, and the Tower Defense to repel the assault."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principle">What are the Cthulhu?</h2>
            <p><strong>Cthulhu</strong> (the Possessed) are the hostile creatures controlled by the game (PvE). They hold <strong>hive bases</strong> scattered across the galaxy, from which <strong>hordes</strong> depart: real fleets, with a visible composition, power and route — not a plain countdown.</p>
            <p>The more you repel them, the higher the <strong>global threat</strong> climbs, and the stronger the next attacks are.</p>

            <h2 id="threat">The threat level</h2>
            <p>With every victory against a Cthulhu invasion, the threat level on your empire rises. Gains are higher at high difficulty and depend on your alliance regime:</p>
            <table>
                <tr><th>Difficulty</th><th>No alliance</th><th>Hammer of the Stars</th><th>Other alliance</th></tr>
                <tr><td>Easy</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Hard</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p><strong>Hammer of the Stars</strong> reduces threat progression (the defensive regime has an easier ride against Cthulhu).</p>
            <p>The threat also <strong>climbs back on its own</strong>: +5 with every daily Empire report, and +1 per hour while a horde stays in orbit around one of your planets before landing (capped at 300, and only after your first contact with the Cthulhu). Winning a Tower Defense <strong>halves it</strong>: a diligent player keeps it low, while letting it drift invites ever bigger hordes.</p>

            <h2 id="power">Invasion power</h2>
            <p>The power of a Cthulhu invasion depends on:</p>
            <ul>
                <li>the accumulated <strong>threat level</strong>;</li>
                <li>the chosen <strong>difficulty</strong>;</li>
                <li>the targeted planet's <strong>terraformation</strong>.</li>
            </ul>
            <p>On <strong>Easy</strong>, attack power is halved. On <strong>Hard</strong>, it's boosted.</p>

            <h2 id="horde">The attack: a real horde</h2>
            <p>An attack always starts with a <strong>muster</strong>: the horde masses in orbit around a hive base for <strong>6 hours</strong> (12 hours for a Boss horde) before setting off.</p>
            <p>Once underway, it flies at <strong>horde speed</strong> — slow, plainly visible on <strong>radar</strong> — and a <strong>warning is guaranteed 1 hour before arrival</strong>, regardless of your radar coverage.</p>
            <p>It's a <strong>real fleet</strong>: you can destroy it at any point — while it's forming above its base, mid-flight, once it reaches orbit around your planet, or by winning the <strong>Tower Defense</strong> (playable as soon as it's planned or already active). Destroying it cancels the attack, whenever that happens.</p>
            <p>On arrival, an <strong>orbital battle</strong> plays out (your fleets and turrets against the horde). Survivors land <strong>2 hours later</strong> for the ground assault. Several hordes can be forming or in flight at once, with randomized composition.</p>
            <p>One exception: <strong>infiltration</strong> (unlocked at level 200+) stays <strong>instant and invisible</strong> — no muster, no warning.</p>

            <h3>If your defenses win</h3>
            <table>
                <tr><th></th><th>Easy</th><th>Normal</th><th>Hard</th></tr>
                <tr><td>Legionnaire losses</td><td>15%</td><td>30%</td><td>50%</td></tr>
                <tr><td>Mech losses</td><td>—</td><td>—</td><td>50%</td></tr>
                <tr><td>Worker losses</td><td>—</td><td>—</td><td>50%</td></tr>
            </table>
            <p>You earn <strong>WP</strong> and a chance to <strong>drop an item</strong>.</p>

            <h3>If the horde wins on the ground</h3>
            <p>Looting and capture are now <strong>proportional to what's left of the horde</strong> after the orbital battle: a horde destroyed by half loots half as much. Below <strong>90% survival</strong>, it no longer has enough troops to capture the planet, even on Hard difficulty.</p>
            <table>
                <tr><th></th><th>Easy</th><th>Normal</th><th>Hard</th></tr>
                <tr><td>Resource looting (intact horde)</td><td>40%</td><td>70%</td><td>Planet captured (if ≥ 90% survival)</td></tr>
                <tr><td>Threat reduction after defeat</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>On <strong>Hard</strong>, without enough survivors to capture, looting falls back to the <strong>Normal</strong> rate (70%), multiplied by the horde's survival ratio. If the planet is captured and it was your last, it's Game Over.</p>

            <h2 id="bases">Hive bases</h2>
            <p>The hive holds <strong>bases</strong> scattered across the galaxy: the hive's original bases (up to 36 per galaxy, of increasing power — their names run from "Cthulhu I" for outposts to the fearsome "Cthulhu V") and former player planets converted by an expansion or an eruption. Each is protected by a <strong>permanent garrison</strong> that regenerates in <strong>24 hours</strong> if depleted.</p>
            <p>Massing a player fleet in orbit around a base (combined signature of at least <strong>10,000</strong>) triggers a <strong>siege</strong>: the besieged base stops sending hordes (they now depart from a farther base), <strong>defense waves</strong> grow stronger (+25% every 2 hours), and after <strong>6 hours</strong> the other bases send <strong>relief fleets</strong>. A besieged base carries the <strong>"Besieged base"</strong> badge on the galaxy map. Once the siege is lifted, the relief fleets go home and the base returns to a standard garrison.</p>
            <p>When the siege is lifted, every participant is paid <strong>in proportion to the signature destroyed</strong>: 0.02 bitcoin per point, plus war points.</p>

            <h2 id="liberation">Liberating a base</h2>
            <p>Successfully invading a hive base — including, now, the alien "Cthulhu I" to "V" bases — grants the usual rewards (uranium, chance of an item drop) <strong>and</strong> lowers the <strong>Universe Threat</strong> by <strong>50 points</strong>, delaying the next Cthulhu prophecy (see the <em>Cthulhu prophecies</em> article). A planet freed this way is <strong>protected for 72 hours</strong>: the hive can neither recolonize it nor erupt onto it during that time. If the freed planet was originally a player planet — captured by the hive, converted after a lost invasion, abandoned, or born from an expansion or an eruption — it remains colonisable, and your liberation report gives you the deadline for sending a coloniser there. The hive's original outposts ("Cthulhu I" to "V"), however, stay unusable once freed: the planet remains free but you cannot send a coloniser there, and no deadline is announced.</p>
            <p>Conversely, losing an invasion against an alien base now also raises your <strong>personal threat by 10 points</strong>, same as against a regular Cthulhu base.</p>

            <h2 id="expansion">Expansion and eruption</h2>
            <p>The hive expands on its own: once the <strong>Universe Threat</strong> reaches <strong>300 points</strong>, a <strong>spore swarm</strong> departs from an existing base every <strong>3 days</strong> (every day once threat exceeds <strong>500</strong>) toward an uninhabited planet near players — up to <strong>36 bases per galaxy</strong>. It's a fleet like any other: <strong>interceptable in flight</strong>. If it arrives, it founds a new base with its garrison, and players within <strong>5 sectors</strong> receive a report.</p>
            <p>Eradicating <strong>every</strong> base doesn't get rid of the hive for good: after <strong>48 hours of silence</strong>, an <strong>eruption</strong> raises a base back up elsewhere, with a report to nearby players. This eruption can never land <strong>within 8 sectors</strong> of a player planet, nor on a planet still under its liberation respite: the hive is reborn in empty space, not on your turf. If no sector is isolated enough, the eruption is simply pushed back to the next window.</p>

            <h2 id="difficulty-change">Changing difficulty</h2>
            <p>You can change the PvE difficulty in your <strong>options</strong>. Warning: a <strong>72h cooldown</strong> applies between changes — no yo-yoing to dodge big attacks.</p>

            <h2 id="tower-defense">Tower Defense (TD)</h2>
            <p><strong>Tower Defense</strong> is an active-defense mini-game. It's playable as soon as a horde is <strong>planned</strong> (forming at its base) or already <strong>active</strong> (in flight or in orbit): you can launch it to wipe it out before it does any damage. It's interactive: you place your defenses on a grid and face waves of Cthulhu monsters in real time.</p>
            <p>Tip: to place several defenses in a row (units, walls, barbed wire), <strong>hold and drag</strong> — the stroke automatically locks into a <strong>straight line</strong> (horizontal or vertical) and every cell crossed is filled, with no gaps even when moving fast.</p>
            <p>The TD difficulty is your <strong>PvE</strong> level (set in your preferences). The <strong>tutorial</strong> is practice: it earns nothing and costs nothing. Once the first wave has started, leaving the game counts as <strong>abandoning</strong> it (defeat).</p>
            <p>A <strong>fog</strong> drifts over the arena, thicker around the rifts and while a boss is near. It stays beneath your defenses and the monsters: it hides nothing. The <strong>Fog</strong> button in the dock turns it off if your device struggles.</p>

            <h3>Possible outcomes</h3>
            <ul>
                <li><strong>Victory</strong> — the active horde is destroyed, the attack is cancelled. You gain uranium, threat drops (÷2). 6h cooldown before another TD.</li>
                <li><strong>Defeat</strong> — partial rewards; if the horde had already landed, the ground battle plays out immediately.</li>
                <li><strong>TD not played</strong> — the horde runs its normal course: muster, flight, arrival, landing.</li>
            </ul>

            <h3>End-of-game report</h3>
            <p>At the end of every Tower Defense (win or loss), a <strong>report</strong> is archived in the <strong>Cthulhu</strong> tab of your reports: waves survived, score, uranium collected, threat reduction, losses per unit type and enemies killed per type. Handy to compare your runs.</p>

            <h3>How to play it</h3>
            <ul>
                <li>Choose a difficulty: Easy, Normal or Hard.</li>
                <li>Place your units on the grid. The <strong>HQ sits at the center</strong>; monsters emerge from <strong>1 to 4 Cthulhu rifts</strong> opened at the platform's edge.</li>
                <li>Monsters cross the grid to reach your HQ: attack them along the way.</li>
                <li><strong>Walls</strong> (150 on Easy, 125 on Normal, 75 on Hard): monsters walk around them — every rift always keeps a path to the HQ (a wall that would seal it is refused). Towers do not block the path: a monster that runs into one stops and destroys it.</li>
                <li><strong>Barbed wire</strong> (30/20/10 depending on difficulty, Barbed Wire research required): doesn't block, but wounds and slows monsters crossing it.</li>
                <li><strong>Remembered layout</strong>: your setup (towers, walls, barbed wire) is saved per server and pre-filled at the start of each game.</li>
                <li>Big waves arrive <strong>in groups</strong> (up to 20 monsters at once): a wave never stretches over more than ~2 minutes.</li>
                <li><strong>Instant defeat</strong>: if all the enemies in a wave break through your defenses and reach the HQ, the game is lost on the spot — there's no winning without placing effective defenses (especially on Easy difficulty).</li>
                <li>Between waves, workers automatically repair damaged turrets.</li>
                <li>Speed adjustable from ×1 to ×10, with pause available.</li>
                <li><strong>Chain waves</strong>: an option in the top bar automatically starts the next wave as soon as the current one ends, skipping the preparation phase and keeping your speed, until victory or defeat. Turn it off during a wave to get the preparation pause back at the end of that wave. Not available in the tutorial.</li>
                <li>Combat has <strong>up to 20 waves</strong>, each more intense.</li>
                <li><strong>Interface</strong>: full-width top bar (HQ pill + HP gauge, circular wave counter, score, "Start" button, and sound / music / unit info / grid / chain waves icons on the right), "Units" panel on the right with a 2-column grid of vertical cards (icon + name + stock + stats). No side menu nor footer during play — the whole screen width is dedicated to the map.</li>
            </ul>

            <h3>Your TD units</h3>
            <p>Your planet units (Legionnaires, Mechs, turrets) are converted into TD units at a <strong>conversion ratio</strong>. Each unit type has a max placement cap, forcing tactical diversity.</p>

            <h3>The monsters you face</h3>
            <ul>
                <li><strong>Deep One</strong> — the base monster. Nothing special, but they come in numbers.</li>
                <li><strong>Watcher</strong> — very fast but fragile. Intercept quickly.</li>
                <li><strong>Shoggoth</strong> — slow, massive, heavily armored. Hard to bring down.</li>
                <li><strong>Vampire Star</strong> — fires ranged projectiles at your defenses.</li>
                <li><strong>Mind Flayer</strong> — can <strong>convert your Legionnaires into monsters</strong> (visual conversion effect), at most one per second, and none once mortally hit.</li>
                <li><strong>Cthulhu Boss</strong> — huge, rare (Normal/Hard, high threat). Summons Deep Ones around it.</li>
            </ul>

            <h3>Useful mechanics</h3>
            <ul>
                <li>Units and monsters have <strong>different sizes</strong> on the grid (Legionnaire 1×1, Mech 2×1, turret 2×2, Boss 2×2).</li>
                <li>The <strong>wave bar</strong> shows remaining enemies.</li>
                <li>If you refresh the page, the game <strong>resumes exactly where you left it</strong>.</li>
                <li>A saved game must be <strong>resumed</strong> before starting a new one.</li>
            </ul>

            <h3>Rewards and losses</h3>
            <ul>
                <li><strong>Victory</strong>: threat reduction + uranium + horde destroyed.</li>
                <li><strong>Defeat</strong>: partial rewards; if the horde had already arrived, the landing happens immediately.</li>
                <li><strong>Unit losses are real</strong> in all cases (Legionnaires killed in TD = dead for real).</li>
            </ul>

            <h3>TD Ranking</h3>
            <p>A per-server ranking keeps track of the <strong>best Tower Defense scores</strong>. Another leaderboard to conquer.</p>

    events:
        title: "Special events"
        category: "events"
        order: 3
        tags: "event,total war,alliance arena,raiders"
        summary: "Occasional events liven up the server: bonuses, challenges, inter-alliance competitions."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Some server modes (Long Run, Short Run) regularly trigger <strong>special events</strong>. They last a few hours or days, and temporarily change the rules to spice things up.</p>
            <p>The calendar is <strong>deterministic</strong>: you can anticipate every event, plan your strategy accordingly.</p>

            <h2 id="list">Events you may encounter</h2>
            <table>
                <tr><th>Event</th><th>What happens</th></tr>
                <tr><td><strong>Total War</strong></td><td>Generalized total war — all alliances can attack each other freely.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Military production bonus: recruit and build faster.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>Waves of NPC enemies attack the server. Defend or retaliate.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Protect threatened traders. Rewards if you save NPCs.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Invade Cthulhu planets for uranium rewards.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Attack Cthulhu fleets to earn WP.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Period of bonuses for destroying enemy fleets.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Recycling capacity temporarily increased. Ideal moment to clean up debris.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Inter-alliance competition: ranked fights and collective rewards.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Clash between different servers. The best server wins.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Intense Cthulhu wave scheduled — prepare your defenses.</td></tr>
            </table>

            <h2 id="where">Where to see the calendar?</h2>
            <p><strong>Events</strong> page (left menu on applicable modes). You'll see the list of upcoming events, their dates and effects.</p>

            <h2 id="strategy">How to take advantage</h2>
            <ul>
                <li><strong>Prepare</strong> in advance: build your army before a Total War, your recyclers before a Recycling bonus.</li>
                <li><strong>Chat with your alliance</strong>: an event is a chance to coordinate.</li>
                <li><strong>Use the bonuses</strong>: don't launch a big production outside Product Army if you can wait.</li>
            </ul>

    alliance_arena:
        title: "Alliance Arena"
        category: "events"
        order: 9
        tags: "alliance,arena,bracket,pvp,event,tournament,sector,planet,fleet,base,history,spectator"
        summary: "Recurring event every 3 days: your alliance fights the others in a sector battle — duplicated fleets, planets to hold — to fill the common bank and pocket a personal bonus."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">When does it start</h2>
            <p>The event comes back <strong>every 3 days</strong> on participating servers. Schedule of an arena day (Europe/Paris time):</p>
            <ul>
                <li><strong>08:00</strong> — announcement on the Universe chat (all languages) and <strong>registration opens</strong>, with a notification to alliance members.</li>
                <li><strong>18:45</strong> — registration closes: the bracket line-up is locked.</li>
                <li><strong>19:00</strong> — first round. The next rounds start at <strong>19:15</strong> and <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — fights end, rewards distributed.</li>
            </ul>
            <p>If fewer than <strong>2 alliances</strong> have registered globally by 19:00, the event is cancelled and a broadcast notifies everyone.</p>

            <h2 id="inscription">How to register</h2>
            <p>When registration opens, a <strong>modal opens automatically</strong> in your interface. You can also access it from the Arena tab on your Alliance page.</p>
            <p>Conditions:</p>
            <ul>
                <li>Be a member of an alliance.</li>
                <li>Own at least <strong>1 attack ship</strong> (on the ground or in a fleet) at spawn time (19:00).</li>
            </ul>
            <p>You can withdraw until 19:00. If you no longer have any attack ship by 19:00 (lost in real combat between registration and spawn), you are automatically declared forfeit — your alliance carries on without you.</p>
            <p><strong>AI commanders</strong>: the AI commanders of your alliance follow your registration — as soon as a human member signs up, up to 4 of them join the bloc at their side (5 registrations at most per alliance). Fully AI alliances also register to fill out the bracket.</p>

            <h2 id="combat">How it works</h2>
            <p>Each match is played in a <strong>sector created for the occasion</strong>, shown like the spatial map: a 5 × 5 grid where <strong>2 to 4 alliances</strong> face each other. Each alliance starts from its <strong>base</strong>, in the middle of one edge of the sector.</p>
            <p>Your ships are <strong>duplicated</strong> for the arena: nothing you own is at risk. No real losses, no debris, no captured hero.</p>
            <ul>
                <li>A match lasts <strong>15 minutes</strong> at most.</li>
                <li>The first alliance to reach <strong>300 points</strong> wins; otherwise, the best score when time runs out. On a tie: most planets held, then most damage dealt.</li>
                <li>Only one alliance per sector goes through to the next round. Single-elimination bracket over 3 rounds at most; the winner of the last match is the server champion.</li>
            </ul>

            <h2 id="flotte">Your fleet</h2>
            <p>You start with <strong>a single fleet</strong> made of all your attack ships — those on the ground as well as those in your fleets — and your main hero.</p>
            <ul>
                <li><strong>Send</strong>: pick your fleet, tap a planet, then confirm. The flight time is shown before departure, and a flight cannot be cancelled.</li>
                <li><strong>Split</strong>: detach part of your ships into a new fleet (4 fleets at most). A fleet flies at the speed of its slowest ship: a squadron of hunters alone goes three times faster than a fleet dragging battlecruisers.</li>
                <li><strong>Merge</strong>: two of your fleets in orbit around the same planet can be joined.</li>
            </ul>
            <p>When two alliances meet on the same planet, the battle is resolved <strong>5 seconds</strong> later — time for reinforcements to arrive — with the <strong>same rules as spatial combat</strong> in the game. An engaged fleet cannot leave before the battle ends.</p>
            <p>A destroyed fleet is not lost: it <strong>re-forms at your base</strong>, at full strength, after 45 seconds — 15 more for each new destruction, 2 minutes at most. Each enemy fleet destroyed earns your alliance <strong>5 points</strong>.</p>
            <p><strong>AI commanders really fight</strong>: they go and take free planets, avoid battles they cannot win and come back to repair. If you do not open the match screen and give no order for a minute, the autopilot plays for you too — you take back control as soon as you return.</p>

            <h2 id="planetes">Planets and points</h2>
            <p>An alliance <strong>alone</strong> on a planet it does not own captures it after <strong>15 seconds</strong>; an enemy arriving resets the timer. The planet <strong>stays with your alliance</strong> when your fleets leave, until another one takes it back. That is the whole dilemma: spread out to score, or group up to win the battles.</p>
            <p>Every <strong>10 seconds</strong>, each planet held earns points:</p>
            <table>
                <tr><th>Planet</th><th>Points</th><th>Extra</th></tr>
                <tr><td><strong>World</strong> (4 per sector)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Shipyard</strong></td><td>1</td><td>Repairs your fleets in orbit: 10% of their strength every period.</td></tr>
                <tr><td><strong>Nexus</strong> (in the centre)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Each point scored by a planet also pays <strong>PDG into your alliance bank</strong> at the end of the match: 3 PDG per point in round 1, 8 in round 2, 15 in round 3 — whether you win the match or not. Points from destroyed fleets and sacked bases pay no PDG.</p>

            <h2 id="bases">Bases</h2>
            <p>Your base is where you start and re-form; your fleets repair there (5% per period). It cannot be captured, but it can be <strong>sacked</strong>.</p>
            <p>A base is defended by the <strong>planetary defences of every planet of the alliance's players engaged in the match</strong>, pooled together: it is hard to take. A repelled attack still damages it, and it repairs by 10% per period.</p>
            <p>If the defence falls, the base is sacked: <strong>50 points</strong> for the attacker, whose fleets are sent straight home, and the base cannot be attacked for 2 minutes.</p>

            <h2 id="recompenses">Rewards</h2>
            <p>Two types of cumulative rewards.</p>
            <h3 id="banque">Alliance bank</h3>
            <table>
                <tr><th>Round reached</th><th>Bitcoin</th><th>PDG</th></tr>
                <tr><td>Round 1 losers</td><td>50,000</td><td>1,000</td></tr>
                <tr><td>Round 2 losers</td><td>150,000</td><td>3,000</td></tr>
                <tr><td>Round 3 losers</td><td>350,000</td><td>8,000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>1,000,000</strong></td><td><strong>25,000</strong></td></tr>
            </table>
            <h3 id="perso">Individual bonus</h3>
            <p>Paid directly to your personal wallet, provided you <strong>gave at least one order yourself</strong> during the match: if the autopilot played the whole match for you, no bonus.</p>
            <table>
                <tr><th>Round reached</th><th>Personal bitcoin</th></tr>
                <tr><td>Round 1 losers</td><td>5,000</td></tr>
                <tr><td>Round 2 losers</td><td>15,000</td></tr>
                <tr><td>Round 3 losers</td><td>30,000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>50,000</strong></td></tr>
            </table>
            <p>You stack the bonus from every round reached. Champion = 5,000 + 15,000 + 30,000 + 50,000 = <strong>100,000 Bitcoins</strong> in your wallet, on top of the PDG your held planets earned for the bank.</p>

            <h2 id="rapports">Combat reports</h2>
            <p>At the end of each match, every player receives a <strong>report</strong> in their Reports page: result, score of your alliance and of each opponent, planets held, bases sacked, your damage dealt and taken, the enemy fleets destroyed by yours and the fleets you lost, your remaining strength, your damage rank among your alliance's pilots — with the <strong>match MVP</strong> title for the first — and the PDG paid to the bank.</p>
            <p>At the end of the tournament, a <strong>personal recap</strong> is added: your alliance's run through the bracket, match record, your total contribution and the breakdown of your gains (personal bonus, alliance bank, territory held).</p>

            <h2 id="suivi">Following the event from the Arena tab</h2>
            <p>The <strong>Arena</strong> tab on your Alliance page always shows the real state of the event: no arena running, next arena coming up (with a countdown to the announcement), announced, registration open or closed, arena in progress, or finished. A countdown shows the time left before the next step (registration closing, combat starting, next round), and a panel shows how many of your alliance's members are already registered out of the total.</p>
            <p>Once the arena is over, the tab also keeps your alliance's <strong>record</strong> (arenas played, championships, best round reached, win/loss tally) and the history of the last ten editions played on your server, with your alliance's result and the rewards earned each time.</p>

            <h2 id="spectateur">Spectator mode</h2>
            <p>Not registered for the current arena? You can still follow <strong>your alliance's</strong> matches live from the Arena tab: the sector is shown exactly as for a pilot, but you cannot give any order.</p>

            <h2 id="astuces">Tips</h2>
            <ul>
                <li><strong>Take the Nexus early</strong>: it earns as much as three worlds. But everybody knows that.</li>
                <li><strong>Detach your hunters</strong>: a fast squadron captures worlds while your heavy fleet holds the centre.</li>
                <li><strong>Arrive together</strong>: fleets arriving within the same 5 seconds fight side by side; a lone fleet gets destroyed and gives away 5 points.</li>
                <li><strong>Keep a shipyard</strong>: stopping there repairs your fleets twice as fast as at the base.</li>
                <li><strong>Do not camp</strong>: a captured planet stays yours when you leave. Go and take another one.</li>
                <li><strong>A base is taken together</strong>: attacking an intact base alone gives points away. With several allies, in the same 5-second window, it is 50 points at once.</li>
                <li><strong>Give at least one order</strong>: without an order of your own, no individual bonus.</li>
            </ul>

            <h2 id="mobile">On mobile</h2>
            <p>The arena plays with your fingers on mobile:</p>
            <ul>
                <li><strong>Landscape orientation</strong> is forced when you enter a match in the mobile app. In a mobile browser, where the game cannot force the screen, a message invites you to turn the device.</li>
                <li><strong>The whole sector fits on screen</strong>: no zoom or camera to manage.</li>
                <li><strong>Three taps for an order</strong>: your fleet (in the bottom bar, or by tapping its planet), the destination planet, then the "Send" button.</li>
                <li><strong>The frame and the tag</strong> of each planet tell who owns it; the figures in its corners give the forces in orbit, yours in green, the enemy's in red.</li>
                <li><strong>ⓘ button</strong>: the details of the selected planet and the battle log.</li>
                <li><strong>Push notif</strong>: one alert when registration opens (08:00), carrying the deadline and the battle time.</li>
            </ul>

    ia_bots:
        title: "AI Commanders (bots)"
        category: "events"
        order: 4
        tags: "ai,bot,artificial intelligence,npc,autopilot"
        summary: "Some servers include AI-controlled commanders. How they behave, and why."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principle">Why AI?</h2>
            <p>On some servers, a few commanders are not human players but <strong>artificial intelligences</strong>. They allow:</p>
            <ul>
                <li><strong>Populating the server</strong> when few active players are around;</li>
                <li>offering <strong>interesting targets</strong> for players seeking combat;</li>
                <li>simulating a lively diplomacy with proposals, betrayals, and credible alliances.</li>
            </ul>

            <h2 id="behavior">How they behave</h2>
            <p>Each bot has:</p>
            <ul>
                <li>a <strong>personality</strong> (aggressive, peaceful, opportunistic…);</li>
                <li>a <strong>mood</strong> that evolves with events;</li>
                <li>a <strong>strategic archetype</strong> (economist, militarist, explorer…).</li>
            </ul>
            <p>They really play: they build, research, attack, form alliances, sometimes betray. They can be your best allies or your worst enemies.</p>
            <p>They grow <strong>every day at the pace of the server's active players</strong> (slightly faster than the median), without ever exceeding <strong>90% of the top player</strong>. What they lose in combat is lost for good: if a player destroys their garrison, they do not rebuild it on that planet for <strong>7 days</strong> and reinforce their turrets instead.</p>
            <p><strong>Where their fleet sleeps.</strong> Militarist and explorer AIs keep a garrison in orbit of their planets. The others, more cautious, keep their ships <strong>on the ground</strong>, like many players, and only bring them out to defend themselves: when their radar spots an incoming hostile fleet they can beat, they put their fleet in orbit and call in the ships of their nearby planets that can arrive in time; against a fleet that is too strong, they send theirs to land on another of their planets. They also join a fight already under way above their planet, or attack an armed fleet parked in orbit, when they can win. Like a player, a sleeping AI does not react, and a fleet hidden by a jammer catches it by surprise. They never leave their ships on the ground of a planet without turrets, where an invasion would capture them: the ships go and land on their best-defended planet, which is also their first refuge.</p>
            <p><strong>Their trade.</strong> They sell their surplus and their recyclers' cargo to the nearest trader, unless it is under blockade or guarded by a hostile fleet in attack mode, which would destroy their convoy on arrival: they then go to the next one.</p>

            <h2 id="spot">How to spot them</h2>
            <p>Bots appear in the ranking like normal players. Their behavior is coherent, but a trained eye often notices patterns: very fast replies in alliance chat, atypical login schedules, mechanical diplomacy.</p>

            <h2 id="strategy">Playing with them</h2>
            <ul>
                <li>Don't underestimate a bot: some are real military menaces.</li>
                <li>A bot can invite you to an alliance, cooperate, then attack you if the situation changes.</li>
                <li>For immersion, treat them as players: it makes the server feel alive.</li>
            </ul>

            <h2 id="pilote-automatique">Absent players: autopilot</h2>
            <p>If a player stops logging in for <strong>8 days</strong>, their account switches to <strong>autopilot</strong>: a <strong>mute</strong> bot that never writes in chat rooms or private messages. This autopilot <strong>does not play in their place</strong>: the account launches no attacks, neither moves nor engages your fleets, and does not colonize. It merely carries on your constructions and research and slowly reinforces your turrets. Other AI commanders do not attack it; other players still can. You can still send it a private message: the player will read it upon returning. As soon as the player logs back in, they instantly regain control of their account and find their fleets exactly where they left them.</p>

    account_deletion:
        title: "Delete my account and data"
        category: "beginner"
        order: 99
        tags: "deletion,account,data,gdpr,privacy"
        summary: "How to request the permanent deletion of your account and personal data."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Where to request it</h2>
            <p>You can request the deletion of your account and personal data at any time from the public page <strong>/suppression-donnees</strong>, or from the bottom of your in-game options.</p>

            <h2 id="irreversible">A permanent account closure</h2>
            <p><strong>Warning: this is a permanent account closure.</strong> Your personal data (email, social logins, IP address, notifications, private messages…) is deleted or anonymized immediately, and you will never be able to log back into this account.</p>

            <h2 id="conserve">What is kept, and why</h2>
            <p>To preserve game balance, your commanders, planets and fleets continue to exist under an anonymous bot username, with no link to your identity. Public messages written in chat rooms are also kept, now attributed to your anonymous bot username. Your payment history is kept (legal accounting requirement), also dissociated from your identity.</p>

    achievements:
        title: "Achievements"
        category: "progression"
        order: 11
        tags: "achievements,trophies,google play,play games,progression"
        summary: "15 account achievements, from first steps to career feats, on your profile and in Google Play Games."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">How it works</h2>
            <p><strong>Achievements</strong> reward what you accomplish with your account, <strong>across all servers</strong>. Once unlocked, an achievement stays unlocked, even if you later lose the planet or leave the alliance that earned it.</p>
            <p>You will find them on your <strong>cross-server profile</strong> (menu “My cross-server profile”), with your progress and the date of each unlock. Another player's profile shows theirs. Those your history has already earned are unlocked right away.</p>
            <h2 id="liste">The 15 achievements</h2>
            <table>
            <tr><th>Achievement</th><th>Condition</th><th>Points</th></tr>
            <tr><td>Commander</td><td>Complete the tutorial</td><td>20</td></tr>
            <tr><td>Builder</td><td>Complete your first construction</td><td>20</td></tr>
            <tr><td>Scholar</td><td>Complete your first research</td><td>20</td></tr>
            <tr><td>Colonist</td><td>Own 2 planets</td><td>20</td></tr>
            <tr><td>Ally</td><td>Join or found an alliance</td><td>20</td></tr>
            <tr><td>Veteran I, II, III</td><td>Fight 10, 100 then 1,000 space battles</td><td>25, 50, 100</td></tr>
            <tr><td>Conqueror I, II</td><td>Carry out 10 then 100 successful invasions</td><td>50, 100</td></tr>
            <tr><td>Jailer</td><td>Capture an enemy hero</td><td>50</td></tr>
            <tr><td>Cthulhu Hunter</td><td>Win a Tower Defense game</td><td>50</td></tr>
            <tr><td>Elite</td><td>Finish in the top 10 of a server</td><td>100</td></tr>
            <tr><td>Emperor</td><td>Win a server</td><td>200</td></tr>
            <tr><td>A hidden achievement</td><td>Discover it by playing</td><td>50</td></tr>
            </table>

            <h2 id="progression">Progress</h2>
            <p>Battle and invasion achievements advance in tiers, and your profile shows the counter (for example 37 / 100). Every space battle you fight counts, won or lost, including an unarmed fleet (cargo ships, recyclers, probes) being destroyed, for both sides; invasions count when they succeed (raids do not). Elite and Emperor are decided when a server ends.</p>
            <h2 id="google-play">Google Play Games (Android)</h2>
            <p>In the Android app, your achievements also show up in <strong>Google Play Games</strong>, with the “Achievement unlocked” banner.</p>
            <ul>
            <li><strong>Trial account</strong> created in the app: it is linked automatically to your Google Play Games profile. It is then no longer deleted after 7 days without playing, and it reopens on its own after a reinstall or on a new phone.</li>
            <li><strong>Registered account</strong>: link it from your cross-server profile (“Google Play Games” card). It will then open without a password with that Google Play Games profile: only do it on your own device. You can unlink it at any time from the same card, on the website as in the app.</li>
            <li>The <strong>“Play Jeux”</strong> button on the sign-in screen reopens the linked account. Logging out turns off automatic opening on that device: this button is then what reopens the account.</li>
            </ul>
            <p>A Google Play Games profile links to a single Area account, and an account to a single profile. Linking your account from your profile takes the Google Play Games profile over from the other account it was linked to, if any.</p>

