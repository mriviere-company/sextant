articles:
    moderation_blocking:
        title: "Moderation: report and block"
        category: "beginner"
        order: 12
        tags: "moderation,report,block,chat,messages,terms,sanction"
        summary: "Report an abusive message, block an unwanted player, see what moderation does and find the rules everyone accepts at first login."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="terms">Terms of use</h2>
            <p>At first login, each player accepts the <strong>terms of use</strong> and the community rules: respect for other players (no harassment, insults or hate speech), no illegal, obscene or defamatory content in chats, messages and names, no cheating, abusive multi-accounting or bug exploitation. Refusing logs you out. If the terms change, they will have to be accepted again.</p>

            <h2 id="report">Reporting a message</h2>
            <p>Each message from another player in the chats, and each private message received (except those sent anonymously), carries a <strong>flag</strong> icon. One click opens the choice of reason: <strong>Insults / Harassment</strong>, <strong>Spam</strong> or <strong>Other inappropriate content</strong>. The report goes to the moderation team, with a copy of the message.</p>
            <p>A player can also be reported from their profile, <strong>Report</strong> button: Multi-account, Insults / Harassment, Cheating, Spam or Other.</p>
            <p>Limits: <strong>three reports per day</strong> (the counter resets at midnight, Paris time) and <strong>a single report per player, permanently</strong>, whether it goes through a flag or through their profile. Beyond that, the game displays "You already reported this player, or reached the daily report limit."</p>

            <h2 id="moderation">What moderation does</h2>
            <p>A report triggers no automatic sanction: each one is reviewed by the moderation team, which also sees who sent it. Multiplying reports against a player is therefore not enough to get them sanctioned, and an abusive report has no direct effect on the person targeted.</p>
            <p>Depending on severity, moderation can forbid a player, for a given duration, from writing in chats and by private message, or ban their account.</p>

            <h2 id="block">Blocking a player</h2>
            <p>The <strong>Block</strong> button on a player's profile immediately hides all their messages in the chat rooms and prevents any private message exchange, in both directions. Blocking targets their account: it applies on all servers where you run into them.</p>
            <p>The list of blocked players is managed in <strong>Parameters</strong> ("Blocked players" section): each player can be unblocked there at any time with the <strong>Unblock</strong> button.</p>
    getting_started:
        title: "Getting started"
        category: "beginner"
        order: 1
        tags: "start,begin,beginner,new,tutorial,guide"
        summary: "Welcome! The shortest guide to understanding Area Universe and making the most of your first hours of play."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="what-is-it">What is Area Universe?</h2>
            <p>Area Universe is a <strong>multiplayer space strategy game</strong>. You lead an empire: your planets produce resources, your ships roam the galaxy, and your alliances decide the fate of players.</p>
            <p>It's a game <strong>played over the long term</strong>: your resources keep piling up even when you're offline. A few minutes a day is enough to progress.</p>

            <h2 id="goal">Your goal</h2>
            <p>Depending on the server mode you choose (see the <em>Server modes</em> article), the final goal varies: last the longest, dominate the ranking, be the last one standing, etc. But the recipe is always the same:</p>
            <ol>
                <li><strong>Run an economy</strong> (resources + currency).</li>
                <li><strong>Build a fleet and a defense</strong>.</li>
                <li><strong>Team up</strong> to carry more weight together.</li>
            </ol>

            <h2 id="first-actions">Your first 6 actions</h2>
            <p>Your starting planet isn't empty: it already has a Niobium mine and a Water extractor at level 3, a Shipyard, a Ground radar and a small ground fleet (10 probes, 5 hunters, 2 frigates and 1 colonizer).</p>
            <ol>
                <li><strong>Upgrade your Niobium mine and your Water extractor</strong> (<em>Building</em> page).</li>
                <li><strong>Add an Agricultural field</strong>: your workers eat rations (the game's food).</li>
                <li><strong>Research Urban redevelopment, then build a Large city</strong>: +25,000 maximum workers per level. Workers are your source of <em>Bitcoins</em> (the game's currency).</li>
                <li><strong>Build a Research center</strong>: it houses your scientists, who raise your research speed in steps (see <em>Workers and scientists</em>).</li>
                <li><strong>Send cargo ships to sell your surplus</strong> niobium and water to a trader: on the <em>Spatial map</em>, click the trader, then <em>Interaction</em>, choose your cargo fleet and the <em>Unload and return</em> mission. Cargo I requires the <em>Cargo management</em> research.</li>
                <li><strong>Join an alliance</strong>: <strong>+20%</strong> on niobium, water and ration production on all your planets, and access to alliance researches.</li>
            </ol>
            <p>Also remember to <strong>colonize a 2nd planet</strong> with your starting colonizer: no research is needed (see the <em>Colonizing a new planet</em> article).</p>

            <h2 id="tutorial">The built-in tutorial</h2>
            <p>An <strong>interactive tutorial</strong> guides you step by step, in 5 chapters: First steps, Military power, Explore and conquer, Develop your economy, Diplomacy and community. On your first login, you choose your path:</p>
            <table>
                <thead>
                    <tr><th>Path</th><th>Steps</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Full discovery</strong></td><td>18</td></tr>
                    <tr><td><strong>Balanced path</strong></td><td>17 (without the reminder about clicking a planet)</td></tr>
                    <tr><td><strong>Straight to the core</strong></td><td>8 (only what is specific to Area Universe)</td></tr>
                    <tr><td><strong>I'll figure it out</strong></td><td>none</td></tr>
                </tbody>
            </table>
            <p>The steps, chapter by chapter (* = steps of the <em>Straight to the core</em> path):</p>
            <ol>
                <li><strong>First steps</strong>: Your resources*, Beginner protection*, Your Empire*.</li>
                <li><strong>Military power</strong>: Create a fleet, Produce ships, Upgrade your ships*, Discover the arena*, Organize your fleets into cohorts.</li>
                <li><strong>Explore and conquer</strong>: The space map, Select a planet, Interact with a planet, Colonize a planet, Defend your planets.</li>
                <li><strong>Develop your economy</strong>: Build structures, Launch research.</li>
                <li><strong>Diplomacy and community</strong>: Join an alliance*, The Wiki*, The Lounge*.</li>
            </ol>
            <p>Some modes remove steps: the research step in <em>Search &amp; Destroy</em> and <em>Domination</em>, the research and alliance steps in <em>Battle Royale</em>. The "Step X of N" counter in the guide always shows the total for your path.</p>
            <p>Each completed step grants a reward. Whatever your path, you receive a total of <strong>232,000 Bitcoins, 150 Legionnaires, 100 workers, 500 war points and 2 hunters</strong>: whatever your path skips is paid to you as a bonus at the end (right away with <em>I'll figure it out</em>).</p>
            <ul>
                <li>You can leave it at any time (<em>Quit tutorial</em>) and change path along the way; steps already completed remain yours.</li>
                <li>To restart it: <strong>Preferences</strong> page, <em>Tutorial</em> section.</li>
            </ul>

            <h2 id="watch-out">What to watch from the start</h2>
            <ul>
                <li><strong>Positive Bitcoins</strong>: every day at <strong>18:59 (Paris time)</strong>, i.e. 17:59 UTC in winter and 16:59 UTC in summer, a daily report calculates your income and maintenance costs. If your balance goes negative, it's an <strong>Economic Game Over</strong>: you lose all your fleets and all your ships, and your balance resets to 125,000 Bitcoins (you keep your planets and buildings).</li>
                <li><strong>Storage</strong>: if your warehouses are full, production stops. Build storage accordingly.</li>
                <li><strong>Daily quests</strong>: 3 quests per day (<em>Objectives</em> page), each rewarded with war points, plus a bonus equal to their average reward if you complete them all.</li>
            </ul>

            <h2 id="protection-debutant">Beginner protection</h2>
            <p>During your first days, you are <strong>protected</strong>: no player can send a fleet to your planets. So nobody can attack, raid, invade, bombard or even probe you; an ally can't deliver resources to you either. Fleets already on their way to you are sent back. Plenty of time to build your first bases in peace.</p>
            <p>Protection ends as soon as one of these conditions is met:</p>
            <ul>
                <li><strong>7 days</strong> have passed since your commander was created.</li>
                <li>You own a <strong>4th planet</strong> (your moons don't count).</li>
                <li>You send an <strong>offensive mission</strong> yourself (raid, invasion or nuclear strike): you then immediately give up your protection.</li>
                <li>You enable <strong>attack mode</strong> on one of your fleets.</li>
            </ul>
            <p>In the last two cases, a confirmation window warns you first. Take advantage of this period to build a solid economy and defense before throwing yourself into battle.</p>

    interface_guide:
        title: "Understanding the interface"
        category: "beginner"
        order: 2
        tags: "interface,screen,menu,navigation,buttons,active planet,resource bar,rations,preferences,parameters"
        summary: "The 3 zones of the screen and how to navigate without getting lost."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="layout">The 3 zones of the screen</h2>
            <ul>
                <li><strong>The resource bar, at the top</strong> — your resources, your Bitcoins, your War Points, and the name of your <strong>active planet</strong>: tap it to switch planets.</li>
                <li><strong>The menu</strong> — all the sections of the game (Global view, Hero, Fleets, Planets, Building, Spatial map, Alliance, Report, Messaging, Salon…). Its location depends on your screen (see below).</li>
                <li><strong>The central area</strong> — the content of the current page (map, fleet list, buildings…). It's the only area that scrolls.</li>
            </ul>
            <p>The location of the menu depends on your screen:</p>
            <ul>
                <li><strong>On a computer</strong>: the full menu is on the left. At the very bottom, a row of icons opens the error report, the tutorial (if it's in progress), <strong>Notifications</strong>, <strong>Preferences</strong>, your account <strong>Parameters</strong>, your <strong>cross-server profile</strong> and the <strong>language</strong> selector.</li>
                <li><strong>On a phone held horizontally and in the Android app</strong>: a rail of icons sticks to the left edge. It permanently keeps the five main destinations — Global view, Spatial map, Building, Space shipyard and Defense — and the <strong>Menu</strong> button (…), which opens everything else in a panel that slides up from the bottom.</li>
                <li><strong>On a tablet or on a phone held vertically</strong> (in a browser): these five destinations and the <strong>Menu</strong> button form a bar at the bottom of the screen.</li>
            </ul>
            <p>The number shown on the Menu button adds up your new reports, private messages, salon messages and pending arena duels.</p>

            <h2 id="resource-bar">The resource bar (at the top)</h2>
            <p>It shows the resources of your active planet in real time:</p>
            <ul>
                <li><strong>Niobium</strong> — the basic ore (buildings, ships).</li>
                <li><strong>Water</strong> — essential for construction and for ships.</li>
                <li><strong>Rations</strong> (food) — eaten by your workers: 1 ration per hour for 500 workers. If they drop to zero, famine first kills workers, then Legionnaires too, and finally Mechs.</li>
                <li><strong>Uranium</strong> — a rare resource (nuclear bombs, Nuclear base, arena entries). It only appears if the planet has some.</li>
            </ul>
            <p>Niobium, water, rations and your workers advance second by second at the pace of your production, up to your storage cap; rations can also drop if your workers eat more than you produce. Tap niobium, water or rations to see their hourly production, bonuses included (hero, slave camp, alliance, moons, embargo); for rations, it's the net balance, consumption deducted.</p>
            <p><strong>Bitcoins</strong> (currency) and <strong>War Points (WP)</strong> are also shown in the bar, along with your workers, Legionnaires, scientists and Mechs, and the space used on the ground (<strong>Ground</strong>) and in orbit (<strong>Space</strong>), in the form "used/maximum".</p>
            <p><em>On a phone, the bar is collapsed: it only shows niobium, water, rations, uranium, Bitcoins and WP, plus any resource in alert (famine, threat in orbit). The arrow button at the end of the bar, which shows the number of hidden resources, expands it.</em></p>

            <h2 id="active-planet">Active planet: what it means</h2>
            <p>When you have several planets, only one is <strong>active</strong> at a time. All your actions (building, producing a ship, launching a fleet) apply to that planet.</p>
            <p>To switch:</p>
            <ul>
                <li>tap the planet name in the resource bar: the <strong>My planets</strong> list opens (in a panel that slides up from the bottom on a phone, right below the bar on a computer); pick one;</li>
                <li>or use the ‹ and › arrows on either side of the name to go to the previous or next planet.</li>
            </ul>
            <p>You stay on the same page, shown for the new planet. The order of the list is set in <strong>Preferences</strong>, "Planet sorting": alphabetical, position, colonization or size.</p>

            <h2 id="navigation">Finding your way quickly</h2>
            <ul>
                <li><strong>Global view</strong> — your commander, your fleets, your finances, the current research and the activity of all your planets.</li>
                <li><strong>Building</strong> — build the buildings of the active planet.</li>
                <li><strong>Space shipyard</strong> and <strong>Defense</strong> — produce ships and defenses on the active planet.</li>
                <li><strong>Planets</strong> — the list of all your planets, and the market.</li>
                <li><strong>Fleets</strong> — create, send and track your ships.</li>
                <li><strong>Spatial map</strong> — explore the galaxy.</li>
                <li><strong>Report</strong> — everything the game tells you about (combat, arrivals, alliance…).</li>
                <li><strong>Messaging</strong> — your private messages; <strong>Salon</strong> — the chat rooms.</li>
                <li><strong>Alliance</strong> — members, bank, diplomacy, alliance arena.</li>
                <li><strong>Preferences</strong> — your nickname and your settings on this server; <strong>Parameters</strong> — your account (e-mail, password, time zone, blocked players, link to your Discord account).</li>
                <li><strong>Server</strong> — switch server.</li>
            </ul>
            <p>Depending on the server mode, some entries don't appear (Research, Alliance or Cthulhu).</p>

    resources_intro:
        title: "Resources"
        category: "beginner"
        order: 3
        tags: "resources,niobium,water,food,rations,uranium,production,storage,cycle"
        summary: "The game's 4 resources, how they are produced and why storage is critical."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="the-4">The 4 resources of the game</h2>
            <table>
                <thead>
                    <tr><th>Resource</th><th>What it's for</th><th>How you get it</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Niobium</strong></td><td>Building buildings, ships and defenses</td><td>Niobium mine</td></tr>
                    <tr><td><strong>Water</strong></td><td>Building buildings, ships and defenses</td><td>Water extractor</td></tr>
                    <tr><td><strong>Food</strong> ("Rations" in the game)</td><td>Feeding your workers</td><td>Agricultural field and Aeroponic farm (their productions add up)</td></tr>
                    <tr><td><strong>Uranium</strong></td><td>Nuclear base, nuclear bombs, interceptors, arena entries</td><td>Recycling uranium debris, victories against the Cthulhus</td></tr>
                </tbody>
            </table>
            <p>Only <strong>workers</strong> eat: 1 ration per hour for 500 workers. If rations run short, famine kills workers, then Legionnaires and Mechs if it lasts.</p>
            <p>Besides these resources, the <strong>Bitcoin</strong> is the game's currency: it pays for research, recruitment, fleet fuel and the daily maintenance (see <a href="/wiki/bitcoin_economy">Bitcoins and maintenance</a>).</p>

            <h2 id="cycle">The production cycle</h2>
            <p>Your resources arrive automatically, continuously. Production amounts are expressed per <strong>production cycle</strong>, and the game credits you in proportion to the time elapsed:</p>
            <ul>
                <li>On a <strong>planet</strong>: a <strong>10-minute</strong> cycle.</li>
                <li>On a <strong>moon</strong>: a <strong>1-minute</strong> cycle (10 times faster, for food only).</li>
            </ul>
            <p>Production is <strong>proportional to the level</strong> of the building. Per level and per 10-minute cycle:</p>
            <ul>
                <li><strong>Niobium mine</strong>: 33 niobium;</li>
                <li><strong>Water extractor</strong>: 22 water;</li>
                <li><strong>Agricultural field</strong>: 27 rations;</li>
                <li><strong>Aeroponic farm</strong>: 37 rations.</li>
            </ul>
            <p>Example: a level 10 Niobium mine produces 330 niobium every 10 minutes, i.e. 1,980 per hour, before bonuses. The resource bar shows your actual hourly production, bonuses included.</p>

            <h2 id="bonus">What improves your production</h2>
            <ul>
                <li><strong>Joining an alliance</strong>: an immediate <strong>+20%</strong> on niobium, water and rations.</li>
                <li><strong>Alliance researches and improvements</strong>: the "Macron law" research (+7% per level, The Balance of Worlds alliances) and the "Niobium production", "Water production" and "Ration production" improvements (+2% per level each).</li>
                <li><strong>Hero stationed on the planet</strong>: bonus drawn from its Intelligence, doubled for an Economy hero.</li>
                <li><strong>Slave camp</strong>: +2.5% per level.</li>
            </ul>
            <p>The size of the planet doesn't change what a level produces: the available room only limits the number of levels you can build.</p>

            <h2 id="storage">Storage (don't neglect it!)</h2>
            <p>Each planet has a <strong>maximum storage capacity</strong>, per resource. <strong>When it's full, everything produced beyond it is lost</strong>.</p>
            <p>At the start, a planet stores 200,000 niobium, 180,000 water and 150,000 rations. To increase the capacity:</p>
            <ul>
                <li><strong>Niobium warehouse</strong>: +1,200,000 niobium per level;</li>
                <li><strong>Water reservoir</strong>: +800,000 water per level;</li>
                <li><strong>Agricultural silo</strong>: +800,000 rations per level.</li>
            </ul>
            <p>They unlock with the <strong>Cargo management</strong> research level 1; the Agricultural silo also requires the <strong>Aeroponics</strong> research. Uranium, on the other hand, has no storage limit.</p>
            <p><em>Beginner tip:</em> check your storage <strong>before</strong> logging off for the night. Nothing's worse than finding your mines stopped for 10 hours.</p>

    bitcoin_economy:
        title: "Bitcoins and maintenance"
        category: "beginner"
        order: 4
        tags: "bitcoin,currency,maintenance,cost,scale,fuel,economy,game over,daily report"
        summary: "The Bitcoin is the game's currency. How to earn it, and above all how to avoid bankruptcy."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="what-is-it">What is the Bitcoin?</h2>
            <p>The <strong>Bitcoin</strong> is the <strong>universal currency</strong> of Area Universe (nothing to do with the real crypto, it's just a wink). You start with <strong>125,000 Bitcoins</strong>. They're used to:</p>
            <ul>
                <li>Launch <strong>research</strong>.</li>
                <li>Recruit <strong>Legionnaires</strong> (8 Bitcoins each), <strong>Mechs</strong> (60) and <strong>scientists</strong> (25), and build <strong>nuclear bombs</strong> (25,000).</li>
                <li>Pay the <strong>fuel</strong> for every fleet you send.</li>
                <li>Support your <strong>alliance</strong>: deposits into the treasury and investments in alliance improvements.</li>
                <li>Pay the <strong>daily maintenance</strong> of your troops, ships and buildings.</li>
            </ul>

            <h2 id="earn">How do you earn them?</h2>
            <ul>
                <li><strong>Workers</strong> — your main source. At the daily report, each worker present on your planets earns <strong>0.5 Bitcoin</strong>: 10,000 workers = 5,000 Bitcoins per day, the 50,000 workers of your starting planet = 25,000 Bitcoins per day, before alliance and peace taxes. Workers on board a fleet earn nothing.</li>
                <li><strong>Selling to traders</strong> — deliver niobium, water, uranium, and even workers or troops to them, or use the one-click sale on the <strong>Planets</strong> page (see <a href="/wiki/market">Market and traders</a>).</li>
                <li><strong>War Points</strong> — earned notably with daily quests, they are exchanged on the <strong>Objectives</strong> page: 1 WP = 1 Bitcoin.</li>
                <li><strong>Login bonus</strong> — an amount on each first login of the day, multiplied if you chain consecutive days.</li>
                <li><strong>Raiding</strong> — raids bring in niobium, water and uranium, which you can resell.</li>
            </ul>

            <h2 id="maintenance">Daily maintenance</h2>
            <p>Every day at <strong>18:59 (Paris time)</strong>, i.e. 17:59 UTC in winter and 16:59 UTC in summer, the game calculates a balance for you:</p>
            <ul>
                <li><strong>Income</strong>: what your workers earn.</li>
                <li><strong>Costs</strong>: the maintenance of your Legionnaires, Mechs, scientists, ships and buildings.</li>
                <li><strong>Balance</strong>: income − taxes − costs, added to (or deducted from) your balance.</li>
            </ul>
            <p>Everything <strong>in a fleet</strong> — in flight <em>or</em> stationed in orbit — costs far more than what is <strong>on the ground</strong> on a planet: 6 times more for ships and Legionnaires, 50 times more for Mechs. A fleet that isn't in use: put it on the ground. A big army constantly on the move ends up ruining even the most careful players.</p>

            <h2 id="bareme">The maintenance scale</h2>
            <p>Amounts in Bitcoins per day.</p>
            <table>
                <thead>
                    <tr><th>Unit</th><th>On the ground</th><th>In a fleet</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionnaire</td><td>0.1</td><td>0.6</td></tr>
                    <tr><td>Mech</td><td>2</td><td>100</td></tr>
                    <tr><td>Scientist</td><td>3</td><td>2</td></tr>
                    <tr><td>Ship</td><td>signature ÷ 12</td><td>signature ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Examples: 10,000 Legionnaires cost 1,000 Bitcoins per day on the ground, 6,000 in a fleet. 100 Cargo X (signature 50 each) cost about 417 Bitcoins per day on the ground, 2,500 in a fleet.</p>
            <table>
                <thead>
                    <tr><th>Building</th><th>Per level</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium mine, Water extractor, Agricultural field</td><td>1</td></tr>
                    <tr><td>Aeroponic farm</td><td>2</td></tr>
                    <tr><td>Large city, Ground radar</td><td>13</td></tr>
                    <tr><td>Metropolis</td><td>26</td></tr>
                    <tr><td>Niobium warehouse, Water reservoir, Agricultural silo</td><td>30</td></tr>
                    <tr><td>Research center</td><td>53</td></tr>
                    <tr><td>Barracks</td><td>66</td></tr>
                    <tr><td>Shipyard</td><td>100</td></tr>
                    <tr><td>Space radar</td><td>133</td></tr>
                    <tr><td>Weapons factory, Floating city, Orbital station</td><td>333</td></tr>
                    <tr><td>Radar jammer</td><td>400</td></tr>
                    <tr><td>Heavy industry</td><td>666</td></tr>
                    <tr><td>Defensive fort</td><td>800</td></tr>
                    <tr><td>Nuclear base</td><td>3,333</td></tr>
                    <tr><td>Prison, Slave camp</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Example: a level 3 Defensive fort costs 2,400 Bitcoins per day. Planetary defenses (turrets, shields) and workers have no maintenance. The alliance researches "Soviet structure", "Mechanical superiority" and "Scientific enthusiasm" reduce the maintenance of Legionnaires, Mechs and scientists.</p>

            <h2 id="bankruptcy">Warning: the Economic Game Over</h2>
            <p>If, after this daily balance, your Bitcoin balance falls <strong>negative</strong>, it's an <strong>Economic Game Over</strong>:</p>
            <ul>
                <li>All your <strong>fleets</strong> are deleted, in flight or in orbit, with their cargo and the troops on board.</li>
                <li>All the <strong>ships on the ground</strong> on your planets are lost.</li>
                <li>Your balance is reset to <strong>125,000 Bitcoins</strong>.</li>
            </ul>
            <p>You keep your planets, buildings, defenses, research and the troops left on the ground. A "Bankruptcy imminent" report warns you in advance (see <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Golden rule:</em> don't recruit an army that costs more than what your workers can finance.</p>

    first_buildings:
        title: "Build your first buildings"
        category: "beginner"
        order: 5
        tags: "buildings,construction,mine,extractor,agricultural field,large city,beginner,slot"
        summary: "The recommended build order to get your starting planet off to a good start."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="order">The recommended order (the first 10 buildings)</h2>
            <p>Your starting planet already has a Niobium mine and a level 3 Water extractor, a Shipyard and a level 1 Ground radar, 50,000 workers and 125,000 rations in reserve.</p>
            <ol>
                <li><strong>Niobium mine</strong> — upgrade it: it's your first source of raw material.</li>
                <li><strong>Water extractor</strong> — essential to build everything that follows.</li>
                <li><strong>Agricultural field</strong> — produces the rations that feed your workers.</li>
                <li><strong>Large city</strong> — +25,000 maximum workers (you start at the cap of 50,000). Requires the <strong>Urban redevelopment</strong> research level 1.</li>
                <li><strong>Niobium mine and Water extractor</strong> even higher — increase production before going further.</li>
                <li><strong>Research center</strong> — houses your scientists (250 per level). It isn't required to start a research.</li>
                <li><strong>Shipyard</strong> — you already have one; each level speeds up ship production by 25%. Upgrading requires the <strong>Industry</strong> research level 1.</li>
                <li><strong>Barracks</strong> — +5,000 maximum Legionnaires per level (2,000 without barracks). Requires the <strong>Military expansion</strong> research level 1.</li>
                <li><strong>Niobium warehouse</strong>, <strong>Water reservoir</strong>, <strong>Agricultural silo</strong> — keep production from hitting the cap. Require the <strong>Cargo management</strong> research level 1 (and <strong>Aeroponics</strong> for the Silo).</li>
                <li><strong>Metropolis</strong> — +80,000 maximum workers per level. Requires the <strong>Urban redevelopment</strong> research level 5.</li>
            </ol>
            <p>Costs, durations and room taken by each building: see <a href="/wiki/buildings">Buildings</a>.</p>

            <h2 id="queue">Only one construction at a time</h2>
            <p>Each planet has <strong>a single construction queue</strong>. While one building is being upgraded, the others have to wait. Plan accordingly.</p>
            <p>Several planets = several parallel queues: that's why colonization speeds up your progress.</p>

            <h2 id="space">Available room on a planet</h2>
            <p>Each planet has a limited number of <strong>ground slots</strong> and <strong>sky slots</strong>. <strong>Each level</strong> of a building takes up slots, upgrades included: a Niobium mine takes 1 ground slot per level, a Large city 6, a Metropolis 6 on the ground and 6 in the sky.</p>
            <ul>
                <li>The slots used and available are shown on each planet's card (<strong>Planets</strong> page) and on the <strong>Infrastructure</strong> page.</li>
                <li>The sky is used by the Metropolis, the Aeroponic farm, the Shipyard, the Space radar and the Radar jammer. Defenses (turrets, shields) take up no slots.</li>
                <li>To enlarge a planet: <strong>Floating city</strong> (+10 ground slots per level) and <strong>Orbital station</strong> (+5 sky slots per level), 5 of each at most per planet. They cost 2,000 War Points × the level and unlock with the <strong>Territorial expansion</strong> research (level 1 then 2), available after Terraforming level 18.</li>
                <li>No free slot left = no more construction or upgrade on that planet.</li>
            </ul>

    first_fleet:
        title: "Create your first fleet"
        category: "beginner"
        order: 6
        tags: "fleet,ships,first,creation,beginner,shipyard,cargo,probe"
        summary: "Build a ship, assemble a fleet and send it to its destination: step by step."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequisites">What you need first</h2>
            <ul>
                <li>A <strong>Shipyard</strong> built on your planet.</li>
                <li>The ship's resources: most often <strong>niobium</strong>, <strong>water</strong> and <strong>workers</strong> (your planet always keeps 5,000 in reserve, untouchable). A few ships also require War Points, Bitcoins or Legionnaires (see the <em>Ship types</em> article).</li>
                <li>The <strong>research</strong> that unlocks the ship. Example: cargo ships require <em>Cargo management</em> (level 1 for the Cargo I), itself accessible with <em>Utility ships</em> level 2. The Probe requires no research.</li>
            </ul>

            <h2 id="build">Step 1 — Build ships</h2>
            <p>Go to the <strong>Space shipyard</strong> page (left-hand menu), <strong>Ship construction</strong> tab. Pick a ship, enter a quantity and click <strong>Build</strong>. A ship that is still locked shows the research or building it is missing.</p>
            <p>Building takes time: you can keep playing in the meantime.</p>

            <h2 id="assemble">Step 2 — Assemble and send a fleet</h2>
            <ol>
                <li>On the <strong>Fleets</strong> page, click <strong>Create a new fleet</strong>, choose the ships to take on board (the ground stock is shown) and give the fleet a name (12 characters at most).</li>
                <li>Click the fleet's name to open its page. The <strong>Cargo</strong> tab is used to load resources when the fleet is on one of your planets.</li>
                <li>Send it:
                    <ul>
                        <li>for a simple move (<strong>Normal</strong> mission) or espionage, <strong>Move the fleet</strong> tab: enter the destination in the galaxy, system and planet fields (e.g. <code>1:5:12</code>) or pick one of "My planets", check the estimated cost and duration, then click <strong>Send</strong>;</li>
                        <li>for the other missions (Unload and return, Colonize, Raid, Invade…), go through the <strong>Spatial map</strong>: click the target square, then <strong>Interaction</strong>, choose the fleet and the mission, and click <strong>Send</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>Fuel is paid in <strong>Bitcoins</strong>, at departure (see the <em>Movement and distance</em> article). Missions are detailed in the <em>Mission types</em> article.</p>

            <h2 id="first-ships">The right ships to start with</h2>
            <ul>
                <li><strong>Cargo I</strong> — resource transport (3,000 capacity). The ideal ship for selling to traders.</li>
                <li><strong>Probe</strong> — spies on enemy planets. Send it <em>before</em> any attack.</li>
                <li><strong>Hunter</strong> — first combat ship, cheap (25 niobium, 5 water and 1 worker).</li>
                <li><strong>Recycler</strong> — collects debris after a battle. Very profitable, but slow: added to a fleet of hunters, it triples its flight time.</li>
            </ul>

            <h2 id="first-target">First mission idea</h2>
            <p>Fill 1 cargo ship with niobium or water, then send it from the <strong>Spatial map</strong> on an <strong>Unload and return</strong> mission to a trader. Traders are found in 20 fixed sectors of each galaxy (the four corners 1, 10, 91 and 100, then 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 and, in the center, 45, 46, 55 and 56), at a position that changes from one sector to another: spot them on the map.</p>
            <p>The trader pays you in Bitcoins and the cargo ship comes back on its own. The outbound trip costs double a normal trip and the return is paid at its departure, at the normal rate: for a single Cargo I, expect 0 to 2 Bitcoins outbound and 0 or 1 on the way back.</p>

    first_combat:
        title: "Your first combat"
        category: "beginner"
        order: 7
        tags: "combat,first,attack,report,beginner,rounds"
        summary: "How to trigger a space battle, what happens during it, and what to do afterwards."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="prepare">Getting ready (important!)</h2>
            <ol>
                <li><strong>Send a probe</strong> to the target to assess its defenses. Losing 10 hunters blindly is expendable; losing 100 hurts.</li>
                <li><strong>Assemble a suitable fleet</strong>: enough firepower, and remember to add a <strong>recycler</strong> to collect the debris.</li>
                <li><strong>Check your maintenance</strong>: every day, a ship costs its signature ÷ 2 in Bitcoins while it is in a fleet (in flight or stationed), versus its signature ÷ 12 on the ground. Put back on the ground whatever isn't in use.</li>
            </ol>

            <h2 id="sequence">What happens, step by step</h2>
            <ol>
                <li><strong>You enable attack mode</strong> on your fleet ("attack mode" box in fleet management; ship weapons are required), then you send it on a <em>Normal</em> mission to an enemy's coordinates. Fuel is paid in Bitcoins at departure.</li>
                <li><strong>It travels</strong> — the travel time is shown on the Fleets page. During the <strong>2 minutes</strong> after departure, the "Cancel" button immediately brings it back to its departure planet (the fuel paid is not refunded); after that, it will go all the way.</li>
                <li><strong>Arrival</strong>: if there are enemy fleets on site, the battle is scheduled <strong>5 minutes</strong> later. During this delay, nobody can change the attack mode of their fleets anymore.</li>
                <li><strong>Combat in rounds</strong>: both sides exchange one salvo per round, 100 rounds at most. Each salvo first hits the opponent's shield, but a share always gets through.</li>
                <li><strong>End of the battle</strong>: one side is eliminated, or the 100 rounds are reached. In that case, the side that keeps <strong>the most armor</strong> wins (in a perfect tie, the attacker wins).</li>
            </ol>

            <h2 id="after">After the battle</h2>
            <ul>
                <li>A <strong>battle report</strong> is sent to you: <strong>Report</strong> menu, <strong>Battles</strong> tab.</li>
                <li>Destroyed ships leave <strong>debris</strong> on site. Send recyclers!</li>
                <li>The winner earns <strong>War Points (WP)</strong> based on the enemy fleet destroyed; the loser gets a small consolation (see <em>Space combat</em>).</li>
                <li>Your surviving fleet <strong>stays in orbit</strong> at the battle site: send it back yourself. If it includes recyclers with room in their hold, they immediately start picking up the debris.</li>
            </ul>

            <h2 id="mistakes">Classic mistakes to avoid</h2>
            <ul>
                <li>Attacking without probing first.</li>
                <li>Forgetting that rounds stop at 100: a target too sturdy for you to wear down enough keeps more armor than you and wins.</li>
                <li>Not sending a recycler: your opponents will collect <em>your</em> debris before you do.</li>
            </ul>

    tips:
        title: "Tips for a good start"
        category: "beginner"
        order: 8
        tags: "tips,advice,strategy,beginner"
        summary: "15 tips that make all the difference in your first days."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economy">Economy</h2>
            <ul>
                <li><strong>Maximize your workers</strong>: they're your main source of Bitcoins.</li>
                <li><strong>Don't build a big army too early</strong>: it will ruin you in maintenance.</li>
                <li><strong>Research Urban redevelopment, then build Large cities and Metropolises</strong> to increase the population.</li>
                <li><strong>Watch your daily report</strong>: if your costs exceed your income, react right away.</li>
                <li><strong>Sell your surplus to traders</strong> rather than letting storage fill up.</li>
            </ul>

            <h2 id="military">Military</h2>
            <ul>
                <li><strong>Always keep a defense on every planet</strong>: Legionnaires in barracks, Mechs, one or two turrets.</li>
                <li><strong>Customize your ships every day</strong>: you can spend up to 40 upgrade points per day (hull, shield, weapons, accuracy), drawn from the credit specific to each ship type.</li>
                <li><strong>Recyclers are very profitable</strong>: after each battle, collect the debris. Add cargo ships to the fleet: a recycler alone only carries 1,000 resources.</li>
                <li><strong>Probe before attacking</strong>: a probe costs only 1,000 niobium (you have 10 at the start), a lost fleet costs a lot. Be aware that the target is notified of the espionage.</li>
                <li><strong>Watch out for the 100-round cap</strong>: if neither side is destroyed after 100 rounds, the one that keeps the most armor wins (the attacker in a perfect tie).</li>
            </ul>

            <h2 id="social">Social</h2>
            <ul>
                <li><strong>Join an alliance quickly</strong>: +20% niobium, water and ration production, access to diplomacy and alliance researches.</li>
                <li><strong>Complete your daily quests</strong> (<em>Objectives</em> page): each one earns war points (WP), and completing them all earns their average reward again at the next report.</li>
                <li><strong>Chat in the alliance salon</strong>: coordinating two attacks beats trying just one.</li>
                <li><strong>Log in every day</strong>: the login bonus soars with the 7-consecutive-day streak.</li>
                <li><strong>Enable push notifications</strong>: you'll know as soon as an enemy fleet is heading for you.</li>
            </ul>

    reports:
        title: "Game reports"
        category: "beginner"
        order: 9
        tags: "report,notification,combat,espionage,alliance,colonization,tabs,delete,share"
        summary: "The game sends you reports for every important event. Here is where to find them, what they contain and how to manage them."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="where">Where do you find your reports?</h2>
            <p>Open <strong>Report</strong> in the menu (on a phone: <strong>Menu</strong> button, then <strong>Report</strong>). The number of new reports is shown on this entry.</p>
            <p>The page opens on the <strong>All</strong> tab (your 300 most recent reports). The other tabs sort by category: <strong>Other</strong>, <strong>Alliance</strong>, <strong>Cthulhu</strong>, <strong>Battles</strong>, <strong>Invasions</strong>, <strong>Economic</strong> and <strong>Fleets</strong>. A tab only appears if it contains at least one report, and shows its unread count. Each unread report bears the "Unread" label: tap its row to open it.</p>
            <p>Messages from other players are not here: they're in <strong>Messaging</strong>.</p>
            <p>You can also enable <strong>push notifications</strong> to be alerted on your phone or in your browser (see the dedicated article).</p>

            <h2 id="gerer">Read, share, delete</h2>
            <ul>
                <li><strong>Mark read</strong>: button on an open report (opening it is enough too). <strong>Mark all as read</strong>, at the top of the page, handles all your reports at once.</li>
                <li><strong>Generate share link</strong>: creates a public link to this report; the <strong>Link</strong> button copies it. Anyone who has this link can read the report, even without an account.</li>
                <li><strong>Delete</strong>: erases the report immediately, with no confirmation and no trash.</li>
            </ul>
            <p>Deletion is done report by report: there is no archiving or bulk deletion. Your reports don't disappear on their own over time.</p>

            <h2 id="combat">Battle and invasion reports</h2>
            <p><strong>Battles</strong> tab:</p>
            <ul>
                <li><strong>Combat Report: Victory / Defeat</strong> — one of your fleets faced an enemy fleet (space combat).</li>
                <li><strong>Orbital Defense: Victory / Defeat</strong> — your planet's defenses faced an enemy fleet; the attacker gets <strong>Orbital Attack: Victory / Defeat</strong> on their side.</li>
                <li><strong>Planetary Defenses: Held / Wiped Out</strong> — a report dedicated to the owner who committed none of their own fleets in a merged battle: their defenses held or were wiped out.</li>
                <li><strong>Nuclear missile</strong> — your missile hit its target or was intercepted; a missile hit you or was intercepted at your place.</li>
                <li><strong>Your planet is under embargo!</strong> — one every hour while one of your planets is under siege, then a final report when the embargo is lifted. The besiegers get theirs too.</li>
                <li><strong>Famine on your planet!</strong> — your rations are depleted and famine is claiming victims.</li>
            </ul>
            <p><strong>Invasions</strong> tab:</p>
            <ul>
                <li><strong>Raid Report</strong> — a raid suffered or inflicted (victory or defeat, attacking or defending).</li>
                <li><strong>Invasion Report</strong> — an attempt to take a planet, from one side or the other.</li>
            </ul>

            <h2 id="cthulhu">Cthulhu reports</h2>
            <ul>
                <li><strong>Alert: horde inbound</strong> — a Cthulhu horde is heading for one of your planets.</li>
                <li><strong>Possessed Report: Defensive Victory / Attack Suffered</strong> — the result of a horde's attack on your planet. On PvE Hard difficulty, the title becomes <strong>Possessed Attack Report: Victory / Defeat</strong>.</li>
                <li><strong>Cthulhu Tower Defense: Victory / Defeat</strong> — the result of your active defense.</li>
                <li><strong>Counter-Attack Report: Victory / Defeat</strong> — your invasion of a planet held by the Cthulhus. A victory liberates the planet: it becomes free again, and the hive can't retake it for 72 hours.</li>
                <li><strong>Cthulhu Blockade</strong>, <strong>The hive expands</strong>, <strong>Hive eruption</strong> — the Cthulhu events in your sector and their consequences.</li>
            </ul>

            <h2 id="fleet">Fleet reports</h2>
            <p><strong>Fleets</strong> tab:</p>
            <ul>
                <li><strong>Your fleet has arrived</strong> — your fleet has reached its destination.</li>
                <li><strong>Resource Deposit</strong> — another player unloaded resources on one of your planets.</li>
                <li><strong>Your fleet has stopped recycling!</strong> — your recyclers have finished their work.</li>
            </ul>
            <p>Espionage is filed under the <strong>Other</strong> tab: <strong>Planet Analysis</strong> (your probe's result) and <strong>Espionage Detected</strong> (someone tried to spy on one of your planets).</p>

            <h2 id="alliance">Alliance reports</h2>
            <ul>
                <li><strong>Diplomacy</strong> — War declared (by your alliance) or War received, defensive alliance concluded or broken, non-aggression pact concluded or broken, peace agreement concluded or expired.</li>
                <li><strong>Members</strong> — New member, Member left, Member kicked, Member Game Over.</li>
            </ul>

            <h2 id="misc">Other reports</h2>
            <p><strong>Economic</strong> tab:</p>
            <ul>
                <li><strong>Empire Report</strong> — your daily economic balance, every day at 18:59 (Paris time).</li>
                <li><strong>⚠ Bankruptcy imminent!</strong> — your daily expenses exceed your income and your Bitcoins no longer cover one day of deficit (at most one alert per 24 hours).</li>
                <li><strong>Merchant Sale</strong> — your fleet sold its cargo to a trader.</li>
                <li><strong>Login Bonus</strong> — the day's Bitcoins and, on some days, an item.</li>
            </ul>
            <p><strong>Other</strong> tab:</p>
            <ul>
                <li><strong>Planet Colonization</strong> — new planet founded.</li>
                <li><strong>Planet Analysis</strong> and <strong>Espionage Detected</strong> — see above.</li>
                <li><strong>Completed queues</strong> (Buildings, Ships, Defense, Research) — the queue is empty: you can start again.</li>
                <li><strong>Hero and prison</strong> — hero captured, escaped, liberated or executed, prison alert, position revealed, item stolen or found, new hero, ransom demands.</li>
                <li><strong>Arena</strong> — challenge received, duel result, tournament, weekly reward, alliance arena.</li>
                <li><strong>Miscellaneous</strong> — end of your beginner protection, fleet turned back, failed moon mission.</li>
            </ul>

            <h2 id="compte-valide">Account to validate</h2>
            <p>⚠️ To <strong>send a message or Bitcoins</strong> to another player, and to create or join an alliance, your account must be <strong>validated</strong> and your <strong>e-mail confirmed</strong>.</p>
            <p>A trial account (created with "Test without email") is validated from the <strong>Confirm account</strong> entry of the menu: there you choose a nickname, a password and your e-mail address. A confirmation e-mail is then sent: click its link. Didn't receive it? Open <strong>Parameters</strong> (at the bottom of the menu on a computer, in the Menu panel on a phone): the <strong>Confirm my email address</strong> section lets you <strong>resend</strong> it (three times per hour at most).</p>

    cthulhu_prophecies:
        title: "The Cthulhu Prophecies"
        category: "events"
        order: 5
        tags: "cthulhu,prophecy,blockade,threat,event,alliance,war points,bitcoin,merchant,recycling,ranking"
        summary: "When the server threat reaches its threshold, Possessed announces a prophecy: 48 hours later, its hordes block the whole server's trade. How to read the gauge, break a blockade together, and what failure costs."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="what-is-it">What is a prophecy?</h2>
            <p>On <strong>Cthulhu</strong>, <strong>Long Run</strong> and <strong>Short Run</strong> servers, a server-specific <strong>threat pool</strong>, the "World threat", rises automatically, day after day. It is distinct from your personal threat against the Cthulhus.</p>
            <p>When it reaches its threshold, <strong>Possessed</strong> publishes a <strong>prophecy</strong> in the public chat: a <strong>blockade</strong> will fall on the whole server <strong>48 hours</strong> later.</p>

            <h2 id="gauge">Reading the server threat gauge</h2>
            <ul>
                <li>It is visible on the <strong>Cthulhu</strong> page (the Tower Defense one), in the <strong>"World threat"</strong> block: a bar that goes from 0 to <strong>700</strong>, the threshold that triggers a prophecy. It progresses independently of your personal combats.</li>
                <li>It rises by <strong>100 points per day</strong>, at the date change (midnight, Paris time). Starting from zero, it reaches the threshold in <strong>7 days</strong>. To estimate the time left: (700 − current level) ÷ 100 days. Example: at 400, the prophecy falls in 3 days.</li>
                <li>Each hive base liberated pushes it back by <strong>50 points</strong>, i.e. half a day of respite.</li>
                <li>A server's first event cannot occur before its <strong>first two weeks</strong> of existence.</li>
                <li>Never two prophecies (or two blockades) at the same time on the same server. During the event, the gauge may keep showing its progress, but it is reset to zero at the end: the next cycle starts again from 0. Count about 11 days between two prophecies (7 days of climb, 48 hours of waiting, 48 hours of blockade at most).</li>
            </ul>

            <h2 id="prophecy">The announcement</h2>
            <p>When the threshold is crossed, Possessed posts its prophecy in the public chat: the blockade falls <strong>48 hours later</strong>, and the Cthulhu page shows the countdown. The message, in Possessed's voice, evokes what is at stake: the trade blockade, the tithe on Bitcoins, the devoured wrecks.</p>
            <p>Possessed then posts, for sure, three other messages in the public chat:</p>
            <ul>
                <li>at the <strong>start of the blockade</strong>: the number of hordes, the objective to destroy and the time remaining, reminding that alliances are ranked;</li>
                <li><strong>6 hours before the deadline</strong>: a reminder of the time remaining and the number of hordes already fallen on the objective;</li>
                <li>at the <strong>outcome</strong>: blockade broken or blockade held, with the names of the alliances rewarded or punished.</li>
            </ul>
            <p>The game's Discord also announces the prophecy (with the blockade date, in UTC time), the start of the blockade and its outcome.</p>
            <p>Apart from these announcements, Possessed occasionally comments on the server's life in the public chat, but these messages are not guaranteed: to follow the threat, rely on the gauge.</p>

            <h2 id="blockade">The blockade</h2>
            <p>At the deadline, a <strong>Cthulhu horde</strong> (called a "wall fleet" on the Cthulhu page) takes position in orbit of <strong>every merchant</strong> and <strong>every asteroid</strong> on the server:</p>
            <ul>
                <li><strong>Selling is impossible</strong> to any blocked merchant.</li>
                <li><strong>Recycling is impossible</strong> on any blocked asteroid.</li>
                <li>Elsewhere in the universe, <strong>debris fields remain recyclable as normal</strong>, as after any other combat.</li>
                <li>On a blocked target, however, the <strong>wrecks from your own assaults pile up on the spot and stay out of reach as long as the horde guarding it is alive</strong>. Destroy it and <strong>that target reopens immediately</strong>, without waiting for the blockade's fate on the rest of the server: selling or recycling resume there, and your recyclers already in orbit get back to work on their own.</li>
                <li>Nothing to do with the embargo or famine that an enemy fleet imposes on a player planet: here, only trade and recycling stop.</li>
                <li>The blockade lasts <strong>48 hours</strong> at most, less if it is broken before.</li>
            </ul>

            <h2 id="breaking">Breaking a blockade together</h2>
            <p>Not all hordes are equal:</p>
            <ul>
                <li>Those guarding the <strong>merchants</strong> are worth <strong>1.8 times</strong> the server's biggest fleet (player or AI commander). Nobody breaks them alone: two or three need to team up.</li>
                <li>Those of the <strong>asteroids</strong> are only worth <strong>half</strong> of that biggest fleet: a big isolated fleet can beat them. Since asteroids are far more numerous than merchants, they make up the bulk of the counter.</li>
            </ul>
            <p>In any case, a <strong>coalition</strong> that hits the same horde in successive assaults ends up getting it. The damage a horde has taken <strong>never regenerates</strong> between combats: each assault, even a lost one, weakens it for the next. Concentrate your blows on the same target rather than scratching several hordes at once.</p>

            <h2 id="rewards">Rewards</h2>
            <p>Each point of damage dealt to a horde is <strong>paid in Bitcoin and War Points</strong> at the end of the event, whether or not the blockade is broken: no assault is lost for nothing. You receive 1 war point per 5,000 Bitcoins earned.</p>
            <p>The blockade is declared <strong>broken</strong> as soon as <strong>70&nbsp;% of the server's hordes have been destroyed before the deadline</strong> (rounded up), merchants and asteroids combined. Example: out of 160 hordes, 112 must be destroyed.</p>
            <p>The blockade then <strong>ends immediately</strong>: the remaining hordes disappear, all merchants and asteroids reopen, and the reward rate is <strong>doubled</strong> for all contributors.</p>
            <p>An individual report details your damage dealt and your reward at the end of the event. During the blockade, the <strong>Cthulhu page</strong> shows live progress: hordes destroyed, objective to reach and time remaining.</p>

            <h2 id="cost-of-failure">The price of failure</h2>
            <p>If the blockade <strong>expires without being broken</strong>:</p>
            <ul>
                <li><strong>Each player loses half of their Bitcoin</strong>: the Possessed take their tithe, including from players who have disabled PvE. Only players under <strong>beginner protection</strong> and players in game over are spared.</li>
                <li><strong>All the battle debris fields in the universe are devoured</strong> by the Cthulhus; the <strong>asteroids</strong>, for their part, remain intact.</li>
                <li>The <strong>bitcoin vault of each alliance</strong> with at least one human player also loses half of its contents: depositing your Bitcoin in the vault before the deadline protects nothing. The deduction appears in the vault's history.</li>
                <li>The <strong>last 3 alliances in the ranking</strong> additionally lose production for 72 hours (see below).</li>
            </ul>
            <p>The tithe is taken before rewards are paid: what you earn by fighting the hordes is not cut. Each player affected receives a report detailing the Bitcoin lost.</p>

            <h2 id="alliance-ranking">The alliance ranking</h2>
            <p>During the blockade, each alliance is ranked on what it does against the hive. The <strong>Cthulhu page</strong> shows the live ranking, with what your alliance would gain or lose if the blockade ended now.</p>
            <ul>
                <li><strong>Points</strong>: damage dealt to a blockade <strong>wall fleet</strong> counts double; damage dealt to the hive elsewhere (base sieges, hordes) counts single; each <strong>Tower Defense victory</strong> is worth as much as destroying a quarter of an asteroid wall fleet.</li>
                <li><strong>Points per member</strong>: the score is divided by the number of active members (logged in within the last 7 days, excluding beginner protection). A beginner's damage still counts: recruiting never lowers the score.</li>
                <li><strong>Membership frozen</strong> at the start of the blockade: changing alliance during the event moves neither the points, nor the bonus, nor the penalty.</li>
                <li>At least <strong>2 active members</strong> are needed to be ranked. <strong>Players without an alliance</strong> are never concerned.</li>
            </ul>
            <p><strong>Blockade broken</strong>: the top 3 alliances gain <strong>+15&nbsp;%, +10&nbsp;% and +5&nbsp;% production</strong> for 72 hours, provided they have scored points. No alliance is penalized.</p>
            <p><strong>Blockade endured</strong>: the last 3 alliances lose <strong>15&nbsp;%, 10&nbsp;% and 5&nbsp;% production</strong> for 72 hours, on top of the tithe. Never more than half of the ranked alliances are affected. An alliance that supplied the minimum effort is spared, even if last: the equivalent of half an asteroid wall fleet destroyed, or of two Tower Defense victories, per active member.</p>
            <p>Each member receives a report that explains their alliance's bonus or penalty and its end date.</p>

            <h2 id="tips">In practice</h2>
            <ul>
                <li>Watch the <strong>"World threat"</strong> gauge on the Cthulhu page: at 100 points per day, it tells you how many days remain before the threshold of 700.</li>
                <li>As soon as a <strong>prophecy</strong> is announced, warn your alliance: you have <strong>48 hours</strong> to get organized before the blockade falls.</li>
                <li>Concentrate assaults on the same hordes rather than scattering them: damage persists, so it is better to finish one off than to scratch several.</li>
                <li>Even a lost assault brings something: do not wait to be sure of winning before attacking.</li>
                <li>Not enough fleet to attack a horde? A <strong>Tower Defense victory</strong> during the blockade also earns points for your alliance.</li>
            </ul>

    notifications:
        title: "Push notifications"
        category: "beginner"
        order: 10
        tags: "notification,push,alert,mobile,android,browser,preference,bell"
        summary: "Get an alert in the Android app or in your browser as soon as an important event happens in your empire."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principle">What is it for?</h2>
            <p>Area Universe is played continuously: enemy fleets can arrive while you're at work. <strong>Push notifications</strong> alert you in real time on your phone or in your browser, so you can react in time.</p>

            <h2 id="events">What you can receive</h2>
            <p>On the Notifications page, the types are sorted into five groups:</p>
            <ul>
                <li><strong>Production &amp; Research</strong> — Research completed; Building completed (your construction queue is empty); Production completed (your ship or defense queue is empty).</li>
                <li><strong>Fleets</strong> — Fleet arrived at destination; Fleet in combat (one of your fleets is engaged in a battle); Enemy fleet approaching (a hostile fleet has just been launched toward one of your planets).</li>
                <li><strong>Planets</strong> — Planet under attack (a fleet is arriving to raid or invade); Planet under embargo; Nuclear strike received; Cthulhu attack; Spy detected.</li>
                <li><strong>Alliance</strong> — Alliance at war; Alliance message.</li>
                <li><strong>Personal</strong> — New private message; Hero captured; Hero liberated.</li>
            </ul>
            <p>Each type can be turned on or off <strong>individually</strong>. Two alerts have no switch of their own: <strong>Planet captured</strong> is always sent, and the <strong>Login bonus available</strong> reminder (once a day at most) can only be turned off with <em>Disable all</em>.</p>
            <p>"Enemy fleet approaching" ignores fleets from your alliance and from an alliance you have a defensive alliance, a non-aggression pact or a peace agreement with.</p>

            <h2 id="activation">How to enable them</h2>
            <ol>
                <li>Open the <strong>Notifications</strong> page: bell icon at the bottom of the menu on a computer; <strong>Menu</strong> button, then <strong>Notifications</strong> on a phone.</li>
                <li>In a browser, click <strong>Enable notifications</strong> ("Browser notifications" box); in the Android app, click <strong>Enable notifications</strong> in the "Notifications for this device" section.</li>
                <li>Accept the permission request from the browser or the phone.</li>
                <li>Further down, untick the types you don't want to receive: they are all enabled at the start.</li>
            </ol>
            <p>A <em>Disable all</em> button turns everything off in one click. Your choices per type apply to the server you're playing on, on all your devices.</p>
            <p>In a browser, the <strong>Notification sound</strong> option also plays a sound when something new arrives while the tab is in the background. A banner may also offer to enable notifications: <strong>Enable</strong> or <strong>No thanks</strong>.</p>

            <h2 id="compatibility">Where it works</h2>
            <ul>
                <li><strong>Android app</strong> (Google Play): it's the only app; there is none for iPhone or iPad.</li>
                <li><strong>Desktop browser</strong>: Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone and iPad</strong>: the game is played in the browser.</li>
                <li><strong>Several devices</strong>: each device on which you enabled notifications receives them; if you enabled them on your phone and on your computer, both ring.</li>
            </ul>

            <h2 id="troubleshooting">Browser refusing to register?</h2>
            <p>If your browser blocks the notification service, the Notifications page itself shows the steps to follow and a <strong>Try again</strong> button.</p>
            <p>On <strong>Brave</strong>, Google's push service is disabled by default. Open <code>brave://settings/privacy</code>, enable <strong>"Use Google services for push messaging"</strong>, then fully restart the browser. On other browsers, check that a VPN, an antivirus or a filtering DNS isn't blocking the notification service.</p>

            <h2 id="mobile">On the mobile app</h2>
            <p>In the Android app, the <strong>Notifications</strong> page has a "Notifications for this device" section: turn the phone's push notifications on or off at any time. If they're blocked, the <strong>Open settings</strong> button takes you straight to the phone's settings. Your choices per notification type apply to all your devices, on the server where you play.</p>

            <h2 id="discord">On Discord</h2>
            <p>If your Discord account is linked (<strong>My options</strong>), the <strong>Enemy fleet approaching</strong> alert also reaches you as a Discord direct message, with the arrival time and a link to the planet. At most one message per planet every 30 minutes: a multi-fleet attack does not flood you. You must be a member of the <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area Universe Discord</a> and accept direct messages from its members. The option is on by default and can be turned off in the <strong>Discord</strong> section of the notification preferences.</p>

    glossary:
        title: "Glossary"
        category: "beginner"
        order: 11
        tags: "glossary,terms,definitions,vocabulary,abbreviations"
        summary: "All the terms and abbreviations of the game, explained in one sentence."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">All the terms of the game</h2>
            <table>
                <tr><th>Term</th><th>Definition</th></tr>
                <tr><td><strong>Alliance</strong></td><td>A group of players. Being in one increases the niobium, water and ration production of your planets by 20%.</td></tr>
                <tr><td><strong>Barge</strong></td><td>Ship that lands Legionnaires for raids and invasions.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>The game's main currency. Generated by your workers.</td></tr>
                <tr><td><strong>Block</strong></td><td>Automatic grouping of allied fleets during a space battle.</td></tr>
                <tr><td><strong>DF</strong></td><td>Debris Field: the debris left after a battle, recyclable.</td></tr>
                <tr><td><strong>Shipyard</strong></td><td>Building that lets you build ships.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>The hostile creatures (formerly "zombies"). They appear in PvE mode and on alien planets.</td></tr>
                <tr><td><strong>Cycle</strong></td><td>Internal production rhythm. 10 min for a planet, 1 min for a moon.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Alliance alert level, from 0 (no alert) to 5 (maximum alert): the higher the number, the tenser the situation.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Siege of a planet by an enemy fleet in orbit. Causes a famine.</td></tr>
                <tr><td><strong>Maintenance</strong></td><td>Daily cost in Bitcoins of your troops, ships and buildings.</td></tr>
                <tr><td><strong>Defensive fort</strong> (Bunker)</td><td>Defensive building: increases Legionnaire capacity, lets you build Mechs and shelters from raids, per level, 5% of your niobium and water storage capacity (and 5% of your uranium).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>End of the game: economic bankruptcy, or loss of all your planets.</td></tr>
                <tr><td><strong>Economic Game Over</strong></td><td>Your Bitcoin balance went negative after the daily report.</td></tr>
                <tr><td><strong>Hero</strong></td><td>Your main character (you can also have secondary heroes). It levels up, fights, and can be captured.</td></tr>
                <tr><td><strong>Lunar</strong> (sometimes called Moon Maker)</td><td>Ship that creates a moon on an empty slot holding at least 2 million niobium and 2 million water in debris.</td></tr>
                <tr><td><strong>Trader</strong></td><td>NPC on the map that buys your resources for Bitcoins (and a few War Points).</td></tr>
                <tr><td><strong>Level</strong></td><td>From 2 to 40, it rises with your experience, which grows with your score; it never goes back down. It sets the floor of the login bonus.</td></tr>
                <tr><td><strong>Objectives</strong></td><td>The 3 daily quests, renewed at each daily report and paid in WP; completing them all earns their average reward again. Page of the same name in the menu.</td></tr>
                <tr><td><strong>WP</strong></td><td>War Points. Earned mostly in battle (and through daily objectives, the arena, the prison, selling to traders). Spent on the Objectives page (Bitcoins, Legionnaires, workers), for elite ships, the Floating city, the Orbital station and the Territorial expansion research.</td></tr>
                <tr><td><strong>Autopilot</strong></td><td>Silent mode that takes over a registered account absent for 8 days: it continues constructions and research, moves no fleet, and hands control back as soon as you return.</td></tr>
                <tr><td><strong>Active planet</strong></td><td>The planet currently selected. All your actions apply to it.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Non-Player Character: traders, aliens, Cthulhus, AI bots.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Ground attack to plunder a planet's resources (not to conquer it).</td></tr>
                <tr><td><strong>Daily report</strong></td><td>Daily balance calculated at 18:59 (Paris time): income, costs, balance, update of points and ranking, new objectives of the day.</td></tr>
                <tr><td><strong>Recycler</strong></td><td>Ship that picks up debris (DF): recycling starts on its own when a fleet with recyclers arrives on a debris field.</td></tr>
                <tr><td><strong>Round</strong></td><td>Combat turn. Max 100 in space combat, max 10 in ground combat.</td></tr>
                <tr><td><strong>Signature</strong> (thermal)</td><td>Order of magnitude of a fleet's mass, without revealing its composition. The larger it is, the more fuel a flight costs (paid in Bitcoins); it is also used to calculate your points and the War Points earned in battle.</td></tr>
                <tr><td><strong>Probe</strong></td><td>Small espionage ship. Send it before any attack.</td></tr>
                <tr><td><strong>Terraforming</strong></td><td>Research that sets the maximum number of planets you can own: its level + 2 (plus your alliance's regime bonuses), up to level 18. Level 1 unlocks the colonizer, level 15 the Lunar. To enlarge a planet, build a Floating city or an Orbital station (Territorial expansion research).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Active defense mini-game against Cthulhu hordes.</td></tr>
                <tr><td><strong>Worker</strong></td><td>Population unit. Produces Bitcoins every day. Defends during an invasion.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Guided, rewarded path (up to 18 steps in 5 chapters, depending on the path chosen). Start or resume it from the Preferences page, Tutorial section.</td></tr>
                <tr><td><strong>Mother ship</strong></td><td>Flagship paid for notably in WP: it gives its fleet 20,000 hull and 5,000 shield, +5% hull and shield, +10% accuracy and −10% signature. As slow as a battleship, it slows down a fleet of hunters or corvettes.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Player designated as the priority target in Search &amp; Destroy mode.</td></tr>
            </table>

    resources:
        title: "Resources in detail"
        category: "economy"
        order: 1
        tags: "resources,niobium,water,food,uranium,production,storage,cycle,rations"
        summary: "Understand everything about resources: production, bonuses, storage and the special case of uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="reminder">Reminder: the 4 resources</h2>
            <ul>
                <li><strong>Niobium</strong> — construction (buildings, ships, defenses).</li>
                <li><strong>Water</strong> — construction (buildings, ships, defenses). Fleet fuel, on the other hand, is paid in Bitcoins.</li>
                <li><strong>Food</strong> ("Rations" in the game) — eaten by your workers, and by them alone: 1 ration per hour for 500 workers. A famine also kills Legionnaires and Mechs.</li>
                <li><strong>Uranium</strong> — Nuclear base, nuclear bombs, interceptors, arena entries. Rare and precious.</li>
            </ul>

            <h2 id="production">How production is calculated</h2>
            <p>Production is expressed per <strong>10-minute</strong> slice (a planet's production cycle) and credited in proportion to the time elapsed. It depends on:</p>
            <ul>
                <li>the <strong>level</strong> of the producing building: per level and per 10 minutes, Niobium mine 33 niobium, Water extractor 22 water, Agricultural field 27 rations, Aeroponic farm 37 rations;</li>
                <li>your <strong>bonuses</strong> (alliance, "Macron law" research, alliance improvements, hero, Slave camp).</li>
            </ul>
            <p>Example: a level 8 Water extractor produces 8 × 22 = 176 water per 10 minutes, i.e. 1,056 per hour; in an alliance (+20%), 1,267 per hour. The size of the planet doesn't change what a level produces: it only limits the number of levels you can build.</p>
            <p><strong>Moons</strong> produce food <strong>10 times faster</strong> (1-minute cycle).</p>
            <p>Even <strong>without a producing building</strong> — or if you destroy it down to level 0 — a planet keeps a <strong>minimal base production</strong>: <strong>7 niobium, 6 water and 9 rations</strong> per cycle (20 rations on your starting planet). From level 1, the building's production replaces this minimum: it isn't added to it.</p>
            <p>For food, the <strong>Agricultural field</strong> and the <strong>Aeroponic farm</strong> <strong>add up</strong>: their productions stack.</p>

            <h2 id="bonus">What increases your production</h2>
            <table>
                <thead>
                    <tr><th>Source</th><th>Effect</th></tr>
                </thead>
                <tbody>
                    <tr><td>Alliance membership</td><td>+20% on niobium, water and rations</td></tr>
                    <tr><td>"Macron law" alliance research (Balance of Worlds)</td><td>+7% per level, up to level 5</td></tr>
                    <tr><td>"Niobium production", "Water production", "Ration production" alliance improvements</td><td>+2% per level, up to +10%</td></tr>
                    <tr><td>Hero stationed on the planet</td><td>Bonus drawn from its Intelligence, doubled if it's an Economy hero; an extra +20% with the "Magnate" trait (level 15 Economy hero)</td></tr>
                    <tr><td>Slave camp</td><td>+2.5% per level, plus 1% per level of each prisoner held (capped at 5% per camp level)</td></tr>
                    <tr><td>Verdict of a Cthulhu blockade</td><td>From +15% to −15% for the members of an alliance, for a limited time</td></tr>
                </tbody>
            </table>

            <h2 id="storage">Storage and its pitfalls</h2>
            <p>Your planet has a <strong>maximum capacity</strong> for each resource. When it's full, production continues but whatever exceeds it is lost.</p>
            <p>Solutions: build <strong>Niobium warehouses</strong>, <strong>Water reservoirs</strong> and <strong>Agricultural silos</strong>, sell the excess niobium and water to traders (rations, however, can't be sold), or send the surplus to another player.</p>

            <p>Food is transported like niobium and water: load <strong>rations</strong> into a fleet's hold (1 space per ration) to resupply another planet. On unloading, the granary never exceeds its capacity: the surplus stays in the hold.</p>

            <h2 id="uranium">Uranium: the special case</h2>
            <p>No building produces uranium. You get it:</p>
            <ul>
                <li>by <strong>recycling</strong> uranium debris on the map (spotted by their special icon);</li>
                <li>by <strong>defeating Cthulhus</strong> (PvE missions);</li>
                <li>by <strong>winning arena challenges</strong> with a uranium stake.</li>
            </ul>
            <p>Uranium is used to build the <strong>Nuclear base</strong> (500 per level), to make <strong>nuclear bombs</strong> (500 each) and <strong>interceptors</strong> (200 each), and to stake in the <strong>arena</strong>. It has no storage limit, is carried in the hold like other resources and resells for <strong>2,000 Bitcoins per unit</strong> to traders.</p>

    buildings:
        title: "Buildings"
        category: "economy"
        order: 2
        tags: "buildings,construction,cost,mine,extractor,agricultural field,large city,metropolis,shipyard,defensive fort,bunker,floating city,orbital station"
        summary: "Complete catalog of buildings by role, with their costs, duration and the room they take."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Resource production</h2>
            <p>The names below are those shown on the <strong>Infrastructure</strong> page. Each level takes up ground or sky slots (see the "Building costs" section below), and many buildings require a prior research.</p>
            <table>
                <thead>
                    <tr><th>Building</th><th>Produces</th><th>Note</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium mine</td><td>Niobium</td><td>33 niobium per level and per 10 minutes.</td></tr>
                    <tr><td>Water extractor</td><td>Water</td><td>22 water per level and per 10 minutes.</td></tr>
                    <tr><td>Agricultural field</td><td>Rations</td><td>27 rations per level and per 10 minutes. 1 ground slot per level.</td></tr>
                    <tr><td>Aeroponic farm</td><td>Rations</td><td>37 rations per level and per 10 minutes, but 1 <strong>sky</strong> slot per level (none on the ground). Aeroponics research required. Its production adds to that of the Agricultural field.</td></tr>
                </tbody>
            </table>

            <h2 id="storage">Storage</h2>
            <table>
                <thead>
                    <tr><th>Building</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium warehouse</td><td>+1,200,000 storable niobium per level. Cargo management 1 research.</td></tr>
                    <tr><td>Water reservoir</td><td>+800,000 storable water per level. Cargo management 1 research.</td></tr>
                    <tr><td>Agricultural silo</td><td>+800,000 storable rations per level. Cargo management 1 and Aeroponics researches.</td></tr>
                </tbody>
            </table>
            <p>Without these buildings, a planet stores 200,000 niobium, 180,000 water and 150,000 rations.</p>

            <h2 id="population">Population and science</h2>
            <table>
                <thead>
                    <tr><th>Building</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td>Large city</td><td>+25,000 maximum workers and about +8,000 workers per day, per level. Urban redevelopment 1 research.</td></tr>
                    <tr><td>Metropolis</td><td>+80,000 maximum workers and about +12,000 workers per day, per level. Urban redevelopment 5 research.</td></tr>
                    <tr><td>Research center</td><td>+250 maximum scientists per level. Essential to recruit scientists; not needed to start a research.</td></tr>
                </tbody>
            </table>

            <h2 id="military">Military and ship production</h2>
            <table>
                <thead>
                    <tr><th>Building</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td>Barracks</td><td>+5,000 maximum Legionnaires per level (2,000 without barracks). Military expansion 1 research.</td></tr>
                    <tr><td>Defensive fort</td><td>+15,000 maximum Legionnaires per level, and <strong>protects from raids</strong> 5% of your niobium and water storage capacity (and 5% of your uranium) per level. Required for Mechs. Military expansion 3 research.</td></tr>
                    <tr><td>Nuclear base</td><td>Each level lets you store 1 nuclear bomb and 4 interceptors (Armament 5 research required to build them). Costs 100,000 niobium and 500 uranium per level.</td></tr>
                    <tr><td>Shipyard</td><td>Builds utility ships (cargo, probe, recycler…) and speeds up the production of all ships (+25% per level). Industry 1 research.</td></tr>
                    <tr><td>Weapons factory</td><td>Builds light ships (heavy hunters, corvettes…) and speeds up the production of ships <strong>and defenses</strong> by 40%. Only one level per planet. Light ships 1 research.</td></tr>
                    <tr><td>Heavy industry</td><td>Builds heavy ships (frigates, cruisers, battlecruisers, destroyers) and speeds up the production of ships <strong>and defenses</strong> by 60%. Only one level per planet. Heavy ships 1 research.</td></tr>
                    <tr><td>Prison</td><td>Holds captured heroes. Prison system research.</td></tr>
                    <tr><td>Slave camp</td><td>Per level: +2.5% resource production, +2,500 maximum workers, −1.5% construction time; each prisoner held adds 1% production per prisoner level. Prison system research.</td></tr>
                </tbody>
            </table>

            <h2 id="orbital">Enlarging the planet and orbital defenses</h2>
            <table>
                <thead>
                    <tr><th>Building / Facility</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td>Floating city</td><td>+10 ground slots per level (5 at most per planet). Costs 2,000 War Points × the level. Territorial expansion 1 research.</td></tr>
                    <tr><td>Orbital station</td><td>+5 sky slots per level (5 at most per planet). Costs 2,000 War Points × the level. Territorial expansion 2 research.</td></tr>
                    <tr><td>Space base</td><td>Provides an armor bonus to orbital defenses.</td></tr>
                    <tr><td>Shield / Large shield</td><td>Absorbs damage before the defenses are hit.</td></tr>
                    <tr><td>Turrets (missile, laser, Gauss, plasma…)</td><td>Defend your planet against fleets in attack mode.</td></tr>
                </tbody>
            </table>
            <p>Defenses (turrets, shields) take up no slots.</p>

            <h2 id="detection">Detection and jamming</h2>
            <table>
                <thead>
                    <tr><th>Building</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ground radar</td><td>Detects approaching fleets (+1 radar power per level). System scanner 1 research.</td></tr>
                    <tr><td>Space radar</td><td>Same contribution as a Ground radar (+1 radar power per level), but takes up sky slots instead of ground. System scanner 3 research.</td></tr>
                    <tr><td>Radar jammer</td><td>Jams enemy detection of your movements. System scanner 5 research.</td></tr>
                </tbody>
            </table>

            <h2 id="couts">Building costs</h2>
            <p>The cost and duration of a level are <strong>proportional to the target level</strong>: level N costs N times the base cost and lasts N times the base duration. Example: a level 4 Niobium mine costs 4 × 45 = 180 niobium and 4 × 20 = 80 water, in 4 × 3 = 12 minutes. If a level of the same building is already in the queue, the next one is billed at the following level.</p>
            <p>Base values (level 1). "Room" = ground / sky slots taken per level.</p>

            <h3>Resources and storage</h3>
            <table>
                <thead>
                    <tr><th>Building</th><th>Niobium / water</th><th>Duration</th><th>Room</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium mine</td><td>45 / 20</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Water extractor</td><td>20 / 50</td><td>3 min</td><td>1 / 0</td></tr>
                    <tr><td>Agricultural field</td><td>60 / 90</td><td>5 min</td><td>1 / 0</td></tr>
                    <tr><td>Aeroponic farm</td><td>650 / 100</td><td>5 min 50 s</td><td>0 / 1</td></tr>
                    <tr><td>Niobium warehouse</td><td>11,000 / 6,000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Water reservoir</td><td>8,000 / 9,000</td><td>30 min</td><td>3 / 0</td></tr>
                    <tr><td>Agricultural silo</td><td>12,000 / 20,000</td><td>50 min</td><td>4 / 0</td></tr>
                </tbody>
            </table>

            <h3>Population and science</h3>
            <table>
                <thead>
                    <tr><th>Building</th><th>Niobium / water</th><th>Duration</th><th>Room</th></tr>
                </thead>
                <tbody>
                    <tr><td>Large city</td><td>1,500 / 1,100</td><td>12 min</td><td>6 / 0</td></tr>
                    <tr><td>Metropolis</td><td>7,500 / 5,500</td><td>46 min 40 s</td><td>6 / 6</td></tr>
                    <tr><td>Research center</td><td>285 / 360</td><td>15 min</td><td>5 / 0</td></tr>
                </tbody>
            </table>
            <p>Example: a level 3 Metropolis costs 22,500 niobium and 16,500 water, in 2 h 20 min.</p>

            <h3>Military and ships</h3>
            <table>
                <thead>
                    <tr><th>Building</th><th>Niobium / water</th><th>Duration</th><th>Room</th></tr>
                </thead>
                <tbody>
                    <tr><td>Barracks</td><td>1,300 / 1,900</td><td>35 min</td><td>6 / 0</td></tr>
                    <tr><td>Defensive fort</td><td>20,000 / 19,000</td><td>1 h 12 min</td><td>10 / 0</td></tr>
                    <tr><td>Nuclear base</td><td>100,000 / 0 (+ 500 uranium)</td><td>1 h 12 min</td><td>2 / 0</td></tr>
                    <tr><td>Prison</td><td>3,000 / 3,500</td><td>50 min</td><td>5 / 0</td></tr>
                    <tr><td>Slave camp</td><td>2,000 / 2,500</td><td>40 min</td><td>4 / 0</td></tr>
                    <tr><td>Shipyard</td><td>300 / 200</td><td>3 min</td><td>2 / 1</td></tr>
                    <tr><td>Weapons factory (1 level)</td><td>700 / 390</td><td>36 min</td><td>6 / 0</td></tr>
                    <tr><td>Heavy industry (1 level)</td><td>8,300 / 6,800</td><td>2 h</td><td>12 / 0</td></tr>
                </tbody>
            </table>

            <h3>Detection and enlargement</h3>
            <table>
                <thead>
                    <tr><th>Building</th><th>Cost (niobium / water)</th><th>Duration</th><th>Room</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ground radar</td><td>120 / 65</td><td>3 min 40 s</td><td>2 / 0</td></tr>
                    <tr><td>Space radar</td><td>2,000 / 1,720</td><td>24 min</td><td>0 / 2</td></tr>
                    <tr><td>Radar jammer</td><td>5,100 / 3,210</td><td>54 min</td><td>0 / 4</td></tr>
                    <tr><td>Floating city (5 max)</td><td>2,000 War Points</td><td>24 min</td><td>adds 10 on the ground</td></tr>
                    <tr><td>Orbital station (5 max)</td><td>2,000 War Points</td><td>24 min</td><td>adds 5 in the sky</td></tr>
                </tbody>
            </table>
            <p>The "Building cost" alliance improvement reduces the cost in niobium, water and uranium (−1% per level, up to −5%), and each level of Slave camp reduces the duration by 1.5%. The daily maintenance of each building is detailed in <a href="/wiki/bitcoin_economy#bareme">Bitcoins and maintenance</a>.</p>

            <h2 id="file-production">Managing the production queue</h2>
            <p>Constructions of buildings, ships (Shipyard) and defenses go through a <strong>queue</strong> that you can manage:</p>
            <ul>
                <li><strong>Reorder</strong> the pending items (drag and drop) to prioritize what matters.</li>
                <li><strong>Cancel</strong> a pending item: you are <strong>refunded in proportion</strong> to what hasn't been produced yet (a pending building is refunded in full).</li>
                <li>A building's cost is debited as soon as it is added to the queue.</li>
                <li>The current queue is shown at the top of each production page, under the title.</li>
                <li>The queue is limited to <strong>15 pending items</strong> (not counting the construction in progress): beyond that, a message tells you to wait for a construction to finish or to cancel one before adding a new one.</li>
                <li>The <strong>Floating city</strong> (+10&nbsp;ground/level) and the <strong>Orbital station</strong> (+5&nbsp;sky/level) are capped at <strong>5 each per planet</strong>.</li>
            </ul>

    research:
        title: "Research and technologies"
        category: "economy"
        order: 3
        tags: "research,technology,science,bitcoin,unlock,tech tree,terraforming,cost"
        summary: "The technologies that unlock ships, bonuses and new capabilities. How to prioritize."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="how">How it works</h2>
            <p>Research is started from the <strong>Research</strong> page (no building is needed). Each research:</p>
            <ul>
                <li>costs <strong>Bitcoins</strong> (only Territorial expansion is paid in War Points): level N costs N times the base cost;</li>
                <li>takes <strong>time</strong>, also proportional to the level: from a few minutes to more than a day;</li>
                <li>may have a <strong>prerequisite</strong> (another research at a certain level).</li>
            </ul>
            <p>Example: Terraforming level 2 costs 2 × 12,000 = 24,000 Bitcoins and lasts 2 × 1 h 10 min = 2 h 20 min at base speed. The "Research cost" alliance improvement reduces the price by 1% per level (up to −5%).</p>
            <p>You can schedule several researches in a row: the cost is debited when added to the queue, and fully refunded if you cancel.</p>
            <p>The duration of a research is fixed <strong>at the moment you start it or queue it</strong>: base duration × level ÷ your <strong>research speed</strong> (1 at the start). What makes this speed vary (scientists, "Scientific mobilization" alliance research) is explained in <a href="/wiki/workers_scientists">Workers and scientists</a>. The "Research speed" alliance improvement shortens the duration displayed on the Research page, but not the real duration: once started, the research finishes at the time calculated without it.</p>

            <h2 id="beginner-priority">Priorities for a beginner</h2>
            <ol>
                <li><strong>Utility ships</strong> — opens Terraforming (level 1), Cargo management (level 2), Planetary invasion and Orbital recycling (level 3).</li>
                <li><strong>Terraforming</strong> — the colonization ship and one more planet per level.</li>
                <li><strong>Cargo management</strong> — cargo ships and storage buildings.</li>
                <li><strong>Urban redevelopment</strong> — Large city then Metropolis: more workers, so more Bitcoins.</li>
                <li><strong>Industry</strong> — to upgrade the Shipyard and open light ships (level 3) and heavy ships (level 5).</li>
                <li><strong>Planetary invasion</strong> and <strong>Orbital recycling</strong> — essential to invade and recycle.</li>
                <li><strong>Armament</strong> then <strong>Missile weapon</strong> — your first combat ships (Hunter).</li>
            </ol>

            <h2 id="researches">Complete list of researches</h2>
            <p>Researches are arranged as on the Research page. Cost and duration are given for level 1, at base speed: level N costs and lasts N times more. The maximum level is shown in parentheses.</p>

            <h3>Exploration</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>What it provides</th><th>Prerequisite</th><th>Level 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Utility ships (3)</td><td>Lvl 1: Terraforming. Lvl 2: Cargo management. Lvl 3: Planetary invasion, Orbital recycling and Mother ship.</td><td>—</td><td>2,500; 3 min 20 s</td></tr>
                    <tr><td>Terraforming (18)</td><td><strong>+1 ownable planet per level</strong> (2 + level in total, plus political regime bonuses). Lvl 1: colonization ship. Lvl 15: Lunar.</td><td>Utility ships 1</td><td>12,000; 1 h 10 min</td></tr>
                    <tr><td>Cargo management (5)</td><td>Cargo I (lvl 1), Cargo V (lvl 3), Cargo X (lvl 5). Lvl 1: Niobium warehouse, Water reservoir, Agricultural silo (with Aeroponics).</td><td>Utility ships 2</td><td>3,500; 6 min 40 s</td></tr>
                    <tr><td>Planetary invasion (1)</td><td>Invasion barge.</td><td>Utility ships 3</td><td>35,000; 4 min 40 s</td></tr>
                    <tr><td>Orbital recycling (1)</td><td>Recycler.</td><td>Utility ships 3</td><td>16,900; 6 min 40 s</td></tr>
                    <tr><td>System scanner (5)</td><td>Ground radar (lvl 1), Space radar and radar ship (lvl 3), Radar jammer and jammer ship (lvl 5).</td><td>—</td><td>2,300; 5 min</td></tr>
                    <tr><td>Espionage (999)</td><td>A probe only brings back information if your Espionage level is at least equal to that of the owner of the probed planet.</td><td>System scanner 5</td><td>20,000; 1 h</td></tr>
                    <tr><td>Hyperspace technology (1)</td><td>Travel to other galaxies.</td><td>—</td><td>25,000,000; 25 h</td></tr>
                </tbody>
            </table>

            <h3>Planetary</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>What it provides</th><th>Prerequisite</th><th>Level 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Aeroponics (1)</td><td>Aeroponic farm; Agricultural silo (with Cargo management 1).</td><td>—</td><td>16,000; 8 min</td></tr>
                    <tr><td>Urban redevelopment (5)</td><td>Large city (lvl 1), Metropolis (lvl 5).</td><td>—</td><td>8,000; 8 min</td></tr>
                    <tr><td>Military expansion (3)</td><td>Barracks (lvl 1), Defensive fort (lvl 3).</td><td>Urban redevelopment 1</td><td>11,700; 15 min 30 s</td></tr>
                    <tr><td>Barbed wire (5)</td><td>+5% power for your Legionnaires in ground defense, per level.</td><td>Military expansion 3</td><td>200,000; 20 min</td></tr>
                    <tr><td>Prison system (1)</td><td>Prison and Slave camp.</td><td>Barbed wire 5</td><td>350,000; 1 h</td></tr>
                    <tr><td>Armored units (1)</td><td>Mechs.</td><td>Military expansion 3</td><td>40,000; 33 min 20 s</td></tr>
                    <tr><td>Territorial expansion (2)</td><td>Floating city (lvl 1), Orbital station (lvl 2): extra room on your planets.</td><td>Terraforming 18</td><td>75,000 War Points; 1 h 40 min</td></tr>
                </tbody>
            </table>

            <h3>Weapons</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>What it provides</th><th>Prerequisite</th><th>Level 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Armament (5)</td><td>Missile weapon (lvl 1), Laser weapon (lvl 3), Plasma weapon (lvl 5). Level 5 is also required for nuclear bombs and interceptors.</td><td>—</td><td>2,000; 6 min 10 s</td></tr>
                    <tr><td>Missile weapon (3)</td><td>Hunter (lvl 1), Heavy hunter (lvl 2); level 3 is required by all larger combat ships.</td><td>Armament 1</td><td>2,600; 7 min 30 s</td></tr>
                    <tr><td>Laser weapon (3)</td><td>Frigate and Laser corvette (lvl 1); higher levels required by cruisers, battlecruisers and destroyers.</td><td>Armament 3</td><td>13,000; 30 min</td></tr>
                    <tr><td>Plasma weapon (3)</td><td>Plasma frigate (lvl 1), Cruiser (lvl 2), Battlecruiser and Destroyer (lvl 3).</td><td>Armament 5</td><td>29,000; 1 h 18 min</td></tr>
                </tbody>
            </table>

            <h3>Space</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>What it provides</th><th>Prerequisite</th><th>Level 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Industry (5)</td><td>Shipyard and Hunter (lvl 1), Light ships (lvl 3), Heavy ships (lvl 5).</td><td>—</td><td>1,500; 2 min 30 s</td></tr>
                    <tr><td>Light ships (3)</td><td>Weapons factory (lvl 1), Corvette (lvl 2), Laser corvette (lvl 3).</td><td>Industry 3</td><td>9,000; 14 min 20 s</td></tr>
                    <tr><td>Heavy ships (3)</td><td>Heavy industry (lvl 1), Battlecruiser (lvl 2), Destroyer (lvl 3).</td><td>Industry 5</td><td>42,000; 20 min</td></tr>
                </tbody>
            </table>
            <p>Ships also require their building (Shipyard, Weapons factory or Heavy industry): see <a href="/wiki/ship_types">Ship types</a>.</p>

            <h3>Political</h3>
            <p>As a member of an alliance, you also gain access to 7 <strong>political researches</strong> that depend on your alliance's regime and its level — for example "Macron law" (production) or "Scientific mobilization" (research speed) for the Balance of Worlds. They are paid with your own Bitcoins: see <a href="/wiki/alliance_research">Alliance researches</a>.</p>

            <h2 id="max-modes">Server modes with maximum research</h2>
            <p>In some modes (Battle Royale, Domination, Search &amp; Destroy), all your individual researches start at the <strong>maximum level</strong> and your starting planet receives 500 uranium. All that's left to do is your alliance's political researches.</p>

    workers_scientists:
        title: "Workers and scientists"
        category: "economy"
        order: 4
        tags: "workers,scientists,population,bitcoin,income,famine,defense,research speed"
        summary: "The two populations of your empire: workers who bring in Bitcoins, scientists who raise research speed."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="workers">Workers</h2>
            <p>Workers are your <strong>main source of Bitcoins</strong>. At the daily report, each worker present on your planets earns <strong>0.5 Bitcoin</strong>: 10,000 workers = 5,000 Bitcoins per day, before alliance and peace taxes. Workers on board a fleet earn nothing. They cost no maintenance in Bitcoins, only food.</p>
            <p>Their <strong>maximum number</strong> depends on your buildings:</p>
            <ul>
                <li><strong>Large city</strong>: +25,000 max workers and about +8,000 workers per day, per level.</li>
                <li><strong>Metropolis</strong>: +80,000 max workers and about +12,000 workers per day, per level.</li>
                <li><strong>Slave camp</strong>: +2,500 max workers per level.</li>
            </ul>
            <p>Your starting planet begins at the cap (50,000 workers out of a 50,000 maximum): build a Large city to keep growing.</p>
            <p>The population <strong>grows on its own</strong> up to the cap, at the rate given by your Large cities and Metropolises (+20% per level of the "Family policy" alliance research, half as fast under embargo). Food doesn't make it grow, but if your rations drop to zero, famine kills part of your workers.</p>

            <h2 id="scientists">Scientists</h2>
            <p>To recruit scientists (<strong>Defense</strong> page), you need a <strong>Research center</strong> on the planet: each level houses 250 scientists. Each costs <strong>25 Bitcoins and 10 workers</strong> to recruit, then <strong>3 Bitcoins per day</strong> in maintenance (30 times a Legionnaire on the ground). The "Scientific enthusiasm" alliance research reduces this maintenance.</p>
            <p>Scientists are used to increase your <strong>research speed</strong>. It's 1 at the start, and the duration of a research is divided by this speed (speed 2 = researches twice as fast). How it evolves:</p>
            <ul>
                <li>It progresses in <strong>whole steps</strong>. Scientists arrive as their training completes, and an arrival only gains a step if it counts <strong>at least 5,000 scientists at once</strong>. Smaller arrivals don't change the speed: in practice, recruiting a few hundred scientists doesn't shorten your research.</li>
                <li>The "Scientific mobilization" alliance research (Balance of Worlds) adds 0.1 speed per level; but the next arrival of scientists rounds the speed to the nearest whole number.</li>
                <li>The duration of a research is fixed when it starts: a speed gain only benefits researches started afterwards.</li>
            </ul>

            <h2 id="defense">Defensive role</h2>
            <p>Your <strong>workers take part in ground defense</strong> — but only during an <strong>invasion</strong> (when the enemy wants to take your planet). During a regular <strong>raid</strong> (simple plunder), they stay hidden.</p>
            <p>The "Ideological reinforcement" alliance research (Silent Rampart) increases their defense by 20% per level.</p>

            <h2 id="manage">Managing your population well</h2>
            <ul>
                <li>Your workers eat <strong>1 ration per hour for 500 workers</strong> (50,000 workers = 100 rations per hour; a level 1 Agricultural field produces 162).</li>
                <li>If the granary is empty, the rations loaded in your own fleets in orbit of the planet are consumed automatically.</li>
                <li>After that, it's famine: your workers die (0.5% per 10-minute cycle at first, up to 2% if it lasts more than 8 hours), then your Legionnaires and your Mechs. Famine never brings a planet below 5,000 workers.</li>
                <li>Keep your Agricultural silos full, especially when facing an embargo (see <a href="/wiki/embargo">Embargo and famine</a>).</li>
            </ul>

            <h2 id="reserve-5000">The untouchable reserve of 5,000 workers</h2>
            <p>Your own actions can <strong>never bring a planet below 5,000 workers</strong>: any action that would take it below is blocked with a clear message. Famine also stops at this threshold; only an enemy invasion can kill workers beyond it. This covers:</p>
            <ul>
                <li><strong>Defense recruitment</strong> (Legionnaires, Mechs, scientists) that consumes workers.</li>
                <li><strong>Ship construction</strong> at the Shipyard.</li>
                <li><strong>Loading workers into a cargo ship</strong> for a transfer.</li>
            </ul>
            <p>The "MAX" button on production pages takes this reserve into account: it will never offer you a maximum that would empty your planet below the threshold.</p>
            <p>Note: a new colony starts with 2,500 workers. You'll only be able to spend workers there once the 5,000 are exceeded.</p>

    market:
        title: "Market and traders"
        category: "economy"
        order: 5
        tags: "market,traders,sale,trade,cargo,bitcoin,price,war points"
        summary: "Sell resources and troops to traders for Bitcoins, by delivering yourself or in one click, and exchange your War Points."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="traders">Who are the traders?</h2>
            <p><strong>Non-player characters</strong> (NPCs) settled on fixed trading planets: 20 per galaxy, in the same sectors in every galaxy (the four corners, the center and some intermediate positions). Their position is visible on the map.</p>
            <p>They buy your <strong>niobium</strong>, your <strong>water</strong> and your <strong>uranium</strong> for Bitcoins, but also <strong>workers</strong>, <strong>Legionnaires</strong>, <strong>scientists</strong> and <strong>Mechs</strong>. They don't buy rations.</p>

            <h2 id="sell">How to sell to them</h2>
            <ol>
                <li>Load a fleet (a <strong>cargo ship</strong>, preferably) with what you want to sell.</li>
                <li>Send it to the trader on an <strong>"Unload and return"</strong> mission. Fuel is paid in Bitcoins: this mission costs double on the way out, then the return is billed at the normal rate when the fleet departs again.</li>
                <li>On arrival, the whole sellable cargo is sold: you receive Bitcoins and a few War Points. Rations stay on board.</li>
                <li>The fleet automatically returns home.</li>
            </ol>
            <p>If a Cthulhu horde blockades a trader, it refuses all sales for as long as the blockade holds.</p>

            <h2 id="vente-clic">One-click selling, without a fleet</h2>
            <p><strong>Planets</strong> page, <strong>Sell to merchants</strong> tab: add the planets of your choice to the list ("Add" menu), then click <strong>Sell to merchants</strong>. All the niobium and all the water on those planets is sold at once, with no cargo ship or fuel, but <strong>20% cheaper</strong> than delivering it yourself (0.10 Bitcoin per niobium, 0.25 per water) and with no War Points. A planet under attack or under embargo is skipped.</p>

            <h2 id="immunity">Traders are untouchable</h2>
            <p>Traders are <strong>immune to any attack</strong>. You can't raid them, invade them or fight them. Their fleets never take part in a battle, even if they are at the same point as a clash.</p>
            <p>Be careful though: on servers with PvE, an <strong>alien horde in attack mode</strong> can be stationed in orbit of a trader (each trader gets one when the galaxy is created, stronger toward the center). An unarmed cargo ship arriving in that orbit is attacked and destroyed without selling anything. Before sending your cargo ships, make sure no horde is guarding that trader, or use one-click selling.</p>

            <h2 id="gain">How much does it bring in?</h2>
            <p>Base price per unit, when delivering yourself:</p>
            <table>
                <thead>
                    <tr><th>Goods</th><th>Bitcoins per unit</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium</td><td>0.125 (1,000 niobium = 125)</td></tr>
                    <tr><td>Water</td><td>0.3125 (1,000 water = 312)</td></tr>
                    <tr><td>Uranium</td><td>2,000</td></tr>
                </tbody>
            </table>
            <p>Troops and workers on board are bought too; the amount of each sale appears in the "Merchant Sale" report. Water brings in 2.5 times more than niobium. The "Trade agreements" alliance research (Balance of Worlds) adds 5% per level, up to +25%, and an Economy hero of level 10 ("Trader" trait) adds 15% to the sales it accompanies: those of its fleet, or those of its planet in one-click selling. The Sell to merchants tab of the Planets page shows your actual prices.</p>

            <h2 id="tip">Tip</h2>
            <p>Rather than letting your stocks fill up, sell regularly: send a well-filled cargo ship (fuel is paid in Bitcoins, so one big load beats several small ones) or use one-click selling to fund your research or your army.</p>

            <h2 id="points-de-guerre">Exchanging your War Points</h2>
            <p>The <strong>Objectives</strong> page, which lists your quests of the day, also lets you spend your War Points: <strong>1 WP = 1 Bitcoin</strong>, <strong>2 Legionnaires</strong> or <strong>10 workers</strong>, delivered to the planet of your choice within its caps.</p>

    recycling:
        title: "Recycling"
        category: "economy"
        order: 6
        tags: "recycling,debris,df,recycler,asteroid,uranium"
        summary: "After every battle, debris lies around. Collecting it is an open-pit mine."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principle">Debris: what is it?</h2>
            <p>Every ship destroyed in battle leaves part of its cost as <strong>debris</strong> floating in space. This is called a <strong>DF</strong> (Debris Field).</p>
            <p>A field left by a battle contains <strong>niobium</strong> and <strong>water</strong>, never uranium. It stays at the location of the clash, wherever that was (planet, empty slot…), where an icon marks it on the map.</p>
            <p>There are also <strong>asteroid fields</strong> that appear on their own on the map. There are three kinds: niobium, water or <strong>uranium</strong>. They refill every 7 to 40 hours and sometimes change place:</p>
            <ul>
                <li>niobium: 40,000 to 800,000 per refill;</li>
                <li>water: 30,000 to 500,000 per refill;</li>
                <li>uranium: 50 to 180 per refill.</li>
            </ul>
            <p>They are often guarded by an alien fleet that attacks anyone arriving.</p>

            <h2 id="howmuch">How much debris?</h2>
            <p>A field contains <strong>40% of the construction cost of the ships actually destroyed</strong>, on both sides. Each ship returns its own resources: a Destroyer (2,100 niobium, 6,000 water) mostly leaves water. Survivors leave nothing.</p>
            <p>Three special cases:</p>
            <ul>
                <li>Against <strong>Cthulhu</strong> hordes, the rate drops to <strong>20%</strong>.</li>
                <li>The <strong>cargo</strong> (niobium and water) of a fleet that is entirely destroyed also spills into the field, at 40%. A battered winner, on the other hand, keeps its whole hold.</li>
                <li>Ships paid for with <strong>war points</strong> (Plasma hunter, Combat corvette, Battleship, Caravel) leave <strong>no</strong> debris, because they cost neither niobium nor water. Razed <strong>planetary defenses</strong> never leave any either.</li>
            </ul>
            <p>An <strong>orbital battle</strong> (a fleet shot down by the turrets of a planet in attack mode, or ships lost forcing a defended orbit) leaves a field under the same rule.</p>

            <h2 id="how">How to recycle</h2>
            <ol>
                <li>Research <strong>Orbital recycling</strong> (<em>Research</em> page, requires <em>Utility ships</em> level 3).</li>
                <li>Build <strong>recyclers</strong> at your Shipyard (2,200 niobium, 1,000 water and 10 workers each).</li>
                <li>Create a fleet with your recyclers, and cargo ships for the hold (see below).</li>
                <li>Send it to the field's coordinates on a <strong>Normal</strong> mission. On the <em>Spatial map</em>: click the position, then <em>Interaction</em>, choose the fleet and the <em>Normal</em> mission, then <em>Send</em>. There is no special recycling mission.</li>
                <li>On arrival, recycling starts on its own: a first pickup right away, then one every <strong>5 minutes</strong>.</li>
                <li>When the hold is full or the field is empty, recycling stops and you receive the "Your fleet has stopped recycling!" report. <strong>The fleet stays on site</strong>: it's up to you to bring it back. The fleet's <em>Recycle</em> button restarts recycling if it has room left.</li>
            </ol>
            <p>A fleet waiting on an asteroid field resumes recycling on its own at each refill of the field, as long as it has room left.</p>

            <h2 id="capacity">How much can a recycler bring back?</h2>
            <p>On each pass, each recycler picks up <strong>1,000 resources</strong>, split equally among the resources present in the field (niobium, water, uranium).</p>
            <p><strong>Warning: a recycler has only 1,000 of hold.</strong> Alone, it is therefore full after the very first pass. To empty a big field, add cargo ships to the fleet: their hold fills at the pace of your recyclers.</p>
            <table>
                <thead>
                    <tr><th>Ship</th><th>Hold</th></tr>
                </thead>
                <tbody>
                    <tr><td>Recycler</td><td>1,000</td></tr>
                    <tr><td>Cargo I</td><td>3,000</td></tr>
                    <tr><td>Cargo V</td><td>10,000</td></tr>
                    <tr><td>Cargo X</td><td>25,000</td></tr>
                    <tr><td>Caravel</td><td>40,000</td></tr>
                </tbody>
            </table>
            <p>The <strong>Improved cargos</strong> alliance research enlarges the hold of cargo ships and the Caravel.</p>
            <p>Examples:</p>
            <ul>
                <li>5 recyclers alone: 5,000 resources picked up on arrival, then the fleet is full.</li>
                <li>1 recycler + 2 Cargo I (7,000 of hold): 1,000 per pass, i.e. 5,000 resources in 20 minutes (on arrival, then at 5, 10, 15 and 20 minutes).</li>
                <li>10 recyclers + 5 Cargo V (60,000 of hold): 10,000 per pass, fleet full at the 6th pass, i.e. in about 25 minutes.</li>
            </ul>
            <p>The <strong>Recycling optimization</strong> alliance research (<em>The Silent Rampart</em> regime) adds 400 resources per recycler per pass at each level, up to 3,000 at level 5. It doesn't enlarge the recyclers' hold: plan cargo ships to take advantage of it.</p>

            <h2 id="strategy">Strategy</h2>
            <ul>
                <li>After each battle, send recyclers immediately: otherwise, your opponents will get the debris.</li>
                <li>Protect them: a lone recycler is an easy target, and asteroid fields are often guarded.</li>
                <li>Battles never leave uranium: recycle the <strong>uranium asteroid fields</strong> (50 to 180 units per refill), or liberate alien bases.</li>
                <li>Recycling is very profitable: think of it as a second economy behind your mines.</li>
            </ul>

    daily_report:
        title: "The daily report"
        category: "economy"
        order: 7
        tags: "report,daily,balance,income,costs,tax"
        summary: "Every day at 18:59 (Paris time), the game does your balance: income, costs, taxes. Keep a close eye on it."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="when">When it lands</h2>
            <p>Every day at <strong>18:59 (Paris time)</strong>, i.e. 17:59 UTC in winter and 16:59 UTC in summer. It's a fixed appointment for all the players on the server.</p>
            <p>You receive an "Empire Report" on the <strong>Report</strong> page, <strong>Economic</strong> tab.</p>

            <h2 id="contents">What the report contains</h2>
            <ul>
                <li><strong>Income</strong> — 0.5 Bitcoin per worker present on your planets at the time of the report.</li>
                <li><strong>Maintenance costs</strong> — Legionnaires, Mechs, scientists, ships, buildings. Everything in a fleet, even stationed in orbit, costs far more than what's on the ground (scale in <a href="/wiki/bitcoin_economy#bareme">Bitcoins and maintenance</a>).</li>
                <li><strong>Peace tax</strong> — if your alliance signed a peace in which it must pay a tax to the other alliance: this percentage is taken from your workers' income.</li>
                <li><strong>Alliance tax</strong> — taken from your workers' income and paid into your alliance's treasury. With a rate of t%, the share taken is income × t ÷ (100 + t): a 10% rate takes about 9% of your income.</li>
                <li><strong>Final balance</strong> — income − taxes − costs, added to your balance.</li>
                <li><strong>Cthulhu threat</strong> — if the Cthulhus are active for you, the threat hanging over your empire goes up by 5 points (300 at most).</li>
            </ul>

            <h2 id="quests">Daily quests</h2>
            <p>The daily report <strong>renews your 3 quests</strong> of the day: yesterday's quests that you haven't finished disappear. If you had completed all of them, it also pays you a bonus equal to their average reward. Find them on the <strong>Objectives</strong> page (see <a href="/wiki/quests">Daily quests</a>).</p>

            <h2 id="danger">The danger to watch for</h2>
            <p>If your balance falls <strong>negative</strong> after the report, it's an <strong>Economic Game Over</strong>: all your fleets and all the ships on the ground on your planets are lost, and your balance is reset to 125,000 Bitcoins (your planets, buildings and research stay as they are). A "Bankruptcy imminent" report warns you in advance, at most once a day.</p>
            <p>Check your report every day. If your costs climb too high: put idle fleets on the ground (their maintenance is divided by 6), slow down recruitment, sell troops or resources to traders.</p>

    exchange:
        title: "Exchanges between players"
        category: "economy"
        order: 8
        tags: "exchange,alliance,resources,bitcoin,gift,deposit,uranium,unloading"
        summary: "How to send resources to another player or Bitcoins to an ally, and the limits of it."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principle">The principle</h2>
            <p>Area Universe lets you send resources to <strong>any player</strong> by fleet, and Bitcoins to the members of your alliance through the treasury. It's very useful for:</p>
            <ul>
                <li>Getting an ally back on their feet after they've just been plundered.</li>
                <li>Pooling an expensive construction effort.</li>
                <li>Resupplying an alliance member under embargo.</li>
            </ul>

            <h2 id="resources">Sending physical resources</h2>
            <p>Load what you want to deliver into a fleet's hold: niobium, water, rations, uranium, but also workers, Legionnaires, scientists or Mechs. Then send it on an <strong>"Unload and return"</strong> mission to the recipient's planet.</p>
            <p>On arrival, everything is deposited within the planet's capacities (storage, caps on Legionnaires, workers and scientists, 500 Mechs at most); the surplus stays on board. The fleet returns on its own and the recipient receives a deposit report.</p>

            <h2 id="bitcoins">Sending Bitcoins</h2>
            <p>Bitcoins are transferred through the <strong>alliance treasury</strong> (see <a href="/wiki/alliance_treasury">Alliance treasury</a>): you deposit there, then the member to help requests a withdrawal in their name. The withdrawal is immediate for a member who has the "Edit" permission (and for everyone in a Silent Rampart alliance); otherwise, it waits for the approval of a member who has that permission.</p>

            <h2 id="limits">The limits</h2>
            <ul>
                <li>There is <strong>no daily limit</strong> or sending cap: only the hold capacity of your fleets counts (Cargo I: 3,000 spaces, Cargo V: 10,000, Cargo X: 25,000, 1 space per unit and 500 per Mech) and the storage capacity of the destination planet.</li>
                <li>Resources must travel by fleet: it takes time and fuel, paid in Bitcoins. An "Unload and return" mission costs double on the way out, then the return is billed at the normal rate when the fleet departs again.</li>
                <li>A planet under <strong>embargo</strong> can only receive deliveries from its owner or from a member of the same alliance.</li>
                <li>Uranium is carried like everything else, and the planet that receives it has no uranium storage limit.</li>
            </ul>

    fleet_creation:
        title: "Create and send a fleet"
        category: "fleet"
        order: 1
        tags: "fleet,creation,ships,composition,shipyard,mission"
        summary: "From building the ship to its arrival at destination: the complete journey."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequisites">What you need</h2>
            <ul>
                <li>A <strong>Shipyard</strong> on your active planet.</li>
                <li>The ship's resources: niobium, water and workers most often, sometimes War Points, Bitcoins or Legionnaires (table in <em>Ship types</em>).</li>
                <li>The researches required for the ship you want (e.g. <em>Cargo management</em> for cargo ships).</li>
            </ul>

            <h2 id="build">Step 1 — Build the ships</h2>
            <p>From the <strong>Space shipyard</strong> page (<strong>Ship construction</strong> tab), choose a model and a quantity, then click <strong>Build</strong>. Production happens in the background; each ship has a base duration, shortened by the planet's space production.</p>

            <h2 id="compose">Step 2 — Assemble the fleet</h2>
            <p>Once the ships are delivered, go to the <strong>Fleets</strong> page and click <strong>Create a new fleet</strong>: choose the ships that go on board and a name (12 characters at most). Then open the fleet (click its name) to:</p>
            <ul>
                <li>Add or remove ships (<strong>Ships</strong> tab, <strong>Manage</strong> button), when the fleet is on one of your planets.</li>
                <li>Load <strong>resources</strong> (<strong>Cargo</strong> tab), when the fleet is on one of your planets.</li>
                <li>Take <strong>Legionnaires</strong> or Mechs on board (<strong>Cargo</strong> tab) for a raid or an invasion: each Legionnaire takes 1 hold space, each Mech 500, and the barges are what land them.</li>
            </ul>

            <h2 id="send">Step 3 — Send the fleet</h2>
            <ol>
                <li>Choose the <strong>destination</strong>: in the <strong>Move the fleet</strong> tab (galaxy, system and planet fields, in the <code>Galaxy:Sector:Position</code> format, or the "My planets" list), or by clicking the square from the <strong>Spatial map</strong>, then <strong>Interaction</strong>.</li>
                <li>Choose a <strong>mission type</strong> (Normal, Unload and return, Probe, Colonize, Raid, Invade… see <em>Mission types</em>). The <strong>Move the fleet</strong> tab is for simple moves (Normal) and espionage; the other missions are sent from the Spatial map.</li>
                <li>In the <strong>Move the fleet</strong> tab, check the estimated fuel cost (in <strong>Bitcoins</strong>) and duration.</li>
                <li>Click <strong>Send</strong>.</li>
            </ol>
            <p>The fleet appears in your list of fleets in flight. During the <strong>first 2 minutes</strong>, a ✕ button with a countdown (or the <strong>Cancel</strong> line on its page) lets you <strong>cancel the dispatch</strong>: the fleet immediately returns to its departure planet, but the fuel paid is not refunded. After that, it goes all the way.</p>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>A <strong>recycler</strong> in an attack fleet picks up the debris as soon as the battle ends, but it slows the fleet down: the fleet moves at its speed, three times slower than a hunter's. For a quick strike, send the recyclers separately, once the battle is over.</li>
                <li>Never send all your defense at once: keep enough to hold your planet.</li>
                <li>Only the <strong>Unload and return</strong> mission brings the fleet back on its own, and that return is paid in Bitcoins like a normal trip. After any other mission, the fleet stays in orbit at its destination: bringing it back is a new dispatch, with its own fuel.</li>
            </ul>

    ship_types:
        title: "Ship types"
        category: "fleet"
        order: 2
        tags: "ships,hunter,corvette,frigate,battlecruiser,cruiser,destroyer,cargo,probe,lunar,caravel,recycler,cost,speed,prerequisites"
        summary: "All the ships in the game: role, cost, speed, hold, prerequisites and combat characteristics."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utility">Utility ships</h2>
            <p>They have no weapons. They're used to transport, explore, recycle, colonize.</p>
            <table>
                <tr><th>Ship</th><th>Role</th><th>Capacity</th></tr>
                <tr><td>Probe</td><td>Spy on a planet.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Light transport.</td><td>3,000</td></tr>
                <tr><td>Cargo V</td><td>Medium transport.</td><td>10,000</td></tr>
                <tr><td>Cargo X</td><td>Heavy transport.</td><td>25,000</td></tr>
                <tr><td>Caravel</td><td>Premium cargo: the largest and fastest of the cargo ships. Paid in War Points (25) + 15&nbsp;workers per unit produced.</td><td>40,000</td></tr>
                <tr><td>Colonizer</td><td>Found a colony on an uninhabited planet.</td><td>—</td></tr>
                <tr><td>Recycler</td><td>Collect battle debris: 1,000 per 5-min cycle (more with the <em>Recycling optimization</em> alliance research). Its own hold only holds 1,000: add cargo ships to the fleet to pick up more.</td><td>1,000</td></tr>
                <tr><td>Invasion barge</td><td>Carry Legionnaires for a raid or an invasion.</td><td>1,000 Legionnaires</td></tr>
                <tr><td>Lunar (sometimes called Moon Maker)</td><td>Create a moon on an empty square holding enough debris (at least 2M niobium and 2M water).</td><td>—</td></tr>
                <tr><td>Radar ship</td><td>Deploys on an empty square and installs a radar (power 1) there for 2&nbsp;h: you then see that sector.</td><td>—</td></tr>
                <tr><td>Jammer ship</td><td>Deploys on an empty square and installs a jammer (power 1) there for 1&nbsp;h.</td><td>—</td></tr>
                <tr><td>Mother ship</td><td>Flagship, only one per commander. In battle, it gives its fleet 20,000 hull and 5,000 shield, then +5% hull and shield and +10% accuracy. It cuts its fleet's flight time by 10% and reduces its signature by 10%, but itself flies at 250 lumens, slower than a hunter.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Combat ships</h2>
            <p>Combat ships are distinguished by their hull, shield and weapons (missile, laser, plasma). In battle, the power of your whole fleet adds up: there is no range, and no bonus of one ship type against another. Two rules matter:</p>
            <ul>
                <li>the three hunters have <strong>no shield</strong> and take the damage first: they protect the big ships;</li>
                <li><strong>laser</strong> and especially <strong>plasma</strong> get through enemy shields better than missile.</li>
            </ul>
            <p>Base values per ship, before your upgrades (<em>Ship customization</em> article). The "Weapons" column gives missile / laser / plasma; "—": the ship doesn't have that characteristic.</p>
            <h3>Hunters and corvettes</h3>
            <table>
                <tr><th>Ship</th><th>Hull</th><th>Shield</th><th>Weapons</th><th>Points</th></tr>
                <tr><td>Hunter</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Heavy hunter</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Plasma hunter</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Corvette</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Laser corvette</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Combat corvette</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Frigates and heavy ships</h3>
            <table>
                <tr><th>Ship</th><th>Hull</th><th>Shield</th><th>Weapons</th><th>Points</th></tr>
                <tr><td>Frigate</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Plasma frigate</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Battleship</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Cruiser</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Battlecruiser</td><td>1,250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Destroyer</td><td>2,600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>"Points": the model's upgrade point credit. The <strong>Plasma hunter</strong> and the <strong>Battleship</strong> have <strong>no weapons at all</strong> at the start: their weapons come entirely from the points you assign to them.</p>

            <h2 id="factions">The +20% bonus: alliance policy</h2>
            <p>There is no ship "faction". The only +20% bonus in space combat comes from your <strong>alliance's policy</strong>: the Balance of Worlds beats the Silent Rampart, which beats the Hammer of Stars, which beats the Balance of Worlds.</p>
            <p>When the <strong>attacker's</strong> policy beats the defender's, all its weapons (missile, laser, plasma) gain +20% for that battle; the defender never benefits from it. A player without an alliance has neither bonus nor penalty.</p>

            <h2 id="cargo-bonus">Carrying capacity</h2>
            <p>The capacity of cargo ships (Cargo I, V, X and Caravel) increases by <strong>+20% per level</strong> of the <strong>Improved cargos</strong> alliance research (5 levels, alliance of level 3 at least). At level 5, a Cargo I carries 6,000 instead of 3,000. The holds of other ships don't change.</p>

            <h2 id="reference">Reference table</h2>
            <h3>Cost and production</h3>
            <p>Cost of a ship. The duration is the base production time of one unit, shortened by your planet's space production.</p>
            <table>
                <tr><th>Ship</th><th>Cost</th><th>Duration</th></tr>
                <tr><td>Probe</td><td>1,000 niobium</td><td>20 s</td></tr>
                <tr><td>Cargo I</td><td>800 niobium, 650 water, 10 workers</td><td>30 s</td></tr>
                <tr><td>Cargo V</td><td>2,200 niobium, 1,500 water, 20 workers</td><td>1 min</td></tr>
                <tr><td>Cargo X</td><td>4,500 niobium, 3,800 water, 25 workers</td><td>1 min 30 s</td></tr>
                <tr><td>Caravel</td><td>25 War Points, 15 workers</td><td>2 min</td></tr>
                <tr><td>Recycler</td><td>2,200 niobium, 1,000 water, 10 workers</td><td>1 min</td></tr>
                <tr><td>Colonizer</td><td>5,500 niobium, 7,000 water, 2,000 workers, 5 Legionnaires</td><td>1 h</td></tr>
                <tr><td>Invasion barge</td><td>5,000 niobium, 3,500 water, 10 workers</td><td>1 min</td></tr>
                <tr><td>Radar ship</td><td>500 niobium, 600 water, 2,500 Bitcoins</td><td>5 min</td></tr>
                <tr><td>Jammer ship</td><td>1,100 niobium, 1,300 water, 5,500 Bitcoins</td><td>10 min</td></tr>
                <tr><td>Lunar</td><td>50,000 niobium, 23,000 water, 20,000 workers, 200,000 Bitcoins</td><td>5 h</td></tr>
                <tr><td>Mother ship</td><td>17,500 niobium, 9,500 water, 2,000 workers, 25,000 War Points</td><td>3 h 53 min</td></tr>
                <tr><td>Hunter</td><td>25 niobium, 5 water, 1 worker</td><td>1 s</td></tr>
                <tr><td>Heavy hunter</td><td>35 niobium, 13 water, 2 workers</td><td>3.2 s</td></tr>
                <tr><td>Plasma hunter</td><td>1 War Point, 1 worker</td><td>8 s</td></tr>
                <tr><td>Corvette</td><td>100 niobium, 60 water, 3 workers</td><td>6 s</td></tr>
                <tr><td>Laser corvette</td><td>100 niobium, 200 water, 5 workers</td><td>10 s</td></tr>
                <tr><td>Combat corvette</td><td>3 War Points, 3 workers</td><td>19 s</td></tr>
                <tr><td>Frigate</td><td>400 niobium, 200 water, 12 workers</td><td>20 s</td></tr>
                <tr><td>Plasma frigate</td><td>300 niobium, 600 water, 14 workers</td><td>30 s</td></tr>
                <tr><td>Battleship</td><td>8 War Points, 12 workers</td><td>40 s</td></tr>
                <tr><td>Cruiser</td><td>1,000 niobium, 680 water, 30 workers</td><td>56 s</td></tr>
                <tr><td>Battlecruiser</td><td>1,000 niobium, 920 water, 40 workers</td><td>1 min 4 s</td></tr>
                <tr><td>Destroyer</td><td>2,100 niobium, 6,000 water, 60 workers</td><td>4 min 30 s</td></tr>
            </table>

            <h3>Speed, signature and hold</h3>
            <p>Speed is in lumens, as on the ship's sheet (the higher, the faster). The "Flight" column gives the flight time per unit of distance on a ×1 speed server (a faster server shortens these durations); a fleet flies at the pace of its slowest ship. The signature counts for fuel and for what enemy radars see.</p>
            <table>
                <tr><th>Ship</th><th>Speed</th><th>Flight</th><th>Signature</th><th>Hold</th></tr>
                <tr><td>Probe</td><td>299</td><td>1 s</td><td>1</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>280</td><td>40 s</td><td>10</td><td>3,000</td></tr>
                <tr><td>Cargo V</td><td>275</td><td>50 s</td><td>24</td><td>10,000</td></tr>
                <tr><td>Cargo X</td><td>270</td><td>60 s</td><td>50</td><td>25,000</td></tr>
                <tr><td>Caravel</td><td>285</td><td>30 s</td><td>60</td><td>40,000</td></tr>
                <tr><td>Recycler</td><td>225</td><td>150 s</td><td>16</td><td>1,000</td></tr>
                <tr><td>Colonizer</td><td>200</td><td>200 s</td><td>40</td><td>—</td></tr>
                <tr><td>Invasion barge</td><td>150</td><td>300 s</td><td>10</td><td>1,000</td></tr>
                <tr><td>Radar ship</td><td>299</td><td>1 s</td><td>100</td><td>—</td></tr>
                <tr><td>Jammer ship</td><td>299</td><td>1 s</td><td>200</td><td>—</td></tr>
                <tr><td>Lunar</td><td>50</td><td>500 s</td><td>10,000</td><td>—</td></tr>
                <tr><td>Mother ship</td><td>250</td><td>100 s</td><td>4,000</td><td>—</td></tr>
                <tr><td>Hunter</td><td>275</td><td>50 s</td><td>1</td><td>—</td></tr>
                <tr><td>Heavy hunter</td><td>275</td><td>50 s</td><td>2</td><td>4</td></tr>
                <tr><td>Plasma hunter</td><td>275</td><td>50 s</td><td>5</td><td>—</td></tr>
                <tr><td>Corvette</td><td>265</td><td>70 s</td><td>7</td><td>—</td></tr>
                <tr><td>Laser corvette</td><td>250</td><td>100 s</td><td>10</td><td>—</td></tr>
                <tr><td>Combat corvette</td><td>265</td><td>70 s</td><td>12</td><td>—</td></tr>
                <tr><td>Frigate</td><td>245</td><td>110 s</td><td>20</td><td>25</td></tr>
                <tr><td>Plasma frigate</td><td>240</td><td>120 s</td><td>30</td><td>—</td></tr>
                <tr><td>Battleship</td><td>250</td><td>100 s</td><td>40</td><td>—</td></tr>
                <tr><td>Cruiser</td><td>235</td><td>130 s</td><td>56</td><td>—</td></tr>
                <tr><td>Battlecruiser</td><td>225</td><td>150 s</td><td>64</td><td>—</td></tr>
                <tr><td>Destroyer</td><td>230</td><td>140 s</td><td>270</td><td>—</td></tr>
            </table>
            <p>Example: the Lunar is very slow and its signature of 10,000 makes its trip expensive. To a neighboring sector, it takes 25 minutes and costs about 50 Bitcoins of fuel; to another galaxy, 2 h 30 and 1,250 Bitcoins.</p>

            <h3>Prerequisites</h3>
            <p>Researches to obtain, and building to construct on the producing planet:</p>
            <ul>
                <li>No research: Probe, Caravel, Plasma hunter, Combat corvette, Battleship.</li>
                <li>Cargo I / V / X: Cargo management level 1 / 3 / 5.</li>
                <li>Colonizer: Terraforming level 1. Lunar: Terraforming level 15 + Heavy industry.</li>
                <li>Recycler: Orbital recycling. Invasion barge: Planetary invasion.</li>
                <li>Radar ship: System scanner level 3 + Weapons factory. Jammer ship: System scanner level 5 + Weapons factory.</li>
                <li>Mother ship: Utility ships level 3 + Heavy industry (only one per commander).</li>
                <li>Hunter: Industry level 1 + Missile weapon level 1. Heavy hunter: Missile weapon level 2 + Weapons factory.</li>
                <li>Corvette: Missile weapon level 3 + Light ships level 2 + Weapons factory. Laser corvette: Missile weapon 3 + Laser weapon 1 + Light ships 3 + Weapons factory.</li>
                <li>Frigate: Missile weapon 3 + Laser weapon 1 + Heavy industry. Plasma frigate: the same + Plasma weapon 1.</li>
                <li>Cruiser: Missile weapon 3 + Laser weapon 2 + Plasma weapon 2 + Heavy industry.</li>
                <li>Battlecruiser: all three weapons at level 3 + Heavy ships 2 + Heavy industry. Destroyer: all three weapons at level 3 + Heavy ships 3 + Heavy industry.</li>
            </ul>

    ship_customization:
        title: "Customize your ships"
        category: "fleet"
        order: 3
        tags: "customization,ships,points,hull,shield,accuracy,weapons,upgrade"
        summary: "Up to 40 points per day to strengthen the hull, shield, weapons and accuracy of your combat ships."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principle">The principle</h2>
            <p>Each of the 12 combat ships has its own <strong>upgrade point credit</strong>: 3 for the Hunter, 676 for the Destroyer, 1,465 across all models. You spend them on its characteristics:</p>
            <ul>
                <li><strong>Hull</strong> — how much it can take (+5 per point).</li>
                <li><strong>Shield</strong> — absorbs part of the shots (+1 per point; hunters have none).</li>
                <li><strong>Missile</strong>, <strong>Laser</strong>, <strong>Plasma</strong> — its weapons (+3, +2 and +1 per point), depending on which ones the ship has.</li>
                <li><strong>Accuracy</strong> — raises the worst possible result of each salvo (+1 per point; no shot ever misses, but a poorly aimed shot deals less damage).</li>
            </ul>
            <p>You can spend <strong>at most 40 points per day</strong>, all ships combined. As soon as you've spent those 40 points, a 24&nbsp;h countdown starts; at the end, you get 40 back. Unspent points don't accumulate beyond 40: remember to drop by every day.</p>
            <p>Only combat ships can be upgraded: cargo ships, recyclers, probes and other utility ships have no points.</p>

            <h2 id="use">How to use them</h2>
            <p>Go to the <strong>Space shipyard</strong> page, <strong>Upgrade your ships!</strong> tab (the menu entry lights up green when you have points to spend). For each model, enter the number of points to place in each characteristic (the gain is shown next to it), then click <strong>Apply</strong>. Your choices apply to <strong>all ships of that model</strong> (current and future). These stats progress independently of each other: putting points into a model's hull or weapons never reduces its accuracy.</p>

            <h2 id="reading">Reading your aim on screen</h2>
            <p>The <strong>Statistics</strong> tab of the Shipyard shows, model by model, the aim you've invested out of that model's credit (for example <code>676 / 676</code> for a Destroyer) and the resulting <strong>damage multiplier</strong>: <strong>×0.94</strong> at full aim, <strong>×0.66</strong> without a single point invested.</p>
            <p>It is not a hit rate: <strong>no shot ever misses</strong>. Aiming better raises the floor of your damage, never its ceiling. It's the same figure as on your fleet management page, in the Defenses tab and in your battle reports — the four screens can finally be compared directly. As a benchmark, a planet's defenses fire at <strong>×1.06</strong>, better than a fleet at full aim.</p>

            <h2 id="maximum">How many points to max out?</h2>
            <p><strong>Accuracy</strong> reaches its maximum when you put <strong>the model's entire credit</strong> into it: 3 points for the Hunter, 5 for the Heavy hunter, 21 for the Plasma hunter and the Laser corvette, 23 for the Corvette, 34 for the Combat corvette, 61 for the Plasma frigate, 64 for the Frigate, 118 for the Cruiser, 160 for the Battleship, 279 for the Battlecruiser and 676 for the Destroyer. It's a choice: everything into aim, or everything into guns and hull.</p>
            <p>The other characteristics have no maximum, only the credit limit. Example: a Destroyer's 676 points placed in hull add 3,380 hull points (from 2,600 to 5,980). At 40 points per day, it takes 17 days to spend a Destroyer's credit, and 37 days for the 1,465 points of all models.</p>

            <h2 id="reset">Resets</h2>
            <p>You can reset your points <strong>once every 96 hours</strong>, with no limit on the number of times: if your strategy changes or the combat engine evolves, all your spent points return to each model's credit. After a reset, the button stays greyed out and a countdown shows the time left before the next one.</p>
            <p>Right after the reset, the line "You can still spend … points today" shows your spent points minus 90, plus what you still had left to spend that day, with a minimum of 40. The rest then comes back at the usual rate of 40 per day. Examples: if you had spent all 1,465 points and nothing today, you can place 1,375 again right away; if you had spent 300, you can place 210 again.</p>

            <h2 id="max-modes">Server modes with maximum research</h2>
            <p>In some modes (Battle Royale, Domination, Search &amp; Destroy), <strong>all your points are unlocked from day one</strong>: the 1,465 points are available immediately, instead of 40 per day.</p>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>Don't spread your points over too many models: focus on the ones you really use in bulk.</li>
                <li>The <strong>Plasma hunter</strong> and the <strong>Battleship</strong> have no weapons to begin with: without points in their weapons, they don't fire.</li>
                <li>The <strong>Hunter</strong> has only 3 points: that's enough to bring its accuracy to the maximum.</li>
                <li>Cargo ships and recyclers can't be upgraded: to protect them, have them escorted by an armed fleet.</li>
            </ul>

    fleet_missions:
        title: "Mission types"
        category: "fleet"
        order: 4
        tags: "mission,attack,transport,colonization,recycling,espionage,nuclear,raid,invasion"
        summary: "Each mission gives your fleet a different order. Here is how to pick the right one."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principle">The principle</h2>
            <p>When you send a fleet, you give it a <strong>mission type</strong>. That mission determines what happens on arrival. Some types require specific ships.</p>
            <p>All missions are sent from the <strong>Spatial map</strong>: click the target square, then <strong>Interaction</strong>, choose the fleet and the mission, and click <strong>Send</strong>. The list only offers the missions possible on that square. The <strong>Move the fleet</strong> tab on a fleet's page is for simple moves (Normal) and espionage.</p>

            <h2 id="missions">The available types</h2>
            <table>
                <tr><th>Mission (in-game label)</th><th>What it does</th><th>Ships required</th></tr>
                <tr><td><strong>Normal</strong></td><td>The fleet goes to the target point and stays in orbit there. A battle breaks out 5 minutes after arrival if a fleet in attack mode (yours or one already present) faces an opponent, if your alliances are at war, or if the target planet is in attack mode (its defenses fire). Details in <em>Space combat</em>.</td><td>Any</td></tr>
                <tr><td><strong>Unload and return</strong></td><td>Drops the cargo on a planet (within the limits of its warehouses: the surplus leaves with the fleet) or sells it to a trader for Bitcoins, then returns on its own. Fuel is doubled on the way out, and the return is paid at the normal rate when it departs.</td><td>Ships with a hold (cargo ships, in practice)</td></tr>
                <tr><td><strong>Colonize</strong></td><td>Founds a colony on an <strong>uninhabited planet</strong> (not on an empty square).</td><td>A colonizer</td></tr>
                <tr><td><strong>Raid</strong></td><td>Fights the ground defense to steal resources, without taking the planet.</td><td>Barges + Legionnaires</td></tr>
                <tr><td><strong>Invade</strong></td><td>Fights the ground defense to <strong>take the planet</strong> from the opponent.</td><td>Barges + Legionnaires</td></tr>
                <tr><td><strong>Probe</strong></td><td>Spies on the planet and sends you a report.</td><td>At least one probe</td></tr>
                <tr><td><strong>Create a moon</strong></td><td>Creates a moon on an empty square holding at least 2M niobium and 2M water in debris.</td><td>A Lunar</td></tr>
                <tr><td><strong>Deploy radar</strong></td><td>Installs a power 1 radar on an empty square for 2&nbsp;h.</td><td>A radar ship</td></tr>
                <tr><td><strong>Deploy jammer</strong></td><td>Installs a power 1 jammer on an empty square for 1&nbsp;h.</td><td>A jammer ship</td></tr>
            </table>
            <p>A fleet already in orbit at its target can also act directly from its page, <strong>Interaction</strong> section: Invade, Raid, Colonize, Spy or deploy.</p>

            <h3>These are not missions</h3>
            <ul>
                <li><strong>Recycling</strong>: automatic. A fleet that has at least one recycler and room in its hold starts recycling as soon as it arrives on a debris field, whatever its mission (Normal, usually). The fleet's <strong>Recycle</strong> button restarts the work.</li>
                <li><strong>Put on ground</strong>: on one of your planets, the fleet joins the stock of ships on the ground (see <em>Advanced fleet management</em>).</li>
                <li><strong>Nuclear missile</strong>: from the Spatial map, "Send a nuclear missile" at an enemy planet. The missile leaves from one of your planets that has one, flies for 30 minutes and cannot be cancelled.</li>
            </ul>

            <h2 id="pick">How to pick the right mission</h2>
            <ul>
                <li>Want <strong>Bitcoins</strong>? → Unload and return, to a trader.</li>
                <li>Want <strong>intelligence</strong>? → Probe.</li>
                <li>Want to <strong>weaken</strong> an enemy? → Raid.</li>
                <li>Want to <strong>take</strong> their planet? → Invade.</li>
                <li>Want to <strong>recover debris</strong>? → Send recyclers (Normal mission): they recycle on their own on arrival.</li>
            </ul>

    fleet_movement:
        title: "Movement and distance"
        category: "fleet"
        order: 5
        tags: "movement,distance,speed,travel,fuel,coordinates,bitcoin,cancel,night"
        summary: "How flight duration and fuel consumed are calculated, and what slows your fleet down."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordinates">How coordinates work</h2>
            <p>Every position in the universe is written in the format <strong>Galaxy:Sector:Position</strong>. Example: <code>1:5:12</code> = galaxy 1, sector 5, position 12.</p>
            <ul>
                <li>A <strong>galaxy</strong> contains 100 sectors (10×10 grid, numbered 1 to 100 row by row: 1 to 10 on the first row, 91 to 100 on the last). The Spatial map calls them "systems".</li>
                <li>A <strong>sector</strong> contains 25 positions (5×5 grid); position 13, in the center, is always a sun.</li>
            </ul>

            <h2 id="distance">How distance is calculated</h2>
            <ul>
                <li><strong>Within your sector</strong>: about 1 per square of difference (1 between two neighboring squares, 6.25 at most from one corner to the other).</li>
                <li><strong>To another sector of the same galaxy</strong>: about 3 per sector of difference, in a straight line on the 10×10 grid; the position within the sector no longer counts. From 3 for a neighboring sector to about 40 from one corner of the galaxy to the other.</li>
                <li><strong>To another galaxy</strong>: always 18, whatever the target sector. The <strong>Hyperspace technology</strong> research is required.</li>
            </ul>
            <p>The <strong>Move the fleet</strong> tab on a fleet's page shows an estimate of the cost and duration before sending. This estimate takes into account neither speed bonuses, nor the doubling of "Unload and return", nor the server speed. From the Spatial map, the dispatch goes out without a preview.</p>

            <h2 id="duration">Flight duration</h2>
            <p>The duration is calculated like this: <strong>distance × time per unit of the slowest ship × server speed</strong>. A fleet always goes at the speed of its slowest ship. Time per unit of distance, on a ×1 speed server (some servers are accelerated):</p>
            <table>
                <tr><th>Time per unit</th><th>Ships</th></tr>
                <tr><td>1 s</td><td>Probe, Radar ship, Jammer ship</td></tr>
                <tr><td>30 s</td><td>Caravel</td></tr>
                <tr><td>40 s</td><td>Cargo I</td></tr>
                <tr><td>50 s</td><td>Cargo V, Hunter, Heavy hunter, Plasma hunter</td></tr>
                <tr><td>60 s</td><td>Cargo X</td></tr>
                <tr><td>70 s</td><td>Corvette, Combat corvette</td></tr>
                <tr><td>100 s</td><td>Laser corvette, Battleship, Mother ship</td></tr>
                <tr><td>110 s</td><td>Frigate</td></tr>
                <tr><td>120 s</td><td>Plasma frigate</td></tr>
                <tr><td>130 s</td><td>Cruiser</td></tr>
                <tr><td>140 s</td><td>Destroyer</td></tr>
                <tr><td>150 s</td><td>Battlecruiser, Recycler</td></tr>
                <tr><td>200 s</td><td>Colonizer</td></tr>
                <tr><td>300 s</td><td>Invasion barge</td></tr>
                <tr><td>500 s</td><td>Lunar</td></tr>
            </table>
            <p>Examples, on a ×1 speed server:</p>
            <ul>
                <li>Hunters to a neighboring sector: 2 min 30 s (3 × 50 s).</li>
                <li>A Cargo I delivering to an ally: about 2 minutes to a neighboring sector, 10 minutes to a sector 5 sectors further, 12 minutes to another galaxy (Cargo X: 3, 15 and 18 minutes). With "Unload and return", count as much again for the return.</li>
                <li>A colonizer: about 10 minutes to a neighboring sector, 50 minutes at 5 sectors, 1 hour to another galaxy.</li>
            </ul>
            <p>What changes the duration:</p>
            <ul>
                <li>The <strong>Mother ship</strong> cuts its fleet's flight time by 10%. Careful: it itself flies at 100 s per unit, so a fleet of hunters taking it along goes from 50 to 90 s per unit. It <strong>also reduces the fleet's radar signature by 10%</strong> (camouflage) — the Global view, for its part, shows the raw total of your ships.</li>
                <li>A <strong>hero</strong> on board who gives a speed bonus (see the <em>Hero</em> article) and the alliance fleet speed bonus shorten the trip. Together, the hero's bonuses can't reduce the duration by more than 90%.</li>
                <li>The <strong>night slowdown</strong> can multiply the duration (see below).</li>
            </ul>

            <h2 id="fuel">Fuel</h2>
            <p>Fuel is paid in <strong>Bitcoins</strong>, at departure. It depends on the fleet's <strong>signature</strong> (the sum of its ships' signatures; cargo doesn't count) and on the distance:</p>
            <ul>
                <li>within the same galaxy: <strong>signature × distance ÷ 600</strong>, rounded;</li>
                <li>to another galaxy: <strong>signature ÷ 8</strong>, rounded, whatever the destination.</li>
            </ul>
            <p>The <strong>Unload and return</strong> mission costs <strong>double</strong> on the way out, and its return is then paid like a normal trip, when the fleet departs again. A Mother ship reduces the fleet's signature, and so its fuel, by 10% (but its own signature is 4,000).</p>
            <p>Examples: 1 Cargo I (signature 10) to a neighboring sector: 0 Bitcoin. 100 Cargo X (signature 5,000) to a trader 5 sectors further: 252 Bitcoins on the way out, 126 on the way back. 1,000 hunters to another galaxy: 125 Bitcoins. If you don't have enough Bitcoins, the dispatch is refused.</p>

            <h2 id="recall">Recalling a fleet in flight</h2>
            <p>During the <strong>first 2 minutes</strong> of the flight, a ✕ button with a countdown appears on the fleet (Fleets page), and a <strong>Cancel</strong> line on its page: it <strong>cancels the dispatch</strong>. The fleet is immediately back on its departure planet, but the fuel paid is not refunded. This is also true for a colonizer.</p>
            <p>After that, the fleet can no longer be stopped: once it has arrived, send it back (new trip, new fuel). A nuclear missile can never be cancelled.</p>

            <h2 id="night-slowdown">🌙 Night slowdown</h2>
            <p>This slowdown affects a fleet carrying at least one combat ship, Legionnaires or Mechs, sent to the planet of another player or an AI commander who is neither in your alliance, nor an ally, nor in a pact or at peace with you. If this fleet were to arrive during the <strong>defender's night</strong> (23h–06h in their time zone), <strong>its whole flight duration is multiplied</strong>, by 10 by default (each server can set this multiplier).</p>
            <p>Example: a 1&nbsp;h flight that would arrive at 23:30 lasts 10&nbsp;h and arrives at 9:30. A fleet of cargo ships, probes or colonizers with no troops on board is never slowed. The duration shown in the <strong>Move the fleet</strong> tab already includes this multiplier.</p>
            <p>A 🌙 icon on the map indicates the players currently in a night window. In the <strong>Move the fleet</strong> tab, a confirmation window appears when sending if the arrival falls in the opponent's night; from the Spatial map, the fleet leaves without this warning. The time zone is auto-detected and can be changed once a month at most (and 6 times a year).</p>

    fleet_management:
        title: "Advanced fleet management"
        category: "fleet"
        order: 6
        tags: "management,fleet,split,merge,transfer,regroup,put on ground,rally,cohort,abandon"
        summary: "Split, merge, put on ground, cancel a dispatch: the advanced operations on your fleets."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Available operations</h2>
            <p>They are done from a fleet's page (click its name, <strong>Fleets</strong> page):</p>
            <ul>
                <li><strong>Split</strong> (<strong>Ships</strong> tab) — detach part of the ships and cargo into a new fleet. Not possible in flight or in combat; 100 fleets at most.</li>
                <li><strong>Merge</strong> ("Fleets in orbit" list) — join another of your fleets, or all of them (<strong>Merge</strong>), stationed on the same planet.</li>
                <li><strong>Manage</strong> the ships (<strong>Ships</strong> tab) and the <strong>Cargo</strong> — on one of your planets, move ships or cargo between the fleet and the ground.</li>
                <li><strong>Put on ground</strong> — on one of your planets, pour the whole fleet (ships, troops, cargo) into the planet's stock; the fleet disappears. The troops and cargo unloaded must fit within the planet's capacities; a fleet that carries none always lands, even on a planet that is already full.</li>
                <li><strong>Cancel the dispatch</strong> (✕ button on the fleet in flight, or <strong>Cancel</strong> line on its page) — during the first 2 minutes of the flight only: the fleet immediately returns to its departure point, fuel lost.</li>
                <li><strong>Abandon</strong> — you lose the fleet: on a server where Cthulhu is present, it goes to him (and may turn against you); elsewhere, it is destroyed.</li>
            </ul>
            <p>On the <strong>Fleets</strong> page itself:</p>
            <ul>
                <li><strong>Fleet rally</strong> — sends all your idle fleets to this planet, where they land on arrival.</li>
                <li><strong>Ship rally</strong> — gathers the ground ships of your other planets into fleets that fly to this one and land there.</li>
                <li><strong>Cohorts</strong> — sort your fleets into named lists (10 at most) to find them easily. No effect in combat.</li>
            </ul>
            <p>Splitting, merging, transferring and putting on the ground cost no resources. Only moves, rallies included, are paid for, in Bitcoins of fuel.</p>

            <h2 id="in-flight">What you can't do</h2>
            <ul>
                <li>Change the composition of a fleet <strong>in flight</strong> (cargo, ships).</li>
                <li>Change the mission or destination of a fleet in flight. Only cancellation is possible, and only during the first 2 minutes.</li>
                <li>Teleport a fleet (no magic shortcut!).</li>
            </ul>

            <h2 id="tips">Use cases</h2>
            <ul>
                <li><strong>Split before a battle</strong>: keep part of your fleet in reserve, send a vanguard.</li>
                <li><strong>Merge after a raid</strong>: bring several returns together for readability.</li>
                <li><strong>Put on ground</strong>: ships on the ground cost six times less maintenance than in a fleet (one twelfth of their signature in Bitcoins each day, at the 18:59 balance, Paris time, versus half in a fleet), but they <strong>do not fight</strong>. To defend a planet, keep an armed fleet in orbit, in attack mode.</li>
            </ul>

    espionage:
        title: "Espionage and probes"
        category: "fleet"
        order: 7
        tags: "espionage,probe,spy,detection,information,intelligence"
        summary: "Know what the opponent has before striking: sending probes explained."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="send">Sending a probe</h2>
            <ol>
                <li>Build <strong>probes</strong> at the Shipyard (no research required; 1,000 niobium each).</li>
                <li>On the <strong>Spatial map</strong>, click the target planet, then <strong>Interaction</strong> → <strong>Probe the planet</strong>: a probe stored on the ground on one of your planets leaves right away. You can also create a fleet of probes and send it on a <strong>Probe</strong> mission.</li>
                <li>Alone, a probe is almost instantaneous: 1 second per unit of distance (18 seconds to another galaxy). Mixed with other ships, it flies at their speed.</li>
            </ol>
            <p>The map's <strong>Interaction</strong> button only appears if at least one of your fleets is idle. Only planets inhabited by another commander can be scanned: a probe sent to a moon arrives without producing a report.</p>
            <p>On arrival, the probe scans the planet and sends you a report, then stays in orbit at the target. From its page (<strong>Spy</strong> button), it can make a new report later; if the planet goes into attack mode, its defenses may destroy it. From the Map or the Spy button, the same planet can only be probed once per hour.</p>

            <h2 id="success">What determines success?</h2>
            <p>A silent duel pits your <strong>Espionage level</strong> against the defender's:</p>
            <ul>
                <li>If your level is <strong>greater than or equal</strong>, the report is complete.</li>
                <li>If your level is lower, the espionage fails: the report contains nothing but the planet's name. There is no partial result.</li>
            </ul>
            <p>To raise your espionage: research <strong>System scanner</strong> up to level 5, then research <strong>Espionage</strong>, which has no maximum level.</p>

            <h2 id="report">What a successful report reveals</h2>
            <ul>
                <li>The <strong>resources</strong>: niobium, water, rations, uranium, workers and scientists.</li>
                <li>The <strong>buildings</strong> and their level.</li>
                <li>The <strong>defenses</strong>: turrets, nuclear interceptors, shield, <strong>Legionnaires</strong> and <strong>Mechs</strong>.</li>
                <li>The planet's <strong>ground ships</strong> (nuclear missiles included). Fleets in orbit don't appear in it: look at them on the Spatial map.</li>
                <li>The <strong>prisoners</strong> (heroes) held on the planet.</li>
            </ul>
            <p>Exactly what you need to decide: raid, invasion, or retreat.</p>

            <h2 id="detection">Can you get spotted?</h2>
            <p>Always. At each probe, the defender receives an "Espionage Detected" report that gives <strong>your name</strong> and states whether the attempt succeeded or failed, along with a notification. Radar changes nothing about this.</p>
            <p>Neither does the Radar jammer: it hides a planet on the map, but doesn't stop a probe from scanning it. Only an Espionage level higher than yours protects the defender.</p>

    spatial_combat:
        title: "Space combat"
        category: "combat"
        order: 1
        tags: "combat,space,fleet,battle,block,round,shield,accuracy,losses,damage,screen,hunters"
        summary: "The complete course of a battle between fleets: power of the sides, shield duel, firing rounds, end of battle and exact calculation of your losses."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="trigger">When a battle is triggered</h2>
            <p>As soon as a fleet marked <strong>[Attack]</strong> shares its position (Galaxy:Sector:Position) with an enemy fleet, the battle is scheduled <strong>5 minutes</strong> later; until then, nobody can change the attack mode of their fleets anymore. Your fleets present at the same place first merge into a single armada.</p>
            <p>All the fleets on site are split into <strong>two sides</strong> according to diplomacy: your alliance and the alliances linked to it by a Defensive alliance on one side, the enemy and its own on the other; an alliance linked by a Non-aggression pact to the opposing side stays out of it. A side without a single ship weapon (cargo ships, recyclers, probes, troops alone) doesn't fight: it is destroyed, and the report mentions it.</p>
            <p><strong>Alliances at war, nobody armed</strong> — two fleets from alliances at war that cross paths in orbit only trigger a battle if at least one of the two carries ship weapons. Two entirely unarmed fleets (cargo ships, probes, recyclers) that cross paths simply don't fight: your fleets aren't immobilized and nobody is warned for nothing.</p>
            <p><strong>The case of raids and invasions</strong> — when this battle is triggered by a raid or an invasion against a guarded planet (see the <em>Planet invasion</em> and <em>Raids (pillaging)</em> articles), it's this triggering itself that puts the <strong>[Attack]</strong> marker on your assaulting fleet. It's never removed afterwards: a raid or invasion fleet that survives therefore stays marked hostile — turrets in attack mode may engage it later, and it will be picked up in the detection of the next space battle as soon as it crosses an enemy.</p>

            <h2 id="power">A side's power</h2>
            <p>The battle pits the <strong>totals</strong> of the two sides against each other: the game adds up the armor, shield, missiles, lasers and plasma of all the ships engaged.</p>
            <ul>
                <li><strong>Defender at home</strong> — the turrets and armor of the planet's defenses join its side; the Shield adds +50,000 armor, the Large shield +600,000 (+20% each with a Space base). An armed fleet of one of its alliance members stationed on the planet benefits too.</li>
                <li><strong>Accuracy</strong> — average of the accuracies of the side's fleets (from your ship customization). See <em>Understanding troop power</em>.</li>
                <li><strong>Alliance policy</strong> — each regime beats its rival: <strong>The Balance of Worlds</strong> beats <strong>The Silent Rampart</strong>, which beats <strong>The Hammer of Stars</strong>, which beats The Balance of Worlds. If the <strong>attacker's</strong> policy beats the defender's, its missiles, lasers and plasma gain +20% for that battle.</li>
                <li><strong>Alliance improvements</strong> — up to +5% per type of weapon, armor, shield and accuracy, and up to +10% for planetary defenses. This last bonus applies when your defenses fight alongside a fleet, not in attack-mode orbital combat.</li>
                <li><strong>Heroes</strong> — attack, defense, shield and accuracy bonuses depending on skills and items. A hero with <strong>Intimidation</strong> reduces enemy weapons; a <strong>Tactician</strong> strengthens its side's first salvo.</li>
            </ul>

            <h2 id="planet-defenses">Your turrets fight in this same battle</h2>
            <p>When your planet's defenses join a side, this battle <strong>is</strong> your planet's entire battle: there is no separate second orbital battle behind it for your turrets. They aim with their own accuracy (a poorly accurate escort stationed next to them doesn't degrade their fire), and they take <strong>real losses</strong> in it, whether the planet's attack mode is active or not:</p>
            <ul>
                <li><strong>if your side wins</strong>, your turrets lose the same fraction as the armor lost by your side (95% at most); shields and Space base remain intact;</li>
                <li><strong>if your side collapses</strong>, all the turrets, the Shield, the Large shield and the Space base are destroyed, the Defense page's production queue is lost (turrets, Legionnaires, Mechs, bombs or interceptors not yet delivered included) and attack mode is turned off. Legionnaires, Mechs and workers already on the ground, buildings and bombs or interceptors in stock are not affected.</li>
            </ul>
            <p>A planet guarded by an <strong>armed</strong> fleet (ship weapons) — yours or that of a member of your alliance — therefore can't be raided or invaded without a battle settling it first; a lone probe or cargo ship isn't enough.</p>

            <h2 id="shields">The shield duel</h2>
            <p>Each salvo first hits the opponent's shield. Its <strong>piercing power</strong> is:</p>
            <p><code>missiles ÷ 7 + plasma × 4 + lasers × 2</code></p>
            <p>Plasma excels against shields, missiles pierce them poorly — whatever the size of the battle, ten against ten or a hundred million against a hundred million. On each salvo, the share of damage that exceeds the piercing power is absorbed by the opponent's shield until its charge is exhausted; the rest, and everything that overflows once the shield is empty, hits the hull directly. A shield can therefore never block an entire salvo: against an armed opponent, your hull always takes something, from the very first round.</p>
            <p>Example: a salvo fired by 700 missiles, 200 plasma and 300 lasers pierces to the tune of 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1,500</strong> points; only what exceeds those 1,500 points can be absorbed by the opponent's shield.</p>
            <p>A fleet's shield is not a reserve that automatically returns to 100% before each battle: it's a <strong>persistent charge</strong> that wears down during the battle and only comes back by 10% every 3 hours, continuously (30 hours to go from zero to full), even when you split, merge or dissolve the fleet, or transfer ships between the fleet and the planet's ground. The battle report shows this charge at the start and at the end of the battle; the fleet list shows each fleet's percentage, and the fleet management page indicates the shield actually taken into battle, the total capacity, the current percentage and the time left before full charge. The stock of ships on the ground also carries a charge, which doesn't recharge: any fleet created or topped up from this ground inherits it, and it is shown in the fleet creation window as well as in the "Ships" tab of fleet management.</p>
            <p>One exception: the flat shield provided by a <strong>Mother ship</strong> (5,250 points per fleet, once only even with several Mother ships) never discharges from one battle to the next — it absorbs hits during the battle, then starts full again at the next; the charge only wears down your other ships' shield. That's why the management page also shows the absolute shield value, not just the percentage.</p>

            <h2 id="rounds">The firing rounds</h2>
            <p>The battle lasts at most <strong>100 rounds</strong>. In each round, each side fires a salvo that deals:</p>
            <p><code>(missiles + plasma ÷ 2 + lasers × 2) × multiplier</code></p>
            <p>The multiplier comes from an accuracy roll: the game draws a number between the side's accuracy and 100 and divides it by 80, for a result between <strong>×0.3 and ×1.2</strong>. No salvo misses. High accuracy doesn't make your best salvos stronger, it eliminates the bad rolls. The share that gets through the opponent's shield (see above) is deducted from that side's total armor.</p>

            <h2 id="ending">End of the battle</h2>
            <ul>
                <li><strong>A side's armor drops to 0</strong> — it is defeated, all its fleets are destroyed along with their cargo.</li>
                <li><strong>100 rounds reached</strong> — the side that keeps the most armor wins; in a perfect tie, the attacker wins.</li>
                <li><strong>Winner's safety net</strong> — even badly battered, the winning side never loses more than 95% of its starting armor: a victory is never an annihilation, whatever the power gap.</li>
            </ul>

            <h2 id="losses">Your losses: what you took</h2>
            <p>The rule fits in one sentence: <strong>your losses stem from the hull damage you actually took</strong> — never from what your shield absorbed, which costs no ship. This hull damage is split between your <strong>screen</strong> (Hunters, Heavy hunters, Plasma hunters: the only ships without a shield) and your <strong>line</strong> (the other combat ships, from Corvettes to Destroyers), in proportion to each group's armor: each type loses the same fraction of itself. The report shows two counters: hull damage and shield damage.</p>
            <p>Your screen doesn't protect your line indefinitely: it diverts onto itself at most <strong>half</strong> of the damage that was aimed at the line, and only as long as it has armor left to take it — a single hunter can't soak up the damage of a whole fleet. With no screen at all, the line takes all of the hull damage.</p>
            <p>Your utility ships (cargo ships, recyclers, barges, probes, colonizers, Mother ship) suffer no losses as long as your side wins: only combat ships take hits.</p>
            <p>Direct consequences: if the enemy barely touches you, your losses are almost nil; an enemy ten times more dangerous costs you about ten times more — hunters included. The defeated side, for its part, loses everything.</p>

            <h2 id="aftermath">After the battle</h2>
            <ul>
                <li><strong>Debris</strong> — 40% of the construction cost (niobium and water) of each destroyed ship, from both sides, falls into orbit (20% when a Cthulhu or an alien is involved). Ships paid for in War Points leave no debris. The cargo of annihilated fleets is added to it. A recycler in the victorious fleet immediately starts picking up, if it has room in its hold.</li>
                <li><strong>War Points</strong> — the gain is calculated on the defeated side's signature: total signature ÷ number of that side's fleets ÷ 100 (÷ 500 against a Cthulhu or an alien), rounded to the integer. Each fleet of the winning side receives that amount, and the planet's owner earns as much if their defenses were on the winning side. The defeated side receives exactly one fifth of this scale, calculated on its own fleets. The "War Points" political research adds 10% per level. Example: a fleet of 100 Hunters (signature 1 each) destroyed earns 1 WP; a Destroyer (signature 270), about 3. Destroying an unarmed fleet (cargo ships, probes, recyclers) earns nothing.</li>
                <li><strong>Heroes</strong> — a main hero aboard a destroyed fleet can be captured by the winner (chance, never guaranteed). A defeated <strong>secondary hero</strong> follows a different, final rule, with no chance involved: see the <em>Secondary heroes</em> article.</li>
                <li><strong>Reports</strong> — each commander receives the details (<strong>Report</strong> menu, <strong>Battles</strong> tab): forces, salvos, damage taken, losses, and the fate of any secondary hero captured or executed.</li>
                <li><strong>And then</strong> — surviving fleets stay on site: nothing sends them home automatically.</li>
            </ul>

            <h2 id="tips">Tips</h2>
            <ul>
                <li>Always keep a <strong>screen of hunters</strong>: cheap, it takes part of the hull damage in place of your heavy ships.</li>
                <li>Invest in the <strong>shield</strong>: the more charged it is, the more damage it absorbs before it reaches your hull — but no shield stops an entire salvo, your hull always takes a share. Let it recharge between two battles.</li>
                <li>Build up <strong>plasma</strong> to quickly pierce enemy shields, <strong>lasers</strong> for hull damage.</li>
                <li>Choose your <strong>alliance policy</strong> by looking at that of your favorite targets: +20% weapons on attack.</li>
            </ul>

    invasion:
        title: "Planet invasion"
        category: "combat"
        order: 2
        tags: "invasion,planet,soldiers,mechs,barges,conquest,deployment,tactical,cancel"
        summary: "Conquer an enemy planet: barges, landing, ground combat and tactical deployments."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Invasion is an attack to <strong>take possession</strong> of an enemy planet. Your fleet lands Legionnaires (via barges) who face the garrison on the ground.</p>
            <p>It differs from a <strong>raid</strong> (which plunders without taking the planet): a successful invasion gives you the entire planet.</p>
            <p>There are two ways to launch it: send the fleet on an "Invade" mission to the planet, or click "Invade" when your fleet is already in orbit at the target (the assault then happens immediately).</p>

            <h2 id="conditions">What you need to invade</h2>
            <ul>
                <li>Play on a <strong>PvP-mode</strong> server (e.g. Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li>Have <strong>barges</strong> and <strong>Legionnaires</strong> on board the fleet.</li>
                <li>The target must be an inhabited planet of another player: not a trader, not a member of your alliance, nor an alliance with which you have a Defensive alliance, a Non-aggression pact or a Peace agreement.</li>
                <li>The target must not be protected by beginner status. Launching an invasion during your own protection makes you lose it (the game asks for confirmation).</li>
                <li>Your fleet must not already be engaged in a scheduled battle.</li>
            </ul>
            <p>You don't need to belong to an alliance.</p>

            <h2 id="barges">The role of barges</h2>
            <p>Barges are the vehicles that land your Legionnaires on the ground. Each barge carries <strong>1,000 Legionnaires</strong>, +25% per level of the "Planned invasions" political research (1,250 at level 1, 1,500 at level 2…).</p>
            <p>If you have more Legionnaires than spaces, the extra ones <strong>stay in orbit and don't fight</strong>. Mechs on board don't take part in the assault: only Legionnaires attack on the ground. In case of failure, your barges are <strong>captured by the defender</strong>.</p>

            <h2 id="cancel">Cancelling an invasion</h2>
            <p>A fleet sent on an invasion can be recalled during the <strong>2 minutes</strong> after its departure ("Cancel" button): it immediately returns to its departure point, but the fuel paid is lost. After that, the invasion will take place on arrival. An invasion launched from orbit ("Invade") is resolved immediately and cannot be cancelled.</p>

            <h2 id="orbital">Phase 1 — Orbital combat (sometimes)</h2>
            <p>Two situations can stop you before you even land:</p>
            <ul>
                <li>The target planet has enabled its <strong>attack mode</strong>: as soon as you arrive, its turrets and shields engage your fleet. If <strong>you lose</strong>, your fleet is destroyed — the invasion stops dead. If <strong>you win</strong>, the orbital defenses are wiped out and your fleet continues (weakened). A planet without turrets loses its shields and Space base without fighting as soon as your raid or invasion arrives.</li>
                <li>The target planet is guarded by an <strong>armed</strong> fleet (ship weapons) of the owner, or of a member of their alliance, already in orbit (a lone probe or cargo ship doesn't count): your arrival triggers a <strong>battle</strong> against this defender and its turrets combined, 5 minutes later — even if the planet is not in attack mode. This battle is never triggered against a peace partner, a pact partner, a defensive alliance or your own alliance, nor on a PvE server: it follows the same diplomatic rules as a normal invasion. It cancels your invasion in progress: if you win it, you have to <strong>relaunch</strong> an invasion to actually land — and if the planet is still guarded at that point, clicking "Invade" from orbit is <strong>refused</strong> in the same way: first enable attack mode on your own fleet to force the battle. Since an invasion always carries Legionnaires, this battle condition is automatically met on the attacker's side: the battle is therefore triggered whether or not your fleet carries ship weapons.</li>
            </ul>
            <p><strong>A trap to know: an invasion fleet without a combat ship is annihilated in this battle.</strong> Legionnaires and barges are enough to get an invasion off the ground, but if your fleet carries no ship weapons, it enters this preliminary battle with zero firepower: the defenders annihilate it entirely, barges and Legionnaires included, before you even land. The same goes against a planet in attack mode: its turrets automatically destroy a fleet without ship weapons. <strong>Always escort your invasion fleets with combat ships</strong> — see the <em>Raids (pillaging)</em> article for the same trap on the raiding side.</p>

            <h2 id="combat">Phase 2 — Ground combat</h2>
            <p>Ground combat takes place over <strong>10 rounds at most</strong>. In each round, the attacker deals a tenth of its attack power to the garrison, which hits back with a tenth of its defense power.</p>
            <table>
                <thead>
                    <tr><th>Unit</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionnaire</strong></td><td>Attack (5 to 7 per round in invasion) and defense (6, +5% per level of Barbed wire).</td></tr>
                    <tr><td><strong>Mech</strong></td><td>Heavy defense (2,200), max 500 per planet. Doesn't take part in the assault.</td></tr>
                    <tr><td><strong>Worker</strong></td><td>Passive defense (1 each), <strong>only in invasion</strong> (not in a raid).</td></tr>
                </tbody>
            </table>
            <p><strong>The attacker wins only if</strong> all the defender's troops are eliminated <strong>and</strong> at least 1 Legionnaire is left alive. Otherwise, <strong>the defender wins by terrain advantage</strong>. Detail of the powers: <em>Understanding troop power</em> article.</p>

            <h2 id="deployment">The defender's tactical deployments</h2>
            <p>The defender may have chosen a <strong>tactical deployment</strong> that is invisible to you (only their own report shows it). Keep in mind: it can turn around a situation that seemed won in advance.</p>
            <table>
                <thead>
                    <tr><th>Deployment</th><th>Effect</th><th>Garrison casualty order</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Balanced</strong></td><td>No bonus or penalty.</td><td>Legionnaires, then Mechs, then workers.</td></tr>
                    <tr><td><strong>Fortified</strong></td><td>The garrison's retaliation gains 30% then loses 20%: in total <strong>+4%</strong> damage dealt to the attacker. Units don't become harder to kill.</td><td>As Balanced.</td></tr>
                    <tr><td><strong>Guerrilla</strong></td><td>In the retaliation, each worker counts 2.5 times (+150%) and each Legionnaire half as much (−50%).</td><td>Workers first, then Legionnaires, then Mechs.</td></tr>
                    <tr><td><strong>Last Stand</strong></td><td>+50% retaliation as soon as the garrison falls below 30% of its starting strength (in number of units), until the end of the battle.</td><td>Legionnaires, then workers, then Mechs.</td></tr>
                    <tr><td><strong>Scorched Earth</strong></td><td>No combat bonus. If the attacker wins, in a raid as in an invasion, 50% of the niobium, water and uranium remaining on the planet are destroyed.</td><td>As Balanced.</td></tr>
                </tbody>
            </table>
            <p>Workers only fight in an invasion. The defender can change deployment freely, at any time, on the <strong>Defense</strong> page.</p>

            <h2 id="victory">If you win the invasion</h2>
            <ul>
                <li><strong>Capture</strong> — the planet comes to you, with its buildings. Workers are brought down to <strong>2,000</strong>. If the defender had chosen Scorched Earth, half of its niobium, water and uranium is destroyed before the capture.</li>
                <li><strong>Cthulhu planet</strong> — if you retake a planet captured by the Cthulhus, it is liberated (buildings reset to zero, uranium reward).</li>
                <li><strong>No more room to colonize?</strong> Your colonized planets must stay under Terraforming + 2, plus the level of the "Empire without borders" political research. Beyond that, the conquered planet becomes a Cthulhu base — or becomes uninhabited again on a server without Cthulhu: you don't keep it, but you earn your war points.</li>
            </ul>
            <p>The <strong>production queues</strong> don't follow the captured planet: ships as well as defenses (turrets or troops) already paid for but not yet delivered are lost on capture — an order placed by the loser never changes hands. What was delivered before the assault, on the other hand, is on the ground and follows the planet.</p>
            <p>If the captured planet hosts an enemy <strong>secondary hero</strong>, its fate is settled immediately: you <strong>capture</strong> it if you have a Prison (level 1 or more), otherwise it is <strong>executed</strong>. A raid never takes the planet and therefore never puts a hero at stake. Details in the <em>Secondary heroes</em> article.</p>

            <h2 id="gameover">Elimination of the defender</h2>
            <p>If the defender loses their <strong>last planet</strong>, they are eliminated from the server. You take everything: their Bitcoins, their surviving fleets and their War Points.</p>

            <h2 id="defeat">If you lose the invasion</h2>
            <p>The <strong>barges are captured by the defender</strong>. Legionnaires killed on the ground are lost; those who held out until the 10th round, and those left in orbit for lack of room, return to your fleet — without barges to land them again. It's a costly defeat: probe before invading.</p>

    raid:
        title: "Raids (pillaging)"
        category: "combat"
        order: 3
        tags: "raid,plunder,theft,resources,bunker,defensive fort,barges,scorched earth"
        summary: "Plunder the resources of an enemy planet without trying to conquer it."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principle">What is a raid?</h2>
            <p>A raid is a ground attack whose goal is to <strong>steal resources</strong>. You don't take the planet: you leave with loot. An important consequence: a raid, even a successful one, never takes the planet, so <strong>no secondary hero is ever captured or executed there</strong>, whether you are the attacker or the defender.</p>
            <p>It takes the same means as an invasion: <strong>barges</strong> and <strong>Legionnaires</strong> on board, against the planet of another player who is neither in your alliance, nor linked to it by a Defensive alliance, a Non-aggression pact or a Peace agreement (see <em>Planet invasion</em>). Send the fleet on a "Raid" mission, or click "Raid" when it is already in orbit. A Cthulhu base can't be raided.</p>

            <h2 id="difference">Raid vs Invasion</h2>
            <table>
                <thead>
                    <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                </thead>
                <tbody>
                    <tr><td>Goal</td><td>Steal niobium, water, uranium</td><td>Take possession of the planet</td></tr>
                    <tr><td>Defenders</td><td>Legionnaires + Mechs</td><td>Legionnaires + Mechs + Workers</td></tr>
                    <tr><td>Legionnaire attack</td><td>5 to 6 per round (less unpredictable)</td><td>5 to 7 per round (more unpredictable)</td></tr>
                    <tr><td>Loss of barges if defeated</td><td>No</td><td>Yes (captured by the defender)</td></tr>
                </tbody>
            </table>

            <h2 id="combat">How it goes</h2>
            <p>Same steps as the invasion (possible orbital combat, then 10 rounds on the ground), <strong>but workers don't defend</strong>. The defender's Legionnaires and Mechs stand alone.</p>
            <p><strong>Planet guarded by a fleet in orbit</strong> — if the target is protected by an <strong>armed</strong> fleet (ship weapons) of the owner, or of a member of their alliance (a lone probe or cargo ship isn't enough), your raid first triggers a battle against this defender and the planet's turrets, 5 minutes after your arrival. This battle is never triggered against a peace partner, a pact partner, a defensive alliance or your own alliance, nor on a PvE server. The plunder doesn't happen right afterwards: if you win this battle, you have to <strong>relaunch</strong> a raid to actually plunder — and if the planet is still guarded, clicking "Raid" from orbit is <strong>refused</strong> too: first enable attack mode on your own fleet to force the battle. On the attacker's side, this battle is only triggered if your raid fleet is itself offensive — ship weapons, Legionnaires or Mechs on board.</p>

            <h2 id="raid-troops-only">An all-troops raid is annihilated</h2>
            <p>Taking Legionnaires or Mechs along is enough to trigger this battle — but if your raid fleet carries <strong>no ship weapons</strong>, it enters it with zero firepower. The defenders annihilate it entirely, without losing a single ship on their side. Against a planet in attack mode, it's the same: its turrets automatically destroy a fleet without ship weapons. <strong>Always escort your troop transports</strong>: it's the costliest surprise this system can hold for you.</p>

            <h2 id="loot">The plunder (if you win)</h2>
            <p>You get as many resources as there is room left in your holds after the battle: each surviving Legionnaire takes one space, each Mech 500 (a barge offers 1,000 spaces). Bring cargo ships to leave with real loot. Resources are taken in this order:</p>
            <ol>
                <li><strong>Niobium</strong> first.</li>
                <li>Then <strong>Water</strong>.</li>
                <li>Finally <strong>Uranium</strong> (if room remains).</li>
            </ol>

            <h2 id="bunker">The Defensive fort protects a part</h2>
            <p>The defender's <strong>Defensive fort</strong> (bunker) <strong>shelters 5% of max storage per level</strong>. Examples:</p>
            <ul>
                <li>Defensive fort level 5 → 25% of max storage protected on niobium and water.</li>
                <li>Defensive fort level 10 → 50% protected.</li>
            </ul>
            <p>Uranium is protected in the same way: <strong>5% of your uranium stock per level of Defensive fort</strong> (since uranium has no max storage, the protection applies to the stock at that moment).</p>

            <h2 id="scorched">Beware of Scorched Earth</h2>
            <p>If the defender has chosen the <strong>Scorched Earth tactical deployment</strong> and loses, <strong>half of everything that remains</strong> on the planet (niobium, water, uranium) is destroyed, including the share the Defensive fort had sheltered. You leave with your loot, but the opponent can't take it all back behind you.</p>

    nuclear:
        title: "Nuclear strike"
        category: "combat"
        order: 4
        tags: "nuclear,bomb,uranium,destruction,interceptor"
        summary: "The ultimate weapon to destroy an enemy's key buildings — provided they have no anti-missile defense."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="requirements">What you need</h2>
            <ul>
                <li>The <strong>Armament</strong> research at level 5 and a <strong>Nuclear base</strong> building.</li>
                <li><strong>Uranium</strong> (very rare).</li>
                <li>A <strong>nuclear bomb</strong>, built on the <strong>Defense</strong> page: 500 uranium and 25,000 Bitcoins, 6 hours per bomb (sped up by the Weapons factory and Heavy industry). A planet stores at most as many bombs as its Nuclear base level.</li>
            </ul>
            <p><strong>Launching the strike</strong> — from the <strong>Spatial map</strong>, select the enemy planet, then "Send a nuclear missile". The game takes a bomb from one of your planets; it arrives in <strong>30 minutes</strong>, whatever the distance, and can't be cancelled. Targeting another galaxy requires Hyperspace technology. A planet protected by beginner status can't be targeted, and launching a strike during your own protection makes you lose it (the game asks for confirmation).</p>

            <h2 id="damage">What does a bomb that hits do?</h2>
            <p>The bomb <strong>destroys one building level</strong>, the most strategic ones first:</p>
            <ol>
                <li><strong>Metropolis</strong> — loss of 1 level: −80,000 workers of capacity (those beyond the new capacity disappear) and reduced worker production.</li>
                <li><strong>Large city</strong> — loss of 1 level: −25,000 workers of capacity, same rule.</li>
                <li><strong>Defensive fort</strong> (bunker) — loss of 1 level: reduced protection against plunder and −15,000 Legionnaires of capacity.</li>
                <li><strong>Barracks</strong> — loss of 1 level: −5,000 Legionnaires of capacity.</li>
                <li><strong>Slave camp</strong> — loss of 1 level.</li>
            </ol>
            <p>The bomb hits the first building present in this order; if the planet has none, it does no damage. Legionnaires beyond the new capacity also disappear. In every case, the bomb is consumed.</p>

            <h2 id="rules">Special rules</h2>
            <ul>
                <li>A bomb in flight <strong>cannot be intercepted</strong> by a fleet in orbit. It goes straight to its target.</li>
                <li>The only way to stop it: the defender's <strong>interceptor missile</strong>.</li>
            </ul>

            <h2 id="anti">The defense: the interceptor missile</h2>
            <p>If the target planet has at least one <strong>interceptor missile</strong>, the bomb is automatically neutralized:</p>
            <ul>
                <li>The bomb is <strong>destroyed</strong>.</li>
                <li><strong>1 to 3 interceptors</strong> are consumed (never more than the stock).</li>
                <li>Both players receive a report.</li>
            </ul>
            <p>Interceptor missiles are built on the <strong>Defense</strong> page: 10,000 niobium and 200 uranium, 3 hours each (Armament level 5 research and Nuclear base). A planet stores at most 4 per level of Nuclear base.</p>
            <p>Moral: a strategic base is always worth a few interceptors. Without them, it is vulnerable.</p>

    defense:
        title: "Defending your planets"
        category: "combat"
        order: 5
        tags: "defense,soldiers,mechs,turret,shield,large shield,bunker,defensive fort,orbital,tactical,deployment,stats,power,time,cost"
        summary: "The 3 layers of defense: orbital (turrets), tactical (deployment), ground (Legionnaires + Mechs)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="overview">The 3 layers of defense</h2>
            <ol>
                <li><strong>Orbital defense</strong> — turrets, shields, space base. They intercept the fleet before it lands.</li>
                <li><strong>Tactical deployment</strong> — a strategic choice that changes the retaliation of your troops on the ground.</li>
                <li><strong>Ground defense</strong> — Legionnaires, Mechs, workers (for invasions).</li>
            </ol>

            <h2 id="attack-mode">Enabling your planet's attack mode</h2>
            <p>If your planet has <strong>at least one turret</strong>, you can enable <strong>attack mode</strong>. In this mode, any foreign fleet stationed in orbit — except traders, members of your alliance and alliances linked to yours by a Defensive alliance — is engaged in an <strong>orbital battle</strong> 5 minutes after its arrival, whether or not it is itself in attack mode. A raid or invasion is engaged as soon as it arrives.</p>
            <ul>
                <li><strong>Victory</strong>: the enemy fleet is destroyed, your turrets lose the same fraction as the armor you lost, and you earn <strong>war points</strong> equal to its signature ÷ 100 (÷ 500 against a Cthulhu).</li>
                <li><strong>Defeat</strong>: all your turrets, shields, your space base and your entire production queue on the Defense page (Legionnaires, Mechs, bombs or interceptors not yet delivered included) are wiped out — troops already on the ground and your stocks of bombs and interceptors remain intact; attack mode <strong>turns off automatically</strong> (a planet without turrets can't keep it active), and the fleet continues to the ground combat if it's a raid or an invasion. The attacker earns no war points for razing your defenses.</li>
            </ul>
            <p>Without a turret, your shields and the space base are destroyed <strong>without even fighting</strong> as soon as an enemy raid or invasion arrives.</p>
            <p>Two places to enable it: a planet's <strong>Defense</strong> page, or the <strong>Planets</strong> page, which shows the state of each planet (a target icon next to its defenses, clickable to toggle) and offers <strong>"Enable all"</strong> / <strong>"Disable all"</strong> across the whole empire. The bulk toggle skips planets without turrets or already caught in a battle, and tells you how many were skipped.</p>
            <p><strong>Warning</strong>: enabling attack mode on a planet that an enemy fleet is already flying over triggers the orbital battle <strong>five minutes later</strong>. With the bulk toggle, several battles can start at once — the message tells you how many.</p>
            <p><strong>What the attacker brings with them.</strong> The fleet attacking your turrets fights with <strong>all its bonuses</strong>: its commander's alliance bonuses (missiles, lasers, plasma, armor, shield, accuracy) and the equipment bonuses of its embarked hero. This goes both ways: your own fleets keep their bonuses when you are the one assaulting a planet in attack mode, and the figures in orbital reports are on the same scale as those in space reports.</p>

            <h2 id="defenses-and-your-fleets">Your defenses also fire without attack mode</h2>
            <p>Attack mode is not the only way to make your turrets fire. As soon as one of your fleets — or an <strong>armed</strong> fleet of a member of your alliance — is in orbit of the planet when a space battle is triggered there, your defenses automatically join that battle, attack mode active or not (a planet with nothing to defend — no turret, no shield, no space base — never takes part in it). It's then a <strong>single battle</strong>: no separate second orbital battle behind it. In this battle, the armor bonus from your <strong>space base</strong> (+20%) benefits both your turrets and your shields, and the military affinity of your <strong>stationed hero</strong> strengthens the fire of your own turrets and can bring Intimidation or Tactician to your whole side, exactly like a fleet hero. Your turrets aim there with their own accuracy (average multiplier ×1.06, above what a fleet can reach), and they take <strong>real losses</strong> in it — proportional to the damage taken if your side wins, <strong>total</strong> (turrets, shields, space base, Defense page production queue, attack mode turned off) if your side falls. You earn your planet's share of <strong>war points</strong> every time your side wins this battle — even if you committed none of your own fleets to it.</p>
            <p>Consequence for your opponents: a planet guarded by one of your <strong>armed</strong> fleets (ship weapons) or an armed fleet of a member of your alliance (a lone probe or cargo ship doesn't count) can't be raided or invaded without a prior battle, whether the attacker arrives fresh or clicks "Raid"/"Invade" from orbit — and this battle never starts against a peace partner, a pact partner, a defensive alliance, your own alliance or on a PvE server.</p>
            <p>With no fleet in orbit and no attack mode, your turrets don't fire: a raid or invasion goes straight to ground combat.</p>
            <p><strong>Didn't commit any of your own fleets?</strong> You still receive a dedicated report telling you whether your defenses held or were wiped out, with detailed turret losses, and with your share of war points if you won: you're never left in the dark about your planet's fate.</p>

            <h2 id="orbital-detail">Orbital combat in detail</h2>
            <p>Turrets fire on the enemy fleet at the pace of the rounds (100 at most). The <strong>Space base</strong> adds +20% to the armor of all defenses. Shields add 50,000 (Shield) or 600,000 (Large shield) points to the planet's armor: the larger your total armor, the smaller the share lost — and therefore the share of turrets destroyed.</p>
            <p>Your turrets fire <strong>from the first round</strong>, whatever fleet faces them: a ship's shield never repels their opening salvo. That shield is a reserve that takes damage until exhausted. Each salvo gets through it right away up to its <strong>piercing power</strong> (plasma ×4, laser ×2, missiles ÷ 7); the rest wears down the shield, and what overflows it hits the hull. A defense made up only of missile launchers is therefore at a disadvantage against a fleet with a big shield — but it fires, it causes losses and it leaves debris.</p>
            <p>Even if the enemy fleet wins, its screen of hunters doesn't protect it indefinitely: your turrets inflict real losses on its heavier ships too, in proportion to the damage it takes — at worst for it, 95% of its starting armor. Defending therefore always costs the attacker something, even if it wins. After 100 rounds, the side that keeps the most armor wins (the assailant in case of a tie).</p>
            <p>In this orbital battle, neither the +20% alliance policy bonus nor the "planetary defense" alliance bonus apply: they only play in battles where your defenses fight alongside a fleet.</p>

            <h2 id="deployment">Tactical deployment</h2>
            <p>Each planet can choose a <strong>tactical deployment</strong>, on the <strong>Defense</strong> page, and change it freely at any time. It is <strong>invisible to the attacker</strong> — it's your hidden card.</p>
            <table>
                <thead>
                    <tr><th>Deployment</th><th>Effect</th><th>Your garrison's casualty order</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Balanced</strong></td><td>No bonus or penalty.</td><td>Legionnaires, then Mechs, then workers.</td></tr>
                    <tr><td><strong>Fortified</strong></td><td>Your garrison's retaliation gains 30% then loses 20%: in total <strong>+4%</strong> damage dealt to the assailant. Your units don't become harder to kill.</td><td>As Balanced.</td></tr>
                    <tr><td><strong>Guerrilla</strong></td><td>In the retaliation, each worker counts 2.5 times (+150%) and each Legionnaire half as much (−50%).</td><td>Workers first, then Legionnaires, then Mechs.</td></tr>
                    <tr><td><strong>Last Stand</strong></td><td>+50% retaliation as soon as your troops fall below 30% of their starting strength (in number of units), until the end of the battle.</td><td>Legionnaires, then workers, then Mechs.</td></tr>
                    <tr><td><strong>Scorched Earth</strong></td><td>No combat bonus. If you lose, raid or invasion, 50% of your remaining niobium, water and uranium is destroyed, including the share protected by the Defensive fort.</td><td>As Balanced.</td></tr>
                </tbody>
            </table>
            <p>Workers only fight in an invasion.</p>

            <h2 id="ground">Ground combat</h2>
            <p>It's played over <strong>10 rounds at most</strong>. Each round, the assailant deals a tenth of its attack power to your garrison, which hits back with a tenth of its defense power. The assailant only wins if it eliminates your entire garrison while keeping at least one Legionnaire. If nobody wins within 10 rounds, <strong>the attacker is repelled</strong> (terrain advantage).</p>

            <h2 id="troops">Ground units</h2>
            <table>
                <thead>
                    <tr><th>Unit</th><th>Role</th><th>Notes</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionnaires</strong></td><td>Attack and defense (power 6 in defense).</td><td>+5% defense per level of Barbed wire (up to +25%).</td></tr>
                    <tr><td><strong>Mechs</strong></td><td>Heavy defense (power 2,200).</td><td>Max 500 per planet. Maintenance of 2 Bitcoins per day on the ground, 100 on board.</td></tr>
                    <tr><td><strong>Workers</strong></td><td>Passive defense (power 1).</td><td>Only against invasions, not raids.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Resources used to produce your defenses</h2>
            <p>Like the Shipyard, defense production draws first from the <strong>planet's</strong> resources, then from the <strong>cargo of fleets stationed in orbit</strong>. You can therefore keep recruiting even if the ground stock is low, as long as loaded fleets are present above the planet.</p>

            <h2 id="installations">Orbital facilities and defenses</h2>
            <ul>
                <li><strong>Turrets</strong> — Missile launcher, Laser turret, Heavy laser turret, Gauss cannon, Ion artillery, Plasma launcher. Varied to counter different types of fleets (see the table below).</li>
                <li><strong>Shield</strong> — +50,000 armor, permanent (5,000 niobium and 5,000 water, 5 hours of construction).</li>
                <li><strong>Large shield</strong> — +600,000 armor for <strong>12 hours</strong> from its activation (150,000 niobium and 150,000 water at each activation).</li>
                <li><strong>Space base</strong> — +20% armor to turrets and shields (50,000 niobium and 50,000 water, 1 hour).</li>
            </ul>

            <h2 id="temps">Costs and build times</h2>
            <table>
                <thead>
                    <tr><th>Defense</th><th>Cost</th><th>Time per unit</th><th>Armor</th><th>Weapons</th><th>Prerequisites</th></tr>
                </thead>
                <tbody>
                    <tr><td>Missile launcher</td><td>12 niobium, 9 water</td><td>2 s</td><td>10</td><td>9 missile</td><td>Missile weapon lvl 1</td></tr>
                    <tr><td>Laser turret</td><td>13 niobium, 12 water</td><td>2.4 s</td><td>15</td><td>6 laser</td><td>Laser weapon lvl 1</td></tr>
                    <tr><td>Heavy laser turret</td><td>23 niobium, 23 water</td><td>4.4 s</td><td>25</td><td>12 laser</td><td>Laser weapon lvl 3, Weapons factory</td></tr>
                    <tr><td>Gauss cannon</td><td>50 niobium, 25 water</td><td>7.2 s</td><td>50</td><td>24 missile</td><td>Missile weapon lvl 3, Weapons factory</td></tr>
                    <tr><td>Ion artillery</td><td>30 niobium, 45 water</td><td>7.2 s</td><td>50</td><td>8 laser, 4 plasma</td><td>Missile weapon lvl 3, Laser weapon lvl 3, Heavy industry</td></tr>
                    <tr><td>Plasma launcher</td><td>15 niobium, 60 water</td><td>7.2 s</td><td>50</td><td>8 plasma</td><td>Plasma weapon lvl 1, Heavy industry</td></tr>
                </tbody>
            </table>
            <p>These times are divided by the planet's defense production speed: ×1, +0.4 per level of <strong>Weapons factory</strong> and +0.6 per level of <strong>Heavy industry</strong>. Example: 1,000 Missile launchers take 33 minutes without a factory, under 10 minutes with a level 3 Weapons factory and a level 2 Heavy industry (×3.4). Server speed doesn't change these times. Production goes one line after another and units arrive as they're completed.</p>
            <p>Same speed-up for troops and nuclear: Legionnaire 1 s, Mech 100 s, interceptor missile 3 h, nuclear bomb 6 h. The Shield (5 h) and the Space base (1 h) have a fixed time; the Large shield is active as soon as it's activated, for 12 hours.</p>

            <h2 id="stats-defensives">Reading your planet's power</h2>
            <p>The <strong>Defense</strong> page has two tabs. The second, <strong>Defense stats</strong>, sums up what the planet is really worth: the combined armor, missiles, lasers and plasmas of all your turrets, the contribution of each structure, the effect of the shield, large shield and space base on the armor actually opposed to a fleet, and the power of your ground defense. It's the fastest way to spot the lagging stat before starting a new round of construction.</p>
            <p>A reading note: the pie chart and the bars cover the armor of <strong>the structures alone</strong>. Flat shield bonuses appear separately, in the modifiers, because they would otherwise crush any comparison between your weapons.</p>

            <h2 id="bunker">The Defensive fort against plunder</h2>
            <p>The <strong>Defensive fort</strong> (bunker) protects <strong>5% of max storage per level</strong> against raids. A level 5 Defensive fort already shelters 25% of your niobium and water reserves. Uranium is protected up to 5% of its stock per level. Warning: with the Scorched Earth deployment, half of what remains is destroyed if you lose, protected share included.</p>

            <h2 id="upkeep">Watch the maintenance cost</h2>
            <p>Everything <strong>in a fleet</strong> — in flight or stationed — costs far more than on the ground: a Mech goes from 2 to 100 Bitcoins per day (×50), a Legionnaire from 0.1 to 0.6, a ship from its signature ÷ 12 to its signature ÷ 2. Put back on the ground whatever has no mission.</p>

    embargo:
        title: "Embargo and famine"
        category: "combat"
        order: 6
        tags: "embargo,famine,blockade,siege,planet,food,rations,resupply,signature,threshold"
        summary: "Starve a planet before invading it: the blockade, the famine that sets in, and how to survive it."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principle">The principle</h2>
            <p>An <strong>embargo</strong> is a planetary siege. You keep a big fleet in attack mode in orbit of an enemy planet; deliveries are cut off, rations run out, the population suffers. When the planet is weakened, you move in for the assault.</p>

            <h2 id="consumption">Reminder: food</h2>
            <p>Only your <strong>workers</strong> consume rations: 1 ration per hour for 500 workers (150,000 workers = 300 rations per hour). Legionnaires and Mechs don't eat, but also die when famine sets in. If your reserves fall to <strong>0</strong>, it's <strong>famine</strong>.</p>
            <p>Rations are <strong>carried in the hold</strong>: load some on one planet, unload them elsewhere to resupply. As long as one of your fleets is <strong>docked</strong> (neither in flight nor in combat) above your planet, its rations top up the granary — and a siege drains them like everything else: the hold is not a safe.</p>

            <h2 id="famine">Famine (outside an embargo)</h2>
            <p>When rations run short, losses follow in <strong>3 phases</strong>:</p>
            <ul>
                <li><strong>Phase 1 (0–3 h)</strong> — about 3% of workers per hour. Time to react.</li>
                <li><strong>Phase 2 (3–8 h)</strong> — about 6% of workers and 2% of Legionnaires per hour: Legionnaires start to desert.</li>
                <li><strong>Phase 3 (beyond 8 h)</strong> — collapse: about 11% of workers, 5% of Legionnaires and 2% of Mechs per hour.</li>
            </ul>
            <p>A floor of <strong>5,000 workers</strong> prevents total disappearance. Without resupply, a planet reaches it in about 24 hours with 50,000 workers, 30 hours with 100,000, 33 hours with 150,000. As soon as a ration returns to the granary, famine stops and the phases start over from zero. A report warns you at each new phase.</p>

            <h2 id="trigger">How to trigger an embargo</h2>
            <p>An embargo activates automatically (the game checks every minute) when:</p>
            <ul>
                <li>the target planet belongs to a player (AI planets and Cthulhu bases are never subject to it);</li>
                <li>enemy fleets are <strong>docked in orbit</strong> there — neither in flight nor already engaged in a scheduled battle — and in <strong>attack mode</strong> (which requires ship weapons);</li>
                <li>the <strong>cumulative thermal signature</strong> of these fleets reaches at least <strong>10,000</strong>.</li>
            </ul>
            <p>All the enemy fleets present add up, even if they belong to different players. Only fleets of the owner's alliance and of alliances linked to it by a <strong>Defensive alliance</strong> are excluded (a Non-aggression pact or a Peace agreement doesn't protect), as well as traders. Every ship in these fleets counts, cargo ships and probes included; each ship's signature is shown at the Shipyard.</p>
            <table>
                <thead>
                    <tr><th>Ship</th><th>Signature</th><th>Number for 10,000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Hunter</td><td>1</td><td>10,000</td></tr>
                    <tr><td>Corvette</td><td>7</td><td>1,429</td></tr>
                    <tr><td>Frigate</td><td>20</td><td>500</td></tr>
                    <tr><td>Battleship</td><td>40</td><td>250</td></tr>
                    <tr><td>Cruiser</td><td>56</td><td>179</td></tr>
                    <tr><td>Battlecruiser</td><td>64</td><td>157</td></tr>
                    <tr><td>Destroyer</td><td>270</td><td>38</td></tr>
                    <tr><td>Mother ship</td><td>4,000 (−10% for its whole fleet)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>A Mother ship reduces the signature of the whole fleet carrying it by 10%: 3 Mother ships alone make 12,000 − 10% = 10,800, enough for the threshold, but 2 aren't enough (7,200). The numbers in the table hold for a fleet without a Mother ship; you can of course mix types.</p>
            <p>As soon as the besieging fleets' signature drops back below 10,000 (departure, destruction or attack mode turned off), the blockade is lifted.</p>
            <p>A raid or invasion fleet marked "in attack" by the merged battle described in the <em>Defending your planets</em> article keeps that marker if it survives: if it stays in orbit, it counts in this signature just like any hostile fleet.</p>

            <h2 id="effects">What the besieged planet suffers</h2>
            <ul>
                <li>An extra <strong>ration drain</strong> every hour: your workers ÷ 7 (150,000 workers = 21,429 rations per hour), taken from the granary then from the holds of your docked fleets.</li>
                <li><strong>Ration production</strong> reduced by 30%.</li>
                <li><strong>Niobium and water production</strong> reduced by 20%.</li>
                <li><strong>Worker births</strong> halved.</li>
                <li><strong>Market blocked</strong>: no more automatic sales to traders.</li>
                <li><strong>Deliveries blocked</strong>: only your fleets and those of your alliance members can unload on the planet; others leave with their cargo.</li>
                <li><strong>Heroes blocked</strong>: impossible to assign a hero to the planet or remove one from it.</li>
            </ul>

            <h2 id="famine-embargo">Famine under embargo: it's worse</h2>
            <p>If rations drop to 0 <strong>during</strong> an embargo, there are no more phases: from the first hour, the planet loses <strong>8%</strong> of its workers, <strong>3%</strong> of its Legionnaires and <strong>3%</strong> of its Mechs every hour, and the embargo drain keeps emptying any resupply that arrives. The floor of 5,000 workers still applies.</p>

            <h2 id="timings">How long can you hold out?</h2>
            <p>Under embargo, with no production or resupply:</p>
            <table>
                <thead>
                    <tr><th>Planet profile</th><th>Famine begins</th><th>Floor of 5,000 workers reached</th></tr>
                </thead>
                <tbody>
                    <tr><td>Small (50,000 workers, 100,000 rations)</td><td>~14 hours</td><td>~1.7 days</td></tr>
                    <tr><td>Medium (150,000 workers, 800,000 rations)</td><td>~1.5 days</td><td>~3.2 days</td></tr>
                    <tr><td>Fortress (200,000 workers, 2,000,000 rations)</td><td>~2.9 days</td><td>~4.7 days</td></tr>
                </tbody>
            </table>

            <h2 id="defense">How to resist an embargo</h2>
            <ul>
                <li><strong>Destroy the besieging fleet</strong> to lift the blockade.</li>
                <li><strong>Bring in resupply</strong> — your fleets and those of your alliance members can always unload ("Unload and return" mission).</li>
                <li><strong>Evacuate</strong> — your <em>outgoing</em> fleets aren't blocked, you can empty your resources in an emergency.</li>
                <li><strong>Build Agricultural silos</strong> and store rations <em>before</em> things go bad.</li>
                <li><strong>Ask your alliance for help</strong> to break the siege together.</li>
            </ul>

            <h2 id="reports">Reports during an embargo</h2>
            <p>Every hour, you (and each player whose fleet is besieging the planet) receive a report in the <strong>Report</strong> menu, <strong>Battles</strong> tab: time elapsed, rations remaining, losses suffered. A final report announces the lifting of the blockade. On the <strong>Planets</strong> page, each planet's card also shows its Production, Consumption, Embargo drain, Balance and estimated Autonomy.</p>

    combat_stats:
        title: "Understanding troop power"
        category: "combat"
        order: 7
        tags: "power,bonus,combat,politics,calculation,barbed wire,accuracy,mechs"
        summary: "How the power of your units compares, and what boosts it."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="ground">Ground power</h2>
            <p>Exact values, without bonuses:</p>
            <table>
                <thead>
                    <tr><th>Unit</th><th>Power</th><th>Role</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mech</strong></td><td>2,200 in defense</td><td>Pillar of defense: one Mech is worth about 367 Legionnaires. Maximum 500 per planet. It only fights in defense: on board a fleet, it doesn't take part in the assault.</td></tr>
                    <tr><td><strong>Legionnaire (defense)</strong></td><td>6, +5% per level of Barbed wire</td><td>The heart of the garrison.</td></tr>
                    <tr><td><strong>Legionnaire (attack)</strong></td><td>5 to 7 per round in invasion, 5 to 6 in a raid (drawn at random each round)</td><td>The only unit that attacks on the ground: a raid is slightly less unpredictable than an invasion.</td></tr>
                    <tr><td><strong>Worker (defense)</strong></td><td>1</td><td>Only in invasion. 200,000 workers weigh as much as about 91 Mechs.</td></tr>
                </tbody>
            </table>
            <p>In each round (10 at most), the assailant deals a tenth of its attack power to the garrison, which hits back with a tenth of its defense power. Damage kills units according to their power: it takes 6 points for a defending Legionnaire without bonuses, 2,200 for a Mech, 1 for a worker. Example: 10,000 Legionnaires in invasion (average roll of 6) deal about 6,000 points per round, enough to kill 1,000 Legionnaires without bonuses, or fewer than 3 Mechs.</p>
            <p><strong>Barges</strong> don't fight: they carry 1,000 Legionnaires each (+25% per level of the "Planned invasions" political research).</p>

            <h2 id="bonuses">What increases your power</h2>
            <ul>
                <li><strong>Barbed wire research</strong> — +5% defense per level for your Legionnaires (5 levels, i.e. +25% at most).</li>
                <li><strong>Political researches</strong> ("Political" tab of the Research page) — Military power (+10% per level to Legionnaires' attack and defense), Mech armor (+10% per level to Mechs' defense), Ideological reinforcement (+20% per level to workers' defense), Planned invasions (+25% capacity per barge and per level), Improved armaments (+10% per level to ships' missiles and lasers), Ship armor (+10% ship armor per level).</li>
                <li><strong>Alliance improvements</strong> — in space combat, up to +5% per type of ship weapon, armor, shield and accuracy, and up to +10% for planetary defenses.</li>
                <li><strong>Tactical deployment</strong> — a defender's choice that changes its garrison's retaliation and the order of its casualties (see <em>Planet invasion</em>).</li>
                <li><strong>Military hero</strong> — direct attack and defense bonus, for the assaulting fleet's hero as well as the one stationed on the planet.</li>
                <li><strong>Items</strong> equipped on the hero.</li>
            </ul>
            <p>The <strong>Military expansion</strong> research gives no combat bonus: it unlocks the Barracks (level 1), the Defensive fort (level 3), then the Barbed wire and Armored units (Mechs) researches.</p>

            <h2 id="faction">Political bonus (space combat)</h2>
            <p>The weapons bonus in space combat comes from your <strong>alliance's policy</strong>. Each regime beats its rival: <strong>The Balance of Worlds</strong> beats <strong>The Silent Rampart</strong>, which beats <strong>The Hammer of Stars</strong>, which beats <strong>The Balance of Worlds</strong>.</p>
            <p>When the <strong>attacker's</strong> policy beats the defender's, all its weapons (missiles, lasers, plasma) gain <strong>+20%</strong> for that battle. The bonus only applies to the assailant: the defender relies on its planetary defenses. It holds in fleet-versus-fleet combat only, not against turrets alone (attack-mode orbital combat) nor on the ground.</p>

            <h2 id="precision">Accuracy and combat rolls</h2>
            <p>In space combat, each side fires <strong>one salvo per round</strong>. A random roll, drawn between the side's accuracy and 100 then divided by 80, modulates the salvo's damage from <strong>×0.3 to ×1.2</strong>. No salvo misses: high accuracy doesn't make your best hits stronger, it eliminates the bad rolls.</p>
            <p>A fleet's aim is never displayed as a percentage: everywhere — Shipyard, fleet management page, Defense stats tab of the Defense page and battle reports — the game shows the <strong>average damage multiplier</strong> it produces:</p>
            <ul>
                <li><strong>×0.66</strong> without any investment: each salvo falls between ×0.3 and ×1.2;</li>
                <li><strong>×0.94</strong> at full aim: each salvo falls between ×0.63 and ×1.2;</li>
                <li><strong>×1.06</strong> for a planet's defenses: each salvo falls between ×0.88 and ×1.2 — better than a fleet at full aim.</li>
            </ul>
            <p>This level depends on the <strong>customization</strong> points invested in accuracy for each ship model (40 points/day) and is specific to it: spending your points elsewhere, on the armor or weapons of the same model, never lowers it. Alliance and hero accuracy bonuses add on, without ever exceeding full aim. When several fleets fight together, the side uses the average of their aims.</p>
            <p>Against an AI-led opponent (bot), its aim never drops below a fixed floor (average multiplier ×0.81): a bot that has really invested exceeds it, and a sufficiently invested player can match or exceed it. Cthulhu hordes always aim at ×0.94.</p>

    battle_reports:
        title: "Reading a battle report"
        category: "combat"
        order: 8
        tags: "report,combat,victory,defeat,analysis"
        summary: "After every battle, a detailed report. Here is how to decode it to hit harder next time."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="where">Where to find them</h2>
            <p>All battle reports arrive in the <strong>Report</strong> menu. The <strong>Battles</strong> tab groups space and orbital battles, planetary defenses, nuclear, embargo and famine; the <strong>Invasions</strong> tab groups raids and invasions; battles against the Cthulhus have their own <strong>Cthulhu</strong> tab.</p>

            <h2 id="types">Types of battle reports</h2>
            <ul>
                <li><strong>Space combat</strong> — two fleets crossed paths.</li>
                <li><strong>Orbital combat</strong> — your planetary defenses intercepted a fleet.</li>
                <li><strong>Planetary defenses</strong> — merged battle in which you committed none of your own fleets: your turrets, shields and space base held, or were destroyed.</li>
                <li><strong>Unarmed fleet destroyed</strong> — a side without ship weapons (cargo ships, probes, recyclers) was destroyed without a fight.</li>
                <li><strong>Raid</strong> — plunder attempt (on your side or against you).</li>
                <li><strong>Invasion</strong> — attempt to take a planet.</li>
                <li><strong>Nuclear</strong> — bomb sent, received, or intercepted.</li>
                <li><strong>Embargo</strong> — hourly report during a siege, and a final one when it lifts.</li>
                <li><strong>Famine</strong> — sent at each new famine phase (outside an embargo).</li>
            </ul>

            <h2 id="content">What a report contains</h2>
            <ul>
                <li><strong>Forces engaged</strong> — starting armor, shield, weapons of each side, and the composition of each fleet. Aim doesn't appear there as a percentage, but as the <strong>average damage multiplier</strong> it produces (×0.66 with no investment at all, ×0.94 at full aim, ×1.06 for a planet's defenses): no shot ever misses, better aim raises the floor of your damage.</li>
                <li><strong>Salvos</strong> — the number of salvos fired by that side, those that went through the opponent's shield, and whether its own shield was pierced or held.</li>
                <li><strong>Shield charge</strong> — for a fleet block, the charge percentage at the start and end of the battle, with its total capacity: your shield doesn't systematically return to 100% from one battle to the next, it recharges gradually (see the <em>Space combat</em> article).</li>
                <li><strong>Armor remaining</strong> — what's still standing, and its share of the starting armor. An annihilated side shows instead the <strong>surplus damage</strong> taken beyond its armor: that's your margin of victory.</li>
                <li><strong>Damage taken</strong> — two counters per side: <strong>hull</strong> (what the shield didn't stop) and <strong>shield</strong> (what the shield absorbed). Your losses stem only from the hull.</li>
                <li><strong>Losses</strong> — ship by ship, on each side.</li>
                <li><strong>Detailed planetary defenses</strong> — turret losses, plus your Shield, Large shield and Space base when you have them, with the defense score and the planet's "Attack" tag for a merged battle.</li>
                <li><strong>Plundered resources</strong> (for raids) and <strong>debris generated</strong> — to be recycled!</li>
                <li><strong>War Points earned</strong> and final result.</li>
            </ul>

            <h2 id="learn">How to learn from it</h2>
            <ul>
                <li>Look first at the <strong>damage taken</strong>: the "hull" line counts everything your shield didn't stop (the share that pierces it, then everything once it's empty); the "shield" line, what your shield absorbed — that costs no ship, only charge, which comes back by 10% every 3 hours.</li>
                <li>Compare the two <strong>damage multipliers</strong>: it's the only figure directly comparable from one side to the other. Then look at the <strong>armor remaining</strong> — winning while keeping 5% of your armor and winning while keeping 70% are not the same. A big surplus on the opponent's side means you overpaid for the victory.</li>
                <li>Losses among your <strong>hunters</strong> are normal even when your shield holds: with no shield, they take their share of the hull in proportion to their armor, plus up to half of the hits meant for your heavy ships — that's their role as a screen.</li>
                <li>Lots of <strong>salvos that went through the opponent's shield</strong>? Build up plasma (×4 against shields) to pierce faster.</li>
                <li><strong>100 rounds reached</strong>: the side that keeps the most armor wins (the attacker in case of a tie) — if this happens to you on attack, your fleet lacks power or accuracy.</li>
                <li><strong>Keep your important reports</strong> (don't delete them) and use "Generate share link" to show them to your alliance: they serve as evidence in debates.</li>
            </ul>

    combat_simulator:
        title: "Combat simulator"
        category: "combat"
        order: 9
        tags: "simulator,combat,simulation,fleet,losses,estimate,report"
        summary: "Estimate your risks before attacking: replay a battle a thousand times against a fleet observed in a report, with the game's real engine."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="purpose">What it's for</h2>
            <p>The <strong>Combat simulator</strong> tab of the Fleets page estimates what you risk before attacking. It replays <strong>1,000 times</strong> a battle between one of your fleets and an opposing fleet, with the <strong>game's real engine</strong> — same formulas, same random rolls. Nothing is actually committed: no ship moves, none dies.</p>

            <h2 id="source">The source: a battle report</h2>
            <p>The opposing fleet comes from one of your <strong>recent space battle reports</strong> (those that show the "Damage taken" line): they're the only honest sources, because they contain the real power of the observed side, bonuses included. The simulator offers you the 30 most recent; orbital, raid or invasion reports aren't used as a source. An espionage report only gives numbers of ships, without their real stats — the simulation would be misleading, which is why it isn't offered.</p>
            <p>Choose the report, the side to face (one of the report's two armadas), then one of your armed fleets, wherever it is. You always simulate as the <strong>attacker</strong>, away from home: without your planetary turrets or shields, with your real bonuses (hero, alliance, policy compared with the opponent's current alliance) and the shield your fleet has <strong>right now</strong> — a worn fleet is simulated worn.</p>

            <h2 id="reading">Reading the result</h2>
            <ul>
                <li><strong>Win rate</strong> — the share of the 1,000 draws in which you win.</li>
                <li><strong>Loss range per ship</strong> (minimum, median, maximum) — on winning draws only: in case of defeat, your fleet would be entirely destroyed.</li>
                <li><strong>An example run</strong> — a median winning draw, presented like a report and clearly marked "SIMULATION".</li>
            </ul>

            <h2 id="limits">Limits to keep in mind</h2>
            <ul>
                <li>The opposing fleet is the one <strong>observed on the report's date</strong>: it may have been rebuilt, upgraded or reinforced since.</li>
                <li>The opposing hero's active talents (Intimidation, Tactician) are not replayed; its passive bonuses are already included in the report's figures. Its planetary defenses only count if the source report was a battle at its home (as they were that day): if you attack it at home from a report delivered elsewhere, its turrets aren't there.</li>
                <li><strong>No simulation as a defender</strong>: your fleet is always the attacker, away from home. To gauge a threat, simulate your fleet against the enemy fleet from your report: your planetary turrets and shields aren't counted (a real battle at your place will be more favorable), but the enemy doesn't get the +20% it would have on attack if its regime beats yours either.</li>
                <li>Limit of <strong>20 simulations per day</strong> (reset at midnight, Paris time; the remaining counter is displayed): the simulator informs a decision, it doesn't replace the risk of battle.</li>
            </ul>

    colonization:
        title: "Colonizing a new planet"
        category: "planet"
        order: 1
        tags: "colonization,planet,colonizer,terraforming,uninhabited,cap"
        summary: "Expand your empire by colonizing uninhabited planets: how to do it, the planet cap set by Terraforming, available sizes."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="why">Why colonize?</h2>
            <ul>
                <li><strong>More production</strong>: each planet has its own economy.</li>
                <li><strong>More parallel construction queues</strong>.</li>
                <li><strong>Less risk</strong>: your eggs are no longer in the same basket.</li>
                <li><strong>Strategic positions</strong>: proximity to traders, allies, targets.</li>
            </ul>

            <h2 id="steps">How to colonize</h2>
            <p>You colonize an <strong>uninhabited planet</strong>: on the map, it's named "Uninhabited". An "Empty" slot (with no planet) can't be colonized.</p>
            <ol>
                <li>Check that you have room left: you can have <strong>2 planets + 1 per level of Terraforming</strong> (see below). You start with <strong>one colonizer</strong> on the ground on your planet: your 2nd planet therefore requires no research.</li>
                <li>To build more colonizers, research <strong>Terraforming</strong> level 1. They're built at the Shipyard: 5,500 niobium, 7,000 water, 2,000 workers and 5 Legionnaires each.</li>
                <li>Create a fleet containing the colonizer (<em>Fleets</em> page, or the map's <em>Create fleet</em> button).</li>
                <li>On the <em>Spatial map</em>, click the uninhabited planet, then <em>Interaction</em>. Choose the fleet, the <strong>Colonize</strong> mission, then <em>Send</em>. The flight is paid in Bitcoins.</li>
            </ol>
            <p>If your fleet is already in orbit of an uninhabited planet, the <em>Colonize</em> button appears directly on its sheet.</p>
            <p>The colonizer carries no resources. To help the colony, add loaded cargo ships to the fleet, then unload them once you arrive (<em>Unload all</em>).</p>
            <p>On arrival, one colonizer is consumed and the planet is founded under the name "Colony". You receive a report, and the planet appears in the planet selector of the top bar. Rename it from the <strong>Planets</strong> page.</p>

            <h2 id="initial">What it has at the start</h2>
            <p>A freshly colonized planet starts with <strong>200 niobium, 150 water, 2,500 workers and 20 Legionnaires</strong>. Everything else has to be built: a planet that has never been inhabited has no buildings, not even a Shipyard.</p>

            <h2 id="limit">How many planets at most?</h2>
            <p>You can own <strong>2 planets + 1 per level of Terraforming</strong> (18 levels at most). Your moons don't count.</p>
            <table>
                <thead>
                    <tr><th>Terraforming</th><th>Max planets</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>In an alliance of the <em>The Balance of Worlds</em> regime, the <strong>Spreading Democracy</strong> alliance research adds 1 colonizable planet per level (5 levels, i.e. up to 25 planets).</li>
                <li>For <strong>invasions</strong>, the cap is 2 + Terraforming + the level of <strong>Empire without borders</strong> (alliance research of the <em>The Hammer of Stars</em> and <em>The Silent Rampart</em> regimes, 5 levels). If you invade beyond that, the conquered planet becomes a Cthulhu base instead of coming to you.</li>
                <li>In <em>Search &amp; Destroy</em>, <em>Domination</em> and <em>Battle Royale</em> modes, all researches are at maximum from the start: 20 planets right away.</li>
            </ul>

            <h2 id="choice">Where to colonize?</h2>
            <ul>
                <li>Near a <strong>trader</strong>: easy economy by sending cargo ships.</li>
                <li>Near your <strong>allies</strong>: mutual defense.</li>
                <li>On a planet with <strong>lots of land</strong>: size doesn't change production, but gives more room to build. On the map, the bigger a planet's icon, the more land it has.</li>
                <li>Avoid isolating yourself too far from everything: longer trips, complicated resupply.</li>
            </ul>
            <p>There is <strong>no size limit</strong>: any uninhabited planet can be colonized, small or large, as long as you have room left. Original sizes of free planets:</p>
            <table>
                <thead>
                    <tr><th>Where</th><th>Land</th><th>Space</th></tr>
                </thead>
                <tbody>
                    <tr><td>Systems at the edge of the galaxy (1 to 9, 92 to 99, and those ending in 0 or 1)</td><td>80 – 95 (a few of 25)</td><td>2 – 21 (5 for those of 25)</td></tr>
                    <tr><td>Systems 45, 46, 55 and 56 (center)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>All other systems</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>The biggest ones, in the center, are guarded by a massive alien horde: a colonizer sent alone there would be destroyed. Once the planet is yours, the Floating city adds up to 50 land and the Orbital station up to 25 space (<em>Territorial expansion</em> research, see <em>Managing a planet</em>).</p>

    planet_types:
        title: "Everything you find on the map"
        category: "planet"
        order: 2
        tags: "planet,uninhabited,moon,sun,trader,alien,debris,asteroid,cthulhu,colonization"
        summary: "The different objects visible on the galactic map and what you can do with them."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">The 8 types of objects</h2>
            <table>
                <thead>
                    <tr><th>Type</th><th>Description</th><th>Possible actions</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Inhabited planet</strong></td><td>Belongs to a player (or a bot), who builds, produces and stations troops there.</td><td>Probe, raid, invade, nuclear strike, attack fleets in orbit.</td></tr>
                    <tr><td><strong>Uninhabited planet</strong></td><td>Free planet, named "Uninhabited" on the map. The bigger its icon, the more land it has.</td><td><strong>Colonize.</strong></td></tr>
                    <tr><td><strong>Moon</strong></td><td>Created by a Lunar on an empty slot rich in debris. Produces 20 rations per minute.</td><td>Raid or invade with a fleet in orbit, nuclear strike, attack fleets in orbit. A moon can't be probed.</td></tr>
                    <tr><td><strong>Sun</strong></td><td>Always at position 13 of every system. Can't be colonized.</td><td>None.</td></tr>
                    <tr><td><strong>Empty slot</strong></td><td>"Empty" position, with no planet. Can't be colonized.</td><td>Create a moon (if it holds at least 2M niobium and 2M water in debris), deploy a radar, deploy a jammer.</td></tr>
                    <tr><td><strong>Trader</strong></td><td>NPC that can be neither raided nor invaded. It buys your resources for Bitcoins.</td><td>Sell (<em>Unload and return</em> mission).</td></tr>
                    <tr><td><strong>Alien / Cthulhu base</strong></td><td>Hive base, defended by a permanent garrison.</td><td>Invade to liberate it (uranium, war points and a drop in the universe's Threat).</td></tr>
                    <tr><td><strong>Asteroid field</strong></td><td>Appears on its own: niobium, water or uranium. Refills every 7 to 40 hours and is often guarded by aliens.</td><td>Recycle.</td></tr>
                </tbody>
            </table>
            <p>After a battle, <strong>debris</strong> (niobium and water) can also float on any position, planets included: an icon marks it. See the <em>Recycling</em> article.</p>

            <h2 id="spot">Spotting them on the map</h2>
            <p>Each type has its icon, and a planet's size on the map reflects its land. Click (or tap) an object to open its sheet: owner, exact land and space (if the position is within range of your radars), any debris. The sheet's <em>Interaction</em> button gives access to actions and to sending a fleet; it appears as soon as you have at least one idle fleet.</p>

            <h2 id="moons">Special case: moons</h2>
            <p>Moons are created with a special ship, the <strong>Lunar</strong> (sometimes called Moon Maker), on an empty slot holding at least 2M niobium and 2M water in debris. A moon produces a fixed amount of <strong>20 rations per minute</strong> (1,200 per hour before bonuses): as much as a level 7 to 8 Agricultural field on a planet. Its rations stay on the moon: carry them by cargo ship to planets that lack them. See the <em>Moons</em> article.</p>

    planet_management:
        title: "Managing a planet"
        category: "planet"
        order: 3
        tags: "management,planet,production,capacity,specialization,land,floating city,orbital station,hero"
        summary: "How to optimize production, organize your space, and possibly specialize a planet."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basics">The basics to master</h2>
            <ul>
                <li><strong>Production levels</strong>: regularly upgrade the Niobium mine, the Water extractor and the Agricultural field.</li>
                <li><strong>Storage</strong>: without enough storage (Niobium warehouse, Water reservoir, Agricultural silo), production caps out and stops.</li>
                <li><strong>Population</strong>: the Large city (+25,000 maximum workers per level) and the Metropolis (+80,000) raise your worker cap and the speed at which they arrive; the Slave camp adds 2,500 spaces per level.</li>
                <li><strong>Minimal defense</strong>: a Defensive fort and a few Mechs are the basics.</li>
            </ul>

            <h2 id="optimize">Optimizing a planet</h2>
            <ol>
                <li>Build production buildings <strong>in pairs</strong> (Mine and Extractor often go up together).</li>
                <li>Short on room? Research <strong>Territorial expansion</strong> (available after Terraforming level 18), then build:
                    <ul>
                        <li>the <strong>Floating city</strong> (Territorial expansion level 1): +10 land per level;</li>
                        <li>the <strong>Orbital station</strong> (level 2): +5 space per level.</li>
                    </ul>
                    Each goes up to level 5 and is paid in war points: 2,000 × the target level (30,000 war points for all 5 levels). Otherwise, destroy a building that has become useless.</li>
                <li>Keep an eye on <strong>food autonomy</strong>. Only workers eat, at 1 ration per hour for 500 workers. One level of Agricultural field feeds 81,000, one level of Aeroponic farm 111,000.</li>
                <li>A <strong>moon</strong> produces 1,200 rations per hour. Carry them by cargo ship to your planets, or leave a fleet loaded with rations in orbit: the planet draws from it when its granary is empty.</li>
            </ol>

            <h2 id="specialize">Specializing your planets</h2>
            <p>Several planets = the chance to specialize them according to their position and buildings:</p>
            <ul>
                <li><strong>Economic planet</strong>: lots of mines, workers, selling to nearby traders.</li>
                <li><strong>Military planet</strong>: Shipyard, Weapons factory, Heavy industry, big defenses, to station your fleet there.</li>
                <li><strong>Research planet</strong>: Research center built high to house lots of scientists (see <em>Workers and scientists</em> for their real effect on research speed).</li>
                <li><strong>Border outpost</strong>: Space radar, Radar jammer, probes, turrets. Used to watch or contain a neighbor.</li>
            </ul>

            <h2 id="capital">Where does your hero go if it loses its spot?</h2>
            <p>There is no capital planet. A hero is never destroyed. If its fleet is annihilated or its planet lost, it can be <strong>captured</strong> by a player who has a Prison: 20% risk in space combat, 35% during an invasion.</p>
            <p>Otherwise, it automatically joins <strong>the oldest of your planets or moons that doesn't already have a hero</strong>. If there are none, your main hero sends a secondary hero in reserve to take its place.</p>

    planet_abandon:
        title: "Abandoning a planet"
        category: "planet"
        order: 4
        tags: "abandon,planet,deletion,game over"
        summary: "When it is a good idea, how to do it, and why you should hold back in some cases."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="why">Why abandon a planet?</h2>
            <ul>
                <li>It is <strong>too exposed</strong> to attacks and costs you more than it brings in.</li>
                <li>It is <strong>poorly located</strong> (far from everything, hard to defend).</li>
                <li>You want to <strong>colonize a better one</strong>, but you have reached your planet cap.</li>
            </ul>

            <h2 id="how">How to do it</h2>
            <p>Go to the <strong>Planets</strong> page: the <strong>Abandon</strong> link is next to the planet's coordinates. The game asks "Do you wish to abandon the planet?"; once you confirm <em>Abandon</em>, the abandonment is <strong>immediate and final</strong>.</p>
            <p>The link only appears if abandoning is possible:</p>
            <ul>
                <li>you still have at least one other planet (moons do not count);</li>
                <li>it is not a moon: a moon can never be abandoned;</li>
                <li>no foreign fleet in attack mode is heading for it or stationed in orbit.</li>
            </ul>
            <p>Before letting go of it, <strong>evacuate resources, Legionnaires, Mechs and grounded ships</strong> to another planet: everything left behind is lost. A hero stationed on the planet is automatically moved to another of your planets or moons that does not already have a hero.</p>
            <p>What happens to the planet:</p>
            <ul>
                <li>on a server without a Cthulhu hive, it becomes an uninhabited planet again, razed: all that remains is a Shipyard and a Ground radar of level 1;</li>
                <li>on a server with the hive, a small planet that is still at its original size (25 ground, 5 space) is simply freed, buildings included; any other planet becomes an <strong>alien base</strong>.</li>
            </ul>
            <p><strong>Can it be undone?</strong> No: there is no delay and no going back. To get the planet back, you have to retake it. If it became free again, recolonize it (you need a colonizer and a free spot). If it became an alien base, invade it to free it, then recolonize it.</p>

            <h2 id="danger">What about my last planet?</h2>
            <p>You cannot abandon it: as long as you have only one planet left, the game refuses (your moons do not count). However, <strong>losing</strong> your last planet, for example after an invasion, causes <strong>Game Over</strong>: see the <em>Game Over</em> article.</p>

    galaxy_navigation:
        title: "Navigating the galaxy"
        category: "planet"
        order: 5
        tags: "galaxy,sector,navigation,map,universe,coordinates,system,merchant,hyperspace"
        summary: "How the universe is organized, how to read a coordinate, and how to use the map."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">How the universe is organized</h2>
            <p>The universe is a hierarchy:</p>
            <ul>
                <li>A server's <strong>Universe</strong> contains one or more <strong>Galaxies</strong>: a new galaxy is added automatically when free starting planets run low, up to 32. The <strong>Universe</strong> tab of the Space map shows how many there are. In Battle Royale, there is only one.</li>
                <li>Each <strong>Galaxy</strong> contains 100 <strong>Sectors</strong> (10×10 grid, numbered 1 to 100 row by row). The Space map calls them "systems".</li>
                <li>Each <strong>Sector</strong> contains 25 <strong>Positions</strong> (5×5 grid).</li>
            </ul>
            <p>Each position can hold a planet (inhabited or not), a merchant, an alien base, a debris field, a moon, or be empty. Position 13, at the center of the sector, is always a sun. Merchants are found in 20 fixed sectors of each galaxy: 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 and 56.</p>

            <h2 id="coordinates">Reading a coordinate</h2>
            <p>Format: <strong>Galaxy:Sector:Position</strong>, for example <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — first galaxy;</li>
                <li><strong>5</strong> — fifth sector of that galaxy (on the first row of the grid);</li>
                <li><strong>12</strong> — twelfth position in that sector.</li>
            </ul>

            <h2 id="map">Using the map</h2>
            <p>The <strong>Space map</strong> page (left menu) shows you the space view. You can:</p>
            <ul>
                <li>Move between galaxies and sectors.</li>
                <li>Click a position to see what is there.</li>
                <li><strong>Send a fleet directly</strong>: click the tile, then <strong>Interaction</strong> (the button appears as soon as at least one of your fleets is stationary), choose the fleet and the mission, and click <strong>Send</strong>. The same panel offers quick actions depending on the tile: <em>Probe the planet</em>, <em>Colonize the planet</em>, <em>Deploy radar</em> or <em>Deploy jammer</em>, <em>Send a nuclear missile</em>.</li>
                <li>See the positions of allies, enemies and merchants (depending on your relations and your radar).</li>
            </ul>
            <p><strong>Fleets in transit</strong> appear as small animated ships gliding in real time between the origin planet and the destination. The <strong>colored halo</strong> shows the side: <strong>blue</strong> = you, <strong>green</strong> = alliance and allies, <strong>gray</strong> = pact/peace, <strong>magenta</strong> = merchant, <strong>purple</strong> = alien, <strong>red</strong> = enemy. The <strong>size</strong> reflects the fleet's signature. Your fleets and your alliance's fleets are always visible; others appear only if your <strong>radar</strong> covers the sector. For a long-distance flight crossing several sectors, the small ship only appears during the last fraction of the trip — entering the destination sector — not during the whole journey.</p>

            <h2 id="hyperspace">Inter-galaxy travel</h2>
            <p>To go from one galaxy to another, you need the <strong>Hyperspace technology</strong> research. The distance is always 18 (roughly 6 sectors: less than crossing a galaxy), but fuel is expensive: the fleet's signature divided by 8, in Bitcoins (125 Bitcoins for 1,000 hunters). Details in <em>Movement and distance</em>.</p>

    radar_jammer:
        title: "Radar and jamming"
        category: "planet"
        order: 6
        tags: "radar,jammer,detection,surveillance,scanner"
        summary: "See what moves in a sector, and hide your planets from enemy radars."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principle">Radar vs Jammer</h2>
            <ul>
                <li><strong>Radar</strong> — shows you the sector it is in: the planets and the moving fleets, before they arrive.</li>
                <li><strong>Jammer</strong> — hides <strong>one planet</strong> from enemy radars that are not more powerful than it: its information, the signature of fleets heading there, and the origin or destination of fleets leaving it or going to it.</li>
            </ul>

            <h2 id="detection">Available radars</h2>
            <table>
                <tr><th>Type</th><th>Where</th><th>Role</th></tr>
                <tr><td><strong>Ground radar</strong> (building)</td><td>On the planet (ground slot)</td><td>+1 radar power per level. Required: System scanner level 1.</td></tr>
                <tr><td><strong>Space radar</strong> (building)</td><td>On the planet (sky slot)</td><td>Same effect, +1 per level: useful when you are short on ground space. Required: System scanner level 3.</td></tr>
                <tr><td><strong>Radar ship</strong></td><td>Deployed on an empty tile</td><td>Sets up a power 1 radar for 2&nbsp;h: handy for watching a sector where you have no planet.</td></tr>
            </table>
            <p>A radar covers the whole sector it is in, and only that one. The levels of the two buildings on the same planet add up; in a sector, the best planet counts (yours, one belonging to a member of your alliance, or an ally's). An Explorer hero stationed on the planet strengthens its radar: +1 from level 5 (Scout trait), +3 in total from level 15 (Cartographer trait on top).</p>
            <p>The game warns you with a notification when an enemy fleet is heading for your planet, whether you have a radar or not; the radar is for <em>seeing</em> the fleets and planets of the sector.</p>

            <h2 id="jamming">Available jammers</h2>
            <table>
                <tr><th>Type</th><th>Where</th><th>Role</th></tr>
                <tr><td><strong>Radar jammer</strong> (building)</td><td>On the planet (sky slot)</td><td>+1 jamming power per level. As long as it equals or exceeds the enemy radar in the sector, the planet is hidden from that enemy. Required: System scanner level 5.</td></tr>
                <tr><td><strong>Jammer ship</strong></td><td>Deployed on an empty tile</td><td>Sets up a power 1 jammer for 1&nbsp;h on that tile. It does not protect a fleet in flight.</td></tr>
            </table>
            <p>Example: your planet has a level 3 Radar jammer. An enemy whose best radar in the sector is level 3 does not see it; with a level 4 radar, they see it.</p>

            <h2 id="ground-ships">Seeing ships on the ground</h2>
            <p>The <strong>ground signature</strong> — the ships stationed on a planet — follows a slightly looser rule: one of your fleets <strong>in orbit</strong> counts them on sight, even with no radar. But only for that planet.</p>
            <p>The <strong>radar</strong> remains what gives you that reading <strong>from a distance</strong>, across the whole sector. And a <strong>Radar jammer</strong> on the planet shuts the observation down: without a radar stronger than the jammer, the ground signature becomes invisible again, even with a fleet overhead.</p>

            <h2 id="strategy">How to use them</h2>
            <ul>
                <li><strong>Radar</strong> on every planet: at minimum the Ground radar, to see what moves in your sector.</li>
                <li><strong>Radar jammer</strong> on your exposed planets: at a level equal to or higher than the enemy radar, they become unreadable to it.</li>
                <li><strong>Deploy</strong> a radar ship on an empty tile in your neighbor's sector ("Deploy radar" action on the Space map, or "Radar ship" mission): you see that sector for 2&nbsp;h.</li>
                <li>The <strong>System scanner</strong> research unlocks radars (level 1: Ground radar; level 3: Space radar and Radar ship; level 5: Radar jammer and Jammer ship). It does not increase their power.</li>
            </ul>

    moon:
        title: "Moons"
        category: "planet"
        order: 7
        tags: "moon,lunar,moonmaker,food,rations,production"
        summary: "A moon produces 1,200 rations per hour without taking up any ground. How to create one with a Lunar, its size and its limits."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="what">What is a moon?</h2>
            <p>A <strong>moon</strong> is a special celestial body created by a <strong>Lunar</strong> ship (sometimes called Moon Maker). It produces neither niobium nor water, but a fixed amount of <strong>20 rations per minute</strong>, or 1,200 per hour before bonuses (1,440 in an alliance). That is as much as an Agricultural field at level 7 to 8 on a planet, without taking up any ground. This production cannot be increased: you do not build a farm on a moon.</p>
            <p>A moon also hosts <strong>workers</strong> (20,000 from creation, up to 200,000), who earn Bitcoins just like elsewhere. You can build most buildings on it (Large city, Research center, warehouses, Barracks, Shipyard…), but no mine, extractor or farm.</p>
            <p>Only workers consume rations, at 1 per hour for 500 workers: a moon's 1,200 rations therefore feed 600,000 workers. These rations stay on the moon: carry them by cargo to your planets, or leave a fleet loaded with rations in a planet's orbit, which will draw from it when its granary is empty.</p>

            <h2 id="creation">How to create a moon</h2>
            <p>A moon is born from a <strong>debris field</strong>: you need an <strong>empty spot</strong> holding at least <strong>2M niobium AND 2M water</strong> in debris (left by a space battle at that spot). The <em>Create a moon</em> mission is only offered on the map if the spot meets this condition.</p>
            <ol>
                <li>Build a <strong>Lunar</strong> at the Shipyard. It requires the Terraforming research at level 15 and a Heavy industry on the planet. It costs 50,000 niobium, 23,000 water, 20,000 workers and 200,000 Bitcoins, for 5&nbsp;h of base construction time.</li>
                <li>Send it to the empty spot on a <strong>Create a moon</strong> mission: on the <em>Space map</em>, click the spot, then <em>Interaction</em>, choose the fleet and the mission, then <em>Send</em>. If the fleet is already there, the <em>Create a moon</em> button appears on its card.</li>
                <li>On arrival, one Lunar is consumed, the moon is created and <strong>all the debris is consumed</strong>. If the conditions are no longer met (debris recycled during the flight, position occupied…), a report explains the failure.</li>
            </ol>
            <p>The Lunar is the slowest ship in the game, and its upkeep is heavy: 5,000 Bitcoins per day while it is in a fleet, 833 when it stays on the ground. Only put it in a fleet at the last moment.</p>

            <h2 id="size">Moon size</h2>
            <p>The richer the debris field, the bigger the moon. The tier is set by the <strong>lower</strong> of the two resources:</p>
            <table>
                <thead>
                    <tr><th>Debris (min. niobium/water)</th><th>Ground</th><th>Space</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M and more</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Values are drawn at random within the range. Example: a field of 12M niobium and 6M water gives a moon of 100 to 150 ground slots, because it is the water (6M) that sets the tier. A moon is often bigger than a planet, whose starting ground ranges from 25 to 190.</p>

            <h2 id="limits">Limits</h2>
            <ul>
                <li>A moon produces neither niobium nor water: only rations and workers.</li>
                <li>It can be attacked, raided and invaded (by a fleet in orbit), but it cannot be probed.</li>
                <li>It does not count toward your planet cap, nor toward the 4-planet limit of beginner protection.</li>
                <li>A moon can never be abandoned.</li>
                <li>Building a moon close to home is safer (less exposed to hostile neighbors).</li>
            </ul>

            <h2 id="strategy">When to build one</h2>
            <ul>
                <li>Your heavily populated planets are short on rations: a nearby moon supplies 1,200 per hour, to be carried by cargo or left aboard a fleet in the planet's orbit.</li>
                <li>A big battle left a <strong>rich debris field</strong> on an empty spot near you: rather than recycling it all, turn it into a moon.</li>
                <li>You are well established, have resources to spend and want to consolidate your economy.</li>
            </ul>

    alliance_basics:
        title: "Creating and joining an alliance"
        category: "alliance"
        order: 1
        tags: "alliance,creation,join,invitation,bonus,regime,politics,level,members"
        summary: "Join an alliance by invitation or create your own, choose its political regime and raise its level to welcome more members."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="why">Why join an alliance?</h2>
            <ul>
                <li><strong>+20&nbsp;% production</strong> of niobium, water and rations, as soon as you join the alliance.</li>
                <li>The <strong>7 political researches</strong> of your alliance's regime (economic, military or defensive bonuses), which you launch yourself on the <strong>Research</strong> page.</li>
                <li>The <strong>alliance improvements</strong> (16 collective bonuses) and <strong>construction help</strong>.</li>
                <li>A <strong>shared treasury</strong> in Bitcoins and War Points.</li>
                <li><strong>Diplomacy</strong> (wars, peace, pacts, defensive alliances), a <strong>chat</strong> reserved for members and the <strong>Alliance Arena</strong>.</li>
            </ul>
            <p>In short: playing solo is viable at the start. But as soon as the game gets serious, an alliance multiplies your chances of progressing.</p>

            <h2 id="join">How to join</h2>
            <ol>
                <li>Spot an alliance: the alliance ranking ("Alliance Rankings"), an alliance's page, the Universe chat.</li>
                <li>Contact one of its members (private message, chat). There is no application in the game: <strong>the alliance invites you</strong>.</li>
                <li>A member with the <strong>Recruit</strong> permission sends you an invitation from the <strong>Add a member</strong> tab of their Alliance page. They see there the players without an alliance who have logged in within the last 2 months.</li>
                <li>Open your <strong>Alliance</strong> page (menu): the invitation appears under "Recruit proposals". Click <strong>Accept</strong>.</li>
            </ol>
            <p>An alliance can only invite if it has a free slot: each pending invitation counts as a member until you answer.</p>
            <p>You can also <strong>create your own alliance</strong> from the same page. You choose:</p>
            <ul>
                <li>a <strong>name</strong> (20 characters at most, unique on the server) and a <strong>tag</strong> (5 characters at most, unique);</li>
                <li>a rallying cry (30 characters) and a description (1,500 characters), which can be edited afterwards;</li>
                <li>the <strong>alliance tax</strong>, from 5 to 50&nbsp;%, which <strong>can no longer be changed</strong>;</li>
                <li>the <strong>political regime</strong>, final.</li>
            </ul>
            <p>You become the alliance leader. Its treasury starts empty.</p>

            <h2 id="invitations">Receiving invitations</h2>
            <p>A member with the <strong>Recruit</strong> permission can <strong>invite</strong> you directly. You can receive <strong>one invitation from each alliance at the same time</strong>: being approached by one does not make you invisible to the others. However, the same alliance cannot invite you twice until you have answered. Alliances that spot you see that you are <strong>already being approached</strong>, without knowing by whom. As soon as you <strong>accept</strong> an invitation, all the others are automatically withdrawn. If an alliance is <strong>dissolved</strong>, its invitation disappears from your list.</p>

            <h2 id="delai">Waiting period after leaving an alliance</h2>
            <p>After <strong>leaving</strong> an alliance, being <strong>kicked out</strong> of one, or after its <strong>dissolution</strong> by its leader, a <strong>2-day waiting period</strong> applies: you cannot <strong>create</strong> or <strong>join</strong> an alliance before the countdown ends, displayed on the Alliance page. If the alliance disappears by itself (Game Over of the leader of The Hammer of Stars, or of the last member), this period is <strong>12&nbsp;hours</strong>. This delay prevents abusive back-and-forth between alliances.</p>
            <p><strong>Leaving</strong> is only possible in <strong>The Balance of Worlds</strong>, and under four conditions: you are not the President, you are not the last member, the alliance is not at war and none of your fleets is in combat. A <strong>kick</strong> is also impossible during a war, or if a fleet of the targeted member is in combat.</p>
            <p>When you leave, you lose the production bonus and the alliance improvements, and <strong>your political researches drop back to zero</strong>.</p>

            <h2 id="regimes">The 3 political regimes</h2>
            <p>When <strong>creating</strong> an alliance, you choose its <strong>political regime</strong>. This choice is <strong>final</strong>: it sets the starting number of members, the 7 political researches available and several internal rules. Full details: <a href="/wiki/political_system">The 3 political regimes</a>.</p>

            <h3 id="democracy">The Balance of Worlds</h3>
            <ul>
                <li>3 members at the start; a President elected by the members' vote.</li>
                <li>Members can leave the alliance (except the President, and never in wartime).</li>
                <li>Economic researches: production, research speed, scientists' upkeep, cargos, ship armor, sales to merchants, colonization.</li>
                <li>All members are publicly visible, as well as the position of their first planet.</li>
                <li>+20&nbsp;% weapons when attacking The Silent Rampart.</li>
            </ul>

            <h3 id="communism">The Silent Rampart</h3>
            <ul>
                <li>4 members at the start; all members are leaders.</li>
                <li>Alliance tax fixed at 50&nbsp;%; it is impossible to leave the alliance.</li>
                <li>Offensive researches: recycling, workers' defense, ship power, upkeep and recruitment of Legionnaires, invasions, War Points.</li>
                <li>+20&nbsp;% weapons when attacking The Hammer of Stars.</li>
            </ul>

            <h3 id="fascism">The Hammer of Stars</h3>
            <ul>
                <li>2 members at the start; a single leader, the Primaris.</li>
                <li>It is impossible to leave or dissolve the alliance; if the Primaris is put in Game Over, the alliance is dissolved.</li>
                <li>Defensive researches: workers, ship power, barges, Legionnaires, upkeep and defense of Mechs, invasions. The Cthulhu threat rises more slowly.</li>
                <li>Only the leader is displayed publicly.</li>
                <li>+20&nbsp;% weapons when attacking The Balance of Worlds.</li>
            </ul>

            <h2 id="niveau">Alliance level and number of members</h2>
            <p>An alliance starts with <strong>3 slots</strong> (The Balance of Worlds), <strong>4</strong> (The Silent Rampart) or <strong>2</strong> (The Hammer of Stars). To welcome more people, a member with the <strong>Edit</strong> permission raises its <strong>level</strong> with the "Upgrade alliance level" button of the <strong>Alliance Fund</strong> tab. The cost is paid by the <strong>treasury</strong>. Each level also unlocks one more political research (see <a href="/wiki/alliance_research">Alliance researches</a>).</p>
            <table>
                <thead>
                    <tr><th>Step</th><th>Cost (treasury)</th><th>Extra slots</th><th>Total slots Balance / Rampart / Hammer</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125,000 Bitcoins</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225,000 Bitcoins + 2,500 WP</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600,000 Bitcoins + 10,000 WP</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1,000,000 Bitcoins + 25,000 WP</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50,000 WP</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10,000,000 Bitcoins</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15,000,000 Bitcoins + 125,000 WP</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35,000,000 Bitcoins + 300,000 WP</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50,000,000 Bitcoins + 500,000 WP</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100,000,000 Bitcoins + 1,000,000 WP</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>Level 10 is the maximum.</p>

            <h2 id="compte-valide">Account to validate</h2>
            <p>⚠️ To <strong>create or join</strong> an alliance, your account must be <strong>validated</strong> and your <strong>e-mail confirmed</strong>. Test or anonymous accounts cannot join an alliance: confirm your e-mail from <strong>My options</strong>.</p>
            <p>Other cases where it is impossible: during the waiting period that follows a departure or a kick (see above), as long as one of your fleets is engaged in combat, on a <strong>Battle Royale</strong> server, and for the VIP of a <strong>Search &amp; Destroy</strong> server. Without a confirmed e-mail, you also cannot deposit into or withdraw from the treasury, invest in improvements or help constructions.</p>

            <h2 id="discord">Your alliance on Discord</h2>
            <p>Link your Discord account in <strong>My options</strong> and tick <strong>Show my alliances on Discord</strong>: the game gives you the role of each of your alliances on the <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area Universe Discord</a>, and removes it when you leave or the alliance is dissolved. Nobody can take the role of an alliance they are not a member of. Untick the box at any time to remove your roles.</p>

    alliance_grades:
        title: "Grades and permissions"
        category: "alliance"
        order: 2
        tags: "grades,permissions,roles,hierarchy,officer,leader,vote,inactive"
        summary: "How an alliance's internal hierarchy works and who is allowed to do what."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principle">The principle</h2>
            <p>An alliance is organized by <strong>grades</strong>, from the highest (the leader, rank&nbsp;1) to the lowest (rank&nbsp;5). Each grade carries a list of <strong>permissions</strong> that says what its members can do.</p>

            <h2 id="hierarchy">Starting grades</h2>
            <p>Each alliance starts with 4 grades, depending on its regime:</p>
            <table>
                <thead>
                    <tr><th>Regime</th><th>Leader (rank 1, all permissions)</th><th>Rank 2</th><th>Rank 3</th><th>New members</th></tr>
                </thead>
                <tbody>
                    <tr><td>The Balance of Worlds</td><td>President</td><td>Minister (Recruit, View)</td><td>Citizen (View)</td><td>Minor (rank 5, no permissions)</td></tr>
                    <tr><td>The Hammer of Stars</td><td>Primaris</td><td>Captain (Recruit, View)</td><td>Soldier (View)</td><td>Aspirant (rank 5, no permissions)</td></tr>
                    <tr><td>The Silent Rampart</td><td>Guide, Protector, Comrade (all rank 1)</td><td>Gulag (no permissions)</td><td>—</td><td>Comrade (all permissions)</td></tr>
                </tbody>
            </table>
            <p>A member with the <strong>Edit</strong> permission can create other grades in the <strong>Administration</strong> tab: they give them a name, a "grade type" from 2 to 5 (the rank) and permissions. Rank&nbsp;1 is reserved for leaders.</p>

            <h2 id="permissions">Permissions</h2>
            <p>A grade's permissions are chosen when it is <strong>created</strong>:</p>
            <ul>
                <li><strong>Recruit</strong>: invite players.</li>
                <li><strong>Exclude</strong>: kick a member (impossible in wartime).</li>
                <li><strong>Pact</strong>: propose, accept, refuse or break a non-aggression pact or a defensive alliance. It is also required for war and peace.</li>
                <li><strong>War</strong>: declare war and negotiate peace (the Pact permission is also needed).</li>
                <li><strong>Edit</strong>: manage grades and their assignment, the DEFCON, the image, the rallying cry and the description, approve treasury withdrawal requests, raise the alliance level, dissolve it. Withdrawals requested by this grade are immediate.</li>
                <li><strong>Fleets</strong>: remove from sharing the fleets that other members have shared with the alliance.</li>
                <li><strong>View</strong>: see on the space map the fleets of all members and of allied defensive alliances. Without it, you only see your own.</li>
            </ul>
            <p>The permissions of an existing grade cannot be modified: create a new grade, assign it, then delete the old one (its members drop to the lowest grade). You can only give a grade permissions that you have yourself. At least one grade of each of ranks 1, 2, 3 and 5 must always remain, and you cannot delete your own grade.</p>

            <h2 id="change">Promoting or demoting</h2>
            <p>A member with the <strong>Edit</strong> permission changes another member's grade by clicking their <strong>rank</strong> in the member list. It is a way to reward active players and to supervise newcomers.</p>
            <p>Limits:</p>
            <ul>
                <li>you cannot give a grade that has more permissions than your own;</li>
                <li>nobody can demote the last leader, and a leader cannot change their own grade;</li>
                <li>the grade of <strong>President</strong> (Balance) or <strong>Primaris</strong> (Hammer) is never assigned by hand: the President changes through the vote, the Primaris only through the automatic replacement of an inactive chief (see below);</li>
                <li>in the Silent Rampart, Guide, Protector and Comrade can be swapped freely.</li>
            </ul>

            <h2 id="regimes">Special cases by regime</h2>
            <ul>
                <li><strong>The Silent Rampart</strong>: all members are leaders, with all rights, and newcomers arrive as Comrades. The only lower grade is the <strong>Gulag</strong>, with no permissions at all, which is assigned to sideline a member.</li>
                <li><strong>The Hammer of Stars</strong>: a single leader, the Primaris, who can neither be elected nor appointed. They are only replaced if they stay inactive for more than 7 days (see below). If they are put in <strong>Game Over</strong>, the alliance is dissolved.</li>
                <li><strong>The Balance of Worlds</strong>: each member has one vote, which they can change at any time, from the members tab ("Vote for your president"). As soon as a member has more votes than the President, they become President and the former one takes their grade.</li>
            </ul>

            <h2 id="afk">Automatic replacement of an inactive chief</h2>
            <p>If a <strong>leader</strong> does not log in for <strong>more than 7 days</strong>, they are automatically replaced so that the alliance is not paralyzed:</p>
            <ul>
                <li>The <strong>highest-ranking member</strong> among those who are not leaders and who have logged in within the last 7 days takes the head of the alliance. With equal grades, it is the one with the most <strong>ranking points</strong>.</li>
                <li>The two grades are simply <strong>swapped</strong>: the former chief gets the replacement's grade. The change is noted in the alliance history.</li>
                <li>The rule applies to all three regimes. In the Silent Rampart, where everyone is a leader, only a member with the Gulag grade can take the place of an inactive leader.</li>
                <li>If there is <strong>no active candidate</strong>, nothing changes.</li>
            </ul>

    diplomacy:
        title: "Diplomacy"
        category: "alliance"
        order: 3
        tags: "diplomacy,war,peace,pact,ally,defensive alliance,defcon,treaty,peace tax"
        summary: "The 4 types of relations between alliances, how to negotiate them, and what DEFCON means."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Your alliance maintains <strong>relations</strong> with the other alliances on the server. These relations change the rules between your respective members: who can raid or invade whom, and who fights alongside whom. Diplomacy is managed in the <strong>Pacts</strong> tab of the Alliance page.</p>

            <h2 id="types">The 4 types of relations</h2>
            <table>
                <thead>
                    <tr><th>Type</th><th>Effect</th><th>Setup and end</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>No relation</strong></td><td>Default situation: raids, invasions and combat are possible.</td><td>—</td></tr>
                    <tr><td><strong>War</strong></td><td>The <strong>armed</strong> fleets of the two alliances that meet on a planet fight automatically, even without attack mode. During the war, it is impossible to kick a member, or to leave or dissolve the alliance. The game counts the invasions and War Points won and lost by each side.</td><td>Declared <strong>immediately</strong>, with no acceptance (War and Pact permissions). Both alliances go to DEFCON 5 and their members receive an alert. It only ends with an accepted <strong>peace</strong>.</td></tr>
                    <tr><td><strong>Peace</strong></td><td>No raids or invasions between you. The loser pays the agreed <strong>peace tax</strong>: a share of their daily income and a share of the WP they earn in combat, paid into the winner's treasury.</td><td>Proposed from an ongoing war, with the "Make peace" button. Lasts <strong>4 days</strong>, then both alliances become neutral again.</td></tr>
                    <tr><td><strong>Non-aggression pact</strong></td><td>No raids or invasions between you. In a battle, an alliance that has a pact with the opposing side does not fight.</td><td>Proposed, then accepted by the other side. Broken <strong>immediately</strong>.</td></tr>
                    <tr><td><strong>Defensive alliance</strong></td><td>No raids or invasions between you. Your fleets fight <strong>on the same side</strong>. Radar and fleets shared on the map (with the View permission). A <strong>chat shared</strong> by both alliances.</td><td>Proposed, then accepted. The break takes effect <strong>12 hours</strong> later; the shared chat and its messages are then deleted.</td></tr>
                </tbody>
            </table>
            <p>You cannot declare war on an alliance with which you have a pact, a defensive alliance or an ongoing peace: break the pact or the defensive alliance first. A peace, on the other hand, cannot be broken: you have to wait for it to expire.</p>

            <h2 id="propose">How to propose a treaty</h2>
            <ol>
                <li><strong>Alliance</strong> page, <strong>Pacts</strong> tab ("Alliance Diplomacy").</li>
                <li>Under "Propose", enter the <strong>tag</strong> of the targeted alliance and choose <strong>Defensive alliance</strong>, <strong>Non-aggression pact</strong> or <strong>Declare war</strong>.</li>
                <li>The other alliance sees your request under "Received requests": it can <strong>accept</strong> or <strong>refuse</strong> it. There is no counter-proposal: to change the terms, refuse and then make your own proposal. Only one proposal can be pending between two alliances.</li>
            </ol>
            <p>A pact can become a defensive alliance, and a peace can become a pact or a defensive alliance: acceptance replaces the old relation (a peace and its tax then end).</p>

            <h2 id="paix">Negotiating peace</h2>
            <p>In the "Active wars" list, click <strong>Make peace</strong> next to the war concerned, then fill in the terms:</p>
            <ul>
                <li><strong>Type</strong>: <strong>Propose</strong> (you offer the terms, and your alliance will pay) or <strong>Claim</strong> (you demand that the opponent pays).</li>
                <li><strong>Bitcoins paid per day</strong>: 0 or 10 to 25&nbsp;% of the daily income of each member of the defeated alliance, deducted at the daily report (18:59, Paris time). Example: at 20&nbsp;%, a member who earns 10,000 Bitcoins per day pays 2,000.</li>
                <li><strong>Percentage of War Points</strong>: 0 or 25 to 50&nbsp;% of the WP that the defeated members earn in combat.</li>
                <li><strong>Number of planets</strong>: this field (0 to 5) is saved in the terms, but no planet is transferred.</li>
            </ul>
            <p>Click <strong>Sign</strong>. The opponent sees your proposal on this same screen and can accept or refuse the terms; you can cancel yours as long as they have not answered. Once accepted, the peace lasts 4 days.</p>

            <h2 id="defcon">DEFCON (alert level)</h2>
            <p>Your alliance has a <strong>DEFCON alert level</strong>, from <strong>0 to 5</strong>: <strong>the higher the number, the tenser the situation</strong>. 0 = no alert, 5 = maximum alert. A member with the <strong>Edit</strong> permission sets it in the <strong>Administration</strong> tab ("Defense level"). A <strong>declaration of war</strong> automatically puts both alliances at <strong>DEFCON 5</strong>.</p>
            <p>The level is displayed as a banner on the <strong>Global view</strong> of all members (green at 1, orange at 2, red from 3 to 5, nothing at 0), with the list of alliances you are at war with. It is a coordination signal, with no effect on combat.</p>

            <h2 id="logs">The diplomatic log</h2>
            <p>Every diplomatic action (declaration of war, proposal, accepted peace, broken pact, refused proposal…) is <strong>recorded</strong> in the alliance <strong>History</strong> (members tab), with the author's name, the date and the time. Arrivals, departures, kicks and leader changes appear there too. Useful for internal transparency and for debates after the fact.</p>

    alliance_treasury:
        title: "Alliance treasury"
        category: "alliance"
        order: 4
        tags: "treasury,bank,bitcoin,wp,deposit,withdrawal,tax,level"
        summary: "Your alliance's shared account in Bitcoins and WP: deposits, alliance tax, peace taxes, withdrawals and level-ups."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principle">What the treasury is for</h2>
            <p>The alliance treasury (<strong>Alliance Fund</strong> tab of the Alliance page) is a shared account in <strong>Bitcoins</strong> and <strong>War Points (WP)</strong>. It is used to:</p>
            <ul>
                <li><strong>Raise the alliance level</strong>, to welcome more members and unlock the following political researches (see <a href="/wiki/alliance_basics#niveau">Alliance level</a>).</li>
                <li><strong>Redistribute</strong> Bitcoins or WP to a member: help out a player in trouble, fund war preparation.</li>
            </ul>
            <p>Political researches are <strong>not</strong> paid for by the treasury: each player pays for their own (see <a href="/wiki/alliance_research">Alliance researches</a>). A Cthulhu blockade endured can also draw from it a "Tithe of the Possessed".</p>

            <h2 id="fund">How to fill it</h2>
            <ul>
                <li><strong>Voluntary deposits</strong>: any member can pay in Bitcoins or WP (Alliance Fund tab, "Give"), with a reason if they wish. Validated account and confirmed e-mail required.</li>
                <li><strong>Alliance tax</strong>: always active, it is automatically deducted from each member at the daily report (see below).</li>
                <li><strong>Peace taxes</strong>: when a defeated alliance pays you a peace, its daily tax in Bitcoins and its share of the WP earned in combat go into your treasury (see <a href="/wiki/diplomacy#paix">Negotiating peace</a>).</li>
                <li><strong>Alliance Arena</strong>: the alliance's rewards (Bitcoins and WP) are paid into the bank.</li>
            </ul>

            <h2 id="withdraw">Withdrawals</h2>
            <p>Any member can request a <strong>withdrawal</strong> (Alliance Fund tab, "Take"), in Bitcoins or WP.</p>
            <ul>
                <li>If you have the <strong>Edit</strong> permission, or if your alliance is a <strong>Silent Rampart</strong>, the withdrawal is immediate.</li>
                <li>Otherwise, the request stays <strong>Pending</strong> until a member with the Edit permission accepts it ("Yes": the funds are paid to you) or refuses it ("No": the request is deleted).</li>
                <li>Acceptance fails if the treasury no longer has the amount, or if the requester has left the alliance in the meantime.</li>
            </ul>
            <p>Each movement is recorded in the bank history.</p>

            <h2 id="taxes">The alliance tax</h2>
            <p>The <strong>alliance tax</strong> is chosen <strong>when the alliance is created</strong>, from 5 to 50&nbsp;%. It <strong>can no longer be changed afterwards</strong>. In the Silent Rampart, it is fixed at 50&nbsp;%.</p>
            <p>It is deducted automatically at the <strong>daily report</strong> (18:59, Paris time), from the Bitcoin income your workers bring you, and paid into the treasury ("Daily tax" line).</p>
            <p>Calculation: the deduction equals income − income ÷ (1 + rate). A 10&nbsp;% tax therefore removes about 9.1&nbsp;% of income, a 50&nbsp;% tax removes a third. Example: on 10,000 Bitcoins of daily income, 10&nbsp;% takes 909 Bitcoins, 50&nbsp;% takes 3,333.</p>
            <p>Choose it reasonably: if it is too high, members leave.</p>

            <h2 id="transparency">Transparency</h2>
            <p>The <strong>Alliance Fund</strong> tab shows <strong>all members</strong> the history of the last 200 movements: member, type (Bitcoins or WP), amount, reason, date and status (Accepted or Pending). Daily taxes and peace taxes appear there too. Everyone can therefore check where the money goes.</p>

    political_system:
        title: "The 3 political regimes"
        category: "alliance"
        order: 5
        tags: "politics,regime,bonus,balance,rampart,hammer"
        summary: "The 3 possible regimes for an alliance: advantages, drawbacks, and how to choose."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principle">Choosing at creation</h2>
            <p>When an alliance is created, the founder chooses a <strong>political regime</strong>. This regime defines <strong>internal rules</strong>, <strong>specific bonuses</strong> and the <strong>7 political researches</strong> that its members can launch. The choice is <strong>irreversible</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>The Balance of Worlds</th><th>The Silent Rampart</th><th>The Hammer of Stars</th></tr>
                </thead>
                <tbody>
                    <tr><td>Starting members</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Leaders</td><td>A President, elected by vote</td><td>All members</td><td>A single one, the Primaris</td></tr>
                    <tr><td>Leaving the alliance</td><td>Yes (except the President)</td><td>No</td><td>No</td></tr>
                    <tr><td>Dissolving the alliance</td><td>Yes</td><td>Yes</td><td>No</td></tr>
                    <tr><td>Alliance tax</td><td>Chosen at creation (5 to 50&nbsp;%)</td><td>50&nbsp;%</td><td>Chosen at creation (5 to 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% weapons when attacking</td><td>The Silent Rampart</td><td>The Hammer of Stars</td><td>The Balance of Worlds</td></tr>
                </tbody>
            </table>
            <p>The number of members then grows with the <a href="/wiki/alliance_basics#niveau">alliance level</a>. Dissolving an alliance is always impossible in wartime.</p>

            <h2 id="balance">The Balance of Worlds (democratic)</h2>
            <p>An open, economic regime. Members vote to elect their President. Focus on the <strong>economy</strong>.</p>
            <ul>
                <li>3 members at the start.</li>
                <li>Each member has one vote, which they can change at any time (members tab, "Vote for your president"). As soon as a member has more votes than the President, they take their place.</li>
                <li>+20&nbsp;% weapons when attacking The Silent Rampart.</li>
                <li>Members can leave the alliance (except the President, and never in wartime).</li>
                <li>Members publicly visible, as well as the position of their first planet.</li>
                <li>Economy-oriented researches: production, research speed, scientists' upkeep, cargos, ship armor, sales to merchants, colonization (details in <a href="/wiki/alliance_research">Alliance researches</a>).</li>
            </ul>

            <h2 id="rampart">The Silent Rampart (offensive)</h2>
            <p>An aggressive, collective regime. All members are leaders. Focus on <strong>offense</strong>.</p>
            <ul>
                <li>4 members at the start (one more than The Balance of Worlds).</li>
                <li>+20&nbsp;% weapons when attacking The Hammer of Stars.</li>
                <li>Alliance tax automatically fixed at 50&nbsp;%.</li>
                <li>Treasury withdrawals are immediate for all members.</li>
                <li>It is impossible to leave the alliance.</li>
                <li>Combat-oriented researches: recycling, workers' defense, ship power, upkeep and recruitment of Legionnaires, invasions, War Points.</li>
            </ul>
            <p>The three top grades (<strong>Guide</strong>, <strong>Protector</strong>, <strong>Comrade</strong>) are <strong>equivalent</strong>: same rights, no hierarchy between them. They can be freely assigned among members, and newcomers arrive as Comrades, with all rights. The only lower grade is the <strong>Gulag</strong>, with no permissions at all, which is assigned to sideline a member.</p>

            <h2 id="hammer">The Hammer of Stars (defensive)</h2>
            <p>A discreet, defensive regime. A single leader, the Primaris, who is only replaced if they stay inactive for more than 7 days (see <a href="/wiki/alliance_grades#afk">Grades and permissions</a>). Focus on <strong>defense</strong> and resistance.</p>
            <ul>
                <li>2 members at the start (one fewer than The Balance of Worlds, two fewer than The Silent Rampart).</li>
                <li>+20&nbsp;% weapons when attacking The Balance of Worlds.</li>
                <li>Cthulhu threat that rises 25&nbsp;% more slowly than in the other two regimes: +150 instead of +200 per victory against the Cthulhus on normal difficulty (see <a href="/wiki/cthulhus#threat">The Cthulhu threat</a>). Very useful in PvE.</li>
                <li>Only the leader is displayed publicly.</li>
                <li>It is impossible to leave the alliance. It is impossible to dissolve it.</li>
                <li>If the leader is put in Game Over, the alliance is dissolved.</li>
                <li>Defense-oriented researches: worker production, ship power, barge capacity, Legionnaire strength, upkeep and defense of Mechs, invasions.</li>
            </ul>

            <h2 id="combat">Bonuses between regimes</h2>
            <p>Each regime dominates another, rock-paper-scissors style:</p>
            <ul>
                <li>The Balance of Worlds beats The Silent Rampart.</li>
                <li>The Silent Rampart beats The Hammer of Stars.</li>
                <li>The Hammer of Stars beats The Balance of Worlds.</li>
            </ul>
            <p>When your side <strong>attacks</strong> in a space combat (or in the Alliance Arena) and your regime dominates the defender's, your <strong>missiles, lasers and plasma</strong> gain <strong>+20&nbsp;%</strong>. On defense, or against the same regime, there is no bonus. Ground combat is not affected.</p>

            <h2 id="visibilite">What others see of you</h2>
            <ul>
                <li><strong>The Balance of Worlds</strong>: all members appear on the alliance's page, with its number of planets, and each member's page shows the position of their first planet.</li>
                <li><strong>The Silent Rampart</strong>: members appear on the alliance's page, but the rankings hide the number of members and planets.</li>
                <li><strong>The Hammer of Stars</strong>: only the leader appears on the alliance's page, the list of members' planets is hidden on their page, and the rankings hide the number of members and planets.</li>
            </ul>

            <h2 id="choose">How to choose?</h2>
            <ul>
                <li><strong>You are starting out and aiming for growth</strong> → The Balance of Worlds (economic, and the only one you can leave).</li>
                <li><strong>You want a tight-knit, aggressive alliance</strong> → The Silent Rampart.</li>
                <li><strong>You want to protect yourself and play defensively</strong> → The Hammer of Stars (careful: if the leader goes Game Over, everything collapses).</li>
            </ul>

    alliance_research:
        title: "Alliance researches"
        category: "alliance"
        order: 6
        tags: "research,alliance,politics,political,regime,bonus"
        summary: "The 7 political researches of your regime: personal researches, paid with your own Bitcoins and unlocked by the alliance level."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principle">How it works</h2>
            <p>Alliance researches, called <strong>political researches</strong>, are launched on the <strong>Research</strong> page, <strong>Political</strong> category. Each regime has <strong>7 researches</strong> of <strong>5 levels</strong>. They unlock one by one with the <strong>alliance level</strong>: the first from level 0, the second at level 1… up to the seventh at level 6 (see <a href="/wiki/alliance_basics#niveau">Alliance level</a>). Without an alliance, the category shows "Required: Join an alliance".</p>
            <p>These are <strong>personal</strong> researches: each member launches them for themselves, in their own research queue, with <strong>their own Bitcoins</strong>, and the bonus applies <strong>only to them</strong>. The cost of a level is the base cost × the targeted level, reduced by the "Research cost" alliance improvement. The duration depends on your scientists, as with any research.</p>
            <p><strong>Warning</strong>: if you leave the alliance, are kicked out of it, or it is dissolved, all your political research levels drop back to zero. A political research that finishes when you no longer have an alliance brings nothing.</p>
            <p>Not to be confused with <a href="/wiki/alliance_improvements">alliance improvements</a>, which are collective and funded by members' investments. The two stack.</p>

            <h2 id="list">Each regime's researches</h2>
            <p>Effect per level, then effect at level 5. Cost of level N = base cost × N, in Bitcoins: the 5 levels cost 15 times the base cost (for example 375,000 Bitcoins for a research at 25,000). The required alliance level is given in parentheses.</p>

            <h3>The Balance of Worlds</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>Effect</th><th>Base cost</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Macron law</strong> (lvl 0)</td><td>+7.1&nbsp;% production of niobium, water and rations per level, on top of the alliance's +20&nbsp;% (×1.56 in total at level 5, versus ×1.2 without the research)</td><td>25,000</td></tr>
                    <tr><td><strong>Scientific mobilization</strong> (lvl 1)</td><td>+0.1 research speed per level (+0.5 at level 5), until the next arrival of scientists, which rounds the speed to the nearest integer (see <em>Workers and scientists</em>)</td><td>50,000</td></tr>
                    <tr><td><strong>Scientific enthusiasm</strong> (lvl 2)</td><td>Reduced scientists' upkeep: −17&nbsp;% at level 1, −50&nbsp;% at level 5</td><td>100,000</td></tr>
                    <tr><td><strong>Improved cargos</strong> (lvl 3)</td><td>+20&nbsp;% cargo capacity per level (+100&nbsp;%)</td><td>150,000</td></tr>
                    <tr><td><strong>Ship armor</strong> (lvl 4)</td><td>+10&nbsp;% ship armor per level (+50&nbsp;%)</td><td>200,000</td></tr>
                    <tr><td><strong>Trade agreements</strong> (lvl 5)</td><td>+5&nbsp;% merchant sale earnings per level (+25&nbsp;%)</td><td>250,000</td></tr>
                    <tr><td><strong>Spreading Democracy</strong> (lvl 6)</td><td>+1 colonizable planet per level (+5)</td><td>300,000</td></tr>
                </tbody>
            </table>

            <h3>The Silent Rampart</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>Effect</th><th>Base cost</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Recycling optimization</strong> (lvl 0)</td><td>Each recycler brings back 1,000 + 400 × level resources per 5-minute cycle (1,400 at level 1, 3,000 at level 5, i.e. triple)</td><td>25,000</td></tr>
                    <tr><td><strong>Ideological reinforcement</strong> (lvl 1)</td><td>+20&nbsp;% worker defense per level (+100&nbsp;%)</td><td>50,000</td></tr>
                    <tr><td><strong>Improved armaments</strong> (lvl 2)</td><td>+10&nbsp;% ship power per level (+50&nbsp;%)</td><td>100,000</td></tr>
                    <tr><td><strong>Soviet structure</strong> (lvl 3)</td><td>Reduced Legionnaire upkeep: −9&nbsp;% at level 1, −33&nbsp;% at level 5</td><td>150,000</td></tr>
                    <tr><td><strong>Volunteer recruitment</strong> (lvl 4)</td><td>−1 Bitcoin per level on the recruitment price of a Legionnaire (8 → 3 Bitcoins)</td><td>200,000</td></tr>
                    <tr><td><strong>Empire without borders</strong> (lvl 5)</td><td>+1 planet conquered per invasion per level (+5)</td><td>250,000</td></tr>
                    <tr><td><strong>War Points</strong> (lvl 6)</td><td>+10&nbsp;% WP earned per level (+50&nbsp;%)</td><td>300,000</td></tr>
                </tbody>
            </table>

            <h3>The Hammer of Stars</h3>
            <table>
                <thead>
                    <tr><th>Research</th><th>Effect</th><th>Base cost</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Family policy</strong> (lvl 0)</td><td>+20&nbsp;% worker production per level (+100&nbsp;%)</td><td>25,000</td></tr>
                    <tr><td><strong>Improved armaments</strong> (lvl 1)</td><td>+10&nbsp;% ship power per level (+50&nbsp;%)</td><td>50,000</td></tr>
                    <tr><td><strong>Planned invasions</strong> (lvl 2)</td><td>+25&nbsp;% barge capacity per level: 1,250 Legionnaires per barge at level 1, 2,250 at level 5</td><td>100,000</td></tr>
                    <tr><td><strong>Military power</strong> (lvl 3)</td><td>+10&nbsp;% Legionnaire strength, on attack and defense alike, per level (+50&nbsp;%)</td><td>150,000</td></tr>
                    <tr><td><strong>Mechanical superiority</strong> (lvl 4)</td><td>Reduced Mech upkeep: −17&nbsp;% at level 1, −50&nbsp;% at level 5</td><td>200,000</td></tr>
                    <tr><td><strong>Mech armor</strong> (lvl 5)</td><td>+10&nbsp;% Mech defense per level (+50&nbsp;%)</td><td>250,000</td></tr>
                    <tr><td><strong>Empire without borders</strong> (lvl 6)</td><td>+1 planet conquered per invasion per level (+5)</td><td>300,000</td></tr>
                </tbody>
            </table>

            <h2 id="choose">Which researches to prioritize?</h2>
            <ul>
                <li><strong>The Balance of Worlds</strong> → Macron law, Scientific mobilization, Improved cargos.</li>
                <li><strong>The Silent Rampart</strong> → Improved armaments, Empire without borders, War Points.</li>
                <li><strong>The Hammer of Stars</strong> → Family policy, Planned invasions, Military power, Mech armor.</li>
            </ul>
            <p>Everyone chooses their own researches, but the last ones only open by raising the alliance level: organize it together in chat, using the treasury.</p>

    salon:
        title: "The alliance chat"
        category: "alliance"
        order: 7
        tags: "salon,chat,discussion,alliance,message"
        summary: "Your alliance's chat: live, with history, clickable coordinates and shared chats with your allies."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="how">How it works</h2>
            <p>The <strong>alliance chat</strong> is a live chat reserved for the members of your alliance. Open <strong>Salon</strong> in the menu: your alliance's chat is the tab that bears its name.</p>
            <p>There you also find the <strong>Universe</strong> chat (the whole server), a chat for each galaxy where you have a planet and, for each <strong>defensive alliance</strong> signed, a chat shared by the two alliances (deleted along with its messages when the defensive alliance ends).</p>
            <p>Messages are kept: you can scroll back through the history to find a piece of info.</p>

            <h2 id="use">What it is for</h2>
            <ul>
                <li><strong>Coordinate attacks</strong>: launching a raid as a pair beats a lone player getting pushed back.</li>
                <li><strong>Alert</strong> when an enemy fleet is spotted.</li>
                <li><strong>Share coordinates</strong> (target planets, interesting debris fields): written in the <code>galaxy:sector:position</code> format (e.g. <code>1:15:25</code>), they become a link that opens that sector on the space map (the galaxy must exist, the sector must range from 1 to 100 and the position from 1 to 25). Links to a game page also become clickable.</li>
                <li><strong>Discuss alliance strategy</strong> (researches, diplomacy, wars).</li>
                <li><strong>Introduce yourself</strong> to new members and build ties.</li>
            </ul>

            <h2 id="best-practices">Best practices</h2>
            <ul>
                <li>Stay respectful: insults and harassment can be sanctioned. An abusive message is reported from the message itself (see <a href="/wiki/moderation_blocking">Moderation</a>).</li>
                <li>Avoid spamming: leave room for strategic discussions. A message is at most <strong>200 characters</strong> long, and you can send 20 per minute.</li>
                <li>To address someone, click their name: "Name &gt;" is added to your message. A message that contains your name, or your alliance's tag in square brackets (e.g. <code>[TAG]</code>), is highlighted for you.</li>
                <li>When advice is given, write it down: messages scroll fast.</li>
            </ul>

            <h2 id="private">What about private messages?</h2>
            <p>Apart from the chat, you can send a <strong>private message</strong> to any player on the server, including outside your alliance. Useful for discreet diplomacy, for answering a proposal, or for asking an alliance to invite you. Coordinates and game links become clickable there exactly as in the chat.</p>

    alliance_improvements:
        title: "Alliance Improvements"
        category: "alliance"
        order: 8
        tags: "improvements,alliance,bonus,bitcoin,investment,collective,levels"
        summary: "Invest Bitcoins to unlock 16 collective bonuses that strengthen your whole alliance — research speed, production, combat power and more."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="overview">Principle</h2>
            <p>The <strong>Improvements</strong> tab of the alliance page lets members invest Bitcoins to unlock and upgrade <strong>16 collective bonuses</strong>. These bonuses benefit <strong>all members</strong> of the alliance, logged in or not. A player who leaves the alliance stops benefiting from them, but the alliance keeps its levels.</p>

            <h2 id="quota">Investment quota</h2>
            <p>Each member has <strong>20 investments per 3-hour period</strong>. The period starts at your first investment; after 3 hours, the quota returns to 20. Unused investments are lost: the quota does not accumulate. The tab shows your "Available investments" and, when the quota is used up, the time remaining before the "Next window".</p>
            <p>Each investment costs <strong>1,000 Bitcoins</strong> taken from your personal balance. It is a final expense, with no refund. A validated account and a confirmed e-mail are required to invest.</p>
            <p>Under each bonus, quick buttons <strong>×1 / ×5 / ×10</strong> let you invest several points in one click.</p>

            <h2 id="levels">Levels and thresholds</h2>
            <p>Each bonus has <strong>5 levels</strong>. The investment thresholds required to reach the next level are:</p>
            <table>
                <thead>
                    <tr><th>Level</th><th>Investments needed</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1,000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Excess investments beyond a level's threshold are <strong>lost</strong>: there is no carry-over to the next level.</p>
            <p>To bring a bonus to level 5, you need <strong>3,360 investments</strong> in total, i.e. 3,360,000 Bitcoins. It is a collective project: at 20 investments per 3-hour period, a lone player would need 168 periods.</p>

            <h2 id="bonuses">The 16 bonuses and their effects</h2>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Effect per level</th><th>Maximum (level 5)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Research speed</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Research cost</strong></td><td>−1&nbsp;% per level</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Construction boost</strong></td><td>+15 s reduction per help</td><td>75 s reduction per help</td></tr>
                    <tr><td><strong>Building cost</strong></td><td>−1&nbsp;% per level</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Niobium production</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Water production</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Ration production</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Fleet speed</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Missile power</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Laser power</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Plasma power</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Accuracy</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Fleet armor</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Shield</strong></td><td>+1&nbsp;% per level</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Planetary defense</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Hero experience</strong></td><td>+2&nbsp;% per level</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>The <strong>Construction boost</strong> feeds directly into <a href="/wiki/alliance_construction_help">construction help</a>: the higher its level, the more each ally's help shortens the construction time.</p>
            <p>Do not confuse the "Research speed" improvement with the "Scientific mobilization" political research of the Balance of Worlds (for the one who researches it, see <a href="/wiki/alliance_research">Alliance researches</a>). The "Research speed" improvement shortens the duration displayed on the Research page, but not the real duration: a research that has been launched ends at the time calculated without it.</p>

            <h2 id="absence">What if a member is away?</h2>
            <p>There is no vacation mode. An absent member <strong>keeps all their alliance bonuses</strong> (production, improvements, political researches) as long as they stay in the alliance, and their alliance tax keeps being deducted every day. After <strong>7 days</strong> without logging in, an inactive leader is automatically replaced (see <a href="/wiki/alliance_grades#afk">Grades and permissions</a>). After <strong>8 days</strong>, the account switches to autopilot, but it remains a member of the alliance.</p>

    alliance_construction_help:
        title: "Construction Help"
        category: "alliance"
        order: 9
        tags: "help,construction,alliance,boost,building,acceleration"
        summary: "One click to speed up all your allies' constructions at once — and they do the same for you."
        related: "alliance_improvements"
        body: |
            <h2 id="overview">Principle</h2>
            <p><strong>Construction help</strong> lets the members of an alliance speed up each other's ongoing constructions with a single click. When one or more allies have a construction in progress on their planet, a <strong>help icon</strong> (a hand holding a heart) appears in the interface's global bar. The badge shows the number of eligible constructions. A validated account and a confirmed e-mail are required to help.</p>
            <p>One click on this icon automatically triggers help on <strong>all the alliance's eligible constructions</strong> at once: no need to select them one by one.</p>

            <h2 id="gain">Gain per help</h2>
            <p>Each help given speeds up the construction by:</p>
            <blockquote><strong>15 seconds × level of the "Construction boost" bonus</strong></blockquote>
            <p>The gain is <strong>capped at 75 seconds</strong> per help and per member (level 5 × 15 s = 75 s). This level is that of <strong>your alliance</strong>: all its members bring the same gain per help. A construction cannot drop below <strong>30 seconds remaining</strong> thanks to help.</p>
            <table>
                <thead>
                    <tr><th>Bonus level</th><th>Gain per help</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (not unlocked)</td><td>15 s</td></tr>
                    <tr><td>1</td><td>15 s</td></tr>
                    <tr><td>2</td><td>30 s</td></tr>
                    <tr><td>3</td><td>45 s</td></tr>
                    <tr><td>4</td><td>60 s</td></tr>
                    <tr><td>5</td><td>75 s</td></tr>
                </tbody>
            </table>

            <h2 id="eligibility">Eligibility of a construction</h2>
            <p>For a construction to be helped, two conditions must be met:</p>
            <ul>
                <li><strong>Total duration &gt; 30 seconds</strong> (between the start and the planned end).</li>
                <li><strong>Time remaining &gt; 30 seconds</strong> at the moment the help is given.</li>
            </ul>
            <p>Almost finished constructions (30 s remaining or less) do not benefit from help.</p>

            <h2 id="deduplication">One help per construction</h2>
            <p>A given member can help <strong>each construction only once</strong>. The icon disappears automatically when there is no construction left that you have not yet helped. Several members can help the same construction, and the gains add up: 3 members of a level 3 alliance each bring 45 s, i.e. 135 s in total.</p>

            <h2 id="link">Link with alliance improvements</h2>
            <p>The gain per help depends directly on the level of the <strong>"Construction boost"</strong> bonus in the <a href="/wiki/alliance_improvements">Improvements</a> tab. Investing in this bonus benefits everyone: the faster your allies finish their buildings, the faster the alliance's empire grows.</p>

    leveling:
        title: "Levels and experience"
        category: "progression"
        order: 1
        tags: "level,experience,progression,score"
        summary: "Your progression from level 2 to level 40, fed by the growth of your score."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="score">What counts toward your score</h2>
            <p>Your score (your <strong>points</strong>, the ones in the ranking) measures the <strong>size of your empire</strong>. It is recalculated once a day, at the 18:59 daily report (Paris time), and adds up:</p>
            <table>
                <tr><th>Element</th><th>What is worth 1 point</th></tr>
                <tr><td><strong>Workers</strong></td><td>100 workers.</td></tr>
                <tr><td><strong>Ships in the hangar</strong> (and in production)</td><td>120 thermal signature (for example 6 frigates, with a signature of 20 each).</td></tr>
                <tr><td><strong>Ships in a fleet</strong></td><td>20 signature (for example 1 frigate). A ship in a fleet counts <strong>six times more</strong> than in the hangar.</td></tr>
                <tr><td><strong>Legionnaires</strong></td><td>500 on a planet, about 83 aboard a fleet.</td></tr>
                <tr><td><strong>Mechs</strong></td><td>25 on a planet; aboard a fleet, each Mech is worth 2 points.</td></tr>
                <tr><td><strong>Scientists</strong></td><td>About 17 on a planet, 25 on a fleet.</td></tr>
                <tr><td><strong>Turrets</strong></td><td>Each turret is worth: missile launcher 0.9; laser turret 0.6; heavy laser turret 1.2; ion laser 1.2; plasma artillery 0.8; Gauss cannon 2.4.</td></tr>
                <tr><td><strong>Buildings</strong> (per level)</td><td>Niobium mine, Water extractor, Agricultural field: 15 · Ground radar: 20 · Barracks: 25 · Aeroponic farm, Research center, Shipyard: 30 · Niobium warehouse, Water reservoir, Agricultural silo: 45 · Weapons factory: 50 · Space radar: 60 · Large city: 65 · Radar jammer: 100 · Metropolis: 120 · Defensive fort: 130 · Heavy industry: 150 · Nuclear base: 300 · Floating city, Orbital station: 2,000. The Prison and the Slave camp earn no points.</td></tr>
            </table>
            <p>The troop values are the base ones: regime researches that reduce the upkeep of Legionnaires, Mechs or scientists also reduce the points they earn. War Points do not count toward the score.</p>
            <p>Losing ships in combat, demolishing a building or seeing troops die therefore lowers your score at the next report.</p>

            <h2 id="experience">Score, experience and level</h2>
            <p>Your level depends on your <strong>experience</strong>, which only grows with your score. At each daily report, if your new score exceeds that of the day before yesterday, the difference is added to your experience.</p>
            <p>Example: your score was 10,000 the day before yesterday, 11,000 yesterday and 12,000 today: you gain 2,000 experience points at today's report.</p>
            <p>If your score drops, you gain no experience that day, but you never lose any: <strong>your level never goes back down</strong>. Total experience is not displayed in the game; only the level is.</p>

            <h2 id="tiers">Level tiers</h2>
            <p>Every commander starts at <strong>level 2</strong>, with 0 experience points. Experience to reach for each level:</p>
            <table>
                <tr><th>Level</th><th>Experience</th><th>Level</th><th>Experience</th></tr>
                <tr><td>2</td><td>0</td><td>22</td><td>24,000,000</td></tr>
                <tr><td>3</td><td>2,000</td><td>23</td><td>30,000,000</td></tr>
                <tr><td>4</td><td>10,000</td><td>24</td><td>50,000,000</td></tr>
                <tr><td>5</td><td>40,000</td><td>25</td><td>80,000,000</td></tr>
                <tr><td>6</td><td>100,000</td><td>26</td><td>100,000,000</td></tr>
                <tr><td>7</td><td>150,000</td><td>27</td><td>200,000,000</td></tr>
                <tr><td>8</td><td>200,000</td><td>28</td><td>250,000,000</td></tr>
                <tr><td>9</td><td>280,000</td><td>29</td><td>500,000,000</td></tr>
                <tr><td>10</td><td>450,000</td><td>30</td><td>800,000,000</td></tr>
                <tr><td>11</td><td>800,000</td><td>31</td><td>1,000,000,000</td></tr>
                <tr><td>12</td><td>1,000,000</td><td>32</td><td>2,000,000,000</td></tr>
                <tr><td>13</td><td>1,300,000</td><td>33</td><td>3,000,000,000</td></tr>
                <tr><td>14</td><td>2,000,000</td><td>34</td><td>6,000,000,000</td></tr>
                <tr><td>15</td><td>3,000,000</td><td>35</td><td>12,500,000,000</td></tr>
                <tr><td>16</td><td>5,000,000</td><td>36</td><td>25,000,000,000</td></tr>
                <tr><td>17</td><td>7,000,000</td><td>37</td><td>50,000,000,000</td></tr>
                <tr><td>18</td><td>9,000,000</td><td>38</td><td>80,000,000,000</td></tr>
                <tr><td>19</td><td>12,000,000</td><td>39</td><td>100,000,000,000</td></tr>
                <tr><td>20</td><td>15,000,000</td><td>40</td><td>200,000,000,000</td></tr>
                <tr><td>21</td><td>18,000,000</td><td></td><td></td></tr>
            </table>
            <p>Level 40 is the maximum. Progression is <strong>exponential</strong>: going from level 2 to level 10 is much faster than from 30 to 40.</p>

            <h2 id="use">What your level is for</h2>
            <ul>
                <li><strong>Login bonus</strong> — the floor of the daily bonus equals your level × 5,000 Bitcoins, multiplied by a draw from ×1 to ×5 (see <em>Login bonus</em>).</li>
                <li><strong>Showcase</strong> — your level is displayed on the commander card (Global view page) and on your profile. The ranking, however, is based on points, not on level.</li>
            </ul>

    war_points:
        title: "War Points (WP)"
        category: "progression"
        order: 2
        tags: "wp,points,war,combat,ranking"
        summary: "The game's second currency, earned mostly in combat, to spend on Bitcoins, troops, elite ships and buildings."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="what">What are WP?</h2>
            <p><strong>War Points</strong> (<strong>WP</strong>) are a second progression "currency", <strong>combat-oriented</strong>. Where your level reflects the growth of your empire, your WP reflect your military activity. They are displayed in the resource bar, and are specific to each server: on a new server, you start again from zero.</p>

            <h2 id="earn">How to earn them</h2>
            <ul>
                <li><strong>Space combat</strong> — the winner gains WP proportional to the signature of the enemy fleet destroyed (1 WP per 100 signature in a fleet-versus-fleet combat), never based on their own losses. A Cthulhu horde or an alien fleet yields 5 times less than a player fleet of the same signature (anti-farming safeguard).</li>
                <li><strong>Losing a space combat</strong> — a consolation is still paid to you: 1 WP per 500 signature lost, i.e. one fifth of what a winner would get for the same fleet.</li>
                <li><strong>Orbital defense</strong> — when your turrets wipe out a fleet in orbit: 1 WP per 100 signature destroyed (5 times less against a Cthulhu or an alien). Razing the defenses of an enemy planet, however, earns the attacker nothing.</li>
                <li><strong>Raids</strong> — the victorious attacker gains 1 WP per 100 defending Legionnaires and Mechs killed.</li>
                <li><strong>Invasions</strong> — a successful invasion earns very little: 1 WP per 60,000 defending Legionnaires killed (a killed worker counts as a tenth of a Legionnaire).</li>
                <li><strong>Repelling a raid or an invasion</strong> — the defender gains about 7.5 WP per 100 attacking Legionnaires killed.</li>
                <li><strong>Eliminating a player</strong> — if your invasion takes their last planet, you recover all their WP and all their Bitcoins.</li>
                <li><strong>Cthulhu</strong> — repelling a horde that attacks your planet earns WP based on the horde's strength, and breaking a Cthulhu blockade earns a reward in Bitcoins and WP, shared according to each person's damage. Tower Defense, for its part, earns uranium, not WP.</li>
                <li><strong>Daily objectives</strong> — each objective completed earns WP, and completing them all earns, at the daily report, a bonus equal to their average reward (see <em>Daily quests</em>).</li>
                <li><strong>Arena (hero duels)</strong> — each duel won earns 15 WP per level of your hero, reduced by up to half if the two heroes have very different levels (in either direction). Examples: level 10 hero against level 10 = 150 WP; level 10 against level 4 = 75 WP. The podium of the arena's weekly ranking (300 / 200 / 100 WP) and that of the tournaments (500 / 300 / 150 WP, and 50 WP for each participant) also earn some.</li>
                <li><strong>Prison</strong> — executing a captured hero earns 100 WP per level of the hero.</li>
                <li><strong>Sales to merchants</strong> — each sale earns a few WP on top of the Bitcoins.</li>
                <li><strong>Tutorial</strong> — 500 WP are part of its rewards.</li>
                <li><strong>Alliance bank</strong> — a withdrawal from your alliance's bank can pay you WP.</li>
            </ul>
            <p>The <strong>War Points</strong> alliance research (alliance level 6 minimum) increases by 10&nbsp;% per level, up to +50&nbsp;%, the WP earned in space combat, orbital defense, raids, invasions and sales to merchants.</p>

            <h2 id="use">What they are for</h2>
            <ul>
                <li><strong>Shop on the Objectives page</strong> — exchange your WP for Bitcoins (1 WP = 1 Bitcoin), Legionnaires (1 WP = 2 Legionnaires) or workers (1 WP = 10 workers), delivered to the planet of your choice within its capacity.</li>
                <li><strong>Elite ships</strong> — some ships are paid for in WP (and workers): Plasma hunter (1 WP), Combat corvette (3), Battleship (8), Caravel (25), Mother ship (25,000), per unit.</li>
                <li><strong>Buildings</strong> — the Floating city and the Orbital station cost 2,000 WP per targeted level (2,000 for level 1, 4,000 for level 2…).</li>
                <li><strong>Territorial expansion research</strong> — 75,000 WP for level 1, 150,000 for level 2.</li>
                <li><strong>Torturing a prisoner</strong> — 200 WP to reveal the position of an enemy planet.</li>
                <li><strong>Alliance bank</strong> — you can deposit WP there.</li>
                <li><strong>Ranking</strong> — the "Wps" column of the Commander Rankings lets you compare players' military activity.</li>
                <li><strong>Paid Server</strong> — the winner is the player with the highest "points + 2 × WP" total at the end of the server.</li>
            </ul>

            <h2 id="perdre">Can you lose them?</h2>
            <ul>
                <li><strong>By spending them</strong> — Objectives page shop, elite ships, Floating city, Orbital station, Territorial expansion research, torturing a prisoner, deposit to the alliance bank. Cancelling a ship production, a construction or a research gives you back the WP spent.</li>
                <li><strong>By being eliminated</strong> — if a player invades your last planet, you are Game Over and they recover <strong>all</strong> your WP and your Bitcoins.</li>
                <li><strong>Peace tax</strong> — if your alliance has accepted a peace that pays a tribute in WP, a share of the WP you earn in combat goes to the winning alliance.</li>
            </ul>
            <p>Losing a combat takes no WP away from you (you even get a small consolation), and an economic bankruptcy does not affect them.</p>

            <h2 id="strategy">Strategy</h2>
            <p>WP reward <strong>aggressive</strong> players. If you want to climb in the "Wps" column of the ranking, concentrate on space combat, defending your planets, raids and the arena rather than on pure economic growth.</p>

    quests:
        title: "Daily quests"
        category: "progression"
        order: 3
        tags: "quests,objectives,daily,mission,reward,wp"
        summary: "3 objectives every day, to complete before the next report, paid in War Points."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Every day, at the <strong>18:59 (Paris time)</strong> daily report, the game assigns you <strong>3 daily quests</strong>, called "Objectives" in the menu. They are small tasks you can complete during your normal play session.</p>
            <p>You have until the next report to complete them: the ones left over are then removed and replaced by 3 new ones.</p>
            <p>When you arrive on a server, your first quests are always the same: write a message in the chat room, probe a player's planet and join or create an alliance (except in Battle Royale).</p>
            <p>The game only gives you quests that can be done within the day: no construction without the required research or space, no attack while you are under beginner protection, no raid or invasion without a barge, no "Colonize a planet" if you already own 20 colonized planets, etc.</p>

            <h2 id="examples">Possible quests</h2>
            <p>The day's 3 quests are drawn at random from this list (base reward in WP):</p>
            <table>
                <tr><th>Quest</th><th>Base reward</th></tr>
                <tr><td>Send a private message</td><td>250</td></tr>
                <tr><td>Write a message in the chat room (any chat you have access to)</td><td>250</td></tr>
                <tr><td>Spend War Points (in the shop of the Objectives page)</td><td>250</td></tr>
                <tr><td>Probe a player's planet</td><td>250</td></tr>
                <tr><td>Change your avatar (if you do not have one)</td><td>250</td></tr>
                <tr><td>Sell resources to merchants</td><td>500</td></tr>
                <tr><td>Create a new Cohort</td><td>500</td></tr>
                <tr><td>Train Legionnaires</td><td>500</td></tr>
                <tr><td>Upgrade your ships</td><td>500</td></tr>
                <tr><td>Build defenses (troops or turrets)</td><td>500</td></tr>
                <tr><td>Build ships</td><td>500</td></tr>
                <tr><td>Build a shield</td><td>750</td></tr>
                <tr><td>Colonize a planet</td><td>1,000</td></tr>
                <tr><td>Recycle resources</td><td>1,000</td></tr>
                <tr><td>Build the building Large city</td><td>1,000</td></tr>
                <tr><td>Complete a research</td><td>1,000</td></tr>
                <tr><td>Train scientists</td><td>1,000</td></tr>
                <tr><td>Destroy an enemy fleet (non-utility)</td><td>1,000</td></tr>
                <tr><td>Build a space base</td><td>1,000</td></tr>
                <tr><td>Build a large shield</td><td>1,750</td></tr>
                <tr><td>Build the building Metropolis</td><td>2,000</td></tr>
                <tr><td>Join/Create an alliance (if you do not have one)</td><td>2,000</td></tr>
                <tr><td>Build the building Heavy industry</td><td>4,000</td></tr>
                <tr><td>Invade a player's planet</td><td>4,000</td></tr>
                <tr><td>Raid a player's planet</td><td>4,000</td></tr>
                <tr><td>Launch a nuclear strike on a player's planet</td><td>5,000</td></tr>
            </table>
            <p>For buildings, any completed construction counts, whatever its level. "Complete a research" does not exist on servers where all researches are unlocked from the start.</p>

            <h2 id="reward">Rewards</h2>
            <ul>
                <li>Each completed quest earns <strong>WP</strong>, credited right away: the gain is the <strong>higher</strong> of the quest's base reward and <strong>5&nbsp;% of the average points of the server's players</strong> (recalculated at each daily report), to stay worthwhile even when empires become huge.</li>
                <li>The reward shown on the Objectives page is the one you will receive.</li>
                <li><strong>Bonus</strong>: if you complete <strong>all your objectives of the day</strong> before the next report, the daily report also pays you the <strong>average reward of those objectives</strong>, like one more objective.</li>
            </ul>
            <p>Example: if the server average is 30,000 points, "Send a private message" earns 1,500 WP instead of 250, while "Invade a player's planet" stays at 4,000. If that day your three objectives pay 15,000, 15,000 and 12,000 WP and you complete them all, the next report pays you a bonus of 14,000 WP.</p>

            <h2 id="view">Where to see them</h2>
            <p>Your quests of the day are on the <strong>Objectives</strong> page (menu, target icon); a badge shows how many you have left (for example 2/3). Each quest is listed there with its reward in WP and its rarity (from 1 to 5 stars).</p>
            <p>They are validated automatically: as soon as you do the action, the quest disappears from the list and an "Objective completed" message shows your gain. This same page lets you spend your WP (Bitcoins, Legionnaires, workers).</p>

    ranking:
        title: "Rankings"
        category: "progression"
        order: 4
        tags: "ranking,rank,position,top,leaderboard"
        summary: "Several rankings to measure your progress (and your rivals')."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="types">Available rankings</h2>
            <table>
                <tr><th>Ranking</th><th>Based on</th><th>Reward</th></tr>
                <tr><td><strong>Commander Rankings</strong></td><td>Your <strong>points</strong>: workers, ships, troops, turrets and buildings (see <em>Levels and experience</em>). The Position, Username, Planets, Points and <strong>Wps</strong> (War Points) columns can be sorted with one click.</td><td>No direct reward. When the server closes, finishing in the top 10 unlocks the <em>Elite</em> achievement, and the winner gets <em>Emperor</em>.</td></tr>
                <tr><td><strong>Alliance Rankings</strong></td><td>Sum of the members' points (the server's top 100 alliances).</td><td>No direct reward.</td></tr>
                <tr><td><strong>Duel ranking</strong> (arena)</td><td>Win rate of your main hero in duels (victories ÷ duels fought), from 5 duels.</td><td>Every Monday, the 3 heroes who won the most duels during the past week (5 duels minimum in the week) receive 300 / 200 / 100 WP and 3,000 / 2,000 / 1,000 uranium.</td></tr>
                <tr><td><strong>Alliance ranking during a Cthulhu blockade</strong></td><td>What each alliance does against the hive during the blockade.</td><td>Production bonus or penalty for 72&nbsp;hours (see <em>The Cthulhu Prophecies</em>).</td></tr>
            </table>
            <p>The points and positions of the Commander Rankings are recalculated once a day, at the daily report (18:59, Paris time); next to each player, an arrow and a number show the change since the previous report. War Points, for their part, are always up to date.</p>

            <h2 id="view">Where to see them</h2>
            <p>Open the <strong>Global view</strong> page: on your commander's card, the <strong>"Rank: N"</strong> link opens the Commander Rankings, and your alliance's name opens the Alliance Rankings. Your rank is therefore always visible on this card.</p>
            <p>In the Commander Rankings, you can search for a player by their name or by their alliance's tag, and sort each column. Your row is highlighted, as are those of your allies and your enemies. On the first page, a chart compares the evolution of your points and your WP with the server average.</p>
            <p>The duel ranking is on the <strong>Hero</strong> page, <strong>Arena</strong> tab. A blockade's ranking is displayed on the <strong>Cthulhu</strong> page during the event.</p>

            <h2 id="why">Why it matters</h2>
            <ul>
                <li><strong>Strategic</strong> — identify the big players to avoid or to target.</li>
                <li><strong>Social</strong> — a showcase for recruiting into your alliance.</li>
                <li><strong>Competition</strong> — on a <strong>Paid Server</strong>, the winner is the player with the highest "points + 2 × War Points" total at the end of the server. On all servers, your final rank counts toward your achievements (top 10 = <em>Elite</em>).</li>
            </ul>

    heroes:
        title: "Your hero"
        category: "progression"
        order: 5
        tags: "hero,bonus,planet,fleet,xp,capture,prison,specialty"
        summary: "Your personal hero: it levels up, fights, boosts your empire, and can be captured."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Each player has <strong>a single main hero</strong>, created at the start of the game. This hero must <strong>always</strong> be assigned to either a planet or a fleet — never free. You can also own an unlimited number of <strong>secondary heroes</strong> — see the dedicated article.</p>
            <p>As long as you have no main hero — at the start of the game, or after its execution in prison —, the game takes you back to its creation: the game pages stay closed until then, while those of your account remain accessible. If one of your secondary heroes occupies the planet chosen for the new hero, it goes back to <strong>reserve</strong>.</p>
            <p>The hero brings bonuses according to its skills, its specialty, its level and its items. Its 4 skills are: <strong>Attack</strong>, <strong>Defense</strong>, <strong>Intelligence</strong> and <strong>Speed</strong>. Each point invested is worth <strong>+1&nbsp;%</strong>:</p>
            <ul>
                <li><strong>Attack</strong>: firepower of the fleet it accompanies.</li>
                <li><strong>Defense</strong>: armor of the fleet it accompanies; on a planet, ground defense against Cthulhu landings.</li>
                <li><strong>Intelligence</strong>: niobium, water and food production of the planet where it is assigned (and only that one).</li>
                <li><strong>Speed</strong>: flight time of the fleet it accompanies (−1&nbsp;% per point, total reduction capped at 90&nbsp;%).</li>
            </ul>
            <p>Attack and Defense play no part in ground combat between players (raid, invasion): only the Military specialty and its traits count there. In an arena duel, all four skills go into the score: Intelligence feeds Cunning and Speed feeds Momentum (see the <em>PvP Arena</em> article).</p>

            <h2 id="specialties">Specialties</h2>
            <p>Each specialty grants a passive bonus, raises the cap of one or two skills and unlocks 3 traits at levels 5, 10 and 15:</p>
            <ul>
                <li><strong>Military</strong>: +5&nbsp;% firepower for the fleet it accompanies; on a planet, +5&nbsp;% to turret fire and ground defense; in ground combat between players, +5&nbsp;% to the power of its side (on attack and defense alike); +5&nbsp;% in arena duels. Attack and Defense cap raised to 50&nbsp;%. Traits: <strong>Intimidation</strong> (lvl 5, the opponent suffers −5&nbsp;% offensive power, including against Cthulhu, and −5&nbsp;% score in duels), <strong>Tactician</strong> (lvl 10, +10&nbsp;% power in the first round of your combats, and +10&nbsp;% in duels), <strong>Warlord</strong> (lvl 15, −5&nbsp;% losses of your ground troops in combat between players, and +5&nbsp;% power in duels).</li>
                <li><strong>Economy</strong>: doubles the Intelligence bonuses (production, production items included) and the Slave camp bonuses of the planet where it is assigned. Intelligence cap raised to 50&nbsp;%. Traits: <strong>Efficient</strong> (lvl 5: shown on the hero's sheet as −10&nbsp;% construction, this trait has no effect on constructions), <strong>Trader</strong> (lvl 10, +15&nbsp;% on merchant sales made by its fleet or from its planet), <strong>Magnate</strong> (lvl 15, +20&nbsp;% production on its planet).</li>
                <li><strong>Explorer</strong>: +5&nbsp;% accuracy for the fleet it accompanies, and doubles its Speed bonus (items included) for flight time. Speed cap raised to 50&nbsp;%. Traits: <strong>Scout</strong> (lvl 5, +1 radar strength on the planet where it is assigned), <strong>Navigator</strong> (lvl 10, an extra −15&nbsp;% flight time for its fleet), <strong>Cartographer</strong> (lvl 15, +2 more radar strength, i.e. +3 in total with Scout).</li>
            </ul>

            <p>In an <strong>arena duel</strong>, these same rules apply: the military hero keeps their +5&nbsp;% and their three traits, the economist's doubled Intelligence (plus 20&nbsp;% with Magnate) feeds Cunning, and the explorer's doubled Speed (plus 15&nbsp;% with Navigator) feeds Momentum. Cunning and Momentum count for 60&nbsp;% of their value.</p>
            <p>A detailed summary of these bonuses is displayed automatically when the hero is created.</p>

            <h2 id="xp">Gaining experience</h2>
            <p>XP is earned in several ways:</p>
            <ul>
                <li><strong>Combat</strong>: a fixed part (space combat victory 150 XP, raid won 100, invasion succeeded 200, defeat 25), plus a part tied to the enemy's strength: its signature ÷ 150, divided by the hero's level. Example: a level 5 hero who destroys a fleet of 30,000 signature gains 150 + 40 = 190 XP.</li>
                <li><strong>Arena duel</strong> (and each tournament fight): only the winner gains XP, from 30 XP for a crushing victory to 90 XP for a very close duel. The loser gets none.</li>
                <li><strong>Passive</strong>: a hero assigned to a planet (not on a fleet) gains 5 XP per hour of absence, credited when you come back (40 XP after 8 hours of absence). Logins less than 12 minutes apart earn none.</li>
            </ul>
            <p>All XP earned is increased by your alliance's XP bonus and, if the hero is assigned to a planet with a Slave camp, by +5&nbsp;% per prisoner held there (+25&nbsp;% at most). A captured hero gains no XP.</p>
            <p>To go from level N to level N+1, you need N × 500 XP: 500 XP to reach level 2, 5,000 XP to go from level 10 to level 11, and 22,500 XP in total to reach level 10. Each level gained gives <strong>2 skill points</strong>, to be distributed from the Hero page. Each point is worth +1&nbsp;% in the chosen skill, up to 30&nbsp;% per skill (50&nbsp;% for the skill or skills of your specialty). Item bonuses are added beyond these caps.</p>

            <h2 id="assignment">Assignment</h2>
            <p>Assign your hero from the <strong>Hero</strong> page ("Reassign hero" button), from the <strong>Planets</strong> page (a planet's "Assign hero" button) or from a <strong>fleet</strong>'s management page ("Assign" button). The change is immediate, with no travel time.</p>
            <p>A planet or a fleet can only host one hero. A planet under embargo cannot receive a hero, and a hero stationed on a planet under embargo cannot join a fleet. A hero on a fleet in flight or in combat cannot be reassigned.</p>
            <p>If its fleet is destroyed and it is not captured, the hero lands on the combat planet if it belongs to you and has no hero; otherwise on your oldest planet without a hero. If all your planets already have a hero, your main hero takes the place of one of your secondary heroes, which goes back to reserve.</p>

            <h2 id="capture">Capture</h2>
            <p>Your main hero can be captured during a combat:</p>
            <ul>
                <li><strong>Space combat against fleets</strong> (your fleet is destroyed): 20&nbsp;% chance. The destruction of your fleet by a planet's defenses alone, or by a fleet without weapons, does not capture your main hero.</li>
                <li><strong>Invasion</strong> of the planet where it is assigned: 35&nbsp;% chance. The hero aboard the invasion fleet never risks capture, even if the invasion fails, and a raid never captures.</li>
            </ul>
            <p>A capture requires a <strong>Prison building of level 1 or more</strong>: the hero is locked up at the combat location if it belongs to the winner and has a Prison, otherwise on the winner's planet with the highest Prison. With no Prison at all, no capture.</p>
            <p>After release, the hero enjoys <strong>24h of immunity</strong> against recapture.</p>
            <p>Only a player can capture your main hero: neither the Cthulhus nor the AI commanders do. Be careful, though: AI commanders can capture or execute your secondary heroes.</p>
            <p>This section describes your <strong>main</strong> hero. Your <strong>secondary heroes</strong> follow a completely different capture rule, with no probability — see the <em>Secondary heroes</em> article.</p>

    secondary_heroes:
        title: "Secondary heroes"
        category: "progression"
        order: 6
        tags: "hero,secondary,roster,capture,execution,prison,recycling,reserve,loot"
        summary: "Extra heroes obtained as rare loot: same bonuses as your main hero, but they can be captured or permanently executed in combat."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principle">Principle</h2>
            <p>A secondary hero brings <strong>the same bonuses</strong> as a main hero once placed on a planet or a fleet. What sets it apart: it can be <strong>captured or killed permanently</strong> in case of defeat. You can accumulate several, in addition to your main hero.</p>

            <h2 id="acquisition">How you get them</h2>
            <p>A secondary hero is a <strong>rare loot</strong>, never purchasable:</p>
            <table>
                <thead>
                    <tr><th>Source</th><th>Chance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu Tower Defense victory (per run)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Cthulhu attack repelled on one of your planets (landing repelled or horde wiped out in orbit)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Winner of an arena tournament</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>When obtained, it is level 1, its name and specialty are drawn at random, and it arrives directly in <strong>reserve</strong> — it is up to you to decide where to place it, or to recycle it without ever placing it.</p>

            <p>Each hero obtained is announced to you by a <strong>report</strong> that says where it came from. The Tower Defense end screen and the victory report against the Cthulhus also flag it on the spot.</p>

            <h2 id="placement">Where to place them</h2>
            <p>Like your main hero: <strong>a planet</strong> or <strong>a fleet</strong>, never both at once. An unplaced secondary stays in <strong>reserve</strong>: no bonus, but <strong>no risk</strong> either — it is a normal choice, not an oversight to fix. Manage all your secondaries from the <strong>Roster</strong> tab of the Hero page: "Assign" button to place it, "Recall to reserve" to remove it.</p>

            <h2 id="management">Skills and equipment</h2>
            <p>A secondary hero progresses like the main one: it gains levels, and with them <strong>skill points</strong>. The <strong>Manage</strong> button of the Roster opens their distribution among Attack, Defense, Intelligence and Speed.</p>
            <p>The same panel manages its <strong>equipment</strong>: put a free item from your inventory on it, or take it back. The items of a captured enemy hero come back to you with it — that is where you recover them.</p>

            <h2 id="risk">What you risk</h2>
            <p>A placed secondary hero can be lost <strong>permanently</strong> in:</p>
            <ul>
                <li>A lost <strong>space combat</strong> (its fleet is destroyed).</li>
                <li>A lost <strong>utility combat</strong> (a fleet without any weapon, wiped out without even fighting).</li>
                <li>A successful <strong>invasion</strong> of the planet where it is stationed.</li>
                <li>The destruction of its fleet by the <strong>orbital defenses</strong> of a planet set to attack mode.</li>
            </ul>
            <p>It risks <strong>nothing</strong>, on the other hand, in:</p>
            <ul>
                <li>The <strong>ground combat of a raid</strong> — even a successful one, a raid never takes the planet. However, if the fleet carrying it is destroyed in orbit, it is exposed as with any destroyed fleet.</li>
                <li>A combat against the <strong>Cthulhus</strong> (or against the Merchant). Careful: <strong>AI commanders</strong> follow the same rule as players and can capture or execute your secondary heroes.</li>
                <li>The <strong>arena</strong> — duels and tournaments expose no hero to capture.</li>
            </ul>

            <p>A <strong>notification</strong> warns you as soon as one of your secondaries is captured or executed: a permanent loss does not depend on whether you open your report.</p>

            <h2 id="prison">The prison condition</h2>
            <p>Unlike your main hero (<em>probabilistic</em> capture, see the <em>Prison and captured heroes</em> article), the fate of a defeated secondary is <strong>entirely deterministic</strong>, with no chance involved:</p>
            <ul>
                <li>The winner owns a <strong>Prison building</strong> of level 1 or more on at least one of their planets → they <strong>capture</strong> the hero, with its level, experience and items intact.</li>
                <li>The winner has <strong>no</strong> Prison built → the hero is <strong>executed</strong>, and its items join the winner's inventory.</li>
            </ul>
            <p>In block combat (several allies side by side), the hero goes to the winning commander who <strong>committed the most power</strong> to the combat — if they have no Prison, the hero is executed even if an ally on the same side had one.</p>
            <p>A captured secondary is <strong>not</strong> a classic prisoner: no prison page, no escape, no ransom. It arrives directly, active, in its new owner's Roster, in reserve, ready to be placed or recycled.</p>

            <h2 id="no-recovery">No recovery possible</h2>
            <p>Once captured or executed, a secondary hero is lost <strong>for good</strong>: neither escape, nor ransom, nor release by invasion of its former owner can get it back. The only way to see it again is to take it back yourself in combat — and it can thus circulate indefinitely from empire to empire.</p>

            <h2 id="identity">A captured hero keeps its identity</h2>
            <p>A captured secondary keeps its <strong>name</strong>, its <strong>level</strong> and its <strong>experience</strong>. In your Roster, it shows its original commander ("Captured from …").</p>

            <h2 id="recycling">Recycling</h2>
            <p>You can <strong>recycle</strong> one of your secondary heroes ("Recycle" button of the Roster): it is destroyed and your main hero receives <strong>90&nbsp;%</strong> of all the experience that secondary has accumulated since level 1 (alliance XP bonuses do not apply). Its items go back to your inventory.</p>
            <p>Example: a level 10 secondary yields 20,250 XP, enough to take a main hero from level 10 to level 13.</p>
            <p>A figures preview (XP transferred, projected level of the main hero) is displayed before confirmation. Recycling is impossible while its fleet is in flight or in combat. <strong>Irreversible action.</strong></p>

    items:
        title: "Hero items"
        category: "progression"
        order: 6
        tags: "items,equipment,bonus,rarity,drop,cthulhu,fusion"
        summary: "Equip your hero with up to 3 items to stack bonuses. How to get them."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principle">Principle</h2>
            <p>Items are objects that can be equipped on your heroes (maximum <strong>3 items</strong> per hero). Their bonuses add to the hero's, beyond the skill caps. What they bring depends on their bonus types, detailed below.</p>

            <h2 id="categories">Categories</h2>
            <ul>
                <li><strong>Offensive</strong> (weapons), <strong>Defensive</strong> (armor, shields) and <strong>Power</strong> (status objects).</li>
            </ul>
            <p>The category only changes the item's name and appearance: its bonuses are drawn at random among all types, whatever its category. So look at the bonuses shown on the card, not the category. No type constraint: you can equip 3 offensive ones if you wish.</p>

            <h2 id="rarities">Rarities</h2>
            <ul>
                <li><strong>Common</strong>: 1 bonus (+2 to 5&nbsp;%)</li>
                <li><strong>Rare</strong>: 1 or 2 bonuses (+5 to 10&nbsp;% each)</li>
                <li><strong>Epic</strong>: 2 or 3 bonuses (+10 to 15&nbsp;% each)</li>
                <li><strong>Legendary</strong>: 3 or 4 bonuses (+15 to 25&nbsp;% each)</li>
            </ul>
            <p>Each bonus is drawn at random within its rarity's range when the item is created, then no longer changes.</p>
            <p>The hero's level does not change an item's bonuses: they add as they are, whether the hero is level 1 or 20. Only the specialty matters: an Economy hero doubles Production bonuses and an Explorer doubles Fleet speed bonuses. In duels, since the score is proportional to level, the same item earns more points for a high-level hero, for the same share of their score.</p>

            <h2 id="bonuses">Bonus types</h2>
            <p>16 bonus types exist. Here is where each one acts (the names are those shown on the cards):</p>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Effect</th></tr>
                </thead>
                <tbody>
                    <tr><td>Fleet attack, Fleet defense, Fleet precision, Fleet shield</td><td>Combats of the fleet the hero accompanies.</td></tr>
                    <tr><td>Fleet speed</td><td>Flight time of the fleet the hero accompanies.</td></tr>
                    <tr><td>Production</td><td>Niobium, water and food production of the planet where the hero is assigned.</td></tr>
                    <tr><td>Legionnaire force</td><td>Ground defense of the planet where the hero is assigned, against Cthulhu landings only.</td></tr>
                    <tr><td>Duel power</td><td>Score in arena duels.</td></tr>
                    <tr><td>Mech force, Build speed, Worker production, Spaceship production, Radar range, Recycling speed, Cthulhu damage, XP gain</td><td>These bonuses only apply in arena duels.</td></tr>
                </tbody>
            </table>
            <p>In an arena duel, all 16 types count, with a weight that depends on the type (see the <em>PvP Arena</em> article). A fleet bonus carried by a hero assigned to a planet only acts in duels.</p>

            <h2 id="obtain">Obtaining</h2>
            <p>Here are all the ways to obtain items:</p>

            <h3>Fighting the Cthulhus</h3>
            <p>An item can drop when you beat Cthulhus, whether you repel their ground landing or wipe out their entire horde in orbit before it lands. The chances are identical in both cases and depend on your PvE difficulty:</p>
            <ul>
                <li><strong>Easy</strong>: 30&nbsp;% chance to get an item (22&nbsp;% common, 7&nbsp;% rare, 1&nbsp;% epic)</li>
                <li><strong>Normal</strong>: 40&nbsp;% chance (25&nbsp;% common, 10&nbsp;% rare, 4.5&nbsp;% epic, 0.5&nbsp;% legendary)</li>
                <li><strong>Hard</strong>: 50&nbsp;% chance (25&nbsp;% common, 15&nbsp;% rare, 8&nbsp;% epic, 2&nbsp;% legendary)</li>
            </ul>
            <p>A horde only partially destroyed in orbit still lands: it is then that landing which triggers the draw, never both at once.</p>

            <h3>Arena victories</h3>
            <p>Each arena duel victory, tournament fights included, offers a chance at an item:</p>
            <ul>
                <li><strong>Common</strong>: 10&nbsp;%</li>
                <li><strong>Rare</strong>: 4&nbsp;%</li>
                <li><strong>Epic</strong>: 1&nbsp;%</li>
            </ul>
            <p>That is about a 15&nbsp;% chance of getting an item with each victory.</p>

            <h3>Duel stakes</h3>
            <p>When issuing a challenge, you can stake an item. If the opponent accepts, they must stake an item of the same rarity. The winner takes both items.</p>

            <h3>Other sources</h3>
            <ul>
                <li><strong>Cthulhu Tower Defense</strong>: each victory entitles you to a draw according to the chances of your difficulty above (two draws on Hard).</li>
                <li><strong>Arena tournaments</strong>: guaranteed epic item for 1st place, rare for 2nd and 3rd, 10&nbsp;% chance of a common for the other participants (see the <em>PvP Arena</em> article).</li>
                <li><strong>Login bonus</strong>: a common item on the 3rd day of your streak, a rare item on the 7th.</li>
            </ul>

            <h3>Merging three items</h3>
            <p>Three items of the <strong>same rarity</strong> merge into an item of the next rarity up, at no cost or delay. The new item's category and bonuses are drawn at random, as for an item found in combat. The three original items are permanently consumed, and an item worn by a hero must first be unequipped. Legendary is the maximum rarity: it cannot be merged.</p>
            <p>Merging is started from the <strong>Hero</strong> page, <strong>Fusion</strong> tab: click three item cards to select them (the whole card is clickable), then confirm with the merge button, available both at the top and at the bottom of the list.</p>

            <h2 id="theft">Item theft</h2>
            <p>If your main hero is captured, each of its equipped items can be stolen by the winner. Theft probability: Common 80&nbsp;%, Rare 60&nbsp;%, Epic 40&nbsp;%, Legendary 25&nbsp;%.</p>
            <p>Items that are not stolen stay on your hero during its captivity: it keeps them if released, but the jailer takes them all if it executes it. A captured secondary hero takes all its items to its new owner.</p>

            <h2 id="inventory">Inventory</h2>
            <p>Access your inventory from the <strong>Hero</strong> page, <strong>Inventory</strong> tab. From the inventory, you can:</p>
            <ul>
                <li><strong>Equip</strong> an item on your main hero (if it is not captured, carries fewer than 3 items and is not aboard a fleet in flight or in combat). Secondary heroes are equipped from the <strong>Roster</strong> tab ("Manage" button).</li>
                <li><strong>Unequip</strong> an item to put it back in the inventory (impossible while its fleet is in flight or in combat).</li>
                <li><strong>Destroy</strong> an item you no longer need.</li>
                <li><strong>Merge</strong> 3 items of the same rarity into an item of the next rarity up, from the neighboring <strong>Fusion</strong> tab.</li>
            </ul>
            <p>Each item is presented as an <strong>illustrated card</strong> showing its image, its bonuses and a colored border according to its rarity. The cards are arranged in a grid (3 to 4 per row depending on the space available on your screen).</p>

    prison:
        title: "Prison and captured heroes"
        category: "progression"
        order: 7
        tags: "prison,capture,hero,escape,torture,ransom,jailer,secondary"
        summary: "When a hero is captured, what happens? The options of the prisoner and the jailer, and the direct capture of enemy secondary heroes."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Capturing a hero</h2>
            <p>A main hero is captured during a space combat against fleets (20&nbsp;%) or the invasion of the planet where it is assigned (35&nbsp;%) — details in the <em>Your hero</em> article. The captured player is locked up: any page outside the allowed perimeter sends them back to the <strong>prison page</strong>. They keep access, however, to the <strong>alliance chat</strong>, their <strong>private messages</strong>, their <strong>reports</strong>, the <strong>view</strong> (read-only) of their alliance, their <strong>account management</strong> and the <strong>server change</strong>. Everything else — construction, fleets, map, market, arena, and even the Hero page — stays inaccessible until they are freed.</p>
            <p>A capture requires a <strong>Prison building of level 1 or more</strong>: the hero is locked up at the combat location if it belongs to the winner and has a Prison, otherwise on the winner's planet with the highest Prison. With no Prison at all, no capture.</p>

            <h2 id="prisoner">Prisoner actions</h2>
            <p>The prisoner has several actions. <strong>Alert alliance</strong> and <strong>Rebel</strong> share the same delay: one of the two is possible right after capture, then one every <strong>4 hours</strong>.</p>
            <ul>
                <li><strong>Alert alliance</strong> (70&nbsp;% + 2&nbsp;% per hero level, 90&nbsp;% at most; 80&nbsp;% at level 5): sends the prison's coordinates to the alliance chat. Failure = the jailer is alerted. Without an alliance, the action is unavailable. After a failure, the next action waits 6 hours instead of 4.</li>
                <li><strong>Rebel</strong> (25&nbsp;% + 1.5&nbsp;% per level, +10&nbsp;% for a Military hero; 50&nbsp;% for a level 10 Military hero): destroys 5&nbsp;% of the prison planet's niobium, water and food. Failure = loss of one level. In both cases, the jailer receives a report.</li>
                <li><strong>Escape</strong>: one attempt every 4 hours from the capture (the first one 4 hours after). 40&nbsp;% success, +5&nbsp;% per 4-hour block of captivity, up to 100&nbsp;% after 52 hours. Failure = the jailer is alerted. This delay is independent of the two previous actions.</li>
                <li><strong>Escape thanks to Slash</strong>: at any time and with no limit. See the <em>Escaping from prison</em> article.</li>
                <li><strong>Pay the ransom</strong>: if the jailer has demanded one, you can pay or refuse it from the prison page.</li>
            </ul>

            <h2 id="jailer">Jailer actions</h2>
            <p>Your prisoners are managed from the <strong>Hero</strong> page, <strong>Held Prisoners</strong> tab:</p>
            <ul>
                <li><strong>Execute</strong>: destroys the hero permanently and earns you 100 WP per hero level (1,200 WP for a level 12). You recover all its remaining items. Its owner is informed by a report.</li>
                <li><strong>Liberate</strong>: a diplomatic gesture, the hero returns to its owner.</li>
                <li><strong>Torture</strong> (200 WP): reveals the coordinates of a randomly chosen planet of the prisoner's owner (it may already be known), and makes the prisoner lose 50 XP. Repeatable with no delay.</li>
                <li><strong>Ransom</strong>: demand niobium, water and/or uranium in exchange for its release. The prisoner has 24 hours to pay or refuse; only one request at a time, but you can make a new one after a refusal or an expiry.</li>
            </ul>

            <h2 id="release">Release</h2>
            <ul>
                <li><strong>The prisoner's alliance invades</strong> the prison planet: automatic release.</li>
                <li><strong>Another player invades</strong> the prison planet: 60&nbsp;% chance that the prisoner escapes in the chaos; otherwise they stay locked up and the invader, the planet's new owner, becomes their jailer.</li>
                <li><strong>The Cthulhus seize the prison planet</strong>: prisoners are not released. They stay locked up in the Cthulhu base and must escape on their own (see <em>Escaping from prison</em>). If the planet becomes uninhabited again, they are released.</li>
                <li><strong>The jailer abandons the prison planet</strong> (or leaves the game): the prisoner is released automatically.</li>
            </ul>

            <h2 id="secondary">Capturing an enemy secondary hero</h2>
            <p>Everything above — escape, torture, ransom, release — concerns an opponent's <strong>main hero</strong>. A <strong>secondary hero</strong> (see the <em>Secondary heroes</em> article) obeys a much more direct rule, and this is where your Prison building becomes <strong>decisively useful</strong>: as soon as you own a Prison of level 1 or more on one of your planets, any enemy secondary hero defeated against you (space combat, utility combat, destruction of its fleet by your orbital defenses or successful invasion) <strong>immediately and permanently</strong> becomes yours — with its level, experience and items intact. Without a Prison, it is <strong>executed</strong> instead of captured, and its items join your inventory.</p>
            <p>A captured secondary is <strong>not</strong> a prisoner in the sense of this page: there is no prison page, no escape, no ransom possible. It arrives directly, active, in your <strong>Roster</strong> — ready to be placed on a planet or a fleet, or recycled.</p>

            <h2 id="requirements">Requirements</h2>
            <p><strong>Prison system</strong> research (requires Barbed wire level 5), then the <strong>Prison</strong> and <strong>Slave camp</strong> buildings.</p>

    prison_escape:
        title: "Escaping from prison"
        category: "progression"
        order: 8
        tags: "prison,escape,slash,ransom,hero,capture"
        summary: "The three ways to get out of prison on your own: instant escape, Slash and the ransom."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Three ways out</h2>
            <p>When your hero is captured, the prison page offers you three ways to get out without waiting for your allies: instant escape, escape thanks to Slash and paying a ransom.</p>

            <h2 id="instant">Instant escape</h2>
            <ul>
                <li>One attempt every <strong>4 hours</strong>. The first opens 4 hours after the capture.</li>
                <li><strong>40&nbsp;%</strong> success on the first attempt, then <strong>+5&nbsp;%</strong> per 4-hour block of captivity, whether or not you have tried your luck.</li>
                <li>The chance rises up to <strong>100&nbsp;%</strong>: 65&nbsp;% after 24 hours of captivity, 95&nbsp;% after 48 hours, and guaranteed success from <strong>52 hours</strong>. The hero's level has no influence.</li>
                <li>The chance of the next attempt is displayed on the button.</li>
                <li>Failure: your hero stays in prison and <strong>the jailer is alerted</strong>.</li>
            </ul>

            <h2 id="slash">Escaping thanks to Slash</h2>
            <p><strong>Slash</strong> is our other game (slash-game.com). Play it with the <strong>same e-mail address</strong> as your Area Universe account, confirmed on both sides.</p>
            <ul>
                <li>Reach <strong>75&nbsp;% of the week's best score</strong> in a game played <strong>after your capture</strong>.</li>
                <li>As long as the current week (since Monday 00:00 UTC) has fewer than 10 ranked players or its best score is under 50 points, the previous week's best score is used as the reference.</li>
                <li>Go back to the prison page and click <strong>Check my score</strong>: your hero is freed.</li>
                <li><strong>Unlimited</strong> attempts, with no delay, and the jailer is not alerted.</li>
                <li>A guest account or an unconfirmed address cannot use this way out.</li>
            </ul>

            <h2 id="ransom">Paying the ransom</h2>
            <p>If the jailer demands a ransom (niobium, water and/or uranium), you are warned by a report and it appears on the prison page with its amount and its deadline (24 hours). You can <strong>pay</strong> it or <strong>refuse</strong> it.</p>
            <p>Refusing does not free your hero: the jailer is simply informed and can offer you a new ransom. The payment is taken from all of your planets and paid to the prison planet. If you do not have enough resources, the payment is refused and nothing is taken.</p>

            <h2 id="sans-rancon">And without a ransom?</h2>
            <p>The jailer is never obliged to demand a ransom, and your captivity has no fixed duration. Without a ransom, your hero gets out of prison if:</p>
            <ul>
                <li>you succeed at an <strong>instant escape</strong>: the chance increases by 5&nbsp;% every 4 hours and reaches 100&nbsp;% after <strong>52 hours</strong> of captivity;</li>
                <li>you reach the required score on <strong>Slash</strong>;</li>
                <li>your alliance <strong>invades</strong> the prison planet (release guaranteed), or another player invades it (60&nbsp;% chance of escape);</li>
                <li>the jailer <strong>liberates</strong> you, or abandons the prison planet.</li>
            </ul>
            <p>While you are captive, the jailer can also torture your hero (50 XP lost each time) or execute it. It is therefore better to attempt the escape as soon as possible.</p>

            <h2 id="after">After release</h2>
            <p>Your hero returns to your oldest planet without a hero, with its remaining items, and enjoys <strong>24 hours of immunity</strong> against a new capture.</p>

    arena:
        title: "PvP Arena"
        category: "progression"
        order: 8
        tags: "arena,duel,tournament,pvp,hero,challenge,ranking"
        summary: "Challenge other heroes to 1-on-1 duels. Stake uranium or items, win prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="challenges">Challenge system</h2>
            <p>From the <strong>Hero</strong> page, <strong>Arena</strong> tab ("Issue a challenge" form), or from the "Challenge to duel" button on a player's profile, challenge another player. You cannot challenge a member of your alliance. The challenged player receives a report and can <strong>accept</strong> or <strong>refuse</strong> the challenge.</p>
            <ul>
                <li>A challenge expires automatically after <strong>7 days</strong> without an answer. The number of pending challenges received is displayed on the Arena tab and on the "Hero" menu entry. The time left before expiry is displayed next to each challenge received. Once it has expired, you can challenge the same player again.</li>
                <li>You can <strong>cancel</strong> a challenge you sent as long as it is pending.</li>
                <li>Cooldown: each hero must wait <strong>1 hour</strong> after its last duel, whoever the opponent. This delay is checked when the challenge is sent <strong>and</strong> when it is accepted, for both heroes: stacking pending challenges therefore does not let you chain several duels.</li>
                <li>A captured hero can neither challenge nor be challenged. Capture and membership in the same alliance are rechecked at acceptance.</li>
                <li>The hero is never in danger (no capture in the arena).</li>
            </ul>

            <h2 id="combat">Combat resolution</h2>
            <p>When the challenged player accepts, the combat is resolved <strong>immediately</strong> and the result is shown on the screen of the player who accepted: victory or defeat, both scores, the rewards and the stake won or lost. Both players also receive a report. The score is based on:</p>
            <ul>
                <li><strong>Level</strong> of the hero: the base of the score</li>
                <li><strong>Offense</strong>: the hero's attack, +5&nbsp;% if military, and the offensive bonuses of its items</li>
                <li><strong>Defense</strong>: the hero's defense and the defensive bonuses of its items</li>
                <li><strong>Cunning</strong> (weight 60&nbsp;%): Intelligence — doubled for an economist, +20&nbsp;% with the Magnate trait — and the utility bonuses of items</li>
                <li><strong>Momentum</strong> (weight 60&nbsp;%): Speed — doubled for an explorer, +15&nbsp;% with the Navigator trait — and the fleet speed of items</li>
                <li><strong>Military traits</strong>: Tactician +10&nbsp;%, Warlord +5&nbsp;%, and Intimidation removes 5&nbsp;% from the opponent's score</li>
                <li><strong>Specialty</strong>: rock-paper-scissors advantage (Military &gt; Explorer &gt; Economy &gt; Military, +10&nbsp;%)</li>
                <li><strong>Random factor</strong> of ±15&nbsp;% on each side</li>
            </ul>
            <p>In practice: score = level × 10 × (1 + Offense + Defense + 0.6 × Cunning + 0.6 × Momentum + traits), where each bonus counts for its value (10&nbsp;% = 0.10). The result is then multiplied by 1.10 in case of a specialty advantage and by 0.95 if the opponent has Intimidation, then chance applies. Example: a level 10 Military hero with 10&nbsp;% Attack, 8&nbsp;% Defense, no items, and the Tactician trait gets 10 × 10 × (1 + 0.15 + 0.08 + 0.10) = 133. Level therefore weighs more than everything else.</p>
            <p>In a duel, all item bonuses count, with a weight according to their type (they are not doubled by the specialty):</p>
            <ul>
                <li><strong>Offense</strong>: Duel power (×1.5); Legionnaire force and Fleet attack (×1); Mech force, Fleet precision and Cthulhu damage (×0.5).</li>
                <li><strong>Defense</strong>: Fleet defense and Fleet shield (×1).</li>
                <li><strong>Cunning</strong>: Production (×1); Worker production, Spaceship production, Build speed, Recycling speed and Radar range (×0.5); XP gain (×0.25).</li>
                <li><strong>Momentum</strong>: Fleet speed (×1).</li>
            </ul>

            <h2 id="stakes">Stakes</h2>
            <p>When issuing a challenge, you can add an optional stake:</p>
            <ul>
                <li><strong>Uranium</strong>: each player stakes the same amount. The winner takes both stakes.</li>
                <li><strong>Item</strong>: each player stakes an item of the same rarity. The winner takes both items. The item must be <strong>unequipped</strong> (on both sides) and cannot be committed to two pending challenges at once.</li>
                <li><strong>Friendly</strong>: no stake, only the base rewards are awarded.</li>
            </ul>
            <p>The stake is covered if at least one of your planets has the required uranium: it is taken from your planet richest in uranium. If a player no longer has enough uranium on any planet at the time of acceptance, the challenge fails. If the item staked by the challenger is no longer available when the challenged player accepts (it no longer belongs to them or it is equipped), the duel is refused.</p>

            <h2 id="rewards">Base rewards</h2>
            <p>The winner receives at each duel:</p>
            <ul>
                <li>Uranium: between 5 and 15, multiplied by the average level of the two heroes ÷ 10, capped at <strong>20</strong> per duel (5 to 15 between two level 10s). It is paid to your smallest planet, like the uranium of stakes won.</li>
                <li>War points: 15 × the winner's level, multiplied by the ratio between the lower and the higher of the two levels (never less than half). Two level 15 heroes: 225 WP; a level 15 beating a level 10: 150 WP.</li>
                <li>XP: from 30 to 90 depending on how close the duel was (see the <em>Your hero</em> article).</li>
                <li>Item chance: about 15&nbsp;% in total (10&nbsp;% common, 4&nbsp;% rare, 1&nbsp;% epic)</li>
            </ul>
            <p>The loser loses nothing (except their stake, if any), but gains neither XP nor reward.</p>

            <h2 id="ranking">Ranking</h2>
            <p>A per-server ranking shows the best duelists:</p>
            <ul>
                <li>Ranked by duel win percentage (tournament fights do not count), then by number of victories</li>
                <li>Minimum <strong>5 fights</strong> to appear</li>
                <li>The <strong>top 5</strong> are directly visible on the page; a button opens the full ranking with pagination and sorting</li>
                <li>Weekly rewards paid out automatically every <strong>Monday</strong> for the previous week (Monday 0h to Sunday 24h, Paris time), only once: top 3 according to the week's <strong>number of duel victories</strong>, with a minimum of <strong>5 duels</strong> in the week. Only players are concerned (neither AI commanders nor deleted accounts). 1st = 3,000 uranium + 300 WP, 2nd = 2,000 + 200 WP, 3rd = 1,000 + 100 WP. Each rewarded player receives a report.</li>
            </ul>

            <h2 id="tournaments">Tournaments</h2>
            <p>Periodic server event: one tournament every <strong>7 days</strong> per server.</p>
            <ul>
                <li>Registration open for <strong>24h</strong> from the Arena tab of the Hero page. A captured hero cannot register, and is excluded if captured before registration closes.</li>
                <li>When registration closes, the whole bracket is played at once: single elimination after a random draw (when the number of qualified players is odd, one of them gets a bye, in any round), then a match for 3rd place between the two semifinal losers.</li>
                <li>At least <strong>2 participants</strong> are needed: otherwise the tournament is cancelled (no rewards) and the registered players are informed by report. With a single registered player, the tournament takes place if an AI commander can fill the bracket.</li>
                <li>As soon as at least one player is registered, the server's <strong>AI commanders</strong> (main hero not captured) fill the bracket up to <strong>8 participants</strong> in total. They register gradually during the 24h of registration, and the bracket is filled at closing if some are still missing.</li>
                <li>If <strong>8 or more players</strong> are registered, no AI commander takes part. With no registered player, the tournament does not take place: AI commanders never play among themselves.</li>
                <li>Each tournament fight also earns its winner the usual duel rewards.</li>
                <li>AI commanders compete for the podium and receive the same rewards as players, except the chance of obtaining a secondary hero.</li>
                <li>The champion keeps a 25&nbsp;% chance of obtaining a secondary hero (reserved for players).</li>
            </ul>
            <p>Rewards:</p>
            <ul>
                <li>1st = 5,000 uranium + 500 WP + 1 epic item (20&nbsp;% chance of a legendary item on top)</li>
                <li>2nd = 3,000 uranium + 300 WP + 1 rare item (10&nbsp;% chance of an epic item on top)</li>
                <li>3rd = 1,500 uranium + 150 WP + 1 rare item</li>
                <li>Other participants = 500 uranium + 50 WP (10&nbsp;% chance of a common item)</li>
            </ul>
            <p>Each participant receives a report with their ranking and their rewards. The Arena page shows the registration end countdown, the podium of the last tournament and the date of the next one.</p>

    login_bonus:
        title: "Login bonus"
        category: "progression"
        order: 9
        tags: "bonus,login,daily,bitcoin,streak"
        summary: "Free Bitcoins every day, multiplied if you chain several consecutive days."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principle">The principle</h2>
            <p>Each <strong>calendar day</strong> (the day changes at midnight, Paris time), the game gives you a Bitcoin bonus, on each of the servers where you play. A window opens when you arrive in the game: click <strong>"Claim"</strong> to receive it. The game can also warn you with a notification when the day's bonus is available.</p>
            <p>The amount is the <strong>more advantageous</strong> of the two calculations below, then it is multiplied by your streak:</p>
            <ul>
                <li>A <strong>floor tied to your level</strong>: <strong>level × 5,000 Bitcoins</strong>, multiplied each day by a random draw of ×1, ×2, ×3, ×4 or ×5. It guarantees a motivating bonus early in the game.</li>
                <li><strong>5&nbsp;% of the server's average Bitcoins</strong> — so the bonus stays worthwhile as the server's economy grows.</li>
                <li>The result is then multiplied by your <strong>streak multiplier</strong> (see below).</li>
            </ul>
            <p>This average only counts players (no bots or test accounts); from 20 players, it excludes the richest 5&nbsp;% and the poorest 5&nbsp;%. It is recalculated once a day.</p>
            <p>Floor by level (before the streak multiplier; every commander starts at level 2):</p>
            <table>
                <tr><th>Level</th><th>Possible floor</th><th>On day 7 (×5)</th></tr>
                <tr><td>2</td><td>10,000 to 50,000</td><td>50,000 to 250,000</td></tr>
                <tr><td>5</td><td>25,000 to 125,000</td><td>125,000 to 625,000</td></tr>
                <tr><td>10</td><td>50,000 to 250,000</td><td>250,000 to 1,250,000</td></tr>
                <tr><td>15</td><td>75,000 to 375,000</td><td>375,000 to 1,875,000</td></tr>
                <tr><td>20</td><td>100,000 to 500,000</td><td>500,000 to 2,500,000</td></tr>
                <tr><td>30</td><td>150,000 to 750,000</td><td>750,000 to 3,750,000</td></tr>
                <tr><td>40</td><td>200,000 to 1,000,000</td><td>1,000,000 to 5,000,000</td></tr>
            </table>
            <p>For another level, multiply it by 5,000 (draw ×1) and by 25,000 (draw ×5).</p>
            <p>Example: at level 10, the day's draw gives ×2, i.e. a floor of 100,000 Bitcoins. If the server average is 3,000,000 Bitcoins, 5&nbsp;% makes 150,000: that is the amount retained. On the 3<sup>rd</sup> day of the streak (×1.5), you receive 225,000 Bitcoins.</p>

            <h2 id="streak">The 7-consecutive-day streak</h2>
            <p>Claiming your bonus <strong>every day</strong> raises your multiplier:</p>
            <table>
                <tr><th>Consecutive day</th><th>Multiplier</th></tr>
                <tr><td>Day 1</td><td>×1.0</td></tr>
                <tr><td>Day 2</td><td>×1.2</td></tr>
                <tr><td>Day 3</td><td>×1.5</td></tr>
                <tr><td>Day 4</td><td>×1.8</td></tr>
                <tr><td>Day 5</td><td>×2.0</td></tr>
                <tr><td>Day 6</td><td>×2.5</td></tr>
                <tr><td>Day 7</td><td>×5.0</td></tr>
            </table>
            <p>On the 8<sup>th</sup> day, the cycle restarts at day 1. You must claim the bonus <strong>every calendar day</strong> (midnight to midnight, Paris time): if a day goes by without a claim, the streak restarts at day 1. The number of hours between two logins does not count, only the day does. Claiming Monday at 0:05 then Tuesday at 23:55 keeps the streak; claiming Monday at 23:59 then Wednesday at 0:01 breaks it.</p>

            <h2 id="items">Bonus items</h2>
            <p>Some days of the streak also give a random <strong>item for your hero</strong>:</p>
            <ul>
                <li><strong>Day 3</strong>: a common item.</li>
                <li><strong>Day 7</strong>: a rare item.</li>
            </ul>

            <h2 id="claim">How to claim it</h2>
            <p>The "Login bonus" window opens automatically when you arrive in the game: one click on <strong>"Claim"</strong> credits the Bitcoins (and the day 3 or 7 item). It also shows your personal record of days in a row, which cannot exceed 7 since the streak restarts at day 1 after day 7.</p>

            <h2 id="tip">A small tip</h2>
            <p>Even 30 seconds are enough: open the game and click "Claim". Do not miss day 7, that is where it pays the most.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,elimination,bankruptcy,end"
        summary: "The 2 ways to lose the game, and what you have left afterwards."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">The 2 types of Game Over</h2>
            <p>There are two ways to lose everything on a server: bankruptcy, which leaves you your planets but not your ships, and the loss of all your planets, which resets your commander to zero. Knowing them is already a way to protect yourself.</p>

            <h2 id="bankruptcy">1. Economic bankruptcy</h2>
            <p>If, after the <strong>18:59 daily report (Paris time)</strong>, your Bitcoin balance is <strong>negative</strong>: <strong>economic Game Over</strong>.</p>
            <ul>
                <li>All your <strong>fleets</strong> are deleted, in flight and in orbit, with their cargo and their troops.</li>
                <li>All the <strong>ships on the ground</strong> of your planets are lost.</li>
                <li>Your balance is <strong>reset to 125,000 Bitcoins</strong>.</li>
            </ul>
            <p>You keep your planets, buildings, defenses, researches, ground troops and your ranking: you keep playing, but without any ship.</p>
            <p><strong>You are warned beforehand:</strong> as soon as your balance falls below the projected daily deficit (upkeep cost minus the last report's income), a "Bankruptcy imminent" alert report warns you — at most one per day. If you receive it, act before the next daily report.</p>

            <h2 id="planets">2. Losing all your planets</h2>
            <p>If you lose your <strong>last planet</strong> — invaded by a player or by the Cthulhus, or, in Battle Royale, when your sector disappears —, your commander is eliminated. You cannot voluntarily abandon your last planet.</p>
            <ul>
                <li>If a player invades your last planet, they <strong>pocket all your Bitcoins and all your War Points</strong>.</li>
                <li>Your <strong>fleets</strong> are deleted (if the Cthulhus take your last planet, they come under their control).</li>
                <li>Your commander is <strong>reset to zero</strong>: 125,000 Bitcoins, researches and political researches reset to zero, terraforming divided by 2, ranking reset, hero and reports deleted.</li>
                <li>You leave your alliance (it is dissolved if you were its only member, or the Leader of a Hammer of Stars alliance).</li>
                <li>Your career on this server is <strong>recorded</strong> in your account profile.</li>
            </ul>

            <h2 id="avoid">How to avoid Game Over</h2>
            <ul>
                <li>Check your <strong>balance</strong> (income − costs) every day. If it turns red, react.</li>
                <li>Put unused fleets on the ground: their upkeep is divided by 6.</li>
                <li>Do not over-recruit: an army on permanent upkeep can ruin an inattentive economist.</li>
                <li>Always keep <strong>at least 2 planets</strong> able to defend themselves.</li>
                <li>Watch for <strong>incoming enemy fleets</strong> (notifications, radar).</li>
                <li>In case of serious danger, <strong>evacuate</strong> your troops and resources to a safe planet.</li>
            </ul>

            <h2 id="after">What is left afterwards?</h2>
            <p>Even eliminated, you keep your <strong>player account</strong> and your <strong>statistics</strong> from previous games. You can join another server, or register again on the same one from the server selection page ("Server" menu) as long as its registrations are open: you then start again from a new starting planet.</p>

    game_modes:
        title: "Server modes"
        category: "events"
        order: 1
        tags: "mode,battle royale,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe offers 7 different server modes, each with its own rules and goals."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Overview</h2>
            <p>Each Area Universe server has a <strong>mode</strong>, chosen by the admin when it is created. The mode sets the duration, the victory condition and the presence of the Cthulhus.</p>
            <table>
                <thead>
                    <tr><th>Mode</th><th>Duration</th><th>Victory condition</th><th>Cthulhu?</th><th>Alliances?</th><th>Researches</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu</td><td>300 days</td><td>None</td><td>Yes</td><td>Yes</td><td>Normal</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>30 days at most</td><td>The VIP who survives 72&nbsp;h</td><td>No</td><td>Yes (except for the VIP)</td><td>Max from the start</td></tr>
                    <tr><td>Domination</td><td>60 days</td><td>Best individual score at the end</td><td>No</td><td>Yes</td><td>Max from the start</td></tr>
                    <tr><td>Battle Royale</td><td>40 days at most</td><td>Last survivor</td><td>No</td><td>No</td><td>Max from the start</td></tr>
                    <tr><td>Paid Server</td><td>60 days</td><td>Best weighted score (points + 2 × WP)</td><td>No</td><td>Yes</td><td>Normal</td></tr>
                    <tr><td>Long Run</td><td>900 days</td><td>None (marathon)</td><td>During "Cthulhu Attack" events</td><td>Yes</td><td>Normal</td></tr>
                    <tr><td>Short Run</td><td>150 days</td><td>None (sprint)</td><td>During "Cthulhu Attack" events</td><td>Yes</td><td>Normal</td></tr>
                </tbody>
            </table>
            <p>A game that designates a winner (Search &amp; Destroy, Battle Royale) stops as soon as that winner is known, and the server closes: the duration shown is then a maximum.</p>
            <p>In the server list, some modes carry a different name: <strong>Long Run</strong> is shown as "Long term" and <strong>Short Run</strong> as "Short term"; <strong>Search &amp; Destroy</strong> and <strong>Paid Server</strong> keep their names.</p>

            <h2 id="cthulhu">Cthulhu mode (classic PvE)</h2>
            <p>The base mode, perfect for discovering the game. During the server's <strong>first 72 hours</strong>, no Cthulhu attack: this is the <strong>preparation phase</strong>. During this phase, the server carries the "Locked" badge in the server list and refuses new commanders (message "This server is locked (preparation or registrations closed).").</p>
            <p>After that, Cthulhu hordes attack you regularly. The first is launched <strong>5 days after your registration</strong>, then a new horde leaves every <strong>18 to 30 hours</strong> on Easy, <strong>12 to 24 hours</strong> on Normal and <strong>8 to 16 hours</strong> on Hard. You can also turn PvE off completely in your <strong>Preferences</strong> (see the <em>The Cthulhu threat</em> article).</p>
            <p>No victory condition and no winner: at the end of the 300 days, the server closes and your result (ranking, points…) stays on your career profile. The <strong>Elite</strong> achievement rewards a place in a server's top 10.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (VIP hunt)</h2>
            <p>The server's <strong>first 48 hours</strong> are used for setup: no VIP is designated yet. As in Cthulhu mode, the server then carries the "Locked" badge and refuses new commanders.</p>
            <p>After that, a <strong>VIP</strong> is drawn at random among the players still in the game, and the public chat announces "New VIP: …". Their objective: <strong>survive 72 hours</strong>. If they manage it, they win and the game stops immediately.</p>
            <ul>
                <li>If they are eliminated (game over) by a player, <strong>the killer becomes the new VIP</strong> ("The VIP was eliminated by …") and the 72-hour countdown restarts from zero.</li>
                <li>If they are eliminated in another way (by an AI commander, for example), a new VIP is drawn at random.</li>
            </ul>
            <p>The VIP is <strong>alone against everyone</strong>: they are automatically removed from their alliance when appointed. If they were its chief, the highest-ranking member takes their place; if they were its only member, the alliance is dissolved. As long as they hold the status, they can neither create nor join an alliance, and they remain barred from doing so for <strong>3 days</strong> after losing it.</p>
            <p><strong>Beginner protection</strong> also applies to the VIP: as long as it lasts (less than 7 days since their registration, fewer than 4 planets, no offensive mission launched), no player can send a fleet to their planets.</p>

            <h2 id="domination">Domination (strategic planets)</h2>
            <p>At the start, <strong>5 strategic planets</strong> are drawn at random among all the planets on the server, player planets and uninhabited planets alike.</p>
            <ul>
                <li>Once a day, at the date change (midnight, Paris time), each strategic planet earns <strong>+5 points</strong> for the player who owns it at that moment. Holding two therefore earns +10 per day.</li>
                <li>AI commanders do not score points.</li>
                <li>Every <strong>5 days</strong>, a new draw replaces the strategic planets. The public chat announces "Strategic planets have just changed." when it happens, without warning.</li>
            </ul>
            <p>At the end of the server (60 days), the player with the most points wins. The ranking is <strong>individual</strong>: there is no alliance score or victory in Domination.</p>

            <h2 id="battle-royale">Battle Royale (last survivor)</h2>
            <p>Solo mode: <strong>no alliance allowed</strong>. A single galaxy. Registrations close <strong>7 days</strong> after opening: the server then carries the "Locked" badge, and only players already registered can come back to it.</p>
            <p>The map is a 10 × 10 space grid, i.e. 100 systems, which <strong>shrinks in concentric rings</strong>: at each round, <strong>the whole outer ring disappears at once</strong> (not system by system). Destroyed systems stay displayed as <strong>holes</strong>: the map does not reorganize, which makes the safe zone readable at a glance.</p>
            <p><strong>5 rounds, one per week:</strong></p>
            <table>
                <thead>
                    <tr><th>Day</th><th>Systems destroyed</th><th>Systems remaining</th></tr>
                </thead>
                <tbody>
                    <tr><td>D+7</td><td>36 (the edge of the grid)</td><td>64</td></tr>
                    <tr><td>D+14</td><td>28</td><td>36</td></tr>
                    <tr><td>D+21</td><td>20</td><td>16</td></tr>
                    <tr><td>D+28</td><td>12</td><td>4</td></tr>
                    <tr><td>D+35</td><td>3 of the last 4</td><td><strong>Only 1</strong>, drawn at random</td></tr>
                </tbody>
            </table>
            <p>The last 5 days are played in that final system.</p>
            <ul>
                <li><strong>12&nbsp;h before</strong> its destruction, a ring turns <strong>orange</strong> (warning).</li>
                <li><strong>1&nbsp;h before</strong>, it turns <strong>flashing red</strong>: no fleet can leave for its systems or leave from them anymore.</li>
                <li>A destroyed system permanently deletes its planets and its fleets. If your <strong>main hero</strong> was there (on a planet or in a fleet), you are eliminated; a secondary hero simply goes back to reserve. You are also eliminated if you have no planet left.</li>
                <li>A fleet heading for a vanished system (or leaving a vanished system) is destroyed on arrival; if your main hero is aboard, you are eliminated.</li>
            </ul>
            <p><strong>Victory</strong>: be the last player still in the game. The game stops as soon as only one survivor remains. If several players are still in the game on the 40<sup>th</sup> day, the server ends with no winner.</p>

            <h2 id="paid-server">Paid Server (paid competitive)</h2>
            <p>Paid server: registration costs <strong>€5</strong>, paid once via Stripe for that specific server (another paid server is paid separately). A full account is required, not a guest account. In the server list, it carries the "💳 Paid €5" badge. 100&nbsp;% PvP, no Cthulhu. Duration 60 days.</p>
            <p><strong>Victory</strong>: at the end, the player still in the game with the best <strong>weighted score</strong> wins.</p>
            <ul>
                <li>Weighted score = ranking points + 2 × war points (WP).</li>
                <li>Example: 300,000 points and 50,000 WP give a score of 400,000.</li>
            </ul>
            <p>Combat therefore counts double: it is a mode for competitive players.</p>
            <p>As in all modes that designate a winner, the winner receives the <strong>Winner</strong> badge on their career profile, kept from one server to the next, and the <strong>Emperor</strong> achievement.</p>

            <h2 id="long-short-run">Long Run / Short Run (with events)</h2>
            <p>Two PvE modes with identical rules: only the duration changes. The <strong>Long Run</strong> lasts 900 days, the <strong>Short Run</strong> 150 days.</p>
            <p>The Cthulhus do not attack permanently there: their hordes only leave during <strong>Cthulhu Attack</strong> events. These events last 72 hours: the first starts 7 days after the server opens, then they come back every 21 days.</p>
            <p>The <strong>Alliance Arena</strong> comes back there every 3 days, and the Cthulhu prophecies also trigger there. The calendar is fixed, calculated from the server's opening: see the <em>Special events</em> article.</p>

            <h2 id="max-research">Modes with maximum researches from the start</h2>
            <p>In <strong>Search &amp; Destroy, Domination and Battle Royale</strong>, all your researches start at maximum level: the Research menu is hidden, so you can play directly on the military side.</p>
            <p>Your starting planet then receives a <strong>starter kit</strong>:</p>
            <ul>
                <li><strong>500 uranium</strong> to customize quickly.</li>
                <li><strong>Your whole reserve of ship upgrade points</strong> from day 1, instead of the usual cap of 40 points per day.</li>
            </ul>
            <p>In <strong>Search &amp; Destroy</strong>, each player also receives, on registration, a military kit on their starting planet (anyone can become VIP): 2,000 Legionnaires, 25 barges, 500 destroyers and 250 heavy laser turrets.</p>

            <h2 id="server-end">Server end and archiving</h2>
            <p>When a server closes, your <strong>final statistics</strong> (points, heroes, VIP achievements, victories, etc.) are archived on your <strong>player account</strong>. Your commander (the character of that game) is deleted, but your history remains.</p>

    cthulhus:
        title: "The Cthulhu threat"
        category: "events"
        order: 2
        tags: "cthulhu,hive,horde,garrison,siege,threat,pve,uranium,tower defense,td"
        summary: "The Cthulhus mass real hordes that travel in the open before attacking your planets. How to defend yourself, how their bases defend themselves too, and the Tower Defense to repel the assault."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principle">What are the Cthulhus?</h2>
            <p>The <strong>Cthulhus</strong> (the Possessed) are the hostile creatures controlled by the game (PvE). They hold <strong>hive bases</strong> scattered across the galaxy, from which <strong>hordes</strong> set out: real fleets, with a visible composition, strength and route, not a simple countdown.</p>
            <p>The Cthulhus only exist on <strong>Cthulhu</strong>, <strong>Long Run</strong> and <strong>Short Run</strong> servers. In Long Run and Short Run, their hordes only leave during <strong>Cthulhu Attack</strong> events (see <em>Special events</em>).</p>
            <p>Two gauges not to be confused:</p>
            <ul>
                <li>your <strong>personal threat</strong>, which sets the strength of the hordes launched against you (this article);</li>
                <li>the <strong>World threat</strong>, shared by the server, which triggers the prophecies (see <em>The Cthulhu Prophecies</em>).</li>
            </ul>

            <h2 id="threat">The threat level</h2>
            <p>Your personal threat is displayed on the <strong>Cthulhu</strong> page, in the "Cthulhu Threat" block (Threatened planet, Threat level, Time remaining). The higher it is, the stronger the following attacks.</p>
            <p>Each time your defenses repel a Cthulhu <strong>landing</strong> on the ground, your threat increases. Destroying the horde before it lands (above its base, in flight or in orbit of your planet) does not raise it. The gain depends on the difficulty and on your alliance's regime:</p>
            <table>
                <thead>
                    <tr><th>Difficulty</th><th>No alliance</th><th>The Hammer of Stars alliance</th><th>Other alliance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Easy</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Hard</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>The <strong>The Hammer of Stars</strong> regime therefore slows the threat's progression.</p>
            <p>The threat <strong>also climbs back on its own</strong>, as long as your PvE is active:</p>
            <ul>
                <li>+5 at each daily report (18:59, Paris time);</li>
                <li>+1 per hour as long as a horde stays in orbit of one of your planets before landing.</li>
            </ul>
            <p>This automatic climb stops at 300. To bring the threat down:</p>
            <ul>
                <li>winning a <strong>Tower Defense</strong> divides it by 2;</li>
                <li><strong>liberating a base</strong> of the hive divides it by 10 (see below);</li>
                <li>a defeat on the ground also divides it (see the "If the horde wins on the ground" table).</li>
            </ul>
            <p>A diligent player therefore keeps it low; a player who lets it run away is exposed to ever bigger hordes.</p>

            <h2 id="power">Invasion strength</h2>
            <p>An attack plays out in two stages, and the difficulty weighs on both:</p>
            <ul>
                <li><strong>The horde (orbital combat)</strong>: its fleet is calculated from <strong>your own fleet's power</strong>. The stronger your fleet is relative to your threat level, the stronger the horde is (from 0.7 to 1.5 times your power). The difficulty then applies: ×0.5 on Easy, ×1 on Normal, ×1.5 on Hard. One horde in five is reinforced (+25&nbsp;%). The horde that follows your threat passing above 100, 250 then 500 is a <strong>Boss horde</strong>, twice as big.</li>
                <li><strong>The landing (ground combat)</strong>: its strength depends on your <strong>threat level</strong> and your <strong>Terraforming</strong> research level, then on the share of the horde that survived the orbital combat. On Easy, it is divided by 2.</li>
            </ul>

            <h2 id="horde">The attack: a very real horde</h2>
            <p>The first horde is launched <strong>5 days after your registration</strong>. After that, a new horde leaves every <strong>18 to 30 hours</strong> on Easy, <strong>12 to 24 hours</strong> on Normal and <strong>8 to 16 hours</strong> on Hard. The timer of the "Cthulhu" menu entry shows the next launch.</p>
            <p>An attack always starts with a <strong>gathering</strong>: the horde masses in orbit of a hive base for <strong>6 hours</strong> (12 hours for a Boss horde) before setting off.</p>
            <p>Once on its way, it flies at <strong>horde speed</strong> (slow, easily visible on the <strong>radar</strong>) and an <strong>alert is guaranteed 1 hour before its arrival</strong>, whatever your radar coverage.</p>
            <p>It is a <strong>real fleet</strong>: you can destroy it at any time, in formation above its base, in mid-flight, once it has arrived in orbit of your planet, or by winning the <strong>Tower Defense</strong>. Destroying it cancels the attack, whatever the moment.</p>
            <p>On arrival, an <strong>orbital combat</strong> takes place (your fleets and your turrets against the horde). The survivors land <strong>2 hours later</strong> for the ground assault. Several hordes can be forming or in flight at the same time.</p>
            <p>The only exception: <strong>infiltration</strong>. From a <strong>threat of 200</strong>, each attack has a 15&nbsp;% chance of being one: it is <strong>instant and invisible</strong> (no gathering, no warning) and its landing is 30&nbsp;% stronger.</p>

            <h3>If your defenses win</h3>
            <table>
                <thead>
                    <tr><th></th><th>Easy</th><th>Normal</th><th>Hard</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionnaire losses</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Mech losses</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Worker losses</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>You gain <strong>WP</strong>, a chance of an <strong>item drop</strong> and a 1&nbsp;% chance of recruiting a <strong>secondary hero</strong>. Wiping out the horde entirely before its landing gives the same chance of an item and a hero.</p>

            <h3>If the horde wins on the ground</h3>
            <p>Looting and capture are <strong>proportional to what is left of the horde</strong> after the orbital combat: a half-destroyed horde loots half as much. Below <strong>90&nbsp;% survival</strong>, it no longer has enough troops to capture the planet, even on Hard difficulty.</p>
            <table>
                <thead>
                    <tr><th></th><th>Easy</th><th>Normal</th><th>Hard</th></tr>
                </thead>
                <tbody>
                    <tr><td>Resource looting (intact horde)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planet captured (if ≥ 90&nbsp;% survival)</td></tr>
                    <tr><td>Threat reduction after defeat</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>On <strong>Hard</strong>, without enough survivors to capture, looting falls back to the <strong>Normal</strong> rate (70&nbsp;%), multiplied by the horde's survival ratio. If the planet is captured and it was your last one, it is Game Over.</p>

            <h2 id="bases">The hive bases</h2>
            <p>The hive holds <strong>bases</strong> scattered across the galaxy: the hive's original bases (up to 36 per galaxy, of increasing strength; their names range from "Cthulhu I" for the outposts to the fearsome "Cthulhu V") and former planets converted by an expansion or an eruption.</p>
            <p>Each is protected by a <strong>permanent garrison</strong> of about 0.8 times the server's biggest fleet. A damaged garrison does not repair itself; a destroyed garrison is replaced by a new one <strong>24 hours</strong> later.</p>
            <p>Stationing in orbit of a base one or more fleets <strong>in attack mode</strong> (yours and other players') whose combined signature reaches at least <strong>10,000</strong> triggers a <strong>siege</strong>:</p>
            <ul>
                <li>the besieged base no longer sends hordes: they leave from a more distant base;</li>
                <li><strong>defense waves</strong> grow in strength (+25&nbsp;% every 2 hours);</li>
                <li>after <strong>6 hours</strong>, the other bases send <strong>relief fleets</strong> as reinforcements;</li>
                <li>the base carries the <strong>"Besieged base"</strong> badge on the galactic map.</li>
            </ul>
            <p>Once the siege is lifted, the relief fleets go home and the base returns to a normal garrison. Each participant is then paid <strong>in proportion to the signature destroyed</strong>: 0.02 bitcoin per point, plus 1 war point per 5,000 bitcoins earned.</p>

            <h2 id="liberation">Liberating a base</h2>
            <p>Successfully invading a hive base, including the alien bases "Cthulhu I" to "V", earns WP and <strong>uranium</strong>, loaded into the victorious fleet (leave room in the hold). Victory also has two effects:</p>
            <ul>
                <li>your <strong>personal threat is divided by 10</strong>: it is the most radical way to bring it down;</li>
                <li>the <strong>World threat</strong> drops by <strong>50 points</strong>, which delays the next Cthulhu prophecy (see the <em>The Cthulhu Prophecies</em> article).</li>
            </ul>
            <p>A planet liberated this way is <strong>protected for 72 hours</strong>: the hive can neither recolonize it nor erupt on it during that time.</p>
            <ul>
                <li>If the liberated planet was originally a player planet (captured by the hive, converted after a lost invasion, abandoned, or born of an expansion or an eruption), it remains colonizable, and your liberation report gives you the deadline to send a colonizer there.</li>
                <li>The hive's original outposts ("Cthulhu I" to "V"), on the other hand, remain unusable once liberated: the planet stays free, but you cannot send a colonizer there, and no deadline is announced.</li>
            </ul>
            <p>Conversely, losing an invasion against a hive base raises your <strong>personal threat by 10 points</strong>.</p>

            <h2 id="expansion">Expansion and eruption</h2>
            <p>The hive spreads on its own: when the <strong>World threat</strong> reaches <strong>300 points</strong>, a <strong>spore swarm</strong> leaves an existing base every <strong>3 days</strong> (every day from <strong>500</strong>) for an uninhabited planet near players, up to <strong>36 bases per galaxy</strong>. It is a fleet like any other: <strong>interceptable in flight</strong>. If it arrives, it founds a new base with its garrison, and players <strong>5 sectors or less</strong> away receive a report.</p>
            <p>Eradicating <strong>all</strong> the bases does not eliminate it for good: after <strong>48 hours of silence</strong>, an <strong>eruption</strong> brings a base back up elsewhere, with a report to nearby players. This eruption can never land <strong>less than 8 sectors</strong> from a player planet, nor on a planet still under its liberation respite: the hive is reborn in the void, not on your land. If no sector isolated enough is available, the eruption is simply pushed back to the next slot.</p>

            <h2 id="difficulty-change">Changing difficulty</h2>
            <p>You set your PvE difficulty in your <strong>Preferences</strong> ("PvE Difficulty" field): <strong>Disabled</strong>, Easy, Normal or Hard.</p>
            <ul>
                <li>On <strong>Disabled</strong>, the Cthulhus no longer attack you and Tower Defense is not available.</li>
                <li>If you reactivate PvE, the first attack arrives 4 days later.</li>
                <li>A <strong>72&nbsp;h delay</strong> applies between two changes: no back-and-forth to dodge big attacks.</li>
            </ul>

            <h2 id="tower-defense">Tower Defense (TD)</h2>
            <p>The <strong>Tower Defense</strong> is an active defense mini-game, on the <strong>Cthulhu</strong> page. It is playable as soon as an attack is scheduled against you or a horde is already on its way: you can launch it to wipe the horde out before it does any damage. It is interactive: you place your defenses on a grid and face waves of Cthulhu monsters in real time.</p>
            <p>Tip: to place several defenses in a row (units, walls, barbed wire), <strong>hold and drag</strong>. The line locks automatically into a <strong>straight line</strong> (horizontal or vertical) and every tile crossed is filled, with no gaps even when going fast.</p>
            <p>The game is played at your <strong>PvE</strong> difficulty (set in your Preferences). The <strong>tutorial</strong> is a training run: it earns nothing and costs nothing. Once the first wave is launched, leaving the game counts as a <strong>forfeit</strong> (defeat).</p>
            <p>A <strong>fog</strong> drifts over the arena, denser around the rifts and when a boss approaches. It passes under your defenses and the monsters: it hides nothing. The <strong>Fog</strong> button on the dock turns it off if your device struggles.</p>

            <h3>Possible outcomes</h3>
            <ul>
                <li><strong>Victory</strong>: the active horde is destroyed and the attack cancelled (if no horde had left yet, the next one is delayed by 8 hours). Your threat is divided by 2. You gain uranium, an item draw (two on Hard) and a 2&nbsp;% chance of recruiting a secondary hero. 6-hour delay before doing another TD.</li>
                <li><strong>Defeat</strong>: your threat drops in proportion to the waves repelled (half the waves = threat divided by 2) and you receive a little uranium. If the horde is already in orbit of your planet, it lands immediately; otherwise, the hive immediately launches its next attack. No waiting delay before playing again.</li>
                <li><strong>TD not played</strong>: the horde follows its normal course (gathering, flight, arrival, landing).</li>
            </ul>
            <p>Uranium earned on victory: number of waves × (50 + threat ÷ 2), multiplied by 0.4 on Easy and by 3 on Hard. On defeat: waves repelled × (20 + threat ÷ 5), with the same multipliers. Example, at 100 threat: victory on Normal (13 waves) = 1,300 uranium; on Easy (11 waves) = 440; on Hard (15 waves) = 4,500.</p>

            <h3>End-of-game report</h3>
            <p>At the end of each Tower Defense (victory or defeat), a <strong>report</strong> is archived in the <strong>Cthulhu</strong> tab of your reports: waves survived, score, uranium harvested, threat reduction, losses by unit type and enemies killed by type. Handy for comparing your games.</p>

            <h3>How to play</h3>
            <ul>
                <li>The game is played at your PvE difficulty (Easy, Normal or Hard): the "Play in …" button reminds you of it. Only the tutorial lets you try another difficulty.</li>
                <li>Place your units on the grid. The <strong>HQ is at the center</strong>; monsters emerge from <strong>1 to 4 Cthulhu rifts</strong> opened at the edge of the platform.</li>
                <li>Monsters cross the grid to reach your HQ: attack them along the way.</li>
                <li><strong>Walls</strong> (150 on Easy, 125 on Normal, 75 on Hard): monsters go around them. Each rift always keeps a path to the HQ (a wall that would seal it off is refused). Towers, on the other hand, do not block the path: a monster that bumps into one stops and destroys it.</li>
                <li><strong>Barbed wire</strong> (30 / 20 / 10 depending on difficulty, Barbed wire research required): does not block, but hurts and slows the monsters that cross it.</li>
                <li><strong>Remembered placement</strong>: your layout (towers, walls, barbed wire) is saved for each server and offered again at the start of each game.</li>
                <li>Big waves arrive <strong>in groups</strong> (up to 20 monsters at once): a wave finishes appearing in about 2 minutes.</li>
                <li><strong>Instant defeat</strong>: if all the enemies of a wave get past your defenses and reach the HQ, the game is lost on the spot. You cannot win without placing effective defenses.</li>
                <li>Between waves, workers automatically repair damaged turrets.</li>
                <li>Adjustable speed from ×1 to ×10, with pause possible.</li>
                <li><strong>Chaining waves</strong>: an option in the top bar automatically launches the next wave as soon as each wave ends, without going back through preparation and keeping your speed, until victory or defeat. Turn it off during a wave to get the preparation pause back at its end. Unavailable in the tutorial.</li>
                <li>The number of waves depends on your threat: threat ÷ 10 (rounded down) + 3, with 2 fewer waves on Easy (2 at minimum) and 2 more on Hard, <strong>20 at most</strong>. Example: at 100 threat, 13 waves on Normal. The waves get more and more intense.</li>
                <li><strong>Interface</strong>: a bar at the top, across the full width (HQ hit points, wave counter, score, "Start" button, and on the right the sound, music, unit info, grid and wave chaining icons), and a "Units" panel on the right that presents each unit (icon, name, stock, characteristics). During the game, no side menu or page footer: the whole screen width is dedicated to the map.</li>
            </ul>

            <h3>Your units for the TD</h3>
            <p>Your planet defenses are converted into TD units: each TD unit represents a bundle of real units, and each type has a maximum that can be placed, to force tactical diversity.</p>
            <table>
                <thead>
                    <tr><th>Planet unit</th><th>Real units for 1 TD unit</th><th>Maximum on the grid</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionnaire</td><td>20</td><td>200</td></tr>
                    <tr><td>Mech</td><td>10</td><td>20</td></tr>
                    <tr><td>Missile launcher</td><td>1,750</td><td>150</td></tr>
                    <tr><td>Laser turret</td><td>1,500</td><td>100</td></tr>
                    <tr><td>Heavy laser turret</td><td>1,250</td><td>75</td></tr>
                    <tr><td>Gauss cannon</td><td>1,000</td><td>60</td></tr>
                    <tr><td>Ion artillery</td><td>750</td><td>50</td></tr>
                    <tr><td>Plasma launcher</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Example: 2,000 Legionnaires give 100 TD Legionnaires. In addition, the TD lends you <strong>free defenses</strong>: 8 of each type on Easy, 5 on Normal, none on Hard.</p>

            <h3>The monsters you face</h3>
            <ul>
                <li><strong>Deep One</strong>: the basic monster. Nothing exceptional, but they arrive in numbers.</li>
                <li><strong>Watcher</strong>: very fast but fragile. Intercept quickly.</li>
                <li><strong>Shoggoth</strong>: slow, massive, heavily armored. Hard to take down.</li>
                <li><strong>Vampiric Star</strong>: fires projectiles from a distance at your defenses.</li>
                <li><strong>Mind Flagellator</strong>: can <strong>convert your Legionnaires into monsters</strong> (conversion visual effect), at most one per second, and none anymore once mortally hit.</li>
                <li><strong>Cthulhu Boss</strong>: huge, it only arrives on the last wave, on Normal if your threat reaches 40, on Hard from 20, never on Easy. It summons Deep Ones around it.</li>
            </ul>

            <h3>Useful mechanics to know</h3>
            <ul>
                <li>Units and monsters have <strong>different sizes</strong> on the grid (Legionnaire 1×1, Mech 2×1, turret 2×2, Boss 2×2).</li>
                <li>The <strong>wave bar</strong> shows the number of enemies remaining.</li>
                <li>If you refresh the page, the game <strong>resumes exactly where you left it</strong>.</li>
                <li>A saved game must be <strong>resumed</strong> before starting a new one.</li>
            </ul>

            <h3>Rewards and losses</h3>
            <ul>
                <li><strong>Victory</strong>: threat divided by 2, uranium, items and horde destroyed.</li>
                <li><strong>Defeat</strong>: threat reduced according to the waves repelled and a little uranium; if the horde is already in orbit, it lands immediately.</li>
                <li><strong>Unit losses are real</strong> beyond the free defenses: a destroyed TD unit removes from your planet all the units it represents (1 TD Legionnaire lost = 20 Legionnaires actually dead).</li>
            </ul>

            <h3>TD ranking</h3>
            <p>A per-server ranking keeps track of the <strong>best scores</strong> in Tower Defense. Another leaderboard to conquer.</p>

    events:
        title: "Special events"
        category: "events"
        order: 3
        tags: "event,calendar,cthulhu attack,arena,alliance arena,long run,short run"
        summary: "On Long Run and Short Run servers, the Cthulhu Attack and the Alliance Arena come back on fixed dates: when they fall, what they change and how to prepare."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principle">Principle</h2>
            <p>On <strong>Long Run</strong> and <strong>Short Run</strong> servers, two events come back on fixed dates: the <strong>Cthulhu Attack</strong> and the <strong>Alliance Arena</strong>. Their calendar is calculated once and for all when the server opens, with no randomness: by knowing your server's opening date, you can predict each of them.</p>
            <p>There are no seasonal events (holidays, seasons of the year).</p>
            <p>On <strong>Cthulhu</strong>, <strong>Long Run</strong> and <strong>Short Run</strong> servers, the hive also triggers its <strong>prophecies</strong> and blockades. Those do not follow a fixed calendar but a threat gauge: see the <em>The Cthulhu Prophecies</em> article.</p>

            <h2 id="list">Calendar events</h2>
            <table>
                <thead>
                    <tr><th>Event</th><th>When</th><th>What happens</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Cthulhu Attack</strong></td><td>72 hours, the first time 7 days after the server opens, then every 21 days (days 7, 28, 49, 70…)</td><td>The only period when the Cthulhus launch their hordes against your planets.</td></tr>
                    <tr><td><strong>Alliance Arena</strong></td><td>Every 3 days starting the day after opening: registration at 08:00, combat at 19:00 (Paris time)</td><td>Tournament between alliances, with no real losses at all.</td></tr>
                </tbody>
            </table>

            <h3>Cthulhu Attack</h3>
            <p>On a Long Run or Short Run server, the Cthulhus launch no horde outside these 72-hour windows. During the window, they attack as on a Cthulhu server, at the pace of your PvE difficulty:</p>
            <ul>
                <li>as soon as the window opens, a horde leaves against you if your attack delay has elapsed (5 days after your registration for the very first one);</li>
                <li>the next horde leaves <strong>18 to 30 hours</strong> later on Easy, <strong>12 to 24 hours</strong> on Normal, <strong>8 to 16 hours</strong> on Hard;</li>
                <li>a horde launched during the window goes all the way (6 hours of gathering, then the flight), even if it arrives after the event ends.</li>
            </ul>
            <p>On Normal, therefore, expect 3 to 6 hordes per window. In the meantime, the <strong>Tower Defense</strong> on the <strong>Cthulhu</strong> page lets you repel each horde. If your PvE is disabled in your Preferences, you are not attacked. How hordes work is detailed in the <em>The Cthulhu threat</em> article.</p>

            <h3>Alliance Arena</h3>
            <p>An arena day unfolds like this (Paris time):</p>
            <ul>
                <li><strong>08:00</strong>: announcement and opening of registrations.</li>
                <li><strong>18:45</strong>: registrations close.</li>
                <li><strong>19:00</strong>: first round, then the following rounds at 19:15 and 19:30; combat ends around 19:45.</li>
            </ul>
            <p>You must be a member of an alliance and own at least one attack ship. Your ships are <strong>duplicated</strong> for the arena: you risk nothing of what you own.</p>
            <p>Each round reached fills the <strong>alliance bank</strong>: 50,000 Bitcoins and 1,000 WP for an elimination in the first round, up to 1,000,000 Bitcoins and 25,000 WP for the champion alliance. Each player who gave at least one order also gets a personal bonus, from 5,000 to 50,000 Bitcoins per round reached. All the details (registration, combat, points, rewards) are in the <em>Alliance Arena</em> article.</p>

            <h2 id="where">Where to follow upcoming events?</h2>
            <p>There is no calendar page in the game. To know what is coming:</p>
            <ul>
                <li><strong>Alliance Arena</strong>: the <strong>Arena</strong> tab of your Alliance page shows the next arena with a countdown.</li>
                <li><strong>Cthulhu Attack</strong>: count from the server's opening (day 7, then every 21 days). The server list shows the time remaining before each server ends: on a Long Run (900 days), a server with 880 days left opened 20 days ago, and its next Cthulhu Attack starts on day 28.</li>
                <li><strong>Prophecies</strong>: the "World threat" gauge on the <strong>Cthulhu</strong> page.</li>
            </ul>

            <h2 id="strategy">How to make the most of them</h2>
            <ul>
                <li><strong>Before each Cthulhu Attack</strong>, strengthen turrets, Legionnaires and fleet: it is the only period when hordes strike.</li>
                <li><strong>During the window</strong>, play the Tower Defense: a victory destroys the current horde and divides your threat by 2.</li>
                <li><strong>Register for the Alliance Arena</strong> with at least one attack ship, and give at least one order during the match: you risk nothing there and you earn a personal bonus.</li>
                <li><strong>Talk in chat</strong>: an event is a chance to coordinate with your alliance.</li>
            </ul>

    alliance_arena:
        title: "Alliance Arena"
        category: "events"
        order: 9
        tags: "alliance,arena,bracket,pvp,event,tournament,sector,planet,fleet,base,history,spectator"
        summary: "Recurring event every 3 days: your alliance takes on the others in a sector battle (duplicated fleets, planets to hold) to fill the shared bank and earn a personal bonus."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">When it starts</h2>
            <p>The event comes back <strong>every 3 days</strong> on the servers concerned. Schedule of an arena day (Paris time; the Arena tab shows them in your time zone):</p>
            <ul>
                <li><strong>08:00</strong>: announcement in the Universe chat (in all languages) and <strong>opening of registrations</strong>, with a notification to alliance members.</li>
                <li><strong>18:45</strong>: registrations close. The bracket's composition is frozen.</li>
                <li><strong>19:00</strong>: first round. The following rounds start at <strong>19:15</strong> and <strong>19:30</strong>.</li>
                <li><strong>Around 19:45</strong>: combat ends and rewards are distributed.</li>
            </ul>
            <p>If fewer than <strong>2 alliances</strong> are registered on the whole server at 19:00, the event is cancelled and a message in the Universe chat warns everyone.</p>

            <h2 id="inscription">Registering</h2>
            <p>When registrations open, a <strong>window opens automatically</strong> in your interface ("Register for the arena" button). You can also register from the <strong>Arena</strong> tab of your Alliance page.</p>
            <p>Conditions:</p>
            <ul>
                <li>Be a member of an alliance.</li>
                <li>Have at least <strong>1 attack ship</strong> (on the ground or in a fleet) at the time of registration, then at the start of each match (19:00, 19:15, 19:30).</li>
                <li>Registration is <strong>free</strong>: it costs no resource, and nothing you own is put at stake.</li>
            </ul>
            <p>You can withdraw ("Withdraw") until registrations close, at 18:45. If you no longer have any attack ship at the start of a match (lost in real combat in the meantime), you are automatically declared forfeit for that match: your alliance carries on without you.</p>
            <p><strong>AI commanders</strong>: as soon as a human member is registered, your alliance's AI commanders register too, until it has 5 registered, humans included. Human members, for their part, can all register. Entirely AI alliances also register to fill out the bracket.</p>

            <h2 id="combat">How it plays out</h2>
            <p>Each match is played in a <strong>sector created for the occasion</strong>, displayed like the space map: a 5 × 5 grid where <strong>2 to 4 alliances</strong> clash. Each alliance starts from its <strong>base</strong>, in the middle of one edge of the sector.</p>
            <p>Your ships are <strong>duplicated</strong> for the arena: nothing you own is at risk. No real losses, no debris, no captured hero.</p>
            <ul>
                <li>A match lasts <strong>15 minutes</strong> at most.</li>
                <li>The first alliance to reach <strong>300 points</strong> wins; otherwise, the best score at the end of the time. In case of a tie: the most planets held, then the most damage dealt, then a random draw. If nobody has scored or fired, the match is a draw and nobody advances.</li>
                <li>Only one alliance per sector advances to the next round. The bracket is single elimination, over 3 rounds at most; the winner of the last match is server champion.</li>
            </ul>

            <h2 id="flotte">Your fleet</h2>
            <p>You start with <strong>a single fleet</strong>, made of all your attack ships (those on the ground as well as those in your fleets) and your main hero.</p>
            <ul>
                <li><strong>Send</strong>: choose your fleet, tap a planet, then confirm. The flight duration is announced before departure, and a flight cannot be cancelled.</li>
                <li><strong>Split</strong>: detach part of your ships into a new fleet (4 fleets at most). A fleet flies at the speed of its slowest ship: a squadron of hunters alone goes three times faster than a fleet dragging battleships along.</li>
                <li><strong>Merge</strong>: two of your fleets in orbit of the same planet can merge.</li>
            </ul>
            <p>Your <strong>main hero</strong> lends its bonuses (including traits like Tactician) to your starting fleet. A detached fleet leaves without it; if you merge it back with the hero's fleet, the hero stays with the whole. The hero risks nothing: no injury and no capture, even in case of forfeit.</p>
            <p>When two alliances meet on the same planet, the combat is resolved <strong>5 seconds</strong> later (time for reinforcements to arrive), with the <strong>same rules as the game's space combat</strong>. An engaged fleet cannot leave until the combat ends.</p>
            <p>A destroyed fleet is not lost: it <strong>re-forms at your base</strong>, at full strength, after 45 seconds, then 15 more seconds with each new destruction, 2 minutes at most. Each enemy fleet destroyed earns your alliance <strong>5 points</strong>.</p>
            <p><strong>AI commanders really fight</strong>: they go and take free planets, avoid combats lost in advance and go back to repair. If you do not open the match screen and give no order for one minute, the autopilot plays for you too; you take back control as soon as you return.</p>

            <h2 id="planetes">Planets and points</h2>
            <p>An alliance <strong>alone</strong> on a planet that is not its own captures it after <strong>15 seconds</strong>; an enemy arriving resets the counter to zero. The planet <strong>stays with your alliance</strong> when your fleets leave, until another one takes it back. That is the whole dilemma: spread out to score, or group up to win combats.</p>
            <p>Every <strong>10 seconds</strong>, each planet held earns points:</p>
            <table>
                <thead>
                    <tr><th>Planet</th><th>Points</th><th>Extra</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>World</strong> (4 per sector)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Shipyard</strong></td><td>1</td><td>Repairs your fleets in orbit: 10&nbsp;% of strength each period.</td></tr>
                    <tr><td><strong>Nexus</strong> (at the center)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Each point scored by a planet also pays <strong>WP into your alliance's bank</strong> at the end of the match: 3 WP per point in round 1, 8 in round 2, 15 in round 3, whether you win the match or not. Points from destroyed fleets and ransacked bases earn no WP.</p>

            <h2 id="bases">Bases</h2>
            <p>Your base is your starting and re-forming point; your fleets repair there (5&nbsp;% per period). It cannot be captured, but it can be <strong>ransacked</strong>.</p>
            <p>A base is defended by the <strong>planetary defenses of all the planets of the alliance's players engaged in the match</strong>, pooled together: it is hard to take. A repelled attack still damages it, and it repairs by 10&nbsp;% per period.</p>
            <p>If its defense falls, the base is ransacked: <strong>50 points</strong> for the attacker, its fleets automatically go home, and the base becomes untouchable for 2 minutes.</p>

            <h2 id="recompenses">Rewards</h2>
            <p>Two types of rewards that stack.</p>
            <h3 id="banque">Alliance bank</h3>
            <table>
                <thead>
                    <tr><th>Round reached</th><th>Bitcoins</th><th>WP</th></tr>
                </thead>
                <tbody>
                    <tr><td>Round 1 losers</td><td>50,000</td><td>1,000</td></tr>
                    <tr><td>Round 2 losers</td><td>150,000</td><td>3,000</td></tr>
                    <tr><td>Round 3 losers</td><td>350,000</td><td>8,000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>1,000,000</strong></td><td><strong>25,000</strong></td></tr>
                </tbody>
            </table>
            <p>The bank receives only one of these rewards, the one for the round reached, plus the WP from planets held during matches.</p>
            <h3 id="perso">Individual bonus</h3>
            <p>Paid directly into your personal wallet, provided you <strong>gave at least one order yourself</strong> during one of the evening's matches: if the autopilot played everything for you, no bonus.</p>
            <table>
                <thead>
                    <tr><th>Round reached</th><th>Personal Bitcoins</th></tr>
                </thead>
                <tbody>
                    <tr><td>Round 1 losers</td><td>5,000</td></tr>
                    <tr><td>Round 2 losers</td><td>15,000</td></tr>
                    <tr><td>Round 3 losers</td><td>30,000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>50,000</strong></td></tr>
                </tbody>
            </table>
            <p>You receive <strong>a single</strong> bonus per arena, the one for the highest round reached by your alliance: <strong>50,000 Bitcoins</strong> for a champion.</p>

            <h2 id="rapports">Combat reports</h2>
            <p>At the end of each match, each player receives a <strong>report</strong> on their Report page: result, your alliance's score and each opponent's, planets held, bases ransacked, your damage dealt and taken, the enemy fleets destroyed by yours and those you lost, your remaining strength, your damage rank among your alliance's pilots (with the <strong>"Match MVP"</strong> title for the first) and the WP paid into the bank.</p>
            <p>At the end of the tournament, a <strong>personal summary</strong> is added: your alliance's path through the bracket, match results, your total contribution and the breakdown of your gains (personal bonus, alliance bank, planets held).</p>

            <h2 id="suivi">Following the event from the Arena tab</h2>
            <p>The <strong>Arena</strong> tab of your Alliance page permanently shows the real state of the event: no arena in progress, next arena upcoming (with a countdown to the announcement), announced, registrations open or closed, arena in progress, or finished. A countdown shows the time remaining before the next step (registration closing, combat start, next round), and a box shows how many members of your alliance are already registered out of the total strength.</p>
            <p>Once the arena is over, the tab also keeps your alliance's <strong>record</strong> (number of arenas played, champion titles, best round reached, win/loss record) and the history of the last ten editions played on your server, with your alliance's result and the rewards obtained at each.</p>

            <h2 id="spectateur">Spectator mode</h2>
            <p>Not registered for the current arena? You can still follow your <strong>alliance's</strong> matches live from the Arena tab: the sector is displayed exactly as for a pilot, but you cannot give any order.</p>

            <h2 id="astuces">Tips</h2>
            <ul>
                <li><strong>Take the Nexus early</strong>: it earns as much as three worlds. But everyone knows it.</li>
                <li><strong>Detach your hunters</strong>: a fast squadron captures the worlds while your heavy fleet holds the center.</li>
                <li><strong>Arrive grouped</strong>: fleets arriving within the same 5 seconds fight together; an isolated fleet gets destroyed and hands over 5 points.</li>
                <li><strong>Keep a shipyard</strong>: going back through it repairs your fleets twice as fast as at the base.</li>
                <li><strong>Do not camp</strong>: a captured planet stays yours when you leave. Go and take another one.</li>
                <li><strong>A base is taken by several</strong>: attacking an intact base alone means giving away points. With several allies, in the same 5-second window, it is 50 points at once.</li>
                <li><strong>Give at least one order</strong>: with no order from your hand, no individual bonus.</li>
            </ul>

            <h2 id="mobile">On mobile</h2>
            <p>The arena is played by touch on mobile:</p>
            <ul>
                <li><strong>Landscape orientation</strong> is forced when entering the match in the mobile app. In a mobile browser, where the game cannot force the screen, a message invites you to rotate the device.</li>
                <li><strong>The whole sector fits on screen</strong>: no zoom or camera to manage.</li>
                <li><strong>Three taps for an order</strong>: your fleet (in the bottom bar, or by tapping its planet), the destination planet, then the "Send" button.</li>
                <li><strong>The frame and the tag</strong> of each planet tell who owns it; the numbers in its corners give the forces in orbit, yours in green, the enemy's in red.</li>
                <li><strong>ⓘ button</strong>: the detail of the chosen planet and the combat log.</li>
                <li><strong>Notification</strong>: an alert when registrations open (08:00), with the deadline and the combat time.</li>
            </ul>

    ia_bots:
        title: "AI Commanders (bots)"
        category: "events"
        order: 4
        tags: "ai,bot,artificial intelligence,npc,autopilot"
        summary: "Some servers include AI-controlled commanders. How they behave, and why."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principle">Why AIs?</h2>
            <p>On some servers, a few commanders are not human players but <strong>artificial intelligences</strong>. They make it possible to:</p>
            <ul>
                <li><strong>populate the server</strong> when there are few active players;</li>
                <li>offer <strong>interesting targets</strong> to players looking for fights;</li>
                <li>simulate lively diplomacy with credible proposals, betrayals and alliances.</li>
            </ul>
            <p>There is no maximum number set by the rules: the game team chooses how many AI commanders it places on each server, and player accounts switched to autopilot (see below) are added to them. This number is displayed nowhere.</p>

            <h2 id="behavior">How they behave</h2>
            <p>Each bot has:</p>
            <ul>
                <li>a <strong>personality</strong> (talkative, diplomat, aggressive, troll, veteran, silent…);</li>
                <li>a <strong>mood</strong> that changes with events (happy, wary, frustrated, angry…);</li>
                <li>a <strong>strategic archetype</strong> among five: economist, balanced, conqueror, expansionist or defensive.</li>
            </ul>
            <p>They really play: they build, research, attack, form alliances, sometimes betray. They can be your allies as well as your worst enemies.</p>
            <p>They grow <strong>every day at the pace of the server's active players</strong> (slightly faster than the median), without ever exceeding <strong>90&nbsp;% of the best player</strong>. What they lose in combat is lost for good: if a player destroys their garrison, they do not rebuild it on that planet for <strong>7 days</strong> and reinforce their turrets instead.</p>
            <p><strong>Where their fleet sleeps.</strong> Conqueror and expansionist AIs keep a garrison in orbit of their planets. The others (economist, balanced and defensive), more cautious, keep their ships <strong>on the ground</strong>, like many players, and only bring them out to defend themselves: if their radar spots a hostile fleet approaching that they can beat, they put their fleet in orbit and bring in the ships of their neighboring planets that arrive in time; facing a fleet that is too strong, they send theirs to land on another of their planets. They also join a combat already engaged above their planet, or attack an armed fleet parked in orbit, when they can win. Like a player, a sleeping AI does not react, and a fleet masked by a jammer catches it by surprise. They never leave their ships on the ground of a planet without turrets, which an invasion would take along with them: they go and land on their best-defended planet, which is also their first refuge.</p>
            <p><strong>Their trade.</strong> They sell their surpluses and their recyclers' cargo to the nearest merchant, unless it is under blockade or guarded by a hostile fleet in attack mode, which would destroy their convoy on arrival: they then go to the next one.</p>

            <h2 id="spot">Can you spot them?</h2>
            <p>Not for sure. AI commanders appear in the ranking and on the map like players, and nothing in the interface flags them. The game is designed so that you cannot know with certainty whether a commander is an AI.</p>

            <h2 id="strategy">Playing with them</h2>
            <ul>
                <li>Do not underestimate a bot: some are real military terrors.</li>
                <li>A bot can perfectly well invite you into an alliance, cooperate, then attack you if the situation changes.</li>
                <li>For immersion, treat them like players: it makes the server livelier.</li>
            </ul>

            <h2 id="pilote-automatique">Absent players: autopilot</h2>
            <p>If a <strong>registered</strong> player does not log in for <strong>8 days</strong>, their account switches to <strong>autopilot</strong> (they receive a reminder e-mail after 7 days of absence; trial accounts are not concerned): a <strong>silent</strong> bot, which never writes in chats or by private message. This autopilot <strong>does not play in your place</strong>: the account launches no attack, moves or engages none of your fleets and does not colonize. It just carries on your constructions and researches and slowly reinforces your turrets. Other AI commanders do not attack it; other players, however, still can. You can still send it a private message: it will read it when it returns. As soon as the player logs back in, they instantly regain control of their account, and find their fleets where they left them.</p>

    account_deletion:
        title: "Delete my account and data"
        category: "beginner"
        order: 99
        tags: "deletion,account,data,gdpr,privacy,delete"
        summary: "How to permanently delete your account and personal data, and what the game keeps."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Where to make the request</h2>
            <p>In the game, open <strong>Preferences</strong>: at the very bottom, the <strong>Danger zone</strong> offers the <strong>Delete my account</strong> button.</p>
            <p>You can also go through the public page <strong>/suppression-donnees</strong> ("Account &amp; data deletion" link in the Rules). It summarizes what is deleted and what is kept; you then need to log in to make the request.</p>
            <p>To confirm, type exactly the word <strong>DELETE</strong>, then tap <strong>Permanently delete my account</strong>. The deletion is <strong>immediate</strong> and applies to your account on <strong>all servers</strong>.</p>

            <h2 id="irreversible">A permanent account closure</h2>
            <p><strong>Warning: this is a permanent account closure.</strong> Your personal data is deleted or anonymized immediately:</p>
            <ul>
                <li>e-mail, password and username;</li>
                <li>Google, Discord or LinkedIn identifiers, Google Play Games link and wallet address;</li>
                <li>IP address, technical fingerprint and time zone;</li>
                <li>sessions, login tokens and notification tokens;</li>
                <li>private messages, sent and received;</li>
                <li>newsletter and notification subscriptions.</li>
            </ul>
            <p>Your achievements are erased. You will never be able to log back in with this account, and no game feature can recover it: to play again, you will have to create a new account and start from zero.</p>
            <p>No purchase in progress is refunded.</p>

            <h2 id="conserve">What is kept, and why</h2>
            <p>To preserve the game's balance, your commanders, planets and fleets keep existing, entrusted to a silent bot. Your commanders, your heroes and your planets are renamed "Bot-" followed by a number, with no link to your identity; this name also replaces yours in the rankings and in the archives of finished servers.</p>
            <p>Public messages written in the chats are kept and now appear under this "Bot-…" name.</p>
            <p>The payment history is kept (legal accounting obligation), also dissociated from your identity.</p>

    achievements:
        title: "Achievements"
        category: "progression"
        order: 11
        tags: "achievements,trophies,google play,play games,progression"
        summary: "15 account achievements, from first steps to career feats, on your profile and in Google Play Games."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">The principle</h2>
            <p><strong>Achievements</strong> reward what you accomplish with your account, <strong>across all servers</strong>. Once unlocked, an achievement is unlocked forever, even if you later lose the planet or leave the alliance that earned it for you.</p>
            <p>Find them on your <strong>cross-server profile</strong> ("My cross-server profile" menu), with your progress and the date of each unlock. Another player's profile shows theirs. Those your history has already earned are unlocked automatically.</p>
            <h2 id="liste">The 15 achievements</h2>
            <table>
            <tr><th>Achievement</th><th>Condition</th><th>Points</th></tr>
            <tr><td>Commander</td><td>Finish the tutorial by following it (skipping it with "I'll figure it out" does not count)</td><td>20</td></tr>
            <tr><td>Builder</td><td>Finish a first construction</td><td>20</td></tr>
            <tr><td>Scholar</td><td>Finish a first research</td><td>20</td></tr>
            <tr><td>Colonist</td><td>Own 2 planets</td><td>20</td></tr>
            <tr><td>Ally</td><td>Join or found an alliance</td><td>20</td></tr>
            <tr><td>Veteran I, II, III</td><td>Fight 10, 100 then 1,000 space battles</td><td>25, 50, 100</td></tr>
            <tr><td>Conqueror I, II</td><td>Succeed at 10 then 100 invasions</td><td>50, 100</td></tr>
            <tr><td>Jailer</td><td>Capture an enemy hero</td><td>50</td></tr>
            <tr><td>Cthulhu Hunter</td><td>Win a Tower Defense game</td><td>50</td></tr>
            <tr><td>Elite</td><td>Finish in a server's top 10</td><td>100</td></tr>
            <tr><td>Emperor</td><td>Win a server</td><td>200</td></tr>
            <tr><td>Hidden achievement</td><td>To discover while playing</td><td>50</td></tr>
            </table>
            <p>"Scholar" cannot be earned on servers where all researches are unlocked from the start. A moon counts as a planet for "Colonist".</p>

            <h2 id="progression">Progress</h2>
            <p>Battle and invasion achievements advance in tiers, and your profile shows the counter (for example 37 / 100). All space battles fought count, won or lost, including the destruction of an unarmed fleet (cargos, recyclers, probes), for both sides; invasions count when they succeed (raids do not count). Elite and Emperor are decided at the end of a server.</p>
            <h2 id="google-play">Google Play Games (Android)</h2>
            <p>In the Android app, your achievements also appear in <strong>Google Play Games</strong>, with the "Achievement unlocked" banner.</p>
            <ul>
            <li><strong>Trial account</strong> created in the app: it is automatically linked to your Google Play Games profile. It is then no longer deleted after 7 days without playing, and it reopens by itself after a reinstall or on a new phone.</li>
            <li><strong>Registered account</strong>: in the Android app, open your cross-server profile ("My cross-server profile" menu) and tap "Link this account" on the "Google Play Games" card. It will then open without a password with this Google Play Games profile: only do it on your own device. You can unlink it at any time from the same card, on the website as well as in the app.</li>
            <li>The <strong>"Play Games"</strong> button on the login screen reopens the linked account. Logging out turns off automatic opening on this device: this button then reopens the account.</li>
            </ul>
            <p>A Google Play Games profile can only be linked to a single Area account, and an account to a single profile. Linking your account from your profile takes the Google Play Games profile from the other account it was linked to, if there was one.</p>
    faq:
        title: "Frequently asked questions: account, devices and help"
        category: "beginner"
        order: 13
        tags: "faq,account,several servers,multi-account,offline,android,iphone,console,language,spanish,username,contact,support,bug,purchase,refund,deletion,reports"
        summary: "Several servers, offline play, devices, languages, username, contact, bugs, purchases: answers to practical questions."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Playing on several servers</h2>
            <p>Yes. Your account follows you across all servers. On each server you join, you have a <strong>separate commander</strong>, with its own username, planets, heroes, Bitcoins, alliance and ranking: nothing carries over from one server to another.</p>
            <p>You can play on several servers at the same time and switch between them through the <strong>Server</strong> entry of the menu: servers where you already play open directly.</p>
            <p>What is shared across all your servers: your <strong>cross-server profile</strong> ("My cross-server profile" menu), which accumulates your career and achievements, your language and your list of blocked players.</p>
            <p>Several accounts on the same server: the Rules ("Multiple accounts" section) allow them on condition that you declare them by e-mail to <strong>support@areauniverse.com</strong>. These accounts must not interact directly with each other, nor through a third party. Sharing your login details with someone else is forbidden.</p>

            <h2 id="hors-ligne">Playing offline</h2>
            <p>No: Area Universe is played online and requires an Internet connection, in the app as in the browser. If the connection drops, the game displays "Reconnecting…" and resumes as soon as it returns.</p>
            <p>However, the game goes on without you: your planets produce up to their storage cap, your constructions, researches and fleets progress… and your opponents can attack you. Turn on <a href="/wiki/notifications">push notifications</a> to be warned.</p>
            <ul>
                <li>After <strong>8 days</strong> without logging in, your commander switches to <a href="/wiki/ia_bots">autopilot</a>.</li>
                <li>A <strong>trial account</strong> (created with "Test without email") is deleted after <strong>7 days</strong> without playing, unless it is linked to Google Play Games in the Android app. To keep it, validate it from the <strong>Confirm account</strong> menu entry.</li>
            </ul>

            <h2 id="plateformes">Which devices to play on?</h2>
            <ul>
                <li><strong>Computer</strong>: in a recent browser (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong>: in the Area Universe app from Google Play. An Android browser is redirected to Google Play when it tries to enter the game. The app is played in landscape.</li>
                <li><strong>iPhone and iPad</strong>: there is no app; play in the browser.</li>
                <li><strong>Consoles</strong> (PlayStation, Xbox, Switch…): there is no console version.</li>
            </ul>
            <p>Your account is the same everywhere: log in with the same credentials to find your game on another device.</p>

            <h2 id="langues">Available languages</h2>
            <p>The game exists in <strong>six languages</strong>: French, English, German, Spanish, Portuguese and Russian. So does this wiki.</p>
            <p>To change language: on a computer, tap the flag at the bottom of the menu; on a phone, open the <strong>Menu</strong> button, then choose a flag on the <strong>Language</strong> row. Your choice is saved on your account: your push notifications also arrive in this language.</p>

            <h2 id="pseudo">Changing your username</h2>
            <p>Your username is your commander's: it is <strong>specific to each server</strong>. To change it, open <strong>Preferences</strong>, <strong>Identity</strong> section, <strong>Pseudonym</strong> field (3 to 15 characters; the first letter is capitalized), then <strong>Save</strong>. The change is immediate and possible at any time, provided that username is not already taken on the server. You must have created your hero to be able to save.</p>
            <p>Your login identifier, on the other hand, is your e-mail address. It is changed in <strong>Parameters</strong> ("My options" page, Change email): a confirmation link is sent to the new address, and the old one stays active until you click it. The password is changed in the same place.</p>

            <h2 id="contact">Contacting the team</h2>
            <ul>
                <li><strong>By e-mail</strong>: <strong>support@areauniverse.com</strong>, for an account, payment or personal data question.</li>
                <li><strong>On Discord</strong>: Area Universe's community server (discord.gg/bpwWyS8), whose link appears at the bottom of the site's pages, next to Facebook, Telegram and LinkedIn. By linking your Discord account in <strong>My options</strong>, you get the role of your alliances there and the "Enemy fleet approaching" alert as a private message.</li>
                <li><strong>For a bug</strong>: preferably use the game's <strong>Issue</strong> button (see below); your report goes straight to the team, with the page you were on.</li>
            </ul>

            <h2 id="bug">Reporting a bug</h2>
            <p>Tap the <strong>Issue</strong> button (bug icon): at the bottom of the menu on a computer; on a phone, <strong>Menu</strong> button, then <strong>Issue</strong>. In the <strong>Report an issue</strong> window:</p>
            <ol>
                <li>describe what happened and what you were doing (2,000 characters at most);</li>
                <li>attach an image if possible (JPEG, PNG or WebP, 5&nbsp;MB at most); in the app, the <strong>Capture screen</strong> button does it for you;</li>
                <li>tap <strong>Send</strong>.</li>
            </ol>
            <p>The page you were on and the device type are attached automatically. You can send up to 10 reports per day. For a player who cheats or insults, use the <a href="/wiki/moderation_blocking">report</a> instead.</p>

            <h2 id="achats">Purchases and refunds</h2>
            <p>The game is free. The only purchase offered today is access to a <strong>Paid Server</strong> (paid competitive server): <strong>€5</strong>, paid once per server, by bank card, before entering it; a validated account is required. The game's <strong>Bitcoins</strong> cannot be bought with real money: they are earned only by playing. Push notifications are free.</p>
            <p>For a payment problem (payment charged but access not unlocked, refund request), write to <strong>support@areauniverse.com</strong> stating your account's e-mail address, the server concerned and the payment date. The terms of use provide that no refund is granted once the paid service has been used, except for a right of withdrawal or an exceptional case reviewed by support. Deleting your account refunds no purchase in progress.</p>

            <h2 id="compte-supprime">Recovering a deleted account</h2>
            <p>No game feature can recover a deleted account: <a href="/wiki/account_deletion">account deletion</a> is final and your personal data is erased on the spot. To play again, create a new account. If you think there was a mistake, write to <strong>support@areauniverse.com</strong>.</p>
            <p>A trial account deleted for not having played for 7 days cannot be recovered either.</p>
            <p>Just forgot your password? On the login screen, tap the key icon (<strong>Forgotten password</strong>) and enter your e-mail address: a reset link is sent to you.</p>

            <h2 id="rapports">Deleting or archiving reports</h2>
            <p>On the <strong>Report</strong> page, open a report then tap <strong>Delete</strong>: it disappears at once, with no confirmation or trash. Deletion is done one report at a time; there is no archiving or bulk deletion. To clean up the unread ones, <strong>Mark all as read</strong> handles all your reports at once. Reports do not erase themselves over time.</p>
            <p>Private messages in <strong>Messaging</strong>, for their part, cannot be deleted.</p>

