                    <tr><td>Stacheldraht (5)</td><td>+5&nbsp;% Stärke deiner Legionäre in der Bodenverteidigung, pro Stufe.</td><td>Militärausbau 3</td><td>200.000; 20 Min.</td></tr>
                    <tr><td>Gefängnissystem (1)</td><td>Gefängnis und Sklavenlager.</td><td>Stacheldraht 5</td><td>350.000; 1 Std.</td></tr>
                    <tr><td>Gepanzerte Einheiten (1)</td><td>Mechs.</td><td>Militärausbau 3</td><td>40.000; 33 Min. 20 Sek.</td></tr>
                    <tr><td>Territorialerweiterung (2)</td><td>Schwimmende Stadt (Stufe 1), Orbitalstation (Stufe 2): mehr Platz auf deinen Planeten.</td><td>Terraformation 18</td><td>75.000 Kriegspunkte; 1 Std. 40 Min.</td></tr>
                </tbody>
            </table>

            <h3>Waffen</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Was sie bringt</th><th>Voraussetzung</th><th>Stufe 1</th></tr>
                </thead>
