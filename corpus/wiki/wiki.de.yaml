    moderation_blocking:
        title: "Moderation: melden und blockieren"
        category: "beginner"
        order: 12
        tags: "moderation,melden,blockieren,chat,nachrichten,bedingungen"
        summary: "Melde eine missbräuchliche Nachricht, blockiere einen unerwünschten Spieler und lies die Community-Regeln nach, die jeder bei der ersten Anmeldung akzeptiert."
        related: "salon,account_deletion"
        body: |
            <h2 id="bedingungen">Nutzungsbedingungen</h2>
            <p>Bei der ersten Anmeldung akzeptiert jeder Spieler die <strong>Nutzungsbedingungen</strong> und die Community-Regeln: Respekt gegenüber anderen Spielern, keine illegalen, obszönen oder diffamierenden Inhalte, kein Cheaten und kein missbräuchliches Multi-Accounting. Ändern sich die Bedingungen, müssen sie erneut akzeptiert werden.</p>
            <h2 id="melden">Eine Nachricht melden</h2>
            <p>Jede Chatraum-Nachricht und jede empfangene private Nachricht trägt ein <strong>Flaggen</strong>-Symbol. Ein Klick öffnet die Auswahl des Grundes: Beleidigungen oder Belästigung, Spam, anderer unangemessener Inhalt. Die Meldung geht direkt an das Moderationsteam, mit einer Kopie der Nachricht.</p>
            <p>Ein Spieler kann auch global über sein Profil gemeldet werden (Multi-Accounting, Cheaten, Beleidigungen, Spam). Das Limit liegt bei drei Meldungen pro Tag, und derselbe Spieler kann nur einmal gemeldet werden.</p>
            <h2 id="blockieren">Einen Spieler blockieren</h2>
            <p>Der <strong>Blockieren</strong>-Button im Profil eines Spielers verbirgt sofort alle seine Nachrichten in den Chaträumen und verhindert jeden privaten Nachrichtenaustausch, in beide Richtungen.</p>
            <p>Die Liste der blockierten Spieler wird in <strong>Meine Optionen</strong> verwaltet: Dort kann jeder jederzeit wieder freigegeben werden.</p>
    getting_started:
        title: "Erste Schritte"
        category: "beginner"
        order: 1
        tags: "anfang,starten,neu,tutorial,anleitung"
        summary: "Willkommen! Die kürzeste Anleitung, um Area Universe zu verstehen und deine ersten Spielstunden zu meistern."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">Was ist Area Universe?</h2>
            <p>Area Universe ist ein <strong>Multiplayer-Weltraumstrategiespiel</strong>. Du führst ein Imperium: Deine Planeten produzieren Ressourcen, deine Schiffe durchqueren die Galaxie und deine Allianzen besiegeln das Schicksal der Spieler.</p>
            <p>Es ist ein Spiel, das <strong>langfristig</strong> gespielt wird: Deine Ressourcen sammeln sich auch dann an, wenn du offline bist. Ein paar Minuten pro Tag reichen, um Fortschritte zu machen.</p>

            <h2 id="objectif">Dein Ziel</h2>
            <p>Je nach gewähltem Servermodus (siehe Artikel <em>Spielmodi</em>) variiert das Endziel: am längsten durchhalten, die Rangliste dominieren, der Letzte sein, der noch steht usw. Das Rezept ist aber immer dasselbe:</p>
            <ol>
                <li><strong>Eine Wirtschaft am Laufen halten</strong> (Ressourcen + Währung).</li>
                <li><strong>Eine Flotte und Verteidigung aufbauen</strong>.</li>
                <li><strong>Dich verbünden</strong>, um zu mehreren etwas zu bewegen.</li>
            </ol>

            <h2 id="premieres-actions">Deine ersten 6 Aktionen</h2>
            <ol>
                <li><strong>Baue eine Niob-Mine und einen Wasserextraktor</strong> auf deinem Startplaneten.</li>
                <li><strong>Füge eine Farm hinzu</strong>, um deine Arbeiter zu ernähren.</li>
                <li><strong>Baue eine Stadt</strong>, um die Anzahl deiner Arbeiter zu erhöhen — sie sind deine Lieferanten von <em>Bitcoins</em> (der Spielwährung).</li>
                <li><strong>Baue ein Forschungszentrum</strong>, dann eine <strong>Raumwerft</strong>, um deine ersten Schiffe zu bauen.</li>
                <li><strong>Schicke einen Frachter los, um Ressourcen zu verkaufen</strong> bei einem Händler: einfaches Geld.</li>
                <li><strong>Tritt einer Allianz bei</strong>: Du erhältst <strong>+20&nbsp;% Produktion</strong> und Zugang zu den Allianzforschungen.</li>
            </ol>

            <h2 id="tutoriel">Das integrierte Tutorial</h2>
            <p>Ein <strong>interaktives Tutorial</strong> führt dich Schritt für Schritt. Es ist in <strong>16 Schritte</strong> unterteilt (Bau, Flotten, Kampf…). Jeder abgeschlossene Schritt bringt eine Belohnung (Bitcoins, Legionäre, Schiffe…).</p>
            <ul>
                <li>Du kannst es jederzeit <strong>unterbrechen</strong> oder <strong>fortsetzen</strong>.</li>
                <li>Es ist über deine <strong>Einstellungen</strong> zugänglich.</li>
            </ul>

            <h2 id="a-surveiller">Worauf du von Anfang an achten musst</h2>
            <ul>
                <li><strong>Positive Bitcoins</strong>: Jeden Tag um 18:59 UTC berechnet ein Bericht deine Einnahmen und Unterhaltskosten. Wenn du ins Minus rutschst, ist es das <strong>wirtschaftliche Game Over</strong>.</li>
                <li><strong>Lagerung</strong>: Wenn deine Lager voll sind, stoppt die Produktion. Baue entsprechend Lager.</li>
                <li><strong>Tägliche Quests</strong>: 3 Quests pro Tag, alle erledigt = <strong>+250 Kriegspunkte</strong>.</li>
            </ul>

            <h2 id="protection-debutant">Der Anfängerschutz</h2>
            <p>Während deiner ersten Tage bist du <strong>geschützt</strong>: Kein Spieler kann dich angreifen, plündern, überfallen oder bombardieren. So kannst du in Ruhe deine ersten Stützpunkte aufbauen.</p>
            <p>Der Schutz endet, sobald eine dieser Bedingungen erfüllt ist:</p>
            <ul>
                <li><strong>7 Tage</strong> sind seit der Erstellung deines Kommandanten vergangen.</li>
                <li>Du besitzt einen <strong>4. Planeten</strong>.</li>
                <li>Du schickst selbst eine <strong>Offensivmission</strong> los (Plünderung, Invasion oder Atomangriff): Damit verzichtest du sofort auf deinen Schutz.</li>
            </ul>
            <p>Solange du geschützt bist, kannst du andere nicht angreifen, ohne diesen Schutz zu verlieren. Nutze die Zeit, um eine solide Wirtschaft und Verteidigung aufzubauen, bevor du dich in den Kampf stürzt.</p>

    interface_guide:
        title: "Die Oberfläche verstehen"
        category: "beginner"
        order: 2
        tags: "oberflaeche,bildschirm,menue,navigation,knoepfe,aktiver planet"
        summary: "Die 3 Bildschirmbereiche und wie du dich ohne Orientierungsverlust zurechtfindest."
        related: "getting_started,resources_intro,reports"
        body: |
            <h2 id="disposition">Die 3 Bildschirmbereiche</h2>
            <ul>
                <li><strong>Die Ressourcenleiste, oben</strong> — deine Rohstoffe und der Name deines <strong>aktiven Planeten</strong>: tippe darauf, um den Planeten zu wechseln.</li>
                <li><strong>Das Menü, links</strong> — alle Spielbereiche (Imperium, Planeten, Flotten, Allianz, Nachrichten…).</li>
                <li><strong>Der zentrale Bereich</strong> — der Inhalt der aktuellen Seite (Karte, Flottenliste, Gebäude…). Nur dieser Bereich scrollt.</li>
            </ul>
            <p><em>Auf dem Handy wird das linke Menü zu einer Symbolleiste am linken Rand: die fünf Hauptziele bleiben dauerhaft sichtbar, und der Menü-Knopf öffnet den Rest in einem Panel, das von unten hochfährt.</em></p>

            <h2 id="barre-ressources">Die Ressourcenleiste (oben)</h2>
            <p>Sie zeigt in Echtzeit deine 4 Hauptressourcen an:</p>
            <ul>
                <li><strong>Niob</strong> — das Grunderz (Gebäude, Schiffe).</li>
                <li><strong>Wasser</strong> — unverzichtbar für Bau und Schiffe.</li>
                <li><strong>Nahrung</strong> — ernährt deine Arbeiter, Legionäre und Mechs.</li>
                <li><strong>Uran</strong> — seltene Ressource, für Atombomben und Arena-Herausforderungen.</li>
            </ul>
            <p>Niob, Wasser, Nahrung und deine Arbeiter steigen Sekunde für Sekunde im Takt deiner Produktion, bis zu deiner Lagergrenze. Tippe auf eine Ressource, um ihre Produktion pro Stunde zu sehen, Boni inklusive (Held, Sklavenlager, Allianz, Embargo).</p>
            <p>Die <strong>Bitcoins</strong> (Währung) und die <strong>Kriegspunkte (KP)</strong> werden ebenfalls in der Ressourcenleiste angezeigt.</p>

            <h2 id="planete-active">Aktiver Planet: Was das bedeutet</h2>
            <p>Wenn du mehrere Planeten hast, ist jeweils nur einer <strong>aktiv</strong>. Alle deine Aktionen (bauen, ein Schiff fertigen, eine Flotte starten) beziehen sich auf diesen Planeten.</p>
            <p>Zum Wechseln: Tippe auf den Namen des Planeten in der Ressourcenleiste und wähle aus der Liste, die von unten hochfährt.</p>

            <h2 id="navigation">Schnell orientieren</h2>
            <ul>
                <li><strong>Imperium</strong> — Gesamtübersicht (alle deine Planeten, Forschungen, Wirtschaft).</li>
                <li><strong>Planet</strong> — Bau und Verwaltung des aktiven Planeten.</li>
                <li><strong>Flotten</strong> — Schiffe erstellen, senden und verfolgen.</li>
                <li><strong>Karte</strong> — die Galaxie erkunden.</li>
                <li><strong>Nachrichten / Berichte</strong> — alles, was dir das Spiel meldet (Kämpfe, Ankünfte, Allianz…).</li>
                <li><strong>Allianz</strong> — deine Gruppe, der Chat-Salon, die Diplomatie.</li>
            </ul>

    resources_intro:
        title: "Die Ressourcen"
        category: "beginner"
        order: 3
        tags: "ressourcen,niob,wasser,nahrung,uran,produktion,lagerung,zyklus"
        summary: "Die 4 Ressourcen des Spiels, wie sie produziert werden und warum die Lagerung entscheidend ist."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Die 4 Ressourcen des Spiels</h2>
            <table>
                <tr><th>Ressource</th><th>Wofür sie dient</th><th>Wie man sie bekommt</th></tr>
                <tr><td><strong>Niob</strong></td><td>Gebäude und Schiffe bauen</td><td>Mine</td></tr>
                <tr><td><strong>Wasser</strong></td><td>Bauen, fertigen, unterhalten</td><td>Wasserextraktor</td></tr>
                <tr><td><strong>Nahrung</strong></td><td>Ernährt deine Arbeiter, Legionäre und Mechs</td><td>Farm, dann Aeroponische Farm</td></tr>
                <tr><td><strong>Uran</strong></td><td>Atombomben, Arena-Herausforderungen</td><td>Recycling von Urantrümmern, Siege gegen die Cthulhu</td></tr>
            </table>

            <h2 id="cycle">Der Produktionszyklus</h2>
            <p>Deine Ressourcen kommen automatisch und kontinuierlich an. Man spricht vom <strong>Produktionszyklus</strong>: Es ist der interne Rechen-Rhythmus des Spiels.</p>
            <ul>
                <li>Auf einem <strong>Planeten</strong>: Zyklus von <strong>10 Minuten</strong>.</li>
                <li>Auf einem <strong>Mond</strong>: Zyklus von <strong>1 Minute</strong> (viel schneller, nur für Nahrung).</li>
            </ul>
            <p>Je höher das Level deiner Mine / deines Extraktors / deiner Farm, desto größer die pro Zyklus produzierte Menge.</p>

            <h2 id="bonus">Was deine Produktion verbessert</h2>
            <ul>
                <li><strong>Einer Allianz beitreten</strong>: sofort <strong>+20&nbsp;%</strong> auf alle Ressourcen.</li>
                <li><strong>Allianzforschungen</strong>: zusätzliche Boni, die von deiner Allianz freigeschaltet werden.</li>
                <li><strong>Terraforming</strong>: vergrößert den verfügbaren Platz für größere Gebäude.</li>
                <li><strong>Wirtschaftsheld</strong> auf dem Planeten zugewiesen: Produktionsboost.</li>
            </ul>

            <h2 id="stockage">Die Lagerung (nicht vernachlässigen!)</h2>
            <p>Jeder Planet hat eine <strong>maximale Lagerkapazität</strong> pro Ressource. <strong>Wenn sie voll ist, stoppt die Produktion</strong>.</p>
            <p>Um die Kapazität zu erhöhen: Baue <strong>Niob-Lager</strong>, <strong>Wasser-Lager</strong> und <strong>Silos</strong> (Nahrung).</p>
            <p><em>Anfängertipp:</em> Überprüfe deine Lagerung <strong>bevor</strong> du dich für die Nacht abmeldest. Nichts ist schlimmer, als seine Minen 10 Stunden lang stillstehen zu sehen.</p>

    bitcoin_economy:
        title: "Bitcoins und Unterhalt"
        category: "beginner"
        order: 4
        tags: "bitcoin,waehrung,unterhalt,kosten,wirtschaft,game over,tagesbericht"
        summary: "Der Bitcoin ist die Spielwährung. Wie du welche verdienst und vor allem, wie du den Bankrott vermeidest."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Was ist der Bitcoin?</h2>
            <p>Der <strong>Bitcoin</strong> ist die <strong>universelle Währung</strong> von Area Universe (hat nichts mit der echten Krypto zu tun, nur ein Augenzwinkern). Er dient dazu:</p>
            <ul>
                <li><strong>Forschungen</strong> zu starten.</li>
                <li><strong>Legionäre</strong> und <strong>Wissenschaftler</strong> zu rekrutieren.</li>
                <li>Über die <strong>Allianz</strong> (Schatzkammer) zu kaufen.</li>
                <li>Den <strong>täglichen Unterhalt</strong> deiner Truppen, Schiffe und Gebäude zu bezahlen.</li>
            </ul>

            <h2 id="gagner">Wie verdient man welche?</h2>
            <ul>
                <li><strong>Arbeiter</strong> — deine Hauptquelle. Jeden Tag bringen sie dir Einnahmen proportional zu ihrer Anzahl.</li>
                <li><strong>Verkauf an Händler</strong> — schicke einen Frachter mit Niob und Wasser zu einem Händler.</li>
                <li><strong>Tägliche Quests</strong> — einige bringen Bitcoins.</li>
                <li><strong>Login-Bonus</strong> — eine Summe bei der ersten täglichen Verbindung, vervielfacht, wenn du aufeinanderfolgende Tage aneinanderreihst.</li>
                <li><strong>Plünderung</strong> — Raids können Niob und Wasser einbringen, die du weiterverkaufen kannst.</li>
            </ul>

            <h2 id="entretien">Der tägliche Unterhalt</h2>
            <p>Jeden Tag um <strong>18:59 UTC</strong> berechnet das Spiel für dich einen Bericht:</p>
            <ul>
                <li><strong>Einnahmen</strong>: was deine Arbeiter eingebracht haben.</li>
                <li><strong>Kosten</strong>: der Unterhalt deiner Legionäre, Mechs, Schiffe und Gebäude.</li>
                <li><strong>Bilanz</strong>: Einnahmen − Kosten, zu deinem Saldo hinzugefügt (oder davon abgezogen).</li>
            </ul>
            <p>Einheiten auf Mission (Flotten im Flug, Schiffe im Kampf) <strong>kosten mehr</strong> als stationierte. Eine große Armee im Dauereinsatz ruiniert am Ende auch den Vorsichtigsten.</p>

            <h2 id="faillite">Achtung: Das wirtschaftliche Game Over</h2>
            <p>Wenn nach diesem Tagesbericht dein Bitcoin-Saldo ins <strong>Negative</strong> fällt, ist es das <strong>wirtschaftliche Game Over</strong>:</p>
            <ul>
                <li>Alle deine Flotten im Flug werden <strong>zerstört</strong>.</li>
                <li>Dein Saldo wird auf <strong>125&nbsp;000 Bitcoins</strong> zurückgesetzt.</li>
                <li>Einige Forschungen und Fortschritte werden reduziert.</li>
            </ul>
            <p><em>Goldene Regel:</em> Rekrutiere keine Armee, die teurer ist, als deine Arbeiter finanzieren können.</p>

    first_buildings:
        title: "Deine ersten Gebäude bauen"
        category: "beginner"
        order: 5
        tags: "gebaeude,bau,mine,extraktor,farm,anfaenger,platz"
        summary: "Die empfohlene Bau-Reihenfolge, um deinen Startplaneten gut zu starten."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">Die empfohlene Reihenfolge (die ersten 10 Gebäude)</h2>
            <ol>
                <li><strong>Niob-Mine</strong> — deine erste Rohstoffquelle.</li>
                <li><strong>Wasserextraktor</strong> — unverzichtbar, um alles Weitere zu bauen.</li>
                <li><strong>Farm</strong> — ernährt deine Arbeiter und Legionäre.</li>
                <li><strong>Stadt</strong> — erhöht die maximale Zahl der Arbeiter (+25&nbsp;000).</li>
                <li><strong>Niob-Mine und Wasserextraktor Stufe 2</strong> — erhöhe die Produktion, bevor du weitermachst.</li>
                <li><strong>Forschungszentrum</strong> — ermöglicht den Start von Forschungen (Technologien).</li>
                <li><strong>Raumwerft</strong> — um deine ersten Schiffe zu bauen.</li>
                <li><strong>Kaserne</strong> — um Verteidigungslegionäre zu rekrutieren.</li>
                <li><strong>Lager</strong> (Niob, Wasser, Silos) — verhindere, dass die Produktion gesättigt wird.</li>
                <li><strong>Metropole</strong> — nächste Stufe nach der Stadt für einen echten Bevölkerungsboost (+80&nbsp;000 Arbeiter).</li>
            </ol>

            <h2 id="file-attente">Nur ein Bau gleichzeitig</h2>
            <p>Jeder Planet hat <strong>nur eine Bauschlange</strong>. Während ein Gebäude im Level steigt, müssen die anderen warten. Plane entsprechend.</p>
            <p>Mehrere Planeten = mehrere parallele Schlangen: Deshalb beschleunigt die Besiedlung deinen Fortschritt.</p>

            <h2 id="espace">Der verfügbare Platz auf einem Planeten</h2>
            <p>Jeder Planet hat eine begrenzte Anzahl an <strong>Bodenplätzen</strong> (Boden-Gebäude) und <strong>Himmelsplätzen</strong> (Orbitalinseln, Verteidigungen).</p>
            <ul>
                <li>Du siehst die verfügbaren Plätze oben auf der Planetenseite.</li>
                <li>Die Forschung <strong>Terraforming</strong> vergrößert deine Planeten.</li>
                <li>Kein Platz = keine neuen Gebäude mehr (aber du kannst die bestehenden immer noch aufleveln).</li>
            </ul>

    first_fleet:
        title: "Deine erste Flotte aufstellen"
        category: "beginner"
        order: 6
        tags: "flotte,schiffe,erste,erstellung,anfaenger,werft,frachter,sonde"
        summary: "Ein Schiff bauen, eine Flotte zusammenstellen und zum Ziel schicken: Schritt für Schritt."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Was du vorher brauchst</h2>
            <ul>
                <li>Eine <strong>Raumwerft</strong>, auf deinem Planeten gebaut.</li>
                <li>Genug Niob und Wasser, um die Schiffe zu bezahlen.</li>
                <li>(Optional) eine <strong>Forschung</strong>, die das Schiff freischaltet (z.&nbsp;B. <em>Utility</em>-Forschung für Frachter).</li>
            </ul>

            <h2 id="fabriquer">Schritt 1 — Schiffe bauen</h2>
            <p>Gehe auf die Seite <strong>Raum</strong> (linkes Menü). Du siehst dort die Liste der verfügbaren Schiffe. Klicke auf das gewünschte, wähle eine Menge, starte die Produktion.</p>
            <p>Der Bau dauert einige Zeit: Du kannst währenddessen weiterspielen.</p>

            <h2 id="composer">Schritt 2 — Eine Flotte zusammenstellen und schicken</h2>
            <ol>
                <li>Gehe auf die Seite <strong>Flotten</strong>.</li>
                <li>Wähle die einzuschiffenden Schiffe aus (der verfügbare Bestand wird angezeigt).</li>
                <li>Wähle ein <strong>Ziel</strong> im Format <code>Galaxie:Sektor:Position</code> (z.&nbsp;B. <code>1:5:12</code>). Du kannst auch direkt von der Karte klicken.</li>
                <li>Wähle den <strong>Missionstyp</strong> (siehe Artikel <em>Missionstypen</em>).</li>
                <li>Bestätige. Der Treibstoff (Wasser) wird automatisch abgezogen.</li>
            </ol>

            <h2 id="premiers-vaisseaux">Die richtigen Schiffe zum Starten</h2>
            <ul>
                <li><strong>Frachter I</strong> — Ressourcentransport (3&nbsp;000 Kapazität). Unverzichtbar, um an Händler zu verkaufen.</li>
                <li><strong>Sonde</strong> — spioniert feindliche Planeten aus. <em>Vor</em> jedem Angriff zu senden.</li>
                <li><strong>Jäger</strong> — erstes Kampfschiff, günstig.</li>
                <li><strong>Recycler</strong> — sammelt die Trümmer nach einem Kampf ein. Sehr rentabel.</li>
            </ul>

            <h2 id="premiere-cible">Idee für die erste Mission</h2>
            <p>Schicke 1 Frachter voller Niob/Wasser in <strong>Mission Entladung</strong> zu einem Händler (Position 15 eines Sektors). Der Händler zahlt dich in Bitcoins, und der Frachter kommt von allein zurück.</p>

    first_combat:
        title: "Dein erster Kampf"
        category: "beginner"
        order: 7
        tags: "kampf,erster,angriff,bericht,anfaenger,runden"
        summary: "Wie du einen Raumkampf auslöst, was währenddessen passiert und was danach zu tun ist."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Vorbereitung (wichtig!)</h2>
            <ol>
                <li><strong>Schicke eine Sonde</strong> zum Ziel, um seine Verteidigung einzuschätzen. 10 Jäger blind zu verlieren ist verschmerzbar; 100 zu verlieren tut weh.</li>
                <li><strong>Stelle eine passende Flotte zusammen</strong>: genug Feuerkraft und denk daran, einen <strong>Recycler</strong> hinzuzufügen, um die Trümmer zu sammeln.</li>
                <li><strong>Überprüfe deinen Unterhalt</strong>: Eine große Flotte ist teuer, solange sie auf Mission ist.</li>
            </ol>

            <h2 id="enchainement">Was Schritt für Schritt passiert</h2>
            <ol>
                <li><strong>Du startest die Flotte</strong> in Mission <em>Normal</em> (Angriff) auf die Koordinaten eines Feindes.</li>
                <li><strong>Sie reist</strong> — die Reisezeit wird auf der Flotten-Seite angezeigt. Du kannst sie zurückrufen, bevor sie ankommt.</li>
                <li><strong>Ankunft</strong>: Wenn feindliche Flotten vor Ort sind, beginnt automatisch ein Kampf.</li>
                <li><strong>Kampf in Runden</strong>: Beide Seiten tauschen rundenweise Schüsse aus (bis zu 100 Runden max.). Schilde absorbieren zuerst.</li>
                <li><strong>Ende des Kampfes</strong>: Ein Lager ist eliminiert, oder die 100 Runden werden erreicht (in diesem Fall <strong>gewinnt der Verteidiger</strong>).</li>
            </ol>

            <h2 id="apres-combat">Nach dem Kampf</h2>
            <ul>
                <li>Ein <strong>Kampfbericht</strong> wird dir zugesendet (Seite Nachrichten / Berichte).</li>
                <li>Die zerstörten Schiffe hinterlassen <strong>Trümmer</strong> vor Ort. Schicke Recycler!</li>
                <li>Der Sieger erhält <strong>Kriegspunkte (KP)</strong> proportional zu den zugefügten Verlusten.</li>
                <li>Deine überlebende Flotte kehrt automatisch zu ihrem Startplaneten zurück.</li>
            </ul>

            <h2 id="erreurs">Klassische Fehler, die du vermeiden solltest</h2>
            <ul>
                <li>Angreifen, ohne vorher zu sondieren.</li>
                <li>Vergessen, dass die Runden bei 100 zugunsten des Verteidigers enden (ein zu schwieriges Ziel anzugreifen = automatische Niederlage).</li>
                <li>Keinen Recycler mitzuschicken: Deine Gegner holen sich <em>deine</em> Trümmer vor dir.</li>
            </ul>

    tips:
        title: "Tipps für einen guten Start"
        category: "beginner"
        order: 8
        tags: "tipps,ratschlaege,strategie,anfaenger"
        summary: "15 Ratschläge, die in deinen ersten Tagen den Unterschied machen."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Wirtschaft</h2>
            <ul>
                <li><strong>Maximiere deine Arbeiter</strong>: Sie sind deine Haupt-Bitcoin-Quelle.</li>
                <li><strong>Baue nicht zu früh</strong> eine große Armee: Sie ruiniert dich durch den Unterhalt.</li>
                <li><strong>Baue Städte, dann Metropolen</strong>, um die Bevölkerung zu erhöhen.</li>
                <li><strong>Überwache deinen Tagesbericht</strong>: Wenn deine Kosten deine Einnahmen übersteigen, reagiere sofort.</li>
                <li><strong>Verkaufe deine Überschüsse an Händler</strong>, anstatt die Lager sättigen zu lassen.</li>
            </ul>

            <h2 id="militaire">Militär</h2>
            <ul>
                <li><strong>Immer eine Verteidigung auf jedem Planeten</strong>: Legionäre in der Kaserne, Mechs, ein oder zwei Geschütztürme.</li>
                <li><strong>Passe deine Schiffe jeden Tag an</strong>: 40 Gratispunkte zum Verteilen (Panzerung, Präzision, Waffen).</li>
                <li><strong>Recycler sind sehr rentabel</strong>: Sammle nach jedem Kampf die Trümmer ein.</li>
                <li><strong>Sondiere vor dem Angriff</strong>: Eine Sonde kostet fast nichts, eine verlorene Flotte kostet viel.</li>
                <li><strong>Achtung auf die 100-Runden-Grenze</strong>: Wenn du den Verteidiger nicht in 100 Runden eliminierst, verlierst du.</li>
            </ul>

            <h2 id="social">Sozial</h2>
            <ul>
                <li><strong>Tritt schnell einer Allianz bei</strong>: +20&nbsp;% Produktion, Zugang zu Diplomatie und Allianzforschungen.</li>
                <li><strong>Erledige deine 3 täglichen Quests</strong>: <strong>+250 KP</strong> sind der Bonus, jeden Tag.</li>
                <li><strong>Diskutiere im Allianz-Chat</strong>: Zwei Angriffe koordinieren ist besser, als einen allein zu versuchen.</li>
                <li><strong>Melde dich jeden Tag an</strong>: Der Login-Bonus steigt sprunghaft mit der Serie von 7 aufeinanderfolgenden Tagen.</li>
                <li><strong>Aktiviere die Push-Benachrichtigungen</strong>: Du weißt sofort, wenn eine feindliche Flotte auf dich zukommt.</li>
            </ul>

    resources:
        title: "Ressourcen im Detail"
        category: "economy"
        order: 1
        tags: "ressourcen,niob,wasser,nahrung,uran,produktion,lagerung,zyklus,rationen"
        summary: "Alles über Ressourcen verstehen: Produktion, Boni, Lagerung und der Sonderfall Uran."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Erinnerung: Die 4 Ressourcen</h2>
            <ul>
                <li><strong>Niob</strong> — Bau.</li>
                <li><strong>Wasser</strong> — Bau + Flottentreibstoff.</li>
                <li><strong>Nahrung</strong> — Unterhalt der Arbeiter, Legionäre, Mechs.</li>
                <li><strong>Uran</strong> — Atomwaffen, Arena-Herausforderungen. Selten und kostbar.</li>
            </ul>

            <h2 id="production">Wie die Produktion berechnet wird</h2>
            <p>Jeder Planet läuft in einem <strong>10-Minuten-Zyklus</strong>. Bei jedem Zyklus erhältst du eine feste Menge, die abhängt von:</p>
            <ul>
                <li>dem <strong>Level</strong> deines Produktionsgebäudes (Mine, Extraktor, Farm);</li>
                <li>der <strong>Größe</strong> des Planeten (Terraforming);</li>
                <li>deinen <strong>Boni</strong> (Allianz, Forschungen, Helden).</li>
            </ul>
            <p>Die <strong>Monde</strong> produzieren Nahrung <strong>10-mal schneller</strong> (1-Minuten-Zyklus).</p>
            <p>Selbst <strong>ohne Produktionsgebäude</strong> – oder wenn du es bis auf Stufe 0 abreißt – behält ein Planet eine <strong>minimale Grundproduktion</strong>: <strong>7 Niobium, 6 Wasser und 9 Nahrung</strong> pro Zyklus. Ab Stufe 1 übernimmt die (stets höhere) Produktion des Gebäudes.</p>
            <p>Bei der Nahrung <strong>addieren sich</strong> das <strong>Agrarfeld</strong> und die <strong>Aeroponische Farm</strong>: ihre Erträge werden zusammengezählt.</p>

            <h2 id="bonus">Was deine Produktion erhöht</h2>
            <table>
                <tr><th>Quelle</th><th>Effekt</th></tr>
                <tr><td>Zugehörigkeit zu einer Allianz</td><td>+20&nbsp;% Basis</td></tr>
                <tr><td>Allianz-Produktionsforschungen</td><td>Zusätzlicher Bonus, der mit dem Forschungslevel wächst</td></tr>
                <tr><td>Terraforming des Planeten</td><td>Mehr Platz = bessere Gebäude</td></tr>
                <tr><td>Wirtschaftsheld auf dem Planeten</td><td>Produktionsboost (verdoppelt die anderen Boni)</td></tr>
                <tr><td>Spezielle Ereignisse</td><td>Temporäre Boosts während eines Server-Events</td></tr>
            </table>

            <h2 id="stockage">Die Lagerung und ihre Fallen</h2>
            <p>Dein Planet hat eine <strong>maximale Kapazität</strong> für jede Ressource. Wenn sie voll ist, stoppt die Produktion — die Ressource wird weiter "produziert", geht aber verloren.</p>
            <p>Lösungen: <strong>Lager</strong> bauen (Niob, Wasser, Silos), Überschuss an Händler verkaufen oder die Überschüsse an einen Verbündeten senden.</p>

            <p>Nahrung wird wie Niobium und Wasser transportiert: Laden Sie <strong>Rationen</strong> in den Frachtraum einer Flotte (1 Platz pro Ration), um einen anderen Planeten zu versorgen. Beim Ausladen überschreitet der Speicher niemals seine Kapazität: Der Überschuss bleibt im Frachtraum.</p>

            <h2 id="uranium">Uran: Der Sonderfall</h2>
            <p>Kein Gebäude produziert Uran. Du bekommst welches:</p>
            <ul>
                <li>durch <strong>Recycling</strong> von Urantrümmern auf der Karte (an ihrem speziellen Symbol erkennbar);</li>
                <li>durch <strong>Siege über Cthulhu</strong> (PvE-Missionen);</li>
                <li>durch <strong>Siege bei Arena-Herausforderungen</strong> mit Uran-Einsatz.</li>
            </ul>
            <p>Uran dient zum Bauen von <strong>Atombomben</strong> und als Einsatz in der <strong>Arena</strong>.</p>

    buildings:
        title: "Die Gebäude"
        category: "economy"
        order: 2
        tags: "gebaeude,bau,mine,extraktor,farm,stadt,werft,bunker,geschuetzturm"
        summary: "Vollständiger Katalog der Gebäude nach Rolle: Produktion, Lagerung, Bevölkerung, Militär, Verteidigung."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Ressourcenproduktion</h2>
            <table>
                <tr><th>Gebäude</th><th>Produziert</th><th>Bemerkung</th></tr>
                <tr><td>Niob-Mine</td><td>Niob</td><td>Als Erstes zu bauen.</td></tr>
                <tr><td>Wasserextraktor</td><td>Wasser</td><td>Unverzichtbar für alles.</td></tr>
                <tr><td>Farm</td><td>Nahrung</td><td>Um Arbeiter und Legionäre zu ernähren.</td></tr>
                <tr><td>Aeroponische Farm</td><td>Nahrung (fortgeschritten)</td><td>Effizienter als die Farm. Durch Forschung freigeschaltet.</td></tr>
            </table>

            <h2 id="stockage">Lagerung</h2>
            <table>
                <tr><th>Gebäude</th><th>Rolle</th></tr>
                <tr><td>Niob-Lager</td><td>Erhöht die lagerbare Niob-Kapazität.</td></tr>
                <tr><td>Wasser-Lager</td><td>Erhöht die lagerbare Wasser-Kapazität.</td></tr>
                <tr><td>Silos</td><td>Erhöht die Nahrungskapazität.</td></tr>
            </table>

            <h2 id="population">Bevölkerung und Wissenschaft</h2>
            <table>
                <tr><th>Gebäude</th><th>Rolle</th></tr>
                <tr><td>Stadt</td><td>+25&nbsp;000 Arbeiter max. pro Level.</td></tr>
                <tr><td>Metropole</td><td>+80&nbsp;000 Arbeiter max. pro Level.</td></tr>
                <tr><td>Forschungszentrum</td><td>Ermöglicht den Start von Forschungen und erhöht die Geschwindigkeit.</td></tr>
            </table>

            <h2 id="militaire">Militär und Schiffsproduktion</h2>
            <table>
                <tr><th>Gebäude</th><th>Rolle</th></tr>
                <tr><td>Kaserne</td><td>+5&nbsp;000 Legionäre max. pro Level.</td></tr>
                <tr><td>Bunker</td><td>+15&nbsp;000 Legionäre max. und <strong>schützt einen Teil deiner Ressourcen</strong> vor Raids (5&nbsp;% pro Level).</td></tr>
                <tr><td>Atombasis</td><td>Ermöglicht den Bau von Atombomben (Uran erforderlich).</td></tr>
                <tr><td>Raumwerft</td><td>Baut Utility-Schiffe (Frachter, Sonde, Recycler…) und beschleunigt die Produktion aller Schiffe (+25&nbsp;% pro Stufe).</td></tr>
                <tr><td>Leichte Fabrik</td><td>Baut leichte Schiffe (Jäger, Korvetten) und beschleunigt die Schiffsproduktion (+40&nbsp;%/Stufe) <strong>und die Verteidigungsproduktion</strong> (+40&nbsp;%/Stufe).</td></tr>
                <tr><td>Schwere Fabrik</td><td>Baut schwere Schiffe (Fregatten, Schlachtschiffe, Zerstörer) und beschleunigt die Schiffsproduktion (+60&nbsp;%/Stufe) <strong>und die Verteidigungsproduktion</strong> (+60&nbsp;%/Stufe).</td></tr>
                <tr><td>Gefängnis</td><td>Sperrt gefangene Helden ein.</td></tr>
                <tr><td>Sklavenlager</td><td>Alternative zum Gefängnis. Lässt gefangene Helden arbeiten.</td></tr>
            </table>

            <h2 id="orbital">Verteidigung und Orbitalanlagen (im Himmel)</h2>
            <table>
                <tr><th>Gebäude / Anlage</th><th>Rolle</th></tr>
                <tr><td>Orbitalinsel</td><td>Fügt Himmelsplätze hinzu, um Geschütztürme/Schilde zu platzieren.</td></tr>
                <tr><td>Raumbasis</td><td>Bringt einen Panzerungsbonus für Orbitalverteidigungen.</td></tr>
                <tr><td>Schild / Großer Schild</td><td>Absorbiert Schaden, bevor die Verteidigungen getroffen werden.</td></tr>
                <tr><td>Geschütztürme (Raketen, Laser, Gauss, Plasma…)</td><td>Verteidigen deinen Planeten gegen Flotten im Angriffsmodus.</td></tr>
            </table>

            <h2 id="detection">Erkennung und Störung</h2>
            <table>
                <tr><th>Gebäude</th><th>Rolle</th></tr>
                <tr><td>Radar</td><td>Erkennt sich nähernde Flotten.</td></tr>
                <tr><td>Sky Radar</td><td>Orbitale Version des Radars, erhöhte Reichweite.</td></tr>
                <tr><td>Sky Jammer</td><td>Stört die feindliche Erkennung: Deine Bewegungen werden unsichtbar.</td></tr>
            </table>

            <h2 id="file-production">Die Produktionswarteschlange verwalten</h2>
            <p>Der Bau von Gebäuden, Schiffen (Raumwerft) und Verteidigungen läuft über eine <strong>Warteschlange</strong>, die du verwalten kannst:</p>
            <ul>
                <li>Die Reihenfolge der wartenden Elemente <strong>umsortieren</strong> (Drag &amp; Drop), um zu priorisieren, was zählt.</li>
                <li>Ein wartendes Element <strong>abbrechen</strong>: Du wirst <strong>anteilig erstattet</strong> für das, was noch nicht produziert wurde.</li>
                <li>Die laufende Warteschlange wird oben auf jeder Produktionsseite unter dem Titel angezeigt.</li>
                <li>Die Warteschlange ist auf <strong>15 wartende Elemente</strong> begrenzt (zusätzlich zum laufenden Bau): darüber hinaus weist dich eine Meldung darauf hin, den Abschluss eines Baus abzuwarten oder einen abzubrechen, bevor du einen neuen hinzufügst.</li>
                <li>Die <strong>Schwimmende Stadt</strong> (+10&nbsp;Boden/Stufe) und die <strong>Orbitalstation</strong> (+5&nbsp;Himmel/Stufe) sind auf <strong>je 5 Stück pro Planet</strong> begrenzt.</li>
            </ul>

    research:
        title: "Forschung und Technologien"
        category: "economy"
        order: 3
        tags: "forschung,technologie,wissenschaft,bitcoin,freischaltung,technologiebaum"
        summary: "Die Technologien, die Schiffe, Boni und neue Fähigkeiten freischalten. Wie man priorisiert."
        related: "buildings,ship_types,workers_scientists"
        body: |
            <h2 id="fonctionnement">Wie es funktioniert</h2>
            <p>Forschungen werden vom <strong>Forschungszentrum</strong> aus gestartet. Jede Forschung:</p>
            <ul>
                <li>kostet <strong>Bitcoins</strong>;</li>
                <li>dauert <strong>Zeit</strong> (von einigen Minuten bis zu mehreren Stunden je nach Level);</li>
                <li>kann eine <strong>Voraussetzung</strong> haben (eine andere Forschung auf einer bestimmten Stufe).</li>
            </ul>
            <p>Das Rekrutieren von <strong>Wissenschaftlern</strong> beschleunigt deine laufenden Forschungen.</p>

            <h2 id="priorite-debutant">Prioritäten für Anfänger</h2>
            <ol>
                <li><strong>Utility</strong> — schaltet Frachter, Sonden, Recycler frei.</li>
                <li><strong>Industrie</strong> — mehr Ressourcenproduktion.</li>
                <li><strong>Demografie</strong> — mehr Arbeiter (also mehr Bitcoins).</li>
                <li><strong>Landungsschiff</strong> und <strong>Recycler</strong> — unverzichtbar für Angriff und Recycling.</li>
                <li><strong>Bewaffnung / Panzerung</strong> — vor jedem echten Kampf.</li>
            </ol>

            <h2 id="recherches">Vollständige Liste der Forschungen</h2>
            <table>
                <tr><th>Forschung</th><th>Effekt</th><th>Max. Level</th></tr>
                <tr><td>Utility</td><td>Schaltet Frachter, Sonden, Recycler usw. frei.</td><td>3</td></tr>
                <tr><td>Terraforming</td><td>Vergrößert die bebaubare Fläche der Planeten.</td><td>18</td></tr>
                <tr><td>Expansion</td><td>Erhöht die Anzahl Planeten, die du besiedeln kannst.</td><td>2</td></tr>
                <tr><td>Industrie</td><td>Produktionsbonus für Ressourcen.</td><td>5</td></tr>
                <tr><td>Demografie</td><td>Erhöht die Arbeiterproduktion.</td><td>5</td></tr>
                <tr><td>Disziplin</td><td>Verstärkt Bodenlegionäre.</td><td>3</td></tr>
                <tr><td>Stacheldraht</td><td>Bodenverteidigungsbonus.</td><td>5</td></tr>
                <tr><td>Gepanzerte Einheiten</td><td>Schaltet Mechs frei.</td><td>1</td></tr>
                <tr><td>Bewaffnung</td><td>Erhöht den Schaden deiner Schiffe.</td><td>5</td></tr>
                <tr><td>Rakete</td><td>Raketen-Fraktion (Bonus gegen Laser).</td><td>3</td></tr>
                <tr><td>Laser</td><td>Laser-Fraktion (Bonus gegen Plasma).</td><td>3</td></tr>
                <tr><td>Plasma</td><td>Plasma-Fraktion (Bonus gegen Raketen).</td><td>3</td></tr>
                <tr><td>Hyperraum</td><td>Ermöglicht Reisen zwischen Galaxien.</td><td>1</td></tr>
                <tr><td>Welle</td><td>Verbessert Radare und Kommunikation. Voraussetzung für andere Forschungen.</td><td>5</td></tr>
                <tr><td>Spionage</td><td>Verbessert die Reichweite deiner Sonden (Voraussetzung: Welle Stufe 5).</td><td>999</td></tr>
                <tr><td>Frachter</td><td>Erhöht die Kapazität der Frachter.</td><td>5</td></tr>
                <tr><td>Landungsschiff</td><td>Schaltet Landungsschiffe frei (Legionärtransport).</td><td>1</td></tr>
                <tr><td>Recycler</td><td>Schaltet den Recycler frei.</td><td>1</td></tr>
                <tr><td>Leichtes Schiff</td><td>Schaltet leichte Schiffe frei/verbessert sie.</td><td>3</td></tr>
                <tr><td>Schweres Schiff</td><td>Schaltet schwere Schiffe frei/verbessert sie.</td><td>3</td></tr>
                <tr><td>Aeroponische Farm</td><td>Schaltet die fortgeschrittene Version der Farm frei.</td><td>1</td></tr>
                <tr><td>Gefängnis</td><td>Schaltet das Gefängnis frei (Voraussetzung: Stacheldraht 5).</td><td>1</td></tr>
            </table>

            <h2 id="modes-speciaux">Servermodi mit maximalen Forschungen</h2>
            <p>In einigen Modi (Battle Royale, Domination, Search &amp; Destroy) starten alle deine Forschungen auf <strong>maximalem Level</strong>. Das Forschungsmenü ist dann ausgeblendet.</p>

    workers_scientists:
        title: "Arbeiter und Wissenschaftler"
        category: "economy"
        order: 4
        tags: "arbeiter,wissenschaftler,bevoelkerung,bitcoin,produktion,verteidigung"
        summary: "Die beiden Bevölkerungen deines Imperiums: die Arbeiter, die zahlen, die Wissenschaftler, die beschleunigen."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Die Arbeiter</h2>
            <p>Die Arbeiter sind deine <strong>Haupt-Bitcoin-Quelle</strong>. Jeden Tag (beim Tagesbericht) zahlen sie dir Einnahmen proportional zu ihrer Anzahl.</p>
            <p>Ihre <strong>Maximalzahl</strong> hängt von den Städten und Metropolen ab, die du gebaut hast:</p>
            <ul>
                <li><strong>Stadt</strong>: +25&nbsp;000 Arbeiter max. pro Level.</li>
                <li><strong>Metropole</strong>: +80&nbsp;000 Arbeiter max. pro Level.</li>
            </ul>
            <p>Um ihre konkrete Anzahl zu erhöhen (nicht nur die Obergrenze), braucht man <strong>Nahrung</strong> auf Vorrat — die Bevölkerung wächst natürlich, solange sie ernährt wird.</p>

            <h2 id="scientifiques">Die Wissenschaftler</h2>
            <p>Die Wissenschaftler <strong>beschleunigen deine Forschungen</strong>. Je mehr du rekrutierst, desto schneller enden deine Technologien.</p>
            <p>Achtung: Jeder Wissenschaftler kostet einen kleinen täglichen Unterhalt. Nicht überrekrutieren.</p>

            <h2 id="defense">Verteidigungsrolle</h2>
            <p>Deine <strong>Arbeiter nehmen an der Bodenverteidigung teil</strong> — aber nur während einer <strong>Invasion</strong> (wenn der Feind deinen Planeten einnehmen will). Während eines klassischen <strong>Raids</strong> (einfache Plünderung) bleiben sie versteckt.</p>
            <p>Allianzforschungen vom Typ "Arbeiterverteidigung" stärken ihre Effektivität weiter.</p>

            <h2 id="gerer">Die Bevölkerung gut verwalten</h2>
            <ul>
                <li>Passe deine Arbeiterzahl an deine Nahrungskapazität an.</li>
                <li>Es ist nicht nötig, die Maximalbevölkerung immer bei 100&nbsp;% zu haben: Ziele auf Rentabilität.</li>
                <li>Bei Hungersnot oder Embargo können deine Arbeiter sterben — lege Vorräte an.</li>
            </ul>

            <h2 id="reserve-5000">Die unantastbare Reserve von 5 000 Arbeitern</h2>
            <p>Ein Planet kann <strong>nie unter 5&nbsp;000 Arbeiter fallen</strong>. Diese Reserve ist geschützt: Jede Aktion, die sie darunter drücken würde, wird mit einer klaren Meldung blockiert. Betroffen sind:</p>
            <ul>
                <li>Die <strong>Verteidigungsrekrutierung</strong> (Legionäre, Mechs, Wissenschaftler), die Arbeiter verbraucht.</li>
                <li>Der <strong>Schiffsbau</strong> in der Raumwerft.</li>
                <li>Das <strong>Verladen von Arbeitern in einen Frachter</strong> für einen Transfer.</li>
            </ul>
            <p>Der „MAX"-Button auf den Produktionsseiten berücksichtigt diese Reserve: Er schlägt dir nie ein Maximum vor, das deinen Planeten unter die Schwelle leeren würde.</p>

    market:
        title: "Markt und Händler"
        category: "economy"
        order: 5
        tags: "markt,haendler,verkauf,handel,frachter,bitcoin"
        summary: "Wie du deine Ressourcen an NPC-Händler gegen Bitcoins verkaufst."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Die Händler, wer sind das?</h2>
            <p><strong>Nicht-Spieler-Charaktere</strong> (NPCs), die auf der Karte vorhanden sind. Du kannst ihnen dein Niob und dein Wasser im Austausch gegen Bitcoins verkaufen.</p>
            <p>Sie erscheinen regelmäßig in verschiedenen Sektoren des Universums — ihre Position ist auf der Karte sichtbar.</p>

            <h2 id="vendre">Wie man an sie verkauft</h2>
            <ol>
                <li>Belade einen <strong>Frachter</strong> mit Niob und/oder Wasser.</li>
                <li>Sende ihn in Mission <strong>Entladung</strong> zum Händler.</li>
                <li>Der Frachter kommt an, der Verkauf findet statt, du erhältst Bitcoins.</li>
                <li>Der Frachter kehrt automatisch zu dir zurück.</li>
            </ol>

            <h2 id="immunite">Die Händler sind unantastbar</h2>
            <p>Die Händler sind <strong>immun gegen jeden Angriff</strong>. Du kannst sie nicht raiden, einfallen oder bekämpfen. Ihre Flotten nehmen nie an einem Kampf teil, selbst wenn sie sich am selben Punkt wie eine Auseinandersetzung befinden.</p>
            <p>Fazit: Keine bösen Überraschungen, ein sicherer Handelspartner.</p>

            <h2 id="gain">Wie viel bringt es?</h2>
            <p>Der gezahlte Preis hängt von der Ressource ab (Wasser bringt mehr als Niob, zum aktuellen Kurs) und von einem <strong>Händler-Bonus</strong>, der mit den speziellen Allianzforschungen steigt.</p>
            <p>Die Oberfläche zeigt dir den geschätzten Gewinn vor dem Bestätigen des Verkaufs an. Schau hin, bevor du sendest.</p>

            <h2 id="astuce">Tipp</h2>
            <p>Anstatt deine Lager sättigen zu lassen, schicke regelmäßig einen Frachter. Das sind gratis Bitcoins, um deine Forschungen oder deine Armee zu finanzieren.</p>

    recycling:
        title: "Recycling"
        category: "economy"
        order: 6
        tags: "recycling,truemmer,cdr,recycler,asteroid,uran"
        summary: "Nach jedem Kampf liegen Trümmer herum. Sie einzusammeln ist ein offener Tagebau."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Die Trümmer: Was sind sie?</h2>
            <p>Jedes im Kampf zerstörte Schiff hinterlässt einen Teil seiner Kosten in Form von <strong>Trümmern</strong>, die im Weltraum schweben. Man nennt das ein <strong>RF</strong> (Ressourcen-Feld).</p>
            <p>Die Trümmer enthalten <strong>Niob</strong>, <strong>Wasser</strong> und manchmal <strong>Uran</strong> (auf speziellen Trümmern, die allein auf der Karte auftauchen).</p>
            <p>Auf der Karte werden die Trümmer durch ein spezifisches Symbol an der Position der Auseinandersetzung dargestellt.</p>

            <h2 id="wieviel">Wie viele Trümmer?</h2>
            <p>Ein Feld enthält <strong>40 % der Baukosten der tatsächlich zerstörten Schiffe</strong>, auf beiden Seiten. Jedes Schiff gibt seine eigenen Rohstoffe zurück: ein Schlachtschiff, teuer in Wasser, hinterlässt vor allem Wasser. Überlebende hinterlassen nichts.</p>
            <p>Drei Sonderfälle:</p>
            <ul>
                <li>Gegen <strong>Cthulhu</strong>-Horden sinkt die Rate auf <strong>20 %</strong>.</li>
                <li>Die <strong>Ladung</strong> einer vollständig zerstörten Flotte fließt ebenfalls zu 40 % ins Feld. Ein angeschlagener Sieger behält dagegen seinen gesamten Laderaum.</li>
                <li>Zerstörte <strong>Planetenverteidigungen</strong> und mit <strong>Kriegspunkten</strong> bezahlte Schiffe (Plasmajäger, Kampfkorvette, Schlachtschiff, Karavelle) hinterlassen <strong>keine</strong> Trümmer: Ihr Bau kostet weder Niob noch Wasser.</li>
            </ul>
            <p>Ein <strong>Orbitalkampf</strong> (eine von den Türmen eines Planeten im Angriffsmodus abgeschossene Flotte oder beim Erzwingen eines verteidigten Orbits verlorene Schiffe) hinterlässt ein Feld nach derselben Regel.</p>

            <h2 id="comment">Wie man recycelt</h2>
            <ol>
                <li>Schalte die Forschung <strong>Recycler</strong> frei.</li>
                <li>Baue <strong>Recycler</strong> in deiner Raumwerft.</li>
                <li>Sende eine Flotte von Recyclern in Mission <strong>Recycling</strong> zu den Koordinaten des Trümmerfelds.</li>
                <li>Sie arbeiten in <strong>5-Minuten-Zyklen</strong>: In jedem Zyklus sammeln sie, was sie können.</li>
                <li>Sobald sie voll sind (oder das Feld leer), kehrt die Flotte automatisch zurück.</li>
            </ol>

            <h2 id="capacite">Wie viel kann ein Recycler zurückbringen?</h2>
            <p>Jeder Recycler sammelt <strong>1&nbsp;000 Ressourcen pro 5-Minuten-Zyklus</strong>, also 12&nbsp;000/Stunde. <strong>Allianzforschungen</strong> können diese Kapazität stark boosten.</p>

            <h2 id="strategie">Strategie</h2>
            <ul>
                <li>Sende nach jedem Kampf sofort Recycler: Sonst holen sich deine Gegner alles.</li>
                <li>Schütze sie: Ein isolierter Recycler ist ein leichtes Ziel.</li>
                <li>Die <strong>Urantrümmer</strong> erscheinen spontan: Das ist deine beste Uranquelle außerhalb von Kämpfen.</li>
                <li>Recycling ist sehr rentabel — denk daran wie an eine zweite Wirtschaft neben deinen Minen.</li>
            </ul>

    daily_report:
        title: "Der Tagesbericht"
        category: "economy"
        order: 7
        tags: "bericht,taeglich,bilanz,einnahmen,kosten,steuer"
        summary: "Jeden Tag um 18:59 UTC erstellt das Spiel deine Bilanz: Einnahmen, Kosten, Steuern. Genau beobachten."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Wann er fällt</h2>
            <p>Jeden Tag um <strong>18:59 UTC</strong> (19:59 mitteleuropäische Winterzeit, 20:59 im Sommer). Ein fester Termin für alle Spieler des Servers.</p>
            <p>Du erhältst einen detaillierten Bericht in deinen Nachrichten.</p>

            <h2 id="contenu">Was der Bericht enthält</h2>
            <ul>
                <li><strong>Einnahmen</strong> — was deine Arbeiter erzeugt haben.</li>
                <li><strong>Unterhaltskosten</strong> — Legionäre, Mechs, Wissenschaftler, Schiffe, Gebäude. Einheiten auf Mission kosten mehr als stationierte.</li>
                <li><strong>Friedenssteuer</strong> — wenn du mit einer Allianz, die eine Steuer gefordert hat, im Frieden bist.</li>
                <li><strong>Allianzsteuer</strong> — automatischer Beitrag zur Schatzkammer deiner Allianz (falls konfiguriert).</li>
                <li><strong>Schlussbilanz</strong> — Einnahmen − Kosten − Steuern, zu deinem Saldo hinzugefügt.</li>
            </ul>

            <h2 id="quetes">Die täglichen Quests</h2>
            <p>Der Tagesbericht <strong>erneuert deine 3 Quests</strong> des Tages. Wenn du die <strong>3 Quests vom Vortag</strong> erledigt hast, erhältst du <strong>+250 KP</strong> als Bonusbelohnung.</p>

            <h2 id="danger">Die Gefahr, auf die man achten muss</h2>
            <p>Wenn dein Saldo nach dem Bericht ins <strong>Negative</strong> fällt, ist es das <strong>wirtschaftliche Game Over</strong>: zerstörte Flotten, Saldo zurückgesetzt auf 125&nbsp;000 Bitcoins, Forschungen teilweise reduziert.</p>
            <p>Überprüfe deinen Bericht jeden Tag. Wenn deine Kosten zu stark steigen: Bremse die Rekrutierung, rufe deine Flotten auf Mission zurück oder entlasse Einheiten.</p>

    exchange:
        title: "Austausch zwischen Spielern"
        category: "economy"
        order: 8
        tags: "austausch,allianz,ressourcen,bitcoin,gabe,einzahlung"
        summary: "Wie du Ressourcen oder Bitcoins an einen Verbündeten sendest (und die Grenzen davon)."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Area Universe erlaubt es Spielern derselben <strong>Allianz</strong>, sich gegenseitig zu helfen, indem sie Ressourcen oder Bitcoins übertragen. Das ist sehr nützlich, um:</p>
            <ul>
                <li>Ein Mitglied, das gerade geplündert wurde, neu zu starten.</li>
                <li>Eine teure Forschungs- oder Bauanstrengung zu bündeln.</li>
                <li>Einen Verbündeten unter Embargo zu versorgen.</li>
            </ul>

            <h2 id="ressources">Physische Ressourcen senden</h2>
            <p>Um Niob, Wasser oder Nahrung zu senden: Lade sie in einen <strong>Frachter</strong> und schicke den Frachter in Mission <strong>Entladung</strong> zum Planeten des Empfängers. Die Ressourcen werden bei Ankunft automatisch abgeladen, der Frachter kehrt von allein zurück.</p>

            <h2 id="bitcoins">Bitcoins senden</h2>
            <p>Bitcoins werden über die <strong>Allianz-Schatzkammer</strong> übertragen (siehe eigener Artikel). Du zahlst in die Schatzkammer ein, und die Offiziere können verteilen oder an einen Spieler auszahlen.</p>

            <h2 id="limites">Die Grenzen</h2>
            <ul>
                <li>Man kann <strong>kein Uran frei übertragen</strong> (strategische Ressource).</li>
                <li>Der Austausch geht immer über eine Flotte: Es braucht Zeit und Treibstoff.</li>
                <li>Ein Planet unter <strong>Embargo</strong> kann nur von dir selbst oder einem Verbündeten empfangen, nicht von einem Fremden.</li>
                <li>Man kann keine Ressourcen an einen Feind oder Spieler außerhalb der Allianz senden (außer über die Schatzkammer, je nach Regeln).</li>
            </ul>

    fleet_creation:
        title: "Eine Flotte erstellen und senden"
        category: "fleet"
        order: 1
        tags: "flotte,erstellung,schiffe,zusammensetzung,werft,mission"
        summary: "Von der Schiffsfertigung bis zur Ankunft am Ziel: Die komplette Reise."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Was du brauchst</h2>
            <ul>
                <li>Eine <strong>Raumwerft</strong> auf deinem aktiven Planeten.</li>
                <li>Die nötigen Ressourcen (Niob und Wasser).</li>
                <li>Die erforderlichen Forschungen für das gewünschte Schiff (z.&nbsp;B. <em>Utility</em> für Frachter).</li>
            </ul>

            <h2 id="fabriquer">Schritt 1 — Die Schiffe bauen</h2>
            <p>Wähle auf der Seite <strong>Raum</strong> ein Modell und eine Menge. Die Produktion dauert und läuft im Hintergrund.</p>

            <h2 id="composer">Schritt 2 — Die Flotte zusammenstellen</h2>
            <p>Sobald die Schiffe geliefert sind, gehe auf die Seite <strong>Flotten</strong>. Du kannst:</p>
            <ul>
                <li>Auswählen, welche Schiffe mitfahren.</li>
                <li><strong>Ressourcen</strong> laden (für einen Transport).</li>
                <li><strong>Legionäre</strong> einschiffen (für Raid/Invasion, mit Landungsschiffen).</li>
            </ul>

            <h2 id="envoyer">Schritt 3 — Die Flotte senden</h2>
            <ol>
                <li>Wähle das <strong>Ziel</strong>. Du kannst es im Format <code>Galaxie:Sektor:Position</code> eingeben oder von der Karte klicken.</li>
                <li>Wähle einen <strong>Missionstyp</strong> (Normal, Entladung, Recycling, Raid, Invasion…).</li>
                <li>Überprüfe die Treibstoffkosten (Wasser) und die Flugdauer.</li>
                <li>Bestätige.</li>
            </ol>
            <p>Die Flotte erscheint in deiner Liste der Flotten im Flug. Du kannst sie bei Bedarf vor der Ankunft <strong>zurückrufen</strong>.</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li>Denk daran, einen <strong>Recycler</strong> zu deinen Angriffsflotten hinzuzufügen, um die Trümmer sofort zu bergen.</li>
                <li>Sende nie deine ganze Verteidigung auf einmal: Behalte genug, um deinen Planeten zu halten.</li>
                <li>Die Rückkehr einer Flotte nach einer Mission kostet keinen zusätzlichen Treibstoff (bereits veranschlagt).</li>
            </ul>

    ship_types:
        title: "Schiffstypen"
        category: "fleet"
        order: 2
        tags: "schiffe,jaeger,korvette,fregatte,schlachtschiff,kreuzer,zerstoerer,frachter,sonde"
        summary: "Alle Schiffe des Spiels: Utility, leicht, schwer, speziell — und wie man sie einsetzt."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Utility-Schiffe</h2>
            <p>Sie kämpfen nicht. Sie dienen zum Transport, Erkunden, Recyceln, Besiedeln.</p>
            <table>
                <tr><th>Schiff</th><th>Rolle</th><th>Kapazität</th></tr>
                <tr><td>Sonde</td><td>Einen Planeten ausspionieren.</td><td>—</td></tr>
                <tr><td>Frachter I</td><td>Leichter Transport.</td><td>3&nbsp;000</td></tr>
                <tr><td>Frachter V</td><td>Mittlerer Transport.</td><td>10&nbsp;000</td></tr>
                <tr><td>Frachter X</td><td>Großer Transport.</td><td>25&nbsp;000</td></tr>
                <tr><td>Karavelle</td><td>Premium-Frachter: der größte und schnellste aller Frachter. Bezahlt mit Kriegspunkten (25) + 15&nbsp;Arbeitern pro produzierter Einheit.</td><td>40&nbsp;000</td></tr>
                <tr><td>Kolonisator</td><td>Einen neuen Planeten gründen.</td><td>—</td></tr>
                <tr><td>Recycler</td><td>Kampftrümmer sammeln.</td><td>1&nbsp;000 pro 5-Min-Zyklus</td></tr>
                <tr><td>Landungsschiff</td><td>Legionäre für Raid oder Invasion transportieren.</td><td>1&nbsp;000 Legionäre</td></tr>
                <tr><td>Moon Maker</td><td>Einen Mond auf einem leeren Platz mit genügend Trümmern erschaffen (min. 2M Niob und 2M Wasser).</td><td>—</td></tr>
                <tr><td>Radar (Schiff)</td><td>Deine Erkennung in einem Sektor ausweiten.</td><td>—</td></tr>
                <tr><td>Jammer (Schiff)</td><td>Feindliche Erkennung stören.</td><td>—</td></tr>
                <tr><td>Mothership</td><td>Prestige-Flaggschiff. Bremst die Flotte.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Kampfschiffe</h2>
            <p>Sie sind in <strong>Klassen</strong> unterteilt (vom leichtesten zum schwersten). Jede Klasse hat ihre Stärken und Schwächen; ein ausgewogener Kampf mischt die Klassen.</p>
            <table>
                <tr><th>Klasse</th><th>Beispiele</th><th>Profil</th></tr>
                <tr><td>Leicht</td><td>Jäger, Schwerer Jäger, Kriegsjäger</td><td>Schnell, billig, zahlreich. Gut gegen Korvetten.</td></tr>
                <tr><td>Mittel</td><td>Korvette, Laserkorvette, Kriegskorvette</td><td>Ausgewogen. Gut gegen Jäger und Fregatten.</td></tr>
                <tr><td>Schwer</td><td>Fregatte, Plasmafregatte</td><td>Hoher Schaden auf große Reichweite.</td></tr>
                <tr><td>Sehr schwer</td><td>Schlachtschiff</td><td>Widerstandsfähig, solider Schaden.</td></tr>
                <tr><td>Kapital</td><td>Kreuzer, Gepanzerter, Zerstörer</td><td>Kolossal, sehr teuer, verheerend. Herz deiner Flotte.</td></tr>
            </table>

            <h2 id="factions">Die Kampffraktionen</h2>
            <p>Manche Schiffe gehören einer <strong>Fraktion</strong> an: <em>Rakete</em>, <em>Laser</em> oder <em>Plasma</em>. Die Fraktionen kontern sich (Stein-Schere-Papier), mit einem Bonus von +20&nbsp;% Kraft gegen ihr Zielfraktion.</p>

            <h2 id="bonus-cargo">Transportkapazität</h2>
            <p>Die Kapazität der Frachter erhöht sich mit den <strong>Allianzforschungen</strong>, die auf den Frachter ausgerichtet sind. Nützlich, wenn du auf große Entfernungen spielst.</p>

    ship_customization:
        title: "Deine Schiffe anpassen"
        category: "fleet"
        order: 3
        tags: "anpassung,schiffe,punkte,panzerung,praezision,waffen"
        summary: "40 Gratispunkte jeden Tag, um Panzerung, Präzision und Waffen deiner Schiffe zu boosten."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Jedes Schiffsmodell hat drei Eigenschaften, die du weiterentwickeln kannst:</p>
            <ul>
                <li><strong>Panzerung</strong> — wie viel es einstecken kann.</li>
                <li><strong>Präzision</strong> — hebt das schlechtestmögliche Ergebnis jeder Salve an (kein Schuss geht je fehl, aber ein schlecht gezielter richtet weniger Schaden an).</li>
                <li><strong>Waffen</strong> — zugefügter Schaden.</li>
            </ul>
            <p>Jeden Tag schenkt dir das Spiel <strong>40 Punkte zur freien Verteilung</strong>, für all deine Schiffe. Es ist gratis, vergiss es nicht.</p>

            <h2 id="utiliser">Wie man sie nutzt</h2>
            <p>Gehe auf die Seite <strong>Anpassung</strong> (Menü Raum). Passe für jedes Modell die Regler an. Deine Wahl gilt für <strong>alle Schiffe dieses Modells</strong> (aktuelle und zukünftige). Diese drei Werte entwickeln sich unabhängig voneinander: Punkte in Panzerung oder Waffen eines Modells zu stecken senkt nie seine Präzision.</p>

            <h2 id="lesen">Ihre Zielgenauigkeit auf dem Bildschirm lesen</h2>
            <p>Der Reiter <strong>Statistiken</strong> der Raumwerft zeigt Modell für Modell, wie viel Zielgenauigkeit Sie auf das Guthaben dieses Modells investiert haben (zum Beispiel <code>676 / 676</code> für einen Zerstörer), und den daraus folgenden <strong>Schadensmultiplikator</strong>&nbsp;: <strong>×0,94</strong> bei voller Zielgenauigkeit, <strong>×0,66</strong> ohne einen einzigen investierten Punkt.</p>
            <p>Das ist keine Trefferquote&nbsp;: <strong>kein Schuss geht jemals daneben</strong>. Bessere Zielgenauigkeit hebt die Untergrenze Ihres Schadens, nie seine Obergrenze. Es ist dieselbe Zahl wie auf Ihrer Flottenverwaltungsseite, im Reiter Verteidigung und in Ihren Kampfberichten — die vier Anzeigen lassen sich endlich direkt vergleichen. Zum Vergleich&nbsp;: Die Verteidigung eines Planeten feuert mit <strong>×1,06</strong>, also besser als eine Flotte bei voller Zielgenauigkeit.</p>

            <h2 id="reset">Zurücksetzungen</h2>
            <p>Du kannst deine Punkte <strong>einmal alle 96 Stunden</strong> zurücksetzen, ohne Obergrenze: Wenn sich deine Strategie ändert oder das Kampfsystem weiterentwickelt wird, holst du alle ausgegebenen Punkte zurück, um sie neu zu verteilen. Nach einem Zurücksetzen bleibt der Button ausgegraut und ein Countdown zeigt die verbleibende Zeit bis zum nächsten an.</p>

            <h2 id="modes-speciaux">Servermodi mit maximalen Forschungen</h2>
            <p>In einigen Modi (Battle Royale, Domination, Search &amp; Destroy) <strong>sind alle deine Punkte ab dem ersten Tag freigeschaltet</strong> (1&nbsp;375 Punkte sofort verfügbar statt 40/Tag).</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li>Verteile deine Punkte nicht auf zu viele Modelle: Konzentriere dich auf die, die du wirklich in Masse einsetzt.</li>
                <li><strong>Recycler</strong> und <strong>Frachter</strong> profitieren davon, etwas Panzerung zu bekommen, um Hinterhalte zu überleben.</li>
                <li><strong>Jäger</strong> profitieren mehr von Präzision und Waffen als von Panzerung (sie sterben schnell).</li>
            </ul>

    fleet_missions:
        title: "Missionstypen"
        category: "fleet"
        order: 4
        tags: "mission,angriff,transport,besiedlung,recycling,spionage,nuklear,raid,invasion"
        summary: "Jede Mission gibt deiner Flotte einen anderen Befehl. Hier, wie du die richtige wählst."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Wenn du eine Flotte schickst, gibst du ihr einen <strong>Missionstyp</strong>. Diese Mission bestimmt, was bei der Ankunft passiert. Manche Typen verlangen spezifische Schiffe.</p>

            <h2 id="missions">Die verfügbaren Typen</h2>
            <table>
                <tr><th>Mission</th><th>Was sie bewirkt</th><th>Erforderliche Schiffe</th></tr>
                <tr><td><strong>Normal</strong> (Angriff)</td><td>Die Flotte begibt sich zum Zielpunkt. Ist der Feind da, automatischer Kampf.</td><td>Beliebige Schiffe</td></tr>
                <tr><td><strong>Entladung</strong></td><td>Lädt Ressourcen auf einem verbündeten Planeten oder bei einem Händler ab, dann Rückkehr.</td><td>Mindestens ein Frachter</td></tr>
                <tr><td><strong>Besiedlung</strong></td><td>Gründet einen neuen Planeten auf einem leeren Platz.</td><td>Ein Kolonisator</td></tr>
                <tr><td><strong>Raid (Plünderung)</strong></td><td>Bekämpft die Bodenverteidigung, um Ressourcen zu stehlen, ohne den Planeten einzunehmen.</td><td>Landungsschiffe + Legionäre</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Bekämpft die Bodenverteidigung, um den Planeten <strong>dem Gegner abzunehmen</strong>.</td><td>Landungsschiffe + Legionäre</td></tr>
                <tr><td><strong>Spionage</strong></td><td>Sendet eine Sonde, um einen Bericht über die feindlichen Verteidigungen zu erhalten.</td><td>Mindestens eine Sonde</td></tr>
                <tr><td><strong>Mond</strong></td><td>Erschafft einen Mond auf einem leeren Platz mit genügend Trümmern (min. 2M Niob und 2M Wasser).</td><td>Ein Moon Maker</td></tr>
                <tr><td><strong>Radar</strong></td><td>Setzt einen Radarsatelliten vor Ort ab (erweiterte Erkennung).</td><td>Ein Radar-Schiff</td></tr>
                <tr><td><strong>Störsender</strong></td><td>Setzt einen Störsender-Satelliten ab (versteckt deine Bewegungen).</td><td>Ein Jammer-Schiff</td></tr>
                <tr><td><strong>Landen</strong></td><td>Überträgt die Schiffe direkt in die Garnison eines deiner Planeten.</td><td>Eigener Planet</td></tr>
                <tr><td><strong>Nuklear</strong></td><td>Wirft eine Atombombe auf den Zielplaneten ab.</td><td>Eingelagerte Atombombe</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Sammelt die Trümmer eines Schlachtfelds ein.</td><td>Mindestens ein Recycler</td></tr>
            </table>

            <h2 id="choisir">Wie man die richtige Mission wählt</h2>
            <ul>
                <li>Du willst <strong>Bitcoins</strong>? → Entladung bei einem Händler.</li>
                <li>Du willst <strong>Informationen</strong>? → Spionage.</li>
                <li>Du willst einen Feind <strong>schwächen</strong>? → Raid (Plünderung).</li>
                <li>Du willst seinen Planeten <strong>einnehmen</strong>? → Invasion.</li>
                <li>Du willst <strong>Trümmer bergen</strong>? → Recycling.</li>
            </ul>

    fleet_movement:
        title: "Bewegung und Entfernung"
        category: "fleet"
        order: 5
        tags: "bewegung,entfernung,geschwindigkeit,reise,treibstoff,koordinaten"
        summary: "Wie die Flugdauer berechnet wird, der verbrauchte Treibstoff und was deine Flotte verlangsamt."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">Die Koordinaten, wie sie funktionieren</h2>
            <p>Jede Position im Universum wird im Format <strong>Galaxie:Sektor:Position</strong> geschrieben. Beispiel: <code>1:5:12</code> = Galaxie 1, Sektor 5, Position 12.</p>
            <ul>
                <li>Eine <strong>Galaxie</strong> enthält mehrere Sektoren (10×10-Gitter).</li>
                <li>Ein <strong>Sektor</strong> enthält 25 Positionen (5×5-Gitter).</li>
            </ul>

            <h2 id="distance">Wie die Entfernung berechnet wird</h2>
            <ul>
                <li><strong>Gleicher Sektor</strong> — kurze Entfernung, schnelle Reise.</li>
                <li><strong>Gleiche Galaxie, anderer Sektor</strong> — mittlere Entfernung.</li>
                <li><strong>Andere Galaxie</strong> — lange, feste Entfernung. Erfordert die Forschung <strong>Hyperraum</strong>.</li>
            </ul>
            <p>Die Oberfläche zeigt immer die geschätzte Entfernung und Dauer an, bevor du den Versand bestätigst.</p>

            <h2 id="duree">Die Flugdauer</h2>
            <p>Sie hängt ab von:</p>
            <ul>
                <li>der <strong>Entfernung</strong>;</li>
                <li>der <strong>Geschwindigkeit des langsamsten Schiffs</strong> deiner Flotte (eine Flotte fliegt in der Geschwindigkeit des Langsamsten);</li>
                <li>der <strong>Servergeschwindigkeit</strong> (manche Server sind beschleunigt).</li>
            </ul>
            <p>Das <strong>Mothership</strong> ist prestigeträchtig, aber <strong>bremst die Flotte um 10&nbsp;%</strong>. Zu bedenken. Es <strong>senkt außerdem die Radarsignatur der Flotte um 10&nbsp;%</strong> (Tarnung) — die Imperiumsübersicht zeigt dagegen die tatsächliche Gesamtzahl Ihrer Schiffe.</p>

            <h2 id="carburant">Der Treibstoff</h2>
            <p>Der Treibstoff ist <strong>Wasser</strong>. Je <strong>größer</strong> deine Flotte (Gesamtmasse), desto mehr verbraucht sie. Je <strong>länger</strong> die Strecke, desto mehr verbraucht sie.</p>
            <p>Eine Mission <strong>Entladung</strong> verbraucht das Doppelte (der Frachter fliegt schwer hin und schwer zurück).</p>
            <p>Der geschätzte Treibstoff wird vor dem Starten der Flotte angezeigt: Überprüfe, ob du genug Wasser auf Lager hast.</p>

            <h2 id="rappel">Eine Flotte im Flug zurückrufen</h2>
            <p>Du kannst eine Flotte <strong>zurückrufen</strong>, solange sie nicht angekommen ist. Sie macht kehrt und kommt nach Hause. Typischer Fall: Ein Verbündeter greift vor dir an, brich deine Offensive ab.</p>

            <h2 id="night-slowdown">🌙 Nacht-Verlangsamung</h2>
            <p>Eine Angriffsflotte (Kampfschiffe oder Bodentruppen), die auf den Planeten eines Feindes zufliegt, braucht <strong>×10 länger</strong>, wenn sie im <strong>Nachtzeitfenster des Verteidigers</strong> (23:00–06:00 Uhr seiner Zeitzone) ankommt. Die angezeigte Dauer enthält diesen Multiplikator bereits.</p>
            <p>Ein 🌙 Symbol auf der Karte zeigt Spieler an, die sich aktuell in ihrem Nachtfenster befinden. Beim Senden erscheint ein Bestätigungsdialog, wenn die Ankunft in der Nacht des Gegners fällt. Die Zeitzone wird automatisch erkannt und kann maximal einmal pro Monat geändert werden.</p>

    fleet_management:
        title: "Erweiterte Flottenverwaltung"
        category: "fleet"
        order: 6
        tags: "verwaltung,flotte,teilen,verschmelzen,uebertragen,gruppieren"
        summary: "Teilen, gruppieren, landen: Die fortgeschrittenen Manipulationen, um deine Bewegungen zu optimieren."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Die verfügbaren Operationen</h2>
            <ul>
                <li><strong>Teilen</strong> — einen Teil der Schiffe in eine neue Flotte abtrennen.</li>
                <li><strong>Gruppieren</strong> — mehrere deiner Flotten am selben Ort verschmelzen.</li>
                <li><strong>Landen</strong> — die Schiffe einer Flotte in die Garnison eines Planeten überführen. Abgeladene Truppen und Fracht müssen in die Kapazitäten des Planeten passen; eine Flotte ohne Truppen und Fracht landet immer, auch auf einem bereits vollen Planeten.</li>
                <li><strong>Zurückrufen</strong> — eine Flotte im Flug kehrtmachen lassen.</li>
                <li><strong>Zum Hafen übertragen</strong> — eine Flotte auf einem Planeten "parken", ohne zu verschmelzen.</li>
            </ul>

            <h2 id="en-vol">Was man nicht tun kann</h2>
            <ul>
                <li>Die Zusammensetzung einer Flotte <strong>im Flug</strong> ändern (Ladung, Schiffe).</li>
                <li>Die Mission einer Flotte im Flug ändern (außer zurückrufen).</li>
                <li>Eine Flotte teleportieren (keine Zauberabkürzung!).</li>
            </ul>

            <h2 id="astuces">Anwendungsfälle</h2>
            <ul>
                <li><strong>Vor einem Kampf teilen</strong>: Behalte einen Teil deiner Flotte in Reserve, schicke eine Vorhut.</li>
                <li><strong>Nach einem Raid gruppieren</strong>: Mehrere Rückkehrer verschmelzen, um Übersichtlichkeit zu gewinnen.</li>
                <li><strong>Landen</strong>: Eine Flotte in die Orbitalverteidigung eines Planeten zurückversetzen.</li>
            </ul>

    espionage:
        title: "Spionage und Sonden"
        category: "fleet"
        order: 7
        tags: "spionage,sonde,spion,erkennung,information,aufklaerung"
        summary: "Wissen, was der Gegner hat, bevor du zuschlägst: Das Senden von Sonden erklärt."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Eine Sonde senden</h2>
            <ol>
                <li>Baue <strong>Sonden</strong> in deiner Raumwerft (durch die Utility-Forschung freigeschaltet).</li>
                <li>Gehe auf die Flotten-Seite, füge mindestens 1 Sonde hinzu.</li>
                <li>Wähle die Mission <strong>Spionage</strong>, bestimme das Ziel.</li>
                <li>Sende — die Sonde schießt mit voller Geschwindigkeit los.</li>
            </ol>
            <p>Bei Ankunft scannt sie den Planeten und schickt dir einen Bericht zurück.</p>

            <h2 id="reussite">Was bestimmt den Erfolg?</h2>
            <p>Ein stilles Duell stellt deinen <strong>Spionagelevel</strong> gegen den des Verteidigers:</p>
            <ul>
                <li>Wenn dein Level <strong>höher oder gleich</strong> ist, ist der Bericht detailliert.</li>
                <li>Wenn dein Level niedriger ist, erhältst du entweder Teilinfos oder gar nichts.</li>
            </ul>
            <p>Um deine Spionage zu steigern: Forschung <strong>Welle</strong> Stufe 5, dann Forschung <strong>Spionage</strong>.</p>

            <h2 id="rapport">Was ein erfolgreicher Bericht enthüllt</h2>
            <ul>
                <li>Die auf dem Planeten vorhandenen <strong>Ressourcen</strong>.</li>
                <li>Die Liste der <strong>Gebäude</strong> und ihre Level.</li>
                <li>Die <strong>Flotten</strong> im Orbit.</li>
                <li>Die <strong>Boden- und Orbitalverteidigungen</strong>.</li>
                <li>Die <strong>Legionäre, Mechs, Arbeiter</strong>.</li>
            </ul>
            <p>Genau das, was man braucht, um zu entscheiden: Raid, Invasion oder Rückzug.</p>

            <h2 id="detection">Kann man entdeckt werden?</h2>
            <p>Ja. Wenn der Verteidiger ein ausreichend gutes <strong>Radar</strong> hat, erhält er eine Spionagewarnung (ohne unbedingt zu wissen, was gesehen wurde).</p>
            <p>Umgekehrt kann ein mit einem <strong>Jammer</strong> ausgestatteter Planet deine Sonde stören oder unzuverlässig machen.</p>

    spatial_combat:
        title: "Weltraumkampf"
        category: "combat"
        order: 1
        tags: "kampf,weltraum,flotte,schlacht,block,runde,schild,praezision,verluste,schaden,schirm,jaeger"
        summary: "Der komplette Ablauf einer Flottenschlacht: Stärke der Seiten, Schild-Duell, Feuerrunden, Kampfende und die genaue Berechnung Ihrer Verluste."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="ausloesung">Wann ein Kampf beginnt</h2>
            <p>Sobald eine mit <strong>[Angriff]</strong> markierte Flotte ihre Position (Galaxie:Sektor:Position) mit einer feindlichen Flotte teilt, beginnt der Kampf automatisch. Ihre eigenen Flotten am selben Ort verschmelzen zuerst zu einer einzigen Armada.</p>
            <p>Alle anwesenden Flotten werden nach der Diplomatie in <strong>zwei Seiten</strong> aufgeteilt: Ihre Allianz und ihre Pakte auf der einen, der Feind und seine Unterstützer auf der anderen. Eine Seite ohne eine einzige Waffe (Frachter, Recycler, Sonden) kämpft nicht: Sie wird zerstört, und der Bericht vermerkt es.</p>
            <p><strong>Allianzen im Krieg, niemand bewaffnet</strong> — zwei Flotten von Allianzen im Krieg lösen nur dann einen Kampf aus, wenn mindestens eine von ihnen Schiffswaffen trägt. Zwei völlig unbewaffnete Flotten (Frachter, Sonden, Recycler), die sich kreuzen, kämpfen schlicht nicht: Deine Flotten werden nicht blockiert, und niemand wird umsonst benachrichtigt.</p>
            <p><strong>Sonderfall Raids und Invasionen</strong> — wird diese Schlacht durch einen Raid oder eine Invasion gegen einen bewachten Planeten ausgelöst (siehe die Artikel <em>Planeteninvasion</em> und <em>Raids (Plünderung)</em>), setzt genau dieses Auslösen die <strong>[Angriff]</strong>-Markierung auf Ihre angreifende Flotte. Sie wird danach nie entfernt: Eine überlebende Raid- oder Invasionsflotte bleibt also als feindlich markiert — Geschütztürme im Angriffsmodus können sie später angreifen, und sie wird bei der nächsten Weltraumkampf-Erkennung erneut erfasst, sobald sie auf einen Feind trifft.</p>

            <h2 id="staerke">Die Stärke einer Seite</h2>
            <p>Der Kampf stellt die <strong>Summen</strong> beider Seiten gegenüber: Das Spiel addiert Panzerung, Schild, Raketen, Laser und Plasma aller beteiligten Schiffe.</p>
            <ul>
                <li><strong>Verteidiger zu Hause</strong> — die Geschütze und die Panzerung der Planetenverteidigung treten seiner Seite bei; der planetare Schild bringt +50.000 Panzerung, der Große Schild +600.000. Eine bewaffnete Flotte eines Allianzkameraden auf Ihrem Planeten profitiert ebenfalls.</li>
                <li><strong>Präzision</strong> — Durchschnitt der Flottenpräzisionen der Seite (aufgebaut über die Schiffsanpassung).</li>
                <li><strong>Allianzpolitik</strong> — jedes Regime schlägt seinen Rivalen: Demokratie schlägt Kommunismus, dieser schlägt Faschismus, dieser schlägt Demokratie. Schlägt die Politik des <strong>Angreifers</strong> die des Verteidigers, erhalten alle seine Waffen +20&nbsp;%.</li>
                <li><strong>Allianzverbesserungen</strong> — bis zu +5&nbsp;% je Waffentyp, Panzerung und Schild, bis zu +10&nbsp;% für die Planetenverteidigung.</li>
                <li><strong>Helden</strong> — Boni auf Angriff, Verteidigung, Schild und Präzision je nach Fähigkeiten und Gegenständen. Ein Held mit <strong>Einschüchterung</strong> schwächt die gegnerischen Waffen; ein <strong>Taktiker</strong> verstärkt die erste Salve seiner Seite.</li>
            </ul>

            <h2 id="planetenverteidigung">Ihre Geschütze kämpfen in derselben Schlacht</h2>
            <p>Sobald sich die Verteidigung Ihres Planeten einer Seite anschließt, <strong>ist</strong> dieser Kampf nun der gesamte Kampf Ihres Planeten: Es gibt danach keinen separaten Orbitalkampf mehr für Ihre Geschütze. Sie zielen mit ihrer eigenen Präzision (eine ungenaue Eskorte neben ihnen zieht ihr Feuer nicht mehr herunter), und sie erleiden dabei <strong>echte Verluste</strong>: proportional zum Schaden, den Ihre Seite einsteckt, wenn sie gewinnt, <strong>vollständig</strong> — Geschütztürme, Schilde, Raumbasis, Angriffsmodus abgeschaltet — wenn Ihre Seite unterliegt. Das gilt unabhängig davon, ob der Angriffsmodus des Planeten aktiv ist: Sobald sie feuern, können sie jetzt zerstört werden. Ein Planet, der von einer Ihrer Flotten oder einer <strong>bewaffneten</strong> Flotte eines Allianzkameraden bewacht wird, kann daher nicht mehr geplündert oder invadiert werden, ohne dass vorher eine Schlacht entscheidet.</p>

            <h2 id="schilde">Das Schild-Duell</h2>
            <p>Jede Salve trifft zuerst auf den gegnerischen Schild. Ihre <strong>Durchschlagskraft</strong> beträgt:</p>
            <p><code>Raketen ÷ 7 + Plasma × 4 + Laser × 2</code></p>
            <p>Plasma glänzt gegen Schilde, Raketen richten dort wenig aus — und dieser Vorteil gilt jetzt bei jeder Kampfgröße, zehn gegen zehn genauso wie hundert Millionen gegen hundert Millionen. Bei jeder Salve wird der Schaden, der die Durchschlagskraft übersteigt, vom gegnerischen Schild absorbiert, bis dessen Ladung aufgebraucht ist; der Rest — und alles, was nach einem leeren Schild überläuft — trifft direkt die Hülle. Ein Schild kann daher nie eine ganze Salve blocken: Gegen einen bewaffneten Gegner steckt Ihre Hülle immer etwas ein, schon ab der ersten Runde.</p>
            <p>Der Schild einer Flotte ist keine Reserve mehr, die vor jedem Kampf automatisch auf 100&nbsp;% zurückspringt: Es ist eine <strong>dauerhafte Ladung</strong>, die sich im Kampf abnutzt und nur alle 3 Stunden um 10&nbsp;% steigt (30 Stunden von leer bis voll) — selbst wenn Sie die Flotte teilen, verschmelzen oder auflösen oder Schiffe zwischen der Flotte und dem Boden des Planeten verschieben. Der Kampfbericht zeigt diese Ladung zu Beginn und am Ende der Schlacht; die Flottenliste zeigt den Prozentsatz jeder Flotte, und die Flottenverwaltungsseite zeigt den tatsächlich in den Kampf mitgeführten Schild, die Gesamtkapazität, den aktuellen Prozentsatz sowie die verbleibende Zeit bis zur vollen Ladung. Auch der Schiffsbestand am Boden trägt eine Ladung, die sich nicht wieder auflädt: Jede vom Boden aus erstellte oder verstärkte Flotte übernimmt sie, und sie wird im Fenster zur Flottenerstellung wie im Reiter „Schiffe“ der Flottenverwaltung angezeigt. Eine Ausnahme: Der Pauschalschild eines <strong>Motherships</strong> entlädt sich nie — sein Generator hält dauerhaft, und die Ladung nutzt nur den Schild Ihrer übrigen Schiffe ab — deshalb zeigt die Verwaltungsseite auch den absoluten Wert des Schilds, nicht nur den Prozentsatz.</p>

            <h2 id="runden">Die Feuerrunden</h2>
            <p>Ein Kampf dauert höchstens <strong>100 Runden</strong>. In jeder Runde richtet eine Salve an:</p>
            <p><code>(Raketen + Plasma ÷ 2 + Laser × 2) × Multiplikator</code></p>
            <p>Der Multiplikator stammt aus einem Präzisionswurf: Das Spiel zieht eine Zahl zwischen Ihrer Präzision und 100 und teilt sie durch 80 — Ergebnis zwischen <strong>×0,3 und ×1,2</strong>. Hohe Präzision macht Ihre Salven nicht stärker, sie beseitigt die schlechten Würfe. Was den gegnerischen Schild durchdringt (siehe oben), wird von dessen Gesamtpanzerung abgezogen.</p>

            <h2 id="ende">Kampfende</h2>
            <ul>
                <li><strong>Die Panzerung einer Seite fällt auf 0</strong> — sie ist besiegt; alle ihre Flotten werden mitsamt Fracht zerstört.</li>
                <li><strong>100 Runden erreicht</strong> — die Seite mit der meisten verbleibenden Panzerung gewinnt; bei perfektem Gleichstand gewinnt der Angreifer.</li>
                <li><strong>Sicherheitsnetz des Siegers</strong> — selbst schwer angeschlagen verliert die siegreiche Seite nie mehr als 95&nbsp;% ihrer Ausgangspanzerung: Ein Sieg ist nie eine Vernichtung, egal wie groß das Kräfteungleichgewicht.</li>
            </ul>

            <h2 id="verluste">Ihre Verluste: was Sie wirklich einstecken</h2>
            <p>Die Regel passt in einen Satz: <strong>Ihre Verluste ergeben sich aus dem Hüllenschaden, den Sie tatsächlich einstecken</strong> — nie aus dem, was Ihr Schild absorbiert hat, das kostet kein einziges Schiff. Dieser Hüllenschaden verteilt sich auf Ihren <strong>Schirm</strong> (Jäger, Schwere Jäger, Kriegsjäger: die einzigen Schiffe ohne Schild) und Ihre <strong>Linie</strong> (alle anderen Typen), im Verhältnis zur Panzerung jeder Gruppe: Jeder Typ verliert denselben Anteil seiner selbst. Der Bericht zeigt zwei Zähler: Hüllenschaden und Schildschaden.</p>
            <p>Ihr Schirm schützt die Linie nicht auf ewig: Er lenkt höchstens die <strong>Hälfte</strong> des für die Linie bestimmten Schadens auf sich um, und nur solange er selbst noch Panzerung zum Einstecken hat — ein einzelner Jäger kann nicht den Schaden einer ganzen Flotte auffangen. Ganz ohne Schirm trägt die Linie den vollen Hüllenschaden.</p>
            <p>Direkte Folgen: Trifft Sie der Feind kaum, sind Ihre Verluste nahezu null; ein zehnmal gefährlicherer Feind kostet Sie rund zehnmal mehr — Jäger eingeschlossen. Die besiegte Seite verliert alles.</p>

            <h2 id="danach">Nach dem Kampf</h2>
            <ul>
                <li><strong>Trümmer</strong> — 40&nbsp;% der Baukosten (Niob und Wasser) jedes zerstörten Schiffs beider Seiten fallen in den Orbit (20&nbsp;%, wenn ein Cthulhu oder Alien beteiligt ist). Die Fracht vernichteter Flotten kommt hinzu. Ein Recycler in der Siegerflotte sammelt sofort.</li>
                <li><strong>Kriegspunkte</strong> — beide Seiten erhalten welche, proportional zur zerstörten feindlichen Stärke; der Sieger bekommt deutlich mehr, und der Trostpreis des Besiegten liegt nie über einem Fünftel dessen, was der Sieger für dieselbe Flotte erhalten hätte.</li>
                <li><strong>Helden</strong> — ein Hauptheld an Bord einer zerstörten Flotte kann vom Sieger gefangen genommen werden (eine Chance, nie garantiert). Ein besiegter <strong>Nebenheld</strong> folgt einer anderen, endgültigen Regel ohne Zufall: siehe den Artikel <em>Nebenhelden</em>.</li>
                <li><strong>Berichte</strong> — jeder Kommandant erhält die Details: Kräfte, Salven, erlittener Schaden, Verluste, sowie das Schicksal jedes gefangenen oder hingerichteten Nebenhelden.</li>
            </ul>

            <h2 id="tipps">Tipps</h2>
            <ul>
                <li>Halten Sie immer einen <strong>Jägerschirm</strong>: billig, fängt er den Hüllenschaden anstelle Ihrer schweren Schiffe ab.</li>
                <li>Investieren Sie in den <strong>Schild</strong>: Je mehr Ladung er hat, desto mehr Schaden absorbiert er, bevor er Ihre Hülle erreicht — aber kein Schild stoppt eine ganze Salve, Ihre Hülle steckt immer einen Teil davon ein.</li>
                <li>Bauen Sie <strong>Plasma</strong>, um feindliche Schilde schnell zu knacken, <strong>Laser</strong> für Hüllenschaden.</li>
                <li>Wählen Sie die <strong>Allianzpolitik</strong> mit Blick auf Ihre Lieblingsziele: +20&nbsp;% Waffen im Angriff nimmt man mit.</li>
            </ul>

    invasion:
        title: "Planeteninvasion"
        category: "combat"
        order: 2
        tags: "invasion,planet,soldaten,panzer,landungsschiffe,eroberung,einsatz,taktik"
        summary: "Einen feindlichen Planeten erobern: Landungsschiffe, Anlandung, Bodenkampf und taktische Einsätze."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Die Invasion ist ein Angriff, um einen feindlichen Planeten <strong>in Besitz zu nehmen</strong>. Deine Flotte landet Legionäre (über Landungsschiffe) an, die die Garnison am Boden konfrontieren.</p>
            <p>Das ist anders als ein <strong>Raid</strong> (der plündert, ohne den Planeten einzunehmen): Eine erfolgreiche Invasion gibt dir den ganzen Planeten.</p>

            <h2 id="conditions">Was man zum Einfallen braucht</h2>
            <ul>
                <li>In einer <strong>Allianz</strong> sein.</li>
                <li>Auf einem Server im <strong>PvP-Modus</strong> spielen (z.&nbsp;B.: Domination, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li><strong>Landungsschiffe</strong> und <strong>Legionäre</strong> an Bord der Flotte haben.</li>
                <li>Das Ziel muss ein bewohnter Planet sein (kein Händler, kein Verbündeter, niemand, mit dem du im Frieden oder Pakt bist).</li>
                <li>Am selben Ort ist noch kein Raumkampf geplant.</li>
            </ul>

            <h2 id="barges">Die Rolle der Landungsschiffe</h2>
            <p>Die Landungsschiffe sind die Fahrzeuge, die deine Legionäre am Boden ausladen. Jedes Landungsschiff transportiert <strong>1&nbsp;000 Legionäre</strong> (Kapazität erhöht durch Allianzforschungen).</p>
            <p>Wenn du mehr Legionäre als Plätze hast, bleiben die Überzähligen <strong>im Orbit und kämpfen nicht</strong>. Bei Misserfolg werden deine Landungsschiffe <strong>vom Verteidiger erbeutet</strong>.</p>

            <h2 id="orbital">Phase 1 — Kampf im Orbit (manchmal)</h2>
            <p>Zwei Situationen können dich stoppen, bevor du überhaupt landest:</p>
            <ul>
                <li>Der Zielplanet hat seinen <strong>Angriffsmodus</strong> aktiviert: seine Geschütztürme und Schilde greifen deine Flotte zuerst an. Wenn <strong>du verlierst</strong>, wird deine Flotte zerstört — die Invasion endet sofort. Wenn <strong>du gewinnst</strong>, werden die Orbitalverteidigungen vernichtet und deine Flotte macht weiter (geschwächt).</li>
                <li>Der Zielplanet wird von einer <strong>bewaffneten</strong> Flotte des Besitzers oder einer <strong>bewaffneten</strong> Flotte eines Allianzkameraden bewacht, die bereits im Orbit steht (eine einzelne Sonde oder ein Frachter zählen nicht mehr): Deine Ankunft löst eine <strong>Schlacht</strong> gegen diesen Verteidiger und die Geschütztürme des Planeten zusammen aus — selbst wenn der Planet nicht im Angriffsmodus ist. Diese Schlacht beginnt niemals gegen einen Friedens- oder Paktpartner, einen Verbündeten, deine eigene Allianz oder auf einem PvE-Server — sie folgt denselben diplomatischen Regeln wie eine normale Invasion. Sie bricht deine laufende Invasion ab: Gewinnst du sie, musst du eine Invasion <strong>erneut starten</strong>, um tatsächlich zu landen — ist der Planet dann immer noch bewacht, wird auch ein Klick auf „Einfallen“ aus dem Orbit <strong>abgelehnt</strong>: Aktiviere zuerst den Angriffsmodus deiner eigenen Flotte, um den Kampf zu erzwingen. Da eine Invasion immer Legionäre an Bord hat, ist diese Auslösebedingung auf Angreiferseite automatisch erfüllt — die Schlacht beginnt also unabhängig davon, ob deine Flotte Schiffswaffen trägt.</li>
            </ul>
            <p><strong>Falle, die du kennen solltest: Eine Invasionsflotte ohne Kampfschiffe wird in dieser Schlacht vernichtet.</strong> Legionäre und Landungsschiffe reichen aus, um eine Invasion zu starten — trägt deine Flotte aber keine einzige Schiffswaffe, tritt sie mit null Feuerkraft in diese Vorschlacht ein. Die Verteidiger vernichten sie vollständig, Landungsschiffe und Legionäre eingeschlossen, noch bevor du landest. <strong>Eskortiere deine Invasionsflotten immer mit Kampfschiffen</strong> — siehe den Artikel <em>Raids (Plünderung)</em> für dieselbe Falle beim Plündern.</p>

            <h2 id="combat">Phase 2 — Bodenkampf</h2>
            <p>Der Bodenkampf läuft in <strong>maximal 10 Runden</strong>. In jeder Runde tauschen beide Lager Verluste aus.</p>
            <table>
                <tr><th>Einheit</th><th>Rolle</th></tr>
                <tr><td><strong>Legionär</strong></td><td>Angriff und Verteidigung. Durch die Stacheldraht-Forschung für die Verteidigung geboostet.</td></tr>
                <tr><td><strong>Mech</strong></td><td>Mächtige schwere Verteidigungseinheit (max. 500 pro Planet).</td></tr>
                <tr><td><strong>Arbeiter</strong></td><td>Passive Verteidigung, <strong>nur in der Invasion</strong> (nicht im Raid).</td></tr>
            </table>
            <p><strong>Der Angreifer gewinnt nur, wenn</strong> alle Truppen des Verteidigers eliminiert sind <strong>und</strong> ihm mindestens 1 lebender Legionär bleibt. Sonst <strong>gewinnt der Verteidiger durch Geländevorteil</strong>.</p>

            <h2 id="deploiement">Die taktischen Einsätze des Verteidigers</h2>
            <p>Der Verteidiger kann einen <strong>taktischen Einsatz</strong> gewählt haben, der für dich unsichtbar ist. Zu bedenken: Er kann eine scheinbar gewonnene Situation drehen.</p>
            <table>
                <tr><th>Einsatz</th><th>Effekt</th><th>Gegenleistung</th></tr>
                <tr><td><strong>Ausgewogen</strong></td><td>Kein Bonus und kein Malus.</td><td>Neutral.</td></tr>
                <tr><td><strong>Befestigt</strong></td><td>+30&nbsp;% Bodenverteidigung.</td><td>−20&nbsp;% Gegenangriff.</td></tr>
                <tr><td><strong>Guerilla</strong></td><td>Arbeiter +150&nbsp;% in der Verteidigung.</td><td>Legionäre bei −50&nbsp;%.</td></tr>
                <tr><td><strong>Letzte Bastion</strong></td><td>+50&nbsp;%, wenn die Truppen unter 30&nbsp;% fallen.</td><td>Bedingt.</td></tr>
                <tr><td><strong>Verbrannte Erde</strong></td><td>Kein aktiver Bonus.</td><td>Wenn du einen Raid verlierst, werden 50&nbsp;% der nicht geplünderten Ressourcen zerstört.</td></tr>
            </table>

            <h2 id="victoire">Wenn du die Invasion gewinnst</h2>
            <ul>
                <li><strong>Eroberung</strong> — der Planet gehört dir, mit seinen Gebäuden. Die Arbeiter werden auf einen Basisschwellenwert zurückgesetzt (~2&nbsp;000).</li>
                <li><strong>Cthulhu-Planet</strong> — wenn du einen von den Cthulhu eingenommenen Planeten zurückerobert, wird er befreit (Gebäude auf Null zurückgesetzt, Belohnung in Uran).</li>
                <li><strong>Kein Platz mehr zum Besiedeln?</strong> Der eroberte Planet wird zu einer Cthulhu-Basis: Du behältst ihn nicht.</li>
            </ul>
            <p>Die <strong>Produktionswarteschlangen</strong> folgen dem eroberten Planeten nicht: Schiffe wie Verteidigungen (Geschütztürme oder Truppen), die bereits bezahlt, aber noch nicht ausgeliefert sind, gehen bei der Eroberung verloren — eine Bestellung des Besiegten wechselt niemals den Besitzer. Was vor dem Angriff ausgeliefert wurde, steht dagegen am Boden und folgt dem Planeten.</p>
            <p>Beherbergt der eroberte Planet einen feindlichen <strong>Nebenhelden</strong>, entscheidet sich sein Schicksal sofort: Du <strong>fängst ihn</strong>, wenn du ein Gefängnis (Stufe 1 oder höher) besitzt, sonst wird er <strong>hingerichtet</strong>. Ein Raid dagegen nimmt nie den Planeten ein und setzt daher nie einen Helden aufs Spiel. Details im Artikel <em>Nebenhelden</em>.</p>

            <h2 id="gameover">Elimination des Verteidigers</h2>
            <p>Wenn der Verteidiger seinen <strong>letzten Planeten</strong> verliert, wird er vom Server eliminiert. Du erhältst alles: Bitcoins, überlebende Flotten und zugehörige Kriegspunkte.</p>

            <h2 id="defaite">Wenn du die Invasion verlierst</h2>
            <p>Die <strong>Landungsschiffe werden vom Verteidiger erbeutet</strong>. Die gelandeten Legionäre sind verloren. Eine kostspielige Niederlage: Sondiere, bevor du einfällst.</p>

    raid:
        title: "Raids (Plünderung)"
        category: "combat"
        order: 3
        tags: "raid,pluenderung,diebstahl,ressourcen,bunker,landungsschiffe"
        summary: "Ressourcen eines feindlichen Planeten plündern, ohne ihn erobern zu wollen."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Was ist ein Raid?</h2>
            <p>Ein Raid ist ein Bodenangriff mit dem Ziel, <strong>Ressourcen zu stehlen</strong>. Du nimmst den Planeten nicht ein: Du gehst mit Beute davon. Wichtige Folge: Ein Raid, selbst ein erfolgreicher, nimmt niemals den Planeten ein, daher wird dabei <strong>nie ein Nebenheld gefangen oder hingerichtet</strong> — weder als Angreifer noch als Verteidiger.</p>

            <h2 id="difference">Raid vs. Invasion</h2>
            <table>
                <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                <tr><td>Ziel</td><td>Niob, Wasser, Uran stehlen</td><td>Den Planeten in Besitz nehmen</td></tr>
                <tr><td>Verteidiger</td><td>Legionäre + Mechs</td><td>Legionäre + Mechs + Arbeiter</td></tr>
                <tr><td>Unvorhersehbarkeit</td><td>Gering</td><td>Höher (größerer Zufallsfaktor des Angriffs)</td></tr>
                <tr><td>Landungsschiffe bei Niederlage verloren</td><td>Nein</td><td>Ja (vom Verteidiger erbeutet)</td></tr>
            </table>

            <h2 id="combat">Wie es abläuft</h2>
            <p>Gleiche Schritte wie die Invasion (eventueller Orbitalkampf, dann 10 Runden am Boden), <strong>aber die Arbeiter verteidigen nicht</strong>. Die Legionäre und Mechs des Verteidigers sind allein.</p>
            <p><strong>Planet, der von einer Flotte im Orbit bewacht wird</strong> — ist das Ziel durch eine <strong>bewaffnete</strong> Flotte des Besitzers oder eine <strong>bewaffnete</strong> Flotte eines Allianzkameraden geschützt (eine einzelne Sonde oder ein Frachter reichen nicht mehr), löst dein Raid zuerst eine Schlacht gegen diesen Verteidiger und die Geschütztürme des Planeten aus. Diese Schlacht beginnt niemals gegen einen Friedens- oder Paktpartner, einen Verbündeten, deine eigene Allianz oder auf einem PvE-Server. Die Plünderung findet dabei nicht statt: Gewinnst du diese Schlacht, musst du einen Raid <strong>erneut starten</strong>, um tatsächlich zu plündern — ist der Planet noch bewacht, wird auch ein Klick auf „Plündern“ aus dem Orbit <strong>abgelehnt</strong>: Aktiviere zuerst den Angriffsmodus deiner eigenen Flotte, um den Kampf zu erzwingen. Auf Angreiferseite wird diese Schlacht nur ausgelöst, wenn deine Raid-Flotte selbst offensiv ist — Schiffswaffen, Legionäre oder Mechs an Bord: ein reiner Frachter ohne jede Waffe und ohne Truppen löst nichts aus.</p>

            <h2 id="raid-nur-truppen">Ein reiner Truppen-Raid wird vernichtet</h2>
            <p>Legionäre oder Mechs an Bord reichen aus, um diese Schlacht auszulösen — trägt deine Raid-Flotte aber <strong>keine einzige Schiffswaffe</strong>, tritt sie mit null Feuerkraft in diese Schlacht ein. Die Verteidiger vernichten sie vollständig, ohne selbst auch nur ein Schiff zu verlieren. <strong>Eskortiere deine Truppentransporter immer</strong> — das ist die teuerste Überraschung, die dir dieses System bescheren kann.</p>

            <h2 id="pillage">Die Plünderung (im Falle eines Sieges)</h2>
            <p>Du nimmst so viele Ressourcen mit, wie deine Flotte transportieren kann. Die Ressourcen werden in dieser Reihenfolge genommen:</p>
            <ol>
                <li><strong>Niob</strong> zuerst.</li>
                <li>Dann <strong>Wasser</strong>.</li>
                <li>Zuletzt <strong>Uran</strong> (wenn Platz bleibt).</li>
            </ol>

            <h2 id="bunker">Der Bunker schützt einen Teil</h2>
            <p>Der Bunker des Verteidigers <strong>sichert 5&nbsp;% der maximalen Lagerkapazität pro Level</strong>. Beispiele:</p>
            <ul>
                <li>Bunker Level 5 → 25&nbsp;% der maximalen Lagerkapazität geschützt bei Niob und Wasser.</li>
                <li>Bunker Level 10 → 50&nbsp;% geschützt.</li>
            </ul>
            <p>Uran wird auf die gleiche Weise geschützt: <strong>5&nbsp;% deines Uranvorrats pro Bunker-Level</strong> (Uran hat keine maximale Lagerkapazität, der Schutz gilt daher für den aktuellen Vorrat).</p>

            <h2 id="scorched">Achtung auf die Verbrannte Erde</h2>
            <p>Wenn der Verteidiger den <strong>taktischen Einsatz Verbrannte Erde</strong> gewählt hat und verliert, werden <strong>50&nbsp;% der verbleibenden (nicht geplünderten) Ressourcen zerstört</strong>. Du gehst mit deiner Beute davon, aber der Gegner kann nicht alles wiederaufnehmen.</p>

    nuclear:
        title: "Atomangriff"
        category: "combat"
        order: 4
        tags: "nuklear,bombe,uran,zerstoerung,abfangjaeger"
        summary: "Die ultimative Waffe, um die Schlüsselgebäude eines Feindes zu zerstören — vorausgesetzt, er hat keine Raketenabwehr."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Was du brauchst</h2>
            <ul>
                <li>Ein Gebäude <strong>Atombasis</strong>.</li>
                <li><strong>Uran</strong> (sehr selten).</li>
                <li>Eine gefertigte <strong>Atombombe</strong>.</li>
                <li>Eine Flotte, die in <strong>Mission Nuklear</strong> zum Ziel aufbricht, mit der Bombe an Bord.</li>
            </ul>

            <h2 id="degats">Was macht eine Bombe, die trifft?</h2>
            <p>Die Bombe <strong>zerstört ein Gebäude</strong>, vorrangig die strategischsten:</p>
            <ol>
                <li><strong>Metropole</strong> — Verlust von 1 Level (−80&nbsp;000 Arbeiter max.).</li>
                <li><strong>Stadt</strong> — Verlust von 1 Level (−25&nbsp;000 Arbeiter max.).</li>
                <li><strong>Bunker</strong> — Verlust von 1 Level (reduzierter Schutz).</li>
                <li><strong>Kaserne</strong> — Verlust von 1 Level (−5&nbsp;000 Legionäre max.).</li>
            </ol>
            <p>Die Bombe zielt auf das erste in dieser Reihenfolge gefundene Gebäude.</p>

            <h2 id="regle">Sonderregeln</h2>
            <ul>
                <li>Eine Flotte in Nuklear-Mission <strong>kann nicht</strong> von einer Flotte im Orbit <strong>abgefangen werden</strong>. Sie fliegt direkt zum Ziel.</li>
                <li>Die einzige Möglichkeit, sie zu stoppen: den <strong>Atom-Abfangjäger</strong> des Verteidigers.</li>
            </ul>

            <h2 id="anti">Die Verteidigung: Der Atom-Abfangjäger</h2>
            <p>Wenn der Zielplanet mindestens einen <strong>Atom-Abfangjäger</strong> besitzt, wird die Bombe automatisch neutralisiert:</p>
            <ul>
                <li>Die Trägerflotte wird <strong>zerstört</strong>.</li>
                <li><strong>1 bis 3 Abfangjäger</strong> werden verbraucht.</li>
                <li>Beide Spieler erhalten einen Bericht.</li>
            </ul>
            <p>Fazit: Eine strategische Basis ist immer ein paar Abfangjäger wert. Ohne sie ist sie verwundbar.</p>

    defense:
        title: "Deine Planeten verteidigen"
        category: "combat"
        order: 5
        tags: "verteidigung,soldaten,panzer,geschuetzturm,schild,bunker,orbital,taktik,einsatz,werte,stärke"
        summary: "Die 3 Verteidigungsschichten: orbital (Geschütztürme), taktisch (Einsatz), terrestrisch (Legionäre + Mechs)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Die 3 Verteidigungsschichten</h2>
            <ol>
                <li><strong>Orbitalverteidigung</strong> — Geschütztürme, Schilde, Raumbasis. Fangen die Flotte ab, bevor sie landet.</li>
                <li><strong>Taktischer Einsatz</strong> — eine strategische Wahl, die die Kraft deiner Truppen am Boden ändert.</li>
                <li><strong>Bodenverteidigung</strong> — Legionäre, Mechs, Arbeiter (für Invasionen).</li>
            </ol>

            <h2 id="mode-attaque">Den Angriffsmodus deines Planeten aktivieren</h2>
            <p>Wenn dein Planet <strong>mindestens einen Geschützturm</strong> besitzt, kannst du den <strong>Angriffsmodus</strong> aktivieren. In diesem Modus beginnt automatisch ein <strong>Orbitalkampf</strong>, sobald eine feindliche Flotte im Angriffsmodus in den Orbit kommt.</p>
            <ul>
                <li><strong>Sieg</strong>: Die feindliche Flotte wird zerstört, und du kassierst <strong>Kriegspunkte</strong> im Verhältnis zu ihrer Signatur (deutlich weniger gegen einen Cthulhu).</li>
                <li><strong>Niederlage</strong>: All deine Geschütztürme, Schilde, deine Raumbasis und deine laufende Verteidigungsproduktion in der Warteschlange werden vernichtet; der Angriffsmodus wird <strong>automatisch deaktiviert</strong> (ein Planet ohne Geschützturm kann ihn nicht aktiv halten), und die Flotte setzt den Weg zum Bodenkampf fort.</li>
            </ul>
            <p>Ohne Geschützturm werden deine Schilde und die Raumbasis <strong>ohne Kampf</strong> zerstört.</p>
            <p>Zwei Orte zum Aktivieren: die <strong>Verteidigungs</strong>-Seite eines Planeten oder die <strong>Planeten</strong>-Seite, die den Zustand jedes Planeten anzeigt (ein Fadenkreuz neben seinen Verteidigungen, zum Umschalten anklickbar) und <strong>„Alle aktivieren“</strong> / <strong>„Alle deaktivieren“</strong> für das gesamte Imperium anbietet. Die Sammelumschaltung überspringt Planeten ohne Geschützturm oder bereits im Kampf und nennt dir die Zahl der übersprungenen.</p>
            <p><strong>Achtung</strong>: Den Angriffsmodus auf einem Planeten zu aktivieren, über dem bereits eine feindliche Flotte steht, löst den Orbitalkampf <strong>fünf Minuten später</strong> aus. Im Sammelmodus können mehrere Kämpfe gleichzeitig starten — die Meldung nennt dir die Anzahl.</p>
            <p><strong>Was der Angreifer mitbringt.</strong> Die Flotte, die deine Geschütztürme angreift, kämpft jetzt mit <strong>allen ihren Boni</strong>: den Allianzboni ihres Kommandanten (Raketen, Laser, Plasma, Panzerung, Schild, Präzision) und den Ausrüstungsboni ihres Helden an Bord. Bis zum 10. September 2026 zählten sie nur im Raumkampf: Eine Allianz, die bis zu +5&nbsp;% in jeden dieser sechs Werte investiert hatte, bekam davon gegen Geschütztürme nichts. Das gilt in beide Richtungen — deine eigenen Flotten behalten ihre Boni, wenn du einen Planeten im Angriffsmodus stürmst — und die Zahlen der Orbitalberichte stehen nun auf derselben Skala wie die der Raumkampfberichte.</p>

            <h2 id="verteidigung-und-deine-flotten">Deine Verteidigung feuert auch ohne Angriffsmodus</h2>
            <p>Der Angriffsmodus ist nicht der einzige Weg, deine Geschütztürme feuern zu lassen. Sobald eine deiner Flotten — oder eine <strong>bewaffnete</strong> Flotte eines Allianzkameraden — im Orbit des Planeten steht, während dort eine Weltraumschlacht ausbricht, schließt sich deine Verteidigung dieser Schlacht automatisch an, ob der Angriffsmodus aktiv ist oder nicht (ein Planet ohne jede Verteidigung — kein Geschützturm, kein Schild, keine Raumbasis — nimmt nie teil). Das macht daraus eine <strong>einzige Schlacht</strong>: kein separater Orbitalkampf danach. In dieser Schlacht wirkt der Rüstungsbonus deiner <strong>Raumbasis</strong> (+20&nbsp;%) sowohl auf deine Geschütztürme als auch auf deine Schilde, und die militärische Affinität deines <strong>stationierten Helden</strong> verstärkt das Feuer deiner eigenen Geschütztürme und kann Einschüchterung oder Taktiker für dein ganzes Lager tragen — genau wie ein Flottenheld. Deine Geschütztürme zielen dabei mit ihrer eigenen Präzision (70, über allem, was eine Flotte erreichen kann), und sie erleiden <strong>echte Verluste</strong> — proportional zum erlittenen Schaden, wenn deine Seite gewinnt, <strong>vollständig</strong> (Geschütztürme, Schilde, Raumbasis, laufende Verteidigungsproduktion in der Warteschlange, Angriffsmodus abgeschaltet), wenn deine Seite unterliegt. Du erhältst den Anteil deines Planeten an <strong>Kriegspunkten</strong>, sobald deine Seite diese Schlacht gewinnt — selbst wenn du selbst keine Flotte eingesetzt hast. Folge für deine Gegner: Ein Planet, der von einer deiner <strong>bewaffneten</strong> Flotten oder einer bewaffneten verbündeten Flotte bewacht wird (eine einzelne Sonde oder ein Frachter zählen nicht mehr), kann nicht mehr ohne vorherige Schlacht geplündert oder invadiert werden — egal ob der Angreifer frisch ankommt oder aus dem Orbit auf „Plündern“/„Einfallen“ klickt — und diese Schlacht beginnt niemals gegen einen Friedens- oder Paktpartner, einen Verbündeten, deine eigene Allianz oder auf einem PvE-Server.</p>
            <p><strong>Du hast selbst keine Flotte eingesetzt?</strong> Du erhältst trotzdem einen eigenen Bericht, der dir sagt, ob deine Verteidigung standgehalten hat oder vernichtet wurde, mit genauer Auflistung deiner Geschützturmverluste und deinem Anteil an Kriegspunkten im Sieg — über das Schicksal deines Planeten bleibst du nie im Unklaren.</p>

            <h2 id="combat-orbital">Der Orbitalkampf im Detail</h2>
            <p>Die Geschütztürme feuern im Rundentempo auf die feindliche Flotte. Die <strong>Raumbasis</strong> gibt allen Verteidigungen einen Panzerungsbonus (+20&nbsp;%). Die Schilde (50&nbsp;000 oder 600&nbsp;000 Panzerungspunkte) absorbieren die ersten Schüsse.</p>
            <p>Deine Geschütztürme feuern <strong>ab der ersten Runde</strong>, egal welche Flotte ihnen gegenübersteht: Der Schirm eines Schiffes verzögert ihre Eröffnungssalve nie. Dieser Schirm ist ein Vorrat, der Schaden aufnimmt, bis er aufgebraucht ist. Jede Salve durchdringt ihn sofort in Höhe ihrer <strong>Durchschlagskraft</strong> (Plasma ×4, Laser ×2, Raketen ÷ 7); der Rest zehrt am Schirm, und was überläuft, trifft die Hülle. Eine Verteidigung nur aus Raketenwerfern bleibt gegen eine stark beschildete Flotte im Nachteil — aber sie feuert, sie fügt Verluste zu und sie hinterlässt Trümmer.</p>
            <p>Selbst wenn die feindliche Flotte gewinnt, schützt sie ihr Jägerschirm nicht mehr endlos: Ihre Geschütztürme fügen auch ihren schwereren Schiffen echte Verluste zu, im Verhältnis zum erlittenen Schaden — schlimmstenfalls für sie 95&nbsp;% ihrer Ausgangspanzerung. Sich zu verteidigen kostet den Angreifer also immer etwas, selbst wenn er gewinnt.</p>

            <h2 id="deploiement">Der taktische Einsatz</h2>
            <p>Jeder Planet kann einen <strong>taktischen Einsatz</strong> wählen. Er ist <strong>für den Angreifer unsichtbar</strong> — deine verdeckte Karte.</p>
            <table>
                <tr><th>Einsatz</th><th>Effekt</th><th>Gegenleistung</th></tr>
                <tr><td><strong>Ausgewogen</strong></td><td>Kein Bonus und kein Malus.</td><td>Neutral.</td></tr>
                <tr><td><strong>Befestigt</strong></td><td>+30&nbsp;% Bodenverteidigung.</td><td>−20&nbsp;% Gegenangriff.</td></tr>
                <tr><td><strong>Guerilla</strong></td><td>Arbeiter +150&nbsp;% in der Verteidigung.</td><td>Legionäre bei −50&nbsp;%.</td></tr>
                <tr><td><strong>Letzte Bastion</strong></td><td>+50&nbsp;%, wenn deine Truppen unter 30&nbsp;% fallen.</td><td>Kein Effekt vor dieser Schwelle.</td></tr>
                <tr><td><strong>Verbrannte Erde</strong></td><td>Kein aktiver Bonus.</td><td>Wenn du einen Raid verlierst: 50&nbsp;% deiner verbleibenden Ressourcen werden zerstört.</td></tr>
            </table>

            <h2 id="combat-sol">Der Bodenkampf</h2>
            <p>Er läuft in <strong>maximal 10 Runden</strong>. In jeder Runde erleiden beide Lager Verluste. Wenn niemand in 10 Runden gewinnt, wird <strong>der Angreifer zurückgeschlagen</strong> (Geländevorteil).</p>

            <h2 id="troupes">Die Bodeneinheiten</h2>
            <table>
                <tr><th>Einheit</th><th>Rolle</th><th>Notizen</th></tr>
                <tr><td><strong>Legionäre</strong></td><td>Angriff und Verteidigung.</td><td>Starker Verteidigungsbonus mit der Stacheldraht-Forschung.</td></tr>
                <tr><td><strong>Mechs</strong></td><td>Schwere Verteidigung.</td><td>Max. 500 pro Planet. Verbrauchen Nahrung.</td></tr>
                <tr><td><strong>Arbeiter</strong></td><td>Passive Verteidigung.</td><td>Nur gegen Invasionen, nicht gegen Raids.</td></tr>
            </table>

            <h2 id="ressources-defense">Ressourcen für die Produktion deiner Verteidigungen</h2>
            <p>Wie bei der Raumwerft greift die Verteidigungsproduktion zuerst auf die Ressourcen <strong>des Planeten</strong> zu und dann auf den <strong>Frachtraum der im Orbit stationierten Flotten</strong>. Du kannst also weiter rekrutieren, selbst wenn der Vorrat am Boden gering ist, solange beladene Flotten über dem Planeten anwesend sind.</p>

            <h2 id="installations">Orbitale Anlagen und Verteidigungen</h2>
            <ul>
                <li><strong>Geschütztürme</strong> — Raketenwerfer, Laser, Schwerer Laser, Gauss, Ionisch, Plasma. Verschieden, um unterschiedliche Flottentypen zu kontern.</li>
                <li><strong>Schild</strong> (50&nbsp;000 Pkt.) und <strong>Großer Schild</strong> (600&nbsp;000 Pkt.) — absorbieren die ersten Schüsse.</li>
                <li><strong>Raumbasis</strong> — +20&nbsp;% Panzerung für alle Orbitalverteidigungen.</li>
            </ul>

            <h2 id="stats-defensives">Die Stärke Ihres Planeten ablesen</h2>
            <p>Die Seite <strong>Verteidigung</strong> hat zwei Reiter. Der zweite, <strong>Verteidigungswerte</strong>, fasst zusammen, was der Planet wirklich wert ist: die kumulierte Panzerung, Raketen, Laser und Plasma aller Ihrer Türme, den Beitrag jeder Struktur, die Wirkung von Schild, großem Schild und Raumstation auf die Panzerung, der eine Flotte tatsächlich gegenübersteht, sowie die Stärke Ihrer Bodenverteidigung. Das ist der schnellste Weg, den zurückliegenden Wert zu erkennen, bevor Sie eine neue Bauserie starten.</p>
            <p>Ein Hinweis zum Ablesen: Kreisdiagramm und Balken zeigen die Panzerung <strong>der Strukturen allein</strong>. Die Schildpauschalen stehen getrennt bei den Modifikatoren, da sie sonst jeden Vergleich zwischen Ihren Waffen erdrücken würden.</p>

            <h2 id="bunker">Der Bunker gegen Plünderung</h2>
            <p>Der Bunker schützt <strong>5&nbsp;% der maximalen Lagerkapazität pro Level</strong> gegen Raids. Ein Bunker Level 5 bringt bereits 25&nbsp;% deiner Reserven in Sicherheit. Uran wird in Höhe von 5&nbsp;% seines aktuellen Vorrats pro Level geschützt.</p>

            <h2 id="entretien">Achtung auf die Unterhaltskosten</h2>
            <p>Einheiten auf <strong>Mission</strong> (Flotten, abgereiste Landungsschiffe) kosten <strong>viel mehr</strong> als stationierte. Zum Beispiel kostet ein Mech in der Garnison wenig, aber ein eingeschiffter Mech kostet ~50× mehr. Lass keine große Armee in Dauerreise.</p>

    embargo:
        title: "Embargo und Hungersnot"
        category: "combat"
        order: 6
        tags: "embargo,hungersnot,blockade,belagerung,planet,nahrung,versorgung,rationen"
        summary: "Einen Planeten aushungern, bevor man ihn einnimmt: die Blockade, die einsetzende Hungersnot und wie man sie überlebt."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Ein <strong>Embargo</strong> ist eine planetare Belagerung. Du hältst eine große Flotte im Orbit eines feindlichen Planeten; der Austausch wird gekappt, die Nahrung geht aus, die Bevölkerung leidet. Wenn der Planet geschwächt ist, gehst du zum Angriff über.</p>

            <h2 id="consommation">Erinnerung: Die Nahrung</h2>
            <p>Deine Arbeiter, Legionäre und Mechs verbrauchen kontinuierlich Nahrung. Wenn deine Reserven auf <strong>0</strong> fallen, ist es die <strong>Hungersnot</strong>.</p>

            <p>Rationen werden <strong>im Frachtraum transportiert</strong>: auf einem Planeten laden, woanders ausladen, um Nachschub zu bringen. Solange eine Ihrer Flotten über Ihrem Planeten <strong>vor Anker liegt</strong> (weder im Flug noch im Kampf), ergänzen ihre Rationen den Speicher — und eine Belagerung zehrt sie wie alles andere auf: der Frachtraum ist kein Safe.</p>

            <h2 id="famine">Die Hungersnot (außerhalb des Embargos)</h2>
            <p>Wenn Nahrung fehlt, reihen sich die Verluste in <strong>3 Phasen</strong>:</p>
            <ul>
                <li><strong>Phase 1 (0–3h)</strong> — moderate Arbeiterverluste. Zeit zum Reagieren.</li>
                <li><strong>Phase 2 (3–8h)</strong> — beschleunigte Verluste. Legionäre beginnen zu desertieren.</li>
                <li><strong>Phase 3 (über 8h)</strong> — Zusammenbruch: Arbeiter dezimiert, Legionäre auf der Flucht, Mechs aufgegeben.</li>
            </ul>
            <p>Ein Sockel von <strong>5&nbsp;000 Arbeitern</strong> verhindert das totale Verschwinden. Ohne Nachschub erreicht ein Planet diesen Sockel in ~27 Stunden.</p>

            <h2 id="declenchement">Wie man ein Embargo auslöst</h2>
            <p>Ein Embargo wird automatisch aktiviert, wenn:</p>
            <ul>
                <li>Mindestens eine <strong>feindliche Flotte</strong> (außer Verbündete) im Orbit ist,</li>
                <li>im <strong>Angriffsmodus</strong>,</li>
                <li>mit <strong>genügend schweren Schiffen</strong> (entspricht ~250 Schlachtschiffen, 37 Zerstörern oder 3 Motherships).</li>
            </ul>
            <p>Sobald die feindliche Flotte abzieht oder zerstört wird, hebt sich die Blockade.</p>
            <p>Eine Raid- oder Invasionsflotte, die durch die im Artikel <em>Deine Planeten verteidigen</em> beschriebene fusionierte Schlacht als „angreifend“ markiert wurde, behält diese Markierung, wenn sie überlebt: Bleibt sie im Orbit, zählt sie für diese Signatur genau wie jede andere feindliche Flotte.</p>

            <h2 id="effets">Was der belagerte Planet erleidet</h2>
            <ul>
                <li><strong>Zusätzlicher stündlicher Nahrungsabfluss</strong>: die Bevölkerung gerät in Panik und verbraucht mehr.</li>
                <li><strong>Nahrungsproduktion</strong> reduziert (gestörte Farmen).</li>
                <li><strong>Niob- und Wasserproduktion</strong> reduziert.</li>
                <li><strong>Arbeiterwachstum</strong> fast gestoppt.</li>
                <li><strong>Markt blockiert</strong>: keine automatischen Verkäufe mehr an Händler.</li>
                <li><strong>Fremde Frachter blockiert</strong>: Nur deine Frachter oder die deiner Verbündeten können landen (verbündete Versorgung).</li>
            </ul>

            <h2 id="famine-embargo">Hungersnot unter Embargo: Es wird schlimmer</h2>
            <p>Wenn die Nahrung <strong>während</strong> eines Embargos auf 0 fällt, sind die Verluste <strong>schwerer</strong> und unmittelbar: Arbeiter, Legionäre und Mechs nehmen alle drei kontinuierlich ab.</p>

            <h2 id="timings">Wie lange hält man durch?</h2>
            <table>
                <tr><th>Planetenprofil</th><th>Beginn der Hungersnot</th><th>Zusammenbruch</th></tr>
                <tr><td>Klein (50 000 Arbeiter, 100 000 Nahrung)</td><td>~14 Stunden</td><td>~1,75 Tage</td></tr>
                <tr><td>Mittel (150 000 Arbeiter, 800 000 Nahrung)</td><td>~1,5 Tage</td><td>~3,25 Tage</td></tr>
                <tr><td>Festung (200 000 Arbeiter, 2 000 000 Nahrung)</td><td>~3 Tage</td><td>~4,8 Tage</td></tr>
            </table>

            <h2 id="defense">Wie man einem Embargo widersteht</h2>
            <ul>
                <li><strong>Die belagernde Flotte zerstören</strong>, um die Blockade zu lösen.</li>
                <li><strong>Verbündeten Nachschub kommen lassen</strong> — deine Frachter und die deiner Allianz kommen immer durch.</li>
                <li><strong>Evakuieren</strong> — deine <em>abgehenden</em> Flotten werden nicht blockiert, du kannst deine Ressourcen im Notfall ausleeren.</li>
                <li><strong>Silos bauen</strong> und Nahrung lagern, <em>bevor</em> es schlimm wird.</li>
                <li><strong>Deine Allianz um Hilfe bitten</strong>, um die Belagerung zu mehreren zu brechen.</li>
            </ul>

            <h2 id="rapports">Die Berichte während eines Embargos</h2>
            <p>Jede Stunde erhaltet du (und der Angreifer) einen Bericht: verstrichene Zeit, verbleibende Nahrung, erlittene Verluste. Die Planeten-Seite zeigt auch einen sehr nützlichen Abschnitt <strong>Versorgung</strong> (Produktion, Verbrauch, geschätzte Autonomie).</p>

    combat_stats:
        title: "Die Truppenstärke verstehen"
        category: "combat"
        order: 7
        tags: "staerke,bonus,kampf,politik,berechnung,fraktion"
        summary: "Wie sich die Stärke deiner Einheiten vergleicht und was sie boostet."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Bodenstärke</h2>
            <p>In Größenordnungen (ohne Boni):</p>
            <table>
                <tr><th>Einheit</th><th>Relative Stärke</th><th>Rolle</th></tr>
                <tr><td><strong>Mech</strong></td><td>Sehr hoch</td><td>Säule der Verteidigung. Teuer, aber zerquetscht eine kleine Invasion.</td></tr>
                <tr><td><strong>Legionär (Verteidigung)</strong></td><td>Hoch bei hoher Stacheldraht-Forschung</td><td>Verteidigungsmultiplikator × Stacheldraht-Level.</td></tr>
                <tr><td><strong>Legionär (Angriff)</strong></td><td>Mittel, mit Zufallsanteil</td><td>Variabel — ein Raid ist weniger unvorhersehbar als eine Invasion.</td></tr>
                <tr><td><strong>Arbeiter (Verteidigung)</strong></td><td>Schwach, aber die Zahl zählt</td><td>Nur in der Invasion. 200 000 Arbeiter haben Gewicht.</td></tr>
            </table>
            <p>Die <strong>Landungsschiffe</strong> kämpfen nicht: Sie transportieren jeweils 1&nbsp;000 Legionäre (mehr mit Allianzforschungen).</p>

            <h2 id="bonus">Was deine Stärke erhöht</h2>
            <ul>
                <li><strong>Stacheldraht-Forschung</strong> — massiver Multiplikator auf die Legionärverteidigung.</li>
                <li><strong>Disziplin-Forschung</strong> — verbessert Bodentruppen.</li>
                <li><strong>Allianzforschungen</strong> — Legionär-Angriffsbonus, Mech-Verteidigung, Arbeiterverteidigung, Schiffsfeuerkraft, Schiffspanzerung, Landungsschiff-Kapazität.</li>
                <li><strong>Taktischer Einsatz</strong> — Wahl, die Verteidigung oder Gegenangriff boosten kann.</li>
                <li><strong>Militärheld</strong> — direkter Angriffs- und Verteidigungsbonus.</li>
                <li><strong>Gegenstände</strong> am Helden ausgerüstet.</li>
            </ul>

            <h2 id="faction">Politikbonus (Weltraumkämpfe)</h2>
            <p>Der Waffenbonus im Weltraumkampf stammt aus der <strong>Politik Ihrer Allianz</strong>. Jedes Regime schlägt seinen Rivalen: <strong>Demokratie</strong> schlägt <strong>Kommunismus</strong>, dieser schlägt <strong>Faschismus</strong>, dieser schlägt <strong>Demokratie</strong>.</p>
            <p>Schlägt die Politik des <strong>Angreifers</strong> die des Verteidigers, erhalten alle seine Waffen (Raketen, Laser, Plasma) <strong>+20&nbsp;%</strong> für diesen Kampf. Der Bonus gilt nur für den Angreifer: Der Verteidiger stützt sich auf seine Planetenverteidigung.</p>

            <h2 id="precision">Präzision und Kampfwürfe</h2>
            <p>Im Weltraumkampf feuert jede Seite <strong>eine Salve pro Runde</strong>. Ein Zufallswurf zwischen der Präzision der Seite und 100, geteilt durch 80, skaliert den Schaden der Salve von <strong>×0,3 bis ×1,2</strong>. Hohe Präzision macht Ihre Treffer nicht stärker: Sie beseitigt die schlechten Würfe.</p>
            <p>Die Zielgenauigkeit einer Flotte wird nirgends mehr in Prozent angezeigt&nbsp;: Überall — Raumwerft, Flottenverwaltung, Reiter Verteidigung und Kampfberichte — zeigt das Spiel den <strong>Schadensmultiplikator</strong>, den sie tatsächlich erzeugt (<strong>×0,66</strong> ganz ohne Investition, <strong>×0,94</strong> bei voller Zielgenauigkeit). Dieser Wert hängt von den <strong>Anpassungspunkten</strong> ab, die je Schiffsmodell in Präzision investiert wurden (40 Punkte/Tag), und ist ein eigener Wert&nbsp;: Punkte anderswo auszugeben, in Panzerung oder Waffen desselben Modells, senkt ihn nie. Kämpfen mehrere Flotten zusammen, nutzt die Seite den Durchschnitt ihrer Werte. Die Verteidigung eines Planeten feuert mit <strong>×1,06</strong> — besser als eine Flotte bei voller Zielgenauigkeit. Gegen einen KI-Gegner (Bot) fällt dessen Zielgenauigkeit nie unter einen festen, bekannten Sockel&nbsp;: Ein Bot, der wirklich investiert, übertrifft ihn, und ein ausreichend investierter Spieler kann ihn erreichen oder übertreffen.</p>

    reports:
        title: "Die Spielberichte"
        category: "beginner"
        order: 9
        tags: "bericht,benachrichtigung,kampf,spionage,allianz,besiedlung,nachrichten"
        summary: "Das Spiel schickt dir Berichte für jedes wichtige Ereignis. Wo du sie findest und was sie enthalten."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Wo findest du deine Berichte?</h2>
            <p>Klicke im linken Menü auf <strong>Nachrichten</strong>. Du findest dort alle empfangenen Berichte, nach Typ geordnet. Ein farbiger Punkt signalisiert ungelesene Nachrichten.</p>
            <p>Du kannst auch <strong>Push-Benachrichtigungen</strong> aktivieren, um eine Warnung auf deinem Handy oder Browser zu erhalten (siehe eigener Artikel).</p>

            <h2 id="combat">Kampfberichte</h2>
            <ul>
                <li><strong>Raumkampf</strong> — eine deiner Flotten hat eine feindliche Flotte getroffen.</li>
                <li><strong>Orbitalkampf</strong> — deine Planetenverteidigungen haben einen Angreifer (nicht) zurückgeschlagen.</li>
                <li><strong>Planetenverteidigung</strong> — eigener Bericht für einen Planetenbesitzer, der in einer fusionierten Schlacht keine eigene Flotte eingesetzt hat: seine Verteidigung hat standgehalten oder wurde vernichtet.</li>
                <li><strong>Raid</strong> — erlittene oder zugefügte Plünderung.</li>
                <li><strong>Invasion</strong> — Versuch der Planeteneinnahme (auf der einen oder anderen Seite).</li>
                <li><strong>Nuklear</strong> — Bombe gesendet oder erhalten.</li>
                <li><strong>Embargo</strong> — stündlicher Stand, wenn einer deiner Planeten belagert wird.</li>
            </ul>

            <h2 id="cthulhu">Cthulhu-Berichte</h2>
            <ul>
                <li><strong>Cthulhu-Angriff</strong> — Cthulhu-Horde gegen deinen Planeten.</li>
                <li><strong>Tower Defense</strong> — Sieg oder Niederlage deiner aktiven Verteidigung.</li>
                <li><strong>Planetenbefreiung</strong> — Rückeroberung eines Planeten von den Cthulhu.</li>
            </ul>

            <h2 id="flotte">Flottenberichte</h2>
            <ul>
                <li><strong>Flottenankunft</strong> — deine Flotte hat ihr Ziel erreicht.</li>
                <li><strong>Ressourcendeponie</strong> — ein Verbündeter hat dir etwas geschickt.</li>
                <li><strong>Recycling beendet</strong> — deine Recycler haben ihre Arbeit beendet.</li>
                <li><strong>Spionage</strong> — Ergebnis einer gesendeten Sonde (oder bei dir entdeckte Sonde).</li>
            </ul>

            <h2 id="alliance">Allianzberichte</h2>
            <ul>
                <li><strong>Diplomatie</strong> — Kriegserklärung, Paktvorschlag, Frieden akzeptiert, Bruch eines Nichtangriffspakts oder eines Verteidigungsbündnisses, Ablauf eines Friedensvertrags.</li>
                <li><strong>Mitglieder</strong> — Ankunft, Abgang, Ausschluss, Game Over eines Kameraden.</li>
            </ul>

            <h2 id="divers">Andere Berichte</h2>
            <ul>
                <li><strong>Tagesbericht</strong> — deine tägliche Wirtschaftsbilanz (18:59 UTC).</li>
                <li><strong>Besiedlung</strong> — neuer Planet gegründet.</li>
                <li><strong>Händler-Verkauf</strong> — deine Ressourcen wurden gekauft.</li>
                <li><strong>Login-Bonus</strong> — Bitcoins des Tages erhalten.</li>
                <li><strong>Gefängnis</strong> — Held gefangen oder befreit.</li>
            </ul>
            <h2 id="compte-valide">Konto bestätigen</h2>
            <p>⚠️ Um einem anderen Spieler eine <strong>Nachricht oder Bitcoins</strong> zu senden, muss Ihr Konto <strong>validiert</strong> (Login erstellt) und Ihre <strong>E-Mail bestätigt</strong> sein. Test-/anonyme Konten sind gesperrt — bestätigen Sie Ihre E-Mail unter <strong>Meine Optionen</strong>.</p>

    battle_reports:
        title: "Einen Kampfbericht lesen"
        category: "combat"
        order: 8
        tags: "bericht,kampf,sieg,niederlage,analyse"
        summary: "Nach jedem Kampf ein detaillierter Bericht. Hier, wie man ihn entschlüsselt, um beim nächsten Mal besser zuzuschlagen."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Wo sie zu finden sind</h2>
            <p>Alle Kampfberichte kommen in deine <strong>Nachrichten</strong>-Seite. Sie sind nach Typ geordnet (Raum, Raid, Invasion, Orbital, Embargo, Nuklear).</p>

            <h2 id="types">Kampfberichttypen</h2>
            <ul>
                <li><strong>Raumkampf</strong> — zwei Flotten sind aufeinandergetroffen.</li>
                <li><strong>Orbitalkampf</strong> — deine Planetenverteidigungen haben eine Flotte abgefangen.</li>
                <li><strong>Planetenverteidigung</strong> — fusionierte Schlacht, in der du keine eigene Flotte eingesetzt hast: deine Geschütztürme, Schilde und Raumbasis haben standgehalten oder wurden zerstört.</li>
                <li><strong>Raid</strong> — Plünderungsversuch (von deiner Seite oder gegen dich).</li>
                <li><strong>Invasion</strong> — Versuch der Planeteneinnahme.</li>
                <li><strong>Nuklear</strong> — Bombe gesendet oder erhalten.</li>
                <li><strong>Embargo</strong> — stündlicher Bericht während einer Belagerung.</li>
            </ul>

            <h2 id="contenu">Was ein Bericht enthält</h2>
            <ul>
                <li><strong>Eingesetzte Kräfte</strong> — Ausgangspanzerung, Schild und Waffen jeder Seite sowie die Zusammensetzung jeder Flotte. Die Zielgenauigkeit erscheint nicht mehr in Prozent, sondern als <strong>Schadensmultiplikator</strong>, den sie tatsächlich erzeugt (×0,66 ohne Investition, ×0,94 bei voller Zielgenauigkeit, ×1,06 für die Verteidigung eines Planeten): kein Schuss geht jemals fehl, eine bessere Zielgenauigkeit hebt die Untergrenze Ihres Schadens.</li>
                <li><strong>Salven</strong> — wie viele Salven diese Seite abgefeuert hat, wie viele auf den feindlichen Schild gingen, und ob ihr eigener Schild durchbrochen wurde oder gehalten hat.</li>
                <li><strong>Schildladung</strong> — für einen Flottenblock der Ladungsprozentsatz zu Beginn und am Ende des Kampfes, samt Gesamtkapazität: Ihr Schild springt nicht automatisch von Kampf zu Kampf auf 100&nbsp;% zurück, er lädt sich schrittweise wieder auf (siehe den Artikel <em>Weltraumkampf</em>).</li>
                <li><strong>Restliche Panzerung</strong> — was noch steht, und ihr Anteil an der Ausgangspanzerung. Eine vernichtete Seite zeigt stattdessen den <strong>überschüssigen Schaden</strong>, den sie über ihre Panzerung hinaus erlitten hat: das ist Ihr Siegesvorsprung.</li>
                <li><strong>Erlittener Schaden</strong> — zwei Zähler je Seite: <strong>Hülle</strong> (was den Schild durchdrang) und <strong>Schild</strong> (was die Mauer blockierte). Ihre Verluste folgen direkt daraus.</li>
                <li><strong>Verluste</strong> — Schiff für Schiff, auf beiden Seiten.</li>
                <li><strong>Planetenverteidigung im Detail</strong> — Geschützturmverluste, plus dein Schild, Großer Schild und deine Raumbasis, wenn du sie besitzt; die angezeigte Verteidigungspunktzahl und das „Angriff"-Tag sind bei einer fusionierten Schlacht jetzt die echten Werte.</li>
                <li><strong>Erbeutete Ressourcen</strong> (bei Raubzügen) und <strong>erzeugte Trümmer</strong> — recyceln!</li>
                <li><strong>Gewonnene Kriegspunkte</strong> und das Endergebnis.</li>
            </ul>

            <h2 id="analyser">Was Sie daraus lernen</h2>
            <ul>
                <li>Sehen Sie zuerst auf den <strong>erlittenen Schaden</strong>: Die Zeile „Hülle" zählt die Exponierung Ihrer schildlosen Schiffe <em>und</em> das, was durch einen durchbrochenen Schild kam; die Zeile „Schild", was die Mauer absorbiert hat (Ihre Schildträger verschleißen anteilig).</li>
                <li>Vergleichen Sie die beiden <strong>Schadensmultiplikatoren</strong>: das ist die einzige direkt vergleichbare Zahl zwischen den Seiten — und inzwischen die einzige, die das Spiel anzeigt: Präzisionsprozente sind von allen Anzeigen verschwunden. Sehen Sie dann auf die <strong>restliche Panzerung</strong> — ein Sieg mit 5&nbsp;% verbleibender Panzerung und einer mit 70&nbsp;% lasen sich früher gleich. Ein großer Überschuss beim Gegner heißt, dass Sie den Sieg zu teuer bezahlt haben.</li>
                <li>Verluste unter Ihren <strong>Jägern</strong> sind normal, auch wenn die Mauer hält: Ohne Schild stecken sie ihren Feueranteil direkt ein — als kleine Ziele ziehen sie aber nur wenig Feuer auf sich.</li>
                <li>Viele <strong>Salven auf den gegnerischen Schild</strong>? Bauen Sie Plasma (×4 gegen Schilde), um schneller durchzubrechen.</li>
                <li><strong>100 Runden erreicht</strong>: Die Seite mit der meisten Panzerung gewinnt — passiert Ihnen das im Angriff, fehlt Ihrer Flotte Stärke oder Präzision.</li>
                <li><strong>Archivieren Sie wichtige Berichte</strong>: Sie dienen als Beweise in Allianzdebatten.</li>
            </ul>

    combat_simulator:
        title: "Kampfsimulator"
        category: "combat"
        order: 9
        tags: "simulator,kampf,simulation,flotte,verluste,schaetzung,bericht"
        summary: "Schätzen Sie Ihre Risiken vor dem Angriff: Spielen Sie einen Kampf tausendmal gegen eine in einem Bericht beobachtete Flotte durch — mit der echten Spiel-Engine."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="zweck">Wozu er dient</h2>
            <p>Der Tab <strong>Kampfsimulator</strong> der Flottenseite schätzt, was Sie vor einem Angriff riskieren. Er spielt einen Kampf <strong>1.000-mal</strong> zwischen einer Ihrer Flotten und einer gegnerischen Flotte durch — mit der <strong>echten Spiel-Engine</strong>: gleiche Formeln, gleiche Zufallswürfe. Nichts wird real eingesetzt: Kein Schiff bewegt sich, keines stirbt.</p>

            <h2 id="quelle">Die Quelle: ein Kampfbericht</h2>
            <p>Die gegnerische Flotte stammt aus einem Ihrer <strong>aktuellen Kampfberichte</strong> (mit der Zeile „Erlittener Schaden“): Sie sind die einzigen ehrlichen Quellen, denn sie enthalten die reale Stärke der beobachteten Seite, Boni inklusive. Ein Spionagebericht liefert nur Schiffszahlen ohne deren reale Werte — die Simulation wäre irreführend, deshalb wird er nicht angeboten.</p>
            <p>Wählen Sie den Bericht, die zu bekämpfende Seite (eine der beiden Armadas des Berichts), dann eine Ihrer bewaffneten Flotten. Sie simulieren immer als <strong>Angreifer</strong>, mit Ihren echten Boni (Held, Allianz, Politik).</p>

            <h2 id="lesen">Das Ergebnis lesen</h2>
            <ul>
                <li><strong>Siegquote</strong> — der Anteil der 1.000 Durchläufe, die Sie gewinnen.</li>
                <li><strong>Verlustspanne je Schiffstyp</strong> (Minimum, Median, Maximum) — nur über die siegreichen Durchläufe: Bei einer Niederlage würde Ihre Flotte vollständig zerstört.</li>
                <li><strong>Ein Beispielverlauf</strong> — ein Median-Durchlauf, aufgemacht wie ein Bericht und klar als „SIMULATION“ markiert.</li>
            </ul>

            <h2 id="grenzen">Grenzen, die Sie kennen sollten</h2>
            <ul>
                <li>Die gegnerische Flotte ist die <strong>zum Berichtsdatum beobachtete</strong>: Sie kann seitdem wiederaufgebaut, verbessert oder verstärkt worden sein.</li>
                <li>Situative Trümpfe des Gegners (Held, Planetenverteidigung bei Heimkampf) zeigen sich erst im echten Kampf.</li>
                <li>Limit von <strong>20 Simulationen pro Tag</strong>: Der Simulator stützt eine Entscheidung, er ersetzt nicht das Kampfrisiko.</li>
            </ul>

    colonization:
        title: "Einen neuen Planeten besiedeln"
        category: "planet"
        order: 1
        tags: "besiedlung,planet,kolonisator,expansion"
        summary: "Erweitere dein Imperium, indem du neue Planeten auf leeren Plätzen gründest."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Warum besiedeln?</h2>
            <ul>
                <li><strong>Mehr Produktion</strong> — jeder Planet hat seine eigene Wirtschaft.</li>
                <li><strong>Mehr parallele Bauschlangen</strong>.</li>
                <li><strong>Weniger Risiko</strong> — deine Eier sind nicht mehr im selben Korb.</li>
                <li><strong>Strategische Positionen</strong> — Nähe zu Händlern, Verbündeten, Zielen.</li>
            </ul>

            <h2 id="etapes">Wie man besiedelt</h2>
            <ol>
                <li>Schalte die Forschung <strong>Expansion</strong> frei (um Anspruch auf mehr Planeten zu haben).</li>
                <li>Baue einen <strong>Kolonisator</strong> in deiner Raumwerft.</li>
                <li>Belade ihn mit einigen Startressourcen (empfohlen: Niob und Wasser).</li>
                <li>Sende ihn in Mission <strong>Besiedlung</strong> zu einem <strong>leeren Platz</strong> auf der Karte.</li>
            </ol>
            <p>Bei der Ankunft wird der neue Planet gegründet. Er erscheint in deinem rechten Panel.</p>

            <h2 id="initial">Was er am Anfang hat</h2>
            <p>Ein frisch besiedelter Planet startet mit einer bescheidenen Basis (ein paar hundert Niob und Wasser, etwa 2&nbsp;500 Arbeiter, 20 Legionäre). Alles andere muss gebaut werden.</p>

            <h2 id="limite">Wie viele Planeten maximal?</h2>
            <p>Die Grenze hängt ab von:</p>
            <ul>
                <li>der Stufe der Forschung <strong>Expansion</strong>.</li>
                <li>deiner <strong>Allianz</strong> (einige Allianzforschungen schalten zusätzliche Planeten frei).</li>
                <li>deinen erfolgreichen <strong>Invasionen</strong> (einige offensive Allianzforschungen gewähren ebenfalls Planeten).</li>
            </ul>

            <h2 id="choix">Wo besiedeln?</h2>
            <ul>
                <li>In der Nähe eines <strong>Händlers</strong>: einfache Wirtschaft durch Frachterversand.</li>
                <li>In der Nähe deiner <strong>Verbündeten</strong>: gegenseitige Verteidigung.</li>
                <li>Auf einem <strong>„reichen" Platz</strong> (größer, terraformbar): bessere Produktion.</li>
                <li>Isoliere dich nicht zu weit von allem: langsamere Flotten, schwieriger Nachschub.</li>
            </ul>

    planet_types:
        title: "Alles, was man auf der Karte findet"
        category: "planet"
        order: 2
        tags: "planet,mond,sonne,haendler,alien,truemmer,cthulhu"
        summary: "Die verschiedenen auf der galaktischen Karte sichtbaren Objekte und was man mit ihnen machen kann."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Die 7 Objekttypen</h2>
            <table>
                <tr><th>Typ</th><th>Beschreibung</th><th>Mögliche Aktionen</th></tr>
                <tr><td><strong>Planet</strong> (bewohnt)</td><td>Gehört einem Spieler. Man kann dort bauen, ihn besiedeln (wenn leer)…</td><td>Sondieren, raiden, einfallen, bombardieren.</td></tr>
                <tr><td><strong>Mond</strong></td><td>Von einem Moon Maker erschaffen. Ultraschnelle Nahrungsproduktion (Zyklus von 1 Min).</td><td>Sondieren, raiden, einfallen.</td></tr>
                <tr><td><strong>Sonne</strong></td><td>Stellares Objekt, nicht besiedelbar.</td><td>Keine.</td></tr>
                <tr><td><strong>Leerer Platz</strong></td><td>Freie Position ohne Objekt. Ideal zum Besiedeln oder zum Erschaffen eines Mondes.</td><td>Besiedeln, Mond setzen, einen Verbündeten beliefern.</td></tr>
                <tr><td><strong>Händler</strong></td><td>Immuner NPC, der deine Ressourcen gegen Bitcoins kauft.</td><td>Verkaufen (Mission Entladung).</td></tr>
                <tr><td><strong>Alien-/Cthulhu-Planet</strong></td><td>Schwarmbasis, verteidigt von einer permanenten Garnison.</td><td>Einfallen zum Befreien (Uran + senkt die Bedrohung des Universums).</td></tr>
                <tr><td><strong>Trümmerfeld</strong></td><td>Überbleibsel eines Kampfes (Niob, Wasser) oder spontane Erscheinung (Uran).</td><td>Recyceln.</td></tr>
            </table>

            <h2 id="reperer">Sie auf der Karte erkennen</h2>
            <p>Jeder Typ hat sein eigenes Symbol. Fahre mit der Maus darüber, um den Namen des Besitzers (wenn bewohnt), die geschätzte Größe und deine möglichen Optionen zu sehen.</p>

            <h2 id="lunes">Sonderfall: die Monde</h2>
            <p>Monde werden mit einem speziellen Schiff, dem <strong>Moon Maker</strong>, erschaffen — auf einem leeren Platz mit mindestens 2M Niob und 2M Wasser an Trümmern. Einmal gesetzt, produziert der Mond <strong>Nahrung 10× schneller</strong> als ein Planet (Zyklus von 1 Minute statt 10). Es ist eine wertvolle Nahrungsquelle, um eine große Armee zu unterstützen.</p>

    planet_management:
        title: "Einen Planeten verwalten"
        category: "planet"
        order: 3
        tags: "verwaltung,planet,produktion,kapazitaet,spezialisierung"
        summary: "Wie man die Produktion optimiert, seinen Raum organisiert und gegebenenfalls einen Planeten spezialisiert."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Die zu beherrschenden Grundlagen</h2>
            <ul>
                <li><strong>Produktionsstufen</strong> — steigere regelmäßig Mine / Extraktor / Farm.</li>
                <li><strong>Lagerung</strong> — ohne ausreichende Lager sättigt sich die Produktion und stoppt.</li>
                <li><strong>Bevölkerung</strong> — Städte und Metropolen erhöhen deine Arbeiter-Obergrenze.</li>
                <li><strong>Mindestverteidigung</strong> — ein kleiner Bunker, einige Mechs — das ist die Basis.</li>
            </ul>

            <h2 id="optimiser">Einen Planeten optimieren</h2>
            <ol>
                <li>Baue Produktionsgebäude <strong>paarweise</strong> (Mine + Extraktor werden oft gemeinsam hochgezogen).</li>
                <li>Erforsche <strong>Terraforming</strong>, um den Planeten zu vergrößern und mehr bauen zu können.</li>
                <li>Behalte die <strong>Nahrungsautonomie</strong> im Auge: Farm / Aeroponische Farm ausreichend für deine Bevölkerung.</li>
                <li>Setze einen <strong>Mond</strong> in der Nähe, um die Nahrungsproduktion zu verstärken.</li>
            </ol>

            <h2 id="specialiser">Seine Planeten spezialisieren</h2>
            <p>Mehrere Planeten = Möglichkeit, sie je nach Position und Gebäuden zu spezialisieren:</p>
            <ul>
                <li><strong>Wirtschaftsplanet</strong> — viele Minen, viele Arbeiter, Verkauf an nahe Händler.</li>
                <li><strong>Militärplanet</strong> — Raumwerft, schwere Fabriken, große Verteidigung, um dort deine Flotte zu stationieren.</li>
                <li><strong>Forschungsplanet</strong> — hochgezogenes Forschungszentrum, viele Wissenschaftler.</li>
                <li><strong>Grenzposten</strong> — Radar/Jammer, Sonden, Türme. Dient zur Überwachung oder Eindämmung eines Nachbarn.</li>
            </ul>

            <h2 id="capitale">Der Hauptplanet</h2>
            <p>Dein <strong>erster Planet</strong> spielt eine besondere Rolle: Wenn dein Held im Kampf zerstört wird, wird er automatisch diesem Planeten zugewiesen. Halte ihn stets gut verteidigt.</p>

    planet_abandon:
        title: "Einen Planeten aufgeben"
        category: "planet"
        order: 4
        tags: "aufgabe,planet,loeschen,game over"
        summary: "Wann es eine gute Idee ist, wie man es macht, und warum man es in bestimmten Fällen vermeiden sollte."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Warum einen Planeten aufgeben?</h2>
            <ul>
                <li>Er ist <strong>zu exponiert</strong> gegenüber Angriffen und verbraucht mehr, als er einbringt.</li>
                <li>Er ist <strong>schlecht platziert</strong> (weit von allem entfernt, schwer zu verteidigen).</li>
                <li>Du möchtest <strong>einen besseren besiedeln</strong>, aber bist am Planetenlimit.</li>
            </ul>

            <h2 id="comment">Wie es geht</h2>
            <p>Die Aufgabe erfolgt über die Seite <strong>Planet</strong> → Abschnitt Verwaltung. Eine Bestätigung wird verlangt (es ist unumkehrbar).</p>
            <p>Bevor du ihn loslässt: <strong>Evakuiere alle Ressourcen, Legionäre, Schiffe</strong> zu einem anderen Planeten. Nach der Aufgabe ist alles Verbliebene verloren.</p>

            <h2 id="danger">Die absolut zu vermeidende Falle</h2>
            <p>Deinen <strong>letzten Planeten</strong> aufzugeben, ist das <strong>Game Over</strong>:</p>
            <ul>
                <li>Deine Flotten werden <strong>an die Aliens übergeben</strong>.</li>
                <li>Dein Kommandeur wird vom Server entfernt.</li>
                <li>Die Partie ist beendet.</li>
            </ul>
            <p>Gib niemals auf, ohne sicherzustellen, dass du mindestens einen weiteren aktiven Planeten hast.</p>

    galaxy_navigation:
        title: "Durch die Galaxie navigieren"
        category: "planet"
        order: 5
        tags: "galaxie,sektor,navigation,karte,universum,koordinaten"
        summary: "Wie das Universum organisiert ist, wie man eine Koordinate liest und wie man die Karte benutzt."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Wie das Universum organisiert ist</h2>
            <p>Das Universum ist eine Hierarchie:</p>
            <ul>
                <li>Das <strong>Universum</strong> enthält mehrere <strong>Galaxien</strong>.</li>
                <li>Jede <strong>Galaxie</strong> enthält <strong>Sektoren</strong> (10×10-Raster).</li>
                <li>Jeder <strong>Sektor</strong> enthält 25 <strong>Positionen</strong> (5×5-Raster).</li>
            </ul>
            <p>Jede Position kann einen Planeten, einen Händler, ein Trümmerfeld, einen Mond, eine Sonne enthalten oder leer sein.</p>

            <h2 id="coordonnees">Eine Koordinate lesen</h2>
            <p>Format: <strong>Galaxie:Sektor:Position</strong>, zum Beispiel <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — erste Galaxie;</li>
                <li><strong>5</strong> — fünfter Sektor dieser Galaxie;</li>
                <li><strong>12</strong> — zwölfte Position in diesem Sektor.</li>
            </ul>

            <h2 id="carte">Die Karte benutzen</h2>
            <p>Die Seite <strong>Karte</strong> (linkes Menü) zeigt dir die Raumansicht. Du kannst:</p>
            <ul>
                <li>Dich zwischen Galaxien und Sektoren bewegen.</li>
                <li>Auf eine Position klicken, um zu sehen, was dort ist.</li>
                <li><strong>Direkt eine Flotte senden</strong>, indem du von der Zelle aus auf „Angriff / Senden" klickst.</li>
                <li>Die Positionen von Verbündeten, Feinden und Händlern sehen (je nach deinen Beziehungen und deinem Radar).</li>
            </ul>
            <p><strong>Fliegende Flotten</strong> erscheinen als kleine animierte Schiffe, die in Echtzeit zwischen Start- und Zielplanet gleiten. Der <strong>farbige Halo</strong> zeigt die Seite: <strong>blau</strong> = du, <strong>grün</strong> = Allianz, <strong>grau</strong> = Pakt/Frieden, <strong>magenta</strong> = Händler, <strong>violett</strong> = Alien, <strong>rot</strong> = Feind. Die <strong>Größe</strong> spiegelt die Signatur der Flotte wider. Deine eigenen und Allianzflotten sind immer sichtbar; andere erscheinen nur, wenn dein <strong>Radar</strong> den Sektor abdeckt. Bei Langstreckenflügen über mehrere Sektoren erscheint der Marker nur im letzten Teil der Reise — beim Eintritt in den Zielsektor — nicht während des gesamten Flugs.</p>

            <h2 id="hyperespace">Intergalaktische Reisen</h2>
            <p>Um von einer Galaxie zu einer anderen zu reisen, brauchst du die Forschung <strong>Hyperraum</strong>. Intergalaktische Flüge sind lang und treibstoffintensiv — plane sorgfältig.</p>

    radar_jammer:
        title: "Radar und Störsender"
        category: "planet"
        order: 6
        tags: "radar,stoersender,jammer,erkennung,ueberwachung"
        summary: "Den Feind kommen sehen, bevor er da ist, und deine eigenen Bewegungen verbergen."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs. Störsender (Jammer)</h2>
            <ul>
                <li><strong>Radar</strong> — erkennt sich nähernde Flotten. Gibt dir Zeit zu reagieren.</li>
                <li><strong>Störsender (Jammer)</strong> — verbirgt deine eigenen Bewegungen vor feindlichen Radaren.</li>
            </ul>

            <h2 id="detection">Die verfügbaren Radare</h2>
            <table>
                <tr><th>Typ</th><th>Wo</th><th>Rolle</th></tr>
                <tr><td><strong>Radar</strong> (Gebäude)</td><td>Auf dem Planeten (Boden)</td><td>Lokale Erkennung. Alarmiert vor Flotten, die sich deinem Planeten nähern.</td></tr>
                <tr><td><strong>Sky Radar</strong> (Gebäude)</td><td>Am Himmel (Orbitalinsel)</td><td>Erweiterte Erkennung. Mehr Reichweite, bessere Genauigkeit.</td></tr>
                <tr><td><strong>Radar</strong> (Schiff)</td><td>In der Flotte</td><td>Mobile Erkennung. Nützlich, um zu erkunden oder ein Gebiet weit von dir überwachen.</td></tr>
            </table>

            <h2 id="brouillage">Die verfügbaren Störsender</h2>
            <table>
                <tr><th>Typ</th><th>Wo</th><th>Rolle</th></tr>
                <tr><td><strong>Sky Jammer</strong> (Gebäude)</td><td>Am Himmel (Orbitalinsel)</td><td>Stört feindliche Radare um deinen Planeten.</td></tr>
                <tr><td><strong>Jammer</strong> (Schiff)</td><td>In der Flotte</td><td>Stört Radare um deine Flotte im Flug.</td></tr>
            </table>

            <h2 id="bodenschiffe">Schiffe am Boden sehen</h2>
            <p>Die <strong>Bodensignatur</strong> — die auf einem Planeten stationierten Schiffe — folgt einer etwas lockereren Regel: eine Ihrer Flotten <strong>im Orbit</strong> zählt sie auf Sicht, auch ohne Radar. Allerdings nur für diesen einen Planeten.</p>
            <p>Das <strong>Radar</strong> bleibt das, was Ihnen diese Information <strong>auf Distanz</strong> liefert, im gesamten Sektor. Und ein <strong>Sky Jammer</strong> auf dem Planeten schließt die Lücke wieder: ohne ein Radar, das stärker als der Störsender ist, wird die Bodensignatur wieder unsichtbar — selbst mit einer Flotte darüber.</p>

            <h2 id="strategie">Wie man sie einsetzt</h2>
            <ul>
                <li><strong>Radar</strong> auf jedem Planeten: mindestens das Basisgebäude, um nicht überrascht zu werden.</li>
                <li><strong>Jammer</strong> in der Flotte: unverzichtbar für einen Überraschungsangriff über lange Distanz.</li>
                <li>Einen <strong>Radarsatelliten</strong> (eigene Mission) auf einem strategischen Platz <strong>deployen</strong>, um einen Nachbarn zu überwachen.</li>
                <li>Die Forschung <strong>Welle</strong> verbessert Reichweite und Genauigkeit aller Radare.</li>
            </ul>

    moon:
        title: "Die Monde"
        category: "planet"
        order: 7
        tags: "mond,moonmaker,nahrung,produktion"
        summary: "Ein Mond produziert Nahrung 10× schneller als ein Planet. Wie man einen erschafft."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Was ist ein Mond?</h2>
            <p>Ein <strong>Mond</strong> ist ein besonderes Objekt, kleiner als ein Planet, <strong>ausschließlich der Nahrungsproduktion gewidmet</strong>. Sein Zyklus läuft in <strong>1 Minute</strong> statt 10: Er produziert also 10× schneller als ein Planet gleicher Größe.</p>
            <p>Ein Mond ist eine hervorragende Ergänzung, um eine Armee mit hohem Verbrauch zu unterstützen (viele Legionäre, Mechs, Schiffe auf Mission).</p>

            <h2 id="creation">Wie man einen Mond erschafft</h2>
            <p>Ein Mond entsteht aus einem <strong>Trümmerfeld</strong>: Du brauchst einen <strong>leeren Platz</strong> mit mindestens <strong>2M Niob UND 2M Wasser</strong> an Trümmern (hinterlassen von einer Raumschlacht an dieser Stelle). Die Mission Mond wird auf der Karte nur angeboten, wenn der Platz diese Bedingung erfüllt.</p>
            <ol>
                <li>Baue einen <strong>Moon Maker</strong> (Spezialschiff, teuer).</li>
                <li>Schicke ihn in die Mission <strong>Mond</strong> zu einem leeren Platz mit genügend Trümmern.</li>
                <li>Bei Ankunft wird der Mond erschaffen und <strong>verbraucht alle Trümmer</strong>. Sind die Bedingungen nicht mehr erfüllt (Trümmer während des Flugs recycelt, Position kolonisiert…), erklärt ein Bericht den Fehlschlag.</li>
            </ol>

            <h2 id="groesse">Größe des Mondes</h2>
            <p>Je reicher das Trümmerfeld, desto größer der Mond. Die Stufe richtet sich nach der <strong>schwächeren</strong> der beiden Ressourcen:</p>
            <table>
                <tr><th>Trümmer (Min. Niob/Wasser)</th><th>Gelände</th></tr>
                <tr><td>2M – 8M</td><td>100 – 150</td></tr>
                <tr><td>8M – 15M</td><td>150 – 190</td></tr>
                <tr><td>15M – 25M</td><td>190 – 230</td></tr>
                <tr><td>25M – 50M</td><td>230 – 280</td></tr>
                <tr><td>ab 50M</td><td>280 – 350</td></tr>
            </table>

            <h2 id="limitations">Grenzen</h2>
            <ul>
                <li>Ein Mond <strong>produziert nur Nahrung</strong> (kein Niob und kein Wasser).</li>
                <li>Er kann <strong>angegriffen, geraidet, eingenommen</strong> werden wie ein normaler Planet.</li>
                <li>Einen Mond in deiner Nähe zu bauen, ist sicherer (weniger feindlichen Nachbarn ausgesetzt).</li>
            </ul>

            <h2 id="strategie">Wann einen setzen</h2>
            <ul>
                <li>Du hast Schwierigkeiten, deine Armee zu ernähren → ein naher Mond löst das Problem.</li>
                <li>Eine große Schlacht hat ein <strong>reiches Trümmerfeld</strong> in deiner Nähe hinterlassen: Statt alles zu recyceln, verwandle es in einen Mond.</li>
                <li>Du bist gut etabliert, hast Ressourcen zum Ausgeben und möchtest deine Wirtschaft konsolidieren.</li>
            </ul>

    alliance_basics:
        title: "Eine Allianz gründen und beitreten"
        category: "alliance"
        order: 1
        tags: "allianz,gruendung,beitritt,bonus,regime,politik"
        summary: "Schließe dich Spielern an, erhalte Boni und wähle dein politisches Regime."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Warum einer Allianz beitreten?</h2>
            <ul>
                <li><strong>+20&nbsp;% Produktion</strong> sofort auf alle Ressourcen.</li>
                <li>Zugang zu <strong>20 Allianzforschungen</strong> (Wirtschaft, Militär, Verteidigung).</li>
                <li>Eine <strong>gemeinsame Schatzkammer</strong> in Bitcoins.</li>
                <li><strong>Diplomatie</strong> (Kriege, Frieden, Pakte) und ein <strong>Chat-Salon</strong>.</li>
                <li>Möglichkeit, andere Planeten zu <strong>invadieren</strong> (den Allianzmitgliedern im PvP-Modus vorbehalten).</li>
            </ul>
            <p>Klartext: Solo spielen ist am Anfang machbar. Sobald das Spiel aber ernst wird, vervielfacht eine Allianz deine Erfolgschancen.</p>

            <h2 id="rejoindre">Wie man beitritt</h2>
            <ol>
                <li>Seite <strong>Allianz</strong> (linkes Menü).</li>
                <li>Durchsuche die Liste der offenen Allianzen oder suche nach Namen.</li>
                <li>Stelle einen Beitrittsantrag. Der Anführer (oder ein Offizier) bestätigt ihn.</li>
            </ol>
            <p>Du kannst auch von der gleichen Seite aus <strong>deine eigene Allianz gründen</strong>, indem du einen Namen, ein Tag und ein politisches Regime wählst.</p>

            <h2 id="invitations">Einladungen erhalten</h2>
            <p>Ein Anführer (oder ein Offizier mit Rekrutierungsrecht) kann Sie auch direkt <strong>einladen</strong>. Sie können <strong>gleichzeitig eine Einladung von jeder Allianz</strong> halten — von einer umworben zu werden macht Sie für die anderen nicht unsichtbar —, aber dieselbe Allianz kann Sie kein zweites Mal einladen, solange Sie nicht geantwortet haben. Allianzen, die Sie entdecken, sehen, dass Sie <strong>bereits umworben</strong> werden, ohne zu wissen von wem. Sobald Sie eine Einladung <strong>annehmen</strong>, werden alle anderen automatisch zurückgezogen; und wenn eine Allianz <strong>aufgelöst</strong> wird, verschwindet ihre Einladung aus Ihrer Liste.</p>

            <h2 id="delai">Wartezeit nach dem Verlassen einer Allianz</h2>
            <p>Nachdem du eine Allianz <strong>verlassen</strong> hast, <strong>ausgeschlossen</strong> wurdest (Kick) oder deine Allianz <strong>aufgelöst</strong> wurde, gilt eine <strong>Wartezeit von 2&nbsp;Tagen</strong>: Du kannst weder eine neue Allianz <strong>erstellen</strong> noch einer <strong>beitreten</strong>, solange sie läuft. Das verhindert missbräuchliches Hin und Her zwischen Allianzen.</p>

            <h2 id="regimes">Die 3 politischen Regime</h2>
            <p>Beim <strong>Gründen</strong> einer Allianz wählst du ein <strong>politisches Regime</strong>. Diese Wahl bestimmt die verfügbaren Boni, die möglichen Forschungen und bestimmte interne Regeln. Sie ist <strong>endgültig</strong>.</p>

            <h3 id="democratie">Die Waage der Welten (Das Gleichgewicht der Welten)</h3>
            <p><strong>Vorteile:</strong></p>
            <ul>
                <li>Abstimmung zur Wahl des Präsidenten.</li>
                <li><strong>+20%</strong> Angriff gegen offensive Allianzen.</li>
                <li>Spieler können die Allianz frei verlassen.</li>
                <li>7 wirtschaftliche Forschungen:
                    <ul>
                        <li>+35% Ressourcenproduktion</li>
                        <li>+50% Forschungsgeschwindigkeit</li>
                        <li>-100% Unterhaltskosten der Wissenschaftler</li>
                        <li>+100% Frachterkapazität</li>
                        <li>+50% Schiffsrüstung</li>
                        <li>+25% Gewinn beim Verkauf an Händler</li>
                        <li>+5 besiedelbare Planeten</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Nachteile:</strong></p>
            <ul>
                <li>Alle Allianzmitglieder sind öffentlich bekannt.</li>
                <li>Die Position des ersten Planeten wird angezeigt.</li>
            </ul>

            <h3 id="communisme">Das Stille Bollwerk (Die Offensive Allianz)</h3>
            <p><strong>Vorteile:</strong></p>
            <ul>
                <li>Ein zusätzliches Allianzmitglied.</li>
                <li><strong>+20%</strong> Angriff gegen defensive Allianzen.</li>
                <li>7 offensive Forschungen:
                    <ul>
                        <li>+100% Recyclinggeschwindigkeit</li>
                        <li>+100% Verteidigung der Arbeiter</li>
                        <li>+50% Schiffsstärke</li>
                        <li>-50% Unterhaltskosten der Legionäre</li>
                        <li>-1 Bitcoin pro Stufe auf die Rekrutierung der Legionäre (8 → 3)</li>
                        <li>+5 Planeten durch Invasionen</li>
                        <li>+50% Kriegspunkte-Gewinn</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Nachteile:</strong></p>
            <ul>
                <li>Steuer automatisch auf 50% festgelegt.</li>
                <li>Alle Mitglieder haben Anführerstatus.</li>
                <li>Die Allianz kann nicht verlassen werden.</li>
            </ul>

            <h3 id="fascisme">Der Hammer der Sterne (Die Defensive Allianz)</h3>
            <p><strong>Vorteile:</strong></p>
            <ul>
                <li>Verringerte Cthulhu-Bedrohung.</li>
                <li><strong>+20%</strong> Angriff gegen Die-Waage-der-Welten-Allianzen.</li>
                <li>Nur der Anführer wird öffentlich angezeigt.</li>
                <li>7 defensive Forschungen:
                    <ul>
                        <li>+100% Arbeiterproduktion</li>
                        <li>+50% Schiffsstärke</li>
                        <li>+75% Kapazität der Invasionsbargen</li>
                        <li>+50% Legionärstärke</li>
                        <li>-100% Unterhaltskosten der Mechs</li>
                        <li>+50 Mech-Verteidigung</li>
                        <li>+5 Planeten durch Invasionen</li>
                    </ul>
                </li>
            </ul>
            <p><strong>Nachteile:</strong></p>
            <ul>
                <li>Wenn der Anführer Game Over wird, wird die Allianz aufgelöst.</li>
                <li>Die Allianz kann nicht verlassen werden.</li>
                <li>Die Allianz kann nicht gelöscht werden.</li>
                <li>Ein Allianzmitglied weniger.</li>
                <li>Der Anführer ist der einzige Chef der Allianz.</li>
            </ul>
            <h2 id="compte-valide">Konto bestätigen</h2>
            <p>⚠️ Um eine Allianz zu <strong>erstellen oder ihr beizutreten</strong>, muss Ihr Konto <strong>validiert</strong> und Ihre <strong>E-Mail bestätigt</strong> sein. Test-/anonyme Konten können keiner Allianz beitreten — bestätigen Sie Ihre E-Mail unter <strong>Meine Optionen</strong>.</p>
            <h2 id="discord">Deine Allianz auf Discord</h2>
            <p>Verknüpfe dein Discord-Konto in <strong>Meine Optionen</strong> und aktiviere <strong>Meine Allianzen auf Discord anzeigen</strong>: Das Spiel gibt dir auf dem <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area-Universe-Discord</a> die Rolle jeder deiner Allianzen und entfernt sie, wenn du sie verlässt oder sie aufgelöst wird. Niemand kann die Rolle einer Allianz erhalten, der er nicht angehört. Deaktiviere das Kästchen jederzeit, um deine Rollen zu entfernen.</p>

    alliance_grades:
        title: "Ränge und Berechtigungen"
        category: "alliance"
        order: 2
        tags: "rang,berechtigung,rollen,hierarchie,offizier,anfuehrer"
        summary: "Wie die interne Hierarchie einer Allianz funktioniert und wer was tun darf."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Eine Allianz ist in <strong>Rängen</strong> organisiert, vom höchsten (Anführer) bis zum niedrigsten (Neuling). Jeder Rang hat ein Set an konfigurierbaren <strong>Berechtigungen</strong>.</p>

            <h2 id="hierarchie">Die typische Hierarchie</h2>
            <ul>
                <li><strong>Rang 1 — Anführer</strong> — Gründer der Allianz. Alle Rechte. Nur einer pro Allianz (außer in bestimmten Regimen).</li>
                <li><strong>Rang 2+ — Offiziere</strong> — können delegierte Entscheidungen treffen (Diplomatie, Schatzkammer, Rekrutierung…).</li>
                <li><strong>Zwischenränge</strong> — Veteranen, Berater. Konfigurierbar nach Gewohnheit.</li>
                <li><strong>Niedrigster Rang</strong> — Neuzugänge, eingeschränkte Berechtigungen.</li>
            </ul>

            <h2 id="permissions">Konfigurierbare Berechtigungen</h2>
            <p>Der Anführer kann für jeden Rang aktivieren oder nicht:</p>
            <ul>
                <li>Neue Mitglieder <strong>einladen</strong>.</li>
                <li>Ein Mitglied <strong>ausschließen</strong>.</li>
                <li><strong>Zugriff auf die Schatzkammer</strong> (Einzahlung, Abhebung).</li>
                <li>Einer anderen Allianz <strong>den Krieg erklären</strong>.</li>
                <li>Frieden, Pakt oder eine Defensivallianz <strong>akzeptieren</strong>.</li>
                <li>Die <strong>Ränge der anderen Mitglieder ändern</strong>.</li>
                <li>Die <strong>Allianzforschungen verwalten</strong>.</li>
            </ul>

            <h2 id="changer">Befördern oder degradieren</h2>
            <p>Ein Offizier mit der entsprechenden Berechtigung kann den Rang eines Mitglieds ändern. Eine Möglichkeit, aktive Mitglieder zu belohnen und Neuzugänge zu betreuen.</p>

            <h2 id="regimes">Sonderfälle je nach Regime</h2>
            <p>Einige politische Regime ändern diese Regeln:</p>
            <ul>
                <li><strong>Das Stille Bollwerk</strong> — alle Mitglieder sind Anführer (keine Hierarchie).</li>
                <li><strong>Der Hammer der Sterne</strong> — ein einziger, unabsetzbarer Anführer; wenn der Anführer fällt, wird die Allianz aufgelöst.</li>
                <li><strong>Die Waage der Welten</strong> — der Präsident wird durch Abstimmung gewählt.</li>
            </ul>

            <h2 id="afk">Automatischer Ersatz eines inaktiven Anführers</h2>
            <p>Wenn sich der <strong>Anführer</strong> einer Allianz länger als <strong>7 Tage</strong> nicht mehr einloggt, wird er automatisch ersetzt, damit die Allianz nicht handlungsunfähig wird:</p>
            <ul>
                <li>Das <strong>aktive Mitglied mit dem höchsten Rang</strong> übernimmt die Führung der Allianz. Bei Ranggleichheit entscheidet, wer die meisten <strong>Kriegspunkte</strong> hat.</li>
                <li>Die beiden Ränge werden einfach <strong>getauscht</strong>: Der ehemalige Anführer erhält den Rang des Nachfolgers.</li>
                <li>Gibt es <strong>kein aktives Mitglied</strong>, das übernehmen könnte, ändert sich nichts.</li>
            </ul>

    diplomacy:
        title: "Die Diplomatie"
        category: "alliance"
        order: 3
        tags: "diplomatie,krieg,frieden,pakt,verbuendeter,defcon,vertrag"
        summary: "Die 4 Beziehungstypen zwischen Allianzen, wie man sie aushandelt und was DEFCON bedeutet."
        related: "alliance_basics,political_system,alliance_grades"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Deine Allianz unterhält <strong>Beziehungen</strong> zu anderen Allianzen des Servers. Diese Beziehungen ändern die Spielregeln zwischen euren jeweiligen Mitgliedern (wer wen angreifen darf).</p>

            <h2 id="types">Die 4 Beziehungstypen</h2>
            <table>
                <tr><th>Typ</th><th>Effekt</th><th>Verwendung</th></tr>
                <tr><td><strong>Krieg</strong></td><td>Offener Konflikt. Zwischen den beiden Allianzen ist alles erlaubt.</td><td>Von einem Offizier erklärt. Prioritäre Feinde.</td></tr>
                <tr><td><strong>Frieden</strong></td><td>Waffenstillstand. Kein Angriff möglich. Kann eine Friedenssteuer beinhalten.</td><td>Einen Krieg beenden oder einen teuren Konflikt vermeiden.</td></tr>
                <tr><td><strong>Pakt</strong></td><td>Gegenseitige Nichtangriffsvereinbarung. Kein Angriff, aber keine verpflichtende gegenseitige Hilfe.</td><td>Stabile neutrale Beziehungen.</td></tr>
                <tr><td><strong>Defensivallianz</strong></td><td>Gegenseitige militärische Unterstützung. Man teilt Informationen und kann sich gemeinsam verteidigen.</td><td>Für enge Verbündete.</td></tr>
            </table>

            <h2 id="proposer">Wie man einen Vertrag vorschlägt</h2>
            <ol>
                <li>Seite <strong>Allianz</strong> → <strong>Diplomatie</strong>.</li>
                <li>Wähle die Zielallianz aus der Liste.</li>
                <li>Schlage einen Beziehungstyp vor (Frieden, Pakt, Allianz).</li>
                <li>Die andere Seite muss <strong>akzeptieren</strong>. Entweder sie akzeptiert, lehnt ab oder macht ein Gegenangebot.</li>
            </ol>

            <h2 id="defcon">Der DEFCON (Alarmstufe)</h2>
            <p>Deine Allianz hat eine <strong>DEFCON-Alarmstufe</strong>, eine Zahl, die ihren Spannungszustand angibt. <strong>Je niedriger die Zahl, desto gefährlicher die Lage.</strong> Ein DEFCON 1 bedeutet unmittelbar bevorstehender totaler Krieg.</p>
            <p>Es ist ein visueller Indikator zur Koordination: ein niedriger DEFCON = alle Mitglieder an Deck.</p>

            <h2 id="logs">Das diplomatische Tagebuch</h2>
            <p>Jede diplomatische Aktion (Kriegserklärung, angenommener Frieden, gebrochener Pakt…) wird im Allianzverlauf <strong>mit</strong> dem Nickname des Autors und dem Zeitstempel <strong>festgehalten</strong>. Nützlich für interne Transparenz und Post-Mortem-Debatten.</p>

    alliance_treasury:
        title: "Allianzschatzkammer"
        category: "alliance"
        order: 4
        tags: "schatzkammer,bitcoin,einzahlung,abhebung,steuer"
        summary: "Der gemeinsame Topf deiner Allianz, gespeist von den Mitgliedern und den Friedenssteuern."
        related: "alliance_basics,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Wozu dient die Schatzkammer</h2>
            <p>Die Allianzschatzkammer ist ein <strong>gemeinsames Konto in Bitcoins</strong>. Sie dient zum:</p>
            <ul>
                <li>Bezahlen der <strong>Allianzforschungen</strong>.</li>
                <li>Aushelfen eines Mitglieds in Not.</li>
                <li>Finanzieren einer kollektiven Anstrengung (Kriegsvorbereitung, Event).</li>
            </ul>

            <h2 id="alimenter">Wie man sie speist</h2>
            <ul>
                <li><strong>Freiwillige Einzahlungen</strong> — jedes Mitglied kann Bitcoins einzahlen.</li>
                <li><strong>Allianzsteuer</strong> — wenn aktiviert, wird ein Prozentsatz der Einkünfte jedes Mitglieds automatisch beim Tagesbericht abgezogen.</li>
                <li><strong>Friedenssteuern</strong> — wenn du einer Allianz eine Steuer auferlegt hast, mit der du Frieden schließt, fällt sie automatisch in die Schatzkammer.</li>
            </ul>

            <h2 id="retrait">Die Abhebungen</h2>
            <p>Abhebungen sind den Rängen vorbehalten, die die <strong>Schatzkammer-Berechtigung</strong> haben — in der Regel Offiziere und der Anführer. Jede Bewegung wird protokolliert.</p>

            <h2 id="taxes">Die Allianzsteuer</h2>
            <p>Die Allianzsteuer ist vom Anführer konfigurierbar. Sie zieht einen Prozentsatz der Einkünfte jedes Mitglieds ab, <strong>automatisch beim Tagesbericht</strong>. Wähle sie vernünftig: zu hoch und die Mitglieder gehen.</p>

            <h2 id="transparence">Transparenz</h2>
            <p>Die <strong>Schatzkammer-Logs</strong> zeigen, wer eingezahlt/abgehoben hat, wann, wie viel. Es ist ein Vertrauenswerkzeug: jeder kann nachprüfen.</p>

    political_system:
        title: "Die 3 politischen Regime"
        category: "alliance"
        order: 5
        tags: "politik,regime,bonus,waage,bollwerk,hammer"
        summary: "Die 3 möglichen Regime für eine Allianz: Vorteile, Nachteile und wie man wählt."
        related: "alliance_basics,alliance_research,combat_stats"
        body: |
            <h2 id="principe">Bei der Gründung wählen</h2>
            <p>Wenn eine Allianz gegründet wird, wählt der Gründer ein <strong>politisches Regime</strong>. Dieses Regime definiert <strong>interne Regeln</strong>, <strong>spezifische Boni</strong> und einen dedizierten <strong>Allianzforschungsbaum</strong>. Die Wahl ist <strong>unumkehrbar</strong>.</p>

            <h2 id="balance">Die Waage der Welten (demokratisch)</h2>
            <p>Offenes und wirtschaftliches Regime. Die Mitglieder wählen ihren Präsidenten. Fokus auf <strong>Wirtschaft</strong>.</p>
            <ul>
                <li>+20&nbsp;% Angriff gegen offensive Allianzen.</li>
                <li>Mitglieder öffentlich sichtbar.</li>
                <li>Mitglieder können frei austreten.</li>
                <li>Wirtschaftsorientierte Forschungen (Produktion, Frachter, schnellere Wissenschaftsforschungen, Verkauf an Händler…).</li>
            </ul>

            <h2 id="rempart">Das Stille Bollwerk (offensiv)</h2>
            <p>Aggressives und kollektives Regime. Alle Mitglieder sind Anführer. Fokus auf <strong>Offensive</strong>.</p>
            <ul>
                <li>+20&nbsp;% Angriff gegen defensive Allianzen.</li>
                <li>Ein zusätzliches Mitglied erlaubt.</li>
                <li>Allianzsteuer automatisch auf 50&nbsp;% festgelegt.</li>
                <li>Unmöglich, die Allianz zu verlassen.</li>
                <li>Kampforientierte Forschungen (Schiffsstärke, reduzierte Legionärkosten, Recyclinggeschwindigkeit, Invasionen…).</li>
            </ul>
            <p>Die drei Spitzenränge (<strong>Führer</strong>, <strong>Beschützer</strong>, <strong>Genosse</strong>) sind <strong>gleichwertig</strong>: gleiche Rechte, keine Hierarchie untereinander. Sie können frei unter den Mitgliedern vergeben werden; nur der Rekrutenrang (Gulag) steht darunter.</p>

            <h2 id="marteau">Der Hammer der Sterne (defensiv)</h2>
            <p>Diskretes und defensives Regime. Ein einziger Anführer. Fokus auf <strong>Verteidigung</strong> und Widerstand.</p>
            <ul>
                <li>+20&nbsp;% Angriff gegen demokratische Allianzen.</li>
                <li>Reduzierte Cthulhu-Bedrohung (sehr nützlich im PvE).</li>
                <li>Nur der Anführer wird öffentlich angezeigt.</li>
                <li>Unmöglich, die Allianz zu verlassen. Unmöglich, sie aufzulösen.</li>
                <li>Wenn der Anführer Game Over gesetzt wird, wird die Allianz aufgelöst.</li>
                <li>Ein Mitglied weniger als die anderen Regime.</li>
                <li>Verteidigungsorientierte Forschungen (Arbeiterproduktion, Legionärstärke, Mech-Verteidigung, Bargenkapazität…).</li>
            </ul>

            <h2 id="combat">Boni zwischen Regimen</h2>
            <p>Jedes Regime hat einen +20&nbsp;%-Angriffsbonus <strong>gegen ein rivalisierendes Regime</strong>, im Stein-Schere-Papier-Prinzip:</p>
            <ul>
                <li>Die Waage schlägt das Bollwerk.</li>
                <li>Das Bollwerk schlägt den Hammer.</li>
                <li>Der Hammer schlägt die Waage.</li>
            </ul>

            <h2 id="choisir">Wie wählen?</h2>
            <ul>
                <li><strong>Du startest und zielst auf Wachstum</strong> → Die Waage der Welten (wirtschaftlich, flexibel).</li>
                <li><strong>Du willst eine verschworene, aggressive Allianz</strong> → Das Stille Bollwerk.</li>
                <li><strong>Du willst dich schützen, defensiv spielen</strong> → Der Hammer der Sterne (Achtung: bei Game Over des Anführers bricht alles zusammen).</li>
            </ul>

    alliance_research:
        title: "Allianzforschungen"
        category: "alliance"
        order: 6
        tags: "forschung,allianz,politik,verbesserung,bonus"
        summary: "Kollektive Boni, die aus der Allianzschatzkammer finanziert werden und allen Mitgliedern zugutekommen."
        related: "political_system,alliance_basics,research"
        body: |
            <h2 id="principe">Wie es funktioniert</h2>
            <p>Deine Allianz verfügt über einen <strong>eigenen Forschungsbaum</strong>, der von ihrem <strong>politischen Regime</strong> abhängt. Jede Forschung kostet Bitcoins (aus der Schatzkammer abgezogen) und erstreckt sich über mehrere Stufen.</p>
            <p>Die Boni kommen <strong>allen Mitgliedern zugute</strong>. Das ist einer der Hauptgründe, einer Allianz beizutreten oder ihr treu zu bleiben.</p>

            <h2 id="liste">Die typischen Allianzforschungen</h2>
            <table>
                <tr><th>Forschung</th><th>Was sie verbessert</th></tr>
                <tr><td><strong>Produktion</strong></td><td>Bonus auf die Ressourcenproduktion.</td></tr>
                <tr><td><strong>Arbeiter</strong></td><td>Schnelleres Bevölkerungswachstum.</td></tr>
                <tr><td><strong>Verteidigung der Arbeiter</strong></td><td>Arbeiter widerstehen Invasionen besser.</td></tr>
                <tr><td><strong>Forschungsgeschwindigkeit</strong></td><td>Einzelne Forschungen enden schneller.</td></tr>
                <tr><td><strong>Bewaffnung</strong></td><td>Schaden der Schiffe im Kampf.</td></tr>
                <tr><td><strong>Panzerung</strong></td><td>Schiffspanzerung.</td></tr>
                <tr><td><strong>Kosten Legionäre / Wissenschaftler / Mechs</strong></td><td>Günstigere Rekrutierung.</td></tr>
                <tr><td><strong>Bargenkapazität</strong></td><td>Mehr Legionäre pro Barge gelandet.</td></tr>
                <tr><td><strong>Frachterkapazität</strong></td><td>Mehr transportierte Ressourcen.</td></tr>
                <tr><td><strong>Recyclingkapazität</strong></td><td>Mehr Trümmer pro Zyklus geborgen.</td></tr>
                <tr><td><strong>Kolonisation</strong></td><td>Mehr besiedelbare Planeten.</td></tr>
                <tr><td><strong>Angriff / Verteidigung Legionäre</strong></td><td>Stärke der Bodentruppen.</td></tr>
                <tr><td><strong>Mech-Verteidigung</strong></td><td>Widerstandsfähigere Mechs.</td></tr>
                <tr><td><strong>Händlerpreise</strong></td><td>Bessere Verkäufe an NPCs.</td></tr>
                <tr><td><strong>Invasion</strong></td><td>Bonus in Bodenkämpfen.</td></tr>
                <tr><td><strong>Kriegspunkte</strong></td><td>Mehr KP in Kämpfen gewonnen.</td></tr>
            </table>

            <h2 id="choisir">Welche Forschungen priorisieren?</h2>
            <ul>
                <li><strong>Wirtschaftsallianz</strong> (Die Waage) → Produktion, Forschungsgeschwindigkeit, Frachter.</li>
                <li><strong>Offensive Allianz</strong> (Das Bollwerk) → Bewaffnung, Invasion, Legionärangriff.</li>
                <li><strong>Defensive Allianz</strong> (Der Hammer) → Arbeiterproduktion, Mech-Verteidigung, Bargen.</li>
            </ul>
            <p>Vor dem Start im Allianzsalon besprechen: Es ist eine kollektive Entscheidung.</p>

    salon:
        title: "Der Allianzsalon"
        category: "alliance"
        order: 7
        tags: "salon,chat,diskussion,allianz,nachricht"
        summary: "Der interne Chat deiner Allianz: Echtzeit, Verlauf und strategische Basis."
        related: "alliance_basics,alliance_grades,reports"
        body: |
            <h2 id="fonctionnement">Wie es funktioniert</h2>
            <p>Der <strong>Allianzsalon</strong> ist ein Echtzeit-Chat, der den Mitgliedern deiner Allianz vorbehalten ist. Zugänglich über die Seite <strong>Allianz → Salon</strong> (oder einen dedizierten Knopf im Menü).</p>
            <p>Die Nachrichten werden aufbewahrt: Du kannst im Verlauf zurückgehen, um eine Information wiederzufinden.</p>

            <h2 id="usage">Wozu es dient</h2>
            <ul>
                <li><strong>Angriffe koordinieren</strong> — zu zweit einen Raid zu starten ist besser als einer allein, der zurückgeschlagen wird.</li>
                <li><strong>Alarmieren</strong>, falls eine feindliche Flotte entdeckt wird.</li>
                <li><strong>Koordinaten teilen</strong> (Zielplaneten, interessante Trümmerfelder) — im Format <code>Galaxie:Sektor:Position</code> geschrieben (z. B. <code>1:15:25</code>), werden sie automatisch anklickbar, genau wie ein Link zu einer Spielseite.</li>
                <li><strong>Die Allianzstrategie</strong> besprechen (Forschungen, Diplomatie, Kriege).</li>
                <li>Sich den <strong>neuen Mitgliedern vorstellen</strong> und Verbindungen knüpfen.</li>
            </ul>

            <h2 id="bonnes-pratiques">Gute Praktiken</h2>
            <ul>
                <li>Bleib respektvoll — Beleidigungen und Belästigung können vom Admin sanktioniert werden.</li>
                <li>Vermeide Spamming: Lass Platz für strategische Diskussionen.</li>
                <li>Erwähne die Nicknames der betroffenen Mitglieder, wenn du ihre Aufmerksamkeit möchtest.</li>
                <li>Mentale Archivierung: Wenn ein Rat erteilt wird, behalte ihn im Hinterkopf — die Nachrichten rollen schnell vorbei.</li>
            </ul>

            <h2 id="messages-prives">Und die privaten Nachrichten?</h2>
            <p>Abgesehen vom Salon kannst du jedem Spieler des Servers eine <strong>private Nachricht</strong> senden (auch außerhalb deiner Allianz). Nützlich für stille Diplomatie oder um diskret auf einen Vorschlag zu antworten. Koordinaten und Spiel-Links werden dort genauso anklickbar wie im Salon.</p>

    alliance_improvements:
        title: "Allianzverbesserungen"
        category: "alliance"
        order: 8
        tags: "verbesserungen,allianz,bonus,bitcoin,investition,kollektiv,stufen"
        summary: "Investiere Bitcoin, um 16 kollektive Boni zu entsperren, die deine gesamte Allianz stärken — Forschungsgeschwindigkeit, Produktion, Kampfstärke und mehr."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="uebersicht">Übersicht</h2>
            <p>Der Tab <strong>Verbesserungen</strong> auf der Allianzseite ermöglicht es Mitgliedern, Bitcoin zu investieren, um <strong>16 kollektive Boni</strong> freizuschalten und zu verbessern. Diese Boni kommen <strong>allen aktiven Mitgliedern</strong> der Allianz zugute. Ein Spieler, der die Allianz verlässt, profitiert nicht mehr davon, aber die Allianz behält ihre erreichten Stufen.</p>

            <h2 id="kontingent">Investitionskontingent</h2>
            <p>Jedes Mitglied verfügt über ein Kontingent von <strong>20 Investitionen pro gleitendem 3-Stunden-Fenster</strong>. Nicht genutzte Investitionen verfallen — das Kontingent akkumuliert sich nicht. Jede Investition kostet <strong>1.000 Bitcoin</strong>, die vom persönlichen Guthaben abgezogen werden (eine dauerhafte Geldsenke).</p>
            <p>In der Oberfläche ermöglichen Schnellschaltflächen <strong>×1 / ×5 / ×10</strong> unter jedem Bonus sofortige Mehrfach-Investitionen per Klick.</p>

            <h2 id="stufen">Stufen und Schwellenwerte</h2>
            <p>Jeder Bonus hat <strong>5 Stufen</strong>. Die erforderlichen Investitionsschwellen für die nächste Stufe sind:</p>
            <table>
                <tr><th>Stufe</th><th>Erforderliche Investitionen</th></tr>
                <tr><td>1</td><td>400</td></tr>
                <tr><td>2</td><td>500</td></tr>
                <tr><td>3</td><td>660</td></tr>
                <tr><td>4</td><td>800</td></tr>
                <tr><td>5</td><td>1.000</td></tr>
            </table>
            <p>⚠️ Investitionen über den Schwellenwert einer Stufe hinaus gehen <strong>verloren</strong> — es gibt keinen Übertrag auf die nächste Stufe.</p>

            <h2 id="boni">Die 16 Boni und ihre Effekte</h2>
            <table>
                <tr><th>Bonus</th><th>Effekt pro Stufe</th><th>Maximum (Stufe 5)</th></tr>
                <tr><td><strong>Forschungsgeschwindigkeit</strong></td><td>+2 % pro Stufe</td><td>+10 %</td></tr>
                <tr><td><strong>Forschungskosten</strong></td><td>−1 % pro Stufe</td><td>−5 %</td></tr>
                <tr><td><strong>Baubeschleunigung</strong></td><td>+15 s Reduktion pro Helfer</td><td>75 s Reduktion pro Helfer</td></tr>
                <tr><td><strong>Baukosten</strong></td><td>−1 % pro Stufe</td><td>−5 %</td></tr>
                <tr><td><strong>Niobiumproduktion</strong></td><td>+2 % pro Stufe</td><td>+10 %</td></tr>
                <tr><td><strong>Wasserproduktion</strong></td><td>+2 % pro Stufe</td><td>+10 %</td></tr>
                <tr><td><strong>Rationenproduktion</strong></td><td>+2 % pro Stufe</td><td>+10 %</td></tr>
                <tr><td><strong>Flottengeschwindigkeit</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Raketenstärke</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Laserstärke</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Plasmastärke</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Treffergenauigkeit</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Flottenrüstung</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Schild</strong></td><td>+1 % pro Stufe</td><td>+5 %</td></tr>
                <tr><td><strong>Planetenverteidigung</strong></td><td>+2 % pro Stufe</td><td>+10 %</td></tr>
                <tr><td><strong>Helden-Erfahrung</strong></td><td>+2 %/Stufe</td><td>+10 %</td></tr>
            </table>
            <p>Die <strong>Baubeschleunigung</strong> speist direkt die Funktion <a href="/wiki/alliance_construction_help">Bauhilfe</a>: Je höher ihre Stufe, desto mehr reduziert jede Hilfe eines Verbündeten die Bauzeit.</p>

    alliance_construction_help:
        title: "Bauhilfe"
        category: "alliance"
        order: 9
        tags: "bauhilfe,bau,allianz,boost,gebaeude,hilfe,beschleunigung"
        summary: "Ein Klick, um alle laufenden Bauprojekte deiner Verbündeten auf einmal zu beschleunigen — und sie tun das Gleiche für dich."
        related: "alliance_improvements"
        body: |
            <h2 id="uebersicht">Übersicht</h2>
            <p>Die <strong>Bauhilfe</strong> ermöglicht es Allianzm­itgliedern, laufende Bauprojekte ihrer Verbündeten mit einem einzigen Klick zu beschleunigen. Wenn ein oder mehrere Verbündete ein aktives Bauprojekt auf ihrem Planeten haben, erscheint ein <strong>Hilfe-Symbol</strong> (Herz) in der globalen Benutzeroberfläche. Der Badge zeigt die Anzahl der förderbaren Bauprojekte.</p>
            <p>Ein Klick auf das Symbol beschleunigt automatisch <strong>alle förderbaren Bauprojekte</strong> der Allianz auf einmal — ohne einzelne Auswahl.</p>

            <h2 id="gewinn">Gewinn pro Hilfe</h2>
            <p>Jede Hilfsaktion reduziert die verbleibende Bauzeit um:</p>
            <blockquote><strong>15 Sekunden × Stufe des Bonus „Baubeschleunigung"</strong></blockquote>
            <p>Der Gewinn ist <strong>auf 75 Sekunden</strong> pro Hilfe und Mitglied begrenzt (Stufe 5 × 15 s = 75 s). Ein Bauprojekt kann durch Hilfe nie unter <strong>30 Sekunden Restzeit</strong> fallen.</p>
            <table>
                <tr><th>Bonusstufe</th><th>Gewinn pro Hilfe</th></tr>
                <tr><td>0 (nicht freigeschaltet)</td><td>15 s</td></tr>
                <tr><td>1</td><td>15 s</td></tr>
                <tr><td>2</td><td>30 s</td></tr>
                <tr><td>3</td><td>45 s</td></tr>
                <tr><td>4</td><td>60 s</td></tr>
                <tr><td>5</td><td>75 s</td></tr>
            </table>

            <h2 id="foerderbedingungen">Förderbedingungen</h2>
            <p>Damit ein Bauprojekt gefördert werden kann, müssen beide Bedingungen erfüllt sein:</p>
            <ul>
                <li><strong>Gesamtdauer &gt; 30 Sekunden</strong> (vom Beginn bis zur geplanten Fertigstellung).</li>
                <li><strong>Verbleibende Zeit &gt; 30 Sekunden</strong> zum Zeitpunkt der Hilfeleistung.</li>
            </ul>
            <p>Fast abgeschlossene Bauprojekte (weniger als 30 s verbleibend) profitieren nicht von der Hilfe.</p>

            <h2 id="deduplizierung">Deduplizierung</h2>
            <p>Ein Mitglied kann <strong>jedes Bauprojekt nur einmal</strong> unterstützen. Das Symbol verschwindet automatisch, wenn es keine Projekte mehr gibt, die du noch nicht unterstützt hast. Mehrere Mitglieder können dasselbe Bauprojekt unterstützen — die Gewinne addieren sich: 3 Mitglieder auf Stufe 3 tragen je 45 s bei, insgesamt 135 s.</p>

            <h2 id="verknuepfung">Zusammenhang mit Allianzverbesserungen</h2>
            <p>Der Gewinn pro Hilfe hängt direkt von der Stufe des Bonus <strong>„Baubeschleunigung"</strong> im Tab <a href="/wiki/alliance_improvements">Verbesserungen</a> ab. Das Investieren in diesen Bonus kommt allen zugute: Je schneller deine Verbündeten ihre Gebäude fertigstellen, desto schneller wächst das Allianzemp­ire.</p>

    leveling:
        title: "Stufen und Erfahrung"
        category: "progression"
        order: 1
        tags: "stufe,erfahrung,fortschritt,level,score"
        summary: "Dein Fortschritt von Stufe 1 bis 40, basierend auf der Größe deines Imperiums."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Was für deinen Score zählt</h2>
            <p>Dein Score (oder „Kommandeurspunkte") spiegelt die <strong>Gesamtgröße deines Imperiums</strong> wider:</p>
            <ul>
                <li>Anzahl der <strong>Arbeiter</strong>.</li>
                <li>Anzahl und Qualität der <strong>Schiffe</strong>.</li>
                <li>Anzahl der <strong>Truppen</strong> (Legionäre, Mechs).</li>
                <li>Stufe der gebauten <strong>Gebäude</strong>.</li>
            </ul>
            <p>Schiffe zählen stark, Gebäude zählen viel. Eine Flotte im Kampf zu verlieren lässt deinen Score sinken.</p>

            <h2 id="seuils">Die Stufenschwellen</h2>
            <table>
                <tr><th>Stufe</th><th>Benötigte Erfahrung</th></tr>
                <tr><td>1</td><td>0</td></tr>
                <tr><td>5</td><td>100&nbsp;000</td></tr>
                <tr><td>10</td><td>800&nbsp;000</td></tr>
                <tr><td>15</td><td>5&nbsp;000&nbsp;000</td></tr>
                <tr><td>20</td><td>18&nbsp;000&nbsp;000</td></tr>
                <tr><td>25</td><td>100&nbsp;000&nbsp;000</td></tr>
                <tr><td>30</td><td>1&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>35</td><td>25&nbsp;000&nbsp;000&nbsp;000</td></tr>
                <tr><td>40</td><td>200&nbsp;000&nbsp;000&nbsp;000</td></tr>
            </table>
            <p>Der Fortschritt ist <strong>exponentiell</strong>: Von Stufe 1 auf 10 zu steigen geht viel schneller als von 30 auf 40.</p>

            <h2 id="utilite">Wozu deine Stufe dient</h2>
            <ul>
                <li><strong>Server-Rangliste</strong> — ein öffentlicher Indikator deiner Stärke.</li>
                <li><strong>Login-Bonus</strong> — der tägliche Gewinn hängt von deiner Stufe ab.</li>
                <li><strong>Anerkennung</strong> — eine hohe Stufe beeindruckt Freunde und Feinde.</li>
            </ul>

    war_points:
        title: "Kriegspunkte (KP)"
        category: "progression"
        order: 2
        tags: "kp,punkte,krieg,kampf,rangliste"
        summary: "Die zweite Währung des Spiels, im Kampf erworben. Dient als Maßstab für deine Aggressivität."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Was sind KP?</h2>
            <p>Die <strong>Kriegspunkte</strong> (<strong>KP</strong>) sind eine zweite „Währung" des Fortschritts, <strong>kampforientiert</strong>. Während deine Stufe deine Größe widerspiegelt, spiegeln deine KP deine militärische Aktivität wider.</p>

            <h2 id="gagner">Wie man sie verdient</h2>
            <ul>
                <li><strong>Raumkämpfe</strong> — die KP hängen von der zerstörten feindlichen Stärke ab, nie von deinen eigenen Verlusten. Eine Cthulhu-Horde oder eine Alien-Flotte zu vernichten bringt deutlich weniger als eine Spielerflotte gleicher Stärke (Schutz gegen Farmen).</li>
                <li><strong>Einen Raumkampf verlieren</strong> — ein Trostpreis wird trotzdem ausgezahlt, im Verhältnis zur Signatur der verlorenen Flotte, aber stets deutlich unter dem, was ein Sieger für eine identische Flotte erhält: ein Fünftel dieses Gewinns, nie mehr.</li>
                <li><strong>Orbitalverteidigung</strong> — wenn deine Geschütztürme eine Flotte im Orbit vernichten, im selben Verhältnis wie ein Raumsieg (deutlich weniger gegen einen Cthulhu). Die Verteidigung eines fremden Planeten dem Erdboden gleichzumachen bringt dem Angreifer dagegen noch nichts.</li>
                <li><strong>Raids und Invasionen</strong> — jeder Sieg am Boden bringt KP.</li>
                <li><strong>Tägliche Quests</strong> — einige geben KP. Die <strong>3 des Tages erledigt = +250 KP-Bonus</strong>.</li>
                <li><strong>Arena (Heldenduelle)</strong> — 50 bis 200 KP pro Sieg.</li>
                <li><strong>Verteidigung gegen die Cthulhu</strong> — Sieg im Tower Defense oder in einer Cthulhu-Invasion.</li>
                <li><strong>Gefängnis</strong> — einen gefangenen Helden hinrichten (mit Maßen).</li>
            </ul>

            <h2 id="utilite">Wozu sie dienen</h2>
            <ul>
                <li><strong>Bestimmte Forschungen freischalten</strong>, die KP als Voraussetzung fordern.</li>
                <li><strong>KP-Rangliste</strong> (militärisch) — Maßstab deiner Aggressivität auf dem Server.</li>
                <li><strong>Einen Gefangenen foltern</strong> im Gefängnis (kostet KP, um die Position eines feindlichen Planeten zu enthüllen).</li>
                <li><strong>Gewichteter Score</strong> in bestimmten Servermodi (wie Paid Server).</li>
            </ul>

            <h2 id="strategie">Strategie</h2>
            <p>KP belohnen <strong>aggressive</strong> Spieler. Wenn du die militärische Rangliste hochklettern willst, konzentriere dich auf Raumkämpfe und Invasionen statt auf reines wirtschaftliches Wachstum.</p>

    quests:
        title: "Tägliche Quests"
        category: "progression"
        order: 3
        tags: "quests,taeglich,mission,belohnung,kp"
        summary: "3 kleine Missionen jeden Tag. Einfach, schnell, und ein Bonus von 250 KP, wenn du sie alle machst."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Jeden Tag um <strong>18:59 UTC</strong> weist dir das Spiel <strong>3 tägliche Quests</strong> zu. Das sind kleine Aufgaben, die du während deiner normalen Spielsitzung erledigen kannst.</p>

            <h2 id="types">Beispiele für Quests</h2>
            <ul>
                <li>Einen Planeten ausspionieren.</li>
                <li>Ressourcen an einen Händler verkaufen.</li>
                <li>Einen neuen Planeten besiedeln.</li>
                <li>Eine Stadt / Metropole bauen oder aufstufen.</li>
                <li>Eine private Nachricht an einen anderen Spieler senden.</li>
                <li>Eine Nachricht im Allianzsalon posten.</li>
                <li>Eine bestimmte Anzahl KP im Kampf erlangen.</li>
                <li>Ein Trümmerfeld recyceln.</li>
            </ul>

            <h2 id="recompense">Die Belohnungen</h2>
            <ul>
                <li>Jede erledigte Quest gibt <strong>KP</strong>: Die Belohnung entspricht dem Höchstwert aus dem Basiswert der Quest und 5&nbsp;% der durchschnittlichen Spielerpunkte auf dem Server — damit lohnt es sich auch noch, wenn dein Imperium riesig geworden ist.</li>
                <li>Wenn du <strong>alle 3 Quests</strong> vor dem nächsten Tagesbericht erledigst, erhältst du am nächsten Tag <strong>+250 KP-Bonus</strong>.</li>
            </ul>
            <p>Über 30 Tage sind das 7&nbsp;500 „gratis" KP zusätzlich, nur durch regelmäßiges Spielen.</p>

            <h2 id="consulter">Wo man sie sieht</h2>
            <p>Deine Quests des Tages werden auf der Seite <strong>Imperium</strong> angezeigt (oder in einem speziellen Kästchen je nach Version). Automatisch abgehakt im Laufe der Aktionen.</p>

    ranking:
        title: "Die Ranglisten"
        category: "progression"
        order: 4
        tags: "rangliste,rang,position,top,leaderboard"
        summary: "Mehrere Ranglisten, um deinen Fortschritt (und den deiner Rivalen) zu messen."
        related: "war_points,leveling,quests"
        body: |
            <h2 id="types">Die verfügbaren Ranglisten</h2>
            <table>
                <tr><th>Rangliste</th><th>Basiert auf</th><th>Belohnung</th></tr>
                <tr><td><strong>Punkte (Imperium)</strong></td><td>Gesamtgröße deines Imperiums (Arbeiter, Schiffe, Truppen, Gebäude, Verteidigungsanlagen).</td><td>Prestige.</td></tr>
                <tr><td><strong>Kriegspunkte</strong></td><td>Militärische Aktivität (Kämpfe, Raids, Invasionen).</td><td>Militärisches Prestige.</td></tr>
                <tr><td><strong>Allianz</strong></td><td>Summe der Punkte aller Allianzmitglieder.</td><td>Krönt die stärkste Allianz.</td></tr>
                <tr><td><strong>Arena (Helden)</strong></td><td>Sieg-/Niederlage-Verhältnis in Duellen (mindestens 5 Kämpfe).</td><td>Wöchentliche Belohnungen für die Top 3.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Beste TD-Scores des Servers.</td><td>Prestige.</td></tr>
            </table>

            <h2 id="consulter">Wo man sie sieht</h2>
            <p>Seite <strong>Rangliste</strong> im linken Menü. Du kannst nach Typ filtern, einen Spieler oder eine Allianz suchen und deine eigene Position sehen.</p>

            <h2 id="utilite">Warum es wichtig ist</h2>
            <ul>
                <li><strong>Strategisch</strong> — identifiziere die großen Spieler, die du meiden oder angreifen solltest.</li>
                <li><strong>Sozial</strong> — Aushängeschild, um für deine Allianz zu rekrutieren.</li>
                <li><strong>Wettbewerb</strong> — in bestimmten Servermodi (Paid Server, Domination) entscheidet die Endrangliste den Sieger.</li>
            </ul>

    heroes:
        title: "Dein Held"
        category: "progression"
        order: 5
        tags: "held,bonus,planet,flotte,xp,gefangennahme,gefaengnis,spezialitaet"
        summary: "Dein persönlicher Held: Er entwickelt sich, kämpft, boostet dein Imperium und kann gefangen genommen werden."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Jeder Spieler besitzt <strong>einen einzigen Haupthelden</strong>, der zu Spielbeginn erstellt wird. Dieser Held muss <strong>immer</strong> entweder einem Planeten oder einer Flotte zugewiesen sein — niemals frei. Zusätzlich kannst du eine unbegrenzte Anzahl an <strong>Nebenhelden</strong> besitzen — siehe den eigenen Artikel dazu.</p>
            <p>Solange du keinen Haupthelden hast — zu Spielbeginn oder nachdem er im Gefängnis hingerichtet wurde —, führt dich das Spiel zu seiner Erstellung zurück: Die Spielseiten bleiben bis dahin geschlossen, die Seiten deines Kontos bleiben erreichbar. Besetzt einer deiner Nebenhelden den für den neuen Helden gewählten Planeten, kehrt er in die <strong>Reserve</strong> zurück.</p>
            <p>Der Held bringt Boni für Kampf, Intelligenz und Geschwindigkeit je nach seiner Spezialität und Stufe.</p>
            <p>Die 4 Fähigkeiten des Helden sind: <strong>Angriff</strong>, <strong>Verteidigung</strong>, <strong>Intelligenz</strong> und <strong>Geschwindigkeit</strong>.</p>
            <p><strong>Intelligenz</strong> verleiht einen Ressourcenproduktionsbonus auf Planeten und einen strategischen Vorteil in Arena-Duellen.</p>
            <p><strong>Geschwindigkeit</strong> reduziert die Flugzeit von Flotten und speist den Schwung im Arena-Duell.</p>

            <h2 id="specialites">Spezialitäten</h2>
            <p>Jede Spezialität gewährt einen passiven Bonus und schaltet 3 Eigenschaften auf den Stufen 5, 10 und 15 frei:</p>
            <ul>
                <li><strong>Militär</strong>: +5&nbsp;% Angriff und Verteidigung, in der Flotte wie am Boden (gegen Cthulhu und im PvP), und +5&nbsp;% Kraft im Arena-Duell. Eigenschaften: <strong>Einschüchterung</strong> (Stufe 5, der Gegner erleidet −5&nbsp;% Angriffskraft, auch gegen Cthulhu, und −5&nbsp;% Score im Duell), <strong>Taktiker</strong> (Stufe 10, +10&nbsp;% Kraft in der ersten Runde Ihrer Kämpfe und +10&nbsp;% im Duell), <strong>Kriegsherr</strong> (Stufe 15, −5&nbsp;% Verluste Ihrer Bodentruppen im Kampf zwischen Spielern und +5&nbsp;% Kraft im Duell).</li>
                <li><strong>Wirtschaft</strong>: verdoppelt die Intelligenz- (Produktion) und Sklavenlager-Boni. Eigenschaften: <strong>Effizient</strong> (Stufe 5, −10&nbsp;% Baukosten), <strong>Händler</strong> (Stufe 10, +15&nbsp;% beim Verkauf an Händler), <strong>Magnat</strong> (Stufe 15, +20&nbsp;% Produktion).</li>
                <li><strong>Forscher</strong>: +5&nbsp;% Flottenpräzision. Eigenschaften: <strong>Späher</strong> (Stufe 5, +1 Radarstärke auf dem zugewiesenen Planeten), <strong>Navigator</strong> (Stufe 10, +15&nbsp;% Flottengeschwindigkeit), <strong>Kartograf</strong> (Stufe 15, +2 Radarstärke auf dem zugewiesenen Planeten).</li>
            </ul>

            <p>Im <strong>Arena-Duell</strong> gelten dieselben Regeln: Das Militär behält seine +5&nbsp;% und seine drei Eigenschaften, die verdoppelte Intelligenz der Wirtschaft (plus 20&nbsp;% mit Magnat) speist die List, und die verdoppelte Geschwindigkeit des Forschers (plus 15&nbsp;% mit Navigator) speist den Schwung. List und Schwung zählen zu 60&nbsp;%.</p>
            <p>Bei der Heldenerstellung wird nun automatisch eine detaillierte Übersicht dieser Boni angezeigt.</p>

            <h2 id="xp">Erfahrungsgewinn</h2>
            <p>XP wird auf verschiedene Arten verdient:</p>
            <ul>
                <li><strong>Kampf</strong>: Fixes XP + proportional zur zerstörten feindlichen Stärke, geteilt durch die Heldenstufe (natürliches Scaling).</li>
                <li><strong>Arena-Duell</strong>: Basis-XP (30) multipliziert je nach Enge des Kampfes — ein knappes Duell bringt bis zu 3× mehr XP als ein überragender Sieg.</li>
                <li><strong>Passiv</strong>: +5 XP/Stunde, wenn der Held einem Planeten zugewiesen ist (berechnet mit der Ressourcenproduktion).</li>
            </ul>
            <p>Levelup-Formel: Benötigte XP = Stufe × 500. Bei jedem Level erhält der Spieler Fähigkeitspunkte zum Zuteilen.</p>

            <h2 id="assignation">Zuweisung</h2>
            <p>Weise deinen Helden von der Seite <strong>Planeten</strong> oder der Verwaltungsseite einer <strong>Flotte</strong> aus zu. Die Zuweisung erfolgt per AJAX ohne Seitenneuladen.</p>
            <p>Ein Held auf einer Flotte im Flug oder im Kampf kann nicht neu zugewiesen werden. Wenn die Flotte zerstört wird, wird der Held automatisch deinem Hauptplaneten zugewiesen.</p>

            <h2 id="capture">Gefangennahme</h2>
            <p>Ein Held kann im Kampf gefangen genommen werden:</p>
            <ul>
                <li><strong>Raumkampf</strong> (zerstörte Flotte): 20% Chance</li>
                <li><strong>Planeteninvasion</strong> (eingenommener Planet): 35% Chance</li>
            </ul>
            <p>Eine Gefangennahme erfordert ein <strong>Gefängnis der Stufe 1 oder höher</strong>: Der Held wird am Ort des Kampfes eingesperrt, wenn dieser Planet dir gehört und ein Gefängnis hat, sonst auf deinem Planeten mit dem höchsten Gefängnis. Ganz ohne Gefängnis gibt es keine Gefangennahme.</p>
            <p>Nach der Befreiung genießt der Held <strong>24h Immunität</strong> gegen erneute Gefangennahme.</p>
            <p>Die Cthulhu und Bots können keine Helden gefangen nehmen.</p>
            <p>Dieser Abschnitt beschreibt deinen <strong>Hauptheld</strong>en. Deine <strong>Nebenhelden</strong> folgen einer völlig anderen Regel zur Gefangennahme, ganz ohne Wahrscheinlichkeit — siehe den Artikel <em>Nebenhelden</em>.</p>

    secondary_heroes:
        title: "Nebenhelden"
        category: "progression"
        order: 6
        tags: "held,nebenheld,stall,gefangennahme,hinrichtung,gefaengnis,recycling,reserve,beute"
        summary: "Zusätzliche Helden, die als seltene Beute gewonnen werden: gleiche Boni wie dein Hauptheld, aber im Kampf endgültig gefangen oder hingerichtet werden können."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Ein Nebenheld bringt <strong>dieselben Boni</strong> wie ein Hauptheld, sobald er auf einem Planeten oder einer Flotte stationiert ist. Der Unterschied: Er kann bei einer Niederlage <strong>endgültig gefangen genommen oder getötet</strong> werden. Du kannst mehrere davon zusätzlich zu deinem Hauptheld ansammeln.</p>

            <h2 id="erwerb">Wie man sie bekommt</h2>
            <p>Ein Nebenheld ist <strong>seltene Beute</strong>, niemals käuflich:</p>
            <table>
                <tr><th>Quelle</th><th>Chance</th></tr>
                <tr><td>Sieg im Tower Defense Cthulhu (pro Durchlauf)</td><td>2&nbsp;%</td></tr>
                <tr><td>Abgewehrter Cthulhu-Angriff auf einem deiner Planeten</td><td>1&nbsp;%</td></tr>
                <tr><td>Gewinner eines Arena-Turniers</td><td>25&nbsp;%</td></tr>
            </table>
            <p>Beim Erwerb werden Name und Spezialität zufällig ausgelost, und er landet direkt in der <strong>Reserve</strong> — es liegt an dir, zu entscheiden, wo du ihn einsetzt, oder ihn zu recyceln, ohne ihn je zu platzieren.</p>

            <p>Jeder erhaltene Held wird Ihnen durch einen <strong>Bericht</strong> angekündigt, der angibt, woher er stammt. Der Tower-Defense-Endbildschirm und der Cthulhu-Siegesbericht weisen ebenfalls sofort darauf hin.</p>

            <h2 id="platzierung">Wo man sie platziert</h2>
            <p>Wie dein Hauptheld: <strong>ein Planet</strong> oder <strong>eine Flotte</strong>, nie beides gleichzeitig. Ein nicht platzierter Nebenheld bleibt in der <strong>Reserve</strong>: kein Bonus, aber auch <strong>kein Risiko</strong> — das ist eine normale Wahl, kein zu korrigierendes Versehen. Verwalte alle deine Nebenhelden über den Tab <strong>Stall</strong> auf der Heldenseite.</p>

            <h2 id="verwaltung">Fähigkeiten und Ausrüstung</h2>
            <p>Ein Sekundärheld entwickelt sich wie der Hauptheld: Er steigt im Rang auf und erhält dabei <strong>Fähigkeitspunkte</strong>. Die Schaltfläche <strong>Verwalten</strong> im Stall öffnet ihre Verteilung auf Angriff, Verteidigung, Intelligenz und Geschwindigkeit.</p>
            <p>Dasselbe Fenster verwaltet seine <strong>Ausrüstung</strong>: Statten Sie ihn mit einem freien Gegenstand aus Ihrem Inventar aus oder nehmen Sie ihn wieder zurück. Die Gegenstände eines gefangenen feindlichen Helden kommen mit ihm — hier holen Sie sie zurück.</p>

            <h2 id="risiko">Was du riskierst</h2>
            <p>Ein platzierter Nebenheld kann <strong>endgültig</strong> verloren gehen bei:</p>
            <ul>
                <li>Einem verlorenen <strong>Raumkampf</strong> (seine Flotte wird zerstört).</li>
                <li>Einem verlorenen <strong>Utility-Kampf</strong> (eine völlig unbewaffnete Flotte, die ohne echten Kampf vernichtet wird).</li>
                <li>Einer erfolgreichen <strong>Invasion</strong> des Planeten, auf dem er stationiert ist.</li>
                <li>Der Vernichtung seiner Flotte durch die <strong>Orbitalabwehr</strong> eines Planeten im Angriffsmodus.</li>
            </ul>
            <p>Er riskiert hingegen <strong>nichts</strong> bei:</p>
            <ul>
                <li>Einem <strong>Raid</strong> — selbst ein erfolgreicher nimmt nie den Planeten ein.</li>
                <li>Einem Kampf gegen die <strong>Cthulhu</strong> (oder jeden anderen Nicht-Spieler-Gegner).</li>
                <li>Der <strong>Arena</strong> — Duelle und Turniere setzen niemals einen Helden der Gefangennahme aus.</li>
            </ul>

            <p>Eine <strong>Benachrichtigung</strong> warnt Sie, sobald einer Ihrer Sekundärhelden gefangen genommen oder hingerichtet wird: Ein endgültiger Verlust hängt nicht davon ab, ob Sie Ihren Bericht öffnen.</p>

            <h2 id="gefaengnis">Die Gefängnis-Bedingung</h2>
            <p>Anders als bei deinem Hauptheld (eine <em>wahrscheinlichkeitsbasierte</em> Gefangennahme, siehe den Artikel <em>Gefängnis und gefangene Helden</em>) ist das Schicksal eines besiegten Nebenhelden <strong>vollständig deterministisch</strong>, ganz ohne Zufall:</p>
            <ul>
                <li>Der Sieger besitzt ein <strong>Gefängnisgebäude</strong> auf Stufe 1 oder höher auf mindestens einem seiner Planeten → er <strong>nimmt den Helden gefangen</strong>, mit unverändertem Level, Erfahrung und Items.</li>
                <li>Der Sieger hat <strong>kein</strong> Gefängnis gebaut → der Held wird <strong>hingerichtet</strong>.</li>
            </ul>
            <p>In einem Blockkampf (mehrere Verbündete kämpfen Seite an Seite) geht der Held an den siegreichen Kommandanten, der <strong>am meisten Stärke eingesetzt hat</strong> — hat dieser kein Gefängnis, wird der Held hingerichtet, selbst wenn ein Verbündeter im selben Lager eines besaß.</p>
            <p>Ein gefangener Nebenheld ist <strong>kein</strong> klassischer Gefangener: keine Gefängnisseite, kein Fluchtminispiel, kein Lösegeld. Er landet direkt, aktiv, im Stall seines neuen Besitzers — bereit, erneut platziert oder recycelt zu werden.</p>

            <h2 id="keine-rueckgewinnung">Keine Rückgewinnung möglich</h2>
            <p>Einmal gefangen oder hingerichtet, ist ein Nebenheld <strong>endgültig</strong> verloren: weder Flucht, noch Lösegeld, noch Befreiung durch eine Invasion des früheren Besitzers können ihn zurückholen. Der einzige Weg, ihn wiederzusehen, ist, ihn selbst im Kampf zurückzuerobern — so kann er unbegrenzt zwischen Imperien zirkulieren.</p>

            <h2 id="identitaet">Ein gefangener Held behält seine Identität</h2>
            <p>Ein gefangener Nebenheld behält seinen <strong>Namen</strong>, sein <strong>Level</strong> und seine <strong>Erfahrung</strong>. In deinem Stall zeigt er seinen ursprünglichen Kommandanten an („Gefangen bei &hellip;“).</p>

            <h2 id="recycling">Recycling</h2>
            <p>Du kannst selbst einen deiner Nebenhelden <strong>hinrichten</strong>, um seine Erfahrung auf deinen Hauptheld zu übertragen, <strong>minus 10&nbsp;%</strong>. Vor der Bestätigung wird eine konkrete Vorschau angezeigt (übertragene XP, voraussichtliches Level des Hauptheld). <strong>Diese Aktion ist unwiderruflich.</strong></p>

    items:
        title: "Heldenitems"
        category: "progression"
        order: 6
        tags: "items,ausruestung,bonus,seltenheit,drop,cthulhu,fusion"
        summary: "Rüste deinen Helden mit bis zu 3 Items aus, um Boni zu kumulieren. Wie du sie erhältst."
        related: "heroes,cthulhus,arena"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Items sind Gegenstände, die auf deinem Helden ausrüstbar sind (maximal <strong>3 Items</strong>). Sie bringen verschiedene Boni, die zu den natürlichen Boni des Helden hinzukommen.</p>

            <h2 id="categories">Kategorien</h2>
            <ul>
                <li><strong>Offensiv</strong>: Waffen, angriffsorientierte Gegenstände</li>
                <li><strong>Defensiv</strong>: Rüstungen, Schilde, Schutz</li>
                <li><strong>Macht</strong>: Statusobjekte, gemischte Boni</li>
            </ul>
            <p>Keine Typ-Beschränkung: Du kannst 3 offensive ausrüsten, wenn du willst.</p>

            <h2 id="raretes">Seltenheiten</h2>
            <ul>
                <li><strong>Gewöhnlich</strong>: 1 Bonus (+2-5%)</li>
                <li><strong>Selten</strong>: 1-2 Boni (+5-10%)</li>
                <li><strong>Episch</strong>: 2-3 Boni (+10-15%)</li>
                <li><strong>Legendär</strong>: 3+ Boni (+15-25%)</li>
            </ul>

            <h2 id="bonus">Bonus-Arten</h2>
            <p>16 mögliche Bonus-Arten: Legionärstärke, Mech-Stärke, Flottenangriff, Flottenverteidigung, Präzision, Schild, Flottengeschwindigkeit, Ressourcenproduktion, Baugeschwindigkeit, Arbeiterproduktion, Schiffsproduktion, Radar, Recycling, Anti-Cthulhu-Bonus, Duellbonus, XP-Bonus.</p>

            <h2 id="obtention">Erhalt</h2>
            <p>Es gibt inzwischen vier Möglichkeiten, Items zu erhalten:</p>

            <h3>Cthulhu bekämpfen</h3>
            <p>Items können beim Besiegen von Cthulhu droppen – egal ob du ihre Landung am Boden zurückschlägst oder ihre Horde vollständig in der Umlaufbahn vernichtest, bevor sie landet. Die Drop-Rate ist in beiden Fällen gleich und hängt von der PvE-Schwierigkeit ab:</p>
            <ul>
                <li><strong>Leicht</strong>: 30% gewöhnlich, 8% selten, 1% episch</li>
                <li><strong>Normal</strong>: 40% gewöhnlich, 15% selten, 5% episch, 0,5% legendär</li>
                <li><strong>Schwer</strong>: 50% gewöhnlich, 25% selten, 10% episch, 2% legendär</li>
            </ul>
            <p>Eine nur teilweise zerstörte Horde landet trotzdem: Erst diese Landung löst dann den Item-Drop aus – niemals beides für dieselbe Welle.</p>

            <h3>Arenasiege</h3>
            <p>Jeder Sieg in einem Arena-Duell bietet eine Chance auf einen Item-Drop:</p>
            <ul>
                <li><strong>Gewöhnlich</strong>: 15%</li>
                <li><strong>Selten</strong>: 5%</li>
                <li><strong>Episch</strong>: 1%</li>
            </ul>

            <h3>Duelleinsätze</h3>
            <p>Beim Starten einer Herausforderung kannst du ein Item einsetzen. Wenn der Gegner akzeptiert, muss er ein Item gleicher Seltenheit einsetzen. Der Sieger gewinnt beide Items.</p>

            <h3>Drei Items fusionieren</h3>
            <p>Drei Items <strong>gleicher Seltenheit</strong> verschmelzen kostenlos und ohne Wartezeit zu einem Item der nächsthöheren Seltenheit. Kategorie und Boni des neuen Items werden zufällig bestimmt, genau wie bei einem Drop. Die drei ursprünglichen Items werden endgültig verbraucht, und ein von einem Helden getragenes Item muss zuerst abgelegt werden. Legendär ist die höchste Seltenheit: Sie kann nicht fusioniert werden.</p>
            <p>Die Fusion wird auf der Seite <strong>Kommandanten</strong> im Tab <strong>Fusion</strong> gestartet: Klicke drei Item-Karten an, um sie auszuwählen (die ganze Karte ist klickbar), und bestätige dann mit dem Fusions-Button, der sowohl über als auch unter der Liste verfügbar ist.</p>

            <h2 id="vol">Item-Diebstahl</h2>
            <p>Wenn dein Held gefangen genommen wird, riskieren seine ausgerüsteten Items, vom Sieger gestohlen zu werden. Diebstahlwahrscheinlichkeit: Gewöhnlich 80%, Selten 60%, Episch 40%, Legendär 25%.</p>

            <h2 id="inventaire">Inventar</h2>
            <p>Greife auf dein Inventar über die Seite <strong>Kommandanten</strong>, Tab <strong>Inventar</strong>, zu. Vom Inventar aus kannst du:</p>
            <ul>
                <li>Ein Item <strong>ausrüsten</strong> auf deinem Helden (wenn aktiv und weniger als 3 Items ausgerüstet)</li>
                <li>Ein Item <strong>ablegen</strong>, um es zurück ins Inventar zu bringen</li>
                <li>Ein Item <strong>zerstören</strong>, das du nicht mehr brauchst</li>
                <li>3 Items gleicher Seltenheit im benachbarten Tab <strong>Fusion</strong> zu einem Item der nächsthöheren Seltenheit <strong>fusionieren</strong></li>
            </ul>
            <p>Jedes Item wird als <strong>illustrierte Karte</strong> dargestellt, die sein Bild, seine Boni und einen je nach Seltenheit eingefärbten Rand zeigt. Die Karten werden in einem Raster angeordnet (3 bis 4 pro Zeile, je nach verfügbarem Platz auf Ihrem Bildschirm).</p>

    prison:
        title: "Gefängnis und gefangene Helden"
        category: "progression"
        order: 7
        tags: "gefaengnis,gefangennahme,held,flucht,folter,loesegeld,kerker,nebenheld"
        summary: "Was passiert, wenn ein Held gefangen genommen wird? Die Optionen des Gefangenen und des Wärters, sowie die direkte Gefangennahme feindlicher Nebenhelden."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Gefangennahme eines Helden</h2>
            <p>Ein Held wird bei einem Raumkampf (20%) oder einer Invasion (35%) gefangen genommen. Der gefangene Spieler wird eingesperrt: Jede Seite außerhalb des erlaubten Bereichs leitet ihn zur <strong>Gefängnisseite</strong> um. Er behält jedoch Zugang zum <strong>Allianz-Chat</strong>, zu seinen <strong>privaten Nachrichten</strong>, zu seinen <strong>Berichten</strong>, zur <strong>Ansicht</strong> (nur lesend) seiner Allianz und zur <strong>Verwaltung seines Kontos</strong>. Alles andere — Bauen, Flotten, die Karte, der Markt, die Arena und sogar die Heldenseite — bleibt gesperrt, bis er befreit wird.</p>
            <p>Eine Gefangennahme erfordert ein <strong>Gefängnis der Stufe 1 oder höher</strong>: Der Held wird am Ort des Kampfes eingesperrt, wenn dieser Planet dir gehört und ein Gefängnis hat, sonst auf deinem Planeten mit dem höchsten Gefängnis. Ganz ohne Gefängnis gibt es keine Gefangennahme.</p>

            <h2 id="prisonnier">Aktionen des Gefangenen</h2>
            <p>Alle <strong>4 Stunden</strong> kann der Gefangene eine Aktion durchführen:</p>
            <ul>
                <li><strong>Die Allianz alarmieren</strong> (70% Erfolg): Sendet die Gefängniskoordinaten in den Allianzsalon. Fehlschlag = der Wärter wird alarmiert. Ohne Allianz ist die Aktion nicht verfügbar. Nach einem Fehlschlag wartet die nächste Aktion 6 statt 4 Stunden.</li>
                <li><strong>Fliehen</strong>: ein Versuch alle 4 Stunden ab der Gefangennahme (der erste 4 Stunden danach). 40% Erfolg, +5% für je weitere 4 Stunden Gefangenschaft. Fehlschlag = der Kerkermeister wird alarmiert. Diese Frist ist unabhängig von den beiden anderen Aktionen.</li>
                <li><strong>Flucht dank Slash</strong>: jederzeit und unbegrenzt. Siehe den Artikel <em>Aus dem Gefängnis fliehen</em>.</li>
                <li><strong>Lösegeld zahlen</strong>: Hat der Kerkermeister eines gefordert, kannst du es auf der Gefängnisseite zahlen oder ablehnen.</li>
                <li><strong>Rebellieren</strong> (25% + Militärbonus): Sabotiert 5% der Ressourcen des Gefängnisses. Fehlschlag = Verlust einer Stufe. In beiden Fällen erhält der Kerkermeister einen Bericht.</li>
            </ul>

            <h2 id="geolier">Aktionen des Wärters</h2>
            <p>Zugänglich über das Gefängnis- oder Sklavenlager-Gebäude:</p>
            <ul>
                <li><strong>Hinrichten</strong>: Zerstört den Helden endgültig (+KP proportional zur Stufe). Items geborgen. Der Besitzer des Helden wird per Bericht informiert.</li>
                <li><strong>Freilassen</strong>: Diplomatische Geste, der Held kehrt zu seinem Besitzer zurück.</li>
                <li><strong>Foltern</strong> (Kosten: 200 KP): Enthüllt die Position eines feindlichen Planeten.</li>
                <li><strong>Lösegeld fordern</strong>: Ressourcen gegen Freilassung verlangen (24h zum Akzeptieren).</li>
            </ul>

            <h2 id="liberation">Befreiung</h2>
            <ul>
                <li><strong>Allianz des Gefangenen invadiert</strong>: automatische Befreiung</li>
                <li><strong>Andere Allianz invadiert</strong>: 60% Fluchtchance, sonst geht der Gefangene an den Invasor, wenn dieser ein Gefängnis besitzt, oder wird freigelassen</li>
                <li><strong>Cthulhu invadiert</strong>: alle Gefangenen werden befreit</li>
            </ul>

            <h2 id="secondaires">Einen feindlichen Nebenhelden gefangen nehmen</h2>
            <p>Alles Vorstehende — Flucht, Folter, Lösegeld, Freilassung — betrifft den <strong>Hauptheld</strong>en eines Gegners. Ein <strong>Nebenheld</strong> (siehe den Artikel <em>Nebenhelden</em>) folgt einer viel direkteren Regel, und genau dort erhält dein Gefängnisgebäude einen <strong>harten Zweck</strong>: Sobald du ein Gefängnis auf Stufe 1 oder höher auf einem deiner Planeten besitzt, wird jeder gegen dich besiegte feindliche Nebenheld (Raumkampf, Utility-Kampf oder erfolgreiche Invasion) <strong>sofort und endgültig</strong> dein Eigentum — mit unverändertem Level, Erfahrung und Items. Ohne Gefängnis wird er stattdessen <strong>hingerichtet</strong>.</p>
            <p>Ein gefangener Nebenheld ist <strong>kein</strong> Gefangener im Sinne dieser Seite: keine Gefängnisseite, keine Flucht, kein Lösegeld. Er landet direkt, aktiv, in deinem <strong>Stall</strong> — bereit, auf einem Planeten oder einer Flotte platziert oder recycelt zu werden.</p>

            <h2 id="prerequis">Voraussetzungen</h2>
            <p>Forschung <strong>Gefängnis</strong> (benötigt Stacheldraht Stufe 5), dann die Gebäude <strong>Gefängnis</strong> und <strong>Sklavenlager</strong>.</p>

    prison_escape:
        title: "Aus dem Gefängnis fliehen"
        category: "progression"
        order: 8
        tags: "gefaengnis,flucht,slash,loesegeld,held,gefangennahme"
        summary: "Die drei Wege, aus eigener Kraft aus dem Gefängnis zu kommen: Sofortflucht, Slash und Lösegeld."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Drei Auswege</h2>
            <p>Wird dein Held gefangen genommen, bietet dir die Gefängnisseite drei Auswege, ohne auf deine Verbündeten zu warten. Das Flucht-Minispiel wurde entfernt.</p>

            <h2 id="instant">Sofortflucht</h2>
            <ul>
                <li>Ein Versuch alle <strong>4 Stunden</strong>. Der erste öffnet sich 4 Stunden nach der Gefangennahme.</li>
                <li><strong>40%</strong> Erfolg beim ersten Versuch, dann <strong>+5%</strong> für je weitere 4 Stunden Gefangenschaft, ob du es versucht hast oder nicht.</li>
                <li>Die Chance des nächsten Versuchs steht auf dem Knopf.</li>
                <li>Fehlschlag: Dein Held bleibt im Gefängnis und <strong>der Kerkermeister wird alarmiert</strong>.</li>
            </ul>

            <h2 id="slash">Flucht dank Slash</h2>
            <p><strong>Slash</strong> ist unser anderes Spiel (slash-game.com). Spiele es mit <strong>derselben E-Mail-Adresse</strong> wie dein Area-Universe-Konto, auf beiden Seiten bestätigt.</p>
            <ul>
                <li>Erreiche <strong>75% des besten Wochenergebnisses</strong> in einer Partie, die du <strong>nach deiner Gefangennahme</strong> gespielt hast.</li>
                <li>Solange die laufende Woche (seit Montag 00:00 UTC) weniger als 10 platzierte Spieler zählt oder ihr bestes Ergebnis unter 50 Punkten liegt, gilt das beste Ergebnis der Vorwoche.</li>
                <li>Kehre zur Gefängnisseite zurück und klicke auf <strong>Mein Ergebnis prüfen</strong>: Dein Held wird befreit.</li>
                <li><strong>Unbegrenzte</strong> Versuche, ohne Wartezeit.</li>
                <li>Ein Gastkonto oder eine unbestätigte Adresse kann diesen Ausweg nicht nutzen.</li>
            </ul>

            <h2 id="ransom">Lösegeld zahlen</h2>
            <p>Fordert der Kerkermeister ein Lösegeld, erscheint es auf der Gefängnisseite mit Betrag und Frist (24 Stunden). Du kannst es <strong>zahlen</strong> oder <strong>ablehnen</strong>. Die Ressourcen werden von allen deinen Planeten abgezogen und dem Kerkermeister gutgeschrieben. Reichen deine Ressourcen nicht, wird die Zahlung abgelehnt und nichts abgezogen.</p>

            <h2 id="after">Nach der Befreiung</h2>
            <p>Dein Held kehrt mit seinen verbliebenen Items auf einen deiner Planeten zurück und erhält <strong>24 Stunden Immunität</strong> gegen eine erneute Gefangennahme.</p>

    arena:
        title: "PvP-Arena"
        category: "progression"
        order: 8
        tags: "arena,duell,turnier,pvp,held,herausforderung,rangliste"
        summary: "Fordere andere Helden in 1-gegen-1-Duellen heraus. Setze Uran oder Items ein, gewinne Prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Herausforderungssystem</h2>
            <p>Von der <strong>Arena</strong>-Seite aus forderst du einen anderen Spieler heraus. Der Herausgeforderte erhält eine Benachrichtigung und kann die Herausforderung <strong>annehmen</strong> oder <strong>ablehnen</strong>.</p>
            <ul>
                <li>Eine Herausforderung läuft automatisch nach <strong>7 Tagen</strong> ohne Antwort ab. Die Zahl der erhaltenen, noch offenen Herausforderungen wird auf dem Arena-Tab und beim Menüeintrag „Held“ angezeigt. Die verbleibende Zeit bis zum Ablauf steht neben jeder erhaltenen Herausforderung. Nach dem Ablauf kannst du denselben Spieler erneut herausfordern.</li>
                <li>Du kannst eine von dir gesendete Herausforderung <strong>abbrechen</strong>, solange sie noch aussteht.</li>
                <li>Cooldown: <strong>1h</strong> zwischen zwei Duellen für denselben Spieler. Er wird beim Senden der Herausforderung <strong>und</strong> bei der Annahme geprüft, für beide Helden: Mehrere ausstehende Herausforderungen anzuhäufen ermöglicht daher keine Duelle hintereinander.</li>
                <li>Ein gefangener Held kann weder herausfordern noch herausgefordert werden. Gefangennahme und Zugehörigkeit zur selben Allianz werden bei der Annahme erneut geprüft.</li>
                <li>Der Held ist nie in Gefahr (keine Gefangennahme in der Arena).</li>
            </ul>

            <h2 id="combat">Kampfauflösung</h2>
            <p>Wenn der Herausgeforderte annimmt, wird der Kampf <strong>sofort</strong> aufgelöst und das Ergebnis erscheint auf dem Bildschirm des Spielers, der angenommen hat: Sieg oder Niederlage, beide Punktzahlen, Belohnungen sowie der gewonnene oder verlorene Einsatz. Beide Spieler erhalten außerdem einen Bericht. Die Punktzahl basiert auf:</p>
            <ul>
                <li><strong>Stufe</strong> des Helden: die Grundlage des Scores</li>
                <li><strong>Offensive</strong>: Angriff des Helden, +5&nbsp;% beim Militär, und die offensiven Boni seiner Items</li>
                <li><strong>Defensive</strong>: Verteidigung des Helden und die defensiven Boni seiner Items</li>
                <li><strong>List</strong> (Gewicht 60&nbsp;%): Intelligenz — für die Wirtschaft verdoppelt, +20&nbsp;% mit der Eigenschaft Magnat — und die Nutz-Boni der Items (Produktion, Bau, Recycling, Radar)</li>
                <li><strong>Schwung</strong> (Gewicht 60&nbsp;%): Geschwindigkeit — für Forscher verdoppelt, +15&nbsp;% mit der Eigenschaft Navigator — und die Flottengeschwindigkeit der Items</li>
                <li><strong>Militärische Eigenschaften</strong>: Taktiker +10&nbsp;%, Kriegsherr +5&nbsp;%, und Einschüchterung nimmt dem Gegner 5&nbsp;% Kraft</li>
                <li><strong>Spezialität</strong>: Stein-Schere-Papier-Vorteil (Militär &gt; Forscher &gt; Wirtschaft &gt; Militär, +10&nbsp;%)</li>
                <li><strong>Zufallsfaktor</strong> von ±15&nbsp;% auf jeder Seite</li>
            </ul>

            <h2 id="mises">Einsätze</h2>
            <p>Beim Starten einer Herausforderung kannst du einen optionalen Einsatz hinzufügen:</p>
            <ul>
                <li><strong>Uran</strong>: Jeder Spieler setzt denselben Betrag ein. Der Sieger gewinnt beide Einsätze.</li>
                <li><strong>Item</strong>: Jeder Spieler setzt ein Item gleicher Seltenheit ein. Der Sieger gewinnt beide Items. Das Item muss (auf beiden Seiten) <strong>abgelegt</strong> sein und kann nicht gleichzeitig in zwei ausstehenden Herausforderungen eingesetzt werden.</li>
                <li><strong>Freundschaftlich</strong>: ohne Einsatz, nur die Basisbelohnungen werden vergeben.</li>
            </ul>
            <p>Der Einsatz ist gedeckt, wenn mindestens einer deiner Planeten das benötigte Uran besitzt: Es wird von deinem uranreichsten Planeten abgezogen. Wenn ein Spieler bei Annahme auf keinem Planeten mehr genug Uran hat, scheitert die Herausforderung. Wenn das vom Herausforderer eingesetzte Item bei der Annahme durch den Herausgeforderten nicht mehr verfügbar ist (gehört ihm nicht mehr oder ist ausgerüstet), wird das Duell abgelehnt.</p>

            <h2 id="recompenses">Basisbelohnungen</h2>
            <p>Der Sieger erhält bei jedem Duell:</p>
            <ul>
                <li>Uran: proportional zur durchschnittlichen Stufe der Kämpfer, <strong>maximal 20</strong> pro Duell</li>
                <li>Kriegspunkte: proportional zur Stufe des Siegers (etwa 225 auf Stufe 15), reduziert bei großem Stufenunterschied</li>
                <li>Item-Chance: 15% gewöhnlich, 5% selten, 1% episch</li>
            </ul>
            <p>Der Verlierer verliert nichts (außer seinem eventuellen Einsatz).</p>

            <h2 id="classement">Rangliste</h2>
            <p>Eine Rangliste pro Server zeigt die besten Duellanten:</p>
            <ul>
                <li>Basiert auf dem Sieg/Niederlage-Verhältnis</li>
                <li>Mindestens <strong>5 Kämpfe</strong>, um zu erscheinen</li>
                <li>Die <strong>Top 5</strong> sind direkt auf der Seite sichtbar; ein Knopf ermöglicht es, die vollständige Rangliste mit Paginierung und Sortierung zu öffnen</li>
                <li>Wöchentliche Belohnungen werden jeden <strong>Montag</strong> automatisch für die Vorwoche (Montag bis Sonntag) einmalig ausgezahlt: Top 3 nach <strong>Anzahl der Duellsiege</strong> der Woche, mit mindestens <strong>5 Duellen</strong> in der Woche. Nur Spieler werden gewertet (weder KI-Kommandanten noch gelöschte Konten). 1. = 3000 Uran + 300 KP, 2. = 2000 + 200 KP, 3. = 1000 + 100 KP. Jeder belohnte Spieler erhält einen Bericht.</li>
            </ul>

            <h2 id="tournois">Turniere</h2>
            <p>Periodisches Serverevent: ein Turnier alle <strong>7 Tage</strong> pro Server.</p>
            <ul>
                <li>Die Anmeldung ist <strong>24h</strong> lang über die Arena-Seite geöffnet. Ein gefangener Held kann sich nicht anmelden und wird ausgeschlossen, wenn er vor dem Start gefangen wird.</li>
                <li>Danach folgt ein automatisches K.-o.-System mit zufälliger Auslosung (bei ungerader Zahl erhält ein Spieler ein Freilos) und einem Spiel um Platz 3 zwischen den beiden Verlierern der Halbfinals.</li>
                <li>Es werden mindestens <strong>2 Teilnehmer</strong> benötigt: Andernfalls wird das Turnier abgesagt (keine Belohnungen) und die Angemeldeten per Bericht informiert. Bei nur einem angemeldeten Spieler findet das Turnier statt, wenn ein KI-Kommandant den Turnierbaum auffüllen kann.</li>
                <li>Sobald mindestens ein Spieler angemeldet ist, füllen die <strong>KI-Kommandanten</strong> des Servers (Haupthelden, nicht gefangen) den Turnierbaum auf insgesamt <strong>8 Teilnehmer</strong> auf. Sie melden sich nach und nach während der 24h Anmeldung an, und der Turnierbaum wird bei Anmeldeschluss aufgefüllt, falls noch welche fehlen.</li>
                <li>Sind <strong>8 oder mehr Spieler</strong> angemeldet, nimmt kein KI-Kommandant teil. Ohne angemeldeten Spieler findet das Turnier nicht statt: KI-Kommandanten spielen nie untereinander.</li>
                <li>Jeder Kampf des Turniers bringt seinem Sieger außerdem die üblichen Duellbelohnungen.</li>
                <li>KI-Kommandanten kämpfen um das Podium und erhalten dieselben Belohnungen wie Spieler, außer der Chance auf einen Sekundärhelden.</li>
                <li>Der Champion behält eine Chance von 25 % auf einen Sekundärhelden (nur für Spieler).</li>
            </ul>
            <p>Belohnungen:</p>
            <ul>
                <li>1. = 5000 Uran + 500 KP + 1 episches Item (20 % Chance auf ein zusätzliches legendäres Item)</li>
                <li>2. = 3000 Uran + 300 KP + 1 seltenes Item (10 % Chance auf ein zusätzliches episches Item)</li>
                <li>3. = 1500 Uran + 150 KP + 1 seltenes Item</li>
                <li>Alle anderen Teilnehmer = 500 Uran + 50 KP (10 % Chance auf ein gewöhnliches Item)</li>
            </ul>
            <p>Jeder Teilnehmer erhält einen Bericht mit Platzierung und Belohnungen. Die Arena-Seite zeigt den Countdown bis zum Ende der Anmeldung, das Podium des letzten Turniers und das Datum des nächsten.</p>

    login_bonus:
        title: "Login-Bonus"
        category: "progression"
        order: 9
        tags: "bonus,login,taeglich,bitcoin,serie,streak"
        summary: "Kostenlose Bitcoins jeden Tag, multipliziert, wenn du mehrere aufeinanderfolgende Tage aneinanderreihst."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Bei deiner <strong>ersten Verbindung</strong> jedes Kalendertages schenkt dir das Spiel einen Bitcoin-Bonus. Es ist kostenlos, keine Aktion nötig außer dem Einloggen.</p>
            <p>Der Betrag ergibt sich aus dem <strong>Höchstwert</strong> der folgenden zwei Berechnungen, multipliziert mit deiner Serie:</p>
            <ul>
                <li>Ein <strong>stufenbasierter Mindestwert</strong> mit einem täglichen Zufall (×1 bis ×5) — garantiert einen motivierenden Bonus zu Spielbeginn.</li>
                <li><strong>5&nbsp;% des durchschnittlichen Bitcoin-Bestands</strong> aller Spieler auf dem Server — damit bleibt der Bonus relevant, während die Serverwirtschaft wächst.</li>
            </ul>
            <p>Das Ergebnis wird anschließend mit deinem <strong>Streak-Multiplikator</strong> multipliziert (siehe unten).</p>
            <p>Der Serverdurchschnitt ignoriert Extremkonten (die reichsten und ärmsten 5&nbsp;%) sowie Bots und Testkonten.</p>
            <p>Beispiel: Ein Spieler der Stufe 10 am Tag 1 erhält mindestens 50&nbsp;000 bis 250&nbsp;000 Bitcoins — mehr, wenn 5&nbsp;% des Serverdurchschnitts diesen Mindestwert übersteigen.</p>

            <h2 id="streak">Die Serie von 7 aufeinanderfolgenden Tagen</h2>
            <p>Dich <strong>jeden Tag</strong> zu verbinden lässt deinen Multiplikator steigen:</p>
            <table>
                <tr><th>Aufeinanderfolgender Tag</th><th>Multiplikator</th></tr>
                <tr><td>Tag 1</td><td>×1,0</td></tr>
                <tr><td>Tag 2</td><td>×1,2</td></tr>
                <tr><td>Tag 3</td><td>×1,5</td></tr>
                <tr><td>Tag 4</td><td>×1,8</td></tr>
                <tr><td>Tag 5</td><td>×2,0</td></tr>
                <tr><td>Tag 6</td><td>×2,5</td></tr>
                <tr><td>Tag 7</td><td>×5,0</td></tr>
            </table>
            <p>Am 8. Tag beginnt der Zyklus bei Tag 1 neu. Wenn du <strong>einen Tag verpasst</strong> (mehr als 24h ohne Verbindung), wird die Serie auf null zurückgesetzt.</p>

            <h2 id="items">Die Bonus-Items</h2>
            <p>An bestimmten Tagen der Serie gibt es zusätzlich ein <strong>zufälliges Item für deinen Helden</strong>:</p>
            <ul>
                <li><strong>Tag 3</strong>: ein gewöhnliches Item.</li>
                <li><strong>Tag 7</strong>: ein seltenes Item.</li>
            </ul>

            <h2 id="reclamation">Wie du es beanspruchst</h2>
            <p>Ein Fenster öffnet sich automatisch bei deiner Verbindung. Ein Klick, um alles abzuholen. Deine <strong>beste Serie</strong> wird als persönlicher Rekord archiviert.</p>

            <h2 id="conseil">Ein kleiner Rat</h2>
            <p>Auch 30 Sekunden Verbindungszeit reichen aus, um die Serie zu validieren. Verpasse nicht den 7. Tag, dort gibt es am meisten.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminierung,bankrott,ende"
        summary: "Die 2 Arten, die Partie zu verlieren, und was dir danach bleibt."
        related: "bitcoin_economy,daily_report,planet_abandon"
        body: |
            <h2 id="intro">Die 2 Arten von Game Over</h2>
            <p>Es gibt zwei Wege, von einem Server eliminiert zu werden. Sie zu kennen, bedeutet, sich schon davor zu schützen.</p>

            <h2 id="faillite">1. Der wirtschaftliche Bankrott</h2>
            <p>Wenn nach dem <strong>Tagesbericht von 18:59 UTC</strong> dein Bitcoin-Saldo <strong>negativ</strong> ist: <strong>wirtschaftliches Game Over</strong>.</p>
            <ul>
                <li>Alle deine <strong>Flotten im Flug</strong> werden zerstört.</li>
                <li>Dein Saldo wird auf <strong>125&nbsp;000 Bitcoins zurückgesetzt</strong>.</li>
                <li>Deine <strong>Forschungen</strong> werden auf null zurückgesetzt.</li>
                <li>Deine <strong>Terraformierung</strong> wird halbiert.</li>
                <li>Deine <strong>Rangliste</strong> wird zurückgesetzt.</li>
            </ul>
            <p>Der Kommandeur bleibt am Leben (er kann weiterspielen), aber er startet stark geschwächt neu.</p>
            <p><strong>Du wirst vorher gewarnt:</strong> Sobald dein Kontostand unter das prognostizierte Tagesdefizit fällt (Unterhalt minus Einnahmen), warnt dich ein Alarmbericht „Bankrott droht" — höchstens einer pro Tag. Wenn du ihn erhältst, handle vor dem nächsten Tagesbericht.</p>

            <h2 id="planetes">2. Der Verlust aller Planeten</h2>
            <p>Wenn du deinen <strong>letzten Planeten</strong> verlierst (Invasion, freiwillige Aufgabe, Battle Royale, wo dein Sektor verschwindet), ist die Partie <strong>wirklich</strong> beendet:</p>
            <ul>
                <li>Alle deine <strong>Flotten</strong> werden an die Aliens übergeben.</li>
                <li>Dein <strong>Kommandeur wird vom Server eliminiert</strong>.</li>
                <li>Deine Statistiken werden auf deinem Konto <strong>archiviert</strong>.</li>
            </ul>

            <h2 id="eviter">Wie man Game Over vermeidet</h2>
            <ul>
                <li>Überwache täglich deine <strong>Bilanz</strong> (Einnahmen − Kosten). Wenn sie rot wird, reagiere.</li>
                <li>Rekrutiere nicht über: Eine Armee in permanenter Unterhaltung kann einen wenig wachsamen Wirtschaftler ruinieren.</li>
                <li>Behalte immer <strong>mindestens 2 Planeten</strong> in verteidigungsbereitem Zustand.</li>
                <li>Überwache <strong>feindliche anrückende Flotten</strong> (Benachrichtigungen, Radar).</li>
                <li>Bei großer Gefahr <strong>evakuiere</strong> deine Truppen und Ressourcen auf einen sicheren Planeten.</li>
            </ul>

            <h2 id="apres">Was bleibt danach?</h2>
            <p>Auch eliminiert, behältst du deinen <strong>Spieleraccount</strong>. Deine <strong>Statistiken</strong> der vorherigen Partien bleiben erhalten und du kannst einem neuen Server beitreten.</p>

    game_modes:
        title: "Die Servermodi"
        category: "events"
        order: 1
        tags: "modus,battle royale,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe bietet 7 verschiedene Servermodi, jeder mit eigenen Regeln und Zielen."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Überblick</h2>
            <p>Jeder Server von Area Universe ist von einem bestimmten <strong>Modus</strong>, vom Admin bei der Erstellung gewählt. Der Modus definiert die Dauer, die Siegbedingung und ob die Cthulhu präsent sind.</p>
            <table>
                <tr><th>Modus</th><th>Dauer</th><th>Siegbedingung</th><th>Cthulhu?</th><th>Allianzen?</th><th>Forschungen</th></tr>
                <tr><td>Cthulhu</td><td>300 Tage</td><td>Keine (Überlebens-Scoreboard)</td><td>Ja</td><td>Ja</td><td>Normal</td></tr>
                <tr><td>Search &amp; Destroy</td><td>30 Tage</td><td>Der VIP, der 72h überlebt</td><td>Nein</td><td>Ja (außer für den VIP)</td><td>Max von Beginn an</td></tr>
                <tr><td>Domination</td><td>60 Tage</td><td>Top-Scorer am Ende</td><td>Nein</td><td>Ja</td><td>Max von Beginn an</td></tr>
                <tr><td>Battle Royale</td><td>40 Tage</td><td>Letzter Überlebender</td><td>Nein</td><td>Nein</td><td>Max von Beginn an</td></tr>
                <tr><td>Paid Server</td><td>60 Tage</td><td>Bester gewichteter Score (Kampf stark gewichtet)</td><td>Nein</td><td>Ja</td><td>Normal</td></tr>
                <tr><td>Long Run</td><td>900 Tage</td><td>Keine (Marathon)</td><td>Ja</td><td>Ja</td><td>Normal</td></tr>
                <tr><td>Short Run</td><td>150 Tage</td><td>Keine (Sprint)</td><td>Ja</td><td>Ja</td><td>Normal</td></tr>
            </table>

            <h2 id="cthulhu">Cthulhu-Modus (klassisches PvE)</h2>
            <p>Der Basismodus, perfekt, um das Spiel zu entdecken. In den <strong>ersten 72 Stunden</strong> keine Cthulhu-Angriffe: Das ist eine <strong>Vorbereitungsphase</strong>. Danach greifen die Cthulhu-Horden periodisch deine Planeten an.</p>
            <p>Keine Siegbedingung: Am Ende (300 Tage) belohnt ein Scoreboard die besten Überlebenden.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (VIP-Jagd)</h2>
            <p>Ein <strong>VIP</strong> wird am Ende des 48h-Waffenstillstands zufällig ausgewählt. Sein Ziel: <strong>72 Stunden überleben</strong>. Wenn er Erfolg hat, gewinnt er. Wenn er von einem Spieler getötet wird, <strong>wird der Töter zum neuen VIP</strong>. Wenn ihn eine nicht-menschliche Ursache eliminiert (Cthulhu, Event), wird ein anderer Spieler ausgelost.</p>
            <p>Der VIP ist <strong>allein gegen alle</strong>: Er wird bei seiner Ernennung automatisch aus seiner Allianz entfernt und kann keiner mehr beitreten, solange er den Status trägt.</p>

            <h2 id="domination">Domination (strategische Planeten)</h2>
            <p>5 strategische Planeten werden zufällig ausgewählt. Jeden Tag markiert ihr Besitzer <strong>+5 Punkte</strong>. Neue Auslosung alle 5 Tage (24h Vorankündigung im Salon).</p>
            <p>Am Ende des Servers (60 Tage) gewinnt der Spieler mit dem besten Score. Für Allianzen ist der Score die Summe der Scores der Mitglieder.</p>

            <h2 id="battle-royale">Battle Royale (letzter Überlebender)</h2>
            <p>Solo-Modus: <strong>keine Allianz erlaubt</strong>. Anmeldungen nach 7 Tagen geschlossen. Eine einzige Galaxie.</p>
            <p>Die Karte ist ein räumliches Raster aus 100 Systemen, das <strong>in konzentrischen Ringen schrumpft</strong>: In jeder Runde verschwindet <strong>der gesamte äußere Ring auf einmal</strong> (nicht System für System). Zerstörte Systeme bleiben als <strong>Löcher</strong> sichtbar — die Karte ordnet sich nie neu an, sodass die sichere Zone auf einen Blick erkennbar ist.</p>
            <p><strong>5 Runden, eine pro Woche:</strong></p>
            <ul>
                <li>T+7: 36 Systeme · T+14: 28 · T+21: 20 · T+28: 12 · T+35: die letzten 3 (<strong>nur eines überlebt</strong>). Die letzten 5 Tage werden im Zentrum gespielt.</li>
                <li><strong>12 Std. zuvor</strong> wird ein Ring <strong>orange</strong> (Warnung).</li>
                <li><strong>1 Std. zuvor</strong> wird er <strong>rot blinkend</strong> und keine Flotte kann mehr hinein oder heraus.</li>
                <li>Ein zerstörtes System löscht endgültig seine Planeten und Flotten.</li>
                <li>Eine Flotte auf dem Weg zu einem verschwundenen System wird zerstört. Wenn dein Held dort ist, ist es die Niederlage.</li>
            </ul>
            <p><strong>Sieg</strong>: der letzte aktive Kommandeur sein.</p>

            <h2 id="paid-server">Paid Server (kompetitiv, kostenpflichtig)</h2>
            <p>Kostenpflichtiger Server (<strong>5&nbsp;€</strong>), 100&nbsp;% PvP, keine Cthulhu. Dauer 60 Tage.</p>
            <p><strong>Sieg</strong>: Am Ende gewinnt der Spieler mit dem besten <strong>gewichteten Score</strong>. Dieser Score kombiniert Imperiumsgröße und militärische Aktivität, wobei der Kampf stark gewichtet ist — es ist ein Modus für kompetitive Spieler.</p>
            <p>Der Sieger erhält eine <strong>permanente Auszeichnung</strong> auf seinem Profil, die von Server zu Server erhalten bleibt.</p>

            <h2 id="long-short-run">Long Run / Short Run (mit Events)</h2>
            <p>Zwei PvE-Modi mit <strong>wiederkehrenden, geplanten Events</strong>: Cthulhu-Angriffe, Piratenraids, Produktionsboni, verbessertes Recycling, Allianzarenen, Totale Kriege, Server-gegen-Server-Konfrontationen…</p>
            <p>Der <strong>Long Run</strong> (900 Tage) ist ein gemütlicher Marathon; der <strong>Short Run</strong> (150 Tage) ist ein intensiverer Sprint. Der Event-Kalender ist <strong>deterministisch</strong>: Du kannst sie antizipieren.</p>

            <h2 id="recherches-max">Modi mit maximalen Forschungen von Beginn an</h2>
            <p>In <strong>Search &amp; Destroy, Domination und Battle Royale</strong> starten alle deine Forschungen auf der maximalen Stufe — das Forschungsmenü ist ausgeblendet, um direkt auf der militärischen Seite zu spielen.</p>
            <p>Dein Startplanet erhält dann ein <strong>Starterkit</strong>:</p>
            <ul>
                <li><strong>500 Uran</strong>, um schnell zu personalisieren.</li>
                <li><strong>Alle deine Schiffspunkte freigeschaltet</strong> vom 1. Tag an (1&nbsp;375 Punkte auf einmal statt 40/Tag).</li>
            </ul>
            <p>In <strong>Search &amp; Destroy</strong> wird ein größeres Militärkit gewährt, damit der VIP seine 72h halten kann: 2&nbsp;000 Legionäre, 25 Bargen, 500 Zerstörer, 250 schwere Lasertürme.</p>

            <h2 id="fin-de-serveur">Serverende und Archivierung</h2>
            <p>Wenn ein Server schließt, werden deine <strong>Endstatistiken</strong> (Punkte, Held, VIP-Erfolge, Siege usw.) auf deinem <strong>Spieleraccount</strong> archiviert. Dein Kommandeur (die Figur dieser Partie) wird gelöscht, aber dein Verlauf bleibt.</p>

    cthulhus:
        title: "Die Cthulhu-Bedrohung"
        category: "events"
        order: 2
        tags: "cthulhu,schwarm,horde,garnison,belagerung,bedrohung,pve,uran,tower defense,td"
        summary: "Die Cthulhu massieren jetzt echte Horden, die sichtbar unterwegs sind, bevor sie deine Planeten angreifen. Wie man sich verteidigt, wie sich ihre Basen zur Wehr setzen, und das Tower Defense, um den Angriff zurückzuschlagen."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">Was sind die Cthulhu?</h2>
            <p>Die <strong>Cthulhu</strong> (die Besessenen) sind die vom Spiel kontrollierten feindlichen Kreaturen (PvE). Sie halten über die Galaxie verteilte <strong>Schwarmbasen</strong>, von denen <strong>Horden</strong> ausgehen: echte Flotten mit sichtbarer Zusammensetzung, Stärke und Route — kein bloßer Countdown.</p>
            <p>Je mehr du sie zurückschlägst, desto höher steigt die <strong>globale Bedrohung</strong>, und desto stärker werden die folgenden Angriffe.</p>

            <h2 id="menace">Die Bedrohungsstufe</h2>
            <p>Bei jedem Sieg gegen eine Cthulhu-Invasion steigt die Bedrohungsstufe deines Imperiums. Die Gewinne sind höher bei höherer Schwierigkeit und je nach deinem Allianzregime:</p>
            <table>
                <tr><th>Schwierigkeit</th><th>Ohne Allianz</th><th>Allianz Der Hammer der Sterne</th><th>Andere Allianz</th></tr>
                <tr><td>Leicht</td><td>+50</td><td>+75</td><td>+100</td></tr>
                <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                <tr><td>Schwer</td><td>+150</td><td>+225</td><td>+300</td></tr>
            </table>
            <p><strong>Der Hammer der Sterne</strong> reduziert den Bedrohungsanstieg (das defensive Regime ist gegenüber den Cthulhu entspannter).</p>
            <p>Die Bedrohung <strong>steigt auch von selbst wieder an</strong>: +5 mit jedem täglichen Imperiumsbericht und +1 pro Stunde, solange eine Horde vor der Landung in der Umlaufbahn eines deiner Planeten bleibt (gedeckelt bei 300, und erst nach deinem ersten Kontakt mit den Cthulhu). Ein gewonnenes Tower Defense <strong>halbiert sie</strong>: Wer fleißig spielt, hält sie niedrig — wer sie treiben lässt, riskiert immer größere Horden.</p>

            <h2 id="puissance">Stärke der Invasionen</h2>
            <p>Die Stärke einer Cthulhu-Invasion hängt ab von:</p>
            <ul>
                <li>der angesammelten <strong>Bedrohungsstufe</strong>;</li>
                <li>der gewählten <strong>Schwierigkeit</strong>;</li>
                <li>der <strong>Terraformierung</strong> des angegriffenen Planeten.</li>
            </ul>
            <p>In <strong>Leicht</strong> wird die Angriffsstärke halbiert. In <strong>Schwer</strong> wird sie verstärkt.</p>

            <h2 id="horde">Der Angriff: eine echte Horde</h2>
            <p>Ein Angriff beginnt immer mit einer <strong>Sammlung</strong>: Die Horde massiert sich <strong>6 Stunden</strong> lang (12 Stunden bei einer Boss-Horde) in der Umlaufbahn einer Schwarmbasis, bevor sie aufbricht.</p>
            <p>Einmal unterwegs, fliegt sie mit <strong>Hordengeschwindigkeit</strong> — langsam, gut sichtbar am <strong>Radar</strong> — und eine <strong>Warnung ist garantiert 1 Stunde vor der Ankunft</strong>, unabhängig von deiner Radarabdeckung.</p>
            <p>Es ist eine <strong>echte Flotte</strong>: Du kannst sie jederzeit zerstören — während sie sich über ihrer Basis formiert, mitten im Flug, sobald sie die Umlaufbahn deines Planeten erreicht, oder indem du das <strong>Tower Defense</strong> gewinnst (spielbar, sobald sie geplant oder bereits aktiv ist). Ihre Zerstörung annulliert den Angriff, egal zu welchem Zeitpunkt.</p>
            <p>Bei der Ankunft findet ein <strong>Orbitalkampf</strong> statt (deine Flotten und Türme gegen die Horde). Die Überlebenden landen <strong>2 Stunden später</strong> zum Bodenangriff. Mehrere Horden können gleichzeitig in Bildung oder im Flug sein, mit zufälliger Zusammensetzung.</p>
            <p>Einzige Ausnahme: Die <strong>Infiltration</strong> (ab Level 200+ freigeschaltet) bleibt <strong>sofort und unsichtbar</strong> — keine Sammlung, keine Vorwarnung.</p>

            <h3>Wenn deine Verteidigung gewinnt</h3>
            <table>
                <tr><th></th><th>Leicht</th><th>Normal</th><th>Schwer</th></tr>
                <tr><td>Legionärverluste</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                <tr><td>Mech-Verluste</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                <tr><td>Arbeiterverluste</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
            </table>
            <p>Du erhältst <strong>KP</strong> und eine Chance auf einen <strong>Item-Drop</strong>.</p>

            <h3>Wenn die Horde am Boden gewinnt</h3>
            <p>Plünderung und Eroberung sind jetzt <strong>proportional zu dem, was von der Horde nach dem Orbitalkampf übrig ist</strong>: Eine zur Hälfte vernichtete Horde plündert halb so viel. Unter <strong>90&nbsp;% Überlebensrate</strong> hat sie nicht mehr genug Truppen, um den Planeten zu erobern, selbst auf Schwer.</p>
            <table>
                <tr><th></th><th>Leicht</th><th>Normal</th><th>Schwer</th></tr>
                <tr><td>Ressourcenplünderung (intakte Horde)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planet erobert (bei ≥ 90&nbsp;% Überleben)</td></tr>
                <tr><td>Bedrohungsreduktion nach Niederlage</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
            </table>
            <p>Auf <strong>Schwer</strong> fällt die Plünderung ohne genügend Überlebende für eine Eroberung auf den <strong>Normal</strong>-Satz zurück (70&nbsp;%), multipliziert mit der Überlebensrate der Horde. Wird der Planet erobert und war es dein letzter, ist es Game Over.</p>

            <h2 id="bases">Die Basen des Schwarms</h2>
            <p>Der Schwarm hält über die Galaxie verteilte <strong>Basen</strong>: die Ursprungsbasen des Schwarms (bis zu 36 pro Galaxie, mit steigender Stärke — ihre Namen reichen von „Cthulhu I" für Außenposten bis zum gefürchteten „Cthulhu V") und ehemalige Spielerplaneten, die durch eine Expansion oder einen Ausbruch umgewandelt wurden. Jede wird von einer <strong>permanenten Garnison</strong> geschützt, die sich in <strong>24 Stunden</strong> regeneriert, falls sie geschwächt wurde.</p>
            <p>Eine Spielerflotte in der Umlaufbahn einer Basis zu massieren (kumulierte Signatur von mindestens <strong>10.000</strong>) löst eine <strong>Belagerung</strong> aus: Die belagerte Basis sendet keine Horden mehr aus (sie starten dann von einer weiter entfernten Basis), <strong>Verteidigungswellen</strong> werden stärker (+25&nbsp;% alle 2 Stunden), und nach <strong>6 Stunden</strong> senden die anderen Basen <strong>Entsatzflotten</strong> zur Verstärkung. Eine belagerte Basis trägt das Abzeichen <strong>„Belagerte Basis"</strong> auf der Galaxiekarte. Sobald die Belagerung endet, kehren die Entsatzflotten heim und die Basis erhält wieder eine normale Garnison.</p>
            <p>Wenn die Belagerung aufgehoben wird, wird jeder Teilnehmer <strong>im Verhältnis zur zerstörten Signatur</strong> bezahlt: 0,02 Bitcoin pro Punkt, plus Kriegspunkte.</p>

            <h2 id="liberation">Eine Basis befreien</h2>
            <p>Die erfolgreiche Invasion einer Schwarmbasis — nun auch der Alien-Basen „Cthulhu I" bis „V" — bringt die üblichen Belohnungen (Uran, Chance auf einen Item-Drop) <strong>und</strong> senkt die <strong>Bedrohung des Universums</strong> um <strong>50 Punkte</strong>, was die nächste Cthulhu-Prophezeiung verzögert (siehe den Artikel <em>Die Cthulhu-Prophezeiungen</em>). Ein so befreiter Planet ist <strong>72 Stunden lang geschützt</strong>: Der Schwarm kann ihn in dieser Zeit weder erneut kolonisieren noch dort ausbrechen. War der befreite Planet ursprünglich ein Spielerplanet — vom Schwarm erobert, nach einer verlorenen Invasion umgewandelt, aufgegeben, oder durch eine Expansion oder einen Ausbruch entstanden —, bleibt er kolonisierbar, und dein Befreiungsbericht nennt dir die Frist, einen Kolonisator dorthin zu schicken. Die Ursprungsaußenposten des Schwarms („Cthulhu I" bis „V") bleiben dagegen nach der Befreiung unbrauchbar: Der Planet bleibt frei, aber du kannst keinen Kolonisator dorthin schicken, und es wird keine Frist genannt.</p>
            <p>Umgekehrt erhöht eine verlorene Invasion gegen eine Alien-Basis jetzt auch deine <strong>persönliche Bedrohung um 10 Punkte</strong>, genau wie gegen eine klassische Cthulhu-Basis.</p>

            <h2 id="expansion">Expansion und Ausbruch</h2>
            <p>Der Schwarm breitet sich von selbst aus: Sobald die <strong>Bedrohung des Universums</strong> <strong>300 Punkte</strong> erreicht, bricht alle <strong>3 Tage</strong> ein <strong>Sporenschwarm</strong> von einer bestehenden Basis auf (jeden <strong>Tag</strong>, sobald die Bedrohung <strong>500</strong> übersteigt) und zieht zu einem unbewohnten Planeten in der Nähe von Spielern — bis zu <strong>36 Basen pro Galaxie</strong>. Es ist eine Flotte wie jede andere: <strong>im Flug abfangbar</strong>. Kommt sie an, gründet sie eine neue Basis mit Garnison, und Spieler innerhalb von <strong>5 Sektoren</strong> erhalten einen Bericht.</p>
            <p>Werden <strong>alle</strong> Basen ausgelöscht, ist der Schwarm damit nicht endgültig besiegt: Nach <strong>48 Stunden Stille</strong> lässt ein <strong>Ausbruch</strong> anderswo eine Basis wieder auftauchen, mit einem Bericht an die Spieler in der Nähe. Dieser Ausbruch kann niemals <strong>weniger als 8 Sektoren</strong> von einem Spielerplaneten entfernt landen, auch nicht auf einem Planeten, der noch unter seiner Befreiungsfrist steht: Der Schwarm wird im Leeren wiedergeboren, nicht auf deinem Grund. Findet sich kein ausreichend isolierter Sektor, wird der Ausbruch einfach auf das nächste Zeitfenster verschoben.</p>

            <h2 id="changement-difficulte">Schwierigkeit ändern</h2>
            <p>Du kannst die PvE-Schwierigkeit in deinen <strong>Optionen</strong> ändern. Achtung: Ein <strong>Cooldown von 72 h</strong> gilt zwischen zwei Änderungen — kein Hin und Her, um großen Angriffen auszuweichen.</p>

            <h2 id="tower-defense">Das Tower Defense (TD)</h2>
            <p>Das <strong>Tower Defense</strong> ist ein aktives Verteidigungs-Minispiel. Es ist spielbar, sobald eine Horde <strong>geplant</strong> (an ihrer Basis in Bildung) oder bereits <strong>aktiv</strong> (im Flug oder in der Umlaufbahn) ist: Du kannst es starten, um sie zu vernichten, bevor sie Schaden anrichtet. Es ist interaktiv: Du platzierst deine Verteidigungen auf einem Raster und stellst dich Cthulhu-Monsterwellen in Echtzeit.</p>
            <p>Tipp: Um mehrere Verteidigungen hintereinander zu platzieren (Einheiten, Mauern, Stacheldraht), <strong>halte gedrückt und ziehe</strong> — der Strich rastet automatisch in einer <strong>geraden Linie</strong> ein (horizontal oder vertikal) und jede überquerte Zelle wird gefüllt, ohne Lücken, selbst bei schnellen Bewegungen.</p>
            <p>Der Schwierigkeitsgrad des TD ist deine <strong>PvE</strong>-Stufe (in deinen Einstellungen festgelegt). Das <strong>Tutorial</strong> ist ein Training: Es bringt nichts ein und kostet nichts. Sobald die erste Welle gestartet ist, gilt das Verlassen der Partie als <strong>Aufgabe</strong> (Niederlage).</p>
            <p>Über die Arena zieht ein <strong>Nebel</strong>, dichter rund um die Risse und solange ein Boss naht. Er liegt unter deinen Verteidigungen und den Monstern: Er verdeckt nichts. Die Schaltfläche <strong>Nebel</strong> im Dock schaltet ihn ab, wenn dein Gerät zu kämpfen hat.</p>

            <h3>Mögliches Ergebnis</h3>
            <ul>
                <li><strong>Sieg</strong> — die aktive Horde wird zerstört, der Angriff wird annulliert. Du gewinnst Uran, die Bedrohung sinkt (÷2). Cooldown von 6h vor dem nächsten TD.</li>
                <li><strong>Niederlage</strong> — Teilbelohnungen; war die Horde bereits gelandet, spielt sich der Bodenkampf sofort ab.</li>
                <li><strong>TD nicht gespielt</strong> — die Horde nimmt ihren normalen Lauf: Sammlung, Flug, Ankunft, Landung.</li>
            </ul>

            <h3>Bericht am Spielende</h3>
            <p>Am Ende jedes Tower Defense (Sieg oder Niederlage) wird ein <strong>Bericht</strong> im <strong>Cthulhu</strong>-Reiter deiner Berichte abgelegt: überlebte Wellen, Punktzahl, gesammeltes Uran, Bedrohungsreduktion, Verluste pro Einheitentyp und getötete Feinde pro Typ. Praktisch, um deine Partien zu vergleichen.</p>

            <h3>Wie man spielt</h3>
            <ul>
                <li>Wähle eine Schwierigkeit: Leicht, Normal oder Schwer.</li>
                <li>Platziere deine Einheiten auf dem Raster. Das <strong>HQ ist in der Mitte</strong>; die Monster entsteigen <strong>1 bis 4 Cthulhu-Rissen</strong> am Rand der Plattform.</li>
                <li>Die Monster durchqueren das Raster, um dein HQ zu erreichen: Greife sie auf dem Weg an.</li>
                <li><strong>Mauern</strong> (150 auf Leicht, 125 auf Normal, 75 auf Schwer): Die Monster laufen um sie herum — jeder Riss behält immer einen Weg zum HQ (eine Mauer, die ihn versiegeln würde, wird abgelehnt). Türme blockieren den Weg nicht: Ein Monster, das auf einen Turm trifft, bleibt stehen und zerstört ihn.</li>
                <li><strong>Stacheldraht</strong> (30/20/10 je nach Schwierigkeit, Forschung Stacheldraht erforderlich): blockiert nicht, verletzt und verlangsamt aber die Monster, die ihn durchqueren.</li>
                <li><strong>Gemerkte Aufstellung</strong>: Deine Anordnung (Türme, Mauern, Stacheldraht) wird pro Server gespeichert und zu Beginn jeder Partie wieder vorgeschlagen.</li>
                <li>Große Wellen kommen <strong>in Gruppen</strong> (bis zu 20 Monster gleichzeitig): Eine Welle zieht sich nie über mehr als ~2 Minuten.</li>
                <li><strong>Sofortige Niederlage</strong>: Wenn alle Feinde einer Welle deine Verteidigungen durchbrechen und das HQ erreichen, ist die Partie auf der Stelle verloren — ohne wirksame Verteidigungen ist ein Sieg unmöglich (besonders auf der Schwierigkeit Leicht).</li>
                <li>Zwischen den Wellen reparieren die Arbeiter automatisch die beschädigten Türme.</li>
                <li>Geschwindigkeit einstellbar von ×1 bis ×10, mit Pause möglich.</li>
                <li><strong>Wellen verketten</strong>: Eine Option in der Kopfzeile startet die nächste Welle automatisch, sobald die aktuelle endet — ohne Vorbereitungsphase und unter Beibehaltung Ihrer Geschwindigkeit, bis zum Sieg oder zur Niederlage. Schalten Sie sie während einer Welle aus, um am Ende dieser Welle wieder die Vorbereitungspause zu erhalten. Im Tutorial nicht verfügbar.</li>
                <li>Der Kampf hat <strong>maximal 20 Wellen</strong>, immer intensiver werdend.</li>
                <li><strong>Oberfläche</strong>: durchgängige Kopfzeile (HQ-Pill + HP-Anzeige, kreisförmiger Wellenzähler, Punkte, „Starten"-Button und Symbole für Ton / Musik / Einheiten-Info / Raster / Wellen verketten rechts), „Einheiten"-Panel rechts mit einem 2-spaltigen Raster vertikaler Karten (Icon + Name + Bestand + Werte). Kein Seitenmenü oder Footer während des Spiels — die gesamte Bildschirmbreite ist der Karte gewidmet.</li>
            </ul>

            <h3>Deine Einheiten für das TD</h3>
            <p>Deine Planeteneinheiten (Legionäre, Mechs, Türme) werden gemäß einer <strong>Umwandlungsrate</strong> in TD-Einheiten konvertiert. Jede Einheitenart hat eine maximal platzierbare Anzahl, um taktische Vielfalt zu erzwingen.</p>

            <h3>Die Monster, denen du dich stellst</h3>
            <ul>
                <li><strong>Tiefer</strong> — das Basismonster. Nichts Besonderes, aber sie kommen in Massen.</li>
                <li><strong>Späher</strong> — sehr schnell, aber fragil. Schnell abzufangen.</li>
                <li><strong>Shoggoth</strong> — langsam, massiv, schwer gepanzert. Schwer zu erledigen.</li>
                <li><strong>Vampirstern</strong> — schießt Projektile aus der Ferne auf deine Verteidigungen.</li>
                <li><strong>Mentalpeitscher</strong> — kann <strong>deine Legionäre in Monster verwandeln</strong> (visueller Umwandlungseffekt), höchstens einen pro Sekunde und keinen mehr, sobald er tödlich getroffen ist.</li>
                <li><strong>Cthulhu-Boss</strong> — riesig, selten (Normal/Schwer, hohe Bedrohung). Beschwört Tiefe um sich herum.</li>
            </ul>

            <h3>Nützliche zu wissende Mechaniken</h3>
            <ul>
                <li>Einheiten und Monster haben <strong>unterschiedliche Größen</strong> auf dem Raster (Legionär 1×1, Mech 2×1, Turm 2×2, Boss 2×2).</li>
                <li>Die <strong>Wellenleiste</strong> zeigt die Anzahl verbleibender Feinde an.</li>
                <li>Wenn du die Seite aktualisierst, <strong>setzt die Partie genau dort fort, wo du sie verlassen hast</strong>.</li>
                <li>Eine gespeicherte Partie muss <strong>fortgesetzt werden</strong>, bevor eine neue beginnt.</li>
            </ul>

            <h3>Belohnungen und Verluste</h3>
            <ul>
                <li><strong>Sieg</strong>: Bedrohungsreduktion + Uran + zerstörte Horde.</li>
                <li><strong>Niederlage</strong>: Teilbelohnungen; war die Horde bereits angekommen, erfolgt die Landung sofort.</li>
                <li><strong>Einheitenverluste sind real</strong> in allen Fällen (im TD getötete Legionäre = wirklich tot).</li>
            </ul>

            <h3>TD-Rangliste</h3>
            <p>Eine Rangliste pro Server hält die <strong>besten Scores</strong> im Tower Defense fest. Eine weitere Jagdtafel zum Erobern.</p>

    events:
        title: "Sonderevents"
        category: "events"
        order: 3
        tags: "event,total war,alliance arena,raiders"
        summary: "Punktuelle Events beleben das Serverleben: Boni, Herausforderungen, Wettbewerbe zwischen Allianzen."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Bestimmte Servermodi (Long Run, Short Run) lösen regelmäßig <strong>Sonderevents</strong> aus. Sie dauern einige Stunden oder Tage und ändern vorübergehend die Regeln, um die Partie zu würzen.</p>
            <p>Der Kalender ist <strong>deterministisch</strong>: Du kannst jedes Event antizipieren und deine Strategie entsprechend planen.</p>

            <h2 id="liste">Die Events, denen du begegnen kannst</h2>
            <table>
                <tr><th>Event</th><th>Was passiert</th></tr>
                <tr><td><strong>Total War</strong></td><td>Generalisierter totaler Krieg — alle Allianzen können sich frei angreifen.</td></tr>
                <tr><td><strong>Product Army</strong></td><td>Militärproduktionsbonus: schneller rekrutieren und herstellen.</td></tr>
                <tr><td><strong>Raiders</strong></td><td>NPC-Feindeswellen greifen die Server an. Verteidige dich oder schlage zurück.</td></tr>
                <tr><td><strong>Defend Trader</strong></td><td>Beschütze bedrohte Händler. Belohnungen, wenn du die NPCs rettest.</td></tr>
                <tr><td><strong>Invade Aliens</strong></td><td>Invadiere Cthulhu-Planeten für Uran-Belohnungen.</td></tr>
                <tr><td><strong>Attack Aliens</strong></td><td>Greife die Cthulhu-Flotten an, um KP zu gewinnen.</td></tr>
                <tr><td><strong>Destroy Fleet</strong></td><td>Bonuszeit für das Zerstören feindlicher Flotten.</td></tr>
                <tr><td><strong>Recycling</strong></td><td>Recyclingkapazität vorübergehend erhöht. Idealer Moment, um Trümmer zu säubern.</td></tr>
                <tr><td><strong>Alliance Arena</strong></td><td>Wettbewerb zwischen Allianzen: gewertete Kämpfe und kollektive Belohnungen.</td></tr>
                <tr><td><strong>Server vs Server</strong></td><td>Konfrontation zwischen verschiedenen Servern. Der beste Server gewinnt.</td></tr>
                <tr><td><strong>Cthulhu Attack</strong></td><td>Intensive Cthulhu-Welle vorhergesagt — bereite deine Verteidigung vor.</td></tr>
            </table>

            <h2 id="ou">Wo sieht man den Kalender?</h2>
            <p>Seite <strong>Events</strong> (linkes Menü in den betreffenden Modi). Dort siehst du die Liste der kommenden Events, ihre Daten und Effekte.</p>

            <h2 id="strategie">Wie man daraus Nutzen zieht</h2>
            <ul>
                <li><strong>Bereite dich</strong> im Voraus vor: Baue deine Armee vor einem Total War, deine Recycler vor einem Recycling-Bonus.</li>
                <li><strong>Besprich im Salon</strong>: Ein Event ist eine Gelegenheit, mit deiner Allianz zu koordinieren.</li>
                <li><strong>Profitiere von den Boni</strong>: Starte keine große Produktion außerhalb eines Product Army, wenn du warten kannst.</li>
            </ul>

    alliance_arena:
        title: "Allianz-Arena"
        category: "events"
        order: 9
        tags: "allianz,arena,bracket,pvp,event,turnier,sektor,planet,flotte,basis,historie,zuschauer"
        summary: "Wiederkehrendes Event alle 3 Tage: Deine Allianz tritt gegen die anderen in einer Sektorschlacht an — duplizierte Flotten, Planeten zum Halten —, um die gemeinsame Bank zu füllen und einen persönlichen Bonus einzustreichen."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Wann es startet</h2>
            <p>Das Event kehrt <strong>alle 3 Tage</strong> auf den betreffenden Servern zurück. Kalender eines Arena-Tages (Zeiten Europe/Paris):</p>
            <ul>
                <li><strong>08:00</strong> — Ankündigung im Universum-Salon (alle Sprachen) und <strong>Öffnung der Anmeldungen</strong>, mit Benachrichtigung an die Allianzmitglieder.</li>
                <li><strong>18:45</strong> — Schließung der Anmeldungen: die Aufstellung ist festgelegt.</li>
                <li><strong>19:00</strong> — erste Runde. Die nächsten Runden starten um <strong>19:15</strong> und <strong>19:30</strong>.</li>
                <li><strong>~19:45</strong> — Ende der Kämpfe, Verteilung der Belohnungen.</li>
            </ul>
            <p>Wenn um 19:00 weniger als <strong>2 Allianzen</strong> weltweit angemeldet sind, wird das Event abgesagt und ein Broadcast informiert alle.</p>

            <h2 id="inscription">Anmelden</h2>
            <p>Wenn die Anmeldungen öffnen, <strong>öffnet sich ein Modal automatisch</strong> auf deiner Oberfläche. Du kannst auch über den Tab Arena auf deiner Allianz-Seite darauf zugreifen.</p>
            <p>Bedingungen:</p>
            <ul>
                <li>Mitglied einer Allianz sein.</li>
                <li>Mindestens <strong>1 Angriffsschiff</strong> (am Boden oder in der Flotte) zum Zeitpunkt des Spawns (19:00) besitzen.</li>
            </ul>
            <p>Du kannst dich bis 19:00 abmelden. Wenn du um 19:00 kein Angriffsschiff mehr hast (im echten Kampf zwischen Anmeldung und Spawn verloren), wirst du automatisch als Forfait erklärt — deine Allianz macht ohne dich weiter.</p>
            <p><strong>KI-Kommandanten</strong>: Die KI-Kommandanten deiner Allianz folgen deiner Anmeldung — sobald ein menschliches Mitglied angemeldet ist, schließen sich bis zu 4 von ihnen dem Block an (maximal 5 Anmeldungen pro Allianz). Reine KI-Allianzen melden sich ebenfalls an, um das Turnier aufzufüllen.</p>

            <h2 id="combat">Wie es abläuft</h2>
            <p>Jedes Match findet in einem <strong>eigens dafür erstellten Sektor</strong> statt, dargestellt wie die Raumkarte: ein 5 × 5-Raster, in dem sich <strong>2 bis 4 Allianzen</strong> gegenüberstehen. Jede Allianz startet von ihrer <strong>Basis</strong> in der Mitte eines Sektorrands.</p>
            <p>Deine Schiffe werden für die Arena <strong>dupliziert</strong>: Nichts von dem, was du besitzt, steht auf dem Spiel. Keine echten Verluste, keine Trümmer, kein gefangener Held.</p>
            <ul>
                <li>Ein Match dauert höchstens <strong>15 Minuten</strong>.</li>
                <li>Die erste Allianz mit <strong>300 Punkten</strong> gewinnt; sonst der höchste Punktestand am Ende der Zeit. Bei Gleichstand: die meisten gehaltenen Planeten, dann der meiste zugefügte Schaden.</li>
                <li>Nur eine Allianz pro Sektor kommt in die nächste Runde. K.-o.-System über höchstens 3 Runden; der Sieger des letzten Matches ist Server-Champion.</li>
            </ul>

            <h2 id="flotte">Deine Flotte</h2>
            <p>Du startest mit <strong>einer einzigen Flotte</strong> aus all deinen Angriffsschiffen — denen am Boden wie denen in deinen Flotten — und deinem Haupthelden.</p>
            <ul>
                <li><strong>Senden</strong>: Wähle deine Flotte, tippe auf einen Planeten und bestätige. Die Flugdauer wird vor dem Abflug angezeigt, und ein Flug lässt sich nicht abbrechen.</li>
                <li><strong>Teilen</strong>: Trenne einen Teil deiner Schiffe in eine neue Flotte ab (höchstens 4 Flotten). Eine Flotte fliegt so schnell wie ihr langsamstes Schiff: Ein Jägergeschwader allein ist dreimal so schnell wie eine Flotte, die Schlachtschiffe mitschleppt.</li>
                <li><strong>Zusammenlegen</strong>: Zwei deiner Flotten im Orbit desselben Planeten können verschmelzen.</li>
            </ul>
            <p>Treffen zwei Allianzen auf demselben Planeten aufeinander, wird der Kampf <strong>5 Sekunden</strong> später entschieden — Zeit für Verstärkung — nach den <strong>gleichen Regeln wie der Raumkampf</strong> im Spiel. Eine Flotte im Gefecht kann vor Kampfende nicht mehr abfliegen.</p>
            <p>Eine zerstörte Flotte ist nicht verloren: Sie <strong>stellt sich an deiner Basis neu auf</strong>, in voller Stärke, nach 45 Sekunden — 15 mehr bei jeder weiteren Zerstörung, höchstens 2 Minuten. Jede zerstörte feindliche Flotte bringt deiner Allianz <strong>5 Punkte</strong>.</p>
            <p><strong>KI-Kommandanten kämpfen wirklich</strong>: Sie nehmen freie Planeten ein, meiden aussichtslose Kämpfe und kehren zur Reparatur zurück. Wenn du den Match-Bildschirm nicht öffnest und eine Minute lang keinen Befehl gibst, spielt der Autopilot auch für dich — du übernimmst wieder, sobald du zurückkommst.</p>

            <h2 id="planetes">Planeten und Punkte</h2>
            <p>Eine Allianz, die <strong>allein</strong> auf einem Planeten steht, der ihr nicht gehört, erobert ihn nach <strong>15 Sekunden</strong>; ein eintreffender Feind setzt den Zähler zurück. Der Planet <strong>bleibt deiner Allianz</strong>, wenn deine Flotten abfliegen, bis eine andere ihn zurückholt. Das ist das ganze Dilemma: sich verteilen, um zu punkten, oder sich sammeln, um die Kämpfe zu gewinnen.</p>
            <p>Alle <strong>10 Sekunden</strong> bringt jeder gehaltene Planet Punkte:</p>
            <table>
                <tr><th>Planet</th><th>Punkte</th><th>Außerdem</th></tr>
                <tr><td><strong>Welt</strong> (4 pro Sektor)</td><td>1</td><td>—</td></tr>
                <tr><td><strong>Werft</strong></td><td>1</td><td>Repariert deine Flotten im Orbit: 10&nbsp;% der Stärke pro Periode.</td></tr>
                <tr><td><strong>Nexus</strong> (im Zentrum)</td><td>3</td><td>—</td></tr>
            </table>
            <p>Jeder Punkt, den ein Planet einbringt, zahlt am Ende des Matches auch <strong>PDG in die Bank deiner Allianz</strong>: 3 PDG pro Punkt in Runde 1, 8 in Runde 2, 15 in Runde 3 — ob du das Match gewinnst oder nicht. Punkte für zerstörte Flotten und geplünderte Basen bringen keine PDG.</p>

            <h2 id="bases">Die Basen</h2>
            <p>Deine Basis ist dein Start- und Neuaufstellungspunkt; deine Flotten werden dort repariert (5&nbsp;% pro Periode). Sie kann nicht erobert, aber <strong>geplündert</strong> werden.</p>
            <p>Eine Basis wird von den <strong>planetaren Verteidigungen aller Planeten der am Match beteiligten Spieler der Allianz</strong> verteidigt, zusammengelegt: Sie ist schwer einzunehmen. Ein abgewehrter Angriff beschädigt sie trotzdem, und sie repariert sich um 10&nbsp;% pro Periode.</p>
            <p>Fällt die Verteidigung, wird die Basis geplündert: <strong>50 Punkte</strong> für den Angreifer, dessen Flotten sofort heimgeschickt werden, und die Basis ist 2 Minuten lang unangreifbar.</p>

            <h2 id="recompenses">Belohnungen</h2>
            <p>Zwei Arten kumulierbarer Belohnungen.</p>
            <h3 id="banque">Allianz-Bank</h3>
            <table>
                <tr><th>Erreichte Runde</th><th>Bitcoin</th><th>PDG</th></tr>
                <tr><td>Verlierer Runde 1</td><td>50 000</td><td>1 000</td></tr>
                <tr><td>Verlierer Runde 2</td><td>150 000</td><td>3 000</td></tr>
                <tr><td>Verlierer Runde 3</td><td>350 000</td><td>8 000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>1 000 000</strong></td><td><strong>25 000</strong></td></tr>
            </table>
            <h3 id="perso">Persönlicher Bonus</h3>
            <p>Direkt auf dein persönliches Wallet gezahlt, vorausgesetzt du hast während des Matches <strong>mindestens einen Befehl selbst gegeben</strong>: Hat der Autopilot das ganze Match für dich gespielt, gibt es keinen Bonus.</p>
            <table>
                <tr><th>Erreichte Runde</th><th>Bitcoin persönlich</th></tr>
                <tr><td>Verlierer Runde 1</td><td>5 000</td></tr>
                <tr><td>Verlierer Runde 2</td><td>15 000</td></tr>
                <tr><td>Verlierer Runde 3</td><td>30 000</td></tr>
                <tr><td><strong>Champion</strong></td><td><strong>50 000</strong></td></tr>
            </table>
            <p>Du kumulierst den Bonus aller erreichten Runden. Champion = 5 000 + 15 000 + 30 000 + 50 000 = <strong>100 000 Bitcoins</strong> auf deinem Wallet, zusätzlich zu den PDG, die deine gehaltenen Planeten der Bank eingebracht haben.</p>

            <h2 id="rapports">Kampfberichte</h2>
            <p>Am Ende jedes Matches erhält jeder Spieler einen <strong>Bericht</strong> auf seiner Berichte-Seite: Ergebnis, Punktestand deiner Allianz und jedes Gegners, gehaltene Planeten, geplünderte Basen, dein zugefügter und erlittener Schaden, die von deinen Flotten zerstörten feindlichen Flotten und deine verlorenen, deine verbleibende Stärke, dein Schadensrang unter den Piloten deiner Allianz — mit dem Titel <strong>MVP des Matches</strong> für den Ersten — und die an die Bank gezahlten PDG.</p>
            <p>Am Ende des Turniers kommt eine <strong>persönliche Zusammenfassung</strong> hinzu: der Weg deiner Allianz durch das Bracket, die Match-Bilanz, dein Gesamtbeitrag und die Aufschlüsselung deiner Gewinne (persönlicher Bonus, Allianzbank, gehaltene Gebiete).</p>

            <h2 id="suivi">Das Event im Tab Arena verfolgen</h2>
            <p>Der Tab <strong>Arena</strong> auf deiner Allianz-Seite zeigt jederzeit den echten Stand des Events: keine laufende Arena, nächste Arena in Sicht (mit Countdown bis zur Ankündigung), angekündigt, Anmeldungen offen oder geschlossen, Arena läuft, oder beendet. Ein Countdown zeigt die verbleibende Zeit bis zum nächsten Schritt (Schließung der Anmeldungen, Start der Kämpfe, nächste Runde), und ein Feld zeigt, wie viele Mitglieder deiner Allianz bereits von der Gesamtzahl angemeldet sind.</p>
            <p>Sobald die Arena vorbei ist, behält der Tab auch die <strong>Bilanz</strong> deiner Allianz (Anzahl gespielter Arenen, Meistertitel, beste erreichte Runde, Sieg-/Niederlagen-Bilanz) sowie die Historie der letzten zehn auf deinem Server gespielten Ausgaben, mit dem Ergebnis deiner Allianz und den jeweils erhaltenen Belohnungen.</p>

            <h2 id="spectateur">Zuschauermodus</h2>
            <p>Nicht für die laufende Arena angemeldet? Du kannst die Matches <strong>deiner Allianz</strong> trotzdem live über den Arena-Tab verfolgen: Der Sektor wird genau wie für einen Piloten angezeigt, aber du kannst keinen Befehl geben.</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li><strong>Nimm den Nexus früh</strong>: Er bringt so viel wie drei Welten. Aber das weiß jeder.</li>
                <li><strong>Trenne deine Jäger ab</strong>: Ein schnelles Geschwader erobert Welten, während deine schwere Flotte das Zentrum hält.</li>
                <li><strong>Komm gemeinsam an</strong>: Flotten, die innerhalb derselben 5 Sekunden eintreffen, kämpfen zusammen; eine einzelne Flotte wird zerstört und verschenkt 5 Punkte.</li>
                <li><strong>Halte eine Werft</strong>: Dort werden deine Flotten doppelt so schnell repariert wie an der Basis.</li>
                <li><strong>Campe nicht</strong>: Ein eroberter Planet bleibt deiner, wenn du abfliegst. Hol dir den nächsten.</li>
                <li><strong>Eine Basis nimmt man gemeinsam</strong>: Allein eine intakte Basis anzugreifen heißt Punkte verschenken. Mit mehreren Verbündeten im selben 5-Sekunden-Fenster sind es 50 Punkte auf einen Schlag.</li>
                <li><strong>Gib mindestens einen Befehl</strong>: Ohne eigenen Befehl kein individueller Bonus.</li>
            </ul>

            <h2 id="mobile">Auf dem Handy</h2>
            <p>Die Arena lässt sich auf dem Handy mit dem Finger spielen:</p>
            <ul>
                <li><strong>Querformat</strong> wird beim Betreten des Matches in der mobilen App erzwungen. Im mobilen Browser, wo das Spiel den Bildschirm nicht drehen kann, fordert dich eine Meldung auf, das Gerät zu drehen.</li>
                <li><strong>Der ganze Sektor passt auf den Bildschirm</strong>: kein Zoom, keine Kamera.</li>
                <li><strong>Drei Tipper für einen Befehl</strong>: deine Flotte (in der unteren Leiste oder durch Tippen auf ihren Planeten), der Zielplanet, dann die Schaltfläche „Senden“.</li>
                <li><strong>Rahmen und Tag</strong> jedes Planeten zeigen, wem er gehört; die Zahlen in seinen Ecken geben die Kräfte im Orbit an, deine in Grün, die des Feindes in Rot.</li>
                <li><strong>ⓘ-Schaltfläche</strong>: die Details des gewählten Planeten und das Kampfprotokoll.</li>
                <li><strong>Push-Benachrichtigung</strong>: ein Alarm bei Öffnung der Anmeldungen (08:00), mit Anmeldeschluss und Kampfbeginn.</li>
            </ul>

    ia_bots:
        title: "KI-Kommandeure (Bots)"
        category: "events"
        order: 4
        tags: "ki,bot,kuenstliche intelligenz,npc,bot,autopilot"
        summary: "Einige Server enthalten von KI gesteuerte Kommandeure. Wie sie sich verhalten, und warum."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Warum KIs?</h2>
            <p>Auf einigen Servern sind einige Kommandeure keine menschlichen Spieler, sondern <strong>künstliche Intelligenzen</strong>. Sie ermöglichen:</p>
            <ul>
                <li>den <strong>Server zu bevölkern</strong>, wenn wenige aktive Spieler da sind;</li>
                <li>den Spielern, die Kämpfe suchen, <strong>interessante Ziele</strong> zu bieten;</li>
                <li>eine lebendige Diplomatie mit glaubwürdigen Vorschlägen, Verrat und Allianzen zu simulieren.</li>
            </ul>

            <h2 id="comportement">Wie sie sich verhalten</h2>
            <p>Jeder Bot hat:</p>
            <ul>
                <li>eine <strong>Persönlichkeit</strong> (aggressiv, friedlich, opportunistisch…);</li>
                <li>eine <strong>Stimmung</strong>, die sich je nach Ereignissen entwickelt;</li>
                <li>einen <strong>strategischen Archetyp</strong> (Wirtschaftler, Militarist, Forscher…).</li>
            </ul>
            <p>Sie spielen wirklich: Sie bauen, forschen, greifen an, bilden Allianzen, verraten manchmal. Sie können deine Verbündeten ebenso wie deine schlimmsten Feinde sein.</p>
            <p>Sie wachsen <strong>jeden Tag im Tempo der aktiven Spieler</strong> des Servers (etwas schneller als der Median), ohne jemals <strong>90 % des besten Spielers</strong> zu überschreiten. Was sie im Kampf verlieren, ist endgültig verloren: Zerstört ein Spieler ihre Garnison, bauen sie sie auf diesem Planeten <strong>7 Tage</strong> lang nicht wieder auf und verstärken stattdessen ihre Geschütztürme.</p>
            <p><strong>Wo ihre Flotte ruht.</strong> Militaristische und forschende KIs halten eine Garnison im Orbit ihrer Planeten. Die anderen, vorsichtigeren behalten ihre Schiffe <strong>am Boden</strong>, wie viele Spieler, und holen sie nur zur Verteidigung hervor: Erfasst ihr Radar eine anfliegende feindliche Flotte, die sie schlagen können, schicken sie ihre Flotte in den Orbit und rufen die Schiffe ihrer nahen Planeten herbei, die rechtzeitig ankommen; gegen eine zu starke Flotte lassen sie ihre eigene auf einem anderen ihrer Planeten landen. Sie greifen auch in einen bereits laufenden Kampf über ihrem Planeten ein oder greifen eine im Orbit geparkte bewaffnete Flotte an, wenn sie gewinnen können. Wie ein Spieler reagiert eine schlafende KI nicht, und eine von einem Störsender verborgene Flotte überrascht sie. Auf einem Planeten ohne Geschütztürme lassen sie ihre Schiffe nie am Boden, wo eine Invasion sie erbeuten würde: Die Schiffe landen auf ihrem am besten verteidigten Planeten, der auch ihre erste Zuflucht ist.</p>
            <p><strong>Ihr Handel.</strong> Sie verkaufen ihre Überschüsse und die Ladung ihrer Recycler beim nächstgelegenen Händler, außer er steht unter Blockade oder wird von einer feindlichen Flotte im Angriffsmodus bewacht, die ihren Konvoi bei der Ankunft zerstören würde: Dann fliegen sie zum nächsten.</p>

            <h2 id="reconnaitre">Wie man sie erkennt</h2>
            <p>Bots erscheinen in der Rangliste wie normale Spieler. Ihr Verhalten ist kohärent, aber ein geübtes Auge erkennt oft die Muster: sehr schnelle Antworten auf Allianznachrichten, atypische Login-Zeiten, mechanische Diplomatie.</p>

            <h2 id="strategie">Mit ihnen spielen</h2>
            <ul>
                <li>Unterschätze einen Bot nicht: Einige sind echte militärische Schrecken.</li>
                <li>Ein Bot kann dich durchaus in eine Allianz einladen, kooperieren und dich dann angreifen, wenn sich die Situation ändert.</li>
                <li>Für die Immersion, behandle sie wie Spieler: Das macht den Server lebendiger.</li>
            </ul>

            <h2 id="pilote-automatique">Abwesende Spieler: der Autopilot</h2>
            <p>Meldet sich ein Spieler <strong>8 Tage</strong> lang nicht an, wechselt sein Konto in den <strong>Autopiloten</strong>: ein <strong>stummer</strong> Bot, der niemals in Chaträumen oder per Privatnachricht schreibt. Dieser Autopilot <strong>spielt nicht an seiner Stelle</strong>: Das Konto startet keine Angriffe, bewegt oder verwickelt deine Flotten nicht in Kämpfe und kolonisiert nicht. Er führt lediglich deine Bauten und Forschungen weiter und verstärkt langsam deine Geschütztürme. Die anderen KI-Kommandeure greifen ihn nicht an; andere Spieler können das weiterhin. Du kannst ihm weiterhin eine Privatnachricht schicken: Der Spieler liest sie bei seiner Rückkehr. Sobald sich der Spieler wieder anmeldet, übernimmt er sofort wieder die Kontrolle über sein Konto und findet seine Flotten genau dort, wo er sie zurückgelassen hat.</p>

    cthulhu_prophecies:
        title: "Die Prophezeiungen von Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,prophezeiung,blockade,bedrohung,ereignis,allianz,kriegspunkte,bitcoin,haendler,recycling,rangliste"
        summary: "Wenn die Bedrohungsanzeige des Servers ihren Schwellenwert erreicht, verkünden die Besessenen eine Prophezeiung: 48 Stunden später blockieren ihre Horden den Handel auf dem gesamten Server. Wie du die Anzeige liest, eine Blockade gemeinsam durchbrichst und was ein Scheitern kostet."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Was ist eine Prophezeiung?</h2>
            <p>Ein <strong>serverweiter Bedrohungspool</strong> – getrennt von deiner eigenen persönlichen Bedrohungsstufe gegenüber den Cthulhu – steigt automatisch, Tag für Tag. Erreicht er seinen Schwellenwert, veröffentlichen die <strong>Besessenen</strong> eine <strong>datierte Prophezeiung</strong> im öffentlichen Chat: In den kommenden Stunden wird eine <strong>Blockade</strong> über den gesamten Server fallen. Die Prophezeiung nennt auch, was auf dem Spiel steht, falls niemand reagiert.</p>

            <h2 id="jauge">Die Bedrohungsanzeige des Servers lesen</h2>
            <ul>
                <li>Sie ist auf der <strong>Cthulhu-Seite</strong> (der des Tower Defense) sichtbar und steigt unabhängig von deinen eigenen Kämpfen.</li>
                <li>Sie steigt um <strong>100 Punkte pro Tag</strong>; der Schwellenwert, der eine Prophezeiung auslöst, wird in <strong>etwa einer Woche</strong> erreicht.</li>
                <li>Die <strong>Besessenen</strong> veröffentlichen ein <strong>tägliches Bulletin</strong> im öffentlichen Chat mit dem aktuellen Stand – so siehst du sie kommen.</li>
                <li>Das erste Ereignis eines Servers kann nicht vor Ablauf seiner <strong>ersten zwei Wochen</strong> stattfinden.</li>
                <li>Niemals zwei Prophezeiungen (oder zwei Blockaden) gleichzeitig auf demselben Server: Die Anzeige beginnt erst wieder zu steigen, wenn das vorherige Ereignis abgeschlossen ist.</li>
            </ul>

            <h2 id="prophetie">Die Ankündigung</h2>
            <p>Sobald der Schwellenwert überschritten ist, posten die Besessenen ihre Prophezeiung im Chat: Die Frist läuft <strong>~48 Stunden später</strong> ab. Die Nachricht nennt ausdrücklich, was auf dem Spiel steht – die Blockade, der Tribut, die Allianz-Rangliste, das Schicksal der Trümmerfelder – keine verborgenen Regeln, die man erst hinterher entdeckt.</p>

            <h2 id="blocus">Die Blockade</h2>
            <p>Bei Ablauf der Frist postiert sich eine <strong>Cthulhu-Horde</strong> in der Umlaufbahn von <strong>jedem Händler</strong> und <strong>jedem Asteroiden</strong> des Servers:</p>
            <ul>
                <li><strong>Kein Verkauf</strong> mehr an blockierte Händler.</li>
                <li><strong>Kein Recycling</strong> mehr an blockierten Asteroiden.</li>
                <li>Anderswo im Universum bleiben <strong>Trümmerfelder wie gewohnt recycelbar</strong>, genau wie nach jedem anderen Kampf.</li>
                <li>Bei einem blockierten Ziel dagegen <strong>häufen sich die Trümmer deiner eigenen Angriffe vor Ort an und bleiben unerreichbar, solange die Horde lebt, die es bewacht</strong>. Vernichte sie, und <strong>dieses Ziel öffnet sich sofort wieder</strong> – ohne auf das Schicksal der Blockade auf dem restlichen Server zu warten: Verkauf oder Recycling laufen dort wieder an, und deine bereits im Orbit stehenden Recycler nehmen die Arbeit von selbst wieder auf.</li>
                <li>Hat nichts mit der Belagerung oder Hungersnot zu tun, die eine feindliche Flotte einem Spielerplaneten auferlegen kann: Hier stehen nur Handel und Recycling still.</li>
                <li>Die Blockade dauert <strong>maximal 48 Stunden</strong>.</li>
            </ul>

            <h2 id="briser">Eine Blockade gemeinsam durchbrechen</h2>
            <p>Nicht jede Horde ist gleich. Die Horden, die die <strong>Händler</strong> bewachen, liegen weit über der stärksten Flottenmacht des Servers (Spieler oder Bot): Die bezwingt niemand allein. Die Besatzungen der <strong>Asteroiden</strong> sind deutlich leichter und bleiben für eine einzelne große Flotte erreichbar – und sie stellen den Großteil der Zählung. In beiden Fällen bekommt eine <strong>Koalition</strong>, die dieselbe Horde in aufeinanderfolgenden Angriffen trifft, sie am Ende klein.</p>
            <p>Schaden, den eine Horde erlitten hat, <strong>regeneriert sich nie</strong> zwischen zwei Kämpfen: Jeder Angriff, selbst ein verlorener, schwächt sie für den nächsten. Konzentriere deine Angriffe auf dieselbe Horde, statt sie auf mehrere zu verteilen.</p>

            <h2 id="recompenses">Belohnungen</h2>
            <p>Jeder Schadenspunkt, der einer Horde zugefügt wird, wird bei der Auflösung des Ereignisses in <strong>Bitcoin und Kriegspunkten ausgezahlt</strong> – ob die Blockade durchbrochen wird oder nicht, kein Angriff ist vergebens.</p>
            <p>Die Blockade gilt als <strong>durchbrochen</strong>, sobald <strong>70 % der Horden des Servers vor Ablauf der Frist zerstört wurden</strong> – Händler und Asteroiden zählen gleich: Die Belohnungsrate wird dann für alle Beitragenden <strong>verdoppelt</strong>. Ein individueller Bericht listet am Ende des Ereignisses deinen zugefügten Schaden und deine Belohnung auf. Während der Blockade zeigt die <strong>Cthulhu-Seite</strong> den Fortschritt live: zerstörte Horden, das zu erreichende Ziel und die verbleibende Zeit.</p>

            <h2 id="echec">Der Preis des Scheiterns</h2>
            <p>Läuft die Blockade <strong>ab, ohne durchbrochen zu werden</strong>:</p>
            <ul>
                <li><strong>Jeder Spieler verliert die Hälfte seines Bitcoins</strong> – die Besessenen erheben ihren Tribut. Spieler unter <strong>Anfängerschutz</strong> und Spieler im Game Over bleiben verschont.</li>
                <li><strong>Alle Trümmerfelder aus Kämpfen im gesamten Universum werden verschlungen</strong>; <strong>Asteroiden</strong> bleiben unberührt.</li>
                <li>Auch die <strong>Bitcoin-Kasse jeder Allianz</strong> mit mindestens einem menschlichen Spieler verliert die Hälfte ihres Inhalts: Bitcoin vor Ablauf der Frist in die Kasse einzuzahlen, schützt vor nichts. Die Abgabe erscheint im Verlauf der Kasse.</li>
                <li>Die <strong>3 letzten Allianzen der Rangliste</strong> verlieren zusätzlich 72 Stunden lang Produktion (siehe unten).</li>
            </ul>
            <p>Jeder betroffene Spieler erhält einen Bericht über den verlorenen Bitcoin. Diese Einsätze werden immer in der Prophezeiung angekündigt – keine verborgene Regel.</p>

            <h2 id="classement">Die Allianz-Rangliste</h2>
            <p>Während der Blockade wird jede Allianz danach gewertet, was sie gegen den Schwarm unternimmt. Die <strong>Cthulhu-Seite</strong> zeigt die Rangliste live – und was deine Allianz gewinnen oder verlieren würde, wenn die Blockade jetzt endete.</p>
            <ul>
                <li><strong>Punkte</strong>: Schaden an einer <strong>Mauerflotte</strong> zählt doppelt; Schaden am Schwarm anderswo (Belagerung von Basen, Horden) zählt einfach; jeder <strong>Sieg im Tower Defense</strong> zählt so viel wie die Zerstörung eines Viertels einer Asteroidenmauer.</li>
                <li><strong>Punkte pro Mitglied</strong>: Die Wertung wird durch die Zahl der aktiven Mitglieder geteilt (in den letzten 7 Tagen eingeloggt, ohne Anfängerschutz). Der Schaden eines Anfängers zählt trotzdem: Rekrutieren senkt die Wertung nie.</li>
                <li><strong>Mitgliedschaft eingefroren</strong> beim Start der Blockade: Ein Allianzwechsel während des Ereignisses verschiebt weder Punkte noch Bonus noch Malus.</li>
                <li>Für eine Wertung braucht eine Allianz mindestens <strong>2 aktive Mitglieder</strong>. <strong>Spieler ohne Allianz</strong> sind nie betroffen.</li>
            </ul>
            <p><strong>Blockade gebrochen</strong>: Die 3 besten Allianzen erhalten 72 Stunden lang <strong>+15 %, +10 % und +5 % Produktion</strong>, sofern sie Punkte erzielt haben. Keine Allianz wird bestraft.</p>
            <p><strong>Blockade erlitten</strong>: Die 3 letzten Allianzen verlieren 72 Stunden lang <strong>15 %, 10 % und 5 % Produktion</strong>, zusätzlich zum Tribut. Nie mehr als die Hälfte der gewerteten Allianzen ist betroffen, und eine Allianz mit Mindesteinsatz (eine halbe zerstörte Asteroidenmauer oder zwei Tower-Defense-Siege pro aktivem Mitglied) bleibt verschont, selbst als Letzte.</p>
            <p>Jedes Mitglied erhält einen Bericht über Bonus oder Malus seiner Allianz und dessen Ende. Die Besessenen kündigen den Start der Blockade im Chat an, erinnern 6 Stunden vor Ablauf der Frist daran und nennen am Ende die belohnten oder bestraften Allianzen.</p>

            <h2 id="conseils">In der Praxis</h2>
            <ul>
                <li>Behalte das <strong>tägliche Bulletin</strong> der Besessenen im Blick: Es gibt dir ein Gefühl dafür, wie viel Zeit bis zum Schwellenwert bleibt.</li>
                <li>Sobald eine <strong>Prophezeiung</strong> angekündigt wird, warne deine Allianz: Du hast <strong>48 Stunden</strong>, um dich zu organisieren, bevor die Blockade fällt.</li>
                <li>Konzentriere Angriffe auf dieselben Horden, statt sie zu verstreuen: Schaden bleibt erhalten, eine Horde fertigzumachen ist besser, als mehrere nur anzukratzen.</li>
                <li>Selbst ein verlorener Angriff zahlt sich aus: Warte nicht auf einen sicheren Sieg, um anzugreifen.</li>
                <li>Nicht genug Flotte für eine Mauer? Ein <strong>Sieg im Tower Defense</strong> während der Blockade bringt deiner Allianz ebenfalls Punkte.</li>
            </ul>

    notifications:
        title: "Push-Benachrichtigungen"
        category: "beginner"
        order: 10
        tags: "benachrichtigung,push,alarm,mobil,browser,einstellung"
        summary: "Erhalte einen Alarm auf dem Handy oder Browser, sobald ein wichtiges Ereignis in deinem Imperium eintritt."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">Wozu es dient</h2>
            <p>Area Universe wird kontinuierlich gespielt: Feindliche Flotten können eintreffen, während du bei der Arbeit bist. Die <strong>Push-Benachrichtigungen</strong> alarmieren dich in Echtzeit auf deinem Handy oder Browser, damit du rechtzeitig reagieren kannst.</p>

            <h2 id="evenements">Was du empfangen kannst</h2>
            <ul>
                <li><strong>Forschung beendet</strong> — eine Technologie ist gerade fertig geworden.</li>
                <li><strong>Gebäude fertig</strong> — deine Bauschlange ist leer.</li>
                <li><strong>Produktion fertig</strong> — deine Schiffe oder Türme sind bereit.</li>
                <li><strong>Flotte am Ziel angekommen</strong> — deine Flotte ist vor Ort.</li>
                <li><strong>Flotte im Kampf</strong> — ein Raumkampf wird gleich ausgelöst.</li>
                <li><strong>Feindliche Flotte nähert sich</strong> — jemand rast auf einen deiner Planeten zu.</li>
                <li><strong>Planet unter Angriff</strong> — Bodeninvasion im Gange.</li>
                <li><strong>Planet unter Embargo</strong> — einer deiner Planeten ist belagert.</li>
                <li><strong>Atomschlag erhalten</strong> — eine Bombe ist auf dich niedergegangen.</li>
                <li><strong>Allianz im Krieg</strong> — Kriegserklärung, die deine Allianz einbezieht.</li>
                <li><strong>Private / Allianz-Nachricht</strong> — neue Nachricht empfangen.</li>
                <li><strong>Held gefangen / befreit</strong> — Gefängnisereignis.</li>
                <li><strong>Cthulhu-Angriff</strong> — Cthulhu-Horde auf deinem Planeten.</li>
            </ul>
            <p>Du kannst jeden Typ <strong>einzeln</strong> aktivieren, je nach dem, was dich interessiert.</p>

            <h2 id="activation">Wie man sie aktiviert</h2>
            <ol>
                <li>Öffne deine <strong>Einstellungen</strong> (Profilmenü).</li>
                <li>Tab <strong>Benachrichtigungen</strong>.</li>
                <li>Akzeptiere die Berechtigungsanfrage deines Browsers oder Handys.</li>
                <li>Hake die Typen ab, die dich interessieren.</li>
            </ol>
            <p>Ein Knopf <em>Alles deaktivieren</em> ermöglicht es, mit einem Klick alles abzuschalten.</p>

            <h2 id="compatibilite">Wo es funktioniert</h2>
            <ul>
                <li><strong>Mobile App</strong>: native Android und iOS.</li>
                <li><strong>Browser</strong>: Chrome, Firefox, Edge, Safari Desktop. Für Safari iOS füge die Seite zum Startbildschirm hinzu (iOS 16.4+).</li>
                <li><strong>Multi-Gerät</strong>: Wenn du auf Handy + PC verbunden bist, klingeln beide.</li>
            </ul>

            <h2 id="fehlerbehebung">Browser verweigert die Registrierung?</h2>
            <p>Bei <strong>Brave</strong> ist Googles Push-Dienst standardmäßig deaktiviert. Öffne <code>brave://settings/privacy</code>, aktiviere <strong>„Google-Dienste für Push-Benachrichtigungen verwenden“</strong> und starte den Browser vollständig neu. Bei anderen Browsern stelle sicher, dass kein VPN, Antivirus oder filternder DNS den Benachrichtigungsdienst blockiert.</p>

            <h2 id="mobil">In der Mobile-App</h2>
            <p>Auf Android und iOS bietet die Seite <strong>Benachrichtigungen</strong> einen Bereich „Benachrichtigungen für dieses Gerät“: aktiviere oder deaktiviere die Push-Benachrichtigungen des Telefons jederzeit. Sind sie blockiert, öffnet ein Button direkt die Telefon-Einstellungen. Deine Einstellungen pro Benachrichtigungstyp gelten für alle deine Geräte.</p>

            <h2 id="discord">Auf Discord</h2>
            <p>Ist dein Discord-Konto verknüpft (<strong>Meine Optionen</strong>), erreicht dich die Warnung <strong>Feindliche Flotte im Anflug</strong> auch als Discord-Direktnachricht, mit Ankunftszeit und Link zum Planeten. Höchstens eine Nachricht pro Planet alle 30 Minuten: Ein Angriff mit mehreren Flotten überflutet dich nicht. Du musst Mitglied des <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area-Universe-Discords</a> sein und Direktnachrichten von dessen Mitgliedern erlauben. Die Option ist standardmäßig aktiv und lässt sich im Bereich <strong>Discord</strong> der Benachrichtigungseinstellungen abschalten.</p>

    glossary:
        title: "Glossar"
        category: "beginner"
        order: 11
        tags: "glossar,begriffe,definitionen,vokabular,abkuerzungen"
        summary: "Alle Begriffe und Abkürzungen des Spiels, in einem Satz erklärt."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Alle Spielbegriffe</h2>
            <table>
                <tr><th>Begriff</th><th>Definition</th></tr>
                <tr><td><strong>Barge</strong></td><td>Landungsschiff für Legionäre bei Raids und Invasionen.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Hauptwährung des Spiels. Von deinen Arbeitern erzeugt.</td></tr>
                <tr><td><strong>Block</strong></td><td>Automatische Gruppierung verbündeter Flotten während eines Raumkampfes.</td></tr>
                <tr><td><strong>Bunker</strong></td><td>Verteidigungsgebäude. Erhöht die Legionärkapazität und schützt einen Teil deiner Ressourcen vor Plünderung.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Champ De Ressources (Ressourcenfeld): die nach einem Kampf zurückgelassenen Trümmer, recycelbar.</td></tr>
                <tr><td><strong>Raumwerft</strong></td><td>Gebäude, das den Bau von Schiffen ermöglicht.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Die feindlichen Kreaturen (ehemals „Zombies"). Erscheinen im PvE-Modus und auf Alien-Planeten.</td></tr>
                <tr><td><strong>Zyklus</strong></td><td>Interner Produktionsrhythmus. 10 Min für einen Planeten, 1 Min für einen Mond.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Allianz-Alarmstufe. Je niedriger die Zahl, desto angespannter die Lage.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Belagerung eines Planeten durch eine feindliche Flotte im Orbit. Verursacht eine Hungersnot.</td></tr>
                <tr><td><strong>Unterhalt</strong></td><td>Tägliche Bitcoin-Kosten deiner Truppen, Schiffe und Gebäude.</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Spielende: wirtschaftlicher Bankrott oder Verlust aller deiner Planeten.</td></tr>
                <tr><td><strong>Wirtschaftliches Game Over</strong></td><td>Dein Bitcoin-Saldo wurde nach dem Tagesbericht negativ.</td></tr>
                <tr><td><strong>Held</strong></td><td>Deine einzigartige Figur. Er entwickelt sich, kämpft und kann gefangen genommen werden.</td></tr>
                <tr><td><strong>Händler</strong></td><td>NPC auf der Karte, der deine Ressourcen gegen Bitcoins kauft.</td></tr>
                <tr><td><strong>Moon Maker</strong></td><td>Seltenes Schiff, das einen Mond auf einem Trümmerfeld erschafft (leerer Platz, min. 2M Niob und 2M Wasser).</td></tr>
                <tr><td><strong>Mothership / Mutterschiff</strong></td><td>Großes Flaggschiff. Verlangsamt die Flotte leicht.</td></tr>
                <tr><td><strong>KP</strong></td><td>Kriegspunkte. Im Kampf verdient, dienen Forschungen und der Rangliste.</td></tr>
                <tr><td><strong>Aktiver Planet</strong></td><td>Der aktuell ausgewählte Planet. Alle deine Aktionen gelten ihm.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Non-Player Character: Händler, Aliens, Cthulhu, KI-Bots.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Bodenangriff zum Plündern der Ressourcen eines Planeten (nicht zur Eroberung).</td></tr>
                <tr><td><strong>Tagesbericht</strong></td><td>Tägliche Bilanz, berechnet um 18:59 UTC: Einnahmen, Kosten und Saldo.</td></tr>
                <tr><td><strong>Recycler</strong></td><td>Schiff, das nach einem Kampf Trümmer (CDR) einsammelt.</td></tr>
                <tr><td><strong>Runde</strong></td><td>Kampfrunde. Max 100 im Raumkampf, max 10 im Bodenkampf.</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Kleines Spionageschiff. Vor jedem Angriff zu schicken.</td></tr>
                <tr><td><strong>Flottengröße</strong></td><td>Globaler Indikator der Masse deiner Flotte. Je größer, desto mehr Treibstoff verbraucht sie.</td></tr>
                <tr><td><strong>Terraformierung</strong></td><td>Forschung, die die bebaubare Größe eines Planeten vergrößert.</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Aktives Verteidigungs-Minispiel gegen die Cthulhu-Horden.</td></tr>
                <tr><td><strong>Arbeiter</strong></td><td>Bevölkerungseinheit. Produziert täglich Bitcoins. Verteidigt bei Invasionen.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Geführter Modus mit 16 Schritten zum Lernen des Spiels, zugänglich über die Einstellungen.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Spieler, der als prioritäres Ziel im Modus Search &amp; Destroy bestimmt ist.</td></tr>
            </table>

    account_deletion:
        title: "Konto und Daten löschen"
        category: "beginner"
        order: 99
        tags: "loeschung,konto,daten,dsgvo,datenschutz"
        summary: "Wie du die endgültige Löschung deines Kontos und deiner persönlichen Daten beantragst."
        related: "game_over"
        body: |
            <h2 id="ou-demander">Wo du sie beantragst</h2>
            <p>Du kannst jederzeit die Löschung deines Kontos und deiner persönlichen Daten beantragen — über die öffentliche Seite <strong>/suppression-donnees</strong> oder unten in deinen Einstellungen im Spiel.</p>

            <h2 id="irreversible">Eine endgültige Kontoaufgabe</h2>
            <p><strong>Achtung: Das ist eine endgültige Kontoaufgabe.</strong> Deine persönlichen Daten (E-Mail, soziale Kennungen, IP-Adresse, Benachrichtigungen, private Nachrichten …) werden sofort gelöscht oder anonymisiert, und du kannst dich nie wieder mit diesem Konto anmelden.</p>

            <h2 id="conserve">Was aufbewahrt wird, und warum</h2>
            <p>Um das Spielgleichgewicht zu erhalten, bestehen deine Kommandanten, Planeten und Flotten unter einem anonymen Bot-Namen weiter, ohne jede Verbindung zu deiner Identität. Öffentliche Nachrichten in den Salons werden ebenfalls aufbewahrt, künftig deinem anonymen Bot-Namen zugeordnet. Deine Zahlungshistorie wird aufbewahrt (gesetzliche Aufbewahrungspflicht), ebenfalls von deiner Identität getrennt.</p>

    achievements:
        title: "Erfolge"
        category: "progression"
        order: 11
        tags: "erfolge,achievements,trophäen,google play,play spiele,fortschritt"
        summary: "15 Konto-Erfolge, von den ersten Schritten bis zu Karriere-Leistungen, in Ihrem Profil und in Google Play Spiele."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p><strong>Erfolge</strong> belohnen, was Sie mit Ihrem Konto erreichen, <strong>über alle Server hinweg</strong>. Ein freigeschalteter Erfolg bleibt für immer erhalten, auch wenn Sie später den Planeten verlieren oder die Allianz verlassen, die ihn eingebracht hat.</p>
            <p>Sie finden sie in Ihrem <strong>serverübergreifenden Profil</strong> (Menü „Mein serverübergreifendes Profil“), mit Ihrem Fortschritt und dem Datum jeder Freischaltung. Das Profil eines anderen Spielers zeigt seine. Was Ihre bisherige Spielgeschichte bereits verdient hat, wird sofort freigeschaltet.</p>
            <h2 id="liste">Die 15 Erfolge</h2>
            <table>
            <tr><th>Erfolg</th><th>Bedingung</th><th>Punkte</th></tr>
            <tr><td>Kommandant</td><td>Das Tutorial abschließen</td><td>20</td></tr>
            <tr><td>Baumeister</td><td>Einen ersten Bau abschließen</td><td>20</td></tr>
            <tr><td>Gelehrter</td><td>Eine erste Forschung abschließen</td><td>20</td></tr>
            <tr><td>Kolonist</td><td>2 Planeten besitzen</td><td>20</td></tr>
            <tr><td>Verbündeter</td><td>Einer Allianz beitreten oder eine gründen</td><td>20</td></tr>
            <tr><td>Veteran I, II, III</td><td>10, 100 und dann 1.000 Raumschlachten bestreiten</td><td>25, 50, 100</td></tr>
            <tr><td>Eroberer I, II</td><td>10 und dann 100 erfolgreiche Invasionen durchführen</td><td>50, 100</td></tr>
            <tr><td>Kerkermeister</td><td>Einen feindlichen Helden gefangen nehmen</td><td>50</td></tr>
            <tr><td>Cthulhu-Jäger</td><td>Eine Tower-Defense-Partie gewinnen</td><td>50</td></tr>
            <tr><td>Elite</td><td>Einen Server unter den Top 10 beenden</td><td>100</td></tr>
            <tr><td>Imperator</td><td>Einen Server gewinnen</td><td>200</td></tr>
            <tr><td>Ein geheimer Erfolg</td><td>Beim Spielen zu entdecken</td><td>50</td></tr>
            </table>

            <h2 id="progression">Der Fortschritt</h2>
            <p>Schlacht- und Invasionserfolge steigen in Stufen, und Ihr Profil zeigt den Zähler (zum Beispiel 37 / 100). Jede bestrittene Raumschlacht zählt, gewonnen oder verloren, auch die Zerstörung einer unbewaffneten Flotte (Frachter, Recycler, Sonden), für beide Seiten; Invasionen zählen, wenn sie gelingen (Raubzüge zählen nicht). Elite und Imperator entscheiden sich am Ende eines Servers.</p>
            <h2 id="google-play">Google Play Spiele (Android)</h2>
            <p>In der Android-App erscheinen Ihre Erfolge auch in <strong>Google Play Spiele</strong>, mit dem Banner „Erfolg freigeschaltet“.</p>
            <ul>
            <li><strong>Testkonto</strong>, in der App erstellt: Es wird automatisch mit Ihrem Google-Play-Spiele-Profil verknüpft. Es wird dann nach 7 Tagen ohne Spiel nicht mehr gelöscht und öffnet sich nach einer Neuinstallation oder auf einem neuen Telefon von selbst.</li>
            <li><strong>Registriertes Konto</strong>: Verknüpfen Sie es in Ihrem serverübergreifenden Profil (Karte „Google Play Spiele“). Es öffnet sich danach mit diesem Google-Play-Spiele-Profil ohne Passwort: Tun Sie das nur auf Ihrem eigenen Gerät. Über dieselbe Karte können Sie die Verknüpfung jederzeit aufheben, auf der Website wie in der App.</li>
            <li>Die Schaltfläche <strong>„Play Jeux“</strong> auf dem Anmeldebildschirm öffnet das verknüpfte Konto erneut. Wenn Sie sich abmelden, öffnet sich das Konto auf diesem Gerät nicht mehr von selbst: Dann öffnet diese Schaltfläche es wieder.</li>
            </ul>
            <p>Ein Google-Play-Spiele-Profil lässt sich nur mit einem einzigen Area-Konto verknüpfen, und ein Konto nur mit einem Profil. Wenn Sie Ihr Konto über Ihr Profil verknüpfen, wird das Google-Play-Spiele-Profil von dem anderen Konto gelöst, mit dem es gegebenenfalls verknüpft war.</p>

