    moderation_blocking:
        title: "Moderation: melden und blockieren"
        category: "beginner"
        order: 12
        tags: "moderation,melden,blockieren,chat,nachrichten,bedingungen,sanktion"
        summary: "Melde eine missbräuchliche Nachricht, blockiere einen unerwünschten Spieler, sieh, was die Moderation tut, und finde die Regeln, die jeder beim ersten Login akzeptiert."
        related: "salon,account_deletion,faq"
        body: |
            <h2 id="bedingungen">Nutzungsbedingungen</h2>
            <p>Beim ersten Login akzeptiert jeder Spieler die <strong>Nutzungsbedingungen</strong> und die Regeln der Community: Respekt gegenüber anderen Spielern (keine Belästigung, keine Beleidigungen, keine Hassrede), keine illegalen, obszönen oder verleumderischen Inhalte in den Salons, Nachrichten und Namen, kein Betrug, kein missbräuchliches Multi-Konto und keine Ausnutzung von Bugs. Eine Ablehnung loggt dich aus. Ändern sich die Bedingungen, müssen sie erneut akzeptiert werden.</p>

            <h2 id="melden">Eine Nachricht melden</h2>
            <p>Jede Nachricht eines anderen Spielers in den Salons und jede empfangene private Nachricht (außer den anonym gesendeten) trägt ein <strong>Flaggen</strong>-Symbol. Ein Klick öffnet die Auswahl des Grundes: <strong>Beleidigungen / Belästigung</strong>, <strong>Spam</strong> oder <strong>Anderer unangemessener Inhalt</strong>. Die Meldung geht mit einer Kopie der Nachricht an das Moderationsteam.</p>
            <p>Ein Spieler kann auch über sein Profil mit dem Button <strong>Melden</strong> gemeldet werden: Multi-Konto, Beleidigungen / Belästigung, Betrug, Spam oder Sonstiges.</p>
            <p>Grenzen: <strong>drei Meldungen pro Tag</strong> (der Zähler springt um Mitternacht, Pariser Zeit, zurück) und <strong>nur eine Meldung pro Spieler, endgültig</strong>, egal ob über eine Flagge oder sein Profil. Darüber hinaus zeigt das Spiel „Du hast diesen Spieler bereits gemeldet oder das Tageslimit erreicht.“</p>

            <h2 id="moderation">Was die Moderation tut</h2>
            <p>Eine Meldung löst keine automatische Sanktion aus: Jede wird vom Moderationsteam geprüft, das auch sieht, wer sie gesendet hat. Mehrere Meldungen gegen einen Spieler zu häufen reicht also nicht, um ihn sanktionieren zu lassen, und eine missbräuchliche Meldung hat keine direkte Wirkung auf die betroffene Person.</p>
            <p>Je nach Schwere kann die Moderation einem Spieler für eine bestimmte Dauer verbieten, in den Salons und per private Nachricht zu schreiben, oder sein Konto sperren.</p>

            <h2 id="blockieren">Einen Spieler blockieren</h2>
            <p>Der Button <strong>Blockieren</strong> im Profil eines Spielers blendet sofort alle seine Nachrichten in den Chat-Salons aus und verhindert jeden Austausch privater Nachrichten, in beide Richtungen. Die Blockierung gilt seinem Konto: Sie gilt auf allen Servern, auf denen du ihm begegnest.</p>
            <p>Die Liste der blockierten Spieler verwaltest du unter <strong>Optionen</strong> (Abschnitt „Blockierte Spieler“): Jeder Spieler kann dort jederzeit mit dem Button <strong>Freigeben</strong> wieder freigegeben werden.</p>
    getting_started:
        title: "Erste Schritte"
        category: "beginner"
        order: 1
        tags: "anfang,starten,neu,tutorial,anleitung"
        summary: "Willkommen! Der kürzeste Leitfaden, um Area Universe zu verstehen und deine ersten Spielstunden zu meistern."
        related: "interface_guide,resources_intro,first_buildings"
        body: |
            <h2 id="cest-quoi">Was ist Area Universe?</h2>
            <p>Area Universe ist ein <strong>Weltraum-Strategiespiel für mehrere Spieler</strong>. Du führst ein Imperium: Deine Planeten produzieren Ressourcen, deine Schiffe durchstreifen die Galaxie, und deine Allianzen besiegeln das Schicksal der Spieler.</p>
            <p>Es ist ein Spiel, <strong>das auf Dauer angelegt ist</strong>: Deine Ressourcen sammeln sich auch an, wenn du offline bist. Ein paar Minuten pro Tag genügen, um voranzukommen.</p>

            <h2 id="objectif">Dein Ziel</h2>
            <p>Je nach gewähltem Servermodus (siehe den Artikel <em>Die Servermodi</em>) ist das Endziel unterschiedlich: am längsten durchhalten, die Rangliste dominieren, als Letzter stehen bleiben usw. Aber das Rezept ist immer dasselbe:</p>
            <ol>
                <li><strong>Eine Wirtschaft in Gang bringen</strong> (Ressourcen + Währung).</li>
                <li><strong>Eine Flotte und eine Verteidigung aufbauen</strong>.</li>
                <li><strong>Dich verbünden</strong>, um gemeinsam Gewicht zu haben.</li>
            </ol>

            <h2 id="premieres-actions">Deine ersten 6 Aktionen</h2>
            <p>Dein Startplanet ist nicht leer: Er besitzt bereits eine Niobium-Mine und einen Wasserextraktor der Stufe 3, eine Raumwerft, ein Bodenradar und eine kleine Flotte am Boden (10 Sonden, 5 Jäger, 2 Fregatten und 1 Kolonisator).</p>
            <ol>
                <li><strong>Baue deine Niobium-Mine und deinen Wasserextraktor aus</strong> (Seite <em>Gebäude</em>).</li>
                <li><strong>Füge ein Agrarfeld hinzu</strong>: Deine Arbeiter essen Rationen (die Nahrung des Spiels).</li>
                <li><strong>Erforsche Stadtentwicklung und baue dann eine Große Stadt</strong>: +25.000 maximale Arbeiter pro Stufe. Die Arbeiter sind deine Lieferanten von <em>Bitcoins</em> (der Währung des Spiels).</li>
                <li><strong>Baue ein Forschungszentrum</strong>: Es beherbergt deine Wissenschaftler, die deine Forschungsgeschwindigkeit stufenweise erhöhen (siehe <em>Arbeiter und Wissenschaftler</em>).</li>
                <li><strong>Schicke Frachter los, um deine Überschüsse zu verkaufen</strong>: Niobium und Wasser an einen Händler. Klicke auf der <em>Räumlichen Karte</em> auf den Händler, dann auf <em>Interaktion</em>, wähle deine Frachterflotte und die Mission <em>Entladen und zurückkehren</em>. Der Cargo I erfordert die Forschung <em>Frachtmanagement</em>.</li>
                <li><strong>Tritt einer Allianz bei</strong>: <strong>+20&nbsp;%</strong> Produktion von Niobium, Wasser und Rationen auf allen deinen Planeten und Zugang zu den Allianzforschungen.</li>
            </ol>
            <p>Denk auch daran, mit deinem Start-Kolonisator einen <strong>2. Planeten zu besiedeln</strong>: Dafür ist keine Forschung nötig (siehe den Artikel <em>Einen neuen Planeten besiedeln</em>).</p>

            <h2 id="tutoriel">Das integrierte Tutorial</h2>
            <p>Ein <strong>interaktives Tutorial</strong> führt dich Schritt für Schritt durch 5 Kapitel: Erste Schritte, Militärische Macht, Erkunden und erobern, Wirtschaft entwickeln, Diplomatie und Gemeinschaft. Bei deiner ersten Anmeldung wählst du deinen Pfad:</p>
            <table>
                <thead>
                    <tr><th>Pfad</th><th>Schritte</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Komplette Entdeckung</strong></td><td>18</td></tr>
                    <tr><td><strong>Ausgewogener Pfad</strong></td><td>17 (ohne die Erinnerung zum Klick auf einen Planeten)</td></tr>
                    <tr><td><strong>Direkt zum Kern</strong></td><td>8 (nur das, was Area Universe eigen ist)</td></tr>
                    <tr><td><strong>Ich entdecke selbst</strong></td><td>keine</td></tr>
                </tbody>
            </table>
            <p>Die Schritte, Kapitel für Kapitel (* = Schritte des Pfads <em>Direkt zum Kern</em>):</p>
            <ol>
                <li><strong>Erste Schritte</strong>: Ihre Ressourcen*, Anfängerschutz*, Ihr Imperium*.</li>
                <li><strong>Militärische Macht</strong>: Eine Flotte erstellen, Schiffe produzieren, Schiffe verbessern*, Die Arena entdecken*, Flotten in Kohorten organisieren.</li>
                <li><strong>Erkunden und erobern</strong>: Die Weltraumkarte, Einen Planeten auswählen, Mit einem Planeten interagieren, Einen Planeten kolonisieren, Planeten verteidigen.</li>
                <li><strong>Wirtschaft entwickeln</strong>: Gebäude errichten, Forschung starten.</li>
                <li><strong>Diplomatie und Gemeinschaft</strong>: Einer Allianz beitreten*, Das Wiki*, Der Salon*.</li>
            </ol>
            <p>Manche Modi streichen Schritte: den der Forschungen in <em>Search &amp; Destroy</em> und in <em>Dominanz</em>, den der Forschungen und der Allianz in <em>Battle Royale</em>. Der Zähler „Schritt X von N“ im Leitfaden zeigt immer die Gesamtzahl deines Pfads an.</p>
            <p>Jeder geschaffte Schritt bringt eine Belohnung. Egal welchen Pfad du wählst, du erhältst insgesamt <strong>232.000 Bitcoins, 150 Legionäre, 100 Arbeiter, 500 Kriegspunkte und 2 Jäger</strong>: Was dein Pfad überspringt, wird dir am Ende als Bonus ausgezahlt (sofort bei <em>Ich entdecke selbst</em>).</p>
            <ul>
                <li>Du kannst es jederzeit verlassen (<em>Tutorial beenden</em>) und unterwegs den Pfad wechseln; bereits erledigte Schritte bleiben dir erhalten.</li>
                <li>Um es neu zu starten: Seite <strong>Einstellungen</strong>, Bereich <em>Tutorial</em>.</li>
            </ul>

            <h2 id="a-surveiller">Von Anfang an im Blick behalten</h2>
            <ul>
                <li><strong>Positive Bitcoins</strong>: Jeden Tag um <strong>18:59 Uhr (Pariser Zeit)</strong>, also 17:59 UTC im Winter und 16:59 UTC im Sommer, berechnet eine Bilanz deine Einnahmen und deine Unterhaltskosten. Rutscht dein Guthaben ins Minus, tritt das <strong>wirtschaftliche Game Over</strong> ein: Du verlierst alle deine Flotten und alle deine Schiffe, und dein Guthaben startet wieder bei 125.000 Bitcoins (du behältst deine Planeten und deine Gebäude).</li>
                <li><strong>Lager</strong>: Wenn deine Lagerhäuser voll sind, stoppt die Produktion. Baue entsprechend Lager.</li>
                <li><strong>Tägliche Quests</strong>: 3 Quests pro Tag (Seite <em>Ziele</em>), jede mit Kriegspunkten belohnt, dazu ein Bonus in Höhe ihrer durchschnittlichen Belohnung, wenn du alle erledigst.</li>
            </ul>

            <h2 id="protection-debutant">Der Anfängerschutz</h2>
            <p>In deinen ersten Tagen bist du <strong>geschützt</strong>: Kein Spieler kann eine Flotte zu deinen Planeten schicken. Niemand kann dich also angreifen, plündern, invadieren, bombardieren oder auch nur ausspionieren; ein Verbündeter kann dir auch keine Ressourcen liefern. Flotten, die bereits zu dir unterwegs sind, werden zurückgeschickt. Genug Zeit, um in Ruhe deine ersten Basen aufzubauen.</p>
            <p>Der Schutz endet, sobald eine dieser Bedingungen erfüllt ist:</p>
            <ul>
                <li>Seit der Erstellung deines Kommandanten sind <strong>7 Tage</strong> vergangen.</li>
                <li>Du besitzt einen <strong>4. Planeten</strong> (deine Monde zählen nicht).</li>
                <li>Du schickst selbst eine <strong>Angriffsmission</strong> los (Plünderung, Invasion oder Atomschlag): Du verzichtest dann sofort auf deinen Schutz.</li>
                <li>Du aktivierst den <strong>Angriffsmodus</strong> einer deiner Flotten.</li>
            </ul>
            <p>In den beiden letzten Fällen warnt dich vorher ein Bestätigungsfenster. Nutze diese Zeit, um eine solide Wirtschaft und Verteidigung aufzubauen, bevor du dich in die Schlacht stürzt.</p>

    interface_guide:
        title: "Die Oberfläche verstehen"
        category: "beginner"
        order: 2
        tags: "oberflaeche,bildschirm,menue,navigation,knoepfe,aktiver planet,ressourcenleiste,rationen,einstellungen,optionen"
        summary: "Die 3 Bereiche des Bildschirms und wie du dich zurechtfindest, ohne dich zu verirren."
        related: "getting_started,resources_intro,reports,faq"
        body: |
            <h2 id="disposition">Die 3 Bereiche des Bildschirms</h2>
            <ul>
                <li><strong>Die Ressourcenleiste, oben</strong> — deine Ressourcen, deine Bitcoins, deine Kriegspunkte und der Name deines <strong>aktiven Planeten</strong>: Tippe darauf, um den Planeten zu wechseln.</li>
                <li><strong>Das Menü</strong> — alle Bereiche des Spiels (Globale Sicht, Held, Flotten, Planeten, Gebäude, Räumliche Karte, Allianz, Bericht, Nachrichten, Salon…). Seine Position hängt von deinem Bildschirm ab (siehe unten).</li>
                <li><strong>Der zentrale Bereich</strong> — der Inhalt der aktuellen Seite (Karte, Flottenliste, Gebäude…). Nur dieser Bereich scrollt.</li>
            </ul>
            <p>Die Position des Menüs hängt von deinem Bildschirm ab:</p>
            <ul>
                <li><strong>Am Computer</strong>: Das vollständige Menü steht links. Ganz unten öffnet eine Reihe von Symbolen die Fehlermeldung, das Tutorial (falls es läuft), die <strong>Benachrichtigungen</strong>, die <strong>Einstellungen</strong>, die <strong>Optionen</strong> deines Kontos, dein <strong>serverübergreifendes Profil</strong> und die Wahl der <strong>Sprache</strong>.</li>
                <li><strong>Am Handy im Querformat und in der Android-App</strong>: Eine Symbolleiste klebt am linken Rand. Sie behält dauerhaft die fünf wichtigsten Ziele — Globale Sicht, Räumliche Karte, Gebäude, Raumwerft und Verteidigung — und die Schaltfläche <strong>Menü</strong> (…), die alles andere in einem Panel öffnet, das von unten hochfährt.</li>
                <li><strong>Am Tablet oder am Handy im Hochformat</strong> (im Browser): Diese fünf Ziele und die Schaltfläche <strong>Menü</strong> bilden eine Leiste am unteren Bildschirmrand.</li>
            </ul>
            <p>Die Zahl auf der Schaltfläche Menü addiert deine neuen Berichte, privaten Nachrichten, Salon-Nachrichten und ausstehenden Arena-Duelle.</p>

            <h2 id="barre-ressources">Die Ressourcenleiste (oben)</h2>
            <p>Sie zeigt in Echtzeit die Ressourcen deines aktiven Planeten an:</p>
            <ul>
                <li><strong>Niobium</strong> — das Grunderz (Gebäude, Schiffe).</li>
                <li><strong>Wasser</strong> — unverzichtbar für den Bau und für die Schiffe.</li>
                <li><strong>Rationen</strong> (die Nahrung) — von deinen Arbeitern verbraucht: 1 Ration pro Stunde für 500 Arbeiter. Fallen sie auf null, tötet die Hungersnot zuerst Arbeiter, dann auch Legionäre und schließlich Mechs.</li>
                <li><strong>Uranium</strong> — seltene Ressource (Atombomben, Atombasis, Arena-Einsätze). Sie erscheint nur, wenn der Planet welches besitzt.</li>
            </ul>
            <p>Niobium, Wasser, Rationen und deine Arbeiter steigen Sekunde für Sekunde im Takt deiner Produktion, bis zu deiner Lagergrenze; die Rationen können auch sinken, wenn deine Arbeiter mehr essen, als du produzierst. Tippe auf Niobium, Wasser oder Rationen, um ihre Produktion pro Stunde zu sehen, Boni inklusive (Held, Sklavenlager, Allianz, Monde, Embargo); bei den Rationen ist es die Nettobilanz nach Abzug des Verbrauchs.</p>
            <p>Auch die <strong>Bitcoins</strong> (Währung) und die <strong>Kriegspunkte (KP)</strong> werden in der Leiste angezeigt, ebenso deine Arbeiter, Legionäre, Wissenschaftler und Mechs sowie der belegte Platz am Boden (<strong>Boden</strong>) und im Orbit (<strong>Raum</strong>) in der Form „belegt/Maximum“.</p>
            <p><em>Am Handy ist die Leiste eingeklappt: Sie zeigt nur Niobium, Wasser, Rationen, Uranium, Bitcoins und KP, dazu jede Ressource mit Warnung (Hungersnot, Bedrohung im Orbit). Die Pfeiltaste am Ende der Leiste, die die Zahl der ausgeblendeten Ressourcen anzeigt, klappt sie aus.</em></p>

            <h2 id="planete-active">Aktiver Planet: Was das bedeutet</h2>
            <p>Wenn du mehrere Planeten hast, ist immer nur einer <strong>aktiv</strong>. Alle deine Aktionen (bauen, ein Schiff fertigen, eine Flotte starten) gelten für diesen Planeten.</p>
            <p>Zum Wechseln:</p>
            <ul>
                <li>Tippe in der Ressourcenleiste auf den Namen des Planeten: Die Liste <strong>Meine Planeten</strong> öffnet sich (am Handy in einem Panel, das von unten hochfährt, am Computer direkt unter der Leiste); wähle einen aus;</li>
                <li>oder nutze die Pfeile ‹ und › links und rechts vom Namen, um zum vorherigen oder nächsten Planeten zu wechseln.</li>
            </ul>
            <p>Du bleibst auf derselben Seite, die nun für den neuen Planeten angezeigt wird. Die Reihenfolge der Liste stellst du in den <strong>Einstellungen</strong> unter „Planetensortierung“ ein: alphabetisch, Position, Besiedlung oder Größe.</p>

            <h2 id="navigation">Sich schnell zurechtfinden</h2>
            <ul>
                <li><strong>Globale Sicht</strong> — dein Kommandant, deine Flotten, deine Finanzen, die laufende Forschung und die Aktivität aller deiner Planeten.</li>
                <li><strong>Gebäude</strong> — die Gebäude des aktiven Planeten bauen.</li>
                <li><strong>Raumwerft</strong> und <strong>Verteidigung</strong> — Schiffe und Verteidigungsanlagen auf dem aktiven Planeten produzieren.</li>
                <li><strong>Planeten</strong> — die Liste aller deiner Planeten und der Markt.</li>
                <li><strong>Flotten</strong> — deine Schiffe erstellen, senden und verfolgen.</li>
                <li><strong>Räumliche Karte</strong> — die Galaxie erkunden.</li>
                <li><strong>Bericht</strong> — alles, was das Spiel dir meldet (Kämpfe, Ankünfte, Allianz…).</li>
                <li><strong>Nachrichten</strong> — deine privaten Nachrichten; <strong>Salon</strong> — die Chaträume.</li>
                <li><strong>Allianz</strong> — Mitglieder, Bank, Diplomatie, Allianzarena.</li>
                <li><strong>Einstellungen</strong> — dein Pseudonym und deine Einstellungen auf diesem Server; <strong>Optionen</strong> — dein Konto (E-Mail, Passwort, Zeitzone, blockierte Spieler, Verknüpfung deines Discord-Kontos).</li>
                <li><strong>Server</strong> — den Server wechseln.</li>
            </ul>
            <p>Je nach Servermodus erscheinen manche Einträge nicht (Forschungen, Allianz oder Cthulhu).</p>

    resources_intro:
        title: "Die Ressourcen"
        category: "beginner"
        order: 3
        tags: "ressourcen,niobium,wasser,nahrung,rationen,uranium,produktion,lagerung,zyklus"
        summary: "Die 4 Ressourcen des Spiels, wie man sie produziert und warum die Lagerung entscheidend ist."
        related: "buildings,workers_scientists,bitcoin_economy"
        body: |
            <h2 id="les-4">Die 4 Ressourcen des Spiels</h2>
            <table>
                <thead>
                    <tr><th>Ressource</th><th>Wofür sie dient</th><th>Wie man sie erhält</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Niobium</strong></td><td>Gebäude, Schiffe und Verteidigungsanlagen bauen</td><td>Niobium-Mine</td></tr>
                    <tr><td><strong>Wasser</strong></td><td>Gebäude, Schiffe und Verteidigungsanlagen bauen</td><td>Wasserextraktor</td></tr>
                    <tr><td><strong>Nahrung</strong> („Rationen“ im Spiel)</td><td>Deine Arbeiter ernähren</td><td>Agrarfeld und Aeroponische Farm (ihre Produktionen addieren sich)</td></tr>
                    <tr><td><strong>Uranium</strong></td><td>Nuklearbasis, Atombomben, Abfangraketen, Arena-Einsätze</td><td>Recycling von Uranium-Trümmern, Siege über die Cthulhu</td></tr>
                </tbody>
            </table>
            <p>Nur die <strong>Arbeiter</strong> essen: 1 Ration pro Stunde für 500 Arbeiter. Wenn die Rationen knapp werden, tötet die Hungersnot Arbeiter, und bei längerer Dauer auch Legionäre und Mechs.</p>
            <p>Neben diesen Ressourcen ist der <strong>Bitcoin</strong> die Währung des Spiels: Er bezahlt die Forschungen, die Rekrutierungen, den Treibstoff der Flotten und den täglichen Unterhalt (siehe <a href="/wiki/bitcoin_economy">Bitcoins und Unterhalt</a>).</p>

            <h2 id="cycle">Der Produktionszyklus</h2>
            <p>Deine Ressourcen treffen automatisch und fortlaufend ein. Die produzierten Mengen werden pro <strong>Produktionszyklus</strong> angegeben, und das Spiel schreibt dir anteilig zur verstrichenen Zeit gut:</p>
            <ul>
                <li>Auf einem <strong>Planeten</strong>: Zyklus von <strong>10 Minuten</strong>.</li>
                <li>Auf einem <strong>Mond</strong>: Zyklus von <strong>1 Minute</strong> (10-mal schneller, nur für die Nahrung).</li>
            </ul>
            <p>Die Produktion ist <strong>proportional zur Stufe</strong> des Gebäudes. Pro Stufe und pro Zyklus von 10 Minuten:</p>
            <ul>
                <li><strong>Niobium-Mine</strong>: 33 Niobium;</li>
                <li><strong>Wasserextraktor</strong>: 22 Wasser;</li>
                <li><strong>Agrarfeld</strong>: 27 Rationen;</li>
                <li><strong>Aeroponische Farm</strong>: 37 Rationen.</li>
            </ul>
            <p>Beispiel: Eine Niobium-Mine der Stufe 10 produziert alle 10 Minuten 330 Niobium, also 1.980 pro Stunde, vor Boni. Die Ressourcenleiste zeigt deine tatsächliche Produktion pro Stunde an, Boni inklusive.</p>

            <h2 id="bonus">Was deine Produktion verbessert</h2>
            <ul>
                <li><strong>Einer Allianz beitreten</strong>: sofort <strong>+20&nbsp;%</strong> auf Niobium, Wasser und Rationen.</li>
                <li><strong>Allianzforschungen und Allianzverbesserungen</strong>: die Forschung „Produktionsgesetz“ (+7&nbsp;% pro Stufe, Allianzen der Waage der Welten) und die Verbesserungen „Niobiumproduktion“, „Wasserproduktion“ und „Rationenproduktion“ (jeweils +2&nbsp;% pro Stufe).</li>
                <li><strong>Auf dem Planeten stationierter Held</strong>: Bonus aus seiner Intelligenz, verdoppelt bei einem Wirtschaftshelden.</li>
                <li><strong>Sklavenlager</strong>: +2,5&nbsp;% pro Stufe.</li>
            </ul>
            <p>Die Größe des Planeten ändert nichts daran, was eine Stufe produziert: Der verfügbare Platz begrenzt nur die Zahl der Stufen, die du bauen kannst.</p>

            <h2 id="stockage">Die Lagerung (nicht vernachlässigen!)</h2>
            <p>Jeder Planet hat pro Ressource eine <strong>maximale</strong> Lagerkapazität. <strong>Ist sie voll, geht alles, was zusätzlich produziert wird, verloren</strong>.</p>
            <p>Zu Beginn lagert ein Planet 200.000 Niobium, 180.000 Wasser und 150.000 Rationen. Um die Kapazität zu erhöhen:</p>
            <ul>
                <li><strong>Niobium-Lager</strong>: +1.200.000 Niobium pro Stufe;</li>
                <li><strong>Wasserreservoir</strong>: +800.000 Wasser pro Stufe;</li>
                <li><strong>Agrarsilo</strong>: +800.000 Rationen pro Stufe.</li>
            </ul>
            <p>Sie werden mit der Forschung <strong>Frachtmanagement</strong> Stufe 1 freigeschaltet; das Agrarsilo erfordert zusätzlich die Forschung <strong>Aeroponik</strong>. Uranium hingegen hat keine Lagergrenze.</p>
            <p><em>Tipp für Anfänger:</em> Prüfe dein Lager, <strong>bevor</strong> du dich für die Nacht abmeldest. Nichts ist schlimmer, als seine Minen 10 Stunden lang stillstehend vorzufinden.</p>

    bitcoin_economy:
        title: "Bitcoins und Unterhalt"
        category: "beginner"
        order: 4
        tags: "bitcoin,waehrung,unterhalt,kosten,tabelle,treibstoff,wirtschaft,game over,tagesbericht"
        summary: "Der Bitcoin ist die Währung des Spiels. Wie du welche verdienst und vor allem, wie du den Bankrott vermeidest."
        related: "daily_report,workers_scientists,game_over"
        body: |
            <h2 id="cest-quoi">Was ist der Bitcoin?</h2>
            <p>Der <strong>Bitcoin</strong> ist die <strong>universelle Währung</strong> von Area Universe (nichts mit der echten Krypto zu tun, es ist nur ein Augenzwinkern). Du startest mit <strong>125.000 Bitcoins</strong>. Sie dienen dazu:</p>
            <ul>
                <li><strong>Forschungen</strong> zu starten.</li>
                <li><strong>Legionäre</strong> (je 8 Bitcoins), <strong>Mechs</strong> (60) und <strong>Wissenschaftler</strong> (25) zu rekrutieren und <strong>Atombomben</strong> (25.000) zu fertigen.</li>
                <li>den <strong>Treibstoff</strong> jeder Flotte zu bezahlen, die du losschickst.</li>
                <li>deine <strong>Allianz</strong> zu unterstützen: Einzahlungen in die Kasse und Investitionen in die Allianzverbesserungen.</li>
                <li>den <strong>täglichen Unterhalt</strong> deiner Truppen, Schiffe und Gebäude zu zahlen.</li>
            </ul>

            <h2 id="gagner">Wie verdient man sie?</h2>
            <ul>
                <li><strong>Arbeiter</strong> — deine Haupteinnahmequelle. Beim Tagesbericht bringt jeder auf deinen Planeten anwesende Arbeiter <strong>0,5 Bitcoin</strong> ein: 10.000 Arbeiter = 5.000 Bitcoins pro Tag, die 50.000 Arbeiter deines Startplaneten = 25.000 Bitcoins pro Tag, vor den Allianz- und Friedenssteuern. In eine Flotte eingeschiffte Arbeiter bringen nichts ein.</li>
                <li><strong>Verkauf an Händler</strong> — liefere ihnen Niobium, Wasser, Uranium und sogar Arbeiter oder Truppen, oder nutze den Ein-Klick-Verkauf der Seite <strong>Planeten</strong> (siehe <a href="/wiki/market">Markt und Händler</a>).</li>
                <li><strong>Kriegspunkte</strong> — vor allem mit den täglichen Quests verdient, werden sie auf der Seite <strong>Ziele</strong> getauscht: 1 KP = 1 Bitcoin.</li>
                <li><strong>Login-Bonus</strong> — ein Betrag bei jeder ersten Anmeldung des Tages, vervielfacht, wenn du aufeinanderfolgende Tage aneinanderreihst.</li>
                <li><strong>Plünderung</strong> — Raids bringen Niobium, Wasser und Uranium ein, die du weiterverkaufen kannst.</li>
            </ul>

            <h2 id="entretien">Der tägliche Unterhalt</h2>
            <p>Jeden Tag um <strong>18:59 Uhr (Pariser Zeit)</strong>, also 17:59 UTC im Winter und 16:59 UTC im Sommer, berechnet das Spiel eine Bilanz für dich:</p>
            <ul>
                <li><strong>Einnahmen</strong>: was deine Arbeiter einbringen.</li>
                <li><strong>Kosten</strong>: der Unterhalt deiner Legionäre, Mechs, Wissenschaftler, Schiffe und Gebäude.</li>
                <li><strong>Bilanz</strong>: Einnahmen − Steuern − Kosten, zu deinem Guthaben addiert (oder davon abgezogen).</li>
            </ul>
            <p>Alles, was <strong>in einer Flotte</strong> ist — im Flug <em>oder</em> im Orbit stationiert —, kostet deutlich mehr als das, was <strong>am Boden</strong> eines Planeten ist: 6-mal mehr für Schiffe und Legionäre, 50-mal mehr für Mechs. Eine Flotte, die nicht gebraucht wird: Stelle sie am Boden ab. Eine große Armee im Dauerausflug ruiniert am Ende selbst die Vorsichtigsten.</p>

            <h2 id="bareme">Die Unterhaltstabelle</h2>
            <p>Beträge in Bitcoins pro Tag.</p>
            <table>
                <thead>
                    <tr><th>Einheit</th><th>Am Boden</th><th>In einer Flotte</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionär</td><td>0,1</td><td>0,6</td></tr>
                    <tr><td>Mech</td><td>2</td><td>100</td></tr>
                    <tr><td>Wissenschaftler</td><td>3</td><td>2</td></tr>
                    <tr><td>Schiff</td><td>Signatur ÷ 12</td><td>Signatur ÷ 2</td></tr>
                </tbody>
            </table>
            <p>Beispiele: 10.000 Legionäre kosten am Boden 1.000 Bitcoins pro Tag, in einer Flotte 6.000. 100 Cargo X (Signatur je 50) kosten am Boden etwa 417 Bitcoins pro Tag, in einer Flotte 2.500.</p>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Pro Stufe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium-Mine, Wasserextraktor, Agrarfeld</td><td>1</td></tr>
                    <tr><td>Aeroponische Farm</td><td>2</td></tr>
                    <tr><td>Große Stadt, Bodenradar</td><td>13</td></tr>
                    <tr><td>Metropole</td><td>26</td></tr>
                    <tr><td>Niobium-Lager, Wasserreservoir, Agrarsilo</td><td>30</td></tr>
                    <tr><td>Forschungszentrum</td><td>53</td></tr>
                    <tr><td>Kaserne</td><td>66</td></tr>
                    <tr><td>Raumwerft</td><td>100</td></tr>
                    <tr><td>Weltraumradar</td><td>133</td></tr>
                    <tr><td>Waffenfabrik, Schwimmende Stadt, Orbitalstation</td><td>333</td></tr>
                    <tr><td>Radarstörsender</td><td>400</td></tr>
                    <tr><td>Schwerindustrie</td><td>666</td></tr>
                    <tr><td>Verteidigungsfestung</td><td>800</td></tr>
                    <tr><td>Nuklearbasis</td><td>3.333</td></tr>
                    <tr><td>Gefängnis, Sklavenlager</td><td>0</td></tr>
                </tbody>
            </table>
            <p>Beispiel: Eine Verteidigungsfestung der Stufe 3 kostet 2.400 Bitcoins pro Tag. Planetare Verteidigungsanlagen (Geschütztürme, Schilde) und Arbeiter haben keinen Unterhalt. Die Allianzforschungen „Sowjetische Struktur“, „Mechanische Überlegenheit“ und „Wissenschaftsbegeisterung“ senken den Unterhalt der Legionäre, der Mechs und der Wissenschaftler.</p>

            <h2 id="faillite">Achtung: das wirtschaftliche Game Over</h2>
            <p>Fällt dein Bitcoin-Guthaben nach dieser täglichen Bilanz <strong>ins Minus</strong>, tritt das <strong>wirtschaftliche Game Over</strong> ein:</p>
            <ul>
                <li>Alle deine <strong>Flotten</strong> werden gelöscht, im Flug wie im Orbit, mit ihrer Fracht und den Truppen an Bord.</li>
                <li>Alle <strong>Schiffe am Boden</strong> deiner Planeten gehen verloren.</li>
                <li>Dein Guthaben wird auf <strong>125.000 Bitcoins</strong> zurückgesetzt.</li>
            </ul>
            <p>Du behältst deine Planeten, Gebäude, Verteidigungsanlagen, Forschungen und die am Boden gebliebenen Truppen. Ein Bericht „Bankrott droht“ warnt dich vorher (siehe <a href="/wiki/game_over">Game Over</a>).</p>
            <p><em>Goldene Regel:</em> Rekrutiere keine Armee, die teurer ist, als deine Arbeiter finanzieren können.</p>

    first_buildings:
        title: "Deine ersten Gebäude bauen"
        category: "beginner"
        order: 5
        tags: "gebaeude,bau,mine,extraktor,agrarfeld,grosse stadt,anfaenger,platz"
        summary: "Die empfohlene Baureihenfolge für einen guten Start deines Startplaneten."
        related: "buildings,resources_intro,research"
        body: |
            <h2 id="ordre">Die empfohlene Reihenfolge (die ersten 10 Gebäude)</h2>
            <p>Dein Startplanet besitzt bereits eine Niobium-Mine und einen Wasserextraktor der Stufe 3, eine Raumwerft und ein Bodenradar der Stufe 1, 50.000 Arbeiter und 125.000 Rationen Vorrat.</p>
            <ol>
                <li><strong>Niobium-Mine</strong> — baue sie aus: Sie ist deine erste Rohstoffquelle.</li>
                <li><strong>Wasserextraktor</strong> — unverzichtbar, um alles Weitere zu bauen.</li>
                <li><strong>Agrarfeld</strong> — produziert die Rationen, die deine Arbeiter ernähren.</li>
                <li><strong>Große Stadt</strong> — +25.000 maximale Arbeiter (du startest an der Obergrenze von 50.000). Erfordert die Forschung <strong>Stadtentwicklung</strong> Stufe 1.</li>
                <li><strong>Niobium-Mine und Wasserextraktor</strong> noch höher — steigere die Produktion, bevor du weitergehst.</li>
                <li><strong>Forschungszentrum</strong> — beherbergt deine Wissenschaftler (250 pro Stufe). Es ist nicht nötig, um eine Forschung zu starten.</li>
                <li><strong>Raumwerft</strong> — du hast bereits eine; jede Stufe beschleunigt die Schiffsproduktion um 25&nbsp;%. Der Stufenaufstieg erfordert die Forschung <strong>Industrie</strong> Stufe 1.</li>
                <li><strong>Kaserne</strong> — +5.000 maximale Legionäre pro Stufe (2.000 ohne Kaserne). Erfordert die Forschung <strong>Militärausbau</strong> Stufe 1.</li>
                <li><strong>Niobium-Lager</strong>, <strong>Wasserreservoir</strong>, <strong>Agrarsilo</strong> — verhindere, dass die Produktion überläuft. Sie erfordern die Forschung <strong>Frachtmanagement</strong> Stufe 1 (und <strong>Aeroponik</strong> für das Silo).</li>
                <li><strong>Metropole</strong> — +80.000 maximale Arbeiter pro Stufe. Erfordert die Forschung <strong>Stadtentwicklung</strong> Stufe 5.</li>
            </ol>
            <p>Kosten, Dauer und belegten Platz jedes Gebäudes findest du unter <a href="/wiki/buildings">Die Gebäude</a>.</p>

            <h2 id="file-attente">Immer nur ein Bau gleichzeitig</h2>
            <p>Jeder Planet hat <strong>nur eine Bauwarteschlange</strong>. Während ein Gebäude eine Stufe aufsteigt, müssen die anderen warten. Plane entsprechend.</p>
            <p>Mehrere Planeten = mehrere parallele Warteschlangen: Deshalb beschleunigt die Besiedlung deinen Fortschritt.</p>

            <h2 id="espace">Der verfügbare Platz auf einem Planeten</h2>
            <p>Jeder Planet hat eine begrenzte Zahl von <strong>Bodenplätzen</strong> und <strong>Himmelsplätzen</strong>. <strong>Jede Stufe</strong> eines Gebäudes belegt Plätze, Stufenaufstieg eingeschlossen: Eine Niobium-Mine belegt 1 Bodenplatz pro Stufe, eine Große Stadt 6, eine Metropole 6 am Boden und 6 im Himmel.</p>
            <ul>
                <li>Die belegten und verfügbaren Plätze werden auf der Karte jedes Planeten (Seite <strong>Planeten</strong>) und auf der Seite <strong>Gebäude</strong> angezeigt.</li>
                <li>Der Himmel dient der Metropole, der Aeroponischen Farm, der Raumwerft, dem Weltraumradar und dem Radarstörsender. Die Verteidigungsanlagen (Geschütztürme, Schilde) belegen keinen Platz.</li>
                <li>Um einen Planeten zu vergrößern: <strong>Schwimmende Stadt</strong> (+10 Bodenplätze pro Stufe) und <strong>Orbitalstation</strong> (+5 im Himmel pro Stufe), jeweils höchstens 5 pro Planet. Sie kosten 2.000 Kriegspunkte × die Stufe und werden mit der Forschung <strong>Territorialerweiterung</strong> (Stufe 1, dann 2) freigeschaltet, zugänglich nach Terraformation Stufe 18.</li>
                <li>Kein freier Platz mehr = kein Bau und kein Stufenaufstieg mehr auf diesem Planeten.</li>
            </ul>

    first_fleet:
        title: "Deine erste Flotte aufstellen"
        category: "beginner"
        order: 6
        tags: "flotte,schiffe,erste,erstellung,anfaenger,werft,frachter,sonde"
        summary: "Ein Schiff fertigen, eine Flotte zusammenstellen und zum Ziel senden: die Schritt-für-Schritt-Anleitung."
        related: "fleet_creation,ship_types,fleet_missions,market"
        body: |
            <h2 id="prerequis">Was du vorher brauchst</h2>
            <ul>
                <li>Eine <strong>Raumwerft</strong>, auf deinem Planeten gebaut.</li>
                <li>Die Ressourcen des Schiffs: meistens <strong>Niobium</strong>, <strong>Wasser</strong> und <strong>Arbeiter</strong> (dein Planet behält immer 5.000 als unantastbare Reserve). Einige Schiffe verlangen auch Kriegspunkte, Bitcoins oder Legionäre (siehe den Artikel <em>Schiffstypen</em>).</li>
                <li>Die <strong>Forschung</strong>, die das Schiff freischaltet. Beispiel: Die Frachter erfordern <em>Frachtmanagement</em> (Stufe 1 für den Cargo I), das wiederum mit <em>Versorgungsschiffe</em> Stufe 2 zugänglich ist. Die Sonde hingegen erfordert keine Forschung.</li>
            </ul>

            <h2 id="fabriquer">Schritt 1 — Schiffe fertigen</h2>
            <p>Gehe auf die Seite <strong>Raumwerft</strong> (Menü links), Reiter <strong>Schiffbau</strong>. Wähle ein Schiff, gib eine Menge ein und klicke auf <strong>Bauen</strong>. Ein noch gesperrtes Schiff zeigt die Forschung oder das Gebäude an, die ihm fehlen.</p>
            <p>Die Fertigung braucht Zeit: Du kannst währenddessen weiterspielen.</p>

            <h2 id="composer">Schritt 2 — Eine Flotte zusammenstellen und senden</h2>
            <ol>
                <li>Klicke auf der Seite <strong>Flotten</strong> auf <strong>Neue Flotte erstellen</strong>, wähle die Schiffe zum Einschiffen (der Bestand am Boden wird angezeigt) und gib der Flotte einen Namen (höchstens 12 Zeichen).</li>
                <li>Klicke auf den Namen der Flotte, um ihre Seite zu öffnen. Der Reiter <strong>Fracht</strong> dient dazu, Ressourcen zu laden, wenn sich die Flotte auf einem deiner Planeten befindet.</li>
                <li>Sende sie los:
                    <ul>
                        <li>für eine einfache Bewegung (Mission <strong>Normal</strong>) oder eine Spionage, Reiter <strong>Flotte bewegen</strong>: Gib das Ziel in die Felder Galaxie, System und Planet ein (z. B. <code>1:5:12</code>) oder wähle einen deiner „Meine Planeten“, prüfe die geschätzten Kosten und die Dauer und klicke dann auf <strong>Senden</strong>;</li>
                        <li>für die anderen Missionen (Entladen und zurückkehren, Kolonisieren, Plündern, Einmarschieren…) gehe über die <strong>Räumliche Karte</strong>: Klicke auf das anvisierte Feld, dann auf <strong>Interaktion</strong>, wähle die Flotte und die Mission und klicke auf <strong>Senden</strong>.</li>
                    </ul>
                </li>
            </ol>
            <p>Der Treibstoff wird beim Start in <strong>Bitcoins</strong> bezahlt (siehe den Artikel <em>Bewegung und Entfernung</em>). Die Missionen sind im Artikel <em>Missionstypen</em> im Detail beschrieben.</p>

            <h2 id="premiers-vaisseaux">Die richtigen Schiffe für den Anfang</h2>
            <ul>
                <li><strong>Cargo I</strong> — Ressourcentransport (3.000 Kapazität). Das ideale Schiff, um an Händler zu verkaufen.</li>
                <li><strong>Sonde</strong> — spioniert gegnerische Planeten aus. <em>Vor</em> jedem Angriff senden.</li>
                <li><strong>Jäger</strong> — erstes Kampfschiff, günstig (25 Niobium, 5 Wasser und 1 Arbeiter).</li>
                <li><strong>Recycler</strong> — sammelt nach einem Kampf die Trümmer ein. Sehr rentabel, aber langsam: In eine Jägerflotte aufgenommen, verdreifacht er deren Flugdauer.</li>
            </ul>

            <h2 id="premiere-cible">Idee für eine erste Mission</h2>
            <p>Belade 1 Frachter mit Niobium oder Wasser und sende ihn dann von der <strong>Räumlichen Karte</strong> aus mit der Mission <strong>Entladen und zurückkehren</strong> zu einem Händler. Die Händler befinden sich in 20 festen Sektoren jeder Galaxie (die vier Ecken 1, 10, 91 und 100, dann 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67 und in der Mitte 45, 46, 55 und 56), an einer Position, die von Sektor zu Sektor wechselt: Such sie auf der Karte.</p>
            <p>Der Händler bezahlt dich in Bitcoins, und der Frachter kehrt von allein zurück. Der Hinweg kostet das Doppelte einer normalen Strecke, und der Rückweg wird bei seinem Start zum normalen Tarif bezahlt: Für einen einzelnen Cargo I rechne mit 0 bis 2 Bitcoins auf dem Hinweg und 0 oder 1 auf dem Rückweg.</p>

    first_combat:
        title: "Dein erster Kampf"
        category: "beginner"
        order: 7
        tags: "kampf,erster,angriff,bericht,anfaenger,runden"
        summary: "Wie du einen Weltraumkampf auslöst, was währenddessen geschieht und was du danach tun solltest."
        related: "spatial_combat,battle_reports,ship_types,recycling"
        body: |
            <h2 id="preparer">Sich vorbereiten (wichtig!)</h2>
            <ol>
                <li><strong>Sende eine Sonde</strong> zum Ziel, um seine Verteidigung einzuschätzen. 10 Jäger blind zu verlieren, ist verschmerzbar; 100 zu verlieren, tut weh.</li>
                <li><strong>Stelle eine passende Flotte zusammen</strong>: genug Feuerkraft, und denk daran, einen <strong>Recycler</strong> zum Einsammeln der Trümmer mitzunehmen.</li>
                <li><strong>Prüfe deinen Unterhalt</strong>: Jeden Tag kostet ein Schiff seine Signatur ÷ 2 in Bitcoins, solange es in einer Flotte ist (im Flug oder stationiert), gegenüber seiner Signatur ÷ 12 am Boden. Stelle am Boden ab, was nicht gebraucht wird.</li>
            </ol>

            <h2 id="enchainement">Was Schritt für Schritt passiert</h2>
            <ol>
                <li><strong>Du aktivierst den Angriffsmodus</strong> deiner Flotte (Kästchen „Angriffsmodus“ in der Flottenverwaltung; Schiffswaffen sind nötig) und sendest sie dann mit der Mission <em>Normal</em> auf die Koordinaten eines Feindes. Der Treibstoff wird beim Start in Bitcoins bezahlt.</li>
                <li><strong>Sie reist</strong> — die Reisezeit wird auf der Seite Flotten angezeigt. In den <strong>2 Minuten</strong> nach dem Start bringt die Schaltfläche „Abbrechen“ sie sofort zu ihrem Startplaneten zurück (der bezahlte Treibstoff wird nicht erstattet); nach dieser Frist fliegt sie bis zum Ende durch.</li>
                <li><strong>Ankunft</strong>: Befinden sich feindliche Flotten vor Ort, wird der Kampf <strong>5 Minuten</strong> später angesetzt. In dieser Zeit kann niemand mehr den Angriffsmodus seiner Flotten ändern.</li>
                <li><strong>Kampf in Runden</strong>: Beide Seiten tauschen pro Runde eine Salve aus, höchstens 100 Runden. Jede Salve trifft zuerst auf den gegnerischen Schild, aber ein Teil dringt immer durch.</li>
                <li><strong>Ende des Kampfes</strong>: Eine Seite wird ausgelöscht, oder die 100 Runden sind erreicht. In diesem Fall gewinnt die Seite, die <strong>die meiste Panzerung</strong> behält (bei exaktem Gleichstand gewinnt der Angreifer).</li>
            </ol>

            <h2 id="apres-combat">Nach dem Kampf</h2>
            <ul>
                <li>Ein <strong>Kampfbericht</strong> wird dir geschickt: Menü <strong>Bericht</strong>, Reiter <strong>Kämpfe</strong>.</li>
                <li>Zerstörte Schiffe hinterlassen <strong>Trümmer</strong> vor Ort. Schick Recycler!</li>
                <li>Der Sieger erhält <strong>Kriegspunkte (KP)</strong> entsprechend der zerstörten feindlichen Flotte; der Besiegte bekommt einen kleinen Trost (siehe <em>Weltraumkampf</em>).</li>
                <li>Deine überlebende Flotte <strong>bleibt im Orbit</strong> am Ort des Kampfes: Schick sie selbst zurück. Hat sie Recycler mit freiem Platz im Laderaum, beginnen diese sofort, die Trümmer einzusammeln.</li>
            </ul>

            <h2 id="erreurs">Die klassischen Fehler, die du vermeiden solltest</h2>
            <ul>
                <li>Angreifen, ohne vorher zu sondieren.</li>
                <li>Vergessen, dass die Runden bei 100 enden: Ein zu robustes Ziel, das du nicht genug angreifst, behält mehr Panzerung als du und gewinnt.</li>
                <li>Keinen Recycler mitschicken: Deine Gegner holen sich <em>deine</em> Trümmer vor dir.</li>
            </ul>

    tips:
        title: "Tipps für einen guten Start"
        category: "beginner"
        order: 8
        tags: "tipps,ratschlaege,strategie,anfaenger"
        summary: "15 Tipps, die in deinen ersten Tagen den Unterschied machen."
        related: "getting_started,bitcoin_economy,alliance_basics"
        body: |
            <h2 id="economie">Wirtschaft</h2>
            <ul>
                <li><strong>Maximiere deine Arbeiter</strong>: Sie sind deine Haupteinnahmequelle für Bitcoins.</li>
                <li><strong>Baue nicht zu früh</strong> eine große Armee: Sie ruiniert dich durch den Unterhalt.</li>
                <li><strong>Erforsche Stadtentwicklung und baue dann Große Städte und Metropolen</strong>, um die Bevölkerung zu erhöhen.</li>
                <li><strong>Behalte deinen Tagesbericht im Auge</strong>: Wenn deine Kosten deine Einnahmen übersteigen, reagiere sofort.</li>
                <li><strong>Verkaufe deine Überschüsse an Händler</strong>, statt das Lager überlaufen zu lassen.</li>
            </ul>

            <h2 id="militaire">Militär</h2>
            <ul>
                <li><strong>Immer eine Verteidigung auf jedem Planeten</strong>: Legionäre in der Kaserne, Mechs, ein oder zwei Geschütztürme.</li>
                <li><strong>Passe deine Schiffe jeden Tag an</strong>: Du kannst bis zu 40 Verbesserungspunkte pro Tag ausgeben (Hülle, Schild, Waffen, Präzision), entnommen aus dem eigenen Guthaben jedes Schiffstyps.</li>
                <li><strong>Recycler sind sehr rentabel</strong>: Sammle nach jedem Kampf die Trümmer ein. Füge der Flotte Frachter hinzu: Ein Recycler allein transportiert nur 1.000 Ressourcen.</li>
                <li><strong>Sondiere vor dem Angriff</strong>: Eine Sonde kostet nur 1.000 Niobium (du hast 10 zum Start), eine verlorene Flotte kostet viel. Beachte, dass das Ziel über die Spionage benachrichtigt wird.</li>
                <li><strong>Achtung vor der Grenze von 100 Runden</strong>: Wird nach 100 Runden keine Seite zerstört, gewinnt die, die die meiste Panzerung behält (der Angreifer bei exaktem Gleichstand).</li>
            </ul>

            <h2 id="social">Soziales</h2>
            <ul>
                <li><strong>Tritt schnell einer Allianz bei</strong>: +20&nbsp;% Produktion von Niobium, Wasser und Rationen, Zugang zur Diplomatie und zu den Allianzforschungen.</li>
                <li><strong>Erledige deine täglichen Quests</strong> (Seite <em>Ziele</em>): Jede bringt Kriegspunkte (KP) ein, und wenn du alle erledigst, bringt dir der nächste Bericht zusätzlich ihre durchschnittliche Belohnung.</li>
                <li><strong>Unterhalte dich im Allianz-Salon</strong>: Zwei koordinierte Angriffe sind besser, als nur einen zu versuchen.</li>
                <li><strong>Melde dich jeden Tag an</strong>: Der Login-Bonus steigt mit der Serie von 7 aufeinanderfolgenden Tagen rasant an.</li>
                <li><strong>Aktiviere die Push-Benachrichtigungen</strong>: So erfährst du sofort, wenn eine feindliche Flotte auf dich zurast.</li>
            </ul>

    resources:
        title: "Ressourcen im Detail"
        category: "economy"
        order: 1
        tags: "ressourcen,niobium,wasser,nahrung,uranium,produktion,lagerung,zyklus,rationen"
        summary: "Alles Wichtige zu den Ressourcen: Produktion, Boni, Lagerung und der Sonderfall Uranium."
        related: "buildings,workers_scientists,resources_intro"
        body: |
            <h2 id="rappel">Zur Erinnerung: die 4 Ressourcen</h2>
            <ul>
                <li><strong>Niobium</strong> — Bau (Gebäude, Schiffe, Verteidigungsanlagen).</li>
                <li><strong>Wasser</strong> — Bau (Gebäude, Schiffe, Verteidigungsanlagen). Der Treibstoff der Flotten wird dagegen in Bitcoins bezahlt.</li>
                <li><strong>Nahrung</strong> („Rationen“ im Spiel) — von deinen Arbeitern gegessen, und nur von ihnen: 1 Ration pro Stunde für 500 Arbeiter. Eine Hungersnot tötet auch Legionäre und Mechs.</li>
                <li><strong>Uranium</strong> — Nuklearbasis, Atombomben, Abfangraketen, Arena-Einsätze. Selten und wertvoll.</li>
            </ul>

            <h2 id="production">Wie die Produktion berechnet wird</h2>
            <p>Die Produktion wird pro <strong>10-Minuten</strong>-Abschnitt angegeben (der Produktionszyklus eines Planeten) und anteilig zur verstrichenen Zeit gutgeschrieben. Sie hängt ab von:</p>
            <ul>
                <li>der <strong>Stufe</strong> des produzierenden Gebäudes: pro Stufe und pro 10 Minuten Niobium-Mine 33 Niobium, Wasserextraktor 22 Wasser, Agrarfeld 27 Rationen, Aeroponische Farm 37 Rationen;</li>
                <li>deinen <strong>Boni</strong> (Allianz, Forschung „Produktionsgesetz“, Allianzverbesserungen, Held, Sklavenlager).</li>
            </ul>
            <p>Beispiel: Ein Wasserextraktor der Stufe 8 produziert 8 × 22 = 176 Wasser pro 10 Minuten, also 1.056 pro Stunde; in einer Allianz (+20&nbsp;%) 1.267 pro Stunde. Die Größe des Planeten ändert nichts daran, was eine Stufe produziert: Sie begrenzt nur die Zahl der Stufen, die du bauen kannst.</p>
            <p>Die <strong>Monde</strong> produzieren Nahrung <strong>10-mal schneller</strong> (Zyklus von 1 Minute).</p>
            <p>Auch <strong>ohne produzierendes Gebäude</strong> — oder wenn du es bis auf Stufe 0 zerstörst — behält ein Planet eine <strong>minimale Grundproduktion</strong>: <strong>7 Niobium, 6 Wasser und 9 Rationen</strong> pro Zyklus (20 Rationen auf deinem Startplaneten). Ab Stufe 1 ersetzt die Produktion des Gebäudes dieses Minimum: Sie kommt nicht dazu.</p>
            <p>Bei der Nahrung <strong>addieren sich</strong> das <strong>Agrarfeld</strong> und die <strong>Aeroponische Farm</strong>: Ihre Produktionen summieren sich.</p>

            <h2 id="bonus">Was deine Produktion steigert</h2>
            <table>
                <thead>
                    <tr><th>Quelle</th><th>Wirkung</th></tr>
                </thead>
                <tbody>
                    <tr><td>Zugehörigkeit zu einer Allianz</td><td>+20&nbsp;% auf Niobium, Wasser und Rationen</td></tr>
                    <tr><td>Allianzforschung „Produktionsgesetz“ (Waage der Welten)</td><td>+7&nbsp;% pro Stufe, bis Stufe 5</td></tr>
                    <tr><td>Allianzverbesserungen „Niobiumproduktion“, „Wasserproduktion“, „Rationenproduktion“</td><td>+2&nbsp;% pro Stufe, bis +10&nbsp;%</td></tr>
                    <tr><td>Auf dem Planeten stationierter Held</td><td>Bonus aus seiner Intelligenz, verdoppelt bei einem Wirtschaftshelden; zusätzlich +20&nbsp;% mit der Eigenschaft „Magnat“ (Wirtschaftsheld Stufe 15)</td></tr>
                    <tr><td>Sklavenlager</td><td>+2,5&nbsp;% pro Stufe, plus 1&nbsp;% pro Stufe jedes festgehaltenen Gefangenen (begrenzt auf 5&nbsp;% pro Stufe des Lagers)</td></tr>
                    <tr><td>Urteil einer Cthulhu-Blockade</td><td>Von +15&nbsp;% bis −15&nbsp;% für die Mitglieder einer Allianz, für begrenzte Zeit</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Die Lagerung und ihre Fallen</h2>
            <p>Dein Planet hat für jede Ressource eine <strong>maximale Kapazität</strong>. Ist sie voll, läuft die Produktion weiter, aber was darüber hinausgeht, geht verloren.</p>
            <p>Lösungen: <strong>Niobium-Lager</strong>, <strong>Wasserreservoirs</strong> und <strong>Agrarsilos</strong> bauen, den Überschuss an Niobium und Wasser an Händler verkaufen (Rationen lassen sich dagegen nicht verkaufen) oder die Überschüsse an einen anderen Spieler schicken.</p>

            <p>Nahrung wird wie Niobium und Wasser transportiert: Lade <strong>Rationen</strong> in den Laderaum einer Flotte (1 Platz pro Ration), um einen anderen Planeten zu versorgen. Beim Entladen überschreitet der Speicher nie seine Kapazität: Der Überschuss bleibt im Laderaum.</p>

            <h2 id="uranium">Uranium: der Sonderfall</h2>
            <p>Kein Gebäude produziert Uranium. Du erhältst es:</p>
            <ul>
                <li>durch <strong>Recycling</strong> von Uranium-Trümmern auf der Karte (erkennbar an ihrem besonderen Symbol);</li>
                <li>durch <strong>Besiegen von Cthulhu</strong> (PvE-Missionen);</li>
                <li>durch <strong>Gewinnen von Arena-Herausforderungen</strong> mit Uranium-Einsatz.</li>
            </ul>
            <p>Uranium dient dazu, die <strong>Nuklearbasis</strong> (500 pro Stufe) zu bauen, <strong>Atombomben</strong> (je 500) und <strong>Abfangraketen</strong> (je 200) zu fertigen und in der <strong>Arena</strong> zu setzen. Es hat keine Lagergrenze, wird wie die anderen Ressourcen im Laderaum transportiert und lässt sich bei Händlern für <strong>2.000 Bitcoins pro Einheit</strong> weiterverkaufen.</p>

    buildings:
        title: "Die Gebäude"
        category: "economy"
        order: 2
        tags: "gebaeude,bau,kosten,mine,extraktor,agrarfeld,grosse stadt,metropole,raumwerft,verteidigungsfestung,bunker,schwimmende stadt,orbitalstation"
        summary: "Vollständiger Katalog der Gebäude nach Aufgabe, mit ihren Kosten, ihrer Dauer und dem Platz, den sie belegen."
        related: "resources,first_buildings,research"
        body: |
            <h2 id="production">Ressourcenproduktion</h2>
            <p>Die folgenden Namen sind die auf der Seite <strong>Gebäude</strong> angezeigten. Jede Stufe belegt Plätze am Boden oder im Himmel (siehe den Abschnitt „Kosten der Gebäude“ weiter unten), und viele Gebäude erfordern eine vorherige Forschung.</p>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Produziert</th><th>Hinweis</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium-Mine</td><td>Niobium</td><td>33 Niobium pro Stufe und pro 10 Minuten.</td></tr>
                    <tr><td>Wasserextraktor</td><td>Wasser</td><td>22 Wasser pro Stufe und pro 10 Minuten.</td></tr>
                    <tr><td>Agrarfeld</td><td>Rationen</td><td>27 Rationen pro Stufe und pro 10 Minuten. 1 Bodenplatz pro Stufe.</td></tr>
                    <tr><td>Aeroponische Farm</td><td>Rationen</td><td>37 Rationen pro Stufe und pro 10 Minuten, aber 1 Platz <strong>im Himmel</strong> pro Stufe (keinen am Boden). Forschung Aeroponik erforderlich. Ihre Produktion kommt zu der des Agrarfelds hinzu.</td></tr>
                </tbody>
            </table>

            <h2 id="stockage">Lagerung</h2>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium-Lager</td><td>+1.200.000 lagerbares Niobium pro Stufe. Forschung Frachtmanagement 1.</td></tr>
                    <tr><td>Wasserreservoir</td><td>+800.000 lagerbares Wasser pro Stufe. Forschung Frachtmanagement 1.</td></tr>
                    <tr><td>Agrarsilo</td><td>+800.000 lagerbare Rationen pro Stufe. Forschungen Frachtmanagement 1 und Aeroponik.</td></tr>
                </tbody>
            </table>
            <p>Ohne diese Gebäude lagert ein Planet 200.000 Niobium, 180.000 Wasser und 150.000 Rationen.</p>

            <h2 id="population">Bevölkerung und Wissenschaft</h2>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Große Stadt</td><td>+25.000 maximale Arbeiter und etwa +8.000 Arbeiter pro Tag, pro Stufe. Forschung Stadtentwicklung 1.</td></tr>
                    <tr><td>Metropole</td><td>+80.000 maximale Arbeiter und etwa +12.000 Arbeiter pro Tag, pro Stufe. Forschung Stadtentwicklung 5.</td></tr>
                    <tr><td>Forschungszentrum</td><td>+250 maximale Wissenschaftler pro Stufe. Unverzichtbar, um Wissenschaftler zu rekrutieren; unnötig, um eine Forschung zu starten.</td></tr>
                </tbody>
            </table>

            <h2 id="militaire">Militär und Schiffsproduktion</h2>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Kaserne</td><td>+5.000 maximale Legionäre pro Stufe (2.000 ohne Kaserne). Forschung Militärausbau 1.</td></tr>
                    <tr><td>Verteidigungsfestung</td><td>+15.000 maximale Legionäre pro Stufe und <strong>schützt vor Plünderungen</strong> 5&nbsp;% deiner Lagerkapazität für Niobium und Wasser (und 5&nbsp;% deines Uraniums) pro Stufe. Voraussetzung für Mechs. Forschung Militärausbau 3.</td></tr>
                    <tr><td>Nuklearbasis</td><td>Jede Stufe erlaubt es, 1 Atombombe und 4 Abfangraketen zu lagern (Forschung Bewaffnung 5 erforderlich, um sie zu fertigen). Kostet 100.000 Niobium und 500 Uranium pro Stufe.</td></tr>
                    <tr><td>Raumwerft</td><td>Fertigt die Versorgungsschiffe (Frachter, Sonde, Recycler…) und beschleunigt die Produktion aller Schiffe (+25&nbsp;% pro Stufe). Forschung Industrie 1.</td></tr>
                    <tr><td>Waffenfabrik</td><td>Fertigt die leichten Schiffe (Schwere Jäger, Korvetten…) und beschleunigt die Produktion von Schiffen <strong>und Verteidigungsanlagen</strong> um 40&nbsp;%. Nur eine Stufe pro Planet. Forschung Leichte Schiffe 1.</td></tr>
                    <tr><td>Schwerindustrie</td><td>Fertigt die schweren Schiffe (Fregatten, Kreuzer, Schlachtschiffe, Zerstörer) und beschleunigt die Produktion von Schiffen <strong>und Verteidigungsanlagen</strong> um 60&nbsp;%. Nur eine Stufe pro Planet. Forschung Schwere Schiffe 1.</td></tr>
                    <tr><td>Gefängnis</td><td>Sperrt gefangene Helden ein. Forschung Gefängnissystem.</td></tr>
                    <tr><td>Sklavenlager</td><td>Pro Stufe: +2,5&nbsp;% Ressourcenproduktion, +2.500 maximale Arbeiter, −1,5&nbsp;% Bauzeit; jeder festgehaltene Gefangene fügt 1&nbsp;% Produktion pro Stufe des Gefangenen hinzu. Forschung Gefängnissystem.</td></tr>
                </tbody>
            </table>

            <h2 id="orbital">Den Planeten vergrößern und orbitale Verteidigung</h2>
            <table>
                <thead>
                    <tr><th>Gebäude / Anlage</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Schwimmende Stadt</td><td>+10 Bodenplätze pro Stufe (höchstens 5 pro Planet). Kostet 2.000 Kriegspunkte × die Stufe. Forschung Territorialerweiterung 1.</td></tr>
                    <tr><td>Orbitalstation</td><td>+5 Himmelsplätze pro Stufe (höchstens 5 pro Planet). Kostet 2.000 Kriegspunkte × die Stufe. Forschung Territorialerweiterung 2.</td></tr>
                    <tr><td>Raumstation</td><td>Verleiht den orbitalen Verteidigungsanlagen einen Panzerungsbonus.</td></tr>
                    <tr><td>Schild / Großer Schild</td><td>Absorbiert den Schaden, bevor die Verteidigungsanlagen getroffen werden.</td></tr>
                    <tr><td>Geschütztürme (Rakete, Laser, Gauß, Plasma…)</td><td>Verteidigen deinen Planeten gegen Flotten im Angriffsmodus.</td></tr>
                </tbody>
            </table>
            <p>Die Verteidigungsanlagen (Geschütztürme, Schilde) belegen keinen Platz.</p>

            <h2 id="detection">Erkennung und Störung</h2>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td>Bodenradar</td><td>Erkennt anfliegende Flotten (+1 Radarstärke pro Stufe). Forschung Systemscanner 1.</td></tr>
                    <tr><td>Weltraumradar</td><td>Gleicher Beitrag wie ein Bodenradar (+1 Radarstärke pro Stufe), belegt aber Himmelsplätze statt Bodenplätze. Forschung Systemscanner 3.</td></tr>
                    <tr><td>Radarstörsender</td><td>Stört die gegnerische Erkennung deiner Bewegungen. Forschung Systemscanner 5.</td></tr>
                </tbody>
            </table>

            <h2 id="couts">Kosten der Gebäude</h2>
            <p>Kosten und Dauer einer Stufe sind <strong>proportional zur angestrebten Stufe</strong>: Stufe N kostet das N-Fache der Grundkosten und dauert das N-Fache der Grunddauer. Beispiel: Eine Niobium-Mine der Stufe 4 kostet 4 × 45 = 180 Niobium und 4 × 20 = 80 Wasser, in 4 × 3 = 12 Minuten. Ist bereits eine Stufe desselben Gebäudes in der Schlange, wird die nächste zur darauffolgenden Stufe berechnet.</p>
            <p>Grundwerte (Stufe 1). „Platz“ = pro Stufe belegte Plätze am Boden / im Himmel.</p>

            <h3>Ressourcen und Lagerung</h3>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Niobium / Wasser</th><th>Dauer</th><th>Platz</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium-Mine</td><td>45 / 20</td><td>3 Min.</td><td>1 / 0</td></tr>
                    <tr><td>Wasserextraktor</td><td>20 / 50</td><td>3 Min.</td><td>1 / 0</td></tr>
                    <tr><td>Agrarfeld</td><td>60 / 90</td><td>5 Min.</td><td>1 / 0</td></tr>
                    <tr><td>Aeroponische Farm</td><td>650 / 100</td><td>5 Min. 50 Sek.</td><td>0 / 1</td></tr>
                    <tr><td>Niobium-Lager</td><td>11.000 / 6.000</td><td>30 Min.</td><td>3 / 0</td></tr>
                    <tr><td>Wasserreservoir</td><td>8.000 / 9.000</td><td>30 Min.</td><td>3 / 0</td></tr>
                    <tr><td>Agrarsilo</td><td>12.000 / 20.000</td><td>50 Min.</td><td>4 / 0</td></tr>
                </tbody>
            </table>

            <h3>Bevölkerung und Wissenschaft</h3>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Niobium / Wasser</th><th>Dauer</th><th>Platz</th></tr>
                </thead>
                <tbody>
                    <tr><td>Große Stadt</td><td>1.500 / 1.100</td><td>12 Min.</td><td>6 / 0</td></tr>
                    <tr><td>Metropole</td><td>7.500 / 5.500</td><td>46 Min. 40 Sek.</td><td>6 / 6</td></tr>
                    <tr><td>Forschungszentrum</td><td>285 / 360</td><td>15 Min.</td><td>5 / 0</td></tr>
                </tbody>
            </table>
            <p>Beispiel: Eine Metropole der Stufe 3 kostet 22.500 Niobium und 16.500 Wasser, in 2 Std. 20 Min.</p>

            <h3>Militär und Schiffe</h3>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Niobium / Wasser</th><th>Dauer</th><th>Platz</th></tr>
                </thead>
                <tbody>
                    <tr><td>Kaserne</td><td>1.300 / 1.900</td><td>35 Min.</td><td>6 / 0</td></tr>
                    <tr><td>Verteidigungsfestung</td><td>20.000 / 19.000</td><td>1 Std. 12 Min.</td><td>10 / 0</td></tr>
                    <tr><td>Nuklearbasis</td><td>100.000 / 0 (+ 500 Uranium)</td><td>1 Std. 12 Min.</td><td>2 / 0</td></tr>
                    <tr><td>Gefängnis</td><td>3.000 / 3.500</td><td>50 Min.</td><td>5 / 0</td></tr>
                    <tr><td>Sklavenlager</td><td>2.000 / 2.500</td><td>40 Min.</td><td>4 / 0</td></tr>
                    <tr><td>Raumwerft</td><td>300 / 200</td><td>3 Min.</td><td>2 / 1</td></tr>
                    <tr><td>Waffenfabrik (1 Stufe)</td><td>700 / 390</td><td>36 Min.</td><td>6 / 0</td></tr>
                    <tr><td>Schwerindustrie (1 Stufe)</td><td>8.300 / 6.800</td><td>2 Std.</td><td>12 / 0</td></tr>
                </tbody>
            </table>

            <h3>Erkennung und Vergrößerung</h3>
            <table>
                <thead>
                    <tr><th>Gebäude</th><th>Kosten (Niobium / Wasser)</th><th>Dauer</th><th>Platz</th></tr>
                </thead>
                <tbody>
                    <tr><td>Bodenradar</td><td>120 / 65</td><td>3 Min. 40 Sek.</td><td>2 / 0</td></tr>
                    <tr><td>Weltraumradar</td><td>2.000 / 1.720</td><td>24 Min.</td><td>0 / 2</td></tr>
                    <tr><td>Radarstörsender</td><td>5.100 / 3.210</td><td>54 Min.</td><td>0 / 4</td></tr>
                    <tr><td>Schwimmende Stadt (max. 5)</td><td>2.000 Kriegspunkte</td><td>24 Min.</td><td>fügt 10 am Boden hinzu</td></tr>
                    <tr><td>Orbitalstation (max. 5)</td><td>2.000 Kriegspunkte</td><td>24 Min.</td><td>fügt 5 im Himmel hinzu</td></tr>
                </tbody>
            </table>
            <p>Die Allianzverbesserung „Baukosten“ senkt die Kosten an Niobium, Wasser und Uranium (−1&nbsp;% pro Stufe, bis −5&nbsp;%), und jede Stufe des Sklavenlagers verkürzt die Dauer um 1,5&nbsp;%. Der tägliche Unterhalt jedes Gebäudes ist unter <a href="/wiki/bitcoin_economy#bareme">Bitcoins und Unterhalt</a> aufgeführt.</p>

            <h2 id="file-production">Die Produktionsschlange verwalten</h2>
            <p>Der Bau von Gebäuden, Schiffen (Raumwerft) und Verteidigungsanlagen läuft über eine <strong>Warteschlange</strong>, die du verwalten kannst:</p>
            <ul>
                <li>Die Reihenfolge der wartenden Elemente <strong>umsortieren</strong> (Drag-and-drop), um das Wichtige zu priorisieren.</li>
                <li>Ein wartendes Element <strong>abbrechen</strong>: Du wirst <strong>anteilig erstattet</strong> für das, was noch nicht produziert wurde (ein wartendes Gebäude wird vollständig erstattet).</li>
                <li>Die Kosten eines Gebäudes werden abgebucht, sobald es der Schlange hinzugefügt wird.</li>
                <li>Die laufende Schlange wird oben auf jeder Produktionsseite unter dem Titel angezeigt.</li>
                <li>Die Schlange ist auf <strong>15 wartende Elemente</strong> begrenzt (ohne den laufenden Bau): Darüber hinaus weist dich eine Meldung an, das Ende eines Baus abzuwarten oder einen abzubrechen, bevor du einen neuen hinzufügst.</li>
                <li>Die <strong>Schwimmende Stadt</strong> (+10&nbsp;Boden/Stufe) und die <strong>Orbitalstation</strong> (+5&nbsp;Himmel/Stufe) sind auf jeweils <strong>5 Exemplare pro Planet</strong> begrenzt.</li>
            </ul>

    research:
        title: "Forschung und Technologien"
        category: "economy"
        order: 3
        tags: "forschung,technologie,wissenschaft,bitcoin,freischaltung,technologiebaum,terraformation,kosten"
        summary: "Die Technologien, die Schiffe, Boni und neue Fähigkeiten freischalten. Wie du Prioritäten setzt."
        related: "buildings,ship_types,workers_scientists,alliance_research"
        body: |
            <h2 id="fonctionnement">So funktioniert es</h2>
            <p>Forschungen werden über die Seite <strong>Forschung</strong> gestartet (kein Gebäude ist nötig). Jede Forschung:</p>
            <ul>
                <li>kostet <strong>Bitcoins</strong> (nur Territorialerweiterung wird in Kriegspunkten bezahlt): Stufe N kostet das N-Fache der Grundkosten;</li>
                <li>braucht <strong>Zeit</strong>, ebenfalls proportional zur Stufe: von wenigen Minuten bis zu mehr als einem Tag;</li>
                <li>kann eine <strong>Voraussetzung</strong> haben (eine andere Forschung auf einer bestimmten Stufe).</li>
            </ul>
            <p>Beispiel: Terraformation Stufe 2 kostet 2 × 12.000 = 24.000 Bitcoins und dauert 2 × 1 Std. 10 Min. = 2 Std. 20 Min. bei Grundgeschwindigkeit. Die Allianzverbesserung „Forschungskosten“ senkt den Preis um 1&nbsp;% pro Stufe (bis −5&nbsp;%).</p>
            <p>Du kannst mehrere Forschungen hintereinander einplanen: Die Kosten werden beim Hinzufügen zur Schlange abgebucht und vollständig erstattet, wenn du abbrichst.</p>
            <p>Die Dauer einer Forschung wird <strong>in dem Moment festgelegt, in dem du sie startest oder in die Schlange stellst</strong>: Grunddauer × Stufe ÷ deine <strong>Forschungsgeschwindigkeit</strong> (1 zu Beginn). Was diese Geschwindigkeit verändert (Wissenschaftler, Allianzforschung „Wissenschaftsmobilisierung“), wird unter <a href="/wiki/workers_scientists">Arbeiter und Wissenschaftler</a> erklärt. Die Allianzverbesserung „Forschungsgeschwindigkeit“ verkürzt die auf der Seite Forschung angezeigte Dauer, aber nicht die tatsächliche Dauer: Einmal gestartet, endet die Forschung zu der Zeit, die ohne sie berechnet wurde.</p>

            <h2 id="priorite-debutant">Prioritäten für Anfänger</h2>
            <ol>
                <li><strong>Versorgungsschiffe</strong> — öffnet Terraformation (Stufe 1), Frachtmanagement (Stufe 2), Planetare Invasion und Orbitalrecycling (Stufe 3).</li>
                <li><strong>Terraformation</strong> — das Kolonisierungsschiff und pro Stufe ein Planet mehr.</li>
                <li><strong>Frachtmanagement</strong> — die Frachter und die Lagergebäude.</li>
                <li><strong>Stadtentwicklung</strong> — Große Stadt, dann Metropole: mehr Arbeiter, also mehr Bitcoins.</li>
                <li><strong>Industrie</strong> — um die Raumwerft auszubauen und die leichten Schiffe (Stufe 3) und schweren Schiffe (Stufe 5) zu öffnen.</li>
                <li><strong>Planetare Invasion</strong> und <strong>Orbitalrecycling</strong> — unverzichtbar, um zu invadieren und zu recyceln.</li>
                <li><strong>Bewaffnung</strong>, dann <strong>Raketenwaffe</strong> — deine ersten Kampfschiffe (Jäger).</li>
            </ol>

            <h2 id="recherches">Vollständige Liste der Forschungen</h2>
            <p>Die Forschungen sind so angeordnet wie auf der Seite Forschung. Kosten und Dauer gelten für Stufe 1 bei Grundgeschwindigkeit: Stufe N kostet und dauert N-mal mehr. Die maximale Stufe steht in Klammern.</p>

            <h3>Erkundungen</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Was sie bringt</th><th>Voraussetzung</th><th>Stufe 1</th></tr>
                </thead>
