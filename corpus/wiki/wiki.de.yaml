                    <tr><td>Spionage (999)</td><td>Eine Sonde liefert nur dann Informationen, wenn deine Spionagestufe mindestens der des Besitzers des ausgespähten Planeten entspricht.</td><td>Systemscanner 5</td><td>20.000; 1 Std.</td></tr>
                    <tr><td>Hyperraumtechnologie (1)</td><td>In andere Galaxien reisen.</td><td>—</td><td>25.000.000; 25 Std.</td></tr>
                </tbody>
            </table>

            <h3>Planetare</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Was sie bringt</th><th>Voraussetzung</th><th>Stufe 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Aeroponik (1)</td><td>Aeroponische Farm; Agrarsilo (mit Frachtmanagement 1).</td><td>—</td><td>16.000; 8 Min.</td></tr>
