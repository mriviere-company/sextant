                    <tr><td>Versorgungsschiffe (3)</td><td>Stufe 1: Terraformation. Stufe 2: Frachtmanagement. Stufe 3: Planetare Invasion, Orbitalrecycling und Mutterschiff.</td><td>—</td><td>2.500; 3 Min. 20 Sek.</td></tr>
                    <tr><td>Terraformation (18)</td><td><strong>+1 besitzbarer Planet pro Stufe</strong> (2 + Stufe insgesamt, plus die Boni des politischen Regimes). Stufe 1: Kolonisierungsschiff. Stufe 15: Lunar.</td><td>Versorgungsschiffe 1</td><td>12.000; 1 Std. 10 Min.</td></tr>
                    <tr><td>Frachtmanagement (5)</td><td>Cargo I (Stufe 1), Cargo V (Stufe 3), Cargo X (Stufe 5). Stufe 1: Niobium-Lager, Wasserreservoir, Agrarsilo (mit Aeroponik).</td><td>Versorgungsschiffe 2</td><td>3.500; 6 Min. 40 Sek.</td></tr>
                    <tr><td>Planetare Invasion (1)</td><td>Invasionsbarge.</td><td>Versorgungsschiffe 3</td><td>35.000; 4 Min. 40 Sek.</td></tr>
