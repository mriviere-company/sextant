                    <tr><td>Bewaffnung (5)</td><td>Raketenwaffe (Stufe 1), Laserwaffe (Stufe 3), Plasmawaffe (Stufe 5). Stufe 5 ist auch für Atombomben und Abfangraketen erforderlich.</td><td>—</td><td>2.000; 6 Min. 10 Sek.</td></tr>
                    <tr><td>Raketenwaffe (3)</td><td>Jäger (Stufe 1), Schwerer Jäger (Stufe 2); Stufe 3 wird von allen größeren Kampfschiffen verlangt.</td><td>Bewaffnung 1</td><td>2.600; 7 Min. 30 Sek.</td></tr>
                    <tr><td>Laserwaffe (3)</td><td>Laserfregatte und Laserkorvette (Stufe 1); höhere Stufen werden von Kreuzern, Schlachtschiffen und Zerstörern verlangt.</td><td>Bewaffnung 3</td><td>13.000; 30 Min.</td></tr>
                    <tr><td>Plasmawaffe (3)</td><td>Plasmafregatte (Stufe 1), Kreuzer (Stufe 2), Schlachtschiff und Zerstörer (Stufe 3).</td><td>Bewaffnung 5</td><td>29.000; 1 Std. 18 Min.</td></tr>
                </tbody>
            </table>

            <h3>Räumliche</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Was sie bringt</th><th>Voraussetzung</th><th>Stufe 1</th></tr>
                </thead>
                <tbody>
                    <tr><td>Industrie (5)</td><td>Raumwerft und Jäger (Stufe 1), Leichte Schiffe (Stufe 3), Schwere Schiffe (Stufe 5).</td><td>—</td><td>1.500; 2 Min. 30 Sek.</td></tr>
                    <tr><td>Leichte Schiffe (3)</td><td>Waffenfabrik (Stufe 1), Korvette (Stufe 2), Laserkorvette (Stufe 3).</td><td>Industrie 3</td><td>9.000; 14 Min. 20 Sek.</td></tr>
                    <tr><td>Schwere Schiffe (3)</td><td>Schwerindustrie (Stufe 1), Schlachtschiff (Stufe 2), Zerstörer (Stufe 3).</td><td>Industrie 5</td><td>42.000; 20 Min.</td></tr>
                </tbody>
            </table>
            <p>Die Schiffe erfordern außerdem ihr Gebäude (Raumwerft, Waffenfabrik oder Schwerindustrie): siehe <a href="/wiki/ship_types">Schiffstypen</a>.</p>

            <h3>Politische</h3>
            <p>Als Mitglied einer Allianz hast du außerdem Zugang zu 7 <strong>politischen Forschungen</strong>, die vom Regime deiner Allianz und ihrer Stufe abhängen — zum Beispiel „Produktionsgesetz“ (Produktion) oder „Wissenschaftsmobilisierung“ (Forschungsgeschwindigkeit) für die Waage der Welten. Sie werden mit deinen eigenen Bitcoins bezahlt: siehe <a href="/wiki/alliance_research">Allianzforschungen</a>.</p>

            <h2 id="modes-speciaux">Servermodi mit maximalen Forschungen</h2>
            <p>In manchen Modi (Battle Royale, Dominanz, Search &amp; Destroy) starten alle deine individuellen Forschungen auf der <strong>maximalen Stufe</strong>, und dein Startplanet erhält 500 Uranium. Dann bleiben nur noch die politischen Forschungen deiner Allianz zu erledigen.</p>

    workers_scientists:
        title: "Arbeiter und Wissenschaftler"
        category: "economy"
        order: 4
        tags: "arbeiter,wissenschaftler,bevoelkerung,bitcoin,einkommen,hungersnot,verteidigung,forschungsgeschwindigkeit"
        summary: "Die beiden Bevölkerungen deines Imperiums: die Arbeiter, die die Bitcoins einbringen, und die Wissenschaftler, die die Forschungsgeschwindigkeit erhöhen."
        related: "resources,bitcoin_economy,buildings"
        body: |
            <h2 id="travailleurs">Die Arbeiter</h2>
            <p>Die Arbeiter sind deine <strong>Haupteinnahmequelle für Bitcoins</strong>. Beim Tagesbericht bringt jeder auf deinen Planeten anwesende Arbeiter <strong>0,5 Bitcoin</strong> ein: 10.000 Arbeiter = 5.000 Bitcoins pro Tag, vor den Allianz- und Friedenssteuern. In eine Flotte eingeschiffte Arbeiter bringen nichts ein. Sie verursachen keinen Unterhalt in Bitcoins, nur Nahrung.</p>
            <p>Ihre <strong>Höchstzahl</strong> hängt von deinen Gebäuden ab:</p>
            <ul>
                <li><strong>Große Stadt</strong>: +25.000 max. Arbeiter und etwa +8.000 Arbeiter pro Tag, pro Stufe.</li>
                <li><strong>Metropole</strong>: +80.000 max. Arbeiter und etwa +12.000 Arbeiter pro Tag, pro Stufe.</li>
                <li><strong>Sklavenlager</strong>: +2.500 max. Arbeiter pro Stufe.</li>
            </ul>
            <p>Dein Startplanet beginnt an der Obergrenze (50.000 Arbeiter bei 50.000 Maximum): Baue eine Große Stadt, um weiter zu wachsen.</p>
            <p>Die Bevölkerung <strong>wächst von allein</strong> bis zur Obergrenze, im Takt deiner Großen Städte und Metropolen (+20&nbsp;% pro Stufe der Allianzforschung „Familienpolitik“, unter Embargo halb so schnell). Die Nahrung lässt sie nicht wachsen, aber wenn deine Rationen auf null fallen, tötet die Hungersnot einen Teil deiner Arbeiter.</p>

            <h2 id="scientifiques">Die Wissenschaftler</h2>
            <p>Um Wissenschaftler zu rekrutieren (Seite <strong>Verteidigung</strong>), brauchst du ein <strong>Forschungszentrum</strong> auf dem Planeten: Jede Stufe beherbergt 250 Wissenschaftler. Jeder kostet bei der Rekrutierung <strong>25 Bitcoins und 10 Arbeiter</strong>, dann <strong>3 Bitcoins pro Tag</strong> Unterhalt (das 30-Fache eines Legionärs am Boden). Die Allianzforschung „Wissenschaftsbegeisterung“ senkt diesen Unterhalt.</p>
            <p>Die Wissenschaftler dienen dazu, deine <strong>Forschungsgeschwindigkeit</strong> zu erhöhen. Sie beträgt zu Beginn 1, und die Dauer einer Forschung wird durch diese Geschwindigkeit geteilt (Geschwindigkeit 2 = doppelt so schnelle Forschungen). So entwickelt sie sich:</p>
            <ul>
                <li>Sie steigt in <strong>ganzen Stufen</strong>. Die Wissenschaftler treffen im Lauf ihrer Ausbildung ein, und eine Ankunft bringt nur dann eine Stufe, wenn sie <strong>mindestens 5.000 Wissenschaftler auf einmal</strong> umfasst. Kleinere Ankünfte ändern die Geschwindigkeit nicht: In der Praxis verkürzt die Rekrutierung einiger Hundert Wissenschaftler deine Forschungen nicht.</li>
                <li>Die Allianzforschung „Wissenschaftsmobilisierung“ (Waage der Welten) fügt pro Stufe 0,1 Geschwindigkeit hinzu; aber die nächste Ankunft von Wissenschaftlern rundet die Geschwindigkeit auf die nächste ganze Zahl.</li>
                <li>Die Dauer einer Forschung wird beim Start festgelegt: Ein Geschwindigkeitsgewinn kommt nur den danach gestarteten Forschungen zugute.</li>
            </ul>

            <h2 id="defense">Rolle in der Verteidigung</h2>
            <p>Deine <strong>Arbeiter beteiligen sich an der Bodenverteidigung</strong> — aber nur bei einer <strong>Invasion</strong> (wenn der Feind deinen Planeten einnehmen will). Bei einem klassischen <strong>Raid</strong> (einfache Plünderung) bleiben sie versteckt.</p>
            <p>Die Allianzforschung „Ideologische Stärkung“ (Das Stille Bollwerk) erhöht ihre Verteidigung um 20&nbsp;% pro Stufe.</p>

            <h2 id="gerer">Die Bevölkerung gut verwalten</h2>
            <ul>
                <li>Deine Arbeiter essen <strong>1 Ration pro Stunde für 500 Arbeiter</strong> (50.000 Arbeiter = 100 Rationen pro Stunde; ein Agrarfeld der Stufe 1 produziert 162).</li>
                <li>Ist der Speicher leer, werden die in deinen eigenen Flotten im Orbit des Planeten geladenen Rationen automatisch verbraucht.</li>
                <li>Danach kommt die Hungersnot: Deine Arbeiter sterben (anfangs 0,5&nbsp;% pro 10-Minuten-Zyklus, bis zu 2&nbsp;%, wenn sie länger als 8 Stunden andauert), dann deine Legionäre und deine Mechs. Die Hungersnot lässt einen Planeten nie unter 5.000 Arbeiter fallen.</li>
                <li>Halte deine Agrarsilos gefüllt, vor allem gegenüber einem Embargo (siehe <a href="/wiki/embargo">Embargo und Hungersnot</a>).</li>
            </ul>

            <h2 id="reserve-5000">Die unantastbare Reserve von 5.000 Arbeitern</h2>
            <p>Deine eigenen Aktionen können einen Planeten <strong>nie unter 5.000 Arbeiter fallen lassen</strong>: Jede Aktion, die ihn darunter bringen würde, wird mit einer klaren Meldung blockiert. Auch die Hungersnot hört bei dieser Schwelle auf; nur eine feindliche Invasion kann darüber hinaus Arbeiter töten. Betroffen sind:</p>
            <ul>
                <li>Die <strong>Rekrutierung von Verteidigung</strong> (Legionäre, Mechs, Wissenschaftler), die Arbeiter verbraucht.</li>
                <li>Der <strong>Bau von Schiffen</strong> in der Raumwerft.</li>
                <li>Das <strong>Laden von Arbeitern in einen Frachter</strong> für einen Transfer.</li>
            </ul>
            <p>Die Schaltfläche „MAX“ der Produktionsseiten berücksichtigt diese Reserve: Sie schlägt dir nie ein Maximum vor, das deinen Planeten unter die Schwelle leeren würde.</p>
            <p>Achtung: Eine neue Kolonie startet mit 2.500 Arbeitern. Du kannst dort erst Arbeiter ausgeben, wenn die 5.000 überschritten sind.</p>

    market:
        title: "Markt und Händler"
        category: "economy"
        order: 5
        tags: "markt,haendler,verkauf,handel,frachter,bitcoin,preis,kriegspunkte"
        summary: "Ressourcen und Truppen gegen Bitcoins an Händler verkaufen, per eigener Lieferung oder mit einem Klick, und Kriegspunkte tauschen."
        related: "resources,bitcoin_economy,exchange,ship_types"
        body: |
            <h2 id="marchands">Wer sind die Händler?</h2>
            <p><strong>Nicht-Spieler-Charaktere</strong> (NPCs), angesiedelt auf festen Händlerplaneten: 20 pro Galaxie, in jeder Galaxie in denselben Sektoren (die vier Ecken, die Mitte und Zwischenpositionen). Ihre Position ist auf der Karte sichtbar.</p>
            <p>Sie kaufen dir gegen Bitcoins dein <strong>Niobium</strong>, dein <strong>Wasser</strong> und dein <strong>Uranium</strong> ab, aber auch <strong>Arbeiter</strong>, <strong>Legionäre</strong>, <strong>Wissenschaftler</strong> und <strong>Mechs</strong>. Rationen kaufen sie nicht.</p>

            <h2 id="vendre">So verkaufst du ihnen</h2>
            <ol>
                <li>Belade eine Flotte (am besten einen <strong>Frachter</strong>) mit dem, was du verkaufen willst.</li>
                <li>Sende sie mit der Mission <strong>„Entladen und zurückkehren“</strong> zum Händler. Der Treibstoff wird in Bitcoins bezahlt: Diese Mission kostet auf dem Hinweg das Doppelte, dann wird der Rückweg zum normalen Tarif berechnet, wenn die Flotte wieder startet.</li>
                <li>Bei der Ankunft wird die gesamte verkäufliche Ladung verkauft: Du erhältst Bitcoins und einige Kriegspunkte. Die Rationen bleiben an Bord.</li>
                <li>Die Flotte kehrt automatisch zu dir zurück.</li>
            </ol>
            <p>Blockiert eine Cthulhu-Horde einen Händler, verweigert er jeden Verkauf, solange die Blockade hält.</p>

            <h2 id="vente-clic">Verkaufen mit einem Klick, ohne Flotte</h2>
            <p>Seite <strong>Planeten</strong>, Reiter <strong>Verkauf an Händler</strong>: Füge der Liste die Planeten deiner Wahl hinzu (Menü „Hinzufügen“) und klicke dann auf <strong>An Händler verkaufen</strong>. Das gesamte Niobium und Wasser dieser Planeten wird sofort verkauft, ohne Frachter und ohne Treibstoff, aber <strong>20&nbsp;% günstiger</strong> als bei eigener Lieferung (0,10 Bitcoin pro Niobium, 0,25 pro Wasser) und ohne Kriegspunkte. Ein angegriffener Planet oder einer unter Embargo wird übergangen.</p>

            <h2 id="immunite">Die Händler sind unantastbar</h2>
            <p>Die Händler sind <strong>gegen jeden Angriff immun</strong>. Du kannst sie weder raiden noch invadieren noch bekämpfen. Ihre Flotten nehmen nie an einem Kampf teil, auch wenn sie sich am selben Punkt wie eine Auseinandersetzung befinden.</p>
            <p>Aber Achtung: Auf Servern mit PvE kann eine <strong>Alien-Horde im Angriffsmodus</strong> im Orbit eines Händlers stationiert sein (jeder Händler erhält bei der Erschaffung der Galaxie eine, zur Mitte hin stärker). Ein unbewaffneter Frachter, der in diesen Orbit gelangt, wird angegriffen und zerstört, ohne etwas zu verkaufen. Vergewissere dich vor dem Senden deiner Frachter, dass keine Horde diesen Händler bewacht, oder nutze den Ein-Klick-Verkauf.</p>

            <h2 id="gain">Wie viel bringt das ein?</h2>
            <p>Grundpreise pro Einheit bei eigener Lieferung:</p>
            <table>
                <thead>
                    <tr><th>Ware</th><th>Bitcoins pro Einheit</th></tr>
                </thead>
                <tbody>
                    <tr><td>Niobium</td><td>0,125 (1.000 Niobium = 125)</td></tr>
                    <tr><td>Wasser</td><td>0,3125 (1.000 Wasser = 312)</td></tr>
                    <tr><td>Uranium</td><td>2.000</td></tr>
                    <tr><td>Arbeiter</td><td>5</td></tr>
                    <tr><td>Legionär</td><td>27 (ausgebildet für 8 Bitcoins und 2 Arbeiter)</td></tr>
                    <tr><td>Wissenschaftler</td><td>110 (ausgebildet für 25 Bitcoins und 10 Arbeiter)</td></tr>
                    <tr><td>Mecha</td><td>130 (ausgebildet für 60 Bitcoins und 5 Arbeiter)</td></tr>
                </tbody>
            </table>
            <p>Eine Einheit bringt etwa das 1,5-Fache ihrer Ausbildungskosten ein, wobei jeder verbrauchte Arbeiter mit 5 Bitcoins zählt: Ein Legionär, ausgebildet für 8 Bitcoins und 2 Arbeiter (insgesamt 18), bringt 27 ein. Der Handel bleibt rentabel, ohne eine unerschöpfliche Bitcoin-Quelle zu sein. Der Betrag jedes Verkaufs steht im Bericht „Verkauf an Händler“. Jeder Verkauf, den eine Flotte liefert, bringt auch Kriegspunkte ein, beim Eintreffen wie aus dem Orbit des Händlers: 1 KP pro 5.000 Bitcoins Grundwert (Preise der Tabelle, vor Boni), also 1 KP für 40.000 Niobium, 16.000 Wasser oder 1.000 Arbeiter und 0,4 KP pro Uranium; die Summe des Verkaufs wird auf die Einheit gerundet. Die Allianzforschung „Kriegspunkte“ fügt 10&nbsp;% pro Stufe hinzu; Handelsabkommen und der Held erhöhen die Bitcoins, nicht die KP. Wasser bringt 2,5-mal mehr ein als Niobium. Die Allianzforschung „Handelsabkommen“ (Waage der Welten) fügt 5&nbsp;% pro Stufe hinzu, bis +25&nbsp;%, und ein Wirtschaftsheld der Stufe 10 (Eigenschaft „Händler“) fügt 15&nbsp;% zu den Verkäufen hinzu, die er begleitet: denen seiner Flotte oder denen seines Planeten beim Ein-Klick-Verkauf. Der Reiter Verkauf an Händler der Seite Planeten zeigt deine tatsächlichen Preise.</p>

            <h2 id="astuce">Tipp</h2>
            <p>Statt deine Lager überlaufen zu lassen, verkaufe regelmäßig: Sende einen gut gefüllten Frachter (der Treibstoff wird in Bitcoins bezahlt, eine große Ladung ist besser als mehrere kleine) oder nutze den Ein-Klick-Verkauf, um deine Forschungen oder deine Armee zu finanzieren.</p>

            <h2 id="points-de-guerre">Kriegspunkte tauschen</h2>
            <p>Die Seite <strong>Ziele</strong>, die deine Quests des Tages auflistet, erlaubt es auch, deine Kriegspunkte auszugeben: <strong>1 KP = 1 Bitcoin</strong>, <strong>2 Legionäre</strong> oder <strong>10 Arbeiter</strong>, geliefert auf den Planeten deiner Wahl im Rahmen seiner Obergrenzen.</p>

    recycling:
        title: "Recycling"
        category: "economy"
        order: 6
        tags: "recycling,truemmer,cdr,recycler,asteroid,uranium"
        summary: "Nach jedem Kampf treiben Trümmer im All. Sie einzusammeln ist ein Tagebau."
        related: "spatial_combat,ship_types,fleet_missions"
        body: |
            <h2 id="principe">Die Trümmer: Was ist das?</h2>
            <p>Jedes im Kampf zerstörte Schiff hinterlässt einen Teil seiner Kosten in Form von <strong>Trümmern</strong>, die im All treiben. Das nennt man ein <strong>CDR</strong> (Champ De Ressources, Ressourcenfeld).</p>
            <p>Ein von einem Kampf hinterlassenes Feld enthält <strong>Niobium</strong> und <strong>Wasser</strong>, niemals Uranium. Es bleibt an der Position der Auseinandersetzung, wo auch immer sie war (Planet, leerer Platz…), und ein Symbol zeigt es auf der Karte an.</p>
            <p>Es gibt auch <strong>Asteroidenfelder</strong>, die von allein auf der Karte erscheinen. Es gibt drei Arten: Niobium, Wasser oder <strong>Uranium</strong>. Sie laden sich alle 7 bis 40 Stunden auf und wechseln manchmal den Ort:</p>
            <ul>
                <li>Niobium: 40.000 bis 800.000 pro Aufladung;</li>
                <li>Wasser: 30.000 bis 500.000 pro Aufladung;</li>
                <li>Uranium: 50 bis 180 pro Aufladung.</li>
            </ul>
            <p>Sie werden oft von einer Alien-Flotte bewacht, die jeden Ankömmling angreift.</p>

            <h2 id="wieviel">Wie viele Trümmer?</h2>
            <p>Ein Feld enthält <strong>40&nbsp;% der Baukosten der tatsächlich zerstörten Schiffe</strong>, auf beiden Seiten. Jedes Schiff gibt seine eigenen Ressourcen ab: Ein Zerstörer (2.100 Niobium, 6.000 Wasser) hinterlässt vor allem Wasser. Die Überlebenden hinterlassen nichts.</p>
            <p>Drei Sonderfälle:</p>
            <ul>
                <li>Gegen die <strong>Cthulhu</strong>-Horden sinkt die Rate auf <strong>20&nbsp;%</strong>.</li>
                <li>Die <strong>Ladung</strong> (Niobium und Wasser) einer vollständig zerstörten Flotte ergießt sich ebenfalls ins Feld, zu 40&nbsp;%. Ein angeschlagener Sieger behält dagegen seinen ganzen Laderaum.</li>
                <li>Schiffe, die in <strong>Kriegspunkten</strong> bezahlt werden (Plasmajäger, Kampfkorvette, Schlachtkreuzer, Karavelle), hinterlassen <strong>keine</strong> Trümmer, da sie weder Niobium noch Wasser kosten. Auch zerstörte <strong>planetare Verteidigungsanlagen</strong> hinterlassen nie welche.</li>
            </ul>
            <p>Ein <strong>Orbitalkampf</strong> (Flotte, die von den Geschütztürmen eines Planeten im Angriffsmodus abgeschossen wird, oder Schiffe, die beim Erzwingen eines verteidigten Orbits verloren gehen) hinterlässt ein Feld nach derselben Regel.</p>

            <h2 id="comment">So recycelst du</h2>
            <ol>
                <li>Erforsche <strong>Orbitalrecycling</strong> (Seite <em>Forschung</em>, erfordert <em>Versorgungsschiffe</em> Stufe 3).</li>
                <li>Fertige <strong>Recycler</strong> in deiner Raumwerft (je 2.200 Niobium, 1.000 Wasser und 10 Arbeiter).</li>
                <li>Erstelle eine Flotte mit deinen Recyclern und mit Frachtern für den Laderaum (siehe weiter unten).</li>
                <li>Sende sie mit der Mission <strong>Normal</strong> auf die Koordinaten des Feldes. Auf der <em>Räumlichen Karte</em>: Klicke auf die Position, dann auf <em>Interaktion</em>, wähle die Flotte und die Mission <em>Normal</em>, dann <em>Senden</em>. Es gibt keine spezielle Recycling-Mission.</li>
                <li>Sobald sie ankommt, startet das Recycling von allein: ein erstes Einsammeln sofort, dann eines alle <strong>5 Minuten</strong>.</li>
                <li>Ist der Laderaum voll oder das Feld leer, stoppt das Recycling, und du erhältst den Bericht „Ihre Flotte hat das Recycling beendet!“. <strong>Die Flotte bleibt vor Ort</strong>: Du musst sie zurückholen. Die Schaltfläche <em>Recyceln</em> der Flotte startet das Recycling neu, wenn noch Platz bleibt.</li>
            </ol>
            <p>Eine Flotte, die auf einem Asteroidenfeld wartet, nimmt das Recycling bei jeder Aufladung des Feldes von allein wieder auf, solange noch Platz bleibt.</p>

            <h2 id="capacite">Wie viel kann ein Recycler heimbringen?</h2>
            <p>Bei jedem Durchgang sammelt jeder Recycler <strong>1.000 Ressourcen</strong> ein, zu gleichen Teilen auf die im Feld vorhandenen Ressourcen verteilt (Niobium, Wasser, Uranium).</p>
            <p><strong>Achtung: Ein Recycler hat nur 1.000 Laderaum.</strong> Allein ist er also schon beim ersten Durchgang voll. Um ein großes Feld zu leeren, füge der Flotte Frachter hinzu: Ihr Laderaum füllt sich im Takt deiner Recycler.</p>
            <table>
                <thead>
                    <tr><th>Schiff</th><th>Laderaum</th></tr>
                </thead>
                <tbody>
                    <tr><td>Recycler</td><td>1.000</td></tr>
                    <tr><td>Cargo I</td><td>3.000</td></tr>
                    <tr><td>Cargo V</td><td>10.000</td></tr>
                    <tr><td>Cargo X</td><td>25.000</td></tr>
                    <tr><td>Karavelle</td><td>40.000</td></tr>
                </tbody>
            </table>
            <p>Die Allianzforschung <strong>Verbesserte Cargos</strong> vergrößert den Laderaum der Frachter und der Karavelle.</p>
            <p>Beispiele:</p>
            <ul>
                <li>5 Recycler allein: 5.000 Ressourcen werden gleich bei der Ankunft eingesammelt, dann ist die Flotte voll.</li>
                <li>1 Recycler + 2 Cargo I (7.000 Laderaum): 1.000 pro Durchgang, also 5.000 Ressourcen in 20 Minuten (bei der Ankunft, dann nach 5, 10, 15 und 20 Minuten).</li>
                <li>10 Recycler + 5 Cargo V (60.000 Laderaum): 10.000 pro Durchgang, Flotte voll beim 6. Durchgang, also in etwa 25 Minuten.</li>
            </ul>
            <p>Die Allianzforschung <strong>Recyclingoptimierung</strong> (Regime <em>Das Stille Bollwerk</em>) fügt pro Stufe 400 Ressourcen pro Recycler und Durchgang hinzu, bis zu 3.000 auf Stufe 5. Sie vergrößert nicht den Laderaum der Recycler: Plane Frachter ein, um davon zu profitieren.</p>

            <h2 id="strategie">Strategie</h2>
            <ul>
                <li>Schicke nach jedem Kampf sofort Recycler: Sonst holen sich deine Gegner die Trümmer.</li>
                <li>Schütze sie: Ein einzelner Recycler ist ein leichtes Ziel, und die Asteroidenfelder sind oft bewacht.</li>
                <li>Kämpfe hinterlassen nie Uranium: Recycle die <strong>Uranium-Asteroidenfelder</strong> (50 bis 180 Einheiten pro Aufladung) oder befreie Alien-Basen.</li>
                <li>Recycling ist sehr rentabel: Betrachte es als zweite Wirtschaft hinter deinen Minen.</li>
            </ul>

    daily_report:
        title: "Der Tagesbericht"
        category: "economy"
        order: 7
        tags: "bericht,taeglich,bilanz,einnahmen,kosten,steuer"
        summary: "Jeden Tag um 18:59 Uhr (Pariser Zeit) zieht das Spiel deine Bilanz: Einnahmen, Kosten, Steuern. Gut im Auge behalten."
        related: "bitcoin_economy,game_over,quests"
        body: |
            <h2 id="declenchement">Wann er eintrifft</h2>
            <p>Jeden Tag um <strong>18:59 Uhr (Pariser Zeit)</strong>, also 17:59 UTC im Winter und 16:59 UTC im Sommer. Es ist ein fester Termin für alle Spieler des Servers.</p>
            <p>Du erhältst einen „Imperiumbericht“ auf der Seite <strong>Bericht</strong>, Reiter <strong>Wirtschaft</strong>.</p>

            <h2 id="contenu">Was der Bericht enthält</h2>
            <ul>
                <li><strong>Einnahmen</strong> — 0,5 Bitcoin pro Arbeiter, der zum Zeitpunkt des Berichts auf deinen Planeten anwesend ist.</li>
                <li><strong>Unterhaltskosten</strong> — Legionäre, Mechs, Wissenschaftler, Schiffe, Gebäude. Alles, was in einer Flotte ist, auch im Orbit stationiert, kostet deutlich mehr als das, was am Boden ist (Tabelle unter <a href="/wiki/bitcoin_economy#bareme">Bitcoins und Unterhalt</a>).</li>
                <li><strong>Friedenssteuer</strong> — wenn deine Allianz einen Frieden unterzeichnet hat, bei dem sie der anderen Allianz eine Steuer zahlen muss: Dieser Prozentsatz wird vom Einkommen deiner Arbeiter abgezogen.</li>
                <li><strong>Allianzsteuer</strong> — vom Einkommen deiner Arbeiter abgezogen (nach der Friedenssteuer, falls vorhanden) und in die Kasse deiner Allianz eingezahlt. Bei einem Satz von t&nbsp;% beträgt der abgezogene Anteil Einnahmen × t ÷ (100 + t): Ein Satz von 10&nbsp;% nimmt etwa 9&nbsp;% deiner Einnahmen.</li>
                <li><strong>Endbilanz</strong> — Einnahmen − Steuern − Kosten, zu deinem Guthaben addiert.</li>
                <li><strong>Cthulhu-Bedrohung</strong> — wenn die Cthulhu für dich aktiv sind, steigt die Bedrohung, die auf deinem Imperium lastet, um 5 Punkte (höchstens 300).</li>
            </ul>

            <h2 id="quetes">Die täglichen Quests</h2>
            <p>Der Tagesbericht <strong>erneuert deine 3 Quests</strong> des Tages: Die vom Vortag, die du nicht beendet hast, verschwinden. Hattest du alle erledigt, zahlt er dir zusätzlich einen Bonus in Höhe ihrer durchschnittlichen Belohnung. Du findest sie auf der Seite <strong>Ziele</strong> (siehe <a href="/wiki/quests">Tägliche Quests</a>).</p>

            <h2 id="danger">Die Gefahr, die du im Auge behalten solltest</h2>
            <p>Fällt dein Guthaben nach dem Bericht <strong>ins Minus</strong>, tritt das <strong>wirtschaftliche Game Over</strong> ein: Alle deine Flotten und alle Schiffe am Boden deiner Planeten gehen verloren, und dein Guthaben wird auf 125.000 Bitcoins zurückgesetzt (deine Planeten, Gebäude und Forschungen bleiben unverändert). Ein Bericht „Bankrott droht“ warnt dich vorher, höchstens einmal pro Tag.</p>
            <p>Prüfe deinen Bericht jeden Tag. Steigen deine Kosten zu stark: Stelle nicht benötigte Flotten am Boden ab (ihr Unterhalt wird durch 6 geteilt), verlangsame die Rekrutierung, verkaufe Truppen oder Ressourcen an Händler.</p>

    exchange:
        title: "Austausch zwischen Spielern"
        category: "economy"
        order: 8
        tags: "austausch,allianz,ressourcen,bitcoin,gabe,einzahlung,uranium,entladen"
        summary: "Wie du Ressourcen an einen anderen Spieler oder Bitcoins an einen Verbündeten sendest, und die Grenzen dabei."
        related: "alliance_treasury,alliance_basics,fleet_missions"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>In Area Universe kannst du Ressourcen per Flotte an <strong>jeden beliebigen Spieler</strong> schicken und Bitcoins über die Kasse an die Mitglieder deiner Allianz. Das ist sehr nützlich, um:</p>
            <ul>
                <li>einen Verbündeten wieder auf die Beine zu bringen, der gerade geplündert wurde.</li>
                <li>eine kostspielige Bauanstrengung gemeinsam zu stemmen.</li>
                <li>ein Mitglied deiner Allianz unter Embargo zu versorgen.</li>
            </ul>

            <h2 id="ressources">Physische Ressourcen senden</h2>
            <p>Lade das, was du liefern willst, in den Laderaum einer Flotte: Niobium, Wasser, Rationen, Uranium, aber auch Arbeiter, Legionäre, Wissenschaftler oder Mechs. Sende sie dann mit der Mission <strong>„Entladen und zurückkehren“</strong> zum Planeten des Empfängers.</p>
            <p>Bei der Ankunft wird alles im Rahmen der Kapazitäten des Planeten abgelegt (Lager, Obergrenzen für Legionäre, Arbeiter und Wissenschaftler, höchstens 500 Mechs); der Überschuss bleibt an Bord. Die Flotte kehrt von allein zurück, und der Empfänger erhält einen Lieferbericht.</p>

            <h2 id="bitcoins">Bitcoins senden</h2>
            <p>Bitcoins werden über die <strong>Allianzkasse</strong> übertragen (siehe <a href="/wiki/alliance_treasury">Allianzschatzkammer</a>): Du zahlst dort ein, dann beantragt das Mitglied, dem geholfen werden soll, eine Auszahlung auf seinen Namen. Die Auszahlung erfolgt sofort für ein Mitglied mit der Berechtigung „Bearbeiten“ (und für alle in einer Allianz des Stillen Bollwerks); sonst wartet sie auf die Bestätigung eines Mitglieds mit dieser Berechtigung.</p>

            <h2 id="limites">Die Grenzen</h2>
            <ul>
                <li>Es gibt <strong>kein Tageslimit</strong> und keine Sendeobergrenze: Nur die Laderaumkapazität deiner Flotten (Cargo I: 3.000 Plätze, Cargo V: 10.000, Cargo X: 25.000, 1 Platz pro Einheit und 500 pro Mech) und die Lagerkapazität des Zielplaneten zählen.</li>
                <li>Die Ressourcen reisen zwingend per Flotte: Das braucht Zeit und Treibstoff, in Bitcoins bezahlt. Eine Mission „Entladen und zurückkehren“ kostet auf dem Hinweg das Doppelte, dann wird der Rückweg zum normalen Tarif berechnet, wenn die Flotte wieder startet.</li>
                <li>Ein Planet unter <strong>Embargo</strong> kann nur von seinem Besitzer oder einem Mitglied derselben Allianz eine Lieferung empfangen.</li>
                <li>Uranium wird wie alles andere transportiert, und der Planet, der es empfängt, hat keine Lagergrenze für Uranium.</li>
            </ul>

    fleet_creation:
        title: "Eine Flotte erstellen und senden"
        category: "fleet"
        order: 1
        tags: "flotte,erstellung,schiffe,zusammensetzung,werft,mission"
        summary: "Von der Fertigung des Schiffs bis zu seiner Ankunft am Ziel: der vollständige Ablauf."
        related: "ship_types,fleet_missions,fleet_movement"
        body: |
            <h2 id="prerequis">Was du brauchst</h2>
            <ul>
                <li>Eine <strong>Raumwerft</strong> auf deinem aktiven Planeten.</li>
                <li>Die Ressourcen des Schiffs: meistens Niobium, Wasser und Arbeiter, manchmal Kriegspunkte, Bitcoins oder Legionäre (Tabelle unter <em>Schiffstypen</em>).</li>
                <li>Die für das gewünschte Schiff erforderlichen Forschungen (z. B. <em>Frachtmanagement</em> für die Frachter).</li>
            </ul>

            <h2 id="fabriquer">Schritt 1 — Die Schiffe fertigen</h2>
            <p>Wähle auf der Seite <strong>Raumwerft</strong> (Reiter <strong>Schiffbau</strong>) ein Modell und eine Menge und klicke dann auf <strong>Bauen</strong>. Die Produktion läuft im Hintergrund; jedes Schiff hat eine Grunddauer, die durch die Raumproduktion des Planeten verkürzt wird.</p>

            <h2 id="composer">Schritt 2 — Die Flotte zusammenstellen</h2>
            <p>Sobald die Schiffe geliefert sind, gehe auf die Seite <strong>Flotten</strong> und klicke auf <strong>Neue Flotte erstellen</strong>: Wähle die Schiffe, die einsteigen, und einen Namen (höchstens 12 Zeichen). Öffne dann die Flotte (Klick auf ihren Namen), um:</p>
            <ul>
                <li>Schiffe hinzuzufügen oder zu entfernen (Reiter <strong>Schiffe</strong>, Schaltfläche <strong>Verwalten</strong>), wenn die Flotte auf einem deiner Planeten ist.</li>
                <li>Ressourcen zu laden (Reiter <strong>Fracht</strong>), wenn die Flotte auf einem deiner Planeten ist.</li>
                <li><strong>Legionäre</strong> oder Mechs einzuschiffen (Reiter <strong>Fracht</strong>) für einen Raid oder eine Invasion: Jeder Legionär belegt 1 Laderaumplatz, jeder Mech 500, und die Barges setzen sie ab.</li>
            </ul>

            <h2 id="envoyer">Schritt 3 — Die Flotte senden</h2>
            <ol>
                <li>Wähle das <strong>Ziel</strong>: im Reiter <strong>Flotte bewegen</strong> (Felder Galaxie, System und Planet im Format <code>Galaxie:Sektor:Position</code> oder Liste „Meine Planeten“) oder indem du auf der <strong>Räumlichen Karte</strong> auf das Feld und dann auf <strong>Interaktion</strong> klickst.</li>
                <li>Wähle einen <strong>Missionstyp</strong> (Normal, Entladen und zurückkehren, Sonde, Kolonisieren, Plündern, Einmarschieren… siehe <em>Missionstypen</em>). Der Reiter <strong>Flotte bewegen</strong> dient einfachen Bewegungen (Normal) und der Spionage; die anderen Missionen werden von der Räumlichen Karte aus gesendet.</li>
                <li>Prüfe im Reiter <strong>Flotte bewegen</strong> die geschätzten Treibstoffkosten (in <strong>Bitcoins</strong>) und die Dauer.</li>
                <li>Klicke auf <strong>Senden</strong>.</li>
            </ol>
            <p>Die Flotte erscheint in deiner Liste der Flotten im Flug. In den <strong>ersten 2 Minuten</strong> erlaubt eine Schaltfläche ✕ mit Countdown (oder die Zeile <strong>Abbrechen</strong> auf ihrer Seite), <strong>das Senden abzubrechen</strong>: Die Flotte kehrt sofort zu ihrem Startplaneten zurück, aber der bezahlte Treibstoff wird nicht erstattet. Nach dieser Frist fliegt sie bis zum Ende durch.</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li>Ein <strong>Recycler</strong> in einer Angriffsflotte sammelt die Trümmer gleich nach dem Kampf ein, bremst sie aber aus: Die Flotte fliegt in seiner Geschwindigkeit, dreimal langsamer als die eines Jägers. Für einen schnellen Schlag sende die Recycler getrennt, nachdem der Kampf beendet ist.</li>
                <li>Sende nie deine gesamte Verteidigung auf einmal: Behalte genug, um deinen Planeten zu halten.</li>
                <li>Nur die Mission <strong>Entladen und zurückkehren</strong> bringt die Flotte von allein zurück, und diese Rückkehr wird in Bitcoins bezahlt wie eine normale Strecke. Nach jeder anderen Mission bleibt die Flotte im Orbit ihres Ziels: Sie zurückzuholen ist ein neues Senden, mit eigenem Treibstoff.</li>
            </ul>

    ship_types:
        title: "Schiffstypen"
        category: "fleet"
        order: 2
        tags: "schiffe,jaeger,korvette,fregatte,schlachtschiff,kreuzer,zerstoerer,frachter,sonde,lunar,karavelle,recycler,kosten,geschwindigkeit,voraussetzungen"
        summary: "Alle Schiffe des Spiels: Aufgabe, Kosten, Geschwindigkeit, Laderaum, Voraussetzungen und Kampfwerte."
        related: "fleet_creation,ship_customization,spatial_combat"
        body: |
            <h2 id="utilitaires">Versorgungsschiffe</h2>
            <p>Sie haben keine Waffen. Sie dienen zum Transportieren, Erkunden, Recyceln und Kolonisieren.</p>
            <table>
                <tr><th>Schiff</th><th>Aufgabe</th><th>Kapazität</th></tr>
                <tr><td>Sonde</td><td>Einen Planeten ausspionieren.</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>Leichter Transport.</td><td>3.000</td></tr>
                <tr><td>Cargo V</td><td>Mittlerer Transport.</td><td>10.000</td></tr>
                <tr><td>Cargo X</td><td>Großer Transport.</td><td>25.000</td></tr>
                <tr><td>Karavelle</td><td>Premium-Frachter: der größte und schnellste der Frachter. Bezahlt in Kriegspunkten (25) + 15&nbsp;Arbeiter pro produzierter Einheit.</td><td>40.000</td></tr>
                <tr><td>Kolonisator</td><td>Eine Kolonie auf einem unbewohnten Planeten gründen.</td><td>—</td></tr>
                <tr><td>Recycler</td><td>Kampftrümmer einsammeln: 1.000 pro 5-Min.-Zyklus (mehr mit der Allianzforschung <em>Recyclingoptimierung</em>). Sein eigener Laderaum fasst nur 1.000: Füge der Flotte Frachter hinzu, um mehr einzusammeln.</td><td>1.000</td></tr>
                <tr><td>Invasionsbarge</td><td>Legionäre für einen Raid oder eine Invasion transportieren.</td><td>1.000 Legionäre</td></tr>
                <tr><td>Lunar (manchmal Moon Maker genannt)</td><td>Einen Mond auf einem leeren Feld erschaffen, das genug Trümmer trägt (mindestens 2 Mio. Niobium und 2 Mio. Wasser).</td><td>—</td></tr>
                <tr><td>Radarschiff</td><td>Setzt sich auf einem leeren Feld ein und installiert dort 2&nbsp;Std. lang ein Radar (Stärke 1): Du siehst dann diesen Sektor.</td><td>—</td></tr>
                <tr><td>Störsenderschiff</td><td>Setzt sich auf einem leeren Feld ein und installiert dort 1&nbsp;Std. lang einen Störsender (Stärke 1).</td><td>—</td></tr>
                <tr><td>Mutterschiff</td><td>Flaggschiff, nur eines pro Kommandant. Im Kampf bringt es seiner Flotte 20.000 Hülle und 5.000 Schild, dazu +5&nbsp;% Hülle und Schild und +10&nbsp;% Präzision. Es verkürzt die Flugdauer seiner Flotte um 10&nbsp;% und senkt ihre Signatur um 10&nbsp;%, fliegt selbst aber mit 250 Lumen, langsamer als ein Jäger.</td><td>—</td></tr>
            </table>

            <h2 id="combat">Kampfschiffe</h2>
            <p>Die Kampfschiffe unterscheiden sich durch Hülle, Schild und Waffen (Rakete, Laser, Plasma). Im Kampf addiert sich die Stärke deiner gesamten Flotte: Es gibt weder Reichweite noch einen Bonus eines Schiffstyps gegen einen anderen. Zwei Regeln zählen:</p>
            <ul>
                <li>die drei Jäger haben <strong>keinen Schild</strong> und nehmen den Schaden zuerst auf: Sie schützen die großen Schiffe;</li>
                <li>der <strong>Laser</strong> und vor allem das <strong>Plasma</strong> durchdringen die gegnerischen Schilde besser als die Rakete.</li>
            </ul>
            <p>Grundwerte pro Schiff, vor deinen Verbesserungen (Artikel <em>Deine Schiffe anpassen</em>). Die Spalte „Waffen“ gibt Rakete / Laser / Plasma an; „—“: Das Schiff hat diese Eigenschaft nicht.</p>
            <h3>Jäger und Korvetten</h3>
            <table>
                <tr><th>Schiff</th><th>Hülle</th><th>Schild</th><th>Waffen</th><th>Punkte</th></tr>
                <tr><td>Jäger</td><td>5</td><td>—</td><td>3 / — / —</td><td>3</td></tr>
                <tr><td>Schwerer Jäger</td><td>10</td><td>—</td><td>3 / — / —</td><td>5</td></tr>
                <tr><td>Plasmajäger</td><td>20</td><td>—</td><td>0 / 0 / 0</td><td>21</td></tr>
                <tr><td>Korvette</td><td>40</td><td>1</td><td>6 / — / —</td><td>23</td></tr>
                <tr><td>Laserkorvette</td><td>65</td><td>2</td><td>9 / 2 / —</td><td>21</td></tr>
                <tr><td>Kampfkorvette</td><td>75</td><td>4</td><td>15 / 4 / —</td><td>34</td></tr>
            </table>
            <h3>Fregatten und schwere Schiffe</h3>
            <table>
                <tr><th>Schiff</th><th>Hülle</th><th>Schild</th><th>Waffen</th><th>Punkte</th></tr>
                <tr><td>Fregatte</td><td>110</td><td>5</td><td>24 / 3 / —</td><td>64</td></tr>
                <tr><td>Plasmafregatte</td><td>300</td><td>7</td><td>27 / 3 / 12</td><td>61</td></tr>
                <tr><td>Schlachtkreuzer</td><td>150</td><td>10</td><td>0 / 0 / 0</td><td>160</td></tr>
                <tr><td>Kreuzer</td><td>640</td><td>10</td><td>42 / 10 / 5</td><td>118</td></tr>
                <tr><td>Schlachtschiff</td><td>1.250</td><td>12</td><td>51 / 8 / 8</td><td>279</td></tr>
                <tr><td>Zerstörer</td><td>2.600</td><td>120</td><td>102 / 0 / 0</td><td>676</td></tr>
            </table>
            <p>„Punkte“: das Guthaben an Verbesserungspunkten des Modells. Der <strong>Plasmajäger</strong> und der <strong>Schlachtkreuzer</strong> haben zu Beginn <strong>keinerlei Waffen</strong>: Ihre Waffen stammen vollständig aus den Punkten, die du ihnen zuweist.</p>

            <h2 id="factions">Der Bonus von +20&nbsp;%: die Allianzpolitik</h2>
            <p>Es gibt keine „Fraktion“ von Schiffen. Der einzige Bonus von +20&nbsp;% im Weltraumkampf stammt aus der <strong>Politik deiner Allianz</strong>: Die Waage der Welten schlägt das Stille Bollwerk, das den Hammer der Sterne schlägt, der die Waage der Welten schlägt.</p>
            <p>Wenn die Politik des <strong>Angreifers</strong> die des Verteidigers schlägt, erhalten alle seine Waffen (Rakete, Laser, Plasma) für diesen Kampf +20&nbsp;%; der Verteidiger profitiert nie davon. Ein Spieler ohne Allianz hat weder Bonus noch Malus.</p>

            <h2 id="bonus-cargo">Transportkapazität</h2>
            <p>Die Kapazität der Frachter (Cargo I, V, X und Karavelle) steigt um <strong>+20&nbsp;% pro Stufe</strong> der Allianzforschung <strong>Verbesserte Cargos</strong> (5 Stufen, Allianz mindestens auf Stufe 3). Auf Stufe 5 transportiert ein Cargo I 6.000 statt 3.000. Die Laderäume der anderen Schiffe ändern sich nicht.</p>

            <h2 id="reference">Referenztabelle</h2>
            <h3>Kosten und Produktion</h3>
            <p>Kosten eines Schiffs. Die Dauer ist die Grunddauer der Produktion einer Einheit, verkürzt durch die Raumproduktion deines Planeten.</p>
            <table>
                <tr><th>Schiff</th><th>Kosten</th><th>Dauer</th></tr>
                <tr><td>Sonde</td><td>1.000 Niobium</td><td>20 Sek.</td></tr>
                <tr><td>Cargo I</td><td>800 Niobium, 650 Wasser, 10 Arbeiter</td><td>30 Sek.</td></tr>
                <tr><td>Cargo V</td><td>2.200 Niobium, 1.500 Wasser, 20 Arbeiter</td><td>1 Min.</td></tr>
                <tr><td>Cargo X</td><td>4.500 Niobium, 3.800 Wasser, 25 Arbeiter</td><td>1 Min. 30 Sek.</td></tr>
                <tr><td>Karavelle</td><td>25 Kriegspunkte, 15 Arbeiter</td><td>2 Min.</td></tr>
                <tr><td>Recycler</td><td>2.200 Niobium, 1.000 Wasser, 10 Arbeiter</td><td>1 Min.</td></tr>
                <tr><td>Kolonisator</td><td>5.500 Niobium, 7.000 Wasser, 2.000 Arbeiter, 5 Legionäre</td><td>1 Std.</td></tr>
                <tr><td>Invasionsbarge</td><td>5.000 Niobium, 3.500 Wasser, 10 Arbeiter</td><td>1 Min.</td></tr>
                <tr><td>Radarschiff</td><td>500 Niobium, 600 Wasser, 2.500 Bitcoins</td><td>5 Min.</td></tr>
                <tr><td>Störsenderschiff</td><td>1.100 Niobium, 1.300 Wasser, 5.500 Bitcoins</td><td>10 Min.</td></tr>
                <tr><td>Lunar</td><td>50.000 Niobium, 23.000 Wasser, 20.000 Arbeiter, 200.000 Bitcoins</td><td>5 Std.</td></tr>
                <tr><td>Mutterschiff</td><td>17.500 Niobium, 9.500 Wasser, 2.000 Arbeiter, 25.000 Kriegspunkte</td><td>3 Std. 53 Min.</td></tr>
                <tr><td>Jäger</td><td>25 Niobium, 5 Wasser, 1 Arbeiter</td><td>1 Sek.</td></tr>
                <tr><td>Schwerer Jäger</td><td>35 Niobium, 13 Wasser, 2 Arbeiter</td><td>3,2 Sek.</td></tr>
                <tr><td>Plasmajäger</td><td>1 Kriegspunkt, 1 Arbeiter</td><td>8 Sek.</td></tr>
                <tr><td>Korvette</td><td>100 Niobium, 60 Wasser, 3 Arbeiter</td><td>6 Sek.</td></tr>
                <tr><td>Laserkorvette</td><td>100 Niobium, 200 Wasser, 5 Arbeiter</td><td>10 Sek.</td></tr>
                <tr><td>Kampfkorvette</td><td>3 Kriegspunkte, 3 Arbeiter</td><td>19 Sek.</td></tr>
                <tr><td>Fregatte</td><td>400 Niobium, 200 Wasser, 12 Arbeiter</td><td>20 Sek.</td></tr>
                <tr><td>Plasmafregatte</td><td>300 Niobium, 600 Wasser, 14 Arbeiter</td><td>30 Sek.</td></tr>
                <tr><td>Schlachtkreuzer</td><td>8 Kriegspunkte, 12 Arbeiter</td><td>40 Sek.</td></tr>
                <tr><td>Kreuzer</td><td>1.000 Niobium, 680 Wasser, 30 Arbeiter</td><td>56 Sek.</td></tr>
                <tr><td>Schlachtschiff</td><td>1.000 Niobium, 920 Wasser, 40 Arbeiter</td><td>1 Min. 4 Sek.</td></tr>
                <tr><td>Zerstörer</td><td>2.100 Niobium, 6.000 Wasser, 60 Arbeiter</td><td>4 Min. 30 Sek.</td></tr>
            </table>

            <h3>Geschwindigkeit, Signatur und Laderaum</h3>
            <p>Die Geschwindigkeit ist in Lumen angegeben, wie auf dem Datenblatt des Schiffs (je höher, desto schneller). Die Spalte „Flug“ gibt die Flugzeit pro Entfernungseinheit auf einem Server mit Geschwindigkeit ×1 an (ein beschleunigter Server verkürzt diese Zeiten); eine Flotte fliegt im Tempo ihres langsamsten Schiffs. Die Signatur zählt für den Treibstoff und für das, was die gegnerischen Radare sehen.</p>
            <table>
                <tr><th>Schiff</th><th>Geschwindigkeit</th><th>Flug</th><th>Signatur</th><th>Laderaum</th></tr>
                <tr><td>Sonde</td><td>299</td><td>1 Sek.</td><td>1</td><td>—</td></tr>
                <tr><td>Cargo I</td><td>280</td><td>40 Sek.</td><td>10</td><td>3.000</td></tr>
                <tr><td>Cargo V</td><td>275</td><td>50 Sek.</td><td>24</td><td>10.000</td></tr>
                <tr><td>Cargo X</td><td>270</td><td>60 Sek.</td><td>50</td><td>25.000</td></tr>
                <tr><td>Karavelle</td><td>285</td><td>30 Sek.</td><td>60</td><td>40.000</td></tr>
                <tr><td>Recycler</td><td>225</td><td>150 Sek.</td><td>16</td><td>1.000</td></tr>
                <tr><td>Kolonisator</td><td>200</td><td>200 Sek.</td><td>40</td><td>—</td></tr>
                <tr><td>Invasionsbarge</td><td>150</td><td>300 Sek.</td><td>10</td><td>1.000</td></tr>
                <tr><td>Radarschiff</td><td>299</td><td>1 Sek.</td><td>100</td><td>—</td></tr>
                <tr><td>Störsenderschiff</td><td>299</td><td>1 Sek.</td><td>200</td><td>—</td></tr>
                <tr><td>Lunar</td><td>50</td><td>500 Sek.</td><td>10.000</td><td>—</td></tr>
                <tr><td>Mutterschiff</td><td>250</td><td>100 Sek.</td><td>4.000</td><td>—</td></tr>
                <tr><td>Jäger</td><td>275</td><td>50 Sek.</td><td>1</td><td>—</td></tr>
                <tr><td>Schwerer Jäger</td><td>275</td><td>50 Sek.</td><td>2</td><td>4</td></tr>
                <tr><td>Plasmajäger</td><td>275</td><td>50 Sek.</td><td>5</td><td>—</td></tr>
                <tr><td>Korvette</td><td>265</td><td>70 Sek.</td><td>7</td><td>—</td></tr>
                <tr><td>Laserkorvette</td><td>250</td><td>100 Sek.</td><td>10</td><td>—</td></tr>
                <tr><td>Kampfkorvette</td><td>265</td><td>70 Sek.</td><td>12</td><td>—</td></tr>
                <tr><td>Fregatte</td><td>245</td><td>110 Sek.</td><td>20</td><td>25</td></tr>
                <tr><td>Plasmafregatte</td><td>240</td><td>120 Sek.</td><td>30</td><td>—</td></tr>
                <tr><td>Schlachtkreuzer</td><td>250</td><td>100 Sek.</td><td>40</td><td>—</td></tr>
                <tr><td>Kreuzer</td><td>235</td><td>130 Sek.</td><td>56</td><td>—</td></tr>
                <tr><td>Schlachtschiff</td><td>225</td><td>150 Sek.</td><td>64</td><td>—</td></tr>
                <tr><td>Zerstörer</td><td>230</td><td>140 Sek.</td><td>270</td><td>—</td></tr>
            </table>
            <p>Beispiel: Der Lunar ist sehr langsam, und seine Signatur von 10.000 macht seine Reise teuer. Zu einem benachbarten Sektor braucht er 25 Minuten und kostet etwa 50 Bitcoins Treibstoff; zu einer anderen Galaxie 2 Std. 30 Min. und 1.250 Bitcoins.</p>

            <h3>Voraussetzungen</h3>
            <p>Zu erwerbende Forschungen und zu bauendes Gebäude auf dem produzierenden Planeten:</p>
            <ul>
                <li>Keine Forschung: Sonde, Karavelle, Plasmajäger, Kampfkorvette, Schlachtkreuzer.</li>
                <li>Cargo I / V / X: Frachtmanagement Stufe 1 / 3 / 5.</li>
                <li>Kolonisator: Terraformation Stufe 1. Lunar: Terraformation Stufe 15 + Schwerindustrie.</li>
                <li>Recycler: Orbitalrecycling. Invasionsbarge: Planetare Invasion.</li>
                <li>Radarschiff: Systemscanner Stufe 3 + Waffenfabrik. Störsenderschiff: Systemscanner Stufe 5 + Waffenfabrik.</li>
                <li>Mutterschiff: Versorgungsschiffe Stufe 3 + Schwerindustrie (nur eines pro Kommandant).</li>
                <li>Jäger: Industrie Stufe 1 + Raketenwaffe Stufe 1. Schwerer Jäger: Raketenwaffe Stufe 2 + Waffenfabrik.</li>
                <li>Korvette: Raketenwaffe Stufe 3 + Leichte Schiffe Stufe 2 + Waffenfabrik. Laserkorvette: Raketenwaffe 3 + Laserwaffe 1 + Leichte Schiffe 3 + Waffenfabrik.</li>
                <li>Fregatte: Raketenwaffe 3 + Laserwaffe 1 + Schwerindustrie. Plasmafregatte: dasselbe + Plasmawaffe 1.</li>
                <li>Kreuzer: Raketenwaffe 3 + Laserwaffe 2 + Plasmawaffe 2 + Schwerindustrie.</li>
                <li>Schlachtschiff: die drei Waffen auf Stufe 3 + Schwere Schiffe 2 + Schwerindustrie. Zerstörer: die drei Waffen auf Stufe 3 + Schwere Schiffe 3 + Schwerindustrie.</li>
            </ul>

    ship_customization:
        title: "Deine Schiffe anpassen"
        category: "fleet"
        order: 3
        tags: "anpassung,schiffe,punkte,huelle,schild,praezision,waffen,verbesserung"
        summary: "Bis zu 40 Punkte pro Tag, um Hülle, Schild, Waffen und Präzision deiner Kampfschiffe zu verstärken."
        related: "ship_types,spatial_combat,combat_stats"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Jedes der 12 Kampfschiffe verfügt über ein eigenes <strong>Guthaben an Verbesserungspunkten</strong>: 3 für den Jäger, 676 für den Zerstörer, 1.465 für alle Modelle zusammen. Du gibst sie für seine Eigenschaften aus:</p>
            <ul>
                <li><strong>Hülle</strong> — wie viel es einstecken kann (+5 pro Punkt).</li>
                <li><strong>Schild</strong> — absorbiert einen Teil der Schüsse (+1 pro Punkt; die Jäger haben keinen).</li>
                <li><strong>Rakete</strong>, <strong>Laser</strong>, <strong>Plasma</strong> — seine Waffen (+3, +2 und +1 pro Punkt), je nachdem, welche das Schiff besitzt.</li>
                <li><strong>Präzision</strong> — hebt das schlechteste mögliche Ergebnis jeder Salve an (+1 pro Punkt; kein Schuss verfehlt je, aber ein schlecht gezielter Schuss richtet weniger Schaden an).</li>
            </ul>
            <p>Du kannst <strong>höchstens 40 Punkte pro Tag</strong> ausgeben, alle Schiffe zusammen. Sobald du diese 40 Punkte ausgegeben hast, startet ein Countdown von 24&nbsp;Std.; an seinem Ende hast du wieder 40. Nicht ausgegebene Punkte sammeln sich nicht über 40 hinaus an: Denk daran, jeden Tag vorbeizuschauen.</p>
            <p>Nur Kampfschiffe lassen sich verbessern: Frachter, Recycler, Sonden und andere Versorgungsschiffe haben keine Punkte.</p>

            <h2 id="utiliser">So nutzt du sie</h2>
            <p>Gehe auf die Seite <strong>Raumwerft</strong>, Reiter <strong>Verbessern Sie Ihre Schiffe!</strong> (der Menüeintrag leuchtet grün, wenn du Punkte auszugeben hast). Gib für jedes Modell die Zahl der Punkte ein, die du in jede Eigenschaft setzen willst (der Gewinn wird daneben angezeigt), und klicke dann auf <strong>Anwenden</strong>. Deine Wahl gilt für <strong>alle Schiffe dieses Modells</strong> (aktuelle und künftige). Diese Werte steigen unabhängig voneinander: Punkte in die Hülle oder die Waffen eines Modells zu setzen, mindert nie seine Präzision.</p>

            <h2 id="lesen">Dein Zielen auf dem Bildschirm lesen</h2>
            <p>Der Reiter <strong>Statistiken</strong> der Raumwerft zeigt Modell für Modell das Zielen an, das du vom Guthaben dieses Modells investiert hast (zum Beispiel <code>676 / 676</code> für einen Zerstörer), und den daraus folgenden <strong>Schadensmultiplikator</strong>&nbsp;: <strong>×0,94</strong> bei vollem Zielen, <strong>×0,66</strong> ohne einen einzigen investierten Punkt.</p>
            <p>Das ist keine Trefferquote&nbsp;: <strong>Kein Schuss verfehlt je</strong>. Besseres Zielen hebt die Untergrenze deines Schadens an, nie seine Obergrenze. Es ist dieselbe Zahl wie auf deiner Seite zur Flottenverwaltung, im Reiter Verteidigungen und in deinen Kampfberichten — die vier Bildschirme lassen sich endlich direkt vergleichen. Zur Orientierung: Die Verteidigungsanlagen eines Planeten schießen mit <strong>×1,06</strong>, also besser als eine Flotte mit vollem Zielen.</p>

            <h2 id="maximum">Wie viele Punkte für das Maximum?</h2>
            <p>Die <strong>Präzision</strong> erreicht ihr Maximum, wenn du <strong>das gesamte Guthaben des Modells</strong> hineinsetzt: 3 Punkte für den Jäger, 5 für den Schweren Jäger, 21 für den Plasmajäger und die Laserkorvette, 23 für die Korvette, 34 für die Kampfkorvette, 61 für die Plasmafregatte, 64 für die Fregatte, 118 für den Kreuzer, 160 für den Schlachtkreuzer, 279 für das Schlachtschiff und 676 für den Zerstörer. Es ist eine Entscheidung: alles ins Zielen oder alles in die Kanonen und die Hülle.</p>
            <p>Die anderen Eigenschaften haben kein Maximum, nur die Grenze des Guthabens. Beispiel: Die 676 Punkte eines Zerstörers, in die Hülle gesetzt, fügen ihm 3.380 Hüllenpunkte hinzu (von 2.600 auf 5.980). Bei 40 Punkten pro Tag braucht man 17 Tage, um das Guthaben eines Zerstörers auszugeben, und 37 Tage für die 1.465 Punkte aller Modelle.</p>

            <h2 id="reset">Zurücksetzungen</h2>
            <p>Du kannst deine Punkte <strong>alle 96 Stunden einmal</strong> zurücksetzen, ohne Begrenzung der Anzahl: Ändert sich deine Strategie oder entwickelt sich die Kampfengine weiter, kehren alle ausgegebenen Punkte ins Guthaben jedes Modells zurück. Nach einer Zurücksetzung bleibt die Schaltfläche ausgegraut, und ein Countdown zeigt die Restzeit bis zur nächsten an.</p>
            <p>Direkt nach der Zurücksetzung gibt die Zeile „Du kannst heute noch … Punkte ausgeben“ deine ausgegebenen Punkte minus 90 an, plus das, was du an diesem Tag noch ausgeben konntest, mit einem Minimum von 40. Der Rest kommt danach im gewohnten Takt von 40 pro Tag zurück. Beispiele: Hast du die 1.465 Punkte ausgegeben und heute noch nichts, kannst du sofort 1.375 neu setzen; hast du 300 ausgegeben, kannst du 210 neu setzen.</p>

            <h2 id="modes-speciaux">Servermodi mit maximalen Forschungen</h2>
            <p>In manchen Modi (Battle Royale, Dominanz, Search &amp; Destroy) sind <strong>alle deine Punkte ab dem ersten Tag freigeschaltet</strong>: Die 1.465 Punkte stehen sofort zur Verfügung, statt 40 pro Tag.</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li>Verstreue deine Punkte nicht auf zu viele Modelle: Konzentriere dich auf die, die du wirklich in Massen einsetzt.</li>
                <li>Der <strong>Plasmajäger</strong> und der <strong>Schlachtkreuzer</strong> haben ursprünglich keine Waffe: Ohne Punkte in ihren Waffen schießen sie nicht.</li>
                <li>Der <strong>Jäger</strong> hat nur 3 Punkte: Sie genügen, um seine Präzision auf das Maximum zu bringen.</li>
                <li>Frachter und Recycler lassen sich nicht verbessern: Um sie zu schützen, lass sie von einer bewaffneten Flotte eskortieren.</li>
            </ul>

    fleet_missions:
        title: "Missionstypen"
        category: "fleet"
        order: 4
        tags: "mission,angriff,transport,besiedlung,recycling,spionage,nuklear,raid,invasion"
        summary: "Jede Mission gibt deiner Flotte einen anderen Befehl. So wählst du die richtige."
        related: "fleet_creation,fleet_movement,espionage"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Wenn du eine Flotte sendest, gibst du ihr einen <strong>Missionstyp</strong>. Diese Mission bestimmt, was bei der Ankunft geschieht. Manche Typen erfordern bestimmte Schiffe.</p>
            <p>Alle Missionen werden von der <strong>Räumlichen Karte</strong> aus gesendet: Klicke auf das anvisierte Feld, dann auf <strong>Interaktion</strong>, wähle die Flotte und die Mission und klicke auf <strong>Senden</strong>. Die Liste bietet nur die auf diesem Feld möglichen Missionen an. Der Reiter <strong>Flotte bewegen</strong> auf der Seite einer Flotte dient einfachen Bewegungen (Normal) und der Spionage.</p>

            <h2 id="missions">Die verfügbaren Typen</h2>
            <table>
                <tr><th>Mission (Bezeichnung im Spiel)</th><th>Was sie bewirkt</th><th>Erforderliche Schiffe</th></tr>
                <tr><td><strong>Normal</strong></td><td>Die Flotte fliegt zum anvisierten Punkt und bleibt dort im Orbit. Ein Kampf bricht 5 Minuten nach der Ankunft aus, wenn eine Flotte im Angriffsmodus (deine oder eine bereits anwesende) einem Gegner gegenübersteht, wenn eure Allianzen im Krieg sind oder wenn der anvisierte Planet im Angriffsmodus ist (seine Verteidigungsanlagen schießen). Einzelheiten unter <em>Weltraumkampf</em>.</td><td>Beliebige</td></tr>
                <tr><td><strong>Entladen und zurückkehren</strong></td><td>Lädt die Fracht auf einem Planeten ab (im Rahmen seiner Lager: Der Überschuss fliegt mit der Flotte zurück) oder verkauft sie gegen Bitcoins an einen Händler und kehrt dann allein zurück. Der Treibstoff wird auf dem Hinweg verdoppelt, und der Rückweg wird bei seinem Start zum normalen Tarif bezahlt.</td><td>Schiffe mit Laderaum (in der Praxis Frachter)</td></tr>
                <tr><td><strong>Kolonisieren</strong></td><td>Gründet eine Kolonie auf einem <strong>unbewohnten Planeten</strong> (nicht auf einem leeren Feld).</td><td>Ein Kolonisator</td></tr>
                <tr><td><strong>Plündern</strong></td><td>Bekämpft die Bodenverteidigung, um Ressourcen zu stehlen, ohne den Planeten einzunehmen.</td><td>Barges + Legionäre</td></tr>
                <tr><td><strong>Einmarschieren</strong></td><td>Bekämpft die Bodenverteidigung, um dem Gegner den <strong>Planeten abzunehmen</strong>.</td><td>Barges + Legionäre</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Spioniert den Planeten aus und schickt dir einen Bericht.</td><td>Mindestens eine Sonde</td></tr>
                <tr><td><strong>Mond erstellen</strong></td><td>Erschafft einen Mond auf einem leeren Feld, das mindestens 2 Mio. Niobium und 2 Mio. Wasser an Trümmern trägt.</td><td>Ein Lunar</td></tr>
                <tr><td><strong>Radar einsetzen</strong></td><td>Installiert 2&nbsp;Std. lang ein Radar der Stärke 1 auf einem leeren Feld.</td><td>Ein Radarschiff</td></tr>
                <tr><td><strong>Störsender einsetzen</strong></td><td>Installiert 1&nbsp;Std. lang einen Störsender der Stärke 1 auf einem leeren Feld.</td><td>Ein Störsenderschiff</td></tr>
            </table>
            <p>Eine Flotte, die bereits im Orbit ihres Ziels ist, kann auch direkt von ihrer Seite aus handeln, Rubrik <strong>Interaktion</strong>: Einmarschieren, Plündern, Kolonisieren, Spionieren oder einsetzen.</p>

            <h3>Das sind keine Missionen</h3>
            <ul>
                <li><strong>Recycling</strong>: automatisch. Eine Flotte mit mindestens einem Recycler und Platz im Laderaum beginnt zu recyceln, sobald sie auf einem Trümmerfeld ankommt, egal mit welcher Mission (in der Regel Normal). Die Schaltfläche <strong>Recyceln</strong> der Flotte startet die Arbeit neu.</li>
                <li><strong>Am Boden abstellen</strong>: Auf einem deiner Planeten stößt die Flotte zum Bestand der Schiffe am Boden (siehe <em>Erweiterte Flottenverwaltung</em>).</li>
                <li><strong>Nuklearrakete</strong>: von der Räumlichen Karte aus „Atomrakete senden“ auf einen feindlichen Planeten. Die Rakete startet von einem deiner Planeten, der eine besitzt, fliegt 30 Minuten und kann nicht abgebrochen werden.</li>
            </ul>

            <h2 id="choisir">So wählst du die richtige Mission</h2>
            <ul>
                <li>Du willst <strong>Bitcoins</strong>? → Entladen und zurückkehren, zu einem Händler.</li>
                <li>Du willst <strong>Informationen</strong>? → Sonde.</li>
                <li>Du willst einen Feind <strong>schwächen</strong>? → Plündern.</li>
                <li>Du willst seinen Planeten <strong>einnehmen</strong>? → Einmarschieren.</li>
                <li>Du willst <strong>Trümmer einsammeln</strong>? → Schicke Recycler (Mission Normal): Sie recyceln bei der Ankunft von allein.</li>
            </ul>

    fleet_movement:
        title: "Bewegung und Entfernung"
        category: "fleet"
        order: 5
        tags: "bewegung,entfernung,geschwindigkeit,reise,treibstoff,koordinaten,bitcoin,abbrechen,nacht"
        summary: "Wie Flugdauer und Treibstoffverbrauch berechnet werden und was deine Flotte verlangsamt."
        related: "fleet_creation,galaxy_navigation,fleet_missions"
        body: |
            <h2 id="coordonnees">So funktionieren die Koordinaten</h2>
            <p>Jede Position im Universum wird im Format <strong>Galaxie:Sektor:Position</strong> geschrieben. Beispiel: <code>1:5:12</code> = Galaxie 1, Sektor 5, Position 12.</p>
            <ul>
                <li>Eine <strong>Galaxie</strong> enthält 100 Sektoren (Raster 10×10, zeilenweise von 1 bis 100 nummeriert: 1 bis 10 in der ersten Zeile, 91 bis 100 in der letzten). Die Räumliche Karte nennt sie „Systeme“.</li>
                <li>Ein <strong>Sektor</strong> enthält 25 Positionen (Raster 5×5); Position 13 in der Mitte ist immer eine Sonne.</li>
            </ul>

            <h2 id="distance">So wird die Entfernung berechnet</h2>
            <ul>
                <li><strong>In deinem Sektor</strong>: etwa 1 pro Feld Abstand (1 zwischen zwei benachbarten Feldern, höchstens 6,25 von einer Ecke zur anderen).</li>
                <li><strong>Zu einem anderen Sektor derselben Galaxie</strong>: etwa 3 pro Sektor Abstand, in gerader Linie auf dem 10×10-Raster; die Position im Sektor zählt dann nicht mehr. Von 3 für einen benachbarten Sektor bis etwa 40 von einer Ecke der Galaxie zur anderen.</li>
                <li><strong>Zu einer anderen Galaxie</strong>: immer 18, egal welcher Sektor anvisiert wird. Dafür ist die Forschung <strong>Hyperraumtechnologie</strong> nötig.</li>
            </ul>
            <p>Der Reiter <strong>Flotte bewegen</strong> auf der Seite einer Flotte zeigt vor dem Senden eine Schätzung der Kosten und der Dauer an. Diese Schätzung berücksichtigt weder Geschwindigkeitsboni noch die Verdopplung bei „Entladen und zurückkehren“ noch die Geschwindigkeit des Servers. Von der Räumlichen Karte aus erfolgt das Senden ohne Vorschau.</p>

            <h2 id="duree">Die Flugdauer</h2>
            <p>Die Dauer wird so berechnet: <strong>Entfernung × Zeit pro Einheit des langsamsten Schiffs × Geschwindigkeit des Servers</strong>. Eine Flotte fliegt immer mit der Geschwindigkeit ihres langsamsten Schiffs. Zeit pro Entfernungseinheit auf einem Server mit Geschwindigkeit ×1 (manche Server sind beschleunigt):</p>
            <table>
                <tr><th>Zeit pro Einheit</th><th>Schiffe</th></tr>
                <tr><td>1 Sek.</td><td>Sonde, Radarschiff, Störsenderschiff</td></tr>
                <tr><td>30 Sek.</td><td>Karavelle</td></tr>
                <tr><td>40 Sek.</td><td>Cargo I</td></tr>
                <tr><td>50 Sek.</td><td>Cargo V, Jäger, Schwerer Jäger, Plasmajäger</td></tr>
                <tr><td>60 Sek.</td><td>Cargo X</td></tr>
                <tr><td>70 Sek.</td><td>Korvette, Kampfkorvette</td></tr>
                <tr><td>100 Sek.</td><td>Laserkorvette, Schlachtkreuzer, Mutterschiff</td></tr>
                <tr><td>110 Sek.</td><td>Fregatte</td></tr>
                <tr><td>120 Sek.</td><td>Plasmafregatte</td></tr>
                <tr><td>130 Sek.</td><td>Kreuzer</td></tr>
                <tr><td>140 Sek.</td><td>Zerstörer</td></tr>
                <tr><td>150 Sek.</td><td>Schlachtschiff, Recycler</td></tr>
                <tr><td>200 Sek.</td><td>Kolonisator</td></tr>
                <tr><td>300 Sek.</td><td>Invasionsbarge</td></tr>
                <tr><td>500 Sek.</td><td>Lunar</td></tr>
            </table>
            <p>Beispiele auf einem Server mit Geschwindigkeit ×1:</p>
            <ul>
                <li>Jäger zu einem benachbarten Sektor: 2 Min. 30 Sek. (3 × 50 Sek.).</li>
                <li>Ein Cargo I, der einen Verbündeten beliefert: etwa 2 Minuten zu einem benachbarten Sektor, 10 Minuten zu einem Sektor, der 5 Sektoren weiter liegt, 12 Minuten zu einer anderen Galaxie (Cargo X: 3, 15 und 18 Minuten). Bei „Entladen und zurückkehren“ rechne für den Rückweg dasselbe.</li>
                <li>Ein Kolonisator: etwa 10 Minuten zu einem benachbarten Sektor, 50 Minuten bei 5 Sektoren, 1 Stunde zu einer anderen Galaxie.</li>
            </ul>
            <p>Was die Dauer verändert:</p>
            <ul>
                <li>Das <strong>Mutterschiff</strong> verkürzt die Flugdauer seiner Flotte um 10&nbsp;%. Achtung: Es fliegt selbst mit 100 Sek. pro Einheit, sodass eine Jägerflotte, die es mitnimmt, von 50 auf 90 Sek. pro Einheit kommt. Es <strong>senkt außerdem die Radarsignatur</strong> der Flotte um 10&nbsp;% (Tarnung) — die Globale Sicht zeigt dagegen die Rohsumme deiner Schiffe.</li>
                <li>Ein <strong>Held</strong> an Bord, der einen Geschwindigkeitsbonus gibt (siehe den Artikel <em>Dein Held</em>), und der Allianzbonus für die Flottengeschwindigkeit verkürzen die Strecke. Zusammen können die Boni des Helden die Dauer nicht um mehr als 90&nbsp;% senken.</li>
                <li>Die <strong>nächtliche Verlangsamung</strong> kann die Dauer vervielfachen (siehe weiter unten).</li>
            </ul>

            <h2 id="carburant">Der Treibstoff</h2>
            <p>Der Treibstoff wird beim Start in <strong>Bitcoins</strong> bezahlt. Er hängt von der <strong>Signatur</strong> der Flotte (die Summe der Signaturen ihrer Schiffe; die Fracht zählt nicht) und von der Entfernung ab:</p>
            <ul>
                <li>in derselben Galaxie: <strong>Signatur × Entfernung ÷ 600</strong>, gerundet;</li>
                <li>zu einer anderen Galaxie: <strong>Signatur ÷ 8</strong>, gerundet, egal welches Ziel.</li>
            </ul>
            <p>Die Mission <strong>Entladen und zurückkehren</strong> kostet auf dem Hinweg das <strong>Doppelte</strong>, und ihr Rückweg wird danach wie eine normale Strecke bezahlt, wenn die Flotte wieder startet. Ein Mutterschiff senkt die Signatur der Flotte und damit ihren Treibstoff um 10&nbsp;% (aber seine eigene Signatur beträgt 4.000).</p>
            <p>Beispiele: 1 Cargo I (Signatur 10) zu einem benachbarten Sektor: 0 Bitcoin. 100 Cargo X (Signatur 5.000) zu einem Händler, der 5 Sektoren weiter liegt: 252 Bitcoins auf dem Hinweg, 126 auf dem Rückweg. 1.000 Jäger zu einer anderen Galaxie: 125 Bitcoins. Hast du nicht genug Bitcoins, wird das Senden verweigert.</p>

            <h2 id="rappel">Eine Flotte im Flug zurückrufen</h2>
            <p>In den <strong>ersten 2 Minuten</strong> des Flugs erscheint auf der Flotte (Seite Flotten) eine Schaltfläche ✕ mit Countdown und auf ihrer Seite eine Zeile <strong>Abbrechen</strong>: Sie <strong>bricht das Senden ab</strong>. Die Flotte ist sofort wieder auf ihrem Startplaneten, aber der bezahlte Treibstoff wird nicht erstattet. Das gilt auch für einen Kolonisator.</p>
            <p>Nach dieser Frist lässt sich die Flotte nicht mehr aufhalten: Schicke sie nach ihrer Ankunft zurück (neue Strecke, neuer Treibstoff). Eine Nuklearrakete lässt sich nie abbrechen.</p>

            <h2 id="night-slowdown">🌙 Nächtliche Verlangsamung</h2>
            <p>Diese Verlangsamung betrifft eine Flotte, die mindestens ein Kampfschiff, Legionäre oder Mechs transportiert und zum Planeten eines anderen Spielers oder eines KI-Kommandanten gesendet wird, der weder in deiner Allianz noch verbündet noch mit dir im Pakt oder im Frieden ist. Würde diese Flotte während der <strong>Nacht des Verteidigers</strong> (23 bis 06 Uhr in seiner Zeitzone) ankommen, wird <strong>ihre gesamte Flugdauer vervielfacht</strong>, standardmäßig mit 10 (jeder Server kann diesen Multiplikator einstellen).</p>
            <p>Beispiel: Ein Flug von 1&nbsp;Std., der um 23:30 Uhr ankommen würde, dauert 10&nbsp;Std. und kommt um 9:30 Uhr an. Eine Flotte aus Frachtern, Sonden oder Kolonisatoren ohne Truppen an Bord wird nie verlangsamt. Die im Reiter <strong>Flotte bewegen</strong> angezeigte Dauer enthält diesen Multiplikator bereits.</p>
            <p>Ein Symbol 🌙 auf der Karte zeigt die Spieler an, die sich gerade im Nachtfenster befinden. Im Reiter <strong>Flotte bewegen</strong> erscheint beim Senden ein Bestätigungsfenster, wenn die Ankunft in die gegnerische Nacht fällt; von der Räumlichen Karte aus startet die Flotte ohne diese Warnung. Die Zeitzone wird automatisch erkannt und lässt sich höchstens einmal pro Monat (und 6-mal pro Jahr) ändern.</p>

    fleet_management:
        title: "Erweiterte Flottenverwaltung"
        category: "fleet"
        order: 6
        tags: "verwaltung,flotte,teilen,fusionieren,uebertragen,gruppieren,am boden abstellen,sammelpunkt,kohorte,aufgeben"
        summary: "Teilen, fusionieren, am Boden abstellen, ein Senden abbrechen: die erweiterten Handgriffe für deine Flotten."
        related: "fleet_creation,fleet_missions,ship_types"
        body: |
            <h2 id="operations">Die verfügbaren Operationen</h2>
            <p>Sie erfolgen von der Seite einer Flotte aus (Klick auf ihren Namen, Seite <strong>Flotten</strong>):</p>
            <ul>
                <li><strong>Teilen</strong> (Reiter <strong>Schiffe</strong>) — einen Teil der Schiffe und der Fracht in eine neue Flotte abspalten. Im Flug oder im Kampf nicht möglich; höchstens 100 Flotten.</li>
                <li><strong>Fusionieren</strong> (Liste „Flotten im Orbit“) — eine andere deiner Flotten oder alle (<strong>Fusion</strong>) vereinen, die auf demselben Planeten stationiert sind.</li>
                <li>Die Schiffe <strong>verwalten</strong> (Reiter <strong>Schiffe</strong>) und die <strong>Fracht</strong> — auf einem deiner Planeten Schiffe oder Fracht zwischen der Flotte und dem Boden verschieben.</li>
                <li><strong>Am Boden abstellen</strong> — auf einem deiner Planeten die gesamte Flotte (Schiffe, Truppen, Fracht) in den Bestand des Planeten übergeben; die Flotte verschwindet. Die abgeladenen Truppen und die Fracht müssen in die Kapazitäten des Planeten passen&nbsp;; eine Flotte, die keine transportiert, setzt immer auf, selbst auf einem bereits vollen Planeten.</li>
                <li><strong>Senden abbrechen</strong> (Schaltfläche ✕ auf der Flotte im Flug oder Zeile <strong>Abbrechen</strong> auf ihrer Seite) — nur in den ersten 2 Minuten des Flugs: Die Flotte kehrt sofort zu ihrem Ausgangspunkt zurück, der Treibstoff ist verloren.</li>
                <li><strong>Aufgeben</strong> — du verlierst die Flotte: Auf einem Server, auf dem Cthulhu präsent ist, fällt sie ihm zu (und kann sich gegen dich wenden); anderswo wird sie zerstört.</li>
            </ul>
            <p>Auf der Seite <strong>Flotten</strong> selbst:</p>
            <ul>
                <li><strong>Flottensammelpunkt</strong> — schickt alle deine stehenden Flotten zu diesem Planeten, wo sie bei der Ankunft aufsetzen.</li>
                <li><strong>Schiffssammelpunkt</strong> — fasst die Schiffe am Boden deiner anderen Planeten in Flotten zusammen, die zu diesem hier fliegen und dort aufsetzen.</li>
                <li><strong>Kohorten</strong> — ordne deine Flotten in benannte Listen (höchstens 10), um sie leicht wiederzufinden. Keine Wirkung im Kampf.</li>
            </ul>
            <p>Teilen, Fusionieren, Übertragen und Am-Boden-Abstellen kosten keinerlei Ressourcen. Nur Bewegungen, Sammelpunkte eingeschlossen, werden bezahlt, in Bitcoins als Treibstoff.</p>

            <h2 id="en-vol">Was man nicht tun kann</h2>
            <ul>
                <li>Die Zusammensetzung einer Flotte <strong>im Flug</strong> ändern (Ladung, Schiffe).</li>
                <li>Die Mission oder das Ziel einer Flotte im Flug ändern. Nur das Abbrechen ist möglich, und nur in den ersten 2 Minuten.</li>
                <li>Eine Flotte teleportieren (keine magische Abkürzung!).</li>
            </ul>

            <h2 id="astuces">Anwendungsfälle</h2>
            <ul>
                <li><strong>Vor einem Kampf teilen</strong>: Behalte einen Teil deiner Flotte in Reserve, sende eine Vorhut.</li>
                <li><strong>Nach einem Raid fusionieren</strong>: Vereine mehrere Rückkehrer, um den Überblick zu behalten.</li>
                <li><strong>Am Boden abstellen</strong>: Schiffe am Boden kosten sechsmal weniger Unterhalt als in einer Flotte (ein Zwölftel ihrer Signatur in Bitcoins pro Tag, bei der Bilanz um 18:59 Uhr, Pariser Zeit, gegenüber der Hälfte in einer Flotte), aber sie <strong>kämpfen nicht</strong>. Um einen Planeten zu verteidigen, halte eine bewaffnete Flotte im Orbit, im Angriffsmodus.</li>
            </ul>

    espionage:
        title: "Spionage und Sonden"
        category: "fleet"
        order: 7
        tags: "spionage,sonde,spion,erkennung,information,aufklaerung"
        summary: "Wissen, was der Gegner hat, bevor du zuschlägst: das Senden von Sonden erklärt."
        related: "fleet_missions,radar_jammer,research"
        body: |
            <h2 id="envoyer">Eine Sonde senden</h2>
            <ol>
                <li>Fertige <strong>Sonden</strong> in der Raumwerft (keine Forschung erforderlich; 1.000 Niobium pro Stück).</li>
                <li>Klicke auf der <strong>Räumlichen Karte</strong> auf den anvisierten Planeten, dann auf <strong>Interaktion</strong> → <strong>Planeten sondieren</strong>: Eine am Boden eines deiner Planeten gelagerte Sonde startet sofort. Du kannst auch eine Sondenflotte erstellen und sie mit der Mission <strong>Sonde</strong> senden.</li>
                <li>Allein ist eine Sonde nahezu augenblicklich: 1 Sekunde pro Entfernungseinheit (18 Sekunden zu einer anderen Galaxie). Mit anderen Schiffen gemischt, fliegt sie in deren Geschwindigkeit.</li>
            </ol>
            <p>Die Schaltfläche <strong>Interaktion</strong> der Karte erscheint nur, wenn mindestens eine deiner Flotten steht. Nur von einem anderen Kommandanten bewohnte Planeten können gescannt werden: Eine zu einem Mond gesendete Sonde kommt an, ohne einen Bericht zu erzeugen.</p>
            <p>Bei der Ankunft scannt die Sonde den Planeten und schickt dir einen Bericht, dann bleibt sie im Orbit des Ziels. Von ihrer Seite aus (Schaltfläche <strong>Spionieren</strong>) kann sie später erneut einen Bericht erstellen; geht der Planet in den Angriffsmodus, können seine Verteidigungsanlagen sie zerstören. Von der Karte oder der Schaltfläche Spionieren aus kann ein und derselbe Planet nur einmal pro Stunde sondiert werden.</p>

            <h2 id="reussite">Was bestimmt den Erfolg?</h2>
            <p>Ein stilles Duell stellt deine <strong>Spionagestufe</strong> gegen die des Verteidigers:</p>
            <ul>
                <li>Ist deine Stufe <strong>größer oder gleich</strong>, ist der Bericht vollständig.</li>
                <li>Ist deine Stufe niedriger, scheitert die Spionage: Der Bericht enthält nichts außer dem Namen des Planeten. Es gibt kein Teilergebnis.</li>
            </ul>
            <p>Um deine Spionage zu steigern: Forschung <strong>Systemscanner</strong> bis Stufe 5, dann Forschung <strong>Spionage</strong>, ohne Maximalstufe.</p>

            <h2 id="rapport">Was ein erfolgreicher Bericht verrät</h2>
            <ul>
                <li>Die <strong>Ressourcen</strong>: Niobium, Wasser, Rationen, Uranium, Arbeiter und Wissenschaftler.</li>
                <li>Die <strong>Gebäude</strong> und ihre Stufe.</li>
                <li>Die <strong>Verteidigungsanlagen</strong>: Geschütztürme, Atomabfangraketen, Schild, <strong>Legionäre</strong> und <strong>Mechs</strong>.</li>
                <li>Die <strong>Schiffe am Boden</strong> des Planeten (Atomraketen eingeschlossen). Die Flotten im Orbit stehen nicht darin: Sieh sie dir auf der Räumlichen Karte an.</li>
                <li>Die auf dem Planeten festgehaltenen <strong>Gefangenen</strong> (Helden).</li>
            </ul>
            <p>Genau das, was man zur Entscheidung braucht: Raid, Invasion oder Rückzug.</p>

            <h2 id="detection">Kann man entdeckt werden?</h2>
            <p>Immer. Bei jedem Sondieren erhält der Verteidiger einen Bericht „Spionage entdeckt“, der <strong>deinen Namen</strong> nennt und angibt, ob der Versuch gelungen oder gescheitert ist, sowie eine Benachrichtigung. Das Radar ändert daran nichts.</p>
            <p>Der Radarstörsender auch nicht: Er verbirgt einen Planeten auf der Karte, hindert eine Sonde aber nicht daran, ihn zu scannen. Nur eine Spionagestufe, die höher ist als deine, schützt den Verteidiger.</p>

    spatial_combat:
        title: "Weltraumkampf"
        category: "combat"
        order: 1
        tags: "kampf,weltraum,flotte,schlacht,block,runde,schild,praezision,verluste,schaden,schirm,jaeger"
        summary: "Der vollständige Ablauf eines Kampfes zwischen Flotten: Stärke der Lager, Duell der Schilde, Schussrunden, Kampfende und exakte Berechnung deiner Verluste."
        related: "invasion,raid,battle_reports,combat_stats,secondary_heroes"
        body: |
            <h2 id="ausloesung">Wann ein Kampf ausgelöst wird</h2>
            <p>Sobald eine mit <strong>[Angriff]</strong> markierte Flotte ihre Position (Galaxie:Sektor:Position) mit einer feindlichen Flotte teilt, wird der Kampf <strong>5 Minuten</strong> später angesetzt; bis dahin kann niemand mehr den Angriffsmodus seiner Flotten ändern. Deine am selben Ort anwesenden Flotten verschmelzen zunächst zu einer einzigen Armada.</p>
            <p>Alle Flotten vor Ort werden je nach Diplomatie in <strong>zwei Lager</strong> aufgeteilt: deine Allianz und die durch ein Verteidigungsbündnis mit ihr verbundenen Allianzen auf der einen Seite, der Feind und die seinen auf der anderen; eine durch einen Nichtangriffspakt mit dem gegnerischen Lager verbundene Allianz bleibt außen vor. Ein Lager ohne jede Schiffswaffe (Frachter, Recycler, Sonden, reine Truppen) liefert keine Schlacht: Es wird zerstört, und der Bericht erwähnt das.</p>
            <p><strong>Allianzen im Krieg, niemand bewaffnet</strong> — zwei Flotten von Allianzen im Krieg, die sich im Orbit begegnen, lösen nur dann einen Kampf aus, wenn mindestens eine der beiden Schiffswaffen trägt. Zwei vollständig unbewaffnete Flotten (Frachter, Sonden, Recycler), die sich begegnen, kämpfen schlicht nicht&nbsp;: Deine Flotten werden nicht festgehalten, und niemand wird grundlos gewarnt.</p>
            <p><strong>Fall von Raids und Invasionen</strong> — wird diese Schlacht durch einen Raid oder eine Invasion gegen einen bewachten Planeten ausgelöst (siehe die Artikel <em>Planeteninvasion</em> und <em>Raids (Plünderung)</em>), setzt genau diese Auslösung die Markierung <strong>[Angriff]</strong> auf deine angreifende Flotte. Sie wird danach nie entfernt&nbsp;: Eine überlebende Raid- oder Invasionsflotte bleibt also als feindlich markiert — die Geschütztürme im Angriffsmodus können sie später angreifen, und sie wird bei der Erkennung des nächsten Weltraumkampfs erfasst, sobald sie einem Feind begegnet.</p>

            <h2 id="staerke">Die Stärke eines Lagers</h2>
            <p>Der Kampf stellt die <strong>Summen</strong> der beiden Lager gegeneinander: Das Spiel addiert Panzerung, Schild, Raketen, Laser und Plasma aller beteiligten Schiffe.</p>
            <ul>
                <li><strong>Verteidiger zu Hause</strong> — die Geschütztürme und die Panzerung der Verteidigungsanlagen des Planeten schließen sich seinem Lager an; der Schild fügt +50.000 Panzerung hinzu, der Große Schild +600.000 (je +20&nbsp;% mit einer Raumstation). Eine bewaffnete Flotte eines Mitglieds seiner Allianz, die auf dem Planeten stationiert ist, profitiert ebenfalls davon.</li>
                <li><strong>Präzision</strong> — Durchschnitt der Präzisionen der Flotten des Lagers (aus der Anpassung deiner Schiffe). Siehe <em>Die Truppenstärke verstehen</em>.</li>
                <li><strong>Allianzpolitik</strong> — jedes Regime schlägt seinen Rivalen: <strong>Die Waage der Welten</strong> schlägt <strong>Das Stille Bollwerk</strong>, das <strong>Den Hammer der Sterne</strong> schlägt, der Die Waage der Welten schlägt. Schlägt die Politik des <strong>Angreifers</strong> die des Verteidigers, gewinnen seine Raketen, Laser und Plasma für diesen Kampf +20&nbsp;%.</li>
                <li><strong>Allianzverbesserungen</strong> — bis zu +5&nbsp;% pro Waffentyp, für Panzerung, Schild und Präzision und bis zu +10&nbsp;% für die planetaren Verteidigungsanlagen. Dieser letzte Bonus wirkt, wenn deine Verteidigungsanlagen an der Seite einer Flotte kämpfen, nicht im Orbitalkampf des Angriffsmodus.</li>
                <li><strong>Held</strong> — Boni auf Angriff, Verteidigung, Schild und Präzision je nach Fähigkeiten und Gegenständen. Ein Held mit <strong>Einschüchterung</strong> senkt die gegnerischen Waffen; ein <strong>Taktiker</strong> verstärkt die erste Salve seines Lagers.</li>
            </ul>

            <h2 id="planetenverteidigung">Deine Geschütztürme kämpfen in demselben Kampf</h2>
            <p>Schließen sich die Verteidigungsanlagen deines Planeten einem Lager an, <strong>ist</strong> dieser Kampf der gesamte Kampf deines Planeten&nbsp;: Es gibt keinen zweiten, getrennten Orbitalkampf dahinter für deine Geschütztürme. Sie zielen mit ihrer eigenen Präzision (eine ungenaue Eskorte, die neben ihnen stationiert ist, verschlechtert ihren Schuss nicht), und sie erleiden dabei <strong>echte Verluste</strong>, ob der Angriffsmodus des Planeten aktiv ist oder nicht:</p>
            <ul>
                <li><strong>gewinnt dein Lager</strong>, verlieren deine Geschütztürme denselben Bruchteil wie die von deinem Lager verlorene Panzerung (höchstens 95&nbsp;%); Schilde und Raumstation bleiben unversehrt;</li>
                <li><strong>bricht dein Lager zusammen</strong>, werden alle Geschütztürme, der Schild, der Große Schild und die Raumstation zerstört, die Produktionsschlange der Seite Verteidigung geht verloren (Geschütztürme, Legionäre, Mechs, Bomben oder Abfangraketen, die noch nicht geliefert wurden, eingeschlossen) und der Angriffsmodus wird abgeschaltet. Die bereits am Boden befindlichen Legionäre, Mechs und Arbeiter, die Gebäude und die gelagerten Bomben oder Abfangraketen bleiben unberührt.</li>
            </ul>
            <p>Ein von einer <strong>bewaffneten</strong> Flotte (Schiffswaffen) bewachter Planet — deine oder die eines Mitglieds deiner Allianz — kann also nicht geplündert oder invadiert werden, ohne dass zuerst eine Schlacht entscheidet; eine Sonde oder ein einzelner Frachter genügen nicht.</p>

            <h2 id="schilde">Das Duell der Schilde</h2>
            <p>Jede Salve trifft zuerst auf den gegnerischen Schild. Ihre <strong>Durchschlagskraft</strong> beträgt&nbsp;:</p>
            <p><code>Raketen ÷ 7 + Plasma × 4 + Laser × 2</code></p>
            <p>Das Plasma ist gegen Schilde hervorragend, die Raketen durchdringen sie schlecht — egal wie groß der Kampf ist, zehn gegen zehn wie hundert Millionen gegen hundert Millionen. Bei jeder Salve wird der Teil des Schadens, der die Durchschlagskraft übersteigt, vom gegnerischen Schild absorbiert, bis seine Ladung erschöpft ist&nbsp;; der Rest und alles, was überschwappt, sobald der Schild leer ist, trifft direkt die Hülle. Ein Schild kann also nie eine ganze Salve blockieren&nbsp;: Gegen einen bewaffneten Gegner steckt deine Hülle immer etwas ein, schon in der ersten Runde.</p>
            <p>Beispiel: Eine Salve von 700 Raketen, 200 Plasma und 300 Lasern durchschlägt mit 700 ÷ 7 + 200 × 4 + 300 × 2 = <strong>1.500</strong> Punkten; nur das, was diese 1.500 Punkte übersteigt, kann vom gegnerischen Schild absorbiert werden.</p>
            <p>Der Schild einer Flotte ist keine Reserve, die vor jeder Schlacht automatisch wieder auf 100&nbsp;% springt&nbsp;: Er ist eine <strong>dauerhafte Ladung</strong>, die sich im Kampf abnutzt und nur alle 3 Stunden um 10&nbsp;% wieder ansteigt, fortlaufend (30 Stunden, um von null auf voll zu kommen), auch wenn du die Flotte teilst, fusionierst oder auflöst oder Schiffe zwischen der Flotte und dem Boden des Planeten überträgst. Der Kampfbericht zeigt diese Ladung zu Beginn und am Ende der Schlacht an&nbsp;; die Flottenliste zeigt den Prozentsatz jeder Flotte, und die Seite zur Flottenverwaltung gibt den tatsächlich in den Kampf mitgenommenen Schild, die Gesamtkapazität, den aktuellen Prozentsatz und die Restzeit bis zur vollen Ladung an. Auch der Bestand an Schiffen am Boden trägt eine Ladung, die sich nicht auflädt&nbsp;: Jede von diesem Boden aus erstellte oder ergänzte Flotte erbt sie, und sie wird im Fenster zur Flottenerstellung wie im Reiter „Schiffe“ der Flottenverwaltung angezeigt.</p>
            <p>Eine Ausnahme: Der pauschale Schild, den ein <strong>Mutterschiff</strong> bringt (5.250 Punkte pro Flotte, nur einmal, auch bei mehreren Mutterschiffen), entlädt sich nie von einer Schlacht zur nächsten — er absorbiert im Kampf Treffer und ist bei der nächsten wieder voll; die Ladung nutzt nur den Schild deiner anderen Schiffe ab. Deshalb zeigt die Verwaltungsseite auch den absoluten Wert des Schilds an, nicht nur den Prozentsatz.</p>

            <h2 id="runden">Die Schussrunden</h2>
            <p>Der Kampf dauert höchstens <strong>100 Runden</strong>. In jeder Runde feuert jedes Lager eine Salve ab, die folgenden Schaden verursacht&nbsp;:</p>
            <p><code>(Raketen + Plasma ÷ 2 + Laser × 2) × Multiplikator</code></p>
            <p>Der Multiplikator stammt aus einem Präzisionswurf: Das Spiel zieht eine Zahl zwischen der Präzision des Lagers und 100 und teilt sie durch 80, für ein Ergebnis zwischen <strong>×0,3 und ×1,2</strong>. Keine Salve verfehlt. Eine hohe Präzision macht deine besten Salven nicht stärker, sie beseitigt die schlechten Würfe. Der Teil, der den gegnerischen Schild überwindet (siehe oben), wird auf die Gesamtpanzerung dieses Lagers angerechnet.</p>

            <h2 id="ende">Ende des Kampfes</h2>
            <ul>
                <li><strong>Die Panzerung eines Lagers fällt auf 0</strong> — es ist besiegt, alle seine Flotten werden mit ihrer Fracht zerstört.</li>
                <li><strong>100 Runden erreicht</strong> — das Lager, das die meiste Panzerung behält, gewinnt; bei exaktem Gleichstand gewinnt der Angreifer.</li>
                <li><strong>Netz des Siegers</strong> — selbst stark angeschlagen verliert das siegreiche Lager nie mehr als 95&nbsp;% seiner Anfangspanzerung: Ein Sieg ist nie eine Vernichtung, egal wie groß der Kräfteunterschied ist.</li>
            </ul>

            <h2 id="verluste">Deine Verluste: was du eingesteckt hast</h2>
            <p>Die Regel passt in einen Satz: <strong>Deine Verluste ergeben sich aus dem Hüllenschaden, den du tatsächlich eingesteckt hast</strong> — nie aus dem, den dein Schild absorbiert hat, der kein Schiff kostet. Dieser Hüllenschaden verteilt sich auf deinen <strong>Schirm</strong> (Jäger, Schwere Jäger, Plasmajäger: die einzigen Schiffe ohne Schild) und deine <strong>Linie</strong> (die anderen Kampfschiffe, von den Korvetten bis zu den Zerstörern), im Verhältnis zur Panzerung jeder Gruppe&nbsp;: Jeder Typ verliert denselben Bruchteil seiner selbst. Der Bericht zeigt zwei Zähler: Hüllenschaden und Schildschaden.</p>
            <p>Dein Schirm schützt deine Linie nicht unbegrenzt&nbsp;: Er lenkt höchstens die <strong>Hälfte</strong> des Schadens, der auf die Linie zielte, auf sich selbst, und nur solange ihm noch Panzerung bleibt, um ihn einzustecken — ein einziger Jäger kann nicht den Schaden einer ganzen Flotte aufsaugen. Ganz ohne Schirm steckt die Linie den gesamten Hüllenschaden ein.</p>
            <p>Deine Versorgungsschiffe (Frachter, Recycler, Barges, Sonden, Kolonisatoren, Mutterschiff) erleiden keinerlei Verluste, solange dein Lager gewinnt: Nur die Kampfschiffe stecken ein.</p>
            <p>Direkte Folgen: Trifft dich der Feind kaum, sind deine Verluste nahezu null; ein zehnmal gefährlicherer Feind kostet dich etwa zehnmal mehr — Jäger eingeschlossen. Das besiegte Lager verliert dagegen alles.</p>

            <h2 id="danach">Nach dem Kampf</h2>
            <ul>
                <li><strong>Trümmer</strong> — 40&nbsp;% der Baukosten (Niobium und Wasser) jedes zerstörten Schiffs, beider Lager, fallen in den Orbit (20&nbsp;%, wenn ein Cthulhu oder ein Alien beteiligt ist). Schiffe, die in Kriegspunkten bezahlt werden, hinterlassen keine Trümmer. Die Fracht der vernichteten Flotten kommt hinzu. Ein Recycler in der siegreichen Flotte beginnt sofort mit dem Einsammeln, wenn er Platz im Laderaum hat.</li>
                <li><strong>Kriegspunkte</strong> — der Gewinn wird auf der Signatur des besiegten Lagers berechnet: Gesamtsignatur ÷ Zahl der Flotten dieses Lagers ÷ 100 (÷ 500 gegen einen Cthulhu oder einen Alien), auf die ganze Zahl gerundet. Jede Flotte des siegreichen Lagers erhält diesen Betrag, und der Besitzer des Planeten bekommt ebenso viel, wenn seine Verteidigungsanlagen auf der Gewinnerseite standen. Das besiegte Lager erhält genau ein Fünftel dieses Satzes, berechnet auf seinen eigenen Flotten. Die politische Forschung „Kriegspunkte“ fügt 10&nbsp;% pro Stufe hinzu. Beispiel: Eine zerstörte Flotte von 100 Jägern (Signatur je 1) bringt 1 KP; ein Zerstörer (Signatur 270) etwa 3. Das Zerstören einer Flotte ohne Waffen (Frachter, Sonden, Recycler) bringt nichts.</li>
                <li><strong>Held</strong> — ein Hauptheld an Bord einer zerstörten Flotte kann vom Sieger gefangen genommen werden (Zufall, nie garantiert). Ein besiegter <strong>Nebenheld</strong> folgt einer anderen, endgültigen Regel, ohne Zufall: siehe den Artikel <em>Nebenhelden</em>.</li>
                <li><strong>Berichte</strong> — jeder Kommandant erhält die Einzelheiten (Menü <strong>Bericht</strong>, Reiter <strong>Kämpfe</strong>): Kräfte, Salven, eingesteckter Schaden, Verluste und das Schicksal jedes gefangenen oder hingerichteten Nebenhelden.</li>
                <li><strong>Und danach</strong> — die überlebenden Flotten bleiben vor Ort: Nichts schickt sie automatisch nach Hause.</li>
            </ul>

            <h2 id="tipps">Tipps</h2>
            <ul>
                <li>Halte immer einen <strong>Schirm aus Jägern</strong>: Günstig, steckt er einen Teil des Hüllenschadens anstelle deiner schweren Schiffe ein.</li>
                <li>Investiere in den <strong>Schild</strong>: Je stärker er geladen ist, desto mehr Schaden absorbiert er, bevor er deine Hülle erreicht — aber kein Schild hält eine ganze Salve auf, deine Hülle steckt immer einen Teil ein. Lass ihn zwischen zwei Schlachten wieder aufladen.</li>
                <li>Setze auf <strong>Plasma</strong>, um gegnerische Schilde schnell zu durchschlagen, auf <strong>Laser</strong> für den Hüllenschaden.</li>
                <li>Wähle die <strong>Allianzpolitik</strong> mit Blick auf die deiner Lieblingsziele: +20&nbsp;% Waffen im Angriff.</li>
            </ul>

    invasion:
        title: "Planeteninvasion"
        category: "combat"
        order: 2
        tags: "invasion,planet,soldaten,panzer,landungsschiffe,barges,eroberung,einsatz,taktik,abbrechen"
        summary: "Einen feindlichen Planeten erobern: Barges, Absetzen, Bodenkampf und taktische Aufstellungen."
        related: "raid,defense,combat_stats,spatial_combat,secondary_heroes"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Die Invasion ist ein Angriff, um einen feindlichen Planeten <strong>in Besitz zu nehmen</strong>. Deine Flotte setzt Legionäre (über Barges) ab, die sich der Garnison am Boden stellen.</p>
            <p>Das ist etwas anderes als ein <strong>Raid</strong> (der plündert, ohne den Planeten einzunehmen): Eine erfolgreiche Invasion gibt dir den ganzen Planeten.</p>
            <p>Zwei Wege, sie zu starten: die Flotte mit der Mission „Einmarschieren“ zum Planeten senden oder auf „Einmarschieren“ klicken, wenn deine Flotte bereits im Orbit des Ziels ist (der Angriff findet dann sofort statt).</p>

            <h2 id="conditions">Was du zum Invadieren brauchst</h2>
            <ul>
                <li>Auf einem Server im <strong>PvP-Modus</strong> spielen (z. B. Dominanz, Battle Royale, Search &amp; Destroy, Paid Server).</li>
                <li><strong>Barges</strong> und <strong>Legionäre</strong> an Bord der Flotte haben.</li>
                <li>Das Ziel muss ein bewohnter Planet eines anderen Spielers sein: kein Händler, kein Mitglied deiner Allianz und keine Allianz, mit der du ein Verteidigungsbündnis, einen Nichtangriffspakt oder einen Friedensvertrag hast.</li>
                <li>Das Ziel darf nicht durch den Anfängerstatus geschützt sein. Eine Invasion während deines eigenen Schutzes zu starten, lässt dich ihn verlieren (das Spiel verlangt eine Bestätigung).</li>
                <li>Deine Flotte darf nicht bereits in einen angesetzten Kampf verwickelt sein.</li>
            </ul>
            <p>Es ist nicht nötig, einer Allianz anzugehören.</p>

            <h2 id="barges">Die Rolle der Barges</h2>
            <p>Die Barges sind die Fahrzeuge, die deine Legionäre am Boden absetzen. Jede Barge transportiert <strong>1.000 Legionäre</strong>, +25&nbsp;% pro Stufe der politischen Forschung „Geplante Invasionen“ (1.250 auf Stufe 1, 1.500 auf Stufe 2…).</p>
            <p>Hast du mehr Legionäre als Plätze, <strong>bleiben die überzähligen im Orbit und kämpfen nicht</strong>. Die eingeschifften Mechs nehmen am Angriff nicht teil: Nur die Legionäre greifen am Boden an. Bei einem Misserfolg werden deine Barges <strong>vom Verteidiger gekapert</strong>.</p>

            <h2 id="annuler">Eine Invasion abbrechen</h2>
            <p>Eine zur Invasion gesendete Flotte kann in den <strong>2 Minuten</strong> nach ihrem Start zurückgerufen werden (Schaltfläche „Abbrechen“): Sie kehrt sofort zu ihrem Ausgangspunkt zurück, aber der bezahlte Treibstoff ist verloren. Nach dieser Frist findet die Invasion bei der Ankunft statt. Eine aus dem Orbit gestartete Invasion („Einmarschieren“) wird sofort aufgelöst und lässt sich nicht abbrechen.</p>

            <h2 id="orbital">Phase 1 — Kampf im Orbit (manchmal)</h2>
            <p>Zwei Situationen können dich schon vor dem Absetzen aufhalten:</p>
            <ul>
                <li>Der Zielplanet hat seinen <strong>Angriffsmodus</strong> aktiviert: Sobald du ankommst, greifen seine Geschütztürme und Schilde deine Flotte an. <strong>Verlierst du</strong>, wird deine Flotte zerstört — die Invasion endet abrupt. <strong>Gewinnst du</strong>, werden die orbitalen Verteidigungsanlagen vernichtet, und deine Flotte macht (geschwächt) weiter. Ein Planet ohne Geschütztürme verliert seine Schilde und seine Raumstation kampflos, sobald dein Raid oder deine Invasion ankommt.</li>
                <li>Der Zielplanet wird von einer <strong>bewaffneten</strong> Flotte (Schiffswaffen) des Besitzers oder eines Mitglieds seiner Allianz bewacht, die bereits im Orbit ist (eine Sonde oder ein einzelner Frachter zählen nicht): Deine Ankunft löst 5 Minuten später eine <strong>Schlacht</strong> gegen diesen Verteidiger und seine Geschütztürme zusammen aus — selbst wenn der Planet nicht im Angriffsmodus ist. Diese Schlacht wird nie gegen einen Friedens-, Pakt- oder Verteidigungsbündnispartner oder deine eigene Allianz ausgelöst, auch nicht auf einem PvE-Server: Sie folgt denselben diplomatischen Regeln wie eine normale Invasion. Sie bricht deine laufende Invasion ab&nbsp;: Gewinnst du sie, musst du eine Invasion <strong>neu starten</strong>, um tatsächlich abzusetzen — und wenn der Planet zu diesem Zeitpunkt noch bewacht ist, wird ein Klick auf „Einmarschieren“ aus dem Orbit auf dieselbe Weise <strong>verweigert</strong>&nbsp;: Aktiviere zuerst den Angriffsmodus deiner eigenen Flotte, um den Kampf zu erzwingen. Da eine Invasion immer Legionäre mitführt, ist diese Kampfbedingung auf Angreiferseite automatisch erfüllt&nbsp;: Die Schlacht wird also ausgelöst, ob deine Flotte Schiffswaffen trägt oder nicht.</li>
            </ul>
            <p><strong>Eine Falle, die du kennen solltest&nbsp;: Eine Invasionsflotte ohne Kampfschiff wird in dieser Schlacht vernichtet.</strong> Legionäre und Barges genügen, um eine Invasion starten zu lassen, aber wenn deine Flotte keine Schiffswaffe trägt, geht sie ohne Feuerkraft in diese vorbereitende Schlacht&nbsp;: Die Verteidiger vernichten sie vollständig, Barges und Legionäre eingeschlossen, noch vor dem Absetzen. Dasselbe gilt gegenüber einem Planeten im Angriffsmodus: Seine Geschütztürme zerstören eine Flotte ohne Schiffswaffe von vornherein. <strong>Eskortiere deine Invasionsflotten immer mit Kampfschiffen</strong> — siehe den Artikel <em>Raids (Plünderung)</em> für dieselbe Falle auf der Plünderungsseite.</p>

            <h2 id="combat">Phase 2 — Kampf am Boden</h2>
            <p>Der Bodenkampf läuft über <strong>höchstens 10 Runden</strong>. In jeder Runde fügt der Angreifer der Garnison ein Zehntel seiner Angriffsstärke zu, die mit einem Zehntel ihrer Verteidigungsstärke zurückschlägt.</p>
            <table>
                <thead>
                    <tr><th>Einheit</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionär</strong></td><td>Angriff (5 bis 7 pro Runde bei einer Invasion) und Verteidigung (6, +5&nbsp;% pro Stufe Stacheldraht).</td></tr>
                    <tr><td><strong>Mech</strong></td><td>Schwere Verteidigung (2.200), max. 500 pro Planet. Nimmt nicht am Angriff teil.</td></tr>
                    <tr><td><strong>Arbeiter</strong></td><td>Passive Verteidigung (je 1), <strong>nur bei einer Invasion</strong> (nicht bei einem Raid).</td></tr>
                </tbody>
            </table>
            <p><strong>Der Angreifer gewinnt nur, wenn</strong> alle Truppen des Verteidigers ausgeschaltet sind <strong>und</strong> ihm mindestens 1 Legionär lebend bleibt. Sonst <strong>gewinnt der Verteidiger durch den Geländevorteil</strong>. Einzelheiten zu den Stärken: Artikel <em>Die Truppenstärke verstehen</em>.</p>

            <h2 id="deploiement">Die taktischen Aufstellungen des Verteidigers</h2>
            <p>Der Verteidiger kann eine für dich unsichtbare <strong>taktische Aufstellung</strong> gewählt haben (nur sein eigener Bericht gibt sie an). Behalte im Kopf: Sie kann eine scheinbar schon gewonnene Lage umkehren.</p>
            <table>
                <thead>
                    <tr><th>Aufstellung</th><th>Wirkung</th><th>Reihenfolge der Verluste der Garnison</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ausgewogen</strong></td><td>Weder Bonus noch Malus.</td><td>Legionäre, dann Mechs, dann Arbeiter.</td></tr>
                    <tr><td><strong>Befestigt</strong></td><td>Der Gegenschlag der Garnison gewinnt 30&nbsp;% und verliert dann 20&nbsp;%: insgesamt <strong>+4&nbsp;%</strong> Schaden am Angreifer. Die Einheiten werden nicht schwerer zu töten.</td><td>Wie Ausgewogen.</td></tr>
                    <tr><td><strong>Guerilla</strong></td><td>Im Gegenschlag zählt jeder Arbeiter 2,5-fach (+150&nbsp;%) und jeder Legionär halb so viel (−50&nbsp;%).</td><td>Zuerst Arbeiter, dann Legionäre, dann Mechs.</td></tr>
                    <tr><td><strong>Letztes Gefecht</strong></td><td>+50&nbsp;% Gegenschlag, sobald die Garnison unter 30&nbsp;% ihrer Anfangsstärke fällt (in Einheitenzahl), bis zum Ende des Kampfes.</td><td>Legionäre, dann Arbeiter, dann Mechs.</td></tr>
                    <tr><td><strong>Verbrannte Erde</strong></td><td>Kein Bonus im Kampf. Gewinnt der Angreifer, bei einem Raid wie bei einer Invasion, werden 50&nbsp;% des auf dem Planeten verbliebenen Niobiums, Wassers und Uraniums zerstört.</td><td>Wie Ausgewogen.</td></tr>
                </tbody>
            </table>
            <p>Die Arbeiter kämpfen nur bei einer Invasion. Der Verteidiger kann seine Aufstellung jederzeit frei auf der Seite <strong>Verteidigung</strong> wechseln.</p>

            <h2 id="victoire">Wenn du die Invasion gewinnst</h2>
            <ul>
                <li><strong>Eroberung</strong> — der Planet fällt dir mit seinen Gebäuden zu. Die Arbeiter werden auf <strong>2.000</strong> zurückgesetzt. Hatte der Verteidiger Verbrannte Erde gewählt, wird die Hälfte seines Niobiums, seines Wassers und seines Uraniums vor der Eroberung zerstört.</li>
                <li><strong>Cthulhu-Planet</strong> — holst du einen von den Cthulhu eroberten Planeten zurück, wird er befreit (Gebäude auf null zurückgesetzt, Belohnung in Uranium).</li>
                <li><strong>Kein Platz mehr zum Kolonisieren?</strong> Deine kolonisierten Planeten müssen unter Terraformation + 2 bleiben, plus der Stufe der politischen Forschung „Imperium ohne Grenzen“. Darüber hinaus wird der eroberte Planet zu einer Cthulhu-Basis — oder wird auf einem Server ohne Cthulhu wieder unbewohnt: Du behältst ihn nicht, aber du erhältst deine Kriegspunkte.</li>
            </ul>
            <p>Die <strong>Produktionsschlangen</strong> folgen dem eroberten Planeten nicht&nbsp;: Schiffe wie Verteidigungsanlagen (Geschütztürme oder Truppen), die bereits bezahlt, aber noch nicht geliefert sind, gehen bei der Eroberung verloren — eine Bestellung des Besiegten wechselt nie den Besitzer. Was vor dem Angriff geliefert wurde, ist dagegen am Boden und folgt dem Planeten.</p>
            <p>Beherbergt der eroberte Planet einen gegnerischen <strong>Nebenhelden</strong>, entscheidet sich sein Schicksal sofort: Du <strong>nimmst ihn gefangen</strong>, wenn du ein Gefängnis (Stufe 1 oder höher) besitzt, sonst wird er <strong>hingerichtet</strong>. Ein Raid nimmt den Planeten dagegen nie ein und bringt daher nie einen Helden ins Spiel. Einzelheiten im Artikel <em>Nebenhelden</em>.</p>

            <h2 id="gameover">Ausschaltung des Verteidigers</h2>
            <p>Verliert der Verteidiger seinen <strong>letzten Planeten</strong>, wird er vom Server ausgeschaltet. Du erhältst alles: seine Bitcoins, seine überlebenden Flotten und seine Kriegspunkte.</p>

            <h2 id="defaite">Wenn du die Invasion verlierst</h2>
            <p>Die <strong>Barges werden vom Verteidiger gekapert</strong>. Die am Boden getöteten Legionäre sind verloren; die, die bis zur 10. Runde durchgehalten haben, und die, die mangels Platz im Orbit geblieben sind, kehren in deine Flotte zurück — ohne Barges, um sie erneut abzusetzen. Das ist eine teure Niederlage: Sondiere, bevor du invadierst.</p>

    raid:
        title: "Raids (Plünderung)"
        category: "combat"
        order: 3
        tags: "raid,pluenderung,diebstahl,ressourcen,bunker,verteidigungsfestung,landungsschiffe,barges,verbrannte erde"
        summary: "Die Ressourcen eines feindlichen Planeten plündern, ohne ihn erobern zu wollen."
        related: "invasion,defense,fleet_missions,secondary_heroes"
        body: |
            <h2 id="principe">Was ist ein Raid?</h2>
            <p>Ein Raid ist ein Bodenangriff, dessen Ziel es ist, <strong>Ressourcen zu stehlen</strong>. Du nimmst den Planeten nicht ein: Du ziehst mit Beute ab. Wichtige Folge: Ein Raid nimmt, selbst erfolgreich, nie den Planeten ein, daher wird <strong>dort nie ein Nebenheld gefangen genommen oder hingerichtet</strong>, ob du Angreifer oder Verteidiger bist.</p>
            <p>Du brauchst dieselben Mittel wie für eine Invasion: <strong>Barges</strong> und <strong>Legionäre</strong> an Bord, gegen den Planeten eines anderen Spielers, der weder in deiner Allianz ist noch mit ihr durch ein Verteidigungsbündnis, einen Nichtangriffspakt oder einen Friedensvertrag verbunden ist (siehe <em>Planeteninvasion</em>). Sende die Flotte mit der Mission „Plündern“ oder klicke auf „Plündern“, wenn sie bereits im Orbit ist. Eine Cthulhu-Basis lässt sich nicht plündern.</p>

            <h2 id="difference">Raid vs. Invasion</h2>
            <table>
                <thead>
                    <tr><th></th><th>Raid</th><th>Invasion</th></tr>
                </thead>
                <tbody>
                    <tr><td>Ziel</td><td>Niobium, Wasser, Uranium stehlen</td><td>Den Planeten in Besitz nehmen</td></tr>
                    <tr><td>Verteidiger</td><td>Legionäre + Mechs</td><td>Legionäre + Mechs + Arbeiter</td></tr>
                    <tr><td>Angriff eines Legionärs</td><td>5 bis 6 pro Runde (weniger unberechenbar)</td><td>5 bis 7 pro Runde (unberechenbarer)</td></tr>
                    <tr><td>Verlust der Barges bei Niederlage</td><td>Nein</td><td>Ja (vom Verteidiger gekapert)</td></tr>
                </tbody>
            </table>

            <h2 id="combat">Wie es abläuft</h2>
            <p>Dieselben Schritte wie bei der Invasion (eventueller Orbitalkampf, dann 10 Runden am Boden), <strong>aber die Arbeiter verteidigen nicht</strong>. Die Legionäre und Mechs des Verteidigers stehen allein.</p>
            <p><strong>Von einer Flotte im Orbit bewachter Planet</strong> — wird das Ziel von einer <strong>bewaffneten</strong> Flotte (Schiffswaffen) des Besitzers oder eines Mitglieds seiner Allianz geschützt (eine Sonde oder ein einzelner Frachter genügen nicht), löst dein Raid zuerst 5 Minuten nach deiner Ankunft eine Schlacht gegen diesen Verteidiger und die Geschütztürme des Planeten aus. Diese Schlacht wird nie gegen einen Friedens-, Pakt- oder Verteidigungsbündnispartner oder deine eigene Allianz ausgelöst, auch nicht auf einem PvE-Server. Die Plünderung findet nicht im Anschluss statt&nbsp;: Gewinnst du diese Schlacht, musst du einen Raid <strong>neu starten</strong>, um tatsächlich zu plündern — und wenn der Planet noch bewacht ist, wird auch ein Klick auf „Plündern“ aus dem Orbit <strong>verweigert</strong>&nbsp;: Aktiviere zuerst den Angriffsmodus deiner eigenen Flotte, um den Kampf zu erzwingen. Auf Angreiferseite wird diese Schlacht nur ausgelöst, wenn deine Raidflotte selbst offensiv ist — Schiffswaffen, Legionäre oder Mechs an Bord.</p>

            <h2 id="raid-nur-truppen">Ein Raid nur mit Truppen wird vernichtet</h2>
            <p>Legionäre oder Mechs mitzunehmen genügt, um diese Schlacht auszulösen — aber wenn deine Raidflotte <strong>keine Schiffswaffe</strong> trägt, geht sie ohne Feuerkraft hinein. Die Verteidiger vernichten sie vollständig, ohne ein einziges Schiff auf ihrer Seite zu verlieren. Gegenüber einem Planeten im Angriffsmodus ist es dasselbe: Seine Geschütztürme zerstören eine Flotte ohne Schiffswaffe von vornherein. <strong>Eskortiere deine Truppentransporte immer</strong>&nbsp;: Es ist die teuerste Überraschung, die dieses System für dich bereithalten kann.</p>

            <h2 id="pillage">Die Plünderung (bei einem Sieg)</h2>
            <p>Du erbeutest so viele Ressourcen, wie nach dem Kampf in deinen Laderäumen Platz bleibt: Jeder überlebende Legionär belegt einen Platz, jeder Mech 500 (eine Barge bietet 1.000 Plätze). Nimm Frachter mit, um mit einer echten Beute abzuziehen. Die Ressourcen werden in dieser Reihenfolge genommen:</p>
            <ol>
                <li>Zuerst <strong>Niobium</strong>.</li>
                <li>Dann <strong>Wasser</strong>.</li>
                <li>Schließlich <strong>Uranium</strong> (wenn Platz bleibt).</li>
            </ol>

            <h2 id="bunker">Die Verteidigungsfestung schützt einen Teil</h2>
            <p>Die <strong>Verteidigungsfestung</strong> (Bunker) des Verteidigers <strong>schützt 5&nbsp;% des maximalen Lagers pro Stufe</strong>. Beispiele:</p>
            <ul>
                <li>Verteidigungsfestung Stufe 5 → 25&nbsp;% des maximalen Lagers an Niobium und Wasser geschützt.</li>
                <li>Verteidigungsfestung Stufe 10 → 50&nbsp;% geschützt.</li>
            </ul>
            <p>Uranium wird auf dieselbe Weise geschützt: <strong>5&nbsp;% deines Uranium-Bestands pro Stufe der Verteidigungsfestung</strong> (da Uranium kein maximales Lager hat, gilt der Schutz für den aktuellen Bestand).</p>

            <h2 id="scorched">Achtung bei Verbrannter Erde</h2>
            <p>Hat der Verteidiger die <strong>taktische Aufstellung Verbrannte Erde</strong> gewählt und verliert er, wird <strong>die Hälfte von allem, was bleibt</strong>, auf dem Planeten (Niobium, Wasser, Uranium) zerstört, auch der Teil, den die Verteidigungsfestung geschützt hatte. Du ziehst mit deiner Beute ab, aber der Gegner kann nicht alles zurückholen.</p>

    nuclear:
        title: "Atomangriff"
        category: "combat"
        order: 4
        tags: "nuklear,bombe,atombombe,uranium,zerstoerung,abfangrakete"
        summary: "Die ultimative Waffe, um die Schlüsselgebäude eines Feindes zu zerstören — vorausgesetzt, er hat keine Raketenabwehr."
        related: "defense,buildings,fleet_missions"
        body: |
            <h2 id="prerequis">Was du brauchst</h2>
            <ul>
                <li>Die Forschung <strong>Bewaffnung</strong> auf Stufe 5 und ein Gebäude <strong>Nuklearbasis</strong>.</li>
                <li><strong>Uranium</strong> (sehr selten).</li>
                <li>Eine <strong>Atombombe</strong>, gefertigt auf der Seite <strong>Verteidigung</strong>: 500 Uranium und 25.000 Bitcoins, 6 Stunden pro Bombe (beschleunigt durch die Waffenfabrik und die Schwerindustrie). Ein Planet lagert höchstens so viele Bomben wie die Stufe seiner Nuklearbasis.</li>
            </ul>
            <p><strong>Den Schlag starten</strong> — wähle auf der <strong>Räumlichen Karte</strong> den feindlichen Planeten und dann „Atomrakete senden“. Das Spiel nimmt eine Bombe von einem deiner Planeten; sie kommt in <strong>30 Minuten</strong> an, egal wie weit entfernt, und lässt sich nicht abbrechen. Eine andere Galaxie anzuvisieren erfordert die Hyperraumtechnologie. Ein durch den Anfängerstatus geschützter Planet kann nicht anvisiert werden, und einen Schlag während deines eigenen Schutzes zu starten, lässt dich ihn verlieren (das Spiel verlangt eine Bestätigung).</p>

            <h2 id="degats">Was macht eine treffende Bombe?</h2>
            <p>Die Bombe <strong>zerstört eine Gebäudestufe</strong>, vorrangig der strategischsten:</p>
            <ol>
                <li><strong>Metropole</strong> — Verlust von 1 Stufe: −80.000 Arbeiter Kapazität (die über die neue Kapazität hinausgehenden verschwinden) und verringerte Arbeiterproduktion.</li>
                <li><strong>Große Stadt</strong> — Verlust von 1 Stufe: −25.000 Arbeiter Kapazität, gleiche Regel.</li>
                <li><strong>Verteidigungsfestung</strong> (Bunker) — Verlust von 1 Stufe: verringerter Plünderungsschutz und −15.000 Legionäre Kapazität.</li>
                <li><strong>Kaserne</strong> — Verlust von 1 Stufe: −5.000 Legionäre Kapazität.</li>
                <li><strong>Sklavenlager</strong> — Verlust von 1 Stufe.</li>
            </ol>
            <p>Die Bombe trifft das erste in dieser Reihenfolge vorhandene Gebäude; hat der Planet keines, richtet sie keinen Schaden an. Die Legionäre über der neuen Kapazität verschwinden ebenfalls. In jedem Fall wird die Bombe verbraucht.</p>

            <h2 id="regle">Besondere Regeln</h2>
            <ul>
                <li>Eine Bombe im Flug <strong>kann nicht von einer Flotte im Orbit abgefangen werden</strong>. Sie fliegt geradewegs auf ihr Ziel zu.</li>
                <li>Die einzige Möglichkeit, sie aufzuhalten: die <strong>Abfangrakete</strong> des Verteidigers.</li>
            </ul>

            <h2 id="anti">Die Verteidigung: die Abfangrakete</h2>
            <p>Besitzt der Zielplanet mindestens eine <strong>Abfangrakete</strong>, wird die Bombe automatisch neutralisiert:</p>
            <ul>
                <li>Die Bombe wird <strong>zerstört</strong>.</li>
                <li><strong>1 bis 3 Abfangraketen</strong> werden verbraucht (nie mehr als der Bestand).</li>
                <li>Beide Spieler erhalten einen Bericht.</li>
            </ul>
            <p>Die Abfangraketen werden auf der Seite <strong>Verteidigung</strong> gefertigt: 10.000 Niobium und 200 Uranium, je 3 Stunden (Forschung Bewaffnung Stufe 5 und Nuklearbasis). Ein Planet lagert höchstens 4 pro Stufe der Nuklearbasis.</p>
            <p>Moral: Eine strategische Basis ist immer ein paar Abfangraketen wert. Ohne sie ist sie verwundbar.</p>

    defense:
        title: "Deine Planeten verteidigen"
        category: "combat"
        order: 5
        tags: "verteidigung,soldaten,mechs,geschuetzturm,schild,grosser schild,bunker,verteidigungsfestung,orbital,taktik,aufstellung,werte,staerke,zeit,kosten"
        summary: "Die 3 Verteidigungsschichten: orbital (Geschütztürme), taktisch (Aufstellung), am Boden (Legionäre + Mechs)."
        related: "invasion,raid,buildings,combat_stats"
        body: |
            <h2 id="apercu">Die 3 Verteidigungsschichten</h2>
            <ol>
                <li><strong>Orbitale Verteidigung</strong> — Geschütztürme, Schilde, Raumstation. Fangen die Flotte ab, bevor sie landet.</li>
                <li><strong>Taktische Aufstellung</strong> — eine strategische Wahl, die den Gegenschlag deiner Truppen am Boden verändert.</li>
                <li><strong>Bodenverteidigung</strong> — Legionäre, Mechs, Arbeiter (bei Invasionen).</li>
            </ol>

            <h2 id="mode-attaque">Den Angriffsmodus deines Planeten aktivieren</h2>
            <p>Besitzt dein Planet <strong>mindestens einen Geschützturm</strong>, kannst du den <strong>Angriffsmodus</strong> aktivieren. In diesem Modus wird jede fremde Flotte, die im Orbit stationiert ist — außer Händlern, Mitgliedern deiner Allianz und durch ein Verteidigungsbündnis mit deiner verbundenen Allianzen —, 5 Minuten nach ihrer Ankunft von einem <strong>Orbitalkampf</strong> angegriffen, ob sie selbst im Angriffsmodus ist oder nicht. Ein Raid oder eine Invasion wird gleich bei der Ankunft angegriffen.</p>
            <ul>
                <li><strong>Sieg</strong>: Die feindliche Flotte wird zerstört, deine Geschütztürme verlieren denselben Bruchteil wie die Panzerung, die du verloren hast, und du kassierst <strong>Kriegspunkte</strong> in Höhe ihrer Signatur ÷ 100 (÷ 500 gegen einen Cthulhu).</li>
                <li><strong>Niederlage</strong>: Alle deine Geschütztürme, Schilde, deine Raumstation und deine gesamte Produktionsschlange der Seite Verteidigung (Legionäre, Mechs, Bomben oder Abfangraketen, die noch nicht geliefert wurden, eingeschlossen) werden vernichtet — die bereits am Boden befindlichen Truppen und deine Bestände an Bomben und Abfangraketen bleiben unversehrt; der Angriffsmodus <strong>schaltet sich automatisch ab</strong> (ein Planet ohne Geschützturm kann ihn nicht aktiv halten), und die Flotte geht zum Bodenkampf weiter, wenn es sich um einen Raid oder eine Invasion handelt. Der Angreifer erhält keine Kriegspunkte dafür, deine Verteidigungsanlagen zu zerstören.</li>
            </ul>
            <p>Ohne Geschützturm werden deine Schilde und die Raumstation <strong>ohne jeden Kampf</strong> zerstört, sobald ein feindlicher Raid oder eine feindliche Invasion ankommt.</p>
            <p>Zwei Orte, um ihn zu aktivieren: die Seite <strong>Verteidigung</strong> eines Planeten oder die Seite <strong>Planeten</strong>, die den Zustand jedes Planeten anzeigt (ein Fadenkreuz neben seinen Verteidigungsanlagen, anklickbar zum Umschalten) und <strong>„Alle aktivieren“</strong> / <strong>„Alle deaktivieren“</strong> für das ganze Imperium anbietet. Das gruppierte Umschalten überspringt Planeten ohne Geschützturm oder die bereits in einen Kampf verwickelt sind und sagt dir, wie viele übergangen wurden.</p>
            <p><strong>Achtung</strong>: Den Angriffsmodus auf einem Planeten zu aktivieren, den eine feindliche Flotte bereits überfliegt, löst den Orbitalkampf <strong>fünf Minuten später</strong> aus. Beim gruppierten Umschalten können mehrere Schlachten auf einmal starten — die Meldung sagt dir, wie viele.</p>
            <p><strong>Was der Angreifer mitbringt.</strong> Die Flotte, die deine Geschütztürme angreift, kämpft mit <strong>all ihren Boni</strong>&nbsp;: den Allianzboni ihres Kommandanten (Raketen, Laser, Plasma, Panzerung, Schild, Präzision) und den Ausrüstungsboni ihres eingeschifften Helden. Das gilt in beide Richtungen: Deine eigenen Flotten behalten ihre Boni, wenn du einen Planeten im Angriffsmodus angreifst, und die Zahlen der Orbitalberichte haben denselben Maßstab wie die der Weltraumberichte.</p>

            <h2 id="verteidigung-und-deine-flotten">Deine Verteidigungsanlagen schießen auch ohne Angriffsmodus</h2>
            <p>Der Angriffsmodus ist nicht die einzige Möglichkeit, deine Geschütztürme schießen zu lassen. Sobald eine deiner Flotten — oder eine <strong>bewaffnete</strong> Flotte eines Mitglieds deiner Allianz — im Orbit des Planeten ist, wenn dort ein Weltraumkampf ausgelöst wird, schließen sich deine Verteidigungsanlagen automatisch diesem Kampf an, Angriffsmodus aktiv oder nicht (ein Planet, der nichts zu verteidigen hat — kein Geschützturm, kein Schild, keine Raumstation — nimmt nie daran teil). Es ist dann eine <strong>einzige Schlacht</strong>: kein zweiter, getrennter Orbitalkampf dahinter. In dieser Schlacht kommt der Panzerungsbonus deiner <strong>Raumstation</strong> (+20&nbsp;%) sowohl deinen Geschütztürmen als auch deinen Schilden zugute, und die Militäraffinität deines <strong>stationierten Helden</strong> verstärkt den Schuss deiner eigenen Geschütztürme und kann Einschüchterung oder Taktiker für dein gesamtes Lager tragen, genau wie ein Flottenheld. Deine Geschütztürme zielen dort mit ihrer eigenen Präzision (mittlerer Multiplikator ×1,06, über dem, was eine Flotte erreichen kann), und sie erleiden dort <strong>echte Verluste</strong> — proportional zum eingesteckten Schaden, wenn dein Lager gewinnt, <strong>vollständig</strong> (Geschütztürme, Schilde, Raumstation, Produktionsschlange der Seite Verteidigung, Angriffsmodus abgeschaltet), wenn dein Lager fällt. Du erhältst den <strong>Kriegspunkte</strong>-Anteil deines Planeten jedes Mal, wenn dein Lager diese Schlacht gewinnt — selbst wenn du keine eigene Flotte eingesetzt hast.</p>
            <p>Folge für deine Gegner&nbsp;: Ein Planet, der von einer deiner <strong>bewaffneten</strong> Flotten (Schiffswaffen) oder einer bewaffneten Flotte eines Mitglieds deiner Allianz bewacht wird (eine Sonde oder ein einzelner Frachter zählen nicht), kann nicht ohne vorherige Schlacht geplündert oder invadiert werden, egal ob der Angreifer frisch ankommt oder aus dem Orbit auf „Plündern“/„Einmarschieren“ klickt — und diese Schlacht startet nie gegen einen Friedens-, Pakt- oder Verteidigungsbündnispartner, deine eigene Allianz oder auf einem PvE-Server.</p>
            <p>Ohne jede Flotte im Orbit und ohne Angriffsmodus schießen deine Geschütztürme nicht: Ein Raid oder eine Invasion geht direkt zum Bodenkampf über.</p>
            <p><strong>Du hast keine eigene Flotte eingesetzt&nbsp;?</strong> Du erhältst trotzdem einen eigenen Bericht, der dir sagt, ob deine Verteidigungsanlagen gehalten haben oder vernichtet wurden, mit detaillierten Geschützturmverlusten und mit deinem Anteil an Kriegspunkten, wenn du gewonnen hast&nbsp;: Du bleibst nie im Unklaren über das Schicksal deines Planeten.</p>

            <h2 id="combat-orbital">Der Orbitalkampf im Detail</h2>
            <p>Die Geschütztürme feuern im Takt der Runden (höchstens 100) auf die feindliche Flotte. Die <strong>Raumstation</strong> fügt der Panzerung aller Verteidigungsanlagen +20&nbsp;% hinzu. Die Schilde fügen der Panzerung des Planeten 50.000 (Schild) oder 600.000 (Großer Schild) Punkte hinzu: Je größer deine Gesamtpanzerung, desto kleiner der verlorene Anteil — und damit der Anteil zerstörter Geschütztürme.</p>
            <p>Deine Geschütztürme schießen <strong>schon in der ersten Runde</strong>, egal welche Flotte gegenübersteht: Der Schild eines Schiffs wehrt ihre Eröffnungssalve nie ab. Dieser Schild ist eine Reserve, die Schaden bis zu ihrer Erschöpfung einsteckt. Jede Salve durchdringt ihn von vornherein in Höhe ihrer <strong>Durchschlagskraft</strong> (Plasma ×4, Laser ×2, Raketen ÷ 7)&nbsp;; der Rest nutzt den Schild ab, und was ihn überschwappt, trifft die Hülle. Eine Verteidigung nur aus Raketenwerfern bleibt also gegenüber einer Flotte mit großem Schild im Nachteil — aber sie schießt, sie verursacht Verluste und hinterlässt Trümmer.</p>
            <p>Selbst wenn die feindliche Flotte gewinnt, schützt ihr Jägerschirm sie nicht unbegrenzt&nbsp;: Deine Geschütztürme fügen auch ihren schwereren Schiffen echte Verluste zu, im Verhältnis zum eingesteckten Schaden — im schlimmsten Fall für sie 95&nbsp;% ihrer Anfangspanzerung. Sich zu verteidigen kostet den Angreifer also immer etwas, auch wenn er gewinnt. Nach 100 Runden gewinnt das Lager, das die meiste Panzerung behält (der Angreifer bei Gleichstand).</p>
            <p>In diesem Orbitalkampf gelten weder die +20&nbsp;% der Allianzpolitik noch der Allianzbonus „planetare Verteidigung“: Sie wirken nur in den Schlachten, in denen deine Verteidigungsanlagen an der Seite einer Flotte kämpfen.</p>

            <h2 id="deploiement">Die taktische Aufstellung</h2>
            <p>Jeder Planet kann auf der Seite <strong>Verteidigung</strong> eine <strong>taktische Aufstellung</strong> wählen und sie jederzeit frei wechseln. Sie ist <strong>für den Angreifer unsichtbar</strong> — das ist deine verdeckte Karte.</p>
            <table>
                <thead>
                    <tr><th>Aufstellung</th><th>Wirkung</th><th>Reihenfolge der Verluste deiner Garnison</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Ausgewogen</strong></td><td>Weder Bonus noch Malus.</td><td>Legionäre, dann Mechs, dann Arbeiter.</td></tr>
                    <tr><td><strong>Befestigt</strong></td><td>Der Gegenschlag deiner Garnison gewinnt 30&nbsp;% und verliert dann 20&nbsp;%: insgesamt <strong>+4&nbsp;%</strong> Schaden am Angreifer. Deine Einheiten werden nicht schwerer zu töten.</td><td>Wie Ausgewogen.</td></tr>
                    <tr><td><strong>Guerilla</strong></td><td>Im Gegenschlag zählt jeder Arbeiter 2,5-fach (+150&nbsp;%) und jeder Legionär halb so viel (−50&nbsp;%).</td><td>Zuerst Arbeiter, dann Legionäre, dann Mechs.</td></tr>
                    <tr><td><strong>Letztes Gefecht</strong></td><td>+50&nbsp;% Gegenschlag, sobald deine Truppen unter 30&nbsp;% ihrer Anfangsstärke fallen (in Einheitenzahl), bis zum Ende des Kampfes.</td><td>Legionäre, dann Arbeiter, dann Mechs.</td></tr>
                    <tr><td><strong>Verbrannte Erde</strong></td><td>Kein Bonus im Kampf. Verlierst du, bei einem Raid wie bei einer Invasion, werden 50&nbsp;% deines verbliebenen Niobiums, Wassers und Uraniums zerstört, der von der Verteidigungsfestung geschützte Anteil eingeschlossen.</td><td>Wie Ausgewogen.</td></tr>
                </tbody>
            </table>
            <p>Die Arbeiter kämpfen nur bei einer Invasion.</p>

            <h2 id="combat-sol">Der Bodenkampf</h2>
            <p>Er läuft über <strong>höchstens 10 Runden</strong>. In jeder Runde fügt der Angreifer deiner Garnison ein Zehntel seiner Angriffsstärke zu, die mit einem Zehntel ihrer Verteidigungsstärke zurückschlägt. Der Angreifer gewinnt nur, wenn er deine gesamte Garnison ausschaltet und dabei mindestens einen Legionär behält. Gewinnt in 10 Runden niemand, wird <strong>der Angreifer zurückgeschlagen</strong> (Geländevorteil).</p>

            <h2 id="troupes">Die Bodeneinheiten</h2>
            <table>
                <thead>
                    <tr><th>Einheit</th><th>Aufgabe</th><th>Hinweise</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Legionäre</strong></td><td>Angriff und Verteidigung (Stärke 6 in der Verteidigung).</td><td>+5&nbsp;% Verteidigung pro Stufe Stacheldraht (bis +25&nbsp;%).</td></tr>
                    <tr><td><strong>Mechs</strong></td><td>Schwere Verteidigung (Stärke 2.200).</td><td>Max. 500 pro Planet. Unterhalt von 2 Bitcoins pro Tag am Boden, 100 eingeschifft.</td></tr>
                    <tr><td><strong>Arbeiter</strong></td><td>Passive Verteidigung (Stärke 1).</td><td>Nur gegen Invasionen, nicht gegen Raids.</td></tr>
                </tbody>
            </table>

            <h2 id="ressources-defense">Ressourcen zur Produktion deiner Verteidigungsanlagen</h2>
            <p>Wie die Raumwerft schöpft die Produktion von Verteidigungsanlagen zuerst aus den Ressourcen <strong>des Planeten</strong>, dann aus der <strong>Fracht der im Orbit stationierten Flotten</strong>. Du kannst also weiter rekrutieren, auch wenn der Bestand am Boden gering ist, solange beladene Flotten über dem Planeten sind.</p>

            <h2 id="installations">Orbitale Anlagen und Verteidigungsanlagen</h2>
            <ul>
                <li><strong>Geschütztürme</strong> — Raketenwerfer, Lasergeschütz, Schweres Lasergeschütz, Gauß-Kanone, Ionenartillerie, Plasmawerfer. Vielfältig, um verschiedene Flottentypen zu kontern (siehe die Tabelle unten).</li>
                <li><strong>Schild</strong> — +50.000 Panzerung, dauerhaft (5.000 Niobium und 5.000 Wasser, 5 Stunden Bauzeit).</li>
                <li><strong>Großer Schild</strong> — +600.000 Panzerung für <strong>12 Stunden</strong> ab seiner Aktivierung (150.000 Niobium und 150.000 Wasser bei jeder Aktivierung).</li>
                <li><strong>Raumstation</strong> — +20&nbsp;% Panzerung für Geschütztürme und Schilde (50.000 Niobium und 50.000 Wasser, 1 Stunde).</li>
            </ul>

            <h2 id="temps">Kosten und Bauzeiten</h2>
            <table>
                <thead>
                    <tr><th>Verteidigung</th><th>Kosten</th><th>Zeit pro Einheit</th><th>Panzerung</th><th>Waffen</th><th>Voraussetzungen</th></tr>
                </thead>
                <tbody>
                    <tr><td>Raketenwerfer</td><td>12 Niobium, 9 Wasser</td><td>2 Sek.</td><td>10</td><td>9 Rakete</td><td>Raketenwaffe Stufe 1</td></tr>
                    <tr><td>Lasergeschütz</td><td>13 Niobium, 12 Wasser</td><td>2,4 Sek.</td><td>15</td><td>6 Laser</td><td>Laserwaffe Stufe 1</td></tr>
                    <tr><td>Schweres Lasergeschütz</td><td>23 Niobium, 23 Wasser</td><td>4,4 Sek.</td><td>25</td><td>12 Laser</td><td>Laserwaffe Stufe 3, Waffenfabrik</td></tr>
                    <tr><td>Gauß-Kanone</td><td>50 Niobium, 25 Wasser</td><td>7,2 Sek.</td><td>50</td><td>24 Rakete</td><td>Raketenwaffe Stufe 3, Waffenfabrik</td></tr>
                    <tr><td>Ionenartillerie</td><td>30 Niobium, 45 Wasser</td><td>7,2 Sek.</td><td>50</td><td>8 Laser, 4 Plasma</td><td>Raketenwaffe Stufe 3, Laserwaffe Stufe 3, Schwerindustrie</td></tr>
                    <tr><td>Plasmawerfer</td><td>15 Niobium, 60 Wasser</td><td>7,2 Sek.</td><td>50</td><td>8 Plasma</td><td>Plasmawaffe Stufe 1, Schwerindustrie</td></tr>
                </tbody>
            </table>
            <p>Diese Zeiten werden durch die Produktionsgeschwindigkeit der Verteidigungsanlagen des Planeten geteilt: ×1, +0,4 pro Stufe <strong>Waffenfabrik</strong> und +0,6 pro Stufe <strong>Schwerindustrie</strong>. Beispiel: 1.000 Raketenwerfer brauchen 33 Minuten ohne Fabrik, weniger als 10 Minuten mit einer Waffenfabrik der Stufe 3 und einer Schwerindustrie der Stufe 2 (×3,4). Die Geschwindigkeit des Servers ändert diese Zeiten nicht. Die Produktion erfolgt Zeile für Zeile, und die Einheiten treffen nach und nach ein.</p>
            <p>Dieselbe Beschleunigung gilt für Truppen und Nuklearwaffen: Legionär 1 Sek., Mech 100 Sek., Abfangrakete 3 Std., Atombombe 6 Std. Der Schild (5 Std.) und die Raumstation (1 Std.) haben eine feste Zeit; der Große Schild ist ab seiner Aktivierung für 12 Stunden aktiv.</p>

            <h2 id="stats-defensives">Die Stärke deines Planeten lesen</h2>
            <p>Die Seite <strong>Verteidigung</strong> hat zwei Reiter. Der zweite, <strong>Verteidigungswerte</strong>, fasst zusammen, was der Planet tatsächlich wert ist: die kumulierte Panzerung, Raketen, Laser und Plasma aller deiner Geschütztürme, den Beitrag jeder Struktur, die Wirkung von Schild, Großem Schild und Raumstation auf die tatsächlich einer Flotte entgegengesetzte Panzerung und die Stärke deiner Bodenverteidigung. Es ist der schnellste Weg, den zurückliegenden Wert zu erkennen, bevor du eine neue Bauserie startest.</p>
            <p>Ein Hinweis zum Ablesen: Das Kreisdiagramm und die Balken beziehen sich auf die Panzerung <strong>der Strukturen allein</strong>. Die Schildpauschalen erscheinen getrennt bei den Modifikatoren, weil sie sonst jeden Vergleich zwischen deinen Waffen erdrücken würden.</p>

            <h2 id="bunker">Die Verteidigungsfestung gegen Plünderung</h2>
            <p>Die <strong>Verteidigungsfestung</strong> (Bunker) schützt <strong>5&nbsp;% des maximalen Lagers pro Stufe</strong> vor Raids. Eine Verteidigungsfestung der Stufe 5 bringt schon 25&nbsp;% deiner Niobium- und Wasserreserven in Sicherheit. Uranium ist in Höhe von 5&nbsp;% seines Bestands pro Stufe geschützt. Achtung: Bei der Aufstellung Verbrannte Erde wird die Hälfte dessen, was bleibt, zerstört, wenn du verlierst, geschützter Anteil eingeschlossen.</p>

            <h2 id="entretien">Achtung vor den Unterhaltskosten</h2>
            <p>Alles, was <strong>in einer Flotte</strong> ist — im Flug oder stationiert —, kostet deutlich mehr als am Boden: Ein Mech geht von 2 auf 100 Bitcoins pro Tag (×50), ein Legionär von 0,1 auf 0,6, ein Schiff von seiner Signatur ÷ 12 auf seine Signatur ÷ 2. Stelle am Boden ab, was keine Mission hat.</p>

    embargo:
        title: "Embargo und Hungersnot"
        category: "combat"
        order: 6
        tags: "embargo,hungersnot,blockade,belagerung,planet,nahrung,rationen,versorgung,signatur,schwelle"
        summary: "Einen Planeten aushungern, bevor man ihn invadiert: die Blockade, die einsetzende Hungersnot und wie man sie überlebt."
        related: "fleet_missions,spatial_combat,diplomacy,resources"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Ein <strong>Embargo</strong> ist eine planetare Belagerung. Du hältst eine große Flotte im Angriffsmodus im Orbit eines feindlichen Planeten; die Lieferungen sind unterbrochen, die Rationen gehen zur Neige, die Bevölkerung leidet. Ist der Planet geschwächt, gehst du zum Sturm über.</p>

            <h2 id="consommation">Zur Erinnerung: die Nahrung</h2>
            <p>Nur deine <strong>Arbeiter</strong> verbrauchen Rationen: 1 Ration pro Stunde für 500 Arbeiter (150.000 Arbeiter = 300 Rationen pro Stunde). Legionäre und Mechs essen nicht, sterben aber ebenfalls, wenn die Hungersnot einsetzt. Fallen deine Vorräte auf <strong>0</strong>, herrscht <strong>Hungersnot</strong>.</p>
            <p>Die Rationen werden <strong>im Laderaum transportiert</strong>: Lade welche auf einem Planeten, entlade sie anderswo, um zu versorgen. Solange eine deiner Flotten <strong>stationär</strong> (weder im Flug noch im Kampf) über deinem Planeten ist, ergänzen ihre Rationen den Speicher — und eine Belagerung zapft sie wie den Rest an: Der Laderaum ist kein Tresor.</p>

            <h2 id="famine">Die Hungersnot (ohne Embargo)</h2>
            <p>Fehlen die Rationen, folgen die Verluste in <strong>3 Phasen</strong>:</p>
            <ul>
                <li><strong>Phase 1 (0–3 Std.)</strong> — etwa 3&nbsp;% der Arbeiter pro Stunde. Zeit zum Reagieren.</li>
                <li><strong>Phase 2 (3–8 Std.)</strong> — etwa 6&nbsp;% der Arbeiter und 2&nbsp;% der Legionäre pro Stunde: Legionäre beginnen zu desertieren.</li>
                <li><strong>Phase 3 (über 8 Std. hinaus)</strong> — Zusammenbruch: etwa 11&nbsp;% der Arbeiter, 5&nbsp;% der Legionäre und 2&nbsp;% der Mechs pro Stunde.</li>
            </ul>
            <p>Eine Untergrenze von <strong>5.000 Arbeitern</strong> verhindert das völlige Verschwinden. Ohne Versorgung erreicht ein Planet sie in etwa 24 Stunden bei 50.000 Arbeitern, 30 Stunden bei 100.000, 33 Stunden bei 150.000. Sobald eine Ration in den Speicher zurückkehrt, endet die Hungersnot, und die Phasen beginnen bei null. Ein Bericht warnt dich bei jeder neuen Phase.</p>

            <h2 id="declenchement">So löst man ein Embargo aus</h2>
            <p>Ein Embargo wird automatisch aktiviert (das Spiel prüft jede Minute), wenn:</p>
            <ul>
                <li>der anvisierte Planet einem Spieler gehört (die Planeten der KIs und die Cthulhu-Basen unterliegen ihm nie);</li>
                <li>feindliche Flotten dort <strong>stationär im Orbit</strong> sind — weder im Flug noch bereits in einen angesetzten Kampf verwickelt — und im <strong>Angriffsmodus</strong> (was Schiffswaffen voraussetzt);</li>
                <li>die <strong>kumulierte thermische Signatur</strong> dieser Flotten mindestens <strong>10.000</strong> erreicht.</li>
            </ul>
            <p>Alle anwesenden feindlichen Flotten addieren sich, auch wenn sie verschiedenen Spielern gehören. Ausgeschlossen sind nur die Flotten der Allianz des Besitzers und der durch ein <strong>Verteidigungsbündnis</strong> mit ihr verbundenen Allianzen (ein Nichtangriffspakt oder ein Friedensvertrag schützt nicht) sowie die Händler. Jedes Schiff dieser Flotten zählt, Frachter und Sonden eingeschlossen; die Signatur jedes Schiffs ist in der Raumwerft angegeben.</p>
            <table>
                <thead>
                    <tr><th>Schiff</th><th>Signatur</th><th>Anzahl für 10.000</th></tr>
                </thead>
                <tbody>
                    <tr><td>Jäger</td><td>1</td><td>10.000</td></tr>
                    <tr><td>Korvette</td><td>7</td><td>1.429</td></tr>
                    <tr><td>Fregatte</td><td>20</td><td>500</td></tr>
                    <tr><td>Schlachtkreuzer</td><td>40</td><td>250</td></tr>
                    <tr><td>Kreuzer</td><td>56</td><td>179</td></tr>
                    <tr><td>Schlachtschiff</td><td>64</td><td>157</td></tr>
                    <tr><td>Zerstörer</td><td>270</td><td>38</td></tr>
                    <tr><td>Mutterschiff</td><td>4.000 (−10&nbsp;% für seine gesamte Flotte)</td><td>3</td></tr>
                </tbody>
            </table>
            <p>Ein Mutterschiff senkt die Signatur der gesamten Flotte, die es trägt, um 10&nbsp;%: 3 Mutterschiffe allein ergeben 12.000 − 10&nbsp;% = 10.800, genug für die Schwelle, aber 2 genügen nicht (7.200). Die Zahlen der Tabelle gelten für eine Flotte ohne Mutterschiff; man kann die Typen natürlich mischen.</p>
            <p>Sobald die Signatur der belagernden Flotten wieder unter 10.000 fällt (Abflug, Zerstörung oder abgeschalteter Angriffsmodus), wird die Blockade aufgehoben.</p>
            <p>Eine Raid- oder Invasionsflotte, die durch die im Artikel <em>Deine Planeten verteidigen</em> beschriebene verschmolzene Schlacht als „im Angriff“ markiert wurde, behält diese Markierung, wenn sie überlebt&nbsp;: Bleibt sie im Orbit, zählt sie in dieser Signatur wie jede andere feindliche Flotte.</p>

            <h2 id="effets">Was der belagerte Planet erleidet</h2>
            <ul>
                <li><strong>Zusätzlicher Rationenentzug</strong> jede Stunde: deine Arbeiter ÷ 7 (150.000 Arbeiter = 21.429 Rationen pro Stunde), entnommen dem Speicher, dann den Laderäumen deiner stationären Flotten.</li>
                <li><strong>Rationenproduktion</strong> um 30&nbsp;% gesenkt.</li>
                <li><strong>Niobium- und Wasserproduktion</strong> um 20&nbsp;% gesenkt.</li>
                <li><strong>Arbeitergeburten</strong> halbiert.</li>
                <li><strong>Markt gesperrt</strong>: keine automatischen Verkäufe mehr an Händler.</li>
                <li><strong>Lieferungen gesperrt</strong>: Nur deine Flotten und die der Mitglieder deiner Allianz können auf dem Planeten entladen; die anderen ziehen mit ihrer Ladung wieder ab.</li>
                <li><strong>Helden gesperrt</strong>: Es ist unmöglich, einen Helden dem Planeten zuzuweisen oder von ihm abzuziehen.</li>
            </ul>

            <h2 id="famine-embargo">Hungersnot unter Embargo: Es ist schlimmer</h2>
            <p>Fallen die Rationen <strong>während</strong> eines Embargos auf 0, gibt es keine Phasen mehr: Schon ab der ersten Stunde verliert der Planet jede Stunde <strong>8&nbsp;%</strong> seiner Arbeiter, <strong>3&nbsp;%</strong> seiner Legionäre und <strong>3&nbsp;%</strong> seiner Mechs, und der Entzug des Embargos leert weiterhin jede eintreffende Versorgung. Die Untergrenze von 5.000 Arbeitern gilt weiterhin.</p>

            <h2 id="timings">Wie lange hält man durch?</h2>
            <p>Unter Embargo, ohne Produktion und ohne Versorgung:</p>
            <table>
                <thead>
                    <tr><th>Planetenprofil</th><th>Beginn der Hungersnot</th><th>Untergrenze von 5.000 Arbeitern erreicht</th></tr>
                </thead>
                <tbody>
                    <tr><td>Klein (50.000 Arbeiter, 100.000 Rationen)</td><td>~14 Stunden</td><td>~1,7 Tage</td></tr>
                    <tr><td>Mittel (150.000 Arbeiter, 800.000 Rationen)</td><td>~1,5 Tage</td><td>~3,2 Tage</td></tr>
                    <tr><td>Festung (200.000 Arbeiter, 2.000.000 Rationen)</td><td>~2,9 Tage</td><td>~4,7 Tage</td></tr>
                </tbody>
            </table>

            <h2 id="defense">Wie du einem Embargo widerstehst</h2>
            <ul>
                <li><strong>Die belagernde Flotte zerstören</strong>, um die Blockade aufzuheben.</li>
                <li><strong>Versorgung herbeischaffen</strong> — deine Flotten und die der Mitglieder deiner Allianz können weiterhin entladen (Mission „Entladen und zurückkehren“).</li>
                <li><strong>Evakuieren</strong> — deine <em>ausgehenden</em> Flotten sind nicht gesperrt, du kannst deine Ressourcen im Notfall abziehen.</li>
                <li><strong>Agrarsilos bauen</strong> und Rationen lagern, <em>bevor</em> es schlimm wird.</li>
                <li><strong>Deine Allianz um Hilfe bitten</strong>, um die Belagerung gemeinsam zu brechen.</li>
            </ul>

            <h2 id="rapports">Die Berichte während eines Embargos</h2>
            <p>Jede Stunde erhältst du (und jeder Spieler, dessen Flotte den Planeten belagert) einen Bericht im Menü <strong>Bericht</strong>, Reiter <strong>Kämpfe</strong>: verstrichene Zeit, verbleibende Rationen, erlittene Verluste. Ein letzter Bericht verkündet die Aufhebung der Blockade. Auf der Seite <strong>Planeten</strong> zeigt die Karte jedes Planeten außerdem seine Produktion, seinen Verbrauch, den Embargo-Entzug, die Bilanz und die geschätzte Autonomie an.</p>

    combat_stats:
        title: "Die Truppenstärke verstehen"
        category: "combat"
        order: 7
        tags: "staerke,bonus,kampf,politik,berechnung,stacheldraht,praezision,mechs"
        summary: "Wie sich die Stärke deiner Einheiten vergleicht und was sie steigert."
        related: "spatial_combat,invasion,political_system"
        body: |
            <h2 id="terrestre">Stärke am Boden</h2>
            <p>Exakte Werte, ohne Boni:</p>
            <table>
                <thead>
                    <tr><th>Einheit</th><th>Stärke</th><th>Aufgabe</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Mech</strong></td><td>2.200 in der Verteidigung</td><td>Säule der Verteidigung: Ein Mech ist etwa 367 Legionäre wert. Höchstens 500 pro Planet. Er kämpft nur in der Verteidigung: In eine Flotte eingeschifft, nimmt er nicht am Angriff teil.</td></tr>
                    <tr><td><strong>Legionär (Verteidigung)</strong></td><td>6, +5&nbsp;% pro Stufe Stacheldraht</td><td>Das Herz der Garnison.</td></tr>
                    <tr><td><strong>Legionär (Angriff)</strong></td><td>5 bis 7 pro Runde bei einer Invasion, 5 bis 6 bei einem Raid (in jeder Runde zufällig gezogen)</td><td>Einzige Einheit, die am Boden angreift: Ein Raid ist etwas weniger unberechenbar als eine Invasion.</td></tr>
                    <tr><td><strong>Arbeiter (Verteidigung)</strong></td><td>1</td><td>Nur bei einer Invasion. 200.000 Arbeiter wiegen so viel wie etwa 91 Mechs.</td></tr>
                </tbody>
            </table>
            <p>In jeder Runde (höchstens 10) fügt der Angreifer der Garnison ein Zehntel seiner Angriffsstärke zu, die mit einem Zehntel ihrer Verteidigungsstärke zurückschlägt. Der Schaden tötet die Einheiten nach ihrer Stärke: Es braucht 6 Punkte für einen verteidigenden Legionär ohne Bonus, 2.200 für einen Mech, 1 für einen Arbeiter. Beispiel: 10.000 Legionäre bei einer Invasion (mittlerer Wurf von 6) verursachen etwa 6.000 Punkte pro Runde, genug, um 1.000 Legionäre ohne Bonus zu töten oder weniger als 3 Mechs.</p>
            <p>Die <strong>Barges</strong> kämpfen nicht: Sie transportieren je 1.000 Legionäre (+25&nbsp;% pro Stufe der politischen Forschung „Geplante Invasionen“).</p>

            <h2 id="bonus">Was deine Stärke erhöht</h2>
            <ul>
                <li><strong>Forschung Stacheldraht</strong> — +5&nbsp;% Verteidigung pro Stufe für deine Legionäre (5 Stufen, also höchstens +25&nbsp;%).</li>
                <li><strong>Politische Forschungen</strong> (Reiter „Politische“ der Seite Forschung) — Militärmacht (+10&nbsp;% pro Stufe auf Angriff und Verteidigung der Legionäre), Mech-Panzerung (+10&nbsp;% pro Stufe auf die Verteidigung der Mechs), Ideologische Stärkung (+20&nbsp;% pro Stufe auf die Verteidigung der Arbeiter), Geplante Invasionen (+25&nbsp;% Kapazität pro Barge und Stufe), Verbesserte Bewaffnung (+10&nbsp;% pro Stufe auf die Raketen und Laser der Schiffe), Schiffspanzerung (+10&nbsp;% Panzerung der Schiffe pro Stufe).</li>
                <li><strong>Allianzverbesserungen</strong> — im Weltraumkampf bis zu +5&nbsp;% pro Waffentyp, für Panzerung, Schild und Präzision der Schiffe und bis zu +10&nbsp;% für die planetaren Verteidigungsanlagen.</li>
                <li><strong>Taktische Aufstellung</strong> — Wahl des Verteidigers, die den Gegenschlag seiner Garnison und die Reihenfolge ihrer Verluste ändert (siehe <em>Planeteninvasion</em>).</li>
                <li><strong>Militärheld</strong> — direkter Bonus auf Angriff und Verteidigung, für den Helden der angreifenden Flotte wie für den auf dem Planeten stationierten.</li>
                <li><strong>Gegenstände</strong>, die dem Helden angelegt sind.</li>
            </ul>
            <p>Die Forschung <strong>Militärausbau</strong> gibt keinen Kampfbonus: Sie schaltet die Kaserne (Stufe 1), die Verteidigungsfestung (Stufe 3), dann die Forschungen Stacheldraht und Gepanzerte Einheiten (Mechs) frei.</p>

            <h2 id="faction">Politischer Bonus (Weltraumkämpfe)</h2>
            <p>Der Waffenbonus des Weltraumkampfs stammt aus der <strong>Politik deiner Allianz</strong>. Jedes Regime schlägt seinen Rivalen: <strong>Die Waage der Welten</strong> schlägt <strong>Das Stille Bollwerk</strong>, das <strong>Den Hammer der Sterne</strong> schlägt, der <strong>Die Waage der Welten</strong> schlägt.</p>
            <p>Schlägt die Politik des <strong>Angreifers</strong> die des Verteidigers, gewinnen alle seine Waffen (Raketen, Laser, Plasma) für diesen Kampf <strong>+20&nbsp;%</strong>. Der Bonus gilt nur für den Angreifer: Der Verteidiger verlässt sich auf seine planetaren Verteidigungsanlagen. Er gilt nur im Kampf zwischen Flotten, nicht gegen reine Geschütztürme (Orbitalkampf des Angriffsmodus) und nicht am Boden.</p>

            <h2 id="precision">Präzision und Kampfwürfe</h2>
            <p>Im Weltraumkampf feuert jedes Lager <strong>eine Salve pro Runde</strong>. Ein Zufallswurf, gezogen zwischen der Präzision des Lagers und 100 und dann durch 80 geteilt, moduliert den Schaden der Salve von <strong>×0,3 bis ×1,2</strong>. Keine Salve verfehlt: Eine hohe Präzision macht deine besten Treffer nicht stärker, sie beseitigt die schlechten Würfe.</p>
            <p>Das Zielen einer Flotte wird nie in Prozent angezeigt&nbsp;: Überall — Raumwerft, Seite zur Flottenverwaltung, Reiter Verteidigungswerte der Seite Verteidigung und Kampfberichte — zeigt das Spiel den <strong>mittleren Schadensmultiplikator</strong>, den sie erzeugt:</p>
            <ul>
                <li><strong>×0,66</strong> ohne jede Investition: Jede Salve fällt zwischen ×0,3 und ×1,2;</li>
                <li><strong>×0,94</strong> bei vollem Zielen: Jede Salve fällt zwischen ×0,63 und ×1,2;</li>
                <li><strong>×1,06</strong> für die Verteidigungsanlagen eines Planeten: Jede Salve fällt zwischen ×0,88 und ×1,2 — besser als eine Flotte mit vollem Zielen.</li>
            </ul>
            <p>Dieses Niveau hängt von den in die Präzision investierten <strong>Anpassungspunkten</strong> für jedes Schiffsmodell ab (40 Punkte/Tag) und ist ihm eigen&nbsp;: Deine Punkte anderswo auszugeben, in Panzerung oder Waffen desselben Modells, lässt es nie wieder sinken. Die Präzisionsboni von Allianz und Held kommen hinzu, ohne je das volle Zielen zu überschreiten. Kämpfen mehrere Flotten gemeinsam, verwendet das Lager den Durchschnitt ihrer Zielwerte.</p>
            <p>Gegen einen von der KI geführten Gegner (Bot) sinkt sein Zielen nie unter eine feste Untergrenze (mittlerer Multiplikator ×0,81)&nbsp;: Ein Bot, der tatsächlich investiert hat, übertrifft sie, und ein ausreichend investierter Spieler kann ihn erreichen oder übertreffen. Die Cthulhu-Horden zielen immer mit ×0,94.</p>

    reports:
        title: "Die Spielberichte"
        category: "beginner"
        order: 9
        tags: "bericht,benachrichtigung,kampf,spionage,allianz,besiedlung,reiter,loeschen,teilen"
        summary: "Das Spiel schickt dir Berichte zu jedem wichtigen Ereignis. Hier erfährst du, wo du sie findest, was sie enthalten und wie du sie verwaltest."
        related: "battle_reports,notifications,interface_guide"
        body: |
            <h2 id="ou">Wo findest du deine Berichte?</h2>
            <p>Öffne <strong>Bericht</strong> im Menü (am Handy: Schaltfläche <strong>Menü</strong>, dann <strong>Bericht</strong>). Die Zahl der neuen Berichte wird an diesem Eintrag angezeigt.</p>
            <p>Die Seite öffnet sich auf dem Reiter <strong>Alle</strong> (deine 300 neuesten Berichte). Die anderen Reiter sortieren nach Kategorie: <strong>Sonstiges</strong>, <strong>Allianz</strong>, <strong>Cthulhu</strong>, <strong>Kämpfe</strong>, <strong>Invasionen</strong>, <strong>Wirtschaft</strong> und <strong>Flotten</strong>. Ein Reiter erscheint nur, wenn er mindestens einen Bericht enthält, und zeigt die Zahl seiner ungelesenen an. Jeder ungelesene Bericht trägt den Vermerk „Ungelesen“: Tippe auf seine Zeile, um ihn zu öffnen.</p>
            <p>Die Nachrichten anderer Spieler sind nicht hier: Sie stehen unter <strong>Nachrichten</strong>.</p>
            <p>Du kannst auch die <strong>Push-Benachrichtigungen</strong> aktivieren, um auf deinem Handy oder in deinem Browser alarmiert zu werden (siehe den entsprechenden Artikel).</p>

            <h2 id="gerer">Lesen, teilen, löschen</h2>
            <ul>
                <li><strong>Als gelesen markieren</strong>: Schaltfläche eines geöffneten Berichts (ihn zu öffnen genügt ebenfalls). <strong>Alles als gelesen markieren</strong> oben auf der Seite erledigt alle deine Berichte auf einmal.</li>
                <li><strong>Freigabelink generieren</strong>: erstellt einen öffentlichen Link zu diesem Bericht; die Schaltfläche <strong>Link</strong> kopiert ihn. Jeder, der diesen Link hat, kann den Bericht lesen, auch ohne Konto.</li>
                <li><strong>Löschen</strong>: löscht den Bericht sofort, ohne Bestätigung und ohne Papierkorb.</li>
            </ul>
            <p>Das Löschen erfolgt Bericht für Bericht: Es gibt weder Archivierung noch Sammellöschung. Deine Berichte löschen sich nicht von selbst mit der Zeit.</p>

            <h2 id="combat">Kampf- und Invasionsberichte</h2>
            <p>Reiter <strong>Kämpfe</strong>:</p>
            <ul>
                <li><strong>Kampfbericht: Sieg / Niederlage</strong> — eine deiner Flotten hat eine feindliche Flotte bekämpft (Weltraumkampf).</li>
                <li><strong>Orbitalverteidigung: Sieg / Niederlage</strong> — die Verteidigungsanlagen deines Planeten haben eine feindliche Flotte bekämpft; der Angreifer erhält seinerseits <strong>Orbitalangriff: Sieg / Niederlage</strong>.</li>
                <li><strong>Planetenverteidigung: Gehalten / Vernichtet</strong> — Bericht für den Besitzer, der keine eigene Flotte in eine verschmolzene Schlacht geschickt hat: Seine Verteidigungsanlagen haben gehalten oder wurden vernichtet.</li>
                <li><strong>Nuklearrakete</strong> — deine Rakete hat ihr Ziel getroffen oder wurde abgefangen; eine Rakete hat dich getroffen oder wurde bei dir abgefangen.</li>
                <li><strong>Ihr Planet steht unter Embargo!</strong> — ein Bericht pro Stunde, solange einer deiner Planeten belagert wird, dann ein letzter Bericht, wenn das Embargo aufgehoben wird. Die Belagerer erhalten ebenfalls ihren.</li>
                <li><strong>Hungersnot auf Ihrem Planeten!</strong> — deine Rationen sind aufgebraucht, und die Hungersnot fordert Opfer.</li>
            </ul>
            <p>Reiter <strong>Invasionen</strong>:</p>
            <ul>
                <li><strong>Plünderungsbericht</strong> — erlittener oder zugefügter Raid (Sieg oder Niederlage, im Angriff oder in der Verteidigung).</li>
                <li><strong>Invasionsbericht</strong> — Versuch, einen Planeten einzunehmen, auf der einen oder anderen Seite.</li>
            </ul>

            <h2 id="cthulhu">Cthulhu-Berichte</h2>
            <ul>
                <li><strong>Alarm: Horde im Anmarsch</strong> — eine Cthulhu-Horde bewegt sich auf einen deiner Planeten zu.</li>
                <li><strong>Bericht Besessene: Erfolgreiche Verteidigung / Angriff erlitten</strong> — das Ergebnis des Angriffs einer Horde auf deinen Planeten. Bei PvE-Schwierigkeit Schwer lautet der Titel <strong>Bericht Angriff der Besessenen: Sieg / Niederlage</strong>.</li>
                <li><strong>Cthulhu Tower Defense: Sieg / Niederlage</strong> — das Ergebnis deiner aktiven Verteidigung.</li>
                <li><strong>Gegenangriffsbericht: Sieg / Niederlage</strong> — deine Invasion eines von den Cthulhu gehaltenen Planeten. Ein Sieg befreit den Planeten: Er wird wieder frei, und der Schwarm kann ihn 72 Stunden lang nicht zurückerobern.</li>
                <li><strong>Cthulhu-Blockade</strong>, <strong>Der Schwarm breitet sich aus</strong>, <strong>Ausbruch des Schwarms</strong> — die Cthulhu-Ereignisse in deinem Sektor und ihre Folgen.</li>
            </ul>

            <h2 id="flotte">Flottenberichte</h2>
            <p>Reiter <strong>Flotten</strong>:</p>
            <ul>
                <li><strong>Ihre Flotte ist angekommen</strong> — deine Flotte hat ihr Ziel erreicht.</li>
                <li><strong>Ressourcenlieferung</strong> — ein anderer Spieler hat Ressourcen auf einem deiner Planeten entladen.</li>
                <li><strong>Ihre Flotte hat das Recycling beendet!</strong> — deine Recycler haben ihre Arbeit beendet.</li>
            </ul>
            <p>Die Spionage ist im Reiter <strong>Sonstiges</strong> abgelegt: <strong>Planetenanalyse</strong> (das Ergebnis deiner Sonde) und <strong>Spionage entdeckt</strong> (jemand hat versucht, einen deiner Planeten auszuspionieren).</p>

            <h2 id="alliance">Allianzberichte</h2>
            <ul>
                <li><strong>Diplomatie</strong> — Krieg erklärt (durch deine Allianz) oder Krieg erhalten, Verteidigungsbündnis geschlossen oder gebrochen, Nichtangriffspakt geschlossen oder gebrochen, Friedensvertrag geschlossen oder abgelaufen.</li>
                <li><strong>Mitglieder</strong> — Neues Mitglied, Mitglied gegangen, Mitglied ausgeschlossen, Mitglied Game Over.</li>
            </ul>

            <h2 id="divers">Weitere Berichte</h2>
            <p>Reiter <strong>Wirtschaft</strong>:</p>
            <ul>
                <li><strong>Imperiumbericht</strong> — deine tägliche Wirtschaftsbilanz, jeden Tag um 18:59 Uhr (Pariser Zeit).</li>
                <li><strong>⚠ Bankrott droht!</strong> — deine täglichen Ausgaben übersteigen deine Einnahmen, und deine Bitcoins decken nicht mehr einen Tag Defizit (höchstens eine Warnung pro 24 Stunden).</li>
                <li><strong>Verkauf an Händler</strong> — deine Flotte hat ihre Ladung an einen Händler verkauft.</li>
                <li><strong>Anmeldebonus</strong> — die Bitcoins des Tages und an manchen Tagen ein Gegenstand.</li>
            </ul>
            <p>Reiter <strong>Sonstiges</strong>:</p>
            <ul>
                <li><strong>Planetenkolonisierung</strong> — neuer Planet gegründet.</li>
                <li><strong>Planetenanalyse</strong> und <strong>Spionage entdeckt</strong> — siehe oben.</li>
                <li><strong>Abgeschlossene Schlangen</strong> (Gebäude, Schiffe, Verteidigung, Forschung) — die Schlange ist leer: Du kannst neu starten.</li>
                <li><strong>Held und Gefängnis</strong> — Held gefangen, entkommen, befreit oder hingerichtet, Gefängnisalarm, Position enthüllt, Gegenstand gestohlen oder gefunden, neuer Held, Lösegeldforderungen.</li>
                <li><strong>Arena</strong> — erhaltene Herausforderung, Duell-Ergebnis, Turnier, Wochenbelohnung, Allianz-Arena.</li>
                <li><strong>Verschiedenes</strong> — Ende deines Anfängerschutzes, Flotte zurückgeschickt, Mondmission fehlgeschlagen.</li>
            </ul>

            <h2 id="compte-valide">Konto bestätigen</h2>
            <p>⚠️ Um einem anderen Spieler <strong>eine Nachricht oder Bitcoins zu senden</strong> und um eine Allianz zu erstellen oder ihr beizutreten, muss dein Konto <strong>bestätigt</strong> und deine <strong>E-Mail-Adresse bestätigt</strong> sein.</p>
            <p>Ein Testkonto (erstellt mit „Testen Sie ohne E-Mail“) wird über den Menüeintrag <strong>Konto bestätigen</strong> bestätigt: Dort wählst du ein Pseudonym, ein Passwort und deine E-Mail-Adresse. Anschließend wird eine Bestätigungs-E-Mail verschickt: Klicke auf ihren Link. Nicht erhalten? Öffne <strong>Optionen</strong> (unten im Menü am Computer, im Panel Menü am Handy): Der Bereich <strong>Meine E-Mail-Adresse bestätigen</strong> ermöglicht es, sie <strong>erneut zu senden</strong> (höchstens dreimal pro Stunde).</p>

    battle_reports:
        title: "Einen Kampfbericht lesen"
        category: "combat"
        order: 8
        tags: "bericht,kampf,sieg,niederlage,analyse"
        summary: "Nach jedem Kampf ein detaillierter Bericht. So entschlüsselst du ihn, um beim nächsten Mal besser zuzuschlagen."
        related: "spatial_combat,invasion,raid,reports"
        body: |
            <h2 id="ou">Wo du sie findest</h2>
            <p>Alle Kampfberichte kommen im Menü <strong>Bericht</strong> an. Der Reiter <strong>Kämpfe</strong> fasst die Weltraum- und Orbitalkämpfe, die Planetenverteidigungen, den Nuklearbereich, das Embargo und die Hungersnot zusammen; der Reiter <strong>Invasionen</strong> fasst die Raids und Invasionen zusammen; die Kämpfe gegen die Cthulhu haben ihren eigenen Reiter <strong>Cthulhu</strong>.</p>

            <h2 id="types">Typen von Kampfberichten</h2>
            <ul>
                <li><strong>Weltraumkampf</strong> — zwei Flotten sind sich begegnet.</li>
                <li><strong>Orbitalkampf</strong> — deine planetaren Verteidigungsanlagen haben eine Flotte abgefangen.</li>
                <li><strong>Planetenverteidigung</strong> — verschmolzene Schlacht, in die du keine eigene Flotte geschickt hast: Deine Geschütztürme, Schilde und deine Raumstation haben gehalten oder wurden zerstört.</li>
                <li><strong>Unbewaffnete Flotte zerstört</strong> — ein Lager ohne Schiffswaffe (Frachter, Sonden, Recycler) wurde ohne Kampf zerstört.</li>
                <li><strong>Raid</strong> — Plünderungsversuch (von deiner Seite oder gegen dich).</li>
                <li><strong>Invasion</strong> — Versuch, einen Planeten einzunehmen.</li>
                <li><strong>Nuklear</strong> — Bombe gesendet, empfangen oder abgefangen.</li>
                <li><strong>Embargo</strong> — stündlicher Bericht während einer Belagerung und ein letzter, wenn sie aufgehoben wird.</li>
                <li><strong>Hungersnot</strong> — bei jeder neuen Phase der Hungersnot gesendet (ohne Embargo).</li>
            </ul>

            <h2 id="contenu">Was ein Bericht enthält</h2>
            <ul>
                <li><strong>Beteiligte Kräfte</strong> — Anfangspanzerung, Schild, Waffen jedes Lagers und die Zusammensetzung jeder Flotte. Das Zielen steht dort nicht in Prozent, sondern als <strong>mittlerer Schadensmultiplikator</strong>, den es erzeugt (×0,66 ohne jede Investition, ×0,94 bei vollem Zielen, ×1,06 für die Verteidigungsanlagen eines Planeten): Kein Schuss verfehlt je, besseres Zielen hebt die Untergrenze deines Schadens an.</li>
                <li><strong>Salven</strong> — die Zahl der von diesem Lager abgefeuerten Salven, die auf den gegnerischen Schild gegangenen und ob sein eigener Schild durchschlagen wurde oder gehalten hat.</li>
                <li><strong>Schildladung</strong> — bei einem Flottenblock der Prozentsatz der Ladung zu Beginn und am Ende des Kampfes, mit seiner Gesamtkapazität: Dein Schild springt nicht von Kampf zu Kampf automatisch auf 100&nbsp;%, er lädt sich nach und nach wieder auf (siehe den Artikel <em>Weltraumkampf</em>).</li>
                <li><strong>Verbleibende Panzerung</strong> — was noch steht, und ihr Anteil an der Anfangspanzerung. Ein vernichtetes Lager zeigt stattdessen den <strong>Schadensüberschuss</strong>, der über seine Panzerung hinaus eingesteckt wurde: Das ist deine Siegesmarge.</li>
                <li><strong>Eingesteckter Schaden</strong> — zwei Zähler pro Lager: <strong>Hülle</strong> (was nicht vom Schild aufgehalten wurde) und <strong>Schild</strong> (was der Schild absorbiert hat). Deine Verluste ergeben sich allein aus der Hülle.</li>
                <li><strong>Verluste</strong> — Schiff für Schiff, auf jeder Seite.</li>
                <li><strong>Detaillierte planetare Verteidigungsanlagen</strong> — Verluste an Geschütztürmen, dazu dein Schild, Großer Schild und deine Raumstation, wenn du sie besitzt, mit dem Verteidigungswert und dem Tag „Angriff“ des Planeten bei einer verschmolzenen Schlacht.</li>
                <li><strong>Geplünderte Ressourcen</strong> (bei Raids) und <strong>erzeugte Trümmer</strong> — zum Recyceln!</li>
                <li><strong>Gewonnene Kriegspunkte</strong> und Endergebnis.</li>
            </ul>

            <h2 id="analyser">Wie du daraus eine Lehre ziehst</h2>
            <ul>
                <li>Sieh dir zuerst den <strong>eingesteckten Schaden</strong> an: Die Zeile „Hülle“ zählt alles, was von deinem Schild nicht aufgehalten wurde (den Teil, der ihn durchschlägt, dann alles, sobald er leer ist); die Zeile „Schild“, was dein Schild absorbiert hat — das kostet kein Schiff, nur Ladung, die alle 3 Stunden um 10&nbsp;% wieder ansteigt.</li>
                <li>Vergleiche die beiden <strong>Schadensmultiplikatoren</strong>: Das ist die einzige direkt vergleichbare Zahl zwischen den Lagern. Sieh dir dann die <strong>verbleibende Panzerung</strong> an — mit 5&nbsp;% deiner Panzerung zu gewinnen und mit 70&nbsp;% zu gewinnen, ist nicht dasselbe. Ein großer Überschuss beim Gegner bedeutet, dass du den Sieg überbezahlt hast.</li>
                <li>Verluste bei deinen <strong>Jägern</strong> sind normal, selbst wenn dein Schild hält: Ohne Schild stecken sie ihren Anteil der Hülle im Verhältnis zu ihrer Panzerung ein, dazu bis zur Hälfte der Treffer, die deinen schweren Schiffen galten — das ist ihre Rolle als Schirm.</li>
                <li>Viele <strong>auf den gegnerischen Schild gegangene Salven</strong>? Setze auf Plasma (×4 gegen Schilde), um schneller zu durchschlagen.</li>
                <li><strong>100 Runden erreicht</strong>: Das Lager, das die meiste Panzerung behält, gewinnt (der Angreifer bei Gleichstand) — passiert dir das im Angriff, fehlt es deiner Flotte an Stärke oder Präzision.</li>
                <li><strong>Behalte deine wichtigen Berichte</strong> (lösche sie nicht) und nutze „Freigabelink generieren“, um sie deiner Allianz zu zeigen: Sie dienen als Beweise in Debatten.</li>
            </ul>

    combat_simulator:
        title: "Kampfsimulator"
        category: "combat"
        order: 9
        tags: "simulator,kampf,simulation,flotte,verluste,schaetzung,bericht"
        summary: "Schätze deine Risiken vor einem Angriff: Spiele einen Kampf tausendmal gegen eine in einem Bericht beobachtete Flotte durch, mit der echten Spielengine."
        related: "spatial_combat,battle_reports,fleet_creation"
        body: |
            <h2 id="zweck">Wozu er dient</h2>
            <p>Der Reiter <strong>Kampfsimulator</strong> der Seite Flotten schätzt, was du vor einem Angriff riskierst. Er spielt <strong>1.000-mal</strong> einen Kampf zwischen einer deiner Flotten und einer gegnerischen Flotte durch, mit der <strong>echten Spielengine</strong> — dieselben Formeln, dieselben Zufallswürfe. Nichts wird tatsächlich eingesetzt: Kein Schiff bewegt sich, keines stirbt.</p>

            <h2 id="quelle">Die Quelle: ein Kampfbericht</h2>
            <p>Die gegnerische Flotte stammt aus einem deiner <strong>jüngsten Weltraumkampfberichte</strong> (die mit der Zeile „Eingesteckter Schaden“): Das sind die einzigen ehrlichen Quellen, da sie die tatsächliche Stärke des beobachteten Lagers enthalten, Boni inklusive. Der Simulator bietet dir die 30 neuesten an; Orbital-, Raid- oder Invasionsberichte dienen nicht als Quelle. Ein Spionagebericht liefert nur Schiffszahlen, ohne ihre tatsächlichen Werte — die Simulation wäre irreführend, deshalb wird er nicht angeboten.</p>
            <p>Wähle den Bericht, das Lager, dem du dich stellst (eine der beiden Armadas des Berichts), dann eine deiner bewaffneten Flotten, wo auch immer sie ist. Du simulierst immer in der Position des <strong>Angreifers</strong>, nicht bei dir zu Hause: ohne deine Geschütztürme und planetaren Schilde, mit deinen tatsächlichen Boni (Held, Allianz, Politik verglichen mit der der aktuellen Allianz des Gegners) und dem Schild, den deine Flotte <strong>im Moment</strong> hat — eine abgenutzte Flotte wird abgenutzt simuliert.</p>

            <h2 id="lesen">Das Ergebnis lesen</h2>
            <ul>
                <li><strong>Siegquote</strong> — der Anteil der 1.000 Ziehungen, in denen du gewinnst.</li>
                <li><strong>Verlustspanne pro Schiff</strong> (Minimum, Median, Maximum) — nur bei den siegreichen Ziehungen: Bei einer Niederlage wäre deine Flotte vollständig zerstört.</li>
                <li><strong>Ein Beispielablauf</strong> — eine mittlere siegreiche Ziehung, wie ein Bericht dargestellt und deutlich mit „SIMULATION“ gekennzeichnet.</li>
            </ul>

            <h2 id="grenzen">Die Grenzen, die du im Kopf behalten solltest</h2>
            <ul>
                <li>Die gegnerische Flotte ist die <strong>zum Zeitpunkt des Berichts beobachtete</strong>: Sie kann seitdem neu gebaut, verbessert oder verstärkt worden sein.</li>
                <li>Die aktiven Talente des gegnerischen Helden (Einschüchterung, Taktiker) werden nicht nachgespielt; seine passiven Boni sind bereits in den Zahlen des Berichts enthalten. Seine planetaren Verteidigungsanlagen zählen nur, wenn der Quellbericht ein Kampf bei ihm zu Hause war (so, wie sie an diesem Tag waren): Greifst du ihn zu Hause anhand eines anderswo gelieferten Berichts an, sind seine Geschütztürme nicht dabei.</li>
                <li><strong>Keine Simulation als Verteidiger</strong>: Deine Flotte ist immer der Angreifer, nicht zu Hause. Um eine Bedrohung einzuschätzen, simuliere deine Flotte gegen die feindliche Flotte deines Berichts: Deine Geschütztürme und planetaren Schilde werden darin nicht gezählt (ein echter Kampf bei dir zu Hause wird günstiger sein), aber der Feind erhält dort auch nicht die +20&nbsp;%, die er im Angriff hätte, wenn sein Regime deines schlägt.</li>
                <li>Grenze von <strong>20 Simulationen pro Tag</strong> (Zurücksetzung um Mitternacht, Pariser Zeit; der verbleibende Zähler wird angezeigt): Der Simulator erhellt eine Entscheidung, er ersetzt nicht das Risiko des Kampfes.</li>
            </ul>

    colonization:
        title: "Einen neuen Planeten besiedeln"
        category: "planet"
        order: 1
        tags: "besiedlung,kolonisierung,planet,kolonisator,terraformation,unbewohnt,obergrenze"
        summary: "Dein Imperium durch die Kolonisierung unbewohnter Planeten erweitern: Vorgehen, durch die Terraformation festgelegte Planetenobergrenze, verfügbare Größen."
        related: "planet_types,research,fleet_missions"
        body: |
            <h2 id="pourquoi">Warum kolonisieren?</h2>
            <ul>
                <li><strong>Mehr Produktion</strong>: Jeder Planet hat seine eigene Wirtschaft.</li>
                <li><strong>Mehr parallele Bauschlangen</strong>.</li>
                <li><strong>Weniger Risiko</strong>: Deine Eier liegen nicht mehr im selben Korb.</li>
                <li><strong>Strategische Positionen</strong>: Nähe zu Händlern, Verbündeten, Zielen.</li>
            </ul>

            <h2 id="etapes">So kolonisierst du</h2>
            <p>Man kolonisiert einen <strong>unbewohnten Planeten</strong>: Auf der Karte trägt er den Namen „Unbewohnt“. Ein leerer Platz „Leer“ (ohne Planet) lässt sich nicht kolonisieren.</p>
            <ol>
                <li>Prüfe, dass dir noch ein Platz bleibt: Du kannst <strong>2 Planeten + 1 pro Stufe Terraformation</strong> haben (siehe weiter unten). Du startest mit <strong>einem Kolonisator</strong> am Boden deines Planeten: Dein 2. Planet erfordert also keine Forschung.</li>
                <li>Um weitere Kolonisatoren zu fertigen, erforsche <strong>Terraformation</strong> Stufe 1. Sie werden in der Raumwerft gebaut: je 5.500 Niobium, 7.000 Wasser, 2.000 Arbeiter und 5 Legionäre.</li>
                <li>Erstelle eine Flotte, die den Kolonisator enthält (Seite <em>Flotten</em> oder Schaltfläche <em>Flotte erstellen</em> der Karte).</li>
                <li>Klicke auf der <em>Räumlichen Karte</em> auf den unbewohnten Planeten, dann auf <em>Interaktion</em>. Wähle die Flotte, die Mission <strong>Kolonisieren</strong>, dann <em>Senden</em>. Der Flug wird in Bitcoins bezahlt.</li>
            </ol>
            <p>Befindet sich deine Flotte bereits im Orbit eines unbewohnten Planeten, erscheint die Schaltfläche <em>Kolonisieren</em> direkt auf seinem Datenblatt.</p>
            <p>Der Kolonisator transportiert keine Ressourcen. Um der Kolonie zu helfen, füge der Flotte beladene Frachter hinzu und entlade sie nach der Ankunft (<em>Alles entladen</em>).</p>
            <p>Bei der Ankunft wird ein Kolonisator verbraucht, und der Planet wird unter dem Namen „Kolonie“ gegründet. Du erhältst einen Bericht, und der Planet erscheint in der Planetenauswahl der oberen Leiste. Benenne ihn auf der Seite <strong>Planeten</strong> um.</p>

            <h2 id="initial">Was sie zu Beginn hat</h2>
            <p>Ein frisch kolonisierter Planet startet mit <strong>200 Niobium, 150 Wasser, 2.500 Arbeitern und 20 Legionären</strong>. Alles andere muss gebaut werden: Ein Planet, der nie bewohnt war, hat kein Gebäude, nicht einmal eine Raumwerft.</p>

            <h2 id="limite">Wie viele Planeten maximal?</h2>
            <p>Du kannst <strong>2 Planeten + 1 pro Stufe Terraformation</strong> besitzen (höchstens 18 Stufen). Deine Monde zählen nicht.</p>
            <table>
                <thead>
                    <tr><th>Terraformation</th><th>Max. Planeten</th></tr>
                </thead>
                <tbody>
                    <tr><td>0</td><td>2</td></tr>
                    <tr><td>1</td><td>3</td></tr>
                    <tr><td>5</td><td>7</td></tr>
                    <tr><td>10</td><td>12</td></tr>
                    <tr><td>18</td><td>20</td></tr>
                </tbody>
            </table>
            <ul>
                <li>In einer Allianz mit dem Regime <em>Die Waage der Welten</em> fügt die Allianzforschung <strong>Verbreitung der Demokratie</strong> pro Stufe 1 kolonisierbaren Planeten hinzu (5 Stufen, also bis zu 25 Planeten).</li>
                <li>Bei <strong>Invasionen</strong> beträgt die Obergrenze 2 + Terraformation + die Stufe von <strong>Imperium ohne Grenzen</strong> (Allianzforschung der Regime <em>Der Hammer der Sterne</em> und <em>Das Stille Bollwerk</em>, 5 Stufen). Invadierst du darüber hinaus, wird der eroberte Planet zu einer Cthulhu-Basis, statt an dich zu fallen.</li>
                <li>In den Modi <em>Search &amp; Destroy</em>, <em>Dominanz</em> und <em>Battle Royale</em> sind alle Forschungen von Anfang an auf dem Maximum: 20 Planeten sofort.</li>
            </ul>

            <h2 id="choix">Wo kolonisieren?</h2>
            <ul>
                <li>In der Nähe eines <strong>Händlers</strong>: einfache Wirtschaft beim Senden von Frachtern.</li>
                <li>In der Nähe deiner <strong>Verbündeten</strong>: gegenseitige Verteidigung.</li>
                <li>Auf einem Planeten mit <strong>viel Gelände</strong>: Die Größe ändert nichts an der Produktion, bietet aber mehr Platz zum Bauen. Auf der Karte hat ein Planet umso mehr Gelände, je größer sein Symbol ist.</li>
                <li>Vermeide es, dich zu weit von allem zu isolieren: längere Strecken, komplizierte Versorgung.</li>
            </ul>
            <p>Es gibt <strong>keine Größenbeschränkung</strong>: Jeder unbewohnte Planet kann kolonisiert werden, klein oder groß, solange dir ein Platz bleibt. Ursprüngliche Größen der freien Planeten:</p>
            <table>
                <thead>
                    <tr><th>Wo</th><th>Gelände</th><th>Raum</th></tr>
                </thead>
                <tbody>
                    <tr><td>Systeme am Rand der Galaxie (1 bis 9, 92 bis 99 und die, die auf 0 oder 1 enden)</td><td>80 – 95 (einige mit 25)</td><td>2 – 21 (5 bei denen mit 25)</td></tr>
                    <tr><td>Systeme 45, 46, 55 und 56 (Zentrum)</td><td>140 – 190</td><td>10 – 60</td></tr>
                    <tr><td>Alle anderen Systeme</td><td>95 – 135</td><td>1 – 29</td></tr>
                </tbody>
            </table>
            <p>Die größten, in der Mitte, werden von einer massiven Alien-Horde bewacht: Ein allein gesendeter Kolonisator würde dort zerstört. Gehört dir der Planet erst einmal, fügt die Schwimmende Stadt bis zu 50 Gelände und die Orbitalstation bis zu 25 Raum hinzu (Forschung <em>Territorialerweiterung</em>, siehe <em>Einen Planeten verwalten</em>).</p>

    planet_types:
        title: "Alles, was man auf der Karte findet"
        category: "planet"
        order: 2
        tags: "planet,unbewohnt,mond,sonne,haendler,alien,truemmer,asteroid,cthulhu,besiedlung"
        summary: "Die verschiedenen auf der Galaxiekarte sichtbaren Objekte und was man mit ihnen tun kann."
        related: "colonization,galaxy_navigation,moon"
        body: |
            <h2 id="types">Die 8 Objekttypen</h2>
            <table>
                <thead>
                    <tr><th>Typ</th><th>Beschreibung</th><th>Mögliche Aktionen</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Bewohnter Planet</strong></td><td>Gehört einem Spieler (oder einem Bot), der dort baut, produziert und seine Truppen stationiert.</td><td>Sondieren, plündern, einmarschieren, Atomschlag, Flotten im Orbit angreifen.</td></tr>
                    <tr><td><strong>Unbewohnter Planet</strong></td><td>Freier Planet, auf der Karte „Unbewohnt“ genannt. Je größer sein Symbol, desto mehr Gelände hat er.</td><td><strong>Kolonisieren.</strong></td></tr>
                    <tr><td><strong>Mond</strong></td><td>Von einem Lunar auf einem leeren, trümmerreichen Platz erschaffen. Produziert 20 Rationen pro Minute.</td><td>Mit einer Flotte im Orbit plündern oder einmarschieren, Atomschlag, Flotten im Orbit angreifen. Ein Mond kann nicht sondiert werden.</td></tr>
                    <tr><td><strong>Sonne</strong></td><td>Immer auf Position 13 jedes Systems. Nicht kolonisierbar.</td><td>Keine.</td></tr>
                    <tr><td><strong>Leerer Platz</strong></td><td>Position „Leer“, ohne Planet. Nicht kolonisierbar.</td><td>Einen Mond erstellen (wenn er mindestens 2 Mio. Niobium und 2 Mio. Wasser an Trümmern trägt), ein Radar einsetzen, einen Störsender einsetzen.</td></tr>
                    <tr><td><strong>Händler</strong></td><td>NPC, den man weder plündern noch invadieren kann. Er kauft deine Ressourcen gegen Bitcoins.</td><td>Verkaufen (Mission <em>Entladen und zurückkehren</em>).</td></tr>
                    <tr><td><strong>Alien- / Cthulhu-Basis</strong></td><td>Basis des Schwarms, von einer dauerhaften Garnison verteidigt.</td><td>Einmarschieren, um sie zu befreien (Uranium, Kriegspunkte und Rückgang der Bedrohung des Universums).</td></tr>
                    <tr><td><strong>Asteroidenfeld</strong></td><td>Erscheint von allein: Niobium, Wasser oder Uranium. Lädt sich alle 7 bis 40 Stunden auf und wird oft von Aliens bewacht.</td><td>Recyceln.</td></tr>
                </tbody>
            </table>
            <p>Nach einem Kampf können auch <strong>Trümmer</strong> (Niobium und Wasser) auf jeder Position treiben, Planeten eingeschlossen: Ein Symbol zeigt sie an. Siehe den Artikel <em>Recycling</em>.</p>

            <h2 id="reperer">Sie auf der Karte erkennen</h2>
            <p>Jeder Typ hat sein Symbol, und die Größe eines Planeten auf der Karte spiegelt sein Gelände wider. Klicke (oder tippe) auf ein Objekt, um sein Datenblatt zu öffnen: Besitzer, genaues Gelände und genauer Raum (wenn die Position in der Reichweite deiner Radare liegt), eventuelle Trümmer. Die Schaltfläche <em>Interaktion</em> des Datenblatts gibt Zugang zu den Aktionen und zum Senden einer Flotte; sie erscheint, sobald du mindestens eine stehende Flotte hast.</p>

            <h2 id="lunes">Sonderfall: die Monde</h2>
            <p>Monde werden mit einem Spezialschiff erschaffen, dem <strong>Lunar</strong> (manchmal Moon Maker genannt), auf einem leeren Platz, der mindestens 2 Mio. Niobium und 2 Mio. Wasser an Trümmern trägt. Ein Mond produziert eine feste Menge von <strong>20 Rationen pro Minute</strong> (1.200 pro Stunde vor Boni): so viel wie ein Agrarfeld der Stufe 7 bis 8 auf einem Planeten. Seine Rationen bleiben auf dem Mond: Transportiere sie per Frachter zu den Planeten, denen sie fehlen. Siehe den Artikel <em>Die Monde</em>.</p>

    planet_management:
        title: "Einen Planeten verwalten"
        category: "planet"
        order: 3
        tags: "verwaltung,planet,produktion,kapazitaet,spezialisierung,gelaende,schwimmende stadt,orbitalstation,held"
        summary: "Wie du die Produktion optimierst, deinen Platz organisierst und gegebenenfalls einen Planeten spezialisierst."
        related: "buildings,resources,workers_scientists"
        body: |
            <h2 id="basiques">Die Grundlagen, die du beherrschen solltest</h2>
            <ul>
                <li><strong>Produktionsstufen</strong>: Baue die Niobium-Mine, den Wasserextraktor und das Agrarfeld regelmäßig aus.</li>
                <li><strong>Lagerung</strong>: Ohne ausreichende Lager (Niobium-Lager, Wasserreservoir, Agrarsilo) läuft die Produktion über und stoppt.</li>
                <li><strong>Bevölkerung</strong>: Die Große Stadt (+25.000 maximale Arbeiter pro Stufe) und die Metropole (+80.000) erhöhen deine Arbeiter-Obergrenze und ihre Zuwanderungsgeschwindigkeit; das Sklavenlager fügt 2.500 Plätze pro Stufe hinzu.</li>
                <li><strong>Minimale Verteidigung</strong>: Eine Verteidigungsfestung und einige Mechs sind die Basis.</li>
            </ul>

            <h2 id="optimiser">Einen Planeten optimieren</h2>
            <ol>
                <li>Baue Produktionsgebäude <strong>paarweise</strong> (Mine und Extraktor steigen oft zusammen).</li>
                <li>Platzmangel? Erforsche <strong>Territorialerweiterung</strong> (verfügbar nach Terraformation Stufe 18) und baue dann:
                    <ul>
                        <li>die <strong>Schwimmende Stadt</strong> (Stufe 1 der Territorialerweiterung): +10 Gelände pro Stufe;</li>
                        <li>die <strong>Orbitalstation</strong> (Stufe 2): +5 Raum pro Stufe.</li>
                    </ul>
                    Jede steigt bis Stufe 5 und wird in Kriegspunkten bezahlt: 2.000 × die angestrebte Stufe (30.000 Kriegspunkte für die 5 Stufen). Sonst zerstöre ein unnütz gewordenes Gebäude.</li>
                <li>Behalte die <strong>Nahrungsautonomie</strong> im Auge. Nur die Arbeiter essen, mit 1 Ration pro Stunde für 500 Arbeiter. Eine Stufe Agrarfeld ernährt 81.000, eine Stufe Aeroponische Farm 111.000.</li>
                <li>Ein <strong>Mond</strong> produziert 1.200 Rationen pro Stunde. Transportiere sie per Frachter zu deinen Planeten oder lass eine mit Rationen beladene Flotte im Orbit: Der Planet bedient sich daraus, wenn sein Speicher leer ist.</li>
            </ol>

            <h2 id="specialiser">Seine Planeten spezialisieren</h2>
            <p>Mehrere Planeten = die Möglichkeit, sie nach Position und Gebäuden zu spezialisieren:</p>
            <ul>
                <li><strong>Wirtschaftsplanet</strong>: viele Minen, Arbeiter, Verkauf an nahe Händler.</li>
                <li><strong>Militärplanet</strong>: Raumwerft, Waffenfabrik, Schwerindustrie, große Verteidigung, um dort deine Flotte zu stationieren.</li>
                <li><strong>Forschungsplanet</strong>: hoch ausgebautes Forschungszentrum, um viele Wissenschaftler zu beherbergen (siehe <em>Arbeiter und Wissenschaftler</em> für ihre tatsächliche Wirkung auf die Forschungsgeschwindigkeit).</li>
                <li><strong>Grenzaußenposten</strong>: Weltraumradar, Radarstörsender, Sonden, Geschütztürme. Dient dazu, einen Nachbarn zu überwachen oder einzudämmen.</li>
            </ul>

            <h2 id="capitale">Wohin geht dein Held, wenn er seinen Platz verliert?</h2>
            <p>Es gibt keinen Hauptstadtplaneten. Ein Held wird nie zerstört. Wird seine Flotte vernichtet oder sein Planet verloren, kann er von einem Spieler, der ein Gefängnis besitzt, <strong>gefangen genommen</strong> werden: 20&nbsp;% Risiko im Weltraumkampf, 35&nbsp;% bei einer Invasion.</p>
            <p>Sonst schließt er sich automatisch <strong>dem ältesten deiner Planeten oder Monde an, der noch keinen Helden hat</strong>. Gibt es keinen, schickt dein Hauptheld einen Nebenhelden aus der Reserve, der seinen Platz einnimmt.</p>

    planet_abandon:
        title: "Einen Planeten aufgeben"
        category: "planet"
        order: 4
        tags: "aufgabe,planet,aufgeben,loeschen,game over"
        summary: "Wann es eine gute Idee ist, wie es geht und warum du in manchen Fällen darauf verzichten solltest."
        related: "colonization,game_over,planet_management"
        body: |
            <h2 id="pourquoi">Warum einen Planeten aufgeben?</h2>
            <ul>
                <li>Er ist <strong>zu stark Angriffen ausgesetzt</strong> und kostet dich mehr, als er einbringt.</li>
                <li>Er liegt <strong>ungünstig</strong> (weit von allem entfernt, schwer zu verteidigen).</li>
                <li>Du willst <strong>einen besseren kolonisieren</strong>, hast aber die Planetengrenze erreicht.</li>
            </ul>

            <h2 id="comment">So geht's</h2>
            <p>Gehe auf die Seite <strong>Planeten</strong>: Der Link <strong>Aufgeben</strong> steht neben den Koordinaten des Planeten. Das Spiel fragt dich „Möchten Sie den Planeten aufgeben?“; sobald du <em>Aufgeben</em> bestätigt hast, ist die Aufgabe <strong>sofort und endgültig</strong>.</p>
            <p>Der Link erscheint nur, wenn die Aufgabe möglich ist:</p>
            <ul>
                <li>Dir bleibt mindestens ein anderer Planet (Monde zählen nicht);</li>
                <li>es ist kein Mond: Ein Mond kann nie aufgegeben werden;</li>
                <li>keine fremde Flotte im Angriffsmodus ist zu ihm unterwegs oder in seinem Orbit stationiert.</li>
            </ul>
            <p>Bevor du ihn aufgibst, <strong>bring Ressourcen, Legionäre, Mechs und Schiffe am Boden</strong> auf einen anderen Planeten: Alles, was zurückbleibt, geht verloren. Ein auf dem Planeten stationierter Held wird automatisch auf einen anderen deiner Planeten oder Monde verlegt, auf dem noch kein Held ist.</p>
            <p>Was aus dem Planeten wird:</p>
            <ul>
                <li>Auf einem Server ohne Cthulhu-Schwarm wird er wieder ein unbewohnter, dem Erdboden gleichgemachter Planet: Ihm bleiben nur eine Raumwerft und ein Bodenradar der Stufe 1;</li>
                <li>auf einem Server mit dem Schwarm wird ein kleiner Planet, der in seiner ursprünglichen Größe geblieben ist (25 Gelände, 5 Raum), einfach freigegeben, Gebäude inklusive; jeder andere Planet wird zu einer <strong>Alien-Basis</strong>.</li>
            </ul>
            <p><strong>Kann man das rückgängig machen?</strong> Nein: Es gibt weder eine Frist noch ein Zurück. Um den Planeten wiederzubekommen, musst du ihn zurückerobern. Ist er wieder frei, kolonisiere ihn neu (du brauchst einen Kolonisator und einen freien Platz). Ist er zu einer Alien-Basis geworden, überfalle ihn, um ihn zu befreien, und kolonisiere ihn dann neu.</p>

            <h2 id="danger">Und mein letzter Planet?</h2>
            <p>Den kannst du nicht aufgeben: Solange dir nur ein Planet bleibt, verweigert das Spiel es (deine Monde zählen nicht). Dagegen führt der <strong>Verlust</strong> deines letzten Planeten, zum Beispiel nach einer Invasion, zum <strong>Game Over</strong>: siehe den Artikel <em>Game Over</em>.</p>

    galaxy_navigation:
        title: "Durch die Galaxie navigieren"
        category: "planet"
        order: 5
        tags: "galaxie,sektor,navigation,karte,sternenkarte,universum,koordinaten,system,haendler,hyperraum"
        summary: "Wie das Universum aufgebaut ist, wie du eine Koordinate liest und wie du die Karte benutzt."
        related: "fleet_movement,colonization,planet_types"
        body: |
            <h2 id="structure">Wie das Universum organisiert ist</h2>
            <p>Das Universum ist eine Hierarchie:</p>
            <ul>
                <li>Das <strong>Universum</strong> eines Servers enthält eine oder mehrere <strong>Galaxien</strong>: Eine neue Galaxie kommt automatisch hinzu, wenn die freien Startplaneten knapp werden, bis zu 32. Der Reiter <strong>Universum</strong> der Räumlichen Karte zeigt, wie viele es gibt. Im Battle Royale gibt es nur eine.</li>
                <li>Jede <strong>Galaxie</strong> enthält 100 <strong>Sektoren</strong> (10×10-Raster, zeilenweise von 1 bis 100 nummeriert). Die Räumliche Karte nennt sie „Systeme“.</li>
                <li>Jeder <strong>Sektor</strong> enthält 25 <strong>Positionen</strong> (5×5-Raster).</li>
            </ul>
            <p>Jede Position kann einen Planeten (bewohnt oder nicht), einen Händler, eine Alien-Basis, ein Trümmerfeld, einen Mond enthalten oder leer sein. Position 13 in der Mitte des Sektors ist immer eine Sonne. Die Händler befinden sich in 20 festen Sektoren jeder Galaxie: 1, 10, 91, 100, 12, 19, 82, 89, 23, 28, 73, 78, 34, 37, 64, 67, 45, 46, 55 und 56.</p>

            <h2 id="coordonnees">Eine Koordinate lesen</h2>
            <p>Format: <strong>Galaxie:Sektor:Position</strong>, zum Beispiel <code>1:5:12</code>:</p>
            <ul>
                <li><strong>1</strong> — erste Galaxie;</li>
                <li><strong>5</strong> — fünfter Sektor dieser Galaxie (in der ersten Zeile des Rasters);</li>
                <li><strong>12</strong> — zwölfte Position in diesem Sektor.</li>
            </ul>

            <h2 id="carte">Die Karte benutzen</h2>
            <p>Die Seite <strong>Sternenkarte</strong> (linkes Menü) zeigt dir die Raumansicht. Du kannst:</p>
            <ul>
                <li>Dich zwischen Galaxien und Sektoren bewegen.</li>
                <li>Auf eine Position klicken, um zu sehen, was dort ist.</li>
                <li><strong>Direkt eine Flotte senden</strong>: Klicke auf das Feld, dann auf <strong>Interaktion</strong> (der Button erscheint, sobald mindestens eine deiner Flotten stillsteht), wähle die Flotte und die Mission und klicke auf <strong>Senden</strong>. Dasselbe Panel bietet je nach Feld Schnellaktionen an: <em>Planeten sondieren</em>, <em>Planeten kolonisieren</em>, <em>Radar einsetzen</em> oder <em>Störsender einsetzen</em>, <em>Atomrakete senden</em>.</li>
                <li>Die Positionen von Verbündeten, Feinden und Händlern sehen (je nach deinen Beziehungen und deinem Radar).</li>
            </ul>
            <p>Die <strong>Flotten im Transit</strong> erscheinen als kleine animierte Schiffe, die in Echtzeit zwischen Herkunftsplanet und Ziel gleiten. Der <strong>farbige Halo</strong> zeigt die Seite: <strong>blau</strong> = du, <strong>grün</strong> = Allianz und Verbündete, <strong>grau</strong> = Pakt/Frieden, <strong>magenta</strong> = Händler, <strong>violett</strong> = Alien, <strong>rot</strong> = Feind. Die <strong>Größe</strong> spiegelt die Signatur der Flotte wider. Deine Flotten und die deiner Allianz sind immer sichtbar; die anderen erscheinen nur, wenn dein <strong>Radar</strong> den Sektor abdeckt. Bei einem Langstreckenflug durch mehrere Sektoren erscheint das kleine Schiff nur im letzten Bruchteil der Strecke — beim Einflug in den Zielsektor —, nicht während der gesamten Reise.</p>

            <h2 id="hyperespace">Reisen zwischen Galaxien</h2>
            <p>Um von einer Galaxie in eine andere zu gelangen, brauchst du die Forschung <strong>Hyperraumtechnologie</strong>. Die Entfernung beträgt immer 18 (ungefähr 6 Sektoren: weniger als eine Durchquerung einer Galaxie), aber der Treibstoff ist teuer: die Signatur der Flotte geteilt durch 8, in Bitcoins (125 Bitcoins für 1.000 Jäger). Details unter <em>Bewegung und Entfernung</em>.</p>

    radar_jammer:
        title: "Radar und Störsender"
        category: "planet"
        order: 6
        tags: "radar,stoersender,jammer,erkennung,ueberwachung,scanner,systemscanner"
        summary: "Sehen, was sich in einem Sektor bewegt, und deine Planeten vor feindlichen Radaren verbergen."
        related: "buildings,espionage,fleet_missions"
        body: |
            <h2 id="principe">Radar vs. Störsender</h2>
            <ul>
                <li><strong>Radar</strong> — zeigt dir den Sektor, in dem es steht: die Planeten und die Flotten in Bewegung, noch vor ihrer Ankunft.</li>
                <li><strong>Störsender</strong> — verbirgt <strong>einen Planeten</strong> vor feindlichen Radaren, die nicht stärker sind als er: seine Informationen, die Signatur der Flotten, die dorthin fliegen, und Herkunft oder Ziel der Flotten, die von dort starten oder dorthin unterwegs sind.</li>
            </ul>

            <h2 id="detection">Die verfügbaren Radare</h2>
            <table>
                <tr><th>Typ</th><th>Wo</th><th>Funktion</th></tr>
                <tr><td><strong>Bodenradar</strong> (Gebäude)</td><td>Auf dem Planeten (Bodenplatz)</td><td>+1 Radarstärke pro Stufe. Voraussetzung: Systemscanner Stufe 1.</td></tr>
                <tr><td><strong>Weltraumradar</strong> (Gebäude)</td><td>Auf dem Planeten (Weltraumplatz)</td><td>Gleiche Wirkung, +1 pro Stufe: nützlich, wenn dir der Platz am Boden fehlt. Voraussetzung: Systemscanner Stufe 3.</td></tr>
                <tr><td><strong>Radarschiff</strong></td><td>Auf einem leeren Feld eingesetzt</td><td>Installiert für 2&nbsp;Std. ein Radar der Stärke 1: praktisch, um einen Sektor zu überwachen, in dem du keinen Planeten hast.</td></tr>
            </table>
            <p>Ein Radar deckt den ganzen Sektor ab, in dem es steht, und nur diesen. Die Stufen der beiden Gebäude auf demselben Planeten addieren sich; in einem Sektor zählt der beste Planet (deiner, der eines Mitglieds deiner Allianz oder der eines Verbündeten). Ein auf dem Planeten stationierter Entdecker-Held verstärkt sein Radar: +1 ab Stufe 5 (Eigenschaft Späher), insgesamt +3 ab Stufe 15 (zusätzlich die Eigenschaft Kartograf).</p>
            <p>Das Spiel warnt dich per Benachrichtigung, wenn eine feindliche Flotte auf deinen Planeten zufliegt, egal ob du ein Radar hast oder nicht; das Radar dient dazu, die Flotten und Planeten des Sektors zu <em>sehen</em>.</p>

            <h2 id="brouillage">Die verfügbaren Störsender</h2>
            <table>
                <tr><th>Typ</th><th>Wo</th><th>Funktion</th></tr>
                <tr><td><strong>Radarstörsender</strong> (Gebäude)</td><td>Auf dem Planeten (Weltraumplatz)</td><td>+1 Störstärke pro Stufe. Solange er das feindliche Radar des Sektors erreicht oder übertrifft, ist der Planet für diesen Feind verborgen. Voraussetzung: Systemscanner Stufe 5.</td></tr>
                <tr><td><strong>Störsenderschiff</strong></td><td>Auf einem leeren Feld eingesetzt</td><td>Installiert für 1&nbsp;Std. einen Störsender der Stärke 1 auf diesem Feld. Es schützt keine Flotte im Flug.</td></tr>
            </table>
            <p>Beispiel: Dein Planet hat einen Radarstörsender Stufe 3. Ein Feind, dessen bestes Radar im Sektor Stufe 3 hat, sieht ihn nicht; mit einem Radar der Stufe 4 sieht er ihn.</p>

            <h2 id="bodenschiffe">Schiffe am Boden sehen</h2>
            <p>Die <strong>Bodensignatur</strong> — die auf einem Planeten stationierten Schiffe — folgt einer etwas lockereren Regel: Eine deiner Flotten <strong>im Orbit</strong> zählt sie auf Sicht mit, auch ohne Radar. Aber nur für diesen einen Planeten.</p>
            <p>Das <strong>Radar</strong> bleibt das, was dir diese Anzeige <strong>aus der Ferne</strong> liefert, über den ganzen Sektor. Und ein <strong>Radarstörsender</strong> auf dem Planeten schließt die Beobachtung wieder: Ohne ein Radar, das stärker ist als der Störsender, wird die Bodensignatur wieder unsichtbar, selbst mit einer Flotte darüber.</p>

            <h2 id="strategie">So nutzt du sie</h2>
            <ul>
                <li><strong>Radar</strong> auf jedem Planeten: mindestens das Bodenradar, um zu sehen, was sich in deinem Sektor bewegt.</li>
                <li><strong>Radarstörsender</strong> auf deinen gefährdeten Planeten: Bei gleicher oder höherer Stufe als das gegnerische Radar werden sie für den Gegner unlesbar.</li>
                <li><strong>Setze</strong> ein Radarschiff auf einem leeren Feld im Sektor deines Nachbarn ein (Aktion „Radar einsetzen“ der Räumlichen Karte oder Mission „Radarschiff“): Du siehst diesen Sektor 2&nbsp;Std. lang.</li>
                <li>Die Forschung <strong>Systemscanner</strong> schaltet die Radare frei (Stufe 1: Bodenradar; Stufe 3: Weltraumradar und Radarschiff; Stufe 5: Radarstörsender und Störsenderschiff). Sie erhöht nicht ihre Stärke.</li>
            </ul>

    moon:
        title: "Die Monde"
        category: "planet"
        order: 7
        tags: "mond,lunar,moonmaker,nahrung,rationen,produktion"
        summary: "Ein Mond produziert 1.200 Rationen pro Stunde, ohne Gelände zu belegen. Wie du einen mit einem Lunar erschaffst, seine Größe und seine Grenzen."
        related: "planet_types,fleet_missions,ship_types"
        body: |
            <h2 id="cest-quoi">Was ist ein Mond?</h2>
            <p>Ein <strong>Mond</strong> ist ein besonderer Himmelskörper, der von einem <strong>Lunar</strong>-Schiff erschaffen wird (manchmal auch Moon Maker genannt). Er produziert weder Niobium noch Wasser, sondern eine feste Menge von <strong>20 Rationen pro Minute</strong>, also 1.200 pro Stunde vor Boni (1.440 in einer Allianz). Das entspricht einem Agrarfeld der Stufe 7 bis 8 auf einem Planeten, ohne das kleinste Stück Gelände zu belegen. Diese Produktion lässt sich nicht steigern: Auf einem Mond baut man keine Farm.</p>
            <p>Ein Mond nimmt auch <strong>Arbeiter</strong> auf (20.000 ab seiner Erschaffung, bis zu 200.000), die wie überall Bitcoins einbringen. Du kannst dort die meisten Gebäude bauen (Große Stadt, Forschungszentrum, Lager, Kaserne, Raumwerft …), aber keine Mine, keinen Extraktor und kein Agrarfeld.</p>
            <p>Nur die Arbeiter verbrauchen Rationen, und zwar 1 pro Stunde für 500 Arbeiter: Die 1.200 Rationen eines Mondes ernähren also 600.000 Arbeiter. Diese Rationen bleiben auf dem Mond: Transportiere sie per Cargo zu deinen Planeten oder lass eine mit Rationen beladene Flotte im Orbit eines Planeten, die sich dort bedient, wenn sein Speicher leer ist.</p>

            <h2 id="creation">So erschaffst du einen Mond</h2>
            <p>Ein Mond entsteht aus einem <strong>Trümmerfeld</strong>: Du brauchst einen <strong>leeren Platz</strong> mit mindestens <strong>2M Niobium UND 2M Wasser</strong> an Trümmern (hinterlassen von einer Weltraumschlacht an dieser Stelle). Die Mission <em>Mond erstellen</em> wird auf der Karte nur angeboten, wenn der Platz diese Bedingung erfüllt.</p>
            <ol>
                <li>Baue einen <strong>Lunar</strong> in der Raumwerft. Du brauchst die Forschung Terraformation Stufe 15 und eine Schwerindustrie auf dem Planeten. Er kostet 50.000 Niobium, 23.000 Wasser, 20.000 Arbeiter und 200.000 Bitcoins, bei 5&nbsp;Std. Grundbauzeit.</li>
                <li>Schicke ihn mit der Mission <strong>Mond erstellen</strong> zum leeren Platz: Klicke auf der <em>Räumlichen Karte</em> auf den Platz, dann auf <em>Interaktion</em>, wähle die Flotte und die Mission und dann <em>Senden</em>. Ist die Flotte schon vor Ort, erscheint der Button <em>Mond erstellen</em> auf ihrer Karte.</li>
                <li>Bei der Ankunft wird ein Lunar verbraucht, der Mond wird erschaffen und <strong>alle Trümmer werden verbraucht</strong>. Sind die Bedingungen nicht mehr erfüllt (Trümmer während des Flugs recycelt, Position besetzt …), erklärt dir ein Bericht das Scheitern.</li>
            </ol>
            <p>Der Lunar ist das langsamste Schiff des Spiels, und sein Unterhalt ist hoch: 5.000 Bitcoins pro Tag, solange er in einer Flotte ist, 833, wenn er am Boden bleibt. Stelle ihn erst im letzten Moment in eine Flotte.</p>

            <h2 id="groesse">Größe des Mondes</h2>
            <p>Je reicher das Trümmerfeld, desto größer der Mond. Die Stufe wird von der <strong>geringeren</strong> der beiden Ressourcen bestimmt:</p>
            <table>
                <thead>
                    <tr><th>Trümmer (min. Niobium/Wasser)</th><th>Gelände</th><th>Weltraum</th></tr>
                </thead>
                <tbody>
                    <tr><td>2M – 8M</td><td>100 – 150</td><td>10 – 25</td></tr>
                    <tr><td>8M – 15M</td><td>150 – 190</td><td>8 – 23</td></tr>
                    <tr><td>15M – 25M</td><td>190 – 230</td><td>6 – 21</td></tr>
                    <tr><td>25M – 50M</td><td>230 – 280</td><td>4 – 19</td></tr>
                    <tr><td>50M und mehr</td><td>280 – 350</td><td>15 – 50</td></tr>
                </tbody>
            </table>
            <p>Die Werte werden zufällig innerhalb der Spanne gezogen. Beispiel: Ein Feld mit 12M Niobium und 6M Wasser ergibt einen Mond mit 100 bis 150 Gelände, denn das Wasser (6M) bestimmt die Stufe. Ein Mond ist oft größer als ein Planet, dessen ursprüngliches Gelände zwischen 25 und 190 liegt.</p>

            <h2 id="limitations">Grenzen</h2>
            <ul>
                <li>Ein Mond produziert weder Niobium noch Wasser: nur Rationen und Arbeiter.</li>
                <li>Er kann angegriffen, geplündert und (von einer Flotte im Orbit) überfallen werden, aber er kann nicht sondiert werden.</li>
                <li>Er zählt weder für deine Planetengrenze noch für die Grenze von 4 Planeten des Anfängerschutzes.</li>
                <li>Ein Mond kann nie aufgegeben werden.</li>
                <li>Einen Mond in deiner Nähe zu bauen ist sicherer (weniger feindlichen Nachbarn ausgesetzt).</li>
            </ul>

            <h2 id="strategie">Wann du einen anlegen solltest</h2>
            <ul>
                <li>Deine dicht bevölkerten Planeten haben zu wenig Rationen: Ein naher Mond liefert dir 1.200 pro Stunde, per Cargo zu transportieren oder an Bord einer Flotte im Orbit des Planeten zu lassen.</li>
                <li>Eine große Schlacht hat ein <strong>reiches Trümmerfeld</strong> auf einem leeren Platz in deiner Nähe hinterlassen: Statt alles zu recyceln, verwandle es in einen Mond.</li>
                <li>Du bist gut etabliert, hast Ressourcen übrig und willst deine Wirtschaft festigen.</li>
            </ul>

    alliance_basics:
        title: "Eine Allianz gründen und beitreten"
        category: "alliance"
        order: 1
        tags: "allianz,gruendung,beitreten,einladung,bonus,regime,politik,stufe,mitglieder"
        summary: "Einer Allianz auf Einladung beitreten oder deine eigene gründen, ihr politisches Regime wählen und ihre Stufe erhöhen, um mehr Mitglieder aufzunehmen."
        related: "alliance_grades,diplomacy,political_system"
        body: |
            <h2 id="pourquoi">Warum einer Allianz beitreten?</h2>
            <ul>
                <li><strong>+20&nbsp;% Produktion</strong> von Niobium, Wasser und Rationen, sobald du in die Allianz eintrittst.</li>
                <li>Die <strong>7 politischen Forschungen</strong> des Regimes deiner Allianz (wirtschaftliche, militärische oder defensive Boni), die du selbst auf der Seite <strong>Forschung</strong> startest.</li>
                <li>Die <strong>Allianzverbesserungen</strong> (16 kollektive Boni) und die <strong>Bauhilfe</strong>.</li>
                <li>Eine <strong>gemeinsame Kasse</strong> in Bitcoins und Kriegspunkten.</li>
                <li>Die <strong>Diplomatie</strong> (Kriege, Frieden, Pakte, Verteidigungsbündnisse), ein <strong>Salon</strong>, der den Mitgliedern vorbehalten ist, und die <strong>Allianz-Arena</strong>.</li>
            </ul>
            <p>Klartext: Alleine zu spielen ist am Anfang machbar. Aber sobald das Spiel ernst wird, vervielfacht eine Allianz deine Chancen, voranzukommen.</p>

            <h2 id="rejoindre">So trittst du bei</h2>
            <ol>
                <li>Suche dir eine Allianz: die Allianz-Rangliste („Allianz-Rangliste“), die Karte einer Allianz, der Universum-Salon.</li>
                <li>Kontaktiere eines ihrer Mitglieder (private Nachricht, Salon). Im Spiel gibt es keine Bewerbung: <strong>Die Allianz lädt dich ein</strong>.</li>
                <li>Ein Mitglied mit der Berechtigung <strong>Rekrutieren</strong> schickt dir eine Einladung über den Reiter <strong>Ein Mitglied hinzufügen</strong> seiner Allianzseite. Dort sieht es die Spieler ohne Allianz, die sich in den letzten 2 Monaten eingeloggt haben.</li>
                <li>Öffne deine Seite <strong>Allianz</strong> (Menü): Die Einladung erscheint unter „Rekrutierungsvorschläge“. Klicke auf <strong>Akzeptieren</strong>.</li>
            </ol>
            <p>Eine Allianz kann nur einladen, wenn sie einen freien Platz hat: Jede ausstehende Einladung zählt bis zu deiner Antwort als Mitglied.</p>
            <p>Du kannst auch auf derselben Seite <strong>deine eigene Allianz gründen</strong>. Du wählst:</p>
            <ul>
                <li>einen <strong>Namen</strong> (höchstens 20 Zeichen, auf dem Server einzigartig) und ein <strong>Tag</strong> (höchstens 5 Zeichen, einzigartig);</li>
                <li>einen Schlachtruf (30 Zeichen) und eine Beschreibung (1.500 Zeichen), die du später ändern kannst;</li>
                <li>die <strong>Allianzsteuer</strong> von 5 bis 50&nbsp;%, die <strong>nicht mehr geändert werden kann</strong>;</li>
                <li>das <strong>politische Regime</strong>, endgültig.</li>
            </ul>
            <p>Du wirst Anführer der Allianz. Ihre Kasse beginnt leer.</p>

            <h2 id="invitations">Einladungen erhalten</h2>
            <p>Ein Mitglied mit der Berechtigung <strong>Rekrutieren</strong> kann dich direkt <strong>einladen</strong>. Du kannst <strong>gleichzeitig eine Einladung von jeder Allianz</strong> erhalten: Wenn dich eine anwirbt, bist du für die anderen nicht unsichtbar. Dagegen kann dich dieselbe Allianz nicht zweimal einladen, solange du nicht geantwortet hast. Allianzen, die auf dich aufmerksam werden, sehen, dass du <strong>bereits umworben</strong> bist, ohne zu wissen, von wem. Sobald du eine Einladung <strong>annimmst</strong>, werden alle anderen automatisch zurückgezogen. Wird eine Allianz <strong>aufgelöst</strong>, verschwindet ihre Einladung aus deiner Liste.</p>

            <h2 id="delai">Wartezeit nach dem Verlassen einer Allianz</h2>
            <p>Nachdem du eine Allianz <strong>verlassen</strong> hast, aus ihr <strong>ausgeschlossen</strong> wurdest oder sie von ihrem Anführer <strong>aufgelöst</strong> wurde, gilt eine <strong>Wartezeit von 2&nbsp;Tagen</strong>: Du kannst keine Allianz <strong>gründen</strong> oder ihr <strong>beitreten</strong>, bis der Countdown abgelaufen ist, der auf der Allianzseite angezeigt wird. Verschwindet die Allianz von selbst (Game Over des Anführers vom Hammer der Sterne oder des letzten Mitglieds), beträgt diese Wartezeit <strong>12&nbsp;Stunden</strong>. Diese Wartezeit verhindert missbräuchliches Hin- und Herwechseln zwischen Allianzen.</p>
            <p><strong>Verlassen</strong> ist nur in der <strong>Waage der Welten</strong> möglich, und unter vier Bedingungen: Du bist nicht der Präsident, nicht das letzte Mitglied, die Allianz befindet sich nicht im Krieg und keine deiner Flotten ist im Kampf. Ein <strong>Ausschluss</strong> ist ebenfalls unmöglich, solange Krieg herrscht oder wenn eine Flotte des betroffenen Mitglieds im Kampf ist.</p>
            <p>Beim Verlassen verlierst du den Produktionsbonus und die Allianzverbesserungen, und <strong>deine politischen Forschungen fallen auf null zurück</strong>.</p>

            <h2 id="regimes">Die 3 politischen Regime</h2>
            <p>Wenn du eine Allianz <strong>gründest</strong>, wählst du ihr <strong>politisches Regime</strong>. Diese Wahl ist <strong>endgültig</strong>: Sie legt die Anzahl der Startmitglieder, die 7 zugänglichen politischen Forschungen und mehrere interne Regeln fest. Alle Details: <a href="/wiki/political_system">Die 3 politischen Regime</a>.</p>

            <h3 id="democratie">Die Waage der Welten</h3>
            <ul>
                <li>3 Mitglieder zu Beginn; ein Präsident, gewählt per Abstimmung der Mitglieder.</li>
                <li>Die Mitglieder können die Allianz verlassen (außer dem Präsidenten, und nie in Kriegszeiten).</li>
                <li>Wirtschaftliche Forschungen: Produktion, Forschungsgeschwindigkeit, Unterhalt der Wissenschaftler, Cargos, Schiffspanzerung, Verkäufe an Händler, Kolonisierung.</li>
                <li>Alle Mitglieder sind öffentlich sichtbar, ebenso die Position ihres ersten Planeten.</li>
                <li>+20&nbsp;% Waffen im Angriff gegen das Stille Bollwerk.</li>
            </ul>

            <h3 id="communisme">Das Stille Bollwerk</h3>
            <ul>
                <li>4 Mitglieder zu Beginn; alle Mitglieder sind Anführer.</li>
                <li>Allianzsteuer auf 50&nbsp;% festgelegt; die Allianz zu verlassen ist unmöglich.</li>
                <li>Offensive Forschungen: Recycling, Verteidigung der Arbeiter, Schiffsstärke, Unterhalt und Rekrutierung der Legionäre, Invasionen, Kriegspunkte.</li>
                <li>+20&nbsp;% Waffen im Angriff gegen den Hammer der Sterne.</li>
            </ul>

            <h3 id="fascisme">Der Hammer der Sterne</h3>
            <ul>
                <li>2 Mitglieder zu Beginn; nur ein Anführer, der Primaris.</li>
                <li>Die Allianz zu verlassen oder aufzulösen ist unmöglich; wird der Primaris auf Game Over gesetzt, wird die Allianz aufgelöst.</li>
                <li>Defensive Forschungen: Arbeiter, Schiffsstärke, Barges, Legionäre, Unterhalt und Verteidigung der Mechs, Invasionen. Die Cthulhu-Bedrohung steigt langsamer.</li>
                <li>Nur der Anführer wird öffentlich angezeigt.</li>
                <li>+20&nbsp;% Waffen im Angriff gegen die Waage der Welten.</li>
            </ul>

            <h2 id="niveau">Allianzstufe und Mitgliederzahl</h2>
            <p>Eine Allianz beginnt mit <strong>3 Plätzen</strong> (Die Waage der Welten), <strong>4</strong> (Das Stille Bollwerk) oder <strong>2</strong> (Der Hammer der Sterne). Um mehr Leute aufzunehmen, erhöht ein Mitglied mit der Berechtigung <strong>Bearbeiten</strong> ihre <strong>Stufe</strong> mit dem Button „Allianzstufe erhöhen“ im Reiter <strong>Allianz Fund</strong>. Die Kosten zahlt die <strong>Kasse</strong>. Jede Stufe schaltet außerdem eine weitere politische Forschung frei (siehe <a href="/wiki/alliance_research">Allianzforschungen</a>).</p>
            <table>
                <thead>
                    <tr><th>Übergang</th><th>Kosten (Kasse)</th><th>Zusätzliche Plätze</th><th>Plätze insgesamt Waage / Bollwerk / Hammer</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 → 1</td><td>125.000 Bitcoins</td><td>+3</td><td>6 / 7 / 5</td></tr>
                    <tr><td>1 → 2</td><td>225.000 Bitcoins + 2.500 KP</td><td>+2</td><td>8 / 9 / 7</td></tr>
                    <tr><td>2 → 3</td><td>600.000 Bitcoins + 10.000 KP</td><td>+2</td><td>10 / 11 / 9</td></tr>
                    <tr><td>3 → 4</td><td>1.000.000 Bitcoins + 25.000 KP</td><td>+2</td><td>12 / 13 / 11</td></tr>
                    <tr><td>4 → 5</td><td>50.000 KP</td><td>+3</td><td>15 / 16 / 14</td></tr>
                    <tr><td>5 → 6</td><td>10.000.000 Bitcoins</td><td>+2</td><td>17 / 18 / 16</td></tr>
                    <tr><td>6 → 7</td><td>15.000.000 Bitcoins + 125.000 KP</td><td>+3</td><td>20 / 21 / 19</td></tr>
                    <tr><td>7 → 8</td><td>35.000.000 Bitcoins + 300.000 KP</td><td>+2</td><td>22 / 23 / 21</td></tr>
                    <tr><td>8 → 9</td><td>50.000.000 Bitcoins + 500.000 KP</td><td>+3</td><td>25 / 26 / 24</td></tr>
                    <tr><td>9 → 10</td><td>100.000.000 Bitcoins + 1.000.000 KP</td><td>+5</td><td>30 / 31 / 29</td></tr>
                </tbody>
            </table>
            <p>Stufe 10 ist das Maximum.</p>

            <h2 id="compte-valide">Konto muss bestätigt sein</h2>
            <p>⚠️ Um eine Allianz zu <strong>gründen oder ihr beizutreten</strong>, muss dein Konto <strong>bestätigt</strong> und deine <strong>E-Mail-Adresse bestätigt</strong> sein. Test- oder anonyme Konten können keiner Allianz beitreten: Bestätige deine E-Mail-Adresse unter <strong>Meine Optionen</strong>.</p>
            <p>Weitere Fälle, in denen es unmöglich ist: während der Wartezeit nach einem Austritt oder Ausschluss (siehe oben), solange eine deiner Flotten in einen Kampf verwickelt ist, auf einem <strong>Battle-Royale</strong>-Server und für den VIP eines <strong>Search &amp; Destroy</strong>-Servers. Ohne bestätigte E-Mail-Adresse kannst du außerdem weder in die Kasse einzahlen noch daraus abheben, in die Verbesserungen investieren oder Bauten unterstützen.</p>

            <h2 id="discord">Deine Allianz auf Discord</h2>
            <p>Verknüpfe dein Discord-Konto in <strong>Meine Optionen</strong> und aktiviere <strong>Meine Allianzen auf Discord anzeigen</strong>: Das Spiel gibt dir auf dem <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area-Universe-Discord</a> die Rolle jeder deiner Allianzen und entfernt sie, wenn du sie verlässt oder sie aufgelöst wird. Niemand kann die Rolle einer Allianz erhalten, der er nicht angehört. Deaktiviere das Kästchen jederzeit, um deine Rollen zu entfernen.</p>

    alliance_grades:
        title: "Ränge und Berechtigungen"
        category: "alliance"
        order: 2
        tags: "raenge,berechtigungen,rollen,hierarchie,offizier,anfuehrer,abstimmung,inaktiv"
        summary: "Wie die interne Hierarchie einer Allianz funktioniert und wer was tun darf."
        related: "alliance_basics,diplomacy,alliance_treasury"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Eine Allianz ist in <strong>Rängen</strong> organisiert, vom höchsten (der Anführer, Rang&nbsp;1) bis zum niedrigsten (Rang&nbsp;5). Jeder Rang trägt eine Liste von <strong>Berechtigungen</strong>, die festlegt, was seine Mitglieder tun dürfen.</p>

            <h2 id="hierarchie">Die Startränge</h2>
            <p>Jede Allianz beginnt je nach Regime mit 4 Rängen:</p>
            <table>
                <thead>
                    <tr><th>Regime</th><th>Anführer (Rang 1, alle Berechtigungen)</th><th>Rang 2</th><th>Rang 3</th><th>Neue Mitglieder</th></tr>
                </thead>
                <tbody>
                    <tr><td>Die Waage der Welten</td><td>Präsident</td><td>Minister (Rekrutieren, Ansehen)</td><td>Bürger (Ansehen)</td><td>Bergarbeiter (Rang 5, keine Berechtigung)</td></tr>
                    <tr><td>Der Hammer der Sterne</td><td>Primaris</td><td>Hauptmann (Rekrutieren, Ansehen)</td><td>Soldat (Ansehen)</td><td>Aspirant (Rang 5, keine Berechtigung)</td></tr>
                    <tr><td>Das Stille Bollwerk</td><td>Führer, Beschützer, Genosse (alle Rang 1)</td><td>Gulag (keine Berechtigung)</td><td>—</td><td>Genosse (alle Berechtigungen)</td></tr>
                </tbody>
            </table>
            <p>Ein Mitglied mit der Berechtigung <strong>Bearbeiten</strong> kann im Reiter <strong>Verwaltung</strong> weitere Ränge erstellen: Es gibt ihnen einen Namen, einen „Gradtyp“ von 2 bis 5 (den Rang) und Berechtigungen. Rang&nbsp;1 ist den Anführern vorbehalten.</p>

            <h2 id="permissions">Die Berechtigungen</h2>
            <p>Die Berechtigungen eines Rangs werden bei seiner <strong>Erstellung</strong> gewählt:</p>
            <ul>
                <li><strong>Rekrutieren</strong>: Spieler einladen.</li>
                <li><strong>Ausschließen</strong>: ein Mitglied ausschließen (in Kriegszeiten unmöglich).</li>
                <li><strong>Pakt</strong>: einen Nichtangriffspakt oder ein Verteidigungsbündnis vorschlagen, annehmen, ablehnen oder auflösen. Sie ist auch für Krieg und Frieden nötig.</li>
                <li><strong>Krieg</strong>: den Krieg erklären und Frieden aushandeln (die Berechtigung Pakt wird ebenfalls gebraucht).</li>
                <li><strong>Bearbeiten</strong>: die Ränge und ihre Vergabe verwalten, DEFCON, Bild, Schlachtruf und Beschreibung, Auszahlungsanträge der Kasse bestätigen, die Stufe der Allianz erhöhen, sie auflösen. Die von diesem Rang beantragten Auszahlungen erfolgen sofort.</li>
                <li><strong>Flotten</strong>: Flotten aus der Freigabe zurücknehmen, die andere Mitglieder mit der Allianz geteilt haben.</li>
                <li><strong>Ansehen</strong>: auf der Räumlichen Karte die Flotten aller Mitglieder und der verbündeten Verteidigungsbündnisse sehen. Ohne sie siehst du nur deine eigenen.</li>
            </ul>
            <p>Die Berechtigungen eines bestehenden Rangs lassen sich nicht ändern: Erstelle einen neuen Rang, weise ihn zu und lösche dann den alten (seine Mitglieder rutschen auf den niedrigsten Rang). Du kannst einem Rang nur Berechtigungen geben, die du selbst hast. Von den Rängen 1, 2, 3 und 5 muss immer mindestens ein Rang übrig bleiben, und du kannst deinen eigenen Rang nicht löschen.</p>

            <h2 id="changer">Befördern oder degradieren</h2>
            <p>Ein Mitglied mit der Berechtigung <strong>Bearbeiten</strong> ändert den Rang eines anderen, indem es in der Mitgliederliste auf dessen <strong>Rang</strong> klickt. So kannst du Aktive belohnen und Neue anleiten.</p>
            <p>Grenzen:</p>
            <ul>
                <li>Man kann keinen Rang vergeben, der mehr Berechtigungen hat als der eigene;</li>
                <li>niemand kann den letzten Anführer degradieren, und ein Anführer kann seinen eigenen Rang nicht ändern;</li>
                <li>der Rang <strong>Präsident</strong> (Waage) oder <strong>Primaris</strong> (Hammer) wird nie von Hand vergeben: Der Präsident wechselt durch Abstimmung, der Primaris nur durch den automatischen Ersatz eines inaktiven Anführers (siehe weiter unten);</li>
                <li>im Stillen Bollwerk lassen sich Führer, Beschützer und Genosse frei tauschen.</li>
            </ul>

            <h2 id="regimes">Sonderfälle je nach Regime</h2>
            <ul>
                <li><strong>Das Stille Bollwerk</strong>: Alle Mitglieder sind Anführer mit allen Rechten, und Neulinge kommen als Genossen. Der einzige niedrigere Rang ist der <strong>Gulag</strong> ohne jede Berechtigung, der vergeben wird, um ein Mitglied beiseitezustellen.</li>
                <li><strong>Der Hammer der Sterne</strong>: Nur ein Anführer, der Primaris, der weder gewählt noch ernannt werden kann. Er wird nur ersetzt, wenn er mehr als 7 Tage inaktiv bleibt (siehe weiter unten). Wird er auf <strong>Game Over</strong> gesetzt, wird die Allianz aufgelöst.</li>
                <li><strong>Die Waage der Welten</strong>: Jedes Mitglied hat eine Stimme, die es jederzeit ändern kann, im Reiter der Mitglieder („Wählen Sie Ihren Präsidenten“). Sobald ein Mitglied mehr Stimmen hat als der Präsident, wird es Präsident, und der bisherige übernimmt seinen Rang.</li>
            </ul>

            <h2 id="afk">Automatischer Ersatz eines inaktiven Anführers</h2>
            <p>Loggt sich ein <strong>Anführer</strong> <strong>mehr als 7 Tage</strong> nicht mehr ein, wird er automatisch ersetzt, damit die Allianz nicht gelähmt wird:</p>
            <ul>
                <li>Das <strong>ranghöchste Mitglied</strong> unter denen, die keine Anführer sind und sich in den letzten 7 Tagen eingeloggt haben, übernimmt die Führung der Allianz. Bei gleichem Rang ist es das Mitglied mit den meisten <strong>Punkten in der Rangliste</strong>.</li>
                <li>Die beiden Ränge werden einfach <strong>getauscht</strong>: Der bisherige Anführer erhält den Rang des Ersatzes. Die Änderung wird im Verlauf der Allianz vermerkt.</li>
                <li>Die Regel gilt für alle drei Regime. Im Stillen Bollwerk, wo alle Anführer sind, kann nur ein Mitglied mit dem Rang Gulag den Platz eines inaktiven Anführers einnehmen.</li>
                <li>Gibt es <strong>keinen aktiven Kandidaten</strong>, ändert sich nichts.</li>
            </ul>

    diplomacy:
        title: "Die Diplomatie"
        category: "alliance"
        order: 3
        tags: "diplomatie,krieg,frieden,pakt,verbuendeter,verteidigungsbuendnis,defcon,vertrag,friedenssteuer"
        summary: "Die 4 Beziehungstypen zwischen Allianzen, wie du sie aushandelst und was der DEFCON bedeutet."
        related: "alliance_basics,political_system,alliance_grades,alliance_treasury"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Deine Allianz unterhält <strong>Beziehungen</strong> zu den anderen Allianzen des Servers. Diese Beziehungen verändern die Regeln zwischen euren jeweiligen Mitgliedern: wer wen plündern oder überfallen darf und wer an wessen Seite kämpft. Die Diplomatie wird im Reiter <strong>Pakte</strong> der Allianzseite verwaltet.</p>

            <h2 id="types">Die 4 Beziehungstypen</h2>
            <table>
                <thead>
                    <tr><th>Typ</th><th>Wirkung</th><th>Einrichtung und Ende</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Keine Beziehung</strong></td><td>Standardsituation: Raids, Invasionen und Kämpfe sind möglich.</td><td>—</td></tr>
                    <tr><td><strong>Krieg</strong></td><td>Die <strong>bewaffneten</strong> Flotten beider Allianzen, die sich auf einem Planeten begegnen, kämpfen automatisch gegeneinander, auch ohne Angriffsmodus. Im Krieg ist es unmöglich, ein Mitglied auszuschließen, die Allianz zu verlassen oder aufzulösen. Das Spiel zählt die gewonnenen und verlorenen Invasionen und KP jeder Seite.</td><td><strong>Sofort</strong> erklärt, ohne Annahme (Berechtigungen Krieg und Pakt). Beide Allianzen wechseln auf DEFCON 5, und ihre Mitglieder erhalten einen Alarm. Er endet nur durch einen angenommenen <strong>Frieden</strong>.</td></tr>
                    <tr><td><strong>Frieden</strong></td><td>Keine Raids und keine Invasionen zwischen euch. Der Besiegte zahlt die vereinbarte <strong>Friedenssteuer</strong>: einen Anteil seiner täglichen Einkünfte und einen Anteil der KP, die er im Kampf gewinnt, eingezahlt in die Kasse des Siegers.</td><td>Aus einem laufenden Krieg heraus vorgeschlagen, mit dem Button „Frieden schließen“. Dauert <strong>4 Tage</strong>, danach sind beide Allianzen wieder neutral.</td></tr>
                    <tr><td><strong>Nichtangriffspakt</strong></td><td>Keine Raids und keine Invasionen zwischen euch. In einer Schlacht kämpft eine Allianz, die einen Pakt mit der gegnerischen Seite hat, nicht mit.</td><td>Vorgeschlagen, dann von der anderen Seite angenommen. Wird <strong>sofort</strong> aufgelöst.</td></tr>
                    <tr><td><strong>Verteidigungsbündnis</strong></td><td>Keine Raids und keine Invasionen zwischen euch. Eure Flotten kämpfen <strong>auf derselben Seite</strong>. Radar und Flotten werden auf der Karte geteilt (mit der Berechtigung Ansehen). Ein <strong>gemeinsamer Salon</strong> der beiden Allianzen.</td><td>Vorgeschlagen, dann angenommen. Die Auflösung wird <strong>12 Stunden</strong> später wirksam; der gemeinsame Salon und seine Nachrichten werden dann gelöscht.</td></tr>
                </tbody>
            </table>
            <p>Du kannst einer Allianz nicht den Krieg erklären, mit der du einen Pakt, ein Verteidigungsbündnis oder einen laufenden Frieden hast: Löse zuerst den Pakt oder das Verteidigungsbündnis auf. Ein Frieden dagegen lässt sich nicht auflösen: Man muss warten, bis er abläuft.</p>

            <h2 id="proposer">So schlägst du einen Vertrag vor</h2>
            <ol>
                <li>Seite <strong>Allianz</strong>, Reiter <strong>Pakte</strong> („Diplomatie der Allianz“).</li>
                <li>Gib unter „Vorschlagen“ das <strong>Tag</strong> der Zielallianz ein und wähle <strong>Verteidigungsbündnis</strong>, <strong>Nichtangriffspakt</strong> oder <strong>Krieg erklären</strong>.</li>
                <li>Die andere Allianz sieht deine Anfrage unter „Erhaltene Anfragen“: Sie kann sie <strong>annehmen</strong> oder <strong>ablehnen</strong>. Es gibt keinen Gegenvorschlag: Um die Bedingungen zu ändern, lehne ab und mache dann deinen eigenen Vorschlag. Zwischen zwei Allianzen kann nur ein Vorschlag ausstehen.</li>
            </ol>
            <p>Ein Pakt kann zu einem Verteidigungsbündnis werden, und ein Frieden kann zu einem Pakt oder einem Verteidigungsbündnis werden: Die Annahme ersetzt die alte Beziehung (ein Frieden und seine Steuer enden dann).</p>

            <h2 id="paix">Frieden aushandeln</h2>
            <p>Klicke in der Liste „Laufende Kriege“ neben dem betreffenden Krieg auf <strong>Frieden schließen</strong> und fülle dann die Bedingungen aus:</p>
            <ul>
                <li><strong>Typ</strong>: <strong>Vorschlagen</strong> (du bietest die Bedingungen an, und deine Allianz zahlt) oder <strong>Beanspruchen</strong> (du verlangst, dass der Gegner zahlt).</li>
                <li><strong>Bitcoins pro Tag</strong>: 0 oder 10 bis 25&nbsp;% der täglichen Einkünfte jedes Mitglieds der besiegten Allianz, abgezogen beim Tagesbericht (18:59 Uhr, Pariser Zeit). Beispiel: Bei 20&nbsp;% führt ein Mitglied, das 10.000 Bitcoins pro Tag einnimmt, 2.000 ab.</li>
                <li><strong>Prozentsatz der Kriegspunkte</strong>: 0 oder 25 bis 50&nbsp;% der KP, die die besiegten Mitglieder im Kampf gewinnen.</li>
                <li><strong>Anzahl der Planeten</strong>: Dieses Feld (0 bis 5) wird in den Bedingungen gespeichert, aber es wird kein Planet übertragen.</li>
            </ul>
            <p>Klicke auf <strong>Unterzeichnen</strong>. Der Gegner sieht deinen Vorschlag auf demselben Bildschirm und kann die Bedingungen akzeptieren oder ablehnen; du kannst deinen zurückziehen, solange er nicht geantwortet hat. Nach der Annahme dauert der Frieden 4 Tage.</p>

            <h2 id="defcon">Der DEFCON (Alarmstufe)</h2>
            <p>Deine Allianz hat eine <strong>DEFCON-Alarmstufe</strong> von <strong>0 bis 5</strong>: <strong>Je höher die Zahl, desto angespannter die Lage</strong>. 0 = kein Alarm, 5 = maximaler Alarm. Ein Mitglied mit der Berechtigung <strong>Bearbeiten</strong> stellt sie im Reiter <strong>Verwaltung</strong> ein („Verteidigungsstufe“). Eine <strong>Kriegserklärung</strong> setzt automatisch beide Allianzen auf <strong>DEFCON 5</strong>.</p>
            <p>Die Stufe wird als Banner auf der <strong>Globalen Sicht</strong> aller Mitglieder angezeigt (grün bei 1, orange bei 2, rot von 3 bis 5, nichts bei 0), mit der Liste der Allianzen, mit denen ihr im Krieg seid. Das ist ein Koordinationssignal ohne Wirkung auf die Kämpfe.</p>

            <h2 id="logs">Das diplomatische Protokoll</h2>
            <p>Jede diplomatische Aktion (Kriegserklärung, Vorschlag, angenommener Frieden, aufgelöster Pakt, abgelehnter Vorschlag …) wird im <strong>Verlauf</strong> der Allianz (Reiter der Mitglieder) <strong>festgehalten</strong>, mit dem Spielernamen des Urhebers, Datum und Uhrzeit. Auch Beitritte, Austritte, Ausschlüsse und Anführerwechsel stehen dort. Nützlich für interne Transparenz und Debatten im Nachhinein.</p>

    alliance_treasury:
        title: "Allianzkasse"
        category: "alliance"
        order: 4
        tags: "kasse,schatzkammer,bank,bitcoin,kp,einzahlung,abhebung,auszahlung,steuer,stufe"
        summary: "Das gemeinsame Konto deiner Allianz in Bitcoins und KP: Einzahlungen, Allianzsteuer, Friedenssteuern, Auszahlungen und Stufenaufstieg."
        related: "alliance_basics,diplomacy,exchange,bitcoin_economy"
        body: |
            <h2 id="principe">Wozu die Kasse dient</h2>
            <p>Die Allianzkasse (Reiter <strong>Allianz Fund</strong> der Allianzseite) ist ein gemeinsames Konto in <strong>Bitcoins</strong> und <strong>Kriegspunkten (KP)</strong>. Sie dient dazu:</p>
            <ul>
                <li><strong>Die Stufe der Allianz zu erhöhen</strong>, um mehr Mitglieder aufzunehmen und die nächsten politischen Forschungen freizuschalten (siehe <a href="/wiki/alliance_basics#niveau">Allianzstufe</a>).</li>
                <li>Bitcoins oder KP an ein Mitglied <strong>umzuverteilen</strong>: einem Spieler in Schwierigkeiten aushelfen, eine Kriegsvorbereitung finanzieren.</li>
            </ul>
            <p>Die politischen Forschungen werden <strong>nicht</strong> von der Kasse bezahlt: Jeder Spieler zahlt seine eigenen (siehe <a href="/wiki/alliance_research">Allianzforschungen</a>). Eine erlittene Cthulhu-Blockade kann hier auch einen „Tribut der Besessenen“ abziehen.</p>

            <h2 id="alimenter">So füllst du sie</h2>
            <ul>
                <li><strong>Freiwillige Einzahlungen</strong>: Jedes Mitglied kann Bitcoins oder KP einzahlen (Reiter Allianz Fund, „Geben“), auf Wunsch mit einem Grund. Bestätigtes Konto und bestätigte E-Mail-Adresse erforderlich.</li>
                <li><strong>Allianzsteuer</strong>: immer aktiv, wird beim Tagesbericht automatisch von jedem Mitglied abgezogen (siehe weiter unten).</li>
                <li><strong>Friedenssteuern</strong>: Wenn dir eine besiegte Allianz einen Frieden zahlt, fließen ihre tägliche Steuer in Bitcoins und ihr Anteil der im Kampf gewonnenen KP in deine Kasse (siehe <a href="/wiki/diplomacy#paix">Frieden aushandeln</a>).</li>
                <li><strong>Allianz-Arena</strong>: Die Belohnungen der Allianz (Bitcoins und KP) werden an die Bank gezahlt.</li>
            </ul>

            <h2 id="retrait">Die Auszahlungen</h2>
            <p>Jedes Mitglied kann eine <strong>Auszahlung</strong> beantragen (Reiter Allianz Fund, „Zurückziehen“), in Bitcoins oder in KP.</p>
            <ul>
                <li>Hast du die Berechtigung <strong>Bearbeiten</strong> oder ist deine Allianz ein <strong>Stilles Bollwerk</strong>, erfolgt die Auszahlung sofort.</li>
                <li>Andernfalls bleibt der Antrag <strong>Ausstehend</strong>, bis ein Mitglied mit der Berechtigung Bearbeiten ihn annimmt („Ja“: Die Mittel werden dir ausgezahlt) oder ablehnt („Nein“: Der Antrag wird gelöscht).</li>
                <li>Die Annahme scheitert, wenn die Kasse die Summe nicht mehr hat oder wenn der Antragsteller die Allianz inzwischen verlassen hat.</li>
            </ul>
            <p>Jede Bewegung wird im Verlauf der Bank festgehalten.</p>

            <h2 id="taxes">Die Allianzsteuer</h2>
            <p>Die <strong>Allianzsteuer</strong> wird <strong>bei der Gründung</strong> der Allianz gewählt, von 5 bis 50&nbsp;%. Sie <strong>kann danach nicht mehr geändert werden</strong>. Im Stillen Bollwerk ist sie auf 50&nbsp;% festgelegt.</p>
            <p>Sie wird automatisch beim <strong>Tagesbericht</strong> (18:59 Uhr, Pariser Zeit) von dem Bitcoin-Einkommen abgezogen, das deine Arbeiter dir einbringen, und in die Kasse eingezahlt (Zeile „Tägliche Steuer“).</p>
            <p>Berechnung: Der Abzug beträgt Einkommen − Einkommen ÷ (1 + Satz). Eine Steuer von 10&nbsp;% zieht also etwa 9,1&nbsp;% des Einkommens ab, eine Steuer von 50&nbsp;% ein Drittel. Beispiel: Bei 10.000 Bitcoins Tageseinkommen ziehen 10&nbsp;% 909 Bitcoins ab, 50&nbsp;% ziehen 3.333 ab.</p>
            <p>Wähle sie vernünftig: Ist sie zu hoch, gehen die Mitglieder.</p>

            <h2 id="transparence">Transparenz</h2>
            <p>Der Reiter <strong>Allianz Fund</strong> zeigt <strong>allen Mitgliedern</strong> den Verlauf der letzten 200 Bewegungen: Mitglied, Typ (Bitcoins oder KP), Betrag, Grund, Datum und Status (Akzeptiert oder Ausstehend). Auch die täglichen Steuern und die Friedenssteuern stehen dort. So kann jeder nachprüfen, wohin das Geld fließt.</p>

    political_system:
        title: "Die 3 politischen Regime"
        category: "alliance"
        order: 5
        tags: "politik,regime,bonus,waage,bollwerk,hammer"
        summary: "Die 3 möglichen Regime einer Allianz: Vorteile, Nachteile und wie du wählst."
        related: "alliance_basics,alliance_research,alliance_grades,combat_stats"
        body: |
            <h2 id="principe">Bei der Gründung wählen</h2>
            <p>Wenn eine Allianz gegründet wird, wählt der Gründer ein <strong>politisches Regime</strong>. Dieses Regime legt <strong>interne Regeln</strong>, <strong>spezifische Boni</strong> und die <strong>7 politischen Forschungen</strong> fest, die seine Mitglieder starten können. Die Wahl ist <strong>unumkehrbar</strong>.</p>
            <table>
                <thead>
                    <tr><th></th><th>Die Waage der Welten</th><th>Das Stille Bollwerk</th><th>Der Hammer der Sterne</th></tr>
                </thead>
                <tbody>
                    <tr><td>Mitglieder zu Beginn</td><td>3</td><td>4</td><td>2</td></tr>
                    <tr><td>Anführer</td><td>Ein Präsident, per Abstimmung gewählt</td><td>Alle Mitglieder</td><td>Nur einer, der Primaris</td></tr>
                    <tr><td>Die Allianz verlassen</td><td>Ja (außer dem Präsidenten)</td><td>Nein</td><td>Nein</td></tr>
                    <tr><td>Die Allianz auflösen</td><td>Ja</td><td>Ja</td><td>Nein</td></tr>
                    <tr><td>Allianzsteuer</td><td>Bei der Gründung gewählt (5 bis 50&nbsp;%)</td><td>50&nbsp;%</td><td>Bei der Gründung gewählt (5 bis 50&nbsp;%)</td></tr>
                    <tr><td>+20&nbsp;% Waffen im Angriff gegen</td><td>Das Stille Bollwerk</td><td>Der Hammer der Sterne</td><td>Die Waage der Welten</td></tr>
                </tbody>
            </table>
            <p>Die Mitgliederzahl wächst danach mit der <a href="/wiki/alliance_basics#niveau">Stufe der Allianz</a>. Eine Allianz aufzulösen ist in Kriegszeiten immer unmöglich.</p>

            <h2 id="balance">Die Waage der Welten (demokratisch)</h2>
            <p>Offenes, wirtschaftliches Regime. Die Mitglieder wählen ihren Präsidenten. Schwerpunkt auf der <strong>Wirtschaft</strong>.</p>
            <ul>
                <li>3 Mitglieder zu Beginn.</li>
                <li>Jedes Mitglied hat eine Stimme, die es jederzeit ändern kann (Reiter der Mitglieder, „Wählen Sie Ihren Präsidenten“). Sobald ein Mitglied mehr Stimmen hat als der Präsident, nimmt es dessen Platz ein.</li>
                <li>+20&nbsp;% Waffen im Angriff gegen das Stille Bollwerk.</li>
                <li>Die Mitglieder können die Allianz verlassen (außer dem Präsidenten, und nie in Kriegszeiten).</li>
                <li>Mitglieder öffentlich sichtbar, ebenso die Position ihres ersten Planeten.</li>
                <li>Wirtschaftlich ausgerichtete Forschungen: Produktion, Forschungsgeschwindigkeit, Unterhalt der Wissenschaftler, Cargos, Schiffspanzerung, Verkäufe an Händler, Kolonisierung (Details unter <a href="/wiki/alliance_research">Allianzforschungen</a>).</li>
            </ul>

            <h2 id="rempart">Das Stille Bollwerk (offensiv)</h2>
            <p>Aggressives, kollektives Regime. Alle Mitglieder sind Anführer. Schwerpunkt auf der <strong>Offensive</strong>.</p>
            <ul>
                <li>4 Mitglieder zu Beginn (eines mehr als die Waage der Welten).</li>
                <li>+20&nbsp;% Waffen im Angriff gegen den Hammer der Sterne.</li>
                <li>Allianzsteuer automatisch auf 50&nbsp;% festgelegt.</li>
                <li>Auszahlungen aus der Kasse erfolgen für alle Mitglieder sofort.</li>
                <li>Die Allianz zu verlassen ist unmöglich.</li>
                <li>Kampforientierte Forschungen: Recycling, Verteidigung der Arbeiter, Schiffsstärke, Unterhalt und Rekrutierung der Legionäre, Invasionen, Kriegspunkte.</li>
            </ul>
            <p>Die drei obersten Ränge (<strong>Führer</strong>, <strong>Beschützer</strong>, <strong>Genosse</strong>) sind <strong>gleichwertig</strong>: gleiche Rechte, keine Hierarchie untereinander. Sie können frei unter den Mitgliedern vergeben werden, und Neulinge kommen als Genossen mit allen Rechten. Der einzige niedrigere Rang ist der <strong>Gulag</strong> ohne jede Berechtigung, der vergeben wird, um ein Mitglied beiseitezustellen.</p>

            <h2 id="marteau">Der Hammer der Sterne (defensiv)</h2>
            <p>Diskretes, defensives Regime. Nur ein Anführer, der Primaris, der nur ersetzt wird, wenn er mehr als 7 Tage inaktiv bleibt (siehe <a href="/wiki/alliance_grades#afk">Ränge und Berechtigungen</a>). Schwerpunkt auf der <strong>Verteidigung</strong> und Widerstandsfähigkeit.</p>
            <ul>
                <li>2 Mitglieder zu Beginn (eines weniger als die Waage der Welten, zwei weniger als das Stille Bollwerk).</li>
                <li>+20&nbsp;% Waffen im Angriff gegen die Waage der Welten.</li>
                <li>Die Cthulhu-Bedrohung steigt 25&nbsp;% langsamer als bei den beiden anderen Regimen: +150 statt +200 pro Sieg gegen die Cthulhu im normalen Schwierigkeitsgrad (siehe <a href="/wiki/cthulhus#menace">Die Cthulhu-Bedrohung</a>). Sehr nützlich im PvE.</li>
                <li>Nur der Anführer wird öffentlich angezeigt.</li>
                <li>Die Allianz zu verlassen ist unmöglich. Sie aufzulösen ist unmöglich.</li>
                <li>Wird der Anführer auf Game Over gesetzt, wird die Allianz aufgelöst.</li>
                <li>Defensiv ausgerichtete Forschungen: Arbeiterproduktion, Schiffsstärke, Kapazität der Barges, Stärke der Legionäre, Unterhalt und Verteidigung der Mechs, Invasionen.</li>
            </ul>

            <h2 id="combat">Boni zwischen den Regimen</h2>
            <p>Jedes Regime dominiert ein anderes, nach dem Schere-Stein-Papier-Prinzip:</p>
            <ul>
                <li>Die Waage der Welten schlägt das Stille Bollwerk.</li>
                <li>Das Stille Bollwerk schlägt den Hammer der Sterne.</li>
                <li>Der Hammer der Sterne schlägt die Waage der Welten.</li>
            </ul>
            <p>Wenn deine Seite in einem Weltraumkampf (oder in der Allianz-Arena) <strong>angreift</strong> und dein Regime das des Verteidigers dominiert, gewinnen deine <strong>Raketen, Laser und Plasmawaffen</strong> <strong>+20&nbsp;%</strong>. In der Verteidigung oder gegen dasselbe Regime gibt es keinen Bonus. Bodenkämpfe sind nicht betroffen.</p>

            <h2 id="visibilite">Was andere von dir sehen</h2>
            <ul>
                <li><strong>Die Waage der Welten</strong>: Alle Mitglieder erscheinen auf der Karte der Allianz, mit ihrer Planetenzahl, und die Karte jedes Mitglieds zeigt die Position seines ersten Planeten.</li>
                <li><strong>Das Stille Bollwerk</strong>: Die Mitglieder erscheinen auf der Karte der Allianz, aber die Ranglisten verbergen die Zahl der Mitglieder und Planeten.</li>
                <li><strong>Der Hammer der Sterne</strong>: Nur der Anführer erscheint auf der Karte der Allianz, die Liste der Planeten der Mitglieder ist auf deren Karte verborgen, und die Ranglisten verbergen die Zahl der Mitglieder und Planeten.</li>
            </ul>

            <h2 id="choisir">Wie wählt man?</h2>
            <ul>
                <li><strong>Du fängst an und willst wachsen</strong> → Die Waage der Welten (wirtschaftlich, und die einzige, die man verlassen kann).</li>
                <li><strong>Du willst eine verschworene, aggressive Allianz</strong> → Das Stille Bollwerk.</li>
                <li><strong>Du willst dich schützen, defensiv spielen</strong> → Der Hammer der Sterne (Achtung: Beim Game Over des Anführers bricht alles zusammen).</li>
            </ul>

    alliance_research:
        title: "Allianzforschungen"
        category: "alliance"
        order: 6
        tags: "forschung,allianz,politik,politische,regime,bonus"
        summary: "Die 7 politischen Forschungen deines Regimes: persönliche Forschungen, bezahlt mit deinen eigenen Bitcoins und freigeschaltet durch die Stufe der Allianz."
        related: "political_system,alliance_basics,alliance_improvements,research"
        body: |
            <h2 id="principe">So funktioniert es</h2>
            <p>Die Allianzforschungen, <strong>politische Forschungen</strong> genannt, werden auf der Seite <strong>Forschung</strong> in der Kategorie <strong>Politische</strong> gestartet. Jedes Regime hat <strong>7 Forschungen</strong> mit <strong>5 Stufen</strong>. Sie werden nacheinander mit der <strong>Stufe der Allianz</strong> freigeschaltet: die erste ab Stufe 0, die zweite bei Stufe 1 … bis zur siebten bei Stufe 6 (siehe <a href="/wiki/alliance_basics#niveau">Allianzstufe</a>). Ohne Allianz zeigt die Kategorie „Benötigt: Einer Allianz beitreten“ an.</p>
            <p>Es sind <strong>persönliche</strong> Forschungen: Jedes Mitglied startet sie für sich selbst, in seiner eigenen Forschungswarteschlange, mit <strong>seinen eigenen Bitcoins</strong>, und der Bonus gilt <strong>nur für es selbst</strong>. Die Kosten einer Stufe entsprechen den Grundkosten × der angestrebten Stufe, verringert durch die Allianzverbesserung „Forschungskosten“. Die Dauer hängt wie bei jeder Forschung von deinen Wissenschaftlern ab.</p>
            <p><strong>Achtung</strong>: Wenn du die Allianz verlässt, aus ihr ausgeschlossen wirst oder sie aufgelöst wird, fallen alle deine Stufen der politischen Forschungen auf null zurück. Eine politische Forschung, die endet, während du keine Allianz mehr hast, bringt nichts.</p>
            <p>Nicht zu verwechseln mit den <a href="/wiki/alliance_improvements">Allianzverbesserungen</a>, die kollektiv sind und von den Investitionen der Mitglieder finanziert werden. Beide addieren sich.</p>

            <h2 id="liste">Die Forschungen jedes Regimes</h2>
            <p>Wirkung pro Stufe, dann Wirkung bei Stufe 5. Kosten der Stufe N = Grundkosten × N, in Bitcoins: Die 5 Stufen kosten das 15-Fache der Grundkosten (zum Beispiel 375.000 Bitcoins für eine Forschung mit 25.000). Die erforderliche Allianzstufe steht in Klammern.</p>

            <h3>Die Waage der Welten</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Wirkung</th><th>Grundkosten</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Produktionsgesetz</strong> (Stufe 0)</td><td>+7,1&nbsp;% Produktion von Niobium, Wasser und Rationen pro Stufe, zusätzlich zu den +20&nbsp;% der Allianz (insgesamt ×1,56 bei Stufe 5, gegenüber ×1,2 ohne die Forschung)</td><td>25.000</td></tr>
                    <tr><td><strong>Wissenschaftsmobilisierung</strong> (Stufe 1)</td><td>+0,1 Forschungsgeschwindigkeit pro Stufe (+0,5 bei Stufe 5), bis zur nächsten Ankunft von Wissenschaftlern, die die Geschwindigkeit auf die nächste ganze Zahl rundet (siehe <em>Arbeiter und Wissenschaftler</em>)</td><td>50.000</td></tr>
                    <tr><td><strong>Wissenschaftsbegeisterung</strong> (Stufe 2)</td><td>Verringerter Unterhalt der Wissenschaftler: −17&nbsp;% bei Stufe 1, −50&nbsp;% bei Stufe 5</td><td>100.000</td></tr>
                    <tr><td><strong>Verbesserte Cargos</strong> (Stufe 3)</td><td>+20&nbsp;% Cargo-Kapazität pro Stufe (+100&nbsp;%)</td><td>150.000</td></tr>
                    <tr><td><strong>Schiffspanzerung</strong> (Stufe 4)</td><td>+10&nbsp;% Schiffspanzerung pro Stufe (+50&nbsp;%)</td><td>200.000</td></tr>
                    <tr><td><strong>Handelsabkommen</strong> (Stufe 5)</td><td>+5&nbsp;% Verkaufserlös bei Händlern pro Stufe (+25&nbsp;%)</td><td>250.000</td></tr>
                    <tr><td><strong>Verbreitung der Demokratie</strong> (Stufe 6)</td><td>+1 kolonisierbarer Planet pro Stufe (+5)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h3>Das Stille Bollwerk</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Wirkung</th><th>Grundkosten</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Recyclingoptimierung</strong> (Stufe 0)</td><td>Jeder Recycler bringt pro 5-Minuten-Zyklus 1.000 + 400 × Stufe Ressourcen ein (1.400 bei Stufe 1, 3.000 bei Stufe 5, also das Dreifache)</td><td>25.000</td></tr>
                    <tr><td><strong>Ideologische Stärkung</strong> (Stufe 1)</td><td>+20&nbsp;% Verteidigung der Arbeiter pro Stufe (+100&nbsp;%)</td><td>50.000</td></tr>
                    <tr><td><strong>Verbesserte Bewaffnung</strong> (Stufe 2)</td><td>+10&nbsp;% Schiffsstärke pro Stufe (+50&nbsp;%)</td><td>100.000</td></tr>
                    <tr><td><strong>Sowjetische Struktur</strong> (Stufe 3)</td><td>Verringerter Unterhalt der Legionäre: −9&nbsp;% bei Stufe 1, −33&nbsp;% bei Stufe 5</td><td>150.000</td></tr>
                    <tr><td><strong>Freiwilligenrekrutierung</strong> (Stufe 4)</td><td>−1 Bitcoin pro Stufe beim Rekrutierungspreis eines Legionärs (8 → 3 Bitcoins)</td><td>200.000</td></tr>
                    <tr><td><strong>Imperium ohne Grenzen</strong> (Stufe 5)</td><td>+1 pro Invasion eroberter Planet pro Stufe (+5)</td><td>250.000</td></tr>
                    <tr><td><strong>Kriegspunkte</strong> (Stufe 6)</td><td>+10&nbsp;% gewonnene KP pro Stufe (+50&nbsp;%)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h3>Der Hammer der Sterne</h3>
            <table>
                <thead>
                    <tr><th>Forschung</th><th>Wirkung</th><th>Grundkosten</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Familienpolitik</strong> (Stufe 0)</td><td>+20&nbsp;% Arbeiterproduktion pro Stufe (+100&nbsp;%)</td><td>25.000</td></tr>
                    <tr><td><strong>Verbesserte Bewaffnung</strong> (Stufe 1)</td><td>+10&nbsp;% Schiffsstärke pro Stufe (+50&nbsp;%)</td><td>50.000</td></tr>
                    <tr><td><strong>Geplante Invasionen</strong> (Stufe 2)</td><td>+25&nbsp;% Kapazität der Barges pro Stufe: 1.250 Legionäre pro Barge bei Stufe 1, 2.250 bei Stufe 5</td><td>100.000</td></tr>
                    <tr><td><strong>Militärmacht</strong> (Stufe 3)</td><td>+10&nbsp;% Stärke der Legionäre, im Angriff wie in der Verteidigung, pro Stufe (+50&nbsp;%)</td><td>150.000</td></tr>
                    <tr><td><strong>Mechanische Überlegenheit</strong> (Stufe 4)</td><td>Verringerter Unterhalt der Mechs: −17&nbsp;% bei Stufe 1, −50&nbsp;% bei Stufe 5</td><td>200.000</td></tr>
                    <tr><td><strong>Mech-Panzerung</strong> (Stufe 5)</td><td>+10&nbsp;% Verteidigung der Mechs pro Stufe (+50&nbsp;%)</td><td>250.000</td></tr>
                    <tr><td><strong>Imperium ohne Grenzen</strong> (Stufe 6)</td><td>+1 pro Invasion eroberter Planet pro Stufe (+5)</td><td>300.000</td></tr>
                </tbody>
            </table>

            <h2 id="choisir">Welche Forschungen priorisieren?</h2>
            <ul>
                <li><strong>Die Waage der Welten</strong> → Produktionsgesetz, Wissenschaftsmobilisierung, Verbesserte Cargos.</li>
                <li><strong>Das Stille Bollwerk</strong> → Verbesserte Bewaffnung, Imperium ohne Grenzen, Kriegspunkte.</li>
                <li><strong>Der Hammer der Sterne</strong> → Familienpolitik, Geplante Invasionen, Militärmacht, Mech-Panzerung.</li>
            </ul>
            <p>Jeder wählt seine eigenen Forschungen, aber die letzten öffnen sich erst, wenn die Stufe der Allianz steigt: Das organisiert ihr am besten gemeinsam im Salon, mit der Kasse.</p>

    salon:
        title: "Der Allianzsalon"
        category: "alliance"
        order: 7
        tags: "salon,chat,diskussion,allianz,nachricht"
        summary: "Der Chat deiner Allianz: live, mit Verlauf, anklickbaren Koordinaten und gemeinsamen Salons mit deinen Verbündeten."
        related: "alliance_basics,diplomacy,moderation_blocking"
        body: |
            <h2 id="fonctionnement">So funktioniert es</h2>
            <p>Der <strong>Allianzsalon</strong> ist ein Live-Chat, der den Mitgliedern deiner Allianz vorbehalten ist. Öffne <strong>Salon</strong> im Menü: Der Salon deiner Allianz ist der Reiter, der ihren Namen trägt.</p>
            <p>Dort findest du auch den Salon <strong>Universum</strong> (der ganze Server), einen Salon für jede Galaxie, in der du einen Planeten hast, und für jedes unterzeichnete <strong>Verteidigungsbündnis</strong> einen gemeinsamen Salon der beiden Allianzen (gelöscht samt seinen Nachrichten, wenn das Verteidigungsbündnis endet).</p>
            <p>Die Nachrichten bleiben erhalten: Du kannst im Verlauf zurückscrollen, um eine Information wiederzufinden.</p>

            <h2 id="usage">Wozu er gut ist</h2>
            <ul>
                <li><strong>Angriffe koordinieren</strong>: Einen Raid zu zweit zu starten ist besser, als wenn einer allein zurückgeschlagen wird.</li>
                <li><strong>Alarmieren</strong>, wenn eine feindliche Flotte gesichtet wurde.</li>
                <li><strong>Koordinaten teilen</strong> (Zielplaneten, interessante Trümmerfelder): Im Format <code>Galaxie:Sektor:Position</code> geschrieben (z. B. <code>1:15:25</code>), werden sie zu einem Link, der diesen Sektor auf der Räumlichen Karte öffnet (die Galaxie muss existieren, der Sektor von 1 bis 100 und die Position von 1 bis 25 reichen). Auch Links auf eine Spielseite werden anklickbar.</li>
                <li><strong>Über die Strategie</strong> der Allianz diskutieren (Forschungen, Diplomatie, Kriege).</li>
                <li><strong>Sich vorstellen</strong> bei den neuen Mitgliedern und Kontakte knüpfen.</li>
            </ul>

            <h2 id="bonnes-pratiques">Gute Gepflogenheiten</h2>
            <ul>
                <li>Bleib respektvoll: Beleidigungen und Belästigung können sanktioniert werden. Eine missbräuchliche Nachricht meldest du über die Nachricht selbst (siehe <a href="/wiki/moderation_blocking">Moderation</a>).</li>
                <li>Vermeide Spam: Lass Platz für strategische Diskussionen. Eine Nachricht darf höchstens <strong>200 Zeichen</strong> lang sein, und man kann 20 pro Minute senden.</li>
                <li>Um jemanden anzusprechen, klicke auf seinen Spielernamen: „Name &gt;“ wird deiner Nachricht hinzugefügt. Eine Nachricht, die deinen Spielernamen oder das Tag deiner Allianz in eckigen Klammern enthält (z. B. <code>[TAG]</code>), wird für dich hervorgehoben.</li>
                <li>Wenn jemand einen Rat gibt, notiere ihn dir: Die Nachrichten laufen schnell durch.</li>
            </ul>

            <h2 id="messages-prives">Und die privaten Nachrichten?</h2>
            <p>Abseits des Salons kannst du jedem Spieler des Servers eine <strong>private Nachricht</strong> schicken, auch außerhalb deiner Allianz. Nützlich für diskrete Diplomatie, um auf einen Vorschlag zu antworten oder um eine Allianz zu bitten, dich einzuladen. Koordinaten und Spiellinks werden dort genauso anklickbar wie im Salon.</p>

    alliance_improvements:
        title: "Allianzverbesserungen"
        category: "alliance"
        order: 8
        tags: "verbesserungen,allianz,bonus,bitcoin,investition,kollektiv,stufen"
        summary: "Investiere Bitcoins, um 16 kollektive Boni freizuschalten, die deine ganze Allianz stärken — Forschungsgeschwindigkeit, Produktion, Kampfstärke und mehr."
        related: "alliance_construction_help,alliance_research,alliance_treasury"
        body: |
            <h2 id="uebersicht">Prinzip</h2>
            <p>Der Reiter <strong>Verbesserungen</strong> der Allianzseite erlaubt es den Mitgliedern, Bitcoins zu investieren, um <strong>16 kollektive Boni</strong> freizuschalten und zu verbessern. Diese Boni kommen <strong>allen Mitgliedern</strong> der Allianz zugute, ob eingeloggt oder nicht. Ein Spieler, der die Allianz verlässt, profitiert nicht mehr davon, aber die Allianz behält ihre erreichten Stufen.</p>

            <h2 id="kontingent">Investitionskontingent</h2>
            <p>Jedes Mitglied verfügt über <strong>20 Investitionen pro 3-Stunden-Zeitraum</strong>. Der Zeitraum beginnt mit deiner ersten Investition; nach 3 Stunden springt das Kontingent wieder auf 20. Ungenutzte Investitionen verfallen: Das Kontingent sammelt sich nicht an. Der Reiter zeigt deine „Verfügbaren Investitionen“ und, wenn das Kontingent erschöpft ist, die verbleibende Zeit bis zum „Nächsten Fenster“.</p>
            <p>Jede Investition kostet <strong>1.000 Bitcoins</strong>, die von deinem persönlichen Kontostand abgezogen werden. Das ist eine endgültige Ausgabe, ohne Rückerstattung. Zum Investieren brauchst du ein bestätigtes Konto und eine bestätigte E-Mail-Adresse.</p>
            <p>Unter jedem Bonus erlauben die Schnell-Buttons <strong>×1 / ×5 / ×10</strong>, mit einem Klick mehrere Punkte zu investieren.</p>

            <h2 id="stufen">Stufen und Schwellen</h2>
            <p>Jeder Bonus hat <strong>5 Stufen</strong>. Die für den Aufstieg zur nächsten Stufe erforderlichen Investitionsschwellen sind:</p>
            <table>
                <thead>
                    <tr><th>Stufe</th><th>Nötige Investitionen</th></tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td>400</td></tr>
                    <tr><td>2</td><td>500</td></tr>
                    <tr><td>3</td><td>660</td></tr>
                    <tr><td>4</td><td>800</td></tr>
                    <tr><td>5</td><td>1.000</td></tr>
                </tbody>
            </table>
            <p>⚠️ Überschüssige Investitionen über die Schwelle einer Stufe hinaus <strong>verfallen</strong>: Es gibt keine Übertragung auf die nächste Stufe.</p>
            <p>Um einen Bonus auf Stufe 5 zu bringen, braucht es insgesamt <strong>3.360 Investitionen</strong>, also 3.360.000 Bitcoins. Das ist ein kollektives Projekt: Bei 20 Investitionen pro 3-Stunden-Zeitraum bräuchte ein einzelner Spieler 168 Zeiträume dafür.</p>

            <h2 id="boni">Die 16 Boni und ihre Wirkungen</h2>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Wirkung pro Stufe</th><th>Maximum (Stufe 5)</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Forschungsgeschwindigkeit</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Forschungskosten</strong></td><td>−1&nbsp;% pro Stufe</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Baubonus</strong></td><td>+15 s Verkürzung pro Hilfe</td><td>75 s Verkürzung pro Hilfe</td></tr>
                    <tr><td><strong>Baukosten</strong></td><td>−1&nbsp;% pro Stufe</td><td>−5&nbsp;%</td></tr>
                    <tr><td><strong>Niobiumproduktion</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Wasserproduktion</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Rationenproduktion</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Flottengeschwindigkeit</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Raketenstärke</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Laserstärke</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Plasmastärke</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Treffergenauigkeit</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Flottenrüstung</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Schild</strong></td><td>+1&nbsp;% pro Stufe</td><td>+5&nbsp;%</td></tr>
                    <tr><td><strong>Planetenverteidigung</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                    <tr><td><strong>Helden-Erfahrung</strong></td><td>+2&nbsp;% pro Stufe</td><td>+10&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Der <strong>Baubonus</strong> speist direkt die <a href="/wiki/alliance_construction_help">Bauhilfe</a>: Je höher seine Stufe, desto mehr verkürzt jede Hilfe eines Verbündeten die Bauzeit.</p>
            <p>Verwechsle die Verbesserung „Forschungsgeschwindigkeit“ nicht mit der politischen Forschung „Wissenschaftsmobilisierung“ der Waage der Welten (für den, der sie erforscht, siehe <a href="/wiki/alliance_research">Allianzforschungen</a>). Die Verbesserung „Forschungsgeschwindigkeit“ verkürzt die auf der Seite Forschung angezeigte Dauer, aber nicht die tatsächliche Dauer: Eine gestartete Forschung endet zu der Zeit, die ohne sie berechnet wurde.</p>

            <h2 id="absence">Und wenn ein Mitglied abwesend ist?</h2>
            <p>Es gibt keinen Urlaubsmodus. Ein abwesendes Mitglied <strong>behält alle seine Allianzboni</strong> (Produktion, Verbesserungen, politische Forschungen), solange es in der Allianz bleibt, und seine Allianzsteuer wird weiterhin täglich abgezogen. Nach <strong>7 Tagen</strong> ohne Login wird ein inaktiver Anführer automatisch ersetzt (siehe <a href="/wiki/alliance_grades#afk">Ränge und Berechtigungen</a>). Nach <strong>8 Tagen</strong> wechselt das Konto auf Autopilot, bleibt aber Mitglied der Allianz.</p>

    alliance_construction_help:
        title: "Bauhilfe"
        category: "alliance"
        order: 9
        tags: "bauhilfe,bau,allianz,boost,gebaeude,hilfe,beschleunigung"
        summary: "Ein Klick, um die Bauten aller deiner Verbündeten gleichzeitig zu beschleunigen — und sie tun dasselbe für dich."
        related: "alliance_improvements"
        body: |
            <h2 id="uebersicht">Prinzip</h2>
            <p>Die <strong>Bauhilfe</strong> erlaubt es den Mitgliedern einer Allianz, ihre laufenden Bauten gegenseitig mit einem einfachen Klick zu beschleunigen. Hat ein Verbündeter oder haben mehrere Verbündete einen laufenden Bau auf ihrem Planeten, erscheint in der globalen Leiste der Oberfläche ein <strong>Hilfe-Symbol</strong> (eine Hand, die ein Herz hält). Das Badge zeigt die Zahl der förderfähigen Bauten an. Zum Helfen brauchst du ein bestätigtes Konto und eine bestätigte E-Mail-Adresse.</p>
            <p>Ein Klick auf dieses Symbol löst die Hilfe automatisch auf <strong>allen förderfähigen Bauten</strong> der Allianz gleichzeitig aus: Du musst sie nicht einzeln auswählen.</p>

            <h2 id="gewinn">Gewinn pro Hilfe</h2>
            <p>Jede geleistete Hilfe beschleunigt den Bau um:</p>
            <blockquote><strong>15 Sekunden × Stufe des Bonus „Baubonus“</strong></blockquote>
            <p>Der Gewinn ist <strong>auf 75 Sekunden</strong> pro Hilfe und pro Mitglied <strong>begrenzt</strong> (Stufe 5 × 15 s = 75 s). Diese Stufe ist die <strong>deiner Allianz</strong>: Alle ihre Mitglieder bringen denselben Gewinn pro Hilfe. Ein Bau kann durch die Bauhilfe nicht unter <strong>30 verbleibende Sekunden</strong> sinken.</p>
            <table>
                <thead>
                    <tr><th>Stufe des Bonus</th><th>Gewinn pro Hilfe</th></tr>
                </thead>
                <tbody>
                    <tr><td>0 (nicht freigeschaltet)</td><td>15 s</td></tr>
                    <tr><td>1</td><td>15 s</td></tr>
                    <tr><td>2</td><td>30 s</td></tr>
                    <tr><td>3</td><td>45 s</td></tr>
                    <tr><td>4</td><td>60 s</td></tr>
                    <tr><td>5</td><td>75 s</td></tr>
                </tbody>
            </table>

            <h2 id="foerderbedingungen">Förderfähigkeit eines Baus</h2>
            <p>Damit einem Bau geholfen wird, müssen zwei Bedingungen erfüllt sein:</p>
            <ul>
                <li><strong>Gesamtdauer &gt; 30 Sekunden</strong> (zwischen Beginn und geplantem Ende).</li>
                <li><strong>Verbleibende Zeit &gt; 30 Sekunden</strong> in dem Moment, in dem die Hilfe geleistet wird.</li>
            </ul>
            <p>Fast fertige Bauten (30 s oder weniger verbleibend) profitieren nicht von der Bauhilfe.</p>

            <h2 id="deduplizierung">Eine Hilfe pro Bau</h2>
            <p>Dasselbe Mitglied kann <strong>jedem Bau nur ein einziges Mal</strong> helfen. Das Symbol verschwindet automatisch, wenn es keinen Bau mehr gibt, dem du noch nicht geholfen hast. Mehrere Mitglieder können demselben Bau helfen, und die Gewinne addieren sich: 3 Mitglieder einer Allianz auf Stufe 3 bringen je 45 s, also insgesamt 135 s.</p>

            <h2 id="verknuepfung">Verbindung zu den Allianzverbesserungen</h2>
            <p>Der Gewinn pro Hilfe hängt direkt von der Stufe des Bonus <strong>„Baubonus“</strong> im Reiter <a href="/wiki/alliance_improvements">Verbesserungen</a> ab. In diesen Bonus zu investieren kommt allen zugute: Je schneller deine Verbündeten ihre Gebäude fertigstellen, desto schneller wächst das Imperium der Allianz.</p>

    leveling:
        title: "Stufen und Erfahrung"
        category: "progression"
        order: 1
        tags: "stufe,erfahrung,fortschritt,level,punktzahl,score,punkte"
        summary: "Dein Fortschritt von Stufe 2 bis Stufe 40, gespeist durch das Wachstum deiner Punktzahl."
        related: "war_points,ranking,login_bonus"
        body: |
            <h2 id="calcul">Was für deine Punktzahl zählt</h2>
            <p>Deine Punktzahl (deine <strong>Punkte</strong>, die der Rangliste) misst die <strong>Größe deines Imperiums</strong>. Sie wird einmal täglich beim Tagesbericht um 18:59 Uhr (Pariser Zeit) neu berechnet und addiert:</p>
            <table>
                <tr><th>Element</th><th>Was 1 Punkt wert ist</th></tr>
                <tr><td><strong>Arbeiter</strong></td><td>100 Arbeiter.</td></tr>
                <tr><td><strong>Schiffe im Hangar</strong> (und in Produktion)</td><td>120 thermische Signatur (zum Beispiel 6 Fregatten mit Signatur 20 pro Stück).</td></tr>
                <tr><td><strong>Schiffe in einer Flotte</strong></td><td>20 Signatur (zum Beispiel 1 Fregatte). Ein Schiff in einer Flotte zählt <strong>sechsmal mehr</strong> als im Hangar.</td></tr>
                <tr><td><strong>Legionäre</strong></td><td>500 auf einem Planeten, etwa 83 an Bord einer Flotte.</td></tr>
                <tr><td><strong>Mechs</strong></td><td>25 auf einem Planeten; an Bord einer Flotte ist jeder Mech 2 Punkte wert.</td></tr>
                <tr><td><strong>Wissenschaftler</strong></td><td>Etwa 17 auf einem Planeten, 25 in einer Flotte.</td></tr>
                <tr><td><strong>Geschütztürme</strong></td><td>Jeder Geschützturm ist wert: Raketenwerfer 0,9; Lasergeschütz 0,6; Schweres Lasergeschütz 1,2; Ionenlaser 1,2; Plasma-Artillerie 0,8; Gausskanone 2,4.</td></tr>
                <tr><td><strong>Gebäude</strong> (pro Stufe)</td><td>Niobium-Mine, Wasserextraktor, Agrarfeld: 15 · Bodenradar: 20 · Kaserne: 25 · Aeroponische Farm, Forschungszentrum, Raumwerft: 30 · Niobium-Lager, Wasserreservoir, Agrarsilo: 45 · Waffenfabrik: 50 · Weltraumradar: 60 · Große Stadt: 65 · Radarstörsender: 100 · Metropole: 120 · Verteidigungsfestung: 130 · Schwerindustrie: 150 · Nuklearbasis: 300 · Schwimmende Stadt, Orbitalstation: 2.000. Das Gefängnis und das Sklavenlager bringen keine Punkte.</td></tr>
            </table>
            <p>Die Werte der Truppen sind die Grundwerte: Regimeforschungen, die den Unterhalt der Legionäre, Mechs oder Wissenschaftler senken, senken auch die Punkte, die sie einbringen. Kriegspunkte zählen nicht zur Punktzahl.</p>
            <p>Schiffe im Kampf zu verlieren, ein Gebäude abzureißen oder Truppen sterben zu sehen senkt daher deine Punktzahl beim nächsten Bericht.</p>

            <h2 id="experience">Punktzahl, Erfahrung und Stufe</h2>
            <p>Deine Stufe hängt von deiner <strong>Erfahrung</strong> ab, die nur mit deiner Punktzahl wächst. Wenn bei jedem Tagesbericht deine neue Punktzahl die von vorgestern übersteigt, wird die Differenz zu deiner Erfahrung addiert.</p>
            <p>Beispiel: Deine Punktzahl betrug vorgestern 10.000, gestern 11.000 und heute 12.000: Du erhältst beim heutigen Bericht 2.000 Erfahrungspunkte.</p>
            <p>Sinkt deine Punktzahl, erhältst du an diesem Tag keine Erfahrung, aber du verlierst nie welche: <strong>Deine Stufe sinkt nie wieder</strong>. Die Gesamterfahrung wird im Spiel nicht angezeigt; nur die Stufe.</p>

            <h2 id="seuils">Die Stufengrenzen</h2>
            <p>Jeder Kommandant beginnt auf <strong>Stufe 2</strong> mit 0 Erfahrungspunkten. Zu erreichende Erfahrung für jede Stufe:</p>
            <table>
                <tr><th>Stufe</th><th>Erfahrung</th><th>Stufe</th><th>Erfahrung</th></tr>
                <tr><td>2</td><td>0</td><td>22</td><td>24.000.000</td></tr>
                <tr><td>3</td><td>2.000</td><td>23</td><td>30.000.000</td></tr>
                <tr><td>4</td><td>10.000</td><td>24</td><td>50.000.000</td></tr>
                <tr><td>5</td><td>40.000</td><td>25</td><td>80.000.000</td></tr>
                <tr><td>6</td><td>100.000</td><td>26</td><td>100.000.000</td></tr>
                <tr><td>7</td><td>150.000</td><td>27</td><td>200.000.000</td></tr>
                <tr><td>8</td><td>200.000</td><td>28</td><td>250.000.000</td></tr>
                <tr><td>9</td><td>280.000</td><td>29</td><td>500.000.000</td></tr>
                <tr><td>10</td><td>450.000</td><td>30</td><td>800.000.000</td></tr>
                <tr><td>11</td><td>800.000</td><td>31</td><td>1.000.000.000</td></tr>
                <tr><td>12</td><td>1.000.000</td><td>32</td><td>2.000.000.000</td></tr>
                <tr><td>13</td><td>1.300.000</td><td>33</td><td>3.000.000.000</td></tr>
                <tr><td>14</td><td>2.000.000</td><td>34</td><td>6.000.000.000</td></tr>
                <tr><td>15</td><td>3.000.000</td><td>35</td><td>12.500.000.000</td></tr>
                <tr><td>16</td><td>5.000.000</td><td>36</td><td>25.000.000.000</td></tr>
                <tr><td>17</td><td>7.000.000</td><td>37</td><td>50.000.000.000</td></tr>
                <tr><td>18</td><td>9.000.000</td><td>38</td><td>80.000.000.000</td></tr>
                <tr><td>19</td><td>12.000.000</td><td>39</td><td>100.000.000.000</td></tr>
                <tr><td>20</td><td>15.000.000</td><td>40</td><td>200.000.000.000</td></tr>
                <tr><td>21</td><td>18.000.000</td><td></td><td></td></tr>
            </table>
            <p>Stufe 40 ist das Maximum. Der Fortschritt ist <strong>exponentiell</strong>: Von Stufe 2 auf Stufe 10 geht es viel schneller als von 30 auf 40.</p>

            <h2 id="utilite">Wozu deine Stufe dient</h2>
            <ul>
                <li><strong>Login-Bonus</strong> — die Untergrenze des Tagesbonus beträgt deine Stufe × 5.000 Bitcoins, multipliziert mit einer Ziehung von ×1 bis ×5 (siehe <em>Login-Bonus</em>).</li>
                <li><strong>Schaufenster</strong> — deine Stufe wird auf der Kommandantenkarte (Seite Globale Sicht) und in deinem Profil angezeigt. Die Rangliste richtet sich dagegen nach den Punkten, nicht nach der Stufe.</li>
            </ul>

    war_points:
        title: "Kriegspunkte (KP)"
        category: "progression"
        order: 2
        tags: "kp,kriegspunkte,punkte,krieg,kampf,rangliste,pdg"
        summary: "Die zweite Währung des Spiels, vor allem im Kampf verdient und auszugeben für Bitcoins, Truppen, Elite-Schiffe und Gebäude."
        related: "ranking,quests,spatial_combat"
        body: |
            <h2 id="cest-quoi">Was sind die KP?</h2>
            <p>Die <strong>Kriegspunkte</strong> (<strong>KP</strong>) sind eine zweite Fortschritts-„Währung“, <strong>kampforientiert</strong>. Während deine Stufe das Wachstum deines Imperiums widerspiegelt, spiegeln deine KP deine militärische Aktivität wider. Sie werden in der Ressourcenleiste angezeigt und gelten pro Server: Auf einem neuen Server fängst du bei null an.</p>

            <h2 id="gagner">So bekommst du welche</h2>
            <ul>
                <li><strong>Weltraumkämpfe</strong> — der Sieger erhält KP proportional zur Signatur der zerstörten feindlichen Flotte (1 KP pro 100 Signatur in einem Kampf Flotte gegen Flotte), nie nach seinen eigenen Verlusten. Eine Cthulhu-Horde oder eine Alien-Flotte bringt 5-mal weniger ein als eine Spielerflotte gleicher Signatur (Schutz gegen Farming).</li>
                <li><strong>Einen Weltraumkampf verlieren</strong> — ein Trost wird dir trotzdem gezahlt: 1 KP pro 500 verlorene Signatur, also ein Fünftel dessen, was ein Sieger für dieselbe Flotte bekäme.</li>
                <li><strong>Orbitale Verteidigung</strong> — wenn deine Geschütztürme eine Flotte im Orbit vernichten: 1 KP pro 100 zerstörte Signatur (5-mal weniger gegen einen Cthulhu oder einen Alien). Die Verteidigungen eines gegnerischen Planeten dem Erdboden gleichzumachen bringt dem Angreifer dagegen nichts.</li>
                <li><strong>Raids</strong> — der siegreiche Angreifer erhält 1 KP pro 100 getötete verteidigende Legionäre und Mechs.</li>
                <li><strong>Invasionen</strong> — eine erfolgreiche Invasion bringt sehr wenig: 1 KP pro 60.000 getötete verteidigende Legionäre (ein getöteter Arbeiter zählt als ein Zehntel Legionär).</li>
                <li><strong>Einen Raid oder eine Invasion abwehren</strong> — der Verteidiger erhält etwa 7,5 KP pro 100 getötete angreifende Legionäre.</li>
                <li><strong>Einen Spieler ausschalten</strong> — wenn deine Invasion ihm seinen letzten Planeten nimmt, erhältst du alle seine KP und alle seine Bitcoins.</li>
                <li><strong>Cthulhu</strong> — eine Horde abzuwehren, die deinen Planeten angreift, bringt KP je nach Stärke der Horde, und eine Cthulhu-Blockade zu brechen bringt eine Belohnung in Bitcoins und KP, aufgeteilt nach dem Schaden jedes Einzelnen. Das Tower Defense bringt dagegen Uran, keine KP.</li>
                <li><strong>Tagesziele</strong> — jedes erreichte Ziel bringt KP, und wenn du alle erreichst, zahlt dir der Tagesbericht einen Bonus in Höhe ihrer durchschnittlichen Belohnung (siehe <em>Tägliche Quests</em>).</li>
                <li><strong>Arena (Heldenduelle)</strong> — jedes gewonnene Duell bringt 15 KP pro Stufe deines Helden, verringert bis auf die Hälfte, wenn die beiden Helden sehr unterschiedliche Stufen haben (in beide Richtungen). Beispiele: Held Stufe 10 gegen Stufe 10 = 150 KP; Stufe 10 gegen Stufe 4 = 75 KP. Auch das Podium der wöchentlichen Arena-Rangliste (300 / 200 / 100 KP) und das der Turniere (500 / 300 / 150 KP und 50 KP für jeden Teilnehmer) bringen welche ein.</li>
                <li><strong>Gefängnis</strong> — einen gefangenen Helden hinzurichten bringt 100 KP pro Stufe des Helden.</li>
                <li><strong>Verkauf an Händler</strong> — jeder Verkauf, den eine Flotte liefert, bringt 1 KP pro 5.000 Bitcoins Grundwert (siehe <a href="/wiki/market">Markt und Händler</a>).</li>
                <li><strong>Tutorial</strong> — 500 KP gehören zu seinen Belohnungen.</li>
                <li><strong>Allianzbank</strong> — eine Auszahlung von der Bank deiner Allianz kann dir KP einbringen.</li>
            </ul>
            <p>Die Allianzforschung <strong>Kriegspunkte</strong> (Allianz mindestens Stufe 6) erhöht um 10&nbsp;% pro Stufe, bis zu +50&nbsp;%, die KP, die du im Weltraumkampf, in der orbitalen Verteidigung, im Raid, in der Invasion und beim Verkauf an Händler gewinnst.</p>

            <h2 id="utilite">Wozu sie dienen</h2>
            <ul>
                <li><strong>Shop der Seite Ziele</strong> — tausche deine KP gegen Bitcoins (1 KP = 1 Bitcoin), Legionäre (1 KP = 2 Legionäre) oder Arbeiter (1 KP = 10 Arbeiter), geliefert auf den Planeten deiner Wahl im Rahmen seiner Kapazität.</li>
                <li><strong>Elite-Schiffe</strong> — einige Schiffe werden in KP (und in Arbeitern) bezahlt: Plasmajäger (1 KP), Kampfkorvette (3), Schlachtkreuzer (8), Karavelle (25), Mutterschiff (25.000), pro Einheit.</li>
                <li><strong>Gebäude</strong> — die Schwimmende Stadt und die Orbitalstation kosten 2.000 KP pro angestrebter Stufe (2.000 für Stufe 1, 4.000 für Stufe 2 …).</li>
                <li><strong>Forschung Territorialerweiterung</strong> — 75.000 KP für Stufe 1, 150.000 für Stufe 2.</li>
                <li><strong>Einen Gefangenen foltern</strong> — 200 KP, um die Position eines feindlichen Planeten zu enthüllen.</li>
                <li><strong>Allianzbank</strong> — du kannst dort KP einzahlen.</li>
                <li><strong>Rangliste</strong> — die Spalte „Pdg“ der Kommandant-Rangliste erlaubt es, die militärische Aktivität der Spieler zu vergleichen.</li>
                <li><strong>Paid Server</strong> — der Sieger ist der Spieler mit der höchsten Summe „Punkte + 2 × KP“ am Ende des Servers.</li>
            </ul>

            <h2 id="perdre">Kann man welche verlieren?</h2>
            <ul>
                <li><strong>Durch Ausgeben</strong> — Shop der Seite Ziele, Elite-Schiffe, Schwimmende Stadt, Orbitalstation, Forschung Territorialerweiterung, Folter eines Gefangenen, Einzahlung in die Allianzbank. Eine Schiffsproduktion, einen Bau oder eine Forschung abzubrechen gibt dir die ausgegebenen KP zurück.</li>
                <li><strong>Durch Ausschaltung</strong> — wenn ein Spieler deinen letzten Planeten überfällt, bist du Game Over, und er erhält <strong>alle</strong> deine KP und deine Bitcoins.</li>
                <li><strong>Friedenssteuer</strong> — wenn deine Allianz einen Frieden akzeptiert hat, der einen Tribut in KP zahlt, geht ein Teil der im Kampf gewonnenen KP an die siegreiche Allianz.</li>
            </ul>
            <p>Einen Kampf zu verlieren nimmt dir keine KP (du erhältst sogar einen kleinen Trost), und ein wirtschaftlicher Bankrott berührt sie nicht.</p>

            <h2 id="strategie">Strategie</h2>
            <p>Die KP belohnen <strong>aggressive</strong> Spieler. Wenn du in der Spalte „Pdg“ der Rangliste aufsteigen willst, konzentriere dich auf Weltraumkämpfe, die Verteidigung deiner Planeten, Raids und die Arena statt auf reines Wirtschaftswachstum.</p>

    quests:
        title: "Tägliche Quests"
        category: "progression"
        order: 3
        tags: "quests,taeglich,ziele,mission,belohnung,kp"
        summary: "3 Ziele pro Tag, die du vor dem nächsten Bericht erfüllen musst, bezahlt in Kriegspunkten."
        related: "daily_report,war_points,ranking"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Jeden Tag beim Tagesbericht um <strong>18:59 Uhr (Pariser Zeit)</strong> teilt dir das Spiel <strong>3 tägliche Quests</strong> zu, im Menü „Ziele“ genannt. Das sind kleine Aufgaben, die du während deiner normalen Spielsitzung erledigen kannst.</p>
            <p>Du hast bis zum nächsten Bericht Zeit, sie zu erledigen: Die übrig gebliebenen werden dann gelöscht und durch 3 neue ersetzt.</p>
            <p>Wenn du auf einen Server kommst, sind deine ersten Quests immer dieselben: eine Nachricht im Salon schreiben, den Planeten eines Spielers sondieren und einer Allianz beitreten oder eine gründen (außer im Battle Royale).</p>
            <p>Das Spiel gibt dir nur Quests, die am selben Tag machbar sind: kein Bau ohne die nötige Forschung oder den nötigen Platz, kein Angriff, solange du unter Anfängerschutz stehst, kein Raid und keine Invasion ohne Barge, kein „Einen Planeten kolonisieren“, wenn du schon 20 kolonisierte Planeten besitzt, usw.</p>

            <h2 id="types">Die möglichen Quests</h2>
            <p>Die 3 Quests des Tages werden zufällig aus dieser Liste gezogen (Grundbelohnung in KP):</p>
            <table>
                <tr><th>Quest</th><th>Grundbelohnung</th></tr>
                <tr><td>Eine private Nachricht senden</td><td>250</td></tr>
                <tr><td>Eine Nachricht im Salon schreiben (in einem beliebigen Salon, zu dem du Zugang hast)</td><td>250</td></tr>
                <tr><td>Kriegspunkte ausgeben (im Shop der Seite Ziele)</td><td>250</td></tr>
                <tr><td>Den Planeten eines Spielers sondieren</td><td>250</td></tr>
                <tr><td>Ihren Avatar ändern (wenn du keinen hast)</td><td>250</td></tr>
                <tr><td>Ressourcen an die Händler verkaufen</td><td>500</td></tr>
                <tr><td>Eine neue Kohorte erstellen</td><td>500</td></tr>
                <tr><td>Legionäre ausbilden</td><td>500</td></tr>
                <tr><td>Ihre Schiffe verbessern</td><td>500</td></tr>
                <tr><td>Verteidigungen bauen (Truppen oder Geschütztürme)</td><td>500</td></tr>
                <tr><td>Schiffe bauen</td><td>500</td></tr>
                <tr><td>Einen Schild bauen</td><td>750</td></tr>
                <tr><td>Einen Planeten kolonisieren</td><td>1.000</td></tr>
                <tr><td>Ressourcen recyceln</td><td>1.000</td></tr>
                <tr><td>Das Gebäude Große Stadt bauen</td><td>1.000</td></tr>
                <tr><td>Eine Forschung abschließen</td><td>1.000</td></tr>
                <tr><td>Wissenschaftler ausbilden</td><td>1.000</td></tr>
                <tr><td>Eine gegnerische Flotte zerstören (keine Versorgungsschiffe)</td><td>1.000</td></tr>
                <tr><td>Eine Raumstation bauen</td><td>1.000</td></tr>
                <tr><td>Einen großen Schild bauen</td><td>1.750</td></tr>
                <tr><td>Das Gebäude Metropole bauen</td><td>2.000</td></tr>
                <tr><td>Einer Allianz beitreten/gründen (wenn du keine hast)</td><td>2.000</td></tr>
                <tr><td>Das Gebäude Schwerindustrie bauen</td><td>4.000</td></tr>
                <tr><td>Den Planeten eines Spielers einmarschieren</td><td>4.000</td></tr>
                <tr><td>Den Planeten eines Spielers plündern</td><td>4.000</td></tr>
                <tr><td>Einen Nuklearschlag auf den Planeten eines Spielers starten</td><td>5.000</td></tr>
            </table>
            <p>Bei Gebäuden zählt jeder abgeschlossene Bau, egal welche Stufe. „Eine Forschung abschließen“ gibt es auf Servern nicht, auf denen alle Forschungen von Anfang an freigeschaltet sind.</p>

            <h2 id="recompense">Die Belohnungen</h2>
            <ul>
                <li>Jede abgeschlossene Quest bringt <strong>KP</strong>, sofort gutgeschrieben: Der Gewinn ist der <strong>höhere</strong> Wert aus der Grundbelohnung der Quest und <strong>5&nbsp;% des Durchschnitts der Punkte der Spieler des Servers</strong> (bei jedem Tagesbericht neu berechnet), damit sie auch dann interessant bleibt, wenn die Imperien riesig werden.</li>
                <li>Die auf der Seite Ziele angezeigte Belohnung ist die, die du bekommst.</li>
                <li><strong>Bonus</strong>: Erfüllst du <strong>alle Ziele des Tages</strong> vor dem nächsten Bericht, zahlt dir der Tagesbericht zusätzlich die <strong>durchschnittliche Belohnung dieser Ziele</strong> aus, wie für ein weiteres Ziel.</li>
            </ul>
            <p>Beispiel: Beträgt der Serverdurchschnitt 30.000 Punkte, bringt „Eine private Nachricht senden“ 1.500 KP statt 250, während „Den Planeten eines Spielers einmarschieren“ bei 4.000 bleibt. Bringen dir deine drei Ziele an diesem Tag 15.000, 15.000 und 12.000 KP und erfüllst du alle, zahlt dir der nächste Bericht einen Bonus von 14.000 KP.</p>

            <h2 id="consulter">Wo du sie siehst</h2>
            <p>Deine Quests des Tages stehen auf der Seite <strong>Ziele</strong> (Menü, Zielscheibe-Symbol); ein Badge zeigt, wie viele dir noch bleiben (zum Beispiel 2/3). Jede Quest ist dort mit ihrer Belohnung in KP und ihrer Seltenheit (von 1 bis 5 Sternen) aufgelistet.</p>
            <p>Sie werden automatisch bestätigt: Sobald du die Aktion ausführst, verschwindet die Quest aus der Liste, und eine Meldung „Ziel erreicht“ zeigt deinen Gewinn. Auf derselben Seite kannst du deine KP ausgeben (Bitcoins, Legionäre, Arbeiter).</p>

    ranking:
        title: "Die Ranglisten"
        category: "progression"
        order: 4
        tags: "rangliste,rang,position,top,leaderboard"
        summary: "Mehrere Ranglisten, um deinen Fortschritt (und den deiner Rivalen) zu messen."
        related: "war_points,leveling,arena,achievements,cthulhu_prophecies"
        body: |
            <h2 id="types">Die verfügbaren Ranglisten</h2>
            <table>
                <tr><th>Rangliste</th><th>Basiert auf</th><th>Belohnung</th></tr>
                <tr><td><strong>Kommandant-Rangliste</strong></td><td>Deinen <strong>Punkten</strong>: Arbeiter, Schiffe, Truppen, Geschütztürme und Gebäude (siehe <em>Stufen und Erfahrung</em>). Die Spalten Position, Benutzername, Planeten, Punkte und <strong>Pdg</strong> (Kriegspunkte) lassen sich per Klick sortieren.</td><td>Keine direkte Belohnung. Beim Schließen des Servers schaltet ein Platz in den Top 10 den Erfolg <em>Elite</em> frei, und der Sieger erhält <em>Imperator</em>.</td></tr>
                <tr><td><strong>Allianz-Rangliste</strong></td><td>Summe der Punkte der Mitglieder (die ersten 100 Allianzen des Servers).</td><td>Keine direkte Belohnung.</td></tr>
                <tr><td><strong>Duell-Rangliste</strong> (Arena)</td><td>Siegquote deines Haupthelden in Duellen (Siege ÷ ausgetragene Duelle), ab 5 Duellen.</td><td>Jeden Montag erhalten die 3 Helden, die in der vergangenen Woche die meisten Duelle gewonnen haben (mindestens 5 Duelle in der Woche), 300 / 200 / 100 KP und 3.000 / 2.000 / 1.000 Uran.</td></tr>
                <tr><td><strong>Rangliste der Allianzen während einer Cthulhu-Blockade</strong></td><td>Was jede Allianz während der Blockade gegen den Schwarm leistet.</td><td>Produktionsbonus oder -malus für 72&nbsp;Stunden (siehe <em>Die Prophezeiungen von Cthulhu</em>).</td></tr>
            </table>
            <p>Die Punkte und Positionen der Kommandant-Rangliste werden einmal täglich beim Tagesbericht (18:59 Uhr, Pariser Zeit) neu berechnet; neben jedem Spieler zeigen ein Pfeil und eine Zahl die Entwicklung seit dem vorherigen Bericht. Die Kriegspunkte sind dagegen immer aktuell.</p>

            <h2 id="consulter">Wo du sie siehst</h2>
            <p>Öffne die Seite <strong>Globale Sicht</strong>: Auf der Karte deines Kommandanten öffnet der Link <strong>„Rang: N“</strong> die Kommandant-Rangliste, und der Name deiner Allianz öffnet die Allianz-Rangliste. Dein Rang ist also auf dieser Karte immer sichtbar.</p>
            <p>In der Kommandant-Rangliste kannst du einen Spieler nach seinem Spielernamen oder dem Tag seiner Allianz suchen und jede Spalte sortieren. Deine Zeile wird hervorgehoben, ebenso die deiner Verbündeten und deiner Feinde. Auf der ersten Seite vergleicht ein Diagramm die Entwicklung deiner Punkte und deiner KP mit dem Durchschnitt des Servers.</p>
            <p>Die Duell-Rangliste findest du auf der Seite <strong>Held</strong>, im Reiter <strong>Arena</strong>. Die Rangliste einer Blockade wird während des Events auf der Seite <strong>Cthulhu</strong> angezeigt.</p>

            <h2 id="utilite">Warum das zählt</h2>
            <ul>
                <li><strong>Strategisch</strong> — erkenne die großen Spieler, denen du ausweichen oder die du ins Visier nehmen solltest.</li>
                <li><strong>Sozial</strong> — Schaufenster, um für deine Allianz zu rekrutieren.</li>
                <li><strong>Wettbewerb</strong> — im <strong>Paid Server</strong> ist der Sieger der Spieler mit der höchsten Summe „Punkte + 2 × Kriegspunkte“ am Ende des Servers. Auf allen Servern zählt dein Endrang für deine Erfolge (Top 10 = <em>Elite</em>).</li>
            </ul>

    heroes:
        title: "Dein Held"
        category: "progression"
        order: 5
        tags: "held,haupthheld,bonus,planet,flotte,xp,gefangennahme,gefaengnis,spezialisierung"
        summary: "Dein persönlicher Held: Er entwickelt sich, kämpft, stärkt dein Imperium und kann gefangen genommen werden."
        related: "items,prison,arena,spatial_combat,invasion,secondary_heroes"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Jeder Spieler besitzt <strong>einen einzigen Haupthelden</strong>, der zu Spielbeginn erstellt wird. Dieser Held muss <strong>immer</strong> entweder einem Planeten oder einer Flotte zugewiesen sein — nie frei. Du kannst zusätzlich eine <strong>unbegrenzte Zahl von Nebenhelden</strong> besitzen — siehe den eigenen Artikel dazu.</p>
            <p>Solange du keinen Haupthelden hast — zu Spielbeginn oder nach seiner Hinrichtung im Gefängnis —, führt dich das Spiel zu seiner Erstellung zurück&nbsp;: Die Spielseiten bleiben bis dahin gesperrt, die Seiten deines Kontos bleiben zugänglich. Belegt einer deiner Nebenhelden den für den neuen Helden gewählten Planeten, kommt er zurück in die <strong>Reserve</strong>.</p>
            <p>Der Held bringt Boni je nach seinen Fähigkeiten, seiner Spezialisierung, seiner Stufe und seinen Items. Seine 4 Fähigkeiten sind: <strong>Angriff</strong>, <strong>Verteidigung</strong>, <strong>Intelligenz</strong> und <strong>Geschwindigkeit</strong>. Jeder investierte Punkt ist <strong>+1&nbsp;%</strong> wert:</p>
            <ul>
                <li><strong>Angriff</strong>: Feuerkraft der Flotte, die er begleitet.</li>
                <li><strong>Verteidigung</strong>: Panzerung der Flotte, die er begleitet; auf einem Planeten Bodenverteidigung gegen Cthulhu-Landungen.</li>
                <li><strong>Intelligenz</strong>: Produktion von Niobium, Wasser und Nahrung des Planeten, dem er zugewiesen ist (und nur dieses).</li>
                <li><strong>Geschwindigkeit</strong>: Flugzeit der Flotte, die er begleitet (−1&nbsp;% pro Punkt, Gesamtreduktion auf 90&nbsp;% begrenzt).</li>
            </ul>
            <p>Angriff und Verteidigung spielen bei Bodenkämpfen zwischen Spielern (Raid, Invasion) keine Rolle: Nur die Spezialisierung Militär und ihre Eigenschaften zählen dort. Im Arena-Duell fließen alle vier Fähigkeiten in die Punktzahl ein: Die Intelligenz speist die List und die Geschwindigkeit den Schwung (siehe den Artikel <em>PvP-Arena</em>).</p>

            <h2 id="specialites">Spezialisierungen</h2>
            <p>Jede Spezialisierung verleiht einen passiven Bonus, hebt die Obergrenze von einer oder zwei Fähigkeiten an und schaltet 3 Eigenschaften auf den Stufen 5, 10 und 15 frei:</p>
            <ul>
                <li><strong>Militär</strong>: +5&nbsp;% Feuerkraft für die Flotte, die er begleitet; auf einem Planeten +5&nbsp;% beim Feuer der Geschütztürme und bei der Bodenverteidigung; am Boden zwischen Spielern +5&nbsp;% Stärke seiner Seite (im Angriff wie in der Verteidigung); +5&nbsp;% im Arena-Duell. Obergrenze von Angriff und Verteidigung auf 50&nbsp;% angehoben. Eigenschaften: <strong>Einschüchterung</strong> (Stufe 5, der Gegner erleidet −5&nbsp;% Angriffsstärke, auch gegen den Cthulhu, und −5&nbsp;% Punktzahl im Duell), <strong>Taktiker</strong> (Stufe 10, +10&nbsp;% Stärke in der ersten Runde deiner Kämpfe und +10&nbsp;% im Duell), <strong>Kriegsherr</strong> (Stufe 15, −5&nbsp;% Verluste deiner Bodentruppen im Kampf zwischen Spielern und +5&nbsp;% Stärke im Duell).</li>
                <li><strong>Wirtschaft</strong>: verdoppelt die Boni der Intelligenz (Produktion, einschließlich Produktions-Items) und des Sklavenlagers des Planeten, dem er zugewiesen ist. Obergrenze der Intelligenz auf 50&nbsp;% angehoben. Eigenschaften: <strong>Effizient</strong> (Stufe 5: auf der Heldenkarte als −10&nbsp;% Bauzeit angezeigt, diese Eigenschaft hat keine Wirkung auf Bauten), <strong>Händler</strong> (Stufe 10, +15&nbsp;% bei Verkäufen an Händler durch seine Flotte oder von seinem Planeten aus), <strong>Magnat</strong> (Stufe 15, +20&nbsp;% Produktion auf seinem Planeten).</li>
                <li><strong>Entdecker</strong>: +5&nbsp;% Präzision für die Flotte, die er begleitet, und verdoppelt seinen Geschwindigkeitsbonus (Items eingeschlossen) für die Flugzeit. Obergrenze der Geschwindigkeit auf 50&nbsp;% angehoben. Eigenschaften: <strong>Späher</strong> (Stufe 5, +1 Radarstärke auf dem Planeten, dem er zugewiesen ist), <strong>Navigator</strong> (Stufe 10, −15&nbsp;% zusätzliche Flugzeit für seine Flotte), <strong>Kartograf</strong> (Stufe 15, +2 weitere Radarstärke, also insgesamt +3 mit Späher).</li>
            </ul>

            <p>Im <strong>Arena-Duell</strong> gelten dieselben Regeln: Der Militär behält seine +5&nbsp;% und seine drei Eigenschaften, beim Wirtschaftler speist seine verdoppelte Intelligenz (plus 20&nbsp;% mit Magnat) die List, und beim Entdecker speist seine verdoppelte Geschwindigkeit (plus 15&nbsp;% mit Navigator) den Schwung. List und Schwung zählen mit 60&nbsp;% ihres Wertes.</p>
            <p>Eine detaillierte Zusammenfassung dieser Boni wird bei der Erstellung des Helden automatisch angezeigt.</p>

            <h2 id="xp">Erfahrung sammeln</h2>
            <p>XP gewinnt man auf mehrere Arten:</p>
            <ul>
                <li><strong>Kampf</strong>: ein fester Anteil (Sieg im Weltraumkampf 150 XP, gewonnener Raid 100, erfolgreiche Invasion 200, Niederlage 25), plus ein Anteil, der von der Stärke des Feindes abhängt: seine Signatur ÷ 150, geteilt durch die Stufe des Helden. Beispiel: Ein Held der Stufe 5, der eine Flotte mit 30.000 Signatur zerstört, erhält 150 + 40 = 190 XP.</li>
                <li><strong>Arena-Duell</strong> (und jeder Turnierkampf): nur der Sieger erhält XP, von 30 XP für einen deutlichen Sieg bis 90 XP für ein sehr knappes Duell. Der Verlierer erhält keine.</li>
                <li><strong>Passiv</strong>: Ein einem Planeten (nicht einer Flotte) zugewiesener Held erhält 5 XP pro Stunde Abwesenheit, gutgeschrieben bei deiner Rückkehr (40 XP nach 8 Stunden Abwesenheit). Kurz aufeinanderfolgende Logins im Abstand von weniger als 12 Minuten bringen keine.</li>
            </ul>
            <p>Alle gewonnenen XP werden durch den XP-Bonus deiner Allianz erhöht und, wenn der Held einem Planeten mit Sklavenlager zugewiesen ist, um +5&nbsp;% pro dort festgehaltenem Gefangenen (höchstens +25&nbsp;%). Ein gefangener Held erhält keine XP.</p>
            <p>Um von Stufe N auf Stufe N+1 aufzusteigen, braucht es N × 500 XP: 500 XP, um Stufe 2 zu erreichen, 5.000 XP, um von Stufe 10 auf Stufe 11 zu kommen, und insgesamt 22.500 XP, um Stufe 10 zu erreichen. Jede gewonnene Stufe gibt <strong>2 Fähigkeitspunkte</strong>, die du auf der Seite Held verteilst. Jeder Punkt ist +1&nbsp;% in der gewählten Fähigkeit wert, bis zu 30&nbsp;% pro Fähigkeit (50&nbsp;% für die Fähigkeit(en) deiner Spezialisierung). Item-Boni kommen über diese Obergrenzen hinaus dazu.</p>

            <h2 id="assignation">Zuweisung</h2>
            <p>Weise deinen Helden über die Seite <strong>Held</strong> zu (Button „Held neu zuweisen“), über die Seite <strong>Planeten</strong> (Button „Held zuweisen“ eines Planeten) oder über die Verwaltungsseite einer <strong>Flotte</strong> (Button „Zuweisen“). Die Änderung erfolgt sofort, ohne Reisezeit.</p>
            <p>Ein Planet oder eine Flotte kann nur einen einzigen Helden aufnehmen. Ein Planet unter Embargo kann keinen Helden aufnehmen, und ein auf einem Planeten unter Embargo stationierter Held kann sich keiner Flotte anschließen. Ein Held auf einer fliegenden oder kämpfenden Flotte kann nicht neu zugewiesen werden.</p>
            <p>Wird seine Flotte zerstört und er nicht gefangen genommen, geht der Held auf dem Planeten des Kampfes an Land, wenn dieser dir gehört und keinen Helden hat; andernfalls auf deinem ältesten Planeten ohne Helden. Haben alle deine Planeten schon einen Helden, nimmt dein Hauptheld den Platz eines deiner Nebenhelden ein, der zurück in die Reserve kommt.</p>

            <h2 id="capture">Gefangennahme</h2>
            <p>Dein Hauptheld kann in einem Kampf gefangen genommen werden:</p>
            <ul>
                <li><strong>Weltraumkampf gegen Flotten</strong> (deine Flotte wird zerstört): 20&nbsp;% Wahrscheinlichkeit. Die Zerstörung deiner Flotte allein durch die Verteidigungen eines Planeten oder durch eine unbewaffnete Flotte nimmt deinen Haupthelden nicht gefangen.</li>
                <li><strong>Invasion</strong> des Planeten, dem er zugewiesen ist: 35&nbsp;% Wahrscheinlichkeit. Der Held an Bord der Invasionsflotte riskiert nie die Gefangennahme, auch wenn die Invasion scheitert, und ein Raid nimmt nie gefangen.</li>
            </ul>
            <p>Eine Gefangennahme erfordert ein <strong>Gebäude Gefängnis der Stufe 1 oder höher</strong>: Der Held wird am Ort des Kampfes eingesperrt, wenn dieser dem Sieger gehört und ein Gefängnis trägt, andernfalls auf dem Planeten des Siegers mit dem höchsten Gefängnis. Ohne irgendein Gefängnis gibt es keine Gefangennahme.</p>
            <p>Nach der Freilassung genießt der Held <strong>24 Std. Immunität</strong> gegen erneute Gefangennahme.</p>
            <p>Nur ein Spieler kann deinen Haupthelden gefangen nehmen: Weder die Cthulhu noch die KI-Kommandanten tun es. Achtung, die KI-Kommandanten können dagegen deine Nebenhelden gefangen nehmen oder hinrichten.</p>
            <p>Dieser Abschnitt beschreibt deinen <strong>Haupthelden</strong>. Deine <strong>Nebenhelden</strong> folgen einer völlig anderen Regel der Gefangennahme, ohne Wahrscheinlichkeit — siehe den Artikel <em>Nebenhelden</em>.</p>

    secondary_heroes:
        title: "Nebenhelden"
        category: "progression"
        order: 6
        tags: "held,nebenheld,stall,gefangennahme,hinrichtung,gefaengnis,recycling,reserve,beute"
        summary: "Zusätzliche Helden, die als seltene Beute erhalten werden: dieselben Boni wie dein Hauptheld, aber im Kampf können sie gefangen genommen oder endgültig hingerichtet werden."
        related: "heroes,prison,spatial_combat,invasion,raid,arena"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Ein Nebenheld bringt <strong>dieselben Boni</strong> wie ein Hauptheld, sobald er auf einem Planeten oder einer Flotte platziert ist. Was ihn unterscheidet: Er kann bei einer Niederlage <strong>gefangen genommen oder endgültig getötet</strong> werden. Du kannst mehrere ansammeln, zusätzlich zu deinem Haupthelden.</p>

            <h2 id="erwerb">So erhältst du sie</h2>
            <p>Ein Nebenheld ist eine <strong>seltene Beute</strong>, nie käuflich:</p>
            <table>
                <thead>
                    <tr><th>Quelle</th><th>Chance</th></tr>
                </thead>
                <tbody>
                    <tr><td>Sieg im Cthulhu-Tower-Defense (pro Run)</td><td>2&nbsp;%</td></tr>
                    <tr><td>Abgewehrter Cthulhu-Angriff auf einen deiner Planeten (abgewehrte Landung oder im Orbit vernichtete Horde)</td><td>1&nbsp;%</td></tr>
                    <tr><td>Sieger eines Arena-Turniers</td><td>25&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Beim Erhalt ist er Stufe 1, sein Name und seine Spezialisierung werden zufällig gezogen, und er kommt direkt in die <strong>Reserve</strong> — du entscheidest, wohin du ihn platzierst, oder ob du ihn recycelst, ohne ihn je zu platzieren.</p>

            <p>Jeder erhaltene Held wird dir durch einen <strong>Bericht</strong> angekündigt, der angibt, woher er kommt. Der Endbildschirm des Tower Defense und der Siegbericht gegen die Cthulhu weisen ebenfalls im Moment selbst darauf hin.</p>

            <h2 id="platzierung">Wohin du sie platzierst</h2>
            <p>Wie bei deinem Haupthelden: auf <strong>einen Planeten</strong> oder auf <strong>eine Flotte</strong>, nie auf beides zugleich. Ein nicht platzierter Nebenheld bleibt in der <strong>Reserve</strong>: kein Bonus, aber auch <strong>kein Risiko</strong> — das ist eine normale Wahl, kein Versehen, das du korrigieren müsstest. Verwalte alle deine Nebenhelden im Reiter <strong>Stall</strong> der Seite Held: Button „Zuweisen“, um ihn zu platzieren, „In die Reserve zurückholen“, um ihn abzuziehen.</p>

            <h2 id="verwaltung">Fähigkeiten und Ausrüstung</h2>
            <p>Ein Nebenheld entwickelt sich wie der Hauptheld: Er gewinnt Stufen und damit <strong>Fähigkeitspunkte</strong>. Der Button <strong>Verwalten</strong> des Stalls öffnet deren Verteilung auf Angriff, Verteidigung, Intelligenz und Geschwindigkeit.</p>
            <p>Dasselbe Panel verwaltet seine <strong>Ausrüstung</strong>: Gib ihm ein freies Item aus deinem Inventar oder nimm es zurück. Die Items eines gefangenen feindlichen Helden kommen mit ihm zu dir zurück — so holst du sie dir.</p>

            <h2 id="risiko">Was du riskierst</h2>
            <p>Ein platzierter Nebenheld kann <strong>endgültig</strong> verloren gehen bei:</p>
            <ul>
                <li>einem verlorenen <strong>Weltraumkampf</strong> (seine Flotte wird zerstört).</li>
                <li>einem verlorenen <strong>Versorgungskampf</strong> (Flotte ohne jede Waffe, vernichtet, ohne überhaupt zu kämpfen).</li>
                <li>einer erfolgreichen <strong>Invasion</strong> des Planeten, auf dem er stationiert ist.</li>
                <li>der Zerstörung seiner Flotte durch die <strong>Orbitalverteidigung</strong> eines Planeten im Angriffsmodus.</li>
            </ul>
            <p>Dagegen riskiert er <strong>nichts</strong> bei:</p>
            <ul>
                <li>dem <strong>Bodenkampf eines Raids</strong> — selbst erfolgreich nimmt ein Raid den Planeten nie ein. Wird dagegen die Flotte, die ihn transportiert, im Orbit zerstört, ist er wie bei jeder zerstörten Flotte gefährdet.</li>
                <li>einem Kampf gegen die <strong>Cthulhu</strong> (oder gegen den Händler). Achtung: Die <strong>KI-Kommandanten</strong> folgen derselben Regel wie die Spieler und können deine Nebenhelden gefangen nehmen oder hinrichten.</li>
                <li>der <strong>Arena</strong> — Duelle und Turniere setzen keinen Helden der Gefangennahme aus.</li>
            </ul>

            <p>Eine <strong>Benachrichtigung</strong> warnt dich, sobald einer deiner Nebenhelden gefangen genommen oder hingerichtet wird: Ein endgültiger Verlust hängt nicht davon ab, ob du deinen Bericht öffnest.</p>

            <h2 id="gefaengnis">Die Gefängnis-Bedingung</h2>
            <p>Anders als bei deinem Haupthelden (<em>wahrscheinlichkeitsbasierte</em> Gefangennahme, siehe den Artikel <em>Gefängnis und gefangene Helden</em>) ist das Schicksal eines besiegten Nebenhelden <strong>vollständig deterministisch</strong>, ohne den geringsten Zufall:</p>
            <ul>
                <li>Der Sieger besitzt ein <strong>Gebäude Gefängnis</strong> der Stufe 1 oder höher auf mindestens einem seiner Planeten → er <strong>nimmt</strong> den Helden <strong>gefangen</strong>, mit unversehrter Stufe, Erfahrung und unversehrten Items.</li>
                <li>Der Sieger hat <strong>kein</strong> Gefängnis gebaut → der Held wird <strong>hingerichtet</strong>, und seine Items kommen ins Inventar des Siegers.</li>
            </ul>
            <p>Im Blockkampf (mehrere Verbündete Seite an Seite) fällt der Held an den siegreichen Kommandanten, der <strong>die meiste Stärke</strong> in den Kampf eingebracht hat — hat er kein Gefängnis, wird der Held hingerichtet, auch wenn ein Verbündeter derselben Seite eines besaß.</p>
            <p>Ein gefangener Nebenheld ist <strong>kein</strong> klassischer Gefangener: keine Gefängnisseite, keine Flucht, kein Lösegeld. Er kommt direkt, aktiv, in den Stall seines neuen Besitzers, in die Reserve, bereit, platziert oder recycelt zu werden.</p>

            <h2 id="keine-rueckgewinnung">Keine Rückgewinnung möglich</h2>
            <p>Einmal gefangen genommen oder hingerichtet, ist ein Nebenheld <strong>endgültig</strong> verloren: Weder Flucht noch Lösegeld noch eine Befreiung durch Invasion seines früheren Besitzers können ihn zurückholen. Der einzige Weg, ihn eines Tages wiederzusehen, ist, ihn selbst im Kampf zurückzuerobern — und so kann er endlos von Imperium zu Imperium weiterwandern.</p>

            <h2 id="identitaet">Ein gefangener Held behält seine Identität</h2>
            <p>Ein gefangener Nebenheld behält seinen <strong>Namen</strong>, seine <strong>Stufe</strong> und seine <strong>Erfahrung</strong>. In deinem Stall zeigt er seinen ursprünglichen Kommandanten an („Erbeutet von …“).</p>

            <h2 id="recycling">Das Recycling</h2>
            <p>Du kannst einen deiner Nebenhelden <strong>recyceln</strong> (Button „Recyceln“ des Stalls): Er wird zerstört, und dein Hauptheld erhält <strong>90&nbsp;%</strong> der gesamten Erfahrung, die dieser Nebenheld seit Stufe 1 gesammelt hat (die XP-Boni der Allianz gelten dafür nicht). Seine Items kehren in dein Inventar zurück.</p>
            <p>Beispiel: Ein Nebenheld der Stufe 10 bringt 20.250 XP, genug, um einen Haupthelden von Stufe 10 auf Stufe 13 zu bringen.</p>
            <p>Eine Vorschau mit Zahlen (übertragene XP, projizierte Stufe des Haupthelden) wird vor der Bestätigung angezeigt. Das Recycling ist unmöglich, solange seine Flotte fliegt oder kämpft. <strong>Unwiderrufliche Aktion.</strong></p>

    items:
        title: "Heldenitems"
        category: "progression"
        order: 6
        tags: "items,ausruestung,bonus,seltenheit,drop,cthulhu,fusion"
        summary: "Rüste deinen Helden mit bis zu 3 Items aus, um Boni zu kumulieren. Wie du sie erhältst."
        related: "heroes,cthulhus,arena,login_bonus"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Items sind Gegenstände, die du deinen Helden anlegen kannst (höchstens <strong>3 Items</strong> pro Held). Ihre Boni addieren sich zu denen des Helden, über die Fähigkeitsobergrenzen hinaus. Was sie bringen, hängt von ihren Bonustypen ab, die weiter unten beschrieben werden.</p>

            <h2 id="categories">Kategorien</h2>
            <ul>
                <li><strong>Offensiv</strong> (Waffen), <strong>Defensiv</strong> (Rüstungen, Schilde) und <strong>Macht</strong> (Statusobjekte).</li>
            </ul>
            <p>Die Kategorie ändert nur Name und Aussehen des Items: Seine Boni werden unabhängig von seiner Kategorie zufällig aus allen Typen gezogen. Schau also auf die Boni, die auf der Karte angezeigt werden, nicht auf die Kategorie. Es gibt keine Typbeschränkung: Du kannst 3 offensive Items anlegen, wenn du willst.</p>

            <h2 id="raretes">Seltenheiten</h2>
            <ul>
                <li><strong>Gewöhnlich</strong>: 1 Bonus (+2 bis 5&nbsp;%)</li>
                <li><strong>Selten</strong>: 1 oder 2 Boni (je +5 bis 10&nbsp;%)</li>
                <li><strong>Episch</strong>: 2 oder 3 Boni (je +10 bis 15&nbsp;%)</li>
                <li><strong>Legendär</strong>: 3 oder 4 Boni (je +15 bis 25&nbsp;%)</li>
            </ul>
            <p>Jeder Bonus wird bei der Erstellung des Items zufällig aus der Spanne seiner Seltenheit gezogen und ändert sich danach nicht mehr.</p>
            <p>Die Stufe des Helden ändert die Boni eines Items nicht: Sie addieren sich unverändert, egal ob der Held Stufe 1 oder 20 ist. Nur die Spezialisierung zählt: Ein Held der Wirtschaft verdoppelt die Produktions-Boni und ein Entdecker die Boni der Flottengeschwindigkeit. Im Duell bringt dasselbe Item einem Helden hoher Stufe mehr Punkte, weil die Punktzahl proportional zur Stufe ist, bei gleichem Anteil an seiner Punktzahl.</p>

            <h2 id="bonus">Bonustypen</h2>
            <p>Es gibt 16 Bonustypen. Hier siehst du, wo jeder wirkt (die Namen sind die auf den Karten angezeigten):</p>
            <table>
                <thead>
                    <tr><th>Bonus</th><th>Wirkung</th></tr>
                </thead>
                <tbody>
                    <tr><td>Flottenangriff, Flottenverteidigung, Flottenpräzision, Flottenschild</td><td>Kämpfe der Flotte, die der Held begleitet.</td></tr>
                    <tr><td>Flottengeschwindigkeit</td><td>Flugzeit der Flotte, die der Held begleitet.</td></tr>
                    <tr><td>Produktion</td><td>Produktion von Niobium, Wasser und Nahrung des Planeten, dem der Held zugewiesen ist.</td></tr>
                    <tr><td>Legionärskraft</td><td>Bodenverteidigung des Planeten, dem der Held zugewiesen ist, nur gegen Cthulhu-Landungen.</td></tr>
                    <tr><td>Duellkraft</td><td>Punktzahl im Arena-Duell.</td></tr>
                    <tr><td>Mech-Kraft, Baugeschwindigkeit, Arbeiterproduktion, Raumschiffproduktion, Radarreichweite, Recyclinggeschwindigkeit, Cthulhu-Schaden, XP-Gewinn</td><td>Diese Boni wirken nur im Arena-Duell.</td></tr>
                </tbody>
            </table>
            <p>Im Arena-Duell zählen alle 16 Typen, mit einem Gewicht, das vom Typ abhängt (siehe den Artikel <em>PvP-Arena</em>). Ein Flottenbonus, den ein einem Planeten zugewiesener Held trägt, wirkt nur im Duell.</p>

            <h2 id="obtention">Erwerb</h2>
            <p>Hier sind alle Wege, Items zu erhalten:</p>

            <h3>Gegen die Cthulhu kämpfen</h3>
            <p>Ein Item kann fallen, wenn du Cthulhu besiegst, egal ob du ihre Landung am Boden abwehrst oder ihre Horde im Orbit vollständig vernichtest, bevor sie landet. Die Chancen sind in beiden Fällen gleich und hängen von deinem PvE-Schwierigkeitsgrad ab:</p>
            <ul>
                <li><strong>Leicht</strong>: 30&nbsp;% Chance auf ein Item (22&nbsp;% gewöhnlich, 7&nbsp;% selten, 1&nbsp;% episch)</li>
                <li><strong>Normal</strong>: 40&nbsp;% Chance (25&nbsp;% gewöhnlich, 10&nbsp;% selten, 4,5&nbsp;% episch, 0,5&nbsp;% legendär)</li>
                <li><strong>Schwer</strong>: 50&nbsp;% Chance (25&nbsp;% gewöhnlich, 15&nbsp;% selten, 8&nbsp;% episch, 2&nbsp;% legendär)</li>
            </ul>
            <p>Eine im Orbit nur teilweise zerstörte Horde landet trotzdem: Dann löst diese Landung die Ziehung aus, nie beides zugleich.</p>

            <h3>Siege in der Arena</h3>
            <p>Jeder Sieg im Arena-Duell, Turnierkämpfe eingeschlossen, bietet eine Item-Chance:</p>
            <ul>
                <li><strong>Gewöhnlich</strong>: 10&nbsp;%</li>
                <li><strong>Selten</strong>: 4&nbsp;%</li>
                <li><strong>Episch</strong>: 1&nbsp;%</li>
            </ul>
            <p>Also etwa 15&nbsp;% Chance auf ein Item bei jedem Sieg.</p>

            <h3>Einsätze im Duell</h3>
            <p>Wenn du eine Herausforderung sendest, kannst du ein Item einsetzen. Nimmt der Gegner an, muss er ein Item derselben Seltenheit einsetzen. Der Sieger gewinnt beide Items.</p>

            <h3>Weitere Quellen</h3>
            <ul>
                <li><strong>Cthulhu-Tower-Defense</strong>: Jeder Sieg berechtigt zu einer Ziehung nach den Chancen deines Schwierigkeitsgrads oben (zwei Ziehungen auf Schwer).</li>
                <li><strong>Arena-Turniere</strong>: garantiertes episches Item für den 1., seltenes für den 2. und 3., 10&nbsp;% Chance auf ein gewöhnliches für die übrigen Teilnehmer (siehe den Artikel <em>PvP-Arena</em>).</li>
                <li><strong>Login-Bonus</strong>: ein gewöhnliches Item am 3. Tag deiner Serie, ein seltenes am 7.</li>
            </ul>

            <h3>Drei Items fusionieren</h3>
            <p>Drei Items <strong>derselben Seltenheit</strong> verschmelzen zu einem Item der nächsthöheren Seltenheit, ohne Kosten oder Wartezeit. Kategorie und Boni des neuen Items werden zufällig gezogen, wie bei einem im Kampf gefundenen Item. Die drei ursprünglichen Items werden endgültig verbraucht, und ein von einem Helden getragenes Item muss zuerst abgelegt werden. Legendär ist die höchste Seltenheit: Es lässt sich nicht fusionieren.</p>
            <p>Die Fusion wird auf der Seite <strong>Held</strong>, im Reiter <strong>Fusion</strong> gestartet: Klicke drei Item-Karten an, um sie auszuwählen (die ganze Karte ist anklickbar), und bestätige dann mit dem Fusions-Button, der oben wie unten in der Liste verfügbar ist.</p>

            <h2 id="vol">Item-Diebstahl</h2>
            <p>Wird dein Hauptheld gefangen genommen, kann jedes seiner angelegten Items vom Sieger gestohlen werden. Diebstahlwahrscheinlichkeit: Gewöhnlich 80&nbsp;%, Selten 60&nbsp;%, Episch 40&nbsp;%, Legendär 25&nbsp;%.</p>
            <p>Die nicht gestohlenen Items bleiben während seiner Gefangenschaft bei deinem Helden: Er behält sie, wenn er freigelassen wird, aber der Kerkermeister erhält sie alle, wenn er ihn hinrichtet. Ein gefangener Nebenheld nimmt alle seine Items zu seinem neuen Besitzer mit.</p>

            <h2 id="inventaire">Inventar</h2>
            <p>Dein Inventar erreichst du über die Seite <strong>Held</strong>, Reiter <strong>Inventar</strong>. Im Inventar kannst du:</p>
            <ul>
                <li>ein Item deinem Haupthelden <strong>anlegen</strong> (wenn er nicht gefangen ist, weniger als 3 Items trägt und nicht an Bord einer fliegenden oder kämpfenden Flotte ist). Nebenhelden werden über den Reiter <strong>Stall</strong> ausgerüstet (Button „Verwalten“).</li>
                <li>ein Item <strong>ablegen</strong>, um es zurück ins Inventar zu legen (unmöglich, solange seine Flotte fliegt oder kämpft).</li>
                <li>ein Item <strong>zerstören</strong>, das du nicht mehr brauchst.</li>
                <li>3 Items derselben Seltenheit zu einem Item der nächsthöheren Seltenheit <strong>fusionieren</strong>, über den benachbarten Reiter <strong>Fusion</strong>.</li>
            </ul>
            <p>Jedes Item wird als <strong>illustrierte Karte</strong> dargestellt, die sein Bild, seine Boni und einen farbigen Rand je nach Seltenheit zeigt. Die Karten sind in einem Raster angeordnet (3 bis 4 pro Zeile je nach verfügbarem Platz auf deinem Bildschirm).</p>

    prison:
        title: "Gefängnis und gefangene Helden"
        category: "progression"
        order: 7
        tags: "gefaengnis,gefangennahme,held,flucht,folter,loesegeld,kerker,nebenheld"
        summary: "Was passiert, wenn ein Held gefangen genommen wird? Die Optionen des Gefangenen und des Kerkermeisters sowie die direkte Gefangennahme gegnerischer Nebenhelden."
        related: "heroes,items,buildings,invasion,secondary_heroes"
        body: |
            <h2 id="capture">Gefangennahme eines Helden</h2>
            <p>Ein Hauptheld wird bei einem Weltraumkampf gegen Flotten (20&nbsp;%) oder bei der Invasion des Planeten, dem er zugewiesen ist (35&nbsp;%), gefangen genommen — Details im Artikel <em>Dein Held</em>. Der gefangene Spieler ist eingesperrt: Jede Seite außerhalb des erlaubten Bereichs leitet ihn auf die <strong>Gefängnisseite</strong> um. Er behält jedoch Zugang zum <strong>Allianzsalon</strong>, zu seinen <strong>privaten Nachrichten</strong>, zu seinen <strong>Berichten</strong>, zur <strong>Ansicht</strong> (nur Lesen) seiner Allianz, zur <strong>Verwaltung seines Kontos</strong> und zum <strong>Serverwechsel</strong>. Alles andere — Bau, Flotten, Karte, Markt, Arena und sogar die Seite Held — bleibt unzugänglich, bis er freigelassen wird.</p>
            <p>Eine Gefangennahme erfordert ein <strong>Gebäude Gefängnis der Stufe 1 oder höher</strong>: Der Held wird am Ort des Kampfes eingesperrt, wenn dieser dem Sieger gehört und ein Gefängnis trägt, andernfalls auf dem Planeten des Siegers mit dem höchsten Gefängnis. Ohne irgendein Gefängnis gibt es keine Gefangennahme.</p>

            <h2 id="prisonnier">Aktionen des Gefangenen</h2>
            <p>Der Gefangene hat mehrere Aktionen. <strong>Allianz alarmieren</strong> und <strong>Rebellieren</strong> teilen sich dieselbe Wartezeit: Eine der beiden ist ab der Gefangennahme möglich, danach eine alle <strong>4 Stunden</strong>.</p>
            <ul>
                <li><strong>Allianz alarmieren</strong> (70&nbsp;% + 2&nbsp;% pro Stufe des Helden, höchstens 90&nbsp;%; 80&nbsp;% bei Stufe 5): sendet die Koordinaten des Gefängnisses in den Allianzsalon. Misserfolg = der Kerkermeister wird alarmiert. Ohne Allianz ist die Aktion nicht verfügbar. Nach einem Misserfolg wartet die nächste Aktion 6 Stunden statt 4.</li>
                <li><strong>Rebellieren</strong> (25&nbsp;% + 1,5&nbsp;% pro Stufe, +10&nbsp;% für einen Militär; 50&nbsp;% für einen Militär der Stufe 10): zerstört 5&nbsp;% des Niobiums, des Wassers und der Nahrung des Gefängnisplaneten. Misserfolg = Verlust einer Stufe. In beiden Fällen erhält der Kerkermeister einen Bericht.</li>
                <li><strong>Fliehen</strong>: ein Versuch alle 4 Stunden ab der Gefangennahme (der erste 4 Stunden danach). 40&nbsp;% Erfolgschance, +5&nbsp;% pro 4 Stunden Gefangenschaft, bis zu 100&nbsp;% nach 52 Stunden. Misserfolg = der Kerkermeister wird alarmiert. Diese Wartezeit ist unabhängig von den beiden vorherigen Aktionen.</li>
                <li><strong>Flucht dank Slash</strong>: jederzeit und ohne Limit. Siehe den Artikel <em>Aus dem Gefängnis fliehen</em>.</li>
                <li><strong>Lösegeld zahlen</strong>: Hat der Kerkermeister eines verlangt, kannst du es auf der Gefängnisseite zahlen oder ablehnen.</li>
            </ul>

            <h2 id="geolier">Aktionen des Kerkermeisters</h2>
            <p>Deine Gefangenen verwaltest du über die Seite <strong>Held</strong>, Reiter <strong>Gehaltene Gefangene</strong>:</p>
            <ul>
                <li><strong>Hinrichten</strong>: zerstört den Helden endgültig und bringt dir 100 KP pro Stufe des Helden (1.200 KP für Stufe 12). Du erhältst alle seine verbleibenden Items. Sein Besitzer wird durch einen Bericht informiert.</li>
                <li><strong>Freilassen</strong>: diplomatische Geste, der Held kehrt zu seinem Besitzer zurück.</li>
                <li><strong>Foltern</strong> (200 KP): enthüllt die Koordinaten eines zufällig gezogenen Planeten des Besitzers des Gefangenen (er kann bereits bekannt sein) und lässt den Gefangenen 50 XP verlieren. Ohne Wartezeit wiederholbar.</li>
                <li><strong>Lösegeld fordern</strong>: Niobium, Wasser und/oder Uran gegen seine Freilassung verlangen. Der Gefangene hat 24 Stunden, um zu zahlen oder abzulehnen; nur eine Forderung gleichzeitig, aber nach einer Ablehnung oder einem Ablauf kannst du eine neue stellen.</li>
            </ul>

            <h2 id="liberation">Freilassung</h2>
            <ul>
                <li><strong>Die Allianz des Gefangenen überfällt</strong> den Gefängnisplaneten: automatische Freilassung.</li>
                <li><strong>Ein anderer Spieler überfällt</strong> den Gefängnisplaneten: 60&nbsp;% Chance, dass der Gefangene im Chaos flieht; andernfalls bleibt er eingesperrt, und der Eindringling, neuer Besitzer des Planeten, wird sein Kerkermeister.</li>
                <li><strong>Die Cthulhu übernehmen den Gefängnisplaneten</strong>: Die Gefangenen werden nicht freigelassen. Sie bleiben in der Cthulhu-Basis eingesperrt und müssen selbst fliehen (siehe <em>Aus dem Gefängnis fliehen</em>). Wird der Planet wieder unbewohnt, werden sie freigelassen.</li>
                <li><strong>Der Kerkermeister gibt den Gefängnisplaneten auf</strong> (oder verlässt das Spiel): Der Gefangene wird automatisch freigelassen.</li>
            </ul>

            <h2 id="secondaires">Einen gegnerischen Nebenhelden gefangen nehmen</h2>
            <p>Alles bisher Gesagte — Flucht, Folter, Lösegeld, Freilassung — betrifft den <strong>Haupthelden</strong> eines Gegners. Ein <strong>Nebenheld</strong> (siehe den Artikel <em>Nebenhelden</em>) folgt einer viel direkteren Regel, und hier gewinnt dein Gebäude Gefängnis einen <strong>entscheidenden Nutzen</strong>: Sobald du auf einem deiner Planeten ein Gefängnis der Stufe 1 oder höher besitzt, wird jeder gegnerische Nebenheld, der gegen dich besiegt wird (Weltraumkampf, Versorgungskampf, Zerstörung seiner Flotte durch deine Orbitalverteidigung oder erfolgreiche Invasion), <strong>sofort und endgültig</strong> dein — mit unversehrter Stufe, Erfahrung und unversehrten Items. Ohne Gefängnis wird er <strong>hingerichtet</strong>, statt gefangen genommen zu werden, und seine Items kommen in dein Inventar.</p>
            <p>Ein gefangener Nebenheld ist <strong>kein</strong> Gefangener im Sinne dieser Seite: Es gibt keine Gefängnisseite, keine Flucht, kein mögliches Lösegeld. Er kommt direkt, aktiv, in deinen <strong>Stall</strong> — bereit, auf einem Planeten oder einer Flotte platziert oder recycelt zu werden.</p>

            <h2 id="prerequis">Voraussetzungen</h2>
            <p>Forschung <strong>Gefängnissystem</strong> (erfordert Stacheldraht Stufe 5), dann die Gebäude <strong>Gefängnis</strong> und <strong>Sklavenlager</strong>.</p>

    prison_escape:
        title: "Aus dem Gefängnis fliehen"
        category: "progression"
        order: 8
        tags: "gefaengnis,flucht,slash,loesegeld,held,gefangennahme"
        summary: "Die drei Wege, selbst aus dem Gefängnis zu kommen: die sofortige Flucht, Slash und das Lösegeld."
        related: "prison,heroes,items"
        body: |
            <h2 id="concept">Drei Auswege</h2>
            <p>Wenn dein Held gefangen genommen wird, bietet dir die Gefängnisseite drei Wege hinaus, ohne auf deine Verbündeten zu warten: die sofortige Flucht, die Flucht dank Slash und die Zahlung eines Lösegelds.</p>

            <h2 id="instant">Sofortige Flucht</h2>
            <ul>
                <li>Ein Versuch alle <strong>4 Stunden</strong>. Der erste öffnet sich 4 Stunden nach der Gefangennahme.</li>
                <li><strong>40&nbsp;%</strong> Erfolgschance beim ersten Versuch, dann <strong>+5&nbsp;%</strong> pro 4 Stunden Gefangenschaft, egal ob du dein Glück versucht hast oder nicht.</li>
                <li>Die Chance steigt bis auf <strong>100&nbsp;%</strong>: 65&nbsp;% nach 24 Stunden Gefangenschaft, 95&nbsp;% nach 48 Stunden, und garantierter Erfolg ab <strong>52 Stunden</strong>. Die Stufe des Helden hat keinen Einfluss.</li>
                <li>Die Chance des nächsten Versuchs steht auf dem Button.</li>
                <li>Misserfolg: Dein Held bleibt im Gefängnis, und <strong>der Kerkermeister wird alarmiert</strong>.</li>
            </ul>

            <h2 id="slash">Flucht dank Slash</h2>
            <p><strong>Slash</strong> ist unser anderes Spiel (slash-game.com). Spiele es mit derselben <strong>E-Mail-Adresse</strong> wie dein Area-Universe-Konto, auf beiden Seiten bestätigt.</p>
            <ul>
                <li>Erreiche <strong>75&nbsp;% des besten Ergebnisses der Woche</strong> in einer Partie, die <strong>nach deiner Gefangennahme</strong> gespielt wurde.</li>
                <li>Solange die laufende Woche (seit Montag 00:00 UTC) weniger als 10 platzierte Spieler zählt oder ihr bestes Ergebnis unter 50 Punkten liegt, dient das beste Ergebnis der Vorwoche als Referenz.</li>
                <li>Kehre auf die Gefängnisseite zurück und klicke auf <strong>Mein Ergebnis prüfen</strong>: Dein Held wird freigelassen.</li>
                <li><strong>Unbegrenzte</strong> Versuche, ohne Wartezeit, und der Kerkermeister wird nicht alarmiert.</li>
                <li>Ein Gastkonto oder eine nicht bestätigte Adresse kann diesen Ausweg nicht nutzen.</li>
            </ul>

            <h2 id="ransom">Lösegeld zahlen</h2>
            <p>Verlangt der Kerkermeister ein Lösegeld (Niobium, Wasser und/oder Uran), wirst du durch einen Bericht darüber informiert, und es erscheint auf der Gefängnisseite mit seinem Betrag und seiner Frist (24 Stunden). Du kannst es <strong>zahlen</strong> oder <strong>ablehnen</strong>.</p>
            <p>Ablehnen lässt deinen Helden nicht frei: Der Kerkermeister wird nur darüber informiert und kann dir ein neues Lösegeld vorschlagen. Die Zahlung wird von der Gesamtheit deiner Planeten abgezogen und auf den Gefängnisplaneten eingezahlt. Hast du nicht genug Ressourcen, wird die Zahlung abgelehnt, und es wird nichts abgezogen.</p>

            <h2 id="sans-rancon">Und ohne Lösegeld?</h2>
            <p>Der Kerkermeister ist nie verpflichtet, ein Lösegeld zu verlangen, und deine Gefangenschaft hat keine feste Dauer. Ohne Lösegeld kommt dein Held aus dem Gefängnis, wenn:</p>
            <ul>
                <li>dir eine <strong>sofortige Flucht</strong> gelingt: Die Chance steigt alle 4 Stunden um 5&nbsp;% und erreicht nach <strong>52 Stunden</strong> Gefangenschaft 100&nbsp;%;</li>
                <li>du das verlangte Ergebnis auf <strong>Slash</strong> erreichst;</li>
                <li>deine Allianz den Gefängnisplaneten <strong>überfällt</strong> (Freilassung gesichert) oder ein anderer Spieler ihn überfällt (60&nbsp;% Fluchtchance);</li>
                <li>der Kerkermeister dich <strong>freilässt</strong> oder den Gefängnisplaneten aufgibt.</li>
            </ul>
            <p>Solange du gefangen bist, kann der Kerkermeister deinen Helden außerdem foltern (jedes Mal 50 XP verloren) oder hinrichten. Versuche die Flucht also besser so früh wie möglich.</p>

            <h2 id="after">Nach der Freilassung</h2>
            <p>Dein Held kehrt auf deinen ältesten Planeten ohne Helden zurück, mit seinen verbleibenden Items, und genießt <strong>24 Stunden Immunität</strong> gegen eine erneute Gefangennahme.</p>

    arena:
        title: "PvP-Arena"
        category: "progression"
        order: 8
        tags: "arena,duell,turnier,pvp,held,herausforderung,rangliste"
        summary: "Fordere andere Helden zum 1-gegen-1-Duell heraus. Setze Uran oder Items ein und gewinne Prestige."
        related: "heroes,items,war_points"
        body: |
            <h2 id="defis">Herausforderungssystem</h2>
            <p>Auf der Seite <strong>Held</strong>, im Reiter <strong>Arena</strong> (Formular „Herausforderung senden“), oder über den Button „Zum Duell herausfordern“ im Profil eines Spielers forderst du einen anderen Spieler heraus. Du kannst kein Mitglied deiner Allianz herausfordern. Der Herausgeforderte erhält einen Bericht und kann die Herausforderung <strong>annehmen</strong> oder <strong>ablehnen</strong>.</p>
            <ul>
                <li>Eine Herausforderung läuft nach <strong>7 Tagen</strong> ohne Antwort automatisch ab. Die Zahl der ausstehenden erhaltenen Herausforderungen wird im Reiter Arena und beim Menüeintrag „Held“ angezeigt. Die verbleibende Zeit bis zum Ablauf steht neben jeder erhaltenen Herausforderung. Nach dem Ablauf kannst du denselben Spieler erneut herausfordern.</li>
                <li>Du kannst eine von dir gesendete Herausforderung <strong>abbrechen</strong>, solange sie aussteht.</li>
                <li>Erholungszeit: Jeder Held muss nach seinem letzten Duell <strong>1 Stunde</strong> warten, egal gegen welchen Gegner. Diese Zeit wird beim Senden der Herausforderung <strong>und</strong> bei ihrer Annahme für beide Helden geprüft: Ausstehende Herausforderungen zu stapeln erlaubt es also nicht, mehrere Duelle hintereinander auszutragen.</li>
                <li>Ein gefangener Held kann weder herausfordern noch herausgefordert werden. Gefangennahme und Zugehörigkeit zur selben Allianz werden bei der Annahme erneut geprüft.</li>
                <li>Der Held ist nie in Gefahr (keine Gefangennahme in der Arena).</li>
            </ul>

            <h2 id="combat">Kampfauflösung</h2>
            <p>Nimmt der Herausgeforderte an, wird der Kampf <strong>sofort</strong> aufgelöst, und das Ergebnis erscheint auf dem Bildschirm des Spielers, der angenommen hat: Sieg oder Niederlage, die beiden Punktzahlen, die Belohnungen und der gewonnene oder verlorene Einsatz. Beide Spieler erhalten außerdem einen Bericht. Die Punktzahl basiert auf:</p>
            <ul>
                <li><strong>Stufe</strong> des Helden: die Grundlage der Punktzahl</li>
                <li><strong>Offensive</strong>: Angriff des Helden, +5&nbsp;%, wenn er Militär ist, und die offensiven Boni seiner Items</li>
                <li><strong>Defensive</strong>: Verteidigung des Helden und die defensiven Boni seiner Items</li>
                <li><strong>List</strong> (Gewicht 60&nbsp;%): Intelligenz — verdoppelt für einen Wirtschaftler, +20&nbsp;% mit der Eigenschaft Magnat — und die Versorgungs-Boni der Items</li>
                <li><strong>Schwung</strong> (Gewicht 60&nbsp;%): Geschwindigkeit — verdoppelt für einen Entdecker, +15&nbsp;% mit der Eigenschaft Navigator — und die Flottengeschwindigkeit der Items</li>
                <li><strong>Militärische Eigenschaften</strong>: Taktiker +10&nbsp;%, Kriegsherr +5&nbsp;%, und Einschüchterung zieht 5&nbsp;% von der Punktzahl des Gegners ab</li>
                <li><strong>Spezialisierung</strong>: Schere-Stein-Papier-Vorteil (Militär &gt; Entdecker &gt; Wirtschaft &gt; Militär, +10&nbsp;%)</li>
                <li><strong>Zufallsfaktor</strong> von ±15&nbsp;% auf jeder Seite</li>
            </ul>
            <p>In der Praxis: Punktzahl = Stufe × 10 × (1 + Offensive + Defensive + 0,6 × List + 0,6 × Schwung + Eigenschaften), wobei jeder Bonus mit seinem Wert zählt (10&nbsp;% = 0,10). Das Ergebnis wird dann bei einem Spezialisierungsvorteil mit 1,10 und bei einem Gegner mit Einschüchterung mit 0,95 multipliziert, danach greift der Zufall. Beispiel: Ein Militär der Stufe 10 mit 10&nbsp;% Angriff, 8&nbsp;% Verteidigung, ohne Item und mit der Eigenschaft Taktiker erreicht 10 × 10 × (1 + 0,15 + 0,08 + 0,10) = 133. Die Stufe wiegt also schwerer als alles andere.</p>
            <p>Im Duell zählen alle Item-Boni, mit einem Gewicht je nach Typ (sie werden nicht durch die Spezialisierung verdoppelt):</p>
            <ul>
                <li><strong>Offensive</strong>: Duellkraft (×1,5); Legionärskraft und Flottenangriff (×1); Mech-Kraft, Flottenpräzision und Cthulhu-Schaden (×0,5).</li>
                <li><strong>Defensive</strong>: Flottenverteidigung und Flottenschild (×1).</li>
                <li><strong>List</strong>: Produktion (×1); Arbeiterproduktion, Raumschiffproduktion, Baugeschwindigkeit, Recyclinggeschwindigkeit und Radarreichweite (×0,5); XP-Gewinn (×0,25).</li>
                <li><strong>Schwung</strong>: Flottengeschwindigkeit (×1).</li>
            </ul>

            <h2 id="mises">Einsätze</h2>
            <p>Beim Senden einer Herausforderung kannst du einen optionalen Einsatz hinzufügen:</p>
            <ul>
                <li><strong>Uran</strong>: Jeder Spieler setzt dieselbe Menge ein. Der Sieger gewinnt beide Einsätze.</li>
                <li><strong>Item</strong>: Jeder Spieler setzt ein Item derselben Seltenheit ein. Der Sieger gewinnt beide Items. Das Item muss (auf beiden Seiten) <strong>abgelegt</strong> sein und kann nicht in zwei ausstehenden Herausforderungen zugleich eingesetzt werden.</li>
                <li><strong>Freundschaftlich</strong>: ohne Einsatz, es werden nur die Grundbelohnungen vergeben.</li>
            </ul>
            <p>Der Einsatz ist gedeckt, wenn mindestens einer deiner Planeten das geforderte Uran besitzt: Es wird von deinem uranreichsten Planeten abgezogen. Hat ein Spieler bei der Annahme auf keinem Planeten mehr genug Uran, scheitert die Herausforderung. Ist das vom Herausforderer eingesetzte Item bei der Annahme durch den Herausgeforderten nicht mehr verfügbar (es gehört ihm nicht mehr oder ist angelegt), wird das Duell abgelehnt.</p>

            <h2 id="recompenses">Grundbelohnungen</h2>
            <p>Der Sieger erhält bei jedem Duell:</p>
            <ul>
                <li>Uran: zwischen 5 und 15, multipliziert mit der durchschnittlichen Stufe der beiden Helden ÷ 10, auf <strong>20</strong> pro Duell begrenzt (5 bis 15 zwischen zwei Helden der Stufe 10). Es wird auf deinem kleinsten Planeten eingezahlt, wie das Uran gewonnener Einsätze.</li>
                <li>Kriegspunkte: 15 × die Stufe des Siegers, multipliziert mit dem Verhältnis zwischen der kleineren und der größeren der beiden Stufen (nie weniger als die Hälfte). Zwei Helden der Stufe 15: 225 KP; ein Held der Stufe 15, der einen der Stufe 10 besiegt: 150 KP.</li>
                <li>XP: von 30 bis 90 je nach Knappheit des Duells (siehe den Artikel <em>Dein Held</em>).</li>
                <li>Item-Chance: insgesamt etwa 15&nbsp;% (10&nbsp;% gewöhnlich, 4&nbsp;% selten, 1&nbsp;% episch)</li>
            </ul>
            <p>Der Verlierer verliert nichts (außer seinem eventuellen Einsatz), erhält aber weder XP noch Belohnung.</p>

            <h2 id="classement">Rangliste</h2>
            <p>Eine Rangliste pro Server zeigt die besten Duellanten:</p>
            <ul>
                <li>Sortiert nach Siegquote in Duellen (Turnierkämpfe zählen nicht), dann nach Anzahl der Siege</li>
                <li>Mindestens <strong>5 Kämpfe</strong>, um zu erscheinen</li>
                <li>Die <strong>ersten 5</strong> sind direkt auf der Seite sichtbar; ein Button öffnet die vollständige Rangliste mit Seitenumbruch und Sortierung</li>
                <li>Wöchentliche Belohnungen, die jeden <strong>Montag</strong> für die vorherige Woche automatisch (von Montag 0 Uhr bis Sonntag 24 Uhr, Pariser Zeit) und nur einmal ausgezahlt werden: Top 3 nach der <strong>Zahl der Duellsiege</strong> der Woche, mit mindestens <strong>5 Duellen</strong> in der Woche. Nur Spieler sind betroffen (weder KI-Kommandanten noch gelöschte Konten). 1. = 3.000 Uran + 300 KP, 2. = 2.000 + 200 KP, 3. = 1.000 + 100 KP. Jeder belohnte Spieler erhält einen Bericht.</li>
            </ul>

            <h2 id="tournois">Turniere</h2>
            <p>Periodisches Server-Event: ein Turnier alle <strong>7 Tage</strong> pro Server.</p>
            <ul>
                <li>Die Anmeldung ist <strong>24h</strong> lang offen, im Reiter Arena der Seite Held. Ein gefangener Held kann sich nicht anmelden und wird ausgeschlossen, wenn er vor Anmeldeschluss gefangen genommen wird.</li>
                <li>Bei Anmeldeschluss wird der gesamte Turnierbaum auf einmal gespielt: K.-o.-System nach Auslosung (ist die Zahl der Qualifizierten ungerade, setzt einer von ihnen automatisch aus, in einer beliebigen Runde), dann ein Spiel um Platz 3 zwischen den beiden Verlierern der Halbfinals.</li>
                <li>Es braucht mindestens <strong>2 Teilnehmer</strong>: Andernfalls wird das Turnier abgesagt (keine Belohnung) und die Angemeldeten werden per Bericht benachrichtigt. Bei nur einem angemeldeten Spieler findet das Turnier statt, wenn ein KI-Kommandant den Turnierbaum auffüllen kann.</li>
                <li>Sobald mindestens ein Spieler angemeldet ist, füllen die <strong>KI-Kommandanten</strong> des Servers (Haupthelden nicht gefangen) den Turnierbaum auf insgesamt <strong>8 Teilnehmer</strong> auf. Sie melden sich nach und nach während der 24h Anmeldezeit an, und der Turnierbaum wird bei Anmeldeschluss aufgefüllt, wenn noch welche fehlen.</li>
                <li>Sind <strong>8 oder mehr Spieler</strong> angemeldet, nimmt kein KI-Kommandant teil. Ohne angemeldeten Spieler findet das Turnier nicht statt: Die KI-Kommandanten spielen nie untereinander.</li>
                <li>Jeder Turnierkampf bringt seinem Sieger auch die üblichen Belohnungen eines Duells.</li>
                <li>Die KI-Kommandanten kämpfen um das Podium und erhalten dieselben Belohnungen wie die Spieler, außer der Chance auf einen Nebenhelden.</li>
                <li>Der Champion behält 25&nbsp;% Chance auf einen Nebenhelden (den Spielern vorbehalten).</li>
            </ul>
            <p>Belohnungen:</p>
            <ul>
                <li>1. = 5.000 Uran + 500 KP + 1 episches Item (20&nbsp;% Chance auf ein zusätzliches legendäres Item)</li>
                <li>2. = 3.000 Uran + 300 KP + 1 seltenes Item (10&nbsp;% Chance auf ein zusätzliches episches Item)</li>
                <li>3. = 1.500 Uran + 150 KP + 1 seltenes Item</li>
                <li>Übrige Teilnehmer = 500 Uran + 50 KP (10&nbsp;% Chance auf ein gewöhnliches Item)</li>
            </ul>
            <p>Jeder Teilnehmer erhält einen Bericht mit seiner Platzierung und seinen Belohnungen. Die Seite Arena zeigt den Countdown bis Anmeldeschluss, das Podium des letzten Turniers und das Datum des nächsten.</p>

    login_bonus:
        title: "Login-Bonus"
        category: "progression"
        order: 9
        tags: "bonus,login,taeglich,bitcoin,serie,streak"
        summary: "Kostenlose Bitcoins jeden Tag, multipliziert, wenn du mehrere Tage in Folge einloggst."
        related: "bitcoin_economy,leveling,daily_report"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>An jedem <strong>Kalendertag</strong> (der Tag wechselt um Mitternacht, Pariser Zeit) schenkt dir das Spiel einen Bitcoin-Bonus, auf jedem Server, auf dem du spielst. Ein Fenster öffnet sich, wenn du ins Spiel kommst: Klicke auf <strong>„Einfordern“</strong>, um ihn zu erhalten. Das Spiel kann dich auch per Benachrichtigung warnen, wenn der Bonus des Tages verfügbar ist.</p>
            <p>Der Betrag entspricht der <strong>vorteilhafteren</strong> der beiden folgenden Berechnungen und wird dann mit deiner Serie multipliziert:</p>
            <ul>
                <li>Eine <strong>an deine Stufe gekoppelte Untergrenze</strong>: <strong>Stufe × 5.000 Bitcoins</strong>, jeden Tag multipliziert mit einer Zufallsziehung von ×1, ×2, ×3, ×4 oder ×5. Sie garantiert zu Spielbeginn einen motivierenden Bonus.</li>
                <li><strong>5&nbsp;% des Bitcoin-Durchschnitts des Servers</strong> — so bleibt der Bonus interessant, während die Wirtschaft des Servers wächst.</li>
                <li>Das Ergebnis wird dann mit deinem <strong>Serien-Multiplikator</strong> multipliziert (siehe unten).</li>
            </ul>
            <p>Dieser Durchschnitt zählt nur die Spieler (weder Bots noch Testkonten); ab 20 Spielern schließt er die reichsten 5&nbsp;% und die ärmsten 5&nbsp;% aus. Er wird einmal täglich neu berechnet.</p>
            <p>Untergrenze je nach Stufe (vor dem Serien-Multiplikator; jeder Kommandant beginnt auf Stufe 2):</p>
            <table>
                <tr><th>Stufe</th><th>Mögliche Untergrenze</th><th>An Tag 7 (×5)</th></tr>
                <tr><td>2</td><td>10.000 bis 50.000</td><td>50.000 bis 250.000</td></tr>
                <tr><td>5</td><td>25.000 bis 125.000</td><td>125.000 bis 625.000</td></tr>
                <tr><td>10</td><td>50.000 bis 250.000</td><td>250.000 bis 1.250.000</td></tr>
                <tr><td>15</td><td>75.000 bis 375.000</td><td>375.000 bis 1.875.000</td></tr>
                <tr><td>20</td><td>100.000 bis 500.000</td><td>500.000 bis 2.500.000</td></tr>
                <tr><td>30</td><td>150.000 bis 750.000</td><td>750.000 bis 3.750.000</td></tr>
                <tr><td>40</td><td>200.000 bis 1.000.000</td><td>1.000.000 bis 5.000.000</td></tr>
            </table>
            <p>Für eine andere Stufe multipliziere sie mit 5.000 (Ziehung ×1) und mit 25.000 (Ziehung ×5).</p>
            <p>Beispiel: Auf Stufe 10 ergibt die Tagesziehung ×2, also eine Untergrenze von 100.000 Bitcoins. Beträgt der Serverdurchschnitt 3.000.000 Bitcoins, machen 5&nbsp;% 150.000 aus: Dieser Betrag wird gewählt. Am 3. Tag der Serie (×1,5) erhältst du 225.000 Bitcoins.</p>

            <h2 id="streak">Die Serie von 7 aufeinanderfolgenden Tagen</h2>
            <p>Deinen Bonus <strong>jeden Tag</strong> einzufordern lässt deinen Multiplikator steigen:</p>
            <table>
                <tr><th>Aufeinanderfolgender Tag</th><th>Multiplikator</th></tr>
                <tr><td>Tag 1</td><td>×1,0</td></tr>
                <tr><td>Tag 2</td><td>×1,2</td></tr>
                <tr><td>Tag 3</td><td>×1,5</td></tr>
                <tr><td>Tag 4</td><td>×1,8</td></tr>
                <tr><td>Tag 5</td><td>×2,0</td></tr>
                <tr><td>Tag 6</td><td>×2,5</td></tr>
                <tr><td>Tag 7</td><td>×5,0</td></tr>
            </table>
            <p>Am 8. Tag beginnt der Zyklus wieder bei Tag 1. Du musst den Bonus <strong>an jedem Kalendertag</strong> einfordern (von Mitternacht bis Mitternacht, Pariser Zeit): Vergeht ein Tag ohne Einfordern, beginnt die Serie wieder bei Tag 1. Die Anzahl der Stunden zwischen zwei Logins zählt nicht, nur der Tag zählt. Montag um 0:05 Uhr und dann Dienstag um 23:55 Uhr einzufordern erhält die Serie; Montag um 23:59 Uhr und dann Mittwoch um 0:01 Uhr einzufordern bricht sie ab.</p>

            <h2 id="items">Die Bonus-Items</h2>
            <p>An manchen Tagen der Serie gibt es zusätzlich ein zufälliges <strong>Item für deinen Helden</strong>:</p>
            <ul>
                <li><strong>Tag 3</strong>: ein gewöhnliches Item.</li>
                <li><strong>Tag 7</strong>: ein seltenes Item.</li>
            </ul>

            <h2 id="reclamation">So forderst du ihn ein</h2>
            <p>Das Fenster „Login-Bonus“ öffnet sich automatisch, wenn du ins Spiel kommst: Ein Klick auf <strong>„Einfordern“</strong> schreibt die Bitcoins (und das Item von Tag 3 oder 7) gut. Es zeigt auch deinen persönlichen Rekord an Tagen in Folge an, der 7 nicht überschreiten kann, da die Serie nach Tag 7 wieder bei Tag 1 beginnt.</p>

            <h2 id="conseil">Ein kleiner Tipp</h2>
            <p>Schon 30 Sekunden reichen: Öffne das Spiel und klicke auf „Einfordern“. Verpasse nicht Tag 7, da bringt es am meisten.</p>

    game_over:
        title: "Game Over"
        category: "progression"
        order: 10
        tags: "game over,eliminierung,bankrott,ende"
        summary: "Die 2 Arten, die Partie zu verlieren, und was dir danach bleibt."
        related: "bitcoin_economy,daily_report,planet_abandon,game_modes"
        body: |
            <h2 id="intro">Die 2 Arten von Game Over</h2>
            <p>Es gibt zwei Wege, auf einem Server alles zu verlieren: den Bankrott, der dir deine Planeten lässt, aber nicht deine Schiffe, und den Verlust aller deiner Planeten, der deinen Kommandanten auf null zurücksetzt. Sie zu kennen heißt schon, sich zu schützen.</p>

            <h2 id="faillite">1. Der wirtschaftliche Bankrott</h2>
            <p>Ist dein Bitcoin-Kontostand nach dem <strong>Tagesbericht um 18:59 Uhr (Pariser Zeit)</strong> <strong>negativ</strong>: <strong>wirtschaftliches Game Over</strong>.</p>
            <ul>
                <li>Alle deine <strong>Flotten</strong> werden gelöscht, im Flug wie im Orbit, mit ihrer Ladung und ihren Truppen.</li>
                <li>Alle <strong>Schiffe am Boden</strong> deiner Planeten gehen verloren.</li>
                <li>Dein Kontostand wird <strong>auf 125.000 Bitcoins zurückgesetzt</strong>.</li>
            </ul>
            <p>Du behältst deine Planeten, Gebäude, Verteidigungen, Forschungen, Bodentruppen und deinen Rang: Du spielst weiter, aber ohne jedes Schiff.</p>
            <p><strong>Du wirst vorher gewarnt:</strong> Sobald dein Kontostand unter das prognostizierte tägliche Defizit fällt (Unterhaltskosten minus Einkünfte des letzten Berichts), warnt dich ein Alarmbericht „Bankrott droht!“ — höchstens einer pro Tag. Erhältst du ihn, handle vor dem nächsten Tagesbericht.</p>

            <h2 id="planetes">2. Der Verlust aller deiner Planeten</h2>
            <p>Verlierst du deinen <strong>letzten Planeten</strong> — überfallen von einem Spieler oder von den Cthulhu oder, im Battle Royale, wenn dein Sektor verschwindet —, wird dein Kommandant ausgeschaltet. Du kannst deinen letzten Planeten nicht freiwillig aufgeben.</p>
            <ul>
                <li>Überfällt ein Spieler deinen letzten Planeten, <strong>streicht er alle deine Bitcoins und alle deine Kriegspunkte ein</strong>.</li>
                <li>Deine <strong>Flotten</strong> werden gelöscht (nehmen die Cthulhu deinen letzten Planeten ein, gehen sie unter ihre Kontrolle über).</li>
                <li>Dein Kommandant wird <strong>auf null zurückgesetzt</strong>: 125.000 Bitcoins, Forschungen und politische Forschungen auf null, Terraformation durch 2 geteilt, Rang zurückgesetzt, Held und Berichte gelöscht.</li>
                <li>Du verlässt deine Allianz (sie wird aufgelöst, wenn du ihr einziges Mitglied oder der Anführer einer Allianz vom Hammer der Sterne warst).</li>
                <li>Deine Laufbahn auf diesem Server wird in deinem Kontoprofil <strong>festgehalten</strong>.</li>
            </ul>

            <h2 id="eviter">So vermeidest du das Game Over</h2>
            <ul>
                <li>Behalte täglich deine <strong>Bilanz</strong> (Einkünfte − Kosten) im Auge. Wird sie rot, reagiere.</li>
                <li>Stelle ungenutzte Flotten am Boden ab: Ihr Unterhalt wird durch 6 geteilt.</li>
                <li>Rekrutiere nicht zu viel: Eine Armee im Dauerunterhalt kann einen unvorsichtigen Wirtschaftler ruinieren.</li>
                <li>Halte immer <strong>mindestens 2 Planeten</strong> verteidigungsbereit.</li>
                <li>Beobachte die <strong>anfliegenden feindlichen Flotten</strong> (Benachrichtigungen, Radar).</li>
                <li>Bei großer Gefahr <strong>evakuiere</strong> deine Truppen und Ressourcen auf einen sicheren Planeten.</li>
            </ul>

            <h2 id="apres">Was bleibt danach?</h2>
            <p>Auch ausgeschaltet behältst du dein <strong>Spielerkonto</strong> und deine <strong>Statistiken</strong> der früheren Partien. Du kannst einem anderen Server beitreten oder dich auf demselben über die Serverauswahlseite (Menü „Server“) erneut anmelden, solange seine Anmeldungen offen sind: Du startest dann auf einem neuen Startplaneten.</p>

    game_modes:
        title: "Die Servermodi"
        category: "events"
        order: 1
        tags: "modus,battle royale,dominanz,domination,long run,short run,cthulhu,search and destroy,paid"
        summary: "Area Universe bietet 7 verschiedene Servermodi mit eigenen Regeln und Zielen."
        related: "cthulhus,events,getting_started"
        body: |
            <h2 id="intro">Überblick</h2>
            <p>Jeder Server von Area Universe hat einen <strong>Modus</strong>, der bei seiner Erstellung vom Admin gewählt wird. Der Modus legt die Dauer, die Siegbedingung und das Vorhandensein der Cthulhu fest.</p>
            <table>
                <thead>
                    <tr><th>Modus</th><th>Dauer</th><th>Siegbedingung</th><th>Cthulhu?</th><th>Allianzen?</th><th>Forschungen</th></tr>
                </thead>
                <tbody>
                    <tr><td>Cthulhu</td><td>300 Tage</td><td>Keine</td><td>Ja</td><td>Ja</td><td>Normal</td></tr>
                    <tr><td>Search &amp; Destroy</td><td>höchstens 30 Tage</td><td>Der VIP, der 72&nbsp;Std. überlebt</td><td>Nein</td><td>Ja (außer für den VIP)</td><td>Von Anfang an max</td></tr>
                    <tr><td>Dominanz</td><td>60 Tage</td><td>Beste Einzelpunktzahl am Ende</td><td>Nein</td><td>Ja</td><td>Von Anfang an max</td></tr>
                    <tr><td>Battle Royale</td><td>höchstens 40 Tage</td><td>Letzter Überlebender</td><td>Nein</td><td>Nein</td><td>Von Anfang an max</td></tr>
                    <tr><td>Paid Server</td><td>60 Tage</td><td>Beste gewichtete Punktzahl (Punkte + 2 × KP)</td><td>Nein</td><td>Ja</td><td>Normal</td></tr>
                    <tr><td>Long Run</td><td>900 Tage</td><td>Keine (Marathon)</td><td>Während der Events „Cthulhu-Angriff“</td><td>Ja</td><td>Normal</td></tr>
                    <tr><td>Short Run</td><td>150 Tage</td><td>Keine (Sprint)</td><td>Während der Events „Cthulhu-Angriff“</td><td>Ja</td><td>Normal</td></tr>
                </tbody>
            </table>
            <p>Eine Partie, die einen Sieger kürt (Search &amp; Destroy, Battle Royale), endet, sobald dieser Sieger feststeht, und der Server schließt: Die angegebene Dauer ist dann ein Maximum.</p>
            <p>In der Serverliste tragen manche Modi einen anderen Namen: <strong>Search &amp; Destroy</strong> wird als „Suchen &amp; Zerstören“ angezeigt (und „Jagd &amp; Vernichtung“ im Spielmenü), <strong>Long Run</strong> als „Langfristig“, <strong>Short Run</strong> als „Kurzfristig“ und <strong>Paid Server</strong> als „Bezahlter Server“.</p>

            <h2 id="cthulhu">Cthulhu-Modus (klassisches PvE)</h2>
            <p>Der Basismodus, perfekt, um das Spiel kennenzulernen. In den <strong>ersten 72 Stunden</strong> des Servers gibt es keinen Cthulhu-Angriff: Das ist die <strong>Vorbereitungsphase</strong>. Während dieser Phase trägt der Server das Badge „Gesperrt“ in der Serverliste und lehnt neue Kommandanten ab (Meldung „Dieser Server ist gesperrt (Vorbereitung oder Registrierung geschlossen).“).</p>
            <p>Danach greifen dich die Cthulhu-Horden regelmäßig an. Die erste startet <strong>5 Tage nach deiner Anmeldung</strong>, dann zieht alle <strong>18 bis 30 Stunden</strong> auf Leicht, <strong>12 bis 24 Stunden</strong> auf Normal und <strong>8 bis 16 Stunden</strong> auf Schwer eine neue Horde los. Du kannst das PvE in deinen <strong>Einstellungen</strong> auch ganz deaktivieren (siehe den Artikel <em>Die Cthulhu-Bedrohung</em>).</p>
            <p>Keine Siegbedingung und kein Sieger: Nach den 300 Tagen schließt der Server, und dein Ergebnis (Rangliste, Punkte …) bleibt in deinem Karriereprofil. Der Erfolg <strong>Elite</strong> belohnt einen Platz in den Top 10 eines Servers.</p>

            <h2 id="search-and-destroy">Search &amp; Destroy (VIP-Jagd)</h2>
            <p>Die <strong>ersten 48 Stunden</strong> des Servers dienen der Einrichtung: Es ist noch kein VIP bestimmt. Wie im Cthulhu-Modus trägt der Server dann das Badge „Gesperrt“ und lehnt neue Kommandanten ab.</p>
            <p>Danach wird unter den noch im Spiel befindlichen Spielern ein <strong>VIP</strong> ausgelost, und der öffentliche Salon verkündet „Neuer VIP: …“. Sein Ziel: <strong>72 Stunden überleben</strong>. Schafft er es, gewinnt er, und die Partie endet sofort.</p>
            <ul>
                <li>Wird er von einem Spieler eliminiert (Game Over), <strong>wird der Töter der neue VIP</strong> („Der VIP wurde von … eliminiert“), und der 72-Stunden-Countdown beginnt von vorn.</li>
                <li>Wird er anders eliminiert (zum Beispiel durch einen KI-Kommandanten), wird ein neuer VIP ausgelost.</li>
            </ul>
            <p>Der VIP ist <strong>allein gegen alle</strong>: Er wird bei seiner Ernennung automatisch aus seiner Allianz entfernt. War er ihr Anführer, übernimmt das ranghöchste Mitglied seinen Platz; war er ihr einziges Mitglied, wird die Allianz aufgelöst. Solange er den Status trägt, kann er keine Allianz gründen oder ihr beitreten, und das bleibt ihm nach dem Verlust des Status noch <strong>3 Tage</strong> verwehrt.</p>
            <p>Der <strong>Anfängerschutz</strong> gilt auch für den VIP: Solange er andauert (weniger als 7 Tage seit seiner Anmeldung, weniger als 4 Planeten, keine Angriffsmission gestartet), kann kein Spieler eine Flotte auf seine Planeten schicken.</p>

            <h2 id="domination">Dominanz (strategische Planeten)</h2>
            <p>Zu Beginn werden <strong>5 strategische Planeten</strong> unter allen Planeten des Servers ausgelost, Spielerplaneten wie unbewohnte Planeten.</p>
            <ul>
                <li>Einmal täglich, beim Datumswechsel (Mitternacht, Pariser Zeit), bringt jeder strategische Planet dem Spieler, der ihn in diesem Moment besitzt, <strong>+5 Punkte</strong>. Zwei zu halten bringt also +10 pro Tag.</li>
                <li>Die KI-Kommandanten erzielen keine Punkte.</li>
                <li>Alle <strong>5 Tage</strong> ersetzt eine neue Ziehung die strategischen Planeten. Der öffentliche Salon verkündet „Die strategischen Planeten haben sich geändert.“ in dem Moment, in dem sie stattfindet, ohne Vorwarnung.</li>
            </ul>
            <p>Am Ende des Servers (60 Tage) gewinnt der Spieler mit den meisten Punkten. Die Rangliste ist <strong>individuell</strong>: Es gibt in der Dominanz weder eine Punktzahl noch einen Sieg der Allianz.</p>

            <h2 id="battle-royale">Battle Royale (letzter Überlebender)</h2>
            <p>Solo-Modus: <strong>keine Allianz erlaubt</strong>. Nur eine Galaxie. Die Anmeldungen schließen <strong>7 Tage</strong> nach der Eröffnung: Der Server trägt dann das Badge „Gesperrt“, und nur schon angemeldete Spieler können zurückkehren.</p>
            <p>Die Karte ist ein Weltraumraster von 10 × 10, also 100 Systemen, das <strong>in konzentrischen Ringen schrumpft</strong>: Bei jeder Runde <strong>verschwindet der gesamte Außenring auf einmal</strong> (nicht System für System). Die zerstörten Systeme bleiben als <strong>Löcher</strong> angezeigt: Die Karte ordnet sich nicht neu, sodass die sichere Zone auf einen Blick lesbar ist.</p>
            <p><strong>5 Runden, eine pro Woche:</strong></p>
            <table>
                <thead>
                    <tr><th>Tag</th><th>Zerstörte Systeme</th><th>Verbleibende Systeme</th></tr>
                </thead>
                <tbody>
                    <tr><td>T+7</td><td>36 (der Rand des Rasters)</td><td>64</td></tr>
                    <tr><td>T+14</td><td>28</td><td>36</td></tr>
                    <tr><td>T+21</td><td>20</td><td>16</td></tr>
                    <tr><td>T+28</td><td>12</td><td>4</td></tr>
                    <tr><td>T+35</td><td>3 der letzten 4</td><td><strong>nur 1</strong>, ausgelost</td></tr>
                </tbody>
            </table>
            <p>Die letzten 5 Tage werden in diesem letzten System gespielt.</p>
            <ul>
                <li><strong>12&nbsp;Std. vor</strong> seiner Zerstörung wird ein Ring <strong>orange</strong> (Warnung).</li>
                <li><strong>1&nbsp;Std. vorher</strong> wird er <strong>rot blinkend</strong>: Keine Flotte kann mehr zu seinen Systemen starten oder von dort abfliegen.</li>
                <li>Ein zerstörtes System löscht seine Planeten und Flotten endgültig. Befand sich dein <strong>Hauptheld</strong> dort (auf einem Planeten oder in einer Flotte), bist du ausgeschaltet; ein Nebenheld kommt einfach zurück in die Reserve. Du bist auch ausgeschaltet, wenn du keinen Planeten mehr hast.</li>
                <li>Eine Flotte, die zu einem verschwundenen System unterwegs ist (oder von einem verschwundenen System gestartet ist), wird bei der Ankunft zerstört; ist dein Hauptheld an Bord, bist du ausgeschaltet.</li>
            </ul>
            <p><strong>Sieg</strong>: der letzte noch im Spiel befindliche Spieler sein. Die Partie endet, sobald nur noch ein Überlebender übrig ist. Sind am 40. Tag noch mehrere Spieler im Spiel, endet der Server ohne Sieger.</p>

            <h2 id="paid-server">Paid Server (kompetitiv, kostenpflichtig)</h2>
            <p>Kostenpflichtiger Server: Die Anmeldung kostet <strong>5&nbsp;€</strong>, einmalig über Stripe für genau diesen Server gezahlt (ein anderer kostenpflichtiger Server wird separat bezahlt). Du brauchst ein vollständiges Konto, kein Gastkonto. In der Serverliste trägt er das Badge „💳 Kostenpflichtig 5 €“. 100&nbsp;% PvP, keine Cthulhu. Dauer 60 Tage.</p>
            <p><strong>Sieg</strong>: Am Ende gewinnt der noch im Spiel befindliche Spieler mit der besten <strong>gewichteten Punktzahl</strong>.</p>
            <ul>
                <li>Gewichtete Punktzahl = Punkte der Rangliste + 2 × Kriegspunkte (KP).</li>
                <li>Beispiel: 300.000 Punkte und 50.000 KP ergeben eine Punktzahl von 400.000.</li>
            </ul>
            <p>Der Kampf zählt also doppelt: Das ist ein Modus für kompetitive Spieler.</p>
            <p>Wie in allen Modi, die einen Sieger kürt, erhält der Gewinner das Abzeichen <strong>Sieger</strong> in seinem Karriereprofil, das von Server zu Server erhalten bleibt, und den Erfolg <strong>Imperator</strong>.</p>

            <h2 id="long-short-run">Long Run / Short Run (mit Events)</h2>
            <p>Zwei PvE-Modi mit identischen Regeln: Nur die Dauer ändert sich. Der <strong>Long Run</strong> dauert 900 Tage, der <strong>Short Run</strong> 150 Tage.</p>
            <p>Die Cthulhu greifen dort nicht dauerhaft an: Ihre Horden starten nur während der Events <strong>Cthulhu-Angriff</strong>. Diese Events dauern 72 Stunden: Das erste beginnt 7 Tage nach Serveröffnung, dann kehren sie alle 21 Tage wieder.</p>
            <p>Die <strong>Allianz-Arena</strong> kehrt dort alle 3 Tage wieder, und auch die Prophezeiungen von Cthulhu werden dort ausgelöst. Der Kalender ist fest, ab der Serveröffnung berechnet: siehe den Artikel <em>Sonderevents</em>.</p>

            <h2 id="recherches-max">Modi mit maximalen Forschungen von Anfang an</h2>
            <p>In <strong>Search &amp; Destroy, Dominanz und Battle Royale</strong> starten alle deine Forschungen auf der maximalen Stufe: Das Forschungsmenü ist ausgeblendet, damit du direkt den militärischen Teil spielst.</p>
            <p>Dein Startplanet erhält dann ein <strong>Startkit</strong>:</p>
            <ul>
                <li><strong>500 Uran</strong> zum schnellen Anpassen.</li>
                <li><strong>Deine gesamte Reserve an Schiffsverbesserungspunkten</strong> schon an Tag 1, statt der üblichen Obergrenze von 40 Punkten pro Tag.</li>
            </ul>
            <p>In <strong>Search &amp; Destroy</strong> erhält jeder Spieler bei der Anmeldung zusätzlich ein Militärkit auf seinem Startplaneten (jeder kann VIP werden): 2.000 Legionäre, 25 Barges, 500 Zerstörer und 250 Schwere Lasertürme.</p>

            <h2 id="fin-de-serveur">Serverende und Archivierung</h2>
            <p>Wenn ein Server schließt, werden deine <strong>Endstatistiken</strong> (Punkte, Helden, VIP-Erfolge, Siege usw.) in deinem <strong>Spielerkonto</strong> archiviert. Dein Kommandant (die Figur dieser Partie) wird gelöscht, aber dein Verlauf bleibt.</p>

    cthulhus:
        title: "Die Cthulhu-Bedrohung"
        category: "events"
        order: 2
        tags: "cthulhu,schwarm,horde,garnison,belagerung,bedrohung,pve,uran,tower defense,td"
        summary: "Die Cthulhu sammeln echte Horden, die offen fliegen, bevor sie deine Planeten angreifen. Wie du dich verteidigst, wie ihre Basen sich ebenfalls verteidigen und das Tower Defense, um den Ansturm abzuwehren."
        related: "game_modes,events,defense,cthulhu_prophecies"
        body: |
            <h2 id="principe">Was sind die Cthulhu?</h2>
            <p>Die <strong>Cthulhu</strong> (die Besessenen) sind die feindlichen, vom Spiel gesteuerten Kreaturen (PvE). Sie halten <strong>Basen des Schwarms</strong>, die über die Galaxie verstreut sind, von denen <strong>Horden</strong> ausgehen: echte Flotten, mit sichtbarer Zusammensetzung, Stärke und Flugbahn, kein bloßer Countdown.</p>
            <p>Die Cthulhu gibt es nur auf den Servern <strong>Cthulhu</strong>, <strong>Long Run</strong> und <strong>Short Run</strong>. Im Long Run und Short Run starten ihre Horden nur während der Events <strong>Cthulhu-Angriff</strong> (siehe <em>Sonderevents</em>).</p>
            <p>Zwei Anzeigen, die du nicht verwechseln darfst:</p>
            <ul>
                <li>deine <strong>persönliche Bedrohung</strong>, die die Stärke der gegen dich gestarteten Horden bestimmt (dieser Artikel);</li>
                <li>die <strong>Bedrohung des Universums</strong>, die dem Server gemeinsam ist und die Prophezeiungen auslöst (siehe <em>Die Prophezeiungen von Cthulhu</em>).</li>
            </ul>

            <h2 id="menace">Die Bedrohungsstufe</h2>
            <p>Deine persönliche Bedrohung wird auf der Seite <strong>Cthulhu</strong> im Block „Cthulhu-Bedrohung“ angezeigt (Bedrohter Planet, Bedrohungsstufe, Verbleibende Zeit). Je höher sie ist, desto stärker sind die nächsten Angriffe.</p>
            <p>Jedes Mal, wenn deine Verteidigungen eine Cthulhu-<strong>Landung</strong> am Boden abwehren, steigt deine Bedrohung. Die Horde zu zerstören, bevor sie landet (über ihrer Basis, im Flug oder im Orbit deines Planeten), lässt sie nicht steigen. Der Zuwachs hängt vom Schwierigkeitsgrad und vom Regime deiner Allianz ab:</p>
            <table>
                <thead>
                    <tr><th>Schwierigkeitsgrad</th><th>Ohne Allianz</th><th>Allianz Der Hammer der Sterne</th><th>Andere Allianz</th></tr>
                </thead>
                <tbody>
                    <tr><td>Leicht</td><td>+40</td><td>+60</td><td>+80</td></tr>
                    <tr><td>Normal</td><td>+100</td><td>+150</td><td>+200</td></tr>
                    <tr><td>Schwer</td><td>+160</td><td>+240</td><td>+320</td></tr>
                </tbody>
            </table>
            <p>Das Regime <strong>Der Hammer der Sterne</strong> verringert also den Anstieg der Bedrohung.</p>
            <p>Die Bedrohung <strong>steigt auch von selbst wieder</strong>, solange dein PvE aktiv ist:</p>
            <ul>
                <li>+5 bei jedem Tagesbericht (18:59 Uhr, Pariser Zeit);</li>
                <li>+1 pro Stunde, solange eine Horde im Orbit eines deiner Planeten bleibt, bevor sie landet.</li>
            </ul>
            <p>Dieser automatische Anstieg stoppt bei 300. Um die Bedrohung zu senken:</p>
            <ul>
                <li>ein <strong>Tower Defense</strong> zu gewinnen teilt sie durch 2;</li>
                <li>eine <strong>Basis des Schwarms zu befreien</strong> teilt sie durch 10 (siehe weiter unten);</li>
                <li>auch eine Niederlage am Boden teilt sie (siehe die Tabelle „Wenn die Horde am Boden siegt“).</li>
            </ul>
            <p>Ein eifriger Spieler hält sie also niedrig; ein Spieler, der sie laufen lässt, setzt sich immer größeren Horden aus.</p>

            <h2 id="puissance">Stärke der Invasionen</h2>
            <p>Ein Angriff läuft in zwei Schritten ab, und der Schwierigkeitsgrad wirkt auf beide:</p>
            <ul>
                <li><strong>Die Horde (Orbitalkampf)</strong>: Ihre Flotte wird anhand der <strong>Stärke deiner eigenen Flotte</strong> berechnet. Je stärker deine Flotte im Verhältnis zu deiner Bedrohungsstufe ist, desto stärker ist auch die Horde (das 0,7- bis 1,5-Fache deiner Stärke). Danach greift der Schwierigkeitsgrad: ×0,5 auf Leicht, ×1 auf Normal, ×1,5 auf Schwer. Jede fünfte Horde ist verstärkt (+25&nbsp;%). Die Horde, die darauf folgt, dass deine Bedrohung 100, 250 und dann 500 überschreitet, ist eine <strong>Boss-Horde</strong>, doppelt so groß.</li>
                <li><strong>Die Landung (Bodenkampf)</strong>: Ihre Stärke hängt von deiner <strong>Bedrohungsstufe</strong> und deiner Forschungsstufe <strong>Terraformation</strong> ab, dann von dem Teil der Horde, der den Orbitalkampf überlebt hat. Auf Leicht wird sie durch 2 geteilt.</li>
            </ul>

            <h2 id="horde">Der Angriff: eine sehr reale Horde</h2>
            <p>Die erste Horde wird <strong>5 Tage nach deiner Anmeldung</strong> gestartet. Danach zieht alle <strong>18 bis 30 Stunden</strong> auf Leicht, <strong>12 bis 24 Stunden</strong> auf Normal und <strong>8 bis 16 Stunden</strong> auf Schwer eine neue Horde los. Der Timer des Menüeintrags „Cthulhu“ zeigt den nächsten Start an.</p>
            <p>Ein Angriff beginnt immer mit einer <strong>Sammlung</strong>: Die Horde sammelt sich <strong>6 Stunden</strong> lang (12 Stunden bei einer Boss-Horde) im Orbit einer Basis des Schwarms, bevor sie losstürmt.</p>
            <p>Unterwegs fliegt sie mit <strong>Hordengeschwindigkeit</strong> (langsam, im <strong>Radar</strong> weithin sichtbar), und eine <strong>Warnung ist 1 Stunde vor ihrer Ankunft garantiert</strong>, egal wie deine Radarabdeckung ist.</p>
            <p>Es ist eine <strong>echte Flotte</strong>: Du kannst sie jederzeit zerstören, in Formation über ihrer Basis, mitten im Flug, nach der Ankunft im Orbit deines Planeten oder indem du das <strong>Tower Defense</strong> gewinnst. Sie zu zerstören bricht den Angriff ab, egal zu welchem Zeitpunkt.</p>
            <p>Bei der Ankunft findet ein <strong>Orbitalkampf</strong> statt (deine Flotten und deine Geschütztürme gegen die Horde). Die Überlebenden landen <strong>2 Stunden später</strong> zum Bodenangriff. Mehrere Horden können gleichzeitig in Formation oder im Flug sein.</p>
            <p>Einzige Ausnahme: die <strong>Infiltration</strong>. Ab einer <strong>Bedrohung von 200</strong> hat jeder Angriff 15&nbsp;% Chance, eine zu sein: Sie ist <strong>sofort und unsichtbar</strong> (keine Sammlung, keine Vorwarnung), und ihre Landung ist 30&nbsp;% stärker.</p>

            <h3>Wenn deine Verteidigungen siegen</h3>
            <table>
                <thead>
                    <tr><th></th><th>Leicht</th><th>Normal</th><th>Schwer</th></tr>
                </thead>
                <tbody>
                    <tr><td>Verluste an Legionären</td><td>15&nbsp;%</td><td>30&nbsp;%</td><td>50&nbsp;%</td></tr>
                    <tr><td>Verluste an Mechs</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                    <tr><td>Verluste an Arbeitern</td><td>—</td><td>—</td><td>50&nbsp;%</td></tr>
                </tbody>
            </table>
            <p>Du erhältst <strong>KP</strong>, eine Chance auf einen <strong>Item-Drop</strong> und 1&nbsp;% Chance, einen <strong>Nebenhelden</strong> zu rekrutieren. Die Horde vor ihrer Landung vollständig zu vernichten gibt dieselbe Chance auf Item und Helden.</p>

            <h3>Wenn die Horde am Boden siegt</h3>
            <p>Plünderung und Eroberung sind <strong>proportional zu dem, was nach dem Orbitalkampf von der Horde übrig ist</strong>: Eine zur Hälfte zerstörte Horde plündert halb so viel. Unter <strong>90&nbsp;% Überleben</strong> hat sie nicht mehr genug Truppen, um den Planeten einzunehmen, selbst im Schwierigkeitsgrad Schwer.</p>
            <table>
                <thead>
                    <tr><th></th><th>Leicht</th><th>Normal</th><th>Schwer</th></tr>
                </thead>
                <tbody>
                    <tr><td>Plünderung von Ressourcen (intakte Horde)</td><td>40&nbsp;%</td><td>70&nbsp;%</td><td>Planet erobert (bei ≥ 90&nbsp;% Überleben)</td></tr>
                    <tr><td>Verringerung der Bedrohung nach Niederlage</td><td>÷4</td><td>÷3</td><td>÷2</td></tr>
                </tbody>
            </table>
            <p>Auf <strong>Schwer</strong> fällt die Plünderung ohne genug Überlebende für die Eroberung auf die Rate von <strong>Normal</strong> (70&nbsp;%), multipliziert mit dem Überlebensverhältnis der Horde. Wird der Planet erobert und war es dein letzter, ist es das Game Over.</p>

            <h2 id="bases">Die Basen des Schwarms</h2>
            <p>Der Schwarm hält <strong>Basen</strong>, die über die Galaxie verstreut sind: die ursprünglichen Basen des Schwarms (bis zu 36 pro Galaxie, mit wachsender Stärke; ihre Namen reichen von „Cthulhu I“ für die Vorposten bis zu den gefürchteten „Cthulhu V“) und ehemalige Planeten, die durch eine Expansion oder einen Ausbruch umgewandelt wurden.</p>
            <p>Jede wird durch eine <strong>permanente Garnison</strong> von etwa dem 0,8-Fachen der größten Flotte des Servers geschützt. Eine beschädigte Garnison repariert sich nicht; eine zerstörte Garnison wird <strong>24 Stunden</strong> später durch eine neue ersetzt.</p>
            <p>Eine oder mehrere Flotten <strong>im Angriffsmodus</strong> (deine und die anderer Spieler), deren kumulierte Signatur mindestens <strong>10.000</strong> erreicht, im Orbit einer Basis zu stationieren löst eine <strong>Belagerung</strong> aus:</p>
            <ul>
                <li>die belagerte Basis schickt keine Horden mehr: Sie starten von einer weiter entfernten Basis;</li>
                <li><strong>Verteidigungswellen</strong> werden stärker (+25&nbsp;% alle 2 Stunden);</li>
                <li>nach <strong>6 Stunden</strong> schicken die anderen Basen <strong>Entsatzflotten</strong> zur Verstärkung;</li>
                <li>die Basis trägt auf der Galaxiekarte das Abzeichen <strong>„Belagerte Basis“</strong>.</li>
            </ul>
            <p>Ist die Belagerung aufgehoben, kehren die Entsatzflotten heim, und die Basis erhält wieder eine normale Garnison. Jeder Teilnehmer wird dann <strong>im Verhältnis zur zerstörten Signatur</strong> bezahlt: 0,02 Bitcoin pro Punkt, plus 1 Kriegspunkt pro 5.000 verdienter Bitcoins.</p>

            <h2 id="liberation">Eine Basis befreien</h2>
            <p>Eine Basis des Schwarms erfolgreich zu überfallen, einschließlich der Alien-Basen „Cthulhu I“ bis „V“, bringt KP und <strong>Uran</strong>, geladen in die siegreiche Flotte (plane Platz im Laderaum ein). Der Sieg hat außerdem zwei Wirkungen:</p>
            <ul>
                <li>deine <strong>persönliche Bedrohung wird durch 10 geteilt</strong>: Das ist der radikalste Weg, sie zu senken;</li>
                <li>die <strong>Bedrohung des Universums</strong> sinkt um <strong>50 Punkte</strong>, was die nächste Prophezeiung von Cthulhu hinauszögert (siehe den Artikel <em>Die Prophezeiungen von Cthulhu</em>).</li>
            </ul>
            <p>Ein so befreiter Planet ist <strong>72 Stunden lang geschützt</strong>: Der Schwarm kann ihn in dieser Frist weder neu kolonisieren noch dort ausbrechen.</p>
            <ul>
                <li>War der befreite Planet ursprünglich ein Spielerplanet (vom Schwarm erobert, nach einer verlorenen Invasion umgewandelt, aufgegeben oder aus einer Expansion oder einem Ausbruch entstanden), bleibt er kolonisierbar, und dein Befreiungsbericht nennt dir die Frist, bis zu der du einen Kolonisator dorthin schicken kannst.</li>
                <li>Die ursprünglichen Vorposten des Schwarms („Cthulhu I“ bis „V“) bleiben dagegen nach der Befreiung unbrauchbar: Der Planet bleibt frei, aber du kannst keinen Kolonisator dorthin schicken, und es wird keine Frist angekündigt.</li>
            </ul>
            <p>Umgekehrt lässt eine verlorene Invasion gegen eine Basis des Schwarms deine <strong>persönliche Bedrohung um 10 Punkte</strong> steigen.</p>

            <h2 id="expansion">Expansion und Ausbruch</h2>
            <p>Der Schwarm breitet sich von selbst aus: Erreicht die <strong>Bedrohung des Universums</strong> <strong>300 Punkte</strong>, zieht alle <strong>3 Tage</strong> (ab <strong>500</strong> jeden Tag) ein <strong>Sporenschwarm</strong> von einer bestehenden Basis zu einem unbewohnten Planeten in der Nähe von Spielern, bis zu <strong>36 Basen pro Galaxie</strong>. Er ist eine Flotte wie jede andere: <strong>im Flug abfangbar</strong>. Kommt er an, gründet er eine neue Basis mit ihrer Garnison, und Spieler in <strong>5 Sektoren Entfernung oder weniger</strong> erhalten einen Bericht.</p>
            <p><strong>Alle</strong> Basen auszulöschen eliminiert ihn nicht für immer: Nach <strong>48 Stunden Stille</strong> lässt ein <strong>Ausbruch</strong> anderswo eine Basis wieder auftauchen, mit einem Bericht an nahe Spieler. Dieser Ausbruch kann nie <strong>weniger als 8 Sektoren</strong> von einem Spielerplaneten entfernt erfolgen, noch auf einem Planeten, der noch unter seiner Befreiungsschonfrist steht: Der Schwarm entsteht im Leeren neu, nicht auf deinem Land. Ist kein ausreichend abgelegener Sektor verfügbar, wird der Ausbruch einfach auf das nächste Zeitfenster verschoben.</p>

            <h2 id="changement-difficulte">Den Schwierigkeitsgrad ändern</h2>
            <p>Du stellst deinen PvE-Schwierigkeitsgrad in deinen <strong>Einstellungen</strong> ein (Feld „PvE-Schwierigkeit“): <strong>Deaktiviert</strong>, Leicht, Normal oder Schwer.</p>
            <ul>
                <li>Auf <strong>Deaktiviert</strong> greifen dich die Cthulhu nicht mehr an, und das Tower Defense ist nicht verfügbar.</li>
                <li>Wenn du das PvE wieder aktivierst, kommt der erste Angriff 4 Tage später.</li>
                <li>Zwischen zwei Änderungen gilt eine <strong>Wartezeit von 72&nbsp;Std.</strong>: kein Hin und Her, um den großen Angriffen auszuweichen.</li>
            </ul>

            <h2 id="tower-defense">Das Tower Defense (TD)</h2>
            <p>Das <strong>Tower Defense</strong> ist ein aktives Verteidigungs-Minispiel auf der Seite <strong>Cthulhu</strong>. Es ist spielbar, sobald ein Angriff gegen dich geplant oder eine Horde schon unterwegs ist: Du kannst es starten, um sie zu vernichten, bevor sie Schaden anrichtet. Es ist interaktiv: Du platzierst deine Verteidigungen auf einem Raster und stellst dich Wellen von Cthulhu-Monstern in Echtzeit.</p>
            <p>Tipp: Um mehrere Verteidigungen hintereinander zu setzen (Einheiten, Mauern, Stacheldraht), <strong>halte gedrückt und ziehe</strong>. Die Spur rastet automatisch auf eine <strong>gerade Linie</strong> ein (horizontal oder vertikal), und alle überquerten Felder werden gefüllt, ohne Lücke, auch wenn du schnell bist.</p>
            <p>Die Partie wird in deinem <strong>PvE</strong>-Schwierigkeitsgrad gespielt (in deinen Einstellungen festgelegt). Das <strong>Tutorial</strong> ist ein Training: Es bringt nichts und kostet nichts. Sobald die erste Welle gestartet ist, zählt das Verlassen der Partie als <strong>Aufgabe</strong> (Niederlage).</p>
            <p>Ein <strong>Nebel</strong> zieht über die Arena, dichter um die Risse und wenn sich ein Boss nähert. Er liegt unter deinen Verteidigungen und den Monstern: Er verbirgt nichts. Der Button <strong>Nebel</strong> im Dock schaltet ihn ab, wenn dein Gerät Mühe hat.</p>

            <h3>Mögliche Ergebnisse</h3>
            <ul>
                <li><strong>Sieg</strong>: Die aktive Horde wird zerstört und der Angriff abgebrochen (war noch keine Horde gestartet, wird die nächste um 8 Stunden verzögert). Deine Bedrohung wird durch 2 geteilt. Du erhältst Uran, eine Item-Ziehung (zwei auf Schwer) und 2&nbsp;% Chance, einen Nebenhelden zu rekrutieren. 6 Stunden Wartezeit, bevor du wieder ein TD spielen kannst.</li>
                <li><strong>Niederlage</strong>: Deine Bedrohung sinkt im Verhältnis zu den abgewehrten Wellen (die Hälfte der Wellen = Bedrohung durch 2 geteilt), und du erhältst etwas Uran. Ist die Horde schon im Orbit deines Planeten, landet sie sofort; andernfalls startet der Schwarm sofort seinen nächsten Angriff. Keine Wartezeit vor dem erneuten Spielen.</li>
                <li><strong>TD nicht gespielt</strong>: Die Horde nimmt ihren normalen Lauf (Sammlung, Flug, Ankunft, Landung).</li>
            </ul>
            <p>Bei einem Sieg gewonnenes Uran: Zahl der Wellen × (50 + Bedrohung ÷ 2), multipliziert mit 0,4 auf Leicht und mit 3 auf Schwer. Bei einer Niederlage: abgewehrte Wellen × (20 + Bedrohung ÷ 5), mit denselben Multiplikatoren. Beispiel bei 100 Bedrohung: Sieg auf Normal (13 Wellen) = 1.300 Uran; auf Leicht (11 Wellen) = 440; auf Schwer (15 Wellen) = 4.500.</p>

            <h3>Bericht am Ende der Partie</h3>
            <p>Am Ende jedes Tower Defense (Sieg oder Niederlage) wird ein <strong>Bericht</strong> im Reiter <strong>Cthulhu</strong> deiner Berichte archiviert: überlebte Wellen, Punktzahl, geerntetes Uran, Bedrohungsverringerung, Verluste nach Einheitentyp und getötete Feinde nach Typ. Praktisch, um deine Partien zu vergleichen.</p>

            <h3>So wird gespielt</h3>
            <ul>
                <li>Die Partie wird in deinem PvE-Schwierigkeitsgrad gespielt (Leicht, Normal oder Schwer): Der Button „Spielen auf …“ erinnert dich daran. Nur das Tutorial erlaubt es, einen anderen Schwierigkeitsgrad auszuprobieren.</li>
                <li>Platziere deine Einheiten auf dem Raster. Das <strong>HQ steht in der Mitte</strong>; die Monster tauchen aus <strong>1 bis 4 Cthulhu-Rissen</strong> am Rand der Plattform auf.</li>
                <li>Die Monster durchqueren das Raster, um dein HQ zu erreichen: Greife sie unterwegs an.</li>
                <li><strong>Mauern</strong> (150 auf Leicht, 125 auf Normal, 75 auf Schwer): Die Monster umgehen sie. Jeder Riss behält immer einen Weg zum HQ (eine Mauer, die ihn versiegeln würde, wird abgelehnt). Die Türme blockieren den Weg dagegen nicht: Ein Monster, das gegen sie stößt, hält an und zerstört sie.</li>
                <li><strong>Stacheldraht</strong> (30 / 20 / 10 je nach Schwierigkeitsgrad, Forschung Stacheldraht erforderlich): blockiert nicht, verletzt und verlangsamt aber die Monster, die ihn durchqueren.</li>
                <li><strong>Gemerkte Platzierung</strong>: Deine Anordnung (Türme, Mauern, Stacheldraht) wird für jeden Server gespeichert und zu Beginn jeder Partie erneut vorgeschlagen.</li>
                <li>Die großen Wellen kommen <strong>in Gruppen</strong> (bis zu 20 Monster gleichzeitig): Eine Welle ist nach etwa 2 Minuten fertig erschienen.</li>
                <li><strong>Sofortige Niederlage</strong>: Durchbrechen alle Feinde einer Welle deine Verteidigungen und erreichen das HQ, ist die Partie sofort verloren. Ohne wirksame Verteidigungen kann man nicht gewinnen.</li>
                <li>Zwischen den Wellen reparieren die Arbeiter beschädigte Geschütztürme automatisch.</li>
                <li>Geschwindigkeit einstellbar von ×1 bis ×10, mit möglicher Pause.</li>
                <li><strong>Wellen verketten</strong>: Eine Option der oberen Leiste startet nach jeder Welle automatisch die nächste, ohne zurück zur Vorbereitung zu gehen und unter Beibehaltung deiner Geschwindigkeit, bis zum Sieg oder zur Niederlage. Deaktiviere sie während einer Welle, um am Ende dieser Welle die Vorbereitungspause zurückzubekommen. Im Tutorial nicht verfügbar.</li>
                <li>Die Zahl der Wellen hängt von deiner Bedrohung ab: Bedrohung ÷ 10 (abgerundet) + 3, mit 2 Wellen weniger auf Leicht (mindestens 2) und 2 mehr auf Schwer, <strong>höchstens 20</strong>. Beispiel: Bei 100 Bedrohung 13 Wellen auf Normal. Die Wellen werden immer intensiver.</li>
                <li><strong>Oberfläche</strong>: eine Leiste oben über die ganze Breite (Lebenspunkte des HQ, Wellenzähler, Punktzahl, Button „Starten“ und rechts die Symbole für Ton, Musik, Einheiten-Info, Raster und Wellenverkettung) und ein Panel „Einheiten“ rechts, das jede Einheit vorstellt (Symbol, Name, Bestand, Eigenschaften). Während der Partie gibt es weder ein Seitenmenü noch eine Fußzeile: Die ganze Bildschirmbreite gehört der Karte.</li>
            </ul>

            <h3>Deine Einheiten fürs TD</h3>
            <p>Deine Planetenverteidigungen werden in TD-Einheiten umgewandelt: Jede TD-Einheit steht für ein Paket realer Einheiten, und jeder Typ hat ein platzierbares Maximum, um taktische Vielfalt zu erzwingen.</p>
            <table>
                <thead>
                    <tr><th>Planeteneinheit</th><th>Reale Einheiten pro 1 TD-Einheit</th><th>Maximum auf dem Raster</th></tr>
                </thead>
                <tbody>
                    <tr><td>Legionär</td><td>20</td><td>200</td></tr>
                    <tr><td>Mech</td><td>10</td><td>20</td></tr>
                    <tr><td>Raketenwerfer</td><td>1.750</td><td>150</td></tr>
                    <tr><td>Lasergeschütz</td><td>1.500</td><td>100</td></tr>
                    <tr><td>Schweres Lasergeschütz</td><td>1.250</td><td>75</td></tr>
                    <tr><td>Gauß-Kanone</td><td>1.000</td><td>60</td></tr>
                    <tr><td>Ionenartillerie</td><td>750</td><td>50</td></tr>
                    <tr><td>Plasmawerfer</td><td>500</td><td>40</td></tr>
                </tbody>
            </table>
            <p>Beispiel: 2.000 Legionäre ergeben 100 TD-Legionäre. Zusätzlich leiht dir das TD <strong>kostenlose Verteidigungen</strong>: 8 von jedem Typ auf Leicht, 5 auf Normal, keine auf Schwer.</p>

            <h3>Die Monster, denen du dich stellst</h3>
            <ul>
                <li><strong>Tiefling</strong>: das Basismonster. Nichts Besonderes, aber sie kommen in Massen.</li>
                <li><strong>Späher</strong>: sehr schnell, aber zerbrechlich. Schnell abzufangen.</li>
                <li><strong>Shoggoth</strong>: langsam, massig, schwer gepanzert. Schwer niederzuringen.</li>
                <li><strong>Vampirstern</strong>: schießt aus der Ferne Projektile auf deine Verteidigungen.</li>
                <li><strong>Geistgeißler</strong>: kann <strong>deine Legionäre in Monster verwandeln</strong> (visueller Umwandlungseffekt), höchstens einen pro Sekunde, und keinen mehr, sobald er tödlich getroffen ist.</li>
                <li><strong>Cthulhu-Boss</strong>: riesig, er kommt nur in der letzten Welle, auf Normal, wenn deine Bedrohung 40 erreicht, auf Schwer schon ab 20, nie auf Leicht. Er beschwört Tieflinge um sich herum.</li>
            </ul>

            <h3>Nützliche Mechaniken</h3>
            <ul>
                <li>Einheiten und Monster haben <strong>unterschiedliche Größen</strong> auf dem Raster (Legionär 1×1, Mech 2×1, Geschützturm 2×2, Boss 2×2).</li>
                <li>Die <strong>Wellenleiste</strong> zeigt die Zahl der verbleibenden Feinde an.</li>
                <li>Wenn du die Seite aktualisierst, <strong>setzt sich die Partie genau dort fort, wo du sie verlassen hattest</strong>.</li>
                <li>Eine gespeicherte Partie muss <strong>fortgesetzt</strong> werden, bevor du eine neue beginnst.</li>
            </ul>

            <h3>Belohnungen und Verluste</h3>
            <ul>
                <li><strong>Sieg</strong>: Bedrohung durch 2 geteilt, Uran, Items und Horde zerstört.</li>
                <li><strong>Niederlage</strong>: Bedrohung verringert je nach abgewehrten Wellen und etwas Uran; ist die Horde schon im Orbit, landet sie sofort.</li>
                <li><strong>Die Verluste an Einheiten sind real</strong>, jenseits der kostenlosen Verteidigungen: Eine zerstörte TD-Einheit entfernt von deinem Planeten alle Einheiten, für die sie steht (1 verlorener TD-Legionär = 20 wirklich gestorbene Legionäre).</li>
            </ul>

            <h3>TD-Rangliste</h3>
            <p>Eine Rangliste pro Server hält die <strong>besten Ergebnisse</strong> im Tower Defense fest. Eine weitere Trophäenliste, die es zu erobern gilt.</p>

    events:
        title: "Sonderevents"
        category: "events"
        order: 3
        tags: "event,kalender,cthulhu-angriff,arena,allianz arena,long run,short run"
        summary: "Auf den Servern Long Run und Short Run kehren der Cthulhu-Angriff und die Allianz-Arena zu festen Terminen wieder: wann sie stattfinden, was sie ändern und wie du dich vorbereitest."
        related: "game_modes,cthulhus,alliance_arena,cthulhu_prophecies"
        body: |
            <h2 id="principe">Prinzip</h2>
            <p>Auf den Servern <strong>Long Run</strong> und <strong>Short Run</strong> kehren zwei Events zu festen Terminen wieder: der <strong>Cthulhu-Angriff</strong> und die <strong>Allianz-Arena</strong>. Ihr Kalender wird bei der Serveröffnung ein für alle Mal berechnet, ohne Zufall: Wenn du das Eröffnungsdatum deines Servers kennst, kannst du jedes davon vorhersehen.</p>
            <p>Es gibt kein saisonales Event (Feiertage, Jahreszeiten).</p>
            <p>Auf den Servern <strong>Cthulhu</strong>, <strong>Long Run</strong> und <strong>Short Run</strong> löst der Schwarm außerdem seine <strong>Prophezeiungen</strong> und Blockaden aus. Diese folgen keinem festen Kalender, sondern einer Bedrohungsanzeige: siehe den Artikel <em>Die Prophezeiungen von Cthulhu</em>.</p>

            <h2 id="liste">Die Events des Kalenders</h2>
            <table>
                <thead>
                    <tr><th>Event</th><th>Wann</th><th>Was passiert</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Cthulhu-Angriff</strong></td><td>72 Stunden, das erste Mal 7 Tage nach der Serveröffnung, dann alle 21 Tage (Tage 7, 28, 49, 70 …)</td><td>Der einzige Zeitraum, in dem die Cthulhu ihre Horden gegen deine Planeten starten.</td></tr>
                    <tr><td><strong>Allianz-Arena</strong></td><td>Alle 3 Tage ab dem Tag nach der Eröffnung: Anmeldung um 08:00, Kämpfe um 19:00 (Pariser Zeit)</td><td>Turnier zwischen Allianzen, ganz ohne reale Verluste.</td></tr>
                </tbody>
            </table>

            <h3>Cthulhu-Angriff</h3>
            <p>Auf einem Long-Run- oder Short-Run-Server starten die Cthulhu außerhalb dieser 72-Stunden-Fenster keine Horde. Während des Fensters greifen sie wie auf einem Cthulhu-Server an, im Rhythmus deines PvE-Schwierigkeitsgrads:</p>
            <ul>
                <li>sobald das Fenster sich öffnet, startet eine Horde gegen dich, wenn deine Angriffsfrist abgelaufen ist (5 Tage nach deiner Anmeldung für die allererste);</li>
                <li>die nächste Horde startet <strong>18 bis 30 Stunden</strong> später auf Leicht, <strong>12 bis 24 Stunden</strong> auf Normal, <strong>8 bis 16 Stunden</strong> auf Schwer;</li>
                <li>eine während des Fensters gestartete Horde läuft bis zum Ende durch (6 Stunden Sammlung, dann der Flug), auch wenn sie nach dem Ende des Events ankommt.</li>
            </ul>
            <p>Auf Normal rechne also mit 3 bis 6 Horden pro Fenster. In dieser Zeit erlaubt dir das <strong>Tower Defense</strong> der Seite <strong>Cthulhu</strong>, jede Horde abzuwehren. Ist dein PvE in deinen Einstellungen deaktiviert, wirst du nicht angegriffen. Die Funktionsweise der Horden ist im Artikel <em>Die Cthulhu-Bedrohung</em> beschrieben.</p>

            <h3>Allianz-Arena</h3>
            <p>Ein Arena-Tag läuft so ab (Pariser Zeit):</p>
            <ul>
                <li><strong>08:00</strong>: Ankündigung und Öffnung der Anmeldung.</li>
                <li><strong>18:45</strong>: Anmeldeschluss.</li>
                <li><strong>19:00</strong>: erste Runde, dann folgende Runden um 19:15 und 19:30; Ende der Kämpfe gegen 19:45.</li>
            </ul>
            <p>Du musst Mitglied einer Allianz sein und mindestens ein Angriffsschiff besitzen. Deine Schiffe werden für die Arena <strong>dupliziert</strong>: Du riskierst nichts von dem, was du besitzt.</p>
            <p>Jede erreichte Runde füllt die <strong>Allianzbank</strong>: 50.000 Bitcoins und 1.000 KP bei einem Ausscheiden in der ersten Runde, bis zu 1.000.000 Bitcoins und 25.000 KP für die Siegerallianz. Jeder Spieler, der mindestens einen Befehl gegeben hat, erhält außerdem einen persönlichen Bonus, von 5.000 bis 50.000 Bitcoins pro erreichter Runde. Alle Details (Anmeldung, Kampf, Punkte, Belohnungen) stehen im Artikel <em>Allianz-Arena</em>.</p>

            <h2 id="ou">Wo verfolgst du die nächsten Events?</h2>
            <p>Es gibt im Spiel keine Kalenderseite. Um zu wissen, was ansteht:</p>
            <ul>
                <li><strong>Allianz-Arena</strong>: Der Reiter <strong>Arena</strong> deiner Allianzseite zeigt die nächste Arena mit einem Countdown an.</li>
                <li><strong>Cthulhu-Angriff</strong>: Rechne ab der Serveröffnung (Tag 7, dann alle 21 Tage). Die Serverliste zeigt die verbleibende Zeit bis zum Ende jedes Servers an: Auf einem Long Run (900 Tage) wurde ein Server, dem noch 880 Tage bleiben, vor 20 Tagen eröffnet, und sein nächster Cthulhu-Angriff beginnt an Tag 28.</li>
                <li><strong>Prophezeiungen</strong>: die Anzeige „Bedrohung des Universums“ der Seite <strong>Cthulhu</strong>.</li>
            </ul>

            <h2 id="strategie">So nutzt du sie</h2>
            <ul>
                <li><strong>Vor jedem Cthulhu-Angriff</strong> verstärke Geschütztürme, Legionäre und Flotte: Das ist der einzige Zeitraum, in dem die Horden zuschlagen.</li>
                <li><strong>Während des Fensters</strong> spiele das Tower Defense: Ein Sieg zerstört die laufende Horde und teilt deine Bedrohung durch 2.</li>
                <li><strong>Melde dich zur Allianz-Arena an</strong> mit mindestens einem Angriffsschiff und gib mindestens einen Befehl während des Matches: Du riskierst dort nichts und gewinnst einen persönlichen Bonus.</li>
                <li><strong>Diskutiere im Salon</strong>: Ein Event ist eine Gelegenheit, dich mit deiner Allianz abzustimmen.</li>
            </ul>

    alliance_arena:
        title: "Allianz-Arena"
        category: "events"
        order: 9
        tags: "allianz,arena,bracket,pvp,event,turnier,sektor,planet,flotte,basis,verlauf,zuschauer"
        summary: "Wiederkehrendes Event alle 3 Tage: Deine Allianz tritt in einer Sektorschlacht (duplizierte Flotten, zu haltende Planeten) gegen die anderen an, um die gemeinsame Bank zu füllen und einen persönlichen Bonus zu erhalten."
        related: "alliance_basics,events,heroes"
        body: |
            <h2 id="quand">Wann sie startet</h2>
            <p>Das Event kehrt auf den betroffenen Servern <strong>alle 3 Tage</strong> wieder. Ablauf eines Arena-Tages (Pariser Zeit; der Reiter Arena zeigt sie in deiner Zeitzone an):</p>
            <ul>
                <li><strong>08:00</strong>: Ankündigung im Salon Universum (in allen Sprachen) und <strong>Öffnung der Anmeldung</strong>, mit einer Benachrichtigung an die Allianzmitglieder.</li>
                <li><strong>18:45</strong>: Anmeldeschluss. Die Zusammensetzung des Turnierbaums steht fest.</li>
                <li><strong>19:00</strong>: erste Runde. Die folgenden Runden starten um <strong>19:15</strong> und <strong>19:30</strong>.</li>
                <li><strong>Gegen 19:45</strong>: Ende der Kämpfe und Verteilung der Belohnungen.</li>
            </ul>
            <p>Sind um 19:00 auf dem ganzen Server weniger als <strong>2 Allianzen</strong> angemeldet, wird das Event abgesagt, und eine Nachricht im Salon Universum informiert alle.</p>

            <h2 id="inscription">Anmelden</h2>
            <p>Wenn die Anmeldung öffnet, <strong>öffnet sich automatisch ein Fenster</strong> in deiner Oberfläche (Button „Für die Arena anmelden“). Du kannst dich auch über den Reiter <strong>Arena</strong> deiner Allianzseite anmelden.</p>
            <p>Bedingungen:</p>
            <ul>
                <li>Mitglied einer Allianz sein.</li>
                <li>Zum Zeitpunkt der Anmeldung und dann zu Beginn jedes Matches (19:00, 19:15, 19:30) mindestens <strong>1 Angriffsschiff</strong> besitzen (am Boden oder in einer Flotte).</li>
                <li>Die Anmeldung ist <strong>kostenlos</strong>: Sie kostet keine Ressource, und nichts von dem, was du besitzt, wird aufs Spiel gesetzt.</li>
            </ul>
            <p>Du kannst dich bis zum Anmeldeschluss um 18:45 abmelden („Abmelden“). Hast du zu Beginn eines Matches kein Angriffsschiff mehr (zwischenzeitlich im echten Kampf verloren), wirst du für dieses Match automatisch zur Aufgabe erklärt: Deine Allianz macht ohne dich weiter.</p>
            <p><strong>KI-Kommandanten</strong>: Sobald ein menschliches Mitglied angemeldet ist, melden sich auch die KI-Kommandanten deiner Allianz an, bis sie 5 Angemeldete zählt, Menschen eingeschlossen. Die menschlichen Mitglieder können sich dagegen alle anmelden. Rein KI-gesteuerte Allianzen melden sich ebenfalls an, um den Turnierbaum aufzufüllen.</p>

            <h2 id="combat">So läuft es ab</h2>
            <p>Jedes Match wird in einem <strong>eigens erstellten Sektor</strong> gespielt, angezeigt wie die Räumliche Karte: ein Raster von 5 × 5, in dem <strong>2 bis 4 Allianzen</strong> gegeneinander antreten. Jede Allianz startet von ihrer <strong>Basis</strong> in der Mitte eines Sektorrandes.</p>
            <p>Deine Schiffe werden für die Arena <strong>dupliziert</strong>: Nichts von dem, was du besitzt, wird riskiert. Kein realer Verlust, keine Trümmer, kein gefangener Held.</p>
            <ul>
                <li>Ein Match dauert <strong>höchstens 15 Minuten</strong>.</li>
                <li>Die erste Allianz mit <strong>300 Punkten</strong> gewinnt; andernfalls die beste Punktzahl am Ende der Zeit. Bei Gleichstand: die meisten gehaltenen Planeten, dann der meiste verursachte Schaden, dann das Los. Hat niemand Punkte gemacht oder geschossen, ist das Match unentschieden und niemand kommt weiter.</li>
                <li>Nur eine Allianz pro Sektor kommt in die nächste Runde. Der Turnierbaum ist ein K.-o.-System über höchstens 3 Runden; der Sieger des letzten Matches ist Servermeister.</li>
            </ul>

            <h2 id="flotte">Deine Flotte</h2>
            <p>Du startest mit <strong>einer einzigen Flotte</strong>, bestehend aus all deinen Angriffsschiffen (denen am Boden wie denen deiner Flotten) und deinem Haupthelden.</p>
            <ul>
                <li><strong>Senden</strong>: Wähle deine Flotte, tippe auf einen Planeten und bestätige dann. Die Flugdauer wird vor dem Start angezeigt, und ein Flug lässt sich nicht abbrechen.</li>
                <li><strong>Teilen</strong>: Löse einen Teil deiner Schiffe in eine neue Flotte heraus (höchstens 4 Flotten). Eine Flotte fliegt mit der Geschwindigkeit ihres langsamsten Schiffs: Ein Jägergeschwader allein ist dreimal schneller als eine Flotte, die Schlachtschiffe mitschleppt.</li>
                <li><strong>Zusammenlegen</strong>: Zwei deiner Flotten im Orbit desselben Planeten können verschmelzen.</li>
            </ul>
            <p>Dein <strong>Hauptheld</strong> leiht seine Boni (darunter Eigenschaften wie Taktiker) deiner Startflotte. Eine herausgelöste Flotte startet ohne ihn; legst du sie mit der Flotte des Helden zusammen, bleibt er beim Ganzen. Der Held riskiert nichts: weder Verletzung noch Gefangennahme, selbst bei Aufgabe.</p>
            <p>Treffen zwei Allianzen auf demselben Planeten aufeinander, wird der Kampf <strong>5 Sekunden</strong> später aufgelöst (Zeit, damit Verstärkung eintrifft), mit den <strong>gleichen Regeln wie der Weltraumkampf</strong> des Spiels. Eine engagierte Flotte kann erst nach dem Ende des Kampfes wieder abfliegen.</p>
            <p>Eine zerstörte Flotte ist nicht verloren: Sie <strong>formiert sich an deiner Basis neu</strong>, mit voller Stärke, nach 45 Sekunden, dann 15 Sekunden mehr bei jeder weiteren Zerstörung, höchstens 2 Minuten. Jede zerstörte feindliche Flotte bringt deiner Allianz <strong>5 Punkte</strong>.</p>
            <p><strong>Die KI-Kommandanten kämpfen wirklich</strong>: Sie nehmen die freien Planeten ein, meiden von vornherein verlorene Kämpfe und kehren zur Reparatur heim. Öffnest du den Match-Bildschirm nicht und gibst eine Minute lang keinen Befehl, spielt der Autopilot auch für dich; du übernimmst wieder, sobald du zurückkommst.</p>

            <h2 id="planetes">Planeten und Punkte</h2>
            <p>Eine Allianz, die <strong>allein</strong> auf einem Planeten ist, der nicht ihr gehört, erobert ihn nach <strong>15 Sekunden</strong>; ein ankommender Feind setzt den Zähler auf null zurück. Der Planet <strong>bleibt bei deiner Allianz</strong>, wenn deine Flotten wieder abfliegen, bis eine andere ihn zurückerobert. Das ist das ganze Dilemma: sich ausbreiten, um zu punkten, oder sich gruppieren, um die Kämpfe zu gewinnen.</p>
            <p>Alle <strong>10 Sekunden</strong> bringt jeder gehaltene Planet Punkte:</p>
            <table>
                <thead>
                    <tr><th>Planet</th><th>Punkte</th><th>Zusätzlich</th></tr>
                </thead>
                <tbody>
                    <tr><td><strong>Welt</strong> (4 pro Sektor)</td><td>1</td><td>—</td></tr>
                    <tr><td><strong>Werft</strong></td><td>1</td><td>Repariert deine Flotten im Orbit: 10&nbsp;% der Stärke pro Zeitraum.</td></tr>
                    <tr><td><strong>Nexus</strong> (in der Mitte)</td><td>3</td><td>—</td></tr>
                </tbody>
            </table>
            <p>Jeder von einem Planeten erzielte Punkt zahlt am Ende des Matches außerdem <strong>KP in die Bank deiner Allianz</strong> ein: 3 KP pro Punkt in Runde 1, 8 in Runde 2, 15 in Runde 3, egal ob du das Match gewinnst oder nicht. Die Punkte zerstörter Flotten und geplünderter Basen bringen keine KP.</p>

            <h2 id="bases">Die Basen</h2>
            <p>Deine Basis ist dein Start- und Neuaufstellungspunkt; deine Flotten werden dort repariert (5&nbsp;% pro Zeitraum). Sie lässt sich nicht erobern, aber sie lässt sich <strong>plündern</strong>.</p>
            <p>Eine Basis wird von den <strong>zusammengelegten Planetenverteidigungen aller Planeten der am Match beteiligten Spieler der Allianz</strong> verteidigt: Sie ist schwer einzunehmen. Ein abgewehrter Angriff beschädigt sie trotzdem, und sie repariert sich um 10&nbsp;% pro Zeitraum.</p>
            <p>Fällt ihre Verteidigung, wird die Basis geplündert: <strong>50 Punkte</strong> für den Angreifer, seine Flotten kehren automatisch heim, und die Basis ist 2 Minuten lang unantastbar.</p>

            <h2 id="recompenses">Belohnungen</h2>
            <p>Zwei Arten von Belohnungen, die sich addieren.</p>
            <h3 id="banque">Allianzbank</h3>
            <table>
                <thead>
                    <tr><th>Erreichte Runde</th><th>Bitcoins</th><th>KP</th></tr>
                </thead>
                <tbody>
                    <tr><td>Verlierer Runde 1</td><td>50.000</td><td>1.000</td></tr>
                    <tr><td>Verlierer Runde 2</td><td>150.000</td><td>3.000</td></tr>
                    <tr><td>Verlierer Runde 3</td><td>350.000</td><td>8.000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>1.000.000</strong></td><td><strong>25.000</strong></td></tr>
                </tbody>
            </table>
            <p>Die Bank erhält nur eine dieser Belohnungen, die der erreichten Runde, plus die KP der während der Matches gehaltenen Planeten.</p>
            <h3 id="perso">Individueller Bonus</h3>
            <p>Direkt in deine persönliche Geldbörse ausgezahlt, unter der Bedingung, dass du während eines der Matches des Abends <strong>mindestens einen Befehl selbst gegeben</strong> hast: Hat der Autopilot alles an deiner Stelle gespielt, gibt es keinen Bonus.</p>
            <table>
                <thead>
                    <tr><th>Erreichte Runde</th><th>Persönliche Bitcoins</th></tr>
                </thead>
                <tbody>
                    <tr><td>Verlierer Runde 1</td><td>5.000</td></tr>
                    <tr><td>Verlierer Runde 2</td><td>15.000</td></tr>
                    <tr><td>Verlierer Runde 3</td><td>30.000</td></tr>
                    <tr><td><strong>Champion</strong></td><td><strong>50.000</strong></td></tr>
                </tbody>
            </table>
            <p>Du erhältst <strong>nur einen</strong> Bonus pro Arena, den der höchsten von deiner Allianz erreichten Runde: <strong>50.000 Bitcoins</strong> für einen Champion.</p>

            <h2 id="rapports">Kampfberichte</h2>
            <p>Am Ende jedes Matches erhält jeder Spieler einen <strong>Bericht</strong> auf seiner Berichte-Seite: Ergebnis, Punktzahl deiner Allianz und jedes Gegners, gehaltene Planeten, geplünderte Basen, dein verursachter und erlittener Schaden, die von deinen Flotten zerstörten feindlichen Flotten und die, die du verloren hast, deine verbleibende Stärke, dein Rang beim Schaden unter den Piloten deiner Allianz (mit dem Titel <strong>„MVP des Matches“</strong> für den Ersten) und die in die Bank eingezahlten KP.</p>
            <p>Am Ende des Turniers kommt eine <strong>persönliche Zusammenfassung</strong> hinzu: Weg deiner Allianz im Turnierbaum, Bilanz der Matches, dein Gesamtbeitrag und die Aufschlüsselung deiner Gewinne (persönlicher Bonus, Allianzbank, gehaltene Planeten).</p>

            <h2 id="suivi">Das Event im Reiter Arena verfolgen</h2>
            <p>Der Reiter <strong>Arena</strong> deiner Allianzseite zeigt dauerhaft den tatsächlichen Stand des Events an: keine Arena läuft, nächste Arena steht an (mit einem Countdown bis zur Ankündigung), angekündigt, Anmeldung offen oder geschlossen, Arena läuft oder beendet. Ein Countdown zeigt die verbleibende Zeit bis zum nächsten Schritt an (Anmeldeschluss, Beginn der Kämpfe, nächste Runde), und ein Kasten zeigt, wie viele Mitglieder deiner Allianz schon angemeldet sind, von der Gesamtzahl.</p>
            <p>Ist die Arena beendet, behält der Reiter auch die <strong>Bilanz</strong> deiner Allianz (Zahl der gespielten Arenen, Meistertitel, beste erreichte Runde, Siege/Niederlagen) und den Verlauf der letzten zehn auf deinem Server gespielten Ausgaben, mit dem Ergebnis deiner Allianz und den bei jeder erhaltenen Belohnungen.</p>

            <h2 id="spectateur">Zuschauermodus</h2>
            <p>Du bist nicht für die laufende Arena angemeldet? Du kannst die Matches <strong>deiner Allianz</strong> trotzdem live im Reiter Arena verfolgen: Der Sektor wird genau wie für einen Piloten angezeigt, aber du kannst keinen Befehl geben.</p>

            <h2 id="astuces">Tipps</h2>
            <ul>
                <li><strong>Nimm den Nexus früh</strong>: Er bringt so viel wie drei Welten. Aber das weiß jeder.</li>
                <li><strong>Löse deine Jäger heraus</strong>: Ein schnelles Geschwader erobert die Welten, während deine schwere Flotte die Mitte hält.</li>
                <li><strong>Komm gruppiert an</strong>: Flotten, die innerhalb derselben 5 Sekunden ankommen, kämpfen zusammen; eine isolierte Flotte wird zerstört und schenkt 5 Punkte.</li>
                <li><strong>Halte eine Werft</strong>: Dort vorbeizukommen repariert deine Flotten doppelt so schnell wie an der Basis.</li>
                <li><strong>Campe nicht</strong>: Ein eroberter Planet bleibt dein, wenn du weiterziehst. Geh und nimm einen anderen.</li>
                <li><strong>Eine Basis nimmt man zu mehreren</strong>: Eine intakte Basis allein anzugreifen verschenkt Punkte. Mit mehreren Verbündeten im selben 5-Sekunden-Fenster sind es 50 Punkte auf einmal.</li>
                <li><strong>Gib mindestens einen Befehl</strong>: Ohne eigenen Befehl gibt es keinen individuellen Bonus.</li>
            </ul>

            <h2 id="mobile">Auf dem Handy</h2>
            <p>Die Arena wird auf dem Handy per Fingertipp gespielt:</p>
            <ul>
                <li><strong>Querformat</strong> wird beim Betreten des Matches in der mobilen App erzwungen. In einem mobilen Browser, in dem das Spiel den Bildschirm nicht erzwingen kann, bittet dich eine Meldung, das Gerät zu drehen.</li>
                <li><strong>Der ganze Sektor passt auf den Bildschirm</strong>: kein Zoom und keine Kamera zu steuern.</li>
                <li><strong>Drei Fingertipps für einen Befehl</strong>: deine Flotte (in der unteren Leiste oder durch Antippen ihres Planeten), der Zielplanet, dann der Button „Senden“.</li>
                <li><strong>Der Rahmen und das Tag</strong> jedes Planeten zeigen, wem er gehört; die Zahlen in seinen Ecken geben die Kräfte im Orbit an, deine in Grün, die des Feindes in Rot.</li>
                <li><strong>Button ⓘ</strong>: die Details des gewählten Planeten und das Kampfprotokoll.</li>
                <li><strong>Benachrichtigung</strong>: ein Alarm bei Öffnung der Anmeldung (08:00), mit Anmeldeschluss und Uhrzeit der Kämpfe.</li>
            </ul>

    ia_bots:
        title: "KI-Kommandeure (Bots)"
        category: "events"
        order: 4
        tags: "ki,bot,kuenstliche intelligenz,npc,autopilot"
        summary: "Manche Server enthalten KI-gesteuerte Kommandanten. Wie sie sich verhalten und warum."
        related: "game_modes,cthulhus"
        body: |
            <h2 id="principe">Warum KI?</h2>
            <p>Auf manchen Servern sind einige Kommandanten keine menschlichen Spieler, sondern <strong>künstliche Intelligenzen</strong>. Sie ermöglichen:</p>
            <ul>
                <li>den <strong>Server zu bevölkern</strong>, wenn es wenige aktive Spieler gibt;</li>
                <li>Spielern, die Kämpfe suchen, <strong>interessante Ziele</strong> zu bieten;</li>
                <li>eine lebendige Diplomatie mit glaubwürdigen Vorschlägen, Verrat und Allianzen zu simulieren.</li>
            </ul>
            <p>Es gibt keine von den Regeln festgelegte Höchstzahl: Das Spielteam wählt, wie viele KI-Kommandanten es auf jedem Server platziert, und die Spielerkonten, die auf Autopilot gesetzt wurden (siehe weiter unten), kommen hinzu. Diese Zahl wird nirgends angezeigt.</p>

            <h2 id="comportement">Wie sie sich verhalten</h2>
            <p>Jeder Bot hat:</p>
            <ul>
                <li>eine <strong>Persönlichkeit</strong> (gesprächig, diplomatisch, aggressiv, Troll, Veteran, schweigsam …);</li>
                <li>eine <strong>Stimmung</strong>, die sich je nach Ereignissen entwickelt (zufrieden, misstrauisch, frustriert, gereizt …);</li>
                <li>einen <strong>strategischen Archetyp</strong> unter fünf: Wirtschaftler, ausgewogen, Eroberer, Expansionist oder defensiv.</li>
            </ul>
            <p>Sie spielen wirklich: Sie bauen, forschen, greifen an, bilden Allianzen, verraten manchmal. Sie können deine Verbündeten sein wie deine schlimmsten Feinde.</p>
            <p>Sie wachsen <strong>jeden Tag im Rhythmus der aktiven Spieler</strong> des Servers (etwas schneller als der Median), ohne je <strong>90&nbsp;% des besten Spielers</strong> zu überschreiten. Was sie im Kampf verlieren, ist endgültig verloren: Zerstört ein Spieler ihre Garnison, bauen sie sie auf diesem Planeten <strong>7 Tage</strong> lang nicht wieder auf und verstärken stattdessen ihre Geschütztürme.</p>
            <p><strong>Wo ihre Flotte schläft.</strong> Die eroberischen und expansionistischen KI halten eine Garnison im Orbit ihrer Planeten. Die anderen (Wirtschaftler, ausgewogene und defensive), vorsichtiger, halten ihre Schiffe <strong>am Boden</strong>, wie viele Spieler, und holen sie nur zur Verteidigung heraus&nbsp;: Entdeckt ihr Radar eine anfliegende feindliche Flotte, die sie besiegen können, bringen sie ihre Flotte in den Orbit und lassen die Schiffe ihrer Nachbarplaneten kommen, die rechtzeitig eintreffen&nbsp;; gegenüber einer zu starken Flotte schicken sie ihre auf einem anderen ihrer Planeten zur Landung. Sie schließen sich auch einem schon begonnenen Kampf über ihrem Planeten an oder greifen eine im Orbit geparkte bewaffnete Flotte an, wenn sie gewinnen können. Wie ein Spieler reagiert eine schlafende KI nicht, und eine durch einen Störsender verborgene Flotte überrascht sie. Sie lassen ihre Schiffe nie am Boden eines Planeten ohne Geschütztürme, den eine Invasion mitsamt den Schiffen nehmen würde&nbsp;: Sie landen auf ihrem am besten verteidigten Planeten, der auch ihre erste Zuflucht ist.</p>
            <p><strong>Ihr Handel.</strong> Sie verkaufen ihre Überschüsse und die Ladung ihrer Recycler an den nächsten Händler, außer wenn er unter Blockade steht oder von einer feindlichen Flotte im Angriffsmodus bewacht wird, die ihren Konvoi bei der Ankunft zerstören würde&nbsp;: Dann gehen sie zum nächsten.</p>

            <h2 id="reconnaitre">Kann man sie erkennen?</h2>
            <p>Nicht sicher. Die KI-Kommandanten erscheinen in der Rangliste und auf der Karte wie Spieler, und nichts in der Oberfläche kennzeichnet sie. Das Spiel ist so gestaltet, dass du nicht mit Sicherheit wissen kannst, ob ein Kommandant eine KI ist.</p>

            <h2 id="strategie">Mit ihnen spielen</h2>
            <ul>
                <li>Unterschätze einen Bot nicht: Manche sind echte militärische Schrecken.</li>
                <li>Ein Bot kann dich durchaus in eine Allianz einladen, kooperieren und dich dann angreifen, wenn sich die Lage ändert.</li>
                <li>Für die Immersion behandle sie wie Spieler: Das macht den Server lebendiger.</li>
            </ul>

            <h2 id="pilote-automatique">Abwesende Spieler: der Autopilot</h2>
            <p>Loggt sich ein <strong>angemeldeter</strong> Spieler <strong>8 Tage</strong> lang nicht mehr ein, wird sein Konto auf <strong>Autopilot</strong> gesetzt (er erhält nach 7 Tagen Abwesenheit eine Erinnerungs-E-Mail; Testkonten sind nicht betroffen): ein <strong>stummer</strong> Bot, der nie in die Salons oder per private Nachricht schreibt. Dieser Autopilot <strong>spielt nicht an deiner Stelle</strong>: Das Konto startet keinen Angriff, bewegt oder engagiert deine Flotten nicht und kolonisiert nicht. Er setzt lediglich deine Bauten und Forschungen fort und verstärkt langsam deine Geschütztürme. Die anderen KI-Kommandanten greifen ihn nicht an; die anderen Spieler können es weiterhin. Du kannst ihm weiterhin eine private Nachricht schreiben: Er liest sie bei seiner Rückkehr. Sobald sich der Spieler wieder einloggt, übernimmt er sofort wieder die Kontrolle über sein Konto und findet seine Flotten dort wieder, wo er sie gelassen hatte.</p>

    cthulhu_prophecies:
        title: "Die Prophezeiungen von Cthulhu"
        category: "events"
        order: 5
        tags: "cthulhu,prophezeiung,blockade,bedrohung,ereignis,allianz,kriegspunkte,bitcoin,haendler,recycling,rangliste"
        summary: "Erreicht die Bedrohung des Servers ihren Schwellenwert, kündigt Besessene eine Prophezeiung an: 48 Stunden später blockieren ihre Horden den Handel des ganzen Servers. Wie du die Anzeige liest, eine Blockade zu mehreren brichst und was das Scheitern kostet."
        related: "cthulhus,war_points,alliance_treasury"
        body: |
            <h2 id="principe">Was ist eine Prophezeiung?</h2>
            <p>Auf den Servern <strong>Cthulhu</strong>, <strong>Long Run</strong> und <strong>Short Run</strong> steigt ein serverspezifischer <strong>Bedrohungspool</strong>, die „Bedrohung des Universums“, Tag für Tag automatisch an. Er ist getrennt von deiner persönlichen Bedrohung gegenüber den Cthulhu.</p>
            <p>Erreicht er seinen Schwellenwert, veröffentlicht <strong>Besessene</strong> im öffentlichen Salon eine <strong>Prophezeiung</strong>: Eine <strong>Blockade</strong> wird <strong>48 Stunden</strong> später über den ganzen Server hereinbrechen.</p>

            <h2 id="jauge">Die Bedrohungsanzeige des Servers lesen</h2>
            <ul>
                <li>Sie ist auf der Seite <strong>Cthulhu</strong> (der des Tower Defense) im Block <strong>„Bedrohung des Universums“</strong> sichtbar: eine Leiste von 0 bis <strong>700</strong>, dem Schwellenwert, der eine Prophezeiung auslöst. Sie schreitet unabhängig von deinen persönlichen Kämpfen voran.</li>
                <li>Sie steigt um <strong>100 Punkte pro Tag</strong>, beim Datumswechsel (Mitternacht, Pariser Zeit). Von null aus erreicht sie den Schwellenwert in <strong>7 Tagen</strong>. Um die verbleibende Zeit zu schätzen: (700 − aktueller Stand) ÷ 100 Tage. Beispiel: Bei 400 trifft die Prophezeiung in 3 Tagen ein.</li>
                <li>Jede befreite Basis des Schwarms lässt sie um <strong>50 Punkte</strong> zurückgehen, also einen halben Tag Aufschub.</li>
                <li>Das erste Event eines Servers kann nicht vor seinen <strong>ersten zwei Wochen</strong> Bestehen eintreten.</li>
                <li>Nie zwei Prophezeiungen (noch zwei Blockaden) gleichzeitig auf demselben Server. Während des Events kann die Anzeige weiter ihren Fortschritt zeigen, aber sie wird am Ende auf null zurückgesetzt: Der nächste Zyklus beginnt bei 0. Rechne mit etwa 11 Tagen zwischen zwei Prophezeiungen (7 Tage Anstieg, 48 Stunden Wartezeit, höchstens 48 Stunden Blockade).</li>
            </ul>

            <h2 id="prophetie">Die Ankündigung</h2>
            <p>Beim Überschreiten des Schwellenwerts postet Besessene seine Prophezeiung im öffentlichen Salon: Die Blockade fällt <strong>48 Stunden später</strong> an, und die Seite Cthulhu zeigt den Countdown an. Die Nachricht in der Stimme von Besessene erwähnt, was auf dem Spiel steht: die Blockade des Handels, der Tribut auf die Bitcoins, die verschlungenen Wracks.</p>
            <p>Besessene postet danach mit Sicherheit drei weitere Nachrichten im öffentlichen Salon:</p>
            <ul>
                <li>zu <strong>Beginn der Blockade</strong>: die Zahl der Horden, das zu zerstörende Ziel und die verbleibende Zeit, mit dem Hinweis, dass die Allianzen eingestuft werden;</li>
                <li><strong>6 Stunden vor Fristablauf</strong>: eine Erinnerung an die verbleibende Zeit und die Zahl der Horden, die auf das Ziel schon gefallen sind;</li>
                <li>zum <strong>Ausgang</strong>: Blockade gebrochen oder Blockade gehalten, mit dem Namen der belohnten oder bestraften Allianzen.</li>
            </ul>
            <p>Der Discord des Spiels kündigt die Prophezeiung ebenfalls an (mit dem Datum der Blockade, in UTC-Zeit), den Beginn der Blockade und ihren Ausgang.</p>
            <p>Außerhalb dieser Ankündigungen kommentiert Besessene gelegentlich das Leben auf dem Server im öffentlichen Salon, aber diese Nachrichten sind nicht garantiert: Um die Bedrohung zu verfolgen, verlass dich auf die Anzeige.</p>

            <h2 id="blocus">Die Blockade</h2>
            <p>Bei Fristablauf postiert sich eine <strong>Cthulhu-Horde</strong> (auf der Seite Cthulhu „Mauerflotte“ genannt) im Orbit <strong>jedes Händlers</strong> und <strong>jedes Asteroiden</strong> des Servers:</p>
            <ul>
                <li><strong>Verkauf unmöglich</strong> bei jedem blockierten Händler.</li>
                <li><strong>Recycling unmöglich</strong> an jedem blockierten Asteroiden.</li>
                <li>Anderswo im Universum bleiben die <strong>Trümmerfelder normal recycelbar</strong>, wie nach jedem anderen Kampf.</li>
                <li>An einem blockierten Ziel dagegen <strong>häufen sich die Wracks deiner eigenen Angriffe vor Ort an und bleiben außer Reichweite, solange die Horde, die es bewacht, lebt</strong>. Zerstöre sie, und <strong>dieses Ziel öffnet sich sofort wieder</strong>, ohne auf das Schicksal der Blockade im Rest des Servers zu warten: Verkauf oder Recycling setzen dort wieder ein, und deine bereits im Orbit befindlichen Recycler nehmen von selbst wieder die Arbeit auf.</li>
                <li>Nichts mit dem Embargo oder der Hungersnot zu tun, die eine feindliche Flotte einem Spielerplaneten auferlegt: Hier stehen nur Handel und Recycling still.</li>
                <li>Die Blockade dauert höchstens <strong>48 Stunden</strong>, weniger, wenn sie vorher gebrochen wird.</li>
            </ul>

            <h2 id="briser">Eine Blockade zu mehreren brechen</h2>
            <p>Nicht alle Horden sind gleich:</p>
            <ul>
                <li>Die, die die <strong>Händler</strong> bewachen, sind das <strong>1,8-Fache</strong> der größten Flotte des Servers wert (Spieler oder KI-Kommandant). Niemand bricht sie allein: Man muss sich zu zweit oder zu dritt darum kümmern.</li>
                <li>Die der <strong>Asteroiden</strong> sind nur <strong>die Hälfte</strong> dieser größten Flotte wert: Eine große einzelne Flotte kann sie besiegen. Da die Asteroiden viel zahlreicher sind als die Händler, machen sie den Großteil des Zählers aus.</li>
            </ul>
            <p>In jedem Fall bekommt eine <strong>Koalition</strong>, die dieselbe Horde in aufeinanderfolgenden Angriffen trifft, sie am Ende klein. Der Schaden, den eine Horde erlitten hat, <strong>regeneriert sich zwischen zwei Kämpfen nie</strong>: Jeder Angriff, auch ein verlorener, schwächt sie für den nächsten. Konzentriere deine Schläge auf dasselbe Ziel, statt mehrere Horden gleichzeitig anzukratzen.</p>

            <h2 id="recompenses">Belohnungen</h2>
            <p>Jeder einer Horde zugefügte Schadenspunkt wird am Ende des Events <strong>in Bitcoin und Kriegspunkten bezahlt</strong>, ob die Blockade gebrochen wird oder nicht: Kein Angriff ist umsonst. Du erhältst 1 Kriegspunkt pro 5.000 verdienter Bitcoins.</p>
            <p>Die Blockade gilt als <strong>gebrochen</strong>, sobald <strong>70&nbsp;% der Horden des Servers vor Fristablauf zerstört wurden</strong> (aufgerundet), Händler und Asteroiden zusammen. Beispiel: Von 160 Horden müssen 112 zerstört werden.</p>
            <p>Die Blockade endet dann <strong>sofort</strong>: Die verbleibenden Horden verschwinden, alle Händler und Asteroiden öffnen sich wieder, und der Belohnungssatz wird für alle Beitragenden <strong>verdoppelt</strong>.</p>
            <p>Ein individueller Bericht schlüsselt am Ende des Events deinen verursachten Schaden und deine Belohnung auf. Während der Blockade zeigt die <strong>Seite Cthulhu</strong> den Fortschritt live an: zerstörte Horden, zu erreichendes Ziel und verbleibende Zeit.</p>

            <h2 id="echec">Der Preis des Scheiterns</h2>
            <p>Läuft die Blockade <strong>ab, ohne gebrochen zu sein</strong>:</p>
            <ul>
                <li><strong>Jeder Spieler verliert die Hälfte seiner Bitcoins</strong>: Die Besessenen erheben ihren Tribut, auch bei Spielern, die das PvE deaktiviert haben. Nur Spieler unter <strong>Anfängerschutz</strong> und Spieler im Game Over werden verschont.</li>
                <li><strong>Alle Trümmerfelder von Schlachten des Universums werden von den Cthulhu verschlungen</strong>; die <strong>Asteroiden</strong> bleiben dagegen unversehrt.</li>
                <li>Der <strong>Bitcoin-Tresor jeder Allianz</strong> mit mindestens einem menschlichen Spieler verliert ebenfalls die Hälfte seines Inhalts: Seine Bitcoins vor Fristablauf in den Tresor einzuzahlen schützt vor nichts. Der Abzug erscheint im Verlauf des Tresors.</li>
                <li>Die <strong>3 letzten Allianzen der Rangliste</strong> verlieren zusätzlich 72 Stunden lang Produktion (siehe unten).</li>
            </ul>
            <p>Der Tribut wird vor der Auszahlung der Belohnungen erhoben: Was du im Kampf gegen die Horden gewinnst, wird nicht gekürzt. Jeder betroffene Spieler erhält einen Bericht, der die verlorenen Bitcoins aufschlüsselt.</p>

            <h2 id="classement">Die Rangliste der Allianzen</h2>
            <p>Während der Blockade wird jede Allianz danach eingestuft, was sie gegen den Schwarm tut. Die <strong>Seite Cthulhu</strong> zeigt die Rangliste live an, mit dem, was deine Allianz gewinnen oder verlieren würde, wenn die Blockade jetzt enden würde.</p>
            <ul>
                <li><strong>Punkte</strong>: Der einer <strong>Mauerflotte</strong> der Blockade zugefügte Schaden zählt doppelt; der dem Schwarm anderswo zugefügte Schaden (Belagerungen von Basen, Horden) zählt einfach; jeder <strong>Sieg im Tower Defense</strong> ist so viel wert wie die Zerstörung einer Viertel-Asteroiden-Mauerflotte.</li>
                <li><strong>Punkte pro Mitglied</strong>: Die Punktzahl wird durch die Zahl der aktiven Mitglieder geteilt (in den letzten 7 Tagen eingeloggt, ohne Anfängerschutz). Der Schaden eines Anfängers zählt trotzdem: Rekrutieren senkt die Punktzahl nie.</li>
                <li><strong>Zugehörigkeit eingefroren</strong> bei Beginn der Blockade: Während des Events die Allianz zu wechseln verschiebt weder die Punkte noch den Bonus noch den Malus.</li>
                <li>Es braucht mindestens <strong>2 aktive Mitglieder</strong>, um eingestuft zu werden. <strong>Spieler ohne Allianz</strong> sind nie betroffen.</li>
            </ul>
            <p><strong>Blockade gebrochen</strong>: Die ersten 3 Allianzen erhalten 72 Stunden lang <strong>+15&nbsp;%, +10&nbsp;% und +5&nbsp;% Produktion</strong>, sofern sie Punkte gemacht haben. Keine Allianz wird bestraft.</p>
            <p><strong>Blockade erlitten</strong>: Die letzten 3 Allianzen verlieren 72 Stunden lang <strong>15&nbsp;%, 10&nbsp;% und 5&nbsp;% Produktion</strong>, zusätzlich zum Tribut. Nie wird mehr als die Hälfte der eingestuften Allianzen getroffen. Eine Allianz, die den Mindesteinsatz erbracht hat, wird verschont, selbst als Letzte: das Äquivalent einer halben zerstörten Asteroiden-Mauerflotte oder von zwei Siegen im Tower Defense pro aktivem Mitglied.</p>
            <p>Jedes Mitglied erhält einen Bericht, der den Bonus oder Malus seiner Allianz und sein Ende erklärt.</p>

            <h2 id="conseils">In der Praxis</h2>
            <ul>
                <li>Beobachte die Anzeige <strong>„Bedrohung des Universums“</strong> der Seite Cthulhu: Bei 100 Punkten pro Tag sagt sie dir, wie viele Tage bis zum Schwellenwert von 700 bleiben.</li>
                <li>Sobald eine <strong>Prophezeiung</strong> angekündigt wird, warne deine Allianz: Du hast <strong>48 Stunden</strong>, um dich zu organisieren, bevor die Blockade fällt.</li>
                <li>Konzentriere die Angriffe auf dieselben Horden, statt sie zu verstreuen: Der Schaden bleibt bestehen, besser eine erledigen, als mehrere anzukratzen.</li>
                <li>Auch ein verlorener Angriff bringt etwas: Warte nicht, bis du sicher bist zu gewinnen, um anzugreifen.</li>
                <li>Nicht genug Flotte, um eine Horde anzugreifen? Ein <strong>Sieg im Tower Defense</strong> während der Blockade bringt deiner Allianz ebenfalls Punkte.</li>
            </ul>

    notifications:
        title: "Push-Benachrichtigungen"
        category: "beginner"
        order: 10
        tags: "benachrichtigung,push,alarm,mobil,android,browser,einstellung,glocke"
        summary: "Erhalte eine Warnung in der Android-App oder in deinem Browser, sobald in deinem Imperium ein wichtiges Ereignis eintritt."
        related: "interface_guide,reports,tips"
        body: |
            <h2 id="principe">Wozu dient das?</h2>
            <p>Area Universe wird fortlaufend gespielt: Feindliche Flotten können eintreffen, während du bei der Arbeit bist. Die <strong>Push-Benachrichtigungen</strong> alarmieren dich in Echtzeit auf deinem Handy oder in deinem Browser, damit du rechtzeitig reagieren kannst.</p>

            <h2 id="evenements">Was du erhalten kannst</h2>
            <p>Auf der Seite Benachrichtigungen sind die Typen in fünf Gruppen angeordnet:</p>
            <ul>
                <li><strong>Produktion &amp; Forschung</strong> — Forschung abgeschlossen; Gebäude fertiggestellt (deine Bauschlange ist leer); Produktion abgeschlossen (deine Schiffs- oder Verteidigungsschlange ist leer).</li>
                <li><strong>Flotten</strong> — Flotte am Ziel angekommen; Flotte im Kampf (eine deiner Flotten ist in einen Kampf verwickelt); Feindliche Flotte nähert sich (eine feindliche Flotte wurde gerade zu einem deiner Planeten gestartet).</li>
                <li><strong>Planeten</strong> — Planet wird angegriffen (eine Flotte kommt, um zu plündern oder einzumarschieren); Planet unter Embargo; Nuklearangriff erhalten; Cthulhu-Angriff; Spionage entdeckt.</li>
                <li><strong>Allianz</strong> — Allianz im Krieg; Allianz-Nachricht.</li>
                <li><strong>Persönlich</strong> — Neue private Nachricht; Held gefangen; Held befreit.</li>
            </ul>
            <p>Jeder Typ lässt sich <strong>einzeln</strong> aktivieren oder abschalten. Zwei Warnungen haben keinen eigenen Schalter: <strong>Planet erobert</strong> wird immer gesendet, und die Erinnerung <strong>Login-Bonus verfügbar</strong> (höchstens einmal pro Tag) lässt sich nur mit <em>Alle deaktivieren</em> abschalten.</p>
            <p>„Feindliche Flotte nähert sich“ ignoriert die Flotten deiner Allianz sowie die einer Allianz, mit der du ein Verteidigungsbündnis, einen Nichtangriffspakt oder einen Friedensvertrag hast.</p>

            <h2 id="activation">So aktivierst du sie</h2>
            <ol>
                <li>Öffne die Seite <strong>Benachrichtigungen</strong>: Glockensymbol unten im Menü am Computer; Schaltfläche <strong>Menü</strong>, dann <strong>Benachrichtigungen</strong> am Handy.</li>
                <li>Klicke im Browser auf <strong>Benachrichtigungen aktivieren</strong> (Kasten „Browser-Benachrichtigungen“); in der Android-App auf <strong>Benachrichtigungen aktivieren</strong> im Bereich „Benachrichtigungen für dieses Gerät“.</li>
                <li>Akzeptiere die Berechtigungsanfrage des Browsers oder des Handys.</li>
                <li>Weiter unten kannst du die Typen abwählen, die du nicht erhalten möchtest: Zu Beginn sind alle aktiviert.</li>
            </ol>
            <p>Eine Schaltfläche <em>Alle deaktivieren</em> schaltet alles mit einem Klick ab. Deine Auswahl pro Typ gilt für den Server, auf dem du spielst, auf allen deinen Geräten.</p>
            <p>Im Browser spielt die Option <strong>Benachrichtigungston</strong> zusätzlich einen Ton ab, wenn etwas Neues eintrifft, während der Tab im Hintergrund ist. Ein Banner kann dir auch vorschlagen, die Benachrichtigungen zu aktivieren: <strong>Aktivieren</strong> oder <strong>Nein danke</strong>.</p>

            <h2 id="compatibilite">Wo es funktioniert</h2>
            <ul>
                <li><strong>Android-App</strong> (Google Play): Sie ist die einzige App; für iPhone und iPad gibt es keine.</li>
                <li><strong>Browser am Computer</strong>: Chrome, Firefox, Edge, Safari.</li>
                <li><strong>iPhone und iPad</strong>: Das Spiel wird im Browser gespielt.</li>
                <li><strong>Mehrere Geräte</strong>: Jedes Gerät, auf dem du die Benachrichtigungen aktiviert hast, erhält sie; hast du sie auf deinem Handy und auf deinem Computer aktiviert, klingeln beide.</li>
            </ul>

            <h2 id="fehlerbehebung">Der Browser verweigert die Anmeldung?</h2>
            <p>Blockiert dein Browser den Benachrichtigungsdienst, zeigt die Seite Benachrichtigungen selbst die Vorgehensweise und eine Schaltfläche <strong>Erneut versuchen</strong> an.</p>
            <p>Bei <strong>Brave</strong> ist der Push-Dienst von Google standardmäßig deaktiviert. Öffne <code>brave://settings/privacy</code>, aktiviere <strong>„Google-Dienste für Push-Nachrichten verwenden“</strong> und starte den Browser dann vollständig neu. Prüfe bei anderen Browsern, dass kein VPN, kein Virenscanner und kein filternder DNS den Benachrichtigungsdienst blockiert.</p>

            <h2 id="mobil">In der mobilen App</h2>
            <p>In der Android-App enthält die Seite <strong>Benachrichtigungen</strong> einen Bereich „Benachrichtigungen für dieses Gerät“: Aktiviere oder deaktiviere jederzeit die Push-Benachrichtigungen des Handys. Sind sie blockiert, führt dich die Schaltfläche <strong>Einstellungen öffnen</strong> direkt zu den Einstellungen des Handys. Deine Auswahl pro Benachrichtigungstyp gilt für alle deine Geräte, auf dem Server, auf dem du spielst.</p>

            <h2 id="discord">Auf Discord</h2>
            <p>Ist dein Discord-Konto verknüpft (<strong>Meine Optionen</strong>), erreicht dich die Warnung <strong>Feindliche Flotte im Anflug</strong> auch als Discord-Direktnachricht, mit Ankunftszeit und Link zum Planeten. Höchstens eine Nachricht pro Planet alle 30 Minuten: Ein Angriff mit mehreren Flotten überflutet dich nicht. Du musst Mitglied des <a href="https://discord.gg/bpwWyS8" target="_blank" rel="noopener">Area-Universe-Discords</a> sein und Direktnachrichten von dessen Mitgliedern erlauben. Die Option ist standardmäßig aktiv und lässt sich im Bereich <strong>Discord</strong> der Benachrichtigungseinstellungen abschalten.</p>

    glossary:
        title: "Glossar"
        category: "beginner"
        order: 11
        tags: "glossar,begriffe,definitionen,vokabular,abkuerzungen"
        summary: "Alle Begriffe und Abkürzungen des Spiels, in einem Satz erklärt."
        related: "getting_started,interface_guide"
        body: |
            <h2 id="az">Alle Begriffe des Spiels</h2>
            <table>
                <tr><th>Begriff</th><th>Definition</th></tr>
                <tr><td><strong>Allianz</strong></td><td>Gruppe von Spielern. Mitglied zu sein erhöht die Produktion von Niobium, Wasser und Rationen deiner Planeten um 20&nbsp;%.</td></tr>
                <tr><td><strong>Barge</strong></td><td>Landungsschiff für Legionäre bei Raids und Invasionen.</td></tr>
                <tr><td><strong>Bitcoin</strong></td><td>Hauptwährung des Spiels. Wird von deinen Arbeitern erzeugt.</td></tr>
                <tr><td><strong>Block</strong></td><td>Automatische Zusammenfassung verbündeter Flotten während eines Weltraumkampfes.</td></tr>
                <tr><td><strong>CDR</strong></td><td>Champ De Ressources (Ressourcenfeld): die nach einem Kampf zurückgelassenen Trümmer, recycelbar.</td></tr>
                <tr><td><strong>Raumwerft</strong></td><td>Gebäude, mit dem man Schiffe fertigen kann.</td></tr>
                <tr><td><strong>Cthulhu</strong></td><td>Die feindlichen Kreaturen (ehemals „Zombies“). Treten im PvE-Modus und auf den Alien-Planeten auf.</td></tr>
                <tr><td><strong>Zyklus</strong></td><td>Interner Produktionsrhythmus. 10 Min. für einen Planeten, 1 Min. für einen Mond.</td></tr>
                <tr><td><strong>DEFCON</strong></td><td>Alarmstufe der Allianz, von 0 (kein Alarm) bis 5 (höchste Alarmstufe): Je höher die Zahl, desto angespannter die Lage.</td></tr>
                <tr><td><strong>Embargo</strong></td><td>Belagerung eines Planeten durch eine feindliche Flotte im Orbit. Löst eine Hungersnot aus.</td></tr>
                <tr><td><strong>Unterhalt</strong></td><td>Tägliche Kosten in Bitcoins für deine Truppen, Schiffe und Gebäude.</td></tr>
                <tr><td><strong>Verteidigungsfestung</strong> (Bunker)</td><td>Verteidigungsgebäude: erhöht die Legionärskapazität, ermöglicht den Bau von Mechs und schützt vor Plünderungen, pro Stufe, 5&nbsp;% deiner Lagerkapazität für Niobium und Wasser (und 5&nbsp;% deines Uraniums).</td></tr>
                <tr><td><strong>Game Over</strong></td><td>Spielende: wirtschaftlicher Bankrott oder Verlust aller deiner Planeten.</td></tr>
                <tr><td><strong>Wirtschaftliches Game Over</strong></td><td>Dein Bitcoin-Guthaben ist nach dem Tagesbericht negativ geworden.</td></tr>
                <tr><td><strong>Held</strong></td><td>Deine Hauptfigur (du kannst auch Sekundärhelden haben). Sie entwickelt sich weiter, kämpft und kann gefangen genommen werden.</td></tr>
                <tr><td><strong>Lunar</strong> (manchmal Moon Maker genannt)</td><td>Schiff, das auf einem leeren Platz einen Mond erschafft, der mindestens 2 Millionen Niobium und 2 Millionen Wasser an Trümmern enthält.</td></tr>
                <tr><td><strong>Händler</strong></td><td>NPC auf der Karte, der deine Ressourcen gegen Bitcoins (und einige Kriegspunkte) kauft.</td></tr>
                <tr><td><strong>Stufe</strong></td><td>Von 2 bis 40, sie steigt mit deiner Erfahrung, die mit deiner Punktzahl wächst; sie sinkt nie wieder. Sie legt die Untergrenze des Login-Bonus fest.</td></tr>
                <tr><td><strong>Ziele</strong></td><td>Die 3 täglichen Quests, mit jedem Tagesbericht erneuert und in KP bezahlt; wer alle erfüllt, erhält zusätzlich ihre durchschnittliche Belohnung. Seite gleichen Namens im Menü.</td></tr>
                <tr><td><strong>KP</strong></td><td>Kriegspunkte. Vor allem im Kampf verdient (und durch die täglichen Ziele, die Arena, das Gefängnis, den Verkauf an Händler). Sie werden auf der Seite Ziele ausgegeben (Bitcoins, Legionäre, Arbeiter), für Elite-Schiffe, die Schwimmende Stadt, die Orbitalstation und die Forschung Territorialerweiterung.</td></tr>
                <tr><td><strong>Autopilot</strong></td><td>Stiller Modus, der ein registriertes Konto übernimmt, das seit 8 Tagen abwesend ist: Er führt Bauten und Forschungen fort, bewegt keine Flotte und gibt dir die Kontrolle zurück, sobald du wieder da bist.</td></tr>
                <tr><td><strong>Aktiver Planet</strong></td><td>Der aktuell ausgewählte Planet. Alle deine Aktionen gelten für ihn.</td></tr>
                <tr><td><strong>NPC</strong></td><td>Nicht-Spieler-Charakter: Händler, Aliens, Cthulhu, KI-Bots.</td></tr>
                <tr><td><strong>Raid</strong></td><td>Bodenangriff, um die Ressourcen eines Planeten zu plündern (nicht, um ihn zu erobern).</td></tr>
                <tr><td><strong>Tagesbericht</strong></td><td>Tägliche Bilanz, berechnet um 18:59 Uhr (Pariser Zeit): Einnahmen, Kosten, Guthaben, Aktualisierung der Punkte und der Rangliste, neue Ziele des Tages.</td></tr>
                <tr><td><strong>Recycler</strong></td><td>Schiff, das Trümmer (CDR) einsammelt: Das Recycling startet von selbst, wenn eine Flotte mit Recyclern auf einem Trümmerfeld eintrifft.</td></tr>
                <tr><td><strong>Runde</strong></td><td>Kampfrunde. Höchstens 100 im Weltraumkampf, höchstens 10 im Bodenkampf.</td></tr>
                <tr><td><strong>Signatur</strong> (thermisch)</td><td>Größenordnung der Masse einer Flotte, ohne ihre Zusammensetzung zu verraten. Je größer sie ist, desto mehr Treibstoff (in Bitcoins bezahlt) kostet ein Flug; sie dient auch zur Berechnung deiner Punkte und der im Kampf verdienten Kriegspunkte.</td></tr>
                <tr><td><strong>Sonde</strong></td><td>Kleines Spionageschiff. Vor jedem Angriff zu senden.</td></tr>
                <tr><td><strong>Terraformation</strong></td><td>Forschung, die die maximale Zahl der Planeten festlegt, die du besitzen kannst: ihre Stufe + 2 (plus die Regime-Boni deiner Allianz), bis Stufe 18. Stufe 1 schaltet den Kolonisator frei, Stufe 15 den Lunar. Um einen Planeten zu vergrößern, baue eine Schwimmende Stadt oder eine Orbitalstation (Forschung Territorialerweiterung).</td></tr>
                <tr><td><strong>Tower Defense</strong></td><td>Minispiel der aktiven Verteidigung gegen die Cthulhu-Horden.</td></tr>
                <tr><td><strong>Arbeiter</strong></td><td>Bevölkerungseinheit. Erzeugt jeden Tag Bitcoins. Verteidigt bei einer Invasion.</td></tr>
                <tr><td><strong>Tutorial</strong></td><td>Geführter und belohnter Pfad (bis zu 18 Schritte in 5 Kapiteln, je nach gewähltem Pfad). Wird von der Seite Einstellungen, Bereich Tutorial, gestartet oder fortgesetzt.</td></tr>
                <tr><td><strong>Mutterschiff</strong></td><td>Flaggschiff, unter anderem in KP bezahlt: Es bringt seiner Flotte 20.000 Hülle und 5.000 Schild, +5&nbsp;% Hülle und Schild, +10&nbsp;% Präzision und −10&nbsp;% Signatur. So langsam wie ein Schlachtschiff, bremst es eine Flotte aus Jägern oder Korvetten.</td></tr>
                <tr><td><strong>VIP</strong></td><td>Spieler, der im Modus Search &amp; Destroy als vorrangiges Ziel bestimmt wird.</td></tr>
            </table>

    account_deletion:
        title: "Konto und Daten löschen"
        category: "beginner"
        order: 99
        tags: "loeschung,konto,daten,dsgvo,datenschutz,loeschen"
        summary: "Wie du dein Konto und deine persönlichen Daten endgültig löschst und was das Spiel aufbewahrt."
        related: "game_over,faq"
        body: |
            <h2 id="ou-demander">Wo du den Antrag stellst</h2>
            <p>Öffne im Spiel die <strong>Einstellungen</strong>: ganz unten bietet die <strong>Gefahrenzone</strong> den Button <strong>Mein Konto löschen</strong>.</p>
            <p>Du kannst auch die öffentliche Seite <strong>/suppression-donnees</strong> nutzen (Link „Konto- und Datenlöschung“ in den Regeln). Sie fasst zusammen, was gelöscht und was aufbewahrt wird; danach musst du dich einloggen, um den Antrag zu stellen.</p>
            <p>Zur Bestätigung gib genau das Wort <strong>LÖSCHEN</strong> ein und tippe dann auf <strong>Mein Konto endgültig löschen</strong>. Die Löschung erfolgt <strong>sofort</strong> und gilt für dein Konto auf <strong>allen Servern</strong>.</p>

            <h2 id="irreversible">Eine endgültige Kontoaufgabe</h2>
            <p><strong>Achtung: Das ist eine endgültige Kontoaufgabe.</strong> Deine persönlichen Daten werden sofort gelöscht oder anonymisiert:</p>
            <ul>
                <li>E-Mail-Adresse, Passwort und Spielername;</li>
                <li>Google-, Discord- oder LinkedIn-Kennungen, Google-Play-Spiele-Verknüpfung und Wallet-Adresse;</li>
                <li>IP-Adresse, technischer Fingerabdruck und Zeitzone;</li>
                <li>Sitzungen, Login-Token und Benachrichtigungs-Token;</li>
                <li>private Nachrichten, gesendete und empfangene;</li>
                <li>Abonnements für Newsletter und Benachrichtigungen.</li>
            </ul>
            <p>Deine Erfolge werden gelöscht. Du kannst dich mit diesem Konto nie wieder einloggen, und keine Funktion des Spiels erlaubt es, es wiederherzustellen: Um wieder zu spielen, musst du ein neues Konto erstellen und bei null anfangen.</p>
            <p>Kein laufender Kauf wird erstattet.</p>

            <h2 id="conserve">Was aufbewahrt wird und warum</h2>
            <p>Um das Gleichgewicht des Spiels zu wahren, existieren deine Kommandanten, Planeten und Flotten weiter, einem stummen Bot anvertraut. Deine Kommandanten, deine Helden und deine Planeten werden in „Bot-“ gefolgt von einer Nummer umbenannt, ohne jeden Bezug zu deiner Identität; dieser Name ersetzt auch deinen in den Ranglisten und in den Archiven beendeter Server.</p>
            <p>Die in den Salons geschriebenen öffentlichen Nachrichten bleiben erhalten und erscheinen künftig unter diesem Namen „Bot-…“.</p>
            <p>Der Zahlungsverlauf wird aufbewahrt (gesetzliche Buchführungspflicht), ebenfalls von deiner Identität getrennt.</p>

    achievements:
        title: "Erfolge"
        category: "progression"
        order: 11
        tags: "erfolge,achievements,trophaeen,google play,play spiele,fortschritt"
        summary: "15 Kontoerfolge, von den ersten Schritten bis zu Karriere-Meilensteinen, in deinem Profil und in Google Play Spiele."
        related: "leveling,ranking,game_over"
        body: |
            <h2 id="principe">Das Prinzip</h2>
            <p>Die <strong>Erfolge</strong> belohnen, was du mit deinem Konto erreichst, <strong>über alle Server hinweg</strong>. Einmal freigeschaltet, bleibt ein Erfolg für immer freigeschaltet, selbst wenn du danach den Planeten verlierst oder die Allianz verlässt, die ihn dir eingebracht hat.</p>
            <p>Du findest sie in deinem <strong>serverübergreifenden Profil</strong> (Menü „Mein serverübergreifendes Profil“), mit deinem Fortschritt und dem Datum jeder Freischaltung. Das Profil eines anderen Spielers zeigt seine. Die, die dein Verlauf schon verdient hat, sind automatisch freigeschaltet.</p>
            <h2 id="liste">Die 15 Erfolge</h2>
            <table>
            <tr><th>Erfolg</th><th>Bedingung</th><th>Punkte</th></tr>
            <tr><td>Kommandant</td><td>Das Tutorial abschließen, indem du ihm folgst (es mit „Ich entdecke selbst“ zu überspringen zählt nicht)</td><td>20</td></tr>
            <tr><td>Baumeister</td><td>Einen ersten Bau abschließen</td><td>20</td></tr>
            <tr><td>Gelehrter</td><td>Eine erste Forschung abschließen</td><td>20</td></tr>
            <tr><td>Kolonist</td><td>2 Planeten besitzen</td><td>20</td></tr>
            <tr><td>Verbündeter</td><td>Einer Allianz beitreten oder eine gründen</td><td>20</td></tr>
            <tr><td>Veteran I, II, III</td><td>10, 100 und dann 1.000 Raumschlachten bestreiten</td><td>25, 50, 100</td></tr>
            <tr><td>Eroberer I, II</td><td>10 und dann 100 Invasionen erfolgreich durchführen</td><td>50, 100</td></tr>
            <tr><td>Kerkermeister</td><td>Einen feindlichen Helden gefangen nehmen</td><td>50</td></tr>
            <tr><td>Cthulhu-Jäger</td><td>Eine Tower-Defense-Partie gewinnen</td><td>50</td></tr>
            <tr><td>Elite</td><td>Einen Server unter den Top 10 beenden</td><td>100</td></tr>
            <tr><td>Imperator</td><td>Einen Server gewinnen</td><td>200</td></tr>
            <tr><td>Ein geheimer Erfolg</td><td>Beim Spielen zu entdecken</td><td>50</td></tr>
            </table>
            <p>„Gelehrter“ kann auf Servern nicht erworben werden, auf denen alle Forschungen von Anfang an freigeschaltet sind. Ein Mond zählt für „Kolonist“ als Planet.</p>

            <h2 id="progression">Der Fortschritt</h2>
            <p>Die Erfolge für Schlachten und Invasionen steigen in Stufen, und dein Profil zeigt den Zähler an (zum Beispiel 37 / 100). Alle bestrittenen Raumschlachten zählen, gewonnen oder verloren, einschließlich der Zerstörung einer unbewaffneten Flotte (Cargos, Recycler, Sonden), für beide Seiten; Invasionen zählen, wenn sie gelingen (Raids zählen nicht). Elite und Imperator werden am Ende eines Servers entschieden.</p>
            <h2 id="google-play">Google Play Spiele (Android)</h2>
            <p>In der Android-App erscheinen deine Erfolge auch in <strong>Google Play Spiele</strong>, mit dem Banner „Erfolg freigeschaltet“.</p>
            <ul>
            <li><strong>Testkonto</strong>, in der App erstellt: Es wird automatisch mit deinem Google-Play-Spiele-Profil verknüpft. Es wird dann nicht mehr nach 7 Tagen ohne Spielen gelöscht und öffnet sich nach einer Neuinstallation oder auf einem neuen Telefon von selbst wieder.</li>
            <li><strong>Registriertes Konto</strong>: Öffne in der Android-App dein serverübergreifendes Profil (Menü „Mein serverübergreifendes Profil“) und tippe auf „Konto verknüpfen“ auf der Karte „Google Play Spiele“. Es öffnet sich danach ohne Passwort mit diesem Google-Play-Spiele-Profil: Tu das nur auf deinem eigenen Gerät. Du kannst die Verknüpfung jederzeit über dieselbe Karte aufheben, auf der Website wie in der App.</li>
            <li>Der Button <strong>„Play Spiele“</strong> auf dem Anmeldebildschirm öffnet das verknüpfte Konto wieder. Dich abzumelden schaltet das automatische Öffnen auf diesem Gerät ab: Dann öffnet dieser Button das Konto wieder.</li>
            </ul>
            <p>Ein Google-Play-Spiele-Profil lässt sich nur mit einem einzigen Area-Konto verknüpfen und ein Konto nur mit einem einzigen Profil. Wenn du dein Konto über dein Profil verknüpfst, wird das Google-Play-Spiele-Profil dem anderen Konto weggenommen, mit dem es verknüpft war, falls es eines gab.</p>
    faq:
        title: "Häufige Fragen: Konto, Geräte und Hilfe"
        category: "beginner"
        order: 13
        tags: "faq,konto,mehrere server,multi-konto,offline,android,iphone,konsole,sprache,spanisch,spielername,kontakt,support,bug,kauf,erstattung,loeschung,berichte"
        summary: "Mehrere Server, Offline-Spiel, Geräte, Sprachen, Spielername, Kontakt, Bugs, Käufe: die Antworten auf die praktischen Fragen."
        related: "getting_started,interface_guide,account_deletion,moderation_blocking,notifications,reports"
        body: |
            <h2 id="plusieurs-serveurs">Auf mehreren Servern spielen</h2>
            <p>Ja. Dein Konto folgt dir auf allen Servern. Auf jedem Server, dem du beitrittst, hast du einen <strong>eigenen Kommandanten</strong>, mit eigenem Spielernamen, eigenen Planeten, Helden, Bitcoins, eigener Allianz und eigenem Rang: Nichts wechselt von einem Server zum anderen.</p>
            <p>Du kannst auf mehreren Servern gleichzeitig spielen und über den Menüeintrag <strong>Server</strong> zwischen ihnen wechseln: Die Server, auf denen du schon spielst, öffnen sich direkt.</p>
            <p>Allen deinen Servern gemeinsam sind: dein <strong>serverübergreifendes Profil</strong> (Menü „Mein serverübergreifendes Profil“), das deine Laufbahn und deine Erfolge zusammenführt, deine Sprache und deine Liste blockierter Spieler.</p>
            <p>Mehrere Konten auf demselben Server: Die Regeln (Abschnitt „Mehrere Konten“) erlauben sie unter der Bedingung, dass du sie per E-Mail an <strong>support@areauniverse.com</strong> meldest. Diese Konten dürfen weder direkt noch über einen Dritten miteinander interagieren. Deine Login-Daten mit jemand anderem zu teilen ist verboten.</p>

            <h2 id="hors-ligne">Offline spielen</h2>
            <p>Nein: Area Universe wird online gespielt und braucht eine Internetverbindung, in der App wie im Browser. Bricht die Verbindung ab, zeigt das Spiel „Verbindung wird wiederhergestellt…“ an und macht weiter, sobald sie zurück ist.</p>
            <p>Dagegen läuft die Partie ohne dich weiter: Deine Planeten produzieren bis zu ihrer Lagerobergrenze, deine Bauten, Forschungen und Flotten schreiten voran … und deine Gegner können dich angreifen. Aktiviere die <a href="/wiki/notifications">Push-Benachrichtigungen</a>, um gewarnt zu werden.</p>
            <ul>
                <li>Nach <strong>8 Tagen</strong> ohne Login wechselt dein Kommandant auf <a href="/wiki/ia_bots">Autopilot</a>.</li>
                <li>Ein <strong>Testkonto</strong> (erstellt mit „Testen Sie ohne E-Mail“) wird nach <strong>7 Tagen</strong> ohne Spielen gelöscht, außer es ist in der Android-App mit Google Play Spiele verknüpft. Um es zu behalten, bestätige es über den Menüeintrag <strong>Konto bestätigen</strong>.</li>
            </ul>

            <h2 id="plateformes">Auf welchen Geräten spielen?</h2>
            <ul>
                <li><strong>Computer</strong>: in einem aktuellen Browser (Chrome, Firefox, Edge, Safari).</li>
                <li><strong>Android</strong>: in der Area-Universe-App von Google Play. Ein Android-Browser wird zu Google Play weitergeleitet, wenn er ins Spiel will. Die App wird im Querformat gespielt.</li>
                <li><strong>iPhone und iPad</strong>: Es gibt keine App; spiele im Browser.</li>
                <li><strong>Konsolen</strong> (PlayStation, Xbox, Switch …): Es gibt keine Konsolenversion.</li>
            </ul>
            <p>Dein Konto ist überall dasselbe: Logge dich mit denselben Zugangsdaten ein, um deine Partie auf einem anderen Gerät wiederzufinden.</p>

            <h2 id="langues">Verfügbare Sprachen</h2>
            <p>Das Spiel gibt es in <strong>sechs Sprachen</strong>: Französisch, Englisch, Deutsch, Spanisch, Portugiesisch und Russisch. Dieses Wiki ebenfalls.</p>
            <p>Um die Sprache zu wechseln: Tippe am Computer auf die Flagge unten im Menü; öffne am Telefon den Button <strong>Menü</strong> und wähle dann eine Flagge in der Zeile <strong>Sprache</strong>. Deine Wahl wird in deinem Konto gespeichert: Auch deine Push-Benachrichtigungen kommen in dieser Sprache.</p>

            <h2 id="pseudo">Den Spielernamen ändern</h2>
            <p>Dein Spielername ist der deines Kommandanten: Er ist <strong>für jeden Server eigen</strong>. Um ihn zu ändern, öffne die <strong>Einstellungen</strong>, Abschnitt <strong>Identität</strong>, Feld <strong>Pseudonym</strong> (3 bis 15 Zeichen; der erste Buchstabe wird großgeschrieben), dann <strong>Speichern</strong>. Die Änderung erfolgt sofort und ist jederzeit möglich, sofern dieser Name auf dem Server nicht schon vergeben ist. Du musst deinen Helden erstellt haben, um speichern zu können.</p>
            <p>Deine Login-Kennung dagegen ist deine E-Mail-Adresse. Sie wird unter <strong>Optionen</strong> geändert (Seite „Meine Optionen“, E-Mail ändern): Ein Bestätigungslink geht an die neue Adresse, und die alte bleibt aktiv, solange du nicht darauf geklickt hast. Das Passwort wird an derselben Stelle geändert.</p>

            <h2 id="contact">Das Team kontaktieren</h2>
            <ul>
                <li><strong>Per E-Mail</strong>: <strong>support@areauniverse.com</strong>, bei Fragen zu Konto, Zahlung oder persönlichen Daten.</li>
                <li><strong>Auf Discord</strong>: der Community-Server von Area Universe (discord.gg/bpwWyS8), dessen Link unten auf den Seiten der Website steht, neben Facebook, Telegram und LinkedIn. Verknüpfst du dein Discord-Konto in <strong>Meine Optionen</strong>, erhältst du dort die Rolle deiner Allianzen und die Warnung „Feindliche Flotte nähert sich“ als Privatnachricht.</li>
                <li><strong>Bei einem Bug</strong>: Nutze am besten den Button <strong>Fehler</strong> im Spiel (siehe unten); dein Bericht geht direkt ans Team, mit der Seite, auf der du warst.</li>
            </ul>

            <h2 id="bug">Einen Bug melden</h2>
            <p>Tippe auf den Button <strong>Fehler</strong> (Käfer-Symbol): unten im Menü am Computer; am Telefon Button <strong>Menü</strong>, dann <strong>Fehler</strong>. Im Fenster <strong>Fehler melden</strong>:</p>
            <ol>
                <li>beschreibe, was passiert ist und was du getan hast (höchstens 2.000 Zeichen);</li>
                <li>hänge wenn möglich ein Bild an (JPEG, PNG oder WebP, höchstens 5&nbsp;MB); in der App erledigt das der Button <strong>Bildschirm aufnehmen</strong> für dich;</li>
                <li>tippe auf <strong>Senden</strong>.</li>
            </ol>
            <p>Die Seite, auf der du warst, und der Gerätetyp werden automatisch angehängt. Du kannst bis zu 10 Berichte pro Tag senden. Für einen Spieler, der betrügt oder beleidigt, nutze besser die <a href="/wiki/moderation_blocking">Meldung</a>.</p>

            <h2 id="achats">Käufe und Erstattungen</h2>
            <p>Das Spiel ist kostenlos. Der einzige derzeit angebotene Kauf ist der Zugang zu einem <strong>Paid Server</strong> (kompetitiver kostenpflichtiger Server): <strong>5&nbsp;€</strong>, einmalig pro Server per Bankkarte vor dem Betreten gezahlt; ein bestätigtes Konto ist nötig. Die <strong>Bitcoins</strong> des Spiels kauft man nicht mit echtem Geld: Man verdient sie ausschließlich durch Spielen. Push-Benachrichtigungen sind kostenlos.</p>
            <p>Bei einem Zahlungsproblem (Zahlung abgebucht, aber Zugang nicht freigeschaltet, Erstattungsantrag) schreibe an <strong>support@areauniverse.com</strong> und gib die E-Mail-Adresse deines Kontos, den betroffenen Server und das Zahlungsdatum an. Die Nutzungsbedingungen sehen vor, dass nach Nutzung des kostenpflichtigen Dienstes keine Erstattung gewährt wird, außer bei Widerrufsrecht oder einem vom Support geprüften Ausnahmefall. Dein Konto zu löschen erstattet keinen laufenden Kauf.</p>

            <h2 id="compte-supprime">Ein gelöschtes Konto wiederherstellen</h2>
            <p>Keine Funktion des Spiels erlaubt es, ein gelöschtes Konto wiederherzustellen: Die <a href="/wiki/account_deletion">Kontolöschung</a> ist endgültig, und deine persönlichen Daten werden auf der Stelle gelöscht. Um wieder zu spielen, erstelle ein neues Konto. Glaubst du, dass ein Fehler vorlag, schreibe an <strong>support@areauniverse.com</strong>.</p>
            <p>Ein Testkonto, das gelöscht wurde, weil 7 Tage lang nicht gespielt wurde, lässt sich ebenfalls nicht wiederherstellen.</p>
            <p>Du hast nur dein Passwort vergessen? Tippe auf dem Login-Bildschirm auf das Schlüssel-Symbol (<strong>Passwort vergessen</strong>) und gib deine E-Mail-Adresse ein: Ein Link zum Zurücksetzen wird dir gesendet.</p>

            <h2 id="rapports">Berichte löschen oder archivieren</h2>
            <p>Öffne auf der Seite <strong>Bericht</strong> einen Bericht und tippe dann auf <strong>Löschen</strong>: Er verschwindet sofort, ohne Bestätigung und ohne Papierkorb. Die Löschung erfolgt einzeln pro Bericht; es gibt weder Archivierung noch Sammellöschung. Um die ungelesenen aufzuräumen, bearbeitet <strong>Alles als gelesen markieren</strong> alle deine Berichte auf einmal. Die Berichte löschen sich im Lauf der Zeit nicht von selbst.</p>
            <p>Die privaten Nachrichten der Seite <strong>Nachrichten</strong> können dagegen nicht gelöscht werden.</p>

