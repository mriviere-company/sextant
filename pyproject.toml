[project]
name = "sextant"
version = "0.1.0"
description = "Multilingual, evaluated RAG over the Area Universe game wiki."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "beautifulsoup4>=4.13",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "openai>=1.50",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "snowballstemmer>=3.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
sextant-ingest = "sextant.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sextant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "PL", "D"]
ignore = [
    "D100", "D104", "D105", "D107", # module/package/magic/__init__ docstrings
    "D203", "D213",                 # incompatible with D211 / D212
    "PLR2004",                      # magic values are fine in tests and thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sextant"]

[[tool.mypy.overrides]]
module = ["snowballstemmer", "fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
